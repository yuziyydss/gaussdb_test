    values:
    - value: 'on'
      sql_literal: '''on'''
      description: 等待备机刷盘
    - value: 'off'
      sql_literal: '''off'''
      description: 异步提交
    - value: local
      sql_literal: '''local'''
      description: 本地刷盘
    - value: remote_write
      sql_literal: '''remote_write'''
      description: 备机写入文件系统
    - value: remote_receive
      sql_literal: '''remote_receive'''
      description: 备机接收
    - value: remote_apply
      sql_literal: '''remote_apply'''
      description: 备机回放
  default_value: '''on'''
  context_type: USERSET
  set_scopes:
  - session
  - pdb
