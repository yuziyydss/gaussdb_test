    allow_empty: true
  default_value: ''''''
  context_type: USERSET
  set_scopes:
  - session
  - pdb
  dynamic: true
  restart_required: false
  execution_policy: session_overlay
  safe_probe_values:
  - ''''''
  - '''display_leading_zero'''
