  kind: guc_parameter
  id: guc_synchronous_commit
  name: synchronous_commit
  category: wal
  description: 事务提交 WAL 同步策略；可能被 CM 接管，非默认值有数据风险，先人工复核。
  value_type: enum
  value_domain:
