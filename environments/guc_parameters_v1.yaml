schema_version: 1
kind: guc_environment
id: guc_environment_v1
name: GaussDB GUC Environment V1
description: 20 个试点 GUC 的环境能力、值域、来源哈希与安全执行策略。
parameters:
- schema_version: 1
  kind: guc_parameter
  id: guc_sql_compatibility
  name: sql_compatibility
  category: compatibility
  description: 数据库 SQL 兼容模式；只能在 CREATE DATABASE 时确定，运行期只读。
  value_type: enum
  value_domain:
    type: fixed
    values:
    - value: A
      sql_literal: '''A'''
      description: Oracle/A 兼容
    - value: B
      sql_literal: '''B'''
      description: MySQL/B 兼容
    - value: C
      sql_literal: '''C'''
      description: TD/C 兼容
    - value: PG
      sql_literal: '''PG'''
      description: PostgreSQL/PG 兼容
    - value: M
      sql_literal: '''M'''
      description: M-Compatibility
  default_value: '''A'''
  context_type: INTERNAL
  set_scopes: []
  dynamic: false
  restart_required: false
  execution_policy: read_only
  safe_probe_values: []
  restore_policy: not_applicable
  source:
    document: GaussDB 集中式版参考 / 7 数据库运行参数说明
    version: V2.0-10.0.0
    source_relpath: docs/compat_facts/compatibility_params.txt
    source_sha256: ef43f2af2df0962659fe2ce357ea62fcb21cadfd83427fadb5ca8aa585cf9e9b
    anchor: L795 sql_compatibility
  fact_refs:
  - guc_sql_compatibility_values
- schema_version: 1
  kind: guc_parameter
  id: guc_behavior_compat_options
  name: behavior_compat_options
  category: compatibility
  description: A/C/PG 模式通用兼容行为配置项，可按逗号组合。
  value_type: string
  value_domain:
    type: option_set
    options:
    - display_leading_zero
    - end_month_calculate
