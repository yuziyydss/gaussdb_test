  fixture_ref: no_fixture
  sql: SELECT 1::int1, 1::int2, 1::int4, 1::int8, 2147483647::integer, 9223372036854775807::bigint;
  expected_kind: value
  compatibility_mode: any
  notes: Representative integer aliases and boundaries.
- id: core_expr_candidate_numeric_precision_rounding
