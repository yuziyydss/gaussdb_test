schema_version: 1
kind: core_expression_candidate_chain_environment
id: core_expression_candidate_chain_v1
name: Core Expression Candidate Chain V1
description: Wave 1A/1B事实到静态表达式候选的受控链路；只生成审查计划，不执行SQL。
coverage_mode: representative
runtime_executed: false
fact_sources:
- id: wave_1a
  path: docs/compat_facts/core_type_expression_domain_v1.yaml
- id: wave_1b
  path: docs/compat_facts/core_function_operator_domain_v1.yaml
- id: wave_2a
  path: docs/compat_facts/core_function_operator_wave2a_v1.yaml
fixtures:
- id: no_fixture
  description: 无对象fixture；候选SQL只使用字面量或内联VALUES。
  setup_sql: []
  teardown_sql: []
- id: core_expr_fixture
  description: 一行多类型临时fixture，用于类型、数组、range、JSON和ROWNUM表达式的静态候选。
  setup_sql:
  - CREATE TEMP TABLE core_expr_fixture (id integer, num numeric(10,4), txt varchar(64), ts timestamp, tags text[], rng int4range, payload jsonb);
  - INSERT INTO core_expr_fixture VALUES (1, 42.4382, 'GaussDB', TIMESTAMP '2026-09-28 10:00:00', ARRAY['a','b'], int4range(1,10), '{"k":"v","n":1}');
  teardown_sql:
  - DROP TABLE core_expr_fixture;
  - DROP TABLE core_expr_fixture;
- id: rownum_fixture
  description: 10行临时fixture，用于ROWNUM赋值与分页边界候选。
  setup_sql:
  - CREATE TEMP TABLE core_expr_rownum_fixture AS SELECT generate_series(1,10) AS id;
  teardown_sql:
  - DROP TABLE core_expr_rownum_fixture;
candidate_specs:
- id: core_expr_candidate_integer_value_domain
