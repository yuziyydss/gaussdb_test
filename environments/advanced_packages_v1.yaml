test_cases:
- schema_version: 1
  kind: advanced_package_test_case
  id: adv_case_dbe_output_direct_print
  package_ref: dbe_output
  interface_refs:
  - adv_dbe_output_print
  - adv_dbe_output_print_line
  status: runtime_candidate
  sql: "BEGIN\n  DBE_OUTPUT.PRINT('hello, ');\n  DBE_OUTPUT.PRINT_LINE('database!');\nEND;"
  oracle:
    kind: output
    expected: 输出 hello, database! 并以换行结束。
    status: needs_verification
  cleanup_required: false
- schema_version: 1
  kind: advanced_package_test_case
  id: adv_case_dbe_output_buffer_lifecycle
  package_ref: dbe_output
  interface_refs:
  - adv_dbe_output_enable
  - adv_dbe_output_put
  - adv_dbe_output_new_line
  status: runtime_candidate
  sql: "BEGIN\n  DBE_OUTPUT.ENABLE(20000);\n  DBE_OUTPUT.PUT('buffered');\n  DBE_OUTPUT.NEW_LINE();\nEND;"
  oracle:
    kind: output
    expected: 缓冲区在块结束时输出一行 buffered。
    status: needs_verification
  cleanup_required: false
- schema_version: 1
  kind: advanced_package_test_case
  id: adv_case_dbe_raw_varchar_roundtrip
  package_ref: dbe_raw
  interface_refs:
  - adv_dbe_raw_cast_from_varchar2_to_raw
  - adv_dbe_raw_cast_to_varchar2
  status: runtime_candidate
  sql: SELECT DBE_RAW.CAST_TO_VARCHAR2(DBE_RAW.CAST_FROM_VARCHAR2_TO_RAW('ABC')) AS value;
  oracle:
    kind: value
    expected: VARCHAR2→RAW→VARCHAR2往返后返回ABC。
    status: needs_verification
  cleanup_required: false
- schema_version: 1
  kind: advanced_package_test_case
  id: adv_case_dbe_raw_integer_roundtrip
  package_ref: dbe_raw
  interface_refs:
  - adv_dbe_raw_cast_from_binary_integer_to_raw
  - adv_dbe_raw_cast_from_raw_to_binary_integer
  status: runtime_candidate
  sql: SELECT DBE_RAW.CAST_FROM_RAW_TO_BINARY_INTEGER(DBE_RAW.CAST_FROM_BINARY_INTEGER_TO_RAW(742, 1), 1) AS value;
  oracle:
    kind: value
    expected: INTEGER→RAW→INTEGER大端往返后返回742。
    status: needs_verification
  cleanup_required: false
- schema_version: 1
  kind: advanced_package_test_case
  id: adv_case_dbe_sql_select_lifecycle
  package_ref: dbe_sql
  interface_refs:
  - adv_dbe_sql_register_context
  - adv_dbe_sql_set_sql
  - adv_dbe_sql_set_result_type
  - adv_dbe_sql_run
  - adv_dbe_sql_next_row
  - adv_dbe_sql_get_result
  - adv_dbe_sql_last_row_count
  - adv_dbe_sql_is_active
  - adv_dbe_sql_unregister_context
  status: runtime_candidate
  sql: "DECLARE\n  cid INTEGER;\n  set_ok BOOLEAN;\n  define_ok INTEGER;\n  run_count INTEGER;\n  row_status INTEGER;\n  value\
    \ INTEGER;\n  last_count INTEGER;\n  close_ok BOOLEAN;\nBEGIN\n  cid := DBE_SQL.REGISTER_CONTEXT();\n  set_ok := DBE_SQL.SQL_SET_SQL(cid,\
    \ 'SELECT 1 AS value', 1);\n  define_ok := DBE_SQL.SET_RESULT_TYPE(cid, 1, NULL::INTEGER, 4);\n  run_count := DBE_SQL.SQL_RUN(cid);\n\
    \  row_status := DBE_SQL.NEXT_ROW(cid);\n  value := DBE_SQL.GET_RESULT(cid, 1, NULL::INTEGER);\n  last_count := DBE_SQL.LAST_ROW_COUNT();\n\
    \  close_ok := DBE_SQL.SQL_UNREGISTER_CONTEXT(cid);\nEXCEPTION\n  WHEN OTHERS THEN\n    IF cid IS NOT NULL AND DBE_SQL.IS_ACTIVE(cid)\
    \ THEN\n      close_ok := DBE_SQL.SQL_UNREGISTER_CONTEXT(cid);\n    END IF;\n    RAISE;\nEND;"
  oracle:
    kind: lifecycle
    expected: 打开动态SQL游标、读取一行INTEGER值并关闭游标；异常路径也必须关闭。
    status: needs_verification
  cleanup_required: true
