manual_review_reasons:
  dbe_compression: 需要ILM开启、兼容的物理对象与压缩类型 fixture；TURBO统计还依赖buffer状态。
  dbe_describe: DESCRIBE_PROCEDURE返回多个PL/SQL集合且对对象类型/权限敏感；先补专用case设计。
  dbe_heat_map: 需要真实ctid、ILM对象和可选debug fixture；不作为首批无状态case。
  dbe_ilm: STOP_ILM会影响压缩任务；EXECUTE_ILM会生成压缩Job，直接block。
  dbe_ilm_admin: 影响实例级ILM后台调度或库级策略，首批runtime pilot禁止直接执行。
  dbe_stats: 除两个只读历史信息函数外，锁定、恢复、清理、导入导出和建删统计表都改变统计对象或历史数据。
  dbe_xmldom: DOM资源释放和节点修改需要生命周期case；尚未建模的接口不能自动执行。
  dbe_xmlparser: PARSECLOB、SETVALIDATIONMODE和异常路径需要专用fixture；未进入首批候选。
prerequisites:
  dbe_xmldom: A兼容模式；非SQL_ASCII字符集时不得注入非ASCII样本；每个用例必须FREEDOCUMENT/FREEELEMENT/FREENODE/FREENODELIST释放资源。
  dbe_xmlparser: A兼容模式；UTF-8字符串；解析成功与失败路径都必须FREEPARSER，生成的DOMDOCUMENT必须释放。
  dbe_stats: 只读函数需要统计历史初始化；变更类接口需要独立schema、备份/恢复和显式UNLOCK或清理。
  dbe_ilm_admin: enable_ilm、SYSADMIN/相应授权、独立库和job状态审计；首批不执行。
  dbe_ilm: enable_ilm、CREATE JOB授权、表owner、独立ILM对象和job清理；首批不执行。
  dbe_compression: enable_ilm、表owner、压缩类型fixture、分区名边界和表空间容量评估。
  dbe_heat_map: enable_ilm、独立表空间/表、已知ctid和时间同步预期。
  dbe_describe: 独立procedure/function、权限失败样本、包内对象排除和DBLINK负例。
