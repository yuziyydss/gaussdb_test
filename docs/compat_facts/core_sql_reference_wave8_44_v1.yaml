facts:
- id: db_wave8_44_purpose
  type: syntax
  statement: "CREATE DATABASE创建新数据库；默认通过复制标准系统数据库templatea创建，支持OWNER、TEMPLATE、ENCODING、LC_COLLATE、LC_CTYPE、DBCOMPATIBILITY、TABLESPACE、CONNECTION LIMIT和DBTIMEZONE选项。"
  source_anchor: "1.13.9.16 页1412-1414"
  source_refs: &refb1
  - w8_44_1_13_9_16
  status: confirmed
- id: db_wave8_44_permissions
  type: constraint
  statement: "仅拥有CREATEDB权限的用户可以创建新数据库；系统管理员默认拥有该权限。"
  source_anchor: "1.13.9.16 注意事项 页1412"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_transaction_limit
  type: constraint
  statement: "不能在事务块中执行创建数据库语句。"
  source_anchor: "1.13.9.16 注意事项 页1412"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_template_upgrade_limit
  type: constraint
  statement: "标准系统数据库模板升级或更新期间，不能通过复制template0、templatea和templatem创建数据库。"
  source_anchor: "1.13.9.16 注意事项 页1412"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_templatem_name_limit
  type: constraint
  statement: "创建数据库时不允许使用templatem作为新创建的数据库名称。"
  source_anchor: "1.13.9.16 注意事项 页1412"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_non_a_m_object_differences
  type: constraint
  statement: "创建非A兼容且非M兼容数据库时，部分系统视图字段在创建时为timestamp(0) without time zone，视图升级后变为date；dbe_scheduler.set_attribute(name text, attribute text, value date)重载函数在创建时缺失，packages插件升级后存在。"
  source_anchor: "1.13.9.16 系统对象差异 页1412-1413"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_name_rules
  type: constraint
  statement: "数据库名称最长63个字符，超长会截断保留前63个字符；名称中包含大写字母时自动转为小写，需要大写名称必须用双引号包裹。"
  source_anchor: "1.13.9.16 database_name 页1414"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_owner
  type: syntax
  statement: "OWNER指定数据库所有者，取值为已存在用户名；未指定时新数据库所有者为当前用户。"
  source_anchor: "1.13.9.16 OWNER 页1414"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_template
  type: syntax
  statement: "TEMPLATE指定创建数据库使用的标准系统数据库模板；GaussDB通过模板复制创建新库，包含template0、template1、templatea和templatem以及用户数据库postgres，可选模板为template0、templatem或templatea。"
  source_anchor: "1.13.9.16 TEMPLATE 页1414"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_encoding_defaults
  type: constraint
  statement: "ENCODING常用取值包括GBK、UTF8、Latin1和GB18030等；不指定编码时，M兼容模式数据库默认UTF8，其他兼容模式使用模板数据库编码。template0、template1和templatea默认编码与操作系统环境相关；template1不允许修改字符编码，变更编码需使用template0或templatea。"
  source_anchor: "1.13.9.16 ENCODING 页1414-1415"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_sql_ascii_limit
  type: constraint
  statement: "SQL_ASCII与其他字符集行为不同：字节0~127按ASCII解析，128~255当作无法解析字符；使用非ASCII数据时不建议设置为SQL_ASCII，否则数据库无法转换或校验非ASCII字符。"
  source_anchor: "1.13.9.16 字符集须知 页1419"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_encoding_locale_compatibility
  type: constraint
  statement: "新指定数据库字符集编码必须与LC_COLLATE和LC_CTYPE设置兼容；若区域设置为C或POSIX允许所有编码，其他区域设置要求编码与区域设置相同。编码和区域设置必须匹配模板数据库，但template0或templatea除外。"
  source_anchor: "1.13.9.16 字符集须知与DBTIMEZONE说明 页1419、1422"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_gbk_object_names
  type: constraint
  statement: "字符编码为GBK或ZHS16GBK时，部分中文生僻字无法直接作为对象名，因为GBK第二字节0x40~0x7E与ASCII操作符字符重叠；需要使用时可在创建和访问对象时加双引号规避。"
  source_anchor: "1.13.9.16 字符集须知 页1419"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_client_server_encoding
  type: constraint
  statement: "客户端编码与服务器端编码不一致时，数据库需支持编码转换，可用编码转换通过系统表PG_CONVERSION查看；若无法转换，建议通过client_encoding使客户端编码与服务器端保持一致。"
  source_anchor: "1.13.9.16 字符集须知 页1419"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_gb18030_2022_zhsgbk
  type: constraint
  statement: "数据库与客户端同时为GB18030_2022时，需确保操作系统支持2022版本，否则可能因版本不完全兼容导致数据不一致；历史数据切换应遵循数据库切换流程。ZHS16GBK支持输入欧元符号，编码值为0x80。"
  source_anchor: "1.13.9.16 字符集须知 页1419-1420"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_lc_collate
  type: syntax
  statement: "LC_COLLATE指定新数据库字符集，默认使用模板数据库字符集；影响字符串排序顺序如ORDER BY结果。"
  source_anchor: "1.13.9.16 LC_COLLATE 页1420"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_lc_ctype
  type: syntax
  statement: "LC_CTYPE指定新数据库字符分类，默认使用模板数据库字符分类；影响大写、小写和数字分类，且对M兼容模式数据库不生效。取值范围与本地环境支持字符集相关，可通过locale -a获取。"
  source_anchor: "1.13.9.16 LC_CTYPE 页1420-1421"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_dbcompatibility
  type: syntax
  statement: "DBCOMPATIBILITY指定兼容数据库类型，默认Oracle；取值A、B、C、PG、M，分别表示Oracle、MySQL兼容B模式、TD、PostgreSQL和MySQL兼容M模式。MySQL场景推荐使用M兼容模式，B模式因架构限制不再演进。"
  source_anchor: "1.13.9.16 DBCOMPATIBILITY 页1421"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_tablespace_connection_limit
  type: syntax
  statement: "TABLESPACE指定已存在的数据库默认表空间；CONNECTION LIMIT指定可接受并发连接数，取值[-1, 2^31-1]，默认-1表示无限制。系统管理员不受限制；主节点connlimit单独统计，数据库整体连接数为connlimit乘以当前正常数据库主节点个数。"
  source_anchor: "1.13.9.16 TABLESPACE/CONNECTION LIMIT 页1421"
  source_refs: *refb1
  status: confirmed
- id: db_wave8_44_dbtimezone
  type: syntax
  statement: "DBTIMEZONE指定新数据库时区，默认PRC；取值为操作系统支持的时区名称/缩写或-15:59到+15:00。该参数仅在A兼容模式下且设置a_format_version='10c'与a_format_dev_version='s2'时支持。"
  source_anchor: "1.13.9.16 DBTIMEZONE 页1421-1422"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: db_wave8_44_oq_runtime
  statement: "CREATE DATABASE在真实模板、编码、locale、兼容模式、表空间、连接限制和时区组合下的创建结果与错误矩阵需授权环境实机验证。"
  status: open
