  type: syntax
  statement: "异步I/O参数：checkpoint_flush_after SIGHUP整型0~256页默认256kB（32页）checkpointer线程刷脏超阈值异步刷盘；bgwriter_flush_after SIGHUP整型0~256页默认512kB（64页）background writer线程异步刷盘；backend_flush_after USERSET整型0~256页默认0 backend线程异步刷盘（PDB级别）；enable_adio_function SIGHUP布尔型默认off ADIO模式（方式二off→on/gs_get_io_type()验证/on→off需重启/candidate_slots<15%建议on）；enable_adio_debug SUSET布尔型默认off维护日志（当前版本不支持打开）。"
