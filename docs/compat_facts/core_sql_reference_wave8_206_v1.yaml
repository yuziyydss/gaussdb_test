- id: guc_wave8_206_vacuum_cost
  type: constraint
  statement: "基于开销的清理延迟参数（均为USERSET PDB级别）：vacuum_cost_delay整型0~100ms默认1（0关闭/正数打开）vacuum开销达limit时休眠时间；vacuum_cost_page_hit整型0~10000默认1清理命中页面代价；vacuum_cost_page_miss默认10未命中代价；vacuum_cost_page_dirty默认20干净页清理后刷脏代价；vacuum_cost_limit整型1~10000默认1000清理线程休眠开销限制（越大I/O频次限制越小Vacuum效率越高对业务I/O影响越大）；vacuum_defer_cleanup_age SIGHUP整型0~1000000默认0延迟清理事务数量（过大导致VACUUM不及时）。"
  source_anchor: "7.3.4.4 基于开销的清理延迟 页4226-4229"
  source_refs: *refw8206
  status: confirmed
- id: guc_wave8_206_bgwriter
  type: syntax
  statement: "后端写线程参数：bgwriter_delay SIGHUP整型10~10000ms默认2000定期循环刷脏间隔（增量checkpoint数据量>shared_buffers时不宜大于2s）；candidate_buf_percent_target SIGHUP浮点型0.1~0.85默认0.3增量检查点干净页面候选链表百分比期望值；bgwriter_lru_maxpages SIGHUP整型0~1000默认100每次脏页刷盘上限（0禁用后端写）；bgwriter_lru_multiplier SIGHUP浮点型0~10默认2推荐shared_buffers乘积。"
  source_anchor: "7.3.4.5 后端写线程 页4229-4230"
  source_refs: *refw8206
  status: confirmed
- id: guc_wave8_206_pagewriter
  type: syntax
  statement: "pagewriter参数：pagewriter_thread_num POSTMASTER整型1~16默认4增量检查点后台刷页线程数；dirty_page_percent_max SIGHUP浮点型0.1~1默认0.9脏页占shared_buffers最大百分比达值以max_io_capacity刷脏；pagewriter_sleep SIGHUP整型0~3600000ms默认2000刷页线程刷脏周期（不宜大于2s/脏页产生快建议100-500ms/过大影响Xlog回收且可能导致退出超时）；max_io_capacity SIGHUP整型30720~10485760kB默认2GB或500MB按规格批量刷脏每秒I/O上限（过小脏页满性能劣化/过大写放大影响存储寿命）。"
  source_anchor: "7.3.4.5 后端写线程 页4231-4232"
  source_refs: *refw8206
  status: confirmed
- id: guc_wave8_206_evictor
  type: syntax
  statement: "淘汰算法参数：enable_consider_usecount SIGHUP布尔型默认off缓冲区页面淘汰考虑冷热程度；enable_buffer_evictor SIGHUP布尔型默认off智能淘汰算法开关；eviction_clean_page_percent_min SIGHUP浮点型0~0.9默认0.1最少干净页比例；eviction_candidate_list_size POSTMASTER整型1024~65536默认2048淘汰候选队列长度；pagewriter_flush_mode POSTMASTER枚举extre_mode/default_mode默认extre_mode极致刷脏开关。"
  source_anchor: "7.3.4.5 后端写线程 页4232-4233"
