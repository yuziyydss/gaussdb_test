  type: syntax
  statement: "dw_file_num：POSTMASTER整型1~16默认1批量双写文件数量（不大于pagewriter_thread_num）；dw_file_size：POSTMASTER整型32~256MB默认256每个双写文件大小；postmaster_parallel_init_thread_num：POSTMASTER整型1~256默认16数据库启动并行线程数（建议不超过CPU核数-1）。"
