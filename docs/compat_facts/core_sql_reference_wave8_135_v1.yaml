  type: behavior_oracle
  statement: "SELECT INTO示例基线（m_db）：SELECT INTO创建的新表字段与SELECT输出字段同名同类型，数据不返回客户端而是插入新表（区别于普通SELECT）。"
  source_anchor: "2.4.2.16.3 示例 页2272"
