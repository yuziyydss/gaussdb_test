- id: m_show_wave8_135_like_or_where
  type: syntax
  statement: "M兼容SHOW的like_or_where子句：LIKE 'pattern'对名称模糊匹配或WHERE expr指定更通用的选择条件（适用于CHARACTER SET/COLLATION/COLUMNS/DATABASES/TABLES/TABLE STATUS/VARIABLES等子句）。"
