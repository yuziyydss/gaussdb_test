facts:
- id: m_select_into_wave8_135_overview
  type: syntax
  statement: "M兼容SELECT INTO根据查询结果创建一个新表并将查询到的数据插入到新表中（数据并不返回给客户端——这一点和普通SELECT不同；新表的字段具有和SELECT的输出字段相同的名称和数据类型）；语法为[ WITH [ RECURSIVE ] with_query [, ...] ] SELECT [ALL|DISTINCT|DISTINCTROW] [SQL_NO_CACHE] select_expr[,...] INTO [ [ GLOBAL | LOCAL ] [ TEMPORARY ] ] [ TABLE ] new_table [FROM from_item] [WHERE ...] [GROUP BY ...] [HAVING ...] [ORDER BY ...] [LIMIT ...] INTO [ [ GLOBAL | LOCAL ] [ TEMPORARY ] ] [ TABLE ] new_table [ FOR READ ONLY | [ {FOR { UPDATE | SHARE } [ OF table_name [, ...] ] [ NOWAIT | WAIT N ]} [...] ] | LOCK IN SHARE MODE]（INTO可出现在select_expr之后或语句末尾）。"
  source_anchor: "2.4.2.16.3 功能描述/语法格式 页2270-2271"
  source_refs: &refmsi
  - w8_135_2_4_2_16_3
  status: confirmed
- id: m_select_into_wave8_135_temporary
  type: constraint
  statement: "M兼容SELECT INTO的GLOBAL | LOCAL与TEMPORARY：创建临时表时可在TEMP或TEMPORARY前指定GLOBAL或LOCAL关键字（指定GLOBAL创建全局临时表，否则创建本地临时表）；全局临时表的元数据对所有会话可见（会话结束后元数据继续存在），会话间用户数据、索引和统计信息相互隔离（每个会话只能看到和更改自己提交的数据）；全局临时表两种模式：会话级ON COMMIT PRESERVE ROWS（会话结束自动清空用户数据，未指定ON COMMIT时缺省为会话级）和事务级ON COMMIT DELETE ROWS（commit或rollback时自动清空）；全局临时表建表时可指定非pg_temp_开头的schema。"
  source_anchor: "2.4.2.16.3 参数说明 TEMPORARY 页2271"
  source_refs: *refmsi
  status: confirmed
- id: m_select_into_wave8_135_local_temp
  type: constraint
  statement: "M兼容SELECT INTO本地临时表只在当前会话可见（本会话结束后自动删除；除当前会话连接的数据库节点故障时仍可在当前会话上创建和使用临时表；涉及临时表操作的DDL语句会产生DDL失败的报错，建议DDL语句不对临时表操作；TEMP和TEMPORARY等价）。"
  source_anchor: "2.4.2.16.3 参数说明 TEMPORARY 页2271"
  source_refs: *refmsi
  status: confirmed
- id: m_select_into_wave8_135_pg_temp_notes
  type: constraint
  statement: "M兼容SELECT INTO临时表须知：本地临时表通过每个会话独立的以pg_temp开头的schema保证只对当前会话可见（不建议手动删除pg_temp、pg_toast_temp开头的schema）；建表不指定TEMPORARY/TEMP但指定表的schema为当前会话pg_temp_开头schema时此表创建为临时表；ALTER/DROP全局临时表和索引时如果其它会话正在使用则禁止操作；全局临时表的DDL只影响当前会话的用户数据和索引（truncate、reindex、analyze只对当前会话有效）；SELECT INTO其他参数说明参见SELECT章节。"
  source_anchor: "2.4.2.16.3 须知/说明 页2271-2272"
  source_refs: *refmsi
  status: confirmed
- id: m_show_wave8_135_overview
  type: syntax
  statement: "M兼容SHOW显示当前运行时参数的数值，同时还可显示数据库对象的信息（如库信息、表信息、列信息或服务器状态信息等；显示数据库对象信息需用户拥有相应权限）；语法全集：SHOW {[VARIABLES LIKE] configuration_parameter | TIME ZONE | TRANSACTION ISOLATION LEVEL | SESSION AUTHORIZATION | ALL}；SHOW {CHARACTER SET | CHARSET} [like_or_where]；SHOW COLLATION [like_or_where]；SHOW [FULL] COLUMNS FROM [tbl_name | db_name.tbl_name] [FROM db_name] [like_or_where]；SHOW CREATE {DATABASE | SCHEMA} [IF NOT EXISTS] db_name；SHOW CREATE TABLE [tbl_name | db_name.tbl_name]；SHOW CREATE VIEW [view_name | db_name.view_name]；SHOW [DATABASES | SCHEMAS] [like_or_where]；SHOW [STORAGE] ENGINES；SHOW {INDEX | INDEXES | KEYS} {FROM | IN} tbl_name [{FROM | IN} db_name] [WHERE expr]；SHOW [FULL] PROCESSLIST；SHOW [GLOBAL | SESSION] STATUS [like_or_where]；SHOW [GLOBAL | SESSION] VARIABLES [like_or_where]；SHOW [FULL] TABLES [{FROM | IN} db_name] [like_or_where]；SHOW TABLE STATUS [{FROM | IN} db_name] [like_or_where]。"
  source_anchor: "2.4.2.16.8 语法格式 页2278-2279"
  source_refs: &refmshow
  - w8_135_2_4_2_16_8
  status: confirmed
- id: m_show_wave8_135_params
  type: syntax
  statement: "M兼容SHOW参数：configuration_parameter为运行时参数名称（可用SHOW ALL命令查看运行时参数）；TIME ZONE为时区；TRANSACTION ISOLATION LEVEL为事务的隔离级别；SESSION AUTHORIZATION为当前会话的用户标识符；ALL显示所有运行时参数。"
  source_anchor: "2.4.2.16.8 参数说明 页2279"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_charset
  type: constraint
  statement: "M兼容SHOW {CHARACTER SET | CHARSET}显示所有可用的字符集（可使用LIKE子句对列名模糊匹配，也可使用WHERE子句指定更通用的选择条件）；SHOW CHARACTER SET显示的列信息包括字符集名称相关字段。"
  source_anchor: "2.4.2.16.8 SHOW CHARACTER SET 页2279-2280"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_collation
  type: constraint
  statement: "M兼容SHOW COLLATION显示的列信息包括：Charset（与排序规则相关联的字符集名称）、Id（排序规则id）、Default（排序规则是否为其字符集的默认值）、Compiled（兼容字段默认Yes）、Sortlen（与对以字符集表示的字符串进行排序所需的内存量有关）。"
  source_anchor: "2.4.2.16.8 SHOW COLLATION 页2280"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_columns
  type: constraint
  statement: "M兼容SHOW [FULL] COLUMNS FROM [tbl_name | db_name.tbl_name] [FROM db_name] [like_or_where]显示指定表中的列信息（同时适用于视图；需要拥有指定表所在Schema的USAGE权限，同时拥有指定表的任意表级权限或列级权限；仅显示拥有SELECT、INSERT、UPDATE、REFERENCES和COMMENT权限的列信息；FULL可选使输出额外包含列排序规则、注释及权限信息；db_name.tbl_name与FROM db_name同时使用时FROM db_name优先级高）。"
  source_anchor: "2.4.2.16.8 SHOW COLUMNS 页2280"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_columns_fields
  type: constraint
  statement: "M兼容SHOW COLUMNS显示的列信息：Field列名、Type列数据类型、Collation字符类型排序规则（仅声明FULL关键字时显示）、Null列值是否可为NULL（YES/NO）、Key列是否被索引（PRI被主键索引、UNI唯一索引中的第一列、MUL非唯一索引中的第一列、NULL未被索引或不是第一列）、Default列默认值、Extra列附加信息（auto_increment自增列、on update CURRENT_TIMESTAMP具有ON UPDATE约束、VIRTUAL GENERATED虚拟生成列、STORED GENERATED存储生成列）、Privileges用户对该列拥有的权限（仅FULL显示）、Comment列注释（仅FULL显示）。"
  source_anchor: "2.4.2.16.8 SHOW COLUMNS 列信息 页2280"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_create_db
  type: syntax
  statement: "M兼容SHOW CREATE {DATABASE | SCHEMA} [IF NOT EXISTS] db_name显示创建指定数据库的CREATE DATABASE语句（需拥有指定Schema的USAGE权限；DATABASE和SCHEMA为同义词；SHOW语句包含IF NOT EXISTS时输出的CREATE DATABASE语句中也包含IF NOT EXISTS）。"
  source_anchor: "2.4.2.16.8 CREATE DATABASE 页2280"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_create_table_view
  type: syntax
  statement: "M兼容SHOW CREATE TABLE [tbl_name | db_name.tbl_name]显示创建指定表的CREATE TABLE语句（同时适用于视图，作用于视图时与SHOW CREATE VIEW功能相同；需Schema的USAGE权限和任意表级权限；设置GUC兼容性参数m_format_dev_version为's2'后返回的结果集可能存在变化）；SHOW CREATE VIEW显示创建指定视图的CREATE VIEW语句（需Schema的USAGE权限和视图的任意表级权限；精度传递开关打开时不展示隐式类型转换信息）。"
  source_anchor: "2.4.2.16.8 CREATE TABLE/CREATE VIEW 页2280"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_engines_status
  type: constraint
  statement: "M兼容SHOW [STORAGE] ENGINES显示当前数据库服务端支持的存储引擎；SHOW [GLOBAL | SESSION] STATUS显示数据库连接数以及运行时间（不显式指定GLOBAL或SESSION时默认为当前会话；GLOBAL显示全局范围内的连接数及运行时间，SESSION显示当前会话的）。"
  source_anchor: "2.4.2.16.8 ENGINES/STATUS 页2280-2281"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_variables
  type: constraint
  statement: "M兼容SHOW [GLOBAL | SESSION] VARIABLES显示数据库系统变量的值（不显式指定时默认为当前会话；可使用LIKE子句模糊匹配或WHERE子句通用条件；GLOBAL显示全局系统变量值——用于为数据库的新连接初始化相应的会话变量，如果变量没有全局值则不显示任何值；SESSION显示当前会话的系统变量值——如果变量没有会话值则显示全局值）。"
  source_anchor: "2.4.2.16.8 VARIABLES 页2281"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_processlist
  type: constraint
  statement: "M兼容SHOW [FULL] PROCESSLIST显示当前服务器内的线程信息（如果没有SYSADMIN权限，用户只能看到当前用户线程的信息；显示的内容同information_schema.processlist视图；如果未指定FULL，返回结果中的Info列仅显示前100个字符）。"
  source_anchor: "2.4.2.16.8 PROCESSLIST 页2281"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_tables
  type: constraint
  statement: "M兼容SHOW [FULL] TABLES [{FROM | IN} db_name][LIKE 'pattern' | WHERE expr]查看指定数据库中的表或视图（默认是用户查询时使用的数据库，不包含临时表；指定数据库须有该数据库的权限；查询结果按升序排序并使用字符集utf8mb4、字符序utf8mb4_bin）；FULL可选指定时显示信息中包含Table_type列；当目标database是information_schema时pattern被转为小写再进行匹配。"
  source_anchor: "2.4.2.16.8 TABLES 页2281"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_table_status
  type: constraint
  statement: "M兼容SHOW TABLE STATUS [{FROM | IN} db_name][LIKE 'pattern' | WHERE expr]显示表和视图的信息（未指定Schema时默认为当前所在Schema，不包含临时表；查询结果使用的字符集和字符序在information_schema.tables的对应字段中体现；查询结果内容见表2-28）。"
  source_anchor: "2.4.2.16.8 TABLE STATUS 表2-28 页2281-2282"
  source_refs: *refmshow
  status: confirmed
- id: m_show_wave8_135_index
  type: constraint
  statement: "M兼容SHOW {INDEX | INDEXES | KEYS} {FROM | IN} tbl_name [{FROM | IN} db_name] [WHERE expr]显示索引信息（使用FROM/IN db_name展示指定临时表索引信息时须指明db_name为临时表所在的Schema，否则提示不存在该临时表）；查询结果中Table、Index_type、Index_comment字段使用字符集utf8mb4、字符序utf8mb4_bin（Key_name、Column_name、Collation、Null、Comment字段使用utf8mb4、utf8mb4_general_ci）。"
  source_anchor: "2.4.2.16.8 SHOW INDEX 页2281"
  source_refs: *refmshow
  status: confirmed
