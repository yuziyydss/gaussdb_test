facts:
- id: network_wave7_4_comparison_subnet_ops
  type: syntax
  statement: "cidr/inet支持<、<=、=、>=、>、<>比较，以及<<、<<=、>>、>>=子网测试；子网操作符仅比较地址网络部分并忽略主机部分。"
  source_anchor: "1.6.11 页392-393"
  source_refs: &ref111
  - w7_4_1_6_11
  status: confirmed
- id: network_wave7_4_bitwise_arithmetic_ops
  type: syntax
  statement: "cidr/inet支持~位非、&按位与、|按位或；支持地址与整数相加减，以及两个地址相减返回差值。"
  source_anchor: "1.6.11 页393-394"
  source_refs: *ref111
  status: confirmed
- id: network_wave7_4_display_functions
  type: syntax
  statement: "abbrev(inet)、abbrev(cidr)、broadcast(inet)、family(inet)、host(inet)、hostmask(inet)、masklen(inet)、netmask(inet)、network(inet)、set_masklen(inet,int)、set_masklen(cidr,int)和text(inet)提供地址显示、地址族、掩码、网络部分和格式转换。"
  source_anchor: "1.6.11 页394-396"
  source_refs: *ref111
  status: confirmed
- id: network_wave7_4_family_values
  type: behavior_oracle
  statement: "family(inet)返回地址族：4表示IPv4，6表示IPv6。"
  source_anchor: "1.6.11 页395"
  source_refs: *ref111
  status: confirmed
- id: network_wave7_4_cidr_inet_conversion
  type: constraint
  statement: "任何cidr值可显式或隐式转换为inet，上述inet函数也可操作cidr；inet转cidr时子网掩码右侧所有位转为零；文本也可用inet(expression)或colname::cidr转换。"
  source_anchor: "1.6.11 页396"
  source_refs: *ref111
  status: confirmed
- id: network_wave7_4_macaddr_functions
  type: syntax
  statement: "trunc(macaddr)返回最后3字节为零的MAC地址；macaddr还支持>、<=等关系操作符用于词法排序，以及~、&、|按位运算。"
  source_anchor: "1.6.11 页396-397"
  source_refs: *ref111
  status: confirmed
- id: network_wave7_4_scope_note
  type: environment
  statement: "Wave 7-4覆盖1.6.11网络地址函数和操作符，包括cidr/inet比较与子网操作符、位运算、格式函数和macaddr函数，物理页392-397。"
  source_anchor: "1.6.11 页392-397"
  source_refs: *ref111
  status: confirmed
- id: sequence_wave7_4_nextval
  type: syntax
  statement: "nextval(regclass)递增序列并返回新值，返回numeric；支持nextval('seq')和seq.nextval两种调用方式。"
  source_anchor: "1.6.15 页439-440"
  source_refs: &ref151
  - w7_4_1_6_15
  status: confirmed
- id: sequence_wave7_4_nextval_no_rollback
  type: constraint
  statement: "nextval操作不会回滚；值一旦抓取即视为已使用，事务中断或不使用该值都会留下未使用空洞，因此序列不能用于获得无间隙序列。"
  source_anchor: "1.6.15 页440"
  source_refs: *ref151
  status: confirmed
- id: sequence_wave7_4_nextval_srf_skip
  type: behavior_oracle
  statement: "插入语句同时包含SRF函数和序列自增列时，序列值会跳数一位；例如两次插入generate_series(1,1)，b列分别为1和3。"
  source_anchor: "1.6.15 页440"
  source_refs: *ref151
  status: confirmed
- id: sequence_wave7_4_nextval_standby_rowid
  type: constraint
  statement: "nextval仅支持在主机执行，备机不支持；对于rowid系统列的序列，nextval仅支持在维护模式下操作。"
  source_anchor: "1.6.15 页440"
  source_refs: *ref151
  status: confirmed
- id: sequence_wave7_4_currval
  type: syntax
  statement: "currval(regclass)返回当前会话最近一次nextval返回值；当前会话未调用指定序列的nextval时报错；支持currval('seq')和seq.currval调用，后者不支持序列名含特殊字符'.'。"
  source_anchor: "1.6.15 页440"
  source_refs: *ref151
  status: confirmed
- id: sequence_wave7_4_lastval
  type: syntax
  statement: "lastval()返回当前会话最近一次nextval返回值；未调用nextval时报错，返回numeric。"
  source_anchor: "1.6.15 页440-441"
  source_refs: *ref151
  status: confirmed
- id: sequence_wave7_4_setval_overloads
  type: syntax
  statement: "setval(regclass,numeric)设置序列当前值；setval(regclass,numeric,Boolean)同时设置is_called标志，均返回numeric。"
  source_anchor: "1.6.15 页441"
  source_refs: *ref151
  status: confirmed
- id: sequence_wave7_4_setval_cache_boundary
  type: constraint
  statement: "setval后当前会话立即生效且自身序列缓存失效；其他会话缓存需用尽后才感知变更；sequence_cache_mode=instance时节点级缓存立即更新；建议谨慎使用以避免序列值冲突。"
  source_anchor: "1.6.15 页441"
  source_refs: *ref151
  status: confirmed
- id: sequence_wave7_4_setval_nontransactional
  type: constraint
  statement: "序列对象具有非事务特性，setval修改不可回滚，即使在事务块中也不会因事务中止撤销；rowid系统列序列的setval仅允许维护模式。"
  source_anchor: "1.6.15 页441"
  source_refs: *ref151
  status: confirmed
- id: sequence_wave7_4_last_value_functions
  type: syntax
  statement: "pg_sequence_last_value(sequence_oid)、gs_get_sequence_last_value(sequence_oid)返回cache_value和last_value；gs_get_sequence_parameters(sequence_oid)返回起始值、最小值、最大值、递增值和cycle_option。"
  source_anchor: "1.6.15 页441"
  source_refs: *ref151
  status: confirmed
- id: sequence_wave7_4_last_insert_id
  type: syntax
  statement: "last_insert_id()获取最近一次为自动增长列成功插入的第一个自动生成值；last_insert_id(int16)设置并返回下一次last_insert_id返回值；参数NULL时将下一次返回值设为0并返回NULL。"
  source_anchor: "1.6.15 页442"
  source_refs: *ref151
  status: confirmed
- id: sequence_wave7_4_last_insert_id_boundary
  type: constraint
  statement: "last_insert_id及last_insert_id(int16)是会话级函数，仅在sql_compatibility='B'时可用；当前会话未对自动增长列插入数据时last_insert_id()返回0。"
  source_anchor: "1.6.15 页442"
  source_refs: *ref151
  status: confirmed
