facts:
- id: dbestats_wave8_165_export_index
  type: syntax
  statement: "EXPORT_INDEX_STATS原型：DBE_STATS.EXPORT_INDEX_STATS(ownname VARCHAR2, indname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab VARCHAR2, statid VARCHAR2 DEFAULT NULL, statown VARCHAR2 DEFAULT NULL)；在系统表中查找指定索引的统计信息并存储在用户统计信息表中；如果索引已分区但partname为null则导出全局和分区索引统计信息；导出索引的reltuples（numrows）、relpages（numlblks）和relallvisible三类统计信息。"
  source_anchor: "3.12.2.20 EXPORT_INDEX_STATS 页2928-2929"
  source_refs: &refei
  - w8_165_3_12
  status: confirmed
- id: dbestats_wave8_165_export_index_example
  type: behavior_oracle
  statement: "EXPORT_INDEX_STATS示例基线：分区表t2建LOCAL索引idx_t2_local_a并ANALYZE后，EXPORT_INDEX_STATS(statid=>'idx_s1')导出到export_table，查询输出idx_t2_local_a（numrows 6/numblocks 6）及s1~s6_idx_a六个分区索引行。"
  source_anchor: "3.12.2.20 EXPORT_INDEX_STATS示例 页2928-2930"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_export_table
  type: syntax
  statement: "EXPORT_TABLE_STATS原型：DBE_STATS.EXPORT_TABLE_STATS(ownname VARCHAR2, tabname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab VARCHAR2, statid VARCHAR2 DEFAULT NULL, cascade BOOLEAN DEFAULT TRUE, statown VARCHAR2 DEFAULT NULL, stat_category VARCHAR2 DEFAULT NULL)；检索指定表的统计信息存储在用户统计信息表中；表已分区但partname为null时导出全局和分区表统计信息；cascade为是否一并导出列、索引、多列和索引表达式的统计信息（默认TRUE）；stat_category暂不支持。"
  source_anchor: "3.12.2.20 EXPORT_TABLE_STATS 页2930-2931"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_export_table_contents
  type: constraint
  statement: "EXPORT_TABLE_STATS导出内容：导出表的reltuples（numrows）、relpages（numblks）和relallvisible（relallvisible）三类统计信息；级联导出列级、索引级的统计信息参考EXPORT_INDEX_STATS和EXPORT_COLUMN_STATS接口。"
  source_anchor: "3.12.2.20 EXPORT_TABLE_STATS说明 页2931"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_export_column
  type: syntax
  statement: "EXPORT_COLUMN_STATS原型：DBE_STATS.EXPORT_COLUMN_STATS(ownname VARCHAR2, tabname VARCHAR2, colname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab VARCHAR2, statid VARCHAR2 DEFAULT NULL, statown VARCHAR2 DEFAULT NULL)；检索指定列（多列/表达式）的统计信息并存储在用户统计信息表中；tabname为索引时colname为表达式名；表/索引已分区但partname为null时导出全局和分区列/多列/索引表达式统计信息。"
  source_anchor: "3.12.2.20 EXPORT_COLUMN_STATS 页2931-2932"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_export_column_example
  type: behavior_oracle
  statement: "EXPORT_COLUMN_STATS示例基线：EXPORT_COLUMN_STATS(statid=>'t1_c')后export_table输出t1列a（stadistinct -1、stakind1 2、stavalues1 {100,150,250}）与多列别名extname_-1308656218（stakind1 8）。"
  source_anchor: "3.12.2.20 EXPORT_COLUMN_STATS示例 页2933-2934"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_export_schema
  type: syntax
  statement: "EXPORT_SCHEMA_STATS原型：DBE_STATS.EXPORT_SCHEMA_STATS(ownname VARCHAR2, stattab VARCHAR2, statid VARCHAR2 DEFAULT NULL, statown VARCHAR2 DEFAULT NULL, stat_category VARCHAR2 DEFAULT NULL)；用于检索指定schema的统计信息并存储在用户统计信息表中；导出当前用户在指定schema下所有具有权限的表的统计信息（无权限的表直接跳过不报错）。"
  source_anchor: "3.12.2.20 EXPORT_SCHEMA_STATS 页2934"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_export_database
  type: syntax
  statement: "EXPORT_DATABASE_STATS原型：DBE_STATS.EXPORT_DATABASE_STATS(stattab VARCHAR2, statid VARCHAR2 DEFAULT NULL, statown VARCHAR2 DEFAULT NULL, stat_category VARCHAR2 DEFAULT NULL)；用于检索指定database的统计信息并存储在用户统计信息表中；导出当前用户在当前database下所有具有analyze权限用户表的统计信息（无权限的表直接跳过不报错）；statown为null时使用当前Schema。"
  source_anchor: "3.12.2.20 EXPORT_DATABASE_STATS 页2934-2935"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_import_index
  type: syntax
  statement: "IMPORT_INDEX_STATS原型：DBE_STATS.IMPORT_INDEX_STATS(ownname VARCHAR2, indname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab VARCHAR2, statid VARCHAR2 DEFAULT NULL, statown VARCHAR2 DEFAULT NULL)；从stattab标识的用户统计信息表中检索指定索引的统计信息并将其写回系统表中。"
  source_anchor: "3.12.2.20 IMPORT_INDEX_STATS 页2935-2936"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_import_index_example
  type: behavior_oracle
  statement: "IMPORT_INDEX_STATS示例基线：导入statid='idx_s1'的统计信息后，PG_CLASS中idx_t2_local_a恢复relpages 6/reltuples 6，PG_PARTITION中s1~s6_idx_a恢复relpages 1/reltuples 0。"
  source_anchor: "3.12.2.20 IMPORT_INDEX_STATS示例 页2937-2938"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_import_table
  type: syntax
  statement: "IMPORT_TABLE_STATS原型：DBE_STATS.IMPORT_TABLE_STATS(ownname VARCHAR2, tabname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab VARCHAR2, statid VARCHAR2 DEFAULT NULL, cascade BOOLEAN DEFAULT TRUE, statown VARCHAR2 DEFAULT NULL, no_invalidate BOOLEAN DEFAULT NULL, force BOOLEAN DEFAULT FALSE, stat_category VARCHAR2 DEFAULT NULL)；从stattab检索指定表的统计信息并写回系统表。"
  source_anchor: "3.12.2.20 IMPORT_TABLE_STATS 页2938-2939"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_import_force
  type: constraint
  statement: "IMPORT族force参数：force为是否强制导入、忽略锁的状态（默认false）；no_invalidate与stat_category暂不支持（IMPORT_TABLE/SCHEMA/DATABASE均适用）。"
  source_anchor: "3.12.2.20 IMPORT族参数说明 页2939-2944"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_import_column
  type: syntax
  statement: "IMPORT_COLUMN_STATS原型：DBE_STATS.IMPORT_COLUMN_STATS(ownname VARCHAR2, tabname VARCHAR2, colname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab VARCHAR2, statid VARCHAR2 DEFAULT NULL, statown VARCHAR2 DEFAULT NULL)；从stattab检索指定列（多列/表达式）的统计信息并写回系统表。"
  source_anchor: "3.12.2.20 IMPORT_COLUMN_STATS 页2939-2940"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_import_schema
  type: syntax
  statement: "IMPORT_SCHEMA_STATS原型：DBE_STATS.IMPORT_SCHEMA_STATS(ownname VARCHAR2, stattab VARCHAR2, statid VARCHAR2 DEFAULT NULL, statown VARCHAR2 DEFAULT NULL, no_invalidate BOOLEAN DEFAULT NULL, force BOOLEAN DEFAULT FALSE, stat_category VARCHAR2 DEFAULT NULL)；导入当前用户在指定schema下所有具有权限的表的统计信息（无权限表跳过不报错）。"
  source_anchor: "3.12.2.20 IMPORT_SCHEMA_STATS 页2943"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_import_database
  type: syntax
  statement: "IMPORT_DATABASE_STATS原型：DBE_STATS.IMPORT_DATABASE_STATS(stattab VARCHAR2, statid VARCHAR2 DEFAULT NULL, statown VARCHAR2 DEFAULT NULL, no_invalidate BOOLEAN DEFAULT NULL, force BOOLEAN DEFAULT FALSE, stat_category VARCHAR2 DEFAULT NULL)；从stattab检索当前database用户表的统计信息并写回系统表（导入当前用户在指定database下所有具有analyze权限的用户表，无权限跳过不报错）。"
  source_anchor: "3.12.2.20 IMPORT_DATABASE_STATS 页2944"
  source_refs: *refei
