- id: dbestats_wave8_165_statown_rule
  type: constraint
  statement: "statown与ownname空值规则：statown为存储统计信息用户表所在Schema的名称（设置为null会使用ownname参数的值，DATABASE版使用当前Schema）；当ownname或statown参数值设置为null时使用当前schema，需将behavior_compat_options参数值设置为bind_procedure_searchpath。"
  source_anchor: "3.12.2.20 EXPORT/IMPORT族参数说明 页2928-2944"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_export_import_pair
  type: syntax
  statement: "EXPORT与IMPORT对应关系：EXPORT_INDEX/TABLE/COLUMN/SCHEMA/DATABASE_STATS五个接口与IMPORT_INDEX/TABLE/COLUMN/SCHEMA/DATABASE_STATS五个接口一一对应——EXPORT将系统表统计信息写入用户统计信息表（stattab），IMPORT从stattab检索并写回系统表；statid为指向stattab中统计信息的可选标识符。"
  source_anchor: "3.12.2.20 EXPORT/IMPORT族接口 页2928-2944"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_cascade_semantics
  type: constraint
  statement: "cascade参数语义：EXPORT_TABLE_STATS与IMPORT_TABLE_STATS的cascade为是否一并导出/导入列、索引、多列和索引表达式的统计信息，默认为TRUE。"
  source_anchor: "3.12.2.20 EXPORT/IMPORT_TABLE_STATS参数说明 页2931与页2939"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_import_contents
  type: constraint
  statement: "IMPORT_TABLE_STATS导入内容：导入表的reltuples（numrows）、relpages（numblks）和relallvisible（relallvisible）三类统计信息；级联导入列级、索引级的统计信息参考IMPORT_INDEX_STATS和IMPORT_COLUMN_STATS接口。"
  source_anchor: "3.12.2.20 IMPORT_TABLE_STATS说明 页2939"
  source_refs: *refei
  status: confirmed
- id: dbestats_wave8_165_statid_optional
  type: syntax
  statement: "statid参数：指向stattab中统计信息的标识符（可选），EXPORT时写入、IMPORT时按statid检索对应批次统计信息。"
