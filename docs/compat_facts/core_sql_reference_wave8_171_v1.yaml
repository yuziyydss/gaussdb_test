  statement: "ITEM示例基线：map版GETATTRIBUTES(GETFIRSTCHILD(node))后item(map,0)输出cooking；list版nodelist长度4、item(nodelist,0)输出NOT NULL且buffer为<title lang=\"en\">Everyday Italian</title>。"
