- id: dbexmldom_wave8_171_getlength
  type: syntax
  statement: "GETLENGTH原型（双原型）：DBE_XMLDOM.GETLENGTH(nnm IN DOMNAMEDNODEMAP) RETURN NUMBER与GETLENGTH(nl IN DOMNODELIST) RETURN NUMBER；返回DOMNAMEDNODEMAP/DOMNODELIST类型节点中的节点数；示例bookstore元素attributes map长度输出2、students子节点nodelist长度输出NOTICE len : 2。"
  source_anchor: "3.12.2.23 GETLENGTH 页3011-3012"
  source_refs: &refxl
  - w8_171_3_12
  status: confirmed
- id: dbexmldom_wave8_171_getlocalname
  type: syntax
  statement: "GETLOCALNAME原型（三原型）：GETLOCALNAME(a IN DOMATTR) RETURN VARCHAR2、GETLOCALNAME(elem IN DOMELEMENT) RETURN VARCHAR2、GETLOCALNAME(n IN DOMNODE, data OUT VARCHAR2)存储过程形式；返回给定节点的本地名称；示例createAttribute('len')输出len、createElement('root')输出root、Element转Node后输出root。"
  source_anchor: "3.12.2.23 GETLOCALNAME 页3012-3013"
  source_refs: *refxl
  status: confirmed
- id: dbexmldom_wave8_171_getnameditem
  type: syntax
  statement: "GETNAMEDITEM原型（双原型）：GETNAMEDITEM(nnm IN DOMNAMEDNODEMAP, name IN VARCHAR2) RETURN DOMNODE与GETNAMEDITEM(nnm, name, ns IN VARCHAR2) RETURN DOMNODE（按名称和命名空间检索节点）；name和nnm可以输入NULL值但不可不入参；name和ns默认最大长度为32767超出报错；name和ns可输入int类型、长度可超出127位。"
  source_anchor: "3.12.2.23 GETNAMEDITEM 页3014"
  source_refs: *refxl
  status: confirmed
