- id: dbexmldom_wave8_171_importnode
  type: syntax
  statement: "IMPORTNODE原型：DBE_XMLDOM.IMPORTNODE(doc IN DOMDOCUMENT, importedNode IN DOMNODE, deep IN BOOLEAN) RETURN DOMNODE；将节点复制到另一节点中并将复制后的节点挂载到指定document；若被复制节点类型不属于xmldom constants规定的12种类型则直接抛出类型不支持异常；deep为TRUE导入该节点及其所有子节点、FALSE只导入节点本身；示例将doc2的case节点导入doc后WRITETOBUFFER输出合并后的XML（<case>LIANLI TU150</case>出现在bookstore内）。"
  source_anchor: "3.12.2.23 IMPORTNODE 页3020-3022"
  source_refs: *refxl
  status: confirmed
- id: dbexmldom_wave8_171_isnull
  type: syntax
  statement: "ISNULL：检测给定的节点是否为NULL（是返回TRUE否则返回FALSE），针对DOMATTR/DOMDOCUMENT/DOMELEMENT/DOMNODE等类型均有对应原型；示例对newdomdocument解析的doc判断输出not null。"
  source_anchor: "3.12.2.23 ISNULL 页3022-3024"
  source_refs: *refxl
  status: confirmed
- id: dbexmldom_wave8_171_item
  type: syntax
  statement: "ITEM原型（双原型）：ITEM(nl IN DOMNODELIST, index IN NUMBER) RETURN DOMNODE与ITEM(nnm IN DOMNAMEDNODEMAP, index IN NUMBER) RETURN DOMNODE；根据索引返回list或map中与索引对应的元素；map类型函数item对不合理的输入参数如bool、clob会默认指向第一个index的值。"
  source_anchor: "3.12.2.23 ITEM 页3023-3024"
  source_refs: *refxl
  status: confirmed
