  type: syntax
  statement: "MAKEELEMENT原型：DBE_XMLDOM.MAKEELEMENT(n IN DOMNODE) RETURN DOMELEMENT；返回转换后的DOMELEMENT对象（将DOMNODE强制转换回DOMELEMENT）；示例createElement('aaa')→makeNode→makeElement往返后GETNODENAME输出aaa。"
  source_anchor: "3.12.2.23 MAKEELEMENT 页3025"
  source_refs: *refxl
  status: confirmed
- id: dbexmldom_wave8_171_makenode
  type: syntax
  statement: "MAKENODE原型（四原型）：MAKENODE(a IN DOMATTR)/MAKENODE(doc IN DOMDOCUMENT)/MAKENODE(elem IN DOMELEMENT)/MAKENODE(t IN DOMTEXT)均RETURN DOMNODE；将给定对象强制转换为DOMNODE类型；语法限制——MAKENODE作为函数返回值时不能直接写return DBE_XMLDOM.MAKENODE(doc)，建议写为tmp_node := DBE_XMLDOM.MAKENODE(doc); return tmp_node。"
  source_anchor: "3.12.2.23 MAKENODE 页3025-3027"
