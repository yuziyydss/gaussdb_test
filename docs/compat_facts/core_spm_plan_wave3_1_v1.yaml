- id: spm_wave3_1_evolute_plan
  type: syntax
  statement: "GS_SPM_EVOLUTE_PLAN(sql_hash,plan_hash)属于DBE_SQL_UTIL schema，是SPM计划演进接口；输入SQL文本hash和计划outline文本hash，输出evolute_status boolean。"
  source_anchor: "1.6.28 页804-805"
  source_refs: &id001
  - w3_1_1_6_28
  status: confirmed
- id: spm_wave3_1_evolute_plan_precondition
  type: constraint
  statement: "GS_SPM_EVOLUTE_PLAN只要计划基线相关的表存在，就可以对该计划基线进行演进；演进行为正常完成返回t，异常会报错。"
  source_anchor: "1.6.28 页805"
  source_refs: *id001
  status: confirmed
- id: spm_wave3_1_set_plan_status
  type: syntax
  statement: "GS_SPM_SET_PLAN_STATUS(sql_hash,plan_hash,plan_status)属于DBE_SQL_UTIL schema，用于修改baseline状态；输入SQL文本hash、计划outline文本hash和计划状态，输出execute_status boolean。"
  source_anchor: "1.6.28 页805-806"
  source_refs: *id001
  status: confirmed
- id: spm_wave3_1_set_plan_status_effect
  type: behavior_oracle
  statement: "GS_SPM_SET_PLAN_STATUS生效时会同步刷新gs_spm_baseline表中的invalid字段为false；plan_status支持ACC、UNACC和FIXED，FIXED是特殊ACC状态且匹配优先级高于ACC。"
  source_anchor: "1.6.28 页805-806"
  source_refs: *id001
  status: confirmed
- id: spm_wave3_1_display_plans
  type: syntax
  statement: "GS_SPM_DISPLAY_PLANS(sql_hash)属于DBE_SQL_UTIL schema，用于查看单条SQL所有baseline；输入SQL唯一标识，输出sql_hash、plan_id、outline、cost、status、gplan和namespace_oids。"
  source_anchor: "1.6.28 页806-807"
  source_refs: *id001
  status: confirmed
- id: spm_wave3_1_display_plans_status
  type: behavior_oracle
  statement: "GS_SPM_DISPLAY_PLANS的status支持ACC、UNACC和FIXED；gplan为t表示当前计划是gplan，异常会报错。"
  source_anchor: "1.6.28 页806"
  source_refs: *id001
  status: confirmed
- id: spm_wave3_1_display_plans_namespace
  type: constraint
  statement: "GS_SPM_DISPLAY_PLANS输出的namespace_oids是当前search_path中的OID列表，OID满足用户拥有权限的Schema、存在的Schema或非本地临时表所在Schema。"
  source_anchor: "1.6.28 页807"
  source_refs: *id001
  status: confirmed
- id: spm_wave3_1_reload_plan
  type: syntax
  statement: "GS_SPM_RELOAD_PLAN(sql_hash,plan_id)属于DBE_SQL_UTIL schema，用于把baseline系统表中的某个baseline加载到SPM global cache；执行正常返回t，异常会报错。"
  source_anchor: "1.6.28 页807-808"
  source_refs: *id001
  status: confirmed
- id: spm_wave3_1_validate_plan
  type: behavior_oracle
  statement: "GS_SPM_VALIDATE_PLAN(sql_hash,plan_hash)属于DBE_SQL_UTIL schema，用于计划可用性验证；execute_status为t表示计划可用，f表示计划不可用。"
  source_anchor: "1.6.28 页808"
  source_refs: *id001
  status: confirmed
- id: spm_wave3_1_delete_plan
  type: syntax
  statement: "GS_SPM_DELETE_PLAN(sql_hash,plan_hash)属于DBE_SQL_UTIL schema，用于删除baseline；执行正常返回t，异常会报错。"
  source_anchor: "1.6.28 页808-809"
  source_refs: *id001
  status: confirmed
- id: spm_wave3_1_delete_plan_abort_risk
  type: constraint
  statement: "GS_SPM_DELETE_PLAN执行期间异常中止时，可能导致gs_spm_baseline表中记录数超出GUC参数spm_plan_capture_max_plannum指定的数量。"
  source_anchor: "1.6.28 页808"
  source_refs: *id001
  status: confirmed
