facts:
- id: sp_wave8_140_basics_overview
  type: syntax
  statement: "PL/SQL基本语句涵盖定义变量、赋值语句、调用语句以及返回语句；避免在存储过程中调用包含密码的SQL语句（存储在数据库中的存储过程文本可能被其他具有访问权限的用户查看导致密码泄露），存储过程包含其他敏感信息时建议配置存储过程的访问权限。"
  source_anchor: "3.6 基本语句 页2585"
  source_refs: &refb6
  - w8_140_3_6
  status: confirmed
- id: sp_wave8_140_var_declare
  type: syntax
  statement: "变量声明：variable_name type（可给定初始值value）；不给定初始值则初始为NULL，value也可以是表达式；变量类型除支持基本类型外，还可以使用%TYPE和%ROWTYPE声明与其他表字段或表结构本身相关的变量。"
  source_anchor: "3.6.1 定义变量 页2586"
  source_refs: *refb6
  status: confirmed
- id: sp_wave8_140_type_rowtype_attrs
  type: syntax
  statement: "%TYPE与%ROWTYPE属性：%TYPE主要用于声明与某个其他变量类型（例如表中某列类型）相同的变量（如my_name employee.firstname%TYPE），优势是无需预先知道列的数据类型、列类型变化时无需修改变量定义，也可引用record成员类型（my_id my_employee.id%TYPE）与%TYPE链式引用；%ROWTYPE声明一组数据的类型，存储表中的一行数据或从游标匹配的结果（my_employee employee%ROWTYPE），同样可用在cursor上（cur%ROWTYPE、cur.firstname%TYPE），对于PACKAGE中定义的cursor可以省略%ROWTYPE。"
  source_anchor: "3.6.1 %TYPE/%ROWTYPE属性 页2586-2588"
  source_refs: *refb6
  status: confirmed
- id: sp_wave8_140_type_rowtype_limits
  type: constraint
  statement: "%TYPE/%ROWTYPE限制：%TYPE仅支持引用跨PACKAGE的record类型的变量、不支持引用cursor变量的某列类型（开启behavior_compat_options含allow_procedure_compile_check后%TYPE可支持引用cursor变量某列类型）；%ROWTYPE不支持引用复合类型或RECORD类型变量的类型；不支持非PACKAGE的record变量%TYPE作为变量类型或出入参类型；不支持view%ROWTYPE、SCHEMA.view%ROWTYPE作为出入参类型；不支持PACKAGE.record变量%TYPE、SCHEMA.PACKAGE.record变量%TYPE作为出入参类型；不支持表/视图.column.column%TYPE等嵌套1层及以上作为变量类型或出入参类型；不支持record变量.column.column%TYPE等嵌套1层及以上；不支持PACKAGE.cursor变量%ROWTYPE、SCHEMA.PACKAGE.cursor变量%ROWTYPE等更多级cursor变量作为参数类型或出入参类型。"
  source_anchor: "3.6.1 %TYPE/%ROWTYPE须知 页2588"
  source_refs: *refb6
  status: confirmed
- id: sp_wave8_140_var_scope
  type: constraint
  statement: "变量作用域：变量必须在DECLARE部分声明（必须建立BEGIN…END块结构，强制先声明后使用，变量在过程中具有不同作用域与生存期）；同一变量在不同作用域内可重复定义，内层作用域的定义会覆盖外层作用域的定义；外部块中定义的变量可在嵌套块中使用，但嵌套块的变量无法被外部块访问；示例基线：内层emp_id=7799覆盖外层、嵌套块引用outer_var=6688、外层emp_id=7788。"
  source_anchor: "3.6.1 变量作用域 页2588-2589"
  source_refs: *refb6
  status: confirmed
- id: sp_wave8_140_assignment_syntax
  type: syntax
  statement: "赋值语句：variable_name := value（value可以是值或表达式，类型需与变量类型兼容才能正确赋值）；嵌套赋值支持列引用与数组下标（subscript针对数组变量使用、可以是值或表达式且类型必须为INT，如emp_id(1).a := 5）；开启behavior_compat_options='proc_outparam_override'后赋值语句的value不支持返回类型为复合类型或数组类型的重载函数以引用字段的形式调用（如func(x).a或func(x)[1]）；INTO方式赋值仅支持对第一层列赋值，且不支持二维及以上数组。"
  source_anchor: "3.6.2 赋值语句/嵌套赋值 页2589-2590"
  source_refs: *refb6
  status: confirmed
- id: sp_wave8_140_select_into_syntax
  type: syntax
  statement: "INTO/BULK COLLECT INTO语法：SELECT select_expressions INTO [STRICT] target FROM ...；SELECT INTO [STRICT] target [FROM ..]；EXECUTE [IMMEDIATE] select_expressions BULK COLLECT INTO target ...；将存储过程内语句返回的值存储到变量内，BULK COLLECT INTO支持将部分或全部返回值临时存储至数组中，支持返回空结果集。"
  source_anchor: "3.6.2 INTO/BULK COLLECT INTO 语法格式 页2590-2591"
  source_refs: *refb6
  status: confirmed
- id: sp_wave8_140_select_into_limits
  type: constraint
  statement: "INTO/BULK COLLECT INTO限制：STRICT在开启select_into_return_null（默认未开启）前提下指定时查询必须返回一行非空结果，否则报NO_DATA_FOUND（没有行）、TOO_MANY_ROWS（多于一行）或QUERY_RETURNED_NO_ROWS（没有数据返回），不指定则无该限定且支持返回空结果集；BULK COLLECT INTO只支持批量赋值给数组或集合（集合合理使用LIMIT子句避免操作过多数据导致性能下降）；INTO/BULK COLLECT INTO只支持4层以下Record类型直接嵌套；返回空结果集需GUC behavior_compat_options='select_into_return_null'（置''关闭）；数组变量的小括号()优先识别为下标，带括号表达式不支持写在数组变量后面（如select (1+3) into va(5)不支持写为select into va(5) (1+3)）；INSERT INTO、UPDATE INTO、DELETE INTO和EXECUTION INTO不支持返回空结果集；给多个变量赋值时后面变量存在语法错误则均不赋值；BULK COLLECT INTO只支持A兼容性数据库；IMMEDIATE关键字仅用作语法兼容无实际意义；SELECT INTO输出变量个数大于查询结果列数时多出变量赋空值不报错。"
  source_anchor: "3.6.2 INTO/BULK COLLECT INTO 须知/说明 页2590-2591"
  source_refs: *refb6
  status: confirmed
- id: sp_wave8_140_select_into_examples
  type: behavior_oracle
  statement: "INTO示例基线：select id into my_id from customers limit 1赋值；select id bulk collect into id_arr from customers order by id DESC limit 20批量赋值；SELECT INTO b FROM test WHERE a=1在无行时返回空结果集（check_test()输出1，空结果集场景）；EXECUTE IMMEDIATE sql_qry BULK COLLECT INTO id_arr动态批量赋值。"
  source_anchor: "3.6.2 INTO示例 页2591-2592"
  source_refs: *refb6
  status: confirmed
- id: sp_wave8_140_call_return
  type: syntax
  statement: "调用语句与返回语句：调用语句CALL/直接引用procedure_name(parameter)（parameter可以没有或有多个参数）；示例基线：proc_staffs通过SELECT sum(salary),count(*) INTO两个out参数聚合，proc_return中proc_staffs(30, v_sum, v_num)调用后dbe_output输出30#2.00并以RETURN返回，CALL proc_return()输出30#2.00。"
  source_anchor: "3.6.3 调用语句 页2592-2593"
  source_refs: *refb6
  status: confirmed
- id: sp_wave8_140_dynamic_query_overview
  type: syntax
  statement: "动态查询两种方式：使用EXECUTE IMMEDIATE（动态执行SELECT语句）或OPEN FOR（结合游标使用，需要将查询结果保存在一个数据集用于提取时使用）；define_variable用于指定存放查询结果的变量；USING IN bind_argument指定存放传递给动态SQL值的变量（dynamic_select_string中存在占位符时使用）；USING OUT bind_argument指定存放动态SQL返回值的变量。"
  source_anchor: "3.7.1 执行动态查询语句 页2593-2594"
  source_refs: &refb7
  - w8_140_3_7
  status: confirmed
- id: sp_wave8_140_execute_immediate_limits
  type: constraint
  statement: "EXECUTE IMMEDIATE查询须知：查询语句中into和out不能同时存在；占位符命名以:开始、后面可跟数字、字符或字符串（不能使用带引号的数字、字符或字符串），与USING子句bind_argument一一对应；bind_argument只能是值、变量或表达式，不能是表名、列名和数据类型等数据库对象（需传递数据库对象构造动态SQL时建议采用连接运算符||拼接）；动态PL/SQL块允许出现重复占位符，默认相同占位符只能与USING子句的一个bind_argument按位置对应，设置behavior_compat_options='dynamic_sql_compat'时按占位符顺序依次匹配、重复占位符不再识别为同一个；IMMEDIATE关键字仅用作语法兼容无实际意义。"
  source_anchor: "3.7.1 EXECUTE IMMEDIATE须知 页2594"
  source_refs: *refb7
  status: confirmed
- id: sp_wave8_140_execute_immediate_examples
  type: behavior_oracle
  statement: "EXECUTE IMMEDIATE查询示例基线：EXECUTE IMMEDIATE 'select count(*) from hr.staffs' INTO staff_count输出3；dynamic_proc执行'select first_name, salary from hr.staffs where staff_id = :1' INTO first_name, salary USING IN staff_id，CALL dynamic_proc()输出mike 5800.00。"
  source_anchor: "3.7.1 EXECUTE IMMEDIATE示例 页2594-2595"
  source_refs: *refb7
  status: confirmed
- id: sp_wave8_140_open_for
  type: syntax
  statement: "OPEN FOR动态查询：OPEN cursor_name FOR dynamic_string [USING value]打开动态游标执行动态查询（cursor_name为要打开的游标名，dynamic_string为动态查询语句，USING value在dynamic_string中存在占位符时使用）；示例基线：hr.staffs上OPEN cur FOR sqlstr USING后FETCH提取name/phone_number/salary。"
  source_anchor: "3.7.1 OPEN FOR 页2595-2597"
  source_refs: *refb7
  status: confirmed
- id: sp_wave8_140_dynamic_noselect
  type: constraint
  statement: "执行动态非查询语句：EXECUTE IMMEDIATE动态执行INSERT等非查询语句，USING IN bind_argument在dynamic_noselect_string存在占位符时替换对应占位符；bind_argument只能是值、变量或表达式，不能是表名、列名和数据类型等数据库对象（执行DDL需要传递数据库对象时建议||拼接）；动态语句允许重复占位符，相同占位符只能与唯一一个bind_argument按位置一一对应，开dynamic_sql_compat时按占位符顺序依次匹配（占位符名不能使用带引号的数字、字符或字符串）；示例基线：insert into sections_t1 values(:1,:2,:3,:4) USING四参数插入，重复占位符insert values(:1,:2,:3,:1)使place_id列填入:1的值280，alter table rename用||拼接new_colname成功。"
  source_anchor: "3.7.2 执行动态非查询语句 页2596-2597"
  source_refs: *refb7
  status: confirmed
- id: sp_wave8_140_dynamic_call_proc
  type: syntax
  statement: "动态调用存储过程：必须使用匿名语句块将存储过程或语句块包在里面，使用EXECUTE IMMEDIATE…USING语句后面带IN、OUT来输入和输出参数；语法CALL procedure_name(:placeholder1, :placeholder2, …)，占位符个数与参数个数相同且占位符名不能使用带引号的数字、字符或字符串；USING [IN|OUT|IN OUT] bind_argument的修饰符与对应参数的修饰符一致；不支持调用存储过程时使用=>跳过参数进行调用。"
  source_anchor: "3.7.3 动态调用存储过程 页2597-2598"
  source_refs: *refb7
  status: confirmed
- id: sp_wave8_140_dynamic_call_proc_example
  type: behavior_oracle
  statement: "动态调用存储过程示例基线：proc_add(param1 in, param2 out, param3 in)计算param2=param1+param3，statement := 'call proc_add(:col_1, :col_2, :col_3)'后EXECUTE IMMEDIATE statement USING IN input1, OUT param2, IN input2输出result is: 3。"
  source_anchor: "3.7.3 动态调用存储过程示例 页2598-2599"
  source_refs: *refb7
  status: confirmed
- id: sp_wave8_140_dynamic_call_anonymous
  type: syntax
  statement: "动态调用匿名块：在动态语句中执行匿名块，使用EXECUTE IMMEDIATE…USING语句后面带IN、OUT来输入、输出参数；匿名块程序实施部分以BEGIN开始以END结束；USING [IN|OUT|IN OUT] bind_argument的修饰符与对应参数的修饰符一致；匿名块中间的输入输出参数使用占位符指明，要求占位符个数与参数个数相同且占位符所对应参数的顺序和USING中参数的顺序一致。"
  source_anchor: "3.7.4 动态调用匿名块 页2599-2600"
  source_refs: *refb7
  status: confirmed
- id: sp_wave8_140_dynamic_anonymous_limits
  type: constraint
  statement: "动态匿名块绑定参数限制：仅支持匿名块中调用SQL语句和存储过程时绑定参数（匿名块中使用表达式以及cursor等、匿名块中嵌套调用动态语句等其余场景皆不支持）；不支持匿名块中SELECT INTO语句调用含有出参的FUNCTION/PROCEDURE时绑定出参；不支持匿名块绑定复合类型的出参；不支持同一条语句同时使用匿名块内声明的变量和绑定参数；不支持绑定参数时使用PERFORM关键字调用存储过程；调用存储过程时仅支持绑定参数直接作为出入参、不支持表达式形式（如1+:va），并且占位符名不能使用带引号的数字、字符或字符串；绑定入参类型为refcursor时存储过程内的修改与入参相互隔离；打开dynamic_sql_check参数时占位符个数与参数个数一致时使用同名占位符作为匿名块参数会报错，需修改为不同名参数。"
  source_anchor: "3.7.4 动态调用匿名块须知 页2600"
  source_refs: *refb7
  status: confirmed
- id: sp_wave8_140_dynamic_anonymous_examples
  type: behavior_oracle
  statement: "动态匿名块示例基线：EXECUTE IMMEDIATE 'begin select first_name, salary into :first_name, :salary from hr.staffs where staff_id= :dno; end;' USING OUT first_name, OUT salary, IN staff_id输出mike 5800.00；重载package过程EXECUTE IMMEDIATE 'begin pkg1.plus(:1, :2, :3); end;' USING var1, var2, out var3输出var3: 4；开dynamic_sql_check后同名占位符'begin test_proc_exception001(:1,:2,:1); end;'报The numbers of parameters do not match in Dynamic SQL, expected number of parameters : 3, actual number of SQL parameters : 2，改为不同名占位符(:1,:2,:3)后执行成功。"
  source_anchor: "3.7.4 动态调用匿名块示例 页2600-2602"
  source_refs: *refb7
  status: confirmed
open_questions:
- id: sp_basic_wave8_140_oq_runtime
  content: "STRICT与select_into_return_null组合下NO_DATA_FOUND/TOO_MANY_ROWS/QUERY_RETURNED_NO_ROWS的完整判定、dynamic_sql_compat与dynamic_sql_check在重复/同名占位符场景的叠加行为、refcursor绑定入参的隔离边界需授权环境实机验证。"
  status: open
