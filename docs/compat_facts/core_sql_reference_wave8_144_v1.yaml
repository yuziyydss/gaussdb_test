- id: pkgutil_wave8_144_file_set_dirname
  type: constraint
  statement: "FILE_SET_DIRNAME(dir IN TEXT) RETURN BOOL：设置当前操作的目录，基本上所有涉及单个目录的操作都需要先调用此方法设置操作的目录；文件目录的位置需要添加到系统表PG_DIRECTORY中，如果传入的路径和PG_DIRECTORY中的路径不匹配会报路径不存在的错误（下面涉及location作为参数的函数同样适用）。"
  source_anchor: "3.12.1.2 FILE_SET_DIRNAME 页2670-2671"
  source_refs: *refpr
  status: confirmed
- id: pkgutil_wave8_144_file_open
  type: syntax
  statement: "FILE_OPEN原型：PKG_UTIL.FILE_OPEN(file_name IN TEXT, open_mode IN INTEGER)；用来打开一个文件，最多可以同时打开50个文件，并返回INTEGER类型句柄；file_name包含扩展（文件类型）不包括路径名（文件名中包含路径时在OPEN中会被忽略，Unix系统中文件名不能以/.结尾）；open_mode包含r: read text、w: write text和a: append text；对于写操作会检测文件类型，如果写入elf文件将会报错并退出。"
  source_anchor: "3.12.1.2 FILE_OPEN 页2671"
  source_refs: *refpr
  status: confirmed
- id: pkgutil_wave8_144_file_set_max_line_size
  type: syntax
  statement: "FILE_SET_MAX_LINE_SIZE原型：PKG_UTIL.FILE_SET_MAX_LINE_SIZE(max_line_size in INTEGER) RETURN BOOL；设置写入文件一行的最大长度；每行最大字符数包含换行符（最小值1、最大值32767），没有指定时会指定默认值1024。"
  source_anchor: "3.12.1.2 FILE_SET_MAX_LINE_SIZE 页2671-2672"
