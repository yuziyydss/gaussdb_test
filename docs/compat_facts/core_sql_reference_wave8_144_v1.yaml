- id: pkgutil_wave8_144_file_raw_io
  type: syntax
  statement: "二进制读写：FILE_READ_RAW(file IN INTEGER, length IN INTEGER DEFAULT NULL) RETURN raw从一个打开的文件句柄中读取指定长度的二进制数据（默认读取文件中所有数据、最大为1G）；FILE_WRITE_RAW(file IN INTEGER, r IN RAW) RETURN BOOL向一个打开的文件中写入传入二进制对象RAW、插入成功返回true（写操作检测文件类型，写elf文件报错并退出）。"
