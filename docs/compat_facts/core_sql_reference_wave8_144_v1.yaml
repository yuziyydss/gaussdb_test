- id: pkgutil_wave8_144_safety_constraints
  type: constraint
  statement: "PKG_UTIL安全与路径约束：建议不要在安全场景下使用PKG_UTIL.RANDOM_SET_SEED和PKG_UTIL.RANDOM_GET_VALUE函数；文件目录位置需要添加到系统表PG_DIRECTORY中，传入路径与PG_DIRECTORY中的路径不匹配会报路径不存在的错误；在打开guc参数safe_data_path时，用户只能通过高级包操作safe_data_path指定文件路径下的文件。"
