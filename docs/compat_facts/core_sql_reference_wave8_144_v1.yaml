  statement: "文件位置控制：FILE_GETPOS(file IN INTEGER) RETURN BIGINT返回文件的偏移量（单位字节）；FILE_SEEK(file IN INTEGER, start IN BIGINT) RETURN VOID根据用户指定的字节数向前或者向后调整文件指针的位置；FILE_CLOSE_ALL() RETURN VOID关闭一个会话中打开的所有的文件句柄（该函数无入参、出参）。"
