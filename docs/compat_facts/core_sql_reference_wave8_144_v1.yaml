  source_anchor: "3.12.1.2 FILE_READLINE 页2673"
  source_refs: *refpr
  status: confirmed
- id: pkgutil_wave8_144_file_write
  type: constraint
  statement: "FILE_WRITE(file IN INTEGER, buffer IN TEXT) RETURN BOOL：将BUFFER中指定的数据写入到文件中；BUFFER最大值是32767个字节（没有指定值默认1024字节），没有刷新到文件之前一系列PUT操作的BUFFER总和不能超过32767个字节；对于写操作会检测文件类型，如果写入elf文件将会报错并退出。"
  source_anchor: "3.12.1.2 FILE_WRITE 页2673-2674"
  source_refs: *refpr
  status: confirmed
