- id: pkgutil_wave8_144_file_flush_close
  type: syntax
  statement: "FILE_FLUSH与FILE_CLOSE：FILE_FLUSH(file IN INTEGER) RETURN VOID将文件句柄缓冲区中的数据写入到物理文件中（缓冲区中的数据必须要有一个行终结符；当文件必须在打开时读取刷新非常有用，例如调试信息可以刷新到文件中以便立即读取）；FILE_CLOSE(file IN INTEGER) RETURN BOOL关闭一个打开的文件句柄。"
