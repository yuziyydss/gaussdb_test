  statement: "CREATE CAST三种转换形式、全密态CMK/CEK多级加密（各KEY_STORE与算法组合约束）和CREATE CONVERSION编码转换在真实驱动配置、权限和密钥服务场景下的完整行为与错误矩阵需授权环境实机验证。"
