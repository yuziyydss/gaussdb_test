facts:
- id: explain_wave8_74_purpose
  type: syntax
  statement: "EXPLAIN显示SQL语句的执行计划，主要包括：显示SQL语句所引用的表的扫描方式（如简单的顺序扫描或索引扫描等）；如果SQL语句引用多个表，执行计划还会显示多表之间的JOIN方式。"
  source_anchor: "1.13.11.5 功能描述 页1708"
  source_refs: &refexplain
  - w8_74_1_13_11_5
  status: confirmed
- id: explain_wave8_74_analyze_note
  type: constraint
  statement: "执行计划的最主要指标是SQL语句的预计执行开销（计划生成器估算执行时间的度量）；指定ANALYZE选项时SQL语句将被执行并按实际运行结果显示统计数据（每个计划节点的时间总开销毫秒数和实际返回总行数），用于判断估计值是否接近实际值；需分析INSERT、UPDATE、DELETE、CREATE TABLE AS或EXECUTE语句但不希望改动数据时使用START TRANSACTION; EXPLAIN ANALYZE ...; ROLLBACK；使用EXPLAIN查看执行计划时，审计日志记录的审计类型由分析的具体SQL决定。"
  source_anchor: "1.13.11.5 注意事项 页1708"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_syntax
  type: syntax
  statement: "两种语法：EXPLAIN [(option[, ...])] statement（支持多种选项且对选项顺序无要求）和EXPLAIN {[ANALYZE | ANALYSE] [VERBOSE] | PERFORMANCE} statement（按顺序给出选项）；option子句包括ANALYZE [boolean]、ANALYSE [boolean]、VERBOSE [boolean]、COSTS [boolean]、CPU [boolean]、DETAIL [boolean]、BUFFERS [boolean]、TIMING [boolean]、PLAN [boolean]、BLOCKNAME [boolean]、OUTLINE [boolean]、ADAPTCOST [boolean]、FORMAT {TEXT | XML | JSON | YAML}、OPTEVAL [boolean]。"
  source_anchor: "1.13.11.5 语法格式 页1709-1710"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_analyze_opt
  type: constraint
  statement: "ANALYZE boolean | ANALYSE boolean显示实际运行时间和其他统计数据；两个参数同时使用时，在option中排在后面的一个生效；TRUE（缺省值）显示，FALSE不显示。"
  source_anchor: "1.13.11.5 参数说明 ANALYZE 页1710-1711"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_verbose_costs
  type: constraint
  statement: "VERBOSE boolean显示有关计划的额外信息（TRUE缺省显示，FALSE不显示）；COSTS boolean包括每个规划节点的估计总成本以及估计的行数和每行的宽度（TRUE缺省显示，FALSE不显示）。"
  source_anchor: "1.13.11.5 参数说明 VERBOSE/COSTS 页1711"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_cpu_detail_buffers_timing
  type: constraint
  statement: "四个需结合ANALYZE或ANALYSE选项使用的选项：CPU boolean打印CPU使用情况（TRUE缺省显示）；DETAIL boolean打印数据库节点上的信息（TRUE缺省打印）；BUFFERS boolean包括缓冲区使用情况（FALSE缺省不显示，TRUE显示）；TIMING boolean包括实际启动时间和花费在输出节点上的时间信息（TRUE缺省显示）。"
  source_anchor: "1.13.11.5 参数说明 CPU/DETAIL/BUFFERS/TIMING 页1711"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_plan_opt
  type: constraint
  statement: "PLAN boolean表示是否将执行计划存储在plan_table中：开启时执行计划存储在plan_table、不打印到当前屏幕（ON缺省，执行成功返回EXPLAIN SUCCESS）；OFF不存储执行计划、将计划打印到当前屏幕；该选项为on时不能与其他选项同时使用。"
  source_anchor: "1.13.11.5 参数说明 PLAN 页1711-1712"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_blockname_outline
  type: constraint
  statement: "BLOCKNAME boolean是否显示计划每个操作所处的查询块（TRUE缺省：将查询块名字输出在新增列Query Block列上，方便使用Hint修改执行计划，需在pretty模式下使用）；OUTLINE boolean是否显示计划的Outline Hint信息（ON显示在计划下方，需pretty模式；OFF缺省不显示）。"
  source_anchor: "1.13.11.5 参数说明 BLOCKNAME/OUTLINE 页1712"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_adaptcost
  type: constraint
  statement: "ADAPTCOST boolean在Normal模式下显示计划的基数估计方式信息，使用智能计划管理时还会输出计划选择情况（计划类型及选择原因；部分索引和包含子查询场景下aplan可能失效，输出计划为aplan、参数为实际值、实际执行计划为cplan）；ON（缺省）在计划节点上展示基数估计方式（含默认方式和反馈方式，不对预备语句生效）；OFF不展示。"
  source_anchor: "1.13.11.5 参数说明 ADAPTCOST 页1712"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_format_performance
  type: constraint
  statement: "FORMAT指定输出格式，取值TEXT、XML、JSON和YAML，默认TEXT；PERFORMANCE选项打印执行中的所有相关信息，部分字段：ex c/r平均每行使用CPU周期数（=ex cyc/ex row）、ex row执行行数、ex cyc使用的CPU周期数、inc cyc包含子节点使用的总CPU周期数、shared hit算子share buffer命中情况、loops算子循环执行次数、total_calls生成元素总数、deserialize time反序列化所需时间、estimated time估计时间。"
  source_anchor: "1.13.11.5 参数说明 FORMAT/PERFORMANCE 页1712"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_opteval
  type: constraint
  statement: "OPTEVAL boolean是否显示SCAN算子（当前仅支持seqscan、indexscan、indexonlyscan、bitmapheapscan）的代价淘汰明细；开启时在执行计划中显示名为Cost Evaluation Info (identified by plan id)的计划块，该选项仅可以和COSTS、VERBOSE、FORMAT三个选项共存；TRUE显示，FALSE（缺省）不显示。"
  source_anchor: "1.13.11.5 参数说明 OPTEVAL 页1712-1713"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_example
  type: behavior_oracle
  statement: "示例（SET explain_perf_mode=normal）：EXPLAIN SELECT显示Seq Scan on customer_address_p1 (cost=0.00..25.13 rows=1513 width=24)；ANALYZE增加actual time和Total runtime: 0.108 ms；(ANALYZE,CPU)输出CPU信息行；FORMAT JSON/YAML输出结构化计划（Node Type、Relation Name、Startup/Total Cost、Plan Rows/Width等）；COSTS FALSE隐藏开销估计；带聚集函数查询显示Aggregate节点。"
  source_anchor: "1.13.11.5 示例1 页1713-1715"
  source_refs: *refexplain
  status: confirmed
- id: explain_wave8_74_partition_opteval_example
  type: behavior_oracle
  statement: "二级分区表示例：Iterations和Sub Iterations分别标识遍历的一级分区和二级分区数；Selected Partitions标识哪些一级分区被实际扫描；Selected Subpartitions: (p:s)标识第p个一级分区下s个二级分区被实际扫描（一级分区下所有二级分区都被扫描时s显示为ALL）；示例2中EXPLAIN (OPTEVAL on)对tb_a、tb_b连接查询显示代价淘汰明细。"
  source_anchor: "1.13.11.5 示例1/2 页1714-1715"
  source_refs: *refexplain
  status: confirmed
- id: explain_plan_wave8_74_purpose
  type: syntax
  statement: "EXPLAIN PLAN命令将查询执行的计划信息存储于PLAN_TABLE表中；与EXPLAIN命令不同的是，EXPLAIN PLAN仅将计划信息进行存储，而不会打印到屏幕。"
  source_anchor: "1.13.11.6 功能描述 页1715"
  source_refs: &refplan
  - w8_74_1_13_11_6
  status: confirmed
- id: explain_plan_wave8_74_notes
  type: constraint
  statement: "数据库节点对于执行错误的SQL无法进行计划信息的收集；PLAN_TABLE中的数据是session级生命周期并且session隔离和用户隔离，用户只能看到当前session、当前用户的数据；EXPLAIN中的PLAN选项表示需要将计划信息存储于PLAN_TABLE中，存储成功将返回EXPLAIN SUCCESS；STATEMENT_ID用户可对查询设置标签并存储于PLAN_TABLE；执行EXPLAIN PLAN后计划信息自动存储于PLAN_TABLE，不支持对PLAN_TABLE进行INSERT、UPDATE、ANALYZE等操作。"
  source_anchor: "1.13.11.6 注意事项 页1715-1716"
  source_refs: *refplan
  status: confirmed
- id: explain_plan_wave8_74_syntax
  type: syntax
  statement: "语法为EXPLAIN PLAN [SET STATEMENT_ID = name] FOR statement；name为查询标签（字符串），未进行SET STATEMENT_ID时默认为空值；可输入的STATEMENT_ID最大长度为30个字节，超过长度将会产生报错；statement为指定要分析的SQL语句。"
  source_anchor: "1.13.11.6 语法格式/参数说明 页1716"
  source_refs: *refplan
  status: confirmed
- id: explain_plan_wave8_74_example
  type: behavior_oracle
  statement: "示例中EXPLAIN PLAN SET STATEMENT_ID = 'TPCH-Q4' FOR SELECT ...存储计划后SELECT * FROM plan_table查询，DELETE FROM plan_table WHERE STATEMENT_ID = 'TPCH-Q4'清理数据。"
  source_anchor: "1.13.11.6 示例 页1716"
  source_refs: *refplan
  status: confirmed
- id: explain_autohint_wave8_74_purpose
  type: syntax
  statement: "EXPLAIN AUTOHINT用于在正常执行EXPLAIN命令的同时将查询执行的计划信息与执行结果存储于AUTOHINT内存上下文中，以便进行AUTOHINT特性的HINT探索与推荐。"
  source_anchor: "1.13.11.7 功能描述 页1716"
  source_refs: &refautohint
  - w8_74_1_13_11_7
  status: confirmed
- id: explain_autohint_wave8_74_notes
  type: constraint
  statement: "该语句只允许在AUTOHINT任务进行时由内核进行自动调用，用户自行调用无任何效果或可能触发AUTOHINT的报错阻拦；AUTOHINT内存上下文中存储的数据是session级生命周期并且session隔离和用户隔离，当前session下调用的AUTOHINT特性功能用户只能访问并调用当前session、当前用户的数据。"
  source_anchor: "1.13.11.7 注意事项 页1716"
  source_refs: *refautohint
  status: confirmed
- id: explain_autohint_wave8_74_syntax
  type: syntax
  statement: "语法为EXPLAIN AUTOHINT cache_id exec_type argument FOR statement；statement为需要存储计划与执行结果的SQL语句（仅支持SELECT语句）；cache_id为AUTOHINT任务ID（int型）；exec_type取值PLAN（存储计划信息，argument为当前语句所应用的HINT）或EXECUTE（存储执行结果信息，argument为当前语句对应执行计划的HASH值）；argument为json格式文本；示例中用户直接执行无效返回(0 rows)并被报错阻拦ERROR: Can not get exploration cache for cache id: 2.。"
  source_anchor: "1.13.11.7 语法格式/参数说明/示例 页1717"
  source_refs: *refautohint
  status: confirmed
open_questions:
- id: explain_wave8_74_oq_runtime
  statement: "EXPLAIN各选项组合、PLAN_TABLE存储与AUTOHINT内核调用路径在真实查询和智能计划管理场景下的完整行为与错误矩阵需授权环境实机验证。"
  status: open
