facts:
- id: mcompat_wave8_189_func_overview
  type: syntax
  statement: "M-Compatibility模式系统函数概述：GaussDB兼容绝大多数MySQL系统函数但存在部分差异；建议使用M-Compatibility兼容模式下支持的系统函数避免使用原GaussDB的系统函数；同名函数处理——部分提示不支持（isEmpty/overlaps/point等）、部分保持原GaussDB行为（ceil/decode/encode/format/instr/position/round/stddev/row_number/regexp_instr/regexp_like/regexp_replace/regexp_substr/current_user等）。"
  source_anchor: "4.4.2.2.1 系统函数兼容性概述 页3331-3332"
  source_refs: &refmf
  - w8_189_4_4_2
  status: confirmed
- id: mcompat_wave8_189_conflict_funcs
  type: constraint
  statement: "同名函数GUC控制：m_format_dev_version≥s2且m_format_behavior_compat_options包含enable_conflict_funcs时，ceil/format/instr/position/row_number的同名函数行为修改为M-Compatibility兼容模式行为；包含enable_samename_funcs时，stddev/round/current_user的同名函数行为同样修改。"
  source_anchor: "4.4.2.2.1 表4-141/4-142 页3332"
  source_refs: *refmf
  status: confirmed
- id: mcompat_wave8_189_func_common_diff
  type: constraint
  statement: "M-Compatibility系统函数公共差异：返回值类型仅考虑入参为Var（表数据）和Const（常量）时与MySQL一致（运算表达式/函数表达式等可能有差异）；LIMIT与OFFSET同用查表场景GaussDB逐行调用函数（有报错直接中断）而MySQL不逐行执行不报错；不推荐pg_catalog.func_name()形式调用（语法形式入参时可能出错）；NULL入参GaussDB直接返回NULL而MySQL会校验其余入参（不合法时返回NULL并产生WARNING）。"
  source_anchor: "4.4.2.2.1 说明 页3332-3333"
  source_refs: *refmf
  status: confirmed
- id: mcompat_wave8_189_if_func
  type: constraint
  statement: "IF()差异：第一个参数为TRUE且第三个参数表达式存在隐式类型转换错误、或第一个参数为FALSE且第二个参数表达式存在隐式类型转换错误时，MySQL忽略该错误而GaussDB提示类型转换错误。"
  source_anchor: "4.4.2.2.2 表4-143 IF行 页3333"
  source_refs: *refmf
  status: confirmed
- id: mcompat_wave8_189_ifnull_func
  type: constraint
  statement: "IFNULL()差异：返回值类型兼容MySQL 8.0（MySQL 5.7和8.0返回值类型存在差异）；第一个参数不为NULL且第二个参数表达式存在隐式类型转换错误时MySQL忽略而GaussDB提示错误；float类型入参精度——GaussDB与MySQL 8.0一致（2.123）而MySQL 5.7为2.122999906539917。"
  source_anchor: "4.4.2.2.2 IFNULL 页3334"
  source_refs: *refmf
  status: confirmed
- id: mcompat_wave8_189_nullif_func
  type: constraint
  statement: "NULLIF()差异：返回值类型兼容MySQL 8.0；float类型入参精度——GaussDB与MySQL 8.0行为一致（2.123）而MySQL 5.7为2.122999906539917。"
  source_anchor: "4.4.2.2.2 NULLIF 页3335"
  source_refs: *refmf
  status: confirmed
