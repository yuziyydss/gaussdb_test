facts:
- id: dbexmlgen_wave8_173_overview
  type: syntax
  statement: "DBE_XMLGEN系统包将SQL查询的结果转换为规范的XML格式并将结果返回；数据类型CTXHANDLE用于存储XML输出状态；接口包括CONVERT（xml编码或解码）、NEWCONTEXT/NEWCONTEXTFROMHIERARCHY（初始化context handle）、SETCONVERTSPECIALCHARS（设置输出xml是否需要编码）、SETNULLHANDLING（设置null值展示）、SETROWSETTAG/SETROWTAG（设置根节点/行tag名）、USENULLATTRIBUTEINDICATOR（null元素添加xsi:nil=\"true\"）、USEITEMTAGSFORCOLL（数组元素添加'_item'后缀）、GETNUMROWSPROCESSED（查看上次返回行数）、SETMAXROWS/SETSKIPROWS（最大返回行数/跳过行数）、RESTARTQUERY（重启SQL）、GETXMLTYPE/GETXML（返回XMLTYPE/CLOB类型xml文本）、CLOSECONTEXT（关闭context handle）。"
  source_anchor: "3.12.2.24 DBE_XMLGEN 表3-492/3-493 页3045-3046"
  source_refs: &refxg
  - w8_173_3_12
  status: confirmed
- id: dbexmlgen_wave8_173_ctxhandle_limit
  type: constraint
  statement: "CTXHANDLE数量限制：在同一个session中context handle最多只允许存在65535个，关闭context handle并不会回收这个数量。"
  source_anchor: "3.12.2.24 DBE_XMLGEN说明 页3045"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_case_sensitivity
  type: constraint
  statement: "输出大小写规则：输出的xml中表字段、类型与用户创建的表字段与类型大小写一致，如果需要大写字段与类型名需要在创建时用双引号包裹显式指定。"
  source_anchor: "3.12.2.24 DBE_XMLGEN说明 页3045"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_hierarchy_setup_ineffective
  type: constraint
  statement: "NEWCONTEXTFROMHIERARCHY限制：其初始化时能够调用SETNULLHANDLING、USENULLATTRIBUTEINDICATOR、SETCONVERTSPECIALCHARS方法设置，但不生效。"
  source_anchor: "3.12.2.24 DBE_XMLGEN说明 页3045"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_convert
  type: syntax
  statement: "CONVERT原型（双原型）：DBE_XMLGEN.CONVERT(XMLSTR IN VARCHAR2, FLAG IN NUMBER := 0) RETURNS VARCHAR2与CONVERT(XMLCLOB IN CLOB, FLAG := 0) RETURNS CLOB；将输入字符串进行xml编码或解码操作；编码规则——&→&amp;、<→&lt;、>→&gt;、\"→&quot;、'→&apos;；FLAG为0编码操作、1解码操作；示例解码'<foo/>'输出<foo/>、编码'<foo><qwe</foo>'输出&lt;foo&gt;&lt;qwe&lt;/foo&gt;。"
  source_anchor: "3.12.2.24 CONVERT 页3046-3047"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_newcontext
  type: syntax
  statement: "NEWCONTEXT原型（双原型）：DBE_XMLGEN.NEWCONTEXT(QUERYSTRING IN VARCHAR2)与NEWCONTEXT(QUERYSTRING IN SYS_REFCURSOR)均RETURNS DBE_XMLGEN.CTXHANDLE；初始化普通context handle；示例VARCHAR2版+GETXML输出rowset/row完整XML（department_name特殊字符被转义、null行仅保留非空列），refcursor版+GETXMLTYPE输出同构XML。"
  source_anchor: "3.12.2.24 NEWCONTEXT 页3047-3049"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_newcontextfromhierarchy
  type: syntax
  statement: "NEWCONTEXTFROMHIERARCHY(QUERYSTRING IN VARCHAR2)：初始化带有递归元素的context handle；数据格式要求两列——第一列为numeric类型（通常由connect by生成level）、第二列为xml或XMLTYPE类型；生成的xml层级嵌套不允许超过5000万层；示例tree_list通过connect by prior生成嵌套children/node_name树。"
  source_anchor: "3.12.2.24 NEWCONTEXTFROMHIERARCHY 页3049-3051"
  source_refs: *refxg
  status: confirmed
- id: dbexmldom_wave8_173_hierarchy_5000w
  type: constraint
  statement: "递归层级限制：NEWCONTEXTFROMHIERARCHY生成的xml层级嵌套不允许超过5000万层。"
  source_anchor: "3.12.2.24 NEWCONTEXTFROMHIERARCHY说明 页3049"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_setconvertspecialchars
  type: syntax
  statement: "SETCONVERTSPECIALCHARS(CTX IN CTXHANDLE, CONV IN BOOLEAN)：设置输出的xml是否需要xml编码（true编码、false不编码）；取消xml编码可能存在xml注入问题，如果出于性能考虑且可以保证xml是安全的情况下可以不进行xml编码；示例true时department_name输出转义&amp;lt;/row&amp;gt;、false时输出原始</row>；true时非xml特殊字符（!@#$%^*等）不进行编码仅&编码为&amp;。"
  source_anchor: "3.12.2.24 SETCONVERTSPECIALCHARS 页3051-3052"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_setnullhandling
  type: syntax
  statement: "SETNULLHANDLING(CTX IN CTXHANDLE, FLAG IN NUMBER := 0)：设置xml中null值如何展示——0不展示元素、1元素上添加xsi:nil=\"true\"属性、2展示自闭合元素；默认（不调用）与0一致不展示元素；示例department_id=15的null行分别输出无元素/<department_name xsi:nil=\"true\"/>/<department_name/>。"
  source_anchor: "3.12.2.24 SETNULLHANDLING 页3052-3054"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_usenullattributeindicator
  type: syntax
  statement: "USENULLATTRIBUTEINDICATOR(CTX IN CTXHANDLE, ATTRIND IN BOOLEAN)：对xml中的null值所在的元素添加xsi:nil=\"true\"属性（ATTRIND参数无意义）；示例department_id=15输出<rowset xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\">与<department_name xsi:nil=\"true\"/>。"
  source_anchor: "3.12.2.24 USENULLATTRIBUTEINDICATOR 页3054-3055"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_useitemtagsforcoll
  type: syntax
  statement: "USEITEMTAGSFORCOLL(CTX IN CTXHANDLE)：对数组类型变量所在的元素中添加'_item'后缀；示例int[]数组默认输出与调用后输出<int4_ITEM>1</int4_ITEM><int4_ITEM>2</int4_ITEM><int4_ITEM>3</int4_ITEM>。"
  source_anchor: "3.12.2.24 USEITEMTAGSFORCOLL 页3058"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_getnumrowsprocessed
  type: syntax
  statement: "GETNUMROWSPROCESSED(CTX IN CTXHANDLE)：查看上一次getxml或者getxmltype返回的数据行数；示例SETMAXROWS(4)后LOOP循环GETXML输出-------4----------与-------3----------直至返回0退出。"
  source_anchor: "3.12.2.24 GETNUMROWSPROCESSED 页3058-3059"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_setmaxrows
  type: syntax
  statement: "SETMAXROWS(CTX, N)：设置getxml最大的返回行数；示例SETMAXROWS(qryctx, 4)后每轮GETXML最多返回4行。"
  source_anchor: "3.12.2.24 SETMAXROWS 页3060"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_setskiprows
  type: syntax
  statement: "SETSKIPROWS(CTX, N)：设置跳过sql行数；示例SETSKIPROWS(qryctx, 5)后GETXML输出department_id 15/16两行（跳过前5行）。"
  source_anchor: "3.12.2.24 SETSKIPROWS 页3061-3062"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_restartquery
  type: syntax
  statement: "RESTARTQUERY(CTX IN CTXHANDLE)：重启sql；示例SETMAXROWS(4)分批取完（4+3）后RESTARTQUERY再GETXML重新输出从头开始的4行（-------4----------）。"
  source_anchor: "3.12.2.24 RESTARTQUERY 页3062-3064"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_getxmltype
  type: syntax
  statement: "GETXMLTYPE原型（双原型）：GETXMLTYPE(SQLQUERY IN VARCHAR2, DTDORSCHEMA IN NUMBER := 0) RETURNS XMLTYPE与GETXMLTYPE(CTX IN CTXHANDLE, DTDORSCHEMA := 0) RETURNS XMLTYPE；返回XMLTYPE类型的xml文本（DTDORSCHEMA无意义）；示例refcursor版结果需用getclobval转换才能被put_line输出。"
  source_anchor: "3.12.2.24 GETXMLTYPE 页3064-3065"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_getxml
  type: syntax
  statement: "GETXML原型（三原型）：GETXML(SQLQUERY IN VARCHAR2, DTDORSCHEMA IN NUMBER := 0) RETURNS CLOB、GETXML(CTX, DTDORSCHEMA := 0) RETURNS CLOB、GETXML(CTX, TMPCLOB INOUT CLOB, DTDORSCHEMA := 0)（TMPCLOB用于保存输出的XML）；返回CLOB类型的xml文本（DTDORSCHEMA无意义）；示例与SETMAXROWS/GETNUMROWSPROCESSED/RESTARTQUERY配合的分批输出基线（4/3/4）。"
  source_anchor: "3.12.2.24 GETXML 页3065-3067"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_closecontext
  type: syntax
  statement: "CLOSECONTEXT(CTX IN CTXHANDLE)：关闭context handle；示例SETCONVERTSPECIALCHARS(qryctx, false)输出后关闭context。"
  source_anchor: "3.12.2.24 CLOSECONTEXT 页3067-3068"
  source_refs: *refxg
  status: confirmed
- id: dbexmlgen_wave8_173_rowset_rowtag_example
  type: behavior_oracle
  statement: "自定义tag示例基线：SETROWSETTAG(qryctx,'asd')+SETROWTAG(qryctx,'qwe')后GETXML输出<asd><qwe>…七行department数据</qwe></asd>结构（特殊字符转义保持）。"
  source_anchor: "3.12.2.24 SETROWSETTAG/SETROWTAG示例 页3055-3057"
  source_refs: *refxg
  status: confirmed
