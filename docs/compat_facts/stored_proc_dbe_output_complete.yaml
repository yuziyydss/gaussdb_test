document: "集中式版参考 / 3 存储过程 / 3.12.2.13 DBE_OUTPUT"
version: "V2.0-10.0.0"
parent_pdf_sha256: "716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe"
extraction_date: "2026-09-14"
extraction_method: pdftotext -layout 逐页精读
verification_status: confirmed

facts:
  # PRINT_LINE
  - id: dbe_output_print_line
    type: syntax
    statement: "DBE_OUTPUT.PRINT_LINE(format IN VARCHAR2)：输出指定文本并添加换行符。直接输出到客户端，不经过缓冲区。"
    source_anchor: "3.12.2.13 表3-250"
    status: confirmed
    verification_method: 逐页精读（页2802，含完整原型和参数表）

  - id: dbe_output_print_line_param
    type: syntax
    statement: "PRINT_LINE参数：format（IN VARCHAR2）= 输出的文本。参数不可为NULL（NULL会导致输出空行）。"
    source_anchor: "3.12.2.13 表3-250"
    status: confirmed
    verification_method: 逐页精读（页2802）

  # PRINT
  - id: dbe_output_print
    type: syntax
    statement: "DBE_OUTPUT.PRINT(format IN VARCHAR2)：输出指定文本，不添加换行符。直接输出到客户端，不经过缓冲区。"
    source_anchor: "3.12.2.13 表3-251"
    status: confirmed
    verification_method: 逐页精读（页2802-2803）

  # SET_BUFFER_SIZE
  - id: dbe_output_set_buffer_size
    type: syntax
    statement: "DBE_OUTPUT.SET_BUFFER_SIZE(size IN INTEGER DEFAULT 20000)：设置输出缓冲区大小。不指定时最大20000字节。指定≤2000字节时缓冲区允许2000字节。"
    source_anchor: "3.12.2.13 表3-252"
    status: confirmed
    verification_method: 逐页精读（页2803）

  # DISABLE
  - id: dbe_output_disable
    type: syntax
    statement: "DBE_OUTPUT.DISABLE：禁用PUT/PUT_LINE/NEW_LINE/GET_LINE/GET_LINES调用，并清空输出缓冲区。无参数。"
    source_anchor: "3.12.2.13"
    status: confirmed
    verification_method: 逐页精读（页2803）

  # ENABLE
  - id: dbe_output_enable
    type: syntax
    statement: "DBE_OUTPUT.ENABLE(buffer_size IN INTEGER DEFAULT 20000)：开启缓冲区，允许PUT/PUT_LINE/NEW_LINE/GET_LINE/GET_LINES调用。buffer_size设为NULL使用默认值20000字节。"
    source_anchor: "3.12.2.13 表3-253"
    status: confirmed
    verification_method: 逐页精读（页2803）

  # GET_LINE
  - id: dbe_output_get_line
    type: syntax
    statement: "DBE_OUTPUT.GET_LINE(line OUT VARCHAR2, status OUT INTEGER)：从缓冲区中以换行符为界获取一行数据，不输出到客户端。status=0表示获取到字符串，status=1表示无数据。"
    source_anchor: "3.12.2.13 表3-254"
    status: confirmed
    verification_method: 逐页精读（页2803-2804）

  # GET_LINES
  - id: dbe_output_get_lines
    type: syntax
    statement: "DBE_OUTPUT.GET_LINES(lines OUT VARCHAR[], numlines IN OUT INTEGER)：以VARCHAR数组形式获取缓冲区指定行数。取出的内容从缓冲区清除。输出numlines小于输入numlines时表示缓冲区行数不足。"
    source_anchor: "3.12.2.13 表3-255"
    status: confirmed
    verification_method: 逐页精读（页2804）

  # NEW_LINE
  - id: dbe_output_new_line
    type: syntax
    statement: "DBE_OUTPUT.NEW_LINE：在缓冲区末尾放置一行行尾标记，空出新行。无参数。"
    source_anchor: "3.12.2.13"
    status: confirmed
    verification_method: 逐页精读（页2804）

  # PUT
  - id: dbe_output_put
    type: syntax
    statement: "DBE_OUTPUT.PUT(item IN VARCHAR2)：将输入字符串放入缓冲区，末尾不加换行符。匿名块执行结束时以换行符结尾的行输出显示。不以换行符结尾的内容不输出。"
    source_anchor: "3.12.2.13 表3-256"
    status: confirmed
    verification_method: 逐页精读（页2804）

  # PUT_LINE
  - id: dbe_output_put_line
    type: syntax
    statement: "DBE_OUTPUT.PUT_LINE(item IN VARCHAR2)：将输入字符串放入缓冲区并添加换行符。匿名块执行结束时输出显示。"
    source_anchor: "3.12.2.13 表3-257"
    status: confirmed
    verification_method: 逐页精读（页2804-2805）

  # 行为差异：PRINT_LINE vs PUT_LINE
  - id: dbe_output_print_vs_put
    type: behavior_oracle
    statement: "PRINT_LINE/PRINT直接输出到客户端；PUT/PUT_LINE/NEW_LINE先写入缓冲区，匿名块结束时输出。DISABLE后PUT系列不输出但PRINT系列不受影响。GET_LINE/GET_LINES从缓冲区读取不输出。"
    source_anchor: "3.12.2.13 接口描述"
    status: confirmed
    verification_method: 逐页精读（页2802-2804）

  # NCHAR输出限制
  - id: dbe_output_nchar_limitation
    type: constraint
    statement: "使用PUT_LINE打印DBE_FILE.READ_LINE_NCHAR结果时需确保UTF8编码能转换成当前数据库编码。PRINT_LINE不支持该功能。"
    source_anchor: "3.12.2.13 说明"
    status: confirmed
    verification_method: 逐页精读（页2801）

  # 字符编码限制
  - id: dbe_output_encoding_limitation
    type: constraint
    statement: "server_encoding不为UTF-8时，PUT_LINE和PUT处理合法UTF8编码数据可能返回值不符预期或报错。开启enable_convert_illegal_char后特殊字符不以占位符输出。不建议对特殊字符数据使用PUT_LINE和PUT。"
    source_anchor: "3.12.2.13 说明"
    status: confirmed
    verification_method: 逐页精读（页2806）

  # 完整行为示例
  - id: dbe_output_example_print
    type: behavior_oracle
    statement: "示例：SET_BUFFER_SIZE(50); PRINT('hello, '); PRINT_LINE('database!'); 输出'hello, database!'。PRINT不换行所以两个内容连成一行。"
    source_anchor: "3.12.2.13 示例"
    status: confirmed
    verification_method: 逐页精读（页2805）

  - id: dbe_output_example_disable_enable
    type: behavior_oracle
    statement: "示例：DISABLE后PUT_LINE('1')不输出任何内容（仅ANONYMOUS BLOCK EXECUTE）。ENABLE后PUT_LINE('1')正常输出'1'。"
    source_anchor: "3.12.2.13 示例"
    status: confirmed
    verification_method: 逐页精读（页2805）

  - id: dbe_output_example_put_newline
    type: behavior_oracle
    statement: "示例：PUT('a')后不输出（无换行符）。加NEW_LINE后输出'a'（换行符触发输出）。"
    source_anchor: "3.12.2.13 示例"
    status: confirmed
    verification_method: 逐页精读（页2805）

  - id: dbe_output_example_get_line
    type: behavior_oracle
    statement: "示例：PUT_LINE('hello')后GET_LINE(line,status)获取'hello'且status=0。GET_LINE取出的数据不会再输出到客户端。"
    source_anchor: "3.12.2.13 示例"
    status: confirmed
    verification_method: 逐页精读（页2805-2806）

  - id: dbe_output_example_get_lines
    type: behavior_oracle
    statement: "示例：PUT_LINE三行后GET_LINES(lines,100)返回lines数组含3行，numlines=3。FOR循环输出line 1/line 2/line 3。"
    source_anchor: "3.12.2.13 示例"
    status: confirmed
    verification_method: 逐页精读（页2806）
