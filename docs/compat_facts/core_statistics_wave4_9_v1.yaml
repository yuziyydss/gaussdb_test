  source_anchor: "1.6.29 页890"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_9_plsql_statements_fields
  type: syntax
  statement: "gs_plsql_statements输出pid、sessionid、global_sessionid、databaseid、pkg_id、func_id、func_signature、plsql_compiled_totalsize和plsql_plan_totalsize；pkg_id在不属于PACKAGE时为0；func_signature由name、fn_collation和search_path组成。"
  source_anchor: "1.6.29 页890-891"
  source_refs: *id001
  status: confirmed
