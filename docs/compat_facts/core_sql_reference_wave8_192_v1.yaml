facts:
- id: mcompat_wave8_192_sql_overview
  type: syntax
  statement: "GaussDB兼容绝大多数MySQL语法但存在部分差异；部分关键字在MySQL可做标识符但GaussDB不可以或存在限制（表4-162）。"
  source_anchor: "4.4.2.7.1 SQL兼容性概述 页3403"
  source_refs: &refw8192
  - w8_192_4_4_2
  status: confirmed
- id: mcompat_wave8_192_restricted_keywords
  type: constraint
  statement: "受限标识符（表4-162）：保留关键字（可以是类型或函数）COLLATION/COMPACT——除函数和变量不可作为其他数据库标识符；非保留关键字（不能是类型或函数）BIT/BOOLEAN/COALESCE/DATE/NATIONAL/NCHAR/NONE/NUMBER/TEXT/TIME/TIMESTAMP/TIMESTAMPDIFF——不可作为函数或变量标识符；保留关键字ANY/ARRAY/BUCKETS/DO/END/LESS/MODIFY/OFFSET/ONLY/RETURNING/SOME/USER——不可作为任意数据库标识符。"
  source_anchor: "4.4.2.7.1 表4-162 页3404"
  source_refs: *refw8192
  status: confirmed
- id: mcompat_wave8_192_optimizer_diff
  type: constraint
  statement: "优化器差异：GaussDB与MySQL优化器生成的执行计划差异可能导致行为不一致但不影响业务数据结果；如cast('abc' AS decimal)在GaussDB中计算col1和WHERE比较均调用cast产生两条WARNING，MySQL只产生一条。"
  source_anchor: "4.4.2.7.1 概述 页3404-3405"
  source_refs: *refw8192
  status: confirmed
- id: mcompat_wave8_192_keyword_constraint_rules
  type: constraint
  statement: "关键字约束差异规则：GaussDB保留关键字在MySQL为非保留时不可作表名/列名/别名/函数名/变量名但MySQL支持；GaussDB非保留在MySQL为保留时可作表名/列名/别名但MySQL不支持；GaussDB保留（可函数或类型）在MySQL为保留时可作列别名/函数名/变量名；GaussDB保留（可函数或类型）在MySQL为非保留时不可作表名/列名/AS表别名/表别名；GaussDB非保留（不能函数或类型）在MySQL为保留时可作表名/列名/别名/变量名；GaussDB非保留（不能函数或类型）在MySQL为非保留时不可作函数名。"
  source_anchor: "4.4.2.7.2 关键字 页3405"
  source_refs: *refw8192
  status: confirmed
- id: mcompat_wave8_192_no_alias_keywords
  type: constraint
  statement: "GaussDB非保留/保留（可函数或类型）/非保留（不能函数或类型）关键字中以下不能作列别名：BETWEEN/BIGINT/BLOB/CHAR/CHARACTER/COMPILE/CROSS/DEC/DECIMAL/DIV/DOUBLE/EXISTS/FLOAT/FLOAT4/FLOAT8/GROUPING/INNER/INOUT/INT/INT1-INT8/INTEGER/JOIN/LEFT/LIKE/LONGBLOB/LONGTEXT/MEDIUMBLOB/MEDIUMINT/MEDIUMTEXT/MOD/NATURAL/NUMERIC/OUT/OUTER/PRECISION/REAL/RIGHT/ROW/ROW_NUMBER/SIGNED/SMALLINT/SOUNDS/TINYBLOB/TINYINT/TINYTEXT/VALUES/VARCHAR/VARYING/WITHOUT；其中SIGNED和WITHOUT在MySQL中可作列别名。"
  source_anchor: "4.4.2.7.2 说明 页3406"
  source_refs: *refw8192
  status: confirmed
- id: mcompat_wave8_192_identifier_dollar_case
  type: constraint
  statement: "标识符差异：GaussDB无引号标识符不支持$开头而MySQL支持；GaussDB支持大小写敏感的数据库对象；GaussDB标识符支持U+0080~U+00FF扩展字符而MySQL支持U+0080~U+FFFF。"
  source_anchor: "4.4.2.7.3 标识符 页3406"
  source_refs: *refw8192
  status: confirmed
- id: mcompat_wave8_192_identifier_number_e
  type: constraint
  statement: "无引号标识符以数字开头含e/E结尾：GaussDB不支持创建如23e的表名/列名而MySQL支持。"
  source_anchor: "4.4.2.7.3 标识符 页3406"
  source_refs: *refw8192
  status: confirmed
- id: mcompat_wave8_192_identifier_quoted_numeric
  type: constraint
  statement: "有引号标识符纯数字/科学计算法列名：GaussDB不支持直接使用需在引号中使用；点操作符（.）场景列名为纯数字或科学计算法也需要引号。"
  source_anchor: "4.4.2.7.3 标识符 页3406-3407"
  source_refs: *refw8192
  status: confirmed
- id: mcompat_wave8_192_empty_alias
  type: constraint
  statement: "空反引号/空双引号别名差异：GaussDB不支持``空反引号别名，ANSI_QUOTES模式下同样不支持空双引号\"\"别名；CREATE TABLE AS报错，CREATE VIEW AS可能报错且后续使用报错；MySQL支持空反引号/空双引号别名。"
  source_anchor: "4.4.2.7.3 标识符 页3407-3409"
  source_refs: *refw8192
  status: confirmed
- id: mcompat_wave8_192_partition_name_case
  type: constraint
  statement: "分区名大小写差异：GaussDB分区名使用双引号（需ANSI_QUOTES）或反引号时区分大小写，MySQL不区分。"
  source_anchor: "4.4.2.7.3 标识符 页3409"
  source_refs: *refw8192
  status: confirmed
- id: mcompat_wave8_192_identifier_length
  type: constraint
  statement: "标识符长度差异：MySQL标识符长度限制64字符，GaussDB限制63字节；超过后MySQL报错，GaussDB截断并告警。"
  source_anchor: "4.4.2.7.3 标识符 页3409"
  source_refs: *refw8192
  status: confirmed
- id: mcompat_wave8_192_executable_comment
  type: constraint
  statement: "GaussDB不支持可执行注释。"
  source_anchor: "4.4.2.7.3 标识符 页3409"
  source_refs: *refw8192
  status: confirmed
open_questions:
- id: pkg2_wave8_192_oq_runtime
  content: "优化器差异WARNING计数/标识符截断/空反引号别名在CREATE VIEW后续使用报错等差异的完整影响范围需授权环境实机验证。"
  status: open
