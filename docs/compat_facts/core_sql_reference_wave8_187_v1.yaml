facts:
- id: appendix_wave8_187_ext_functions
  type: syntax
  statement: "扩展函数（1.14.1）：GaussDB支持的扩展函数不作为商用特性交付仅供参考；分类包括访问权限查询函数（has_sequence_privilege(user,sequence,privilege)指定用户是否有访问序列的权限、has_sequence_privilege(sequence,privilege)当前用户是否有访问序列的权限）和触发器函数（pg_get_triggerdef(oid)为触发器获取CREATE [CONSTRAINT] TRIGGER命令、pg_get_triggerdef(oid,boolean)同上带额外参数）。"
  source_anchor: "1.14.1 扩展函数 页1894-1895"
  source_refs: &refap
  - w8_187_1_14
  status: confirmed
- id: appendix_wave8_187_ext_syntax_refs
  type: syntax
  statement: "扩展语法——CREATE TABLE的column_constraint支持用REFERENCES reftable[(refcolumn)][MATCH FULL|MATCH PARTIAL|MATCH SIMPLE][ON DELETE action][ON UPDATE action]为表创建外键约束。"
  source_anchor: "1.14.2 扩展语法 页1895"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_ext_syntax_extension
  type: syntax
  statement: "扩展语法——模块管理：CREATE EXTENSION把一个新的模块加载进当前数据库中（该特性为内部使用只允许加载数据库内部的高级包或扩展）；DROP EXTENSION删除已加载的模块（同样为内部使用）。"
  source_anchor: "1.14.2 扩展语法 页1895"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_ext_syntax_aggregate
  type: syntax
  statement: "扩展语法——聚集函数管理：CREATE AGGREGATE定义一个新的聚集函数；ALTER AGGREGATE修改一个聚集函数的定义；DROP AGGREGATE删除一个现存的聚集函数。"
  source_anchor: "1.14.2 扩展语法 页1895"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_dollar_quote
  type: syntax
  statement: "美元引用的字符串常量：如果字符串中包含单引号应将单引号加倍为两个单引号否则SQL语句可能无法执行；为提高可读性允许美元符界定的字符串常量书写办法——由美元符号($)、零个或多个字符组成的记号、另一个美元符号、字符串常量任意字符序列、美元符号、与前面相同的记号、美元符号组成；示例SELECT $$it's an example$$输出it's an example。"
  source_anchor: "1.14.3 美元引用的字符串常量 页1895-1896"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_row_expr_whitelist
  type: syntax
  statement: "行表达式函数白名单（1.14.4）：表1-388为数据对象增加或修改策略ILM所支持的行表达式函数白名单，按func_oid_value和func_name两列列举所有支持的函数OID和名称（包括int2in/int2out/int4in/int4out/textin/textout/boollt/boolgt/booleq/chareq/int2eq/int4eq/texteq等数百个内部函数）。"
  source_anchor: "1.14.4 行表达式函数白名单 表1-388 页1896-1961"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_whitelist_scope
  type: constraint
  statement: "行表达式函数白名单用途：该白名单用于为数据对象增加或修改策略ILM时所支持的函数范围限定；不在白名单中的函数在ILM策略表达式中使用时会报错。"
  source_anchor: "1.14.4 行表达式函数白名单 页1896"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_ext_func_access
  type: syntax
  statement: "扩展函数——访问权限查询函数：has_sequence_privilege(user,sequence,privilege)指定用户是否有访问序列的权限（三参数版本）；has_sequence_privilege(sequence,privilege)当前用户是否有访问序列的权限（两参数版本）；这两个函数属于访问权限查询函数分类。"
  source_anchor: "1.14.1 扩展函数——访问权限查询函数 页1894"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_ext_func_trigger
  type: syntax
  statement: "扩展函数——触发器函数：pg_get_triggerdef(oid)为触发器获取CREATE [CONSTRAINT] TRIGGER命令；pg_get_triggerdef(oid,boolean)为触发器获取CREATE [CONSTRAINT] TRIGGER命令（带pretty-print布尔参数）；属于触发器函数分类。"
  source_anchor: "1.14.1 扩展函数——触发器函数 页1894-1895"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_ext_syntax_fk
  type: syntax
  statement: "扩展语法CREATE TABLE外键约束：column_constraint支持用REFERENCES reftable[(refcolumn)][MATCH FULL|MATCH PARTIAL|MATCH SIMPLE][ON DELETE action][ON UPDATE action]为表创建外键约束；MATCH类型包括FULL/PARTIAL/SIMPLE三种匹配方式。"
  source_anchor: "1.14.2 扩展语法CREATE TABLE 页1895"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_ext_syntax_module_detail
  type: constraint
  statement: "扩展语法模块管理限制：CREATE EXTENSION和DROP EXTENSION为内部使用特性，只允许加载/删除数据库内部的高级包或扩展，不允许加载或删除外部扩展。"
  source_anchor: "1.14.2 扩展语法模块管理 页1895"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_dollar_quote_structure
  type: syntax
  statement: "美元引用语法结构：一个通过美元符界定声明的字符串常量由——一个美元符号($)、零个或多个字符组成的记号(tag)、另一个美元符号、组成字符串常量的任意字符序列、一个美元符号、与前面相同的记号(tag)、一个美元符号组成；tag用于区分嵌套的美元引用字符串。"
  source_anchor: "1.14.3 美元引用的字符串常量 页1895-1896"
  source_refs: *refap
  status: confirmed
- id: appendix_wave8_187_dollar_quote_example
  type: behavior_oracle
  statement: "美元引用示例基线：SELECT $$it's an example$$输出it's an example（避免了单引号转义的复杂性）；当字符串中包含很多单引号或反斜杠时，使用美元引用可以提高查询可读性。"
  source_anchor: "1.14.3 示例 页1895-1896"
  source_refs: *refap
  status: confirmed
