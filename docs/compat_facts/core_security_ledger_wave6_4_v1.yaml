facts:
- id: ledger_wave6_4_hist_functions
  type: syntax
  statement: "get_dn_hist_relhash(text,text)返回指定防篡改用户表表级数据hash值但集中式暂不支持；ledger_hist_check(text,text)校验用户表hash与历史表hash一致性；ledger_hist_repair(text,text)修复历史表hash并返回hash差值。"
  source_anchor: "1.6.21 页534"
  source_refs: &ref211
  - w6_4_1_6_21
  status: confirmed
- id: ledger_wave6_4_hist_archive
  type: syntax
  statement: "ledger_hist_archive(text,text)归档指定防篡改用户表历史表到审计日志目录hist_back文件夹；历史表名称中的'/'会在生成文件名中替换为'_'，返回Boolean。"
  source_anchor: "1.6.21 页535"
  source_refs: *ref211
  status: confirmed
- id: ledger_wave6_4_gchain_functions
  type: syntax
  statement: "ledger_gchain_check(text,text)校验用户表历史表hash与全局历史表relhash一致性；ledger_gchain_repair(text,text)修复全局历史表relhash并返回指定表hash总和；ledger_gchain_archive(void)归档全局历史表，返回Boolean。"
  source_anchor: "1.6.21 页535"
  source_refs: *ref211
  status: confirmed
- id: ledger_wave6_4_hash_types
  type: syntax
  statement: "hash16in/hash16out和hash32in/hash32out分别将十六进制cstring与内部hash16/hash32类型互相转换；hash32in要求输入32个字符。"
  source_anchor: "1.6.21 页535-536"
  source_refs: *ref211
  status: confirmed
- id: encrypted_wave6_4_equalcol_io
  type: syntax
  statement: "byteawithoutorderwithequalcol的in/out/send/recv/typmodin/typmodout函数在cstring、内部密文类型、bytea、internal和typmod表示之间转换。"
  source_anchor: "1.6.22 页536-537"
  source_refs: &ref221
  - w6_4_1_6_22
  status: confirmed
- id: encrypted_wave6_4_withoutorder_io
  type: syntax
  statement: "byteawithoutordercol的in/out/send/recv函数在cstring、内部密文类型、bytea和internal之间转换。"
  source_anchor: "1.6.22 页537"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_compare
  type: syntax
  statement: "byteawithoutorderwithequalcol提供cmp/eq/ne函数，并支持与bytea的左右比较重载；cmp按小于、等于、大于返回-1、0、1，eq/ne返回Boolean。"
  source_anchor: "1.6.22 页537-538"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_hll_hash
  type: syntax
  statement: "hll_hash_byteawithoutorderwithequalcol(byteawithoutorderwithequalcol)对密态等值类型计算HLL哈希。"
  source_anchor: "1.6.22 页538"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_tee_order_like
  type: syntax
  statement: "tee_lt、tee_gt、tee_le、tee_ge、tee_like和tee_nlike对密态等值数据执行小于、大于、小于等于、大于等于、LIKE和NOT LIKE运算。"
  source_anchor: "1.6.22 页538-539"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_tee_calculation_support
  type: syntax
  statement: "tee_calculation和tee_sortsupport是密文计算/排序支撑函数；teegtsel、teeltsel、teelikesel和teenlikesel是选择率函数。"
  source_anchor: "1.6.22 页539-540"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_aggregates_supported
  type: behavior_oracle
  statement: "sum和avg支持密态等值类型聚合运算，返回byteawithoutorderwithequalcol。"
  source_anchor: "1.6.22 页540"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_aggregates_unsupported
  type: environment
  statement: "min、max、stddev_samp、stddev_pop、var_samp和var_pop的密文聚合运算在当前版本不支持使用。"
  source_anchor: "1.6.22 页540-541"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_tee_internal
  type: environment
  statement: "tee_trans、tee_collect和tee_final是密文聚合内部处理函数，不支持用户调用；security_tee_process管理密态可信域内计算状态，当前版本不支持使用。"
  source_anchor: "1.6.22 页541"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_deterministic_encrypt
  type: constraint
  statement: "ce_encrypt_deterministic支持text、int1/int2/int4/int8、float4/float8、numeric、clob、varchar、nvarchar2、bpchar和bytea等明文类型重载，加密为密态等值结构；密钥OID来自gs_column_keys.column_key_distributed_id；入参NULL直接返回NULL；仅在开启内存解密逃生通道时使用。"
  source_anchor: "1.6.22 页541-543"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_deterministic_decrypt
  type: syntax
  statement: "ce_decrypt_deterministic(byteawithoutorderwithequalcol,oid)将密态等值密文解密为text；密钥OID来自gs_column_keys.column_key_distributed_id；NULL入参返回NULL；仅在开启内存解密逃生通道时使用。"
  source_anchor: "1.6.22 页543"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_conversion_encrypt_decrypt
  type: environment
  statement: "以ce_encrypt_开头的类型转换加密函数和以ce_decrypt_开头的类型转换解密函数覆盖text、varchar、nvarchar2、bpchar、整数、浮点、numeric、bytea、clob等类型；不支持用户调用。"
  source_anchor: "1.6.22 页543-546"
  source_refs: *ref221
  status: confirmed
- id: encrypted_wave6_4_cek_validation
  type: behavior_oracle
  statement: "密态等值读写格式转换函数会验证本地cek；密文字段中必须存在本地可找到的cekoid才能执行；输入不是正常加密格式且本地无对应cek时报cek not found错误。"
  source_anchor: "1.6.22 页546-547"
  source_refs: *ref221
  status: confirmed
- id: srf_wave6_4_general_semantics
  type: constraint
  statement: "任意函数入参列表中出现多个SRF函数时报错；SELECT target list中的SRF返回多行；多层嵌套srf(n,srf(m,1))返回n*m行；strict非SRF函数的输入包含SRF时不做strict优化。"
  source_anchor: "1.6.23 页548"
  source_refs: &ref231
  - w6_4_1_6_23
  status: confirmed
- id: srf_wave6_4_generate_series_numeric
  type: syntax
  statement: "generate_series(start,stop)和generate_series(start,stop,step)支持int、bigint、numeric，返回与参数类型对应的setof序列。"
  source_anchor: "1.6.23 页548"
  source_refs: *ref231
  status: confirmed
- id: srf_wave6_4_generate_series_datetime
  type: syntax
  statement: "generate_series(start,stop,step interval)支持timestamp和timestamp with time zone，返回对应setof时间序列。"
  source_anchor: "1.6.23 页548"
  source_refs: *ref231
  status: confirmed
- id: srf_wave6_4_generate_series_boundary
  type: behavior_oracle
  statement: "generate_series在step为正且start>stop、step为负且start<stop或输入为NULL时返回零行；step为零报错。"
  source_anchor: "1.6.23 页548-549"
  source_refs: *ref231
  status: confirmed
- id: srf_wave6_4_search_function_by_name
  type: syntax
  statement: "gs_search_function_with_name(funcname)按函数名获取函数OID集合，入参cstring，返回setof oid。"
  source_anchor: "1.6.23 页549"
  source_refs: *ref231
  status: confirmed
- id: srf_wave6_4_generate_subscripts
  type: behavior_oracle
  statement: "generate_subscripts(array,dim[,reverse])为指定数组维度生成有效下标集合，reverse为true时反向返回；数组无请求维度或数组为NULL时返回零行，数组元素为空时仍返回有效下标。"
  source_anchor: "1.6.23 页549-550"
  source_refs: *ref231
  status: confirmed
- id: overload_wave6_4_function_query
  type: syntax
  statement: "gs_search_function_with_name_and_arg(funcname_and_argtypes)通过函数名和入参类型返回实际调用的重载函数信息，返回text。"
  source_anchor: "1.6.24 页550"
  source_refs: &ref241
  - w6_4_1_6_24
  status: confirmed
- id: overload_wave6_4_function_query_boundary
  type: constraint
  statement: "gs_search_function_with_name_and_arg仅在A兼容模式支持；入参NULL须使用UNKNOWN，窗口函数须加over()，语法关键字实现的函数无法查询，函数或选择逻辑变更可能导致结果变化。"
  source_anchor: "1.6.24 页550"
  source_refs: *ref241
  status: confirmed
- id: overload_wave6_4_syntax_mapping
  type: syntax
  statement: "表1-97列出语法关键字函数到内部调用函数的映射，包括CURRENT_DATE/TIME/TIMESTAMP、CURRENT_ROLE/SCHEMA/USER、DBTIMEZONE、DECODE、EXTRACT、GROUP_CONCAT、LOCALTIME/LOCALTIMESTAMP、NOW、OVERLAY、POSITION、SESSION_USER、SESSIONTIMEZONE、SUBSTR/SUBSTRING、SYSDATE、TRIM、USER和XMLEXISTS。"
  source_anchor: "1.6.24 页550-553"
  source_refs: *ref241
  status: confirmed
- id: overload_wave6_4_operator_query
  type: syntax
  statement: "gs_search_operator_with_name_and_arg(ltype,opname,rtype)通过操作符名和左右操作数类型返回实际调用的重载操作符信息，返回text。"
  source_anchor: "1.6.24 页553-554"
  source_refs: *ref241
  status: confirmed
- id: overload_wave6_4_operator_query_boundary
  type: constraint
  statement: "gs_search_operator_with_name_and_arg仅在A兼容模式支持且仅支持二元操作符；NULL入参须用UNKNOWN替代，!=和^=须用<>替代；操作符或选择逻辑变更时结果可能变化。"
  source_anchor: "1.6.24 页554"
  source_refs: *ref241
  status: confirmed
