facts:
  # SQL查询/子查询
  - id: o_query_overview
    type: environment
    statement: "GaussDB兼容除分层查询以外的SQL查询和子查询。简单查询、UNION/INTERSECT/减运算、子查询、嵌套子查询均支持。"
    source_anchor: "4.3.9 表4-45"
    status: confirmed
    verification_method: 逐页精读（页3184）

  - id: o_query_hierarchical_connect_by
    type: constraint
    statement: "分层查询差异：GaussDB仅支持CONNECT_BY_FILTERING模式，不支持CONNECT_BY_NOFILTERING。"
    source_anchor: "4.3.9 表4-45"
    status: confirmed
    verification_method: 逐页精读（页3184）

  - id: o_query_order_aggregate_set
    type: behavior_oracle
    statement: "查询排序差异：不包含分组且目标列同时含聚集函数和集合返回函数时，GaussDB不忽略对集合返回函数列的排序。"
    source_anchor: "4.3.9 表4-45"
    status: confirmed
    verification_method: 逐页精读（页3185）

  - id: o_query_join_types
    type: constraint
    statement: "Joins差异：GaussDB支持Oracle的Join Types（left/right/self/natural/full outer join等）。不支持In-Memory Join Group等Join Optimizations方法。"
    source_anchor: "4.3.9 表4-45"
    status: confirmed
    verification_method: 逐页精读（页3185）

  - id: o_query_subquery_unnest
    type: constraint
    statement: "嵌套子查询解嵌套差异：GaussDB不支持显式指定HASH_AJ或MERGE_AJ。"
    source_anchor: "4.3.9 表4-45"
    status: confirmed
    verification_method: 逐页精读（页3185）

  - id: o_query_distributed
    type: constraint
    statement: "分布式查询差异：GaussDB需显式指定DBLINK查询。"
    source_anchor: "4.3.9 表4-45"
    status: confirmed
    verification_method: 逐页精读（页3185）

  - id: o_query_prior_column_name
    type: behavior_oracle
    statement: "层次查询PRIOR列回显差异：非CONNECT BY子句中使用PRIOR修饰列a时，GaussDB回显__prior_a__，Oracle回显PRIORA。"
    source_anchor: "4.3.9 表4-45"
    status: confirmed
    verification_method: 逐页精读（页3185）

  - id: o_query_prior_group_by
    type: behavior_oracle
    statement: "层次查询GROUP BY差异：GaussDB支持在GROUP BY中使用带PRIOR列的表达式（返回结果），Oracle报错not a GROUP BY expression。SELECT PRIOR c1+1 FROM test CONNECT BY PRIOR c2=c1 GROUP BY PRIOR c1+1在GaussDB返回2行，Oracle报错。"
    source_anchor: "4.3.9 表4-45"
    status: confirmed
    verification_method: 逐页精读含完整SQL对比（页3185）

  - id: o_query_order_siblings
    type: behavior_oracle
    statement: "层次查询ORDER差异：GaussDB允许ORDER SIBLINGS BY和ORDER BY同时使用，最终排序以外层ORDER BY为准。Oracle不支持同时使用。"
    source_anchor: "4.3.9 表4-45"
    status: confirmed
    verification_method: 逐页精读（页3185）

  # DROP PRIMARY KEY（从上文截取）
  - id: o_query_drop_primary_key
    type: behavior_oracle
    statement: "DROP PRIMARY KEY差异：GaussDB仅支持DROP PRIMARY KEY语法，不支持CASCADE/KEEP INDEX/DROP INDEX/ONLINE选项。删除主键后GaussDB保留NOT NULL约束（插入NULL报错），Oracle同时删除NOT NULL约束。"
    source_anchor: "4.3.8"
    status: confirmed
    verification_method: 逐页精读含SQL对比（页3184）

  # DBE_PLDEVELOPER
  - id: dbe_pldeveloper_overview
    type: environment
    statement: "DBE_PLDEVELOPER Schema提供PL/SQL存储过程编译调试功能，包含调试接口和调试信息视图。"
    source_anchor: "10.6"
    status: confirmed
    verification_method: 逐页精读

  - id: dbe_pldeveloper_debug
    type: environment
    statement: "DBE_PLDEBUGGER Schema提供存储过程调试功能（与DBE_PLDEVELOPER配合使用）。支持断点设置、单步执行、变量查看等。"
    source_anchor: "10.5"
    status: confirmed
    verification_method: 逐页精读
