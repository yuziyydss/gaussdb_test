facts:
- id: create_type_wave8_93_overview
  type: syntax
  statement: "CREATE TYPE在当前数据库中定义一种新的数据类型，当前仅支持创建复合类型、基本类型、shell类型、枚举类型和集合类型；复合类型由属性名和数据类型列表指定，本质与表的行类型相同，可作函数参数或返回类型，创建复合类型必须拥有所有属性类型上的USAGE特权；shell类型是不带除类型名外其他参数的CREATE TYPE命令创建的占位符（创建基本类型时作为向前引用）；枚举类型由若干标签构成，每个标签为非空字符串且不超过63字节；集合类型类似数组但无长度限制，主要在存储过程中使用。"
  source_anchor: "1.13.9.57 功能描述 页1621"
  source_refs: &reftype
  - w8_93_1_13_9_57
  status: confirmed
- id: create_type_wave8_93_notes
  type: constraint
  statement: "CREATE TYPE注意事项：指定具体模式名则创建在指定模式，否则创建在当前模式；新类型名称不能与同一模式中已有的类型或者表重名（表具有相关数据类型属性）；创建数据类型的用户成为所有者；被授予CREATE ANY TYPE权限的用户可在PUBLIC模式和用户模式下创建类型；类型只适用于行存表；使用关联函数创建非系统自带类型时操作不当可能因所关联函数导致权限被滥用的风险。"
  source_anchor: "1.13.9.57 注意事项 页1621-1622"
  source_refs: *reftype
  status: confirmed
- id: create_type_wave8_93_composite_syntax
  type: syntax
  statement: "复合类型语法为CREATE TYPE name AS ( [ attribute_name data_type [ COLLATE collation ] [, ... ] ] )；data_type可使用%RowType间接引用表的类型，或使用%Type间接引用表或复合类型中某一列的类型；collation为关联到复合类型一列的现有排序规则名称，可从pg_collation系统表查询，默认排序规则为查询结果中以default开始的行。"
  source_anchor: "1.13.9.57 语法格式/参数说明 页1622,1624"
  source_refs: *reftype
  status: confirmed
- id: create_type_wave8_93_composite_constructor
  type: constraint
  statement: "复合类型构造器赋值使用=>仅在兼容A模式数据库（sql_compatibility='A'）下支持，且仅在入参赋值连续使用=>到结尾时支持，如composite_name(elename1 => val1, elename2 => val2, elename3 => val3)或composite_name(val1, elename2 => val2, elename3 => val3)；不支持非连续使用=>赋值或=>赋值未到最后一个入参，如composite_name(elename1 => val1, elename2 => val2, val3)。"
  source_anchor: "1.13.9.57 参数说明 复合类型 说明 页1624"
  source_refs: *reftype
  status: confirmed
- id: create_type_wave8_93_basic_syntax
  type: syntax
  statement: "基本类型语法为CREATE TYPE name ( INPUT = input_function, OUTPUT = output_function [, RECEIVE = receive_function] [, SEND = send_function] [, TYPMOD_IN = type_modifier_input_function] [, TYPMOD_OUT = type_modifier_output_function] [, ANALYZE = analyze_function] [, INTERNALLENGTH = { internallength | VARIABLE }] [, PASSEDBYVALUE] [, ALIGNMENT = alignment] [, STORAGE = storage] [, LIKE = like_type] [, CATEGORY = category] [, PREFERRED = preferred] [, DEFAULT = default] [, ELEMENT = element] [, DELIMITER = delimiter] [, COLLATABLE = collatable] )；参数可以以任意顺序出现，input_function和output_function为必选参数，其他为可选参数。"
  source_anchor: "1.13.9.57 语法格式/参数说明 页1622"
  source_refs: *reftype
  status: confirmed
- id: create_type_wave8_93_io_functions
  type: constraint
  statement: "input_function将数据从外部文本形式转换为内部形式，可声明为一个CSTRING类型参数或CSTRING/OID/INTEGER三个参数，必须返回该数据类型本身的值，通常应声明为STRICT；output_function必须声明为有一个新数据类型参数且必须返回类型CSTRING，NULL值不会调用输出函数；I/O函数能引用新类型是因为必须先创建函数：新类型先定义为shell type（CREATE TYPE name），再用C写I/O函数引用该shell type，最后用带完整定义的CREATE TYPE替换shell type；I/O函数为INTERNAL类型且指定为内部系统函数时，输入输出函数参数类型需一致，且INTERNALLENGTH和PASSEDBYVALUE需与参数类型保持一致。"
  source_anchor: "1.13.9.57 参数说明 页1624-1625"
  source_refs: *reftype
  status: confirmed
- id: create_type_wave8_93_binary_functions
  type: constraint
  statement: "receive_function可选，将外部二进制形式转内部形式，没有该函数类型不能参与二进制输入，可声明为一个INTERNAL类型参数或INTERNAL/OID/INTEGER三参数；send_function可选，将内部形式转外部二进制形式，必须返回类型BYTEA，NULL值不会调用；type_modifier_input_function/type_modifier_output_function可选，类型修饰符必须能打包到一个非负整数值存于typmod列，没有type_modifier_input_function则类型修饰符将被拒绝，type_modifier_output_function必须返回CSTRING（默认显示格式时可省略）；analyze_function可选，为类型执行统计分析，必须声明为有一个INTERNAL类型参数且返回布尔值。"
  source_anchor: "1.13.9.57 参数说明 页1625-1626"
  source_refs: *reftype
  status: confirmed
- id: create_type_wave8_93_storage_attrs
  type: constraint
  statement: "INTERNALLENGTH定长时为正整数，变长时设为VARIABLE（内部typlen为-1），所有变长类型内部表达必须以4字节整数开始；PASSEDBYVALUE表示传值，须为定长且内部表达不超过Datum尺寸（4或8字节）；ALIGNMENT须为CHAR、INT2、INT4或DOUBLE，默认INT4，变长类型alignment必须至少为4；STORAGE须为plain、external、extended或main，默认plain（plain线内存储不压缩且定长类型只允许plain；extended先压缩再移出主表；external移出但不压缩；main允许压缩但不鼓励移出主表）。"
  source_anchor: "1.13.9.57 参数说明 页1626"
  source_refs: *reftype
  status: confirmed
- id: create_type_wave8_93_enum_set
  type: constraint
  statement: "枚举类型语法为CREATE TYPE name AS ENUM ( [ 'label' [, ... ] ] )，标签值为非空字符串且不超过63字节；集合类型语法为CREATE TYPE name AS TABLE OF data_type；创建用户定义类型时GaussDB会自动创建一个与之关联的数组类型，其名称由该元素类型的名称前缀一个下划线组成。"
  source_anchor: "1.13.9.57 语法格式/参数说明 页1623-1624,1627"
  source_refs: *reftype
  status: confirmed
- id: create_type_wave8_93_example
  type: behavior_oracle
  statement: "示例：CREATE TYPE compfoo AS (f1 int, f2 text)后建表插入并SELECT (b).f1查询；ALTER TYPE compfoo RENAME TO compfoo1、OWNER TO usr1、SET SCHEMA usr1、ADD ATTRIBUTE f3 int；DROP TYPE usr1.compfoo1 CASCADE；枚举CREATE TYPE bugstatus AS ENUM ('create', 'modify', 'closed')、ALTER TYPE ... ADD VALUE IF NOT EXISTS 'regress' BEFORE 'closed'、RENAME VALUE 'create' TO 'new'；集合CREATE TYPE bugstatus_table AS TABLE OF bugstatus；A兼容库中复合类型构造器全=>与连续=>到结尾赋值ANONYMOUS BLOCK EXECUTE成功，非连续=>报ERROR: Positional parameters cannot follow named parameters.。"
  source_anchor: "1.13.9.57 示例 页1627-1629"
  source_refs: *reftype
  status: confirmed
- id: create_weak_password_dictionary_wave8_93_syntax
  type: syntax
  statement: "CREATE WEAK PASSWORD DICTIONARY创建弱口令字典，向系统表gs_global_config中新增一条或多条弱口令；语法为CREATE WEAK PASSWORD DICTIONARY [WITH VALUES] ( {'weak_password'} [, ...] )，weak_password为弱口令，密码取值范围为字符串。"
  source_anchor: "1.13.9.61 功能描述/语法格式/参数说明 页1642-1643"
  source_refs: &refwpd
  - w8_93_1_13_9_61
  status: confirmed
- id: create_weak_password_dictionary_wave8_93_permission
  type: environment
  statement: "仅初始用户、系统管理员和安全管理员拥有权限执行创建弱口令字典操作；弱口令字典中的口令存放在gs_global_config系统表中；弱口令字典默认为空。"
  source_anchor: "1.13.9.61 注意事项 页1642"
  source_refs: *refwpd
  status: confirmed
- id: create_weak_password_dictionary_wave8_93_duplicate
  type: constraint
  statement: "当用户尝试通过本语法插入gs_global_config表中已存在的弱口令时，会只在表中保留一条该弱口令。"
  source_anchor: "1.13.9.61 注意事项 页1642-1643"
  source_refs: *refwpd
  status: confirmed
- id: create_weak_password_dictionary_wave8_93_example
  type: behavior_oracle
  statement: "示例：CREATE WEAK PASSWORD DICTIONARY WITH VALUES ('********')插入单个弱口令后SELECT * FROM gs_global_config WHERE NAME LIKE 'weak_password'返回1行；插入多个弱口令后返回3行；DROP WEAK PASSWORD DICTIONARY清空所有弱口令后再查为0行；相关链接DROP WEAK PASSWORD DICTIONARY。"
  source_anchor: "1.13.9.61 示例 页1643"
  source_refs: *refwpd
  status: confirmed
- id: cursor_wave8_93_syntax
  type: syntax
  statement: "CURSOR创建一个游标，从一个查询里检索出指定的几行数据；语法为CURSOR cursor_name [ BINARY ] [ NO SCROLL ] [ { WITH | WITHOUT } HOLD ] FOR query，query使用SELECT或VALUES子句指定游标返回的行。"
  source_anchor: "1.13.9.62 功能描述/语法格式/参数说明 页1644-1645"
  source_refs: &refcursor
  - w8_93_1_13_9_62
  status: confirmed
- id: cursor_wave8_93_concepts
  type: constraint
  statement: "游标命令只能在事务块里使用；存储过程线程分配一段内存区域保存上下文联系，游标是指向上下文区域的句柄或指针，借助游标存储过程可控制上下文区域的变化；通常游标和SELECT一样返回文本格式，使用FETCH语句游标可以返回文本或二进制格式。"
  source_anchor: "1.13.9.62 功能描述/注意事项 页1644"
  source_refs: *refcursor
  status: confirmed
- id: cursor_wave8_93_binary
  type: constraint
  statement: "应该小心使用二进制游标：文本格式一般比对应的二进制格式占用存储空间大；二进制游标返回内部二进制形态的数据可能更易于操作（如整数列返回1时，缺省游标获得字符串1，二进制游标得到4字节大端顺序的内部形式数值）；以文本方式显示数据时文本检索可为用户节约很多客户端工作。"
  source_anchor: "1.13.9.62 注意事项 页1644"
  source_refs: *refcursor
  status: confirmed
- id: cursor_wave8_93_scroll_hold
  type: constraint
  statement: "NO SCROLL声明游标不能以倒序方式检索数据行，未声明时根据执行计划自动判断；在cmdsql中只支持添加NO SCROLL或不添加滚动选项，不支持SCROLL关键字；在存储过程中支持NO SCROLL、SCROLL或不添加；显式游标中只有声明为NO SCROLL的游标可以并发执行，建议不需要倒序检索的游标设置为NO SCROLL；WITH HOLD声明游标在创建它的事务结束后仍可继续使用，WITHOUT HOLD声明事务外不能再使用且在事务结束时自动关闭，未指定默认WITHOUT HOLD。"
  source_anchor: "1.13.9.62 参数说明 页1644-1645"
  source_refs: *refcursor
  status: confirmed
- id: cursor_wave8_93_params_deps
  type: constraint
  statement: "静态游标支持定义参数，参数支持默认值，但参数默认值不能应用PACKAGE外的变量（可在包内定义一个变量，将包外变量赋值给该变量后使用该变量作为默认值）；游标的定义会产生查询对象，PACKAGE或存储过程暂不支持建立对查询对象的依赖关系。"
  source_anchor: "1.13.9.62 注意事项 页1644"
  source_refs: *refcursor
  status: confirmed
- id: cursor_wave8_93_example
  type: behavior_oracle
  statement: "示例1：BEGIN后CURSOR cursor1 FOR SELECT * FROM tbl_test ORDER BY 1；FETCH FORWARD 3 FROM cursor1返回1、2、3；MOVE FORWARD 2 FROM cursor1返回MOVE 2不返回结果行；再FETCH FORWARD 2返回6、7（跳过4、5）；CLOSE cursor1后END。示例2：CURSOR cursor2 WITH HOLD FOR ...，FETCH 3行后END事务结束，FETCH FORWARD 2 FROM cursor2仍返回4、5（普通游标事务结束不可用）；CLOSE cursor2关闭；相关链接FETCH、CLOSE、MOVE。"
  source_anchor: "1.13.9.62 示例 页1645-1646"
  source_refs: *refcursor
  status: confirmed
