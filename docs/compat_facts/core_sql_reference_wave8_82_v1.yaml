facts:
- id: drop_role_wave8_82_purpose
  type: syntax
  statement: "DROP ROLE删除指定的角色；语法为DROP ROLE [IF EXISTS] role_name[, ...]；role_name取值范围为已存在的角色。"
  source_anchor: "1.13.10.33 功能描述/语法格式/参数说明 页1685"
  source_refs: &refdroprole
  - w8_82_1_13_10_33
  status: confirmed
- id: drop_role_wave8_82_ifexists
  type: constraint
  statement: "IF EXISTS判断指定的角色是否存在：存在则删除成功；不存在不会进行删除操作，仅产生一个NOTICE提示，用于告知指定的角色不存在。"
  source_anchor: "1.13.10.33 参数说明 IF EXISTS 页1685"
  source_refs: *refdroprole
  status: confirmed
- id: drop_role_wave8_82_example
  type: behavior_oracle
  statement: "示例中CREATE ROLE role11后DROP ROLE IF EXISTS role11删除成功；删除不存在的role12产生NOTICE: role \"role12\" does not exist, skipping（相关链接CREATE ROLE、ALTER ROLE、SET ROLE）。"
  source_anchor: "1.13.10.33 示例 页1685"
  source_refs: *refdroprole
  status: confirmed
- id: drop_rls_wave8_82_purpose
  type: syntax
  statement: "DROP ROW LEVEL SECURITY POLICY删除表上某个行访问控制策略；语法为DROP [ROW LEVEL SECURITY] POLICY [IF EXISTS] policy_name ON table_name [CASCADE | RESTRICT]；policy_name为要删除的行访问控制策略名称；table_name为策略所在数据表名。"
  source_anchor: "1.13.10.34 功能描述/语法格式/参数说明 页1686"
  source_refs: &refdroprls
  - w8_82_1_13_10_34
  status: confirmed
- id: drop_rls_wave8_82_privileges
  type: constraint
  statement: "仅表的所有者或者管理员用户才能删除表的行访问控制策略。"
  source_anchor: "1.13.10.34 注意事项 页1686"
  source_refs: *refdroprls
  status: confirmed
- id: drop_rls_wave8_82_ifexists_cascade
  type: constraint
  statement: "IF EXISTS在策略不存在时不删除仅产生NOTICE提示；CASCADE | RESTRICT仅适配此语法，无对象依赖于该行访问控制策略，CASCADE和RESTRICT效果相同。"
  source_anchor: "1.13.10.34 参数说明 页1686"
  source_refs: *refdroprls
  status: confirmed
- id: drop_rls_wave8_82_example
  type: behavior_oracle
  statement: "示例中CREATE ROW LEVEL SECURITY POLICY all_data_rls ON all_data USING(role = CURRENT_USER)后DROP ROW LEVEL SECURITY POLICY all_data_rls ON all_data删除策略（相关链接ALTER ROW LEVEL SECURITY POLICY、CREATE ROW LEVEL SECURITY POLICY）。"
  source_anchor: "1.13.10.34 示例 页1686"
  source_refs: *refdroprls
  status: confirmed
- id: drop_rule_wave8_82_purpose
  type: syntax
  statement: "DROP RULE从数据库中删除一个重写规则；语法为DROP RULE [IF EXISTS] name ON table_name [CASCADE | RESTRICT]；name为要删除的现存规则名称；table_name为该规则应用的表名。"
  source_anchor: "1.13.10.35 功能描述/语法格式/参数说明 页1687"
  source_refs: &refdroprule
  - w8_82_1_13_10_35
  status: confirmed
- id: drop_rule_wave8_82_ifexists
  type: constraint
  statement: "IF EXISTS判断指定的规则是否存在：存在则删除成功；不存在不会进行删除操作，仅产生一个NOTICE提示。"
  source_anchor: "1.13.10.35 参数说明 IF EXISTS 页1687"
  source_refs: *refdroprule
  status: confirmed
- id: drop_rule_wave8_82_cascade_restrict
  type: constraint
  statement: "CASCADE | RESTRICT可选，是否级联删除依赖于该规则的对象，未指定时默认为RESTRICT：CASCADE级联删除依赖此规则的对象；RESTRICT在存在依赖此规则的对象时拒绝删除此规则。"
  source_anchor: "1.13.10.35 参数说明 CASCADE|RESTRICT 页1687"
  source_refs: *refdroprule
  status: confirmed
- id: drop_rule_wave8_82_example
  type: behavior_oracle
  statement: "示例中创建def_test表与def_view_test视图后CREATE RULE def_view_test_ins AS ON INSERT TO def_view_test DO INSTEAD INSERT INTO def_test SELECT new.*，DROP RULE def_view_test_ins ON def_view_test删除规则（相关链接CREATE RULE）。"
  source_anchor: "1.13.10.35 示例 页1687"
  source_refs: *refdroprule
  status: confirmed
- id: drop_security_label_wave8_82_purpose
  type: syntax
  statement: "DROP SECURITY LABEL删除当前数据库中的安全标签；语法为DROP SECURITY LABEL label_name；label_name为安全标签名称，需要删除的安全标签必须在数据库中存在。"
  source_anchor: "1.13.10.37 功能描述/语法格式/参数说明 页1689"
  source_refs: &refdropseclabel
  - w8_82_1_13_10_37
  status: confirmed
- id: drop_security_label_wave8_82_privileges
  type: constraint
  statement: "初始用户、具有SYSADMIN权限的用户或者继承了内置角色gs_role_seclabel权限的用户有权限删除安全标签。"
  source_anchor: "1.13.10.37 注意事项 页1689"
  source_refs: *refdropseclabel
  status: confirmed
- id: drop_security_label_wave8_82_example
  type: behavior_oracle
  statement: "示例中CREATE SECURITY LABEL sec_label 'L1:G4'后删除不存在的sec_label2报错ERROR: security label \"sec_label2\" does not exist，删除已存在的sec_label成功（相关链接CREATE SECURITY LABEL、SECURITY LABEL ON）。"
  source_anchor: "1.13.10.37 示例 页1689"
  source_refs: *refdropseclabel
  status: confirmed
- id: drop_table_wave8_82_purpose
  type: syntax
  statement: "DROP TABLE删除指定的表；语法为DROP TABLE [IF EXISTS] {[schema.]table_name}[, ...] [CASCADE | RESTRICT] [PURGE]；schema可选用于对表进行指定限制。"
  source_anchor: "1.13.10.41 功能描述/语法格式/参数说明 页1692-1693"
  source_refs: &refdroptable
  - w8_82_1_13_10_41
  status: confirmed
- id: drop_table_wave8_82_effects
  type: constraint
  statement: "对表进行删除后，依赖该表的索引会被删除，而使用到该表的函数和存储过程将无法执行；删除分区表会同时删除分区表中的所有分区。"
  source_anchor: "1.13.10.41 注意事项 页1692"
  source_refs: *refdroptable
  status: confirmed
- id: drop_table_wave8_82_privileges
  type: constraint
  statement: "仅表的所有者、表所在模式的所有者、被授予了表的DROP权限的用户或被授予DROP ANY TABLE权限的用户可以执行该操作；三权分立关闭时，系统管理员默认拥有该权限。"
  source_anchor: "1.13.10.41 注意事项 页1692"
  source_refs: *refdroptable
  status: confirmed
- id: drop_table_wave8_82_fk_lock
  type: constraint
  statement: "对表进行删除时，如果被删除的表作为外键表引用了另一张表，会级联删除被引用表上的触发器，此时需要对被引用表加八级锁，可能造成业务的阻塞。"
  source_anchor: "1.13.10.41 注意事项 页1692"
  source_refs: *refdroptable
  status: confirmed
- id: drop_table_wave8_82_cascade_purge
  type: constraint
  statement: "IF EXISTS在表不存在时不删除仅产生NOTICE提示；CASCADE允许级联删除依赖于该表的对象（如视图、触发器、索引；关联的表对象无法被级联删除）；RESTRICT（未指定默认）存在依赖对象时该表无法被删除；PURGE表示即使开启回收站功能，DROP TABLE删除表时也会直接物理删除表而不是放入回收站。"
  source_anchor: "1.13.10.41 参数说明 页1693"
  source_refs: *refdroptable
  status: confirmed
- id: drop_table_wave8_82_example
  type: behavior_oracle
  statement: "示例中DROP TABLE IF EXISTS test成功；test1存在依赖视图v_test1时DROP TABLE test1报错ERROR: table test1 cannot be dropped because other objects depend on it（DETAIL: view v_test1 depends on table test1，HINT提示使用CASCADE），使用DROP TABLE test1 CASCADE级联删除视图并产生NOTICE: drop cascades to view v_test1（相关链接ALTER TABLE、CREATE TABLE）。"
  source_anchor: "1.13.10.41 示例 页1693"
  source_refs: *refdroptable
  status: confirmed
