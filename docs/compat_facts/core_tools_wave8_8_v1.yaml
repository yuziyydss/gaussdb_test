facts:
- id: tools_wave8_8_overview
  type: syntax
  statement: "扩/缩容工具包括gs_expand升副本、gs_redis数据重分布、gs_redis_bucket bucket重分布和gs_shrink缩容。"
  source_anchor: "5.8.1 页3975"
  source_refs: &refb1
  - w8_8_5_8
  status: confirmed
- id: tools_wave8_8_expand_scope
  type: constraint
  statement: "集中式仅支持gs_expand升副本且不支持单独调用；集中式单节点不支持该工具。"
  source_anchor: "5.8.2 页3975"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_expand_state
  type: constraint
  statement: "升副本要求数据库实例处于normal状态，degraded和unavailable不支持。"
  source_anchor: "5.8.2 页3975"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_expand_replica_limit
  type: constraint
  statement: "一主多备数据库从2副本最多扩展到5副本；单副本数据库无此限制。"
  source_anchor: "5.8.2 页3975"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_expand_cascade_license
  type: constraint
  statement: "级联备升副本只支持集中式；具有License特性的数据库需保证License处于激活或试用期。"
  source_anchor: "5.8.2 页3975"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_expand_etcd_count
  type: constraint
  statement: "增加ETCD时节点总个数须为单数；2AZ需AZ1>=2、AZ2>=1且总数为3/5/7；3AZ需AZ1>=2、AZ2>=2、AZ3>=1且总数为5/7。"
  source_anchor: "5.8.2 页3976"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_expand_instance_counts
  type: constraint
  statement: "增加只读节点前需将主备DN的sync_config_strategy设为only_sync_node；单副本升副本时集中式需ETCD为3-7奇数、CMS为2-8个、DN>=2个。"
  source_anchor: "5.8.2 页3976"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_expand_host_prereq
  type: constraint
  statement: "新增主机需满足数据库安装要求、与原有主机保持locale/encoding一致，并完成安装路径和用户组规划。"
  source_anchor: "5.8.2 页3976"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_expand_dn_pattern
  type: constraint
  statement: "升副本支持新增主机只含DN，或DN+ETCD、DN+CMS、DN+ETCD+CMS；不支持不包含DN实例的场景。"
  source_anchor: "5.8.2 页3976"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_expand_perf_bottleneck
  type: constraint
  statement: "新数据库实例整体性能取决于配置最低的机器；若新增主机硬件规格低于现有实例，需逐步替换为更高性能服务器。"
  source_anchor: "5.8.2 页3976"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_expand_maintenance_window
  type: behavior_oracle
  statement: "升副本过程中可能发生DN主备切换，应合理分配运维窗口期以避免业务影响。"
  source_anchor: "5.8.2 页3976"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_expand_commands
  type: syntax
  statement: "gs_expand支持dilatation扩容、redistribute重分布、crashclean回滚、resourcectl资源管控、progress进度查询等任务模式。"
  source_anchor: "5.8.2 页3976-3977"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_resource_levels
  type: environment
  statement: "gs_expand资源管控级别为f=100%、h=50%、m=30%、l=10%，默认l；f场景会充分使用资源提升重分布性能。"
  source_anchor: "5.8.2 页3980-3981"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_worker_dop
  type: constraint
  statement: "资源管控为f时，--max-worker表内并发度取值[1,8]默认8；--max-dop单表query_dop取值[1,64]默认4。"
  source_anchor: "5.8.2 页3980-3981"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_lockwait_timeout
  type: constraint
  statement: "--lockwait-timeout取值[1,1200000]毫秒，默认8000；--lockwait-interval取值[0,300]秒，默认0。"
  source_anchor: "5.8.2 页3981"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_lockwait_retry
  type: constraint
  statement: "--trylock-threshold取值[1,INT_MAX]或-1，默认-1表示无上限；--enable-cancel默认false，表示不快速失败用户业务。"
  source_anchor: "5.8.2 页3981"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_catchup_limits
  type: constraint
  statement: "--last-catchup-threshold取值[1000,60000]毫秒默认5000；--catchup-times取值[1,INT_MAX]或-1，默认-1表示无上限。"
  source_anchor: "5.8.2 页3982"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_write_error_mode
  type: environment
  statement: "--write-error-mode=true表示写报错模式，false表示全阻塞最后一轮追增；默认true。"
  source_anchor: "5.8.2 页3982"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_catchup_dop
  type: constraint
  statement: "--catchup-query-dop为追增并行扫描度，取值[1,32]。"
  source_anchor: "5.8.2 页3982"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_8_join_table_groups
  type: constraint
  statement: "多表扩容join配置中，database/schema/tablename名称不能含空格；schema和tablename含大写或特殊字符需双引号转义；每行schema/tablename成对出现，一张表不能出现在多个分组，每组表数为2-5。"
  source_anchor: "5.8.2 页3979-3980"
  source_refs: *refb1
  status: confirmed
