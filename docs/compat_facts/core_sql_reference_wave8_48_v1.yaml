facts:
- id: createsch_wave8_48_purpose
  type: syntax
  statement: "CREATE SCHEMA用于创建模式；命名对象可用模式名前缀访问，无前缀时访问当前模式下的命名对象。"
  source_anchor: "1.13.9.43 页1520"
  source_refs: &refcreate
  - w8_48_1_13_9_43
  status: confirmed
- id: createsch_wave8_48_permissions
  type: constraint
  statement: "数据库有CREATE权限的用户可以创建模式；系统管理员在普通用户同名Schema下创建的对象，其所有者为该Schema同名非系统管理员用户。"
  source_anchor: "1.13.9.43 注意事项 页1520"
  source_refs: *refcreate
  status: confirmed
- id: createsch_wave8_48_main_syntax
  type: syntax
  statement: "CREATE SCHEMA支持按指定名称创建、按AUTHORIZATION用户名创建，并可指定WITH BLOCKCHAIN、默认CHARACTER SET/CHARSET和COLLATE，也可包含schema_element子命令。"
  source_anchor: "1.13.9.43 语法格式 页1520"
  source_refs: *refcreate
  status: confirmed
- id: createsch_wave8_48_name_rules
  type: constraint
  statement: "模式新名称不能与当前数据库其他模式重名，不能与初始用户重名；请勿使用pg_或gs_role_开头，也不要使用data_redis命名。"
  source_anchor: "1.13.9.43 schema_name 页1521"
  source_refs: *refcreate
  status: confirmed
- id: createsch_wave8_48_authorization
  type: syntax
  statement: "AUTHORIZATION user_name指定模式所有者；不指定schema_name时user_name会作为模式名，且此时user_name只能是角色名。"
  source_anchor: "1.13.9.43 AUTHORIZATION 页1521"
  source_refs: *refcreate
  status: confirmed
- id: createsch_wave8_48_blockchain
  type: syntax
  statement: "WITH BLOCKCHAIN指定模式防篡改属性；需设置GUC参数enable_ledger=on，该参数默认off、级别SIGHUP，防篡改模式下行存普通用户表自动扩展为防篡改用户表。"
  source_anchor: "1.13.9.43 WITH BLOCKCHAIN 页1521"
  source_refs: *refcreate
  status: confirmed
- id: createsch_wave8_48_schema_element
  type: syntax
  statement: "schema_element当前仅支持CREATE TABLE、CREATE VIEW、CREATE INDEX、CREATE TABLE PARTITION、CREATE SEQUENCE、CREATE TRIGGER和GRANT；AUTHORIZATION指定对象属主，若搜索路径存在同名对象需显式指定模式。"
  source_anchor: "1.13.9.43 schema_element 页1521"
  source_refs: *refcreate
  status: confirmed
- id: createsch_wave8_48_charset_collate
  type: constraint
  statement: "模式默认字符集和字符序语法仅B模式或M兼容模式支持；未指定字符序时使用字符集默认字符序，未指定字符集时使用字符序对应默认字符集。"
  source_anchor: "1.13.9.43 default_charset/default_collation 页1521-1522"
  source_refs: *refcreate
  status: confirmed
- id: altsch_wave8_48_purpose_permissions
  type: constraint
  statement: "ALTER SCHEMA修改模式名称、所有者和防篡改属性；仅模式所有者或被授予模式ALTER权限且拥有当前数据库CREATE权限的用户可执行，三权分立关闭时系统管理员默认拥有。"
  source_anchor: "1.13.7.29 功能/注意事项 页1259"
  source_refs: &refalt
  - w8_48_1_13_7_29
  status: confirmed
- id: altsch_wave8_48_owner_permissions
  type: constraint
  statement: "修改模式所有者时，当前用户必须是模式所有者或系统管理员，且是新所有者角色的成员；非系统管理员还必须是新所有角色的直接或间接成员并拥有数据库CREATE权限。除初始用户外，其他用户无法将模式所有者修改为运维管理员。"
  source_anchor: "1.13.7.29 注意事项 页1259-1260"
  source_refs: *refalt
  status: confirmed
- id: altsch_wave8_48_system_modes
  type: constraint
  statement: "仅初始用户可修改除PUBLIC以外系统模式（如pg_catalog、sys）的所有者；系统自带模式名称默认不允许修改，仅在系统启动/升级过程或allow_system_table_mods=on时可修改。"
  source_anchor: "1.13.7.29 注意事项 页1259"
  source_refs: *refalt
  status: confirmed
- id: altsch_wave8_48_main_syntax
  type: syntax
  statement: "ALTER SCHEMA支持{WITH|WITHOUT} BLOCKCHAIN、RENAME TO new_name、OWNER TO new_owner，以及指定默认CHARACTER SET/CHARSET和COLLATE。"
  source_anchor: "1.13.7.29 语法格式 页1259"
  source_refs: *refalt
  status: confirmed
- id: altsch_wave8_48_name_rules
  type: constraint
  statement: "ALTER后的模式新名称不能与其他模式重名，不能与初始用户重名，请勿使用pg_或gs_role_开头或data_redis命名。"
  source_anchor: "1.13.7.29 RENAME TO 页1260"
  source_refs: *refalt
  status: confirmed
- id: altsch_wave8_48_blockchain
  type: constraint
  statement: "WITH BLOCKCHAIN表示防篡改模式，需enable_ledger=on；防篡改模式下普通行存用户表均为防篡改历史表，不包括外表、临时表和系统表；不支持临时表模式、toast表模式、dbe_perf模式和blockchain模式修改防篡改属性。"
  source_anchor: "1.13.7.29 WITH/WITHOUT BLOCKCHAIN 页1260"
  source_refs: *refalt
  status: confirmed
- id: altsch_wave8_48_blockchain_empty
  type: constraint
  statement: "只有模式中不包含任何表时，才可以修改防篡改属性，或使用该语法在普通模式和防篡改模式之间中转。"
  source_anchor: "1.13.7.29 WITH/WITHOUT BLOCKCHAIN 页1260"
  source_refs: *refalt
  status: confirmed
- id: altsch_wave8_48_charset_collate
  type: constraint
  statement: "ALTER SCHEMA默认字符集/字符序仅B模式或M兼容模式支持；未指定字符序时使用字符集默认字符序，未指定字符集时使用字符序对应默认字符集，除binary外仅支持与数据库编码相同的字符集。"
  source_anchor: "1.13.7.29 default_charset/default_collate 页1260-1261"
  source_refs: *refalt
  status: confirmed
- id: dropsch_wave8_48_purpose_permissions
  type: constraint
  statement: "DROP SCHEMA从数据库删除模式；仅Schema所有者或被授予模式DROP权限的用户可执行，三权分立关闭时系统管理员默认拥有该权限。"
  source_anchor: "1.13.10.36 注意事项 页1688"
  source_refs: &refdrop
  - w8_48_1_13_10_36
  status: confirmed
- id: dropsch_wave8_48_system_modes
  type: constraint
  statement: "allow_system_table_mods关闭时禁止删除DBE_PLDEVELOPER；系统模式仅初始用户有权限删除，Public Schema不支持删除。"
  source_anchor: "1.13.10.36 注意事项 页1688"
  source_refs: *refdrop
  status: confirmed
- id: dropsch_wave8_48_syntax
  type: syntax
  statement: "DROP SCHEMA [IF EXISTS] schema_name[, ...] [CASCADE|RESTRICT]；CASCADE自动删除模式中的对象，RESTRICT在模式包含任何对象时删除失败且为缺省行为。"
  source_anchor: "1.13.10.36 语法/参数 页1688"
  source_refs: *refdrop
  status: confirmed
- id: dropsch_wave8_48_temp_current
  type: constraint
  statement: "不要随意删除pg_temp或pg_toast_temp开头的系统内部模式；无法直接删除当前模式，删除前须切换到其他模式。"
  source_anchor: "1.13.10.36 DROP SCHEMA须知 页1688"
  source_refs: *refdrop
  status: confirmed
open_questions:
- id: sch_wave8_48_oq_runtime
  statement: "CREATE/ALTER/DROP SCHEMA在真实权限、防篡改属性、字符集、嵌套对象和CASCADE依赖组合下的行为与错误矩阵需授权环境实机验证。"
  status: open
