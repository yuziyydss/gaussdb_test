- id: misc_wave8_177_mysql_compat_overview
  type: syntax
  statement: "MySQL兼容性概述（4.4.1）：GaussDB提供MySQL兼容性M-Compatibility模式；在MySQL中Database和Schema是同义词，而GaussDB中一个Database下可以有多个Schema（每个MySQL的Database映射到GaussDB的一个Schema）；在MySQL中INDEX从属于TABLE，在GaussDB中INDEX从属于Schema（INDEX名要求Schema内唯一 vs MySQL表内唯一，差异作为约束予以保留）。"
  source_anchor: "4.4.1 MySQL数据库兼容性概述 页3291-3292"
  source_refs: &refc44
  - w8_177_4_4_1
  status: confirmed
- id: misc_wave8_177_mysql_object_hierarchy
  type: syntax
  statement: "MySQL与GaussDB对象层次差异：MySQL的数据对象包括DATABASE/TABLE/INDEX/VIEW/TRIGGER/PROC等，MySQL的对象层次跟GaussDB的对应关系是从上至下且一对多包含关系；MySQL中Database和Schema是同义词而GaussDB中一个Database下可以有多个Schema的差异将作为当前约束予以保留。"
  source_anchor: "4.4.1 MySQL数据库兼容性概述 页3292"
  source_refs: *refc44
  status: confirmed
- id: misc_wave8_177_tool_roles
  type: syntax
  statement: "GaussDB工具角色分类：客户端用户（数据库部署成功后通过工具便捷连接数据库进行调试和操作，GaussDB提供数据库连接工具和数据导入导出工具）；服务端用户（使用GaussDB过程中需对数据库进行安装/升级/扩容/卸载及健康管理，GaussDB提供安装卸载/运维管理/性能监控/备份/扩缩容/升级/安全工具）。"
  source_anchor: "5.1 工具参考简介 页3574"
  source_refs: &ref51
  - w8_177_5_1
  status: confirmed
- id: misc_wave8_177_tool_scenarios
  type: syntax
  statement: "GaussDB工具场景分类：安装/卸载工具（安装数据库/初始化/清理/卸载）、数据库连接工具（gsql连接服务器操作维护）、数据库运维管理工具（启停/状态查询/进程管理/事务管理/节点间命令执行与文件传输）、数据库性能监控工具（日常检查/日志收集/故障分析定位）、备份恢复工具（丰富备份策略支持多种介质）、数据导入导出工具（适用不同场景迁移）、数据库扩缩容工具、数据库升级工具（就地/灰度/滚动升级+应用热补丁）、安全工具（明文字符串加密）、统一数据库管理工具（自定义资源监控/主备切换/日志管理）。"
  source_anchor: "5.1 工具参考简介 页3574-3576"
  source_refs: *ref51
  status: confirmed
