facts:
- id: misc_wave8_177_sql_definition
  type: syntax
  statement: "SQL是用于访问和处理数据库的标准计算机语言；SQL提供各种任务的语句包括查询数据、在表中插入/更新/删除行、创建/替换/更改/删除对象、控制对数据库及其对象的访问、保证数据库一致性和完整性；SQL语言由用于处理数据库和数据库对象的命令和函数组成，强制实施数据类型/表达式/文本使用的规则。"
  source_anchor: "1.1 GaussDB SQL 页50"
  source_refs: &refs1
  - w8_177_1_1
  status: confirmed
- id: misc_wave8_177_sql_history_standard
  type: syntax
  statement: "SQL发展简史：1986年SQL-86（ANSI X3.135-1986）→1989年SQL-89→1992年SQL-92→1999年SQL:1999→2003年SQL:2003→2011年SQL:2011→2016年SQL:2016→2019年SQL:2019；GaussDB默认支持SQL:2016的大部分特性。"
  source_anchor: "1.1 GaussDB SQL 页50-51"
  source_refs: *refs1
  status: confirmed
- id: misc_wave8_177_client_charset_flow
  type: constraint
  statement: "客户端连接字符集转换流程：含有字符集属性的数据在服务端和客户端之间传输时自动转换编码；服务端接收到SQL语句后由client_encoding向server_encoding转换；查询结果发送到客户端前向character_set_results转换；字符数据转换编码过程中会校验字符编码、不符合时抛出异常返回ERROR。"
  source_anchor: "1.4.1 客户端连接的字符集和字符序 页180"
  source_refs: &ref14
  - w8_177_1_4
  status: confirmed
- id: misc_wave8_177_client_charset_params
  type: syntax
  statement: "客户端连接字符集系统参数：server_encoding（创建数据库时指定的字符集）/client_encoding（客户端字符集可通过SET NAMES修改）/character_set_connection（SQL语句中未指定字符集的字符串常量默认字符集）/collation_connection（未指定字符序的字符串常量默认字符序）/character_set_results（返回结果字符集）；非字符类型转字符类型的表达式结果字符集和字符序为character_set_connection和collation_connection；字符类型绑定参数的字符集默认为character_set_connection和collation_connection设置的值。"
  source_anchor: "1.4.1 系统参数说明 页180"
  source_refs: *ref14
  status: confirmed
- id: misc_wave8_177_database_charset
  type: syntax
  statement: "数据库级字符集：CREATE DATABASE [IF NOT EXISTS] database_name [ENCODING [=] encoding] [LC_COLLATE [=] lc_collate] [LC_CTYPE [=] lc_ctype]；ENCODING指定字符编码（可为字符串如'SQL_ASCII'或整数编号）；LC_COLLATE影响字符串排序行为（含ORDER BY和文本列索引排序顺序）默认模板数据库排序规则；LC_CTYPE影响字符分类（含大小写字母和数字）默认模板数据库字符分类。"
  source_anchor: "1.4.2 数据库级字符集和字符序 页180-181"
  source_refs: *ref14
  status: confirmed
- id: misc_wave8_177_schema_charset
  type: syntax
  statement: "模式级字符集和字符序：在CREATE SCHEMA时可以指定模式级字符集和字符序；模式级字符集和字符序的默认值继承自数据库级设置。"
  source_anchor: "1.4.3 模式级字符集和字符序 页181-182"
  source_refs: *ref14
  status: confirmed
- id: misc_wave8_177_table_charset
  type: syntax
  statement: "表级字符集和字符序：在CREATE TABLE时通过CHARACTER SET/COLLATE子句指定表级字符集和字符序；表级默认值继承自模式级或数据库级设置。"
  source_anchor: "1.4.4 表级字符集和字符序 页182-183"
  source_refs: *ref14
  status: confirmed
- id: misc_wave8_177_column_charset
  type: syntax
  statement: "列级字符集和字符序：在列定义中通过CHARACTER SET/COLLATE子句指定列级字符集和字符序；列级默认值继承自表级设置。"
  source_anchor: "1.4.5 列级字符集和字符序 页183-184"
  source_refs: *ref14
  status: confirmed
- id: misc_wave8_177_expr_charset
  type: syntax
  statement: "字符类型表达式的字符集和字符序：字符类型表达式的字符集和字符序由表达式中各操作数的字符集和字符序合并决定；合并规则遵循高优先级覆盖低优先级的原则。"
  source_anchor: "1.4.6 字符类型表达式的字符集和字符序 页184-185"
  source_refs: *ref14
  status: confirmed
- id: misc_wave8_177_charset_merge_rules
  type: constraint
  statement: "字符集和字符序合并规则：字符集和字符序的合并遵循就近原则——从列级到表级到模式级到数据库级逐级向上查找；如果存在显式指定的字符集/字符序则覆盖隐式继承的值；不同级别的合并冲突时以更具体的级别为准。"
  source_anchor: "1.4.7 字符集和字符序合并规则 页185-186"
  source_refs: *ref14
  status: confirmed
