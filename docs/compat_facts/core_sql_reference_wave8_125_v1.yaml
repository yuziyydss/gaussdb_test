facts:
- id: m_cast_wave8_125_types
  type: syntax
  statement: "M兼容CAST(expr AS type)将表达式显式转换为数据类型type（等价于CONVERT(expr, type)）；type支持：BINARY[(N)]（expr为NULL返回BINARY(0)否则VARBINARY；指定N超出截断不足用0x00填充；长度超BINARY上限返回BLOB仍不足LONGBLOB；N受GUC参数max_allowed_packet影响最大取值Min(max_allowed_packet, 1073741819)）、CHAR[(N)]（NULL返回CHAR(0)否则VARCHAR；超出N截断不足不填充；超VARCHAR上限返回TEXT仍不足LONGTEXT）、DATE、DATETIME[(M)]（M秒精度[0,6]）、TIME[(N)]、DECIMAL[M[,D]]（M最大位数最大65默认10，D小数位最大30默认0）、DOUBLE、FLOAT[(p)]（p>=0且p<24为FLOAT，p>=24为DOUBLE，p<0错误）、JSON、SIGNED[INTEGER]（带符号BIGINT）、UNSIGNED[INTEGER]（无符号BIGINT）。"
  source_anchor: "2.5.9 CAST 页2392-2393"
  source_refs: &refmcast
  - w8_125_2_5_9
  status: confirmed
- id: m_cast_wave8_125_examples
  type: behavior_oracle
  statement: "CAST示例基线（m_db）：CAST('abc' AS BINARY(2))带WARNING: Truncated incorrect binary(2) value: 'abc'返回ab；CAST('abc' AS CHAR(10))返回abc；CAST('2023/1/1' AS DATE)返回2023-01-01；CAST('2023/01/01' AS DATETIME(2))返回2023-01-01 00:00:00.00；CAST('09:23:14' AS TIME(2))返回09:23:14.00；CAST(12.34567 AS DECIMAL(10,4))。"
  source_anchor: "2.5.9 CAST 示例 页2393"
  source_refs: *refmcast
  status: confirmed
- id: m_cast_wave8_125_convert
  type: syntax
  statement: "M兼容CONVERT(expr, type)与CAST(expr AS type)功能等价，均用于将表达式显式转换为指定数据类型。"
  source_anchor: "2.5.9 CAST 页2392"
  source_refs: *refmcast
  status: confirmed
- id: m_inet6_aton_wave8_125_syntax
  type: syntax
  statement: "M兼容INET6_ATON(TEXT str)指定字符串形式的IPv4网络地址，函数返回网络地址的二进制字符串形式（如果入参不是有效地址则返回NULL，返回值类型VARBINARY）；示例SELECT HEX(INET6_ATON('1.2.3.4'))返回01020304。"
  source_anchor: "2.5.10 INET6_ATON 页2395"
  source_refs: &refminet
  - w8_125_2_5_10
  status: confirmed
- id: m_inet6_ntoa_wave8_125_syntax
  type: syntax
  statement: "M兼容INET6_NTOA(VARBINARY expr)指定二进制字符串形式的IPv4网络地址，函数返回以网络字节顺序表示的地址数值（当入参为有效地址且为VARBINARY或BINARY类型时返回有效结果否则返回NULL，返回值类型VARCHAR）；示例SELECT INET6_NTOA(INET6_ATON('1:2:3:4:5:6:7:8'))返回1:2:3:4:5:6:7:8。"
  source_anchor: "2.5.10 INET6_NTOA 页2395"
  source_refs: *refminet
  status: confirmed
- id: m_inet_aton_wave8_125_syntax
  type: syntax
  statement: "M兼容INET_ATON(TEXT str)指定字符串形式的IPv4网络地址，函数返回以网络字节顺序表示的地址数值（入参不是有效地址返回NULL，返回值类型BIGINT UNSIGNED）；示例SELECT INET_ATON('127'),INET_ATON('127.1'),INET_ATON('127.0.1'),INET_ATON('127.0.0.1')返回127、2130706433、2130706433、2130706433（省略的地址段自动补齐）。"
  source_anchor: "2.5.10 INET_ATON 页2395"
  source_refs: *refminet
  status: confirmed
- id: m_inet_ntoa_isv4_wave8_125_syntax
  type: syntax
  statement: "M兼容INET_NTOA(INT expr)指定按网络字节顺序排列的数字IPv4网络地址，函数返回网络地址的字符串形式（入参不是有效地址返回NULL，返回值类型VARCHAR），示例INET_NTOA(4294902271)返回255.255.1.255、INET_NTOA(4294967295)返回255.255.255.255、INET_NTOA(511)返回0.0.1.255；IS_IPV4(ANY expr)判断输入字符串是否为合法IPv4地址（合法返回1不合法返回0，字符串为NULL返回0，返回值类型INT）。"
  source_anchor: "2.5.10 INET_NTOA/IS_IPV4 页2396"
  source_refs: *refminet
  status: confirmed
- id: m_agg_wave8_125_overview
  type: constraint
  statement: "M兼容聚合函数对一组值进行计算并返回单个的值（除了COUNT(*)外聚合函数都会忽略NULL值，聚合函数通常与GROUP BY子句一起使用）；聚合函数的结果与数据输入顺序相关，不同的数据输入顺序会导致结果的精度差异（示例：select std(c1/c2) from t1结果15.02396266299967，select std(c1/c2 order by c2)因ORDER BY改变了聚合函数的执行顺序导致结果精度差异）。"
  source_anchor: "2.5.11 概述/说明 页2397-2398"
  source_refs: &refmagg
  - w8_125_2_5_11
  status: confirmed
- id: m_agg_wave8_125_avg
  type: syntax
  statement: "M兼容AVG([ALL | DISTINCT] expr) [over_clause]返回输入expr的平均值（NULL值将被忽略；指定over_clause时作为窗口函数）；返回值类型视入参数据类型而定（入参为精确值INT、DECIMAL时返回DECIMAL等）；如果expr中的值均为NULL则AVG()返回NULL；示例SELECT age, AVG(salary) FROM m_test GROUP BY (age)、SELECT age, AVG(DISTINCT salary) FROM m_test GROUP BY (age)。"
  source_anchor: "2.5.11 AVG 页2398-2399"
  source_refs: *refmagg
  status: confirmed
- id: m_agg_wave8_125_bit_funcs
  type: syntax
  statement: "M兼容位聚合函数：BIT_AND([ALL] expr)、BIT_OR([ALL] expr)、BIT_XOR([ALL] expr)分别按位与/或/异或聚合（均支持over_clause窗口用法）。"
  source_anchor: "2.5.11 BIT_AND/BIT_OR/BIT_XOR 页2399-2400"
  source_refs: *refmagg
  status: confirmed
- id: m_agg_wave8_125_count
  type: syntax
  statement: "M兼容COUNT([ALL] expr)返回expr中非空值的数量（返回值类型BIGINT；如果expr中的值均为NULL则COUNT()返回0；COUNT(*)比较特殊它返回expr中所有值的数量无论其是否为NULL）；COUNT(DISTINCT expr1 [, expr2, ..., exprN])返回expr中不同非空值的数量（返回值类型BIGINT，支持多参数组合去重计数）；示例SELECT COUNT(ALL salary) FROM m_test GROUP BY age、SELECT COUNT(*) FROM m_test GROUP BY age。"
  source_anchor: "2.5.11 COUNT 页2399-2400"
  source_refs: *refmagg
  status: confirmed
- id: m_agg_wave8_125_group_concat
  type: constraint
  statement: "M兼容GROUP_CONCAT([DISTINCT] expr [,expr ...][SEPARATOR str_val])将expr中的各个值进行拼接返回一个字符串结果（NULL值会被忽略，返回值类型TEXT或BLOB）；SEPARATOR为拼接字符串时使用的分隔符默认为逗号\",\"；GROUP_CONCAT(... ORDER BY 数字)不代表按照第几个参数的顺序（数字只是常量）；使用参数group_concat_max_len限制GROUP_CONCAT最大返回长度（超长截断）；示例SELECT GROUP_CONCAT(name SEPARATOR '') FROM m_test、SELECT GROUP_CONCAT(DISTINCT id, name ORDER BY id DESC) FROM m_test。"
  source_anchor: "2.5.11 GROUP_CONCAT 页2401-2402"
  source_refs: *refmagg
  status: confirmed
- id: m_agg_wave8_125_json_agg
  type: syntax
  statement: "M兼容JSON_ARRAYAGG(col_or_expr)将结果集聚合为单个JSON数组（作用于列或计算结果为单个值的表达式）；JSON_OBJECTAGG(key, value)将键值对聚合为JSON对象。"
  source_anchor: "2.5.11 JSON_ARRAYAGG/JSON_OBJECTAGG 页2402-2403"
  source_refs: *refmagg
  status: confirmed
- id: m_agg_wave8_125_max_min
  type: syntax
  statement: "M兼容MAX([ALL | DISTINCT] expr) [over_clause]返回最大值、MIN([ALL | DISTINCT] expr) [over_clause]返回最小值。"
  source_anchor: "2.5.11 MAX/MIN 页2403-2405"
  source_refs: *refmagg
  status: confirmed
- id: m_agg_wave8_125_std_variance
  type: constraint
  statement: "M兼容标准差与方差聚合：STD(expr)计算所有expr总体标准差并返回结果（指定over_clause时作为窗口函数，返回值类型DOUBLE）；STDDEV(expr)为STD的同义函数功能用法完全相同；STDDEV_POP(expr)总体标准差；STDDEV_SAMP(expr)样本标准差；VARIANCE(expr)与VAR_POP(expr)总体方差；VAR_SAMP(expr)样本方差；示例SELECT STD(math) AS std_math FROM students、SELECT name, STD(math) OVER(ORDER by math ROWS BETWEEN UNBOUNDED PRECEDING ...)窗口用法。"
  source_anchor: "2.5.11 STD/STDDEV/STDDEV_POP/STDDEV_SAMP/VARIANCE/VAR_POP/VAR_SAMP 页2405-2408"
  source_refs: *refmagg
  status: confirmed
- id: m_agg_wave8_125_sum
  type: syntax
  statement: "M兼容SUM([ALL | DISTINCT] expr) [over_clause]求和聚合：ALL包含所有非空值，DISTINCT去重求和；支持over_clause窗口用法。"
  source_anchor: "2.5.11 SUM 页2408"
  source_refs: *refmagg
  status: confirmed
- id: m_agg_wave8_125_examples
  type: behavior_oracle
  statement: "聚合示例基线（m_db）：CREATE TABLE m_test(name VARCHAR(20), c1 INT(100), c2 FLOAT(7,5))插入10行（计算机/数据库两组各5行）后select std(c1/c2) from t1返回15.02396266299967；select std(c1/c2 order by c2) from t1因ORDER BY改变聚合执行顺序导致精度差异。"
  source_anchor: "2.5.11 说明 示例 页2398"
  source_refs: *refmagg
  status: confirmed
- id: m_cast_wave8_125_convert_detail
  type: syntax
  statement: "M兼容CONVERT(expr, type)与CAST(expr AS type)的type支持类型完全一致：BINARY[(N)]、CHAR[(N)]、DATE、DATETIME[(M)]、TIME[(N)]、DECIMAL[M[,D]]、DOUBLE、FLOAT[(p)]、JSON、SIGNED[INTEGER]、UNSIGNED[INTEGER]（各类型的NULL/截断/填充/上限行为与CAST相同）。"
  source_anchor: "2.5.9 CAST 页2392-2393"
  source_refs: *refmcast
  status: confirmed
- id: m_agg_wave8_125_over_clause
  type: constraint
  statement: "M兼容聚合函数支持over_clause窗口用法（如AVG(salary) OVER(PARTITION BY age ORDER by salary RANGE BETWEEN ...)、STD(math) OVER(ORDER by math ROWS BETWEEN UNBOUNDED PRECEDING ...)），指定over_clause后聚合函数作为窗口函数使用。"
  source_anchor: "2.5.11 聚合函数 over_clause 页2398-2408"
  source_refs: *refmagg
  status: confirmed
- id: m_agg_wave8_125_count_distinct_multi
  type: constraint
  statement: "M兼容COUNT(DISTINCT expr1 [, expr2, ..., exprN])支持多参数组合去重计数（返回不同非空值的组合数量，返回值类型BIGINT）；示例SELECT COUNT(DISTINCT salary) FROM m_test GROUP BY age。"
  source_anchor: "2.5.11 COUNT DISTINCT 页2400"
  source_refs: *refmagg
  status: confirmed
open_questions:
- id: m_conv_agg_wave8_125_oq_runtime
  statement: "CAST的BINARY/CHAR长度与max_allowed_packet联动截断边界、聚合函数输入顺序导致精度差异的可复现规律、INET6_ATON对IPv6缩写形式的支持范围需授权环境实机验证。"
  status: open
