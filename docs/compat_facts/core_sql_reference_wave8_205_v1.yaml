- id: guc_wave8_205_tcp_keepalive
  type: syntax
  statement: "TCP保活参数（均为USERSET/SIGHUP，不同会话不共享，Unix域套接字忽略，设0使用系统值）：tcp_keepalives_idle发送保持活跃信号间隔0~3600秒默认60；tcp_keepalives_interval重传之间等待响应0~180秒默认30；tcp_keepalives_count断开前等待保持活跃信号个数0~100默认20（0=立即断开）。tcp_user_timeout：SIGHUP整型0~3600000毫秒默认0数据未确认状态最大时长；x86 Euler2.5实际重传耗时取区间上限而非设置值。"
  source_anchor: "7.3.3.3 通信库参数 页4198-4200"
  source_refs: *refw8205
  status: confirmed
