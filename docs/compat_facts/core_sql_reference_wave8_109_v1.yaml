facts:
- id: m_create_extension_wave8_109_syntax
  type: syntax
  statement: "M兼容CREATE EXTENSION当前不支持用户使用此语法（安装一个扩展，该特性为内部使用，只允许创建数据库内部的高级包或扩展）；语法为CREATE EXTENSION [ IF NOT EXISTS ] extension_name [ WITH ] [ SCHEMA schema_name ] [ VERSION version ] [ FROM old_version ]。"
  source_anchor: "2.4.2.8.8 功能描述/语法格式 页2093"
  source_refs: &refmext2
  - w8_109_2_4_2_8_8
  status: confirmed
- id: m_create_extension_wave8_109_prereq
  type: constraint
  statement: "CREATE EXTENSION载入前必须先安装好扩展的支持文件；必须保证没有同名的扩展已经被安装；安装意味着执行一个扩展的脚本文件（创建新的SQL实体，例如函数、数据类型、操作符和索引支持的方法）；安装需要有和创建其组件对象相同的权限（大多数扩展需要超户或数据库所有者权限），运行CREATE EXTENSION命令的角色将变为扩展的所有者；数据库中存在与EXTENSION内同名的同义词、操作符、目录、函数、存储过程、视图、表这些对象时将导致创建失败；数据库禁止直接创建扩展（可能引起非预期错误且升级后面临不兼容问题），需设置enable_extension为true才能创建；enable_object_special_character为off且扩展脚本文件中使用\"@extschema@\"时，支持文件中schema参数的值不能包含[\"$'\\]中任意特殊字符。"
  source_anchor: "2.4.2.8.8 注意事项 页2093"
  source_refs: *refmext2
  status: confirmed
- id: m_create_extension_wave8_109_params
  type: constraint
  statement: "参数：IF NOT EXISTS时系统已存在同名扩展不会报错仅给提示（该参数不保证系统存在的扩展和现在脚本创建的扩展相同）；extension_name使用文件SHAREDIR/extension/extension_name.control中的详细信息创建；schema_name为扩展实例安装模式（必须已存在，未指定且控制文件也未指定时使用默认模式）；扩展不认为它在任何模式里面——扩展在数据库范围内的名字不受限制，但扩展的实例属于一个模式；version默认在扩展控制文件中指定；FROM old_version用于升级安装old style模块中没有的内容（运行安装脚本将新内容安装到扩展中而不是创建新实体，SCHEMA指定包括已存在实体的模式）。"
  source_anchor: "2.4.2.8.8 参数说明/注意 页2093-2094"
  source_refs: *refmext2
  status: confirmed
- id: m_create_extension_wave8_109_example
  type: behavior_oracle
  statement: "示例（m_db）：在当前数据库安装扩展CREATE EXTENSION IF NOT EXISTS security_plugin；删除扩展DROP EXTENSION security_plugin；相关链接ALTER EXTENSION、DROP EXTENSION。"
  source_anchor: "2.4.2.8.8 示例 页2094"
  source_refs: *refmext2
  status: confirmed
- id: m_create_function_wave8_109_syntax
  type: syntax
  statement: "M兼容CREATE OR REPLACE FUNCTION function_name ( [ { argname [ argmode ] argtype [ { DEFAULT | := | = } expression ]} [, ...] ] ) [ RETURNS rettype | RETURNS TABLE ( { column_name column_type } [, ...] ) ] LANGUAGE lang_name [ {IMMUTABLE | STABLE | VOLATILE} | {SHIPPABLE | NOT SHIPPABLE} | [ NOT ] LEAKPROOF | STRICT | {AUTHID DEFINER | AUTHID CURRENT_USER} | not fenced | COST execution_cost | ROWS result_rows ][...] AS 'definition'；function_name与argname最多63字符（超过截断）；argmode取值IN/OUT/INOUT/VARIADIC（缺省IN，只有OUT模式参数后面能跟VARIADIC，OUT和INOUT不能用在RETURNS TABLE的函数定义中）；argtype与rettype可使用%TYPE或%ROWTYPE间接引用；SETOF表示函数返回一个集合。"
  source_anchor: "2.4.2.8.9 语法格式/参数说明 页2096-2097"
  source_refs: &refmfunc
  - w8_109_2_4_2_8_9
  status: confirmed
- id: m_create_function_wave8_109_overview
  type: constraint
  statement: "M兼容CREATE FUNCTION：内部使用功能不支持用户使用；创建函数时参数或返回值带有精度不进行精度检测；函数定义中对表对象的操作建议显式指定模式否则可能导致执行异常；出参生效必须打开GUC参数behavior_compat_options='proc_outparam_override'，SELECT、CALL调用时必须在出参位置提供实参否则调用失败；兼容PostgreSQL风格的函数支持重载。"
  source_anchor: "2.4.2.8.9 功能描述/注意事项 页2094"
  source_refs: *refmfunc
  status: confirmed
- id: m_create_function_wave8_109_overload
  type: constraint
  statement: "M兼容函数重载限制：不能创建仅形参名字不同（函数名和参数列表类型都一样）的重载函数；不支持形参仅在自定义ref cursor类型和sys_refcursor类型不同的重载；不支持仅返回数据类型不同的函数重载；不支持仅默认值不同的函数重载；重载函数调用时变量需明确具体类型；函数内部使用未声明变量调用时会报错；SELECT调用可以指定不同参数进行同名函数调用；创建function时不能在avg函数外面嵌套其他agg函数或其他系统函数。"
  source_anchor: "2.4.2.8.9 注意事项 页2094-2095"
  source_refs: *refmfunc
  status: confirmed
- id: m_create_function_wave8_109_public_authid
  type: constraint
  statement: "M兼容函数权限：新创建的函数默认给PUBLIC授予执行权限（用户默认继承PUBLIC角色权限，其他用户可有执行权限并查看定义，执行还需函数所在schema的USAGE权限），可收回PUBLIC默认执行权限并在一个事务中创建函数并设置执行权限以避免新函数被所有人访问的时间窗口；开启数据库对象隔离属性后普通用户只能查看有权限执行的函数定义；函数默认AUTHID CURRENT_USER权限，改为AUTHID DEFINER需设置behavior_compat_options='plsql_security_definer'；被授予CREATE ANY FUNCTION权限的用户可在用户模式下创建/替换函数；定义者权限的函数创建到其他用户Schema下会以其他用户的权限执行（有越权风险谨慎使用）；运维管理员的Schema下只允许初始用户、系统管理员和Schema属主自己创建对象。"
  source_anchor: "2.4.2.8.9 注意事项 页2095"
  source_refs: *refmfunc
  status: confirmed
- id: m_create_function_wave8_109_outparam
  type: constraint
  statement: "M兼容OUT参数限制：带OUT模式参数的函数不能在SQL语句中被调用、不能被SELECT INTO语法调用、不支持嵌套调用（b := func(a,func(c,1))建议改为tmp := func(c,1); b := func(a,tmp)）；打开proc_outparam_override后out/inout行为改变（函数同时返回return和out/inout，参数打开前仅返回return），且有如下限制：同一Schema和package已存在带out/inout参数函数时不能再次创建同名函数、部分场景不支持函数参与表达式（如CALL function）、不支持调用无RETURN的函数和PERFORM function调用、函数返回值为SETOF类型时out出参不会生效；表达式中使用out参数不生效的场景：execute immediate sqlv using func、select func into、insert/update等DML语句、select where a=func()、带out出参函数作为入参（fun(func(out b),a)中out出参b未生效）。"
  source_anchor: "2.4.2.8.9 注意事项 页2095-2096"
  source_refs: *refmfunc
  status: confirmed
- id: m_create_function_wave8_109_return_misc
  type: constraint
  statement: "M兼容函数其他限制：创建函数时不检查函数内返回值的类型；不支持使用函数自身作为入参默认值；函数内部调用其它无参数函数时可省略括号直接使用函数名；RETURN语句返回复合类型构造器调用时实际返回类型与定义返回类型不一致可隐式转换（支持跨schema如RETURN schema.record，不支持跨database如RETURN package.schema.record）；RETURN语句中返回FUNCTION调用时不支持在运算操作表达式中带OUT参数（如RETURN func(c out) + 1）；func(x).a复合类型返回支持跨schema调用，不支持database.schema.package.func(x).b方式；函数中存在GUC参数控制特性的语法时，会话内更改相关GUC参数后调用函数可能维持修改前的行为（谨慎变更）。"
  source_anchor: "2.4.2.8.9 注意事项 页2096"
  source_refs: *refmfunc
  status: confirmed
- id: m_create_function_wave8_109_default_params
  type: constraint
  statement: "M兼容函数默认参数：在a_format_version值为10c和a_format_dev_version值为s2时INOUT模式参数不支持默认表达式；推荐将所有默认值参数定义在所有非默认值参数后；调用带默认参数函数时入参从左往右排入，非默认参数入参缺失则报错；打开proc_uncheck_default_param后允许缺省默认参数个入参（非默认参数入参缺失会用错位的默认值填充）；a_format_version=10c、a_format_dev_version=s1且关闭proc_outparam_override时，函数参数同时包括out出参和default则默认值不可缺省。"
  source_anchor: "2.4.2.8.9 参数说明 页2097"
  source_refs: *refmfunc
  status: confirmed
- id: m_create_group_wave8_109_syntax
  type: syntax
  statement: "M兼容CREATE GROUP创建一个新用户组，是CREATE ROLE的别名（非SQL标准语法不推荐使用，建议直接使用CREATE ROLE）；语法为CREATE GROUP group_name [ [ WITH ] option [ ... ] ] { PASSWORD | IDENTIFIED BY } { 'password' [ EXPIRED ] | DISABLE }；option子句含SYSADMIN/MONADMIN/OPRADMIN/POLADMIN/AUDITADMIN/CREATEDB/USEFT/CREATEROLE/INHERIT/LOGIN/REPLICATION/PERSISTENCE各开关、CONNECTION LIMIT connlimit、VALID BEGIN/UNTIL 'timestamp'、USER GROUP、NODE GROUP、IN ROLE/IN GROUP/ROLE/ADMIN/USER role_name[,...]、DEFAULT TABLESPACE、PROFILE DEFAULT/PROFILE profile_name、PGUSER；参数说明参见CREATE ROLE章节。"
  source_anchor: "2.4.2.8.10 功能描述/注意事项/语法格式 页2100"
  source_refs: &refmgrp
  - w8_109_2_4_2_8_10
  status: confirmed
- id: m_create_group_wave8_109_example
  type: behavior_oracle
  statement: "示例（m_db）：CREATE GROUP super_users WITH PASSWORD后CREATE ROLE lche、jim，ALTER GROUP super_users ADD USER lche, jim添加用户、DROP USER jim删除用户、RENAME TO normal_users改组名，DROP GROUP normal_users删除；相关链接ALTER GROUP、DROP GROUP、CREATE ROLE。"
  source_anchor: "2.4.2.8.10 示例 页2100-2101"
  source_refs: *refmgrp
  status: confirmed
- id: m_create_index_wave8_109_recommend
  type: constraint
  statement: "M兼容CREATE INDEX在指定表上创建索引，建议仅在匹配原则时创建：经常执行查询的字段；连接条件字段（多字段连接查询建议建立组合索引，如SELECT * FROM t1 JOIN t2 ON t1.a=t2.a AND t1.b=t2.b可在t1的a、b字段上建组合索引）；WHERE子句的过滤条件字段（尤其范围条件）；经常出现在ORDER BY、GROUP BY和DISTINCT后的字段；索引自身占存储空间消耗计算资源，创建过多索引对性能有负面影响（尤其影响数据导入性能，建议数据导入后再建索引）。"
  source_anchor: "2.4.2.8.11 功能描述/注意事项 页2101"
  source_refs: &refmidx
  - w8_109_2_4_2_8_11
  status: confirmed
- id: m_create_index_wave8_109_immutable_limits
  type: constraint
  statement: "M兼容索引约束：索引定义里的所有函数和操作符必须是immutable类型（结果只能依赖输入参数不受外部影响如另一个表内容或当前时间），在索引或WHERE中使用用户定义函数需标记为immutable类型；分区表索引分LOCAL（与具体分区绑定）与GLOBAL（对应整个分区表）；被授予CREATE ANY INDEX权限的用户可在public模式和用户模式下创建索引；禁止其他用户在初始用户的表上创建包含用户自定义函数的表达式索引；表达式索引调用用户自定义函数时按函数创建者权限执行；普通表索引最大32列、分区表GLOBAL索引最大31列；单个索引大小不能超过索引页面大小8k（B-tree、UB-tree不能超过页面大小的三分之一）。"
  source_anchor: "2.4.2.8.11 注意事项 页2101"
  source_refs: *refmidx
  status: confirmed
- id: m_create_index_wave8_109_partition_rules
  type: constraint
  statement: "M兼容分区表索引规则：明确指定GLOBAL或LOCAL关键字时创建对应类型索引；未指定时默认创建GLOBAL索引，但创建UNIQUE索引且包含全部分区键时会创建LOCAL索引；分区表GLOBAL索引不支持表达式索引，仅支持B-tree索引（ASTORE，USTORE下为UB-tree）；顺序不同的索引列上支持同时创建LOCAL与GLOBAL索引，顺序相同的索引列上不支持；ALTER语句未包含UPDATE GLOBAL INDEX则原有GLOBAL索引失效（查询使用其他索引），含UPDATE GLOBAL INDEX则仍有效且功能正确；未开启精度传递参数（m_format_behavior_compat_options不含enable_precision_decimal）创建的索引在开启后会失效需重新创建。"
  source_anchor: "2.4.2.8.11 注意事项 页2101-2102"
  source_refs: *refmidx
  status: confirmed
- id: m_create_index_wave8_109_syntax
  type: syntax
  statement: "M兼容普通表索引语法：CREATE [ UNIQUE ] INDEX [ [schema_name.] index_name ] [index_type] ON table_name ( key_part,... ) [ WITH ( {storage_parameter = value} [, ... ] ) ] [ TABLESPACE tablespace_name ] [index_option] [algorithm_option | lock_option] ...；key_part为{ { column_name [ ( length ) ] | ( expression ) } [ COLLATE collation ] [ opclass ] [ ASC | DESC ] [ NULLS { FIRST | LAST } ] }[, ...]；index_type为USING {BTREE | UBTREE}；index_option含index_type与COMMENT 'string'；algorithm_option为ALGORITHM [=] {DEFAULT | INPLACE | COPY}；lock_option为LOCK [=] {DEFAULT | NONE | SHARED | EXCLUSIVE}；分区表语法增加[ LOCAL [ ( PARTITION index_partition_name [TABLESPACE] ...) ] | GLOBAL ]并可指定二级分区。"
  source_anchor: "2.4.2.8.11 语法格式 页2102-2103"
  source_refs: *refmidx
  status: confirmed
- id: m_create_index_wave8_109_btree_ubtree
  type: constraint
  statement: "USING method：BTREE使用类似B+树的结构存储键值（适合比较查询及范围查询）；UBTREE仅供ustore表使用的多版本btree索引（索引页面上包含事务信息并能自主回收页面，默认开启insertpt功能）；行存表（ASTORE）支持BTREE（缺省值），行存表（USTORE）支持BTREE（实际建立为UBTREE）；BTREE与表的存储类型astore/ustore强相关，指定索引类型与主表不对应时自动转换（ASTORE创建为BTREE，USTORE创建为UBTREE）；UNIQUE唯一性索引目前只有B-tree及UBtree索引支持。"
  source_anchor: "2.4.2.8.11 参数说明 USING/UNIQUE 页2103"
  source_refs: *refmidx
  status: confirmed
- id: m_create_index_wave8_109_prefix_expr
  type: constraint
  statement: "前缀键与表达式索引：column_name ( length )创建基于字段的前缀键索引（前缀键取字段数据前缀作为索引键值减少存储空间，支持BTREE、UBTREE，字段类型必须是二进制或字符类型，前缀长度为不超过2676的正整数且不超过字段最大长度，二进制以字节为单位、非二进制字符类型以字符数为单位，多字节字符或多键时索引行可能超限报错；前缀键属于特殊表达式键）；expression创建基于一个或多个字段的表达式索引（须写在圆括弧中，如upper(col)函数索引支持WHERE upper(col)='JIM'，表达式中包含IS NULL子句则索引无效）；COLLATE指定列排序规则（可用pg_collation查询）；字符串类型索引排序规则不在C或POSIX中但希望前缀匹配时需指定varchar_pattern_ops选项；opclass操作符类用于多种排序场景。"
  source_anchor: "2.4.2.8.11 参数说明 页2104-2105"
  source_refs: *refmidx
  status: confirmed
- id: m_create_index_wave8_109_examples
  type: behavior_oracle
  statement: "示例（m_db）：CREATE INDEX idx_test1 ON tbl_test1(name) TABLESPACE pg_default后pg_indexes查询（tablespace为空显示）；CREATE UNIQUE INDEX idx_test2 ON tbl_test1(id)后\\d显示UNIQUE btree索引；分区表student上CREATE INDEX idx_student1 ON student(id) LOCAL不指定索引分区名时LOCAL索引分区数和表分区数一致（pg_partition查询p1_id_idx、pmax_id_idx），CREATE INDEX idx_student2 ON student(id) GLOBAL后pg_partition查询分区数为0行（GLOBAL索引分区数与表分区数不一致）。"
  source_anchor: "2.4.2.8.11 示例 页2105-2108"
  source_refs: *refmidx
  status: confirmed
