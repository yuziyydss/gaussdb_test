facts:
- id: server_wave8_56_create_purpose
  type: syntax
  statement: "CREATE SERVER用于创建外部服务器；外部服务器是其他同构数据库信息的载体。"
  source_anchor: "1.13.9.46 页1528"
  source_refs: &refcreate
  - w8_56_1_13_9_46
  status: confirmed
- id: server_wave8_56_create_sensitive_options
  type: constraint
  statement: "CREATE SERVER的OPTIONS中敏感字段（如password）使用多层引号时，语义与不带引号场景不同，因此不会被识别为敏感字段进行脱敏。"
  source_anchor: "1.13.9.46 注意事项 页1528"
  source_refs: *refcreate
  status: confirmed
- id: server_wave8_56_create_syntax
  type: syntax
  statement: "CREATE SERVER server_name FOREIGN DATA WRAPPER fdw_name [OPTIONS ({option_name 'value'}[, ...])]用于创建外部服务器。"
  source_anchor: "1.13.9.46 语法格式 页1528"
  source_refs: *refcreate
  status: confirmed
- id: server_wave8_56_server_name
  type: constraint
  statement: "server_name为创建的外部服务器名称，需符合标识符命名规范且最大长度不超过63个字符。"
  source_anchor: "1.13.9.46 server_name 页1528"
  source_refs: *refcreate
  status: confirmed
- id: server_wave8_56_fdw_names
  type: constraint
  statement: "FOREIGN DATA WRAPPER当前取值为dist_fdw、log_fdw、file_fdw；log_fdw和file_fdw仅为语法兼容，可以创建外表但无实际使用意义。"
  source_anchor: "1.13.9.46 FOREIGN DATA WRAPPER 页1528-1529"
  source_refs: *refcreate
  status: confirmed
- id: server_wave8_56_options_role
  type: syntax
  statement: "OPTIONS指定外部服务器各类参数，通常定义连接细节；实际名称和值取决于服务器对应的外部数据封装器，除libpq连接参数外还额外支持fdw_startup_cost和fdw_typle_cost。"
  source_anchor: "1.13.9.46 OPTIONS 页1529"
  source_refs: *refcreate
  status: confirmed
- id: server_wave8_56_fdw_startup_cost
  type: syntax
  statement: "OPTIONS中fdw_startup_cost估算执行外表扫描时的启动耗时，通常包含建立连接、远端请求分析和生成计划耗时；默认值为100，取值范围为大于0的实数。"
  source_anchor: "1.13.9.46 fdw_startup_cost 页1529"
  source_refs: *refcreate
  status: confirmed
- id: server_wave8_56_fdw_tuple_cost
  type: syntax
  statement: "OPTIONS中fdw_typle_cost表示远端服务器对每个元组扫描时的额外消耗，通常表示数据在服务器间传输的额外消耗；默认值为0.01，取值范围为大于0的实数。"
  source_anchor: "1.13.9.46 fdw_typle_cost 页1529"
  source_refs: *refcreate
  status: confirmed
- id: server_wave8_56_create_examples
  type: behavior_oracle
  statement: "示例中CREATE SERVER my_server FOREIGN DATA WRAPPER file_fdw可创建外部服务器；CREATE SERVER server_remote ... log_fdw可使用address、dbname、username和password选项创建远端同构数据库服务器。"
  source_anchor: "1.13.9.46 示例 页1529"
  source_refs: *refcreate
  status: confirmed
- id: server_wave8_56_alter_purpose
  type: syntax
  statement: "ALTER SERVER用于增加、修改和删除指定服务器参数；已有服务器可从pg_foreign_server系统表查询。"
  source_anchor: "1.13.7.31 页1264"
  source_refs: &refalt
  - w8_56_1_13_7_31
  status: confirmed
- id: server_wave8_56_alter_permissions
  type: constraint
  statement: "只有SERVER所有者或被授予SERVER ALTER权限的用户可执行ALTER SERVER，系统管理员默认拥有该权限；修改SERVER所有者时，当前用户必须是SERVER所有者或系统管理员，且是新所有者角色的成员。"
  source_anchor: "1.13.7.31 注意事项 页1264"
  source_refs: *refalt
  status: confirmed
- id: server_wave8_56_alter_sensitive_options
  type: constraint
  statement: "ALTER SERVER的OPTIONS中敏感字段（如password、secret_access_key）使用多层引号时语义与不带引号场景存在差异，不会被识别为敏感字段脱敏。"
  source_anchor: "1.13.7.31 注意事项 页1264"
  source_refs: *refalt
  status: confirmed
- id: server_wave8_56_alter_syntax
  type: syntax
  statement: "ALTER SERVER支持修改VERSION和OPTIONS、OWNER TO new_owner、RENAME TO new_name；OPTIONS中ADD/SET/DROP指定操作，未指定时默认为ADD。"
  source_anchor: "1.13.7.31 语法格式 页1264-1265"
  source_refs: *refalt
  status: confirmed
- id: server_wave8_56_alter_options_validation
  type: constraint
  statement: "ALTER SERVER的OPTIONS选项名需满足唯一约束；ADD/SET/DROP为指定动作，名称和值会由该服务器的外部数据封装器库验证。"
  source_anchor: "1.13.7.31 OPTIONS 页1265"
  source_refs: *refalt
  status: confirmed
- id: server_wave8_56_alter_cost_options
  type: syntax
  statement: "ALTER SERVER除libpq连接参数外还额外支持fdw_startup_cost和fdw_tuple_cost；默认值分别为100和0.01，取值范围均为大于0的实数。"
  source_anchor: "1.13.7.31 cost参数 页1265"
  source_refs: *refalt
  status: confirmed
- id: server_wave8_56_alter_metadata_params
  type: syntax
  statement: "ALTER SERVER的new_version为外部服务器新版本名称，new_owner为外部服务器所有者，new_name为修改后的外部服务器新名称。"
  source_anchor: "1.13.7.31 参数说明 页1265"
  source_refs: *refalt
  status: confirmed
- id: server_wave8_56_alter_examples
  type: behavior_oracle
  statement: "示例中ALTER SERVER可完成RENAME TO、OWNER TO，并使用OPTIONS ADD/SET/DROP维护dbname、dbuser等选项；pg_foreign_server可查询srvname、srvowner和srvoptions变化。"
  source_anchor: "1.13.7.31 示例 页1265-1266"
  source_refs: *refalt
  status: confirmed
- id: server_wave8_56_drop_purpose
  type: syntax
  statement: "DROP SERVER用于删除一个已有的数据服务器。"
  source_anchor: "1.13.10.39 页1690"
  source_refs: &refdrop
  - w8_56_1_13_10_39
  status: confirmed
- id: server_wave8_56_drop_permissions
  type: constraint
  statement: "只有SERVER所有者或被授予SERVER DROP权限的用户可执行DROP SERVER；系统管理员默认拥有该权限。"
  source_anchor: "1.13.10.39 注意事项 页1690"
  source_refs: *refdrop
  status: confirmed
- id: server_wave8_56_drop_syntax
  type: syntax
  statement: "DROP SERVER [IF EXISTS] server_name [CASCADE|RESTRICT]；IF EXISTS在服务器不存在时不删除并返回NOTICE；CASCADE级联删除依赖该数据服务器的对象，RESTRICT在存在依赖对象时拒绝删除，未指定默认RESTRICT。"
  source_anchor: "1.13.10.39 语法/参数 页1691"
  source_refs: *refdrop
  status: confirmed
open_questions:
- id: server_wave8_56_oq_runtime
  statement: "CREATE/ALTER/DROP SERVER在真实FDW、连接选项、敏感信息脱敏、依赖对象和权限组合下的行为与错误矩阵需授权环境实机验证。"
  status: open
