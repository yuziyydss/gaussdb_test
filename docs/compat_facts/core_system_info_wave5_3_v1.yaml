  status: open
- id: sysinfo_wave5_3_oq_definition_boundary_evidence
  statement: "约束/表达式/函数/索引/视图/表定义以及序列和注释函数在不同对象类型、分区、ILM、PDB/Non-PDB和兼容模式下的输出矩阵需实机验证。"
  status: open
