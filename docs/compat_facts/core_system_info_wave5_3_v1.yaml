facts:
- id: sysinfo_wave5_3_visibility_general
  type: syntax
  statement: "模式可见性查询函数检查数据库对象类型可见性；函数和操作符在前面的搜索路径中没有同名同参数类型对象时可见，操作符类还考虑名称和相关索引访问方法。"
  source_anchor: "1.6.26 页579"
  source_refs: &id001
  - w5_3_1_6_26
  status: confirmed
- id: sysinfo_wave5_3_visibility_oid_aliases
  type: syntax
  statement: "模式可见性查询函数使用OID标识对象；通过名称测试时可使用regclass、regtype、regprocedure、regoperator、regconfig或regdictionary等OID别名类型。"
  source_anchor: "1.6.26 页579"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_visibility_table_example
  type: behavior_oracle
  statement: "pg_table_is_visible(oid)为true表示表所在模式在搜索路径中且前面搜索路径没有同名表，可等价于不带模式修饰引用该表。"
  source_anchor: "1.6.26 页579"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_visibility_functions
  type: syntax
  statement: "可见性函数包括pg_collation_is_visible、pg_conversion_is_visible、pg_function_is_visible、pg_opclass_is_visible、pg_operator_is_visible、pg_opfamily_is_visible、pg_table_is_visible、pg_ts_config_is_visible、pg_ts_dict_is_visible、pg_ts_parser_is_visible、pg_ts_template_is_visible和pg_type_is_visible，均返回Boolean。"
  source_anchor: "1.6.26 页579"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_format_type
  type: syntax
  statement: "format_type(type_oid,typemod)返回数据类型SQL名称；修饰词未知时传NULL；返回名称中的长度值是实际存储长度len减sizeof(int32)，示例format_type(varchar_oid,10)返回character varying(6)。"
  source_anchor: "1.6.26 页580"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_getdistributekey
  type: constraint
  statement: "getdistributekey(table_name)获取hash表分布列；单机环境不支持分布，该函数返回为空。"
  source_anchor: "1.6.26 页580"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_pg_check_authid
  type: syntax
  statement: "pg_check_authid(role_oid)通过role_id检查用户或角色是否存在；文档在不同条目分别列示返回Boolean和text。"
  source_anchor: "1.6.26 页580,583"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_pg_describe_object
  type: syntax
  statement: "pg_describe_object(catalog_id,object_id,object_sub_id)返回由目录OID、对象OID和可选子对象ID指定的数据库对象描述，可用于确认pg_depend中对象身份。"
  source_anchor: "1.6.26 页580"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_constraintdef
  type: syntax
  statement: "pg_get_constraintdef有(constraint_oid)和(constraint_oid,pretty_bool)两个重载，均获取约束定义并返回text。"
  source_anchor: "1.6.26 页580"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_pg_get_expr
  type: syntax
  statement: "pg_get_expr(pg_node_tree,relation_oid[,pretty_bool])反编译表达式内部形式；假设Vars引用第二个参数指定关系；没有关键字时relation_oid可为0。"
  source_anchor: "1.6.26 页580-581"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_functiondef
  type: syntax
  statement: "pg_get_functiondef(func_oid)获取函数定义，返回headerlines和definition。"
  source_anchor: "1.6.26 页581"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_function_signature_helpers
  type: syntax
  statement: "pg_get_function_arguments返回带默认值的CREATE FUNCTION参数列表；pg_get_function_identity_arguments返回不含默认值、用于ALTER FUNCTION的参数列表；pg_get_function_result返回RETURNS子句。"
  source_anchor: "1.6.26 页581"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_indexdef
  type: syntax
  statement: "pg_get_indexdef有(index_oid)、(index_oid,dump_schema_only)和(index_oid,column_no,pretty_bool)三个重载，返回CREATE INDEX定义；column_no不为0时只返回一个索引字段定义。"
  source_anchor: "1.6.26 页581-582"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_indexdef_dump_schema_only
  type: behavior_oracle
  statement: "pg_get_indexdef(index_oid,dump_schema_only)仅用于dump场景；包含local索引的间隔分区表中true不包含自动创建分区的local索引，false包含；其他表不受该参数影响。"
  source_anchor: "1.6.26 页581-582"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_keywords
  type: syntax
  statement: "pg_get_keywords()返回SQL关键字和类别列表，输出word、catcode和catdesc；catcode的U/C/T/R分别表示通用、列名、类型或函数名、保留。"
  source_anchor: "1.6.26 页582-583"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_keywords_boundary
  type: constraint
  statement: "不同兼容模式下关键字范围与类型不完全一致；pg_get_keywords返回记录不包含disable_keyword_options参数中配置的选项。"
  source_anchor: "1.6.26 页583"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_userbyid
  type: syntax
  statement: "pg_get_userbyid(role_oid)通过角色OID抽取对应角色名，返回name。"
  source_anchor: "1.6.26 页583"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_viewdef
  type: syntax
  statement: "pg_get_viewdef有按view_name或view_oid的五个重载；pretty_bool为true时生成适合打印的结果，wrap_column_int按指定列数换行并隐含打印；转储时尽量避免适合打印格式。"
  source_anchor: "1.6.26 页583"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_tabledef
  type: syntax
  statement: "pg_get_tabledef有(table_oid)和(table_name)两个重载，重构表定义CREATE语句，返回text。"
  source_anchor: "1.6.26 页583-584"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_tabledef_boundary
  type: constraint
  statement: "pg_get_tabledef结果包含表定义本身、索引信息、comments和ilm策略；依赖的group、schema、tablespace、server需单独创建；继承自父对象的ilm策略不会在该对象表定义中返回创建语句。"
  source_anchor: "1.6.26 页584"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_options_to_table
  type: syntax
  statement: "pg_options_to_table(reloptions)返回存储选项名称/值对集合；输入可来自pg_class.reloptions或pg_attribute.attoptions，返回setof record。"
  source_anchor: "1.6.26 页584"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_tablespace_databases
  type: behavior_oracle
  statement: "pg_tablespace_databases(tablespace_oid)返回指定表空间中保存对象的数据库OID集合；返回行时表空间非空且不能删除；需连接对应数据库并查询pg_class查看对象。"
  source_anchor: "1.6.26 页584"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_tablespace_location
  type: syntax
  statement: "pg_tablespace_location(tablespace_oid)返回表空间所在文件系统路径；Non-PDB返回Non-PDB表空间路径，PDB返回PDB表空间路径。"
  source_anchor: "1.6.26 页584"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_pg_typeof
  type: syntax
  statement: "pg_typeof(any)获取传入值的数据类型，返回regtype；regtype是OID别名类型，用于比较时显示类型名称。"
  source_anchor: "1.6.26 页584-585"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_collation_for
  type: behavior_oracle
  statement: "collation for(any)返回参数值排序，返回text；值可能带引号并受模式限制；参数无排序时返回NULL，参数不是可排序类型时报错。"
  source_anchor: "1.6.26 页585"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_extension_update_paths
  type: constraint
  statement: "pg_extension_update_paths(name)返回指定扩展的版本更新路径，仅系统管理员可调用，返回source、path和target。"
  source_anchor: "1.6.26 页585"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_serial_sequence
  type: syntax
  statement: "pg_get_serial_sequence(tablename,colname)获取对应表名和列名上的序列，返回text。"
  source_anchor: "1.6.26 页585"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_sequence_parameters
  type: syntax
  statement: "pg_sequence_parameters(sequence_oid)获取指定sequence参数，输出start_value、minimum_value、maximum_value、increment和cycle_option。"
  source_anchor: "1.6.26 页585"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_col_description
  type: syntax
  statement: "col_description(table_oid,column_number)通过表OID和字段号获取表字段注释，返回text。"
  source_anchor: "1.6.26 页586"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_obj_description
  type: syntax
  statement: "obj_description有(object_oid,catalog_name)和(object_oid)两个重载，获取数据库对象注释；两参数形式通过OID和所属系统表名声明；该函数不能用于表字段。"
  source_anchor: "1.6.26 页586"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_shobj_description
  type: syntax
  statement: "shobj_description(object_oid,catalog_name)获取共享数据库对象注释；与obj_description的区别是用于共享对象，全局系统表注释全局存储。"
  source_anchor: "1.6.26 页586"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_3_scope_note
  type: environment
  statement: "Wave 5-3覆盖1.6.26系统信息函数第三批：模式可见性、类型格式化、对象描述、约束/表达式/函数/索引/视图/表定义、关键字、用户检查、表空间、类型/排序/序列和注释函数，物理页579-586。"
  source_anchor: "1.6.26 页579-586"
  source_refs: *id001
