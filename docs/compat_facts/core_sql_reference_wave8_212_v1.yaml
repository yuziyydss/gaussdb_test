  type: syntax
  statement: "锁限制参数：max_locks_per_transaction POSTMASTER整型10~2147483647默认256（按规格）每个事务能够持有对象锁的平均数量（并不严格限制/连接数未达max_connections时增大）；max_pred_locks_per_transaction POSTMASTER整型10~2147483647默认64每个事务能够持有谓词锁的平均数量；gs_clean_timeout SIGHUP整型0~2147483647秒默认15分钟GaussDB cleanup线程自动清理成功事务的信息超时时间（0不自动清理）；partition_lock_upgrade_timeout POSTMASTER整型0~2147483647秒默认1800000分区表锁升级最长等待时间；fault_mon_timeout SUSET整型0~30分钟默认1分钟健康检查周期（0关闭）；enable_online_ddl_waitlock USERSET布尔型默认off ONLINE DDL等待锁；xloginsert_locks POSTMASTER整型1~1000默认16并发写预写式日志锁个数（NUMA架构须为NUMA节点数量整数倍/ARM并发压力大时降低以获取稳定性能）；num_internal_lock_partitions POSTMASTER整型默认8内部轻量级锁分区个数；enable_wait_exclusive_lock SIGHUP布尔型默认on ProcArrayLock排他锁hang死检测与治愈；barrier_lock_timeout USERSET整型0~2147483647秒默认0 barrier锁超时（0不超时/1~3600有效/超3600无效按0处理）；track_activity_history_query_number整型默认256历史查询数量；enable_xid_abort_check SIGHUP布尔型默认off XID中止检查。"
