facts:
- id: dbelob_wave8_153_overview_limits
  type: constraint
  statement: "DBE_LOB功能与容量限制：A数据库中空格的实际字节内容为00、GaussDB中空格对应字节内容为ASCII码值32；集中式环境中CLOB、BLOB以及BFILE最大支持32TB；LOBMAXSIZE最大支持1073741771字节。"
  source_anchor: "3.12.2.10 DBE_LOB说明 页2768"
  source_refs: &reflb
  - w8_153_3_12
  status: confirmed
- id: dbelob_wave8_153_interface_catalog
  type: syntax
  statement: "DBE_LOB接口总账：GET_LENGTH/LOB_GET_LENGTH/OPEN/READ/LOB_READ/WRITE/WRITE_APPEND/LOB_WRITE_APPEND/COPY/LOB_COPY/ERASE/LOB_ERASE/CLOSE/MATCH/COMPARE/SUBSTR/LOB_SUBSTR/STRIP/LOB_STRIP/CREATE_TEMPORARY/APPEND/LOB_APPEND/FREETEMPORARY/FILEOPEN/FILECLOSE/BFILEOPEN/BFILECLOSE/LOADFROMFILE/LOADFROMBFILE/LOADBLOBFROMFILE/LOADBLOBFROMBFILE/LOADCLOBFROMFILE/LOADCLOBFROMBFILE/CONVERTTOBLOB/CONVERTTOCLOB/LOB_CONVERTTOBLOB/LOB_CONVERTTOCLOB/GETCHUNKSIZE/LOB_WRITE/BFILENAME。"
  source_anchor: "3.12.2.10 DBE_LOB 表3-198 页2768-2770"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_get_length_pair
  type: syntax
  statement: "长度函数对：GET_LENGTH(blob_obj IN BLOB / clob_obj IN CLOB) RETURN INTEGER获取并返回指定LOB长度（最大支持2GB）；LOB_GET_LENGTH(blob_obj/clob_obj/bfile IN BLOB/CLOB/DBE_LOB.BFILE) RETURN BIGINT获取并返回指定LOB/BFILE长度（最大支持32TB）。"
  source_anchor: "3.12.2.10 GET_LENGTH/LOB_GET_LENGTH 页2770-2771"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_open
  type: syntax
  statement: "OPEN原型：DBE_LOB.OPEN(lob INOUT BLOB)与DBE_LOB.OPEN(lob INOUT CLOB)；打开一个LOB类型对象并返回一个LOB描述符，该过程无实际意义仅用于兼容。"
  source_anchor: "3.12.2.10 OPEN 页2771"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_read
  type: syntax
  statement: "READ原型：DBE_LOB.READ(blob_obj IN BLOB, amount IN INTEGER, off_set IN INTEGER, out_put OUT RAW)与CLOB版（out_put OUT VARCHAR2）；根据指定长度及起始位置偏移读取LOB内容一部分到out_put缓冲区；amount读入长度小于1或大于32767报错；off_set偏移小于1或大于LOB类型对象长度报错、初始位置为1。"
  source_anchor: "3.12.2.10 READ 页2771-2772"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_lob_read
  type: syntax
  statement: "LOB_READ原型：DBE_LOB.LOB_READ(blob_obj IN BLOB, amount INOUT BIGINT, off_set IN BIGINT, out_put OUT RAW)、CLOB版（out_put OUT VARCHAR2）与BFILE版（bfile IN DBE_LOB.BFILE, out_put OUT RAW）三原型；根据指定长度及起始位置偏移读取LOB/BFILE一部分（支持大于1GB对象）；amount的IN参数为读入长度、OUT参数为实际读取长度（小于1或大于32767报错）；off_set偏移小于1或大于对象/BFILE长度报错、初始位置1。"
  source_anchor: "3.12.2.10 LOB_READ 页2772-2773"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_write
  type: constraint
  statement: "WRITE限制：DBE_LOB.WRITE(blob_obj INOUT BLOB, amount IN INTEGER, off_set IN INTEGER, source IN RAW)与CLOB版（source IN VARCHAR2）根据指定长度及起始位置将source内容写入LOB；amount写入长度最大支持32767字节，小于1或大于待写入内容长度报错；off_set偏移小于1或大于LOBMAXSIZE报错（初始位置1、最大值为LOB类型对象最大长度）。"
  source_anchor: "3.12.2.10 WRITE 页2773"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_write_append_pair
  type: syntax
  statement: "尾部写入函数对：WRITE_APPEND(blob_obj INOUT BLOB, amount IN INTEGER, source_obj IN RAW)与CLOB版（source_obj IN VARCHAR2）根据指定长度将source_obj内容写入LOB类型对象尾部；LOB_WRITE_APPEND三参签名相同（BIGINT场景变体）；amount最大支持32767字节，小于1或大于待写入内容长度报错。"
  source_anchor: "3.12.2.10 WRITE_APPEND/LOB_WRITE_APPEND 页2773-2774"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_copy_pair
  type: syntax
  statement: "复制函数对：COPY(dest_lob INOUT BLOB, src_lob IN BLOB, len IN INTEGER, dest_start IN INTEGER DEFAULT 1, src_start IN INTEGER DEFAULT 1)与CLOB版、LOB_COPY根据指定长度及起始位置偏移将LOB内容复制到另一个LOB；amount拷入长度小于1或大于LOBMAXSIZE报错；dest_offset/src_offset偏移BLOB以字节、CLOB以字符为单位，小于1报错（dest_offset大于LOBMAXSIZE报错）。"
  source_anchor: "3.12.2.10 COPY/LOB_COPY 页2774-2775"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_erase_pair
  type: constraint
  statement: "删除函数对：ERASE(blob_obj INOUT BLOB, amount INOUT INTEGER, off_set IN INTEGER DEFAULT 1)根据指定长度及起始偏移删除内容（不支持大于1GB），删除部分字节填充为0；LOB_ERASE为BIGINT版（支持大于1GB最大32TB），BLOB删除部分字节填充0、CLOB删除部分字符填充空格；amount删除长度小于1或传空报错，off_set偏移小于1或传空报错。"
  source_anchor: "3.12.2.10 ERASE/LOB_ERASE 页2775-2776"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_match
  type: syntax
  statement: "MATCH原型：DBE_LOB.MATCH(blob_obj IN BLOB, blob_obj2 IN RAW, beg_index IN BIGINT DEFAULT 1, occur_index IN BIGINT DEFAULT 1) RETURN BIGINT（CLOB版模式为VARCHAR2、BFILE版bfile+RAW，均RETURN BIGINT）；返回模式串在LOB/BFILE中第N次出现的位置（支持大于1GB最大32TB），输入无效值返回NULL；beg_index为字节/字符绝对偏移（有效范围1~LOBMAXSIZE超过返回null）；occur_index最小值1，大于最大匹配次数返回0、不在范围1~LOBMAXSIZE返回null。"
  source_anchor: "3.12.2.10 MATCH 页2777-2778"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_compare
  type: syntax
  statement: "COMPARE原型：DBE_LOB.COMPARE(lob1 IN BLOB/CLOB/DBE_LOB.BFILE, lob2/file2, len IN BIGINT DEFAULT 1073741312, start_pos1 IN BIGINT DEFAULT 1, start_pos2 IN BIGINT DEFAULT 1) RETURN INTEGER；比较部分或全部LOB或BFILE（支持BFILE比较，需先BFILEOPEN）；相等返回0否则非零（第一个小返回-1、大返回1）；len/start1/start2无效参数返回NULL（有效偏移1~LOBMAXSIZE）；start_pos1与start_pos2同时超过对象长度返回0。"
  source_anchor: "3.12.2.10 COMPARE 页2778-2779"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_substr_pair
  type: syntax
  statement: "子串读取函数对：SUBSTR(lob_loc IN BLOB/CLOB, amount IN INTEGER DEFAULT 32767, off_set IN INTEGER DEFAULT 1) RETURN RAW/VARCHAR2读取LOB子串；LOB_SUBSTR三原型支持BFILE（off_set BIGINT，最大支持32TB）；amount范围1~32767超出返回NULL，off_set范围1~LOBMAXSIZE超出返回NULL；BLOB/BFILE返回RAW、CLOB返回VARCHAR2。"
  source_anchor: "3.12.2.10 SUBSTR/LOB_SUBSTR 页2778-2780"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_strip_pair
  type: syntax
  statement: "截断函数对：STRIP(lob_loc INOUT BLOB/CLOB, newlen IN INTEGER)与LOB_STRIP（newlen IN BIGINT，支持大于1GB最大32TB）用于截断指定长度的LOB，执行完将LOB长度设置为newlen指定长度；newlen对于BLOB是字节数、CLOB是字符数；LOB_STRIP的newlen小于1返回NULL、大于LOB长度报错；lob_loc传空报错。"
  source_anchor: "3.12.2.10 STRIP/LOB_STRIP 页2780-2781"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_close
  type: syntax
  statement: "CLOSE：DBE_LOB.CLOSE关闭已经打开的LOB描述符。"
  source_anchor: "3.12.2.10 CLOSE 页2776-2777"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_bfile_prereq
  type: constraint
  statement: "BFILE前置要求：MATCH/COMPARE/SUBSTR族中传入BFILE文件时必须先通过DBE_LOB.BFILEOPEN打开，否则无法正确操作。"
  source_anchor: "3.12.2.10 MATCH/COMPARE/LOB_SUBSTR参数说明 页2777-2780"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_plain_vs_lob
  type: constraint
  statement: "基础版与LOB_版差异总则：基础版（GET_LENGTH/READ/WRITE/WRITE_APPEND/COPY/ERASE/SUBSTR/STRIP）使用INTEGER参数、不支持大于1GB对象（GET_LENGTH最大2GB）；LOB_版（LOB_GET_LENGTH/LOB_READ/LOB_WRITE_APPEND/LOB_COPY/LOB_ERASE/LOB_SUBSTR/LOB_STRIP）使用BIGINT参数、支持BFILE且最大32TB；空格字节差异（A库为00、GaussDB为ASCII 32）影响CLOB填充语义。"
  source_anchor: "3.12.2.10 各函数对比 页2768-2781"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_amount_bound
  type: constraint
  statement: "amount统一边界：READ/LOB_READ的amount（读入长度）与SUBSTR/LOB_SUBSTR的amount（读取字节数或字符数）有效范围均为1~32767，越界分别报错或返回NULL；WRITE/WRITE_APPEND的amount（写入长度）最大支持32767字节。"
  source_anchor: "3.12.2.10 READ/WRITE/SUBSTR参数说明 页2771-2780"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_offset_units
  type: syntax
  statement: "偏移单位约定：BLOB类型对象偏移以字节为单位，CLOB类型对象偏移以字符为单位（COPY/LOB_COPY/LOB_ERASE/MATCH等均遵循）；各接口偏移初始位置为1、有效上限为LOBMAXSIZE或对象长度。"
  source_anchor: "3.12.2.10 各接口参数说明 页2772-2780"
  source_refs: *reflb
  status: confirmed
- id: dbelob_wave8_153_match_edge
  type: constraint
  statement: "MATCH边界行为汇总：对象或模式传空返回null；beg_index超过1~LOBMAXSIZE返回null；occur_index大于模式串在LOB中最大能匹配上的次数返回0。"
  source_anchor: "3.12.2.10 MATCH 页2777-2778"
  source_refs: *reflb
  status: confirmed
open_questions:
- id: pkg2_wave8_153_oq_runtime
  content: "LOB_READ的INOUT amount在BFILE跨页读取时的实际返回长度语义、CLOB字符偏移与多字节字符的边界、MATCH在32TB大对象上的性能与并发读写行为需授权环境实机验证。"
  status: open
