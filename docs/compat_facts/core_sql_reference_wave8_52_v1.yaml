facts:
- id: respool_wave8_52_create_purpose
  type: syntax
  statement: "CREATE RESOURCE POOL用于创建资源池，并可指定资源池相关联的控制组。"
  source_anchor: "1.13.9.39 页1503"
  source_refs: &refcreate
  - w8_52_1_13_9_39
  status: confirmed
- id: respool_wave8_52_create_permissions
  type: constraint
  statement: "CREATE RESOURCE POOL仅SYSADMIN或初始用户可执行；升级期间不支持该语法，多租场景下不支持本语法，应使用RESOURCE_MANAGER高级包。"
  source_anchor: "1.13.9.39 注意事项 页1503"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_create_syntax
  type: syntax
  statement: "CREATE RESOURCE POOL pool_name [WITH (...)]；WITH可设置MEM_PERCENT、CONTROL_GROUP、ACTIVE_STATEMENTS、MAX_DOP、MEMORY_LIMIT、io_limits、io_priority、max_worker、max_connections、max_dynamic_memory、max_shared_memory和max_concurrency。"
  source_anchor: "1.13.9.39 语法格式 页1503-1504"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_pool_name
  type: constraint
  statement: "资源池名称必须符合标识符命名规范，且不能和当前数据库中已存在的资源池重名。"
  source_anchor: "1.13.9.39 pool_name 页1504"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_control_group
  type: syntax
  statement: "CONTROL_GROUP指定控制组名称；名称可用单引号或双引号且大小写敏感。自定义控制组可用“class1:workload1”或“class1:workload1:1”；Timeshare控制组可用Rush、High、Medium或Low，例如High表示DefaultClass下的High Timeshare控制组。"
  source_anchor: "1.13.9.39 group_name 页1504"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_active_statements
  type: syntax
  statement: "ACTIVE_STATEMENTS指定资源池语句执行最大并发数量，取值为整数-1~2147483647；-1表示不限制，0表示禁止任何语句执行。"
  source_anchor: "1.13.9.39 stmt 页1504"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_max_dop
  type: syntax
  statement: "MAX_DOP指定资源池最大并发度，即语句执行时可创建的最多线程数量，取值为正整数1~2147483647。"
  source_anchor: "1.13.9.39 dop 页1504"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_memory_limit
  type: syntax
  statement: "MEMORY_LIMIT指定资源池最大使用内存，取值范围为1KB~2047GB。"
  source_anchor: "1.13.9.39 memory_size 页1504-1505"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_mem_percent
  type: constraint
  statement: "MEM_PERCENT指定资源池可用内存占全部内存或组用户内存的比例；普通场景下普通用户范围为0~100，默认0。MEM_PERCENT和MEMORY_LIMIT同时指定时仅MEM_PERCENT生效。"
  source_anchor: "1.13.9.39 mem_percent 页1505"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_io_controls
  type: constraint
  statement: "io_limits指定资源池每秒可触发I/O次数上限，以万次为单位；io_priority在I/O利用率高达50%时用于重消耗I/O作业管控，可选Low、Medium、High，不控制时为None且默认None。这些设置仅对批量导入、单DN约超过500MB的复杂查询和VACUUM FULL等复杂作业有效。"
  source_anchor: "1.13.9.39 io_limits/io_priority 页1505"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_worker_connections
  type: syntax
  statement: "max_worker仅用于扩容接口，表示扩容数据重分布时表内插入并发度；max_connections限制资源池可使用的最大连接数，且所有资源池最大连接数总和不能超过数据库进程GUC参数max_connections。"
  source_anchor: "1.13.9.39 max_worker/max_connections 页1505"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_memory_concurrency
  type: syntax
  statement: "max_dynamic_memory和max_shared_memory分别限制资源池可使用的最大动态内存和共享内存；max_concurrency限制资源池允许使用的最大并发数。"
  source_anchor: "1.13.9.39 内存/并发参数 页1505"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_create_default_behavior
  type: behavior_oracle
  statement: "示例中不带WITH的CREATE RESOURCE POOL pool1创建默认资源池，其控制组为DefaultClass组下属的Medium Timeshare Workload控制组。"
  source_anchor: "1.13.9.39 示例 页1505-1506"
  source_refs: *refcreate
  status: confirmed
- id: respool_wave8_52_alter_purpose
  type: syntax
  statement: "ALTER RESOURCE POOL用于修改资源池并指定其他控制组。"
  source_anchor: "1.13.7.26 页1250"
  source_refs: &refalt
  - w8_52_1_13_7_26
  status: confirmed
- id: respool_wave8_52_alter_permissions
  type: constraint
  statement: "ALTER RESOURCE POOL仅sysadmin或初始用户可执行；多租场景下不支持本语法，应使用RESOURCE_MANAGER高级包，升级期间也不支持。"
  source_anchor: "1.13.7.26 注意事项 页1250"
  source_refs: *refalt
  status: confirmed
- id: respool_wave8_52_alter_syntax
  type: syntax
  statement: "ALTER RESOURCE POOL pool_name WITH (...)可修改MEM_PERCENT、CONTROL_GROUP、ACTIVE_STATEMENTS、MAX_DOP、MEMORY_LIMIT、io_limits、io_priority、max_worker、max_connections、max_dynamic_memory、max_shared_memory和max_concurrency。"
  source_anchor: "1.13.7.26 语法格式 页1250"
  source_refs: *refalt
  status: confirmed
- id: respool_wave8_52_alter_control_group
  type: constraint
  statement: "ALTER RESOURCE POOL的pool_name必须为已创建资源池，group_name必须为已创建控制组；控制组名称大小写敏感，可指定自定义Class/Workload层次或DefaultClass下的Timeshare控制组。"
  source_anchor: "1.13.7.26 pool_name/group_name 页1250-1251"
  source_refs: *refalt
  status: confirmed
- id: respool_wave8_52_alter_parameters
  type: constraint
  statement: "ALTER RESOURCE POOL的ACTIVE_STATEMENTS为-1~2147483647，MAX_DOP为1~2147483647，MEMORY_LIMIT为1KB~2047GB且单位大小写敏感；MEM_PERCENT与MEMORY_LIMIT同时指定时只有MEM_PERCENT生效。"
  source_anchor: "1.13.7.26 参数说明 页1251"
  source_refs: *refalt
  status: confirmed
- id: respool_wave8_52_alter_io_and_limits
  type: constraint
  statement: "ALTER RESOURCE POOL的io_limits为0~2147483647，0表示不限制I/O次数；io_priority可选None、Low、Medium、High且默认None，仅对复杂作业有效；所有资源池max_connections总和不能超过GUC参数max_connections；max_dynamic_memory、max_shared_memory和max_concurrency分别限制动态内存、共享内存和并发数。"
  source_anchor: "1.13.7.26 io/连接/内存参数 页1251-1252"
  source_refs: *refalt
  status: confirmed
- id: respool_wave8_52_drop_syntax
  type: syntax
  statement: "DROP RESOURCE POOL用于删除资源池，语法为DROP RESOURCE POOL [IF EXISTS] pool_name；如果某个角色已关联到该资源池则无法删除。仅SYSADMIN或初始用户可执行，多租场景和升级期间不支持；IF EXISTS在资源池不存在时不删除并返回NOTICE，pool_name必须为已创建资源池。"
  source_anchor: "1.13.10.32 注意事项/语法 页1684"
  source_refs: &refdrop
  - w8_52_1_13_10_32
  status: confirmed
open_questions:
- id: respool_wave8_52_oq_runtime
  statement: "CREATE/ALTER/DROP RESOURCE POOL在真实控制组、多租配置、并发负载和角色关联组合下的资源管控与错误矩阵需授权环境实机验证。"
  status: open
