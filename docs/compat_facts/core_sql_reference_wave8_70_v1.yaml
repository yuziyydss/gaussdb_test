facts:
- id: show_wave8_70_purpose
  type: syntax
  statement: "SHOW将显示当前运行时参数的数值。"
  source_anchor: "1.13.19.10 功能描述 页1862"
  source_refs: &refshow
  - w8_70_1_13_19_10
  status: confirmed
- id: show_wave8_70_syntax
  type: syntax
  statement: "语法为SHOW {[VARIABLES LIKE] configuration_parameter | CURRENT_SCHEMA | TIME ZONE | TRANSACTION ISOLATION LEVEL | SESSION AUTHORIZATION | ALL}。"
  source_anchor: "1.13.19.10 语法格式 页1862"
  source_refs: *refshow
  status: confirmed
- id: show_wave8_70_param
  type: constraint
  statement: "configuration_parameter为运行时参数的名称，取值可使用SHOW ALL命令查看运行时参数；部分通过SHOW ALL查看的参数不能通过SET设置，如max_datanodes。"
  source_anchor: "1.13.19.10 参数说明 configuration_parameter 页1863"
  source_refs: *refshow
  status: confirmed
- id: show_wave8_70_specials
  type: constraint
  statement: "SHOW的特殊目标：CURRENT_SCHEMA显示当前模式；TIME ZONE显示时区；TRANSACTION ISOLATION LEVEL显示事务的隔离级别；SESSION AUTHORIZATION显示当前会话的用户标识符；ALL显示所有运行时参数。"
  source_anchor: "1.13.19.10 参数说明 页1863"
  source_refs: *refshow
  status: confirmed
- id: show_wave8_70_variables_like
  type: constraint
  statement: "SHOW VARIABLES LIKE可显示参数名中包含指定模式的所有参数，例如SHOW VARIABLES LIKE var显示参数名中包含var的所有参数。"
  source_anchor: "1.13.19.10 语法格式/示例 页1862/1864"
  source_refs: *refshow
  status: confirmed
- id: show_wave8_70_example_values
  type: behavior_oracle
  statement: "示例中SHOW timezone返回PRC；SHOW CURRENT_SCHEMA返回\"$user\",public；SHOW TRANSACTION ISOLATION LEVEL返回read committed；SHOW SESSION AUTHORIZATION返回omm1。"
  source_anchor: "1.13.19.10 示例 页1863-1864"
  source_refs: *refshow
  status: confirmed
- id: show_wave8_70_example_all_like
  type: behavior_oracle
  statement: "示例中SHOW ALL显示所有参数；SHOW VARIABLES LIKE var显示参数名包含var的所有参数（相关链接SET、RESET）。"
  source_anchor: "1.13.19.10 示例 页1864"
  source_refs: *refshow
  status: confirmed
- id: show_events_wave8_70_purpose
  type: syntax
  statement: "SHOW EVENTS显示指定SCHEMA下所有定时任务的基本信息。"
  source_anchor: "1.13.19.11 功能描述 页1864"
  source_refs: &refshowev
  - w8_70_1_13_19_11
  status: confirmed
- id: show_events_wave8_70_compat
  type: constraint
  statement: "定时任务相关操作只有sql_compatibility = 'B'时支持。"
  source_anchor: "1.13.19.11 注意事项 页1864"
  source_refs: *refshowev
  status: confirmed
- id: show_events_wave8_70_syntax
  type: syntax
  statement: "语法为SHOW EVENTS [{FROM | IN} schema_name] [LIKE 'pattern' | WHERE condition]。"
  source_anchor: "1.13.19.11 语法格式 页1864"
  source_refs: *refshowev
  status: confirmed
- id: show_events_wave8_70_from_in
  type: constraint
  statement: "{FROM | IN}指定要查询的schema，默认情况下为当前schema。"
  source_anchor: "1.13.19.11 参数说明 FROM|IN 页1864"
  source_refs: *refshowev
  status: confirmed
- id: show_events_wave8_70_like
  type: constraint
  statement: "LIKE可以模式匹配定时任务名称，不指定则打印当前schema下所有定时任务。"
  source_anchor: "1.13.19.11 参数说明 LIKE 页1864"
  source_refs: *refshowev
  status: confirmed
- id: show_events_wave8_70_where
  type: constraint
  statement: "WHERE子句构成一个行选择表达式，用来缩小SHOW EVENTS查询的范围；condition是返回值为布尔型的任意表达式，任何不满足该条件的行都不会被检索。"
  source_anchor: "1.13.19.11 参数说明 WHERE 页1864"
  source_refs: *refshowev
  status: confirmed
- id: show_events_wave8_70_example
  type: behavior_oracle
  statement: "B库示例中创建默认当前SCHEMA的event_e2和SCHEMA为test的event_e3后，SHOW EVENTS显示event_e2（含job_name、schema_name、log_user、priv_user、job_status、start_date、interval、end_date、enable、failure_msg字段），SHOW EVENTS FROM test显示event_e3；之后DROP EVENT删除定时任务（相关链接ALTER EVENT、CREATE EVENT、DROP EVENT）。"
  source_anchor: "1.13.19.11 示例 页1865"
  source_refs: *refshowev
  status: confirmed
- id: shutdown_wave8_70_purpose
  type: syntax
  statement: "SHUTDOWN将关闭当前连接的数据库节点。"
  source_anchor: "1.13.19.12 功能描述 页1865"
  source_refs: &refshutdown
  - w8_70_1_13_19_12
  status: confirmed
- id: shutdown_wave8_70_privileges
  type: constraint
  statement: "仅拥有管理员权限的用户可以运行SHUTDOWN命令。"
  source_anchor: "1.13.19.12 注意事项 页1865"
  source_refs: *refshutdown
  status: confirmed
- id: shutdown_wave8_70_syntax
  type: syntax
  statement: "语法为SHUTDOWN [FAST | IMMEDIATE]。"
  source_anchor: "1.13.19.12 语法格式 页1866"
  source_refs: *refshutdown
  status: confirmed
- id: shutdown_wave8_70_fast
  type: constraint
  statement: "FAST表示不等待客户端中断连接，将所有活跃事务回滚并且强制断开客户端，然后关闭数据库节点；若不指定关闭模式，默认为FAST。"
  source_anchor: "1.13.19.12 参数说明 FAST 页1866"
  source_refs: *refshutdown
  status: confirmed
- id: shutdown_wave8_70_immediate
  type: constraint
  statement: "IMMEDIATE表示强行关闭，在下次重新启动的时候将导致故障恢复。"
  source_anchor: "1.13.19.12 参数说明 IMMEDIATE 页1866"
  source_refs: *refshutdown
  status: confirmed
- id: shutdown_wave8_70_example
  type: behavior_oracle
  statement: "示例中SHUTDOWN关闭当前数据库节点；SHUTDOWN FAST使用fast模式关闭当前数据库节点。"
  source_anchor: "1.13.19.12 示例 页1866"
  source_refs: *refshutdown
  status: confirmed
open_questions:
- id: show_wave8_70_oq_runtime
  statement: "SHOW EVENTS定时任务查询、SHUTDOWN各关闭模式在真实B模式环境、权限和集群状态下的完整行为与错误矩阵需授权环境实机验证。"
  status: open
