facts:
- id: role_wave8_49_purpose
  type: syntax
  statement: "CREATE ROLE用于创建角色；角色是拥有GaussDB数据库对象和权限的实体，在不同环境中可表示用户、组或同时存在。"
  source_anchor: "1.13.9.40 页1506"
  source_refs: &refb1
  - w8_49_1_13_9_40
  status: confirmed
- id: role_wave8_49_permissions
  type: constraint
  statement: "创建角色的用户必须具备CREATE ROLE权限或为系统管理员。"
  source_anchor: "1.13.9.40 注意事项 页1506"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_login_default
  type: constraint
  statement: "数据库中新角色默认无LOGIN属性；仅拥有LOGIN属性的角色可以登录数据库，拥有LOGIN属性的角色可视为用户。"
  source_anchor: "1.13.9.40 注意事项/LOGIN 页1506与1510"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_main_syntax
  type: syntax
  statement: "CREATE ROLE role_name支持WITH选项、ENCRYPTED/UNENCRYPTED、PASSWORD/IDENTIFIED BY、密码EXPIRED/DISABLE和PASSWORD EXPIRE INTERVAL 'time' DAY；option覆盖系统权限、连接限制、有效期、资源池、空间限额、角色成员和默认表空间等。"
  source_anchor: "1.13.9.40 语法格式 页1506-1508"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_name_rules
  type: constraint
  statement: "角色名最长63个字符，超长截断保留前63个；含大写字母自动转小写，需要大写名称须双引号包裹；角色名只能由字母、下划线、数字和美元符号组成且必须以字母或下划线开头；redisuser为内部保留名。"
  source_anchor: "1.13.9.40 role_name 页1509"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_password_rules
  type: constraint
  statement: "密码默认不少于8字符，不能与用户名及用户名倒序相同，至少包含大写字母、小写字母、数字和非字母数字字符四类中的三类；创建时需单引号或双引号包裹。密文密码主要用于导入，不推荐直接使用且不校验复杂度。"
  source_anchor: "1.13.9.40 password 页1509"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_expired
  type: behavior_oracle
  statement: "指定EXPIRED创建密码失效角色后，该角色不允许执行简单查询和扩展查询；只有修改自身密码后才可正常执行语句。"
  source_anchor: "1.13.9.40 EXPIRED 页1509"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_password_expire_interval
  type: constraint
  statement: "PASSWORD EXPIRE INTERVAL 'time' DAY设置密码有效天数，time为0~999整数；未指定时默认0，表示密码长期有效。"
  source_anchor: "1.13.9.40 EXPIRE INTERVAL 页1509"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_disable
  type: constraint
  statement: "指定DISABLE后角色无法修改自身密码，系统会删除该角色密码，角色不能通过自身密码连接，仅能通过外部认证连接；仅管理员可启用或禁用密码，普通用户不能禁用初始用户密码，启用密码需ALTER USER并指定密码。"
  source_anchor: "1.13.9.40 DISABLE 页1509-1510"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_encryption
  type: constraint
  statement: "按产品安全要求密码必须加密存储，UNENCRYPTED禁止使用；已用SHA256加密格式的内容字符串无论是否声明ENCRYPTED/UNENCRYPTED都会按该格式存储，以支持dump/restore重载。"
  source_anchor: "1.13.9.40 ENCRYPTED/UNENCRYPTED 页1509-1510"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_sysadmin
  type: constraint
  statement: "SYSADMIN/NOSYSADMIN定义新角色是否为系统管理员，默认NOSYSADMIN；三权分立关闭时SYSADMIN用户可创建具有SYSADMIN、REPLICATION、CREATEROLE、AUDITADMIN、MONADMIN、POLADMIN、CREATEDB属性的用户和普通用户，三权分立打开时无权创建用户。"
  source_anchor: "1.13.9.40 SYSADMIN 页1510"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_admin_attributes
  type: syntax
  statement: "CREATE ROLE支持MONADMIN/NOMONADMIN、OPRADMIN/NOOPRADMIN、POLADMIN/NOPOLADMIN和AUDITADMIN/NOAUDITADMIN；除SYSADMIN外分别默认为对应NO属性。"
  source_anchor: "1.13.9.40 管理属性 页1510"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_createdb_createrole
  type: constraint
  statement: "CREATEDB默认NOCREATEDB；CREATEROLE默认NOCREATEROLE，指定后可执行CREATE ROLE/CREATE USER并可修改和删除其他角色。三权分立关闭时CREATEROLE可创建CREATEROLE、AUDITADMIN、MONADMIN、POLADMIN、CREATEDB属性用户；打开时可创建除AUDITADMIN外的这些属性用户。USEFT为保留参数暂未启用。"
  source_anchor: "1.13.9.40 CREATEDB/CREATEROLE/USEFT 页1510"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_inherit_replication_persistence
  type: syntax
  statement: "INHERIT/NOINHERIT控制是否继承所在组角色权限且不推荐使用；REPLICATION默认NOREPLICATION，用于流复制或备份模式；PERSISTENCE定义永久用户，仅初始用户可创建、修改和删除永久用户。"
  source_anchor: "1.13.9.40 INHERIT/REPLICATION/PERSISTENCE 页1510-1511"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_connection_limit
  type: constraint
  statement: "CONNECTION LIMIT声明角色并发连接数，取值[-1, 2^31-1]，默认-1表示无限制；系统管理员不受限制，数据库主节点单独统计，整体连接数等于connlimit乘以当前正常数据库主节点个数。"
  source_anchor: "1.13.9.40 CONNECTION LIMIT 页1511"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_valid_period
  type: syntax
  statement: "VALID BEGIN和VALID UNTIL设置角色生效/失效时间戳；未指定表示无对应限制，时间格式为YYYY-MM-DD HH:mm:ss。"
  source_anchor: "1.13.9.40 VALID BEGIN/VALID UNTIL 页1511"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_resource_space
  type: syntax
  statement: "RESOURCE POOL设置pg_resource_pool中的资源池名称；USER GROUP当前暂不支持；PERM SPACE、TEMP SPACE和SPILL SPACE分别设置角色永久空间、临时表存储空间和算子落盘空间限额。"
  source_anchor: "1.13.9.40 RESOURCE POOL/空间限额 页1511"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_membership_clauses
  type: syntax
  statement: "IN ROLE使新角色立即拥有现有角色权限且不推荐；IN GROUP是IN ROLE旧语法；ROLE列出自动成为新角色成员的现有角色；ADMIN类似ROLE但可把新角色权限授予其他角色；USER是ROLE旧语法。"
  source_anchor: "1.13.9.40 角色成员子句 页1511"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_ignored_options
  type: constraint
  statement: "SYSID、DEFAULT TABLESPACE和PROFILE子句会被忽略且无实际意义；PGUSER当前版本无实际意义，仅为语法前向兼容保留。"
  source_anchor: "1.13.9.40 忽略选项 页1512"
  source_refs: *refb1
  status: confirmed
- id: role_wave8_49_create_role_vs_user
  type: behavior_oracle
  statement: "CREATE ROLE创建的角色默认禁止登录，CREATE USER创建的用户可登录；CREATE USER会自动创建同名SCHEMA。可用ALTER ROLE ... WITH LOGIN使角色可登录。"
  source_anchor: "1.13.9.40 示例 页1512-1513"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: role_wave8_49_oq_runtime
  statement: "CREATE ROLE在真实权限模型、三权分立、密码策略、资源限额和角色成员组合下的生效结果与错误矩阵需授权环境实机验证。"
  status: open
