facts:
- id: guc_use_workload_manager
  type: environment
  statement: use_workload_manager是资源管理总开关，默认on；多租数据库特性enable_mtd需要开启。由off改on后不会统计off期间的存储资源。
  source_anchor: 7.3.13 use_workload_manager
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4434-4435）
- id: guc_enable_control_group
  type: environment
  statement: enable_control_group控制是否开启Cgroups功能，默认on；多租数据库特性需要开启，与use_workload_manager同时开启后用户资源管控生效。
  source_anchor: 7.3.13 enable_control_group
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4435）
- id: guc_enable_backend_control
  type: environment
  statement: enable_backend_control控制数据库常驻线程是否绑定DefaultBackend和HaBackend控制组，默认off；仅在enable_control_group=on时有效。
  source_anchor: 7.3.13 enable_backend_control
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4436）
- id: guc_cpu_collect_timer
  type: environment
  statement: cpu_collect_timer设置语句执行时在数据库节点收集CPU时间的周期，单位s，取值1~2147483647，默认30。
  source_anchor: 7.3.13 cpu_collect_timer
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4437）
- id: guc_memory_tracking_mode
  type: environment
  statement: memory_tracking_mode设置内存信息记录模式：none不统计，peak统计query级峰值，normal实时统计，executor生成已分配内存上下文统计文件，fullexec生成申请内存上下文统计文件；默认none。
  source_anchor: 7.3.13 memory_tracking_mode
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4437-4438）
- id: guc_enable_resource_track
  type: environment
  statement: enable_resource_track控制是否开启资源实时监控，默认on。
  source_anchor: 7.3.13 enable_resource_track
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4438）
- id: guc_enable_resource_record
  type: environment
  statement: enable_resource_record控制是否开启资源监控记录归档，默认off。
  source_anchor: 7.3.13 enable_resource_record
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4438-4439）
- id: guc_enable_logical_io_statistics
  type: environment
  statement: enable_logical_io_statistics控制资源监控逻辑I/O统计；开启后统计PG_TOTAL_USER_RESOURCE_INFO中用户逻辑读写字节数、次数和速率，默认on。
  source_anchor: 7.3.13 enable_logical_io_statistics
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4439）
- id: guc_resource_track_level
  type: environment
  statement: resource_track_level设置会话资源监控等级，仅在enable_resource_track=on时有效：none关闭，query开启query级，operator同时开启query级和算子级；默认query。
  source_anchor: 7.3.13 resource_track_level
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4441）
- id: guc_resource_track_cost
  type: environment
  statement: resource_track_cost设置语句资源监控的最小执行代价，仅在enable_resource_track=on时有效：-1不监控，0~9监控代价>=10语句，>=10按该值阈值；默认100000。
  source_anchor: 7.3.13 resource_track_cost
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4441）
- id: guc_resource_track_duration
  type: environment
  statement: resource_track_duration设置语句结束后从实时视图转存历史视图的最小执行时间，0表示全部转存，>0按阈值转存；仅在enable_resource_track=on时有效，默认60s。
  source_anchor: 7.3.13 resource_track_duration
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4442）
- id: guc_io_limits
  type: environment
  statement: io_limits设置每秒触发I/O的上限，取值0~1073741823，默认0。
  source_anchor: 7.3.13 io_limits
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4445）
- id: guc_io_priority
  type: environment
  statement: I/O利用率达到50%时，io_priority设置重消耗I/O作业管控优先级：None不受控，Low限制为原始触发值10%，Medium为20%，High为50%；默认None。
  source_anchor: 7.3.13 io_priority
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4446）
- id: guc_session_respool
  type: environment
  statement: session_respool设置当前session关联的resource pool；若先设置cgroup_name再设置session_respool，则session_respool关联控制组生效，后续再修改cgroup_name时新值生效。
  source_anchor: 7.3.13 session_respool
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4446）
- id: guc_max_concurrency
  type: environment
  statement: max_concurrency管控全局并发数上限，取值-1~2147483647；-1表示不管控，默认-1。
  source_anchor: 7.3.13 max_concurrency
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4450）
- id: guc_enable_workload_rule
  type: environment
  statement: enable_workload_rule控制是否启用SQL限流功能，默认on。
  source_anchor: 7.3.13 enable_workload_rule
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4450）
- id: guc_enable_abnormal_sql_cpu_detect
  type: environment
  statement: enable_abnormal_sql_cpu_detect控制异常SQL CPU资源使用识别功能，默认on；关闭后停止识别。
  source_anchor: 7.3.13 enable_abnormal_sql_cpu_detect
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4452）
- id: guc_abnormal_sql_control_type
  type: environment
  statement: abnormal_sql_control_type设置需CPU管控的异常SQL类型，仅支持sql_plan_multiplier、sql_abnormal_manual、sql_abnormal_other，可逗号分隔；默认sql_plan_multiplier,
    sql_abnormal_manual。
  source_anchor: 7.3.13 abnormal_sql_control_type
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4454）
