facts:
- id: m_drop_prepare_wave8_116_syntax
  type: syntax
  statement: "M兼容DROP PREPARE用于删除已编写的预备语句；语法为{ DEALLOCATE | DROP } PREPARE name；如果用户没有明确删除一个预备语句，那么它将在会话结束的时候被删除；示例参见示例；相关链接PREPARE。"
  source_anchor: "2.4.2.9.12 功能描述/注意事项/语法格式 页2197"
  source_refs: &refmdp
  - w8_116_2_4_2_9_12
  status: confirmed
- id: m_drop_resource_label_wave8_116_syntax
  type: syntax
  statement: "M兼容DROP RESOURCE LABEL删除指定资源标签；仅POLADMIN、SYSADMIN或初始用户可以执行；语法为DROP RESOURCE LABEL [IF EXISTS] label_name[, ...]（支持一次删除多个）；IF EXISTS指定的资源标签存在时直接DROP，不存在时产生NOTICE不抛出错误。"
  source_anchor: "2.4.2.9.13 功能描述/注意事项/语法格式/参数说明 页2197-2198"
  source_refs: &refmdrl
  - w8_116_2_4_2_9_13
  status: confirmed
- id: m_drop_resource_label_wave8_116_example
  type: behavior_oracle
  statement: "示例（m_db）：基于表/列/模式/视图创建的四个资源标签分别用DROP RESOURCE LABEL IF EXISTS table_label与DROP RESOURCE LABEL IF EXISTS column_label删除（视图与模式资源标签通过DROP VIEW和DROP SCHEMA级联处理），最后DROP TABLE tb_for_label。"
  source_anchor: "2.4.2.9.13 示例 页2198-2199"
  source_refs: *refmdrl
  status: confirmed
- id: m_drop_role_wave8_116_syntax
  type: syntax
  statement: "M兼容DROP ROLE删除指定的角色；语法为DROP ROLE [ IF EXISTS ] role_name [, ...]；IF EXISTS指定的角色不存在时发出一个notice而非抛出错误；相关链接CREATE ROLE、ALTER ROLE、SET ROLE。"
  source_anchor: "2.4.2.9.14 功能描述/语法格式/参数说明 页2199"
  source_refs: &refmdrole
  - w8_116_2_4_2_9_14
  status: confirmed
- id: m_drop_schema_wave8_116_syntax
  type: constraint
  statement: "M-Compatibility中DATABASE与SCHEMA是同义词，DROP SCHEMA从数据库中删除模式；只有模式的所有者或被授予了模式DROP权限的用户有权限执行（三权分立开关关闭时系统管理员默认拥有此权限）；语法为DROP SCHEMA [ IF EXISTS ] schema_name [, ...]（IF EXISTS不存在时发notice）；须知：不要随意删除pg_temp或pg_toast_temp开头的模式（系统内部使用，删除可能导致无法预知的结果）。"
  source_anchor: "2.4.2.9.15 功能描述/注意事项/语法格式/参数说明/须知 页2199-2200"
  source_refs: &refmds
  - w8_116_2_4_2_9_15
  status: confirmed
- id: m_drop_sequence_wave8_116_syntax
  type: syntax
  statement: "M兼容DROP SEQUENCE从当前数据库里删除序列；权限：序列的所有者、序列所在模式的所有者、被授予了序列DROP权限的用户或被授予DROP ANY SEQUENCE权限的用户才能删除（三权分立关闭时系统管理员默认拥有）；语法为DROP [ LARGE ] SEQUENCE [ IF EXISTS ] {[schema.]sequence_name} [ , ... ] [ CASCADE | RESTRICT ]；LARGE标识：创建序列时使用了LARGE标识则删除时也需指定（当前不支持直接CREATE LARGE SEQUENCE，仅支持指定AUTO_INCREMENT约束时自动生成的LARGE SEQUENCE）；CASCADE级联删除依赖序列的对象，RESTRICT有依赖则拒绝删除（缺省值）。"
  source_anchor: "2.4.2.9.16 功能描述/注意事项/语法格式/参数说明 页2200-2201"
  source_refs: &refmdseq
  - w8_116_2_4_2_9_16
  status: confirmed
- id: m_drop_sequence_wave8_116_example
  type: behavior_oracle
  statement: "示例（m_db）：CREATE SEQUENCE serial START 101后DROP SEQUENCE serial；相关链接ALTER SEQUENCE、CREATE SEQUENCE。"
  source_anchor: "2.4.2.9.16 示例 页2201"
  source_refs: *refmdseq
  status: confirmed
- id: m_drop_table_wave8_116_syntax
  type: constraint
  statement: "M兼容DROP TABLE删除指定的表：DROP TABLE会强制删除指定的表（删除表后依赖该表的索引会被删除；删除分区表会同时删除所有分区）；权限：表的所有者、表所在模式的所有者、被授予表的DROP权限的用户或被授予DROP ANY TABLE权限的用户（三权分立关闭时系统管理员默认拥有）；语法为DROP [TEMPORARY] TABLE [ IF EXISTS ] { [schema.]table_name } [, ...] [ CASCADE | RESTRICT ] [ PURGE ]；CASCADE允许级联删除依赖该表的对象（比如视图）；RESTRICT（缺省项）存在依赖对象则拒绝删除。"
  source_anchor: "2.4.2.9.17 注意事项/语法格式/参数说明 页2201-2202"
  source_refs: &refmdt
  - w8_116_2_4_2_9_17
  status: confirmed
- id: m_drop_table_wave8_116_cascade_purge
  type: constraint
  statement: "M兼容DROP TABLE CASCADE与PURGE：CASCADE允许级联删除依赖于该表的对象（比如视图）；RESTRICT（缺省项）存在依赖对象则拒绝删除该表；该属性在M-compatibility兼容版本控制开关s1及以上版本（m_format_dev_version = 's1'）时仅语法支持但实际不生效；PURGE参数表示即使开启回收站功能，DROP表时也会直接物理删除表而不是放入回收站。"
  source_anchor: "2.4.2.9.17 参数说明 页2202"
  source_refs: *refmdt
  status: confirmed
- id: m_drop_table_wave8_116_example
  type: behavior_oracle
  statement: "示例（m_db）：DROP TABLE IF EXISTS test成功；视图依赖时drop table s1.t1报ERROR: cannot drop table s1.t1 because other objects depend on it（DETAIL: view s1.v1 depends on table s1.t1与view s1.v2 depends on view s1.v1，HINT: Please drop the dependent first.），drop table s1.t1 cascade同样报错（M兼容s1下CASCADE不生效）。"
  source_anchor: "2.4.2.9.17 示例 页2202"
  source_refs: *refmdt
  status: confirmed
- id: m_drop_user_wave8_116_cascade
  type: constraint
  statement: "M兼容DROP USER删除用户同时会删除同名的schema；须使用CASCADE级联删除依赖用户的对象（除数据库外）。DROP USER不支持跨数据库进行级联删除（依赖对象在其他数据库时需先手动删除依赖对象或直接删除依赖数据库再删除用户）；跨数据库删除用户前需先删除该用户所在数据库中由该用户创建的同名Schema；删除用户时需先删除该用户拥有的所有对象并收回其在其他对象上的权限，或通过CASCADE级联删除。"
  source_anchor: "2.4.2.9.18 注意事项 页2202-2203"
  source_refs: &refmdu
  - w8_116_2_4_2_9_18
  status: confirmed
- id: m_drop_user_wave8_116_kill_query
  type: constraint
  statement: "M兼容DROP USER与enable_kill_query：级联对象处于锁定状态时此级联对象无法被删除，直到对象被解锁或锁定级联对象的线程被终止；存在配置参数enable_kill_query（在配置文件gaussdb.conf中）影响级联删除用户对象的行为：当参数为on且使用CASCADE模式删除用户时，会自动kill锁定用户级联对象的线程并删除用户；当参数为off且使用CASCADE删除用户时，会等待锁定级联对象的线程结束之后再删除用户。"
  source_anchor: "2.4.2.9.18 注意事项 页2202-2203"
  source_refs: *refmdu
  status: confirmed
- id: m_drop_user_wave8_116_syntax
  type: syntax
  statement: "M兼容DROP USER语法为DROP USER [ IF EXISTS ] user_name [, ...] [ CASCADE | RESTRICT ]；IF EXISTS指定的用户不存在时发出notice而非抛出错误；CASCADE级联删除依赖用户的对象并收回授予该用户的权限；RESTRICT如果用户还有任何依赖对象或被授予了其他对象的权限则拒绝删除（缺省行为）；相关链接CREATE USER、ALTER USER。"
  source_anchor: "2.4.2.9.18 语法格式/参数说明 页2203"
  source_refs: *refmdu
  status: confirmed
- id: m_drop_view_wave8_116_syntax
  type: constraint
  statement: "M兼容DROP VIEW数据库中强制删除已有的视图；权限：视图的所有者、视图所在模式的所有者、被授予了视图DROP权限的用户或拥有DROP ANY TABLE权限的用户（三权分立关闭时系统管理员默认拥有）；语法为DROP VIEW [ IF EXISTS ] view_name [, ...] [ CASCADE | RESTRICT ]；CASCADE级联删除依赖此视图的对象（如其他视图），RESTRICT有依赖对象则拒绝删除（未指定时默认RESTRICT）；该属性在M兼容版本控制开关s1及以上（m_format_dev_version = 's1'）时仅语法支持但实际不生效；相关链接ALTER USER、CREATE VIEW。"
  source_anchor: "2.4.2.9.19 功能描述/注意事项/语法格式/参数说明 页2203-2204"
  source_refs: &refmdv
  - w8_116_2_4_2_9_19
  status: confirmed
- id: m_drop_view_wave8_116_example
  type: behavior_oracle
  statement: "示例参见示例（视图删除示例接CREATE VIEW章节的test_v1）；相关链接ALTER USER、CREATE VIEW。"
  source_anchor: "2.4.2.9.19 示例 页2204"
  source_refs: *refmdv
  status: confirmed
- id: m_execute_wave8_116_syntax
  type: syntax
  statement: "M兼容EXECUTE执行一个前面准备好的预备语句（预备语句只在会话的生命期里存在，必须是在当前会话的前些时候用PREPARE语句创建的）；语法为EXECUTE name（name为要执行的预备语句名称）；parameter为给预备语句的参数变量（必须与创建预备语句时指定参数的数据类型相兼容）；注意事项：如果创建预备语句时PREPARE声明了一些参数，传递给EXECUTE必须是兼容的参数集否则出现错误。"
  source_anchor: "2.4.2.10.1 功能描述/注意事项/语法格式/参数说明 页2204"
  source_refs: &refmexec
  - w8_116_2_4_2_10_1
  status: confirmed
- id: m_execute_wave8_116_example
  type: behavior_oracle
  statement: "示例（m_db）：CREATE TABLE tpcds.reason_t1 LIKE tpcds.reason后PREPARE insert_reason FROM 'INSERT INTO tpcds.reason_t1 VALUES(...)'创建INSERT预备语句，EXECUTE insert_reason执行。"
  source_anchor: "2.4.2.10.1 示例 页2204-2205"
  source_refs: *refmexec
  status: confirmed
- id: m_explain_wave8_116_syntax
  type: syntax
  statement: "M兼容EXPLAIN显示SQL语句的执行计划（扫描方式如顺序扫描/索引扫描、多表JOIN算法、预计执行开销；ANALYZE选项实际执行语句并显示每个计划节点时间总开销（毫秒）和实际返回总行数）；语法两种：EXPLAIN [ ( option [, ...] ) ] statement（选项顺序无要求）与EXPLAIN { [ ANALYZE ] [ VERBOSE ] } statement（按顺序给出选项）；选项全集：ANALYZE/VERBOSE/COSTS/CPU/DETAIL/NODES（仅分布式模式可用集中式不可用）/NUM_NODES（仅分布式）/BUFFERS/TIMING/PLAN/BLOCKNAME/OUTLINE/ADAPTCOST/FORMAT { TEXT | XML | JSON | YAML }/OPTEVAL [ boolean ]。"
  source_anchor: "2.4.2.10.2 功能描述/语法格式 页2205-2206"
  source_refs: &refmexpl
  - w8_116_2_4_2_10_2
  status: confirmed
- id: m_explain_wave8_116_plan_options
  type: constraint
  statement: "M兼容EXPLAIN高级选项：PLAN是否将执行计划存储在plan_table中（为on时不能与其他选项同时使用，执行成功返回EXPLAIN SUCCESS，OFF不存储打印到屏幕）；BLOCKNAME是否显示计划每个操作所处的查询块（开启时输出在新增Query Block列上，需pretty模式，配合Hint修改执行计划）；OUTLINE是否显示计划的Outline Hint信息（ON显示在计划下方，OFF缺省不显示）；ADAPTCOST在Normal模式下是否显示计划的基数估计方式信息（ON缺省展示默认方式和反馈方式，不对预备语句生效）；BUFFERS和TIMING需结合ANALYZE选项一起使用（TIMING缺省TRUE显示启动和输出节点时间）。"
  source_anchor: "2.4.2.10.2 参数说明 页2206-2207"
  source_refs: *refmexpl
  status: confirmed
- id: m_explain_wave8_116_notes
  type: constraint
  statement: "M兼容EXPLAIN注意事项与选项：指定ANALYZE时语句会被执行（分析INSERT/UPDATE/DELETE/EXECUTE不想改数据可用START TRANSACTION; EXPLAIN ANALYZE ...; ROLLBACK方法）；DETAIL、NODES、NUM_NODES为分布式模式功能单机禁用（使用报ERROR: unrecognized EXPLAIN option \"nodes\"/\"num_nodes\"）；PLAN选项开启时将执行计划存储在plan_table中不打印到屏幕（为on时不能与其他选项同时使用，执行成功返回EXPLAIN SUCCESS，OFF则打印）；BLOCKNAME将每个操作所处的查询块名字输出在Query Block列（需pretty模式，配合Hint修改执行计划）；OUTLINE显示计划的Outline Hint信息；BUFFERS/TIMING需结合ANALYZE选项一起使用（TIMING缺省TRUE显示启动和输出节点时间）；ADAPTCOST在Normal模式显示基数估计方式（缺省ON，不对预备语句生效）；使用EXPLAIN查看执行计划时审计日志记录的审计类型由分析的具体SQL决定。"
  source_anchor: "2.4.2.10.2 注意事项/参数说明 页2205-2207"
  source_refs: *refmexpl
  status: confirmed
open_questions:
