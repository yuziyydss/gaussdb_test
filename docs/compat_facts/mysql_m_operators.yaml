- id: m_op_null_order_default
  type: behavior_oracle
  statement: MySQL排序时NULL排在前；GaussDB默认NULL排在最后。可用NULLS FIRST/LAST设置。
  source_anchor: 4.4.2.3 操作符差异
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3379）
- id: m_op_no_order_by_guarantee
  type: behavior_oracle
  statement: 有ORDER BY时除NULL排序外GaussDB与MySQL一致；无ORDER BY时不保证结果顺序一致。
  source_anchor: 4.4.2.3 操作符差异
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3379）
