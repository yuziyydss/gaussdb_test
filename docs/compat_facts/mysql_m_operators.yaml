- id: m_op_lt_gt_no_index
  type: constraint
  statement: <>操作符MySQL支持索引，GaussDB不支持索引。
  source_anchor: 4.4.2.3 表4-155
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3381）
- id: m_op_null_safe_no_index
  type: constraint
  statement: <=>操作符MySQL支持索引，GaussDB不支持索引、hash连接和合并连接。
  source_anchor: 4.4.2.3 表4-155
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3381）
- id: m_op_row_null_safe_unsupported
  type: constraint
  statement: MySQL支持<=>行比较，GaussDB不支持<=>行比较。
  source_anchor: 4.4.2.3 表4-155 行表达式
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3381）
- id: m_op_row_null_compare
  type: behavior_oracle
  statement: MySQL不支持行表达式与NULL比较；GaussDB支持</<=/=/>=/>/<>对行与NULL比较。
  source_anchor: 4.4.2.3 表4-155 行表达式
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3381）
- id: m_op_row_is_null
  type: syntax
  statement: GaussDB支持IS NULL对行表达式操作但不支持ISNULL；MySQL均不支持。
  source_anchor: 4.4.2.3 表4-155 行表达式
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3381）
- id: m_op_row_single_column
  type: syntax
  statement: MySQL不支持ROW(values)单列；GaussDB支持。
