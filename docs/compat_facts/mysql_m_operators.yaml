- id: m_op_null_compare_unconvertible
  type: behavior_oracle
  statement: "值为 NULL 的整型/日期列与不能转换为目标类型的常量或绑定参数进行文档所述比较时，MySQL 返回 NULL，GaussDB 返回 f；须保留列类型和比较操作符，不扩展到任意 NULL 列。"
  source_anchor: 4.4.2.3 操作符差异
