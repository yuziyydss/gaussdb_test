facts:
  # 长度获取
  - id: dbe_lob_get_length
    type: syntax
    statement: "DBE_LOB.LOB_GET_LENGTH(blob_obj IN BLOB|clob_obj IN CLOB|bfile IN DBE_LOB.BFILE) RETURN BIGINT：获取LOB/BFILE长度（以字节或字符为单位）。支持大于1GB。"
    source_anchor: "3.12.2 表3-200"
    status: confirmed
    verification_method: 逐页精读（页2770-2771）

  # 打开/关闭
  - id: dbe_lob_open
    type: syntax
    statement: "DBE_LOB.OPEN(lob_obj INOUT BLOB|CLOB)：打开LOB并返回描述符。该过程无实际意义，仅保持语法兼容。"
    source_anchor: "3.12.2 表3-201"
    status: confirmed
    verification_method: 逐页精读（页2771）

  - id: dbe_lob_close
    type: syntax
    statement: "DBE_LOB.CLOSE(lob_obj INOUT BLOB|CLOB)：关闭已打开的LOB描述符。与OPEN配对使用。"
    source_anchor: "3.12.2 表3-202"
    status: confirmed
    verification_method: 逐页精读（页2772）

  # 读取
  - id: dbe_lob_read
    type: syntax
    statement: "DBE_LOB.LOB_READ(blob_obj IN BLOB|clob_obj IN CLOB|bfile IN BFILE, amount INOUT BIGINT, off_set IN BIGINT, out_put OUT RAW|VARCHAR2)：按偏移和长度读取LOB部分内容。amount输入为期望读取长度，输出为实际读取长度。amount须1-32767，off_set须≥1且≤LOB长度，否则报错。支持大于1GB。"
    source_anchor: "3.12.2 表3-203"
    status: confirmed
    verification_method: 逐页精读（页2772-2773）

  # 写入
  - id: dbe_lob_write
    type: syntax
    statement: "DBE_LOB.LOB_WRITE(blob_obj INOUT BLOB, amount IN INTEGER, off_set IN BIGINT, source IN RAW) RETURN BLOB：将RAW数据写入BLOB指定位置。CLOB版本接受VARCHAR2返回CLOB。BLOB以字节为单位，CLOB以字符为单位。"
    source_anchor: "3.12.2 表3-237"
    status: confirmed
    verification_method: 逐页精读（页2778-2779）

  - id: dbe_lob_write_append
    type: syntax
    statement: "DBE_LOB.LOB_WRITE_APPEND(blob_obj INOUT BLOB, amount IN INTEGER, buffer IN RAW)：将数据追加到LOB尾部。CLOB版本接受VARCHAR2。"
    source_anchor: "3.12.2 表3-238"
    status: confirmed
    verification_method: 逐页精读（页2779）

  # 复制
  - id: dbe_lob_copy
    type: syntax
    statement: "DBE_LOB.LOB_COPY(blob_obj INOUT BLOB, source_obj IN BLOB, amount IN BIGINT, dest_offset IN BIGINT DEFAULT 1, src_offset IN BIGINT DEFAULT 1)：将源LOB内容复制到目标LOB指定位置。amount须≥1且≤LOBMAXSIZE。偏移量默认1。CLOB版本参数相同。"
    source_anchor: "3.12.2 表3-208"
    status: confirmed
    verification_method: 逐页精读（页2774）

  # 删除/截断
  - id: dbe_lob_erase
    type: syntax
    statement: "DBE_LOB.LOB_ERASE(blob_obj INOUT BLOB, amount INOUT BIGINT, off_set IN BIGINT)：从指定偏移开始删除指定长度内容。amount输入为期望删除长度，输出为实际删除长度。"
    source_anchor: "3.12.2 表3-209"
    status: confirmed
    verification_method: 逐页精读（页2775）

  - id: dbe_lob_strip
    type: syntax
    statement: "DBE_LOB.LOB_STRIP(blob_obj INOUT BLOB, newlen IN BIGINT)：截断LOB到指定长度。执行后LOB长度变为newlen。"
    source_anchor: "3.12.2 表3-216"
    status: confirmed
    verification_method: 逐页精读（页2777）

  # 子串
  - id: dbe_lob_substr
    type: syntax
    statement: "DBE_LOB.LOB_SUBSTR(lob_loc IN BLOB|CLOB, amount IN INTEGER DEFAULT 32767, off_set IN BIGINT DEFAULT 1) RETURN RAW|VARCHAR2：读取LOB子串。BLOB返回RAW，CLOB返回VARCHAR2，BFILE须先BFILEOPEN。"
    source_anchor: "3.12.2 表3-215"
    status: confirmed
    verification_method: 逐页精读（页2777）

  # 临时LOB
  - id: dbe_lob_create_temporary
    type: syntax
    statement: "DBE_LOB.CREATE_TEMPORARY(lob_loc INOUT BLOB|CLOB, cache IN BOOLEAN, dur IN INTEGER DEFAULT 10)：创建临时BLOB/CLOB。cache和dur仅用于语法兼容。"
    source_anchor: "3.12.2 表3-218"
    status: confirmed
    verification_method: 逐页精读（页2778）

  - id: dbe_lob_freetemporary
    type: syntax
    statement: "DBE_LOB.FREETEMPORARY(lob_loc INOUT BLOB|CLOB)：删除临时LOB。"
    source_anchor: "3.12.2 表3-220"
    status: confirmed
    verification_method: 逐页精读（页2779）

  # 追加
  - id: dbe_lob_append
    type: syntax
    statement: "DBE_LOB.LOB_APPEND(blob_obj INOUT BLOB, source_obj IN BLOB)：将源LOB内容拼接到目标LOB尾部。CLOB版本参数相同。"
    source_anchor: "3.12.2 表3-222"
    status: confirmed
    verification_method: 逐页精读（页2779）

  # 匹配与比较
  - id: dbe_lob_match
    type: syntax
    statement: "DBE_LOB.MATCH(blob_obj IN BLOB, pattern IN RAW, start IN BIGINT, matchnth IN INTEGER, occurrence OUT BIGINT, returnflag OUT INTEGER)：返回字符串在LOB中第N次出现的位置。"
    source_anchor: "3.12.2 表3-212"
    status: confirmed
    verification_method: 逐页精读（页2776）

  - id: dbe_lob_compare
    type: syntax
    statement: "DBE_LOB.COMPARE(blob_obj1 IN BLOB, blob_obj2 IN BLOB, amount IN BIGINT, off_set1 IN BIGINT DEFAULT 1, off_set2 IN BIGINT DEFAULT 1) RETURN INTEGER：比较两个LOB或其部分。返回0表示相等。支持BFILE比较。"
    source_anchor: "3.12.2 表3-213"
    status: confirmed
    verification_method: 逐页精读（页2776）

  # BFILE操作
  - id: dbe_lob_bfileopen
    type: syntax
    statement: "DBE_LOB.BFILEOPEN(bfile IN DBE_LOB.BFILE)：打开数据库BFILE。使用LOB_SUBSTR/LOB_READ读取BFILE前必须先调用此接口。"
    source_anchor: "3.12.2 表3-225"
    status: confirmed
    verification_method: 逐页精读（页2780）

  - id: dbe_lob_bfilename
    type: syntax
    statement: "DBE_LOB.BFILENAME(directory IN TEXT, filename IN TEXT) RETURN DBE_LOB.BFILE：根据目录和文件名构造BFILE对象。"
    source_anchor: "3.12.2 表3-236"
    status: confirmed
    verification_method: 逐页精读（页2782）

  # 类型转换
  - id: dbe_lob_convertto_blob
    type: syntax
    statement: "DBE_LOB.CONVERTTOBLOB(blob_obj INOUT BLOB, clob_obj IN CLOB, amount IN BIGINT, dest_offset IN BIGINT, src_offset IN BIGINT)：将CLOB转换为BLOB。"
    source_anchor: "3.12.2 表3-232"
    status: confirmed
    verification_method: 逐页精读（页2782）

  - id: dbe_lob_convertto_clob
    type: syntax
    statement: "DBE_LOB.CONVERTTOCLOB(clob_obj INOUT CLOB, blob_obj IN BLOB, amount IN BIGINT, dest_offset IN BIGINT, src_offset IN BIGINT)：将BLOB转换为CLOB。"
    source_anchor: "3.12.2 表3-233"
    status: confirmed
    verification_method: 逐页精读（页2783）

  # 使用流程
  - id: dbe_lob_usage_pattern
    type: behavior_oracle
    statement: "DBE_LOB标准流程：1.CREATE_TEMPORARY创建临时LOB或使用表列LOB → 2.LOB_WRITE/LOB_WRITE_APPEND写入 → 3.LOB_READ/LOB_SUBSTR读取 → 4.LOB_GET_LENGTH获取长度 → 5.FREETEMPORARY释放临时LOB。BFILE流程：BFILENAME构造 → BFILEOPEN打开 → LOB_READ读取 → BFILECLOSE关闭。"
    source_anchor: "3.12.2 综合分析"
    status: confirmed
    verification_method: 综合接口定义分析（页2768-2783）

  # 大小限制
  - id: dbe_lob_size_limits
    type: constraint
    statement: "LOB_READ的amount须1-32767。LOB_COPY的amount须1-LOBMAXSIZE。GET_LENGTH不支持大于2GB（旧版）。LOB_READ/WRITE/COPY/SUBSTR支持大于1GB。CONVERTTOBLOB/CONVERTTOCLOB不支持大于1GB。"
    source_anchor: "3.12.2 各接口参数说明"
    status: confirmed
    verification_method: 逐页精读（页2770-2783）
