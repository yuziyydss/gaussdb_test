facts:
- id: create_db_link_wave8_87_purpose
  type: syntax
  statement: "CREATE DATABASE LINK创建DATABASE LINK对象；语法为CREATE [PUBLIC] DATABASE LINK dblink [CONNECT TO {CURRENT_USER | 'user' IDENTIFIED BY 'password'}] [name] [USING (option 'value'[...])]；PUBLIC创建对所有用户可见的公共连接，未指定为私有连接仅当前用户可用；CURRENT_USER使用当前数据库初始用户名和空密码连接；name当前只支持OCI字符串或省略（指定则连接Oracle数据库，省略则连接GaussDB数据库）。"
  source_anchor: "1.13.9.17 功能描述/语法格式/参数说明 页1423-1424"
  source_refs: &refdbl
  - w8_87_1_13_9_17
  status: confirmed
- id: create_db_link_wave8_87_a_mode_notes
  type: constraint
  statement: "限制：DATABASE LINK特性只能在A兼容模式数据库下使用；禁止使用DATABASE LINK连接初始用户，禁止初始用户创建、修改和删除DATABASE LINK对象；创建时不会对是否可连接成功进行验证（缺乏相关关键字可能在使用时报错）；升级未提交情况下无法创建使用；未指定CURRENT_USER或CONNECT TO连接串时会连接失败；连接GaussDB时使用localhost、127.0.0.1或本机IP及对应端口可连接当前实例数据库。"
  source_anchor: "1.13.9.17 注意事项 页1423-1424"
  source_refs: *refdbl
  status: confirmed
- id: create_db_link_wave8_87_gauss_options
  type: constraint
  statement: "连接GaussDB的options：host指定数据库IP地址（不指定默认为空，可指定多个IP以逗号分隔，当前不支持密态数据库）；port指定端口号（默认5432）；dbname指定数据库名称（默认连接远程使用的用户名）；fetch_size从远程每次获取数据量大小[0, 2147483647]，默认100。"
  source_anchor: "1.13.9.17 参数说明 USING 页1424"
  source_refs: *refdbl
  status: confirmed
- id: create_db_link_wave8_87_oci_options
  type: constraint
  statement: "连接Oracle的options：dbserver实例信息[ip]:端口/实例名（IPv4可省略[]，IPv6不可省略；SSL连接需指定TNS节点名）；isolation_level事务隔离级别默认serializable（可read_committed、read_only）；max_long long/long raw列最大长度[1, 1073741823]（预置参数暂不生效）；strip_zeros设为yes/on/true时删除字符串中ASCII 0字符；prefetch每次fetch行数[1, 1000]默认50；lob_prefetch lob每次fetch字节[0, 536870912]默认1048576（预置暂不生效）；time_out执行超时[0, 2147483647]默认0不超时；case_insensitive大小写敏感开关默认关（on时表名及Schema名默认转大写处理、列名本地转小写存储、无法查询小写及大小写混用名；off时大写需双引号加大写查询、混用需双引号、小写可默认或双引号查询）。"
  source_anchor: "1.13.9.17 参数说明 USING 页1424-1425"
  source_refs: *refdbl
  status: confirmed
- id: create_db_link_wave8_87_ssl
  type: constraint
  statement: "连接Oracle SSL配置方法：1.在GaussDB端OCI客户端sqlnet.ora中配置wallet路径（WALLET_LOCATION）及SSL相关属性（SQLNET.AUTHENTICATION_SERVICES=(TCPS, NTS, BEQ)、SSL_CLIENT_AUTHENTICATION=TRUE、SSL_CIPHER_SUITES）；2.在tnsnames.ora中配置与服务端TCPS协议对应的TNS；3.创建DATABASE LINK时DBSERVER选项指定配置的TNS名；4.首次连接需保证tnsnames.ora文件存在，不存在需正确配置并重启GaussDB数据库后才可正常使用。"
  source_anchor: "1.13.9.17 须知 SSL连接 页1426"
  source_refs: *refdbl
  status: confirmed
- id: create_db_link_wave8_87_example
  type: behavior_oracle
  statement: "示例（CREATE USER local_user WITH SYSADMIN后SET ROLE）：创建私有DBLink（USING host/port/dbname，host也可以是IPv6地址）、公共DBLink、公共连接Oracle库的DBLink（OCI USING dbserver/prefetch '100'）、使用SSL连接Oracle库的DBLink（OCI USING dbserver 'ORA_SSL'）；清理时DROP PUBLIC DATABASE LINK逐个删除后RESET ROLE并DROP USER。"
  source_anchor: "1.13.9.17 示例 页1426-1427"
  source_refs: *refdbl
  status: confirmed
- id: create_directory_wave8_87_purpose
  type: syntax
  statement: "CREATE DIRECTORY创建一个目录对象，定义服务器文件系统上目录的别名，用于存放用户使用的数据文件，用户可以通过dbe_file高级包进行读写；语法为CREATE [OR REPLACE] DIRECTORY directory_name AS 'path_name'；directory_name取值字符串符合标识符命名规范；path_name取值有效的操作系统路径。"
  source_anchor: "1.13.9.18 功能描述/须知/语法格式 页1427"
  source_refs: &refdir
  - w8_87_1_13_9_18
  status: confirmed
- id: create_directory_wave8_87_security
  type: constraint
  statement: "安全须知：目录对象对于指定用户可以赋予READ和WRITE操作权限，用于给dbe_file提供权限控制；如果创建的目录对象在操作系统关键目录（如根目录）下，修改目录文件配置可能造成非预期安全风险；用户自行部署数据库场景进行目录权限授权时，必须确保目标目录满足安全基线核查、具备访问控制审计机制、完成敏感数据分类分级等安全条件要求，权限配置应遵循最小权限原则并建立权限审批追溯机制。"
  source_anchor: "1.13.9.18 须知 页1427"
  source_refs: *refdir
  status: confirmed
- id: create_directory_wave8_87_privileges_validation
  type: constraint
  statement: "权限与校验：enable_access_server_directory=off时只允许初始用户创建目录对象，on时具有SYSADMIN权限的用户和继承内置角色gs_role_directory_create权限的用户可以创建；创建用户默认拥有此目录对象的READ和WRITE操作权限；目录默认OWNER为创建目录对象的用户；禁止创建路径含特殊字符或相对路径的目录；创建时校验路径是否为操作系统实际存在路径（不存在提示风险）、校验数据库初始化（omm）用户对路径的R/W/X权限（不足提示风险）；用户需保证各节点上路径一致性否则产生无法匹配路径问题；可在pg_directory表中查看已存在目录对象；不支持在PDB内使用目录对象。"
  source_anchor: "1.13.9.18 注意事项 页1427-1428"
  source_refs: *refdir
  status: confirmed
- id: create_directory_wave8_87_example
  type: behavior_oracle
  statement: "示例中CREATE OR REPLACE DIRECTORY dir AS '/tmp/'后select * from pg_directory可见（dirname=dir, owner=10, dirpath=/tmp），DROP DIRECTORY dir删除（相关链接ALTER DIRECTORY、DROP DIRECTORY）。"
  source_anchor: "1.13.9.18 示例 页1428"
  source_refs: *refdir
  status: confirmed
- id: create_event_wave8_87_purpose
  type: syntax
  statement: "CREATE EVENT创建一个新的定时任务（与表或其他数据库对象关联，满足指定事件条件时自动触发执行预定义操作或语句）；语法为CREATE [DEFINER = user] EVENT [IF NOT EXISTS] event_name ON SCHEDULE schedule [ON COMPLETION [NOT] PRESERVE] [ENABLE | DISABLE | DISABLE ON SLAVE] [COMMENT 'string'] DO event_body。"
  source_anchor: "1.13.9.19 功能描述/语法格式 页1428-1429"
  source_refs: &refevent
  - w8_87_1_13_9_19
  status: confirmed
- id: create_event_wave8_87_compat_permissions
  type: constraint
  statement: "限制：定时任务相关操作只有sql_compatibility = 'B'时支持；非SYSADMIN用户操作（创建、修改及删除）定时任务需被SYSADMIN用户赋权（与高级包DBE_SCHEDULER创建定时任务赋权操作一致）；时间间隔表达式目前兼容浮点数语法但计算时会取整，不建议使用浮点数形式；同一数据库下不支持创建同名定时任务。"
  source_anchor: "1.13.9.19 注意事项 页1428-1429"
  source_refs: *refevent
  status: confirmed
- id: create_event_wave8_87_body_limits
  type: constraint
  statement: "待执行语句范围是除安全相关操作以外的任意SQL语句（某些具有约束的SQL语句会执行失败，如不支持通过复合语句创建数据库）；不支持的安全相关操作包括使用加密函数、创建/设置用户、创建/设置GROUP、连接数据库、函数加密等；指定definer失败的场景：操作用户不具有SYSADMIN权限，或当前用户与definer不一致时指定definer为初始用户、运维管理员、监控管理员或开启三权分立（enableSeparationOfDuty=on）；待执行语句涉及用户密码相关操作时系统表会记录明文，不建议进行；创建后执行失败的原因可通过SHOW EVENTS或在PG_JOB表中查看。"
  source_anchor: "1.13.9.19 注意事项 页1429"
  source_refs: *refevent
  status: confirmed
- id: create_event_wave8_87_schedule
  type: constraint
  statement: "ON SCHEDULE schedule：AT timestamp [+ INTERVAL interval]表示只在时间点执行一次；EVERY interval表示每隔interval重复执行，可指定STARTS timestamp（起始时间，未指定默认当前时刻）和ENDS timestamp（结束时间，未指定默认3999-12-31 16:00:00）；interval由数字和单位组成（YEAR/MONTH/DAY/HOUR/MINUTE/SECOND及YEAR TO MONTH、DAY TO HOUR、DAY TO MINUTE、DAY TO SECOND、HOUR TO MINUTE、HOUR TO SECOND、MINUTE TO SECOND）；B兼容模式b_format_version='5.7'且b_format_dev_version='s1'时interval取值可用下划线代替TO（如YEAR_MONTH、DAY_HOUR）。"
  source_anchor: "1.13.9.19 参数说明 ON SCHEDULE 页1429-1430"
  source_refs: *refevent
  status: confirmed
- id: create_event_wave8_87_options
  type: constraint
  statement: "其他选项：ON COMPLETION [NOT] PRESERVE默认任务完成后系统表立刻删除定时任务，PRESERVE可覆盖默认行为；ENABLE | DISABLE | DISABLE ON SLAVE默认ENABLE（到达规定时间立即执行），DISABLE改变活动状态，DISABLE ON SLAVE表现与DISABLE一致；COMMENT 'string'注释内容在GS_JOB_ATTRIBUTE表中查看；DO为定时任务待执行语句；DEFINER = user指定待执行语句执行时使用的权限（默认当前创建者权限），仅具有SYSADMIN权限的用户可以指定该关键字。"
  source_anchor: "1.13.9.19 参数说明 页1430"
  source_refs: *refevent
  status: confirmed
- id: create_event_wave8_87_example
  type: behavior_oracle
  statement: "B库示例：CREATE EVENT IF NOT EXISTS event_e1 ON SCHEDULE AT sysdate + interval 5 second DO INSERT INTO t_ev VALUES(0)五秒后执行一次且执行完后自动删除；CREATE EVENT IF NOT EXISTS event_e2 ON SCHEDULE EVERY 1 minute DO INSERT INTO t_ev VALUES(1)每分钟执行一次（查询可见新增数据）；DROP EVENT event_e2删除（相关链接ALTER EVENT、DROP EVENT、SHOW EVENTS）。"
  source_anchor: "1.13.9.19 示例 页1430-1431"
  source_refs: *refevent
  status: confirmed
- id: create_extension_wave8_87_purpose_limits
  type: constraint
  statement: "CREATE EXTENSION安装一个扩展；扩展功能为内部使用功能，只允许创建数据库内部的高级包或扩展；安装前必须先安装好该扩展的支持文件；必须保证没有同名的扩展已被安装；安装意味着执行扩展的脚本文件（创建新的SQL实体如函数、数据类型、操作符和索引支持方法）；需要拥有和创建扩展组件对象相同的权限（大多数扩展意味着需要数据库所有者权限，运行命令的角色将变为扩展的所有者）；数据库中存在与需安装扩展同名的数据库对象（PACKAGE、同义词、操作符、目录、函数、存储过程、视图以及表）时安装失败；数据库禁止直接创建扩展，需设置enable_extension为true才能创建；enable_object_special_character为off且扩展脚本使用@extschema@时，支持文件中schema参数值不能包含[、\"、$、'\\以及]任意特殊字符。"
  source_anchor: "1.13.9.20 须知/功能描述/注意事项 页1431-1432"
  source_refs: &refext
  - w8_87_1_13_9_20
  status: confirmed
- id: create_extension_wave8_87_syntax
  type: syntax
  statement: "语法为CREATE EXTENSION [IF NOT EXISTS] extension_name [WITH] [SCHEMA schema_name] [VERSION version] [FROM old_version]；IF NOT EXISTS存在同名扩展时不直接报错而是产生提示（不保证系统已有扩展与脚本创建的扩展相同）；extension_name将被安装扩展的名字（使用SHAREDIR/extension/extension_name.control中的详细信息创建）。"
  source_anchor: "1.13.9.20 语法格式/参数说明 页1432"
  source_refs: *refext
  status: confirmed
- id: create_extension_wave8_87_schema_version
  type: constraint
  statement: "SCHEMA schema_name指定扩展实例安装的模式（指定的模式必须已经存在，扩展实例及控制文件均未指定模式时使用默认模式安装；扩展不属于任何模式，扩展在一个数据库范围内的名字不受限制，但一个扩展的实例属于一个模式）；VERSION version安装扩展的版本（标识符或字符串，默认版本在扩展控制文件中指定）；FROM old_version仅当需要升级安装已有模块中不存在的内容时才需要指定（将新内容安装到已有模块的扩展中而不是创建新实体，需指定Schema为包含已存在实体的模式）。"
  source_anchor: "1.13.9.20 参数说明 页1432"
  source_refs: *refext
  status: confirmed
- id: create_extension_wave8_87_example
  type: behavior_oracle
  statement: "示例：SET enable_extension = true后CREATE EXTENSION IF NOT EXISTS security_plugin安装扩展，DROP EXTENSION security_plugin删除。"
  source_anchor: "1.13.9.20 示例 页1432"
  source_refs: *refext
  status: confirmed
