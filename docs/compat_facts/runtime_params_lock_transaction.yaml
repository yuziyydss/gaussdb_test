facts:
- id: guc_td_compatible_truncation
  type: behavior_oracle
  statement: td_compatible_truncation为on时控制与TD数据库兼容的特征，对CHAR/VARCHAR类型列插入超长字符串时按列定义最大长度自动截断（不报错）；不适用insert包含外表场景；SQL_ASCII等字节编码数据库截断多字节字符可能产生非预期结果；默认off，USERSET参数，PDB级别可设置。
  source_anchor: 7.3.17 版本和平台兼容性 td_compatible_truncation（页4653）
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（7.3.17章节源文确认）
- id: guc_default_transaction_isolation
  type: environment
  statement: default_transaction_isolation设置事务隔离级别默认值。GaussDB中SET设置改变会话级隔离级别；MySQL不支持该系统参数。
  source_anchor: 7 事务
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4652）
- id: guc_default_transaction_read_only
  type: environment
  statement: default_transaction_read_only设置事务访问模式。GaussDB通过SET只能改变当前事务访问模式；MySQL通过SET改变会话级。
  source_anchor: 7 事务
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4653）
- id: guc_lock_timeout
  type: environment
  statement: lock_timeout设置锁等待超时时间。
  source_anchor: 7 锁管理
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4486）
- id: guc_deadlock_timeout
  type: environment
  statement: deadlock_timeout设置死锁检测间隔。
  source_anchor: 7 锁管理
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4486）
