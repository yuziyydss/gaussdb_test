facts:
- id: drop_db_link_wave8_78_purpose
  type: syntax
  statement: "DROP DATABASE LINK删除一个DATABASE LINK对象；语法为DROP [PUBLIC] DATABASE LINK [IF EXISTS] dblink_name；dblink_name为连接对象的名称。"
  source_anchor: "1.13.10.11 功能描述/语法格式/参数说明 页1664"
  source_refs: &refdbl
  - w8_78_1_13_10_11
  status: confirmed
- id: drop_db_link_wave8_78_public_private
  type: constraint
  statement: "指定PUBLIC时，表示删除对所有用户可见的公共数据库连接；如果未指定，默认为PRIVATE。"
  source_anchor: "1.13.10.11 参数说明 PUBLIC 页1664"
  source_refs: *refdbl
  status: confirmed
- id: drop_db_link_wave8_78_if_exists
  type: constraint
  statement: "IF EXISTS判断指定的DATABASE LINK是否存在，使用该参数可以避免出现报错；存在则删除成功，不存在不会进行删除操作，仅产生一个NOTICE提示。"
  source_anchor: "1.13.10.11 参数说明 IF EXISTS 页1664"
  source_refs: *refdbl
  status: confirmed
- id: drop_db_link_wave8_78_example_create
  type: behavior_oracle
  statement: "示例前置：CREATE USER local_user WITH SYSADMIN后SET ROLE local_user；创建私有DBLink（USING host/port/dbname，host也可以是IPv6地址）、创建公共DBLink、创建公共连接Oracle库的DBLink（OCI USING dbserver/prefetch）以及使用SSL连接Oracle库的DBLink（OCI USING dbserver 'ORA_SSL'）四种。"
  source_anchor: "1.13.10.11 示例 页1664"
  source_refs: *refdbl
  status: confirmed
- id: drop_db_link_wave8_78_example_drop
  type: behavior_oracle
  statement: "示例清理阶段：DROP PUBLIC DATABASE LINK逐个删除private_dblink、public_dblink、public_dblink_to_o、public_dblink_SSL后RESET ROLE并DROP USER local_user（相关链接ALTER DATABASE LINK、CREATE DATABASE LINK）。"
  source_anchor: "1.13.10.11 示例 页1664-1665"
  source_refs: *refdbl
  status: confirmed
- id: drop_directory_wave8_78_purpose
  type: syntax
  statement: "DROP DIRECTORY从数据库中删除一个目录对象；语法为DROP DIRECTORY [IF EXISTS] directory_name；directory_name取值为已经存在的目录名。"
  source_anchor: "1.13.10.12 功能描述/语法格式/参数说明 页1665"
  source_refs: &refdir
  - w8_78_1_13_10_12
  status: confirmed
- id: drop_directory_wave8_78_privileges
  type: constraint
  statement: "当enable_access_server_directory=off时，仅允许初始用户可以执行该操作；当enable_access_server_directory=on时，具有SYSADMIN权限的用户、DIRECTORY对象的属主、被授予了该DIRECTORY的DROP权限的用户或者继承了内置角色gs_role_directory_drop权限的用户可以执行该操作。"
  source_anchor: "1.13.10.12 注意事项 页1665"
  source_refs: *refdir
  status: confirmed
- id: drop_directory_wave8_78_pdb
  type: constraint
  statement: "不支持在PDB内使用目录对象。"
  source_anchor: "1.13.10.12 注意事项 页1665"
  source_refs: *refdir
  status: confirmed
- id: drop_directory_wave8_78_syntax
  type: syntax
  statement: "语法为DROP DIRECTORY [IF EXISTS] directory_name；directory_name为目录名称，取值范围为已经存在的目录名。"
  source_anchor: "1.13.10.12 语法格式/参数说明 页1665"
  source_refs: *refdir
  status: confirmed
- id: drop_directory_wave8_78_if_exists
  type: constraint
  statement: "IF EXISTS判断指定的目录是否存在：存在则删除成功；不存在不会进行删除操作，仅产生一个NOTICE提示用于告知指定的目录不存在。"
  source_anchor: "1.13.10.12 参数说明 IF EXISTS 页1665"
  source_refs: *refdir
  status: confirmed
- id: drop_directory_wave8_78_example
  type: behavior_oracle
  statement: "示例中CREATE OR REPLACE DIRECTORY dir as '/tmp/'创建目录对象后DROP DIRECTORY dir删除（相关链接CREATE DIRECTORY、ALTER DIRECTORY）。"
  source_anchor: "1.13.10.12 示例 页1665-1666"
  source_refs: *refdir
  status: confirmed
- id: drop_event_wave8_78_purpose
  type: syntax
  statement: "DROP EVENT删除一个定时任务；语法为DROP EVENT [IF EXISTS] event_name；IF EXISTS判断指定的定时任务是否存在，不存在时不会进行删除操作，仅产生一个NOTICE提示。"
  source_anchor: "1.13.10.13 功能描述/语法格式/参数说明 页1666"
  source_refs: &refevent
  - w8_78_1_13_10_13
  status: confirmed
- id: drop_event_wave8_78_compat
  type: constraint
  statement: "定时任务相关操作仅在B兼容模式数据库（即sql_compatibility = 'B'）时支持。"
  source_anchor: "1.13.10.13 注意事项 页1666"
  source_refs: *refevent
  status: confirmed
- id: drop_event_wave8_78_if_exists
  type: constraint
  statement: "IF EXISTS判断指定的定时任务是否存在：存在则删除成功；不存在不会进行删除操作，仅产生一个NOTICE提示，用于告知指定的定时任务不存在。"
  source_anchor: "1.13.10.13 参数说明 IF EXISTS 页1666"
  source_refs: *refevent
  status: confirmed
- id: drop_event_wave8_78_example_once
  type: behavior_oracle
  statement: "示例（B库test_event）中创建执行一次的定时任务CREATE EVENT IF NOT EXISTS event_e1 ON SCHEDULE AT sysdate + interval 5 second DO INSERT INTO t_ev VALUES(0)，五秒后查询表t_ev可见一条num=0数据，执行完后定时任务自动删除。"
  source_anchor: "1.13.10.13 示例 页1666"
  source_refs: *refevent
  status: confirmed
- id: drop_event_wave8_78_example_repeat
  type: behavior_oracle
  statement: "示例中创建每隔一分钟执行一次的定时任务CREATE EVENT IF NOT EXISTS event_e2 ON SCHEDULE EVERY 1 minute DO INSERT INTO t_ev VALUES(1)，多次查询表可见新增数据，DROP EVENT event_e2删除定时任务（相关链接ALTER EVENT、CREATE EVENT、SHOW EVENTS）。"
  source_anchor: "1.13.10.13 示例 页1666-1667"
  source_refs: *refevent
  status: confirmed
- id: drop_extension_wave8_78_purpose_internal
  type: constraint
  statement: "DROP EXTENSION从数据库中删除一个扩展；扩展功能为内部使用功能，只允许删除数据库内部的高级包或扩展。"
  source_anchor: "1.13.10.14 须知/功能描述 页1667"
  source_refs: &refext
  - w8_78_1_13_10_14
  status: confirmed
- id: drop_extension_wave8_78_privileges
  type: constraint
  statement: "仅扩展的拥有者或初始用户可以执行该操作；在删除扩展的过程中，构成扩展的组件也会被级联删除。"
  source_anchor: "1.13.10.14 注意事项 页1667"
  source_refs: *refext
  status: confirmed
- id: drop_extension_wave8_78_syntax
  type: syntax
  statement: "语法为DROP EXTENSION [IF EXISTS] name[, ...] [CASCADE | RESTRICT]；IF EXISTS在扩展不存在时不删除仅产生NOTICE提示；name为已安装的扩展模块的名称。"
  source_anchor: "1.13.10.14 语法格式/参数说明 页1667-1668"
  source_refs: *refext
  status: confirmed
- id: drop_extension_wave8_78_cascade_restrict
  type: constraint
  statement: "CASCADE级联删除依赖于该扩展的对象；RESTRICT在存在依赖于扩展的对象时不允许删除此扩展（除非所有的成员对象和其他扩展对象在一条DROP命令中同时删除）；未指定时默认为RESTRICT（相关链接ALTER EXTENSION、CREATE EXTENSION）。"
  source_anchor: "1.13.10.14 参数说明 CASCADE|RESTRICT 页1668"
  source_refs: *refext
  status: confirmed
