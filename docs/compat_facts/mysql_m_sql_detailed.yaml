# M模式SQL — DDL/DML/DCL逐条差异深化 — 结构化参考事实
# 来源: gaussdb-rf-cent.pdf 4.4.2.7 (物理页3403-3498)
document: "集中式版参考 / 4.4.2.7 MySQL兼容性M模式SQL DDL/DML/DCL"
