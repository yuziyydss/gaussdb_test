- id: dbeobf_wave8_155_overview_warning
  type: constraint
  statement: "DBE_OBFUSCATION_TOOLKIT安全警告：由于DES算法、DES3算法和MD5哈希算法存在算法安全风险，请谨慎使用DBE_OBFUSCATION_TOOLKIT进行加解密操作；该高级功能包是GaussDB提供的兼容性功能包，主要用于支持DES、DES3、MD5哈希算法的接口以保持与原有业务逻辑的兼容；调用相关接口时会产生WARNING（The DES/DES3/MD5 algorithm is an insecure algorithm, please use it with caution.）。"
  source_anchor: "3.12.2.12 DBE_OBFUSCATION_TOOLKIT须知与示例 页2794-2801"
  source_refs: &refob
  - w8_155_3_12
  status: confirmed
