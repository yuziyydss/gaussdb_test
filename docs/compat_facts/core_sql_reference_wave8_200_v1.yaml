  type: constraint
  statement: "DDL主键/UNIQUE索引/外键差异（表4-193）：GaussDB不支持UNIQUE INDEX|KEY index_name语法使用报错；全局二级索引指定using btree底层建ubtree；ustore表using btree底层建ubtree。"
