- id: bmode_wave8_200_ddl_auto_increment
  type: constraint
  statement: "DDL自增列差异（表4-193）：建议索引第一个字段否则警告（MySQL必须）；AUTO_INCREMENT=value须小于2^127正数（MySQL不校验）；达最大值继续自增报错而MySQL场景不同；不支持innodb_autoinc_lock_mode（auto_increment_cache=0时相似）；批量插入混合0/NULL/确定值出错后自增值不一定一致（auto_increment_cache控制）；并行导入自增值可能不连续；本地临时表不预留自增值；SERIAL类型差异；auto_increment_offset不可大于increment而MySQL允许并忽略；ALTER TABLE重写顺序不同导致自增值顺序不同；首次预留为统计信息行数；last_insert_id返回128位整型；触发器/函数中自增刷新last_insert_id而MySQL不刷新；GUC超范围报错而MySQL改边界值；no_auto_value_on_zero+非NOT NULL时GaussDB插NULL不触发而MySQL触发。"
  source_anchor: "4.4.3.7.1 表4-193 页3550-3552"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_ddl_prefix_index
  type: constraint
  statement: "DDL前缀索引差异（表4-193）：前缀长度不超2676键值受内部页面限制超限报错；CREATE INDEX不支持COALESCE/EXTRACT/GREATEST/LEAST/LNNVL/NULLIF/NVL/NVL2/OVERLAY/POSITION/REGEXP_LIKE/SUBSTRING/TIMESTAMPDIFF/TREAT/TRIM/XMLCONCAT/XMLELEMENT/XMLEXISTS/XMLFOREST/XMLPARSE/XMLPI/XMLROOT/XMLSERIALIZE作前缀键字段名称；主键索引不支持前缀键。"
  source_anchor: "4.4.3.7.1 表4-193 页3552"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_ddl_charset_event_partition
  type: syntax
  statement: "DDL支持项（表4-193）：指定字符集与排序规则支持；表第一列前/指定列后添加列支持；修改列名称/定义兼容；定时任务EVENT语法兼容；创建分区表语法兼容；指定表级和列级comment支持；索引级comment支持。"
  source_anchor: "4.4.3.7.1 表4-193 页3552-3553"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_ddl_exchange_partition
  type: constraint
  statement: "DDL EXCHANGE PARTITION差异（表4-193）：自增列MySQL重置而GaussDB不重置按旧值递增；tablespace MySQL使用时无法交换而GaussDB不同tablespace可交换；列默认值MySQL不校验而GaussDB校验不同无法交换；DROP列后MySQL表结构一致可交换而GaussDB需被删除列严格对齐；hash算法不同数据可能不一致；MySQL分区表不支持外键而GaussDB支持（外键约束一致可交换）。"
  source_anchor: "4.4.3.7.1 表4-193 页3554"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_ddl_drop_key_create_like
  type: constraint
  statement: "DDL支持项/差异（表4-193）：DROP [PRIMARY|FOREIGN] KEY支持；CREATE TABLE LIKE差异——MySQL 8.0.16之前不复制CHECK而GaussDB支持复制；主键约束名MySQL固定PRIMARY KEY而GaussDB不支持复制；唯一键/CHECK名/索引名MySQL支持复制而GaussDB不支持；跨sql_mode建表GaussDB可能严格模式失效；跨数据库创建表MySQL支持而GaussDB不支持。"
  source_anchor: "4.4.3.7.1 表4-193 页3555-3556"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_ddl_rename_add_partition
  type: constraint
  statement: "DDL RENAME/ADD PARTITION差异（表4-193）：alter rename仅修改表名不能耦合其他功能；仅旧表名支持schema.table_name且同Schema；不支持跨Schema重命名；RENAME多组表仅全为本地临时表；RENAME TABLE校验顺序与MySQL不一致报错信息不同；ADD PARTITION不支持ALTER TABLE ADD PARTITION(def1,def2,...)多分区仅支持ADD PARTITION(def1),ADD PARTITION(def2),...形式。"
  source_anchor: "4.4.3.7.1 表4-193 页3556-3557"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_dml_delete_update_select_partition
  type: syntax
  statement: "DML支持项（表4-194）：DELETE多表删除/ORDER BY LIMIT/指定分区删除支持；UPDATE多表更新/ORDER BY LIMIT/指定多分区更新支持；SELECT指定多分区查询支持；SELECT INTO可创建新表（MySQL不支持）但不支持集合运算结果作为查询结果。"
  source_anchor: "4.4.3.7.2 表4-194 页3557-3558"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_dml_replace_into
  type: constraint
  statement: "DML REPLACE INTO差异（表4-194）：时间类型MySQL不受严格/宽松影响可插时间0值而GaussDB宽松模式才可（b_format_version='5.7'+b_format_dev_version='s1'+sql_mode=''）严格报错；位串类型MySQL BIT初始值空串''而GaussDB BIT初始值NULL导致NOT NULL报错。"
  source_anchor: "4.4.3.7.2 表4-194 页3559-3560"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_dml_load_data
  type: constraint
  statement: "DML LOAD DATA差异（表4-194）：与MySQL严格模式一致宽松未适配（非法字符GaussDB报错MySQL宽松截断）；IGNORE/LOCAL仅忽略冲突行和填充默认值；LOCAL相对路径从二进制目录搜索不指定从数据目录；单引号分隔符词法解析错误；指定列不支持重复；FIELDS与LINES分隔符不能相同；无法转换报错；SET表达式不支持列名计算/无隐式转换报错；只能用于表；Windows换行符差异报错；字段多于目标表GaussDB告警而MySQL部分场景报错；文件尾分隔符GaussDB视为空字符串列MySQL视为无新列。"
  source_anchor: "4.4.3.7.2 表4-194 页3561-3564"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_dml_insert_ignore
  type: constraint
  statement: "DML INSERT IGNORE差异（表4-194）：GaussDB返回降级后错误信息而MySQL记录到错误堆栈show warnings查看；时间类型GaussDB date/datetime/timestamp默认零值1970-01-01而MySQL默认0000-00-00；bit类型GaussDB不支持INSERT IGNORE错误降级（NOT NULL NULL插入/长度不同均报错）；时间类型指定精度插入时间零值MySQL显示精度而GaussDB不显示；warnings条数不同；触发器中INSERT IGNORE行为差异；bool/serial默认零值差异（GaussDB serial=0 bool=f而MySQL serial=1 bool=0）。"
  source_anchor: "4.4.3.7.2 表4-194 页3565-3572"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_dcl_set_user_var
  type: constraint
  statement: "DCL SET用户自定义变量差异（表4-195）：MySQL自定义变量名长度无约束；GaussDB变量名不超64字节超长截断并提示告警。"
  source_anchor: "4.4.3.7.3 表4-195 页3572"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_dcl_set_transaction_names
  type: constraint
  statement: "DCL SET TRANSACTION/SET NAMES差异（表4-195）：MySQL可设置session和global事务隔离级别和读写模式而GaussDB需设置b_format_behavior_compat_options含set_session_transaction且全局只对当前数据库生效；SET NAMES指定COLLATE暂不支持charset_name与数据库字符集不同。"
  source_anchor: "4.4.3.7.3 表4-195 页3572"
  source_refs: *refw8200
  status: confirmed
- id: bmode_wave8_200_jdbc_getstring_zerofill
  type: constraint
  statement: "JDBC差异（表4-196）：getInt按列标/列名获取无差异；getString按列标/列名——字段为整型且带ZEROFILL属性时GaussDB按宽度用0补位输出而MySQL直接输出结果；getDate无差异。"
  source_anchor: "4.4.3.8.1 表4-196 页3572-3573"
  source_refs: *refw8200
  status: confirmed
