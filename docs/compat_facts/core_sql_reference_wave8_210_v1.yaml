- id: guc_wave8_210_spm_capture_selection
  type: constraint
  statement: "SPM计划捕获/选择参数：spm_enable_plan_capture USERSET枚举off/auto/manual/store默认store——off不开启/auto自动捕获（SQL执行两次以上）/manual手动捕获/store基于auto不需执行两次全部UNACC状态（不使用SPM时打开导致性能劣化/升级期间不捕获新计划outline/507.0.0起不捕获本地临时表计划）；spm_enable_plan_selection USERSET布尔型默认off SPM计划选择功能。"
