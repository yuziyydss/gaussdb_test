- id: guc_wave8_210_spm_cache_filter
  type: syntax
  statement: "SPM缓存/过滤参数：spm_plan_capture_filter SUSET字符串默认空指定捕获的数据库与schema（格式$db1_oid:$schema1_oid逗号分隔/最多10000个/空包含所有schema）；spm_plan_global_cached_size POSTMASTER整型10240~20971520kB默认1GB SPM全局计划缓存大小；spm_plan_session_cached_size SUSET整型1~1048576kB默认1MB SPM会话计划缓存大小（PDB级别）。"
  source_anchor: "7.3.9 SPM计划管理 页4399-4400"
  source_refs: *refw8210
  status: confirmed
- id: guc_wave8_210_spm_retention_cleanup
  type: syntax
  statement: "SPM保留/清理参数：spm_plan_capture_max_plannum USERSET整型默认2000单个数据库最大落盘计划和历史记录数量；spm_plan_retention_days USERSET整型[0,31536000]默认900（15分钟）计划保留天数（0不进行过期判断）；spm_enable_log_detail USERSET布尔型默认off SPM日志详情；spm_enable_baseline_cleanup POSTMASTER布尔型默认on基线清理；spm_enable_plan_history_logging USERSET布尔型默认off计划历史记录日志；spm_plan_history_reserved_percentage POSTMASTER整型[1,100]默认90 gs_spm_plan_history表可填充最大百分比（后台线程24小时触发清理）；spm_enable_async_flush SIGHUP布尔型默认on SPM消息异步持久化（关闭导致capture和history_logging失效）；spm_async_sub_mq_maxsize SIGHUP整型[0,10000]默认1024消息队列最大长度（0停止新消息入队）。"
  source_anchor: "7.3.9 SPM计划管理 页4400-4403"
  source_refs: *refw8210
  status: confirmed
- id: guc_wave8_210_log_location
  type: syntax
  statement: "日志位置参数：log_destination SIGHUP字符串默认stderr——stderr打印到屏幕/csvlog CSV格式需logging_collector=on/syslog通过操作系统syslog/eventlog仅Windows；logging_collector POSTMASTER布尔型默认on后端日志收集线程；log_directory SIGHUP字符串默认安装时指定日志文件目录（非法路径无法重启/gs_guc reload时非法路径输出到上次合法路径）；log_filename SIGHUP字符串默认gaussdb-%Y-%m-%d_%H%M%S.log（strftime模式生成建议%转义定义名称）；log_file_mode SIGHUP整型0000~0777默认0600日志文件权限（日志含敏感数据不能设为对外可读）；log_truncate_on_rotation SIGHUP布尔型默认off on=覆盖写入/off=追加；log_rotation_age SIGHUP整型0~35791394分钟默认1440（1天）创建新日志文件时间间隔；log_rotation_size SIGHUP整型0~2097151kB默认20480（20MB）日志文件最大容量。"
  source_anchor: "7.3.10.1 记录日志的位置 页4404-4408"
  source_refs: *refw8210
  status: confirmed
- id: guc_wave8_210_syslog_event
  type: syntax
  statement: "syslog/eventlog参数：syslog_facility SIGHUP枚举local0~local7默认local0 syslog设备；syslog_ident SIGHUP字符串默认postgres syslog日志标识；event_source POSTMASTER字符串默认PostgreSQL仅Windows生效。"
  source_anchor: "7.3.10.1 记录日志的位置 页4408-4409"
  source_refs: *refw8210
  status: confirmed
- id: guc_wave8_210_log_timing
  type: constraint
  statement: "日志时间参数：client_min_messages USERSET枚举debug5~panic默认notice发送到客户端的消息级别（fatal/panic强制error/info始终发送）；log_min_messages SUSET枚举debug5~panic默认warning写入服务器日志的消息级别（级别越低消息越多/debug1~debug5建议优先按模块logging_module开启）；log_min_error_statement SUSET枚举debug5~panic默认error写入SQL语句的消息级别（含个人信息时可设为panic不记录）；log_min_duration_statement SUSET整型-1~2147483647ms默认3000（3s）记录执行时间的阈值（-1关闭/0记录所有/正数超时记录）；backtrace_min_messages SUSET枚举debug5~panic默认panic写入函数堆栈的消息级别（现场问题定位/高并发设置不当可能拖慢建连甚至实例不可连接）。"
  source_anchor: "7.3.10.2 记录日志的时间 页4409-4412"
  source_refs: *refw8210
  status: confirmed
- id: guc_wave8_210_message_severity
  type: syntax
  statement: "消息严重程度分类（表7-16）：debug[1-5]详细调试信息→syslog DEBUG/eventlog INFORMATION；log对DBA有用信息（检查点统计）→INFO/INFO；info用户需求信息→INFO/INFO；notice可能有帮助信息（截断/索引创建）→NOTICE/INFORMATION；warning警告信息→NOTICE/WARNING；error命令退出错误→WARNING/ERROR；fatal会话终止原因→ERR/ERROR；panic整个数据库关闭原因→CRIT/ERROR。"
  source_anchor: "7.3.10.2 表7-16 页4412"
  source_refs: *refw8210
  status: confirmed
- id: guc_wave8_210_log_content_debug
  type: syntax
  statement: "日志内容调试参数：debug_print_parse SIGHUP布尔型默认off打印解析树；debug_print_rewritten SIGHUP布尔型默认off打印查询重写结果；debug_print_plan SIGHUP布尔型默认off打印执行计划到日志（需log级别为log以上/open时避免调用gs_encrypt_aes128/gs_decrypt_aes128防敏感信息泄露）；debug_pretty_print USERSET布尔型默认on对调试日志进行缩进生成易读输出。"
  source_anchor: "7.3.10.3 记录日志的内容 页4412-4414"
  source_refs: *refw8210
  status: confirmed
- id: guc_wave8_210_log_content_misc
  type: syntax
  statement: "日志内容其他参数：log_checkpoints SIGHUP布尔型默认off记录检查点和重启点信息（缓存区数量/写入时间等）；log_connections SIGHUP布尔型默认off记录客户端连接请求（IP/PORT/用户名/数据库名/耗时）；log_disconnections SIGHUP布尔型默认off记录断连；log_duration SIGHUP布尔型默认off记录每个已完成语句的持续时间；log_error_verbosity SIGHUP枚举默认verbose控制错误报告详细程度（terse/verbose/detail）；log_hostname SIGHUP布尔型默认off记录主机名（可能影响性能）；log_lock_waits USERSET布尔型默认off记录锁等待；log_statement SIGHUP枚举默认none记录语句类型（none/ddl/mod/all）；log_temp_files SIGHUP整型默认-1记录临时文件（-1关闭/0记录所有/正数超时记录）。"
  source_anchor: "7.3.10.3 记录日志的内容 页4414-4417"
  source_refs: *refw8210
  status: confirmed
- id: guc_wave8_210_log_line_prefix
  type: syntax
  statement: "log_line_prefix SIGHUP字符串默认%m [%n]控制每条日志信息的前缀格式（printf风格）——转义字符：%a应用名/%u用户名/%d数据库名/%r远端IP+端口/%h远端IP/%p线程ID/%t时间戳无毫秒/%m带毫秒时间戳/%n错误上报节点/%i命令标签/%e SQLSTATE错误码/%c会话ID（两4字节十六进制）/会话日志编号/%s线程启动时间/%v虚拟事务ID/%x事务ID/%q后端线程判断/%S会话ID/%T Trace ID/%%字符%；需保证最后一个字符是空格或标点。"
  source_anchor: "7.3.10.3 表7-17 页4417-4418"
  source_refs: *refw8210
  status: confirmed
- id: guc_wave8_210_log_timezone_module
  type: syntax
  statement: "log_timezone SIGHUP字符串默认安装时指定记录日志时间戳时区；logging_module会话级字符串默认on(LOCK)模块日志控制——支持ALL快捷操作/on(SSL)开启模块/off(COMMAND,DFS,...)关闭模块/支持~130个模块（COMMAND/DFS/GUC/GSCLEAN/HDFS/ORC/SLRU/MEM_CTL/AUTOVAC/CACHE/ADIO/SSL/GDS/TBLSPC/WLM/OBS/INDEX/EXECUTOR/OPFUSION/GPC/STREAM/LLVM/OPT系列/SPM/UDF/COOP_ANALYZE/WLMCP/ACCELERATE/MOT/PLANHINT/PGSTAT/CARBONDATA/SNAPSHOT/XACT/HANDLE/CLOG/EC/REMOTE/CN_RETRY/PLSQL/TEXTSEARCH/SEQ/REDO/FUNCTION/PARSER/INSTR/WDR系列/INCRE_CKPT/DBL_WRT/RTO_RPO/HEARTBEAT/COMM系列/TIMESERIES/SCHEMA/GTT/SEGMENT_PAGE/USTORE/UPAGE/UBTREE/UNDO/TIMECAPSULE/DCF/AI4DB/DB4AI/SEC系列/COMM系列/VACUUM/JOB/SPI/PLDEBUGGER等/CN_RETRY当前不生效）。"
