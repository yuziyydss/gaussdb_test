facts:
- id: altuser_wave8_51_purpose
  type: syntax
  statement: "ALTER USER用于修改数据库用户属性，包括用户名称和权限等。"
  source_anchor: "1.13.7.44 页1343"
  source_refs: &refalt
  - w8_51_1_13_7_44
  status: confirmed
- id: altuser_wave8_51_session_params
  type: constraint
  statement: "ALTER USER修改的会话参数只针对指定用户生效，且在下一次会话中生效。"
  source_anchor: "1.13.7.44 注意事项 页1343"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_pdb_limits
  type: constraint
  statement: "不支持在PDB内执行ALTER USER IN DATABASE语句；不支持在PDB内修改初始用户密码。"
  source_anchor: "1.13.7.44 注意事项 页1343"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_option_syntax
  type: syntax
  statement: "ALTER USER user_name [WITH] option可修改CREATEDB、CREATEROLE、INHERIT、AUDITADMIN、SYSADMIN、MONADMIN、OPRADMIN、POLADMIN、USEFT、LOGIN、REPLICATION、PERSISTENCE、CONNECTION LIMIT、密码、有效期、资源池、空间限额、ACCOUNT和PASSWORD EXPIRE INTERVAL等属性。"
  source_anchor: "1.13.7.44 语法格式 页1343"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_rename_syntax
  type: syntax
  statement: "ALTER USER user_name RENAME TO new_name用于修改用户名。"
  source_anchor: "1.13.7.44 语法格式 页1344"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_set_parameter_syntax
  type: syntax
  statement: "ALTER USER user_name [IN DATABASE database_name] SET configuration_parameter {TO|= value|DEFAULT|FROM CURRENT}用于修改与用户关联的指定会话参数值。"
  source_anchor: "1.13.7.44 语法格式 页1344"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_reset_parameter_syntax
  type: syntax
  statement: "ALTER USER user_name [IN DATABASE database_name] RESET {configuration_parameter|ALL}用于重置与用户关联的指定或全部会话参数值。"
  source_anchor: "1.13.7.44 语法格式 页1344"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_user_name
  type: constraint
  statement: "user_name必须是已存在用户名；如果用户名包含大写字母，需要使用双引号声明。"
  source_anchor: "1.13.7.44 user_name 页1345"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_redisuser_rename
  type: constraint
  statement: "当前不支持对内部保留对象redisuser执行RENAME TO，也不支持将其他用户重命名为redisuser。"
  source_anchor: "1.13.7.44 user_name须知 页1345"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_new_password
  type: constraint
  statement: "新密码不能与当前密码相同，默认不少于8字符，不能与用户名及用户名倒序相同；至少包含大写字母、小写字母、数字和非字母数字字符四类中的三类，非字母数字限定为~!@#$%^&*()-_=+\\|[{}];:,<.>/?等，包含范围外字符会报错；密码需单引号或双引号声明。"
  source_anchor: "1.13.7.44 new_password 页1345"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_account_lock
  type: syntax
  statement: "ACCOUNT LOCK锁定账户并禁止通过密码认证登录；ACCOUNT UNLOCK解锁账户并允许登录数据库。"
  source_anchor: "1.13.7.44 ACCOUNT 页1345"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_pguser
  type: constraint
  statement: "当前版本不允许修改用户的PGUSER属性。"
  source_anchor: "1.13.7.44 PGUSER 页1345"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_other_params
  type: constraint
  statement: "ALTER USER其他参数参见ALTER ROLE和CREATE ROLE章节的参数说明。"
  source_anchor: "1.13.7.44 其他参数 页1345"
  source_refs: *refalt
  status: confirmed
- id: altuser_wave8_51_in_database_example
  type: syntax
  statement: "可使用ALTER USER jim IN DATABASE testdb1 SET configuration_parameter = DEFAULT设置角色配置参数，并使用IN DATABASE testdb1 RESET configuration_parameter重置。"
  source_anchor: "1.13.7.44 示例 页1345-1346"
  source_refs: *refalt
  status: confirmed
- id: dropuser_wave8_51_purpose_schema
  type: constraint
  statement: "DROP USER删除指定用户；执行DROP USER需要具备创建用户的权限，删除成功后同名Schema也会同时删除。"
  source_anchor: "1.13.10.47 注意事项 页1701"
  source_refs: &refdrop
  - w8_51_1_13_10_47
  status: confirmed
- id: dropuser_wave8_51_locked_cascade
  type: constraint
  statement: "显式指定CASCADE级联删除依赖用户的对象（除数据库外）时，若级联对象处于锁定状态，则无法删除，直到对象解锁或锁定线程终止。"
  source_anchor: "1.13.10.47 注意事项 页1701"
  source_refs: *refdrop
  status: confirmed
- id: dropuser_wave8_51_cross_database
  type: constraint
  statement: "若依赖用户的对象在其他数据库中或依赖对象是其他数据库，不支持DROP USER跨数据库级联删除；需先手动删除依赖对象或依赖数据库。"
  source_anchor: "1.13.10.47 注意事项 页1701"
  source_refs: *refdrop
  status: confirmed
- id: dropuser_wave8_51_cross_database_schema
  type: constraint
  statement: "跨数据库删除用户前，需先删除该用户所在数据库中由该用户创建的同名Schema。"
  source_anchor: "1.13.10.47 注意事项 页1701"
  source_refs: *refdrop
  status: confirmed
- id: dropuser_wave8_51_preconditions
  type: constraint
  statement: "删除用户前，需先删除用户拥有的所有对象并收回其在其他对象上的权限，或通过CASCADE级联删除用户拥有的对象和被授予的权限。"
  source_anchor: "1.13.10.47 注意事项 页1701"
  source_refs: *refdrop
  status: confirmed
- id: dropuser_wave8_51_syntax_semantics
  type: syntax
  statement: "DROP USER [IF EXISTS] user_name[, ...] [CASCADE|RESTRICT]；IF EXISTS在用户不存在时不删除并返回NOTICE；CASCADE删除依赖对象并收回授予用户的权限，RESTRICT在存在依赖对象或权限时拒绝删除，未指定默认RESTRICT。enable_kill_query=on时CASCADE会自动结束锁定线程并删除用户，off时等待锁定线程结束。"
  source_anchor: "1.13.10.47 语法/参数 页1701-1702"
  source_refs: *refdrop
  status: confirmed
open_questions:
- id: user_wave8_51_oq_runtime
  statement: "ALTER/DROP USER在真实权限、会话参数、账户锁定、CASCADE依赖和跨数据库对象组合下的行为与错误矩阵需授权环境实机验证。"
  status: open
