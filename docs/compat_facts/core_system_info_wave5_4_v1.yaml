facts:
- id: sysinfo_wave5_4_txid_snapshot_model
  type: syntax
  statement: "txid_snapshot存储特定时刻事务ID可见性信息；xmin为最早仍活动的事务ID，xmax为尚未分配的事务ID，xip_list为当前快照中活动的txids且不包含子事务；文本格式为xmin:xmax:xip_list。"
  source_anchor: "1.6.26 页586-587"
  source_refs: &id001
  - w5_4_1_6_26
  status: confirmed
- id: sysinfo_wave5_4_pgxc_is_committed
  type: behavior_oracle
  statement: "pgxc_is_committed(transaction_id)检查普通表给定XID/gxid是否提交或忽略；返回Boolean，NULL表示状态未知，例如运行、准备或冻结。"
  source_anchor: "1.6.26 页587"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_pgxc_is_committed_bucketid
  type: behavior_oracle
  statement: "pgxc_is_committed(transaction_id,bucketid)在当前集中式版本不支持hashbucket表，该接口调用报错。"
  source_anchor: "1.6.26 页587"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_txid_current
  type: syntax
  statement: "txid_current()获取当前事务ID，返回bigint。"
  source_anchor: "1.6.26 页587"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_oldestxmin
  type: syntax
  statement: "gs_txid_oldestxmin()获取当前最小事务id值oldestxmin，返回bigint。"
  source_anchor: "1.6.26 页587"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_txid_current_snapshot
  type: syntax
  statement: "txid_current_snapshot()获取当前快照，返回txid_snapshot。"
  source_anchor: "1.6.26 页587"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_txid_snapshot_extractors
  type: syntax
  statement: "txid_snapshot_xip(txid_snapshot)返回快照中正在进行的事务ID；txid_snapshot_xmax返回快照xmax；txid_snapshot_xmin返回快照xmin。"
  source_anchor: "1.6.26 页587"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_txid_visible_in_snapshot
  type: behavior_oracle
  statement: "txid_visible_in_snapshot(bigint,txid_snapshot)判断事务ID在快照中是否可见；判断不使用子事务ID，返回Boolean。"
  source_anchor: "1.6.26 页587"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_local_prepared_xact
  type: syntax
  statement: "get_local_prepared_xact()获取当前节点两阶段残留事务信息，包括事务id、两阶段gid、prepared时间、owner oid、database oid和当前节点node_name。"
  source_anchor: "1.6.26 页587"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_remote_prepared_xacts
  type: syntax
  statement: "get_remote_prepared_xacts()获取所有远程节点两阶段残留事务信息，包括事务id、两阶段gid、prepared时间、owner名称、database名称和node_name。"
  source_anchor: "1.6.26 页587"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_global_clean_prepared_xacts
  type: behavior_oracle
  statement: "global_clean_prepared_xacts(text,text)并发清理两阶段残留事务；当前形态调用均返回false。"
  source_anchor: "1.6.26 页587"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_next_xid_csn
  type: syntax
  statement: "gs_get_next_xid_csn()返回全局所有节点next_xid和next_csn值，输出nodename、next_xid和next_csn。"
  source_anchor: "1.6.26 页588"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_4_control_state
