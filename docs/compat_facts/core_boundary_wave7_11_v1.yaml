facts:
- id: boundary_wave7_11_bit_type
  type: syntax
  statement: "bit(n)要求长度准确匹配；bit varying(n)允许不足补零但超长截断；显式转换时右侧超出n位截断，bit(n)不足n位右侧补零。"
  source_anchor: "1.3.9 页136-137"
  source_refs: &refb1
  - w7_11_1_3_9
  status: confirmed
- id: boundary_wave7_11_uuid_type
  type: syntax
  statement: "UUID类型用于存储通用唯一标识符；1.3.10章节边界页承接1.3.9示例清理后的UUID类型说明。"
  source_anchor: "1.3.10 页137"
  source_refs: &refb2
  - w7_11_1_3_10
  status: confirmed
- id: boundary_wave7_11_rowid_cast
  type: syntax
  statement: "ROWID值可显式转换为BPCHAR、VARCHAR、NVARCHAR2和TEXT；也可将这些类型值显式转换回ROWID。"
  source_anchor: "1.3.25 页179"
  source_refs: &refb3
  - w7_11_1_3_25
  status: confirmed
- id: boundary_wave7_11_charset_collation
  type: constraint
  statement: "字符集定义编码规则，字符序定义排序规则；每个字符集可有一个或多个字符序但仅一个默认字符序，每个字符序仅关联一个字符集；utf8mb4与utf8同义，B模式下binary与SQL_ASCII同义。"
  source_anchor: "1.4 页179"
  source_refs: &refb4
  - w7_11_1_4
  status: confirmed
- id: boundary_wave7_11_constant_macro_overview
  type: environment
  statement: "函数封装业务逻辑并具有返回类型；系统函数允许修改但可能导致系统控制紊乱，正常情况下不允许用户手动修改。"
  source_anchor: "1.5/1.6 页187"
  source_refs: &refb5
  - w7_11_1_5
  status: confirmed
- id: boundary_wave7_11_bpchar_notlike
  type: behavior_oracle
  statement: "A兼容模式下开启behavior_compat_options含enable_bpcharlikebpchar_compare后，启用最新bpcharnotlikebpchar操作符，使BPCHAR对BPCHAR的NOT LIKE结果和执行计划符合预期；未开启时结果集可能非预期。"
  source_anchor: "1.6.3 页247"
  source_refs: &refb6
  - w7_11_1_6_3
  status: confirmed
- id: boundary_wave7_11_system_operations
  type: syntax
  statement: "系统操作包括SET设置变量、EXPLAIN显示执行计划、CHECKPOINT检查点、VACUUM垃圾收集、ANALYZE收集统计信息和SET CONSTRAINTS设置约束检查模式。"
  source_anchor: "1.10 页1146"
  source_refs: &refb7
  - w7_11_1_10
  status: confirmed
- id: boundary_wave7_11_charset_functions
  type: syntax
  statement: "B模式支持多字符集存储、字符序比较以及数据库级/模式级/表级/字段级字符集和字符序；同一服务器、数据库、表、SQL语句中暂不支持混合使用不同字符集和字符序的字符串。"
  source_anchor: "1.4 页180"
  source_refs: &refb8
  - w7_11_1_4
  status: confirmed
- id: boundary_wave7_11_client_server_encoding
  type: constraint
  statement: "客户端字符集client_encoding会向服务端server_encoding转换，查询结果按character_set_results转换；非字符对象转字符类型使用character_set_connection和collation_connection；编码非法时抛出ERROR。"
  source_anchor: "1.4 页180"
  source_refs: *refb8
  status: confirmed
- id: boundary_wave7_11_collation_precedence
  type: behavior_oracle
  statement: "字符序合并遵循优先级规则；相同字符集时优先_bin字符序，其次优先非default字符序；冲突时按场景标记无效或抛异常，无效字符序用于排序抛异常，等值比较则退化为二进制比较。"
  source_anchor: "1.4 页185-186"
  source_refs: *refb8
  status: confirmed
- id: boundary_wave7_11_charset_type_boundary
  type: constraint
  statement: "只有字符串类型（不包括char、name、clob）的对象和表达式字符集可与数据库不同；ARRAY、XML、JSON、TSVECTOR中的文本数据字符集必须与数据库字符集一致；C、POSIX、DEFAULT字符序对应server_encoding。"
  source_anchor: "1.4 页186"
  source_refs: *refb8
  status: confirmed
- id: boundary_wave7_11_shutdown
  type: syntax
  statement: "SHUTDOWN用于关闭当前数据库节点。"
  source_anchor: "1.10 页1147"
  source_refs: &refb9
  - w7_11_1_10
  status: confirmed

