  source_anchor: "3.12.2.26 PRVT_ILM接口清单 页3075-3077"
  source_refs: *refpi
  status: confirmed
- id: prvtilm_wave8_174_helpers
  type: constraint
  statement: "PRVT_ILM帮助函数关系：change_be_ilm为DBE_ILM_ADMIN.ENABLE_ILM()/DISABLE_ILM()帮助函数（影响数据库实例整体ILM后台调度）；get_compression_ratio/get_compression_type/get_actual_compression_ratio/get_hole_ratio/turbo_compress_buffer_stats/get_index_compression_type为DBE_COMPRESSION对应接口帮助函数；get_lastmodified_time为DBE_HEAT_MAP.ROW_HEAT_MAP()帮助函数；get_job_status为DBE_ILM.STOP_ILM帮助函数；create_ilm_db_policy/delete_ilm_db_policy为DBE_ILM_ADMIN对应接口帮助函数；compress_blocks/compress_indexes为PRVT_ILM.ILM_JOB_ACTION()帮助函数。"
  source_anchor: "3.12.2.26 PRVT_ILM接口清单 页3075-3077"
  source_refs: *refpi
  status: confirmed
- id: prvtilm_wave8_174_window_actions
  type: syntax
  statement: "维护窗口相关接口：be_active_ado_window维护窗口触发动作（刷新ilmadowindow触发时间及动作）；be_create_ado_window_for_each_db在实例的每个数据库中创建ilmadowindow；be_execute_ilm为ilmadowindow执行动作进行自动评估；gs_ilm_ticker维护窗口执行动作执行一次打点记录LSN与时间的映射关系；evaluate_obj_policy触发调度后对数据对象进行评估。"
  source_anchor: "3.12.2.26 PRVT_ILM接口清单 页3075-3076"
  source_refs: *refpi
  status: confirmed
- id: prvtilm_wave8_174_state_seq
  type: syntax
  statement: "任务状态与序列接口：flush_task_executestate自动调度任务刷新task状态；query_unfinishedjob_num查询是否存在还没有结束的job（包括初始和运行中的状态）；ilm_seq_nextval获取ILM的下一个sequence值；ilm_seq_setval设置ILM的当前sequence值；ilm_job_action为压缩任务执行体；update_gs_ilm_jobdetail/update_gs_ilm_object操作特性相关系统表。"
  source_anchor: "3.12.2.26 PRVT_ILM接口清单 页3076-3077"
  source_refs: *refpi
  status: confirmed
