facts:
- id: dbexmlparser_wave8_174_overview
  type: constraint
  statement: "DBE_XMLPARSER功能与限制：用于将XML字符串反序列化，将存储XML文档的字符串转换为Document节点；XMLPARSER数据类型用于存储XML数据、存储数量上限为16777215；能根据输入的字符串解析并建立DOMDocument节点，并提供相应SET和GET接口用于解析过程的约束属性；在字符集设置为SQL_ASCII的数据库内使用时传入超出ASCII范围的字符会导致报错；只支持A兼容模式。"
  source_anchor: "3.12.2.25 DBE_XMLPARSER 页3068-3069"
  source_refs: &refxp
  - w8_174_3_12
  status: confirmed
- id: dbexmlparser_wave8_174_catalog
  type: syntax
  statement: "DBE_XMLPARSER接口总账：FREEPARSER（释放PARSER）、GETDOCUMENT（获取解析的Document节点）、GETVALIDATIONMODE（获取validate属性）、NEWPARSER（新建PARSER实例）、PARSEBUFFER（解析VARCHAR字符串）、PARSECLOB（解析CLOB字符串）、SETVALIDATIONMODE（设置validate属性）。"
  source_anchor: "3.12.2.25 DBE_XMLPARSER 表3-511 页3069"
  source_refs: *refxp
  status: confirmed
- id: dbexmlparser_wave8_174_freeparser
  type: syntax
  statement: "FREEPARSER原型：DBE_XMLPARSER.FREEPARSER(p IN parser)；释放给定的PARSER对象；示例newparser后直接freeparser(l_parser)。"
  source_anchor: "3.12.2.25 FREEPARSER 页3069"
  source_refs: *refxp
  status: confirmed
- id: dbexmlparser_wave8_174_getdocument
  type: syntax
  statement: "GETDOCUMENT原型：DBE_XMLPARSER.GETDOCUMENT(p IN parser) RETURN DOMDocument；返回PARSER构建的DOM树文档的根节点（只有解析文档后才能调用）；GETDOCUMENT无传入参数时报错、PARSER传入为空返回null、传入的PARSER还没有解析文档时返回null；示例PARSEBUFFER+GETDOCUMENT+WRITETOBUFFER输出完整XML并freeparser/freedocument清理。"
  source_anchor: "3.12.2.25 GETDOCUMENT 页3069-3070"
  source_refs: *refxp
  status: confirmed
- id: dbexmlparser_wave8_174_getvalidationmode
  type: syntax
  statement: "GETVALIDATIONMODE原型：DBE_XMLPARSER.GETVALIDATIONMODE(p IN parser) RETURN BOOLEAN；获取指定PARSER的解析验证模式（DTD验证开启返回true否则false）；示例newparser后直接GETVALIDATIONMODE输出NOTICE validation（默认开启）。"
  source_anchor: "3.12.2.25 GETVALIDATIONMODE 页3070-3071"
  source_refs: *refxp
  status: confirmed
- id: dbexmlparser_wave8_174_newparser
  type: syntax
  statement: "NEWPARSER原型：DBE_XMLPARSER.NEWPARSER RETURN parser；新建PARSER对象返回一个新的解析器实例。"
  source_anchor: "3.12.2.25 NEWPARSER 页3071"
  source_refs: *refxp
  status: confirmed
- id: dbexmlparser_wave8_174_parsebuffer
  type: syntax
  statement: "PARSEBUFFER原型：DBE_XMLPARSER.PARSEBUFFER(p IN parser, doc IN VARCHAR2)；解析存储在VARCHAR字符串中的XML文档。"
  source_anchor: "3.12.2.25 PARSEBUFFER 页3071-3072"
  source_refs: *refxp
  status: confirmed
- id: dbexmlparser_wave8_174_parseclob
  type: syntax
  statement: "PARSECLOB原型：DBE_XMLPARSER.PARSECLOB(p IN parser, doc IN CLOB)；解析存储在Clob中的XML文档；不支持解析大于等于2GB的clob。"
  source_anchor: "3.12.2.25 PARSECLOB 页3072-3073"
  source_refs: *refxp
  status: confirmed
- id: dbexmlparser_wave8_174_parseclob_a_diff
  type: constraint
  statement: "PARSECLOB与A数据库差异：字符串encoding只支持UTF8；version字段只支持1.0（1.0-1.9解析警告但正常执行、1.9以上报错）；DTD校验差异——!ATTLIST默认值不属于括号中枚举值将报错而A数据库不报错、<!ENTITY>区分字母大小写（Baidu无法与baidu对应报错）；命名空间校验差异——解析未声明的命名空间标签正常执行而A数据库报错；xml预定义实体解析差异——&apos;&quot;会被解析转义为字符而A数据库统一没有转义为字符。"
  source_anchor: "3.12.2.25 PARSECLOB说明 页3073"
  source_refs: *refxp
  status: confirmed
- id: dbexmlparser_wave8_174_setvalidationmode
  type: syntax
  statement: "SETVALIDATIONMODE原型：DBE_XMLPARSER.SETVALIDATIONMODE(p IN parser, yes IN BOOLEAN)；设置给定Parser的解析验证模式（true开启DTD验证、false不开启）；yes传入为空时不改变PARSER的解析验证模式；PARSER初始化默认为开启DTD验证模式。"
  source_anchor: "3.12.2.25 SETVALIDATIONMODE 页3074"
  source_refs: *refxp
  status: confirmed
- id: dbexmlparser_wave8_174_validation_example
  type: behavior_oracle
  statement: "验证模式示例基线：待解析XML与DTD格式不匹配时，setValidationMode(false)可正常解析（NOTICE输出保留DOCTYPE的格式化<table>），setValidationMode(true)解析报错ERROR: invalid XML document。"
  source_anchor: "3.12.2.25 SETVALIDATIONMODE示例 页3074-3075"
  source_refs: *refxp
  status: confirmed
