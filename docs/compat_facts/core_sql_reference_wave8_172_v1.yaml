- id: dbelob_wave8_172_patch_2792
  type: behavior_oracle
  statement: "DBE_LOB页2792补漏（BFILENAME原型与示例收尾）：SELECT DBE_LOB.GET_LENGTH('12345678')返回8；READ('123456789012345', amount=2, buffer=1, myraw)输出0123；blob_Table/blob_Table_bak for update后WRITE、WRITE_APPEND、ERASE(dest,a,1)输出a=1、COPY(copyto, dest, amount, 10, 1)、CLOSE(dest)的多接口示例。"
  source_anchor: "3.12.2.10 DBE_LOB BFILENAME/示例 页2792"
  source_refs: &refx2
  - w8_172_3_12
  status: confirmed
- id: dbexmldom_wave8_172_newdomdocument_protos
  type: syntax
  statement: "NEWDOMDOCUMENT原型（三原型）：NEWDOMDOCUMENT RETURN DOMDOCUMENT（返回新的DOMDOCUMENT对象）、NEWDOMDOCUMENT(xmldoc IN SYS.XMLTYPE) RETURN DOMDOCUMENT（从指定XMLType创建）、NEWDOMDOCUMENT(cl IN CLOB) RETURN DOMDOCUMENT（从指定CLOB创建）。"
  source_anchor: "3.12.2.23 NEWDOMDOCUMENT 页3028"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_newdomdocument_limits
  type: constraint
  statement: "NEWDOMDOCUMENT限制：入参大小需限制在2GB以内；目前暂不支持外部DTD解析；newdomdocument创建的doc默认UTF-8字符集；从同一个xmltype实例中解析出的每一个doc都是独立的，对doc的修改也不会影响到xmltype；与A数据库差异参见DBE_XMLPARSER.PARSECLOB。"
  source_anchor: "3.12.2.23 NEWDOMDOCUMENT说明 页3028"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_newdomdocument_examples
  type: behavior_oracle
  statement: "NEWDOMDOCUMENT示例基线：无参doc经setdoctype('note','sysid','pubid')后WRITETOBUFFER输出<!DOCTYPE note PUBLIC \"pubid\" \"sysid\">；CLOB版解析note后输出格式化XML（含DOCTYPE展开）；XMLType版（含h:命名空间）解析后输出保留命名空间的格式化XML。"
  source_anchor: "3.12.2.23 NEWDOMDOCUMENT示例 页3028-3030"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_setattribute
  type: syntax
  statement: "SETATTRIBUTE原型（双原型）：SETATTRIBUTE(elem IN DOMELEMENT, name IN VARCHAR2, value IN VARCHAR2)与SETATTRIBUTE(elem, name, value, ns IN VARCHAR2)（按名称和命名空间URI设置）；按名称设置DOMELEMENT属性的值；示例基线：setattribute('len','50cm')输出<root len=\"50cm\"/>，命名空间版同样输出，同名再次设置'55cm'后输出<root len=\"55cm\"/>（覆盖语义，命名空间版一致）。"
  source_anchor: "3.12.2.23 SETATTRIBUTE 页3030-3031"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_setcharset
  type: syntax
  statement: "SETCHARSET原型：DBE_XMLDOM.SETCHARSET(doc IN DOMDocument, charset IN VARCHAR2)；设置DOMDOCUMENT的CHARSET字符集；示例setcharset(doc,'utf-8')后WRITETOBUFFER输出含UTF-8声明与格式化DOCTYPE的XML。"
  source_anchor: "3.12.2.23 SETCHARSET 页3032"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_setcharset_charsets
  type: constraint
  statement: "SETCHARSET字符集约束：charset限制为60个字节以内；目前支持的字符集有UTF-8、UCS-4、UCS-2、ISO-8859-1至ISO-8859-9、ISO-2022-JP、Shift_JIS、EUC-JP、ASCII；输入其他字符集会报错或者可能导致输出乱码。"
  source_anchor: "3.12.2.23 SETCHARSET说明 页3032"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_setdoctype
  type: syntax
  statement: "SETDOCTYPE原型：DBE_XMLDOM.SETDOCTYPE(doc IN DOMDocument, name IN VARCHAR2, sysid IN VARCHAR2, pubid IN VARCHAR2)；设置DOMDOCUMENT的外部DTD；示例setdoctype('note','sysid','pubid')输出<!DOCTYPE note PUBLIC \"pubid\" \"sysid\">；setdoctype('n0te',NULL,'')后PUBLIC部分消失，再改'n0t1e'输出<!DOCTYPE n0t1e。"
  source_anchor: "3.12.2.23 SETDOCTYPE 页3033-3034"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_setdoctype_limits
  type: constraint
  statement: "SETDOCTYPE长度限制：name、sysid、pubid的总长度限制在32500个字节以内。"
  source_anchor: "3.12.2.23 SETDOCTYPE说明 页3033"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_setnodevalue
  type: constraint
  statement: "SETNODEVALUE原型：DBE_XMLDOM.SETNODEVALUE(n IN DOMNODE, nodeValue IN VARCHAR2)；向DOMNODE对象中设置节点的值；nodeValue可以输入空字符串和NULL值但不会对节点值进行修改；暂不支持转义字符'&'（字符串中包含该转义字符会清空节点值）；默认最大长度受限于VARCHAR2类型为32767字节超过抛出异常；示例text 'aaa'经SETNODEVALUE('ccc')后GETNODEVALUE输出ccc。"
  source_anchor: "3.12.2.23 SETNODEVALUE 页3034-3035"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_writetobuffer
  type: syntax
  statement: "WRITETOBUFFER原型（双原型）：WRITETOBUFFER(doc IN DOMDOCUMENT, buffer INOUT VARCHAR2)与WRITETOBUFFER(n IN DOMNODE, buffer INOUT VARCHAR2)；使用数据库字符集将XML节点写入指定缓冲区；输出buffer限制在1GB以内；该函数会添加缩进等内容将输出格式化，输出doc将包含XML声明version和encoding。"
  source_anchor: "3.12.2.23 WRITETOBUFFER 页3035-3036"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_writetoclob
  type: syntax
  statement: "WRITETOCLOB原型（双原型）：WRITETOCLOB(doc IN DOMDOCUMENT, cl INOUT CLOB)与WRITETOCLOB(n IN DOMNODE, cl INOUT CLOB)；使用数据库字符集将XML节点写入指定的CLOB；document入参writetoclob支持2GB以内；该函数会添加缩进等内容将输出格式化（输出doc包含XML声明version和encoding），默认以UTF-8字符集输出xml；示例doc版输出含DOCTYPE的格式化XML。"
  source_anchor: "3.12.2.23 WRITETOCLOB 页3036-3037"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_writetofile
  type: syntax
  statement: "WRITETOFILE原型（四原型）：WRITETOFILE(doc IN DOMDOCUMENT, fileName IN VARCHAR2)、(n IN DOMNODE, fileName)、(doc, fileName, charset IN VARCHAR2)、(n, fileName, charset)（文档中函数名亦写作WRITETOCLOB的排版变体）；使用数据库（或指定）字符集将XML节点写入指定文件。"
  source_anchor: "3.12.2.23 WRITETOFILE 页3037-3038"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_writetofile_limits
  type: constraint
  statement: "WRITETOFILE限制：document入参filename长度限制在255个字节以内、charset限制在60个字节以内（支持字符集参考SETCHARSET）；该函数会添加缩进格式化输出（doc含XML声明version和encoding）；传入newdomdocument()无参创建的doc在不指定charset时不会报错默认UTF-8；filename需在pg_directory中创建的路径下，filename中的\\会被转换成/且只允许存在一个/，格式应为pg_directory_name/file_name.xml仅支持xml类型；safe_data_path开启时仅能读写白名单路径；创建目录前需保证路径为操作系统实际存在且用户拥有读写权限（参考CREATE DIRECTORY）。"
  source_anchor: "3.12.2.23 WRITETOFILE说明 页3038"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_writetofile_examples
  type: behavior_oracle
  statement: "WRITETOFILE示例基线：create directory dir as '/tmp'后，使用数据库字符集将ROOT文档写入dir/simplexml.xml；再以NEWDOMDOCUMENT(SRC)+GETDOCUMENTELEMENT+MAKENODE用指定charset 'ASCII'写入同一路径。"
  source_anchor: "3.12.2.23 WRITETOFILE示例 页3038-3039"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_getsessiontreenum
  type: syntax
  statement: "GETSESSIONTREENUM原型：DBE_XMLDOM.GETSESSIONTREENUM() RETURN INTEGER；查询当前session中所有类型的dom树数量；对于使用过FREEELEMENT和FREENODE的dom树该函数依然会将其统计在内；示例创建三个document输出id序列（00000000000000000200000001等）与3（若session之前执行过xmldom接口则结果不确定）。"
  source_anchor: "3.12.2.23 GETSESSIONTREENUM 页3039-3040"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_getdoctreesinfo
  type: syntax
  statement: "GETDOCTREESINFO原型：DBE_XMLDOM.GETDOCTREESINFO() RETURN VARCHAR2；查询当前session中Document类型的dom树信息（如内存占用、节点数量等统计信息）。"
  source_anchor: "3.12.2.23 GETDOCTREESINFO 页3040"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_getdetaildoctreeinfo
  type: syntax
  statement: "GETDETAILDOCTREEINFO原型：DBE_XMLDOM.GETDETAILDOCTREEINFO(id IN RAW(13)) RETURN VARCHAR2；显示特定的document变量的各类型节点数量。"
  source_anchor: "3.12.2.23 GETDETAILDOCTREEINFO 页3041-3043"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_getelementsbytagname
  type: syntax
  statement: "GETELEMENTSBYTAGNAME原型（三原型）：GETELEMENTSBYTAGNAME(doc IN DOMDOCUMENT, tagname IN VARCHAR2)、GETELEMENTSBYTAGNAME(elem IN DOMELEMENT, tagname IN VARCHAR2)、GETELEMENTSBYTAGNAME(elem, tagname, ns IN VARCHAR2)均RETURN DOMNODELIST；返回匹配TAGNAME的DOMNODELIST节点列表；tagname使用通配符*将匹配任何标签、ns使用通配符*将匹配任何命名空间。"
  source_anchor: "3.12.2.23 GETELEMENTSBYTAGNAME 页3043-3044"
  source_refs: *refx2
  status: confirmed
- id: dbexmldom_wave8_172_getelementsbytagname_examples
  type: behavior_oracle
  statement: "GETELEMENTSBYTAGNAME示例基线：doc版'cpu'取ITEM(node_list,2)输出<cpu>Ryzen <cpu>Ryzen 9 5950X_2</cpu></cpu>；elem版item(3)输出<cpu>Ryzen 9 5950X_3<cpu>Ryzen 9 5950X_4</cpu></cpu>；ns版'www.xxxxx.com'取item(0)输出<h:cpu>ns Ryzen 9 5950X_2</h:cpu>。"
  source_anchor: "3.12.2.23 GETELEMENTSBYTAGNAME示例 页3044-3045"
  source_refs: *refx2
  status: confirmed
