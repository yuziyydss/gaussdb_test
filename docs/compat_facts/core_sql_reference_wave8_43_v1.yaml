facts:
- id: altseq_wave8_43_purpose
  type: syntax
  statement: "ALTER SEQUENCE用于修改指定序列的参数。"
  source_anchor: "1.13.7.30 页1262"
  source_refs: &refalt
  - w8_43_1_13_7_30
  status: confirmed
- id: altseq_wave8_43_permissions
  type: constraint
  statement: "序列所有者、被授予序列ALTER权限或ALTER ANY SEQUENCE权限的用户可执行ALTER SEQUENCE；三权分立关闭时系统管理员默认拥有该权限。"
  source_anchor: "1.13.7.30 注意事项 页1262"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_owner_permission
  type: constraint
  statement: "修改序列所有者时，当前用户必须是序列所有者或系统管理员，且该用户是新所有者角色的成员。"
  source_anchor: "1.13.7.30 注意事项 页1262"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_supported_changes
  type: constraint
  statement: "当前版本仅支持修改拥有者、归属列、最大值和cache缓存值；要修改其他参数可删除重建，并使用setval函数恢复当前值。"
  source_anchor: "1.13.7.30 注意事项 页1262"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_maxvalue_transaction_limit
  type: constraint
  statement: "ALTER SEQUENCE MAXVALUE不支持在事务、函数和存储过程中使用。"
  source_anchor: "1.13.7.30 注意事项 页1262"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_maxvalue_cache_clear
  type: constraint
  statement: "修改序列最大值后，会清空该序列在所有会话的缓存值。"
  source_anchor: "1.13.7.30 注意事项 页1262"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_large_marker
  type: constraint
  statement: "如果创建序列时指定了LARGE标识，ALTER操作时也需指定LARGE标识。"
  source_anchor: "1.13.7.30 注意事项 页1262"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_blocking_calls
  type: constraint
  statement: "ALTER SEQUENCE会阻塞nextval、setval、currval和lastval的调用。"
  source_anchor: "1.13.7.30 注意事项 页1262"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_maxvalue_owned_syntax
  type: syntax
  statement: "ALTER [LARGE] SEQUENCE [IF EXISTS] name可修改MAXVALUE maxvalue|NO MAXVALUE|NOMAXVALUE、CACHE cache或OWNED BY table_name.column_name|NONE。"
  source_anchor: "1.13.7.30 语法格式 页1262"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_owner_syntax
  type: syntax
  statement: "ALTER [LARGE] SEQUENCE [IF EXISTS] name OWNER TO new_owner用于修改序列拥有者。"
  source_anchor: "1.13.7.30 语法格式 页1263"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_large_identifier
  type: syntax
  statement: "LARGE是序列标识；如果创建时指定LARGE，ALTER时也需指定。"
  source_anchor: "1.13.7.30 LARGE 页1263"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_if_exists_name
  type: constraint
  statement: "name为要修改的序列名称；IF EXISTS在序列不存在时不显示ERROR，而是返回NOTICE。"
  source_anchor: "1.13.7.30 name/IF EXISTS 页1263"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_maxvalue_range
  type: constraint
  statement: "新修改的最大值必须大于当前last_value；未指定时保持旧最大值。普通序列范围为(last_value, 2^63-1]，LARGE序列范围为(last_value, 2^127-1]。"
  source_anchor: "1.13.7.30 MAXVALUE 页1263"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_cache_range
  type: constraint
  statement: "CACHE表示内存中预先存储的序列号个数；未指定时保持旧缓存值。普通序列取值[1, 2^63-1]，LARGE序列取值[1, 2^127-1]。"
  source_anchor: "1.13.7.30 CACHE 页1263"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_owned_by_semantics
  type: constraint
  statement: "OWNED BY将序列与表字段关联，删除字段或表时自动删除序列；新关联会覆盖旧关联；关联表和序列所有者必须相同且在同一模式；OWNED BY NONE删除已存在关联。"
  source_anchor: "1.13.7.30 OWNED BY 页1263"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_new_owner_permission
  type: constraint
  statement: "修改序列所有者时，执行者必须是新角色的直接或间接成员，并且该角色必须拥有序列所在模式上的CREATE权限。"
  source_anchor: "1.13.7.30 new_owner 页1263"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_owned_example
  type: behavior_oracle
  statement: "示例中CREATE SEQUENCE serial后创建默认值为nextval('serial')的表列，并可用ALTER SEQUENCE serial OWNED BY t1.c1建立归属关系；删除序列时可用CASCADE。"
  source_anchor: "1.13.7.30 示例 页1264"
  source_refs: *refalt
  status: confirmed
- id: altseq_wave8_43_owner_example
  type: behavior_oracle
  statement: "示例中ALTER SEQUENCE seq_test OWNER TO u_test后，\\ds显示序列属主由omm变为u_test。"
  source_anchor: "1.13.7.30 示例 页1264"
  source_refs: *refalt
  status: confirmed
- id: dropseq_wave8_43_purpose_permissions
  type: constraint
  statement: "DROP SEQUENCE从当前数据库删除序列；序列所有者、序列所在模式所有者、被授予序列DROP权限或DROP ANY SEQUENCE权限的用户可执行，三权分立关闭时系统管理员默认拥有该权限。"
  source_anchor: "1.13.10.38 页1689-1690"
  source_refs: &refdrop
  - w8_43_1_13_10_38
  status: confirmed
- id: dropseq_wave8_43_syntax_semantics
  type: syntax
  statement: "DROP [LARGE] SEQUENCE [IF EXISTS] {[schema.]sequence_name}[,...] [CASCADE|RESTRICT]；创建时使用LARGE则删除也需LARGE；IF EXISTS在序列不存在时不删除且返回NOTICE；CASCADE级联删除依赖对象，RESTRICT在有依赖对象时拒绝删除，未指定默认RESTRICT。"
  source_anchor: "1.13.10.38 语法/参数 页1690"
  source_refs: *refdrop
  status: confirmed
open_questions:
- id: seq_wave8_43_oq_runtime
  statement: "ALTER/DROP SEQUENCE在真实并发、缓存、LARGE标识、OWNED BY和依赖对象组合下的阻塞、错误与依赖处理矩阵需授权环境实机验证。"
  status: open
