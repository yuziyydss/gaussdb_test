facts:
- id: guc_track_activities
  type: environment
  statement: track_activities控制是否收集每个会话当前执行命令的统计信息；开启后pg_stat_activity可显示存储过程内perform、调用存储过程、SQL和OPEN CURSOR语句。默认on。
  source_anchor: 7.3.12.1 查询和索引统计收集器 track_activities
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4429）
- id: guc_track_counts
  type: environment
  statement: track_counts控制是否收集数据库活动统计，AutoVacuum选择清理数据库依赖该统计；默认on，关闭会影响存储引擎空间回收。
  source_anchor: 7.3.12.1 查询和索引统计收集器 track_counts
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4429）
- id: guc_track_procedure_sql
  type: environment
  statement: track_procedure_sql控制pg_stat_activity.query列是否同时打印存储过程内正在执行SQL；off时仅打印存储过程调用语句，默认on。
  source_anchor: 7.3.12.1 查询和索引统计收集器 track_procedure_sql
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4430）
- id: guc_track_io_timing
  type: environment
  statement: track_io_timing控制是否收集数据库I/O调用时序统计，结果可在pg_stat_database查询；因重复查询系统时间可能有较大开销，默认off。
  source_anchor: 7.3.12.1 查询和索引统计收集器 track_io_timing
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4430）
- id: guc_track_functions
  type: environment
  statement: track_functions控制函数调用次数和耗时统计：pl只追踪过程语言函数，all追踪SQL语言函数，none关闭；内联SQL函数无法追踪。默认none。
  source_anchor: 7.3.12.1 查询和索引统计收集器 track_functions
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4430-4431）
- id: guc_track_activity_query_size
  type: environment
  statement: track_activity_query_size设置每个活动会话当前命令可跟踪字节数，超出截断；取值100~102400，默认1024Byte。
  source_anchor: 7.3.12.1 查询和索引统计收集器 track_activity_query_size
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4431）
- id: guc_update_process_title
  type: environment
  statement: update_process_title控制是否收集新SQL引发线程名称更新的统计，线程名称可通过ps查看；默认off，INTERNAL固定参数不可修改。
  source_anchor: 7.3.12.1 查询和索引统计收集器 update_process_title
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4431）
- id: guc_stats_temp_directory
  type: environment
  statement: stats_temp_directory设置临时统计数据目录，仅sysadmin可访问，默认pg_stat_tmp；设置为RAM文件系统可减少I/O。
  source_anchor: 7.3.12.1 查询和索引统计收集器 stats_temp_directory
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4432）
- id: guc_track_thread_wait_status_interval
  type: environment
  statement: track_thread_wait_status_interval设置定期收集thread状态信息的时间间隔，取值0~1440min，默认30min。
  source_anchor: 7.3.12.1 查询和索引统计收集器 track_thread_wait_status_interval
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4432）
- id: guc_enable_save_datachanged_timestamp
  type: environment
  statement: enable_save_datachanged_timestamp控制是否收集INSERT/UPDATE/DELETE、exchange/truncate/drop partition对表数据改动时间；默认on。
  source_anchor: 7.3.12.1 查询和索引统计收集器 enable_save_datachanged_timestamp
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4432）
- id: guc_enable_plan_trace
  type: environment
  statement: enable_plan_trace控制plan trace特性，不能用gs_guc全局设置，只能在连接session中SET；默认off。
  source_anchor: 7.3.12.1 查询和索引统计收集器 enable_plan_trace
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4433）
- id: guc_plan_collect_thresh
  type: environment
  statement: plan_collect_thresh控制运行态计划统计收集阈值：-1不收集，0在执行时间达到log_min_duration_statement且算子处理tuple总数达到10000后开始并按增量10000收集，正数按算子增量返回tuple总数阈值收集；默认0。
  source_anchor: 7.3.12.1 查询和索引统计收集器 plan_collect_thresh
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4433）
