facts:
- id: replace_wave8_66_purpose
  type: syntax
  statement: "REPLACE在表中插入或者替换新的数据：当插入的数据与原有数据存在主键或唯一键冲突时，先删除原有数据再插入新数据。REPLACE语句有三种形式：值替换插入（VALUES或VALUE构造一行记录插入）、查询替换插入（SELECT子句结果集构造一行或多行记录插入）、设定指定字段值（与值插入类似，未指定列取默认值）。"
  source_anchor: "1.13.18.8 功能描述 页1789-1790"
  source_refs: &refreplace
  - w8_66_1_13_18_8
  status: confirmed
- id: replace_wave8_66_privileges_conflict
  type: constraint
  statement: "执行REPLACE的用户需要有表的DELETE和INSERT权限；主键/唯一键不冲突时可直接插入，冲突时先删除原有数据再插入新数据。"
  source_anchor: "1.13.18.8 注意事项 页1789"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_return_format
  type: constraint
  statement: "REPLACE操作返回格式为REPLACE 0 X，X表示删除和插入的操作数。"
  source_anchor: "1.13.18.8 注意事项 页1789"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_select_columns
  type: constraint
  statement: "REPLACE...SELECT形式中，select_list列数必须与待插入的字段数保持一致。"
  source_anchor: "1.13.18.8 注意事项 页1789"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_set_selfref
  type: constraint
  statement: "REPLACE...SET语法中：若col_name有默认值，SET col_name = col_name + 1等同于SET col_name = col_name的默认值 + 1；若col_name无默认值且没有NOT NULL约束，等同于col_name = NULL；若col_name无默认值但存在NOT NULL约束，支持有默认值的数据类型包括timestamp、time及带时区变体、interval、tinterval、smalldatetime、date、datea（仅A兼容生效）、uuid、name、point、polygon、circle、lseg、box、json、jsonb、xml、varbit、numeric、cidr、inet、macaddr、各range类型、hash16、hash32、bool、bytea、char、bigint、int、smallint、tinyint、text、raw、blob、clob、float4、float8、abstime、reltime、bpchar、varchar、nvarchar2、money、uint1-uint8、set、enum等（默认值见表1-385）。"
  source_anchor: "1.13.18.8 注意事项 页1789-1790"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_defaults_table
  type: constraint
  statement: "col_name默认值（表1-385）要点：数值类为0（numeric指定小数位则显式小数位如NUMERIC(10,3)为0.000）；text/clob/bpchar/varchar/char/nvarchar2/name/blob/raw/varbit为空字符串；range类为empty；bytea为\\x；money为$0.00；json/jsonb/xml为'null'；macaddr为00:00:00:00:00:00；inet为0.0.0.0；cidr为0.0.0.0/32；point为(0,0)；lseg为[(0,0),(0,0)]；box为(0,0),(0,0)；path为((0,0))；polygon为((0,0))；circle为<(0,0),0>；uuid为全零UUID；hash16/hash32为全零；bool为f；abstime/reltime/interval/tinterval/timestamp/timestamptz/date/time/timetz/smalldatetime对应1970-01-01 00:00:00或00:00:00等。"
  source_anchor: "1.13.18.8 注意事项 表1-385 页1790-1792"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_defaults_mode_notes
  type: constraint
  statement: "默认值补充说明：枚举类型ENUM默认值为第一个元素（没有则返回NULL）；SET数据类型仅B模式支持，默认值为空字符串；A模式下text、clob、blob、raw、bytea、varchar、nvarchar2、bpchar、char、name、byteawithoutorderwithqualcol、byteawithoutordercol类型空串等价于NULL，列有NOT NULL约束时引用列插入会报错；B模式5.7 s1且sql_mode不含strict_trans_tables、only_full_group_by、no_zero_in_date、no_zero_date、error_for_division_by_zero时，timestamp和datetime在NOT NULL约束下默认值为0000-00-00 00:00:00，DATE默认0000-00-00；uint1-uint8仅B模式支持；函数表达式默认值解析时可计算则为常量否则NULL；除以上场景默认值为NULL；datea类型以字面量输入需符合nls_date_format格式，否则可能报错或产生错误数据。"
  source_anchor: "1.13.18.8 注意事项 说明 页1792"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_set_dependency
  type: constraint
  statement: "REPLACE ... SET语法中，后面设置的col_name依赖于前面col_name的值，如果前面没有设置则取默认值；如SET f1 = f1 + 1, f2 = f1场景下，f1等于f1的默认值（假设为0）+1，f2等于f1计算后的值1。"
  source_anchor: "1.13.18.8 注意事项 页1792"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_triggers
  type: constraint
  statement: "REPLACE INTO支持触发行级（ROW）触发器；对于语句级（STATEMENT）触发器，仅支持触发INSERT STATEMENT触发器，不支持触发DELETE STATEMENT触发器；触发器执行顺序由实际执行流程决定：执行INSERT触发BEFORE INSERT、AFTER INSERT触发器；执行DELETE触发BEFORE DELETE、AFTER DELETE触发器。"
  source_anchor: "1.13.18.8 注意事项 页1792"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_unique_constraints
  type: constraint
  statement: "REPLACE不支持延迟生效（DEFERRABLE）的唯一约束或主键；如果表中存在多个唯一约束且插入数据违反多个唯一约束，会删除所有违反约束的数据再插入新数据（可能误删不需要删除的数据，需慎重操作）；如果插入多行且这些行均与表中同一行数据存在唯一约束冲突，则按照执行顺序依次进行REPLACE操作。"
  source_anchor: "1.13.18.8 注意事项 页1792"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_colname_length
  type: constraint
  statement: "SET col_name = col_name + 1中col_name的长度不支持超过1；如SET col_name = table_name.col_name + 1中table_name.col_name长度为2，形如B.A、C.B.A、D.C.B.A的格式都不支持。"
  source_anchor: "1.13.18.8 注意事项 页1792"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_object_limits
  type: constraint
  statement: "REPLACE浮点型比较时需注意浮点型可能存在精度丢失；如果表上创建了行访问控制策略，则不支持REPLACE INTO；不支持外表；不支持密态表；不支持内存表。"
  source_anchor: "1.13.18.8 注意事项 页1792"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_syntax
  type: syntax
  statement: "三种语法：值替换插入REPLACE [INTO] table_name [PARTITION (partition_name[, ...])] [(col_name[, ...])] {VALUES | VALUE} (value[, ...])[, ...]；查询替换插入REPLACE [INTO] table_name [PARTITION (...)] [(col_name[, ...])] query；设置指定字段值REPLACE [INTO] table_name [PARTITION (...)] SET col_name = value[, ...]；其中value格式为{expression | DEFAULT}。"
  source_anchor: "1.13.18.8 语法格式 页1792-1793"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_params
  type: constraint
  statement: "参数规则：table_name取值为已存在的表名；col_name可有子字段名或数组下标修饰，未列出的字段由系统默认值或声明默认值填充（都没有则NULL），省略字段列表默认全部字段且按表声明顺序，VALUE子句和QUERY只提供N个字段时目标字段为前N个字段且值从左到右关联对应列；PARTITION指定分区插入，VALUE子句的值和指定分区不一致会提示异常；expression插入单引号需自转义，类型不正确时自动转换、转换失败报错；DEFAULT为缺省值无则NULL；query为SELECT查询语句，将查询结果作为插入的数据。"
  source_anchor: "1.13.18.8 参数说明 页1793-1794"
  source_refs: *refreplace
  status: confirmed
- id: replace_wave8_66_example
  type: behavior_oracle
  statement: "示例中主键表test初始3行：值替换REPLACE INTO test VALUES(1,11,11)返回REPLACE 0 2且f1=1行更新为(1,11,11)；查询替换REPLACE INTO test SELECT 2,22,22返回REPLACE 0 2；SET形式REPLACE INTO test SET f1 = f1 + 3, f2 = f1 * 10 + 3, f3 = f2返回REPLACE 0 2，f1=3行结果为(3,33,33)（f2依赖f1计算后的值3*10+3）。"
  source_anchor: "1.13.18.8 示例 页1794"
  source_refs: *refreplace
  status: confirmed
- id: reset_wave8_66_purpose
  type: syntax
  statement: "RESET将指定的运行时参数恢复为缺省值，这些缺省值是指gaussdb.conf配置文件中所描述的参数缺省值；RESET命令与SET configuration_parameter TO DEFAULT的作用相同。"
  source_anchor: "1.13.18.9 功能描述 页1794"
  source_refs: &refreset
  - w8_66_1_13_18_9
  status: confirmed
- id: reset_wave8_66_transactional
  type: constraint
  statement: "RESET的事务性行为和SET相同，它的影响将会被事务回滚撤销。"
  source_anchor: "1.13.18.9 注意事项 页1794"
  source_refs: *refreset
  status: confirmed
- id: reset_wave8_66_syntax
  type: syntax
  statement: "语法为RESET {configuration_parameter | CURRENT_SCHEMA | TIME ZONE | TRANSACTION ISOLATION LEVEL | SESSION AUTHORIZATION | ALL}。"
  source_anchor: "1.13.18.9 语法格式 页1794"
  source_refs: *refreset
  status: confirmed
- id: reset_wave8_66_params
  type: constraint
  statement: "参数说明：configuration_parameter为运行时参数名称，可使用SHOW ALL命令查看运行时参数；CURRENT_SCHEMA为当前模式；TIME ZONE为时区；TRANSACTION ISOLATION LEVEL为事务的隔离级别；SESSION AUTHORIZATION为当前会话的用户标识符；ALL表示所有运行时参数。"
  source_anchor: "1.13.18.9 参数说明 页1795"
  source_refs: *refreset
  status: confirmed
- id: reset_wave8_66_example
  type: behavior_oracle
  statement: "示例中SET timezone TO 'Europe/Rome'后RESET timezone将时区恢复为缺省值PRC；该操作等效于SET timezone TO DEFAULT与ALTER SESSION SET timezone to DEFAULT（相关链接SET、SHOW）。"
  source_anchor: "1.13.18.9 示例 页1795"
  source_refs: *refreset
  status: confirmed
open_questions:
- id: replace_wave8_66_oq_runtime
  statement: "REPLACE三种形式在真实主键/唯一约束、触发器、默认值与兼容模式组合以及RESET参数恢复路径下的完整行为与错误矩阵需授权环境实机验证。"
  status: open
