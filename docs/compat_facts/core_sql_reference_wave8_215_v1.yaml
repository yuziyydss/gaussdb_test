facts:
- id: guc_wave8_215_audit_switch
  type: syntax
  statement: "审计开关参数：audit_enabled SIGHUP布尔型默认on传统审计开关（影响性能取决于记录频率/不应高频审计操作执行期间关闭/off不能追溯历史操作）；audit_directory POSTMASTER字符串默认pg_audit（om部署为$GAUSSLOG/pg_audit/实例名称/非法路径或空间满导致无法使用/DN需不同目录）；audit_data_format POSTMASTER字符串默认binary当前仅支持二进制格式；audit_rotation_interval SIGHUP整型1~35791394分钟默认1440（1d）创建新审计日志文件时间间隔（过大单个审计文件过大/不建议调整否则audit_resource_policy可能无法生效）。"
  source_anchor: "7.3.23.1 审计开关 页4679-4681"
  source_refs: &refw8215
  - w8_215_7_3
  status: confirmed
- id: guc_wave8_215_audit_storage
  type: syntax
  statement: "审计存储参数：audit_rotation_size SIGHUP整型1024~1048576kB默认10MB审计日志文件最大容量（单条日志超过此值作为无效日志）；audit_resource_policy SIGHUP布尔型默认on审计日志保存策略——on空间优先（最多audit_space_limit大小）/off时间优先（最少audit_file_remain_time时长）；audit_file_remain_time SIGHUP整型0~730天默认90需记录审计日志最短时间（off时生效/0无时间限制）；audit_space_limit SIGHUP整型1024~1073741824kB默认1GB（1048576kB）审计文件占用磁盘空间总量（on时生效/最小值为audit_thread_num与audit_rotation_size乘积）；audit_file_remain_threshold SIGHUP整型默认10485760审计文件剩余数量最大值；audit_thread_num POSTMASTER整型1~48默认1审计线程数量（audit_dml_state=on高性能场景建议增大）。"
  source_anchor: "7.3.23.1 审计开关 页4681-4684"
  source_refs: *refw8215
  status: confirmed
- id: guc_wave8_215_audit_user_permission
  type: constraint
  statement: "用户和权限审计参数：audit_login_logout SIGHUP整型0~7默认7用户登录注销审计（0关闭/1登录成功/2登录失败/3成功+失败/4注销/5注销+成功/6注销+失败/7全部）；audit_database_process SIGHUP整型0/1默认1数据库启动停止切换恢复审计（DN启动走备升主流程类型为system_switch）；audit_user_locked SIGHUP整型0/1默认1用户锁定解锁审计；audit_user_violation SIGHUP整型0/1默认1用户越权操作审计；audit_grant_revoke SIGHUP整型0/1默认1权限授予回收审计；audit_security_label SIGHUP整型0/1默认0安全标签创建删除应用审计；audit_internal_event SIGHUP布尔型默认off内部工具cm_agent/gs_clean/WDRXdb审计（on导致性能下降）。"
  source_anchor: "7.3.23.2 用户和权限审计 页4684-4687"
  source_refs: *refw8215
  status: confirmed
- id: guc_wave8_215_audit_full_no_client
  type: syntax
  statement: "全量/排除审计参数：full_audit_users SIGHUP字符串默认空全量审计用户列表（逗号分隔/所有可被审计操作记录/用户过多导致性能下降）；no_audit_client SIGHUP字符串默认空不需要审计的客户端名称及IP地址（格式客户端名称@IP/gs_query_audit的client_conninfo字段/支持IPv6/节约审计日志占用空间）。"
  source_anchor: "7.3.23.2 用户和权限审计 页4687"
  source_refs: *refw8215
  status: confirmed
- id: guc_wave8_215_audit_system_object
  type: constraint
  statement: "audit_system_object SIGHUP整型0~1073741823默认67121159数据库对象DDL审计（30个二进制位代表30类对象/第0位DATABASE/第1位SCHEMA/第2位USER/第3位TABLE含TRUNCATE VACUUM ANALYZE/第4位INDEX/第5位VIEW含MATVIEW/第6位TRIGGER/第7位PROCEDURE/FUNCTION/第8位TABLESPACE/第9位RESOURCE POOL/第10位WORKLOAD/第11位SERVER/第14位ROW LEVEL SECURITY/第15位TYPE/第16位TEXT SEARCH/第17位DIRECTORY/第18位SYNONYM/第19位SEQUENCE/第20位CMK CEK/第21位PACKAGE/第22位MODEL/第24位gs_global_config/第25位FOREIGN DATA WRAPPER/第26位SQL PATCH含ENABLE DISABLE/第29位RESOURCE LABEL MASKING POLICY AUDIT POLICY/默认=DATABASE SCHEMA USER SQLPatch四种/主备强制选主建议最大值）。"
  source_anchor: "7.3.23.3 操作审计 表7-48 页4687-4691"
  source_refs: *refw8215
  status: confirmed
- id: guc_wave8_215_audit_dml_function
  type: constraint
  statement: "DML/函数审计参数：audit_dml_state SIGHUP整型0/1默认0所有表INSERT UPDATE DELETE MERGE审计（频繁操作导致性能下降）；audit_dml_state_select SIGHUP整型0/1默认0 SELECT审计；audit_function_exec SIGHUP整型0/1默认0存储过程匿名块自定义函数（不含系统自带）执行审计；audit_system_function_exec SIGHUP整型0/1默认0白名单系统函数执行审计（set_working_grand_version/set_config/pg_cancel_backend/pg_cancel_session/pg_reload_conf/pg_rotate_logfile等/object_name字段为系统函数名不带参数）。"
  source_anchor: "7.3.23.3 操作审计 页4691-4694"
  source_refs: *refw8215
  status: confirmed
- id: guc_wave8_215_audit_copy_set_xid
  type: syntax
  statement: "COPY/SET/XID审计参数：audit_copy_exec SIGHUP整型0/1默认1 COPY操作审计；audit_set_parameter SIGHUP整型0/1默认0 SET操作审计；audit_xid_info SIGHUP整型0/1默认0审计日志detail_info记录SQL语句事务ID（开启时以xid开始如xid=14619,create table/不存在事务ID记录xid=NA）；enableSeparationOfDuty POSTMASTER布尔型默认off三权分立选项（on系统管理员权限受限制）；enable_nonsysadmin_execute_direct POSTMASTER布尔型默认off非系统管理员和非监控管理员执行EXECUTE DIRECT ON语句。"
  source_anchor: "7.3.23.3 操作审计 页4694-4696"
  source_refs: *refw8215
  status: confirmed
