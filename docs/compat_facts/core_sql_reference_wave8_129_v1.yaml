- id: m_security_wave8_129_audit_funcs
  type: syntax
  statement: "M兼容安全函数：pg_delete_audit()删除指定时间段的审计日志（多租场景下non-PDB调用可删除全局指定时间段的审计日志，PDB下调用仅允许删除该PDB相关指定时间段的审计日志，返回值类型void）；pg_query_audit()查看数据库当前节点审计日志（多租场景non-PDB调用返回全部审计日志，PDB下仅返回该PDB相关审计日志，返回值类型record）。"
  source_anchor: "2.5.19 pg_delete_audit/pg_query_audit 页2471"
  source_refs: &refmsec
  - w8_129_2_5_19
  status: confirmed
