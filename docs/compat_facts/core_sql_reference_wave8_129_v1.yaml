- id: m_alt_wave8_129_overview
  type: constraint
  statement: "计划外应用无损透明（ALT，Application Lossless and Transparent）指在集中式部署发生故障切换（failover）时，能够向应用屏蔽可恢复的故障：通过驱动透明地自动切换到新主节点，恢复会话状态，并重新执行被中断的事务，使应用在事务处理上感知不到I/O异常和数据不一致，只是中间会有短暂的停顿（类似于执行了一条慢SQL）；本章介绍计划外应用无损透明对M-Compatibility模式下的函数支持情况。"
  source_anchor: "2.5.21.1 概述 页2474"
  source_refs: &refmalt
  - w8_129_2_5_21
  status: confirmed
