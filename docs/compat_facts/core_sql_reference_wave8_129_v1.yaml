- id: m_other_wave8_129_any_benchmark
  type: constraint
  statement: "M兼容ANY_VALUE(ANY arg)返回每个分组中指定列的第一条数据（返回值任意类型；示例CREATE TABLE t1(c1 INT, c2 INT)插入4行含NULL后SELECT ANY_VALUE(c2) FROM t1 GROUP BY c1返回17，共2组）；BENCHMARK(INT count, expr)重复计算expr表达式count次评估执行效率（正常场景函数返回值始终为0，根据客户端提示的执行时间控制总共消耗的时间；只能测量数字表达式scalar expression的性能，表达式可以为子查询但结果只能是单值，返回值类型INT）。"
  source_anchor: "2.5.18 ANY_VALUE/BENCHMARK 页2463-2464"
