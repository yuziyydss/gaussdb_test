facts:
- id: drop_type_wave8_83_purpose
  type: syntax
  statement: "DROP TYPE删除一个用户定义的数据类型；语法为DROP TYPE [IF EXISTS] name[, ...] [CASCADE | RESTRICT]；name为要删除的类型名，可以使用模式进行具体指定。"
  source_anchor: "1.13.10.46 功能描述/语法格式 页1700"
  source_refs: &refdroptype
  - w8_83_1_13_10_46
  status: confirmed
- id: drop_type_wave8_83_privileges
  type: constraint
  statement: "仅类型的所有者、被授予了类型DROP权限的用户或者被授予了DROP ANY TYPE权限的用户可以执行该操作；当三权分立开关关闭时，系统管理员默认拥有此权限。"
  source_anchor: "1.13.10.46 注意事项 页1700"
  source_refs: *refdroptype
  status: confirmed
- id: drop_type_wave8_83_ifexists_cascade
  type: constraint
  statement: "IF EXISTS在类型不存在时不删除仅产生NOTICE提示；CASCADE级联删除依赖该类型的对象（如字段、函数、操作符等）；RESTRICT（未指定默认）存在依赖对象时拒绝删除该类型。"
  source_anchor: "1.13.10.46 参数说明 页1700"
  source_refs: *refdroptype
  status: confirmed
- id: drop_type_wave8_83_example_ref
  type: constraint
  statement: "示例请参见CREATE TYPE章节的示例（相关链接CREATE TYPE、ALTER TYPE）。"
  source_anchor: "1.13.10.46 示例/相关链接 页1700-1701"
  source_refs: *refdroptype
  status: confirmed
- id: drop_weak_password_dictionary_wave8_83_purpose
  type: syntax
  statement: "DROP WEAK PASSWORD DICTIONARY清空弱口令字典；用户可以通过此语句清空系统表gs_global_config中的全部弱口令；语法为DROP WEAK PASSWORD DICTIONARY（无参数）。"
  source_anchor: "1.13.10.50 功能描述/注意事项/语法格式 页1705"
  source_refs: &refwpd
  - w8_83_1_13_10_50
  status: confirmed
- id: drop_weak_password_dictionary_wave8_83_privileges
  type: constraint
  statement: "仅初始用户、系统管理员和安全管理员可以执行该操作。"
  source_anchor: "1.13.10.50 注意事项 页1705"
  source_refs: *refwpd
  status: confirmed
- id: drop_weak_password_dictionary_wave8_83_example
  type: behavior_oracle
  statement: "示例中CREATE WEAK PASSWORD DICTIONARY WITH VALUES ('********')插入单个弱口令后SELECT * FROM gs_global_config WHERE NAME LIKE 'weak_password'可见记录；DROP WEAK PASSWORD DICTIONARY清空后查询返回0 rows（相关链接CREATE WEAK PASSWORD DICTIONARY）。"
  source_anchor: "1.13.10.50 示例 页1705"
  source_refs: *refwpd
  status: confirmed
- id: call_wave8_83_purpose
  type: syntax
  statement: "使用CALL命令可以调用已定义的函数和存储过程。"
  source_anchor: "1.13.9.1 功能描述 页1364"
  source_refs: &refcall
  - w8_83_1_13_9_1
  status: confirmed
- id: call_wave8_83_privileges
  type: constraint
  statement: "函数或存储过程的所有者、被授予了函数或存储过程EXECUTE权限的用户、或被授予EXECUTE ANY FUNCTION权限的用户可以使用CALL命令；当三权分立开关关闭时，系统管理员默认拥有此权限。"
  source_anchor: "1.13.9.1 注意事项 页1364"
  source_refs: *refcall
  status: confirmed
- id: call_wave8_83_syntax
  type: syntax
  statement: "语法为CALL [schema.|package.] {func_name | procedure_name} (param_expr)；schema/package为函数或存储过程所在的模式/package名称；func_name取值为已存在的函数名称，支持使用DATABASE LINK方式对远端函数或存储过程进行操作；procedure_name可用模式具体指定；创建和系统函数重名的函数时，调用时需要指定函数所在的具体Schema。"
  source_anchor: "1.13.9.1 语法格式/参数说明 页1364"
  source_refs: *refcall
  status: confirmed
- id: call_wave8_83_param_expr
  type: constraint
  statement: "param_expr参数列表可以使用命名标记法传参，即使用:=符号或者=>符号将参数名和参数值隔开，这种方法可以对参数进行任意顺序的排列；若按照直接传入参数值的方式传参，参数值的排列顺序必须和函数或存储过程定义时的相同。"
  source_anchor: "1.13.9.1 参数说明 param_expr 页1364-1365"
  source_refs: *refcall
  status: confirmed
- id: call_wave8_83_inout
  type: constraint
  statement: "参数可以包含入参（IN关键字）和出参（OUT关键字）；使用CALL调用函数或存储过程时，对于非重载的函数，参数列表必须包含出参，出参可以传入一个变量或任一常量；对于重载的package函数，参数列表里可以忽略出参（忽略出参可能导致函数无法匹配），包含出参时出参只能是常量。"
  source_anchor: "1.13.9.1 参数说明 说明 页1365"
  source_refs: *refcall
  status: confirmed
- id: call_wave8_83_example
  type: behavior_oracle
  statement: "示例：CALL func_add_sql(1, 3)按参数值传递；CALL func_add_sql(num1 => 1, num2 => 3)与CALL func_add_sql(num2 := 2, num1 := 3)命名标记法传参；带出参函数func_increment_sql(num1 IN, num2 IN, res OUT)通过CALL func_increment_sql(1,2,1)出参传入常量（相关链接CREATE FUNCTION、CREATE PROCEDURE）。"
  source_anchor: "1.13.9.1 示例 页1365"
  source_refs: *refcall
  status: confirmed
- id: checkpoint_wave8_83_purpose
  type: syntax
  statement: "检查点（CHECKPOINT）为一个事务日志中的点，所有数据文件都在该点被更新以反映日志中的信息并被刷新到磁盘；设置事务日志检查点；预写式日志（WAL）默认每隔一段时间放置一个检查点，可以使用gs_guc命令设置checkpoint_segments、checkpoint_timeout和incremental_checkpoint_timeout调整原子化检查点的间隔。"
  source_anchor: "1.13.9.2 功能描述 页1365"
  source_refs: &refckpt
  - w8_83_1_13_9_2
  status: confirmed
- id: checkpoint_wave8_83_limits
  type: constraint
  statement: "只有系统管理员和运维管理员可以调用CHECKPOINT命令；CHECKPOINT会立即进行检查，而不是等到下一次调度时的检查点；不支持在PDB内执行CHECKPOINT命令。"
  source_anchor: "1.13.9.2 注意事项 页1366"
  source_refs: *refckpt
  status: confirmed
- id: checkpoint_wave8_83_example
  type: behavior_oracle
  statement: "示例中执行CHECKPOINT;设置检查点。"
  source_anchor: "1.13.9.2 示例 页1366"
  source_refs: *refckpt
  status: confirmed
- id: clean_connection_wave8_83_purpose
  type: syntax
  statement: "CLEAN CONNECTION用来清理数据库连接，允许在节点上清理指定数据库的指定用户的相关连接；语法为CLEAN CONNECTION TO {COORDINATOR (nodename[, ...]) | NODE (nodename[, ...]) | ALL [CHECK] [FORCE]} [FOR DATABASE dbname] [TO USER username]。"
  source_anchor: "1.13.9.3 功能描述/语法格式 页1366-1367"
  source_refs: &refclean
  - w8_83_1_13_9_3
  status: confirmed
- id: clean_connection_wave8_83_limits
  type: constraint
  statement: "GaussDB下不支持指定节点，仅支持TO ALL；该功能仅在force模式下，可以清理正在使用的正常连接。"
  source_anchor: "1.13.9.3 注意事项 页1366"
  source_refs: *refclean
  status: confirmed
- id: clean_connection_wave8_83_params
  type: constraint
  statement: "参数：CHECK主要用于DROP DATABASE操作之前的连接访问检查，仅在节点列表为TO ALL时可以指定，存在其他会话连接则报错并停止删除数据库；FORCE使所有与指定dbname和username相关的线程收到SIGTERM信号并强制关闭（仅TO ALL时可指定）；COORDINATOR/NODE/ALL必须指定，当前仅支持指定为TO ALL；dbname不指定则删除所有数据库的连接（取值已存在数据库名）；username不指定则删除所有用户的连接（取值已存在的用户）。"
  source_anchor: "1.13.9.3 参数说明 页1366-1367"
  source_refs: *refclean
  status: confirmed
- id: clean_connection_wave8_83_example
  type: behavior_oracle
  statement: "示例：CLEAN CONNECTION TO ALL FOR DATABASE template1 TO USER jack删除用户jack在template1上的所有连接；CLEAN CONNECTION TO ALL TO USER jack删除jack的所有连接；CLEAN CONNECTION TO ALL FORCE FOR DATABASE test_clean_connection强制删除该库上的所有连接。"
  source_anchor: "1.13.9.3 示例 页1367"
  source_refs: *refclean
  status: confirmed
