facts:
- id: guc_wave8_202_modification_guidelines
  type: constraint
  statement: "GUC参数修改注意事项：内部参数（listen_addresses/port/local_bind_address/文件输出路径）不建议修改否则实例异常；受硬件限制参数（内存/连接数/磁盘空间）需确认硬件规格避免资源不足；参数联动限制（如max_wal_senders须小于max_connections才能启动）；设置不能过于极端（如session_timeout=1秒断开连接/log_min_messages级别过低日志量过大影响性能）。"
  source_anchor: "7.3.1 GUC使用说明 页4141-4142"
  source_refs: &refw8202
  - w8_202_7_3
  status: confirmed
- id: guc_wave8_202_path_and_limits
  type: constraint
  statement: "GUC参数注意事项：字符串取值应遵循操作系统路径和文件名命名规则；取值范围最大值为INT_MAX的参数跟所在操作系统有关；取值范围最大值为DBL_MAX的参数跟所在操作系统有关。"
  source_anchor: "7.3.1 注意事项 页4142"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_affect_mechanisms
  type: constraint
  statement: "GUC参数影响机制：部分GUC参数影响函数/操作符选择/存储过程编译/执行计划生成，从而影响视图/函数参数默认值/存储过程编译产物/计划缓存——视图定义时根据当前GUC状态生成重写规则后续操作不再受GUC影响；函数参数默认值使用函数时创建时记录函数oid到pg_proc后续执行不再受GUC影响；存储过程编译时根据GUC生成编译产物执行时直接使用；SQL执行时根据GUC生成计划缓存后续直接使用。"
  source_anchor: "7.3.1 注意事项 页4142"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_convert_string_to_digit
  type: constraint
  statement: "convert_string_to_digit参数：打开时优先将字符串转为数字，影响视图/函数参数默认值/存储过程编译产物/计划缓存；关闭后视图行为和直接调用函数行为不一致（视图仍使用打开时的重写规则）。"
  source_anchor: "7.3.1 GUC影响表 页4143"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_current_sysdate
  type: constraint
  statement: "behavior_compat_options='current_sysdate'参数：打开时SYSDATE函数获取当前操作系统时间（底层使用current_sysdate函数），关闭时获取当前数据库时间（底层使用sysdate函数）；影响视图/函数参数默认值/存储过程编译产物/计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4143"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_a_format_version
  type: constraint
  statement: "a_format_version='10c'+a_format_dev_version='s1'参数：新增NVL2/部分系统函数/case when返回类型变更/集合类型构造器优先级高于函数/支持CURRENT_DATE/新增部分系统函数/复合类型构造器优先级高于函数等功能；影响视图/函数参数默认值/存储过程编译产物/计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4144"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_fixed_date
  type: constraint
  statement: "fixed_date参数：设置固定时间后SYSDATE返回固定值但计划缓存不会重新生成（EXECUTE p1仍返回旧时间），影响计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4159-4160"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_a_format_func_col_name
  type: constraint
  statement: "a_format_func_col_name参数：A兼容模式下将SELECT user返回的投影列名从current_user改为user；影响计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4159-4160"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_m_format_behavior_compat_options
  type: constraint
  statement: "m_format_behavior_compat_options中的兼容性配置项（enable_escape_string/select_column_name/cast_as_new_json等）：影响M-Compatibility模式部分特性兼容性行为（具体见表7-22）；影响计划缓存——选项变化不会让计划重新生成。"
  source_anchor: "7.3.1 GUC影响表 页4160"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_disable_keyword_options
  type: constraint
  statement: "disable_keyword_options参数：打开参数时指定关键字行为可参考表7-32；影响计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4161"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_backslash_quote
  type: constraint
  statement: "backslash_quote参数：safe_encoding时允许字符串文本中单引号使用\\'表示；off时不允许；影响计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4162"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_m_format_dev_version_s1
  type: constraint
  statement: "m_format_dev_version='s1'参数：禁用SELECT FETCH FIRST ROWS ONLY语法/禁用TRUNCATE CASCADE/RESTRICT语法/禁用CREATE TABLE主键指定USING INDEX TABLESPACE/DROP TABLE VIEW COLUMN CASCADE RESTRICT语义变为忽略/CREATE TABLE REFERENCES列约束语义变为忽略外键定义；影响计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4163"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_m_format_dev_version_s2
  type: constraint
  statement: "m_format_dev_version='s2'参数：影响M-Compatibility模式部分特性兼容性行为（见表m_format_dev_version说明）；创建生成列不指定STORED和VIRTUAL关键字时默认创建虚拟生成列；选项变化后不会让计划重新生成。"
  source_anchor: "7.3.1 GUC影响表 页4164"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_sql_mode_ansi_quotes
  type: constraint
  statement: "sql_mode='ansi_quotes'参数：M-Compatibility模式下标识符同时支持反引号和双引号而关闭时仅支持反引号；影响计划缓存（选项变化不会让计划重新生成）。"
  source_anchor: "7.3.1 GUC影响表 页4164"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_enable_indexonlyscan_or
  type: constraint
  statement: "enable_indexonlyscan_or参数：打开时选择indexonlyscan_or索引扫描方式；影响计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4165"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_charset_collation_connection
  type: constraint
  statement: "character_set_connection和collation_connection参数：设置常量字符串的字符集和字符序；影响计划缓存——参数变化后计划不会重新生成导致PREPARE语句结果与直接查询结果不一致（如collation=utf8mb4_bin时'a'='A'返回t而默认返回f）。"
  source_anchor: "7.3.1 GUC影响表 页4166-4167"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_standard_conforming_strings
  type: constraint
  statement: "standard_conforming_strings参数：on时按SQL标准反斜杠为普通文本且支持u&'\\0061' Unicode转义；off时反斜杠为转义字符且Unicode转义字符串常量报unsafe错误；影响计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4167"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_ignore_like_default_escape
  type: constraint
  statement: "behavior_compat_options='ignore_like_default_escape'参数：standard_conforming_strings=on时开启该选项支持在LIKE模糊匹配中将模式串的反斜杠字符视为普通字符匹配；影响计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4168-4169"
  source_refs: *refw8202
  status: confirmed
- id: guc_wave8_202_enable_set_variables
  type: constraint
  statement: "b_format_behavior_compat_options='enable_set_variables'参数：B兼容模式下支持SET @var:=value语法设置自定义变量且每次执行时计划缓存会删除重建；关闭后SET语法不可用PBE语句已被默认删除；影响计划缓存。"
  source_anchor: "7.3.1 GUC影响表 页4169-4170"
  source_refs: *refw8202
  status: confirmed
