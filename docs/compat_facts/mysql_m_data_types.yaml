facts:
- id: m_dt_precision_integer_only
  type: constraint
  statement: 除特别说明外，数据类型精度、标度、位数大小等默认不支持用浮点型数值定义，建议使用合法整型。
  source_anchor: 4.4.2.1.1
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3292）
- id: m_dt_database_schema_mapping
  type: environment
  statement: MySQL中Database和Schema同义；GaussDB中一个Database下可有多个Schema。M模式中每个MySQL Database映射到GaussDB的一个Schema。
  source_anchor: Database和Schema设计
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3292）
- id: m_dt_index_schema_scope
  type: constraint
  statement: MySQL中INDEX从属于TABLE；GaussDB中INDEX从属于Schema，索引名在Schema内唯一。
  source_anchor: Database和Schema设计
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3292）
- id: m_dt_bool_output_format
  type: behavior_oracle
  statement: GaussDB中SELECT TRUE/FALSE输出t/f；MySQL输出1/0。MySQL的BOOL/BOOLEAN实际映射为TINYINT。
  source_anchor: 4.4.2.1.2 表4-131
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3293）
- id: m_dt_int_union_length
  type: behavior_oracle
  statement: "M 模式中 m_format_behavior_compat_options 包含 enable_precision_decimal，且 CREATE TABLE AS 的 UNION 包含直接整数常量时，GaussDB 按整型最大长度（INT=11、BIGINT=20）推导列长；MySQL 按实际长度。不是任意 UNION 表达式的长度合同。"
  source_anchor: 4.4.2.1.2 表4-131差异说明
  status: confirmed
  verification_method: "2026-09-15 PDF 原文复核（物理页3293,3294）；非数据库验证"
  compatibility_mode: M
  source_physical_pages: [3293, 3294]
  evaluation_phase: "CTAS output-column metadata"
  applicability_conditions:
  - "m_format_behavior_compat_options contains enable_precision_decimal"
  - "direct integer literal participating in UNION inside CREATE TABLE AS"
- id: m_dt_float_extra_digits
  type: environment
  statement: GUC extra_float_digits=0时FLOAT4不带标度值与MySQL5.7一致；其他值可能不一致。
  source_anchor: 4.4.2.1.2 表4-133
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3295）
- id: m_dt_float_driver_no_error
  type: constraint
  statement: 驱动中FLOAT/DOUBLE带精度标度场景，数据输入超过范围时不支持报错。
  source_anchor: 4.4.2.1.2 表4-133
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3295）
- id: m_dt_timestamp_explicit_defaults
  type: environment
  statement: "GaussDB 不提供 explicit_defaults_for_timestamp 设置，文档说明其行为对应 MySQL 设为 on；MySQL 5.7 默认 off、8.0 默认 on。NULL 赋值须结合显式 NULL/NOT NULL 声明及严格模式，不意味着所有 TIMESTAMP 列都接受 NULL。"
  source_anchor: 4.4.2.1.3 表4-134
  status: confirmed
  verification_method: "2026-09-15 PDF 原文复核（物理页3295,3296）；非数据库验证"
  compatibility_mode: M
  source_physical_pages: [3295, 3296]
  evaluation_phase: "TIMESTAMP column defaults and NULL assignment"
  applicability_conditions:
  - "MySQL comparison version and explicit_defaults_for_timestamp setting"
  - "explicit NULL/NOT NULL column declaration"
- id: m_dt_time_negative_zero
  type: behavior_oracle
  statement: "TIME 类型的负零时间（如 -00:00:00）作为结果显示时，GaussDB 不显示负号，MySQL 显示负号；仅涉及输出格式。"
  source_anchor: 4.4.2.1.3 表4-134说明
  status: confirmed
  verification_method: "2026-09-15 PDF 原文复核（物理页3296）；非数据库验证"
  compatibility_mode: M
  source_physical_pages: [3296]
  evaluation_phase: "TIME output formatting"
  applicability_conditions:
  - "negative zero time"
- id: m_dt_precision_truncate
  type: behavior_oracle
  statement: "指定 DATETIME/TIME/TIMESTAMP 类型的声明精度超过支持上限时，GaussDB 将声明精度限制为最大值，MySQL 报错；本条不描述输入值小数秒的舍入或截断。"
  source_anchor: 4.4.2.1.3 说明
  status: confirmed
  verification_method: "2026-09-15 PDF 原文复核（物理页3296）；非数据库验证"
  compatibility_mode: M
  source_physical_pages: [3296]
  evaluation_phase: "datetime type precision declaration"
  applicability_conditions:
  - "DATETIME/TIME/TIMESTAMP precision exceeds the supported maximum"
- id: m_dt_year_display
  type: behavior_oracle
  statement: "YEAR 列的元数据/显示：MySQL 5.7 默认显示 year(4)，GaussDB 与 MySQL 8.0 一致显示 year；不推导其他整数或日期存储行为。"
  source_anchor: 4.4.2.1.3 表4-134
  status: confirmed
  verification_method: "2026-09-15 PDF 原文复核（物理页3296）；非数据库验证"
  compatibility_mode: M
  source_physical_pages: [3296]
  evaluation_phase: "YEAR metadata/display"
  applicability_conditions:
  - "MySQL 5.7 versus 8.0 comparison"
- id: m_dt_binary_fill_char
  type: behavior_oracle
  statement: BINARY插入长度小于目标时GaussDB填充0x20，MySQL填充0x00；导致比较/函数/索引/导入导出差异。
  source_anchor: 4.4.2.1.5 表4-136
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3298）
- id: m_dt_binary_output_hex
  type: behavior_oracle
  statement: BINARY输入二进制或十六进制字符串时GaussDB输出十六进制，MySQL按ASCII转义无法转义输出为空。
  source_anchor: 4.4.2.1.5 表4-136
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3298）
- id: m_dt_bit_output_format
  type: behavior_oracle
  statement: BIT所有输出按二进制字符串形式；MySQL按ASCII转义。MySQL 8.0以上默认开头补0，GaussDB不补。
  source_anchor: 4.4.2.1.5 表4-136
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3298）
