facts:
- id: m_dt_precision_integer_only
  type: constraint
  statement: 除特别说明外，数据类型精度、标度、位数大小等默认不支持用浮点型数值定义，建议使用合法整型。
  source_anchor: 4.4.2.1.1
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3292）
- id: m_dt_database_schema_mapping
  type: environment
  statement: MySQL中Database和Schema同义；GaussDB中一个Database下可有多个Schema。M模式中每个MySQL Database映射到GaussDB的一个Schema。
  source_anchor: Database和Schema设计
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3292）
- id: m_dt_index_schema_scope
  type: constraint
  statement: MySQL中INDEX从属于TABLE；GaussDB中INDEX从属于Schema，索引名在Schema内唯一。
  source_anchor: Database和Schema设计
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3292）
- id: m_dt_bool_output_format
  type: behavior_oracle
  statement: GaussDB中SELECT TRUE/FALSE输出t/f；MySQL输出1/0。MySQL的BOOL/BOOLEAN实际映射为TINYINT。
  source_anchor: 4.4.2.1.2 表4-131
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3293）
- id: m_dt_int_union_length
  type: behavior_oracle
  statement: 精度开关开启时UNION的CREATE TABLE AS场景中，GaussDB取整型最大长度（INT=11,BIGINT=20）计算列长；MySQL按实际长度。
  source_anchor: 4.4.2.1.2 表4-131差异说明
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3293）
- id: m_dt_float_extra_digits
  type: environment
  statement: GUC extra_float_digits=0时FLOAT4不带标度值与MySQL5.7一致；其他值可能不一致。
  source_anchor: 4.4.2.1.2 表4-133
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3295）
- id: m_dt_float_driver_no_error
  type: constraint
  statement: 驱动中FLOAT/DOUBLE带精度标度场景，数据输入超过范围时不支持报错。
  source_anchor: 4.4.2.1.2 表4-133
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3295）
- id: m_dt_timestamp_explicit_defaults
  type: environment
  statement: GaussDB不支持设置explicit_defaults_for_timestamp，行为与MySQL设置为on时相同。MySQL 5.7默认off，8.0默认on。
  source_anchor: 4.4.2.1.3 表4-134
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3295）
- id: m_dt_time_negative_zero
  type: behavior_oracle
  statement: 带负号的零时间数值输出时，GaussDB不显示负号，MySQL显示负号。
  source_anchor: 4.4.2.1.3 表4-134说明
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3296）
- id: m_dt_precision_truncate
  type: behavior_oracle
  statement: DATETIME/TIME/TIMESTAMP精度超过最大支持精度时，GaussDB截断为最大精度，MySQL报错。
  source_anchor: 4.4.2.1.3 说明
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3296）
- id: m_dt_year_display
  type: behavior_oracle
  statement: MySQL 5.7中year列默认显示year(4)；GaussDB与MySQL 8.0一致只显示year。
  source_anchor: 4.4.2.1.3 表4-134
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3296）
- id: m_dt_binary_fill_char
  type: behavior_oracle
  statement: BINARY插入长度小于目标时GaussDB填充0x20，MySQL填充0x00；导致比较/函数/索引/导入导出差异。
  source_anchor: 4.4.2.1.5 表4-136
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3298）
- id: m_dt_binary_output_hex
  type: behavior_oracle
  statement: BINARY输入二进制或十六进制字符串时GaussDB输出十六进制，MySQL按ASCII转义无法转义输出为空。
  source_anchor: 4.4.2.1.5 表4-136
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3298）
- id: m_dt_bit_output_format
  type: behavior_oracle
  statement: BIT所有输出按二进制字符串形式；MySQL按ASCII转义。MySQL 8.0以上默认开头补0，GaussDB不补。
  source_anchor: 4.4.2.1.5 表4-136
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3298）
