- id: dbesql_wave8_162_get_results_tableof
  type: constraint
  statement: "GET_RESULTS原型（五重载）：DBE_SQL.GET_RESULTS(context_id IN int, pos IN int, column_value INOUT anyarray)与column_value为dbe_sql.varchar2_table/number_table/date_table/blob_table的四个重载；返回指定游标在给定位置的数组类型的值；不支持用户自定义的table类型，请使用数据类型介绍中提供的table类型。"
  source_anchor: "3.12.2.19 GET_RESULTS 页2890-2891"
  source_refs: &refd3
  - w8_162_3_12
  status: confirmed
- id: dbesql_wave8_162_get_results_null_fill
  type: constraint
  statement: "GET_RESULTS数组填充行为：由于底层机制是通过数组实现的，当使用不同的数组获取同一列的返回值时，内部索引的不连续性会导致数组中填充NULL值以确保数组索引的连续性，这将导致返回结果数组的长度和A数据库中的不一致。"
  source_anchor: "3.12.2.19 GET_RESULTS说明 页2890"
  source_refs: *refd3
  status: confirmed
