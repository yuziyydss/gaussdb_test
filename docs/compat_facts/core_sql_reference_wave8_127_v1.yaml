facts:
- id: m_wf_wave8_127_overview
  type: syntax
  statement: "M兼容窗口函数必须通过over_clause指定OVER子句以确定如何将查询行划分为多个组；须知：窗口函数在未开启精度传递参数时其结果的精度可能会存在问题，请在开启精度GUC参数（m_format_behavior_compat_options值包含'enable_precision_decimal'）后使用；over_clause语法形式为{ OVER (window_spec) | OVER existing_window_name }，window_spec为[ existing_window_name ] [ partition_clause ] [ order_clause ] [ frame_clause ]；partition_clause为PARTITION BY expr [, ...]；order_clause为ORDER BY expr [ ASC | DESC ] [ NULLS { FIRST | LAST } ] [, ...]（NULLS FIRST指定空值排在非空值之前为DESC排序时的默认行为，NULLS LAST指定空值排在非空值之后为未指定DESC排序时的默认行为）。"
  source_anchor: "2.5.13 概述/over_clause 页2433"
  source_refs: &refmwf
  - w8_127_2_5_13
  status: confirmed
- id: m_wf_wave8_127_frame_clause
  type: syntax
  statement: "M兼容frame_clause为窗口函数定义一个窗口框架window frame（window frame为当前查询行的一组相关行）；frame_clause形式为[ RANGE | ROWS ] frame_start或[ RANGE | ROWS ] BETWEEN frame_start AND frame_end，frame_start和frame_end形式为{ UNBOUNDED PRECEDING | expr PRECEDING | CURRENT ROW | expr FOLLOWING | UNBOUNDED FOLLOWING }。"
  source_anchor: "2.5.13 frame_clause 页2433-2434"
  source_refs: *refmwf
  status: confirmed
- id: m_wf_wave8_127_delta
  type: syntax
  statement: "M兼容DELTA(numeric) over_clause返回当前行和前一行的差值（参数numeric如表2-54，返回值类型numeric）；须知：delta是一个窗口函数需与over窗口函数共同使用且over中rows语句不会改变delta函数结果（delta(value) over(order by time rows 1 preceding)和delta(value) over(order by time rows 3 preceding)返回结果一致）；delta()内只支持可以进行计算的数值类型不支持字符串类型；delta窗口函数over()中应该固定为rows 1 preceding（指定与前一行的差值）——如果over()中使用order by子句则计算排序后每行与第一行的数据，使用partition by子句则计算每个分组最后行与第一行的数据。"
  source_anchor: "2.5.13 DELTA 页2434-2435"
  source_refs: *refmwf
  status: confirmed
- id: m_wf_wave8_127_dense_rank
  type: syntax
  statement: "M兼容DENSE_RANK() over_clause在一次查询中按照over_clause指定的行顺序为不同分组的每一行分配一个序号（返回值类型BIGINT UNSIGNED）；M兼容差异：当GUC参数m_format_dev_version取值为's2'或以上且m_format_behavior_compat_options取值包含'enable_conflict_funcs'时，DENSE_RANK函数的实现行为与本章描述一致（M行为）；其他场景下DENSE_RANK函数的行为参见DENSE_RANK()函数（A模式行为）。"
  source_anchor: "2.5.13 DENSE_RANK 页2434-2435"
  source_refs: *refmwf
  status: confirmed
- id: m_wf_wave8_127_first_last_value
  type: syntax
  statement: "M兼容FIRST_VALUE(expr) [null_treatment] over_clause在一次查询中按照over_clause指定的行顺序返回当前分组内第一行数据中expr对应的值；LAST_VALUE(expr) [null_treatment] over_clause返回当前分组内最后一行数据中expr对应的值（两者expr为任意类型，null_treatment取值范围为RESPECT NULLS，返回值类型任意类型与expr的类型有关）；示例SELECT id, name, math, class, FIRST_VALUE(name) OVER (PARTITION BY class ORDER BY math ...)与LAST_VALUE(name) OVER (...)。"
  source_anchor: "2.5.13 FIRST_VALUE/LAST_VALUE 页2435-2437"
  source_refs: *refmwf
  status: confirmed
- id: m_wf_wave8_127_lag_lead
  type: syntax
  statement: "M兼容LAG(expr[, N[, default]]) [null_treatment] over_clause获取当前行之前N行数据中expr对应的值（不存在相应的行则返回值为default）；LEAD(expr[, N[, default]]) [null_treatment] over_clause获取当前行之后N行数据中expr对应的值（不存在相应的行返回值为default，返回值类型与default和expr有关）；示例LEAD(name) OVER()、LEAD(name, 2) OVER()、LEAD(name, 2, 'N/A') OVER()、LEAD(name, 2, 'N/A') OVER(ORDER BY id)、LEAD(name, 1, 'NA') OVER(PARTITION BY age)。"
  source_anchor: "2.5.13 LAG/LEAD 页2435-2438"
  source_refs: *refmwf
  status: confirmed
- id: m_wf_wave8_127_ntile_rank
  type: syntax
  statement: "M兼容NTILE(n) over_clause将分组数据均分n份并编号；PERCENT_RANK() over_clause百分比排名；RANK() over_clause排名。"
  source_anchor: "2.5.13 NTILE/PERCENT_RANK/RANK 页2439-2440"
  source_refs: *refmwf
  status: confirmed
- id: m_wf_wave8_127_row_number
  type: syntax
  statement: "M兼容ROW_NUMBER() over_clause按照over_clause指定的行顺序为每一行分配一个编号（返回值类型BIGINT UNSIGNED）；M兼容差异：此函数在参数m_format_dev_version值为's2'或以上版本且参数m_format_behavior_compat_options值包含'enable_conflict_funcs'的情况下为M-Compatibility模式数据库实现行为（即本章描述的行为），其他行为和ROW_NUMBER()函数保持一致；示例CREATE TABLE employee后SELECT id, name, ROW_NUMBER() OVER() FROM employee。"
  source_anchor: "2.5.13 ROW_NUMBER 页2441-2442"
  source_refs: *refmwf
  status: confirmed
- id: m_aes_wave8_127_syntax
  type: syntax
  statement: "M兼容AES_DECRYPT(crypt_str, key_str[, init_vector][, kdf_name][, salt][, info | iterations])基于AES算法使用解密口令key_str、初始化向量init_vector和KDF相关选项对加密后的字符串crypt_str进行解密（返回值类型统一为LONGBLOB）；参数：crypt_str为需要被解密的字符串（NULL返回NULL）；key_str为解密口令（NULL返回NULL，对于128bit/192bit/256bit的密钥长度建议使用安全随机数作为密钥字符串）；init_vector为需要它的块加密模式提供初始化变量（长度大于等于16字节，大于16字节部分自动忽略；str和key_str均不为NULL时该参数不可为NULL否则报错；建议OFB模式保证每次加密IV值唯一性、CBC和CFB模式保证IV值不可被预测）；kdf_name指定KDF算法（取值为PBKDF2或HKDF）；salt用来与原密码组合生成密钥；info/iterations对HKDF为info参数、对PBKDF2为迭代次数。"
  source_anchor: "2.5.14 AES_DECRYPT 页2442-2443"
  source_refs: &refmaes
  - w8_127_2_5_14
  status: confirmed
- id: m_aes_wave8_127_security
  type: constraint
  statement: "M兼容AES加解密安全须知：由于该函数执行过程需要传入解密口令，为安全起见gsql工具不会将包含该函数名字样的SQL记录入执行历史（无法通过上下翻页找到该函数执行历史）；在存储过程相关操作中需尽量避免调用该函数避免敏感参数信息在日志中泄露（建议将参数信息过滤后再提供给外部维护人员定位，日志使用完后及时删除）；打开debug_print_plan开关的情况下需尽量避免调用该函数；若想成功解密需要保证block_encryption_mode、key_str、iv值与加密时一致；由于编码差异不支持从gsql客户端直接复制加密后的数据进行解密（解密出的结果不一定是加密前的字符串）；SQL_ASCII字符集下该函数调用openssl三方库返回的数据编码为非ASCII数据（服务端字符集为SQL_ASCII时客户端编码也需设置为SQL_ASCII）。"
  source_anchor: "2.5.14 AES_DECRYPT 说明 页2443-2444"
  source_refs: *refmaes
  status: confirmed
- id: m_aes_wave8_127_example
  type: behavior_oracle
  statement: "加解密往返示例（m_db）：SELECT AES_DECRYPT(AES_ENCRYPT('huwei123','123456vfhex4dyu','vdaladhjsadadabcdef','hkdf'),'123456vfhex4dyu','vdaladhjsadadabcdef','hkdf')返回huwei123（使用hkdf KDF算法）。"
  source_anchor: "2.5.14 AES_DECRYPT 示例 页2443"
  source_refs: *refmaes
  status: confirmed
- id: m_flow_if_wave8_127_syntax
  type: syntax
  statement: "M兼容流程控制函数IF(expr1, expr2, expr3)：如果expr1为TRUE（即expr1不等于0且expr1不为NULL）IF()返回expr2，否则返回expr3；示例SELECT IF(true, 'ab', 1)返回ab、SELECT IF(1>2, 1, NULL)返回空、SELECT IF(NULL, 'TRUE', 'FALSE')返回FALSE。"
  source_anchor: "2.5.15 IF 页2444-2445"
  source_refs: &refmflow
  - w8_127_2_5_15
  status: confirmed
- id: m_flow_ifnull_wave8_127_syntax
  type: syntax
  statement: "M兼容IFNULL(expr1, expr2)：如果expr1不为null，IFNULL()返回expr1；如果expr1为null，IFNULL()返回expr2；示例SELECT ifnull(12, 123)返回12、SELECT ifnull(null, 123)返回123。"
  source_anchor: "2.5.15 IFNULL 页2445"
  source_refs: *refmflow
  status: confirmed
- id: m_flow_nullif_wave8_127_syntax
  type: syntax
  statement: "M兼容NULLIF(expr1, expr2)：如果expr1等于expr2返回空值，否则返回expr1；示例SELECT nullif(123, 123)返回空、SELECT nullif(12, 123)返回12。"
  source_anchor: "2.5.15 NULLIF 页2445"
  source_refs: *refmflow
  status: confirmed
- id: m_autonomous_wave8_127_overview
  type: constraint
  statement: "M-Compatibility模式数据库不支持自治事务特性；自治事务特性函数：gs_autonomous_transaction_detail()查看当前用户所属的自治事务会话及其父子事务关系（具备MONADMIN权限或SYSADMIN权限的用户可以查看所有自治事务会话及其父子事务关系；无参数；返回值类型setof record；返回字段包括autonomous_transaction_session_id、autonomous_transaction_thread_id、parent_autonomous_transaction_session_id均为bigint）；gs_get_autonomous_transaction_count()查询当前自治事务计数（无参数，返回值类型integer）。"
  source_anchor: "2.5.16 说明/函数 页2446-2447"
  source_refs: &refmauto
  - w8_127_2_5_16
  status: confirmed
- id: m_autonomous_wave8_127_example
  type: behavior_oracle
  statement: "自治事务示例（gaussdb）：SELECT * FROM pg_catalog.gs_autonomous_transaction_detail() AS (autonomous_transaction_session_id bigint, autonomous_transaction_thread_id bigint, parent_autonomous_transaction_session_id bigint)返回0行。"
  source_anchor: "2.5.16 示例 页2447"
  source_refs: *refmauto
  status: confirmed
- id: m_wf_wave8_127_employee_example
  type: behavior_oracle
  statement: "窗口函数示例基线（m_db）：CREATE TABLE employee (id INT PRIMARY KEY, name VARCHAR(20) NOT NULL, age INT)插入5行（2/Bob/36、3/John/25、5/Mary/25、4/Michael/36、1/Tom/25）后SELECT id, name, ROW_NUMBER() OVER() FROM employee为每行分配编号。"
  source_anchor: "2.5.13 ROW_NUMBER 示例 页2442"
  source_refs: *refmwf
  status: confirmed
- id: m_aes_wave8_127_decrypt_notes
  type: constraint
  statement: "M兼容AES_DECRYPT解密一致性要求：若想成功解密需要保证block_encryption_mode、key_str、iv值与加密时一致；由于编码差异不支持从gsql客户端直接复制加密后的数据进行解密（解密出的结果不一定是加密前的字符串）。"
  source_anchor: "2.5.14 说明 页2443-2444"
  source_refs: *refmaes
  status: confirmed
- id: m_wf_wave8_127_ntile_percent_examples
  type: behavior_oracle
  statement: "窗口函数示例基线补充（m_db）：NTILE(n) over_clause将分组均分为n份并编号；PERCENT_RANK() over_clause返回百分比排名；RANK() over_clause返回排名（含并列跳号）。"
  source_anchor: "2.5.13 NTILE/PERCENT_RANK/RANK 页2439-2441"
  source_refs: *refmwf
  status: confirmed
- id: m_aes_wave8_127_encrypt_note
  type: constraint
  statement: "M兼容AES_ENCRYPT/AES_DECRYPT配套：AES_DECRYPT示例中AES_ENCRYPT('huwei123','123456vfhex4dyu','vdaladhjsadadabcdef','hkdf')使用加密口令、初始化向量与kdf_name='hkdf'进行加密；解密时需传入相同的key_str、init_vector、kdf_name参数才能成功还原明文huwei123。"
  source_anchor: "2.5.14 示例 页2443"
  source_refs: *refmaes
  status: confirmed
- id: m_flow_wave8_127_examples_note
  type: behavior_oracle
  statement: "M兼容流程控制函数示例基线补充：IF的返回列名显示为case；IFNULL的返回列名显示为ifnull；NULLIF的返回列名显示为nullif；三种函数的返回值类型均由expr2/expr1/expr2的表达式类型决定。"
  source_anchor: "2.5.15 示例 页2444-2445"
  source_refs: *refmflow
  status: confirmed
open_questions:
- id: m_wf_aes_wave8_127_oq_runtime
  statement: "M兼容DENSE_RANK/ROW_NUMBER在enable_conflict_funcs开启前后的行为差异矩阵、DELTA固定rows 1 preceding的边界用例、AES加解密在SQL_ASCII字符集下的编码一致性需授权环境实机验证。"
  status: open
