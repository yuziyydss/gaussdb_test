facts:
- id: cm_wave8_186_overview
  type: constraint
  statement: "CM参数概述：CM相关参数的修改对GaussDB的运行机制有影响，建议由GaussDB的工程师协助修改；cm_agent相关参数通过cm_agent数据目录下的cm_agent.conf文件查看，cm_server相关参数通过cm_server数据目录下的cm_server.conf文件查看；参数修改需要参考对应设置方式进行设置。"
  source_anchor: "7.4 CM参数说明 页4838"
  source_refs: &refcm
  - w8_186_7_4
  status: confirmed
- id: cm_wave8_186_agent_log_params
  type: syntax
  statement: "cm_agent日志参数：log_dir（日志目录，默认$GAUSSLOG/cm/cm_agent）；log_file_size（日志文件大小，整型MB，0~2047，默认16）；log_min_messages（消息级别枚举，debug5/debug1/log/warning/error/fatal，默认warning）；log_threshold_check_interval（日志压缩和清除间隔，整型秒，0~2147483647，默认1800）；log_max_size（日志最大存储容量，整型MB，默认10240）；log_max_count（最大日志数量，整型个，默认10000）。"
  source_anchor: "7.4.1 cm_agent日志参数 页4838-4840"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_agent_alarm
  type: syntax
  statement: "cm_agent alarm_component参数：设置用于处理告警内容的告警组件位置；gs_preinstall --alarm-type=5表示未对接第三方组件（告警写入system_alarm日志，取值/opt/huawei/snas/bin/snas_cm_cmd）；--alarm-type=1表示对接第三方组件（取值为第三方组件可执行程序绝对路径）。"
  source_anchor: "7.4.1 alarm_component 页4840"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_agent_switch_params
  type: syntax
  statement: "cm_agent切换相关参数：switch_heartbeat_timeout（切换心跳超时时间）；switch_election_timeout（选举超时时间）；switch_upgrade_timeout（升级超时时间）等控制主备切换行为的参数，修改后需要重启数据库才能生效。"
  source_anchor: "7.4.1 cm_agent切换参数 页4840-4845"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_agent_dn_params
  type: syntax
  statement: "cm_agent DN相关参数：增量重建备DN开关（on增量重建/off全量重建，默认on）；自动降副本延迟时间（检测到副本状态异常后延迟触发降副本，默认12秒，设置过小可能误降副本、过大时集群长时间不可用）；升副本延迟时间（副本恢复后延迟触发自动升副本，默认60秒，设置过小导致资源震荡、过大时升副本时间变长）。"
  source_anchor: "7.4.1 DN相关参数 页4844-4845"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_server_log_params
  type: syntax
  statement: "cm_server日志参数：log_dir（默认$GAUSSLOG/cm/cm_server）/log_file_size（默认16MB）/log_min_messages（默认warning）/log_threshold_check_interval等与cm_agent日志参数结构一致但作用于cm_server组件。"
  source_anchor: "7.4.2 cm_server日志参数 页4860"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_server_thread_params
  type: syntax
  statement: "cm_server线程参数：thread_count（agent线程池，格式'worker_thread_count,io_ratio'，worker 2~1000、io_ratio 1~100，默认'(1000,1)'）；thread_effective_time（线程运行一轮有效超时时间，0~1200秒，0关闭监控，默认20秒，超时线程自动退出）；ctl_thread_count（ctl线程池，格式同上，默认'(0,1)'，worker=0时等于节点数）。"
  source_anchor: "7.4.2 线程参数 页4861-4862"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_server_alarm_params
  type: syntax
  statement: "cm_server告警参数：alarm_component（告警组件位置，默认/opt/huawei/snas/bin/snas_cm_cmd）；alarm_report_interval（告警上报时间间隔，整型秒，默认3）；alarm_report_max_count（告警上报最大次数）。"
  source_anchor: "7.4.2 告警参数 页4862-4863"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_server_sync_params
  type: syntax
  statement: "cm_server同步参数：sync_config_timeout/instance_keep_alive_timeout等控制cm_server与cn/dn实例间的配置同步和存活检测行为。"
  source_anchor: "7.4.2 同步参数 页4863-4870"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_server_upgrade_params
  type: syntax
  statement: "cm_server升级相关参数：upgrade_from/phase等控制CM升级过程的参数，包括升级阶段控制、灰度升级等。"
  source_anchor: "7.4.2 升级参数 页4870-4880"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_hadr_params
  type: syntax
  statement: "容灾参数：dr_dest_name（目标数据库实例ID同步，单节点形态有效，内部参数不建议修改）；hadr_replconninfo_config_mode（容灾类型，local_file/cluster_manager，默认local_file）；cms_enable_double_dorado_arbitrate（双dorado DN仲裁开关，0关闭1开启，仅支持Quorum模式，默认1）。"
  source_anchor: "7.4.2 容灾参数 页4885-4886"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_param_modification
  type: constraint
  statement: "CM参数修改方式：方式一为直接修改配置文件后重启；方式二为通过cm_ctl工具在线修改部分参数；修改CM相关参数建议由GaussDB工程师协助，充分理解参数含义并经过测试验证后进行修改。"
  source_anchor: "7.4 CM参数说明 页4838"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_param_risk_pattern
  type: constraint
  statement: "CM参数风险模式：所有参数均包含'设置不当的风险与影响'描述，说明不当设置可能导致——故障检测和恢复不及时/CPU负载变高/硬盘空间占用过多/调试信息丢失/告警上报不及时/故障检测不准确等风险。"
  source_anchor: "7.4 各参数设置不当的风险与影响 页4838-4886"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_param_reload
  type: constraint
  statement: "CM参数生效方式：部分参数修改后需要重启数据库才能生效（如log_dir/thread_count等），部分参数修改后不需要reload加载参数（如dr_dest_name），部分参数通过cm_ctl工具在线修改后立即生效。"
  source_anchor: "7.4 各参数设置方式 页4838-4886"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_agent_network_params
  type: syntax
  statement: "cm_agent网络/连接参数：agent_heartbeat_timeout（agent心跳超时）/agent_connect_timeout（agent连接超时）/agent_connect_retries（连接重试次数）/agent_conn_db_timeout（连接数据库超时）/agent_conn_db_phony_dead_timeout（连接数据库伪死超时）/agent_status_check_connection_type（状态检查连接类型）/enable_check_az_network（AZ网络检查开关）/check_az_network_concurrency（AZ网络检查并发度）等控制cm_agent与集群间通信可靠性的参数。"
  source_anchor: "7.4.1 网络参数 页4842-4847"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_agent_resource_monitor
  type: syntax
  statement: "cm_agent资源监控参数：high_cpu_threshold/high_mem_threshold/high_disk_threshold（CPU/内存/磁盘高负载阈值）/disk_check_hung_timeout（磁盘检查挂起超时）/disk_check_interval（磁盘检查间隔）/disk_check_io_size（磁盘检查IO大小）/enable_tblspc_disk_check（表空间磁盘检查开关）/process_unhealthy_alarm_time（进程不健康告警时间）等用于监控集群资源使用状态。"
  source_anchor: "7.4.1 资源监控参数 页4847-4852"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_agent_log_async
  type: syntax
  statement: "cm_agent异步日志参数：asyn_log_enable（异步日志开关）/asyn_log_max_buf_size（异步日志最大缓冲区大小）/asyn_log_fault_solution（异步日志故障解决方案），控制cm_agent日志的异步写入行为。"
  source_anchor: "7.4.1 异步日志参数 页4853"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_server_ha_params
  type: syntax
  statement: "cm_server HA参数：cmserver_ha_connect_timeout（cmserver间HA连接超时）/cmserver_ha_heartbeat_timeout（cmserver间HA心跳超时）/cmserver_ha_status_interval（cmserver间状态同步间隔）/cmserver_demote_delay_on_etcd_fault（etcd故障时cmserver降级延迟）等控制cm_server间高可用行为的参数。"
  source_anchor: "7.4.2 HA参数 页4875-4878"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_server_dcf_params
  type: syntax
  statement: "cm_server DCF参数：enable_dcf（DCF开关）/dcf_heartbeat_timeout（DCF心跳超时）/ddb_type（分布式数据库类型）/ddb_log_level（ddb日志级别）/ddb_log_backup_file_count/ddb_max_log_file_size/ddb_log_suppress_enable/ddb_election_timeout/ddb_dcf_sync_nodes/ddb_dcf_extreme_mode/alarm_ddb_unhealth_threshold等控制DCF（分布式一致性）行为的参数。"
  source_anchor: "7.4.2 DCF参数 页4881-4884"
  source_refs: *refcm
  status: confirmed
- id: cm_wave8_186_server_ssl_params
  type: syntax
  statement: "cm_server SSL/安全参数：enable_ssl（SSL开关）/ssl_cert_expire_alert_threshold（SSL证书过期告警阈值）/ssl_cert_expire_check_interval（SSL证书过期检查间隔）/cm_auth_method（CM认证方式）/cm_krb_server_keyfile（CM Kerberos服务器密钥文件）/security_mode（安全模式开关）/force_promote（强制提升开关）/backup_open（备份开关）/install_type（安装类型）等控制CM安全行为的参数。"
  source_anchor: "7.4.2 SSL/安全参数 页4884-4885"
  source_refs: *refcm
  status: confirmed
open_questions:
