facts:
- id: stats_wave4_3_progress_vacuum
  type: constraint
  statement: "gs_stat_progress_vacuum(pid)查看当前VACUUM进度；仅统计Astore和Ustore页式表，不支持hashbucket和段页式。"
  source_anchor: "1.6.29 页834"
  source_refs: &id001
  - w4_3_1_6_29
  status: confirmed
- id: stats_wave4_3_progress_vacuum_fields
  type: syntax
  statement: "gs_stat_progress_vacuum输出pid、dataname、relid、relname、phase和detail；detail包含总页面数、已扫描页面数、已清理页面数和已清理索引数。"
  source_anchor: "1.6.29 页834-835"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_3_progress_vacuum_phases
  type: behavior_oracle
  statement: "gs_stat_progress_vacuum的phase可为invalid、initialize、vacuuming_main_part、scanning_heap、vacuuming_indexes、vacuuming_heap、vacuuming_part_cache、cleaning_up_indexes、truncating_heap、vacuuming_urq或unknown，分别对应启动、准备扫描、清理分区主表、扫描堆表、清理索引、清理堆表、清理分区缓存死元组、收尾清理、截断空页、回收Ustore索引页面或未知阶段。"
  source_anchor: "1.6.29 页835"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_3_instr_workload_info
  type: syntax
  statement: "get_instr_workload_info(integer)获取数据库主节点上的事务量和事务时间信息，输出用户与前端、后端、分布式事务的commit/rollback计数及最小/最大/平均/总响应时间，以及dbid；响应时间单位为微秒。"
  source_anchor: "1.6.29 页836-837"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_3_instr_workload_info_boundaries
  type: constraint
  statement: "get_instr_workload_info在Non-PDB返回全部信息，PDB仅返回本PDB相关信息；集中式不存在分布式事务，因此分布式事务统计始终为0；仅统计主事务信息，不统计子事务。"
  source_anchor: "1.6.29 页836-837"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_3_pv_instance_time
  type: syntax
  statement: "pv_instance_time()获取当前节点各关键阶段时间消耗，包括DB_TIME、CPU_TIME、EXECUTION_TIME、PARSE_TIME、PLAN_TIME、REWRITE_TIME、PL_EXECUTION_TIME、PL_COMPILATION_TIME、NET_SEND_TIME和DATA_IO_TIME，单位微秒。"
  source_anchor: "1.6.29 页837-838"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_3_global_instance_time
  type: constraint
  statement: "DBE_PERF.get_global_instance_time()提供整个数据库各关键阶段时间消耗，查询需要MONADMIN权限，返回record。"
  source_anchor: "1.6.29 页838"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_3_get_instr_unique_sql
  type: constraint
  statement: "get_instr_unique_sql()获取当前节点归一化SQL执行信息；SYSADMIN和MONADMIN可查询全部信息，其他用户只能查询自己执行的语句信息；字段参考DBE_PERF.STATEMENT；Non-PDB返回全部信息，PDB仅返回本PDB信息。"
  source_anchor: "1.6.29 页838"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_3_reset_unique_sql
  type: constraint
  statement: "reset_unique_sql(scope,clean_type,clean_value)清理数据库节点内存中的Unique SQL，需要sysadmin或monitor admin权限；PDB调用仅清理PDB数据，Non-PDB调用清理全局数据。"
  source_anchor: "1.6.29 页838-839"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_3_reset_unique_sql_params
  type: behavior_oracle
  statement: "reset_unique_sql的scope支持GLOBAL和LOCAL；clean_type支持BY_USERID、BY_CNID和ALL；多租下禁用BY_USERID；clean_value为ALL时不生效。当前集中式中GLOBAL与LOCAL功能一致，且不支持BY_CNID。"
  source_anchor: "1.6.29 页838-839"
  source_refs: *id001
  status: confirmed
