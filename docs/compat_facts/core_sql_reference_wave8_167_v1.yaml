facts:
- id: dbestats_wave8_167_delete_column
  type: syntax
  statement: "DELETE_COLUMN_STATS原型：DBE_STATS.DELETE_COLUMN_STATS(ownname VARCHAR2, tabname VARCHAR2, colname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab/statid/statown/no_invalidate/col_stat_type暂不支持, cascade_parts BOOLEAN DEFAULT TRUE, force BOOLEAN DEFAULT FALSE)；删除列相关的统计信息（包括单列、多列和表达式统计信息），该接口无返回值；表已分区且partname为null时删除全局级别的列级统计信息，且cascade_parts为true时级联删除所有分区的列级统计信息。"
  source_anchor: "3.12.2.20 DELETE_COLUMN_STATS 页2952-2953"
  source_refs: &refdl
  - w8_167_3_12
  status: confirmed
- id: dbestats_wave8_167_delete_column_notes
  type: constraint
  statement: "DELETE_COLUMN_STATS说明：该接口支持删除表达式统计信息（表达式的创建依赖于索引，调用时tabname应传入该索引的名称）；如果表是二级分区表且指定partname为一级分区名，此时cascade_parts为true会将该一级分区下的所有二级分区统计信息一并删除；删除多列统计信息时需先查询PG_STATISTIC_EXT中的staextname字段获取多列别名作为colname入参。"
  source_anchor: "3.12.2.20 DELETE_COLUMN_STATS说明 页2953"
  source_refs: *refdl
  status: confirmed
- id: dbestats_wave8_167_delete_column_example
  type: behavior_oracle
  statement: "DELETE_COLUMN_STATS示例基线：t2二级分区表ANALYZE WITH ALL后删除单列统计信息且不级联分区（分区统计信息仍然存在），通过PG_STATISTIC查看表级列统计信息对比。"
  source_anchor: "3.12.2.20 DELETE_COLUMN_STATS示例 页2953-2954"
  source_refs: *refdl
  status: confirmed
- id: dbestats_wave8_167_delete_index
  type: syntax
  statement: "DELETE_INDEX_STATS原型：DBE_STATS.DELETE_INDEX_STATS(ownname VARCHAR2, indname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab/statid/statown/no_invalidate/stattype暂不支持, cascade_parts BOOLEAN DEFAULT TRUE, force BOOLEAN DEFAULT FALSE)；删除索引相关的统计信息；索引已分区且partname为null时删除全局级别的索引统计信息（cascade_parts为true时级联删除所有分区的索引统计信息）；删除索引的统计信息等同于将reltuples、relpages和relallvisible信息置零。"
  source_anchor: "3.12.2.20 DELETE_INDEX_STATS 页2956-2957"
  source_refs: *refdl
  status: confirmed
- id: dbestats_wave8_167_delete_index_example
  type: behavior_oracle
  statement: "DELETE_INDEX_STATS示例基线：idx_t2_local_a删除索引统计信息且不级联分区索引统计信息，通过PG_CLASS与PG_PARTITION对比删除前后（relpages/reltuples置零）。"
  source_anchor: "3.12.2.20 DELETE_INDEX_STATS示例 页2957-2958"
  source_refs: *refdl
  status: confirmed
- id: dbestats_wave8_167_delete_table
  type: syntax
  statement: "DELETE_TABLE_STATS原型：DBE_STATS.DELETE_TABLE_STATS(ownname VARCHAR2, tabname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab/statid/statown/no_invalidate/stat_category暂不支持, cascade_parts BOOLEAN DEFAULT TRUE, cascade_columns BOOLEAN DEFAULT TRUE, cascade_indexes BOOLEAN DEFAULT TRUE, force BOOLEAN DEFAULT FALSE)；删除表级统计信息。"
  source_anchor: "3.12.2.20 DELETE_TABLE_STATS 页2959-2960"
  source_refs: *refdl
  status: confirmed
- id: dbestats_wave8_167_delete_table_semantics
  type: constraint
  statement: "DELETE_TABLE_STATS语义：删除表的统计信息等同于将表统计信息的reltuples、relpages和relallvisible信息置零；如果cascade_columns或cascade_indexes设置为true，是否级联删除对应分区列或索引的统计信息也由cascade_parts决定（cascade_parts为true时不仅删除所有分区的表级统计信息，还会删除所有分区的列级、索引级统计信息）。"
  source_anchor: "3.12.2.20 DELETE_TABLE_STATS说明 页2960"
  source_refs: *refdl
  status: confirmed
- id: dbestats_wave8_167_delete_table_example
  type: behavior_oracle
  statement: "DELETE_TABLE_STATS示例基线：CALL DELETE_TABLE_STATS(ownname=>'dbe_stats_delete_schema', tabname=>'t2', cascade_columns=>true, cascade_indexes=>true)同时删除该表的所有列、索引统计信息。"
  source_anchor: "3.12.2.20 DELETE_TABLE_STATS示例 页2961"
  source_refs: *refdl
  status: confirmed
- id: dbestats_wave8_167_delete_schema
  type: syntax
  statement: "DELETE_SCHEMA_STATS原型：DBE_STATS.DELETE_SCHEMA_STATS(ownname VARCHAR2, stattab/statid/statown/no_invalidate/stat_category暂不支持, force BOOLEAN DEFAULT FALSE)；删除schema下所有的表级、索引级和列级统计信息（即删除当前用户在指定schema下所有有权限的表，没有权限的表直接跳过不报错）。"
  source_anchor: "3.12.2.20 DELETE_SCHEMA_STATS 页2961-2962"
  source_refs: *refdl
  status: confirmed
- id: dbestats_wave8_167_delete_force
  type: constraint
  statement: "DELETE族force参数：决定统计信息被锁定时的行为——如果为true则即使统计信息被锁定该过程也会将其删除（默认false）。"
  source_anchor: "3.12.2.20 DELETE族force参数说明 页2953-2962"
  source_refs: *refdl
  status: confirmed
- id: dbestats_wave8_167_get_tables_by_sqlid
  type: syntax
  statement: "GET_TABLES_BY_SQLID原型：DBE_STATS.GET_TABLES_BY_SQLID(unique_sqlid BIGINT) RETURNS TABLE(nspname TEXT, tabname TEXT)；获取Unique SQL ID对应语句所有涉及的表（含多张表时返回多行记录）；unique_sqlid可从pg_catalog.pg_stat_activity（实时会话信息视图）、dbe_perf.statement（归一化SQL语句记录视图）、dbe_perf.statement_history（全量或慢SQL语句记录视图）中查询获得。"
  source_anchor: "3.12.2.20 GET_TABLES_BY_SQLID 页2962-2963"
  source_refs: *refdl
  status: confirmed
