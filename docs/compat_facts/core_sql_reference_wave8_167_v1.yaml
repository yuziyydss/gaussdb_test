  statement: "SQLID示例1基线（pg_stat_activity）：SET cursor_sharing=off避免自动参数化后，会话1执行SELECT pg_sleep(60) FROM t1，会话2查询其unique_sql_id=3101300097，get_tables_by_sqlid输出public/t1。"
  source_anchor: "3.12.2.20 GET_TABLES_BY_SQLID示例 页2963-2964"
  source_refs: *refdl
