facts:
- id: ddl_wave8_20_purpose
  type: syntax
  statement: "CREATE TABLE在当前数据库中创建由命令执行者拥有的空白表；当前默认创建行存表。主语法支持临时/UNLOGGED表、IF NOT EXISTS、列约束、表约束、LIKE、table_option、HTAP选项、WITH存储参数、ON COMMIT、ILM压缩策略和TABLESPACE。"
  source_anchor: "1.13.9.48 页1532-1533"
  source_refs: &refb1
  - w8_20_1_13_9_48
  status: confirmed
- id: ddl_wave8_20_permissions
  type: constraint
  statement: "被授予CREATE ANY TABLE权限的用户可在public模式和用户模式下创建表；若创建包含serial类型列的表，还需要CREATE ANY SEQUENCE权限来创建序列。"
  source_anchor: "1.13.9.48 注意事项 页1532"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_object_limits
  type: constraint
  statement: "表约束个数不能超过32767；XML类型不能作为主键或外键；rowid/rowno系统列上不支持创建外键约束。"
  source_anchor: "1.13.9.48 注意事项 页1532"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_unlogged
  type: constraint
  statement: "UNLOGGED表写入不进入预写日志，写入速度快于普通表，但在冲突、操作系统或数据库重启、主备切换、断电或异常关机后数据会被清空，且内容不会复制到备服务器。"
  source_anchor: "1.13.9.48 UNLOGGED 页1534"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_temp_tables
  type: syntax
  statement: "TEMP/TEMPORARY创建临时表；GLOBAL创建全局临时表，缺省为本地临时表。全局临时表元数据对所有会话可见但用户数据按会话隔离；本地临时表只对当前会话可见，会话结束后自动删除。"
  source_anchor: "1.13.9.48 TEMPORARY/TEMP 页1534-1535"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_if_not_exists
  type: constraint
  statement: "IF NOT EXISTS在同名表已存在时不报错，只发出表已存在的通知；用户不应创建以mlog_或matviewmap_为前缀的表名，以免影响物化视图日志表和关联表识别。"
  source_anchor: "1.13.9.48 IF NOT EXISTS/table_name 页1535"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_table_options
  type: constraint
  statement: "COMMENT、AUTO_INCREMENT、默认字符集/字符序和ENGINE属于B模式适配能力；ENGINE仅支持InnoDB且只是语法适配、无实际效果。表级注释最大2048字符，列级和索引级注释最大1024字符。"
  source_anchor: "1.13.9.48 table_option/COMMENT/ENGINE 页1533、1539-1540"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_like_syntax
  type: syntax
  statement: "CREATE TABLE ... LIKE复制源表字段名、数据类型和非空约束；建表完成后新表与源表完全无关。缺省表达式、ON UPDATE属性、生成表达式、CHECK约束、索引、STORAGE、注释、分区定义、存储参数和IDENTITY分别只有在对应INCLUDING选项指定时才复制。"
  source_anchor: "1.13.9.48 LIKE source_table 页1538-1539"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_like_including_all
  type: syntax
  statement: "INCLUDING ALL包含DEFAULTS、UPDATE、GENERATED、CONSTRAINTS、INDEXES、STORAGE、COMMENTS、PARTITION、RELOPTIONS、IDENTITY和ILM；源表serial/bigserial/smallserial/largeserial或OWNED BY序列不会共享给新表，新表会重建自己的SEQUENCE。"
  source_anchor: "1.13.9.48 LIKE INCLUDING ALL 页1539"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_storage_engine
  type: constraint
  statement: "ORIENTATION支持ROW行存；STORAGE_TYPE支持USTORE和ASTORE。不指定ORIENTATION和STORAGE_TYPE时默认创建USTORE表；这两个参数设置成功后不再支持修改。"
  source_anchor: "1.13.9.48 ORIENTATION/STORAGE_TYPE 页1541"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_fillfactor
  type: syntax
  statement: "FILLFACTOR为10到100之间的百分比；UStore默认92，AStore默认100。较小填充因子为页内UPDATE保留空间，频繁更新表可选择较小值，从不更新的表建议100。"
  source_anchor: "1.13.9.48 WITH FILLFACTOR 页1540-1541"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_segment_storage
  type: constraint
  statement: "WITH segment=on启用段页式存储，默认off；该参数仅支持行存表，不支持1~5号物理文件非法删除破坏场景防护，也不支持在升级观察期创建。"
  source_anchor: "1.13.9.48 segment 页1542"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_tde
  type: constraint
  statement: "enable_tde开启表级透明加密，默认off；仅支持行存表、段页式表、临时表和UNLOGGED表。使用前需开启GUC enable_tde并配置tde_key_info；key_type、cmk_id和dek_cipher由数据库自动生成，不支持手动设置或更改。"
  source_anchor: "1.13.9.48 enable_tde/encrypt_algo 页1542-1543"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_on_commit
  type: constraint
  statement: "临时表ON COMMIT支持PRESERVE ROWS、DELETE ROWS和DROP；PRESERVE ROWS为缺省，DELETE ROWS在提交时清空数据，DROP在提交时删除临时表且只支持本地临时表、不支持全局临时表。"
  source_anchor: "1.13.9.48 ON COMMIT 页1545"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_ilm_compression
  type: syntax
  statement: "ILM ADD POLICY ROW STORE COMPRESS支持ADVANCED行存高级压缩和TURBO跨页透明压缩，也可用NONE显式不启用；压缩级别可省略，缺省MEDIUM；行级表达式ON (EXPR)只支持白名单函数。"
  source_anchor: "1.13.9.48 ILM ADD POLICY 页1545-1546"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_check_default
  type: constraint
  statement: "CHECK约束要求插入或更新的表达式结果为真或未知，不支持系统列上的CHECK约束；DEFAULT表达式不能使用子查询或对本表其他字段交叉引用，且类型必须匹配列类型。"
  source_anchor: "1.13.9.48 CHECK/DEFAULT 页1546-1547"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_on_update
  type: constraint
  statement: "ON UPDATE触发条件可自动更新为当前时间戳；仅在B模式5.7指定版本和PG模式支持，PG模式存在部分语法限制；只支持timestamp、datetime、date、time without time zone、smalldatetime、abstime等列类型，不能与生成列同列指定，分区键也不支持该属性。"
  source_anchor: "1.13.9.48 ON UPDATE 页1547"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_generated_column
  type: constraint
  statement: "生成列由GENERATION表达式在写入时计算并可STORED存储；表达式只能调用IMMUTABLE函数，不能引用其他行、其他生成列、系统列，不能使用子查询、聚集或窗口函数；不能指定默认值、不能作为分区键、不能直接写入。"
  source_anchor: "1.13.9.48 GENERATED ALWAYS AS 页1547"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_identity_auto_increment
  type: constraint
  statement: "IDENTITY支持ALWAYS、BY DEFAULT和BY DEFAULT ON NULL三种取值策略；AUTO_INCREMENT仅在sql_compatibility='B'时有效，值必须为正且不超过2^127-1；每表只能有一个自动增长列，不能指定DEFAULT，且自增计数器操作不回滚。"
  source_anchor: "1.13.9.48 IDENTITY/AUTO_INCREMENT 页1547-1549"
  source_refs: *refb1
  status: confirmed
- id: ddl_wave8_20_key_foreign_constraints
  type: syntax
  statement: "PRIMARY KEY要求唯一且非NULL，一表只能有一个主键；UNIQUE对NULL视为互不相等；外键引用列必须是被参考表的主键或唯一列，外键不能定义在临时表和永久表之间；只有UNIQUE、主键和外键支持DEFERRABLE。"
  source_anchor: "1.13.9.48 UNIQUE/PRIMARY KEY/REFERENCES/DEFERRABLE 页1549-1551"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: ddl_wave8_20_oq_runtime
  statement: "CREATE TABLE在真实存储引擎、临时表、TDE、HTAP、ILM压缩和约束组合下的DDL结果与错误矩阵需授权环境实机验证。"
  status: open
