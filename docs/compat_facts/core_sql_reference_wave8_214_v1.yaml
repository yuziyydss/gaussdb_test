- id: guc_wave8_214_replication_cross_instance
  type: syntax
  statement: "双数据库实例复制参数：RepOriginId USERSET整型0~2147483647默认0会话级（双向逻辑复制需设为非0避免循环复制/仅方式三设置）；auto_csn_barrier SIGHUP布尔型默认off流式容灾主实例barrier打点（容灾流程自动设置不建议手动关闭/关闭导致灾备库无法开启延迟回放）；stream_cluster_run_mode POSTMASTER枚举cluster_primary/cluster_standby默认cluster_primary流式容灾DN节点主备实例标识（容灾状态参数内部使用用户可读不建议修改/手动修改造成异常）；hadr_process_type SIGHUP枚举默认none流式复制异地容灾/同城双中心高可用流程标识（none/failover/switchover_promote/switchover_demote/dorado_failover/dorado_switchover_demote/dorado_failover_abnormal/dorado_failover_in_standby_stream等）；cluster_name/hadr_primary_cluster_name/hadr_standby_cluster_num/switchover_abort_timeout容灾实例名称/主集群名/备集群数/倒换中止超时。"
  source_anchor: "7.3.21 双数据库实例复制参数 页4659-4663"
  source_refs: &refw8214
  - w8_214_7_3
  status: confirmed
- id: guc_wave8_214_developer_system_tables
  type: constraint
  statement: "开发人员系统表参数：allow_system_table_mods POSTMASTER布尔型默认off允许修改系统表结构和系统自带模式名称（不建议修改/打开可能导致系统表损坏甚至无法启动）；allow_create_sysobject POSTMASTER布尔型默认off允许在系统模式下创建或修改函数/存储过程/同义词等（oid<16384的系统模式不含public/on=允许初始用户和sysadmin/off=禁止所有用户/新装默认off升级保留原设置/设置off提高安全性）。"
  source_anchor: "7.3.22 开发人员选项 页4663-4664"
  source_refs: *refw8214
  status: confirmed
- id: guc_wave8_214_debug_assertions_ignore
  type: constraint
  statement: "调试/忽略参数：debug_assertions USERSET布尔型默认off断言检查（需编译时定义USE_ASSERT_CHECKING宏/启用时默认on/协助调试定位异常崩溃）；ignore_checksum_failure SUSET布尔型默认off忽略数据校验错误（打开可能导致崩溃/传播或隐藏损坏数据/无法从远程节点恢复）；ignore_system_indexes BACKEND布尔型默认off读取系统表忽略系统索引（修改系统表仍同时修改索引/从系统索引被破坏的表中恢复数据非常有用）；ignore_invalid_pages SIGHUP布尔型默认off回放结束检测到无效页面是否触发PANIC（on仅记录WARNING快速恢复业务/可能导致后续进程异常终止/数据丢失/错误同步到备机）。"
  source_anchor: "7.3.22 开发人员选项 页4664-4665"
  source_refs: *refw8214
  status: confirmed
- id: guc_wave8_214_debug_delay_trace
  type: syntax
  statement: "调试延迟/追踪参数：post_auth_delay BACKEND整型0~2147秒默认0认证成功后延迟启动连接（允许调试器附加/仅调试用生产保持0）；pre_auth_delay SIGHUP整型0~60秒默认0启动连接后延迟认证；trace_notify USERSET布尔型默认off LISTEN/NOTIFY调试输出（需client_min_messages或log_min_messages=DEBUG1或更低）；trace_recovery_messages SIGHUP枚举debug5~log默认log恢复相关调试输出（覆盖log_min_messages仅限特定消息/建议仅调试备机时使用）；trace_sort USERSET布尔型默认off排序资源使用信息（需编译时定义TRACE_SORT宏）；zero_damaged_pages SUSET布尔型默认off损坏页面清零继续处理（破坏数据/硬件软件错误导致崩溃中恢复有用/通常不应设为on除非不需要从崩溃页面恢复数据）。"
  source_anchor: "7.3.22 开发人员选项 页4665-4668"
  source_refs: *refw8214
  status: confirmed
- id: guc_wave8_214_hash_remote_numeric
  type: syntax
  statement: "hash/远程/numeric优化参数：string_hash_compatible POSTMASTER布尔型默认off char和varchar/text类型hash计算方式是否相同（不同在字符串尾部空格处理/设置后整个数据库使用过程中不能再修改/影响分布列转换是否需要重分布）；remotetype BACKEND枚举application/datanode/internaltool默认application远程连接类型；max_user_defined_exception USERSET整型固定值1000异常最大个数（不允许设置只能查看）；enable_fast_numeric SUSET布尔型默认on Numeric类型运算优化（int64/int128类型转换提高性能）；enable_numeric_optimization POSTMASTER布尔型默认off向量化引擎NUMERIC优化；enable_fast_vecop USERSET布尔型默认on向量化引擎运算优化（Timestamp/int32/int64/float8减少行存调用开销支持自动向量化）。"
  source_anchor: "7.3.22 开发人员选项 页4668-4670"
  source_refs: *refw8214
  status: confirmed
- id: guc_wave8_214_compression_track
  type: syntax
  statement: "压缩/诊断/批量绑定参数：enable_compress_spill USERSET布尔型默认on下盘压缩功能；resource_track_log USERSET枚举summary/detail默认summary自诊断日志级别（多列统计信息告警/summary不显示未收集告警/detail显示）；support_batch_bind SIGHUP布尔型默认on JDBC/ODBC/Libpq批量绑定PBE语句；batch_error_mode_sp_name SIGHUP字符串默认BATCH_ERROR_SP BatchErrorMode保存点命名（英文字母数字下划线0~1023字符）；numa_distribute_mode POSTMASTER字符串none/all默认none NUMA节点间共享数据和线程分布（大型多NUMA节点ARM服务器调优/all要求全部NUMA节点可用/x86不支持all）；log_pagewriter SIGHUP布尔型默认off增量检查点刷页信息（on显示详细信息影响性能）；advance_xlog_file_num POSTMASTER整型0~1000000默认0后台周期性提前初始化Xlog文件数（避免事务提交时Xlog初始化影响性能/超重负载才可能出现/预扩占用=advance_xlog_file_num*wal_segment_size（16MB）建议不超可用空间10%）。"
  source_anchor: "7.3.22 开发人员选项 页4670-4673"
  source_refs: *refw8214
  status: confirmed
- id: guc_wave8_214_beta_opfusion_stream
  type: syntax
  statement: "beta优化/调试参数：enable_beta_opfusion USERSET布尔型默认off TPCC聚集函数排序SQL加速执行（需enable_opfusion打开）；enable_stream_noblock_memcopy USERSET布尔型默认on local stream算子内存复制优化（非等待方式提升效率/off可能执行效率下降）；pldebugger_timeout USERSET整型1~86400秒默认900（15min）pldebugger server端等待debug端响应超时；plsql_show_all_error USERSET布尔型默认off编译PL/SQL对象跳过报错继续编译（影响DBE_PLDEVELOPER）；ustore_attr USERSET字符串key-value模式——ustore_verify_level（NONE关闭/FAST快速/COMPLETE全量）+ustore_verify_module（UPAGE/UBTREE/UNDO/REDO/ROACH/ALL/NULL）+index_trace_level（NO/NORMAL/VISIBILITY/SHOWHIKEY/ALL）+enable_ustore_sync_rollback（默认true）/enable_ustore_async_rollback（默认true）等（建议工程师协助修改）。"
  source_anchor: "7.3.22 开发人员选项 页4673-4676"
  source_refs: *refw8214
  status: confirmed
- id: guc_wave8_214_index_txn_segment
  type: syntax
  statement: "索引/段页式参数：index_txntype USERSET字符串空/PCR/RCR默认空控制UBTree索引类型PCR或RCR（PCR支持通过索引闪回查询/RCR不支持/空与RCR等效/reindex新索引保持原索引类型）；enable_auto_segment_remain_cleanup POSTMASTER布尔型默认on段页式残留自动清理（避免随意切换清理方式否则可能无法正常清理残留）；convert_illegal_char_mode USERSET字符串默认?非法编码占位符（ascii编码32~126的95个可显示字符/与A模式差异——A模式zhs16gbk单字节?多字节全角？/GaussDB客户端与服务端字符集相同时不使用占位符/'#'\\`不可设置）；default_segment SUSET布尔型默认off默认创建段页式表。"
  source_anchor: "7.3.22 开发人员选项 页4677-4679"
  source_refs: *refw8214
  status: confirmed
