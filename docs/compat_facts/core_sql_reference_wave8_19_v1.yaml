facts:
- id: sql_wave8_19_purpose
  type: syntax
  statement: "SELECT用于从表或视图中取出数据；主语法支持WITH、targetlist、INTO、FROM、WHERE、层次查询、GROUP BY、HAVING、WINDOW、集合运算、ORDER BY、LIMIT/OFFSET/FETCH和锁定子句。"
  source_anchor: "1.13.19.3 页1806"
  source_refs: &refb1
  - w8_19_1_13_19_3
  status: confirmed
- id: sql_wave8_19_permissions
  type: constraint
  statement: "查询表或视图需要表所有权、表SELECT权限或SELECT ANY TABLE权限；SELECT命令使用的每个字段都必须有SELECT权限，FOR UPDATE/FOR NO KEY UPDATE/FOR SHARE/FOR KEY SHARE还额外要求UPDATE权限。"
  source_anchor: "1.13.19.3 注意事项 页1806"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_alias_rules
  type: constraint
  statement: "condition和expression可引用targetlist别名，但只能同层引用、只能引用targetlist别名、只能后面的表达式引用前面的别名；不能包含volatile函数或窗口函数，不支持JOIN ON中引用别名，多个可应用别名时报错。"
  source_anchor: "1.13.19.3 语法说明 页1807"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_cte
  type: syntax
  statement: "WITH声明可在主查询中按名称引用的CTE；RECURSIVE只能出现在WITH后且多个CTE只需声明一次；每个子查询可以是SELECT、VALUES、INSERT、UPDATE或DELETE，并可用MATERIALIZED或NOT MATERIALIZED修饰。"
  source_anchor: "1.13.19.3 WITH子句 页1808-1809"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_plan_hint
  type: constraint
  statement: "plan_hint以/*+ */形式写在SELECT关键字后；每条语句中只有第一个hint注释块生效，其中可写多条hint。"
  source_anchor: "1.13.19.3 plan_hint子句 页1809"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_distinct
  type: constraint
  statement: "ALL返回所有符合条件的行为默认；DISTINCT删除重复行，DISTINCT ON保留表达式结果分组中的第一行。其结果并非固定，需要稳定输出时应同时ORDER BY；DISTINCT ON表达式不支持非整数常量排序。"
  source_anchor: "1.13.19.3 DISTINCT子句 页1809"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_into
  type: behavior_oracle
  statement: "INTO可将结果写入用户变量、OUTFILE或DUMPFILE；OUTFILE支持字段终止符、引号符、转义符和行起始/终止符，DUMPFILE导出无间隔符、无换行符的单行数据，file_name必须为绝对路径。"
  source_anchor: "1.13.19.3 INTO子句 页1810"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_from_sources
  type: syntax
  statement: "FROM支持表/视图、分区或二级分区、子查询、WITH查询名、表函数、XMLTABLE、UNPIVOT/PIVOT和JOIN；别名会隐藏实际表名；JOIN产生的括号表指定别名时，非保留关键字UNPIVOT和PIVOT不允许作为别名。"
  source_anchor: "1.13.19.3 FROM子句 页1811-1813"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_tablesample
  type: syntax
  statement: "TABLESAMPLE支持SYSTEM按数据块采样、BERNOULLI按行采样和HYBRID先块后行采样；百分比参数取值均为0到100；REPEATABLE可指定非空常量种子，相同表状态和参数下采样结果一致。"
  source_anchor: "1.13.19.3 TABLESAMPLE 页1811"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_timecapsule
  type: constraint
  statement: "TIMECAPSULE TIMESTAMP/CSN用于闪回查询；系统表、DFS表、全局/本地临时表、UNLOGGED表、视图、序列表、hashbucket表、共享表和继承表不支持闪回；闪回不能跨越TRUNCATE、DDL、DCL或VACUUM FULL，时间方式闪回与实际时间点最多偏差3秒。"
  source_anchor: "1.13.19.3 TIMECAPSULE 页1811-1812"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_partition_query
  type: constraint
  statement: "PARTITION/SUBPARTITION只能用于分区表；可按分区名/二级分区名或分区键值指定查询范围；指定分区语句目前无法执行全局索引扫描。"
  source_anchor: "1.13.19.3 PARTITION页1807与1812"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_join_types
  type: syntax
  statement: "JOIN支持INNER、LEFT OUTER、RIGHT OUTER、FULL OUTER和CROSS JOIN；INNER/OUTER JOIN必须使用NATURAL、ON或USING之一，CROSS JOIN不能使用连接条件；多个JOIN默认从左向右嵌套。"
  source_anchor: "1.13.19.3 JOIN类型 页1813"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_xmltable
  type: constraint
  statement: "XMLTABLE仅在A和PG兼容模式支持，基于XMLTYPE/XML生成虚拟表；XPath为1.0，不支持DEFAULT命名空间，传入XML最大1GB；A兼容模式可省略columns_clause，PG兼容模式不可省略。"
  source_anchor: "1.13.19.3 XMLTABLE 页1814-1816"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_pivot_unpivot
  type: constraint
  statement: "PIVOT和UNPIVOT仅支持A兼容模式且子句内不支持hint；UNPIVOT默认剔除NULL行，可用INCLUDE/EXCLUDE NULLS控制；PIVOT输出列名长度限制为63，超出报错。"
  source_anchor: "1.13.19.3 UNPIVOT/PIVOT 页1817-1820"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_where_outer_join
  type: constraint
  statement: "WHERE condition应为布尔表达式；非标准\"(+)\"只能出现在WHERE中，不能与已显式JOIN的连接关系混用，只能作用于表/视图列，只能转化为左外或右外连接，不支持全外连接。"
  source_anchor: "1.13.19.3 WHERE子句 页1820-1822"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_connect_by
  type: syntax
  statement: "START WITH指定递归初始行，CONNECT BY指定父子递归关系，PRIOR标识递归键；NOCYCLE遇到循环记录停止递归，未指定时默认检测到循环报错；层次查询不能与FOR SHARE/UPDATE锁定子句同时使用。"
  source_anchor: "1.13.19.3 CONNECT BY 页1824-1827"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_group_having
  type: syntax
  statement: "GROUP BY支持普通表达式、ROLLUP、CUBE和GROUPING SETS；HAVING在分组后过滤组；sql_mode包含ONLY_FULL_GROUP_BY时，非聚集列需要满足GROUP BY、主键/唯一非空键或特定JOIN列规则，GROUP BY不支持非整数常量排序。"
  source_anchor: "1.13.19.3 GROUP BY/HAVING 页1828-1830"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_window_frame
  type: constraint
  statement: "WINDOW定义可命名并复用，支持PARTITION BY、ORDER BY和RANGE/ROWS frame；frame的VALUE边界必须为非负常量，不支持变量或表达式，且相关表列和VALUE类型受文档列出的数值、时间、区间等类型约束。"
  source_anchor: "1.13.19.3 WINDOW子句 页1830"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_set_operations
  type: syntax
  statement: "UNION/UNION ALL、INTERSECT、EXCEPT/MINUS组合SELECT结果；UNION默认去重，UNION ALL保留重复；参与集合运算的SELECT列数相同且列类型和顺序相同，UNION结果或输入不能包含锁定子句；多个INTERSECT优先于UNION处理。"
  source_anchor: "1.13.19.3 UNION/INTERSECT/EXCEPT 页1830-1832"
  source_refs: *refb1
  status: confirmed
- id: sql_wave8_19_order_limit_lock
  type: constraint
  statement: "ORDER BY执行多列排序且不支持非整数常量排序，与DISTINCT或GROUP BY一起使用时排序列必须在结果集中；LIMIT/OFFSET/FETCH控制分页；锁定子句支持NOWAIT、WAIT n和SKIP LOCKED，WAIT n范围为0到2147483，SKIP LOCKED只跳过互斥行锁。"
  source_anchor: "1.13.19.3 ORDER BY/LIMIT/锁定子句 页1832-1835与1840"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: sql_wave8_19_oq_runtime
  statement: "SELECT各子句在真实表规模、并发事务、闪回、分区和兼容模式下的计划与行为矩阵需授权环境实机验证。"
  status: open
