  content: "SET族force=TRUE在锁定统计信息上设置值后的ANALYZE恢复行为、表达式统计信息colname（expr/expr1/expr2）与索引表达式的稳定对应关系、reltuples=0时nullfrac强制置0对优化器的影响需授权环境实机验证。"
