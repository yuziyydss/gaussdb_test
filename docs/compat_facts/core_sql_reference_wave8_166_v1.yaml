facts:
- id: dbestats_wave8_166_set_column
  type: syntax
  statement: "SET_COLUMN_STATS原型：DBE_STATS.SET_COLUMN_STATS(ownname VARCHAR2, tabname VARCHAR2, colname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab/statid/srec/statown暂不支持, distcnt NUMBER DEFAULT NULL, density暂不支持, nullcnt NUMBER DEFAULT NULL, avgclen NUMBER DEFAULT NULL, flags暂不支持, no_invalidate暂不支持, force BOOLEAN DEFAULT FALSE)；设置列相关的统计信息（包括单列、多列和表达式统计信息），该接口无返回值；表已分区且partname为null时设置全局级别的列级统计信息。"
  source_anchor: "3.12.2.20 SET_COLUMN_STATS 页2944-2946"
  source_refs: &refse
  - w8_166_3_12
  status: confirmed
- id: dbestats_wave8_166_set_column_capability
  type: constraint
  statement: "SET_COLUMN_STATS能力边界：当前仅支持设置列的NDV（distcnt）、nullfrac（nullcnt）和width（avgclen）三类统计信息；该接口支持设置表达式统计信息（表达式的创建依赖于索引，调用时tabname应传入该索引的名称）；当单列、表达式统计信息被删除后仍支持调用该接口重新设置（PG_STATISTIC中将插入新数据），但多列统计信息被删除后不支持使用该接口重新设置；当前列行数reltuples为0时nullfrac将被设置为0、distcnt设置为入参值。"
  source_anchor: "3.12.2.20 SET_COLUMN_STATS说明 页2946"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_column_example_single
  type: behavior_oracle
  statement: "单列设置示例基线：t1三列原值stanullfrac 0/stawidth 4/stadistinct -.75等；SET_COLUMN_STATS(colname=>'a', distcnt=>6, nullcnt=>5, avgclen=>42)后PG_STATISTIC中staattnum=1变为stanullfrac 1/stawidth 42/stadistinct 6。"
  source_anchor: "3.12.2.20 SET_COLUMN_STATS示例 页2946-2947"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_column_example_multicol
  type: behavior_oracle
  statement: "多列设置示例基线：PG_STATISTIC_EXT中stakey '1 2'（staextname extname_-1308656218）原stanullfrac 0/stawidth 8/stadistinct -.75；SET_COLUMN_STATS(colname=>'extname_-1308656218', distcnt=>5, nullcnt=>5, avgclen=>2)后变为stanullfrac 1/stawidth 2/stadistinct 5。"
  source_anchor: "3.12.2.20 SET_COLUMN_STATS示例 页2947"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_column_example_expr
  type: behavior_oracle
  statement: "表达式设置示例基线：idx_t1_expr索引（(a*a),(a+a),(a*b)）的PG_ATTRIBUTE中表达式列名为expr/expr1/expr2；SET_COLUMN_STATS(tabname=>'idx_t1_expr', colname=>'expr', distcnt=>13, nullcnt=>5, avgclen=>22)后staattnum=1变为stanullfrac 1/stawidth 22/stadistinct 13。"
  source_anchor: "3.12.2.20 SET_COLUMN_STATS示例 页2947-2948"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_index
  type: syntax
  statement: "SET_INDEX_STATS原型：DBE_STATS.SET_INDEX_STATS(ownname VARCHAR2, indname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab/statid暂不支持, numrows/numlblks/relallvisible NUMBER DEFAULT NULL, numdist/avglblk/avgdblk/clstfct/indlevel/flags/statown/no_invalidate/guessq/cachedblk/cachehit暂不支持, force BOOLEAN DEFAULT FALSE)；设置索引相关的统计信息，该接口无返回值；索引已分区且partname为null时设置全局索引级别的统计信息。"
  source_anchor: "3.12.2.20 SET_INDEX_STATS 页2948-2949"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_index_capability
  type: constraint
  statement: "SET_INDEX_STATS能力边界：当前仅支持设置索引的reltuples（numrows）、relpages（numblks）和relallvisible（relallvisible）三类统计信息。"
  source_anchor: "3.12.2.20 SET_INDEX_STATS说明 页2950"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_index_example
  type: behavior_oracle
  statement: "SET_INDEX_STATS示例基线：idx_t1_a原reltuples 3/relpages 2/relallvisible 0；SET_INDEX_STATS(numrows=>1, numlblks=>3, relallvisible=>6)后PG_CLASS变为1/3/6。"
  source_anchor: "3.12.2.20 SET_INDEX_STATS示例 页2950-2951"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_table
  type: syntax
  statement: "SET_TABLE_STATS原型：DBE_STATS.SET_TABLE_STATS(ownname VARCHAR2, tabname VARCHAR2, partname VARCHAR2 DEFAULT NULL, stattab/statid暂不支持, numrows/numblks/relallvisible NUMBER DEFAULT NULL, avgrlen/flags/statown/no_invalidate/cachedblk/cachehit/im_imcu_count/im_block_count/scanrate暂不支持, force BOOLEAN DEFAULT FALSE)；设置表级统计信息，该接口无返回值；表已分区且partname为null时设置全局表级统计信息。"
  source_anchor: "3.12.2.20 SET_TABLE_STATS 页2951-2952"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_table_capability
  type: constraint
  statement: "SET_TABLE_STATS能力边界：当前仅支持设置表的reltuples（numrows）、relpages（numblks）和relallvisible（relallvisible）三类统计信息；numrows设置表行数、numblks设置表页数、relallvisible设置被标识为全可见的表中的页数量。"
  source_anchor: "3.12.2.20 SET_TABLE_STATS说明 页2952"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_table_example
  type: behavior_oracle
  statement: "SET_TABLE_STATS示例基线：CALL SET_TABLE_STATS(tabname=>'t1', ownname=>'dbe_stats_set_schema', numrows=>1, numblks=>3, relallvisible=>6)（用法与SET_INDEX_STATS类似）。"
  source_anchor: "3.12.2.20 SET_TABLE_STATS示例 页2952"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_force_semantics
  type: constraint
  statement: "SET族force参数：决定统计信息被锁定时的行为——如果为true则即使列级/索引/表统计信息被锁定该过程也会设置值，默认为false。"
  source_anchor: "3.12.2.20 SET族force参数说明 页2946-2952"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_unsupported_params
  type: constraint
  statement: "SET族暂不支持参数汇总：stattab/statid/srec/flags/statown/no_invalidate（SET_COLUMN_STATS）、numdist/avglblk/avgdblk/clstfct/indlevel/guessq/cachedblk/cachehit（SET_INDEX_STATS）、avgrlen/cachedblk/cachehit/im_imcu_count/im_block_count/scanrate（SET_TABLE_STATS）及density（SET_COLUMN_STATS）。"
  source_anchor: "3.12.2.20 SET族参数说明 页2945-2952"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_ownname_rule
  type: constraint
  statement: "ownname空值规则：SET族接口ownname参数设置为null时默认使用当前schema，需将behavior_compat_options参数值设置为bind_procedure_searchpath。"
  source_anchor: "3.12.2.20 SET族参数说明 页2945-2952"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_family_scope
  type: syntax
  statement: "SET族与DELETE/RESTORE关系：SET_COLUMN_STATS支持设置单列、多列和表达式统计信息；被删除后的单列/表达式统计信息可通过SET重新设置（插入新数据），多列统计信息被删除后不支持重新设置；删除接口为DELETE_COLUMN/INDEX/TABLE/SCHEMA_STATS（后续切片覆盖）。"
  source_anchor: "3.12.2.20 SET_COLUMN_STATS说明 页2946"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_partname_semantics
  type: constraint
  statement: "SET族partname语义：SET_COLUMN_STATS表已分区且partname为null时设置全局级别的列级统计信息；SET_INDEX_STATS索引已分区且partname为null时设置全局索引级别的统计信息；SET_TABLE_STATS表已分区且partname为null时设置全局表级别的统计信息。"
  source_anchor: "3.12.2.20 SET族partname参数说明 页2945-2952"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_density_unsupported
  type: constraint
  statement: "SET_COLUMN_STATS的density参数暂不支持。"
  source_anchor: "3.12.2.20 SET_COLUMN_STATS参数说明 页2945"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_expr_name_query
  type: syntax
  statement: "表达式列名查询方式：表达式统计信息的列名可通过PG_ATTRIBUTE查询（SELECT attnum, attname FROM PG_ATTRIBUTE WHERE attrelid='idx_t1_expr'::REGCLASS），示例输出attnum 1/2/3对应attname expr/expr1/expr2。"
  source_anchor: "3.12.2.20 SET_COLUMN_STATS示例 页2947"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_no_invalidate_unsupported
  type: constraint
  statement: "SET族no_invalidate参数暂不支持（SET_COLUMN/INDEX/TABLE_STATS均如此）。"
  source_anchor: "3.12.2.20 SET族参数说明 页2946-2952"
  source_refs: *refse
  status: confirmed
- id: dbestats_wave8_166_set_return_void
  type: syntax
  statement: "SET族返回值：SET_COLUMN_STATS/SET_INDEX_STATS/SET_TABLE_STATS三个接口均无返回值。"
  source_anchor: "3.12.2.20 SET族接口说明 页2944-2952"
  source_refs: *refse
