- id: advpkg_wave8_185_lob_detail
  type: constraint
  statement: "DBMS_LOB兼容细节：APPEND→APPEND支持；CLOB2FILE不支持；CLOSE→BFILECLOSE（参数类型为BFILE无重载 vs Oracle 3个重载）；COMPARE→COMPARE（len参数BIGINT vs Oracle amount INTEGER）；CONVERTTOBLOB→LOB_CONVERTTOBLOB（GaussDB 5参数BIGINT vs Oracle 8参数含blob_csid/lang_context/warning）；CONVERTTOCLOB→LOB_CONVERTTOCLOB（同上差异）；COPY→LOB_COPY支持；CREATETEMPORARY→CREATE_TEMPORARY（dur参数INTEGER默认10 vs Oracle PLS_INTEGER默认DBMS_LOB.SESSION）。"
  source_anchor: "4.3.13 表4-108 DBMS_LOB兼容性说明 页3240-3246"
  source_refs: *refap
  status: confirmed
