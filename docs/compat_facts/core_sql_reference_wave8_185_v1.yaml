  statement: "DBMS_SCHEDULER兼容细节：CREATE_JOB/CREATE_PROGRAM/DROP_JOB等核心调度接口在GaussDB的DBE_SCHEDULER中有对应实现；GaussDB使用DBE_SCHEDULER替代Oracle的DBMS_SCHEDULER，接口名称和参数基本保持一致但前缀从DBMS_改为DBE_。"
