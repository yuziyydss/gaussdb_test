  type: syntax
  statement: "gs_wlm_respool_cpu_info()描述资源池CPU资源限制和使用信息，输出respool_name、control_group、cpu_affinity和cpu_usage；多租模式下禁用。"
  source_anchor: "1.6.29 页878"
