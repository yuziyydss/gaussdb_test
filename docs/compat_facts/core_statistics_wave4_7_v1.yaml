- id: stats_wave4_7_respool_concurrency_no_limit
  type: behavior_oracle
  statement: "gs_wlm_respool_concurrency_info中，如果资源池没有进行并发限制，running_concurrency显示为0。"
  source_anchor: "1.6.29 页880"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_respool_io_info
  type: syntax
  statement: "gs_wlm_respool_io_info()描述资源池I/O限制和使用信息，输出respool_name、io_limits、io_priority和current_iops；多租模式下禁用。"
  source_anchor: "1.6.29 页880"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_respool_io_semantics
  type: behavior_oracle
  statement: "gs_wlm_respool_io_info中io_limits为每秒IOPS上限，0表示不控制；io_priority在I/O利用率高达90%时生效，None表示不控制；current_iops可能因统计算法偶尔超过上限，未管控时显示0；IOPS计数单位由GUC参数io_control_unit定义。"
  source_anchor: "1.6.29 页880"
  source_refs: *id001
  status: confirmed
