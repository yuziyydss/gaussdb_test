facts:
- id: stats_wave4_7_thread_memctx_detail
  type: constraint
  statement: "gs_get_thread_memctx_detail(tid,text)返回指定线程内存上下文的内存申请明细，仅支持查询GS_THREAD_MEMORY_CONTEXT返回的tid和contextname；需SYSADMIN或MONADMIN权限；Non-PDB返回全部信息，PDB返回空列表。"
  source_anchor: "1.6.29 页874"
  source_refs: &id001
  - w4_7_1_6_29
  status: confirmed
- id: stats_wave4_7_thread_memctx_detail_fields
  type: syntax
  statement: "gs_get_thread_memctx_detail输出file、line和size；同一文件同一行多次申请的内存大小会累加，size单位为byte。"
  source_anchor: "1.6.29 页874"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_tpworker_execstmt_stat
  type: constraint
  statement: "gs_tpworker_execstmt_stat()描述正在执行语句的运行时信息；SYSADMIN和MONADMIN显示全部正在执行语句，普通用户只能查询自己执行的SQL语句信息。"
  source_anchor: "1.6.29 页874"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_tpworker_execstmt_stat_fields
  type: syntax
  statement: "gs_tpworker_execstmt_stat输出db_oid、db_name、threadpool_worker、thread_id、session_id、query_id、query_text、unique_sql_id、client_hostname、client_app_name、慢SQL阈值、语句开始时间、已耗时和管控信息。"
  source_anchor: "1.6.29 页874-875"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_tpworker_execstmt_control
  type: behavior_oracle
  statement: "gs_tpworker_execstmt_stat的stmt_control_status可为Waiting、Running、Control或Downgraded，分别表示等待线程、正常执行、进入资源管控和进入CPU管控；stmt_control_iostat记录当前IOPS与上限，格式curVal/maxVal；memstat、cpustat和netstat字段预留且暂不支持。"
  source_anchor: "1.6.29 页875-876"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_tpworker_execslot_stat
  type: constraint
  statement: "gs_tpworker_execslot_stat()描述线程运行时信息；SYSADMIN和MONADMIN显示全部线程，普通用户只能查询自己执行的SQL语句所在线程信息。"
  source_anchor: "1.6.29 页875-876"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_tpworker_execslot_stat_fields
  type: syntax
  statement: "gs_tpworker_execslot_stat输出numagroup、worker_id、worker_bind_type、worker_cpu_affinity、worker_status、served_query_id和served_query_text。"
  source_anchor: "1.6.29 页875-876"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_tpworker_worker_status
  type: behavior_oracle
  statement: "gs_tpworker_execslot_stat的worker_status可为Waiting、Running或Control，分别表示等待session获得线程、当前语句正常执行和当前语句进入资源管控。"
  source_anchor: "1.6.29 页876"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_session_all_settings_by_sessionid
  type: constraint
  statement: "gs_session_all_settings(sessionid bigint)查询本节点指定会话的全量GUC参数配置，需要SYSADMIN或MONADMIN权限；PDB下仅返回本PDB数据，Non-PDB返回全局数据；输出name、setting和unit。"
  source_anchor: "1.6.29 页876"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_session_all_settings_all
  type: constraint
  statement: "gs_session_all_settings()查询本节点所有会话的全量GUC参数配置，需要SYSADMIN或MONADMIN权限；PDB仅返回本PDB数据，Non-PDB返回全局数据；输出sessionid、pid、name、setting和unit。"
  source_anchor: "1.6.29 页876-877"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_local_wal_preparse_statistics
  type: constraint
  statement: "gs_local_wal_preparse_statistics()查询本节点日志预解析线程最近一次启动和预解析日志情况，需要SYSADMIN权限；线程通常在备DN双机复制链路断开时由CM组件发送命令启动。"
  source_anchor: "1.6.29 页877"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_local_wal_preparse_fields
  type: syntax
  statement: "gs_local_wal_preparse_statistics输出preparser_term、start_time、end_time、start_location、end_location、total_bytes、speed和is_valid；speed单位为byte/ms，total_bytes单位为byte。"
  source_anchor: "1.6.29 页877-878"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_7_local_wal_preparse_default
  type: behavior_oracle
  statement: "若日志预解析线程尚未启动，gs_local_wal_preparse_statistics返回默认值，term为0，时间为2000-01-01 08:00:00+08，位置为00000000/00000000，字节数、速度为0，is_valid为f。"
  source_anchor: "1.6.29 页877-878"
  source_refs: *id001
  status: confirmed
