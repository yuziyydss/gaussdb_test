facts:
- id: alter_default_privileges_wave8_95_syntax
  type: syntax
  statement: "ALTER DEFAULT PRIVILEGES修改数据库中用户在特定对象上默认拥有的权限，不会影响分配已有对象中的权限；目前只支持对表（包括视图）、序列、函数、类型、密态数据库客户端主密钥和列加密密钥的权限更改；语法为ALTER DEFAULT PRIVILEGES [ FOR { ROLE | USER } target_role [, ...] ] [ IN SCHEMA schema_name [, ...] ] abbreviated_grant_or_revoke，abbreviated_grant_or_revoke含grant/revoke各6类子句（tables/sequences/functions/types/client_master_keys/column_encryption_keys）。"
  source_anchor: "1.13.7.8 功能描述/注意事项/语法格式 页1207"
  source_refs: &refadp
  - w8_95_1_13_7_8
  status: confirmed
- id: alter_default_privileges_wave8_95_grant_clauses
  type: constraint
  statement: "grant_on_tables_clause为GRANT { { SELECT | INSERT | UPDATE | DELETE | TRUNCATE | REFERENCES | ALTER | DROP | COMMENT | INDEX | VACUUM } [, ...] | ALL [ PRIVILEGES ] } ON TABLES TO { [ GROUP ] role_name | PUBLIC } [, ...] [ WITH GRANT OPTION ]；sequences为SELECT/UPDATE/USAGE/ALTER/DROP/COMMENT；functions为EXECUTE/ALTER/DROP/COMMENT；types为USAGE/ALTER/DROP/COMMENT；client_master_keys与column_encryption_keys均为USAGE/DROP。"
  source_anchor: "1.13.7.8 语法格式 grant子句 页1207-1208"
  source_refs: *refadp
  status: confirmed
- id: alter_default_privileges_wave8_95_revoke_clauses
  type: constraint
  statement: "revoke子句形式为REVOKE [ GRANT OPTION FOR ] { { 权限列表 } [, ...] | ALL [ PRIVILEGES ] } ON <对象类型> FROM { [ GROUP ] role_name | PUBLIC } [, ...] [ CASCADE | RESTRICT | CASCADE CONSTRAINTS ]，六类对象（TABLES/SEQUENCES/FUNCTIONS/TYPES/CLIENT_MASTER_KEYS/COLUMN_ENCRYPTION_KEYS）的权限集合与对应grant子句一致。"
  source_anchor: "1.13.7.8 语法格式 revoke子句 页1208-1209"
  source_refs: *refadp
  status: confirmed
- id: alter_default_privileges_wave8_95_params_example
  type: behavior_oracle
  statement: "target_role未指定FOR ROLE|USER时默认为当前角色/用户，且target_role必须拥有schema_name的CREATE权限；删除被赋予默认权限的角色需恢复改变的缺省权限或使用DROP OWNED BY脱离缺省权限记录；示例：ALTER DEFAULT PRIVILEGES IN SCHEMA tpcds GRANT SELECT ON TABLES TO PUBLIC、FOR ROLE jack IN SCHEMA tpcds GRANT INSERT ON TABLES TO jake、REVOKE SELECT/INSERT撤销；相关链接GRANT、REVOKE。"
  source_anchor: "1.13.7.8 参数说明/须知/示例 页1209-1210"
  source_refs: *refadp
  status: confirmed
- id: alter_directory_wave8_95_syntax
  type: syntax
  statement: "ALTER DIRECTORY修改一个目录对象的属性，目前只支持修改目录对象的所有者；语法为ALTER DIRECTORY directory_name OWNER TO new_owner；directory_name为已存在的目录名称。"
  source_anchor: "1.13.7.9 功能描述/注意事项/语法格式/参数说明 页1210"
  source_refs: &refdir
  - w8_95_1_13_7_9
  status: confirmed
- id: alter_directory_wave8_95_permission
  type: environment
  statement: "当enable_access_server_directory=off时只允许初始用户修改目录对象的所有者；当enable_access_server_directory=on时具有SYSADMIN权限的用户和目录对象的所有者可以修改目录对象，且要求该用户是新所有者的成员；不支持在PDB内使用目录对象；示例CREATE OR REPLACE DIRECTORY dir as '/tmp/'后ALTER DIRECTORY dir OWNER TO jim。"
  source_anchor: "1.13.7.9 注意事项/示例 页1210"
  source_refs: *refdir
  status: confirmed
- id: alter_event_wave8_95_syntax
  type: syntax
  statement: "ALTER [DEFINER = user] EVENT event_name [ON SCHEDULE schedule] [ON COMPLETION [NOT] PRESERVE] [RENAME TO new_event_name] [ENABLE | DISABLE | DISABLE ON SLAVE] [COMMENT 'string'] [DO event_body]修改已创建定时任务的属性；schedule为AT timestamp [+ INTERVAL interval] ...或EVERY interval [STARTS timestamp [+ INTERVAL interval] ...] [ENDS timestamp [+ INTERVAL interval] ...]；interval单位包括YEAR/MONTH/DAY/HOUR/MINUTE/SECOND及YEAR TO MONTH等组合。"
  source_anchor: "1.13.7.10 语法格式 页1211"
  source_refs: &refevent
  - w8_95_1_13_7_10
  status: confirmed
- id: alter_event_wave8_95_restrictions
  type: constraint
  statement: "定时任务相关操作仅在sql_compatibility = 'B'时支持；只有定时任务的所有者有权修改对应的定时任务，系统管理员默认拥有修改所有定时任务的权限；可通过SHOW EVENTS或在PG_JOB表中查看log_user列获得任务所有者信息；每次修改定时任务成功后被修改任务的所有者会更新为当前用户，若指定definer则所有者更新为被指定的definer；definer选项场景限制与CREATE EVENT章节一致；系统管理员修改其他用户创建的定时任务后所有者将切换为系统管理员，待执行语句将使用系统管理员的权限执行。"
  source_anchor: "1.13.7.10 注意事项 页1211"
  source_refs: *refevent
  status: confirmed
- id: alter_event_wave8_95_definer_options
  type: constraint
  statement: "DEFINER指定定时任务待执行语句执行时使用的权限，默认使用当前创建定时任务者的权限，指定时使用被指定用户user的用户权限，definer参数只有具有sysadmin权限的用户有权指定；ON COMPLETION [NOT] PRESERVE：默认事务完成后系统表立刻删除该定时任务，PRESERVE覆盖默认行为；创建后默认ENABLE（到规定时间立即执行待执行语句），DISABLE改变活动状态，DISABLE ON SLAVE表现与DISABLE一致；COMMENT注释内容可在GS_JOB_ATTRIBUTE表中查看。"
  source_anchor: "1.13.7.10 参数说明 页1211-1212"
  source_refs: *refevent
  status: confirmed
- id: alter_event_wave8_95_interval_note
  type: constraint
  statement: "interval时间间隔的取值可以使用下划线代替TO，例如YEAR_MONTH、DAY_HOUR等；该参数仅在B兼容模式下，且GUC参数b_format_version = '5.7'、b_format_dev_version = 's1'时才可使用。"
  source_anchor: "1.13.7.10 参数说明 interval 说明 页1212"
  source_refs: *refevent
  status: confirmed
- id: alter_event_wave8_95_example
  type: behavior_oracle
  statement: "示例（B兼容库test_event）：event_e1以DISABLE创建（AT sysdate + interval 5 second）后SHOW EVENTS显示enable='f'；ALTER EVENT event_e1 ENABLE五秒后t_ev表新增0；EVERY 1 minute任务每分钟插入1；ALTER EVENT event_e2 DO insert into t_ev values(3)修改待执行语句后执行插入3；ALTER EVENT event_e2 RENAME TO event_ee改名；DROP EVENT event_ee删除。"
  source_anchor: "1.13.7.10 示例 页1212-1213"
  source_refs: *refevent
  status: confirmed
- id: alter_extension_wave8_95_prereq
  type: environment
  statement: "扩展功能为内部使用功能，只允许修改数据库内部的高级包或扩展；要使用该功能需要设置support_extended_features为true。"
  source_anchor: "1.13.7.11 须知 页1213"
  source_refs: &refext
  - w8_95_1_13_7_11
  status: confirmed
- id: alter_extension_wave8_95_forms
  type: syntax
  statement: "ALTER EXTENSION三种形式：name UPDATE [ TO new_version ]更新扩展版本（扩展必须提供适用的更新脚本或一系列脚本，未指定新版本时更新到扩展控制文件中显示的默认版本）；name SET SCHEMA new_schema移动扩展对象到另一个模式（该扩展必须relocatable才能成功）；name { ADD | DROP } member_object添加或删除成员对象（主要适用于扩展更新脚本，ADD的对象接着会被视为扩展成员且只能通过取消扩展来取消，DROP只是从扩展里移除不删除对象）。"
  source_anchor: "1.13.7.11 注意事项/语法格式 页1213-1214"
  source_refs: *refext
  status: confirmed
- id: alter_extension_wave8_95_member_objects
  type: constraint
  statement: "member_object支持AGGREGATE、CAST (source_type AS target_type)、COLLATION、CONVERSION、DOMAIN、EVENT TRIGGER、FOREIGN DATA WRAPPER、FOREIGN TABLE、FUNCTION、MATERIALIZED VIEW、OPERATOR (left_type, right_type)、OPERATOR CLASS/FAMILY USING index_method、[PROCEDURAL] LANGUAGE、SCHEMA、SEQUENCE、SERVER、TABLE、TEXT SEARCH CONFIGURATION/DICTIONARY/PARSER/TEMPLATE、TYPE、VIEW；使用ALTER EXTENSION需拥有该扩展的权限，指定ADD/DROP时还需拥有被添加/删除对象的相应权限。"
  source_anchor: "1.13.7.11 注意事项/语法格式 页1214"
  source_refs: *refext
  status: confirmed
- id: alter_extension_wave8_95_params_example
  type: behavior_oracle
  statement: "参数：引用零参数聚合函数时使用*代替输入数据类型列表；argmode取值IN/OUT/INOUT/VARIADIC默认IN（ALTER EXTENSION不关心OUT参数，确认函数一致性只需要输入参数，仅指定IN、INOUT和VARIADIC即可）；不关心参数名称（一致性只确认参数数据类型）；操作符参数为前缀或后缀运算符时丢失参数写NONE；示例：ALTER EXTENSION plpgsql UPDATE TO '2.0'、CREATE SCHEMA utils后SET SCHEMA utils、ADD FUNCTION populate_record(anyelement, plpgsql)。"
  source_anchor: "1.13.7.11 参数说明/示例 页1215-1216"
  source_refs: *refext
  status: confirmed
- id: alter_function_wave8_95_syntax
  type: syntax
  statement: "ALTER FUNCTION修改自定义函数的属性或重编译函数；五种形式：ALTER FUNCTION function_name ( [ { [ argname ] [ argmode ] argtype} [, ...] ] ) action [ ... ] [ RESTRICT ]（附加参数）、RENAME TO new_name、OWNER TO new_owner、SET SCHEMA new_schema、COMPILE；action子句包括{CALLED ON NULL INPUT | RETURNS NULL ON NULL INPUT | STRICT}、{IMMUTABLE | STABLE | VOLATILE}、{SHIPPABLE | NOT SHIPPABLE}、{NOT FENCED | FENCED}、[ NOT ] LEAKPROOF、{ [ EXTERNAL ] SECURITY INVOKER | [ EXTERNAL ] SECURITY DEFINER }、AUTHID { DEFINER | CURRENT_USER }、COST execution_cost、ROWS result_rows、SET configuration_parameter { { TO | = } { value | DEFAULT }| FROM CURRENT}、RESET {configuration_parameter | ALL}。"
  source_anchor: "1.13.7.14 语法格式 页1220-1222"
  source_refs: &reffunc
  - w8_95_1_13_7_14
  status: confirmed
- id: alter_function_wave8_95_permission
  type: constraint
  statement: "只有函数的所有者或者被授予了函数ALTER权限的用户才能执行ALTER FUNCTION，系统管理员默认拥有该权限；函数中涉及临时表相关操作则无法使用ALTER FUNCTION；修改函数所有者或模式时当前用户必须是该函数所有者或系统管理员且是新所有者角色的成员；只有系统管理员和初始用户可以将函数的Schema修改成PUBLIC；修改函数属性受GUC参数using_danger_feature影响；仅有初始化用户或创建该存储过程的用户可以修改存储过程为定义者权限的存储过程；三权分立打开时定义者权限函数不允许任何角色修改所有者，关闭时仅初始用户和系统管理员可修改；只有初始化用户才能修改函数的所有者为初始化用户。"
  source_anchor: "1.13.7.14 注意事项 页1220"
  source_refs: *reffunc
  status: confirmed
- id: alter_function_wave8_95_action_semantics
  type: constraint
  statement: "action语义：CALLED ON NULL INPUT参数为NULL时可正常调用（缺省相同）；STRICT/RETURNS NULL ON NULL INPUT存在NULL参数时不执行函数直接返回NULL（两者功能相同）；IMMUTABLE同样参数值总返回同样结果；STABLE不能修改数据库、同一次表扫描内返回值不变；VOLATILE一次表扫描内可变不做优化；LEAKPROOF无副作用只能由系统管理员设置；SECURITY INVOKER与AUTHID CURRENT_USER功能相同（调用者权限执行，缺省相同）；SECURITY DEFINER与AUTHID DEFINER功能相同（创建者权限执行）；COST execution_cost以cpu_operator_cost为单位取正数；ROWS result_rows估计返回行数取正数默认1000。"
  source_anchor: "1.13.7.14 参数说明 页1222-1223"
  source_refs: *reffunc
  status: confirmed
- id: alter_function_wave8_95_params
  type: constraint
  statement: "SET configuration_parameter：DEFAULT/OFF/RESET在新会话中使用系统缺省设置，用户指定值需满足修改参数的取值限制；FROM CURRENT取当前会话中的值设置为configuration_parameter的值；修改函数所属模式必须拥有新模式的CREATE权限；修改函数所有者时新所有者必须拥有该函数所属模式的CREATE权限，且仅初始化用户可以将函数的所有者设置为初始化用户。"
  source_anchor: "1.13.7.14 参数说明 页1223"
  source_refs: *reffunc
  status: confirmed
- id: alter_function_wave8_95_example
  type: behavior_oracle
  statement: "示例：ALTER FUNCTION test_func(a int) RENAME TO test_func_tk改名；CREATE USER jim后OWNER TO jim改所有者；CREATE SCHEMA test后SET SCHEMA test改模式；重编译：ALTER FUNCTION test.test_func_tk COMPILE（函数名方式）与ALTER FUNCTION test.test_func_tk(a int) COMPILE（带类型签名方式）；相关链接CREATE FUNCTION、DROP FUNCTION。"
  source_anchor: "1.13.7.14 示例 页1224"
  source_refs: *reffunc
  status: confirmed
open_questions:
