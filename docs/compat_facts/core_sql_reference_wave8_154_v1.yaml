  type: syntax
  statement: "GETCHUNKSIZE原型：DBE_LOB.GETCHUNKSIZE(lob_loc IN CLOB) RETURN INTEGER与DBE_LOB.GETCHUNKSIZE(lob_loc IN BLOB) RETURN INTEGER；数据库存储LOB类型对象时内部使用toast存储，本函数返回TOAST_MAX_CHUNK_SIZE。"
