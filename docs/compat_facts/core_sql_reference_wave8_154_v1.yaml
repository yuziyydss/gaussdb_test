- id: dbelob_wave8_154_plain_vs_lob_load
  type: constraint
  statement: "装载/转换族版本差异：INTEGER版（LOADFROMFILE/LOADBLOBFROMFILE/LOADCLOBFROMFILE/CONVERTTOBLOB/CONVERTTOCLOB）参数与返回均为INTEGER/RAW/text，不支持大于1GB场景；BFILE版（LOADFROMBFILE/LOADBLOBFROMBFILE/LOADCLOBFROMBFILE/LOB_CONVERTTOBLOB/LOB_CONVERTTOCLOB）为BIGINT与INOUT偏移，支持超过1GB最大32TB。"
  source_anchor: "3.12.2.10 装载/转换族对比 页2784-2790"
  source_refs: *reflt
  status: confirmed
