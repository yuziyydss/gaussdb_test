- id: dbelob_wave8_154_example_lob_ops
  type: behavior_oracle
  statement: "多接口示例基线：blob_Table/blob_Table_bak以for update选出dest/copyto后，WRITE(dest, amount, 1, source)、WRITE_APPEND(dest, amount, source)、ERASE(dest, a, 1)输出a=1、COPY(copyto, dest, amount, 10, 1)、CLOSE(dest)，随后删除两张表。"
  source_anchor: "3.12.2.10 示例 页2792-2793"
  source_refs: *reflt
