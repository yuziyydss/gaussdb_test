  type: syntax
  statement: "FREETEMPORARY原型：DBE_LOB.FREETEMPORARY(blob INOUT BLOB)与DBE_LOB.FREETEMPORARY(clob INOUT CLOB)；用于释放由CREATE_TEMPORARY创建的LOB类型对象。"
  source_anchor: "3.12.2.10 FREETEMPORARY 页2782"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_append_pair
  type: syntax
  statement: "拼接函数对：APPEND(blob_obj INOUT BLOB, source_obj IN BLOB)与CLOB版、LOB_APPEND（同签名）均将source_obj拼接在目标LOB类型对象之后。"
