  type: constraint
  statement: "BFILENAME：DBE_LOB.BFILENAME(directory IN TEXT, filename IN TEXT) RETURN DBE_LOB.BFILE根据目录和文件名构造BFILE文件；目录需在PG_DIRECTORY注册（不匹配报路径不存在）、safe_data_path开启时仅能操作白名单路径；文件名包含扩展不含路径名（含路径被忽略，Unix系统不能以/.结尾）。"
  source_anchor: "3.12.2.10 BFILENAME 页2792"
