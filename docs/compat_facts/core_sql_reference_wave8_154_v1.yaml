- id: dbelob_wave8_154_bfile_type
  type: syntax
  statement: "BFILE类型定义：DBE_LOB.BFILE(directory TEXT, filename TEXT, fd INTEGER)；该类型包含文件路径（directory）、文件名（filename）与文件描述符（fd）。"
  source_anchor: "3.12.2.10 FILEOPEN 页2782-2783"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_fileopen
  type: constraint
  statement: "FILEOPEN：DBE_LOB.FILEOPEN(bfile IN DBE_LOB.BFILE, open_mode IN TEXT) RETURN INTEGER打开数据库外部BFILE文件并返回文件描述符fd；一个会话最多支持打开10个BFILE文件；open_mode只支持read模式（r）、其他模式报错；bfile中的目录需在PG_DIRECTORY注册（不匹配报路径不存在）、safe_data_path开启时仅能操作白名单路径；文件名包含扩展不含路径名（含路径被忽略，Unix系统不能以/.结尾）。"
  source_anchor: "3.12.2.10 FILEOPEN 页2782-2783"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_fileclose_bfileopen
  type: syntax
  statement: "BFILE开关对：DBE_LOB.FILECLOSE(file IN INTEGER)关闭由FILEOPEN返回的fd对应的外部BFILE文件；DBE_LOB.BFILEOPEN(bfile INOUT DBE_LOB.BFILE, open_mode IN TEXT DEFAULT 'R')打开外部BFILE（一个会话最多10个）；DBE_LOB.BFILECLOSE(bfile INOUT DBE_LOB.BFILE)关闭由BFILEOPEN打开的BFILE。"
  source_anchor: "3.12.2.10 FILECLOSE/BFILEOPEN/BFILECLOSE 页2783-2784"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_bfileopen_example
  type: behavior_oracle
  statement: "BFILE读取示例基线：bfile = DBE_LOB.BFILENAME(dir_name, file_name)后BFILEOPEN(bfile,'r')，DBE_LOB.lob_substr(bfile, 1, 1)对内容为ABCD的文件输出NOTICE res:41，最后BFILECLOSE关闭。"
  source_anchor: "3.12.2.10 BFILEOPEN示例 页2784"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_loadfromfile
  type: constraint
  statement: "LOADFROMFILE：DBE_LOB.LOADFROMFILE(dest_lob IN BLOB, src_file IN INTEGER, amount IN INTEGER, dest_offset IN INTEGER, src_offset IN INTEGER) RETURN RAW将BFILE外部文件读取到BLOB指定偏移；amount小于1或大于32767报错；dest_offset/src_offset小于1或大于LOBMAXSIZE报错；amount+src_offset大于src_bfile长度+1则报错。"
  source_anchor: "3.12.2.10 LOADFROMFILE 页2784-2785"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_loadfrombfile
  type: syntax
  statement: "LOADFROMBFILE原型（双原型）：DBE_LOB.LOADFROMBFILE(dest_lob INOUT BLOB, src_file IN DBE_LOB.BFILE, amount IN BIGINT, dest_offset IN BIGINT DEFAULT 1, src_offset IN BIGINT DEFAULT 1) RETURN BLOB与CLOB版 RETURN CLOB；将BFILE读取到LOB类型对象（支持超过1GB最大32TB）；amount小于1或大于LOBMAXSIZE报错。"
  source_anchor: "3.12.2.10 LOADFROMBFILE 页2785-2786"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_loadblobfromfile_pair
  type: constraint
  statement: "BLOB装载对：LOADBLOBFROMFILE(dest_lob IN BLOB, src_file IN INTEGER, amount IN INTEGER, dest_offset IN INTEGER, src_offset IN INTEGER)为INTEGER版（接口表标注不支持大于1GB）；LOADBLOBFROMBFILE(dest_lob INOUT BLOB, src_file IN DBE_LOB.BFILE, amount IN BIGINT, dest_offset/src_offset INOUT BIGINT)为BIGINT版（大小支持超过1GB最大32TB，src_file必须先BFILEOPEN）；amount为BLOB长度阈值、长度小于1或大于LOBMAXSIZE报错。"
  source_anchor: "3.12.2.10 LOADBLOBFROMFILE/LOADBLOBFROMBFILE 页2786-2787"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_loadclobfromfile_pair
  type: syntax
  statement: "CLOB装载对：LOADCLOBFROMFILE(dest_lob IN CLOB, src_file IN INTEGER, amount IN INTEGER, dest_offset IN INTEGER, src_offset IN INTEGER) RETURN RAW（说明称以RAW类型返回该对象）；LOADCLOBFROMBFILE(dest_lob INOUT CLOB, src_file IN DBE_LOB.BFILE, amount IN BIGINT, dest_offset/src_offset INOUT BIGINT)为支持超过1GB的BIGINT版；amount为CLOB长度阈值。"
  source_anchor: "3.12.2.10 LOADCLOBFROMFILE/LOADCLOBFROMBFILE 页2787-2788"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_load_offset_rule
  type: constraint
  statement: "LOAD族共同偏移规则：dest_offset与src_offset小于1或大于LOBMAXSIZE则报错；amount + src_offset大于src_bfile的长度+1则报错。"
  source_anchor: "3.12.2.10 LOAD族参数说明 页2785-2788"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_converttoblob_pair
  type: syntax
  statement: "CLOB转BLOB函数对：CONVERTTOBLOB(dest_blob IN BLOB, src_clob IN CLOB, amount IN INTEGER DEFAULT 32767, dest_offset/src_offset IN INTEGER DEFAULT 1) RETURN RAW不支持大于1GB场景；LOB_CONVERTTOBLOB(dest_blob INOUT BLOB, src_clob IN CLOB, amount IN BIGINT, dest_offset/src_offset INOUT BIGINT)支持大于1GB；amount（CLOB长度阈值）小于1或大于LOBMAXSIZE报错，dest_offset=1从起始位置载入。"
  source_anchor: "3.12.2.10 CONVERTTOBLOB/LOB_CONVERTTOBLOB 页2788-2789"
  source_refs: *reflt
  status: confirmed
- id: dbelob_wave8_154_converttoclob_pair
  type: syntax
  statement: "BLOB转CLOB函数对：CONVERTTOCLOB(dest_clob IN CLOB, src_blob IN BLOB, amount IN INTEGER DEFAULT 32767, dest_offset/src_offset IN INTEGER DEFAULT 1) RETURN text不支持大于1GB场景；LOB_CONVERTTOCLOB(dest_clob INOUT CLOB, src_blob IN BLOB, amount IN BIGINT, dest_offset/src_offset INOUT BIGINT)支持大于1GB；amount为BLOB长度阈值，offset=1从起始位置开始。"
  source_anchor: "3.12.2.10 CONVERTTOCLOB/LOB_CONVERTTOCLOB 页2789-2790"
  source_refs: *reflt
  status: confirmed
