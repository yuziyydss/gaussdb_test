- id: dbelob_wave8_154_lob_write
  type: syntax
  statement: "LOB_WRITE原型：DBE_LOB.LOB_WRITE(clob_obj INOUT CLOB, amount IN INTEGER, off_set IN BIGINT, source IN VARCHAR2) RETURN CLOB与BLOB版（source IN RAW）RETURN BLOB；将源对象从起始位置读取指定长度内容写入目标LOB指定偏移位置、覆盖该位置已有内容并返回目标LOB；amount BLOB以字节、CLOB以字符为单位。"
