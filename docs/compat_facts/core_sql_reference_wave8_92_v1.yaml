facts:
- id: create_audit_policy_wave8_92_syntax
  type: syntax
  statement: "CREATE AUDIT POLICY创建审计策略；语法为CREATE AUDIT POLICY [ IF NOT EXISTS ] policy_name { { privilege_audit_clause | access_audit_clause } [, ...] [ filter_group_clause ] [ ENABLE | DISABLE ] }；privilege_audit_clause为PRIVILEGES { PRIVILEGES | ALL } [ ON LABEL ( resource_label_name [, ... ] ) ]；access_audit_clause为ACCESS { ACCESS | ALL } [ ON LABEL ( resource_label_name [, ... ] ) ]；filter_group_clause为FILTER ON { FILTER_TYPE ( filter_value [, ... ] ) } [, ... ]。"
  source_anchor: "1.13.9.11 语法格式 页1402-1403"
  source_refs: &refaudit
  - w8_92_1_13_9_11
  status: confirmed
- id: create_audit_policy_wave8_92_permission
  type: environment
  statement: "审计策略的创建与维护有权限限制，只有POLADMIN、SYSADMIN或初始用户有权限进行此操作；创建前需开启安全策略开关（GUC参数enable_security_policy为on）后脱敏策略才会生效；系统管理员或安全策略管理员可访问GS_AUDITING_POLICY、GS_AUDITING_POLICY_ACCESS、GS_AUDITING_POLICY_PRIVILEGES和GS_AUDITING_POLICY_FILTERS系统表查询已创建的审计策略。"
  source_anchor: "1.13.9.11 注意事项 页1402"
  source_refs: *refaudit
  status: confirmed
- id: create_audit_policy_wave8_92_name_rules
  type: constraint
  statement: "审计策略名称应具有唯一性避免与现有策略冲突，可使用IF NOT EXISTS检查是否存在以避免重复创建；policy_name符合标识符命名规范且最大长度不超过63字符：超过时截断保留前63字符；含大写自动转小写（需大写须双引号包裹）；仅允许小写字母、大写字母、下划线、数字或美元符号且必须以字母或下划线开头。"
  source_anchor: "1.13.9.11 注意事项/参数说明 policy_name 页1402,1404"
  source_refs: *refaudit
  status: confirmed
- id: create_audit_policy_wave8_92_privileges_ops
  type: constraint
  statement: "PRIVILEGES针对数据库执行如下操作时进行审计，目前支持：CREATE、ALTER、DROP、ANALYZE、COMMENT、GRANT、REVOKE、SET以及SHOW操作；当取值为ANALYZE时，进行ANALYZE和VACUUM操作都会被审计。"
  source_anchor: "1.13.9.11 语法格式/参数说明 PRIVILEGES 页1403-1404"
  source_refs: *refaudit
  status: confirmed
- id: create_audit_policy_wave8_92_access_ops
  type: constraint
  statement: "ACCESS针对数据库执行如下操作时进行审计，目前支持：SELECT、COPY、DEALLOCATE、DELETE、EXECUTE、INSERT、PREPARE、REINDEX、TRUNCATE以及UPDATE操作；ALL在{ PRIVILEGES | ALL }形式下指所有PRIVILEGES操作，在{ ACCESS | ALL }形式下指所有ACCESS操作；ENABLE | DISABLE打开或关闭统一审计策略，若不指定默认为ENABLE。"
  source_anchor: "1.13.9.11 语法格式/参数说明 页1403-1404"
  source_refs: *refaudit
  status: confirmed
- id: create_audit_policy_wave8_92_filter_types
  type: constraint
  statement: "FILTER_TYPE描述策略过滤的条件类型，包括APP、ROLES、IP三种；filter_value为具体过滤信息内容；resource_label_name为资源标签名称。"
  source_anchor: "1.13.9.11 语法格式/参数说明 页1403-1404"
  source_refs: *refaudit
  status: confirmed
- id: create_audit_policy_wave8_92_example_adt1_adt2
  type: behavior_oracle
  statement: "示例：CREATE AUDIT POLICY adt1 PRIVILEGES CREATE后SELECT * FROM GS_AUDITING_POLICY显示polname=adt1且polenabled=t，SHOW audit_directory可查看审计日志存放位置，DROP AUDIT POLICY adt1删除；仅审计dev_audit用户CREATE操作：CREATE RESOURCE LABEL adt_lb0 add TABLE(public.tb_for_audit)后CREATE AUDIT POLICY adt2 PRIVILEGES CREATE ON LABEL(adt_lb0) FILTER ON ROLES(dev_audit)。"
  source_anchor: "1.13.9.11 示例 页1404-1405"
  source_refs: *refaudit
  status: confirmed
- id: create_audit_policy_wave8_92_example_adt3
  type: behavior_oracle
  statement: "组合过滤示例：CREATE AUDIT POLICY adt3 ACCESS SELECT ON LABEL(adt_lb0), INSERT ON LABEL(adt_lb0), DELETE FILTER ON ROLES(dev_audit), APP(gsql), IP('10.20.30.40', '127.0.0.0/24')——仅审计记录用户dev_audit、客户端工具为gsql、IP为'10.20.30.40'和'127.0.0.0/24'时对adt_lb0资源执行的SELECT、INSERT、DELETE操作。"
  source_anchor: "1.13.9.11 示例 页1405"
  source_refs: *refaudit
  status: confirmed
- id: create_audit_policy_wave8_92_dblink_note
  type: environment
  statement: "在使用DATABASE LINK功能的场景下，客户端发起的DATABASE LINK请求实际的发送方是服务端，发送端IP地址等相关的属性将是服务端的值（详见《开发指南》DATABASE LINK章节）。"
  source_anchor: "1.13.9.11 注意事项 须知 页1402"
  source_refs: *refaudit
  status: confirmed
- id: create_table_partition_as_wave8_92_purpose
  type: syntax
  statement: "CREATE TABLE PARTITION | SUBPARTITION AS根据查询结果创建分区表，并用来自SELECT命令的结果填充该分区表，数据按指定的分区策略进行分区；分区表的字段和SELECT输出字段的名称及数据类型相关，可通过指定字段名称列表对SELECT输出字段的名称进行覆盖替换。"
  source_anchor: "1.13.9.51 功能描述 页1582-1583"
  source_refs: &refctp
  - w8_92_1_13_9_51
  status: confirmed
- id: create_table_partition_as_wave8_92_syntax
  type: syntax
  statement: "一级分区表：CREATE TABLE [ IF NOT EXISTS ] partition_table_name [ (column_name [, ...]) ] [ { ENGINE [ = ] { InnoDB | 'InnoDB' | \"InnoDB\" } } [ [,] ... ] ] [ WITH ( {storage_parameter = value} [, ...] ) ] [ ILM ADD POLICY ROW STORE COMPRESS {...} ] [ TABLESPACE tablespace_name ] PARTITION BY partition_clause partition_definition_list AS query [ WITH [ NO ] DATA ]；二级分区表再接SUBPARTITION BY subpartition_clause partition_subpartition_definition_list。"
  source_anchor: "1.13.9.51 语法格式 页1583"
  source_refs: *refctp
  status: confirmed
- id: create_table_partition_as_wave8_92_if_not_exists_engine
  type: constraint
  statement: "IF NOT EXISTS创建表前在当前Schema查找同名relation：存在同名时不会新建并返回NOTICE提示，未指定时存在同名relation返回ERROR告警；ENGINE仅B模式下支持、仅语法适配且只支持设置InnoDB，无实际效果；column_name可选，未指定字段名时新表字段名和SELECT语句输入的字段名一致。"
  source_anchor: "1.13.9.51 参数说明 页1583"
  source_refs: *refctp
  status: confirmed
- id: create_table_partition_as_wave8_92_encryption_params
  type: constraint
  statement: "WITH存储参数支持透明加密相关存储参数：enable_tde、encrypt_algo、dek_cipher、key_type、cmk_id，详细说明参见CREATE TABLE章节。"
  source_anchor: "1.13.9.51 参数说明 WITH 说明 页1583-1584"
  source_refs: *refctp
  status: confirmed
- id: create_table_partition_as_wave8_92_fillfactor_orientation
  type: constraint
  statement: "FILLFACTOR为表填充因子，取值10~100的百分数：Ustore引擎默认92，Astore引擎默认100（完全填充）；较小填充因子使INSERT按指定百分率填充表页、剩余空间用于同页更新行，对频繁更新的表建议较小值、从不更新的表建议100；该参数只对行存表有效；ORIENTATION取值ROW（行式存储），默认ROW。"
  source_anchor: "1.13.9.51 参数说明 页1584"
  source_refs: *refctp
  status: confirmed
- id: create_table_partition_as_wave8_92_autovacuum_params
  type: constraint
  statement: "autovacuum_enabled取值on/off默认on；autovacuum_vacuum_threshold与autovacuum_analyze_threshold取值0~2147483647、autovacuum_vacuum_scale_factor与autovacuum_analyze_scale_factor取值0.0~100.0（未指定时与对应GUC参数一致，仅对Astore表生效）；autovacuum_freeze_min_age取值0~576460752303423487（默认GUC vacuum_freeze_min_age）；autovacuum_freeze_max_age取值100000~576460752303423487，pg_class.relfrozenxid超过指定事务数后强制执行VACUUM（仅对Astore表生效）。"
  source_anchor: "1.13.9.51 参数说明 页1584-1585"
  source_refs: *refctp
  status: confirmed
- id: create_table_partition_as_wave8_92_ilm_advanced
  type: constraint
  statement: "ILM ADD POLICY ROW STORE COMPRESS ADVANCED [ MEDIUM | HIGH ] ROW为行存添加高级压缩中/高级别策略：AFTER n { day | month | year } OF NO MODIFICATION表示n天/月/年没有修改的行（高级压缩不支持hour）；ON ( EXPR )为判断行冷热的行级表达式；压缩级别可选项，不指定时默认使用MEDIUM级别。"
  source_anchor: "1.13.9.51 参数说明 ILM 页1585-1586"
  source_refs: *refctp
  status: confirmed
- id: create_table_partition_as_wave8_92_ilm_turbo_none
  type: constraint
  statement: "ILM ADD POLICY ROW STORE COMPRESS TURBO [ LOW | MEDIUM | HIGH ] UNIT为行存添加跨页透明压缩策略，AFTER n { hour | day | month | year } OF NO MODIFICATION表示n小时/天/月/年没有修改的行，压缩级别不指定时默认为MEDIUM；ILM ADD POLICY ROW STORE COMPRESS NONE显式指定行存表不添加跨页透明压缩策略。"
  source_anchor: "1.13.9.51 参数说明 ILM 页1586"
  source_refs: *refctp
  status: confirmed
- id: create_table_partition_as_wave8_92_ilm_expr_note
  type: environment
  statement: "ILM策略的ON ( EXPR )行级表达式支持的函数中，部分函数的输出可能会受兼容性参数影响：例如upper函数在B兼容模式下设置b_format_version='5.7'和b_format_dev_version='s2'后将无法转换为大写。"
  source_anchor: "1.13.9.51 参数说明 ILM 说明 页1585-1586"
  source_refs: *refctp
  status: confirmed
- id: create_table_partition_as_wave8_92_misc
  type: constraint
  statement: "TABLESPACE tablespace_name指定新表在指定表空间内创建，未声明使用默认表空间；AS query为一个SELECT VALUES命令或者一个运行预备好的SELECT或VALUES查询的EXECUTE命令；[ WITH [ NO ] DATA ]创建分区表时是否同时插入查询到的数据，默认插入，指定NO时不插入数据。"
  source_anchor: "1.13.9.51 参数说明 页1586"
  source_refs: *refctp
  status: confirmed
- id: create_table_partition_as_wave8_92_example
  type: behavior_oracle
  statement: "一级示例：源表t1插入(8,2),(18,3),(28,4)后CREATE TABLE t1_part_dup PARTITION BY RANGE(a) (PARTITION p1 VALUES LESS THAN(10), p2 VALUES LESS THAN(20), p3 VALUES LESS THAN(MAXVALUE)) AS SELECT * FROM t1；\\d+显示Partition By RANGE(a)、Number of partitions: 3；SELECT ... PARTITION(p1/p2/p3)分别返回8|2、18|3、28|4。二级示例：t1按RANGE(a)分区RANGE(b)子分区（3分区各2子分区）插入6行后CREATE TABLE t1_part_dup PARTITION BY RANGE(a) SUBPARTITION BY RANGE(b) (...) AS SELECT * FROM t1填充；清理DROP TABLE t1,t1_part_dup。"
  source_anchor: "1.13.9.51 示例 页1586-1588"
  source_refs: *refctp
  status: confirmed
open_questions:
- id: create_audit_ctpas_wave8_92_oq_runtime
  statement: "统一审计策略在PRIVILEGES/ACCESS与APP/ROLES/IP组合过滤下的实际审计日志记录行为、ILM高级压缩与跨页透明压缩在真实负载下的压缩率及性能影响、CREATE TABLE PARTITION AS透明加密与分区填充组合在授权环境下的完整行为矩阵需实机验证。"
  status: open
