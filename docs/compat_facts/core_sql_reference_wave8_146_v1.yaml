- id: dbexml_wave8_146_parser_lifecycle
  type: syntax
  statement: "PARSER生命周期：XML_NEW_PARSER() RETURNS RAW(13)新建PARSER对象返回新的解析器实例；XML_PARSE_BUFFER/XML_PARSE_CLOB解析文档；XML_PARSER_GET_DOC获取解析的document节点；XML_GET_VALIDATION_MODE获取validate属性、XML_SET_VALIDATION_MODE设置验证模式；parser初始化默认为开启DTD验证模式，XML_SET_VALIDATION_MODE的validate传入为空时不改变parser的解析验证模式。"
  source_anchor: "3.12.1.3 PARSER族函数 页2695-2699"
  source_refs: *refx
  status: confirmed
- id: dbexml_wave8_146_parse_buffer
  type: syntax
  statement: "XML_PARSE_BUFFER原型：DBE_XML.XML_PARSE_BUFFER(id RAW(13), xmlstr VARCHAR2) RETURNS VOID；解析存储在字符串中的XML文档；该函数能够解析的字符串最大长度为32767，超过最大长度解析报错。"
  source_anchor: "3.12.1.3 XML_PARSE_BUFFER 页2696-2697"
  source_refs: *refx
  status: confirmed
- id: dbexml_wave8_146_parse_a_diff
  type: constraint
  statement: "XML解析与A数据库差异：字符串encoding只支持UTF-8；version字段只支持1.0（1.0-1.9解析警告但正常执行、1.9以上报错）；DTD校验差异——!ATTLIST默认值不属于括号中枚举值将报错而A数据库不报错、ENTITY区分字母大小写（Baidu无法与baidu对应报错）；命名空间校验差异——解析未声明的命名空间标签正常执行而A数据库会报错；XML预定义实体解析差异——&apos;&quot;会被解析转义为字符而A数据库预定义实体统一没有转义为字符。"
  source_anchor: "3.12.1.3 XML_PARSE_BUFFER/XML_PARSE_CLOB说明 页2697-2698"
  source_refs: *refx
  status: confirmed
- id: dbexml_wave8_146_parse_clob
  type: constraint
  statement: "XML_PARSE_CLOB原型：DBE_XML.XML_PARSE_CLOB(id IN RAW(13), doc IN CLOB) RETURNS VOID；解析存储在CLOB中的XML文档；不支持解析大于等于2GB的CLOB；与A数据库差异与XML_PARSE_BUFFER一致（encoding UTF-8、version、DTD校验、命名空间校验、预定义实体）。"
  source_anchor: "3.12.1.3 XML_PARSE_CLOB 页2697-2698"
  source_refs: *refx
  status: confirmed
