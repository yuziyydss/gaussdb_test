facts:
- id: altertrigger_wave8_40_purpose
  type: syntax
  statement: "ALTER TRIGGER用于修改触发器名称及所有者；当前仅支持修改触发器的名称及所有者。"
  source_anchor: "1.13.7.42 页1337"
  source_refs: &refalt
  - w8_40_1_13_7_42
  status: confirmed
- id: altertrigger_wave8_40_permissions
  type: constraint
  statement: "触发器所在表的所有者或被授予ALTER ANY TRIGGER权限的用户可执行ALTER TRIGGER，系统管理员默认拥有该权限。"
  source_anchor: "1.13.7.42 注意事项 页1337"
  source_refs: *refalt
  status: confirmed
- id: altertrigger_wave8_40_owner_permissions
  type: constraint
  statement: "修改触发器owner时，当前用户必须是触发器所有者或系统管理员，且必须是新owner所属角色的直接或间接成员；新owner必须对触发器所在模式有CREATE权限。三权分立关闭时系统管理员默认拥有该权限，打开时系统管理员默认没有该权限。"
  source_anchor: "1.13.7.42 注意事项 页1337"
  source_refs: *refalt
  status: confirmed
- id: altertrigger_wave8_40_owner_initial_user
  type: constraint
  statement: "只有初始化用户才能修改触发器的owner为初始化用户。"
  source_anchor: "1.13.7.42 注意事项 页1337"
  source_refs: *refalt
  status: confirmed
- id: altertrigger_wave8_40_rename_syntax
  type: syntax
  statement: "ALTER TRIGGER trigger_name ON table_name RENAME TO new_name用于修改触发器名称。"
  source_anchor: "1.13.7.42 语法格式 页1337"
  source_refs: *refalt
  status: confirmed
- id: altertrigger_wave8_40_owner_syntax
  type: syntax
  statement: "ALTER TRIGGER trigger_name ON table_name OWNER TO new_owner用于修改触发器所有者。"
  source_anchor: "1.13.7.42 语法格式 页1337"
  source_refs: *refalt
  status: confirmed
- id: altertrigger_wave8_40_trigger_table_params
  type: syntax
  statement: "trigger_name必须为已存在触发器；table_name必须为已存在且包含触发器的表。"
  source_anchor: "1.13.7.42 参数说明 页1337"
  source_refs: *refalt
  status: confirmed
- id: altertrigger_wave8_40_new_name
  type: constraint
  statement: "修改后的触发器新名称不能与所在表上其他触发器同名，必须符合标识符命名规范且最大长度不超过63个字符。"
  source_anchor: "1.13.7.42 new_name 页1338"
  source_refs: *refalt
  status: confirmed
- id: altertrigger_wave8_40_new_owner
  type: syntax
  statement: "new_owner为修改后的触发器新owner名称，取值范围是数据库中已存在用户。"
  source_anchor: "1.13.7.42 new_owner 页1338"
  source_refs: *refalt
  status: confirmed
- id: altertrigger_wave8_40_rename_owner_example
  type: behavior_oracle
  statement: "示例中ALTER TRIGGER可将delete_trigger重命名为delete_trigger_renamed，并可通过OWNER TO将触发器owner修改为已存在用户jack。"
  source_anchor: "1.13.7.42 示例 页1338"
  source_refs: *refalt
  status: confirmed
- id: altertrigger_wave8_40_lifecycle
  type: syntax
  statement: "ALTER TRIGGER与CREATE TRIGGER、DROP TRIGGER和ALTER TABLE构成触发器生命周期关联链路。"
  source_anchor: "1.13.7.42 相关链接 页1338"
  source_refs: *refalt
  status: confirmed
- id: droptrigger_wave8_40_purpose_permissions
  type: constraint
  statement: "DROP TRIGGER用于删除一个触发器；触发器所有者或被授予DROP ANY TRIGGER权限的用户可执行，系统管理员默认拥有该权限。"
  source_anchor: "1.13.10.45 注意事项 页1696"
  source_refs: &refdrop
  - w8_40_1_13_10_45
  status: confirmed
- id: droptrigger_wave8_40_syntax
  type: syntax
  statement: "DROP TRIGGER [IF EXISTS] name ON table_name [CASCADE|RESTRICT]用于删除指定表上的触发器。"
  source_anchor: "1.13.10.45 语法格式 页1696"
  source_refs: *refdrop
  status: confirmed
- id: droptrigger_wave8_40_if_exists
  type: constraint
  statement: "IF EXISTS判断指定触发器是否存在；触发器存在则删除成功，不存在时不执行删除并仅产生NOTICE提示。"
  source_anchor: "1.13.10.45 IF EXISTS 页1697"
  source_refs: *refdrop
  status: confirmed
- id: droptrigger_wave8_40_names
  type: syntax
  statement: "trigger_name必须为已存在触发器；table_name必须为已存在且包含触发器的表。"
  source_anchor: "1.13.10.45 参数说明 页1697"
  source_refs: *refdrop
  status: confirmed
- id: droptrigger_wave8_40_cascade_restrict
  type: syntax
  statement: "CASCADE|RESTRICT控制是否级联删除依赖该触发器的对象；CASCADE级联删除依赖对象，RESTRICT在存在依赖对象时拒绝删除，未指定时默认RESTRICT。"
  source_anchor: "1.13.10.45 CASCADE/RESTRICT 页1697"
  source_refs: *refdrop
  status: confirmed
- id: droptrigger_wave8_40_anonyblock_function
  type: behavior_oracle
  statement: "使用匿名块语法创建触发器时会隐式创建同名函数；删除该触发器时会将隐式创建的函数一起删除。"
  source_anchor: "1.13.10.45 示例 页1698"
  source_refs: *refdrop
  status: confirmed
- id: droptrigger_wave8_40_disable_single
  type: behavior_oracle
  statement: "ALTER TABLE table_name DISABLE TRIGGER trigger_name可禁用指定触发器；禁用后执行INSERT不会触发对应触发器动作。"
  source_anchor: "1.13.10.45 示例 页1699"
  source_refs: *refdrop
  status: confirmed
- id: droptrigger_wave8_40_disable_all
  type: syntax
  statement: "ALTER TABLE table_name DISABLE TRIGGER ALL可禁用当前表上所有触发器。"
  source_anchor: "1.13.10.45 示例 页1699"
  source_refs: *refdrop
  status: confirmed
- id: droptrigger_wave8_40_lifecycle
  type: syntax
  statement: "DROP TRIGGER与ALTER TRIGGER、CREATE TRIGGER和ALTER TABLE构成触发器生命周期关联链路。"
  source_anchor: "1.13.10.45 相关链接 页1700"
  source_refs: *refdrop
  status: confirmed
