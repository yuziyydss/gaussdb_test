facts:
- id: dbesession_wave8_160_overview
  type: syntax
  statement: "DBE_SESSION作用范围是会话级别；接口包括SET_CONTEXT（设置指定context下某一attribute的值value）、CLEAR_CONTEXT（清除指定context下某一属性的值）、SEARCH_CONTEXT（查找指定context下某一属性的值）、MODIFY_PACKAGE_STATE（用于修改当前会话的PL/SQL的状态）。"
  source_anchor: "3.12.2.18 DBE_SESSION 表3-328 页2861-2862"
  source_refs: &refss
  - w8_160_3_12
  status: confirmed
- id: dbesession_wave8_160_set_context
  type: syntax
  statement: "SET_CONTEXT原型：DBE_SESSION.SET_CONTEXT(namespace text, attribute text, value text) returns void；向指定namespace(context)下设置某一属性的值；namespace最长支持128个字节超长截断（context不存在时新建），attribute/value最长支持1024个字节超长截断。"
  source_anchor: "3.12.2.18 SET_CONTEXT 页2862"
  source_refs: *refss
  status: confirmed
- id: dbesession_wave8_160_clear_context
  type: syntax
  statement: "CLEAR_CONTEXT原型：DBE_SESSION.CLEAR_CONTEXT(namespace text, client_identifier text default null, attribute text default null) returns void；清除指定context下某一属性的值；namespace最长128字节；client_identifier默认null通常无需手动设置；attribute默认null表示清除指定context的所有属性（最长1024字节），为保证前向兼容参数值为字符串'null'时也会清除指定context的所有属性。"
  source_anchor: "3.12.2.18 CLEAR_CONTEXT 页2862-2863"
  source_refs: *refss
  status: confirmed
- id: dbesession_wave8_160_search_modify
  type: syntax
  statement: "SEARCH_CONTEXT与MODIFY_PACKAGE_STATE：SEARCH_CONTEXT(namespace text, attribute text) returns text查找指定context下某一属性的值（namespace最长128字节、attribute最长1024字节，超长截断）；MODIFY_PACKAGE_STATE(flags int)修改当前会话PL/SQL状态——flags=1时执行完最顶层PL/SQL代码后释放会话中当前运行的PL/SQL会话缓存、清除所有包全局变量当前值并关闭缓存的游标（后续使用时重新实例化并重新初始化包全局），不支持其他位标志；示例CALL dbe_session.modify_package_state(1)。"
  source_anchor: "3.12.2.18 SEARCH_CONTEXT/MODIFY_PACKAGE_STATE 页2863-2864"
  source_refs: *refss
  status: confirmed
- id: dbesession_wave8_160_example
  type: behavior_oracle
  statement: "DBE_SESSION示例基线：set_context('test','gaussdb','one')后search_context('test','gaussdb')经PRINT_LINE输出one，最后clear_context('test','test','gaussdb')清理。"
  source_anchor: "3.12.2.18 示例 页2863"
  source_refs: *refss
  status: confirmed
- id: dbesql_wave8_160_desc_types
  type: syntax
  statement: "DBE_SQL数据类型（一）：DESC_REC为复合类型，存储SQL_DESCRIBE_COLUMNS接口的描述信息（col_type/col_max_len/col_name VARCHAR2(32)/col_name_len/col_schema_name VARCHAR2(32)/col_schema_name_len/col_precision/col_scale/col_charsetid/col_charsetform/col_null_ok BOOLEAN）；DESC_TAB为DESC_REC的TABLE类型（TABLE OF DESC_REC INDEX BY INTEGER）；DATE_TABLE为DATE的TABLE类型。"
  source_anchor: "3.12.2.19 数据类型介绍 页2864-2865"
  source_refs: &refsq
  - w8_160_3_12
  status: confirmed
- id: dbesql_wave8_160_date_table_mapping
  type: constraint
  statement: "DATE_TABLE映射规则：数据库初始化阶段若GUC参数mapping_date_to_datea为on则将DBE_SQL.DATE_TABLE映射为DATEA的TABLE类型，为off则映射为TIMESTAMP(0) WITHOUT TIME ZONE的TABLE类型；数据库初始化完成后该GUC参数值不再影响DATE_TABLE的具体类型映射；初始化阶段与使用阶段mapping_date_to_datea值不同会导致部分DBE_SQL函数使用DATE_TABLE时类型不匹配，建议保持初始化与使用阶段该参数值相同。"
  source_anchor: "3.12.2.19 DATE_TABLE说明 页2865"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_table_types
  type: syntax
  statement: "DBE_SQL数据类型（二）：NUMBER_TABLE为NUMBER的TABLE类型（TABLE OF NUMBER INDEX BY INTEGER）；VARCHAR2_TABLE为VARCHAR2(32767)的TABLE类型；BLOB_TABLE为BLOB的TABLE类型（均INDEX BY INTEGER）。"
  source_anchor: "3.12.2.19 数据类型介绍 页2865"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_catalog
  type: syntax
  statement: "DBE_SQL接口总账（约70个）：游标管理（REGISTER_CONTEXT/SQL_UNREGISTER_CONTEXT/IS_ACTIVE/LAST_ROW_COUNT/RUN_AND_NEXT）、语句（SQL_SET_SQL/SQL_RUN）、动态定义列（SET_RESULT_TYPE及CHAR/INT/LONG/RAW/BYTEA/TEXT/UNKNOWN变体）、读取列（GET_RESULT及CHAR/INT/LONG/RAW/BYTEA/TEXT/UNKNOWN、DBE_SQL_GET_RESULT_CHAR/LONG/LONG2/RAW）、绑定（SQL_BIND_VARIABLE/SQL_BIND_ARRAY/BIND_VARIABLE）、数组定义读取（SET_RESULT_TYPE_INTS/TEXTS/RAWS/BYTEAS/CHARS/SET_RESULTS_TYPE/GET_RESULTS_*）、描述（SQL_DESCRIBE_COLUMNS/DESCRIBE_COLUMNS）、C兼容（SQL_SET_RESULTS_TYPE_C/SQL_GET_VALUES_C/SQL_SET_TABLEOF_RESULTS_TYPE_C/SQL_GET_TABLEOF_VALUES_C）、变量结果（GET_VARIABLE_RESULT*、GET_ARRAY_RESULT_*）。"
  source_anchor: "3.12.2.19 DBE_SQL 表3-333 页2865-2868"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_usage_notes
  type: constraint
  statement: "DBE_SQL使用建议：建议使用DBE_SQL.SET_RESULT_TYPE及DBE_SQL.GET_RESULT定义参数列；当结果集大小超过GUC参数work_mem的设置值时将触发结果集的临时磁盘存储，但临时磁盘存储最大阈值不超过512MB。"
  source_anchor: "3.12.2.19 DBE_SQL说明 页2868"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_register_context
  type: constraint
  statement: "REGISTER_CONTEXT：DBE_SQL.REGISTER_CONTEXT() RETURN INTEGER用来打开一个游标（后续各项操作的前提），不传入任何参数、内部自动递增生成游标ID；DBE_SQL打开的游标是会话级的变量，不支持跨会话调用打开的游标（如自治事务），跨会话调用游标行为不可预知。"
  source_anchor: "3.12.2.19 REGISTER_CONTEXT 页2868"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_unregister
  type: constraint
  statement: "SQL_UNREGISTER_CONTEXT原型：DBE_SQL.SQL_UNREGISTER_CONTEXT(context_id IN INTEGER) RETURN INTEGER；用来关闭一个游标（DBE_SQL各项操作的结束步骤）；如果存储过程结束时未调用该函数游标占用的内存将不会被释放（关闭游标至关重要）；由于异常可能导致存储过程提前退出未能关闭游标，建议在存储过程的异常处理中包含此接口。"
  source_anchor: "3.12.2.19 SQL_UNREGISTER_CONTEXT 页2868-2869"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_set_sql_run
  type: syntax
  statement: "SQL_SET_SQL与SQL_RUN：SQL_SET_SQL(context_id IN INTEGER, query_string IN TEXT, language_flag IN INTEGER) RETURN BOOLEAN向游标传递SQL语句或匿名块（语句参数仅可通过text类型传递、长度不大于1G；language_flag 1为非兼容版本、2为兼容A版本）；SQL_RUN(context_id IN INTEGER) RETURN INTEGER执行指定游标中的SQL语句或匿名块。"
  source_anchor: "3.12.2.19 SQL_SET_SQL/SQL_RUN 页2869"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_next_row
  type: syntax
  statement: "NEXT_ROW原型：DBE_SQL.NEXT_ROW(context_id IN INTEGER) RETURN INTEGER；返回符合查询条件的数据行数，每次调用该函数都会获取一个新的行数集合，直到数据读取完毕获取不到新行为止。"
  source_anchor: "3.12.2.19 NEXT_ROW 页2870"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_set_result_type
  type: syntax
  statement: "SET_RESULT_TYPE原型：DBE_SQL.SET_RESULT_TYPE(context_id IN INTEGER, pos IN INTEGER, column_ref IN ANYELEMENT, maxsize IN INTEGER default 1024) RETURN INTEGER；动态定义从指定游标返回的列（只能应用于SELECT定义的游标，列通过查询列表相对位置标识、起始为1，传入变量的数据类型决定该列被定义的类型）；maxsize为定义的列返回类型长度。"
  source_anchor: "3.12.2.19 SET_RESULT_TYPE 页2870"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_set_result_type_char_int
  type: syntax
  statement: "SET_RESULT_TYPE类型变体（一）：SET_RESULT_TYPE_CHAR(context_id, pos, column_ref IN TEXT, column_size IN INTEGER)定义CHAR类型列（column_ref为需要定义的某类型的参数变量、column_size为动态定义列长度）；SET_RESULT_TYPE_INT(context_id, pos)定义INT类型列（无column_ref与column_size）。"
  source_anchor: "3.12.2.19 SET_RESULT_TYPE_CHAR/INT 页2871"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_set_result_type_long_raw
  type: syntax
  statement: "SET_RESULT_TYPE类型变体（二）：SET_RESULT_TYPE_LONG(context_id, pos)定义长列类型（非数据类型long）的列、长列大小限制为1G；SET_RESULT_TYPE_RAW(context_id, pos, column_ref IN RAW, column_size)、SET_RESULT_TYPE_BYTEA(context_id, pos, column_ref IN BYTEA, column_size)、SET_RESULT_TYPE_TEXT(context_id, pos, maxsize)分别定义RAW/BYTEA/TEXT类型列（maxsize为TEXT最大长度）；均只能应用于SELECT定义的游标。"
  source_anchor: "3.12.2.19 SET_RESULT_TYPE_LONG/RAW/BYTEA/TEXT 页2872-2873"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_set_result_unknown
  type: syntax
  statement: "SET_RESULT_TYPE_UNKNOWN原型：DBE_SQL.SET_RESULT_TYPE_UNKNOWN(context_id IN INTEGER, pos IN INTEGER, col_type IN TEXT) RETURN INTEGER；处理从给定游标返回的未知数据类型的列，该接口仅在数据类型无法识别时用于报错并退出。"
  source_anchor: "3.12.2.19 SET_RESULT_TYPE_UNKNOWN 页2873-2874"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_cursor_lifecycle
  type: constraint
  statement: "DBE_SQL游标生命周期闭环：REGISTER_CONTEXT打开（自动递增游标ID）→SQL_SET_SQL解析→SQL_RUN执行→NEXT_ROW读行→SET_RESULT_TYPE族定义列→GET_RESULT族取值→SQL_UNREGISTER_CONTEXT关闭释放内存；异常退出未关闭时建议在异常处理中包含SQL_UNREGISTER_CONTEXT。"
  source_anchor: "3.12.2.19 游标族接口 页2868-2874"
  source_refs: *refsq
  status: confirmed
- id: dbesql_wave8_160_session_kvs
  type: constraint
  statement: "会话级键值对比：DBE_SESSION与DBE_SQL游标均为会话级作用域——DBE_SESSION的context键值对（namespace 128字节/attribute与value 1024字节、'null'字符串前向兼容清除语义）与DBE_SQL游标（不支持跨会话/自治事务调用）均不可跨会话使用。"
  source_anchor: "3.12.2.18/3.12.2.19 页2862-2868"
  source_refs: *refss
  status: confirmed
open_questions:
- id: pkg2_wave8_160_oq_runtime
  content: "结果集临时磁盘存储512MB阈值在超限时的报错行为、SET_RESULT_TYPE_LONG长列1G限制与GET_RESULT_LONG配合的截断语义、context值1024字节截断对多字节字符的边界需授权环境实机验证。"
  status: open
