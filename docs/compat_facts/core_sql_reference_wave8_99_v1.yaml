facts:
- id: alter_type_wave8_99_syntax
  type: syntax
  statement: "ALTER TYPE name action [, ... ]修改一个类型的定义；action子句：ADD ATTRIBUTE attribute_name data_type [ COLLATE collation ] [ CASCADE | RESTRICT ]（复合类型增加属性）、DROP ATTRIBUTE [ IF EXISTS ] attribute_name [ CASCADE | RESTRICT ]（删除属性）、ALTER ATTRIBUTE attribute_name [ SET DATA ] TYPE data_type [ COLLATE collation ] [ CASCADE | RESTRICT ]（改变属性类型）；另有OWNER TO { new_owner | CURRENT_USER | SESSION_USER }、RENAME TO new_name、RENAME ATTRIBUTE attribute_name TO new_attribute_name [ CASCADE | RESTRICT ]、SET SCHEMA new_schema、ADD VALUE [ IF NOT EXISTS ] new_enum_value [ { BEFORE | AFTER } neighbor_enum_value ]（枚举类型增加新值）、RENAME VALUE existing_enum_value TO new_enum_value（重命名枚举标签值）。"
  source_anchor: "1.13.7.43 语法格式 页1339"
  source_refs: &refatype
  - w8_99_1_13_7_43
  status: confirmed
- id: alter_type_wave8_99_permission
  type: constraint
  statement: "类型的所有者、被授予了类型ALTER权限的用户或被授予ALTER ANY TYPE权限的用户可以执行ALTER TYPE，三权分立开关关闭时系统管理员默认拥有此权限；修改类型的所有者或模式时当前用户必须是该类型的所有者或系统管理员且是新所有者角色的成员；修改类型的模式必须在新模式上拥有CREATE权限；修改所有者必须是新的所有角色的直接或间接成员且该成员在此类型的模式上有CREATE权限（限制了修改所有者不会做任何通过删除和重建类型不能做的事情，三权分立关闭时系统管理员可以以任何方式修改任意类型的所有权）；增加属性或修改属性类型也必须有该类型的USAGE权限。"
  source_anchor: "1.13.7.43 注意事项/参数说明 须知 页1338,1340"
  source_refs: *refatype
  status: confirmed
- id: alter_type_wave8_99_params
  type: constraint
  statement: "参数：new_enum_value为非空且长度不超过63字节的字符串；neighbor_enum_value为已有枚举标签值（新值增加在紧接着该枚举值之前或之后）；CASCADE自动级联更新需更新类型及相关联的记录和继承它们的子表；RESTRICT如果需联动更新类型是已更新类型的关联记录则拒绝更新（缺省选项）；ADD ATTRIBUTE、DROP ATTRIBUTE和ALTER ATTRIBUTE选项可以组合成一个列表同时处理多个属性更改；COLLATE子句为可排序数据类型的列赋予排序规则，未指定时使用该列数据类型的默认排序规则；CURRENT_USER为当前用户、SESSION_USER为当前系统用户。"
  source_anchor: "1.13.7.43 参数说明 页1340-1341"
  source_refs: *refatype
  status: confirmed
- id: alter_type_wave8_99_example
  type: behavior_oracle
  statement: "示例：CREATE TYPE typ_stu AS (name varchar(10),age int)建表插入后ALTER TYPE typ_stu ADD ATTRIBUTE year int CASCADE，SELECT显示info多一个属性(Jim,16,)；DROP ATTRIBUTE year删除属性；OWNER TO test后pg_type与gs_roles联查显示owner=test；RENAME ATTRIBUTE age to age1后SELECT (info).age1可查询年龄数据。"
  source_anchor: "1.13.7.43 示例 页1341-1342"
  source_refs: *refatype
  status: confirmed
- id: analyze_wave8_99_purpose
  type: syntax
  statement: "ANALYZE|ANALYSE用于收集与数据库中普通表内容相关的统计信息，统计结果存储在系统表PG_STATISTIC、PG_STATISTIC_EXT下，执行后可在上述系统表查询收集到的统计信息，也可通过系统视图PG_STATS、PG_EXT_STATS查询；执行计划生成器会使用这些统计数据以确定最有效的执行计划。"
  source_anchor: "1.13.7.47 功能描述 页1352"
  source_refs: &refanalyze
  - w8_99_1_13_7_47
  status: confirmed
- id: analyze_wave8_99_history
  type: constraint
  statement: "每次收集的统计信息都会存入统计信息历史表（GS_STATISTIC_HISTORY、GS_STATISTIC_EXT_HISTORY以及GS_TABLESTATS_HISTORY），历史表存放的数量和统计信息的保留时间由GUC参数stats_history_record_limit和stats_history_retention_time控制。"
  source_anchor: "1.13.7.47 功能描述 页1352"
  source_refs: *refanalyze
  status: confirmed
- id: analyze_wave8_99_scope
  type: constraint
  statement: "ANALYZE未指定参数时会分析当前数据库中的每个表和分区表，也可通过table_name、column_name和partition_name参数把分析限定在特定的表、列或分区表；不指定参数则默认处理当前用户拥有相应权限的表，指定表参数时只处理指定的表；ANALYZE会跳过用户没有权限的表；不收集无法做比较或等值运算的列（例如CURSOR类型）；如果拟分析的表成了空表，ANALYZE不会记录该表的统计信息，原来已有的统计信息则会保留。"
  source_anchor: "1.13.7.47 功能描述/注意事项 页1352-1353"
  source_refs: *refanalyze
  status: confirmed
- id: analyze_wave8_99_verify_matrix
  type: syntax
  statement: "ANALYZE|ANALYSE VERIFY用于校验数据库目标表相关文件：页面物理损坏校验支持UHEAP、HEAP、FSM、UBTREE、UBTREE.FSM(URQ)、BTREE、BTREE.FSM；页面逻辑校验支持UHEAP、UBTREE、UBTREE.FSM(URQ)；元组校验仅UHEAP与HEAP支持COMPLETE模式；VM不支持校验；VERIFY执行完成所需时间与当前操作对象（数据库目标表或数据库）的大小以及当前机器的性能有关。"
  source_anchor: "1.13.7.47 功能描述 页1352"
  source_refs: *refanalyze
  status: confirmed
- id: analyze_wave8_99_permissions
  type: constraint
  statement: "ANALYZE操作（不包含ANALYZE VERIFY）支持在匿名块、事务块、函数或存储过程中执行；对一个表进行ANALYZE操作，用户必须是表的所有者或被授予了指定表VACUUM权限（三权分立开关关闭时默认系统管理员有该权限）；数据库的所有者允许对数据库中除共享目录以外的所有表进行ANALYZE操作（该限制意味着只有系统管理员才能真正对一个数据库进行ANALYZE操作）。"
  source_anchor: "1.13.7.47 注意事项 页1353"
  source_refs: *refanalyze
  status: confirmed
- id: analyze_wave8_99_rollback_limits
  type: constraint
  statement: "统计信息的回滚限制：不支持对PG_CLASS和PG_PARTITION中统计信息相关字段的回滚操作；基于PG_CLASS和PG_PARTITION中统计信息相关字段的视图同样不支持回滚；统计信息中与ANALYZE操作相关的函数（如pg_stat_get_last_analyze_time、pg_stat_get_analyze_count）以及依赖这些函数的视图均不支持回滚；ANALYZE VERIFY如果不涉及远程读场景远程读参数不会生效，检测出关键系统表页面损坏的错误将直接报错不再继续检测。"
  source_anchor: "1.13.7.47 注意事项 页1353"
  source_refs: *refanalyze
  status: confirmed
- id: analyze_wave8_99_syntax_forms
  type: syntax
  statement: "四种语法形式：{ ANALYZE | ANALYSE } [ VERBOSE ] [ table_name [ ( column_name [, ...] ) ] ] [ WITH PARTITION_MODE ]（收集表统计信息）；[ VERBOSE ] table_name [ ( column_name [, ...] ) ] { SUBPARTITION | PARTITION } ( partition_name )（收集分区统计信息，使用PARTITION时partition_name必须为一级分区名，使用SUBPARTITION时必须为二级分区名）；[ VERBOSE ] table_name (( column_1_name, column_2_name [, ...] )) [ WITH partition_mode ]（手动收集多列统计信息）；[ VERBOSE ] table_name [ WITH partition_mode ]（自动收集多列统计信息）。"
  source_anchor: "1.13.7.47 语法格式 页1353-1354"
  source_refs: *refanalyze
  status: confirmed
- id: analyze_wave8_99_multicolumn
  type: constraint
  statement: "多列统计信息：如果关闭GUC参数enable_functional_dependency，每组多列统计信息最多支持32列；如果开启则最多支持4列；不支持收集多列统计信息的表包括系统表和全局临时表；打开auto_statistic_ext_columns参数后执行ANALYZE会自动根据该表的索引前缀创建多列统计信息（例如表t存在索引(a,b,c,d)，设置auto_statistic_ext_columns为4，则analyze t将创建关于(a,b)、(a,b,c)、(a,b,c,d)的多列统计信息）。"
  source_anchor: "1.13.7.47 语法格式 说明 页1354"
  source_refs: *refanalyze
  status: confirmed
- id: analyze_wave8_99_verify_forms
  type: syntax
  statement: "VERIFY三种形式：{ ANALYZE | ANALYSE } VERIFY { FAST | COMPLETE }（检测当前库的数据文件）；VERIFY { FAST | COMPLETE } { table_name [CASCADE] | index_name }（检测表和索引的数据文件）；VERIFY { FAST | COMPLETE } table_name PARTITION ( partition_name ) [ CASCADE ]（检测表分区的数据文件，不支持指定二级分区）；CASCADE模式对当前表的所有索引进行检测，但不支持对索引表index使用CASCADE；对主表的检测会同步检测主表的内部表（例如toast表）；提示索引表损坏时建议使用reindex命令重建索引；只支持对当前库中的普通表、普通索引进行校验，不支持本地临时表、UNLOGGED表（自动跳过）；支持在备机执行（表或数据较多时可能被recovery业务自动取消并屏显报错）。"
  source_anchor: "1.13.7.47 语法格式/说明 页1354-1355"
  source_refs: *refanalyze
  status: confirmed
- id: analyze_wave8_99_verify_caution
  type: constraint
  statement: "ANALYZE VERIFY使用注意：该操作直接从磁盘上读取数据，如果对正在校验的表有并发DML操作会导致获取的数据不准确进而出现误报，建议在没有数据库业务时或业务低峰期使用；为保障执行效率建议执行前先执行checkpoint；支持对全库操作且建议以重定向保存结果（gsql -d database -p port -f sqlfile> sqllog.txt 2>&1）；只有对外可见的表对外提示NOTICE，内部表的检测包含在它所依赖的外部表；全库操作时关键系统表出现损坏则直接报错不再继续执行。"
  source_anchor: "1.13.7.47 语法格式 说明 页1354"
  source_refs: *refanalyze
  status: confirmed
- id: analyze_wave8_99_partition_mode
  type: constraint
  statement: "VERBOSE启用显示进度信息；行存表FAST模式主要对CRC和page header进行校验（失败告警），COMPLETE模式主要对指针、tuple进行解析校验；PARTITION_MODE适用于分区表级联收集统计信息（表1-373）：ALL（整表+一级+二级分区，分区采样率较低）、GLOBAL（仅整表）、PARTITION（一级分区）、GLOBAL AND PARTITION（整表+一级分区）、SUBPARTITION（二级分区）、ALL COMPLETE（整表+一级+二级分区，更高采样率耗时更长）、AUTO（缺省值，以statistic_granularity或default_statistic_granularity为准，表级参数优先）；分区统计信息会在cplan裁剪到单分区时使用；大规模导数后建议使用ALL COMPLETE手动收集；analyze整库时不支持指定partition mode，整库时default_statistic_granularity设为GLOBAL或ALL按定义执行，其他值退化为GLOBAL行为。"
  source_anchor: "1.13.7.47 参数说明/说明 表1-373 页1355-1356"
  source_refs: *refanalyze
  status: confirmed
- id: autohint_wave8_99_syntax
  type: syntax
  statement: "AUTOHINT [ ( option [, ...] ) ] statement启用AUTOHINT指定SQL探索Hint组合，并输出能提升当前SQL执行速度的推荐Hint组合；仅支持SELECT语句，且需要使用者拥有super权限或管理员权限；支持的多种选项中除ANALYZE选项外，使用其他选项时需将其置于括号内（例如AUTOHINT (VERBOSE) statement），对选项顺序无要求；若SQL语句已自带Hint，AUTOHINT将会无视已有的Hint进行推荐（基于去除Hint后的语句推荐）。"
  source_anchor: "1.13.7.48 功能描述/注意事项/语法格式/须知 页1358-1359"
  source_refs: &refautohint
  - w8_99_1_13_7_48
  status: confirmed
- id: autohint_wave8_99_options
  type: constraint
  statement: "AUTOHINT选项（均支持boolean，缺省TRUE）：ANALYZE（推荐前进行Hint探索，FALSE时根据历史Hint探索记录直接推荐）；VERBOSE（显示Hint探索与推荐过程的额外信息）；SQLPATCH（推荐后输出相应的SQLPATCH指令）；TEST（推荐后分别执行初始查询和应用Hint后的查询验证推荐结果并输出实际计划执行时间）；DEBUG（输出比VERBOSE更多的细节，包括每轮探索时的初始计划树及执行时间、每轮探索得到的探索子图以及最终合并后的总探索图）。"
  source_anchor: "1.13.7.48 参数说明 页1359"
  source_refs: *refautohint
  status: confirmed
- id: autohint_wave8_99_limits
  type: constraint
  statement: "资源限制选项：WORKERS int设置验证Hint时的最大并发验证任务数量，取值2~当前环境CPU核数（超过自动调整为CPU核数），默认值为CPU核数/3向下取整且小于2时调整为2；MEMSIZE int设置单个验证任务内存上限，取值0~2147483647单位kB，设置值大于32768（32MB）时任务使用内存超过该值将终止任务，小于32768时设置为默认值0不限制，需开启GUC参数enable_memory_limit否则不生效；IOLIMITS int设置单个验证任务每秒触发I/O次数上限，取值0~1073741823单位万次，0时不限制。"
  source_anchor: "1.13.7.48 参数说明 页1359-1360"
  source_refs: *refautohint
  status: confirmed
- id: autohint_wave8_99_example
  type: behavior_oracle
  statement: "示例：导入JOB数据集后使用AUTOHINT ANALYZE SELECT MIN(t.title) AS movie_title FROM company_name AS cn, keyword AS k, movie_companies AS mc, movie_keyword AS mk, title AS t WHERE ...为02a查询进行Hint探索推荐。"
  source_anchor: "1.13.7.48 示例 页1360"
  source_refs: *refautohint
  status: confirmed
- id: autohint_drop_purge_wave8_99_example
  type: behavior_oracle
  statement: "AUTOHINT DROP MODEL statement删除指定SQL的历史Hint探索结果（仅支持SELECT语句，需super权限或管理员权限）：删除成功输出AUTOHINT: 1 MODEL REMOVED，若无该SQL的历史探索结果删除失败输出AUTOHINT: 0 MODELS REMOVE；AUTOHINT PURGE删除AUTOHINT的所有历史Hint探索结果（需super权限或管理员权限）：删除成功输出AUTOHINT: 12 MODELS REMOVED，无任何历史探索结果时输出AUTOHINT: 0 MODELS REMOVE。"
  source_anchor: "1.13.7.49/1.13.7.50 示例 页1361"
  source_refs: &refadh
  - w8_99_1_13_7_49
  - w8_99_1_13_7_50
  status: confirmed
open_questions:
- id: alter_type_analyze_autohint_wave8_99_oq_runtime
  statement: "复合类型属性级联更新对继承子表的实际影响、VERIFY在并发DML下误报边界、PARTITION_MODE各模式采样率与统计质量差异、AUTOHINT在大查询上的探索耗时与推荐质量在授权环境下的完整行为与错误矩阵需实机验证。"
  status: open
