  - w2b11_1_6_27
  status: confirmed
- id: wave2b11_dirty_queue_advance_stat
  type: syntax
  statement: "local_dirty_queue_advance_stat()显示本实例脏页队列推进情况，包括队列头、尾、大小、是否满、头buffer、页面LSN、内容锁ID、I/O锁ID和极致刷脏分配位置。"
  source_anchor: "1.6.27.17 页757-758"
  source_refs: *id001
  status: confirmed
- id: wave2b11_single_flush_dw_stat
  type: syntax
