  type: constraint
  statement: "dbe_perf.get_global_slow_sql_by_timestamp(start_timestamp,end_timestamp)获取数据库级慢SQL信息，只在系统库中可查询结果；若start_timestamp >= end_timestamp则执行报错。"
  source_anchor: "1.6.27.17 页760"
  source_refs: *id001
  status: confirmed
- id: wave2b11_statement_detail_decode
  type: syntax
  statement: "statement_detail_decode(detail,format,pretty)解析全量或慢SQL的detail字段；只在系统库可查询结果，format取plaintext，pretty为true时按换行分隔事件，false时按逗号分隔。"
  source_anchor: "1.6.27.17 页760"
  source_refs: *id001
  status: confirmed
- id: wave2b11_pgxc_get_csn
  type: behavior_oracle
  statement: "pgxc_get_csn(tid)返回给定事务id对应的事务提交序号并返回int8；pgxc_get_csn(tid,bucketid)在当前集中式版本不支持hashbucket表，该接口调用报错。"
  source_anchor: "1.6.27.17 页761"
  source_refs: *id001
  status: confirmed
- id: wave2b11_control_state
  type: syntax
