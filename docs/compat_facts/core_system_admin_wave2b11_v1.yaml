  source_anchor: "1.6.27.17 页758"
  source_refs: *id001
  status: confirmed
- id: wave2b11_pagewriter_stat
  type: behavior_oracle
  statement: "local_pagewriter_stat()显示本实例刷页信息和检查点信息；多租场景下Non-PDB正常运行，PDB调用返回空列表。"
  source_anchor: "1.6.27.17 页758"
  source_refs: *id001
  status: confirmed
- id: wave2b11_buffer_scale_state
  type: behavior_oracle
  statement: "local_buffer_scale_state()显示BufferPool扩缩容状态，状态可为none、start_extend、start_shrink、extending、shrinking、failed或finished。"
  source_anchor: "1.6.27.17 页758"
  source_refs: *id001
  status: confirmed
- id: wave2b11_buffer_io_state
  type: syntax
  statement: "local_buffer_io_state()显示BufferPool的I/O使用信息，输出单页面淘汰写I/O次数和读I/O次数。"
  source_anchor: "1.6.27.17 页758-759"
  source_refs: *id001
  status: confirmed
- id: wave2b11_redo_stat
  type: behavior_oracle
  statement: "local_redo_stat()显示本实例备机当前回放状态，包括当前回放位置和回放最小恢复点位置等；多租场景下PDB调用返回空列表。"
  source_anchor: "1.6.27.17 页759"
  source_refs: *id001
  status: confirmed
- id: wave2b11_recovery_status
  type: behavior_oracle
  statement: "local_recovery_status()显示本实例主机和备机日志流控信息；多租场景下Non-PDB正常运行，PDB调用返回空列表。"
  source_anchor: "1.6.27.17 页759"
  source_refs: *id001
  status: confirmed
- id: wave2b11_wlm_node_recover
  type: syntax
  statement: "gs_wlm_node_recover(isForce)获取当前内存中记录的TopSQL查询语句级别相关统计信息；当isForce不为0时，会将这部分信息从内存中清理掉。"
  source_anchor: "1.6.27.17 页759"
  source_refs: *id001
  status: confirmed
- id: wave2b11_cgroup_functions
  type: syntax
  statement: "gs_cgroup_map_ng_conf(group_name)读取指定逻辑数据库的cgroup配置文件；gs_wlm_switch_cgroup(sess_id,cgroup_name)切换指定会话的控制组。"
  source_anchor: "1.6.27.17 页759"
  source_refs: *id001
  status: confirmed
- id: wave2b11_comm_client_info
  type: syntax
  statement: "comm_client_info()查询单个节点活跃的客户端连接信息，返回setof record。"
  source_anchor: "1.6.27.17 页759"
  source_refs: *id001
  status: confirmed
- id: wave2b11_flush_lsns
  type: syntax
  statement: "pg_get_flush_lsn()返回当前节点flush的Xlog位置；pg_get_sync_flush_lsn()返回当前节点多数派flush的Xlog位置，均返回text。"
  source_anchor: "1.6.27.17 页759"
  source_refs: *id001
  status: confirmed
- id: wave2b11_global_full_sql
  type: constraint
  statement: "dbe_perf.get_global_full_sql_by_timestamp(start_timestamp,end_timestamp)获取数据库级全量SQL信息，只在系统库中可查询结果；若start_timestamp >= end_timestamp则执行报错。"
  source_anchor: "1.6.27.17 页759-760"
  source_refs: *id001
  status: confirmed
