  - id: oracle_null_handling
    type: behavior_oracle
    statement: "空值处理与Oracle基本一致；空值在排序、比较、索引中的行为按Oracle兼容模式处理。"
    source_anchor: "4.3.2.5"

  # 数据库对象
  - id: oracle_object_names
