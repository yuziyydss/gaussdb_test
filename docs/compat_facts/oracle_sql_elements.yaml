    source_anchor: "4.2 L7-15"

  - id: oracle_compat_baseline
    type: environment
    statement: "Oracle兼容模式与Oracle 19c版本对比；基本功能基本兼容，存在架构差异。"
    source_anchor: "4.3.1 L21-24"

  # 数据类型差异 (表4-1至4-5)
  - id: oracle_number_diff
    type: constraint
    statement: "NUMBER带参数时GaussDB精度p与标度s最大边界比Oracle更大；不带参数时GaussDB默认精度远大于带参数最大值；不支持负标度；支持插入NaN。"
    source_anchor: "4.3.2.1 表4-1"

  - id: oracle_binary_float_unsupported
    type: constraint
    statement: "BINARY_FLOAT在GaussDB Oracle兼容模式中不支持。"
    source_anchor: "4.3.2.1 表4-1"

  - id: oracle_binary_double_supported
    type: syntax
    statement: "BINARY_DOUBLE在GaussDB Oracle兼容模式中支持。"
    source_anchor: "4.3.2.1 表4-1"

