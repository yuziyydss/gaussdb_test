  # 使用场景
  - id: dbe_raw_usage_pattern
    type: behavior_oracle
    statement: "DBE_RAW核心用途：1.与DBE_LOB配合——LOB_READ返回RAW后用CAST_TO_VARCHAR2转换 2.加密场景——DBE_OBFUSCATION_TOOLKIT输出RAW用CAST_FROM_VARCHAR2_TO_RAW输入 3.进制转换——INTEGER/DOUBLE/FLOAT/NUMERIC与RAW互转 4.位运算——AND/OR/XOR/COMPLEMENT。"
    source_anchor: "3.12.2 综合分析"
    status: confirmed
    verification_method: 综合接口定义分析
