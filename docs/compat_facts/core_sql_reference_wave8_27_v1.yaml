facts:
- id: upd_wave8_27_purpose_syntax
  type: syntax
  statement: "UPDATE更新满足条件的所有行中指定字段，未出现在SET中的字段保持原值；支持单表和多表更新、WITH/RECURSIVE、plan_hint、表/子查询/视图目标、分区子句、SET标量或多列赋值、FROM、WHERE、ORDER BY、LIMIT和RETURNING。"
  source_anchor: "1.13.21.1 页1880-1881"
  source_refs: &refb1
  - w8_27_1_13_21_1
  status: confirmed
- id: upd_wave8_27_permissions
  type: constraint
  statement: "表所有者、拥有表UPDATE权限或UPDATE ANY TABLE权限的用户可更新表数据；三权分立关闭时系统管理员默认拥有权限。expression或condition涉及到的任何表都需要SELECT权限。"
  source_anchor: "1.13.21.1 注意事项 页1880"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_generated_columns
  type: constraint
  statement: "生成列不能被直接写入；UPDATE中不能为生成列指定值，但可以指定关键字DEFAULT。"
  source_anchor: "1.13.21.1 注意事项 页1880"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_multi_table_boundaries
  type: constraint
  statement: "多表更新语法暂不支持对视图和含有RULE的表进行更新。"
  source_anchor: "1.13.21.1 注意事项 页1880"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_stream_plan_concurrency
  type: constraint
  statement: "对于子查询是STREAM计划的UPDATE语句，不支持并发更新同一行。"
  source_anchor: "1.13.21.1 注意事项 页1880"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_protected_system_updates
  type: constraint
  statement: "不支持用户通过UPDATE系统表的方式修改数据库字符编码；该操作可能导致存量数据或其他操作异常，修改数据库字符集应按切换数据库流程迁移数据。"
  source_anchor: "1.13.21.1 注意事项 页1880"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_cte
  type: syntax
  statement: "WITH可声明一个或多个CTE，子查询可为SELECT、VALUES、INSERT、UPDATE或DELETE；RECURSIVE允许引用自身，MATERIALIZED/NOT MATERIALIZED控制物化，未显式声明时仅引用一次且可内联的CTE会内联，否则CTE Scan物化。"
  source_anchor: "1.13.21.1 WITH子句 页1881"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_plan_hint
  type: syntax
  statement: "plan_hint以/*+ */形式写在UPDATE关键字后；每条语句只有第一个hint注释块生效，其中可写多条hint。"
  source_anchor: "1.13.21.1 plan_hint 页1881-1882"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_table_target
  type: syntax
  statement: "UPDATE目标表可为模式限定表名并支持DATABASE LINK远端表；指定ONLY时只更新该表匹配行，未指定时会更新从该表继承到的表中的匹配行。"
  source_anchor: "1.13.21.1 table_name 页1882"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_view_subquery_constraints
  type: constraint
  statement: "视图/子查询可作UPDATE目标，但只有直接引用基表用户列的列可更新，且至少一个可更新列；不支持顶层DISTINCT、GROUP BY、HAVING、LIMIT、OFFSET、集合运算、聚集/窗口/返回集合函数；不支持仅BEFORE/AFTER触发器而无INSTEAD能力的视图，不支持系统视图；多表连接一次只能更新一张基表，且只能更新保留键表。"
  source_anchor: "1.13.21.1 subquery/view_name 页1882"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_partition_clause
  type: syntax
  statement: "PARTITION/SUBPARTITION指定分区更新操作，可按分区名、二级分区名或FOR分区键值定位；PARTITION指定多个分区名时，一级和二级分区名可同时存在且允许重名，最终分区范围取并集。"
  source_anchor: "1.13.21.1 partition_clause 页1882-1883"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_alias_table_list
  type: syntax
  statement: "目标表可使用别名；多表更新中的table_list与from_list类似，但可同时声明目标表和关联表，且item可以是子查询。"
  source_anchor: "1.13.21.1 alias/table_list 页1883"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_set_columns
  type: syntax
  statement: "SET支持column_name = expression|DEFAULT，也支持多列括号赋值或子查询；字段名可使用目标表别名引用，例如UPDATE foo AS f SET f.col_name = ...。"
  source_anchor: "1.13.21.1 SET/column_name 页1880与1883"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_subquery_assignment
  type: constraint
  statement: "SET子查询可使用同库其他表信息更新目标表；更新单列支持ORDER BY和LIMIT，更新多列不支持。多列子查询更新建议显式指定列名而不是*；SET子查询WHERE使用“+”需开启enable_ora_joinop_in_updatestmt。"
  source_anchor: "1.13.21.1 sub_query 页1883"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_from_list
  type: constraint
  statement: "FROM from_list允许WHERE条件使用其他表字段；目标表不能出现在from_list中，除非使用自连接且必须以from_list中的别名出现。"
  source_anchor: "1.13.21.1 from_list 页1883"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_condition
  type: constraint
  statement: "WHERE condition是返回Boolean结果的表达式，仅true的行被更新；不建议使用int等数值类型作为condition，因其可隐式转换为Boolean，可能产生非预期结果。"
  source_anchor: "1.13.21.1 condition 页1884"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_where_current_of
  type: constraint
  statement: "WHERE CURRENT OF cursor_name可更新游标当前指向的行；仅支持存储过程中的普通表游标，不支持分区表、B模式、多表更新、其他WHERE条件，也不支持与WITH、USING、ORDER BY、FROM组合；游标SELECT必须为FOR UPDATE且仅支持单表。"
  source_anchor: "1.13.21.1 WHERE CURRENT OF 页1884"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_order_limit_returning
  type: syntax
  statement: "UPDATE支持ORDER BY和LIMIT；RETURNING在需要更新的行更新后计算返回值，可使用目标表及FROM中表的字段，*返回所有字段，并可为输出列命名。"
  source_anchor: "1.13.21.1 ORDER BY/LIMIT/RETURNING 页1880与1884"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_cte_update_insert
  type: behavior_oracle
  statement: "可在WITH中先执行UPDATE ... RETURNING获取旧记录标识，再由外层INSERT使用该CTE结果插入补考记录；示例中旧考试行last_exam被更新为f，同时新增last_exam为t的新成绩行。"
  source_anchor: "1.13.21.1 示例 页1885-1886"
  source_refs: *refb1
  status: confirmed
- id: upd_wave8_27_view_check_option
  type: behavior_oracle
  statement: "更新带WITH CHECK OPTION的连接视图或连接子查询时，非连接列可以更新；更新连接列会被拒绝，例如SET x1 = 6返回“This operation is not allowed on virtual column.”。READ ONLY视图/子查询不允许DML。"
  source_anchor: "1.13.21.1 示例 页1886-1887"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: upd_wave8_27_oq_runtime
  statement: "UPDATE在真实并发、分区路由、视图/子查询、多表更新、游标定位和RETURNING组合下的结果、锁等待与性能矩阵需授权环境实机验证。"
  status: open
