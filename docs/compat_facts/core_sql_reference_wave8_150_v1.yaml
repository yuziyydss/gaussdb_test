facts:
- id: dbefile_wave8_150_get_pos
  type: syntax
  statement: "GET_POS原型：DBE_FILE.GET_POS(file IN INTEGER 或 DBE_FILE.FILE_TYPE) RETURN BIGINT；以字节为单位返回文件当前的偏移量（原型注释中函数名亦写作FGETPOS）。"
  source_anchor: "3.12.2.5 GET_POS 页2749"
  source_refs: &refg
  - w8_150_3_12
  status: confirmed
- id: dbefile_wave8_150_fopen_nchar
  type: syntax
  statement: "FOPEN_NCHAR原型：DBE_FILE.FOPEN_NCHAR(dir IN TEXT, file_name IN TEXT, open_mode IN TEXT, max_line_size IN INTEGER DEFAULT 1024) RETURN DBE_FILE.FILE_TYPE；以国家字符集模式打开文件进行输入或输出，可指定每行最大字节数，一个会话内最多同时打开50个文件；dir/file_name/open_mode/max_line_size约束与OPEN一致（PG_DIRECTORY注册、safe_data_path、文件名不含路径、r/w/a/rb/wb/ab、elf检测、1~32767默认1024）。"
  source_anchor: "3.12.2.5 FOPEN_NCHAR 页2749-2750"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_write_nchar
  type: syntax
  statement: "WRITE_NCHAR原型：DBE_FILE.WRITE_NCHAR(file IN DBE_FILE.FILE_TYPE, buffer IN NVARCHAR2) RETURN VOID；向文件缓冲区写入数据，文件必须以国家字符集模式和写模式打开，该操作不会写入行终结符；文本字符串将以UTF8字符集格式写入；每行累计写入长度不能大于或等于FOPEN_NCHAR时指定或默认的max_line_size否则刷新到文件时报错（elf检测）。"
  source_anchor: "3.12.2.5 WRITE_NCHAR 页2750-2751"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_write_line_nchar
  type: syntax
  statement: "WRITE_LINE_NCHAR原型：DBE_FILE.WRITE_LINE_NCHAR(file IN DBE_FILE.FILE_TYPE, buffer IN NVARCHAR2) RETURN VOID；向文件缓冲区写入数据并自动追加行终结符；每行长度（包含换行符）不能大于FOPEN_NCHAR时指定或默认的max_line_size否则刷新到文件时报错（elf检测）。"
  source_anchor: "3.12.2.5 WRITE_LINE_NCHAR 页2751-2752"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_format_write_nchar
  type: syntax
  statement: "FORMAT_WRITE_NCHAR原型：DBE_FILE.FORMAT_WRITE_NCHAR(file IN DBE_FILE.FILE_TYPE, format IN NVARCHAR2, arg1..arg5 IN NVARCHAR2 DEFAULT NULL) RETURN VOID；将格式化数据写入打开的NCHAR模式文件缓冲区（允许格式化的WRITE_NCHAR）；format包含文本和格式符\\n和%s；arg1到arg5与格式化字符位置一一对应，存在格式化字符而未提供参数时使用空串替代%s。"
  source_anchor: "3.12.2.5 FORMAT_WRITE_NCHAR 页2751-2752"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_read_line_nchar
  type: syntax
  statement: "READ_LINE_NCHAR原型：DBE_FILE.READ_LINE_NCHAR(file IN DBE_FILE.FILE_TYPE, buffer OUT NVARCHAR2, len IN INTEGER DEFAULT NULL) RETURN NVARCHAR2；从打开的NCHAR模式文件读取一行指定长度的数据，读取到行尾（不含行终结符）或文件末尾或len指定大小；读取长度不能超过FOPEN_NCHAR时指定的max_line_size；文件必须以读模式打开否则抛出INVALID_OPERATION异常；len默认NULL时使用max_line_size指定大小。"
  source_anchor: "3.12.2.5 READ_LINE_NCHAR 页2752-2753"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_nchar_family_design
  type: constraint
  statement: "NCHAR族设计约束：NCHAR族接口（FOPEN_NCHAR/WRITE_NCHAR/WRITE_LINE_NCHAR/FORMAT_WRITE_NCHAR/READ_LINE_NCHAR）仅有DBE_FILE.FILE_TYPE句柄原型、无INTEGER句柄原型，文件必须通过FOPEN_NCHAR打开；WRITE_NCHAR/WRITE_LINE_NCHAR的文本字符串以UTF8字符集格式写入。"
  source_anchor: "3.12.2.5 NCHAR族接口 页2749-2753"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_nchar_limits
  type: constraint
  statement: "NCHAR族限制（与CHAR版一致）：每行累计写入长度（WRITE_NCHAR）或每行长度含换行符（WRITE_LINE_NCHAR）不能大于等于max_line_size否则刷新到文件时报错；写操作检测写入文件类型、elf类型文件报错退出；READ_LINE_NCHAR文件必须以读模式打开否则INVALID_OPERATION异常。"
  source_anchor: "3.12.2.5 NCHAR族参数说明 页2750-2753"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_directory_prereq
  type: constraint
  statement: "DBE_FILE示例前置条件：需由系统管理员向PG_DIRECTORY系统表中加入目录（CREATE OR REPLACE DIRECTORY dir AS '/tmp/'，执行结果CREATE DIRECTORY），之后才能以该目录对象名使用DBE_FILE高级包读写文件。"
  source_anchor: "3.12.2.5 示例 页2753"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_example_overview
  type: behavior_oracle
  statement: "DBE_FILE综合示例结构：匿名块声明INTEGER句柄f、FILE_TYPE对象f1/f2/f_nchar、buffer/raw_buffer/nvarchar_buffer及fexists/file_length/block_size/pos变量，依次演示打开关闭、写读、COPY、CLOSE_ALL、REMOVE、GET_RAW、GET_ATTR、RENAME、SEEK/GET_POS、FLUSH与NCHAR全流程。"
  source_anchor: "3.12.2.5 示例 页2753-2754"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_example_open_close
  type: behavior_oracle
  statement: "打开关闭示例基线：OPEN('dir','sample.txt','w')后IS_OPEN(f)=true输出file opened；CLOSE后IS_CLOSE(f)=true输出file closed。"
  source_anchor: "3.12.2.5 示例 页2753-2755"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_example_write_read
  type: behavior_oracle
  statement: "写读示例基线：WRITE('A')+NEW_LINE+WRITE('B')('C')+NEW_LINE(f,2)+WRITE_LINE('ABC')+FORMAT_WRITE('[1 -> %s, 2 -> %s]\\n','GaussDB','DBE_FILE')+PUT_RAW('414243')写入后，以r模式重开逐行READ_LINE输出A、BC、ABC、[1 -> GaussDB, 2 -> DBE_FILE]、ABC（RAW 414243）。"
  source_anchor: "3.12.2.5 示例 页2753-2755"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_example_copy_closeall
  type: behavior_oracle
  statement: "复制与会话级关闭示例基线：COPY('dir','sample.txt','dir','sample_copy.txt')复制整个文件；FOPEN两个文件后CLOSE_ALL()，IS_CLOSE(f1)与IS_CLOSE(f2)均为true输出f1 and f2 all closed；REMOVE清理sample1/sample2/sample_copy。"
  source_anchor: "3.12.2.5 示例 页2754-2755"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_example_getraw_attr
  type: behavior_oracle
  statement: "GET_RAW与GET_ATTR示例基线：对含ABC及换行符的文件GET_RAW输出4142430A（0A是换行符）；GET_ATTR后fexists=true输出file length: 4。"
  source_anchor: "3.12.2.5 示例 页2754-2755"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_example_seek_flush
  type: behavior_oracle
  statement: "SEEK与FLUSH示例基线：RENAME后SEEK(f1, 1, null)再GET_POS输出position is: 1、READ_LINE输出BC；以w模式WRITE_LINE('ABCEFG')后FLUSH(f1)，另一个r模式句柄立即READ_LINE读到ABCEFG。"
  source_anchor: "3.12.2.5 示例 页2754-2755"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_example_nchar
  type: behavior_oracle
  statement: "NCHAR示例基线：FOPEN_NCHAR('dir','sample_nchar.txt','w')后WRITE_NCHAR('ABCDE')+WRITE_LINE_NCHAR('ABCDE')+FORMAT_WRITE_NCHAR('%s, %s','hello','world')，r模式重开后READ_LINE_NCHAR依次输出ABCDEABCDE与hello, world。"
  source_anchor: "3.12.2.5 示例 页2754-2755"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_get_pos_with_seek
  type: syntax
  statement: "GET_POS与SEEK配合使用：SEEK(f1, 1, null)将文件指针调整到绝对偏移1后，GET_POS(f1)返回1（position is: 1），随后READ_LINE从该位置继续读取（输出BC）。"
  source_anchor: "3.12.2.5 示例 页2754-2755"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_format_args_diff
  type: syntax
  statement: "FORMAT_WRITE与FORMAT_WRITE_NCHAR参数个数差异：CHAR版FORMAT_WRITE支持arg1到arg6共6个可选参数（NVARCHAR2版说明中亦提及允许格式化的WRITE接口），NCHAR版FORMAT_WRITE_NCHAR仅支持arg1到arg5共5个可选参数。"
  source_anchor: "3.12.2.5 FORMAT_WRITE/FORMAT_WRITE_NCHAR 页2741-2742与页2751-2752"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_nchar_encoding
  type: constraint
  statement: "NCHAR族编码行为：WRITE_NCHAR与WRITE_LINE_NCHAR写入的文本字符串以UTF8字符集格式写入；结合注意事项，数据库字符集为ASCII且客户端为支持中文的编码时写中文可能无法保证UTF8编码，导致后续READ_LINE_NCHAR报错。"
  source_anchor: "3.12.2.5 注意事项/WRITE_NCHAR 页2734与页2750-2751"
  source_refs: *refg
  status: confirmed
- id: dbefile_wave8_150_fopen_nchar_limit
  type: syntax
  statement: "FOPEN_NCHAR会话级文件数限制：一个会话内最多可以同时打开50个文件（与OPEN/FOPEN一致）。"
  source_anchor: "3.12.2.5 FOPEN_NCHAR 页2749"
  source_refs: *refg
  status: confirmed
open_questions:
- id: pkg2_wave8_150_oq_runtime
  content: "FOPEN_NCHAR在非UTF8数据库字符集下的实际编码转换行为、FORMAT_WRITE_NCHAR与FORMAT_WRITE参数个数差异（5对6）是否有意限制、FLUSH后被另一句柄立即读取的可见性时序需授权环境实机验证。"
  status: open
