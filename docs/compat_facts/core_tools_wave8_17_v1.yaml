facts:
- id: tools_wave8_17_overview
  type: syntax
  statement: "安装/卸载工具包括gs_initdb、gs_install、gs_postuninstall、gs_preinstall和gs_uninstall。"
  source_anchor: "5.2.1 页3575"
  source_refs: &refb1
  - w8_17_5_2
  status: confirmed
- id: tools_wave8_17_initdb_intro
  type: syntax
  statement: "gs_initdb初始化数据库时创建数据库目录、生成系统表、创建默认数据库和模板数据库。"
  source_anchor: "5.2.2 页3576"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_initdb_template
  type: syntax
  statement: "gs_initdb创建template1、template0、templatem、template_pdb和postgres等模板或默认数据库。"
  source_anchor: "5.2.2 页3576"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_initdb_permission
  type: constraint
  statement: "若gs_initdb无法创建数据目录，应先用root创建空数据目录，再使用chown将所有权交给数据库用户。"
  source_anchor: "5.2.2 页3576"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_initdb_command
  type: syntax
  statement: "gs_initdb的推荐命令形式是gs_initdb [OPTION]... [DATADIR]。"
  source_anchor: "5.2.2 页3576"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_initdb_auth
  type: constraint
  statement: "gs_initdb的-A/--auth设置本地认证方法，支持trust、reject、md5、sha256和sm3，默认trust。"
  source_anchor: "5.2.2 页3577"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_initdb_auth_host
  type: constraint
  statement: "gs_initdb的--auth-host指定host行认证方法，设置后会覆盖-A参数的值。"
  source_anchor: "5.2.2 页3577"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_install_intro
  type: syntax
  statement: "gs_install用于数据库实例安装部署，配置文件指定程序安装路径、实例数据目录、主备关系、实例数和业务IP端口等信息。"
  source_anchor: "5.2.3 页3584"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_install_internal
  type: constraint
  statement: "gs_install是系统内部工具，不支持单独调用。"
  source_anchor: "5.2.3 页3584"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_install_prereq
  type: constraint
  statement: "gs_install前需成功执行gs_preinstall，各节点locale一致，并使用前置时设置的数据库实例用户执行。"
  source_anchor: "5.2.3 页3584-3585"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_install_command
  type: syntax
  statement: "gs_install命令为gs_install -X XMLFILE并可选--gsinit-parameter、--dn-guc、--time-out、--autostart、-l等参数。"
  source_anchor: "5.2.3 页3585"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_install_most_available
  type: constraint
  statement: "部署2副本实例时建议启用most_available_sync；该参数默认关闭，关闭状态下任一副本故障后数据库会因多数派缺失而不可用。"
  source_anchor: "5.2.3 页3585"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_install_empty_password
  type: behavior_oracle
  statement: "gs_install不指定初始用户密码时密码为空，除修改密码外无法执行其他SQL、升级、扩容和节点替换操作。"
  source_anchor: "5.2.3 页3585-3586"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_postuninstall_intro
  type: syntax
  statement: "gs_postuninstall用于清理预安装阶段配置，使卸载后的环境得到清理。"
  source_anchor: "5.2.4 页3589"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_postuninstall_command
  type: syntax
  statement: "gs_postuninstall命令为gs_postuninstall -U USER -X XMLFILE [-L] [--delete-user] [--delete-group] [--delete-virtual-IP] [-l LOGFILE] [--sep-env-file=MPPRCFILE]。"
  source_anchor: "5.2.4 页3589"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_postuninstall_delete_user
  type: constraint
  statement: "gs_postuninstall的--delete-user删除-U指定操作系统用户；在redhat/euleros/centos/oracle环境下用户名与用户组名相同时，还必须指定--delete-group。"
  source_anchor: "5.2.4 页3590"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_postuninstall_delete_group
  type: constraint
  statement: "gs_postuninstall的--delete-group删除操作系统用户所在用户组，必须与--delete-user一起使用。"
  source_anchor: "5.2.4 页3590"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_preinstall_intro
  type: syntax
  statement: "gs_preinstall用于预安装数据库，完成数据库环境配置。"
  source_anchor: "5.2.5 页3591"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_uninstall_intro
  type: syntax
  statement: "gs_uninstall用于卸载数据库实例。"
  source_anchor: "5.2.6 页3604"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_17_uninstall_command
  type: syntax
  statement: "gs_uninstall命令为gs_uninstall [--delete-data] [-L] [-l LOGFILE]。"
  source_anchor: "5.2.6 页3604"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: tools_wave8_17_oq_runtime
  statement: "gs_initdb、gs_install、gs_preinstall和卸载清理在真实多节点环境下的行为矩阵需授权环境实机验证。"
  status: open
