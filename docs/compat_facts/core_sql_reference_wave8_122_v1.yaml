facts:
- id: m_cmp_wave8_122_overview
  type: constraint
  statement: "M兼容比较操作符对两个数据的大小进行比较并返回布尔类型的值（均为二元运算符，参见表2-35）；不等于的计算优先级高于等于；M-Compatibility模式下目前只支持btree索引和ubtree索引；<>和<=>不支持索引扫描；<=>不支持hash连接和合并连接、不支持行比较；<、<=、=、>=、>、<>操作符支持行表达式与NULL值比较；IS NULL、ISNULL操作支持行表达式作为参数使用。"
  source_anchor: "2.5.5 说明 页2324"
  source_refs: &refmcmp
  - w8_122_2_5_5
  status: confirmed
- id: m_cmp_wave8_122_row_null
  type: behavior_oracle
  statement: "行表达式比较基线（m_db）：SELECT (1,2) <=> row(2,3)报ERROR: could not determine interpretation of row comparison operator <=>（HINT: unsupported operator）；SELECT (1,2) < NULL返回空值；SELECT (1,2) <> NULL返回空值；SELECT (1,2) IS NULL返回f。"
  source_anchor: "2.5.5 说明 示例 页2324"
  source_refs: *refmcmp
  status: confirmed
- id: m_cmp_wave8_122_basic
  type: behavior_oracle
  statement: "基础比较操作符示例（m_db）：SELECT 2 < 2返回f；SELECT 2 > 2返回f；SELECT 0.1 <= 0.2返回t；SELECT 2 >= 2返回t；SELECT 2 = 2返回t；SELECT 1 <> 2返回t。"
  source_anchor: "2.5.5 比较操作符示例 页2324-2325"
  source_refs: *refmcmp
  status: confirmed
- id: m_cmp_wave8_122_null_safe_between
  type: constraint
  statement: "<=>NULL安全等于操作符执行与=操作符类似的相等比较，但NULL与NULL进行NULL安全等于比较时返回t否则返回f（示例SELECT 1 <=> 1, 1 <=> NULL, NULL <=> NULL返回t|f|t）；BETWEEN AND判断操作数1是否大于等于操作数2且小于等于操作数3（SELECT 2 between 1 and 3返回t）。"
  source_anchor: "2.5.5 <=>/BETWEEN AND 页2325"
  source_refs: *refmcmp
  status: confirmed
- id: m_cmp_wave8_122_is_ops
  type: constraint
  statement: "IS/IS NOT操作符：expr IS boolean_value判断expr是否等价于boolean_value（等价返回t否则f，boolean_value可以是TRUE、FALSE、NULL或UNKNOWN），IS NOT为其否定；示例SELECT 1 IS TRUE, 0 IS FALSE, NULL IS UNKNOWN返回t|t|t；SELECT 1 IS NOT UNKNOWN, 0 IS NOT UNKNOWN, NULL IS NOT UNKNOWN返回t|t|f；IS NOT NULL判断非NULL（NULL IS NOT NULL返回f），IS NULL判断为NULL（NULL IS NULL返回t）。"
  source_anchor: "2.5.5 IS/IS NOT/IS NULL/IS NOT NULL 页2325-2326"
  source_refs: *refmcmp
  status: confirmed
- id: m_cmp_wave8_122_sounds_like
  type: constraint
  statement: "SOUNDS LIKE操作符：expr1 SOUNDS LIKE expr2判断expr1和expr2发音是否相同（相同返回t否则f）；其功能与对SOUNDEX函数进行比较相同，对英文字符串以外的输入无意义；示例SELECT \"jazz\" SOUNDS LIKE \"jabz\"返回f，SELECT \"jazz\" SOUNDS LIKE \"jack\"返回t。"
  source_anchor: "2.5.5 SOUNDS LIKE 页2326-2327"
  source_refs: *refmcmp
  status: confirmed
- id: m_cmp_wave8_122_coalesce
  type: syntax
  statement: "比较函数COALESCE(value1, value2, ...)返回参数列表中第一个非NULL值（如果没有非NULL值则返回空值；返回值类型由类型推导矩阵决定，根据入参类型决定返回值类型），示例SELECT COALESCE(NULL, 1)返回1、COALESCE(NULL, NULL, NULL)返回空值；另有GREATEST(value1, value2, ...)等比较函数。"
  source_anchor: "2.5.5 比较函数 页2327"
  source_refs: *refmcmp
  status: confirmed
- id: m_num_wave8_122_arith_ops
  type: syntax
  statement: "M兼容算术操作符包含+、-、*、/、%、-（取负操作）、DIV；+加法（SELECT 2+3返回5，一元+3返回3）；-减法或负数（SELECT 3-2返回1，SELECT -3返回-3）；*乘法（SELECT 2*3返回6，SELECT -2*3返回-6）；/除法（SELECT 4/2返回2.0000）；%或MOD取余（SELECT 7%4返回3）；DIV整除（SELECT 2.1 DIV 1与SELECT 1 DIV 2）。"
  source_anchor: "2.5.6 算术操作符 页2328-2330"
  source_refs: &refmnum
  - w8_122_2_5_6
  status: confirmed
- id: m_num_wave8_122_div_precision
  type: constraint
  statement: "M兼容除法精度规则：使用/进行除法运算时，两个精确值操作数结果的小数位数是第一个操作数的小数位数加上div_precision_increment系统变量的值（默认为4），例如表达式8.85/0.093的结果有六个小数位（95.161290）。"
  source_anchor: "2.5.6 / 说明 页2329"
  source_refs: *refmnum
  status: confirmed
- id: m_num_wave8_122_unsigned
  type: constraint
  statement: "M兼容无符号运算规则：如果两个操作数都是整数并且其中任何一个是无符号的，则结果是无符号整数；对于减法，如果启用NO_UNSIGNED_SUBTRACTION SQL模式，则即使任何操作数是无符号数，结果也会是有符号数。"
  source_anchor: "2.5.6 - 说明 页2329"
  source_refs: *refmnum
  status: confirmed
- id: m_num_wave8_122_type_tables
  type: constraint
  statement: "M兼容算术操作符中操作数提升规则以及结果类型规格：表2-42操作数归类、表2-43加法/乘法/取模结果类型、表2-44减法结果类型、表2-45除法结果类型、表2-46取负结果类型、表2-47整除结果类型（均按归类类型组合从上到下优先级从高到低确定最终结果类型）。"
  source_anchor: "2.5.6 表2-42~2-47 页2330-2332"
  source_refs: *refmnum
  status: confirmed
- id: m_num_wave8_122_trig_funcs
  type: syntax
  statement: "M兼容三角与反三角函数（返回值类型均为DOUBLE）：ACOS(X)返回X的反余弦值、ASIN(X)返回X的反正弦值、ATAN(X)返回X的反正切值、ATAN(Y,X)返回X与Y的反正切值（类似计算Y/X的反正切，两个参数的符号用于确定象限）、ATAN2(Y,X)功能用法完全等同于ATAN(Y,X)、COS(X)余弦、COT(X)余切、SIN(X)正弦、TAN(X)正切、DEGREES(X)将弧度转换为角度、RADIANS(X)返回指定角度X的弧度值。"
  source_anchor: "2.5.6 参数说明 页2330-2334"
  source_refs: *refmnum
  status: confirmed
- id: m_num_wave8_122_bit_ceil_funcs
  type: constraint
  statement: "M兼容BIT_COUNT(X)返回参数X解析为64位无符号整数后二进制表示中1的个数（返回值类型INT）；CEIL(INT X)为CEILING函数的别名，返回不小于X的最小整数值（X为NULL则返回NULL，返回值类型BIGINT、BIGINT UNSIGNED、DOUBLE、DECIMAL）；CEILING(X)同义。"
  source_anchor: "2.4.2.8.17→2.5.6 参数说明 BIT_COUNT/CEIL/CEILING 页2330-2331"
  source_refs: *refmnum
  status: confirmed
- id: m_num_wave8_122_conv_crc
  type: constraint
  statement: "M兼容CONV(TEXT N, INT from_base, INT to_base)进行进制转换；CRC32(TEXT str)计算循环冗余码校验值并返回；DEGREES(X)将弧度X转换为角度。"
  source_anchor: "2.5.6 参数说明 CONV/CRC32/DEGREES 页2331-2333"
  source_refs: *refmnum
  status: confirmed
- id: m_num_wave8_122_log_exp_funcs
  type: syntax
  statement: "M兼容指数对数函数：EXP(X)返回e的X次幂；FLOOR(X)返回不大于X的最大整数值；LN(X)返回X的自然对数；LOG([B,]X)对数函数（单参数返回X的自然对数，双参数返回以B为底X的对数）；LOG10(X)返回以10为底的对数；LOG2(X)返回以2为底的对数；PI()返回圆周率；POW(X,Y)/POWER(X,Y)返回X的Y次幂；SQRT(X)返回X的平方根。"
  source_anchor: "2.5.6 参数说明 页2333-2335"
  source_refs: *refmnum
  status: confirmed
- id: m_num_wave8_122_rand_round
  type: constraint
  statement: "M兼容RAND([seed])返回随机浮点数（范围[0,1)，返回值类型DOUBLE）；ROUND(X,[D])将参数X四舍五入到指定的位数（D可选表示数据处理的规则即精度，返回值类型BIGINT、BIGINT UNSIGNED、DOUBLE、DECIMAL；函数行为受GUC参数m_format_behavior_compat_options值影响）。"
  source_anchor: "2.4.2.8.17→2.5.6 参数说明 RAND/ROUND 页2334-2335"
  source_refs: *refmnum
  status: confirmed
- id: m_num_wave8_122_sign_mod
  type: constraint
  statement: "M兼容SIGN(X)返回X的符号对应的值（正值返回1、零值返回0、负值返回-1，返回值类型BIGINT）；MOD(X,Y)取余函数。"
  source_anchor: "2.4.2.8.17→2.5.6 参数说明 SIGN/MOD 页2335-2336"
  source_refs: *refmnum
  status: confirmed
- id: m_num_wave8_122_sqrt_truncate
  type: constraint
  statement: "M兼容SQRT(X)返回X的平方根；TAN(X)返回X的正切值；TRUNCATE(X,D)将X截断到指定小数位D。"
  source_anchor: "2.5.6 参数说明 SQRT/TAN/TRUNCATE 页2336"
  source_refs: *refmnum
  status: confirmed
- id: m_cmp_wave8_122_isnull_ops
  type: syntax
  statement: "M兼容IS NULL/IS NOT NULL操作符：IS NOT NULL判断expr是否为非NULL（是则返回t否则f），IS NULL判断expr是否为NULL（是则返回t否则f）；示例SELECT 1 IS NOT NULL, 0 IS NOT NULL, NULL IS NOT NULL返回t|t|f；SELECT 1 IS NULL, 0 IS NULL, NULL IS NULL返回f|f|t。"
  source_anchor: "2.5.5 IS NOT NULL/IS NULL 页2326"
  source_refs: *refmcmp
  status: confirmed
- id: m_cmp_wave8_122_greatest
  type: constraint
  statement: "M兼容比较函数还包括GREATEST(value1, value2, ...)等；比较函数用于对输入值进行比较判断并返回相应结果。"
  source_anchor: "2.5.5 比较函数 页2327"
  source_refs: *refmcmp
  status: confirmed
open_questions:
- id: m_cmp_num_wave8_122_oq_runtime
  statement: "M兼容<=>与行表达式组合的报错边界、算术结果类型表在UNSIGNED混算下的溢出行为、ROUND受m_format_behavior_compat_options影响的具体规则需授权环境实机验证。"
  status: open
