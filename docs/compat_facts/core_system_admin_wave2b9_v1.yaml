- id: wave2b9_check_segment_table
  type: constraint
  statement: gs_check_segment_table()检查当前数据库是否包含段页式表；开启大容量NVMe缓存优化前必须执行，SUCCESS表示不存在段页式表，FAILED表示存在。
  source_anchor: 1.6.27.16 页744
  source_refs: *id001
  status: confirmed
- id: wave2b9_nvme_spdk_stat
  type: syntax
  statement: gs_nvme_spdk_stat()查询NVMe SPDK模式运行状态，包括node_name、io_mode、NVMe/EVS读写带宽、NVMe/EVS历史IO异常数量和最近异常时间。
  source_anchor: 1.6.27.16 页746
