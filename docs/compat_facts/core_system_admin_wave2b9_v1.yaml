- id: wave2b9_nvme_heat_map_status
  type: syntax
  statement: gs_nvme_heat_map_status()查看NVMe页面热度分布，range支持0、3、4、5、10、20、30、40和-1；-1表示MAX_HEAT。
  source_anchor: 1.6.27.16 页743-744
