  content: "数组varray_compat与tableof_elem_constraints组合开启时越界与元素约束校验的叠加边界、带索引集合VARCHAR下标长度校验与bulk collect into的INTEGER下标限制交互、record构造器=>连续赋值在多层嵌套复合类型场景需授权环境实机验证。"
