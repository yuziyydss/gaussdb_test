facts:
- id: cts_wave8_47_purpose
  type: syntax
  statement: "CREATE TABLESPACE用于在数据库中创建新表空间。"
  source_anchor: "1.13.9.52 页1588"
  source_refs: &refcts
  - w8_47_1_13_9_52
  status: confirmed
- id: cts_wave8_47_permissions
  type: constraint
  statement: "系统管理员或继承内置角色gs_role_tablespace权限的用户可以创建表空间；只有系统管理员可以创建，但可通过OWNER子句将表空间所有权赋给其他非系统管理员。"
  source_anchor: "1.13.9.52 注意事项/OWNER 页1588-1590"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_transaction_failure
  type: constraint
  statement: "不允许在事务块中执行CREATE TABLESPACE；CREATE TABLESPACE不支持两阶段事务，如果部分节点执行失败不支持回滚。"
  source_anchor: "1.13.9.52 注意事项 页1588"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_residual_cleanup
  type: constraint
  statement: "表空间创建过程中内部目录/文件操作成功但后续失败时会产生残留目录/文件；重新创建前需手动清理指定目录残留内容，若数据目录下存在表空间软连接残留，需先删除软连接残留文件再重新执行OM相关操作。"
  source_anchor: "1.13.9.52 注意事项 页1588"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_hcs_pdb_advice
  type: constraint
  statement: "HCS等场景一般不建议使用自定义表空间，建议使用默认表空间；每个PDB拥有自己的表空间对象，在PDB中创建表空间仅支持相对路径。"
  source_anchor: "1.13.9.52 注意事项 页1589"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_main_syntax
  type: syntax
  statement: "CREATE TABLESPACE tablespace_name [OWNER user_name] [RELATIVE] LOCATION 'directory' [MAXSIZE 'space_size'] [with_option_clause]；普通表空间WITH支持filesystem、address、cfgpath、storepath、random_page_cost和seq_page_cost。"
  source_anchor: "1.13.9.52 语法格式 页1589"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_name_rules
  type: constraint
  statement: "表空间名称必须符合标识符命名规范，不能与其他表空间重名，且不能以pg作为前缀。"
  source_anchor: "1.13.9.52 tablespace_name 页1589-1590"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_owner
  type: syntax
  statement: "OWNER指定表空间所有者；未指定时新表空间所有者为当前用户，取值为已存在用户。"
  source_anchor: "1.13.9.52 OWNER 页1590"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_relative
  type: syntax
  statement: "RELATIVE指定相对路径，LOCATION相对于各数据库节点数据目录，目录层次为数据目录/pg_location/相对路径且相对路径最多两层；未指定RELATIVE时LOCATION必须使用绝对路径。"
  source_anchor: "1.13.9.52 RELATIVE 页1590"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_location_requirements
  type: constraint
  statement: "绝对路径LOCATION要求系统用户对目录有读写权限、目录为空；目录不存在时自动创建；目录必须为本地绝对路径，不得包含$、>等特殊字符，不允许在数据库数据目录下，建议首选Ext4格式文件目录。"
  source_anchor: "1.13.9.52 LOCATION 页1590"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_maxsize
  type: syntax
  statement: "MAXSIZE指定表空间在单个数据库节点上的最大值；支持KB、MB、GB、TB和PB，解析后以KB为单位且范围为1KB~9007199254740991KB。"
  source_anchor: "1.13.9.52 MAXSIZE 页1590"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_with_options
  type: syntax
  statement: "WITH选项中filesystem取general，hdfs当前不支持且默认general；address、cfgpath和storepath分别指定IP:端口、配置文件地址和根路径地址。"
  source_anchor: "1.13.9.52 WITH选项 页1589-1590"
  source_refs: *refcts
  status: confirmed
- id: cts_wave8_47_cost_options
  type: syntax
  statement: "WITH中random_page_cost和seq_page_cost表示随机/顺序读取page所需时间和资源，取值范围0~1.79769e+308；默认分别使用GUC参数random_page_cost和seq_page_cost的值。"
  source_anchor: "1.13.9.52 cost选项 页1591"
  source_refs: *refcts
  status: confirmed
- id: ats_wave8_47_purpose
  type: syntax
  statement: "ALTER TABLESPACE用于修改表空间属性。"
  source_anchor: "1.13.7.39 页1328"
  source_refs: &refats
  - w8_47_1_13_7_39
  status: confirmed
- id: ats_wave8_47_permissions
  type: constraint
  statement: "只有表空间所有者或被赋予表空间ALTER权限的用户可执行ALTER TABLESPACE，系统管理员默认拥有该权限；修改owner时当前用户必须是表空间所有者或系统管理员，且是new_owner角色的成员。"
  source_anchor: "1.13.7.39 注意事项 页1328-1329"
  source_refs: *refats
  status: confirmed
- id: ats_wave8_47_transaction_system_owner
  type: constraint
  statement: "对行存表的ALTER TABLESPACE操作不支持在事务块中执行；修改系统表空间所有者时仅允许初始用户将所有者修改为自己。"
  source_anchor: "1.13.7.39 注意事项 页1329"
  source_refs: *refats
  status: confirmed
- id: ats_wave8_47_owner_membership
  type: constraint
  statement: "将表空间所有者A修改为B时，A必须是B的直接或间接成员；若new_owner与old_owner一致，不再校验当前操作用户的修改权限，直接显示ALTER成功。"
  source_anchor: "1.13.7.39 注意事项 页1329"
  source_refs: *refats
  status: confirmed
- id: ats_wave8_47_rename_owner_syntax
  type: syntax
  statement: "ALTER TABLESPACE tablespace_name RENAME TO new_tablespace_name用于重命名表空间；ALTER TABLESPACE tablespace_name OWNER TO new_owner用于设置表空间所有者。"
  source_anchor: "1.13.7.39 语法格式 页1329"
  source_refs: *refats
  status: confirmed
- id: ats_wave8_47_set_reset_syntax
  type: syntax
  statement: "ALTER TABLESPACE可使用SET ({tablespace_option=value}[, ...])设置属性，RESET ({tablespace_option}[, ...])重置属性。"
  source_anchor: "1.13.7.39 语法格式 页1329"
  source_refs: *refats
  status: confirmed
- id: ats_wave8_47_options_resize
  type: syntax
  statement: "tablespace_option支持seq_page_cost和random_page_cost，缺省分别为1.0和4.0，value必须为浮点正数；RESIZE MAXSIZE支持UNLIMITED或CREATE TABLESPACE的space_size格式，新限额低于当前实际使用值时可执行成功，但需将使用值降到新限额下才能继续写入。示例可用RENAME TO、OWNER TO、SET/RESET和RESIZE MAXSIZE完成变更，并通过\\db与pg_tablespace观察。"
  source_anchor: "1.13.7.39 参数说明/示例 页1330-1331"
  source_refs: *refats
  status: confirmed
open_questions:
- id: tbs_wave8_47_oq_runtime
  statement: "CREATE/ALTER TABLESPACE在真实多节点、路径权限、限额调整和并发DML组合下的残留清理、回滚与错误矩阵需授权环境实机验证。"
  status: open
