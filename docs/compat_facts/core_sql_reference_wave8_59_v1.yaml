facts:
- id: ftable_wave8_59_create_purpose
  type: syntax
  statement: "CREATE FOREIGN TABLE用于创建外表。"
  source_anchor: "1.13.9.22 页1434"
  source_refs: &refcreate
  - w8_59_1_13_9_22
  status: confirmed
- id: ftable_wave8_59_create_system_columns
  type: constraint
  statement: "外表暂不支持使用tableoid、ctid等系统列；Private和Shared模式的外表需要初始用户或运维模式下的运维管理员权限。"
  source_anchor: "1.13.9.22 注意事项 页1434"
  source_refs: *refcreate
  status: confirmed
- id: ftable_wave8_59_create_sensitive_options
  type: constraint
  statement: "CREATE FOREIGN TABLE的OPTIONS中敏感字段（如password、secret_access_key）使用多层引号时语义与不带引号场景不同，不会被识别为敏感字段进行脱敏。"
  source_anchor: "1.13.9.22 注意事项 页1434"
  source_refs: *refcreate
  status: confirmed
- id: ftable_wave8_59_create_pdb
  type: constraint
  statement: "多租场景下，只有初始用户可在PDB内部执行CREATE FOREIGN TABLE命令。"
  source_anchor: "1.13.9.22 注意事项 页1434"
  source_refs: *refcreate
  status: confirmed
- id: ftable_wave8_59_create_syntax
  type: syntax
  statement: "CREATE FOREIGN TABLE [IF NOT EXISTS] table_name可定义列名、类型、列级OPTIONS、COLLATE和列约束，并需指定SERVER server_name和外表级OPTIONS。"
  source_anchor: "1.13.9.22 语法格式 页1434"
  source_refs: *refcreate
  status: confirmed
- id: ftable_wave8_59_if_not_exists
  type: constraint
  statement: "IF NOT EXISTS用于判断同名表是否存在；已存在同名表时不直接报错，而是产生提示告知表关系已存在。"
  source_anchor: "1.13.9.22 IF NOT EXISTS 页1435"
  source_refs: *refcreate
  status: confirmed
- id: ftable_wave8_59_names_types
  type: syntax
  statement: "table_name、column_name和type_name分别指定外表名、外表字段名和字段数据类型；COLLATE可为可排列类型指定排序规则，未指定时使用默认排序规则。"
  source_anchor: "1.13.9.22 参数说明 页1435"
  source_refs: *refcreate
  status: confirmed
- id: ftable_wave8_59_options_validation
  type: constraint
  statement: "外表OPTIONS由外部数据封装器指定并通过其验证函数验证；不允许重复指定相同选项名，尽管表选项和表字段选项可以同名。"
  source_anchor: "1.13.9.22 OPTIONS 页1435"
  source_refs: *refcreate
  status: confirmed
- id: ftable_wave8_59_file_fdw_options
  type: syntax
  statement: "file_fdw支持的OPTIONS包括filename（必选且必须绝对路径）、format、header、delimiter、quote、escape、null、encoding和force_not_null。"
  source_anchor: "1.13.9.22 file_fdw options 页1435-1436"
  source_refs: *refcreate
  status: confirmed
- id: ftable_wave8_59_column_constraints
  type: syntax
  statement: "外表列约束支持NOT NULL、NULL和DEFAULT default_expr；DEFAULT表达式不能含变量、子查询或对本表其他字段交叉引用，类型必须匹配列类型。"
  source_anchor: "1.13.9.22 column_constraint 页1435-1436"
  source_refs: *refcreate
  status: confirmed
- id: ftable_wave8_59_create_example
  type: behavior_oracle
  statement: "示例中先创建SERVER my_server，再通过CREATE FOREIGN TABLE foreign_tbl (col1 text) SERVER my_server OPTIONS (logtype 'gs_log')创建外表。"
  source_anchor: "1.13.9.22 示例 页1436-1437"
  source_refs: *refcreate
  status: confirmed
- id: ftable_wave8_59_alter_purpose
  type: syntax
  statement: "ALTER FOREIGN TABLE用于修改外表属性和外表字段选项。"
  source_anchor: "1.13.7.13 页1218"
  source_refs: &refalt
  - w8_59_1_13_7_13
  status: confirmed
- id: ftable_wave8_59_alter_system_columns
  type: constraint
  statement: "ALTER FOREIGN TABLE同样暂不支持使用系统列；OPTIONS敏感字段多层引号不会被脱敏；多租场景下只有初始用户可在PDB内部执行。"
  source_anchor: "1.13.7.13 注意事项 页1218"
  source_refs: *refalt
  status: confirmed
- id: ftable_wave8_59_alter_options_syntax
  type: syntax
  statement: "ALTER FOREIGN TABLE [IF EXISTS] table_name OPTIONS ({[ADD|SET|DROP] option ['value']}[, ...])可修改外表属性。"
  source_anchor: "1.13.7.13 语法格式 页1218"
  source_refs: *refalt
  status: confirmed
- id: ftable_wave8_59_alter_column_options_syntax
  type: syntax
  statement: "ALTER FOREIGN TABLE [IF EXISTS] table_name ALTER column_name OPTIONS可用于修改外表字段选项。"
  source_anchor: "1.13.7.13 语法格式 页1218"
  source_refs: *refalt
  status: confirmed
- id: ftable_wave8_59_alter_options_semantics
  type: constraint
  statement: "ALTER的OPTIONS中ADD、SET和DROP指定操作，未指定默认ADD；选项名需满足约束，选项名和值通过外部数据封装的类校验。"
  source_anchor: "1.13.7.13 OPTIONS 页1219"
  source_refs: *refalt
  status: confirmed
- id: ftable_wave8_59_alter_file_fdw_options
  type: syntax
  statement: "ALTER FOREIGN TABLE的file_fdw选项包括filename（必选绝对路径）、format、header、delimiter、quote、escape、null、encoding和force_not_null。"
  source_anchor: "1.13.7.13 file_fdw options 页1219"
  source_refs: *refalt
  status: confirmed
- id: ftable_wave8_59_alter_example
  type: behavior_oracle
  statement: "示例中ALTER FOREIGN TABLE foreign_tbl OPTIONS可依次ADD、SET和DROP latest_files，之后可DROP FOREIGN TABLE和DROP SERVER完成清理。"
  source_anchor: "1.13.7.13 示例 页1220"
  source_refs: *refalt
  status: confirmed
- id: ftable_wave8_59_drop_effects
  type: constraint
  statement: "DROP FOREIGN TABLE会强制删除指定表；删除后依赖该表的索引级联删除，使用该表的函数和存储过程将无法执行。多租场景下仅初始用户可在PDB内部执行。"
  source_anchor: "1.13.10.16 注意事项 页1669"
  source_refs: &refdrop
  - w8_59_1_13_10_16
  status: confirmed
- id: ftable_wave8_59_drop_syntax
  type: syntax
  statement: "DROP FOREIGN TABLE [IF EXISTS] table_name[, ...] [CASCADE|RESTRICT]；IF EXISTS在外表不存在时不删除并返回NOTICE；CASCADE级联删除依赖外表的对象（如视图），RESTRICT在存在依赖对象时拒绝删除，未指定默认RESTRICT。"
  source_anchor: "1.13.10.16 语法/参数 页1669"
  source_refs: *refdrop
  status: confirmed
