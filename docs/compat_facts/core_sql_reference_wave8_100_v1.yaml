facts:
- id: deallocate_wave8_100_syntax
  type: syntax
  statement: "DEALLOCATE从数据库中删除一条预备语句，可手动释放通过PREPARE创建的预处理语句，未显式释放时预处理语句会在会话结束时自动清除；语法为DEALLOCATE [ PREPARE ] { name | ALL }，PREPARE可选仅用于语法兼容性实际执行时被忽略，ALL删除所有预备语句。"
  source_anchor: "1.13.10.1 功能描述/注意事项/语法格式/参数说明 页1646"
  source_refs: &refdealloc
  - w8_100_1_13_10_1
  status: confirmed
- id: deallocate_wave8_100_example
  type: behavior_oracle
  statement: "示例：PREPARE q1..q4四个预备语句后SELECT name, statement, parameter_types FROM pg_prepared_statements显示4行；DEALLOCATE q4后剩3行；DEALLOCATE ALL返回DEALLOCATE ALL且查询结果为0行。"
  source_anchor: "1.13.10.1 示例 页1646-1647"
  source_refs: *refdealloc
  status: confirmed
- id: declare_wave8_100_syntax
  type: syntax
  statement: "DECLARE既可以定义一个游标（在一个大的查询里面检索少数几行数据），也可以用于声明匿名块（需放置在匿名块的语句之前，用法参见BEGIN章节）；定义游标语法为DECLARE cursor_name [ BINARY ] [ NO SCROLL ] CURSOR [ { WITH | WITHOUT } HOLD ] FOR query；游标是指向上下文区域的句柄或指针，借助游标存储过程可以控制上下文区域的变化。"
  source_anchor: "1.13.10.2 功能描述/语法格式 页1647-1648"
  source_refs: &refdeclare
  - w8_100_1_13_10_2
  status: confirmed
- id: declare_wave8_100_binary
  type: constraint
  statement: "游标命令只能在事务块里使用；谨慎使用二进制游标：文本格式一般比对应的二进制格式占用的存储空间大，二进制游标返回内部二进制形态的数据可能更易于操作（整数1在缺省游标里获得字符串1，在二进制游标里将得到一个4字节的包含该数值内部形式的数值（大端顺序））；以文本方式显示数据时文本检索会为用户节约很多客户端的工作。"
  source_anchor: "1.13.10.2 注意事项 页1648"
  source_refs: *refdeclare
  status: confirmed
- id: declare_wave8_100_hold
  type: constraint
  statement: "WITH HOLD在创建游标的事务结束后该游标仍可继续使用；WITHOUT HOLD在事务之外不能再继续使用该游标，游标将在事务结束时被自动关闭；未指定WITH HOLD或WITHOUT HOLD时默认行为是WITHOUT HOLD；须知：声明为WITH HOLD的游标在事务结束时会缓存游标所有数据，若游标数据量较大此过程耗时可能较长。"
  source_anchor: "1.13.10.2 参数说明 页1648-1649"
  source_refs: *refdeclare
  status: confirmed
- id: declare_wave8_100_params
  type: constraint
  statement: "参数：cursor_name为将要创建的游标名（符合标识符命名规范的字符串）；BINARY指定游标以二进制格式返回而不是文本格式返回数据；NO SCROLL声明该游标不能用于以倒序的方式检索数据行，未指定时根据执行计划的不同自动判断该游标是否可以用于以倒序的方式检索数据行；query使用SELECT或VALUES子句指定游标返回的行。"
  source_anchor: "1.13.10.2 参数说明 页1648-1649"
  source_refs: *refdeclare
  status: confirmed
- id: declare_wave8_100_cursor_example
  type: behavior_oracle
  statement: "示例：START TRANSACTION后DECLARE cursor1 CURSOR FOR SELECT * FROM test ORDER BY 1；FETCH FORWARD 3 FROM cursor1返回1|1、2|2、3|3三行；CLOSE cursor1后END提交事务。"
  source_anchor: "1.13.10.2 示例 页1649-1650"
  source_refs: *refdeclare
  status: confirmed
- id: declare_wave8_100_anon_block
  type: syntax
  statement: "开启匿名块语法为[DECLARE [declare_statements]] BEGIN execution_statements END; /；declare_statements用于声明变量（包括变量名和变量类型，如\"sales_cnt int\"），execution_statements为匿名块中要执行的语句；示例DECLARE num INTEGER := 10; BEGIN dbe_output.print_line(num);。"
  source_anchor: "1.13.10.2 语法格式/参数说明/示例 页1649-1650"
  source_refs: *refdeclare
  status: confirmed
- id: do_wave8_100_syntax
  type: syntax
  statement: "DO执行匿名代码块，代码块被看作是没有参数的一段函数体，返回值类型是VOID，其解析和执行同时进行；语法为DO [ LANGUAGE lang_name ] code，lang_name为解析代码的程序语言名称（未指定时默认为plpgsql），code必须指定为字符串；程序语言在使用之前必须通过CREATE LANGUAGE安装到当前数据库（plpgsql是默认安装语言，其他语言安装时必须指定）；如果语言是不受信任的，用户必须有使用程序语言的USAGE权限或系统管理员权限。"
  source_anchor: "1.13.10.4 功能描述/注意事项/语法格式/参数说明 页1657"
  source_refs: &refdo
  - w8_100_1_13_10_4
  status: confirmed
- id: do_wave8_100_example
  type: behavior_oracle
  statement: "示例：DO $$DECLARE r record; BEGIN FOR r IN SELECT c.relname table_name,n.nspname table_schema FROM pg_class c,pg_namespace n WHERE c.relnamespace = n.oid AND n.nspname = 'tpcds' AND relkind IN ('r','v') LOOP EXECUTE 'GRANT ALL ON ' || quote_ident(r.table_schema) || '.' || quote_ident(r.table_name) || ' TO webuser'; END LOOP; END$$;为用户webuser授予模式tpcds下所有表和视图的操作权限。"
  source_anchor: "1.13.10.4 示例 页1657"
  source_refs: *refdo
  status: confirmed
- id: rollback_wave8_100_syntax
  type: syntax
  statement: "ROLLBACK回滚当前事务并取消当前事务中的所有更新：事务运行过程中发生故障不能继续执行时，系统将事务中对数据库的所有已完成操作全部撤销，数据库状态回到事务开始时；语法为ROLLBACK [ WORK | TRANSACTION ]，WORK/TRANSACTION为可选关键字除增加可读性外没有任何其他作用。"
  source_anchor: "1.13.18.11 功能描述/语法格式/参数说明 页1800"
  source_refs: &refrb
  - w8_100_1_13_18_11
  status: confirmed
- id: rollback_wave8_100_notice
  type: constraint
  statement: "如果不在一个事务内部发出ROLLBACK就不会有问题，但是将抛出一个NOTICE信息。"
  source_anchor: "1.13.18.11 注意事项 页1800"
  source_refs: *refrb
  status: confirmed
- id: rollback_wave8_100_example
  type: behavior_oracle
  statement: "示例：START TRANSACTION后ALTER TABLE test ADD COLUMN score int，\\d test显示score列；ROLLBACK后\\d test显示表结构恢复初始状态（无score列）；相关链接COMMIT | END。"
  source_anchor: "1.13.18.11 示例 页1800-1801"
  source_refs: *refrb
  status: confirmed
- id: rollback_prepared_wave8_100_syntax
  type: syntax
  statement: "ROLLBACK PREPARED取消一个先前为两阶段提交准备好的事务；语法为ROLLBACK PREPARED transaction_id，transaction_id为待提交事务的标识符，不能和任何当前预备事务已经使用了的标识符同名；回滚预备事务必须是最初发起事务的用户或系统管理员；事务功能由数据库自动维护，不应显式使用事务功能。"
  source_anchor: "1.13.18.12 功能描述/注意事项/语法格式/参数说明 页1801"
  source_refs: &refrbp
  - w8_100_1_13_18_12
  status: confirmed
- id: rollback_prepared_wave8_100_example
  type: behavior_oracle
  statement: "示例：BEGIN后PREPARE TRANSACTION 'trans_test'返回PREPARE TRANSACTION；ROLLBACK PREPARED 'trans_test'返回ROLLBACK PREPARED；相关链接COMMIT PREPARED、PREPARE TRANSACTION。"
  source_anchor: "1.13.18.12 示例 页1801-1802"
  source_refs: *refrbp
  status: confirmed
- id: rollback_savepoint_wave8_100_syntax
  type: syntax
  statement: "ROLLBACK TO SAVEPOINT回滚到指定保存点，该保存点之后的操作不生效；语法为ROLLBACK [ WORK | TRANSACTION ] TO [ SAVEPOINT ] savepoint_name，WORK/TRANSACTION为可选关键字除增加可读性外没有任何其他作用。"
  source_anchor: "1.13.18.13 功能描述/语法格式 页1802"
  source_refs: &refrbs
  - w8_100_1_13_18_13
  status: confirmed
- id: rollback_savepoint_wave8_100_semantics
  type: constraint
  statement: "回滚所有指定保存点建立之后执行的命令；保存点仍然有效，并且需要时可以再次回滚到该点；不能回滚到一个未定义的保存点，语法上会报错。"
  source_anchor: "1.13.18.13 功能描述/注意事项 页1802"
  source_refs: *refrbs
  status: confirmed
- id: rollback_savepoint_wave8_100_cursor
  type: constraint
  statement: "游标在保存点方面有一些非事务性的行为：任何在保存点里打开的游标都会在回滚掉这个保存点之后关闭；如果一个前面打开了的游标在保存点里面且被FETCH命令影响，保存点稍后回滚时游标位置仍在FETCH让它指向的位置（FETCH不会被回滚）；关闭一个游标的行为也不会被回滚撤消；如果一个游标的操作导致事务回滚，该游标就会置于不可执行状态——尽管事务可以用ROLLBACK TO SAVEPOINT重新恢复，但游标不能再使用了。"
  source_anchor: "1.13.18.13 注意事项 页1802"
  source_refs: *refrbs
  status: confirmed
- id: rollback_savepoint_wave8_100_release
  type: constraint
  statement: "使用ROLLBACK TO SAVEPOINT回滚到一个保存点；使用RELEASE SAVEPOINT删除一个保存点，但是保留该保存点建立后执行的命令的结果。"
  source_anchor: "1.13.18.13 注意事项 页1802"
  source_refs: *refrbs
  status: confirmed
- id: rollback_savepoint_wave8_100_example
  type: behavior_oracle
  statement: "示例：SAVEPOINT my_savepoint后ROLLBACK TO SAVEPOINT my_savepoint；DECLARE foo CURSOR FOR SELECT 1 UNION SELECT 2；SAVEPOINT foo后FETCH 1 FROM foo返回第一条数据1；ROLLBACK TO SAVEPOINT foo后再FETCH 1 FROM foo返回第二条数据2（游标位置不受保存点回滚影响）；RELEASE SAVEPOINT my_savepoint释放保存点后COMMIT结束事务；相关链接SAVEPOINT、RELEASE SAVEPOINT。"
  source_anchor: "1.13.18.13 示例 页1802-1803"
  source_refs: *refrbs
  status: confirmed
open_questions:
- id: dcl_tcl_wave8_100_oq_runtime
  statement: "WITH HOLD游标大数据量缓存的耗时边界、两阶段提交PREPARE/ROLLBACK PREPARED与故障恢复组合、保存点内游标FETCH位置在异常回滚下的行为在授权环境下的完整行为与错误矩阵需实机验证。"
  status: open
