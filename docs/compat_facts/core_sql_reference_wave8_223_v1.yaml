- id: sql_stmt_wave8_223_alter_statements
  type: syntax
  statement: "ALTER语句（2.4.2.6）：ALTER AUDIT POLICY（审计策略修改——filter_group/policy category等子句）/ALTER DATABASE（数据库名称/属性/字符集/表空间/连接数限制修改）/ALTER DEFAULT PRIVILEGES（默认权限——FOR ROLE/FOR SCHEMA子句/GRANT/REVOKE子句）/ALTER EXTENSION（扩展更新/DROP成员对象）/ALTER GROUP（组操作ADD USER/DROP USER/RENAME TO）/ALTER INDEX（索引重命名/表空间移动）/ALTER RESOURCE LABEL（资源标签添加/删除标签）/ALTER ROLE（角色属性修改——SUPERUSER/CREATEDB/CONNECTION LIMIT等）/ALTER SCHEMA（模式重命名/所有者变更）/ALTER SEQUENCE（序列参数修改——INCREMENT BY/MINVALUE/MAXVALUE/CYCLE等）/ALTER SESSION（会话参数修改——SET参数/ADVISE等）/ALTER TABLE（表修改——ADD COLUMN/DROP COLUMN/ALTER COLUMN TYPE/RENAME/SET SCHEMA/OWNER/ENABLE TRIGGER/DISABLE ROW LEVEL SECURITY等）/ALTER TABLE PARTITION（分区表修改——ADD/DROP/MERGE/SPLIT/EXCHANGE/RENAME/TRUNCATE/SET TABLESPACE等分区操作）/ALTER TABLE SUBPARTITION（二级分区表修改）/ALTER USER（用户属性修改同ALTER ROLE）/ALTER VIEW（视图修改——ALTER COLUMN/OWNER/RENAME/SET SCHEMA）。"
  source_anchor: "2.4.2.6 A（ALTER系列） 页2012-2072"
  source_refs: *refw8223
  status: confirmed
- id: sql_stmt_wave8_223_analyze_begin
