  statement: "ANALYZE/BEGIN语句：ANALYZE（2.4.2.6.17）——收集表统计信息（VERBOSE/可选表列表/列列表）；AUTOHINT（2.4.2.6.18）——自动Hint功能；AUTOHINT DROP/PURGE——删除/清理自动Hint；BEGIN（2.4.2.7.1）——开启事务块（WORK/TRANSACTION/ISOLATION LEVEL/READ WRITE|ONLY等子句）。"
  source_anchor: "2.4.2.6.17-2.4.2.7.1 页2065-2074"
