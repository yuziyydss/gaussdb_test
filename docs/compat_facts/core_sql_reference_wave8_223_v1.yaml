- id: sql_stmt_wave8_223_c_statements
  type: syntax
  statement: "C开头语句（2.4.2.8）：CLEAN CONNECTION——清理数据库连接（TO NODE/TO COORDINATOR等/FOR FORCE）；CHECKPOINT——执行检查点；COMMENT——对象注释（COMMENT ON TABLE/COLUMN/INDEX等）；COMMIT——提交事务（WORK/TRANSACTION）；COPY——数据导入导出（FROM/TO文件或STDIN/STDOUT/CSV/BINARY/DELIMITER/HEADER/ENCODING等选项/TRANSFORM表达式处理）；CREATE AUDIT POLICY（审计策略创建——privilege_access/DDL/DML等审计对象）；CREATE DATABASE（数据库创建——DBCOMPATIBILITY/ENCODING/LC_COLLATE/LC_CTYPE/TEMPLATE等属性）；CREATE EXTENSION（扩展创建）；CREATE FUNCTION（函数创建——RETURNS/PLSQL/参数模式IN/OUT/INOUT等）；CREATE GROUP（组创建）；CREATE INDEX（索引创建——UNIQUE/BTREE/UBTREE/ON表名/列名/表达式/PARTITION BY等）；CREATE RESOURCE LABEL（资源标签创建）；CREATE ROLE（角色创建——SUPERUSER/CREATEDB/CONNECTION LIMIT/PASSWORD等）；CREATE SCHEMA（模式创建——AUTHORIZATION/ELEMENTS）；CREATE SEQUENCE（序列创建——INCREMENT/MINVALUE/MAXVALUE/START/CACHE/CYCLE/OWNED BY等）；CREATE TABLE（表创建——列定义/约束/存储参数/分区定义等）；CREATE TABLE PARTITION（分区表创建——RANGE/LIST/HASH分区策略/VALUES LESS THAN/VALUES等）；CREATE TABLE SUBPARTITION（二级分区表创建）；CREATE TABLE SELECT（AS SELECT建表）；CREATE USER（用户创建——同CREATE ROLE附加LOGIN）；CREATE VIEW（视图创建——AS query/WITH CHECK OPTION）。"
  source_anchor: "2.4.2.8 C语句 页2074-2181"
  source_refs: *refw8223
  status: confirmed
- id: sql_stmt_wave8_223_d_statements
  type: syntax
  statement: "D开头语句（2.4.2.9）：DEALLOCATE——释放预编译语句（PREPARE name/ALL）；DELETE——删除数据（FROM表名/WHERE条件/RETURNING等/子查询删除）；DESCRIBE——描述对象（表/索引等字段信息）；DO——执行匿名块（LANGUAGE plpgsql/DECLARE/BEGIN/END等）；DROP AUDIT POLICY（审计策略删除）；DROP DATABASE（数据库删除）；DROP EXTENSION（扩展删除）；DROP FUNCTION（函数删除——CASCADE/参数列表）；DROP GROUP（组删除）；DROP INDEX（索引删除）；DROP OWNED（删除所有者对象——CASCADE/RESTRICT）；DROP PREPARE（释放预编译）；DROP RESOURCE LABEL（资源标签删除）；DROP ROLE（角色删除）；DROP SCHEMA（模式删除——CASCADE/RESTRICT）；DROP SEQUENCE（序列删除）；DROP TABLE（表删除——CASCADE/RESTRICT/PURGE）；DROP USER（用户删除）；DROP VIEW（视图删除——CASCADE/RESTRICT）。"
  source_anchor: "2.4.2.9 D语句 页2181-2204"
  source_refs: *refw8223
  status: confirmed
- id: sql_stmt_wave8_223_e_g_i_l_p
  type: syntax
  statement: "E/G/I/L/P开头语句：EXECUTE（执行预编译语句——USING参数列表）；EXPLAIN（执行计划显示——VERBOSE/COSTS/FORMAT TEXT|XML|JSON|YAML/ANALYZE/DSN等选项）；GENERATED UPDATE SYSTEM——更新系统生成列；GRANT（权限授予——privilege_type ON object TO user/WITH GRANT OPTION/系统权限/对象权限等）；INSERT——插入数据（INTO表名/VALUES/SELECT/DEFAULT VALUES/RETURNING/ON DUPLICATE KEY UPDATE等）；LOAD DATA——数据导入（INFILE/CHARACTER SET/FIELDS/LINES/IGNORE/SET等）；LOCK——锁定表（TABLE/IN lock_mode MODE/NOWAIT等）；PREPARE——预编译语句（FROM string）；PURGE——清除回收站对象（TABLE/INDEX/RECYCLEBIN等）。"
  source_anchor: "2.4.2.10-2.4.2.14 页2204-2247"
  source_refs: *refw8223
  status: confirmed
- id: sql_stmt_wave8_223_r_s_t
  type: syntax
  statement: "R/S/T开头语句：REINDEX——重建索引（INDEX/TABLE/DATABASE/SYSTEM/SCHEMA/CONCURRENTLY）；RELEASE SAVEPOINT——释放保存点；RENAME TABLE——表重命名（TO new_name/多组表同时重命名）；REPLACE——替换插入（INTO表名/VALUES/SET等）；RESET——恢复参数默认值（ALL/parameter_name）；REVOKE——权限回收（同GRANT语法/FROM user/CASCADE/RESTRICT）；ROLLBACK——回滚事务（WORK/TO SAVEPOINT）；SAVEPOINT——设置保存点（savepoint_name）；SELECT——查询（DISTINCT/投影列/FROM/WHERE/GROUP BY/HAVING/ORDER BY/LIMIT/OFFSET/UNION/INTERSECT/EXCEPT/WITH/FOR UPDATE等子句）；SELECT INTO——查询并创建表；SET——设置参数（SESSION/GLOBAL/LOCAL/参数名=值）；SET ROLE——设置当前角色；SET SESSION AUTHORIZATION——设置会话授权用户；SET TRANSACTION——设置事务特性（ISOLATION LEVEL/READ WRITE|ONLY）；SHOW——显示参数（ALL/parameter_name）；START TRANSACTION——开启事务（同BEGIN）；TABLE——表查询（等价SELECT * FROM）；TIMECAPSULE TABLE——闪回表（TO BEFORE DROP/TO SCN/TO TIMESTAMP）；TRUNCATE——清空表（TABLE name/CASCADE/RESTART IDENTITY/CONTINUE IDENTITY）。"
  source_anchor: "2.4.2.15-2.4.2.17 页2247-2299"
  source_refs: *refw8223
  status: confirmed
- id: sql_stmt_wave8_223_u_v
  type: syntax
  statement: "U/V开头语句：UPDATE——更新数据（SET column=value/WHERE条件/RETURNING/FROM子查询等）；USE——切换当前模式（USE schema_name）；VACUUM——清理空间（FULL/FREEZE/VERBOSE/ANALYZE/表列表/列列表等选项）。"
  source_anchor: "2.4.2.18-2.4.2.19 页2299-2310"
  source_refs: *refw8223
  status: confirmed
