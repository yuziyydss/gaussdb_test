- id: gsc_wave7_1_table_detail
  type: syntax
  statement: "gs_gsc_table_detail(database_id,rel_id)查看全局系统缓存表元数据，需SYSADMIN权限；database_id为NULL/-1表示所有数据库，0表示共享表；rel_id为NULL/-1表示所有表；PDB/Non-PDB只看本域数据。"
  source_anchor: "1.6.40 页929-930"
  source_refs: &ref401
  - w7_1_1_6_40
  status: confirmed
- id: gsc_wave7_1_catalog_detail
  type: syntax
  statement: "gs_gsc_catalog_detail(database_id,rel_id)查看全局系统缓存的系统表行信息，需SYSADMIN权限；rel_id仅覆盖有系统缓存的系统表，无效database_id报错，无效rel_id结果为空。"
  source_anchor: "1.6.40 页930"
  source_refs: *ref401
  status: confirmed
- id: gsc_wave7_1_clean
  type: constraint
  statement: "gs_gsc_clean(database_id)清理全局系统缓存，正在使用的数据不会被清理；需SYSADMIN权限；NULL/-1清理所有数据库，0只清理共享表，其他数字清理指定数据库及共享表。"
  source_anchor: "1.6.40 页930-931"
  source_refs: *ref401
  status: confirmed
- id: gsc_wave7_1_dbstat_info
  type: syntax
  statement: "gs_gsc_dbstat_info(database_id)获取本地节点GSC内存统计，包括tuple/relation/partition的searches、hits、miss、count、dead、memory，DB淘汰、线程引用和总内存；需SYSADMIN权限。"
  source_anchor: "1.6.40 页930-931"
  source_refs: *ref401
  status: confirmed
- id: gsc_wave7_1_performance_hint
  type: behavior_oracle
  statement: "若gs_gsc_dbstat_info中hits/searches比例明显小于1，可能是global_syscache_threshold过小导致查询命中率下降。"
  source_anchor: "1.6.40 页930-931"
  source_refs: *ref401
  status: confirmed
