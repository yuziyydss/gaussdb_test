  type: constraint
  statement: "Struct CHAR入参String差异：当attribute入参为String时，Oracle会在字符串末尾补齐空格至字符串长度与类型定义长度一致，GaussDB不进行补齐操作。"
  source_anchor: "4.3.7.1.2 表4-43 CHAR行 页3172"
  source_refs: *refjd
  status: confirmed
