facts:
- id: oracompat_wave8_181_conditions
  type: constraint
  statement: "Oracle条件兼容性：比较条件支持有差异（ANY/SOME/ALL操作符时Oracle支持list对象而GaussDB需转换为数组表达式）；浮点条件不支持；逻辑条件支持；模型条件不支持；多集合条件不支持；模式匹配条件支持；NULL值条件支持；XML条件不支持；SQL/JSON条件部分支持有差异（不支持IS JSON和JSON_TEXTCONTAINS，JSONB_EQUIV同JSON_EQUAL但不支持ERROR子句，JSONB_EXISTS同JSON_EXISTS但不支持ERROR/EMPTY/PASSING子句）；复合条件支持；BETWEEN/EXISTS/IN条件支持；IS OF TYPE条件不支持。"
  source_anchor: "4.3.6 表4-33条件 页3155"
  source_refs: &refjd
  - w8_181_4_3
  status: confirmed
- id: oracompat_wave8_181_jdbc_array_overview
  type: syntax
  statement: "JDBC Array构造差异：ArrayDescriptor静态构造方法名不一致（Oracle为createDescriptor、GaussDB为getDescriptor）；Array构造方法名定义不一致（Oracle为ARRAY(ArrayDescriptor,Connection,Object)、GaussDB为GaussArray(ArrayDescriptor,Object)）；typeName大小写敏感（Oracle类型名通常大写、GaussDB通常小写）；对未列举的构造方式GaussDB暂不支持；GaussDB在构造或绑定入参时不对类型修饰符校验（由数据库决定是否报错）。"
  source_anchor: "4.3.7.1.1 表4-34构造方法参考 页3156"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_jdbc_array_interfaces
  type: constraint
  statement: "JDBC Array接口支持矩阵：getBaseTypeName()/getBaseType()/getArray()/getArray(long index,int count)支持；getArray(java.util.Map)/getResultSet()/getResultSet(java.util.Map)/getResultSet(long,int)/getResultSet(long,int,java.util.Map)/free()不支持。"
  source_anchor: "4.3.7.1.1 表4-35接口参考 页3157"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_jdbc_getarray_types
  type: syntax
  statement: "getArray()返回类型差异：CHAR/VARCHAR/NCHAR/NVARCHAR2→String[]（一致）；NUMBER/NUMERIC/DECIMAL→BigDecimal[]（一致）；INTEGER→Oracle BigDecimal[] vs GaussDB Integer[]；SMALLINT→Oracle BigDecimal[] vs GaussDB Short[]；DOUBLE PRECISION/FLOAT→Oracle BigDecimal[] vs GaussDB Double[]；REAL→Oracle BigDecimal[] vs GaussDB Float[]；BINARY_DOUBLE→Double[]（一致）；BLOB→oracle.sql.BLOB[] vs java.sql.Blob[]；CLOB→oracle.sql.CLOB[] vs java.sql.Clob[]；TIMESTAMP→Timestamp[]（一致）；TIMESTAMP WITH TIME ZONE→Oracle OffsetDateTime[] vs GaussDB Timestamp[]。"
  source_anchor: "4.3.7.1.1 表4-36 getArray()接口详细差异 页3157-3158"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_jdbc_basetypename
  type: syntax
  statement: "getBaseTypeName命名规则：元素为package里定义的类型时OJDBC11返回schemaName.packageName.typeName、OJDBC8在名称含非法字符时返回带引号形式、GaussDB在名称含非法字符时返回带引号形式；元素为schema下定义的类型时OJDBC11返回schemaName.typeName；Oracle的getBaseTypeName通常返回大写类型名称而GaussDB返回小写。"
  source_anchor: "4.3.7.1.1 getBaseTypeName说明 页3160-3161"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_jdbc_array_input_types
  type: constraint
  statement: "Array元素入参类型差异：CHAR/VARCHAR/NCHAR/NVARCHAR2——Oracle支持任意Java类型而GaussDB仅支持Byte/Short/Integer/Long/BigInteger/BigDecimal/Float/Double/Character/Boolean/java.sql.Date/Time/Timestamp/PGClob；TIMESTAMP——Oracle支持byte[]/Date/Calendar等而GaussDB支持Date/Time/Timestamp/LocalDateTime/String；BLOB——Oracle用oracle.sql.BLOB而GaussDB用PGBlob；CLOB——Oracle用oracle.sql.CLOB而GaussDB用PGClob；集合类型——Oracle用ARRAY而GaussDB用GaussArray（类型不一致时Oracle不报错而GaussDB报错）；RECORD类型——Oracle用STRUCT而GaussDB用GaussStruct。"
  source_anchor: "4.3.7.1.1 表4-39 Array构造接口详细差异 页3161-3167"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_struct_overview
  type: syntax
  statement: "JDBC Struct兼容（4.3.7.1.2）：GaussDB使用GaussStruct替代Oracle的STRUCT类型；Struct构造接口支持从DOMDocument或其他类型创建；getSQLTypeName接口在package类型和非package类型下返回格式不同——package类型返回schemaName.packageName.typeName（含引号规则差异），非package类型返回schemaName.typeName。"
  source_anchor: "4.3.7.1.2 Struct 页3168-3170"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_struct_getattributes
  type: syntax
  statement: "getAttributes()返回类型差异：CHAR/VARCHAR/NCHAR/NVARCHAR2→String（三库一致）；NUMBER/NUMERIC/DECIMAL→BigDecimal（Oracle和OJDBC11）/BigDecimal（GaussDB）；INTEGER→BigDecimal（Oracle）/Integer（GaussDB）；SMALLINT→BigDecimal/Short；DOUBLE PRECISION/FLOAT→BigDecimal/Double；REAL→BigDecimal/Float；BINARY_DOUBLE→Double（一致）；BINARY_INTEGER→BigDecimal（Oracle）/Integer（GaussDB）；BOOLEAN→BigDecimal（Oracle）/Integer（OJDBC11）/Boolean（GaussDB）；TIMESTAMP→Timestamp（一致）；TIMESTAMP WITH TIME ZONE→TIMESTAMPTZ（Oracle）/Timestamp（GaussDB）；BLOB→BLOB（Oracle）/PGBlob（GaussDB）；CLOB→CLOB/PGClob；集合类型→ARRAY/GaussArray；RECORD→STRUCT/GaussStruct。"
  source_anchor: "4.3.7.1.2 表4-42 getAttributes()接口详细差异 页3170-3171"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_struct_constructor_diff
  type: constraint
  statement: "Struct构造接口差异（表4-43）：CHAR——attribute入参Oracle支持任意Java类型而GaussDB仅支持Byte/Short/Integer/Long/Float/Double/BigDecimal/BigInteger/String/Boolean等；入参为String时Oracle在字符串末尾补齐空格至类型长度而GaussDB不补齐；NUMBER/INTEGER等数值类型在GaussDB中不支持oracle.sql.NUMBER入参且不支持更高精度到低精度的隐式转换（可能出现精度丢失）。"
  source_anchor: "4.3.7.1.2 表4-43 Struct构造接口详细差异 页3172-3173"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_struct_boolean_binary
  type: constraint
  statement: "Struct BOOLEAN与BINARY类型差异：BOOLEAN——GaussDB目标类型为Boolean、Oracle目标类型为BigDecimal，入参支持类型列表差异较大（GaussDB不支持AtomicInteger/AtomicLong/DoubleAccumulator/DoubleAdder/LongAccumulator/LongAdder/Striped64/oracle.sql.NUMBER等）；BINARY_INTEGER——传入数值超过Integer范围时GaussDB会报错而Oracle会进行截断处理。"
  source_anchor: "4.3.7.1.2 Struct构造接口差异 页3174-3175"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_struct_precision_loss
  type: constraint
  statement: "JDBC Struct精度丢失警告：DOUBLE PRECISION/FLOAT/REAL/BINARY_DOUBLE等类型的attribute入参中，更高精度的类型转Double/Float可能出现精度丢失的情况（如oracle.sql.NUMBER转Double）。"
  source_anchor: "4.3.7.1.2 Struct构造接口差异 页3174-3175"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_struct_getsqltypename
  type: syntax
  statement: "getSQLTypeName接口差异：package类型——OJDBC11返回packageName.typeName、OJDBC8在名称含非法字符时返回带引号形式、GaussDB返回schemaName.packageName.typeName（含引号规则差异）；非package类型——OJDBC11/OJDBC8/GaussDB均返回schemaName.typeName（引号规则差异同上）。"
  source_anchor: "4.3.7.1.2 getSQLTypeName接口差异 页3169-3170"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_array_char_input
  type: constraint
  statement: "Array CHAR/VARCHAR/NCHAR/NVARCHAR2元素入参类型差异：Oracle支持任意Java类型而GaussDB仅支持Byte/Short/Integer/Long/BigInteger/BigDecimal/Float/Double/Character/Boolean/java.sql.Date/java.sql.Time/java.sql.Timestamp/PGClob；GaussDB不支持oracle.sql.*系列类型入参。"
  source_anchor: "4.3.7.1.1 表4-39 页3161-3162"
