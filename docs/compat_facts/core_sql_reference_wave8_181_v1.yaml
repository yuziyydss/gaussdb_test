- id: oracompat_wave8_181_type_modifier_validation
  type: constraint
  statement: "类型修饰符校验差异：若元素类型为字符类型且传入字符串长度大于元素类型定义长度，Oracle在绑定入参时报错；若数组类型为varray且元素个数超过varray长度上限，Oracle在绑定入参时报错；GaussDB在构造或绑定入参时不对类型修饰符进行校验，在数据库接收Array对象并执行SQL时由数据库决定是否报错。"
  source_anchor: "4.3.7.1.1 说明 页3156"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_basetypename_rules
  type: syntax
  statement: "getBaseTypeName返回规则：package类型——OJDBC11返回packageName.typeName、GaussDB返回schemaName.packageName.typeName（名称含非法字符时返回带引号形式）；schema类型——OJDBC11和GaussDB一般返回schemaName.typeName（名称含非法字符时GaussDB返回带引号形式）；Oracle getBaseTypeName通常返回大写类型名称而GaussDB返回小写。"
  source_anchor: "4.3.7.1.1 getBaseTypeName说明 页3160-3161"
  source_refs: *refjd
  status: confirmed
