  type: constraint
  statement: "Array NUMBER元素入参类型差异：Oracle支持任意Java类型（含oracle.sql.NUMBER等），GaussDB支持Byte/Short/Integer/Long/BigInteger/BigDecimal/Float/Double/Character/Boolean/String等；GaussDB不支持oracle.sql.NUMBER等Oracle专有类型。"
  source_anchor: "4.3.7.1.1 表4-39 页3162-3163"
  source_refs: *refjd
