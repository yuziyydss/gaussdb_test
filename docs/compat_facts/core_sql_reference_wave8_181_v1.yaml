- id: oracompat_wave8_181_array_timestamp_input
  type: constraint
  statement: "Array TIMESTAMP元素入参类型差异：Oracle支持byte[]/java.sql.Date/Calendar/java.util.Date/LocalDate/LocalDateTime/LocalTime/OffsetDateTime/OffsetTime/String/java.sql.Time/java.sql.Timestamp/oracle.sql.DATE/oracle.sql.TIMESTAMP/oracle.sql.TIMESTAMPTZ/oracle.sql.TIMESTAMPLTZ/ZonedDateTime；GaussDB仅支持java.util.Date/java.sql.Date/java.sql.Time/java.sql.Timestamp/LocalDateTime/String。"
  source_anchor: "4.3.7.1.1 表4-39 TIMESTAMP行 页3166"
  source_refs: *refjd
  status: confirmed
- id: oracompat_wave8_181_array_collection_diff
  type: constraint
  statement: "Array集合类型/RECORD类型元素入参差异：集合类型——Oracle入参为ARRAY/Object且ARRAY类型与元素类型不一致时不报错，GaussDB入参为GaussArray/Object且GaussArray类型与元素类型不一致时会报错；RECORD类型——Oracle入参为STRUCT/Object[]，GaussDB入参为GaussStruct/Object[]（类型不一致时同样报错）。"
  source_anchor: "4.3.7.1.1 表4-39集合/RECORD行 页3166-3167"
  source_refs: *refjd
