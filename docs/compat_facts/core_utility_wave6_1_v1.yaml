facts:
- id: utility_wave6_1_triggerdef
  type: syntax
  statement: "pg_get_triggerdef(oid)获取指定触发器的CREATE TRIGGER定义信息，返回text。"
  source_anchor: "1.6.30 页900-901"
  source_refs: &ref301
  - w6_1_1_6_30
  status: confirmed
- id: utility_wave6_1_triggerdef_pretty
  type: syntax
  statement: "pg_get_triggerdef(oid,boolean)以可选pretty方式获取触发器定义；布尔参数仅在触发器创建时指定WHEN条件的情况下生效。"
  source_anchor: "1.6.30 页901"
  source_refs: *ref301
  status: confirmed
- id: utility_wave6_1_suppress_redundant_updates
  type: constraint
  statement: "suppress_redundant_updates_trigger()抑制无数据变化的UPDATE；是内置触发器执行函数，只能在触发器定义时调用，且仅在BEFORE UPDATE触发器中生效。"
  source_anchor: "1.6.30 页901-902"
  source_refs: *ref301
  status: confirmed
- id: utility_wave6_1_ora_hash
  type: syntax
  statement: "ora_hash(expression[,seed])计算表达式哈希；expression支持字符串、时间类型、数字类型和ROWID类型；seed为可选int8，用于对同一输入返回不同结果；返回int8。"
  source_anchor: "1.6.31 页902-903"
  source_refs: &ref311
  - w6_1_1_6_31
  status: confirmed
- id: utility_wave6_1_ora_hash_precondition
  type: constraint
  statement: "ora_hash仅在a_format_version=10c且a_format_dev_version=s2的情况下生效。"
  source_anchor: "1.6.31 页903"
  source_refs: *ref311
  status: confirmed
- id: utility_wave6_1_hash_array
  type: syntax
  statement: "hash_array(anyarray)对数组元素调用哈希函数并返回合并结果，返回integer。"
  source_anchor: "1.6.31 页903"
  source_refs: *ref311
  status: confirmed
- id: utility_wave6_1_hash_numeric_range
  type: syntax
  statement: "hash_numeric(numeric)计算Numeric类型哈希；hash_range(anyrange)计算range哈希；均返回integer。"
  source_anchor: "1.6.31 页903"
  source_refs: *ref311
  status: confirmed
- id: utility_wave6_1_hash_bpchar_char
  type: behavior_oracle
  statement: "hashbpchar(character)计算bpchar哈希；hashchar(char)支持char或布尔数据转哈希；设置behavior_compat_options=a_hash_bpchar时按保留字符串末尾空格计算hash。"
  source_anchor: "1.6.31 页903-904"
  source_refs: *ref311
  status: confirmed
- id: utility_wave6_1_hash_enum
  type: syntax
  statement: "hashenum(anyenum)将枚举类型转换为哈希值，返回integer。"
  source_anchor: "1.6.31 页904"
  source_refs: *ref311
  status: confirmed
- id: utility_wave6_1_hash_floats
  type: syntax
  statement: "hashfloat4(real)和hashfloat8(double precision)分别计算float4与float8哈希值，均返回integer。"
  source_anchor: "1.6.31 页904-905"
  source_refs: *ref311
  status: confirmed
- id: utility_wave6_1_hash_inet
  type: syntax
  statement: "hashinet(inet)计算inet/cidr哈希值，返回integer。"
  source_anchor: "1.6.31 页905"
  source_refs: *ref311
  status: confirmed
- id: utility_wave6_1_hash_int1_int2
  type: syntax
  statement: "hashint1(tinyint)和hashint2(smallint)分别计算INT1与INT2哈希值，返回uint32。"
  source_anchor: "1.6.31 页905"
  source_refs: *ref311
  status: confirmed
- id: utility_wave6_1_report_application_error
  type: constraint
  statement: "report_application_error()在PL执行过程中抛出ERROR；log参数为必选error消息内容，code为可选error code且范围-20999至-20000，返回void。"
  source_anchor: "1.6.32 页905-906"
  source_refs: &ref321
  - w6_1_1_6_32
  status: confirmed
- id: utility_wave6_1_gtt_relstats
  type: syntax
  statement: "pg_get_gtt_relstats(relOid)显示当前会话指定全局临时表基本统计，包括relfilenode、relpages、reltuples、relallvisible、relfrozenxid和relminmxid。"
  source_anchor: "1.6.33 页906"
  source_refs: &ref331
  - w6_1_1_6_33
  status: confirmed
- id: utility_wave6_1_gtt_statistics
  type: syntax
  statement: "pg_get_gtt_statistics(relOid,attnum,'')显示当前会话指定全局临时表的单列统计信息，返回record。"
  source_anchor: "1.6.33 页906-907"
  source_refs: *ref331
  status: confirmed
- id: utility_wave6_1_gtt_attached_pid
  type: behavior_oracle
  statement: "pg_gtt_attached_pid(relOid)显示正在使用指定全局临时表的所有线程pid和会话ID；线程池开启且会话为detach状态时pid为0、sessionid为会话ID。"
  source_anchor: "1.6.33 页907"
  source_refs: *ref331
  status: confirmed
- id: utility_wave6_1_global_sql_by_timestamp
  type: syntax
  statement: "dbe_perf.get_global_full_sql_by_timestamp(start_timestamp,end_timestamp)获取实例级全量SQL信息；dbe_perf.get_global_slow_sql_by_timestamp(start_timestamp,end_timestamp)获取实例级慢SQL信息。"
  source_anchor: "1.6.33 页907-908"
  source_refs: *ref331
  status: confirmed
- id: utility_wave6_1_statement_detail_decode
  type: syntax
  statement: "statement_detail_decode(detail,format,pretty)解析全量/慢SQL details字段；format支持plaintext或json；plaintext下pretty为true按换行分隔事件，false按逗号分隔。"
  source_anchor: "1.6.33 页908"
  source_refs: *ref331
  status: confirmed
- id: utility_wave6_1_gtt_relfrozenxids
  type: behavior_oracle
  statement: "pg_list_gtt_relfrozenxids()显示各会话全局临时表冻结事务xid；pid=0的行显示所有会话中最旧的冻结事务xid。"
  source_anchor: "1.6.33 页908"
  source_refs: *ref331
  status: confirmed
- id: utility_wave6_1_fault_inject_unsupported
  type: behavior_oracle
  statement: "gs_fault_inject(int64,text,text,text,text,text)不能调用，调用时报WARNING unsupported fault injection，不会对数据库产生影响或改变；返回int64。"
  source_anchor: "1.6.34 页908-909"
  source_refs: &ref341
  - w6_1_1_6_34
  status: confirmed
- id: utility_wave6_1_fault_inject_params
  type: syntax
  statement: "gs_fault_inject第一入参为注入故障类型（0 CLOG扩展页面、1读取CLOG页面、2强制死锁）；第二入参在类型2时1表示死锁，其余不死锁，在0/1时表示起始页面号；第三入参表示页面个数；第四至六入参预留。"
  source_anchor: "1.6.34 页908-909"
  source_refs: *ref341
  status: confirmed
