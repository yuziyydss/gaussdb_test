facts:
- id: sp_txn_wave8_2_auto_context
  type: syntax
  statement: "最外围存储过程开始调用时自动开启事务，调用结束时自动提交或发生异常时回滚。"
  source_anchor: "3.9 页2619"
  source_refs: &refb1
  - w8_2_3_9
  status: confirmed
- id: sp_txn_wave8_2_commit_rollback_new_txn
  type: behavior_oracle
  statement: "存储过程中调用COMMIT/ROLLBACK会提交/回滚当前事务并自动开启新事务，后续操作在新事务中运行。"
  source_anchor: "3.9 页2619"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_savepoint_semantics
  type: behavior_oracle
  statement: "SAVEPOINT允许回滚其建立后的命令并恢复事务状态；存储过程内回滚保存点只回退事务修改，不改变执行流程，也不回退局部变量。"
  source_anchor: "3.9 页2619"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_savepoint_syntax
  type: syntax
  statement: "保存点语法为SAVEPOINT savepoint_name、ROLLBACK TO [SAVEPOINT] savepoint_name和RELEASE [SAVEPOINT] savepoint_name。"
  source_anchor: "3.9 页2619"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_supported_contexts
  type: syntax
  statement: "PL/SQL存储过程、含EXCEPTION的存储过程、EXCEPTION块、外部事务块、子事务、IF/FOR/CURSOR LOOP/WHILE、返回值和简单表达式计算等上下文支持COMMIT/ROLLBACK/SAVEPOINT。"
  source_anchor: "3.9 页2619-2620"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_supported_effects
  type: syntax
  statement: "存储过程事务控制支持DDL在COMMIT/ROLLBACK后的提交/回滚、DML提交以及存储过程内GUC参数的回滚提交。"
  source_anchor: "3.9 页2620"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_unsupported_contexts
  type: constraint
  statement: "非PL/SQL存储过程、函数、触发器、EXECUTE、CURSOR、IMMUTABLE/SHIPPABLE过程、带GUC参数设置的存储过程头，以及除SELECT PROC/CALL PROC外的SQL调用均不支持COMMIT/ROLLBACK/SAVEPOINT。"
  source_anchor: "3.9 页2620"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_savepoint_boundary
  type: constraint
  statement: "事务块中调用SAVEPOINT后再调用含COMMIT/ROLLBACK的存储过程不支持；存储过程不能释放外部定义的保存点；自治事务和存储过程事务的保存点不能互相使用。"
  source_anchor: "3.9 页2620"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_unsupported_effects
  type: constraint
  statement: "存储过程内声明变量、传入变量以及必须重启生效的GUC参数不支持随COMMIT/ROLLBACK提交或回滚。"
  source_anchor: "3.9 页2620"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_stats_refresh
  type: behavior_oracle
  statement: "在存储过程、函数或匿名块内执行COMMIT/ROLLBACK时，PG_STAT相关统计信息不会立即刷新，通常到最外层事务完成时才更新。"
  source_anchor: "3.9 页2620"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_guc_option_error
  type: behavior_oracle
  statement: "存储过程头带GUC参数设置时调用COMMIT/ROLLBACK会报“transaction statement in store procedure with GUC setting in option clause is not supported”。"
  source_anchor: "3.9 页2625"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_cursor_open_error
  type: behavior_oracle
  statement: "游标OPEN的对象是包含COMMIT/ROLLBACK的存储过程时，会报“transaction statement in store procedure used as cursor is not supported”。"
  source_anchor: "3.9 页2625"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_execute_expr_error
  type: behavior_oracle
  statement: "CURSOR/EXECUTE语句及各类表达式内调用COMMIT/ROLLBACK会报“transaction statement in store procedure used as a expression is not supported”。"
  source_anchor: "3.9 页2625"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_release_outer_savepoint_error
  type: behavior_oracle
  statement: "存储过程释放外部定义的保存点会报“cannot release outer savepoint”。"
  source_anchor: "3.9 页2626"
  source_refs: *refb1
  status: confirmed
- id: sp_txn_wave8_2_outer_savepoint_visibility
  type: behavior_oracle
  statement: "存储过程内定义的SAVEPOINT对外部SQL或其他存储过程可见，外部可将事务回滚到该保存点位置。"
  source_anchor: "3.9 页2627"
  source_refs: *refb1
  status: confirmed
