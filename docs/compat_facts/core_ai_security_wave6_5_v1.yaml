facts:
- id: ai_wave6_5_index_advisor
  type: syntax
  statement: "gs_index_advise(text)针对单条查询语句推荐索引；hypopg_create_index(text[,text])创建虚拟索引；hypopg_display_index([text])显示虚拟索引；hypopg_drop_index(oid)删除指定虚拟索引；hypopg_reset_index([text])清除虚拟索引；hypopg_estimate_size(oid)估计索引空间。"
  source_anchor: "1.6.35 页909"
  source_refs: &ref351
  - w6_5_1_6_35
  status: confirmed
- id: ai_wave6_5_plan_encoding
  type: syntax
  statement: "encode_plan_node编码计划算子信息，为内部功能不建议用户直接使用；encode_feature_perf_hist(datname)编码目标数据库历史计划算子；gather_encoding_info(datname)调用前者并将编码数据持久化保存。"
  source_anchor: "1.6.35 页910"
  source_refs: *ref351
  status: confirmed
- id: ai_wave6_5_db4ai_predict_family
  type: syntax
  statement: "db4ai_predict_by_bool/float4/float8/int32/int64/numeric/text/float8_array按返回类型执行模型推断；入参为模型名称和VARIADIC输入列；这些是内部调用函数，建议使用PREDICT BY语法。"
  source_anchor: "1.6.35 页910-911"
  source_refs: *ref351
  status: confirmed
- id: ai_wave6_5_model_explain
  type: syntax
  statement: "gs_explain_model(text)文本化展示指定模型信息，包括算法、训练查询、时间、样本数、超参数、权重和评估指标等；gs_ai_stats_explain(text,text[])打印表和列上的多列智能统计信息。"
  source_anchor: "1.6.35 页911-912"
  source_refs: *ref351
  status: confirmed
- id: ai_wave6_5_acm_feedback
  type: constraint
  statement: "gs_acm_analyze_workload_manual()手动基于算子反馈数据训练基数估计模型；gs_stat_get_acm_feedback_operator_info()展示全局内存中的算子反馈数据；gs_stat_get_sql_feedback_info()展示SQL使用反馈基数功能的次数和执行时间。"
  source_anchor: "1.6.35 页912-914"
  source_refs: *ref351
  status: confirmed
- id: ai_wave6_5_acm_feedback_fields
  type: syntax
  statement: "算子反馈输出queryid、pid、plan_node_id、databaseid、create_time、estimated_rows、tuple_processed、node_type、relids、conditions和join_conditions；SQL反馈输出sql_id、反馈/默认平均执行时间与次数及status。"
  source_anchor: "1.6.35 页913-914"
  source_refs: *ref351
  status: confirmed
- id: ai_wave6_5_costmodel_calibration
  type: syntax
  statement: "gs_costmodel_calibration_manual()手动触发算子时间收集并矫正代价模型参数；gs_adaptive_costest_parameter()打印代价矫正参数和状态。"
  source_anchor: "1.6.35 页914-915"
  source_refs: *ref351
  status: confirmed
- id: ai_wave6_5_costmodel_parameters
  type: syntax
  statement: "代价矫正参数包括base_cpu_cost、base_page_cost、send_tuple_cost、cpu_operator_cost、random_page_cost、hit_ratio、delay和stat；stat可为Setted、UnSetted、Failed或OldSetted/NewTrained。"
  source_anchor: "1.6.35 页914-915"
  source_refs: *ref351
  status: confirmed
- id: ai_wave6_5_autohint_aplan
  type: syntax
  statement: "gs_get_autohint_cached_model()展示AutoHint历史探索结果缓存；gs_show_aplan(cstring)查看本session缓存的多计划缓存；后者暂不支持explain_perf_mode=pretty。"
  source_anchor: "1.6.35 页915"
  source_refs: *ref351
  status: confirmed
- id: ai_wave6_5_watchdog
  type: constraint
  statement: "ai_watchdog_detection_warnings()、ai_watchdog_monitor_status(int)和ai_watchdog_parameters()分别获取AI Watchdog风险告警、监控信息和内部参数/状态；均需要SYSADMIN或MONADMIN权限。"
  source_anchor: "1.6.35 页915-916"
  source_refs: *ref351
  status: confirmed
- id: ai_wave6_5_llm_functions
  type: syntax
  statement: "llm_query(text,text)调用大语言模型做语义分析；llm_embed(text,text)调用embedding模型向量化；llm_rerank(text,text,text)调用rerank模型重排序；分别返回text、floatvector和float。"
  source_anchor: "1.6.35 页916"
  source_refs: *ref351
  status: confirmed
- id: sensitive_wave6_5_discovery
  type: syntax
  statement: "gs_sensitive_data_discovery(scan_target,scan_classifier)扫描目标数据并返回统计结果；gs_sensitive_data_discovery_detail(scan_target,scan_classifier)返回详细扫描结果。"
  source_anchor: "1.6.36 页916"
  source_refs: &ref361
  - w6_5_1_6_36
  status: confirmed
- id: sensitive_wave6_5_discovery_params
  type: constraint
  statement: "敏感数据发现的scan_target必须是schema、table或column名称且需包含上级名称；scan_classifier支持email、creditcard、phonenumber、chinesename、encryptedcontent，可用逗号多选或all全选。"
  source_anchor: "1.6.36 页916"
  source_refs: *ref361
  status: confirmed
- id: masking_wave6_5_functions
  type: syntax
  statement: "动态脱敏函数包括creditcardmasking、basicemailmasking、fullemailmasking、alldigitsmasking、shufflemasking、randommasking和regexpmasking，均返回text。"
  source_anchor: "1.6.37 页917"
  source_refs: &ref371
  - w6_5_1_6_37
  status: confirmed
- id: masking_wave6_5_semantics
  type: behavior_oracle
  statement: "creditcardmasking将后四位之前数字替换；basicemailmasking替换第一个'@'前字符；fullemailmasking替换最后一个'.'之前且除第一个'@'外字符；alldigitsmasking替换数字；shufflemasking乱序；randommasking随机化；regexpmasking按正则替换。"
  source_anchor: "1.6.37 页917"
  source_refs: *ref371
  status: confirmed
- id: masking_wave6_5_regexp_params
  type: syntax
  statement: "regexpmasking(col,reg,replace_text,pos,reg_len)的pos默认0，reg_len默认-1，用于正则替换及替换位置/长度控制。"
  source_anchor: "1.6.37 页917"
  source_refs: *ref371
  status: confirmed
- id: hierarchy_wave6_5_sys_connect_by_path
  type: constraint
  statement: "sys_connect_by_path(col,separator)仅在层次递归查询中适用，返回从根节点到当前行的连接路径；col支持字符、ROWID、整数、浮点、NUMERIC等类型且不支持表达式；列内容与分隔符重复可正常运行。"
  source_anchor: "1.6.38 页917"
  source_refs: &ref381
  - w6_5_1_6_38
  status: confirmed
- id: hierarchy_wave6_5_connect_by_root
  type: constraint
  statement: "connect_by_root(col)仅在层次递归查询中适用，返回当前行最顶层父亲行中指定列的值；列类型必须在文档白名单内，且通过强制类型转换不能绕开白名单限制。"
  source_anchor: "1.6.38 页918"
  source_refs: *ref381
  status: confirmed
- id: hierarchy_wave6_5_return_types
  type: syntax
  statement: "sys_connect_by_path返回text；connect_by_root返回所指定列col的数据类型。"
  source_anchor: "1.6.38 页917-918"
  source_refs: *ref381
  status: confirmed
