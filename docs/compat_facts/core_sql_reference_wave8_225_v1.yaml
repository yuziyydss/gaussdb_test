facts:
- id: charset_wave8_225_client_connection
  type: syntax
  statement: "客户端连接的字符集和字符序（1.4.1）：服务端接收SQL语句由client_encoding向server_encoding转换编码/查询结果发送到客户端前向character_set_results转换编码；系统参数——server_encoding（创建数据库时指定）/client_encoding（可通过SET NAMES修改）/character_set_connection（SQL语句中未指定字符集的字符串常量默认字符集）/collation_connection（默认字符序）/character_set_results（返回结果字符集）；非字符类型转字符类型结果使用character_set_connection和collation_connection；字符类型绑定参数默认使用character_set_connection和collation_connection；转换编码过程中校验编码不符合抛出异常返回ERROR。"
  source_anchor: "1.4.1 客户端连接 页180"
  source_refs: &refw8225
  - w8_225_1_4
  status: confirmed
- id: charset_wave8_225_database_level
  type: syntax
  statement: "数据库级字符集和字符序（1.4.2）：CREATE DATABASE database_name [ENCODING=encoding] [LC_COLLATE=lc_collate] [LC_CTYPE=lc_ctype]——database_name数据库名称/ENCODING字符编码（字符串如'SQL_ASCII'或整数编号）/LC_COLLATE字符集排序（影响ORDER BY排序结果和文本列上索引排序顺序默认使用模板数据库）/LC_CTYPE字符分类（影响大小写字母和数字默认使用模板数据库字符分类）；所有模式均可使用数据库级字符集字符序语法；LC_COLLATE/LC_CTYPE参数不支持指定B模式特有字符序/取值范围取决于本地环境locale -a查看。"
  source_anchor: "1.4.2 数据库级 页180-181"
  source_refs: *refw8225
  status: confirmed
- id: charset_wave8_225_schema_table_level
  type: constraint
  statement: "模式级字符集和字符序（1.4.3）：CREATE SCHEMA schema_name [[DEFAULT] CHARACTER SET|CHARSET=default_charset] [[DEFAULT] COLLATE=default_collation]；ALTER SCHEMA schema_name同语法修改；选择规则——同时指定charset和collation需对应否则报错/仅指定charset使用charset及默认字符序/仅指定collation使用collation及对应字符集/都不指定则无默认字符集和字符序；仅设置charset需带默认字符序否则报错。表级字符集和字符序（1.4.4）：CREATE TABLE table_name [[DEFAULT] CHARACTER SET=default_charset] [[DEFAULT] COLLATE=default_collation]；ALTER TABLE修改默认字符集字符序（不影响已有列）；ALTER TABLE CONVERT TO CHARACTER SET charset [COLLATE collation]修改并转换所有字符类型字段编码；default_collation仅支持B模式字符序；默认字符序为binary时未指定字符序的文本类型转换为二进制类型；不支持表默认字符集与数据库server_encoding不同。"
  source_anchor: "1.4.3-1.4.4 页181-183"
  source_refs: *refw8225
  status: confirmed
- id: charset_wave8_225_column_expression
  type: constraint
  statement: "列级字符集和字符序（1.4.5）：每个字符串类型（CHAR/VARCHAR/TEXT等）的列都可以配置列级字符集和字符序——CREATE TABLE table_name (column_name data_type [CHARACTER SET|CHARSET charset] [COLLATE collation])；选择规则——同时指定charset和collation需对应/仅charset使用charset及默认字符序/仅collation使用collation及对应字符集/都不指定使用表默认；仅charset需带默认字符序。字符类型表达式字符集和字符序（1.4.6）：B模式b_format_version='5.7'+b_format_dev_version='s2'时字符串常量默认字符集字符序由character_set_connection和collation_connection决定/未设置时默认字符集与server_encoding相同字符序为default；不支持[_charset_name]'string'语法；EXPRESSION [COLLATE collation_name]指定字符序——数据类型必须支持字符序/指定的字符序必须是表达式的字符集允许的字符序。"
  source_anchor: "1.4.5-1.4.6 页183-185"
  source_refs: *refw8225
  status: confirmed
- id: charset_wave8_225_merge_rules
  type: constraint
  statement: "字符集和字符序合并规则（1.4.7）：B兼容模式b_format_version='5.7'+b_format_dev_version='s2'时根据优先级处理不同字符集字符序的表达式确定字符串比较运算使用的字符序和表达式的字符集；字符序优先级由高到低——COLLATE语法最高/存在字符序冲突的表达式（不同字符序字符串拼接）/支持字符序数据类型的列/用户自定义变量/存储过程参数/CASE表达式/特定系统函数（version/opengauss_version）/字符串常量和绑定参数/NULL表达式/不支持字符序的数据类型表达式优先级最低；两个表达式字符序不同时使用优先级最高的表达式的字符序。"
  source_anchor: "1.4.7 合并规则 页185-186"
  source_refs: *refw8225
  status: confirmed
