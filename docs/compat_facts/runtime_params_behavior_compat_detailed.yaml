- id: guc_behavior_compat_options_overview
  type: environment
  statement: behavior_compat_options是数据库兼容性行为配置项（A/C/PG模式通用），可在PDB级别设置。新装数据库默认空。支持约70+个配置项，相邻项用逗号隔开。
  source_anchor: 7 behavior_compat_options 表7-24
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4531）
- id: guc_bc_display_leading_zero
