facts:
- id: trig_wave8_39_purpose
  type: syntax
  statement: "CREATE TRIGGER用于创建触发器；触发器与指定表或视图关联，在特定条件下执行指定函数，用于复杂业务规则、引用完整性以及行插入、更新、删除时的关系维护。"
  source_anchor: "1.13.9.56 页1614"
  source_refs: &refb1
  - w8_39_1_13_9_56
  status: confirmed
- id: trig_wave8_39_supported_objects
  type: constraint
  statement: "当前仅支持在普通行存表和视图上创建触发器，不支持在临时表、UNLOGGED表等类型表上创建触发器。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_same_event_order
  type: syntax
  statement: "如果为同一事件定义了多个相同类型的触发器，则按触发器名称的字母顺序触发。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_performance
  type: constraint
  statement: "触发器常用于多表间数据关联同步，对SQL执行性能影响较大；不建议在大数据量同步及对性能要求高的场景中使用。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_execution_identity
  type: constraint
  statement: "执行触发器语句时，使用触发器创建者的身份进行权限判断。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_creation_permission
  type: constraint
  statement: "创建触发器的用户需要拥有指定表的TRIGGER权限或被授予CREATE ANY TRIGGER权限。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_before_row_null
  type: behavior_oracle
  statement: "BEFORE行级触发器函数返回NULL时忽略该行操作，后续触发器不再执行，也不会对该行产生INSERT/UPDATE/DELETE；AFTER触发器函数返回值无影响。REPLACE INTO触发的行级函数返回NULL不会停止后续触发器，也不影响INSERT或DELETE操作。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_before_old_new
  type: constraint
  statement: "BEFORE DELETE时触发器函数返回值NEW等于NULL；BEFORE INSERT时返回值OLD等于NULL；BEFORE UPDATE时只有显式返回NULL才是NULL值。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_normal_return
  type: syntax
  statement: "INSERT/UPDATE触发器函数正常返回NEW；BEFORE触发器返回非NULL行时会修改插入或更新的行，AFTER触发器不受影响；DELETE触发器函数正常返回OLD。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_instead_of
  type: syntax
  statement: "INSTEAD OF触发器只能作用于视图，其触发器函数也可返回NULL表示后续触发器不再执行。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_overload_limit
  type: constraint
  statement: "存在重载函数时，不支持使用触发器内部隐式变量old、new等作为重载函数入参。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_merge_replace_support
  type: constraint
  statement: "MERGE INTO仅支持触发行级ROW触发器，不支持语句级STATEMENT触发器；REPLACE INTO支持行级触发器，语句级仅支持INSERT STATEMENT触发器，不支持DELETE STATEMENT触发器。"
  source_anchor: "1.13.9.56 注意事项 页1614"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_main_syntax
  type: syntax
  statement: "CREATE [OR REPLACE] [CONSTRAINT] TRIGGER name {BEFORE|AFTER|INSTEAD OF} {event[OR ...]} ON table_name [FROM referenced_table_name] [DEFERRABLE/NOT DEFERRABLE子句] [FOR [EACH] {ROW|STATEMENT}] [WHEN (condition)] EXECUTE PROCEDURE function_name(arguments)|AnonyBlock；event支持INSERT、UPDATE、DELETE、TRUNCATE。"
  source_anchor: "1.13.9.56 语法格式 页1614-1615"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_or_replace_limit
  type: constraint
  statement: "OR REPLACE可修改已存在触发器，但不能创建或修改CONSTRAINT TRIGGER和INTERNAL TRIGGER；外键约束等SQL语句隐式创建的触发器属于INTERNAL TRIGGER。"
  source_anchor: "1.13.9.56 OR REPLACE 页1615"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_constraint_trigger
  type: syntax
  statement: "CONSTRAINT创建约束触发器，触发器作为约束使用，可用SET CONSTRAINTS调整触发时间；约束触发器必须是AFTER ROW触发器。"
  source_anchor: "1.13.9.56 CONSTRAINT 页1615"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_name_events
  type: syntax
  statement: "触发器名不能限定模式并继承所在表模式，同一表内不能重名且最大63字符；event支持INSERT、UPDATE、DELETE、TRUNCATE或OR组合；UPDATE OF可指定目标列，INSTEAD OF UPDATE不支持指定列；指定列包含生成列且依赖列为目标列时也触发。"
  source_anchor: "1.13.9.56 name/event 页1616"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_referenced_deferrable
  type: constraint
  statement: "FROM referenced_table_name只能为约束触发器指定，常见于外键约束，但当前不支持外键因此不建议使用；DEFERRABLE/NOT DEFERRABLE和INITIALLY IMMEDIATE/DEFERRED仅作用于约束触发器。"
  source_anchor: "1.13.9.56 referenced_table/DEFERRABLE 页1616"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_row_statement_when
  type: syntax
  statement: "FOR EACH ROW表示受影响每行触发一次，FOR EACH STATEMENT表示每条SQL触发一次，未指定默认STATEMENT；约束触发器只能ROW。WHEN条件为true才调用函数；ROW触发器可引用OLD/NEW列，INSERT不能OLD，DELETE不能NEW；INSTEAD OF不支持WHEN；WHEN不能包含子查询，约束触发器WHEN评估不延迟。"
  source_anchor: "1.13.9.56 FOR EACH/WHEN 页1616-1617"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_anonyblock_function
  type: syntax
  statement: "ANONYBLOCK是A风格匿名块，触发时执行其中语句；使用匿名块会创建与trigger同名的函数，需避免与现有函数名冲突。EXECUTE PROCEDURE函数必须声明为无参数且返回TRIGGER；arguments是文字字符串常量，简单名称和数字常量也会转换为字符串。"
  source_anchor: "1.13.9.56 ANONYBLOCK/function_name/arguments 页1617"
  source_refs: *refb1
  status: confirmed
- id: trig_wave8_39_kind_matrix_variables
  type: syntax
  statement: "INSTEAD OF必须FOR EACH ROW且只能在视图；BEFORE/AFTER作用于视图时只能STATEMENT；TRUNCATE仅FOR EACH STATEMENT。plpgsql触发器特殊变量包括NEW、OLD、TG_NAME、TG_WHEN、TG_LEVEL、TG_OP、TG_RELID、TG_TABLE_NAME、TG_TABLE_SCHEMA、TG_NARGS和TG_ARGV[]等。"
  source_anchor: "1.13.9.56 触发器种类/特殊变量 页1617-1618"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: trig_wave8_39_oq_runtime
  statement: "CREATE TRIGGER在真实表/视图、BEFORE/AFTER/INSTEAD OF、约束触发器、MERGE/REPLACE INTO和匿名块组合下的触发顺序与错误矩阵需授权环境实机验证。"
  status: open
