- id: pkgsvc_wave8_142_job_status_semantics
  type: constraint
  statement: "JOB状态语义：interval_time为空值或字符串null表示只执行一次，执行后JOB状态STATUS变成'd'表示不再执行（JOB_SUBMIT与JOB_UPDATE一致适用）；JOB_FINISH在broken状态为true时将next_time更新为'4000-1-1'。"
