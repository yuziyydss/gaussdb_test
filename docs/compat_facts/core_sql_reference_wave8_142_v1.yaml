facts:
- id: pkgsvc_wave8_142_overview
  type: syntax
  statement: "PKG_SERVICE接口清单：动态SQL类——SQL_IS_CONTEXT_ACTIVE（确认CONTEXT是否已注册）、SQL_CLEAN_ALL_CONTEXTS（取消所有注册CONTEXT）、SQL_REGISTER_CONTEXT（注册CONTEXT）、SQL_UNREGISTER_CONTEXT（取消注册）、SQL_SET_SQL（向CONTEXT设置SQL语句，目前只支持SELECT）、SQL_RUN（在CONTEXT上执行设置的SQL）、SQL_NEXT_ROW（读取下一行）、SQL_GET_VALUE（读取动态定义列值）、SQL_SET_RESULT_TYPE（根据类型OID动态定义列）；定时任务类——JOB_CANCEL（按任务id删除定时任务）、JOB_FINISH（禁用或启用）、JOB_SUBMIT（提交定时任务，作业号系统自动生成或用户指定）、JOB_UPDATE（修改任务内容/下次执行时间/执行间隔）、SUBMIT_ON_NODES（提交任务到所有节点，作业号系统生成）、ISUBMIT_ON_NODES（提交任务到所有节点，作业号用户指定）；OUT参数读取类——SQL_GET_ARRAY_RESULT（获取数组OUT参数）、SQL_GET_VARIABLE_RESULT（获取列值OUT参数）。"
  source_anchor: "3.12.1.1 PKG_SERVICE 表3-3 页2640-2650"
  source_refs: &refps
  - w8_142_3_12
  status: confirmed
- id: pkgsvc_wave8_142_context_lifecycle
  type: constraint
  statement: "CONTEXT生命周期闭环：SQL_REGISTER_CONTEXT打开CONTEXT（后续各项操作的前提，内部自动递增生成CONTEXT id并作为INTEGER返回值）→SQL_SET_SQL解析→SQL_RUN执行→SQL_NEXT_ROW读行→SQL_GET_VALUE/SQL_SET_RESULT_TYPE/SQL_GET_ARRAY_RESULT/SQL_GET_VARIABLE_RESULT取值→SQL_UNREGISTER_CONTEXT关闭释放内存；SQL_CLEAN_ALL_CONTEXTS() RETURN VOID用于取消所有CONTEXT。"
  source_anchor: "3.12.1.1 SQL_REGISTER/UNREGISTER/CLEAN_ALL_CONTEXTS 页2641-2642"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_sql_is_context_active
  type: syntax
  statement: "SQL_IS_CONTEXT_ACTIVE原型：PKG_SERVICE.SQL_IS_CONTEXT_ACTIVE(context_id IN INTEGER) RETURN BOOLEAN；该函数用于确认一个CONTEXT是否已注册，传入想查找的CONTEXT id，存在返回true否则返回false。"
  source_anchor: "3.12.1.1 SQL_IS_CONTEXT_ACTIVE 页2641-2642"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_unregister_important
  type: constraint
  statement: "关闭CONTEXT重要性：如果在存储过程结束时未调用SQL_UNREGISTER_CONTEXT，CONTEXT占用的内存将不会被释放，因此关闭CONTEXT非常重要；由于异常情况可能导致存储过程中途退出从而使CONTEXT未能关闭，建议存储过程中有异常处理并将该接口包含在内。"
  source_anchor: "3.12.1.1 SQL_UNREGISTER_CONTEXT 页2642"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_sql_set_sql
  type: syntax
  statement: "SQL_SET_SQL原型：PKG_SERVICE.SQL_SET_SQL(context_id IN INTEGER, query_string IN TEXT, language_flag IN INTEGER) RETURN BOOLEAN；用于解析给定游标的查询语句，被传入的查询语句会立即执行；目前仅支持SELECT查询语句的解析，且语句参数仅可通过text类型传递、长度不大于1G；language_flag版本语言号指定不同版本行为——1为非兼容版本、2为A兼容模式版本。"
  source_anchor: "3.12.1.1 SQL_SET_SQL 页2642-2643"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_sql_run_next_row
  type: syntax
  statement: "SQL_RUN与SQL_NEXT_ROW：SQL_RUN(context_id IN INTEGER) RETURN INTEGER用于执行一个给定的CONTEXT，运行后获得的数据用于后续操作（目前仅支持SELECT查询语句的执行）；SQL_NEXT_ROW(context_id IN INTEGER) RETURN INTEGER返回执行SQL实际返回的数据行数，每一次调用该接口都会读取下一行数据，直到数据读取完毕获取不到新行为止。"
  source_anchor: "3.12.1.1 SQL_RUN/SQL_NEXT_ROW 页2643"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_sql_get_value
  type: syntax
  statement: "SQL_GET_VALUE原型：PKG_SERVICE.SQL_GET_VALUE(context_id IN INTEGER, pos IN INTEGER, col_type IN ANYELEMENT) RETURN ANYELEMENT；用于返回指定CONTEXT中在给定位置的CONTEXT元素值，该接口访问的是由SQL_NEXT_ROW获取的数据；pos为动态定义列在查询中的位置，col_type为任意类型变量、定义列的返回值类型。"
  source_anchor: "3.12.1.1 SQL_GET_VALUE 页2643-2644"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_sql_set_result_type
  type: syntax
  statement: "SQL_SET_RESULT_TYPE原型：PKG_SERVICE.SQL_SET_RESULT_TYPE(context_id IN INTEGER, pos IN INTEGER, coltype_oid IN ANYELEMENT, maxsize IN INTEGER) RETURN INTEGER；用于定义从指定CONTEXT返回的列，该接口只能应用于SELECT定义的CONTEXT中，定义的列通过查询列表的相对位置来标识；coltype_oid为任意类型的变量（根据变量类型得到对应类型OID），maxsize为定义的列的长度。"
  source_anchor: "3.12.1.1 SQL_SET_RESULT_TYPE 页2644"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_job_cancel
  type: syntax
  statement: "JOB_CANCEL原型：PKG_SERVICE.JOB_CANCEL(id IN INTEGER)；用于删除指定的定时任务，id为指定的作业号（integer、IN、不可为空）。"
  source_anchor: "3.12.1.1 JOB_CANCEL 页2644"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_job_finish
  type: syntax
  statement: "JOB_FINISH原型：PKG_SERVICE.JOB_FINISH(id IN INTEGER, broken IN BOOLEAN, next_time IN TIMESTAMP DEFAULT sysdate)；用于禁用或者启用定时任务；broken为状态标志位（true代表禁用、false代表启用，根据true或false更新当前JOB状态；如果为空值则不改变原有JOB状态）；next_time下次运行时间默认当前系统时间可省略——broken为true时更新该参数为'4000-1-1'；broken为false时next_time不为空值则更新指定JOB的next_time值、为空值时不更新。"
  source_anchor: "3.12.1.1 JOB_FINISH 页2644-2645"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_job_submit
  type: syntax
  statement: "JOB_SUBMIT原型：PKG_SERVICE.JOB_SUBMIT(id IN BIGINT, content IN TEXT, next_time IN TIMESTAMP DEFAULT sysdate, interval_time IN TEXT DEFAULT 'null', job OUT INTEGER)；用于提交一个系统提供的定时任务；content为要执行的SQL语句，支持一个或多个DML、匿名块、调用存储过程的语句或三种混合类型的场景。"
  source_anchor: "3.12.1.1 JOB_SUBMIT 页2645-2646"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_job_submit_params
  type: constraint
  statement: "JOB_SUBMIT参数语义：id为作业号、传入NULL时内部会生成作业id；next_time下次作业运行时间默认当前系统时间sysdate，如果是过去时间则在提交作业时表示立即执行；interval_time为计算下次作业运行时间的时间表达式（可以是interval表达式或sysdate加numeric值如sysdate+1.0/24），为空值或字符串null表示只执行一次、执行后JOB状态STATUS变成'd'不再执行；job为OUT作业号、范围1～3000000（SELECT语句调用时该参数可省略）。"
  source_anchor: "3.12.1.1 JOB_SUBMIT参数说明 页2645-2646"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_job_submit_notes
  type: constraint
  statement: "JOB_SUBMIT使用说明：当创建一个定时任务（JOB）时，系统默认将当前数据库和用户名与当前创建的定时任务绑定起来；该接口函数可以通过CALL语句或SELECT语句调用，通过SELECT调用可以不填写出参，在存储过程中则需要通过PERFORM语句调用；如果提交的SQL语句任务使用到非PUBLIC的schema，应该指定表或者函数的schema，或者在SQL语句前添加SET current_schema = xxx;语句。"
  source_anchor: "3.12.1.1 JOB_SUBMIT说明 页2645"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_job_update
  type: syntax
  statement: "JOB_UPDATE原型：PKG_SERVICE.JOB_UPDATE(id IN BIGINT, next_time IN TIMESTAMP, interval_time IN TEXT, content IN TEXT)；用于修改定时任务的属性（任务内容、下次执行时间和执行间隔）；next_time/interval_time/content为空值时均不更新指定JOB的对应值；interval_time不为空值时校验是否为有效的时间类型或interval类型，为字符串null表示只执行一次、执行后JOB状态STATUS变成'd'不再执行；content为执行的存储过程名或者SQL语句块。"
  source_anchor: "3.12.1.1 JOB_UPDATE 页2646-2647"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_job_examples
  type: behavior_oracle
  statement: "JOB示例基线：SELECT PKG_SERVICE.JOB_SUBMIT(NULL, 'call test_job(1);', to_date('20180101','yyyymmdd'),'sysdate+1')返回作业号28269；间隔'sysdate+1.0/24'返回1506；CALL形式混合语句（INSERT+两次call，add_months与date_trunc间隔表达式，:jobid出参）返回14131；指定id 101返回101；CALL JOB_UPDATE(101, sysdate, 'sysdate + 1.0/1440', …)修改间隔与内容；CALL JOB_FINISH(101,true)禁用；CALL JOB_CANCEL(101)删除。"
  source_anchor: "3.12.1.1 JOB示例 页2647-2648"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_submit_on_nodes
  type: syntax
  statement: "SUBMIT_ON_NODES原型：PKG_SERVICE.SUBMIT_ON_NODES(node_name IN NAME, database IN NAME, what IN TEXT, next_date IN TIMESTAMP WITHOUT TIME ZONE, job_interval IN TEXT, job OUT INTEGER)；用于提交一个任务到所有节点；node_name指定作业执行节点、当前仅支持值为'ALL_NODE'（在所有节点执行）；database节点类型为'ALL_NODE'时仅支持值为'postgres'；what支持一个或多个DML、匿名块、调用存储过程的语句或混合场景；job_interval为时间表达式、空值或null字符串表示只执行一次后STATUS='d'；示例基线：submit_on_nodes('ALL_NODE', 'postgres', 'select capture_view_to_json(''dbe_perf.statement'', 0);', sysdate, 'interval ''60 second''')返回25376。"
  source_anchor: "3.12.1.1 SUBMIT_ON_NODES 页2648-2649"
  source_refs: *refps
  status: confirmed
- id: pkgsvc_wave8_142_isubmit_on_nodes
  type: constraint
  statement: "ISUBMIT_ON_NODES：与SUBMIT_ON_NODES语法功能相同，但其第一个参数是入参（即指定的作业号），SUBMIT最后一个参数是出参（表示系统自动生成的作业号）；仅sysadmin/monitor admin有权限调用该函数。"
  source_anchor: "3.12.1.1 ISUBMIT_ON_NODES 页2649"
  source_refs: *refps
  status: confirmed
