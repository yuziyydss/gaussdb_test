  statement: "SQL_GET_ARRAY_RESULT原型：PKG_SERVICE.SQL_GET_ARRAY_RESULT(context_id in int, pos in VARCHAR2, column_value inout anyarray, result_type in anyelement)；该函数用于返回绑定的数组类型的OUT参数的值，可以用来获取存储过程中的OUT参数；pos为绑定的参数名。"
