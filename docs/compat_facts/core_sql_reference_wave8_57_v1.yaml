document: 集中式版参考 / 1.13.9.21 CREATE FOREIGN DATA WRAPPER、1.13.7.12 ALTER FOREIGN DATA WRAPPER 与 1.13.10.15 DROP FOREIGN DATA WRAPPER（Wave 8-57）
