facts:
- id: fdw_wave8_57_create_purpose
  type: syntax
  statement: "CREATE FOREIGN DATA WRAPPER用于创建一个新的外部数据封装器。"
  source_anchor: "1.13.9.21 页1433"
  source_refs: &refcreate
  - w8_57_1_13_9_21
  status: confirmed
- id: fdw_wave8_57_create_permissions
  type: constraint
  statement: "只有初始用户和系统管理员用户可以创建外部数据封装器；创建外部数据封装器的用户将成为其所有者。"
  source_anchor: "1.13.9.21 注意事项 页1433"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_create_syntax
  type: syntax
  statement: "CREATE FOREIGN DATA WRAPPER name [HANDLER handler_function|NO HANDLER] [VALIDATOR validator_function|NO VALIDATOR] [OPTIONS (option 'value'[, ...])]。"
  source_anchor: "1.13.9.21 语法格式 页1433"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_name_unique
  type: constraint
  statement: "外部数据封装器名称必须在数据库中唯一。"
  source_anchor: "1.13.9.21 name 页1433"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_handler_requirements
  type: syntax
  statement: "HANDLER指定的handler_function必须是已注册函数；该函数必须没有参数，且返回类型必须为fdw_handler。"
  source_anchor: "1.13.9.21 HANDLER 页1433"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_no_handler_limit
  type: constraint
  statement: "可以不使用处理器函数创建外部数据封装器；使用NO HANDLER创建的数据封装器，其外部表只能被声明，无法被访问。"
  source_anchor: "1.13.9.21 NO HANDLER 页1433"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_validator_purpose
  type: syntax
  statement: "VALIDATOR指定的validator_function用于检查提供给外部数据封装器的通用验证选项，以及使用该封装器的外部服务器、用户映射和外部表的验证选项。"
  source_anchor: "1.13.9.21 VALIDATOR 页1433"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_no_validator_behavior
  type: constraint
  statement: "如果没有验证器函数或声明NO VALIDATOR，创建时不检查选项；外部数据封装器可能在运行时忽略或拒绝无效选项说明。"
  source_anchor: "1.13.9.21 VALIDATOR 页1433"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_validator_signature
  type: constraint
  statement: "验证器函数validator_function必须接受两个参数：一个类型为text[]，包含系统目录中存储的选项数组；一个类型为oid，包含这些选项的系统目录OID。"
  source_anchor: "1.13.9.21 validator_function签名 页1434"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_no_validator_keyword
  type: syntax
  statement: "NO VALIDATOR表示创建时暂不设置验证器函数。"
  source_anchor: "1.13.9.21 NO VALIDATOR 页1434"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_options_uniqueness
  type: constraint
  statement: "OPTIONS声明外部数据封装器选项，选项是否有效特定于每一个外部数据封装器，并通过其验证器函数验证；选项名options必须符合唯一约束。"
  source_anchor: "1.13.9.21 OPTIONS 页1434"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_create_examples
  type: behavior_oracle
  statement: "示例支持创建初始状态封装器dummy、带处理器函数file_fdw_handler的file，以及带OPTIONS(debug 'true')的mywrapper。"
  source_anchor: "1.13.9.21 示例 页1434"
  source_refs: *refcreate
  status: confirmed
- id: fdw_wave8_57_alter_purpose
  type: syntax
  statement: "ALTER FOREIGN DATA WRAPPER用于修改外部数据封装的属性。"
  source_anchor: "1.13.7.12 页1216"
  source_refs: &refalt
  - w8_57_1_13_7_12
  status: confirmed
- id: fdw_wave8_57_alter_permissions
  type: constraint
  statement: "只有初始用户和系统管理员用户能够修改外部数据封装。"
  source_anchor: "1.13.7.12 注意事项 页1216"
  source_refs: *refalt
  status: confirmed
- id: fdw_wave8_57_alter_guc
  type: constraint
  statement: "只有在GUC参数support_extended_features=on时，才能成功执行ALTER FOREIGN DATA WRAPPER语句。"
  source_anchor: "1.13.7.12 注意事项 页1217"
  source_refs: *refalt
  status: confirmed
- id: fdw_wave8_57_alter_syntax
  type: syntax
  statement: "ALTER FOREIGN DATA WRAPPER name支持HANDLER/NO HANDLER、VALIDATOR/NO VALIDATOR和OPTIONS ([ADD|SET|DROP] option['value'][,...])。"
  source_anchor: "1.13.7.12 语法格式 页1217"
  source_refs: *refalt
  status: confirmed
- id: fdw_wave8_57_alter_no_handler
  type: constraint
  statement: "ALTER时NO HANDLER表示外部数据封装不再拥有处理函数；使用没有handler的外部数据封装的外表不能访问。"
  source_anchor: "1.13.7.12 NO HANDLER 页1217"
  source_refs: *refalt
  status: confirmed
- id: fdw_wave8_57_alter_validator_effect
  type: constraint
  statement: "更换验证函数后，外部数据封装器或依赖的服务器、用户映射、外部表的已有选项可能变为无效；但ALTER命令中指定的任何选项都会使用新验证函数检查。"
  source_anchor: "1.13.7.12 VALIDATOR 页1217"
  source_refs: *refalt
  status: confirmed
- id: fdw_wave8_57_alter_options
  type: constraint
  statement: "ALTER的OPTIONS修改封装器选项，选项名需满足唯一约束；ADD、SET和DROP为指定操作，未指定默认ADD；使用封装器验证函数时名称和取值也会被验证。"
  source_anchor: "1.13.7.12 OPTIONS 页1217-1218"
  source_refs: *refalt
  status: confirmed
- id: fdw_wave8_57_drop_syntax
  type: syntax
  statement: "DROP FOREIGN DATA WRAPPER [IF EXISTS] name [CASCADE|RESTRICT]；只有support_extended_features=on时才能成功执行；IF EXISTS在封装器不存在时不删除并返回NOTICE；CASCADE级联删除依赖对象，RESTRICT存在依赖对象时拒绝删除，未指定默认RESTRICT。"
  source_anchor: "1.13.10.15 页1668-1669"
  source_refs: &refdrop
  - w8_57_1_13_10_15
  status: confirmed
open_questions:
- id: fdw_wave8_57_oq_runtime
  statement: "CREATE/ALTER/DROP FOREIGN DATA WRAPPER在真实handler/validator、OPTIONS、依赖服务器和GUC开关组合下的行为与错误矩阵需授权环境实机验证。"
  status: open
