- id: wave2a_sequence_nextval
  type: syntax
  statement: nextval(regclass)递增序列并返回numeric新值；也支持sequence.nextval语法。nextval不回滚，只支持主机执行，可能产生无间隙序列空洞。
  source_anchor: 1.6.15 页439-440
  source_refs:
  - w2a_1_6_15
  status: confirmed
- id: wave2a_sequence_currval_lastval
  type: syntax
  statement: currval(regclass)返回当前会话最近一次nextval值；lastval()返回当前会话最近一次nextval值且无需序列名。两者在会话未调用nextval时报错。
  source_anchor: 1.6.15 页440
  source_refs:
  - w2a_1_6_15
  status: confirmed
- id: wave2a_sequence_setval
  type: syntax
  statement: setval(regclass, numeric)和setval(regclass, numeric, boolean)设置序列当前值及is_called标志；setval修改不回滚。
  source_anchor: 1.6.15 页440-441
  source_refs:
  - w2a_1_6_15
  status: confirmed
- id: wave2a_sequence_introspection
  type: syntax
  statement: pg_sequence_last_value(sequence_oid)返回缓存值和当前值；B模式下last_insert_id()和last_insert_id(int16)可用于查询或设置会话最近自动增长值。
