facts:
- id: guc_wave8_10_show_single
  type: syntax
  statement: "SHOW client_encoding用于查看单个GUC参数取值。"
  source_anchor: "7.1 页4135"
  source_refs: &refb1
  - w8_10_7_1
  status: confirmed
- id: guc_wave8_10_show_all
  type: syntax
  statement: "SHOW ALL用于查看全部GUC参数取值。"
  source_anchor: "7.1 页4135"
  source_refs: *refb1
  status: confirmed
- id: guc_wave8_10_pg_settings
  type: syntax
  statement: "pg_settings视图可查看单个GUC参数，条件为NAME='client_encoding'，也可不带条件查看全部参数。"
  source_anchor: "7.1 页4135"
  source_refs: *refb1
  status: confirmed
- id: guc_wave8_10_cm_view_files
  type: syntax
  statement: "cm_agent和cm_server参数可分别在对应数据目录的cm_agent.conf和cm_server.conf文件中查看。"
  source_anchor: "7.1 页4136"
  source_refs: *refb1
  status: confirmed
- id: guc_wave8_10_cm_view_command
  type: syntax
  statement: "cm_ctl list --param {--agent | --server} [-n NODEID]可列出CM参数；-n不设置时默认所有节点。"
  source_anchor: "7.1 页4136"
  source_refs: *refb1
  status: confirmed
- id: guc_wave8_10_name_types
  type: syntax
  statement: "GUC参数名称不区分大小写；取值分为整型、浮点型、字符串、布尔型和枚举五类。"
  source_anchor: "7.2 页4136"
  source_refs: &refb2
  - w8_10_7_2
  status: confirmed
- id: guc_wave8_10_boolean_values
  type: constraint
  statement: "GUC布尔值可为on/off、true/false、yes/no或1/0，推荐使用on/off。"
  source_anchor: "7.2 页4136"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_enum_float
  type: constraint
  statement: "枚举值由pg_settings.enumvals定义；浮点real参数必须带小数点，如1.0e-3符合规范而1e-3不符合。"
  source_anchor: "7.2 页4136"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_float_zero
  type: behavior_oracle
  statement: "IEEE 754下数值型参数存在+0和-0，设置零带负号可通过校验；gs_guc浮点范围检查精度阈值为1.0*e-9。"
  source_anchor: "7.2 页4136"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_units
  type: environment
  statement: "有单位的GUC参数应显式指定单位，否则使用pg_settings.unit定义的默认单位；内存单位KB/kB、MB/mB、GB/gB；时间单位ms、s、min、h、d。"
  source_anchor: "7.2 页4136"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_internal_type
  type: constraint
  statement: "INTERNAL参数在创建数据库时确定，用户无法修改，只能通过SHOW或pg_settings查看。"
  source_anchor: "7.2 页4137"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_postmaster_type
  type: constraint
  statement: "POSTMASTER参数在数据库启动时确定，可通过配置文件指定，支持方式一；可在PDB级别设置的参数支持方式四。"
  source_anchor: "7.2 页4137"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_sighup_type
  type: constraint
  statement: "SIGHUP参数可在数据库启动时设置或启动后发送指令重新加载，支持方式一、方式二，可在PDB级别设置的参数支持方式四。"
  source_anchor: "7.2 页4137"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_backend_suset_userset
  type: constraint
  statement: "BACKEND是会话连接参数且连接后不可修改；SUSET由数据库管理员控制；USERSET可被任何用户设置。"
  source_anchor: "7.2 页4137"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_pdb_sighup
  type: constraint
  statement: "PDB_SIGHUP是多租场景PDB全局参数，可在数据库启动时设置或启动后重新加载，支持方式四。"
  source_anchor: "7.2 页4137"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_set_sql_levels
  type: syntax
  statement: "SQL方式三支持ALTER DATABASE、ALTER USER和SET修改数据库级、用户级和会话级参数；ALTER DATABASE/USER需重启会话生效，SET仅当前会话有效。"
  source_anchor: "7.2 页4138"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_priority
  type: behavior_oracle
  statement: "SET设置的会话级参数优先级最高，其次是ALTER设置；ALTER DATABASE优先级高于ALTER USER；三者都高于gs_guc设置。"
  source_anchor: "7.2 页4138"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_pdb_set
  type: syntax
  statement: "PDB级别参数可用gs_guc set --pdbname pdbname ...设置，并用gs_reload_pdb_conf('pdbname')立即生效。"
  source_anchor: "7.2 页4139"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_pdb_priority
  type: behavior_oracle
  statement: "PDB级别设置优先级高于方式一与方式二，但低于方式三；方式三中数据库级别设置在PDB中禁用。"
  source_anchor: "7.2 页4139"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_unsupported_units
  type: constraint
  statement: "方式一、二、四不支持以页面数量作为参数单位；若参数不属于当前节点会提示不在支持范围；方式三设置int参数会过滤前导零。"
  source_anchor: "7.2 页4139"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_cm_restart_mode
  type: syntax
  statement: "CM参数可用cm_ctl set --param {--agent|--server} [-n NODEID] -k \"PARAMETER=value\"设置；方式一需cm_ctl stop && cm_ctl start重启生效。"
  source_anchor: "7.2 页4140"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_cm_reload_mode
  type: syntax
  statement: "CM参数动态加载使用cm_ctl reload --param {--agent|--server} [-n NODEID]。"
  source_anchor: "7.2 页4141"
  source_refs: *refb2
  status: confirmed
- id: guc_wave8_10_cm_param_limit
  type: constraint
  statement: "CM设置只能修改已存在参数，不支持增减参数；重启数据库会造成操作中断，需规划执行窗口。"
  source_anchor: "7.2 页4140"
  source_refs: *refb2
  status: confirmed
