facts:
- id: vector_wave7_2_distance_functions
  type: syntax
  statement: "向量距离接口包括l2_distance、vector_l2_squared_distance、cosine_distance和vector_spherical_distance；入参均为两个floatvector，出参均为float8；分别计算欧式距离、欧式距离平方、余弦距离和归一化向量球面距离。"
  source_anchor: "1.6.51 页1006-1007"
  source_refs: &ref721
  - w7_2_1_6_51
  status: confirmed
- id: vector_wave7_2_spherical_precondition
  type: constraint
  statement: "vector_spherical_distance要求输入向量归一化；如果输入向量非归一化，无法获得正确计算结果。"
  source_anchor: "1.6.51 页1007"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_inner_product_functions
  type: syntax
  statement: "inner_product计算两个floatvector内积，vector_negative_inner_product计算负内积，入参均为两个floatvector，返回float8。"
  source_anchor: "1.6.51 页1007-1008"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_dims_norm
  type: syntax
  statement: "vector_dims返回floatvector维度值，返回int4；vector_norm返回向量L2范数，返回float8。"
  source_anchor: "1.6.51 页1008"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_add_sub_functions
  type: syntax
  statement: "vector_add和vector_sub分别计算两个floatvector的加法和减法，入参为两个相同维度向量，返回floatvector。"
  source_anchor: "1.6.51 页1008-1010"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_compare_functions
  type: syntax
  statement: "vector_lt、vector_le、vector_eq、vector_ne、vector_ge、vector_gt按向量字典序或相等性比较两个floatvector，返回BOOLEAN；vector_cmp返回比较结果。"
  source_anchor: "1.6.51 页1009-1011"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_accumulate_functions
  type: syntax
  statement: "vector_accum、vector_combine和vector_avg是向量聚合辅助函数，用于累积、合并和平均向量数据。"
  source_anchor: "1.6.51 页1010-1012"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_bool_functions
  type: syntax
  statement: "bool_vector_dims返回boolvector维度；bool_vector_cmp比较两个boolvector；bool_vector_eq判断两个boolvector是否相等。"
  source_anchor: "1.6.51 页1011-1012"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_floatvector_cast
  type: syntax
  statement: "floatvector可将anyarray数组转换为向量，或按指定维度对floatvector进行维度检测；vector_to_array将向量转换为数组；text_to_vector将cstring文本转换为向量。"
  source_anchor: "1.6.51 页1012-1013"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_floatvector_io
  type: syntax
  statement: "floatvector类型的vector_in、vector_out、vector_send、vector_recv和vector_typmod_in负责文本/二进制I/O及typmod转换。"
  source_anchor: "1.6.51 页1013"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_type_constraints
  type: constraint
  statement: "向量成员仅支持单精度；向量计算仅支持相同维度；建表时必须指定向量维度；插入维度不一致报错；已有数据时改变维度需数据符合新维度；已创建向量索引的属性不能切换到其他数据类型。"
  source_anchor: "1.6.51 页1013"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_boolvector_cast
  type: syntax
  statement: "boolvector可从anyarray转换，或对已有boolvector做维度检测；boolvector_to_array转为数组；text_to_boolvector将cstring转换为boolvector。"
  source_anchor: "1.6.51 页1013-1014"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_boolvector_io
  type: syntax
  statement: "boolvector的bool_vector_in、bool_vector_out、bool_vector_send、bool_vector_recv和bool_vector_typmod_in负责文本/二进制I/O及typmod转换。"
  source_anchor: "1.6.51 页1014-1015"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_boolvector_constraints
  type: constraint
  statement: "向量数据不支持Null、Nan、Inf元素；插入向量数据不支持NULL作为向量值；boolvector元素支持t/f、y/n、1/0、true/false、yes/no、on/off表达；boolvector仅支持等于操作，不支持大小比较。"
  source_anchor: "1.6.51 页1015"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_index_inspect
  type: syntax
  statement: "gs_vector_index_options显示向量索引选项；gs_diskann_inspect查询GsDiskANN索引状态；gs_ivfflat_inspect查询GsIvfflat索引状态，均支持普通索引与分区索引场景。"
  source_anchor: "1.6.51 页1015-1017"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_operators
  type: syntax
  statement: "向量操作符包括<->、<+>、<#>、+、-、<、<=、>、>=、=和<>，分别用于距离、内积/负内积、加、减、比较和相等性运算；操作数必须维度相同。"
  source_anchor: "1.6.51 页1018-1020"
  source_refs: *ref721
  status: confirmed
- id: vector_wave7_2_overflow_boundary
  type: behavior_oracle
  statement: "若向量元素过大，距离计算中间结果可能溢出单精度范围，导致距离结果为NAN或INF。"
  source_anchor: "1.6.51 页1020"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_similarity_operator
  type: syntax
  statement: "###操作符基于BM25算法族计算文本或分词文本数组相似度，入参分别为索引列和查询文本/文本数组，返回double precision；只对使用BM25索引的查询有效。"
  source_anchor: "1.6.51 页1021"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_dict_add_definition
  type: syntax
  statement: "gs_ts_dict_add_definition(dictionary,kind,words)增量添加词典内容；kind为t表示关键词/同义词，s表示停用词，words为文本数组，返回BOOLEAN。"
  source_anchor: "1.6.51 页1021-1022"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_dict_add_boundary
  type: constraint
  statement: "gs_ts_dict_add_definition效果等同于DDL；运行后会清空所有数据库连接的词典缓存，重新加载词典会显著降低BM25增删查性能，不建议在线使用。"
  source_anchor: "1.6.51 页1022"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_tokenize
  type: syntax
  statement: "gs_bm25_tokenize(text[,dictionary])使用指定词典对输入文本分词并返回text[]；词典默认为pg_catalog.simple_cn_segmentation。"
  source_anchor: "1.6.51 页1022"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_inspect
  type: syntax
  statement: "gs_bm25_inspect(index_name)显示BM25索引磁盘使用和内部词倒排信息，返回record。"
  source_anchor: "1.6.51 页1022-1023"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_distance_functions
  type: syntax
  statement: "gs_bm25_distance_text(text,text)和gs_bm25_distance_textarr(text[],text[])返回BM25文档相似分数，均返回double precision；只在使用BM25索引检索时有效。"
  source_anchor: "1.6.51 页1023"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_docid_info
  type: syntax
  statement: "gs_bm25_docid_info(index_oid,block_number,offset_number)返回BM25索引中ctid对应的docid信息；LOCAL分区索引入参为每个分区的索引oid。"
  source_anchor: "1.6.51 页1023-1024"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_document_info
  type: syntax
  statement: "gs_bm25_document_info(index_oid,docid)返回指定BM25索引文档信息；LOCAL分区索引入参为每个分区的索引oid；输出dfx_item和dfx_info。"
  source_anchor: "1.6.51 页1025-1026"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_index_hash_info
  type: syntax
  statement: "gs_bm25_index_hash_info(index_oid)返回BM25索引hash信息；LOCAL分区索引入参为每个分区的索引oid；输出dfx_item和dfx_info。"
  source_anchor: "1.6.51 页1026"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_token_info
  type: syntax
  statement: "gs_bm25_token_info(index_oid,document)返回指定文档在BM25索引中的token_name和token_id；LOCAL分区索引入参为每个分区的索引oid。"
  source_anchor: "1.6.51 页1027-1028"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_posting_info
  type: syntax
  statement: "gs_bm25_posting_info(index_oid,tokenid)返回指定tokenid的倒排信息，包括索引名、tokenid、倒排总/未压缩/压缩文档数和倒排表内容；LOCAL分区索引入参为每个分区的索引oid。"
  source_anchor: "1.6.51 页1028-1029"
  source_refs: *ref721
  status: confirmed
- id: bm25_wave7_2_business_boundary
  type: constraint
  statement: "gs_bm25_token_info和gs_bm25_posting_info不建议在业务期间使用，可能导致BM25文本索引增删操作效率降低。"
  source_anchor: "1.6.51 页1027-1029"
  source_refs: *ref721
  status: confirmed
