facts:
- id: dbejob_wave8_159_stop_single_job
  type: syntax
  statement: "STOP_SINGLE_JOB原型：DBE_SCHEDULER.stop_single_job(job_name text, force boolean DEFAULT false)；终止单个定时任务；force为true时调度器会发送终止信号立即结束任务线程、false时调度器尝试利用打断信号终止定时任务线程。"
  source_anchor: "3.12.2.17 STOP_SINGLE_JOB 页2841"
  source_refs: &refsj2
  - w8_159_3_12
  status: confirmed
- id: dbejob_wave8_159_generate_job_name
  type: syntax
  statement: "GENERATE_JOB_NAME原型：DBE_SCHEDULER.generate_job_name(prefix text DEFAULT 'JOB$_') return text；生成定时任务名称，反复执行生成的定时任务名为job$_1, job$_2, job$_3…；自定义前缀（如'job'）生成job3/job4等。"
  source_anchor: "3.12.2.17 GENERATE_JOB_NAME 页2842-2843"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_generate_name_sequence
  type: constraint
  statement: "GENERATE_JOB_NAME临时序列：首次执行会在public下创建一个临时序列用于保存当前名称的序号；由于普通用户没有在public下的CREATE权限，普通用户在当前数据库下第一次调用该函数会失败，需要授权该普通用户在public下的CREATE权限，或者使用有该权限的用户调用该接口以创建临时序列。"
  source_anchor: "3.12.2.17 GENERATE_JOB_NAME说明 页2843"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_create_program
  type: syntax
  statement: "CREATE_PROGRAM原型：DBE_SCHEDULER.create_program(program_name text, program_type text, program_action text, number_of_arguments integer DEFAULT 0, enabled boolean DEFAULT false, comments text DEFAULT NULL)；创建程序；program_type可用类型为'PLSQL_BLOCK'（匿名存储过程块）、'STORED_PROCEDURE'（保存的存储过程）、'EXTERNAL_SCRIPT'（外部脚本）。"
  source_anchor: "3.12.2.17 CREATE_PROGRAM 页2843-2844"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_define_program_argument
  type: syntax
  statement: "DEFINE_PROGRAM_ARGUMENT原型：DBE_SCHEDULER.define_program_argument(program_name text, argument_position integer, argument_name text, argument_type text, default_value text, out_argument boolean)（out_argument为预留参数）；定义程序参数；示例支持不带default_value与带default_value（'value1'）两种调用。"
  source_anchor: "3.12.2.17 DEFINE_PROGRAM_ARGUMENT 页2844-2845"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_drop_program_pair
  type: syntax
  statement: "DROP_PROGRAM与DROP_SINGLE_PROGRAM：DBE_SCHEDULER.drop_program(program_name text, force boolean DEFAULT false)删除程序、drop_single_program删除单个程序；force为true在删除程序之前将禁用应用该程序的所有作业、false时该程序不能被任何作业引用否则会发送错误。"
  source_anchor: "3.12.2.17 DROP_PROGRAM/DROP_SINGLE_PROGRAM 页2845-2846"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_set_job_argument_value
  type: syntax
  statement: "SET_JOB_ARGUMENT_VALUE原型（双原型）：DBE_SCHEDULER.set_job_argument_value(job_name text, argument_position integer, argument_value text)与(job_name text, argument_name text, argument_value text)；设置定时任务参数值，argument_value字段支持赋空入参（argument_name/argument_value允许为空）。"
  source_anchor: "3.12.2.17 SET_JOB_ARGUMENT_VALUE 页2846-2847"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_create_schedule
  type: syntax
  statement: "CREATE_SCHEDULE原型：DBE_SCHEDULER.create_schedule(schedule_name text, start_date timestamp with time zone DEFAULT NULL, repeat_interval text, end_date timestamp with time zone DEFAULT NULL, comments text DEFAULT NULL)；创建调度；示例基线：'sysdate + 3 / (24 * 60 * 60)'、'FREQ=DAILY; BYHOUR=6;'两种repeat_interval写法。"
  source_anchor: "3.12.2.17 CREATE_SCHEDULE 页2847-2848"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_drop_schedule_pair
  type: syntax
  statement: "DROP_SCHEDULE与DROP_SINGLE_SCHEDULE：drop_schedule(schedule_name text, force boolean DEFAULT false)与drop_single_schedule(schedule_name, force)；force为true在删除调度之前将禁用使用此调度的任何作业或窗口、false时调度不能被任何作业或窗口引用否则会发生错误。"
  source_anchor: "3.12.2.17 DROP_SCHEDULE/DROP_SINGLE_SCHEDULE 页2849-2850"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_create_job_class
  type: syntax
  statement: "CREATE_JOB_CLASS原型：DBE_SCHEDULER.create_job_class(job_class_name text, resource_consumer_group text DEFAULT NULL, service text DEFAULT NULL, logging_level integer DEFAULT 0, log_history integer DEFAULT NULL, comments text DEFAULT NULL)；创建定时任务类。"
  source_anchor: "3.12.2.17 CREATE_JOB_CLASS 页2851"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_drop_job_class_pair
  type: syntax
  statement: "DROP_JOB_CLASS与DROP_SINGLE_JOB_CLASS：drop_job_class(job_class_name text, force boolean DEFAULT false)与drop_single_job_class(job_class_name, force)；force为true该类的作业将被禁用并且其他类将设置为默认类（只有在成功的情况下才会删除该类）、false时被删除的类不得被任何作业引用否则报错。"
  source_anchor: "3.12.2.17 DROP_JOB_CLASS/DROP_SINGLE_JOB_CLASS 页2851-2853"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_grant_revoke_auth
  type: constraint
  statement: "定时任务权限管理：GRANT_USER_AUTHORIZATION(username text, privilege text)为数据库用户提供定时任务权限、REVOKE_USER_AUTHORIZATION(username text, privilege text)撤销权限；调用这两个函数的用户需要具有SYSADMIN权限；示例基线grant/revoke ('user1', 'create job')。"
  source_anchor: "3.12.2.17 GRANT/REVOKE_USER_AUTHORIZATION 页2853-2854"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_create_credential
  type: constraint
  statement: "CREATE_CREDENTIAL原型：DBE_SCHEDULER.create_credential(credential_name text, username text, password text DEFAULT NULL, database_role text DEFAULT NULL, windows_domain text DEFAULT NULL, comments text DEFAULT NULL)创建授权证书，调用该函数的用户需要具有SYSADMIN权限；password字段请传NULL或者'******'，该参数仅做兼容性处理不代表实际含义；禁止使用安装用户对应的os用户名创建证书。"
  source_anchor: "3.12.2.17 CREATE_CREDENTIAL 页2854-2855"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_drop_credential
  type: syntax
  statement: "DROP_CREDENTIAL原型：DBE_SCHEDULER.drop_credential(credential_name text, force boolean DEFAULT false)销毁授权证书，调用该函数的用户需要具有SYSADMIN权限；force为true无论是否有作业引用该证书都会被删除、false时任何作业都无法引用该证书否则会发生错误。"
  source_anchor: "3.12.2.17 DROP_CREDENTIAL 页2855-2856"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_enable_pair
  type: syntax
  statement: "ENABLE与ENABLE_SINGLE：DBE_SCHEDULER.enable(name text, commit_semantics text DEFAULT 'STOP_ON_FIRST_ERROR')启用对象（name可指定一个或多个、逗号隔开；commit_semantics支持'STOP_ON_FIRST_ERROR'/'TRANSACTIONAL'/'ABSORB_ERRORS'三种提交规则）；enable_single(name text)启用单个对象。"
  source_anchor: "3.12.2.17 ENABLE/ENABLE_SINGLE 页2856-2857"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_disable_pair
  type: constraint
  statement: "DISABLE与DISABLE_SINGLE：DBE_SCHEDULER.disable(name text, force boolean DEFAULT false, commit_semantics text DEFAULT 'STOP_ON_FIRST_ERROR')禁用多个对象（name为逗号分隔字符串，仅启用操作同步时同步操作）；force为true无论是否有其他对象依赖于该对象也会被禁用、false时任何对象都无法依赖该对象否则报错；commit_semantics三种提交规则同ENABLE；disable_single(name)停用单个对象。"
  source_anchor: "3.12.2.17 DISABLE/DISABLE_SINGLE 页2858-2860"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_eval_calendar_pair
  type: syntax
  statement: "周期分析函数对：EVAL_CALENDAR_STRING(calendar_string text IN, start_date timestamp with time zone IN, return_date_after timestamp with time zone IN)返回timestamp with time zone，分析调度任务周期；EVALUATE_CALENDAR_STRING多一个OUT参数next_run_date（定时任务返回下一个日期）。"
  source_anchor: "3.12.2.17 EVAL_CALENDAR_STRING/EVALUATE_CALENDAR_STRING 页2860-2861"
  source_refs: *refsj2
  status: confirmed
- id: dbejob_wave8_159_eval_examples
  type: behavior_oracle
  statement: "周期分析示例基线：CALL eval_calendar_string('FREQ=DAILY; BYHOUR=6;', sysdate, sysdate)输出2023-09-16 06:05:55+08；存储过程pr1以'FREQ=hourly;INTERVAL=2;BYHOUR=6,10;BYMINUTE=0;BYSECOND=0'调用evaluate_calendar_string输出next_run_date: 2003-02-02 06:00:00+08。"
  source_anchor: "3.12.2.17 周期分析示例 页2860-2862"
  source_refs: *refsj2
  status: confirmed
