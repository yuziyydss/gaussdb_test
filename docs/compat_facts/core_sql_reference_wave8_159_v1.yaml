  type: behavior_oracle
  statement: "启停示例基线：enable('job1')与enable('program1', 'STOP_ON_FIRST_ERROR')；enable_single('job1')；schedule删除示例drop_schedule('schedule1')/'schedule2', false/'schedule3', true三种force形态。"
  source_anchor: "3.12.2.17 ENABLE/DISABLE/DROP_SCHEDULE示例 页2849-2858"
  source_refs: *refsj2
