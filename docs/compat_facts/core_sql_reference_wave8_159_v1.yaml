  type: behavior_oracle
  statement: "STOP_SINGLE_JOB示例基线：create_job('job1','PLSQL_BLOCK','BEGIN INSERT INTO test1 VALUES(12); end;',0,null,null,null,'DEFAULT_JOB_CLASS',false,false,null,null,null)后CALL stop_single_job('job1', true)再drop_job('job1', true, false, 'STOP_ON_FIRST_ERROR')。"
  source_anchor: "3.12.2.17 STOP_SINGLE_JOB示例 页2842"
  source_refs: *refsj2
  status: confirmed
