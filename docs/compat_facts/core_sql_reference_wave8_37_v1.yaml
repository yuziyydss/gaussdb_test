facts:
- id: func_wave8_37_purpose
  type: syntax
  statement: "CREATE FUNCTION用于创建一个函数；语法支持PostgreSQL风格和Oracle风格，可声明参数、返回类型、语言、函数属性、函数体和SET会话参数。"
  source_anchor: "1.13.9.23 页1437与1439-1440"
  source_refs: &refb1
  - w8_37_1_13_9_23
  status: confirmed
- id: func_wave8_37_precision
  type: constraint
  statement: "创建函数时，如果参数或返回值带有精度，不进行精度检测。"
  source_anchor: "1.13.9.23 注意事项 页1437"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_schema_search_path
  type: constraint
  statement: "函数定义中操作表对象建议显式指定模式，否则可能导致函数执行异常；函数内部通过SET设置current_schema和search_path无效，函数执行后的current_schema/search_path与执行前保持一致。"
  source_anchor: "1.13.9.23 注意事项 页1437"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_out_param_override
  type: constraint
  statement: "函数参数带出参且需要出参生效时，必须设置behavior_compat_options='proc_outparam_override'；SELECT/CALL调用时出参位置必须提供实际参数，否则调用失败。"
  source_anchor: "1.13.9.23 注意事项 页1437"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_overload_rules
  type: constraint
  statement: "PostgreSQL风格函数或PACKAGE属性函数支持重载；REPLACE时参数个数、类型或返回值变化不会替换原函数而会建立新函数。不能仅因形参名、返回类型或默认值不同创建重载；不能创建与存储过程同名同参数列表的函数；不支持仅在自定义ref cursor与sys_refcursor类型不同的重载；调用重载函数时变量需明确具体类型。"
  source_anchor: "1.13.9.23 注意事项 页1437"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_public_execute
  type: constraint
  statement: "新函数默认授予PUBLIC执行权限，用户继承PUBLIC后可执行并查看函数定义；执行还需要函数所在Schema的USAGE权限。建议在同一事务中创建函数并设置执行权限，避免所有人可访问的时间窗口；开启对象隔离后普通用户只能查看有执行权限的函数定义。"
  source_anchor: "1.13.9.23 注意事项 页1437-1438"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_any_permission
  type: constraint
  statement: "被授予CREATE ANY FUNCTION权限的用户可以在用户模式下创建及替换函数。"
  source_anchor: "1.13.9.23 注意事项 页1438"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_security_mode
  type: constraint
  statement: "函数默认为SECURITY INVOKER；若要将默认行为改为SECURITY DEFINER，需设置behavior_compat_options='plsql_security_definer'。定义者权限函数创建到其他用户Schema下会以该用户权限执行，存在越权风险。"
  source_anchor: "1.13.9.23 注意事项 页1438-1439"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_out_restrictions
  type: constraint
  statement: "创建函数时不支持函数自身作为入参默认值；带OUT模式参数的函数不能在SQL语句中调用、不能被SELECT INTO调用、也不支持嵌套调用；建议先将有嵌套OUT调用的结果赋给临时变量再调用外层函数。"
  source_anchor: "1.13.9.23 注意事项 页1438-1439"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_return_and_schema
  type: constraint
  statement: "创建函数时不检查函数内返回值类型；运维管理员Schema下只允许初始用户、系统管理员和Schema属主创建对象，不允许其他用户在该Schema创建对象或将对象Schema修改为运维管理员Schema。"
  source_anchor: "1.13.9.23 注意事项 页1439"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_out_expression_contexts
  type: constraint
  statement: "使用EXECUTE IMMEDIATE sqlv USING func、SELECT func INTO、INSERT/UPDATE等DML执行函数、SELECT WHERE a=func()、带OUT函数作为入参、或为变量默认值赋值时，OUT出参不会生效。"
  source_anchor: "1.13.9.23 注意事项 页1439"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_return_complex_rules
  type: constraint
  statement: "RETURN复合类型构造器时，实际返回类型与定义返回类型不一致但可隐式转换则转换；支持跨Schema调用，不支持跨DATABASE调用。RETURN函数调用不支持在运算表达式中带OUT参数。函数复杂调用func(x).a支持跨Schema，不支持database.schema.package.func(x).b。"
  source_anchor: "1.13.9.23 注意事项 页1439"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_out_length_transfer
  type: constraint
  statement: "调用带OUT出参的存储过程时，设置behavior_compat_options='proc_outparam_transfer_length'可传递参数长度；支持CHAR(n)等字符串类型，OUT出参不生效场景无需传递长度，NUMERIC、DECIMAL、INTEGER、TIME、TIMESTAMP、INTERVAL等精度/时间类型不支持。"
  source_anchor: "1.13.9.23 注意事项 页1439-1440"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_pgproc_resolution
  type: constraint
  statement: "A兼容模式建立Oracle风格函数，PG兼容库建立PostgreSQL风格函数，不建议混合创建；函数支持重载需添加PACKAGE关键字。未指定同义词Schema时，存储过程和函数优先按名称检索pg_proc，没有同名函数时检索同义词，最后按search_path检索。"
  source_anchor: "1.13.9.23 注意事项 页1437"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_style_syntax
  type: syntax
  statement: "PostgreSQL风格使用RETURNS或RETURNS TABLE并可用AS 'definition'或AS 'obj_file','link_symbol'；Oracle风格使用RETURN、IS|AS plsql_body并以/结束。"
  source_anchor: "1.13.9.23 语法格式 页1439-1440"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_args_defaults
  type: syntax
  statement: "参数可声明argname、argmode、argtype和默认表达式；argmode取IN、OUT、INOUT或VARIADIC，默认IN；argtype和rettype可使用%TYPE或%ROWTYPE。推荐默认值参数放在非默认值参数后，调用入参从左往右匹配。"
  source_anchor: "1.13.9.23 参数说明 页1440-1441"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_returns_table
  type: syntax
  statement: "rettype可被SETOF修饰返回集合；存在OUT或INOUT参数时可省略RETURNS，若保留则必须与输出参数结果类型一致。RETURNS TABLE的每个column会被当作OUT参数；开启proc_outparam_override时SELECT/CALL必须按column提供实参。"
  source_anchor: "1.13.9.23 rettype/TABLE 页1441"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_language_window
  type: syntax
  statement: "LANGUAGE可为SQL、internal或用户定义过程语言；Oracle风格无论指定什么语言最终创建为plpgsql。internal函数需与内部系统函数的参数、个数和返回类型一致且仅SYSADMIN可创建；WINDOW表示窗口函数，替换定义时不能改变WINDOW属性，且自定义窗口函数仅支持LANGUAGE internal并引用窗口内部函数。"
  source_anchor: "1.13.9.23 LANGUAGE/WINDOW 页1442"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_volatility_package
  type: syntax
  statement: "IMMUTABLE/STABLE/VOLATILE描述稳定性，未指定默认VOLATILE；SHIPPABLE/NOT SHIPPABLE默认NOT SHIPPABLE且为预留接口。PACKAGE表示函数是否支持重载，package函数与非package函数不能互相重载或替换，package函数不支持VARIADIC参数且不允许修改package属性。"
  source_anchor: "1.13.9.23 函数属性 页1442-1443"
  source_refs: *refb1
  status: confirmed
- id: func_wave8_37_attributes_body
  type: syntax
  statement: "LEAKPROOF仅系统管理员可设置；RETURNS NULL ON NULL INPUT与STRICT相同；SECURITY INVOKER/AUTHID CURRENT_USER以调用者权限执行，SECURITY DEFINER/AUTHID DEFINER以创建者权限执行；COST大于等于0，ROWS默认1000且用于返回集合场景，SET可配置会话参数；plsql_body支持END;或END function_name;，不建议在函数体中操作密码或密钥敏感信息。"
  source_anchor: "1.13.9.23 LEAKPROOF/plsql_body 页1443-1444"
  source_refs: *refb1
  status: confirmed
