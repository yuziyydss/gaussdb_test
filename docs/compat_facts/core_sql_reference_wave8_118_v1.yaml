facts:
- id: m_release_savepoint_wave8_118_syntax
  type: syntax
  statement: "M兼容RELEASE SAVEPOINT删除一个当前事务先前定义的保存点：删除保存点令其无法作为回滚点使用，除此之外没有其它用户可见的行为；不能撤销在保存点建立之后执行的命令的影响（要撤销可使用ROLLBACK TO SAVEPOINT）；删除不再需要的保存点可令系统在事务结束之前提前回收一些资源；RELEASE SAVEPOINT也删除所有在指定保存点建立之后的所有保存点；语法为RELEASE [ SAVEPOINT ] savepoint_name。"
  source_anchor: "2.4.2.15.2 功能描述/语法格式 页2238"
  source_refs: &refmrel
  - w8_118_2_4_2_15_2
  status: confirmed
- id: m_release_savepoint_wave8_118_limits
  type: constraint
  statement: "M兼容RELEASE SAVEPOINT限制：不能RELEASE一个没有定义的保存点（语法上会报错）；如果事务在回滚状态则不能释放保存点；如果多个保存点拥有同样的名称只有最近定义的保存点才被释放。"
  source_anchor: "2.4.2.15.2 注意事项 页2238"
  source_refs: *refmrel
  status: confirmed
- id: m_rollback_wave8_118_syntax
  type: syntax
  statement: "M兼容ROLLBACK回滚当前事务并取消当前事务中的所有更新（事务运行过程中发生某种故障不能继续执行时，系统将事务中对数据库的所有已完成操作全部撤销，数据库状态回到事务开始时）；语法为ROLLBACK [ WORK | TRANSACTION ]（WORK/TRANSACTION可选关键字除增加可读性无任何其他作用）；如果不在一个事务内部发出ROLLBACK不会有问题但将抛出NOTICE信息；示例：START TRANSACTION后ROLLBACK取消所有更改。"
  source_anchor: "2.4.2.15.7 功能描述/注意事项/语法格式/示例 页2246"
  source_refs: &refmrb
  - w8_118_2_4_2_15_7
  status: confirmed
- id: m_rollback_savepoint_wave8_118_syntax
  type: syntax
  statement: "M兼容ROLLBACK TO SAVEPOINT回滚到一个保存点，隐含地删除所有在该保存点之后建立的保存点；回滚所有指定保存点建立之后执行的命令，保存点仍然有效并且需要时可以再次回滚到该点；语法为ROLLBACK [ WORK | TRANSACTION ] TO [ SAVEPOINT ] savepoint_name；不能回滚到一个未定义的保存点（语法上会报错）；使用RELEASE SAVEPOINT删除一个保存点但保留该保存点建立后执行的命令的效果；示例：START TRANSACTION后SAVEPOINT my_savepoint、ROLLBACK TO SAVEPOINT my_savepoint、RELEASE SAVEPOINT my_savepoint、COMMIT。"
  source_anchor: "2.4.2.15.8 功能描述/注意事项/语法格式/示例 页2247"
  source_refs: &refmrbs
  - w8_118_2_4_2_15_8
  status: confirmed
- id: m_savepoint_wave8_118_syntax
  type: syntax
  statement: "M兼容SAVEPOINT在当前事务里建立一个新的保存点（保存点是事务中的特殊记号，允许将在它建立后执行的命令全部回滚，把事务状态恢复到保存点所在的时刻）；语法为SAVEPOINT savepoint_name；保存点只能在一个事务块里面建立，一个事务里可以定义多个保存点；使用ROLLBACK TO SAVEPOINT回滚到保存点，使用RELEASE SAVEPOINT删除保存点但保留其后执行的命令效果。"
  source_anchor: "2.4.2.16.1 功能描述/注意事项/语法格式 页2247-2248"
  source_refs: &refmsave
  - w8_118_2_4_2_16_1
  status: confirmed
- id: m_savepoint_wave8_118_rollback_limits
  type: constraint
  statement: "M兼容SAVEPOINT回滚限制：由于节点故障或通信故障引起的节点线程或进程退出导致的报错，以及由于COPY FROM操作中源数据与目标表的表结构不一致导致的报错，均不能正常回滚到保存点之前，而是整个事务回滚。"
  source_anchor: "2.4.2.16.1 注意事项 页2248"
  source_refs: *refmsave
  status: confirmed
- id: m_savepoint_wave8_118_same_name
  type: constraint
  statement: "同名保存点的M兼容差异：SQL标准要求使用SAVEPOINT建立同名保存点时自动删除前面的同名保存点；在M-Compatibility数据库里将保留旧的保存点，但回滚或释放时只使用最近的保存点；释放了新的保存点将导致旧的再次成为ROLLBACK TO SAVEPOINT和RELEASE SAVEPOINT可访问的保存点；除此之外SAVEPOINT完全符合SQL标准。"
  source_anchor: "2.4.2.16.1 注意事项 页2248"
  source_refs: *refmsave
  status: confirmed
- id: m_savepoint_wave8_118_example
  type: behavior_oracle
  statement: "示例（m_db）：START TRANSACTION后INSERT 1、SAVEPOINT my_savepoint、INSERT 2、ROLLBACK TO SAVEPOINT my_savepoint、INSERT 3、COMMIT；查询table1同时看到1和3（不能看到2，因为2被回滚）。"
  source_anchor: "2.4.2.16.1 示例 页2248-2249"
  source_refs: *refmsave
  status: confirmed
- id: m_set_wave8_118_forms
  type: syntax
  statement: "M兼容SET修改运行时配置参数，五种形式：SET [ SESSION | LOCAL ] TIME ZONE { timezone | LOCAL | DEFAULT }（设置时区）；SET [ SESSION | LOCAL ] {CURRENT_SCHEMA { TO | = } { schema | DEFAULT } | SCHEMA 'schema'}（设置所属模式）；SET [ SESSION | LOCAL ] NAMES {'charset_name' [COLLATE 'collation_name'] | DEFAULT}（设置客户端编码集）；设置自定义用户变量SET @var_name := expr或SET @var_name = expr；设置其他运行时参数SET [ SESSION | @@SESSION. | @@ | LOCAL | @@LOCAL. ] {config_parameter { TO | = } { expr | DEFAULT } | FROM CURRENT}；还有SET {CHARSET | CHARACTER SET} {DEFAULT | charset_name}同时设置character_set_connection、character_set_results、character_set_client三个值。"
  source_anchor: "2.4.2.16.4 语法格式 页2272-2273"
  source_refs: &refmset
  - w8_118_2_4_2_16_4
  status: confirmed
- id: m_set_wave8_118_session_local
  type: constraint
  statement: "M兼容SET的SESSION与LOCAL：SESSION声明的参数只对当前会话起作用（SESSION和LOCAL都没出现时SESSION为缺省值；事务中执行此命令，事务回滚后影响消失，事务已提交则影响持续到会话结束除非被另一个SET重置）；LOCAL声明的参数只在当前事务中有效（COMMIT或ROLLBACK后会话级别设置再次生效；特例：一个事务里既有SET又有SET LOCAL且SET LOCAL在后面，事务结束前SET LOCAL起作用，但事务提交之后SET命令生效）。"
  source_anchor: "2.4.2.16.4 参数说明 页2273"
  source_refs: *refmset
  status: confirmed
- id: m_set_wave8_118_user_variables
  type: constraint
  statement: "M兼容SET自定义用户变量（MySQL风格）：变量名只能由数字、字母、下划线（_）、点（.）、$组成（使用引号引用时可用其他字符但不能使用相同引号）；自定义变量只存储数值类型、字符类型、二进制类型和NULL（布尔/有符号整型/bit/year转int8存储，无符号整型转无符号int8，float4/float8转float8，numeric转numeric，二进制转longblob，除year外的时间类型和字符类型转longtext）；prepare语句不支持自定义用户变量；连续赋值只支持@var_name1 := @var_name2 := … := expr和@var_name1 = @var_name2 := … := expr（等号只有放在首位才表示赋值，中间位置的等号表示比较操作符）；非SET语句中不支持对用户变量赋值只支持使用或查询；无法转换的数据类型则报错；字符串表达式避免包含敏感信息函数（如gs_encrypt、gs_decrypt）；expr为子查询或case when最终结果为子查询时自定义变量结果与直接查询一致（MySQL使用中间计算结果可能不一致）。"
  source_anchor: "2.4.2.16.4 参数说明 var_name/expr 页2274-2275"
  source_refs: *refmset
  status: confirmed
- id: m_set_wave8_118_at_at_syntax
  type: constraint
  statement: "M兼容SET的@@语法：支持SESSION | @@SESSION. | @@ | LOCAL | @@LOCAL.前缀（生效方式为superuser、user，可通过pg_settings系统视图context字段确定，未出现GLOBAL/SESSION时SESSION为缺省），支持config_parameter赋值为表达式；使用@@config_parameter进行操作符运算时尽量用空格隔开（如set @@config_parameter1= @@config_parameter1 * 2，否则=@@会被当做操作符）；GaussDB仅支持通过数据库运维平台下发全局参数（不支持@@global语法修改参数值，避免影响其他用户或应用带来安全隐患）；NAMES设置客户端字符编码等价于set client_encoding/character_set_connection/collation_connection/character_set_results（暂不支持指定charset_name与数据库字符集不同）。"
  source_anchor: "2.4.2.16.4 参数说明 页2273-2274"
  source_refs: *refmset
  status: confirmed
- id: m_set_role_wave8_118_syntax
  type: syntax
  statement: "M兼容SET ROLE设置当前会话的当前用户标识符；当前会话的用户必须是指定的rolename角色的成员（系统管理员可选择任何角色）；此命令可能增加也可能限制用户权限：会话用户角色有INHERITS属性时自动拥有它能SET ROLE变成的角色的所有权限（SET ROLE实际上是删除了所有直接赋予会话用户的权限及所属角色的权限，只剩指定角色的权限）；NOINHERITS属性时SET ROLE删除直接赋予会话用户的权限而获取指定角色的权限；语法：SET [ SESSION | LOCAL ] ROLE role_name PASSWORD 'password'（SESSION缺省，LOCAL只在当前事务有效，不支持直接使用密文密码）；重置：SET ROLE = DEFAULT。"
  source_anchor: "2.4.2.16.5 功能描述/注意事项/语法格式 页2275"
  source_refs: &refmsetrole
  - w8_118_2_4_2_16_5
  status: confirmed
- id: m_set_role_wave8_118_example
  type: behavior_oracle
  statement: "示例（m_db）：CREATE ROLE paul IDENTIFIED BY后SET ROLE paul PASSWORD '********'设置当前用户，SELECT CURRENT_USER查看，SET role = DEFAULT重置当前用户，DROP USER paul删除。"
  source_anchor: "2.4.2.16.5 示例 页2275"
  source_refs: *refmsetrole
  status: confirmed
- id: m_set_session_auth_wave8_118_syntax
  type: syntax
  statement: "M兼容SET SESSION AUTHORIZATION把当前会话里的会话用户标识和当前用户标识都设置为指定的用户；只有在初始会话用户有系统管理员权限时才能改变会话用户标识符（否则只有指定了被认证的用户名时系统才接受该命令）；语法：SET [ SESSION | LOCAL ] SESSION AUTHORIZATION role_name PASSWORD 'password'与重置{SET [ SESSION | LOCAL ] SESSION AUTHORIZATION DEFAULT | SET SESSION_AUTHORIZATION = DEFAULT}（DEFAULT重置为初始认证的用户名）；不支持直接使用密文密码。"
  source_anchor: "2.4.2.16.6 功能描述/注意事项/语法格式 页2276"
  source_refs: &refmsa
  - w8_118_2_4_2_16_6
  status: confirmed
- id: m_set_session_auth_wave8_118_example
  type: behavior_oracle
  statement: "示例（m_db）：CREATE ROLE paul IDENTIFIED BY后SET SESSION AUTHORIZATION paul password '********'，SELECT CURRENT_USER查看，SET SESSION_AUTHORIZATION = DEFAULT重置，DROP USER paul删除；相关参考SET ROLE。"
  source_anchor: "2.4.2.16.6 示例 页2276"
  source_refs: *refmsa
  status: confirmed
- id: m_set_transaction_wave8_118_syntax
  type: syntax
  statement: "M兼容SET TRANSACTION为事务设置特性（事务隔离级别、事务访问模式读/写或只读）；可设置会话默认事务特性（SESSION）或当前数据库的全局会话事务特性（GLOBAL）；语法为{ SET [ LOCAL | SESSION | GLOBAL ] TRANSACTION } { ISOLATION LEVEL { READ COMMITTED | READ UNCOMMITTED | SERIALIZABLE | REPEATABLE READ } | { READ WRITE | READ ONLY } }；LOCAL效果等价于SESSION，GLOBAL对当前数据库的全局会话生效；隔离级别：READ COMMITTED缺省、READ UNCOMMITTED行为与READ COMMITTED一致、REPEATABLE READ可重复读、SERIALIZABLE功能上不支持等价于REPEATABLE READ；事务中第一个数据修改语句（SELECT、INSERT、DELETE、UPDATE、COPY）执行之后当前事务隔离级别不能再次设置。"
  source_anchor: "2.4.2.16.7 功能描述/语法格式/参数说明 页2277"
  source_refs: &refmstmt
  - w8_118_2_4_2_16_7
  status: confirmed
- id: m_set_transaction_wave8_118_s2_note
  type: constraint
  statement: "M兼容SET TRANSACTION的s2行为：设置当前数据库全局会话（GLOBAL）的事务特性在重新连接后生效；开启m_format_dev_version='s2'参数时SET TRANSACTION默认是设置下一个事务特性，不允许在事务内使用下一个事务特性（事务内使用报ERROR: Transaction characteristics can't be changed while a transaction is in progress.）；如果隐式事务报错即单个SQL语句报错，继续保持下一个事务特性。"
  source_anchor: "2.4.2.16.7 注意事项 页2277"
  source_refs: *refmstmt
  status: confirmed
- id: m_set_transaction_wave8_118_example
  type: behavior_oracle
  statement: "示例（m_db）：SET LOCAL TRANSACTION ISOLATION LEVEL READ COMMITTED READ ONLY；SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED与SET SESSION TRANSACTION READ ONLY；SET GLOBAL TRANSACTION ISOLATION LEVEL READ COMMITTED与SET GLOBAL TRANSACTION READ ONLY；SET m_format_dev_version='s2'后SET TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY设置下一个事务特性。"
  source_anchor: "2.4.2.16.7 示例 页2278"
  source_refs: *refmstmt
  status: confirmed
- id: m_set_wave8_118_example
  type: behavior_oracle
  statement: "示例（m_db）：SET search_path TO tpcds, public设置模式搜索路径；SET datestyle TO postgres,dmy设置日期时间风格为POSTGRES风格（日在月前）；SET @a := 1设置用户变量；相关链接RESET、SHOW。"
  source_anchor: "2.4.2.16.4 示例 页2275"
  source_refs: *refmset
  status: confirmed
