facts:
- id: kw_wave8_179_overview
  type: syntax
  statement: "SQL关键字分为保留关键字和非保留关键字；根据标准保留关键字绝不能用做其他标识符，非保留关键字只是在特定环境里有特殊含义、在其他环境里可以用做标识符；关键字表按GaussDB/SQL:1999/SQL-92三列对比展示每个关键字在三种标准中的分类。"
  source_anchor: "1.2 关键字 页51"
  source_refs: &refkw
  - w8_179_1_2
  status: confirmed
- id: kw_wave8_179_statistics
  type: syntax
  statement: "关键字规模：表1-1共收录约932个关键字条目，其中GaussDB标记为保留的约198个、非保留的约734个（含'非保留（不能是函数或类型）'子类）。"
  source_anchor: "1.2 关键字 表1-1 页52-85"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_nonreserved_limits
  type: constraint
  statement: "非保留关键字作为数据库对象标识符的限制：不支持直接作为列别名使用（如SELECT 1 ABORT导致错误）；ENTITYESCAPING/NOENTITYESCAPING/WELLFORMED关键字不带双引号时不支持作为表名/列名/表别名/列别名/函数名标识符；不带双引号的RAW关键字不支持作为表名和函数名标识符；不带双引号的SET关键字不支持作为表别名标识符（SELECT * FROM T1 SET导致错误）。"
  source_anchor: "1.2 关键字须知 页51"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_variable_name_limits
  type: constraint
  statement: "非保留关键字作为变量名的限制：不带双引号的BEGIN/BY/CLOSE/CURSOR/DECLARE/DELETE/EXECUTE/FUNCTION/IF/IMMEDIATE/INSERT/LOOP/MOVE/OF/REF/RELEASE/RETURN/SAVEPOINT/STRICT/TYPE/UPDATE等关键字不支持作为变量名使用。"
  source_anchor: "1.2 关键字须知 页51"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_sysrefcursor
  type: constraint
  statement: "SYS_REFCURSOR关键字行为：用SYS_REFCURSOR关键字作为数据库对象标识符时，如果不附带双引号则创建名为REFCURSOR的数据库对象，如果附带双引号则创建名为SYS_REFCURSOR的数据库对象。"
  source_anchor: "1.2 关键字须知 页51"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_func_type_limit
  type: constraint
  statement: "'非保留（不能是函数或类型）'关键字与'非保留'关键字类似，不支持直接作为列别名使用。"
  source_anchor: "1.2 关键字须知 页51"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_current_timestamp
  type: constraint
  statement: "CURRENT_TIMESTAMP保留关键字限制：对于未带有双引号的保留关键字CURRENT_TIMESTAMP而言，不允许作为函数名。"
  source_anchor: "1.2 关键字须知 页51"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_mode_specific
  type: constraint
  statement: "模式特定关键字：CONVERT/TIMESTAMPADD/ADDDATE/DATE_ADD/SUBDATE/DATE_SUB/GET_FORMAT仅在B兼容和M兼容模式作为关键字；JSON_OBJECT/LAST_DAY/IFNULL仅在B兼容模式作为关键字。"
  source_anchor: "1.2 关键字须知 页51"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_identifier_rules
  type: syntax
  statement: "标识符命名规范：标识符需为小写字母(a-z)/大写字母(A-Z)/下划线(_)/数字(0-9)或美元符号($)；标识符必须以字母或下划线开头；此命名规范为建议项非强制项；特殊情况下可以使用双引号规避特殊字符报错。"
  source_anchor: "1.2 标识符命名规范 页51"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_prohibited_columns
  type: constraint
  statement: "建表时禁止作为列名的系统保留字段：CTID/XMIN/CMIN/XMAX/CMAX/TABLEOID/XC_NODE_ID/XC_NODE_HASH/GS_TUPLE_UID/TABLEBUCKETID。"
  source_anchor: "1.2 关键字 页85"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_reserved_examples
  type: syntax
  statement: "GaussDB保留关键字示例：ALL/ANALYSE/ANALYZE/AND/ANY/ARRAY/AS/ASC/BETWEEN（部分）/BINARY（可以是函数或类型）/BOTH/BUCKETS/CASE/CAST/COLLATE/COLLATION（可以是函数或类型）/COLUMN/CHECK/DEFAULT/DESC/DISTINCT/DO/ELSE/END/EXCEPT/EXISTS/EXTRACT/FALSE/FETCH/FOR/FROM/GRANT/GROUP/HAVING/IN/INTERSECT/INTO/IS/LATERAL/LIKE/LIMIT/OFFSET/ON/ONLY/OR/ORDER/PLACING/PRIMARY/RETURNING/SELECT/TABLE/THEN/TO/TRAILING/TRUE/UNION/UNIQUE/USER/USING/VARIADIC/WHEN/WHERE/WINDOW/WITH等。"
  source_anchor: "1.2 表1-1 页52-85"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_nonreserved_func_type
  type: syntax
  statement: "非保留（不能是函数或类型）关键字示例：BETWEEN/BIGINT/BINARY_DOUBLE/BINARY_INTEGER/BIT/BOOLEAN/CHAR/COALESCE/VARCHAR2/XMLATTRIBUTES/XMLCONCAT/XMLELEMENT/XMLEXISTS/XMLFOREST/XMLPARSE/XMLPI/XMLROOT/XMLSERIALIZE/XMLTYPE/ZEROFILL等。"
  source_anchor: "1.2 表1-1 页52-85"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_gaussdb_only_nonreserved
  type: syntax
  statement: "GaussDB特有非保留关键字示例（SQL:1999和SQL-92中标记为'-'）：ABORT/ACCESS/ACCOUNT/ADVANCED/ALSO/APPEND/ARCHIVE/ASSERTION/BAD_PATH/BARRIER/BLANKS/BLOCKCHAIN/BODY/BYTE/CACHE/CANCELABLE/CHANGE/CHECKED/CHECKPOINT/CLEAN/CLIENT/CLIENT_MASTER_KEY/CLOB/CLUSTER/COLVIEW/BUCKETS等。"
  source_anchor: "1.2 表1-1 页52-60"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_reserved_func_or_type
  type: syntax
  statement: "保留（可以是函数或类型）关键字示例：BINARY/COLLATION/VERBOSE等，这类关键字在GaussDB中标记为保留但同时可以做为函数或类型使用。"
  source_anchor: "1.2 表1-1 页52-85"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_sql1999_reserved
  type: syntax
  statement: "SQL:1999保留关键字示例（GaussDB中非保留）：ABS/ADA/ASENSITIVE/ALLOCATE/ARE/AVG/BREADTH/C/CARDINALITY/CATALOG_NAME/CHAR_LENGTH/CHARACTER_LENGTH/CHARACTER_SET_CATALOG等（GaussDB不将这些标记为保留）。"
  source_anchor: "1.2 表1-1 页52-85"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_dual_standard_diff
  type: syntax
  statement: "跨标准分类差异示例：ADD在GaussDB和SQL:1999中均为非保留/保留但SQL-92无此关键字；ADMIN在GaussDB中非保留但SQL:1999保留；ASSERTION在GaussDB非保留但SQL:1999和SQL-92保留；BETWEEN在GaussDB标记为非保留（不能是函数或类型）但在SQL:1999非保留、SQL-92保留；CALL在GaussDB非保留、SQL:1999保留、SQL-92无此关键字。"
  source_anchor: "1.2 表1-1 页52-54"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_type_name_keywords
  type: syntax
  statement: "数据类型名关键字（非保留，不能是函数或类型）：BIGINT/BINARY_DOUBLE/BINARY_INTEGER/BIT/BYTEAWITHOUTORDER/BYTEAWITHOUTORDERWITHEQUAL/CHAR/BOOLEAN等数据类型名在GaussDB中标记为非保留（不能是函数或类型），即这些名称可以用作标识符但不能同时作为函数或类型调用。"
  source_anchor: "1.2 表1-1 页53-54"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_xml_keywords
  type: syntax
  statement: "XML相关关键字：XMLATTRIBUTES/XMLCONCAT/XMLELEMENT/XMLEXISTS/XMLFOREST/XMLPARSE/XMLPI/XMLROOT/XMLSERIALIZE/XMLTYPE在GaussDB中均为非保留（不能是函数或类型）；XMLNAMESPACES/XMLTABLE/XMLQUERY/XMLCAST为非保留（无函数或类型限制）。"
  source_anchor: "1.2 表1-1 页84-85"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_gaussdb_reserved_diff
  type: syntax
  statement: "GaussDB保留但SQL标准非保留的关键字示例：ANALYSE/ANALYZE/BUCKETS/VERIFY/ASYMMETRIC等在GaussDB中标记为保留但在SQL:1999中标记为非保留或'-'。"
  source_anchor: "1.2 表1-1 页53-56"
  source_refs: *refkw
  status: confirmed
- id: kw_wave8_179_keyword_table_structure
  type: syntax
  statement: "关键字表结构：表1-1按三列展示关键字分类——关键字名称、GaussDB中的分类、SQL:1999中的分类、SQL-92中的分类；分类值包括保留/非保留/非保留（不能是函数或类型）/保留（可以是函数或类型）/非保留（不能是函数或类型）/或'-'（表示该标准中无此关键字）。"
  source_anchor: "1.2 表1-1 页52"
  source_refs: *refkw
  status: confirmed
open_questions:
- id: pkg2_wave8_179_oq_runtime
  content: "非保留关键字作为列别名/表别名/函数名的完整受限清单在不同GUC参数组合下的行为差异、SYS_REFCURSOR不带双引号自动去除SYS_前缀的机制、模式特定关键字在CREATE TABLE等DDL中的实际拦截行为需授权环境实机验证。"
  status: open
