facts:
- id: mtd_wave7_3_reload_pdb_conf
  type: syntax
  statement: "gs_reload_pdb_conf(name)使指定PDB配置文件立刻生效，入参可为空；空参仅能在PDB内调用并生效本PDB配置文件；成功返回true，否则false，仅sysadmin及以上权限可执行。"
  source_anchor: "1.6.52 页1029"
  source_refs: &ref731
  - w7_3_1_6_52
  status: confirmed
- id: mtd_wave7_3_resplan_cgroup_info
  type: syntax
  statement: "gs_resplan_cgroup_info()返回多租CGroup架构与份额明细，输出cgroup_name、shares、quota、cpuset、cpu_usage、relpath、task_num、group_id和is_disable。"
  source_anchor: "1.6.52 页1029-1030"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_resplan_cgroup_visibility
  type: constraint
  statement: "gs_resplan_cgroup_info等同gs_cgroup -p；CDB查看所有数据，PDB只能看本PDB范围；主机返回DefaultClass、DefaultBackend、Vacuum等CGroup和PDB Class_xxx控制组，备机执行报错。"
  source_anchor: "1.6.52 页1029-1030"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_resplan_stat_info
  type: syntax
  statement: "gs_resplan_stat_info(view_type)返回当前CDB资源计划实时统计，包含CPU、内存和I/O指标；view_type为0返回实时数据，1返回最近一次统计，2返回最近1小时统计历史。"
  source_anchor: "1.6.52 页1030-1031"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_resplan_stat_fields
  type: syntax
  statement: "gs_resplan_stat_info输出plan_name、pdb_name、begin/end_time、interval_msec、cpu_consumed_time、avg_cpu_utilization、iops、used_dynamic_memory、used_shared_memory、used_connections和logical_decoder_used_memory。"
  source_anchor: "1.6.52 页1030-1031"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_resplan_stat_visibility
  type: constraint
  statement: "gs_resplan_stat_info在CDB可查看所有数据，PDB只能看本PDB范围；函数在备机执行报错。"
  source_anchor: "1.6.52 页1030"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_resplan_shared_cache_boundary
  type: behavior_oracle
  statement: "资源变更时gs_resplan_stat_info的used_shared_memory共享缓存统计可能从0重新计数，随业务申请新共享缓存逐渐恢复，期间对性能无影响。"
  source_anchor: "1.6.52 页1030"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_pdb_tablespace_location
  type: syntax
  statement: "gs_get_pdb_tablespace_location(pdb_id,tablespace_oid)返回PDB表空间路径；pdb_id范围1到4095，tablespace_oid范围0到4294967295，返回text。"
  source_anchor: "1.6.52 页1035"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_pdb_tablespace_boundary
  type: behavior_oracle
  statement: "gs_get_pdb_tablespace_location仅供内核功能实现使用；pdb_id超出范围返回NULL；传入其他PDB的pdbid返回空字符串；执行用户无SYSADMIN权限返回空字符串；PDB下无对应表空间报错。"
  source_anchor: "1.6.52 页1035"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_get_mtd_user
  type: syntax
  statement: "get_mtd_user()按DB和User维度显示用户信息，返回setof record；SYSADMIN或有MONADMIN权限用户返回全部数据，普通用户只返回自己用户数据。"
  source_anchor: "1.6.52 页1035-1036"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_get_mtd_user_visibility
  type: constraint
  statement: "get_mtd_user在多租场景下Non-PDB调用返回全部信息，PDB调用仅返回本PDB相关信息。"
  source_anchor: "1.6.52 页1035"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_get_mtd_user_fields
  type: syntax
  statement: "get_mtd_user输出dbid、usename、usesysid、创建库/超级/系统表更新/复制等权限、密码、生效时间、资源池、父用户、空间限额、运行时配置、nodegroup和监控/运维/安全策略管理员标志。"
  source_anchor: "1.6.52 页1036-1037"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_instr_sql_count
  type: syntax
  statement: "get_instr_sql_count_info()按DB和User维度提供SELECT/UPDATE/INSERT/DELETE/MERGE INTO以及DDL、DML、DCL计数结果，返回record。"
  source_anchor: "1.6.52 页1037"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_instr_sql_count_visibility
  type: constraint
  statement: "get_instr_sql_count_info在多租场景下Non-PDB返回全部信息，PDB仅返回该PDB相关信息。"
  source_anchor: "1.6.52 页1037"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_db_rt_percentile
  type: syntax
  statement: "get_instr_db_rt_percentile()按DB维度显示SQL响应时间P80和P95分布信息，返回record；PDB内仅返回当前PDB信息。"
  source_anchor: "1.6.52 页1037-1038"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_user_login_info
  type: syntax
  statement: "get_instr_user_login_info()按DB和User维度显示当前节点用户登录、登出次数，需SYSADMIN或MONADMIN权限；PDB内仅返回当前PDB信息。"
  source_anchor: "1.6.52 页1038"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_shared_memory_info
  type: constraint
  statement: "gs_resplan_shared_memory_info()显示可用资源池共享缓存详细信息；仅enable_mtd=on时有效，且仅支持在主机CDB内由系统管理员查看。"
  source_anchor: "1.6.52 页1038-1039"
  source_refs: *ref731
  status: confirmed
- id: mtd_wave7_3_shared_memory_fields
  type: syntax
  statement: "gs_resplan_shared_memory_info输出respool_oid、allocated_shared_memory、respool_group_shared_memory、avaliable_shared_memory、real_used_shared_memory和shared_memory_hits_per；内存单位KB。"
  source_anchor: "1.6.52 页1038-1039"
  source_refs: *ref731
  status: confirmed
