facts:
- id: dropdb_wave8_46_purpose
  type: syntax
  statement: "DROP DATABASE用于删除一个数据库。"
  source_anchor: "1.13.10.10 页1662"
  source_refs: &refdb
  - w8_46_1_13_10_10
  status: confirmed
- id: dropdb_wave8_46_permissions
  type: constraint
  statement: "仅数据库所有者或被授予数据库DROP权限的用户可以执行DROP DATABASE；系统管理员默认拥有该权限。"
  source_anchor: "1.13.10.10 注意事项 页1662"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_protected_databases
  type: constraint
  statement: "无法删除系统默认安装的模板数据库和用户数据库postgres、template0、template1、templatea和templatem；可用gsql的\\l命令查看当前服务中的数据库。"
  source_anchor: "1.13.10.10 注意事项 页1662"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_active_connections
  type: constraint
  statement: "待删除数据库存在用户连接时无法成功删除；可通过视图DV_SESSIONS查看当前数据库连接。"
  source_anchor: "1.13.10.10 注意事项 页1662"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_transaction_block
  type: constraint
  statement: "不能在事务块中执行DROP DATABASE操作。"
  source_anchor: "1.13.10.10 注意事项 页1662"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_failure_retry
  type: behavior_oracle
  statement: "如果执行DROP DATABASE失败，事务回滚；需要再次执行一次DROP DATABASE IF EXISTS。"
  source_anchor: "1.13.10.10 注意事项 页1662"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_recyclebin_off
  type: constraint
  statement: "在不开启库级回收站的情况下，DROP DATABASE一旦执行将无法撤销，应谨慎使用。"
  source_anchor: "1.13.10.10 注意事项 页1662"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_recyclebin_on
  type: constraint
  statement: "开启库级回收站后执行DROP DATABASE，数据库对象将加入回收站；当数据库内的表级回收站含有对象时，无法删除数据库对象。"
  source_anchor: "1.13.10.10 注意事项 页1662"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_syntax
  type: syntax
  statement: "DROP DATABASE [IF EXISTS] database_name [PURGE]用于删除指定数据库。"
  source_anchor: "1.13.10.10 语法格式 页1662"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_if_exists
  type: constraint
  statement: "IF EXISTS可避免报错：数据库存在则成功删除；不存在时不执行删除，仅产生NOTICE提示。"
  source_anchor: "1.13.10.10 IF EXISTS 页1663"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_database_name
  type: syntax
  statement: "database_name指定要删除的数据库名称，取值为已存在的数据库名称字符串。"
  source_anchor: "1.13.10.10 database_name 页1663"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_purge_keyword
  type: syntax
  statement: "PURGE为可选关键字；在开启库级回收站的情况下，未指定PURGE表示将数据库放入库回收站。"
  source_anchor: "1.13.10.10 PURGE 页1663"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_recyclebin_example
  type: behavior_oracle
  statement: "enable_db_recyclebin=on时，DROP DATABASE flashback_db后gs_db_recyclebin中会出现rcyoriginname为flashback_db的回收站记录。"
  source_anchor: "1.13.10.10 示例 页1663"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_purge_example
  type: behavior_oracle
  statement: "enable_db_recyclebin=on时，DROP DATABASE flashback_db PURGE不加入回收站；随后查询gs_db_recyclebin返回0行。"
  source_anchor: "1.13.10.10 示例 页1663"
  source_refs: *refdb
  status: confirmed
- id: dropdb_wave8_46_lifecycle
  type: syntax
  statement: "DROP DATABASE与ALTER DATABASE和CREATE DATABASE构成数据库生命周期关联链路。"
  source_anchor: "1.13.10.10 相关链接 页1664"
  source_refs: *refdb
  status: confirmed
- id: droptbs_wave8_46_purpose
  type: syntax
  statement: "DROP TABLESPACE用于删除一个表空间。"
  source_anchor: "1.13.10.42 页1693"
  source_refs: &reftbs
  - w8_46_1_13_10_42
  status: confirmed
- id: droptbs_wave8_46_permissions
  type: constraint
  statement: "仅表空间所有者或被授予表空间DROP权限的用户可执行DROP TABLESPACE；系统管理员默认拥有该权限。"
  source_anchor: "1.13.10.42 注意事项 页1694"
  source_refs: *reftbs
  status: confirmed
- id: droptbs_wave8_46_empty_required
  type: constraint
  statement: "删除表空间之前，表空间里面不能有任何数据库对象，否则报错。"
  source_anchor: "1.13.10.42 注意事项 页1694"
  source_refs: *reftbs
  status: confirmed
- id: droptbs_wave8_46_no_transaction
  type: constraint
  statement: "删除表空间后不支持回滚，因此不能在事务块内部执行删除表空间操作；若存在其他会话执行\\db查询，可能因表空间事务导致查询失败，需重新执行\\db查询操作。"
  source_anchor: "1.13.10.42 注意事项 页1694"
  source_refs: *reftbs
  status: confirmed
- id: droptbs_wave8_46_syntax_semantics
  type: syntax
  statement: "DROP TABLESPACE [IF EXISTS] tablespace_name；IF EXISTS在表空间存在时删除、不存在时不删除仅返回NOTICE；tablespace_name必须为已存在表空间，删除失败后应再次执行DROP TABLESPACE IF EXISTS。"
  source_anchor: "1.13.10.42 语法/参数 页1694"
  source_refs: *reftbs
  status: confirmed
