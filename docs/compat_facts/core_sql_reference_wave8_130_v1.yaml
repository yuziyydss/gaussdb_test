facts:
- id: m_dt2_wave8_130_overview
  type: constraint
  statement: "M兼容2.6数据类型概述：支持布尔类型（BOOLEAN/BOOL）、二进制类型（BINARY、VARBINARY、TINYBLOB、BLOB、MEDIUMBLOB、LONGBLOB）、字符类型（CHAR、VARCHAR、TINYTEXT、TEXT、MEDIUMTEXT、LONGTEXT）、时间类型（DATE、TIME、TIMESTAMP、DATETIME、YEAR）、位串类型（BIT）、数值类型（TINYINT、SMALLINT、MEDIUMINT、INT/INTEGER、BIGINT、NUMERIC/DECIMAL、FLOAT、DOUBLE）、JSON类型、枚举类型（ENUM）、集合类型（SET）；支持数据类型间的类型转换及相关约束。"
  source_anchor: "2.6.1 概述 页2483"
  source_refs: &refmdt2
  - w8_130_2_6
  status: confirmed
- id: m_dt2_wave8_130_bool
  type: constraint
  statement: "M兼容BOOLEAN/BOOL数据类型用来存储布尔值true和false（BOOLEAN或BOOL作为TINYINT类型的同义词，可以在BOOL或BOOLEAN列中插入1和0之外的值，1字节）；取值：真TRUE/1/true/所有非0数值，假FALSE/0/false，空值null；SQL中建议BOOLEAN值使用true和false；示例插入TRUE/FALSE/123后显示1/0/123（用数字1和0输出BOOLEAN值）。"
  source_anchor: "2.6.2 布尔类型 表2-72/示例 页2483-2484"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_bool_example
  type: behavior_oracle
  statement: "布尔类型示例基线（m_db）：WHERE bt_col1 = 't'产生WARNING: The INTEGER value 't' is incorrect、WARNING: The DECIMAL value 't' is incorrect、WARNING: The double value 't' is incorrect三条告警返回0行；WHERE bt_col1 = '123'返回123|sic est一行。"
  source_anchor: "2.6.2 布尔类型 示例 页2484"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_binary
  type: constraint
  statement: "M兼容二进制类型（表2-73）：BINARY[(n)]二进制定长字符串不足补空格（n字节长度默认精度1，最大255字节）；VARBINARY(n)二进制变长字符串（最大65532字节）；BLOB[(n)]二进制大对象（指定n后创建为最小足以容纳n字节的BLOB类型，最大65535字节）；TINYBLOB（最大255字节）；MEDIUMBLOB（最大16777215字节）；LONGBLOB（最大1GB-1字节）；sql_mode参数值包含strict_trans_tables时非法输入或超范围报error，不包含时报warning并返回截断后的值；不支持'||'连接符连接数据。"
  source_anchor: "2.6.3 二进制类型 表2-73 页2484-2485"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_char
  type: constraint
  statement: "M兼容字符串类型（表2-74）：CHAR[(n)]定长字符串不足补空格（n字符长度默认1，最大255字符）；VARCHAR(n)变长字符串（n最大有效长度与字符集相关，最大65532字节）；TEXT[(n)]变长字符串（指定n后创建为最小足以容纳n字符对应字节长度的TEXT类型，最大65535字节）；TINYTEXT（最大255字节）；MEDIUMTEXT（最大16777215字节）；LONGTEXT（最大1GB-1字节）；sql_mode包含pad_char_to_full_length时CHAR类型作为表列和临时变量输出带尾部空格的字符串否则不带；不支持'||'连接符；strict_trans_tables严格模式超长报error，非严格报warning返回截断值。"
  source_anchor: "2.6.4 字符串类型 表2-74/说明 页2486-2487"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_date
  type: constraint
  statement: "M兼容DATE用于保存年月日信息（4字节）；输入格式支持有分隔符的'YYYY-MM-DD'、无分隔符的'YYYYMMDD'以及数字YYYYMMDD（年份可只输入2位：70~99默认1970~1999，00~69默认2000~2069；有分隔符场景任意标点符号可作为分隔符）；输出格式仅支持YYYY-MM-DD；范围1000-01-01 ~ 9999-12-31；sql_mode包含allow_invalid_dates时月1-12与日1-31可自由组合（2月31日也可存入）；不包含no_zero_in_date时允许月和日为0；不包含no_zero_date时允许年月日均为0。"
  source_anchor: "2.6.5 DATE 表2-75 页2488"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_time
  type: constraint
  statement: "M兼容TIME[(p)]用于保存时分秒和毫秒信息（8字节）；输入支持'hh:mm:ss'、'hhmmss'、数字hhmmss及天数信息'D hh:mm:ss'（毫秒输入最终四舍五入截断至指定精度；有分隔符场景仅单个英文冒号可作分隔符）；输出支持hh:mm:ss或hhh:mm:ss；范围-838:59:59.000000 ~ 838:59:59.000000；精度p表示小数点后精度取值0~6（超过6按6处理）。"
  source_anchor: "2.6.5 TIME 页2488"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_datetime
  type: constraint
  statement: "M兼容DATETIME[(p)]用于保存年月日时分秒信息（8字节）；输入支持'YYYY-MM-DD'、'YYYYMMDD'、数字及2位年份转换（70~99→1970~1999、00~69→2000~2069，支持毫秒输入四舍五入截断至指定精度）；有分隔符场景日期或时间部分任意标点符号可作分隔符（毫秒前分隔符只能是小数点），年月日与时分秒之间允许若干空格或单个大写字母T间隔；输出仅支持YYYY-MM-DD hh:mm:ss；范围1000-01-01 00:00:00 ~ 9999-12-31 23:59:59；allow_invalid_dates/no_zero_in_date/no_zero_date规则与DATE相同；精度p取值0~6超过6按6处理。"
  source_anchor: "2.6.5 DATETIME 页2489"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_timestamp
  type: constraint
  statement: "M兼容TIMESTAMP[(p)]用于保存同时包含日期信息和时间信息的数据（8字节，受到数据库时区的影响）；输入格式支持'YYYY-MM-DD hh:mm:ss'、'YYYYMMDDhhmmss'、数字YYYYMMDDhhmmss及2位年份转换（70~99→1970~1999、00~69→2000~2069，支持毫秒输入四舍五入截断至指定精度）。"
  source_anchor: "2.6.5 TIMESTAMP 页2490"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_bit
  type: constraint
  statement: "M兼容BIT[(n)]位串类型（一串由1和0组成的字符串，用于存储位掩码，最大64字节；n为位串长度取值[1,64]默认1）；明确转换成BIT(n)时位串右边截断或补零直到刚好n位不报错；输出时以字符串形式输出原位串值；支持位串输入和普通字符串输入；strict_trans_tables时非法输入或超范围报错，不包含时存入当前长度最大值；JDBC&&PBE场景setBytes或setBinaryStream向BIT列插入非4字节对齐数据时报错（用setString替代）；GUC参数m_format_behavior_compat_options包含enable_bit_out_to_hex可将bit显示格式变为十六进制（与MySQL 8.0一致，建议仅gsql场景打开）；x'0'长度不足八位补足一字节因此x'0'=x'00'；示例：严格模式插入b'10101'到BIT(3)报ERROR: Bit string too long for type bit varying(3)，宽松模式报WARNING并以111插入。"
  source_anchor: "2.6.6 位串类型 表2-76/说明/示例 页2494-2495"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_int_signed
  type: constraint
  statement: "M兼容有符号整数类型（表2-77）：TINYINT微整数（别名INT1，1字节，[-128, 127]）；SMALLINT [SIGNED]小范围整数（别名INT2，2字节，[-32768, 32767]）；MEDIUMINT中等范围整数（4字节，[-8388608, 8388607]）；INT/INTEGER [SIGNED]常用整数（别名INT4，4字节，[-2147483648, 2147483647]）；BIGINT [SIGNED]大范围整数（别名INT8，8字节，[-2^63, 2^63-1]）。"
  source_anchor: "2.6.7.1 有符号整数类型 表2-77 页2497"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_int_unsigned
  type: constraint
  statement: "M兼容无符号整数类型（表2-78）：TINYINT UNSIGNED无符号微整数（1字节，[0, 255]）；SMALLINT UNSIGNED（2字节，[0, 65535]）；MEDIUMINT UNSIGNED（4字节，[0, 16777215]）；INT/INTEGER UNSIGNED（4字节，[0, 4294967295]）；BIGINT UNSIGNED无符号大范围整数（8字节，[0, 2^64-1]）。"
  source_anchor: "2.6.7.2 无符号整数类型 表2-78 页2498"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_numeric
  type: constraint
  statement: "M兼容定点数数值类型（表2-79）用于精确存储数值：NUMERIC[(p[,s])]精度p取值[1,65]、标度s取值[0,30]且s不大于精度p（未指定精度或标度时默认p为10）；DECIMAL[(p[,s])]该类型映射为NUMERIC；存储空间为用户声明精度每四位（十进制位）占用两个字节再加八个字节额外开销；范围最大81位十进制数值。"
  source_anchor: "2.6.7.3 定点数数值类型 表2-79 页2499-2500"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_json
  type: constraint
  statement: "M兼容JSON类型（表2-81）为非结构化数据类型，用于存储和操作JSON数据（最大为1073741817字节）；文本解析成JSON类型后会忽略无关格式并做对象类型格式归一化；JSON数据类型的输入合法校验不受GUC参数sql_mode影响（sql_mode为任意取值时，JSON类型列输入不合法的字符都会产生ERROR）。"
  source_anchor: "2.6.8 JSON类型 表2-81 页2502"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_enum
  type: constraint
  statement: "M兼容ENUM为字符串类型（只在建表时创建，提供一个包含所有可选枚举值的列表；合法值为列表中的一个值，可由枚举值的字符串形式或下标表示）；创建语法ENUM('val1','val2',...) [CHARACTER SET charset_name] [COLLATE collation_name]；枚举值的字符串值和整型值一一对应（表2-82：NULL→NULL、''→0、'beijing'→1、'shanghai'→2、'nanjing'→3、'wuhan'→4）；宽松模式或INSERT IGNORE语法插入非法值时会插入0值即空串。"
  source_anchor: "2.6.9 枚举类型 表2-82 页2503-2504"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_set
  type: constraint
  statement: "M兼容SET数据类型为常量字符串类型（只在建表时创建，适用于存储确定集合的子集；底层以bitmap形式存储每个集合成员对应一个比特位）；字符串值与整型值对应（表2-84：'beijing'=0001=1、'shanghai'=0010=2、'nanjing'=0100=4、'wuhan'=1000=8、'beijing,nanjing'=0101=5）；输入格式字符串（成员间','分隔）或整型；输出子集合字符串成员间以','分隔；最多支持创建64个成员（存储空间4字节~8字节）；SET数据类型的输入合法校验受sql_mode影响（宽松模式输入不合法值插入0即空串，严格模式报错）；创建时每个成员值需要唯一（重复成员严格模式报错，宽松模式支持创建但默认使用第一个出现的）；SET数据类型支持字符集与字符序特性（校验成员重复与SET列上的字符序特性有关）；SET数据类型不支持作为分区键；SET类型上的索引仅支持通过整型查找（字符串值无法走索引）；与其他类型比较不支持走索引（需创建函数表达式索引）；开启回收站功能时含SET类型字段的表被删除不会进入回收站。"
  source_anchor: "2.6.10 集合类型 表2-84/2-85/说明 页2505-2507"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_float
  type: constraint
  statement: "M兼容浮点数数值类型（2.6.7.4）：FLOAT/DOUBLE用于近似存储数值（浮点数存储与计算存在精度限制）。"
  source_anchor: "2.6.7.4 浮点数数值类型 页2501-2502"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_zerofill
  type: constraint
  statement: "M兼容ZEROFILL与显示宽度：声明如INT(4) ZEROFILL时按照数据类型的默认显示宽度作为具体显示宽度（宽度不足左侧补零显示）；数值类型支持TINYINT/SMALLINT/MEDIUMINT/INTEGER/BIGINT及对应UNSIGNED与ZEROFILL组合（示例INSERT 100/200/300/400/500到a TINYINT、b SMALLINT、c MEDIUMINT、d INTEGER、e BIGINT）。"
  source_anchor: "2.6.7 数值类型 显示宽度 页2497-2498"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_strict_example
  type: behavior_oracle
  statement: "strict_trans_tables示例基线（m_db）：CHAR(5)严格模式插入超长数据报错；BIT(3)表严格模式插入b'10101'报ERROR: Bit string too long for type bit varying(3)，宽松模式SET SQL_MODE=''后插入同值报WARNING并以长度内最大值111插入。"
  source_anchor: "2.6.4/2.6.6 示例 页2487,2495"
  source_refs: *refmdt2
  status: confirmed
- id: m_dt2_wave8_130_type_convert
  type: constraint
  statement: "M兼容支持数据类型间的类型转换（具体转化关系参见类型转换章节）以及数据类型的相关约束（具体参见MySQL兼容性M-Compatibility模式约束章节）。"
  source_anchor: "2.6.1 概述 页2483"
  source_refs: *refmdt2
  status: confirmed
open_questions:
- id: m_dt2_wave8_130_oq_runtime
  statement: "M兼容strict_trans_tables与非严格模式在各类类型下的截断值边界、BIT的enable_bit_out_to_hex与JDBC工具适配、SET类型bitmap存储在64成员满配下的性能需授权环境实机验证。"
  status: open
