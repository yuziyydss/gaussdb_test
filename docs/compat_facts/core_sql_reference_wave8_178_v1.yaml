- id: dbschema_wave8_178_sql_mode_impact
  type: constraint
  statement: "sql_mode对M-Compatibility Schema查询的影响：sql_mode参数值包含ansi_quotes时，查询user列需要添加双引号（SELECT \"user\" FROM m_schema.tables_priv）；不包含ansi_quotes时需添加反引号（SELECT `user` FROM m_schema.tables_priv）；本版本M-Compatibility模式数据库中proc视图的type/language/sql_data_access/is_deterministic/security_type/sql_mode字段暂不予显示。"
  source_anchor: "11.2.2/11.2.4 说明 页5659-5663"
  source_refs: *refsch
  status: confirmed
- id: dbschema_wave8_178_view_access_pattern
  type: constraint
  statement: "M-Compatibility Schema视图访问模式：Information Schema和m_schema下的所有视图均为只读（不允许修改），所有用户对这些视图都有读取权限，用户只能看到自己有访问权限的记录；对于包含user列的视图（tables_priv/columns_priv等），sql_mode包含ansi_quotes时需双引号包裹、不包含时需反引号包裹。"
  source_anchor: "11.1/11.2 各视图说明 页5627-5663"
  source_refs: *refsch
  status: confirmed
