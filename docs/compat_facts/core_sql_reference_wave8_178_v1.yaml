  statement: "gs_前缀别名视图映射关系（表11-1）：dbe_perf Schema下ai_watchdog_*→gs_ai_watchdog_*、bgwriter_stat→gs_bgwriter_stat、config_settings→gs_config_settings、file_iostat→gs_file_iostat、global_*→gs_global_*（含bgwriter_stat/candidate_status/ckpt_status/config_settings/double_write_status/file_iostat/operator_history/runtime/os_runtime/os_threads/pagewriter_status/parallel_decode_status/plancache_clean/plancache_status/record_reset_time/recovery_status等）、summary_*→gs_summary_*、thread_wait_status→gs_thread_wait_status、transactions_*→gs_transactions_*、user_login→gs_user_login、user_transaction→gs_user_transaction、wait_events→gs_wait_events、wlm_*→gs_wlm_*、workload_*→gs_workload_*等，共约80个别名视图。"
  source_anchor: "11 表11-1 M-Compatibility模式数据库系统视图别名 页5618-5626"
  source_refs: *refsch
  status: confirmed
