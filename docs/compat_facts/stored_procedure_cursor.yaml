facts:
- id: sp_cursor_definition
  type: syntax
  statement: 游标是指向存储过程上下文区域的句柄或指针，存放SQL语句执行结果。分为显式和隐式两种。
  source_anchor: 3.11.1 L46-47
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页2631）
- id: sp_cursor_jdbc_returns
  type: constraint
  statement: 存储过程使用returns返回游标时JDBC调用返回的游标不可用；使用out出参不受影响。
  source_anchor: 3.11.1 须知 L59-60
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页2632）
- id: sp_cursor_commit_rollback_cache
  type: behavior_oracle
  statement: 存储过程内commit/rollback时显式游标会缓存所有数据以保证仍可用；数据量大时耗时较长。
  source_anchor: 3.11.1 须知 L61-62
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页2632）
- id: sp_cursor_rollback_fetch_error
  type: constraint
  statement: 存储过程内修改表数据后开启相关游标，rollback后继续FETCH游标数据会产生报错。
  source_anchor: 3.11.1 须知 L63-64
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页2632）
- id: sp_cursor_forbid_hold_guc
  type: environment
  statement: 开启GUC forbid_hold_cursor_with_forupdate时，FOR UPDATE/FOR SHARE游标在事务提交/回滚后下次循环访问时报错。
  source_anchor: 3.11.1 须知 L68-70
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页2632）
- id: sp_where_current_of_syntax
  type: syntax
  statement: WHERE CURRENT OF cursor_name：当游标指向表的某一行时，可更新/删除游标当前指向的行。
  source_anchor: 1 SQL参考 UPDATE L1880
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页1880）
- id: sp_where_current_of_b_unsupported
  type: constraint
  statement: B兼容模式不支持WHERE CURRENT OF语法。
  source_anchor: 1 SQL参考 UPDATE L1880 须知
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页1884）
- id: sp_where_current_of_table_types
  type: constraint
  statement: WHERE CURRENT OF仅支持普通表，不支持分区表。
  source_anchor: 1 SQL参考 UPDATE L1880 须知
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页1882）
- id: sp_where_current_of_stored_proc_only
  type: constraint
  statement: WHERE CURRENT OF仅支持在存储过程中使用。
  source_anchor: 1 SQL参考 UPDATE L1880 须知
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页1884）
- id: sp_where_current_of_no_combination
  type: constraint
  statement: WHERE CURRENT OF不支持与其他WHERE条件组合、多表更新、WITH/USING/ORDER BY/FROM组合。
  source_anchor: 1 SQL参考 UPDATE L1880 须知
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页1880）
- id: sp_where_current_of_for_update_required
  type: constraint
  statement: WHERE CURRENT OF的CURSOR对应SELECT必须声明为FOR UPDATE。
  source_anchor: 1 SQL参考 UPDATE L1880 须知
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页1884）
- id: sp_where_current_of_single_table
  type: constraint
  statement: WHERE CURRENT OF的CURSOR仅支持单表，不支持LIMIT/OFFSET、子查询、子链接。
  source_anchor: 1 SQL参考 UPDATE L1880 须知
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页1880）
- id: sp_where_current_of_cursor_invalid_after_txn
  type: constraint
  statement: 存储过程中FOR UPDATE的CURSOR在COMMIT/ROLLBACK后无法再次使用。
  source_anchor: 1 SQL参考 UPDATE L1880 须知
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页1884）
- id: sp_where_current_of_missing_row_mode_diff
  type: behavior_oracle
  statement: cursor指向行已不存在时：A兼容模式UPDATE报错（DELETE不报错）；其他兼容模式不报错。
  source_anchor: 1 SQL参考 UPDATE L1880 须知
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页1884）
- id: sp_cursor_attributes
  type: syntax
  statement: 显式游标属性：%FOUND(最近读成功)、%NOTFOUND(最近读失败)、%ISOPEN(已打开)、%ROWCOUNT(已读记录数)。
  source_anchor: 3.11.2 属性
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页2635）
- id: sp_cursor_implicit_dml
  type: behavior_oracle
  statement: 非查询语句使用隐式游标；单行查询可用隐式或显式；多行查询必须显式。
  source_anchor: 3.11.1 表3-2
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页2632）
