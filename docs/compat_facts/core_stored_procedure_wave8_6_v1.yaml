facts:
- id: sp_retry_wave8_6_scope
  type: syntax
  statement: "Retry用于SQL、存储过程和匿名块执行失败时在数据库内部重新执行，以提高成功率和用户体验。"
  source_anchor: "3.13 页3085"
  source_refs: &refb1
  - w8_6_3_13
  status: confirmed
- id: sp_retry_wave8_6_decision
  type: environment
  statement: "数据库内部通过检查错误发生时的错误码和Retry相关配置决定是否重试。"
  source_anchor: "3.13 页3085"
  source_refs: *refb1
  status: confirmed
- id: sp_retry_wave8_6_rollback
  type: behavior_oracle
  statement: "失败时回滚之前执行的语句并重新执行存储过程。"
  source_anchor: "3.13 页3085"
  source_refs: *refb1
  status: confirmed
- id: sp_raise_wave8_6_forms
  type: syntax
  statement: "RAISE语法包括raise_format、raise_condition、raise_sqlstate、raise_option和raise五种语法形式。"
  source_anchor: "3.14 页3086-3087"
  source_refs: &refb2
  - w8_6_3_14
  status: confirmed
- id: sp_raise_wave8_6_levels
  type: syntax
  statement: "level支持DEBUG、LOG、INFO、NOTICE、WARNING和EXCEPTION；EXCEPTION为默认值并抛出正常终止当前事务的异常，其他级别仅产生不同级别的信息。"
  source_anchor: "3.14 页3087"
  source_refs: *refb2
  status: confirmed
- id: sp_raise_wave8_6_message_controls
  type: environment
  statement: "特殊级别错误信息是否报告到客户端或写入服务器日志由log_min_messages和client_min_messages控制。"
  source_anchor: "3.14 页3087"
  source_refs: *refb2
  status: confirmed
- id: sp_raise_wave8_6_format
  type: syntax
  statement: "格式字符串后的%由参数值替换，%%用于打印%本身。"
  source_anchor: "3.14 页3087"
  source_refs: *refb2
  status: confirmed
- id: sp_raise_wave8_6_options
  type: syntax
  statement: "RAISE USING的option关键字包括MESSAGE、DETAIL、HINT和ERRCODE，expression可为任意字符串。"
  source_anchor: "3.14 页3087"
  source_refs: *refb2
  status: confirmed
- id: sp_raise_wave8_6_default_sqlstate
  type: behavior_oracle
  statement: "RAISE EXCEPTION未指定条件名或SQLSTATE时默认SQLSTATE为P0001；未指定消息文本时用条件名或SQLSTATE作为消息文本。"
  source_anchor: "3.14 页3087"
  source_refs: *refb2
  status: confirmed
- id: sp_raise_wave8_6_sqlstate_boundary
  type: constraint
  statement: "SQLSTATE可为五位数字或大写ASCII字母且不能为00000；应避免以三个0结尾的错误码，因为会被整个类别捕获。"
  source_anchor: "3.14 页3088"
  source_refs: *refb2
  status: confirmed
- id: sp_raise_wave8_6_exception_init
  type: syntax
  statement: "兼容O模式支持EXCEPTION_INIT自定义SQLCODE；sqlcode必须为负整数，范围-2147483647~-1。"
  source_anchor: "3.14 页3088"
  source_refs: *refb2
  status: confirmed
- id: sp_raise_wave8_6_exception_init_semantics
  type: behavior_oracle
  statement: "EXCEPTION_INIT定义错误码时SQLSTATE与SQLCODE相同，SQLERRM格式为“xxx: non-GaussDB Exception”；例如SQLCODE=-1时SQLSTATE=-1，SQLERRM=“ 1: non-GaussDB Exception”。"
  source_anchor: "3.14 页3088"
  source_refs: *refb2
  status: confirmed
- id: sp_raise_wave8_6_exception_init_limits
  type: constraint
  statement: "EXCEPTION_INIT支持在A兼容性下使用，不支持与系统错误码绑定，也不支持跨database.schema.package.exception调用。"
  source_anchor: "3.14 页3088"
  source_refs: *refb2
  status: confirmed
- id: sp_package_wave8_6_definition
  type: syntax
  statement: "package是一组相关存储过程、函数、变量、常量和游标等PL/SQL程序的组合，具有面向对象特点，并对创建、删除和修改统一处理。"
  source_anchor: "3.15 页3090"
  source_refs: &refb3
  - w8_6_3_15
  status: confirmed
- id: sp_package_wave8_6_visibility
  type: constraint
  statement: "包头中的声明可被外部函数和匿名块访问；包体中的声明只能被包体内函数和存储过程访问。"
  source_anchor: "3.15 页3090"
  source_refs: *refb3
  status: confirmed
- id: sp_package_wave8_6_limits
  type: constraint
  statement: "跨PACKAGE变量不能作FOR循环控制变量；PACKAGE内类型不支持删除/修改或定义表；不支持SCHEMA.PACKAGE.CURSOR引用cursor变量；带参数CURSOR只能在当前PACKAGE内打开；不支持package变量作参数默认值。"
  source_anchor: "3.15 页3090"
  source_refs: *refb3
  status: confirmed
- id: sp_package_wave8_6_pseudo_type_limit
  type: constraint
  statement: "PACKAGE内存储过程入参包含伪类型（如anyelement）时，不支持调用时传入变长类型参数。"
  source_anchor: "3.15 页3090"
  source_refs: *refb3
  status: confirmed
- id: sp_package_wave8_6_param_signature
  type: constraint
  statement: "包头和包体的函数in/out/inout参数不一致时，系统将识别为不同函数。"
  source_anchor: "3.15 页3090"
  source_refs: *refb3
  status: confirmed
