facts:
- id: mcompat_wave8_191_charset_list
  type: syntax
  statement: "GaussDB支持指定数据库/模式/表/列的字符集，默认字符集utf8；支持MySQL字符集：utf8mb4/utf8/gbk/gb18030/binary/latin1（表4-158）。"
  source_anchor: "4.4.2.4 字符集 页3397-3398"
  source_refs: &refw8191
  - w8_191_4_4_2
  status: confirmed
- id: mcompat_wave8_191_utf8_utf8mb4_same
  type: constraint
  statement: "GaussDB将utf8和utf8mb4视为同一字符集（编码最大4字节）；字符串字符集utf8时指定utf8mb4_bin/general_ci/unicode_ci/0900_ai_ci字符序不报错而MySQL报错；字符集utf8mb4指定utf8_bin/general_ci/unicode_ci时同样差异。"
  source_anchor: "4.4.2.4 说明 页3398"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_multibyte_parsing
  type: constraint
  statement: "词法语法解析按字节流解析，多字节字符中含与'\\'、'\\''、'\\\\'等符号一致的编码时与MySQL行为不一致，建议暂时关闭转义符开关规避。"
  source_anchor: "4.4.2.4 说明 页3398"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_illegal_char_validation
  type: constraint
  statement: "GaussDB对非法字符未严格校验：严格模式下部分字符函数可致非法字符成功输入而MySQL校验报错；宽松模式下截断后插入与MySQL一致；严格/宽松由sql_mode的strict_trans_tables配置项决定。"
  source_anchor: "4.4.2.4 说明 页3398"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_binary_charset_convert
  type: constraint
  statement: "GaussDB字符集转换逻辑与MySQL存在差异：binary与其他字符集混用时可能转码行为不一致；建议使用binary时client_encoding/server_encoding/character_set_connection保持一致且仅输入ASCII范围字符。"
  source_anchor: "4.4.2.4 说明 页3398"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_collation_list
  type: syntax
  statement: "GaussDB支持指定模式/表/列的排序规则；支持MySQL排序规则：binary/gb18030_bin/gb18030_chinese_ci/gbk_bin/gbk_chinese_ci/latin1_bin/latin1_swedish_ci/utf8_bin/utf8_general_ci/utf8_unicode_ci/utf8mb4_0900_ai_ci/utf8mb4_bin/utf8mb4_general_ci/utf8mb4_unicode_ci（表4-159）。"
  source_anchor: "4.4.2.5 排序规则 页3398-3399"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_collation_scope
  type: constraint
  statement: "排序规则差异：GaussDB仅字符串类型/部分二进制类型支持排序规则（pg_type的typcollation属性非0判断），其他类型不支持；MySQL所有类型均可指定但除字符串/二进制外无实际意义；排序规则（除binary外）仅支持对应字符集与库级字符集一致时指定且不支持表内多种字符集混合。"
  source_anchor: "4.4.2.5 说明 页3399"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_collation_default_pbe_binary
  type: constraint
  statement: "utf8mb4默认字符序utf8mb4_general_ci与MySQL 5.7一致；latin1字符序需设置m_format_dev_version='s2'；驱动PBE传参不支持显式指定排序规则；显式指定操作符两侧排序规则时一侧binary另一侧非binary则不支持比较。"
  source_anchor: "4.4.2.5 说明 页3399"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_txn_default_isolation
  type: constraint
  statement: "GaussDB默认隔离级别READ COMMITTED；MySQL默认隔离级别REPEATABLE-READ；GaussDB隔离级别只有READ COMMITTED和REPEATABLE READ生效。"
  source_anchor: "4.4.2.6 事务 页3399"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_txn_subtransaction
  type: constraint
  statement: "子事务差异：GaussDB支持SAVEPOINT/ROLLBACK TO SAVEPOINT，子事务回滚后父事务可继续运行；MySQL不存在创建保存点（子事务）。"
  source_anchor: "4.4.2.6 子事务 页3399"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_txn_nested
  type: constraint
  statement: "嵌套事务差异：GaussDB正常事务块中BEGIN新事务警告并忽略，异常事务块中BEGIN报错；MySQL正常事务块中BEGIN先提交之前事务再开启新事务，异常事务块中BEGIN忽略错误提交之前无错误语句并开启新事务。"
  source_anchor: "4.4.2.6 嵌套事务 页3400"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_txn_implicit_commit
  type: constraint
  statement: "隐式提交差异：GaussDB事务中执行DDL/DCL不会自动提交（可回滚）；MySQL在DDL/DCL/管理类语句/锁相关语句会自动提交。"
  source_anchor: "4.4.2.6 隐式提交的语句 页3400"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_set_transaction
  type: constraint
  statement: "SET TRANSACTION差异：GaussDB同时设置多次隔离级别/事务访问模式时只有最后一个生效；多个事务特性支持空格和逗号分隔；MySQL不允许设置多次且只支持逗号分隔；m_format_dev_version非's2'时SET TRANSACTION在会话级别生效，'s2'时设置下一个事务特性；MySQL中SET TRANSACTION在下一个事务生效。"
  source_anchor: "4.4.2.6 表4-160 页3400-3401"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_set_transaction_global
  type: constraint
  statement: "SET GLOBAL TRANSACTION差异：GaussDB GLOBAL是全局会话级别生效只针对当前数据库实例其它数据库不影响；MySQL会使所有数据库生效。"
  source_anchor: "4.4.2.6 表4-160 页3401"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_start_transaction
  type: constraint
  statement: "START TRANSACTION差异：GaussDB支持开启事务时设置隔离级别且多次设置只有最后一个生效，不支持立即开启一致性快照，多个事务特性支持空格和逗号分隔；MySQL不支持设置隔离级别和多次事务访问模式且只支持逗号分隔。"
  source_anchor: "4.4.2.6 START TRANSACTION差异 页3401"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_txn_guc_isolation
  type: constraint
  statement: "transaction_isolation差异：GaussDB SET只改当前事务隔离级别（会话级用default_transaction_isolation），MySQL SET改会话级；隔离级别支持范围GaussDB大小写空格敏感且read uncommitted实际生效read committed、serializable实际生效repeatable read，另有default；MySQL大小写不敏感空格敏感（READ-COMMITTED等）；m_format_dev_version='s2'时支持MySQL格式。"
  source_anchor: "4.4.2.6 表4-161 页3402"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_txn_guc_isolation_s2
  type: constraint
  statement: "m_format_dev_version='s2'时事务隔离设置：set @@transaction_isolation=value和set transaction isolation level value设置下一个事务特性；set [local|session|@@session.] transaction_isolation=value修改会话级；下一个事务特性不允许在事务内使用。"
  source_anchor: "4.4.2.6 表4-161 页3402"
  source_refs: *refw8191
  status: confirmed
- id: mcompat_wave8_191_txn_guc_misc
  type: constraint
  statement: "事务GUC参数其他差异：autocommit功能一致；tx_isolation只支持select @@查询不支持show不支持修改；default_transaction_isolation SET改变会话级隔离级别MySQL不支持该参数；transaction_read_only SET只改当前事务访问模式（会话级用default_transaction_read_only）；tx_read_only只支持select @@查询；default_transaction_read_only SET改变会话级访问模式MySQL不支持该参数；新事务值初始化为default_transaction_*值。"
  source_anchor: "4.4.2.6 表4-161 页3402-3403"
  source_refs: *refw8191
  status: confirmed
