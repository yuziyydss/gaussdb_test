- id: bmode_wave8_199_operator_overview
  type: syntax
  statement: "B模式操作符概述：GaussDB兼容绝大多数MySQL操作符但存在部分差异；除特别说明外默认为GaussDB原生行为。"
  source_anchor: "4.4.3.3 操作符 页3546"
  source_refs: *refw8199
  status: confirmed
- id: bmode_wave8_199_safe_equal
  type: syntax
  statement: "安全等于（<=>）支持。"
  source_anchor: "4.4.3.3 表4-189 页3546"
  source_refs: *refw8199
  status: confirmed
- id: bmode_wave8_199_regexp
  type: constraint
  statement: "[NOT] REGEXP/[NOT] RLIKE差异：b_format_dev_version='s2'时\\a/\\d/\\e/\\n/\\Z/\\u转义字符匹配与MySQL 5.7不一致与MySQL 8.0一致；\\b可与\\\\b匹配而MySQL匹配失败；右单括号GaussDB/MySQL 5.7报错MySQL 8.0不报错；|左右空值GaussDB不报错MySQL 5.7报错MySQL 8.0不报错；[:blank:]制表符MySQL 5.7不匹配MySQL 8.0匹配；非贪婪模式??/*?/+?等GaussDB支持MySQL 5.7报错MySQL 8.0支持；BINARY字符集下TEXT/BLOB转BYTEA后REGEXP无法匹配。"
  source_anchor: "4.4.3.3 表4-189 页3547"
  source_refs: *refw8199
  status: confirmed
- id: bmode_wave8_199_charset_list
  type: syntax
  statement: "字符集支持（表4-190）：utf8mb4/gbk/gb18030/utf8/binary均支持。"
  source_anchor: "4.4.3.4 表4-190 页3547-3548"
  source_refs: *refw8199
  status: confirmed
- id: bmode_wave8_199_collation_list
  type: syntax
  statement: "排序规则支持（表4-191）：binary/gb18030_bin/gb18030_chinese_ci/gbk_bin/gbk_chinese_ci/utf8_bin/utf8_general_ci/utf8mb4_0900_ai_ci/utf8mb4_bin/utf8mb4_general_ci/utf8mb4_unicode_ci均支持。"
  source_anchor: "4.4.3.5 表4-191 页3548"
  source_refs: *refw8199
  status: confirmed
- id: bmode_wave8_199_collation_rules
  type: constraint
  statement: "排序规则差异：仅字符串类型/部分二进制类型支持排序规则（typcollation非0判断）而MySQL所有类型可指定但除字符串/二进制外无实际意义；排序规则（除binary外）仅支持对应字符集与库级字符集一致时指定且不支持表内多种字符集混合；utf8mb4默认字符序utf8mb4_general_ci与MySQL 5.7一致；utf8和utf8mb4为同一字符集。"
  source_anchor: "4.4.3.5 说明 页3548"
  source_refs: *refw8199
  status: confirmed
- id: bmode_wave8_199_expression_overview
  type: syntax
  statement: "B模式表达式概述：GaussDB兼容绝大多数MySQL表达式但存在部分差异；未列出的表达式默认为GaussDB原生行为。"
  source_anchor: "4.4.3.6 表达式 页3548"
  source_refs: *refw8199
  status: confirmed
