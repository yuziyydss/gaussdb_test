open_questions:
- id: plsql_wave6_2_oq_cache_dump_matrix
  statement: "全局PL/SQL缓存失效、内存明细、编译产物dump和字节码在全局缓存开关、跨session、PACKAGE/函数/存储过程类型下的输出矩阵需授权环境验证。"
  status: open
- id: plsql_wave6_2_oq_crosstab_recompile_evidence
  statement: "tablefunc各类crosstab的数据边界，以及视图依赖刷新和schema重编译在依赖变更、失败重试和兼容模式下的行为矩阵需实机验证。"
  status: open
