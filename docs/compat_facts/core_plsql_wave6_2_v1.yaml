facts:
- id: plsql_wave6_2_invalidate_object
  type: syntax
  statement: "invalidate_plsql_object()与invalidate_plsql_object(schema,objname,objtype)失效Global Plsql Cache对象；仅在enable_global_plsqlcache=on时可用，需SYSADMIN权限。"
  source_anchor: "1.6.45 页980-981"
  source_refs: &ref451
  - w6_2_1_6_45
  status: confirmed
- id: plsql_wave6_2_invalidate_noargs
  type: behavior_oracle
  statement: "invalidate_plsql_object()无入参时将当前DATABASE内所有全局缓存对象失效。"
  source_anchor: "1.6.45 页980-982"
  source_refs: *ref451
  status: confirmed
- id: plsql_wave6_2_invalidate_args
  type: behavior_oracle
  statement: "invalidate_plsql_object(schema,objname,objtype)失效当前DATABASE内指定对象；objtype为package表示包，为function表示函数或存储过程。"
  source_anchor: "1.6.45 页980-982"
  source_refs: *ref451
  status: confirmed
- id: plsql_wave6_2_invalidate_observation
  type: behavior_oracle
  statement: "invalidate_plsql_object不返回失效结果；可通过gs_glc_memory_detail观察，失效前对应valid状态行存在，失效后没有对应valid状态行；函数属pg_catalog，可不指定Schema调用。"
  source_anchor: "1.6.45 页981-982"
  source_refs: *ref451
  status: confirmed
- id: plsql_wave6_2_memory_object_detail
  type: constraint
  statement: "gs_plsql_memory_object_detail(db_oid,obj_oid,obj_type)获取package/function的主要有效内存占用；需SYSADMIN权限。enable_global_plsqlcache=off时只显示当前session内存，跨session查询暂不支持。"
  source_anchor: "1.6.45 页982"
  source_refs: *ref451
  status: confirmed
- id: plsql_wave6_2_memory_object_detail_params
  type: syntax
  statement: "gs_plsql_memory_object_detail的db_oid和obj_oid均为uint32，传入0表示查询缓存中全部；obj_type支持all、pkg、func和func_in_pkg；参数不匹配时返回空行。"
  source_anchor: "1.6.45 页982"
  source_refs: *ref451
  status: confirmed
- id: plsql_wave6_2_memory_object_detail_fields
  type: syntax
  statement: "gs_plsql_memory_object_detail输出object_oid、context_name、item、searchpath、guc、file、line、size和db_oid。"
  source_anchor: "1.6.45 页983"
  source_refs: *ref451
  status: confirmed
- id: plsql_wave6_2_dump_compiled_object
  type: constraint
  statement: "dump_plsql_compiled_object(object_id,object_type)打印PACKAGE/FUNCTION编译产物信息，需SYSADMIN权限；enable_global_plsqlcache=off时仅能查当前session，暂不支持跨session或跨database。"
  source_anchor: "1.6.45 页984"
  source_refs: *ref451
  status: confirmed
- id: plsql_wave6_2_dump_compiled_object_types
  type: syntax
  statement: "dump_plsql_compiled_object的object_type不区分大小写；package查询包，function与procedure查询效果等价；object_oid为uint32，参数数量或类型不匹配时报错，返回text。"
  source_anchor: "1.6.45 页984"
  source_refs: *ref451
  status: confirmed
- id: plsql_wave6_2_dump_bytecode
  type: syntax
  statement: "dump_plsql_bytecode(function_id oid)返回存储过程字节码相关信息，输出pid、sessionid、global_sessionid、databaseid、pkg_id、func_id、func_signature和bytecode。"
  source_anchor: "1.6.46 页987-988"
  source_refs: &ref461
  - w6_2_1_6_46
  status: confirmed
- id: plsql_wave6_2_dump_bytecode_boundary
  type: constraint
  statement: "dump_plsql_bytecode仅限用户管理员查询；enable_global_plsqlcache=on时pid、sessionid和global_sessionid显示为NULL，编译产物全局共享且查询不区分会话；off时编译产物为每个会话独有并查询所有会话。"
  source_anchor: "1.6.46 页987"
  source_refs: *ref461
  status: confirmed
- id: plsql_wave6_2_bytecode_values
  type: behavior_oracle
  statement: "bytecode字段返回存储过程生成字节码序列；不支持时显示Not supported，尚未创建的存储过程显示To be created。"
  source_anchor: "1.6.46 页988-989"
  source_refs: *ref461
  status: confirmed
- id: plsql_wave6_2_tablefunc_extension
  type: constraint
  statement: "tablefunc()为处理表数据和数据透视的扩展接口；仅系统管理员可安装扩展；默认安装到public schema，建议安装到用户schema。"
  source_anchor: "1.6.47 页989"
  source_refs: &ref471
  - w6_2_1_6_47
  status: confirmed
- id: plsql_wave6_2_crosstab_source_n
  type: syntax
  statement: "crosstab(source_sql text[,N int])以source_sql结果为源数据生成透视表，返回setof record；N是无效参数，不影响结果。"
  source_anchor: "1.6.47 页989-990"
  source_refs: *ref471
  status: confirmed
- id: plsql_wave6_2_crosstab_n
  type: syntax
  statement: "crosstabN(source_sql)生成N+1列透视表；包括crosstab2、crosstab3和crosstab4，返回setof tablefunc_crosstab_N。"
  source_anchor: "1.6.47 页990"
  source_refs: *ref471
  status: confirmed
- id: plsql_wave6_2_crosstab_category
  type: syntax
  statement: "crosstab(source_sql,category_sql)以source_sql为源数据，按category_sql结果分类生成透视表，返回setof record。"
  source_anchor: "1.6.47 页990"
  source_refs: *ref471
  status: confirmed
- id: plsql_wave6_2_sys_guid
  type: syntax
  statement: "sys_guid()生成16字节全局唯一标识符，由当前机器IP、生成时间戳和随机数组成，返回raw。"
  source_anchor: "1.6.48 页990-991"
  source_refs: &ref481
  - w6_2_1_6_48
  status: confirmed
- id: plsql_wave6_2_uuid
  type: syntax
  statement: "uuid()返回符合RFC 4122及相关标准的UUID，是小写十六进制字符串，格式为8位+三组4位+12位，共32个数字表示128位，返回varchar。"
  source_anchor: "1.6.48 页991"
  source_refs: *ref481
  status: confirmed
- id: plsql_wave6_2_uuid_short
  type: syntax
  statement: "uuid_short()返回64位无符号短通用标识符；当前集群服务节点不超过256、节点重启间不修改系统时间、平均每秒调用少于1600万次时返回值唯一。"
  source_anchor: "1.6.48 页991"
  source_refs: *ref481
  status: confirmed
- id: plsql_wave6_2_uuid_short_upgrade_boundary
  type: constraint
  statement: "从505.0.0之前版本升级至最新版本时，升级未提交情况下不能使用uuid_short()。"
  source_anchor: "1.6.48 页991"
  source_refs: *ref481
  status: confirmed
- id: plsql_wave6_2_transform_view_dep_source
  type: constraint
  statement: "transform_view_dep_source()刷新GS_DEP_SOURCE的source字段：扩展视图定义中SELECT *星号，补充视图创建时对象使用的schema，并刷新视图依赖关系；仅管理员可调用，返回void。"
  source_anchor: "1.6.59 页1056"
  source_refs: &ref591
  - w6_2_1_6_59
  status: confirmed
- id: plsql_wave6_2_compile_schema
  type: syntax
  statement: "gs_compile_schema(schema_name,compile_all,retry_times)重编译指定命名空间中的包、函数、存储过程和视图，返回boolean；true表示重编译成功，false表示失败。"
  source_anchor: "1.6.59 页1056"
  source_refs: *ref591
  status: confirmed
- id: plsql_wave6_2_compile_schema_params
  type: constraint
  statement: "gs_compile_schema的schema_name为可空IN参数；compile_all默认false，false只编译PG_OBJECT中失效对象，true编译全部包/函数/存储过程/视图；retry_times默认10，表示失败后重试次数。"
  source_anchor: "1.6.59 页1056"
  source_refs: *ref591
  status: confirmed
- id: plsql_wave6_2_compile_schema_boundary
  type: environment
  statement: "gs_compile_schema支持所有兼容模式；文档推荐使用该新增系统函数替代PKG_UTIL.GS_COMPILE_SCHEMA。"
  source_anchor: "1.6.59 页1058"
  source_refs: *ref591
  status: confirmed
- id: plsql_wave6_2_scope_note
  type: environment
  statement: "Wave 6-2完整覆盖1.6.45 Global Plsql Cache、1.6.46存储过程字节码、1.6.47数据透视、1.6.48通用标识符和1.6.59失效重编译函数，页级并集980-991与1056-1058。"
