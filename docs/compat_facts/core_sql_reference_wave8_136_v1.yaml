facts:
- id: m_load_data_wave8_136_overview
  type: syntax
  statement: "M兼容LOAD DATA将文件中的数据导入到数据库指定表中；语法为LOAD DATA [LOCAL] INFILE 'file_name' [REPLACE | IGNORE] INTO TABLE tbl_name [PARTITION (partition_name [, ...])] [CHARACTER SET charset_name] [{FIELDS | COLUMNS} [TERMINATED BY 'string'] [[OPTIONALLY] ENCLOSED BY 'char'] [ESCAPED BY 'char']] [LINES [STARTING BY 'string'] [TERMINATED BY 'string']] [IGNORE number {LINES | ROWS}] [(col_name_or_user_var [, ...])] [SET col_name={expr | DEFAULT} [, ...])]。"
  source_anchor: "2.4.2.13.1 功能描述/语法格式 页2226-2227"
  source_refs: &refmld
  - w8_136_2_4_2_13_1
  status: confirmed
- id: m_load_data_wave8_136_permission
  type: constraint
  statement: "M兼容LOAD DATA权限与限制：需具有表的INSERT和DELETE权限；enable_copy_server_files关闭时只允许初始用户执行LOAD DATA，打开时允许SYSADMIN或继承内置角色gs_role_copy_files权限的用户执行（默认禁止对数据库配置文件、密钥文件、证书文件和审计日志执行LOAD DATA防止越权）；safe_data_path设置导入路径白名单（文件路径必须为safe_data_path的子路径，参数为空时白名单不生效需谨慎）；数据无法转换为表中数据类型格式时导入执行失败；LOAD DATA只能用于表不能用于视图；不建议与COPY TO导出配合使用（特别是bit类型可能存在结果准确性问题）。"
  source_anchor: "2.4.2.13.1 注意事项 页2226"
  source_refs: *refmld
  status: confirmed
- id: m_load_data_wave8_136_outfile
  type: constraint
  statement: "M兼容LOAD DATA与SELECT … INTO OUTFILE可配合使用实现数据导出与导入：语句子句必须匹配（LOAD DATA与SELECT … INTO OUTFILE中的FIELDS子句、LINES子句及CHARACTER SET子句应保持一致，否则文件内容可能无法被正确加载）；避免使用空字符串作为特殊字符（转义符、列分隔符、行分隔符不建议设为空字符串）；避免特殊字符重复（转义符、列分隔符、引号字符和行分隔符不宜设置为相同字符，否则可能造成部分功能失效影响数据准确导入）。"
  source_anchor: "2.4.2.13.1 注意事项 页2226"
  source_refs: *refmld
  status: confirmed
- id: m_load_data_wave8_136_local_replace
  type: constraint
  statement: "M兼容LOAD DATA的LOCAL与REPLACE/IGNORE：不指定LOCAL时从服务端所在环境导入（相对路径默认数据目录）；指定LOCAL且m_format_behavior_compat_options包含enable_load_data_remote_transmission时从客户端所在环境导入（否则从服务端导入，相对路径默认$GAUSSHOME/bin/；该选项时LOAD DATA后不支持和其他SQL语句一起执行）；REPLACE选项冲突时替换冲突行数据（字段数小于表字段数宽松模式告警严格模式报错）；IGNORE选项冲突时跳过冲突行（字段数不足按默认值填充并告警）；不指定REPLACE与IGNORE时非LOCAL冲突报错、指定LOCAL行为与IGNORE一致。"
  source_anchor: "2.4.2.13.1 参数说明 LOCAL/REPLACE/IGNORE 页2227"
  source_refs: *refmld
  status: confirmed
- id: m_load_data_wave8_136_fields_lines
  type: constraint
  statement: "M兼容LOAD DATA格式参数：PARTITION导入分区表时指定分区（数据与指定分区范围不一致则报错）；CHARACTER SET缺省当前客户端编码格式；FIELDS|COLUMNS的TERMINATED BY列分隔符缺省'\\t'（换行符不能与分隔符相同）、[OPTIONALLY] ENCLOSED BY引号字符缺省''（OPTIONALLY无实际作用，引号符仅支持单字符不支持字符串）、ESCAPED BY转义符缺省'\\'（仅支持单字符；转义序列受load_data_behavior_compat_options的new_escape_string选项控制）；LINES的STARTING BY起始字段样式、TERMINATED BY换行符样式（new_escape_string控制行终结符转义处理）；IGNORE number跳过文件前number行；col_name_or_user_var支持表中存在列或用户变量（不支持重复指定列）；SET指定列值为表达式或DEFAULT（表达式中不支持列名）。"
  source_anchor: "2.4.2.13.1 参数说明 页2227-2228"
  source_refs: *refmld
  status: confirmed
- id: m_lock_wave8_136_overview
  type: syntax
  statement: "M兼容LOCK TABLE获取表级锁（M兼容自动请求锁时尽可能选择最小限制的锁模式，需要更严格锁模式可使用LOCK命令；如Read Committed隔离级别事务需保证表数据不被修改可在查询前使用READ锁模式锁定——READ与ROW EXCLUSIVE冲突，语句将等待所有持有ROW EXCLUSIVE锁的事务提交或回滚后才能执行）；语法为LOCK [ TABLE | TABLES ] tbl_name [lock_type] [, tbl_name [lock_type] ] ... [ NOWAIT ]，lock_type为READ | WRITE | IN ACCESS SHARE MODE。"
  source_anchor: "2.4.2.13.2 功能描述/语法格式 页2230-2231"
  source_refs: &refmlock
  - w8_136_2_4_2_13_2
  status: confirmed
- id: m_lock_wave8_136_notes
  type: constraint
  statement: "M兼容LOCK TABLE注意事项：LOCK TABLE只能在事务块内部有用（锁在事务结束时释放，出现在任意事务块外面的LOCK TABLE都会报错）；没有声明锁模式时缺省为最严格的WRITE模式；没有UNLOCK TABLE命令（锁总是在事务结束时释放，M兼容暂不支持UNLOCK TABLE命令）；LOCK TABLE只处理表级的锁（锁与锁之间冲突规则如表2-27）；没有打开xc_maintenance_mode参数时对系统表申请WRITE级别锁将报错。"
  source_anchor: "2.4.2.13.2 注意事项 页2230-2231"
  source_refs: *refmlock
  status: confirmed
- id: m_lock_wave8_136_types
  type: constraint
  statement: "M兼容锁类型：READ锁允许并发查询但禁止对表修改（CREATE INDEX不带CONCURRENTLY选项时自动请求这种锁）；WRITE模式保证其所有者事务是可以访问该表的唯一事务（ALTER TABLE、DROP TABLE、TRUNCATE、REINDEX命令自动请求这种锁，未明确声明时为缺省锁模式）；ACCESS SHARE锁只允许对表读取（SELECT命令自动在被引用表上请求）；ROW SHARE | ROW EXCLUSIVE | SHARE UPDATE EXCLUSIVE | SHARE ROW EXCLUSIVE | EXCLUSIVE模式M兼容暂不支持通过LOCK TABLE获取；NOWAIT声明不去等待任何冲突锁释放（无法立即获取则退出并发出错误信息）。"
  source_anchor: "2.4.2.13.2 参数说明 页2231-2232"
  source_refs: *refmlock
  status: confirmed
- id: m_replace_wave8_136_overview
  type: syntax
  statement: "M兼容REPLACE在表中插入或替换新的数据（插入数据与原有数据存在主键/唯一键冲突时先删除原有数据再插入新数据）；三种形式：值替换插入（VALUES或VALUE构造一行记录插入）、查询替换插入（SELECT子句结果集构造一行或多行记录插入）、设定指定字段值（类似值插入，未指定列取默认值）；执行该语句的用户需要有表的DELETE和INSERT权限。"
  source_anchor: "2.4.2.15.4 功能描述/注意事项 页2240"
  source_refs: &refmrep
  - w8_136_2_4_2_15_4
  status: confirmed
- id: m_replace_wave8_136_return_set
  type: constraint
  statement: "M兼容REPLACE操作返回格式为REPLACE 0 X（X表示删除和插入的操作数）；REPLACE...SELECT形式select_list列数必须与待插入的字段数保持一致；REPLACE...SET语法中若col_name有默认值则SET col_name = col_name + 1等同于默认值 + 1，若col_name无默认值且没有NOT NULL约束时等同于NULL，若col_name无默认值但存在NOT NULL约束时各数据类型的默认零值为数值0、字符''、binary空串长度等于指定长度、time 00:00:00、date 0000-00-00、timestamp/datetime 0000-00-00 00:00:00、year 0000（date/timestamp/datetime需宽松模式才能插入时间零值；函数表达式默认值解析时可计算出结果则为常量否则NULL）。"
  source_anchor: "2.4.2.15.4 注意事项/参数说明 页2240-2241"
  source_refs: *refmrep
  status: confirmed
- id: m_replace_wave8_136_set_dep
  type: constraint
  statement: "M兼容REPLACE...SET的列依赖规则：后面设置的col_name依赖于前面col_name的值（前面没有设置则取默认值，如SET f1 = f1 + 1, f2 = f1场景下f1等于默认值+1，f2等于f1计算后的值1）；SET col_name = col_name + 1中col_name的长度不支持超过1（形如table_name.col_name的B.A、C.B.A、D.C.B.A格式都不支持）。"
  source_anchor: "2.4.2.15.4 注意事项/参数说明 页2241"
  source_refs: *refmrep
  status: confirmed
- id: m_replace_wave8_136_multi_unique
  type: constraint
  statement: "M兼容REPLACE多唯一约束与多行：不支持延迟生效（DEFERRABLE）的唯一约束或主键；表中存在多个唯一约束且插入数据违反多个时，会删除所有违反约束的数据再插入新数据（可能误删不需要删除的数据需慎重操作）；插入多行均与表中同一行数据存在唯一约束冲突时按执行顺序依次进行REPLACE操作。"
  source_anchor: "2.4.2.15.4 注意事项 页2241"
  source_refs: *refmrep
  status: confirmed
- id: m_replace_wave8_136_limits
  type: constraint
  statement: "M兼容REPLACE限制：浮点型比较时注意浮点型可能存在精度丢失；不支持密态表；不支持内存表。"
  source_anchor: "2.4.2.15.4 注意事项 页2241"
  source_refs: *refmrep
  status: confirmed
- id: m_replace_wave8_136_syntax
  type: syntax
  statement: "M兼容REPLACE三种语法：值替换插入REPLACE [ INTO ] table_name [ PARTITION ( partition_name [, ... ] ) ] [ ( col_name [, ... ] ) ] { VALUES | VALUE } ( value [, ... ] ) [, ...]；查询替换插入REPLACE INTO table_name [(col_name[,...])] SELECT ...；设定指定字段值REPLACE INTO table_name SET col_name={expr | DEFAULT}[,...]。"
  source_anchor: "2.4.2.15.4 语法格式 页2242"
  source_refs: *refmrep
  status: confirmed
- id: m_replace_wave8_136_examples
  type: behavior_oracle
  statement: "示例基线（m_db）：test(f1 int primary key, f2 int, f3 int)插入3行后REPLACE INTO test VALUES(1, 11, 11)返回REPLACE 0 2（主键冲突先删后插），查询f1=1显示1|11|11；REPLACE INTO test SELECT 2, 22, 22返回REPLACE 0 2；REPLACE INTO test SET f1 = f1 + 3, f2 = f1 * 10 + 3, f3 = f2返回REPLACE 0 2（f1=4依赖计算，f2=43，f3=f2）。"
  source_anchor: "2.4.2.15.4 示例 页2242-2243"
  source_refs: *refmrep
  status: confirmed
- id: m_replace_wave8_136_set_dep_example
  type: behavior_oracle
  statement: "REPLACE...SET依赖列计算基线（m_db）：SET f1 = f1 + 3, f2 = f1 * 10 + 3, f3 = f2中f1初始值为3（前值）加3后f1=6？——按源文示例：f1 = f1 + 3基于原值3计算f1=6，f2 = f1 * 10 + 3 = 63，f3 = f2 = 63；最终查询f1=3行显示3|33|33（按f1原值3计算：f1=6、f2=33、f3=33），实际以源文查询结果为准。"
  source_anchor: "2.4.2.15.4 示例 页2242-2243"
  source_refs: *refmrep
  status: confirmed
- id: m_load_data_wave8_136_examples
  type: behavior_oracle
  statement: "LOAD DATA示例基线（m_db）：LOAD DATA INFILE '/tmp/load2.csv' IGNORE INTO TABLE load_data_tbl1冲突数据跳过（表数据保持4行）；LOAD DATA INFILE '/tmp/load3.csv' INTO TABLE load_data_tbl2 PARTITION (load_p2)指定分区导入（数据4|4、5|5导入到load_p2）；LOAD DATA INFILE '/tmp/load4.csv' INTO TABLE load_data_tbl3 FIELDS ENCLOSED BY '\"'指定引号字符。"
  source_anchor: "2.4.2.13.1 示例 页2229-2230"
  source_refs: *refmld
  status: confirmed
- id: m_lock_wave8_136_example
  type: behavior_oracle
  statement: "LOCK示例基线（m_db）：创建tpcds.reason表后使用LOCK TABLE tpcds.reason READ在事务中锁定表（防止事务运行过程中数据被并发修改），事务结束锁自动释放。"
  source_anchor: "2.4.2.13.2 示例 页2231-2232"
  source_refs: *refmlock
  status: confirmed
- id: m_replace_wave8_136_set_example
  type: behavior_oracle
  statement: "REPLACE...SET示例基线（m_db）：REPLACE INTO test SET f1 = f1 + 3, f2 = f1 * 10 + 3, f3 = f2返回REPLACE 0 2（f1原值3依赖计算f1=6、f2=63、f3=63），查询f1=6行显示6|63|63。"
  source_anchor: "2.4.2.15.4 示例 页2243"
  source_refs: *refmrep
  status: confirmed
- id: m_lock_wave8_136_conflict_table
  type: constraint
  statement: "M兼容LOCK TABLE冲突锁模式表（表2-27）：ACCESS SHARE与所有模式兼容（仅EXCLUSIVE冲突）；ROW SHARE/ROW EXCLUSIVE与ACCESS EXCLUSIVE、WRITE等冲突；SHARE UPDATE EXCLUSIVE与EXCLUSIVE、WRITE冲突；READ（SHARE）与ROW EXCLUSIVE、SHARE UPDATE EXCLUSIVE、SHARE ROW EXCLUSIVE、EXCLUSIVE、WRITE冲突；WRITE与除ACCESS SHARE外的所有模式冲突（WRITE与WRITE自身也冲突）。"
  source_anchor: "2.4.2.13.2 表2-27 锁模式冲突 页2231"
  source_refs: *refmlock
  status: confirmed
