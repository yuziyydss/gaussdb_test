facts:
  # DBE_SESSION
  - id: dbe_session_set_context
    type: syntax
    statement: "DBE_SESSION.SET_CONTEXT(namespace TEXT, attribute TEXT, value TEXT) RETURNS VOID：设置指定context下某一属性的值。namespace不存在时新建（最长128字节超长截断）。attribute最长1024字节超长截断。"
    source_anchor: "3.12.2 表3-329"
    status: confirmed
    verification_method: 逐页精读（页2861-2862）

  - id: dbe_session_clear_context
    type: syntax
    statement: "DBE_SESSION.CLEAR_CONTEXT(namespace TEXT, attribute TEXT, value TEXT)：清除指定context下某一属性。"
    source_anchor: "3.12.2 表3-330"
    status: confirmed
    verification_method: 逐页精读（页2862）

  - id: dbe_session_search_context
    type: syntax
    statement: "DBE_SESSION.SEARCH_CONTEXT(namespace TEXT, attribute TEXT, value OUT TEXT)：查找指定context下某一属性的值并输出。"
    source_anchor: "3.12.2 表3-331"
    status: confirmed
    verification_method: 逐页精读（页2863）

  - id: dbe_session_modify_package_state
    type: syntax
    statement: "DBE_SESSION.MODIFY_PACKAGE_STATE(package_name TEXT, option INTEGER)：修改当前会话的PL/SQL状态。"
    source_anchor: "3.12.2 表3-332"
    status: confirmed
    verification_method: 逐页精读（页2863-2864）

  # DBE_RANDOM
  - id: dbe_random_set_seed
    type: syntax
    statement: "DBE_RANDOM.SET_SEED(seed IN INTEGER)：设置随机数种子。相同种子产生相同随机数序列（伪随机）。"
    source_anchor: "3.12.2 表3-267"
    status: confirmed
    verification_method: 逐页精读（页2814）

  - id: dbe_random_get_value
    type: syntax
    statement: "DBE_RANDOM.GET_VALUE(min IN NUMBER DEFAULT 0, max IN NUMBER DEFAULT 1) RETURN NUMBER：生成[min, max)范围内的随机数。min≤随机数<max。参数类型NUMERIC，边界大小无要求。有效数字15位。"
    source_anchor: "3.12.2 表3-268"
    status: confirmed
    verification_method: 逐页精读（页2814-2815）

  - id: dbe_random_pseudorandom_warning
    type: constraint
    statement: "DBE_RANDOM实现伪随机，种子不变则随机数序也不变。不建议在安全场景使用。"
    source_anchor: "3.12.2 表3-268说明"
    status: confirmed
    verification_method: 逐页精读（页2815）

  - id: dbe_random_example
    type: behavior_oracle
    statement: "示例：SELECT DBE_RANDOM.GET_VALUE(0,1)；返回0-1之间的随机数（如0.262837771494693）。"
    source_anchor: "3.12.2 示例"
    status: confirmed
    verification_method: 逐页精读（页2815）
