facts:
  # DBE_PROFILER
  - id: dbe_profiler_overview
    type: environment
    statement: "DBE_PROFILER用于分析存储过程性能：执行PL_START_PLPROFILING后系统初始化内存记录数据，对后续存储过程打桩记录关键点信息，事务提交后写入系统表。"
    source_anchor: "3.12.2.14 概述"
    status: confirmed
    verification_method: 逐页精读（页2806）

  - id: dbe_profiler_start
    type: syntax
    statement: "DBE_PROFILER.PL_START_PROFILING(run_id IN VARCHAR2(64)) RETURN VOID：开始profiling。run_id为执行编号，系统将session_id和执行时间拼接生成。"
    source_anchor: "3.12.2.14 表3-259"
    status: confirmed
    verification_method: 逐页精读（页2807）

  - id: dbe_profiler_clear
    type: syntax
    statement: "DBE_PROFILER.PL_CLEAR_PROFILING(run_id IN VARCHAR2) RETURN VOID：删除某次或所有profiling存储在系统表中的数据。"
    source_anchor: "3.12.2.14 表3-260"
    status: confirmed
    verification_method: 逐页精读（页2807）

  - id: dbe_profiler_system_tables
    type: metadata_oracle
    statement: "Profiling结果存储在系统表：PL_PROFILING_FUNCTIONS（函数信息）、PL_PROFILING_DETAILS（详细信息）、PL_PROFILING_CALLGRAPH（调用图）、PL_PROFILING_TRACKINFO（追踪信息）。普通用户仅具查询权限。"
    source_anchor: "3.12.2.14"
    status: confirmed
    verification_method: 逐页精读（页2806-2807）

  - id: dbe_profiler_usage_pattern
    type: behavior_oracle
    statement: "DBE_PROFILER使用流程：1.PL_START_PROFILING(run_id)开始 → 2.执行目标存储过程 → 3.事务提交后数据写入系统表 → 4.查询PL_PROFILING_*表分析 → 5.PL_CLEAR_PROFILING(run_id)清理。"
    source_anchor: "3.12.2.14 综合分析"
    status: confirmed
    verification_method: 综合接口定义分析

