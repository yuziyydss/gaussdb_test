facts:
- id: m_copy_wave8_108_overview
  type: syntax
  statement: "M兼容COPY命令实现在表和文件之间复制数据：COPY FROM从一个文件复制数据到一个表，COPY TO把一个表的数据复制到一个文件。"
  source_anchor: "2.4.2.8.5 功能描述 页2079"
  source_refs: &refmcopy
  - w8_108_2_4_2_8_5
  status: confirmed
- id: m_copy_wave8_108_permission
  type: environment
  statement: "COPY权限：enable_copy_server_files关闭时只允许初始用户执行COPY FROM FILENAME或COPY TO FILENAME；打开时允许具有SYSADMIN权限或继承内置角色gs_role_copy_files权限的用户执行，但默认禁止对数据库配置文件、密钥文件、证书文件和审计日志执行COPY FROM/TO FILENAME（防止越权查看修改敏感文件）；GUC参数safe_data_path设置导入导出路径白名单（默认生效，COPY路径必须为白名单子路径，参数为空时白名单不生效需谨慎，相对路径报错）；COPY只能用于表不能用于视图；COPY TO需表的SELECT权限，COPY FROM需INSERT权限。"
  source_anchor: "2.4.2.8.5 注意事项 页2079"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_fieldlist
  type: constraint
  statement: "COPY字段列表：声明字段列表时只在文件和表之间复制已声明字段的数据，表中有不在列表里的字段时COPY FROM为那些字段插入缺省值；生成列不能出现在指定列列表中，COPY TO未指定列列表时导出所有列除生成列，COPY FROM导入时生成列自动更新并像普通列一样保存；数据文件任意行包含比预期多或少字段时COPY FROM抛出错误。"
  source_anchor: "2.4.2.8.5 注意事项 页2079"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_stdin
  type: constraint
  statement: "STDIN输入：数据源文件须服务器可访问；STDIN时数据在客户前端和服务器之间流动，表的列与列之间使用TAB键分隔，新的一行中以反斜杠和句点（\\.）表示输入结束；从文件读取数据时结束标记不必要，客户端应用间复制数据必须有结束标记；COPY FROM中\\N为空字符串，输入实际值\\N时使用\\\\N；并行导入模式下不建议通过STDIN导入（客户端多线程竞争锁发送数据，可能导致部分线程事务提交失败造成数据仅部分导入且无法重试）。"
  source_anchor: "2.4.2.8.5 注意事项 页2079"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_preprocess
  type: constraint
  statement: "COPY FROM不支持在导入过程中对数据做预处理（如表达式运算、填充指定默认值等）；需要预处理时需先把数据导入临时表，再执行SQL语句通过运算插入表中（此方法会导致I/O膨胀降低导入性能）；COPY FROM遇数据格式错误时会回滚事务，但没有足够的错误信息，不方便从大量原始数据中定位错误数据；COPY FROM/TO适合低并发、本地小数据量导入导出。"
  source_anchor: "2.4.2.8.5 注意事项 页2079"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_env_notes
  type: constraint
  statement: "环境注意事项：COPY是服务端命令（执行环境和数据库服务端进程一致），\\COPY是客户端元命令（执行环境和客户端gsql一致）；云上环境使用数据库和gsql时COPY和\\COPY都使用云上路径，数据库在云上而gsql在非云上时COPY使用云上路径、\\COPY使用其他环境路径；导出float类型推荐extra_float_digits设为3避免有效位数丢失造成导入导出前后数据不一致；不建议在lower_case_table_names不同的数据库之间进行COPY FROM或COPY TO；含零字符（'\\0'）数据COPY时存在数据截断；\\copy命令审计查询detail_info时忽略大小写（SQL语句被转换，审计中展示COPY关键字）。"
  source_anchor: "2.4.2.8.5 注意事项 页2079-2080"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_syntax_forms
  type: syntax
  statement: "三种语法形式：COPY table_name [ ( column_name [, ...] ) ] [WITH OIDS] FROM { 'filename' | STDIN } [LOAD] [ LOAD_DISCARD 'discard_path'] [ LOAD_BAD 'bad_path'] [ LOG ERRORS | LOG ERRORS DATA ] [ REJECT LIMIT 'limit' ] [ [ WITH ] ( option [, ...] ) | copy_option ]（文件到表）；COPY table_name [...] TO { 'filename' | STDOUT } [LOAD]（表到文件）；COPY query TO { 'filename' | STDOUT }（query为必须用圆括弧包围的SELECT或VALUES命令）；copy_option与option语法不兼容。"
  source_anchor: "2.4.2.8.5 语法格式 页2080"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_options_list
  type: syntax
  statement: "option子句（兼容外表导入参数形式）：FORMAT 'format_name'/FORMAT binary、DELIMITER、NULL、QUOTE、HEADER [boolean]、USEEOF [boolean]、ESCAPE、FORCE_NOT_NULL ( column_name [, ...] )、FORCE_QUOTE { column_name [, ...] | * }、DATE_FORMAT、SMALLDATETIME_FORMAT、SKIP、LIMIT、SKIP_CONSTRAINT_ERRORS；copy_option子句（COPY原生参数形式）：NULL [ AS ]、FORCE_NOT_NULL、BINARY、CSV、QUOTE、ESCAPE [ AS ]、ENCODING 'encoding_name'、DELIMITER [ AS ]、ROWS 'string'、DATE_FORMAT、SMALLDATETIME_FORMAT、SKIP、STARTS begin_line_number、LIMIT、SKIP_CONSTRAINT_ERRORS、WHEN { ( start - end ) | column_name } { = | != } 'string'、SEQUENCE ( { column_name ( integer [, incr] ) [, ...] } )。"
  source_anchor: "2.4.2.8.5 语法格式 页2080-2081"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_load_params
  type: constraint
  statement: "LOAD区分COPY语法为gs_loader调用还是用户直接调用（非主动调用接口，不推荐使用）；LOAD_DISCARD 'discard_path'指定gs_loader客户端discard文件生成路径；LOAD_BAD 'bad_path'指定gs_loader客户端bad文件生成路径（均为非主动调用接口不推荐使用）。"
  source_anchor: "2.4.2.8.5 参数说明 页2081"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_log_errors
  type: constraint
  statement: "LOG ERRORS开启COPY FROM语句中数据类型错误的容错机制：仅捕捉数据库主节点上数据解析过程中相关的数据类型错误（DATA_EXCEPTION）；COPY已有容错选项（如IGNORE_EXTRA_DATA）开启时对应类型错误按已有方式处理不报异常，错误表不会有相应数据；默认不支持对约束冲突容错（需额外使用SKIP_CONSTRAINT_ERRORS），支持的约束冲突类型包括非空约束、条件约束、主键约束、唯一性约束及唯一性索引；该功能仅在集中式的M兼容模式下有效。"
  source_anchor: "2.4.2.8.5 参数说明 LOG ERRORS 页2081-2082"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_skip_constraint
  type: constraint
  statement: "SKIP_CONSTRAINT_ERRORS容错限制：表存在语句级触发器时遇到约束冲突暂无法处理（直接报错导入失败）；数据导入过程从批量插入变为单行插入，导入性能有所劣化；UB-Tree索引构建从批量构建变为单行构建性能有所劣化；行级触发器场景约束冲突通过子事务实现（占用更多内存并延长执行时间），建议单次COPY导入数据量不超过1GB；从低版本滚动升级到此版本时所有节点升级完成之前禁止使用COPY容错导入能力。"
  source_anchor: "2.4.2.8.5 参数说明 LOG ERRORS 说明 页2082"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_log_errors_data
  type: constraint
  statement: "LOG ERRORS DATA与LOG ERRORS的区别：LOG ERRORS DATA会填充容错表的rawrecord字段；只有super权限的用户才能使用LOG ERRORS DATA；使用时若错误内容过于复杂可能存在写入容错表失败风险导致任务失败；对ERRCODE_CHARACTER_NOT_IN_REPERTOIRE和ERRCODE_UNTRANSLATABLE_CHARACTER两种错误码不记录rawrecord字段；不支持BINARY格式的文件；低版本滚动升级所有节点完成之前禁止使用。"
  source_anchor: "2.4.2.8.5 参数说明 LOG ERRORS DATA 页2082"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_reject_limit
  type: constraint
  statement: "REJECT LIMIT 'limit'对COPY FROM容错机制设置数值上限（超过指定条数按原有机制报错），取值[1, 2147483647]的正整数或'unlimited'（无最大值限制）；须与LOG ERRORS或LOG ERRORS DATA共同使用才能开启容错机制：未指定容错选项但使用REJECT LIMIT会报错；指定容错选项但未显式指定REJECT LIMIT则默认不进行容错；按执行COPY FROM的数据库主节点上遇到的解析错误计数而非数据库节点的错误数量。"
  source_anchor: "2.4.2.8.5 参数说明 REJECT LIMIT 页2082"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_format
  type: constraint
  statement: "FORMAT数据源文件格式：CSV可有效处理数据列中的换行符但对一些特殊字符处理有欠缺；TEXT可有效处理特殊字符但无法正确处理数据列中的换行符；BINARY使所有数据被存储/读作二进制格式（比TEXT和CSV快但可移植性比较差）；缺省值TEXT。"
  source_anchor: "2.4.2.8.5 参数说明 FORMAT 页2083"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_delimiter
  type: constraint
  statement: "DELIMITER字段分隔符：不能是\\r和\\n；不能和null参数相同（CSV格式分隔符还不能和quote参数相同）；TEXT格式数据的分隔符不能包含小写字母、数字和特殊字符.\\；数据文件单行长度需<1GB，分隔符较长且数据列较多时会影响导出有效数据长度；推荐使用多字符（如'$^&'）和不可见字符（如0x07、0x08、0x1b）；支持多字符分隔符但不能超过10个字节；TEXT格式默认水平制表符（tab），CSV格式默认','。"
  source_anchor: "2.4.2.8.5 参数说明 DELIMITER 页2083"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_null_header
  type: constraint
  statement: "NULL指定空值表示：不能是\\r和\\n，最大为100个字符，不能和分隔符、quote参数相同；CSV格式下默认值是没有引号的空字符串，TEXT格式下默认值是\\n（copy_option原生NULL参数TEXT格式下默认\\N）；HEADER指定导出文件是否包含标题行（只能用于CSV格式文件）：导入时on则第一行识别为标题行忽略，导出时on需指定fileheader，off则不包含标题行；取值true/on、false/off，缺省false。"
  source_anchor: "2.4.2.8.5 参数说明 NULL/HEADER 页2083-2084"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_quote_escape
  type: constraint
  statement: "QUOTE [AS] 'quote_character'在CSV格式下指定封闭符（只能为单字节字符，缺省''）；ESCAPE指定CSV格式逃逸字符（只能为单字节字符，缺省''，与quote值相同时会被替换为'\\0'）；FORCE_NOT_NULL ( column_name [, ...] )在CSV COPY FROM模式下指定字段输入不能为空；DATE_FORMAT对DATE类型指定格式（不支持BINARY格式，会报cannot specify bulkload compatibility options in BINARY mode错误，仅对COPY FROM导入有效，DATE内建为TIMESTAMP的数据库可参考timestamp_format参数）。"
  source_anchor: "2.4.2.8.5 参数说明 QUOTE/ESCAPE/FORCE_NOT_NULL/DATE_FORMAT 页2084"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_skip_limit
  type: constraint
  statement: "行控制参数：SKIP int_number指定导入时跳过数据文件前int_number行（[0, 2147483647]，等价copy_option的SKIP）；LIMIT limit_line_number指定最多处理的行数（[1, 2147483647]）；STARTS begin_line_number取值[0, 2147483647]；SKIP_CONSTRAINT_ERRORS导入发生约束冲突时跳过错误继续导入剩余数据（跳过的错误信息可通过bad文件或gs_copy_error_log系统表查看）；WHEN { ( start - end ) | column_name } { = | != } 'string'；SEQUENCE ( { column_name ( integer [, incr] ) [, ...] } )。"
  source_anchor: "2.4.2.8.5 参数说明 页2084-2085"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_stdin_stdout
  type: syntax
  statement: "STDIN声明输入来自标准输入（列间TAB分隔，新行以反斜杠和句点\\.表示输入结束）；STDOUT声明输出打印到标准输出；query为其结果将被复制的SELECT或VALUES命令（必须用圆括弧包围）；table_name为已存在的表名（可有模式修饰）；column_name为可选待复制字段列表（未声明时使用所有字段）。"
  source_anchor: "2.4.2.8.5 参数说明 页2080-2081"
  source_refs: *refmcopy
  status: confirmed
- id: m_copy_wave8_108_examples
  type: behavior_oracle
  statement: "示例（m_db）：COPY tpcds.ship_mode TO '/home/omm/ds_ship_mode.dat'导出到文件；COPY tpcds.ship_mode TO STDOUT输出到标准输出；COPY tpcds.ship_mode TO STDOUT WITH (delimiter ',', encoding 'utf8')指定分隔符与编码；COPY tpcds.ship_mode TO STDOUT WITH (format 'CSV', force_quote(SM_SHIP_MODE_SK))指定CSV与封闭字段；COPY tpcds.ship_mode_t1 FROM STDIN与FROM '/home/omm/ds_ship_mode.dat'导入；FROM ... WITH(format 'text', delimiter E'\\t', ignore_extra_data 'true', noescaping 'true')指定TEXT格式参数。"
  source_anchor: "2.4.2.8.5 示例 页2086-2088"
  source_refs: *refmcopy
  status: confirmed
open_questions:
- id: m_copy_wave8_108_oq_runtime
  statement: "safe_data_path白名单与相对路径报错行为、SKIP_CONSTRAINT_ERRORS在大量约束冲突下的性能劣化边界、LOG ERRORS DATA写入容错表失败场景需授权环境实机验证。"
  status: open
