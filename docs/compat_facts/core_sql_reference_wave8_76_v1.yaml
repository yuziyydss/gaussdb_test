- id: impdp_pluggable_recover_wave8_76_resource
  type: behavior_oracle
  statement: "修复阶段前置：使用系统管理员连接postgres为导入执行阶段创建出的PDB分配资源计划指令——CALL resource_manager.create_pending_area()、CALL resource_manager.create_resource_plan_directive(pdb_name =>'my_pdb1', min_cpu => 4, max_dynamic_memory => '18022MB', max_shared_memory => '14745MB', io_limits=> 300, io_priority => 'High', max_connections => 880)、CALL resource_manager.submit_pending_area()；该接口是创建资源，是否成功与当前实例资源规格有关，遇到接口报错需根据错误描述调整参数后重新尝试。"
  source_anchor: "1.13.14.3 示例 页1735"
  source_refs: *refimpdppdbr
  status: confirmed
- id: impdp_pluggable_recover_wave8_76_example
  type: behavior_oracle
  statement: "资源分配并submit_pending_area后，ALTER PLUGGABLE DATABASE my_pdb1 OPEN开启PDB，连入pdb（\\c my_pdb1）执行IMPDP PLUGGABLE DATABASE RECOVER返回IMPDP PLUGGABLE DATABASE RECOVER。"
  source_anchor: "1.13.14.3 示例 页1735"
  source_refs: *refimpdppdbr
  status: confirmed
- id: impdp_pluggable_create_wave8_76_example
  type: behavior_oracle
  statement: "前置条件为完成PDB文件的导出：使用系统管理员连接postgres创建用户tom（CREATE USER TOM PASSWORD）后执行IMPDP PLUGGABLE DATABASE my_pdb1 CREATE SOURCE = '/data1/expdp/my_pdb' OWNER=tom，返回IMPDP PLUGGABLE DATABASE CREATE。"
  source_anchor: "1.13.14.2 示例 页1734"
  source_refs: *refimpdppdb
  status: confirmed
