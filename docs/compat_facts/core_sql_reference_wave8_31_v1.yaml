facts:
- id: grant_wave8_31_purpose_scenarios
  type: syntax
  statement: "GRANT对角色和用户授权，支持四类场景：系统权限授权、数据库对象权限授权、角色/用户权限授予其他角色/用户，以及ANY权限授权。"
  source_anchor: "1.13.13.2 页1721-1723"
  source_refs: &refb1
  - w8_31_1_13_13_2
  status: confirmed
- id: grant_wave8_31_system_permissions
  type: constraint
  statement: "系统权限包括SYSADMIN、CREATEDB、CREATEROLE、AUDITADMIN、MONADMIN、OPRADMIN、POLADMIN、INHERIT、REPLICATION和LOGIN等；一般通过CREATE/ALTER ROLE指定，SYSADMIN可通过GRANT/REVOKE ALL PRIVILEGE授予或撤销，系统权限不能通过ROLE/USER继承，也不能授予PUBLIC。"
  source_anchor: "1.13.13.2 页1721-1722"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_object_public
  type: syntax
  statement: "数据库对象GRANT将权限追加到已有权限上；PUBLIC是包含所有角色的隐含组，角色/用户拥有直接授权、所属角色权限和PUBLIC权限。WITH GRANT OPTION允许被授权者再授权他人，但不能赋予PUBLIC。"
  source_anchor: "1.13.13.2 页1722"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_public_defaults
  type: constraint
  statement: "默认不会授予PUBLIC表、表字段、序列、外部数据源、外部服务器、模式或表空间权限；默认授予PUBLIC数据库CONNECT和CREATE TEMP TABLE权限、函数EXECUTE权限、语言和数据类型USAGE权限。对象拥有者可撤销默认PUBLIC权限，初始默认权限可用ALTER DEFAULT PRIVILEGES修改。"
  source_anchor: "1.13.13.2 页1722"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_owner_privileges
  type: constraint
  statement: "对象所有者缺省拥有对象所有权限，可出于安全舍弃部分权限；但ALTER、DROP、COMMENT、INDEX、VACUUM以及对象的可再授予权限是所有者固有权限、隐式拥有。非所有者授权时：无指定权限立即失败；有部分权限则只授予其拥有授权选项的权限；无可用授权选项时GRANT ALL PRIVILEGES会警告，其他形式会对缺少授权选项的权限警告。"
  source_anchor: "1.13.13.2 页1722"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_role_admin
  type: syntax
  statement: "GRANT role TO role/user可把角色或用户权限集合授予其他角色/用户；WITH ADMIN OPTION允许被授权者再次授予或撤销由该角色继承的权限。三权分立关闭时系统管理员可管理非永久用户和运维管理员角色权限，安全管理员可管理非系统管理员、内置角色、永久用户和运维管理员角色权限。"
  source_anchor: "1.13.13.2 页1722与1725"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_any_scope
  type: constraint
  statement: "ANY权限只对授予该权限的数据库内对象有效，与原有权限互不影响，可通过角色继承，但不能授予PUBLIC，也不允许从PUBLIC回收。初始用户和三权分立关闭时的系统管理员可授予或撤销ANY权限。"
  source_anchor: "1.13.13.2 页1723与注意事项 页1723"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_any_ownership
  type: constraint
  statement: "使用CREATE ANY TABLE/FUNCTION/PACKAGE/TYPE/SEQUENCE/INDEX在同名模式下创建的对象属主是该模式所有者；CREATE ANY TRIGGER和CREATE ANY SYNONYM创建的对象属主为创建者。ANY权限列表覆盖表、序列、索引、函数、PACKAGE、类型、同义词和触发器的CREATE/ALTER/DROP/SELECT/INSERT/UPDATE/DELETE/TRUNCATE/EXECUTE等能力。"
  source_anchor: "1.13.13.2 注意事项/ANY权限 页1723、1729-1730"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_security_risks
  type: constraint
  statement: "需谨慎授予CREATE ANY FUNCTION/PACKAGE以避免DEFINER函数或PACKAGE权限提升；表权限可能通过ALTER默认值/约束表达式或索引表达式被利用；TRIGGER权限可能通过WHEN表达式被利用；GRANT ROLE TO ROLE也需要谨慎；应按业务使用角色或PUBLIC，避免权限授予过多用户。"
  source_anchor: "1.13.13.2 注意事项 页1723"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_pdb_database
  type: constraint
  statement: "在PDB内执行GRANT并指定ON DATABASE时，仅支持授予PDB自身的CREATE权限；不支持在Non-PDB中对PDB执行GRANT语句。"
  source_anchor: "1.13.13.2 注意事项 页1723"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_table_view
  type: syntax
  statement: "GRANT可对表或视图授予SELECT、INSERT、UPDATE、DELETE、TRUNCATE、REFERENCES、TRIGGER、ALTER、DROP、COMMENT、INDEX、VACUUM或ALL PRIVILEGES，支持TABLE、ALL TABLES IN SCHEMA，接收方可为[GROUP] role_name或PUBLIC，并可带WITH GRANT OPTION。"
  source_anchor: "1.13.13.2 语法 页1723"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_column_privileges
  type: syntax
  statement: "GRANT可按列授予SELECT、INSERT、UPDATE、REFERENCES和COMMENT，或ALL PRIVILEGES；拥有表访问权限时默认拥有所有字段访问权限，若仅授予某字段权限需先撤销所属表的访问权限。"
  source_anchor: "1.13.13.2 语法/说明 页1723"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_sequence
  type: syntax
  statement: "序列可授予SELECT、UPDATE、USAGE、ALTER、DROP、COMMENT或ALL PRIVILEGES；支持SEQUENCE、LARGE SEQUENCE和ALL SEQUENCES IN SCHEMA，LARGE字段属性可选且赋权语句不区分序列是否为LARGE。"
  source_anchor: "1.13.13.2 语法 页1723-1724"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_database
  type: syntax
  statement: "数据库可授予CREATE、CONNECT、TEMPORARY、TEMP、ALTER、DROP、COMMENT或ALL PRIVILEGES，支持多数据库和WITH GRANT OPTION。"
  source_anchor: "1.13.13.2 语法 页1724"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_domain_type_unsupported
  type: constraint
  statement: "语法中存在DOMAIN的USAGE/ALL PRIVILEGES和TYPE的USAGE、ALTER、DROP、COMMENT/ALL PRIVILEGES形式，但当前版本暂不支持赋予域和类型的访问权限。"
  source_anchor: "1.13.13.2 语法/说明 页1724-1725"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_encryption_keys
  type: syntax
  statement: "客户端加密主密钥CMK和列加密密钥CEK可授予USAGE、DROP或ALL PRIVILEGES，并可带WITH GRANT OPTION。"
  source_anchor: "1.13.13.2 语法 页1724"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_fdw_server
  type: syntax
  statement: "FOREIGN DATA WRAPPER可授予USAGE或ALL PRIVILEGES；FOREIGN SERVER可授予USAGE、ALTER、DROP、COMMENT或ALL PRIVILEGES。"
  source_anchor: "1.13.13.2 语法 页1724"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_function_procedure_language
  type: syntax
  statement: "函数和存储过程可授予EXECUTE、ALTER、DROP、COMMENT或ALL PRIVILEGES，函数支持ALL FUNCTIONS IN SCHEMA；过程语言可授予USAGE或ALL PRIVILEGES。"
  source_anchor: "1.13.13.2 语法 页1724-1725"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_schema_tablespace
  type: syntax
  statement: "模式可授予CREATE、USAGE、ALTER、DROP、COMMENT或ALL PRIVILEGES；访问模式内表/视图还需要该模式的USAGE权限。表空间可授予CREATE、ALTER、DROP、COMMENT或ALL PRIVILEGES。"
  source_anchor: "1.13.13.2 语法/说明 页1725"
  source_refs: *refb1
  status: confirmed
- id: grant_wave8_31_directory_package_dblink
  type: syntax
  statement: "DIRECTORY可授予READ、WRITE、ALTER、DROP或ALL PRIVILEGES；PACKAGE可授予EXECUTE、ALTER、DROP、COMMENT或ALL PRIVILEGES并支持ALL PACKAGES IN SCHEMA；DATABASE LINK可授予CREATE、ALTER、DROP [PUBLIC] DATABASE LINK。"
  source_anchor: "1.13.13.2 语法 页1725-1726"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: grant_wave8_31_oq_runtime
  statement: "GRANT在真实角色继承、ANY权限、PDB、加密对象、DATABASE LINK和PUBLIC默认权限组合下的权限判定与继承矩阵需授权环境实机验证。"
  status: open
