facts:
- id: b_dt_precision_integer_only
  type: constraint
  statement: B模式数据类型精度、标度、位数大小默认不支持浮点型数值定义，建议使用合法整型。
  source_anchor: 4.4.3.1.1
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3498）
- id: b_dt_int_truncation_silent
  type: behavior_oracle
  statement: 整数类型输入非法字符串部分被截断时（如'12@3'）直接截断无提示插表成功；全部截断或空串返回0。MySQL截断或返回0并报WARNING，严格模式插表失败。
  source_anchor: 4.4.3.1.1 整数类型公共差异
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3498）
- id: b_dt_int_no_type_promotion
  type: behavior_oracle
  statement: INT/INTEGER/SMALLINT/BIGINT运算时不向上提升类型，超范围报错；MySQL提升到BIGINT计算。
  source_anchor: 4.4.3.1.1 操作符
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3498）
- id: b_dt_bit_xor_operator
  type: syntax
  statement: GaussDB中^表示指数运算，异或需用#替换；MySQL中^为异或。|、&、~在类型BIT位中计算。
  source_anchor: 4.4.3.1.1 操作符
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3499）
- id: b_dt_negative_cast
  type: behavior_oracle
  statement: 负数显式类型转换：宽松模式结果为0，严格模式报错；MySQL按二进制最高位替换计算。
  source_anchor: 4.4.3.1.1 负数显式类型转换
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3499）
- id: b_dt_int_display_width
  type: behavior_oracle
  statement: INT[(M)]精度MySQL控制格式化输出，GaussDB仅语法支持不支持功能。不指定ZEROFILL时宽度信息不显示。
  source_anchor: 4.4.3.1.1 显示宽度
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3499）
- id: b_dt_aggregate_variance
  type: behavior_oracle
  statement: variance：GaussDB表示样本方差，MySQL表示总体方差；stddev：GaussDB样本标准差，MySQL总体标准差。
  source_anchor: 4.4.3.1.1 聚集函数
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3499）
- id: b_dt_bool_values
  type: syntax
  statement: B模式BOOL真值文本：TRUE/'t'/'true'/'y'/'yes'/'1'/true/'on'及非0数值；假值：FALSE/'f'/'false'/'n'/'no'/'0'/0/'off'。
  source_anchor: 4.4.3.1.1 表4-170
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3499）
