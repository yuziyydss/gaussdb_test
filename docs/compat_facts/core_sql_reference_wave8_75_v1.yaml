facts:
- id: execute_wave8_75_purpose
  type: syntax
  statement: "EXECUTE执行一个准备好的预备语句；因为预备语句只在会话的生命期里存在，所以预备语句必须是在当前会话中更早用PREPARE语句创建的。"
  source_anchor: "1.13.11.1 功能描述 页1705"
  source_refs: &refexec
  - w8_75_1_13_11_1
  status: confirmed
- id: execute_wave8_75_param_cache_notes
  type: constraint
  statement: "如果创建预备语句时PREPARE声明了一些参数，传递给EXECUTE的必须是兼容的参数集，否则会出现错误；未在预备语句声明中定义参数时，后续EXECUTE传入的任何合法参数绑定将被系统静默忽略；如果预备语句所依赖的表结构发生变化（如添加、删除或修改列定义），缓存计划中期望的结果结构可能与实际表结构不匹配，后续再执行该预备语句将导致非预期结果。"
  source_anchor: "1.13.11.1 注意事项 页1705-1706"
  source_refs: *refexec
  status: confirmed
- id: execute_wave8_75_syntax
  type: syntax
  statement: "语法为EXECUTE name [(parameter[, ...])]；name为要执行的预备语句的名称；parameter为给预备语句的参数的具体数值，必须是与创建预备语句时指定参数数据类型相兼容的值的表达式，不支持ROWNUM作为参数。"
  source_anchor: "1.13.11.1 语法格式/参数说明 页1706"
  source_refs: *refexec
  status: confirmed
- id: execute_wave8_75_example
  type: behavior_oracle
  statement: "示例中PREPARE insert_reason(int,varchar(10),varchar(10)) AS INSERT INTO reason VALUES($1,$2,$3)后EXECUTE insert_reason(52, 'AAAAAAAADD', 'reason 52')插入一行并查询确认（相关链接PREPARE、DEALLOCATE）。"
  source_anchor: "1.13.11.1 示例 页1706"
  source_refs: *refexec
  status: confirmed
- id: expdp_database_wave8_75_purpose
  type: syntax
  statement: "EXPDP DATABASE导出DATABASE的全部物理文件；语法为EXPDP DATABASE db_name LOCATION = 'directory'；db_name为导出的库名，directory为导出文件的存储目录。"
  source_anchor: "1.13.11.2 功能描述/语法格式/参数说明 页1706-1707"
  source_refs: &refexpdpdb
  - w8_75_1_13_11_2
  status: confirmed
- id: expdp_wave8_75_tool_only
  type: constraint
  statement: "EXPDP族语法用于细粒度备份恢复，由备份恢复工具调用，用户直接调用会报错：ERROR: Only auxdb is allowed to execute expdp cmd.。"
  source_anchor: "1.13.11.2/3/4 示例 页1707-1708"
  source_refs: &refexpdpall
  - w8_75_1_13_11_2
  - w8_75_1_13_11_3
  - w8_75_1_13_11_4
  status: confirmed
- id: expdp_pluggable_wave8_75_purpose
  type: syntax
  statement: "EXPDP PLUGGABLE DATABASE导出PDB的全部物理文件；语法为EXPDP PLUGGABLE DATABASE LOCATION = 'directory'；directory为导出文件的存储目录。"
  source_anchor: "1.13.11.3 功能描述/语法格式/参数说明 页1707"
  source_refs: &refexdpdb3
  - w8_75_1_13_11_3
  status: confirmed
- id: expdp_pluggable_wave8_75_example
  type: behavior_oracle
  statement: "示例前置条件为完成PDB的创建与打开：创建导出目录mkdir /data1/expdp/my_pdb后连入pdb（\\c my_pdb）执行EXPDP PLUGGABLE DATABASE LOCATION = '/data1/expdp/my_pdb'导出。"
  source_anchor: "1.13.11.3 示例 页1707"
  source_refs: *refexdpdb3
  status: confirmed
- id: expdp_table_wave8_75_purpose
  type: syntax
  statement: "EXPDP TABLE导出与表相关的索引、sequence、分区、toast、toast index等全部文件；语法为EXPDP TABLE table_name LOCATION = 'directory'；table_name为导出的表名，directory为导出文件的存储目录。"
  source_anchor: "1.13.11.4 功能描述/语法格式/参数说明 页1708"
  source_refs: &refexdptbl
  - w8_75_1_13_11_4
  status: confirmed
- id: fetch_wave8_75_purpose
  type: syntax
  statement: "FETCH通过已创建的游标来检索数据；每个游标都有一个供FETCH使用的关联位置，可以在查询结果第一行之前、结果中任意行或最后一行之后：游标刚创建完之后关联位置在第一行之前；抓取移动行之后关联位置在检索到的最后一行上；抓取完所有可用行停在最后一行后面（反向抓取时停在第一行前面）；FETCH ALL或FETCH BACKWARD ALL总是把关联位置放在最后一行或第一行前面。"
  source_anchor: "1.13.12.1 功能描述 页1718"
  source_refs: &reffetch
  - w8_75_1_13_12_1
  status: confirmed
- id: fetch_wave8_75_noscroll
  type: constraint
  statement: "如果游标定义了NO SCROLL，则不允许使用例如FETCH BACKWARD之类的反向抓取。"
  source_anchor: "1.13.12.1 注意事项 页1718"
  source_refs: *reffetch
  status: confirmed
- id: fetch_wave8_75_single_forms
  type: constraint
  statement: "NEXT、PRIOR、FIRST、LAST、ABSOLUTE和RELATIVE形式在恰当地移动游标之后抓取一条记录；如果后面没有数据行，就返回空结果，此时游标停在查询结果的最后一行之后（向后查询时）或第一行之前（向前查询时）。"
  source_anchor: "1.13.12.1 注意事项 页1718"
  source_refs: *reffetch
  status: confirmed
- id: fetch_wave8_75_forward_backward
  type: constraint
  statement: "FORWARD和BACKWARD形式在向前或向后移动过程中抓取指定的行数，然后把游标定位在最后返回的行上；如果count大于可用的行数，则会把游标定位在所有行之后（向后查询时）或之前（向前查询时）。"
  source_anchor: "1.13.12.1 注意事项 页1718"
  source_refs: *reffetch
  status: confirmed
- id: fetch_wave8_75_zero
  type: constraint
  statement: "RELATIVE 0、FORWARD 0和BACKWARD 0都要求在不移动游标的前提下抓取当前行（重新抓取最近刚抓取过的行）；除非游标定位在第一行之前或最后一行之后，否则这个动作都应该成功；而当游标定位在第一行之前或最后一行之后时，不返回任何行。"
  source_anchor: "1.13.12.1 注意事项 页1718"
  source_refs: *reffetch
  status: confirmed
- id: fetch_wave8_75_syntax
  type: syntax
  statement: "语法为FETCH [direction {FROM | IN}] cursor_name；direction为可选参数，取值NEXT | PRIOR | FIRST | LAST | ABSOLUTE count | RELATIVE count | count | ALL | FORWARD | FORWARD count | FORWARD ALL | BACKWARD | BACKWARD count | BACKWARD ALL。"
  source_anchor: "1.13.12.1 语法格式 页1718-1719"
  source_refs: *reffetch
  status: confirmed
- id: fetch_wave8_75_direction_basic
  type: constraint
  statement: "基础方向取值：NEXT（缺省）从当前关联位置抓取下一行；PRIOR抓取上一行；FIRST抓取查询第一行（和ABSOLUTE 1相同）；LAST抓取最后一行（和ABSOLUTE -1相同）；count抓取随后的count行（和FORWARD count一样）；ALL从当前关联位置抓取所有剩余行（和FORWARD ALL一样）；FORWARD抓取下一行（和NEXT一样）；FORWARD count从当前位置抓取随后或前面的count行；FORWARD ALL从当前位置抓取所有剩余行。"
  source_anchor: "1.13.12.1 参数说明 direction 页1719-1720"
  source_refs: *reffetch
  status: confirmed
- id: fetch_wave8_75_absolute_relative
  type: constraint
  statement: "ABSOLUTE count抓取查询中第count行（不会比用相对位移移动更快，下层实现必须遍历所有中间行；count为正数从第一行开始抓取第count行，负数从末尾抓取第abs(count)行，0定位在第一行之前；取值有符号整数）；RELATIVE count从当前关联位置抓取随后或前面的第count行（正数之后第count行，负数之前第abs(count)行；当前行没有数据时RELATIVE 0返回空）。"
  source_anchor: "1.13.12.1 参数说明 ABSOLUTE/RELATIVE 页1719-1720"
  source_refs: *reffetch
  status: confirmed
- id: fetch_wave8_75_backward
  type: constraint
  statement: "BACKWARD从当前关联位置抓取前面一行（和PRIOR一样）；BACKWARD count从当前关联位置抓取前面的count行（向后扫描：正数抓取当前位置之前的count行，负数抓取之后的abs(count)行，有数据时BACKWARD 0重新抓取当前行）；BACKWARD ALL从当前关联位置抓取所有前面的行（向后扫描）。"
  source_anchor: "1.13.12.1 参数说明 BACKWARD 页1720"
  source_refs: *reffetch
  status: confirmed
- id: fetch_wave8_75_cursor_name
  type: constraint
  statement: "{FROM | IN} cursor_name使用关键字FROM或IN指定游标名称；取值范围为已创建的游标的名称。"
  source_anchor: "1.13.12.1 参数说明 cursor_name 页1720"
  source_refs: *reffetch
  status: confirmed
- id: fetch_wave8_75_example
  type: behavior_oracle
  statement: "示例中START TRANSACTION后CURSOR cursor1 FOR SELECT * FROM test ORDER BY 1建游标，FETCH FORWARD 3 FROM cursor1返回c1/c2为1、2、3的三行，CLOSE cursor1后END提交事务（相关链接CLOSE、MOVE、CURSOR）。"
  source_anchor: "1.13.12.1 示例 页1720-1721"
  source_refs: *reffetch
  status: confirmed
open_questions:
- id: fetch_wave8_75_oq_runtime
  statement: "EXECUTE参数绑定与表结构变更场景、EXPDP族备份恢复工具联动和FETCH各direction在真实游标并发路径下的完整行为与错误矩阵需授权环境实机验证。"
  status: open
