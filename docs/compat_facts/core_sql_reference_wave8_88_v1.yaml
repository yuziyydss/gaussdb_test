facts:
- id: create_global_index_wave8_88_purpose
  type: constraint
  statement: "CREATE GLOBAL INDEX在指定的表上创建全局二级索引（Global Secondary Index，简称GSI）：允许用户定义与基表分布不一致的索引，从而实现基表非分布列查询单节点计划和基表非分布列上的UNIQUE/主键约束；当前形态不支持此功能。"
  source_anchor: "1.13.9.24 功能描述/说明 页1448"
  source_refs: &refgsi
  - w8_88_1_13_9_24
  status: confirmed
- id: create_group_wave8_88_purpose
  type: syntax
  statement: "CREATE GROUP创建一个新用户组；语法为CREATE GROUP group_name [[WITH] option [...]] [ENCRYPTED | UNENCRYPTED] {PASSWORD | IDENTIFIED BY} {'password' [EXPIRED] | DISABLE}。"
  source_anchor: "1.13.9.25 功能描述/语法格式 页1448"
  source_refs: &refgroup
  - w8_88_1_13_9_25
  status: confirmed
- id: create_group_wave8_88_alias_note
  type: constraint
  statement: "CREATE GROUP为CREATE ROLE的别名，非SQL标准语法，不推荐使用，建议用户直接使用CREATE ROLE。"
  source_anchor: "1.13.9.25 注意事项 页1448"
  source_refs: *refgroup
  status: confirmed
- id: create_group_wave8_88_options
  type: constraint
  statement: "可选项option子句包括：SYSADMIN/NOSYSADMIN、MONADMIN/NOMONADMIN、OPRADMIN/NOOPRADMIN、POLADMIN/NOPOLADMIN、AUDITADMIN/NOAUDITADMIN、CREATEDB/NOCREATEDB、USEFT/NOUSEFT、CREATEROLE/NOCREATEROLE、INHERIT/NOINHERIT、LOGIN/NOLOGIN、REPLICATION/NOREPLICATION、PERSISTENCE/NOPERSISTENCE、CONNECTION LIMIT connlimit、VALID BEGIN/VALID UNTIL 'timestamp'、RESOURCE POOL 'respool'、USER GROUP 'groupuser'、PERM SPACE/TEMP SPACE/SPILL SPACE、NODE GROUP logic_group_name、IN ROLE/IN GROUP/ROLE/ADMIN/USER role_name[, ...]、SYSID uid、DEFAULT TABLESPACE tablespace_name、PROFILE DEFAULT/PROFILE profile_name、PGUSER。"
  source_anchor: "1.13.9.25 语法格式 option 页1448-1449"
  source_refs: *refgroup
  status: confirmed
- id: create_group_wave8_88_params_ref
  type: constraint
  statement: "具体参数说明请参见CREATE ROLE章节中的参数说明。"
  source_anchor: "1.13.9.25 参数说明 页1451"
  source_refs: *refgroup
  status: confirmed
- id: create_group_wave8_88_example
  type: behavior_oracle
  statement: "示例：CREATE GROUP test_group WITH PASSWORD与CREATE ROLE效果一样（\\du显示Cannot login）；CREATE ROLE test_role默认不能登录数据库（可用ALTER ROLE role_name WITH LOGIN让用户登录）；CREATE USER test_user自动创建同名模式且有登录权限；清理DROP ROLE/DROP GROUP/DROP USER（相关链接ALTER GROUP、DROP GROUP、CREATE ROLE）。"
  source_anchor: "1.13.9.25 示例 页1451"
  source_refs: *refgroup
  status: confirmed
- id: create_incremental_mv_wave8_88_purpose
  type: syntax
  statement: "CREATE INCREMENTAL MATERIALIZED VIEW创建一个增量物化视图，可使用REFRESH MATERIALIZED VIEW（全量刷新）和REFRESH INCREMENTAL MATERIALIZED VIEW（增量刷新）刷新数据；语句与CREATE TABLE AS功能相似，但会持久化存储初始化查询语句从而支持后续刷新；物化视图具有与普通表相同的持久化属性，但不支持创建临时类型的物化视图；语法为CREATE INCREMENTAL MATERIALIZED VIEW mv_name [(column_name[, ...])] [TABLESPACE tablespace_name] AS query。"
  source_anchor: "1.13.9.26 功能描述/语法格式 页1451-1452"
  source_refs: &refcimv
  - w8_88_1_13_9_26
  status: confirmed
- id: create_incremental_mv_wave8_88_params
  type: constraint
  statement: "参数：mv_name为创建的物化视图的名称（可模式具体指定，字符串符合标识符命名规范）；column_name为新物化视图中的列名（支持指定列，需与查询语句结果的列数量保持一致；未指定则从查询的输出列名中获取）；TABLESPACE可选指定新建物化视图所属表空间（未声明使用默认表空间）；AS query为一个SELECT或者TABLE命令，该查询将在一个安全受限的操作中运行。"
  source_anchor: "1.13.9.26 参数说明 页1452"
  source_refs: *refcimv
  status: confirmed
- id: create_incremental_mv_wave8_88_limits_queries
  type: constraint
  statement: "查询限制：增量物化视图仅支持简单过滤查询和基表UNION ALL查询；创建时不支持WITH子句、GROUP BY子句、ORDER BY子句、LIMIT子句、WINDOW子句、DISTINCT算子、AGG算子，不支持除UNION ALL外的子查询。"
  source_anchor: "1.13.9.26 注意事项 页1452"
  source_refs: *refcimv
  status: confirmed
- id: create_incremental_mv_wave8_88_limits_tables
  type: constraint
  statement: "其他限制：不支持在DATABASE LINK表、临时表或全局临时表上创建增量物化视图；创建后基表中的绝大多数DDL操作不再支持；不支持对增量物化视图进行IUD操作；创建后当基表数据发生变化时，需要使用REFRESH命令保持物化视图与基表同步；Ustore引擎不支持物化视图的创建和使用。"
  source_anchor: "1.13.9.26 注意事项 页1452"
  source_refs: *refcimv
  status: confirmed
- id: create_incremental_mv_wave8_88_example
  type: behavior_oracle
  statement: "示例：创建表空间tbs_data1与ASTORE表my_table后CREATE INCREMENTAL MATERIALIZED VIEW my_imv (col1,col2) TABLESPACE tbs_data1 AS SELECT * FROM my_table；基表INSERT后未刷新查询为0 rows，REFRESH INCREMENTAL MATERIALIZED VIEW my_imv后查询到1行；DROP MATERIALIZED VIEW/DROP TABLE/DROP TABLESPACE清理（相关链接ALTER/CREATE MATERIALIZED VIEW等）。"
  source_anchor: "1.13.9.26 示例 页1452-1453"
  source_refs: *refcimv
  status: confirmed
- id: create_language_wave8_88_unsupported
  type: constraint
  statement: "CREATE LANGUAGE定义一种新的过程语言；当前形态暂不支持使用该语法。"
  source_anchor: "1.13.9.28 功能描述/注意事项 页1472"
  source_refs: &reflang
  - w8_88_1_13_9_28
  status: confirmed
- id: create_llm_wave8_88_purpose
  type: syntax
  statement: "CREATE LLM创建大模型服务。"
  source_anchor: "1.13.9.29 功能描述 页1472"
  source_refs: &refllm
  - w8_88_1_13_9_29
  status: confirmed
- id: create_llm_wave8_88_syntax
  type: syntax
  statement: "三种语法：CREATE LLM QUERY MODEL gs_model_name USING MODEL = 'remote_model_name', URL = 'https://example.com:443/path/to/api', API_KEY = 'api_key' [, SYSTEM_PROMPT = 'prompt_string'] [, EXTRA_PARAMS = '{JSON}']；CREATE LLM EMBED MODEL ...；CREATE LLM RERANK MODEL ...（参数形式相同）。"
  source_anchor: "1.13.9.29 语法格式 页1472-1473"
  source_refs: *refllm
  status: confirmed
- id: create_llm_wave8_88_prerequisites
  type: constraint
  statement: "注意事项：功能依赖于LLM/embedding/rerank模型服务正常运行；create llm命令需要拥有sysadmin的用户权限；QUERY MODEL中调用的大语言模型需通过兼容OpenAI开放API中v1/chat/completion API格式提供服务；EMBED MODEL需通过兼容OpenAI v1/embedding API格式提供服务；RERANK MODEL需通过兼容Jina AI开放API中/rerank API格式提供服务；创建服务时会对API KEY进行加密操作（复用OBS传输使用的密钥文件，不存在时需执行gs_guc generate -S xxxxx -D $GAUSSHOME/bin -o obsserver生成）；服务仅支持HTTPS协议，需用户配置系统可信的CA证书对服务端进行校验；当前版本不支持M兼容模式。"
  source_anchor: "1.13.9.29 注意事项 页1472"
  source_refs: *refllm
  status: confirmed
- id: create_llm_wave8_88_model_name
  type: constraint
  statement: "gs_model_name必选，为模型服务在GaussDB中的名称，该名称作为标识符在以后的语义函数中作为参数输入；不超过63字节，输入大小写不敏感，在系统中自动转写至小写字母存储；只支持数字、字母和下划线符号，且不能以数字开头，超过长度会自动截断。"
  source_anchor: "1.13.9.29 参数说明 gs_model_name 页1473"
  source_refs: *refllm
  status: confirmed
- id: create_llm_wave8_88_model_url_key
  type: constraint
  statement: "model必选，为外部模型服务中需要指定的模型名称，长度不超过64字节（OpenAI标准API的模型服务需在请求体中指定模型名）；url必选，模型服务的地址，不超过256字节；api_key必选，认证所需的API KEY，长度16到256字节（模型注册时指定API KEY，之后每次模型调用直接复用）。"
  source_anchor: "1.13.9.29 参数说明 model/url/api_key 页1473"
  source_refs: *refllm
  status: confirmed
- id: create_llm_wave8_88_system_prompt
  type: constraint
  statement: "system_prompt可选，为OpenAI v1/chat/completions API中输入的参数，对应给模型服务输入的系统提示词（代表给大模型提前输入的系统指令）；如果system_prompt长度超过大模型最大tokens范围则模型侧会拒绝服务并返回异常信息。"
  source_anchor: "1.13.9.29 参数说明 system_prompt 页1473"
  source_refs: *refllm
  status: confirmed
- id: create_llm_wave8_88_extra_params
  type: constraint
  statement: "extra_params可选，为其他需要透传到模型服务的参数（通过JSON字典的字符串格式输入）；数据库侧会校验json格式的合法性，除创建大语言模型时校验temperature和max_tokens的范围之外，其余参数会被直接透传到模型服务上（属于大模型参数范围则生效，否则忽略该参数），不合法参数会返回模型侧异常信息。"
  source_anchor: "1.13.9.29 参数说明 extra_params 页1473"
  source_refs: *refllm
  status: confirmed
- id: create_llm_wave8_88_example
  type: behavior_oracle
  statement: "示例创建三种模型服务：CREATE LLM RERANK MODEL mod_r using model = 'BAAI/bge-reranker-v2-m3', url = 'https://ip:port/v1/rerank'；CREATE LLM QUERY MODEL mod_q USING model = 'Qwen/Qwen2.5-7B-Instruct', url = 'https://ip:port/v1/chat/completions', api_key='api_key', extra_params='{\"max_tokens\": 5, \"temperature\": 0.1}'；CREATE LLM EMBED MODEL mod_e USING MODEL = 'Qwen/gte-Qwen2-1.5B-instruct', url = 'https://ip:port/v1/embeddings'。"
  source_anchor: "1.13.9.29 示例 页1473"
  source_refs: *refllm
  status: confirmed
open_questions:
- id: create_llm_wave8_88_oq_runtime
  statement: "GSI能力、用户组/增量物化视图操作及LLM三类模型服务注册在真实外部服务、HTTPS证书和资源规格组合下的完整行为与错误矩阵需授权环境实机验证。"
  status: open
