- id: stats_wave4_10_memory_profiling_options
  type: behavior_oracle
  statement: "gs_memory_profiling(option)用于生成当前进程jeprof报告：0关闭内存采集并返回memory profiling closed；1开启采集并返回memory profiling opened；2在开启采集时收集调用并生成报告，报告位于mem_log目录且命名格式为jeprof-YYYY-mm-dd_HHMMSS，返回dump succeeded；其他输入返回提示只能输入0、1或2。"
  source_anchor: "1.6.29 页899-900"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_10_memory_profiling_boundary
  type: constraint
  statement: "gs_memory_profiling仅SYSADMIN可使用；开启内存采集会影响性能，仅推荐在分析内存问题的非性能敏感场景使用；jeprof报告可通过jeprof --show_bytes和-pdf参数转换为PDF。"
  source_anchor: "1.6.29 页900"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_10_jemalloc_info_details
  type: syntax
  statement: "gs_jemalloc_info_details()统计jemalloc关键字段并生成jemalloc stat报告；报告位于mem_log目录，命名为memory_stat_report-YY-mm-dd_HHMMSS.log；输出nodename、memorytype和memorymbytes。"
  source_anchor: "1.6.29 页900"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_10_jemalloc_info_boundary
  type: constraint
  statement: "gs_jemalloc_info_details仅SYSADMIN权限用户可以使用；memorymbytes表示对应字段下虚拟内存大小，单位MB。"
  source_anchor: "1.6.29 页900"
  source_refs: *id001
  status: confirmed
