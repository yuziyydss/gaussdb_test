facts:
- id: ctas_wave8_33_purpose_semantics
  type: syntax
  statement: "CREATE TABLE AS根据SELECT结果创建表并写入第一次查询结果；新表字段名和类型与SELECT输出相关，可用字段名列表覆盖输出字段名。它不同于视图：CTAS创建的新表不会随后续源表变化而变化，视图每次查询会重新计算定义SELECT。"
  source_anchor: "1.13.9.49 页1558"
  source_refs: &refb1
  - w8_33_1_13_9_49
  status: confirmed
- id: ctas_wave8_33_inheritance_limits
  type: constraint
  statement: "CREATE TABLE AS创建的新表只继承SELECT输出字段的名称和数据类型；分区表不能采用CREATE TABLE AS创建。"
  source_anchor: "1.13.9.49 注意事项 页1558"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_failure_disk
  type: environment
  statement: "建表过程中数据库系统故障后，系统恢复时可能无法自动清除已创建的非0大小磁盘文件；该情况概率低且不影响数据库系统正常运行。"
  source_anchor: "1.13.9.49 注意事项 页1558"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_ilm_expr
  type: constraint
  statement: "为CREATE TABLE AS增加或变更ILM策略时，行级表达式ON (EXPR)只支持白名单函数；部分函数输出可能受兼容参数影响。"
  source_anchor: "1.13.9.49 注意事项 页1558"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_main_syntax
  type: syntax
  statement: "CREATE TABLE AS支持GLOBAL/LOCAL TEMPORARY/TEMP、UNLOGGED、IF NOT EXISTS、字段名列表、ENGINE、WITH存储参数、ON COMMIT、ILM压缩策略、TABLESPACE，最后以AS query和[WITH [NO] DATA]结束。"
  source_anchor: "1.13.9.49 语法格式 页1558-1559"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_unlogged
  type: constraint
  statement: "UNLOGGED表写入不进入WAL，速度快于普通表，但在冲突、操作系统或数据库重启、主备切换、断电或异常关机后数据全部清空，且不复制到备机，非日志表中索引也不会自动记录；异常关机导致索引数据丢失后需重建索引。"
  source_anchor: "1.13.9.49 UNLOGGED 页1558-1559"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_temp_types
  type: syntax
  statement: "TEMP/TEMPORARY创建临时表；GLOBAL创建全局临时表，缺省GLOBAL/LOCAL时创建本地临时表。全局临时表元数据对所有会话可见但用户数据、索引和统计信息按会话隔离；本地临时表只对当前会话可见，会话结束后自动删除。"
  source_anchor: "1.13.9.49 GLOBAL|LOCAL/TEMPORARY 页1559"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_temp_modes
  type: syntax
  statement: "全局临时表支持ON COMMIT PRESERVE ROWS会话级和ON COMMIT DELETE ROWS事务级；未指定ON COMMIT时缺省会话级，且全局临时表可指定非pg_temp开头Schema。"
  source_anchor: "1.13.9.49 TEMPORARY 页1559"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_pg_temp_schema
  type: constraint
  statement: "不指定TEMPORARY/TEMP但把表Schema指定为当前会话pg_temp开头Schema时，该表会被创建为临时表；不建议手动删除pg_temp或pg_toast_temp开头Schema。"
  source_anchor: "1.13.9.49 TEMPORARY须知 页1559-1560"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_global_temp_ddl
  type: constraint
  statement: "存在会话正在使用全局临时表或索引时，禁止ALTER/DROP全局临时表和索引；全局临时表的TRUNCATE、REINDEX、ANALYZE等DDL只影响当前会话的用户数据和索引。"
  source_anchor: "1.13.9.49 TEMPORARY须知 页1560"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_names
  type: syntax
  statement: "IF NOT EXISTS遇到同名relation时不新建并返回NOTICE，未指定时同名relation返回ERROR；column_name可选，未指定时新表字段名与SELECT输入字段名一致。"
  source_anchor: "1.13.9.49 IF NOT EXISTS/column_name 页1560"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_engine
  type: constraint
  statement: "ENGINE仅在B模式支持，仅语法适配，只支持设置InnoDB且无实际效果。"
  source_anchor: "1.13.9.49 ENGINE 页1560"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_storage_params
  type: syntax
  statement: "WITH可设置存储参数，并支持透明加密相关参数enable_tde、encrypt_algo、dek_cipher、key_type和cmk_id；详细参数语义参见CREATE TABLE章节。"
  source_anchor: "1.13.9.49 WITH存储参数 页1560"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_fillfactor
  type: syntax
  statement: "FILLFACTOR为10到100的百分比；UStore默认92，AStore默认100。较小值保留页内空间用于UPDATE同页放置新版本，频繁更新表可设较小值，从不更新表建议100。"
  source_anchor: "1.13.9.49 FILLFACTOR 页1560"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_autovacuum
  type: syntax
  statement: "WITH支持autovacuum_enabled、autovacuum_vacuum/analyze_threshold、autovacuum_vacuum/analyze_scale_factor、autovacuum_freeze_min_age、autovacuum_freeze_max_age、autovacuum_freeze_table_age和vacuum_truncate；未指定时默认继承对应GUC参数。"
  source_anchor: "1.13.9.49 autovacuum参数 页1560-1562"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_hasrowid
  type: constraint
  statement: "hasrowid=on会增加rowid和rowno系统列，并在rowno上关联创建序列和索引，默认off；仅A兼容模式支持，不支持本地临时表、UNLOGGED表和全局临时表，也不能与hasuids或oids同时指定，开启后不支持普通列名为rowno/rowid。"
  source_anchor: "1.13.9.49 hasrowid 页1561-1562"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_on_commit
  type: syntax
  statement: "ON COMMIT仅支持PRESERVE ROWS和DELETE ROWS；PRESERVE ROWS为缺省，提交时临时表及数据保持不变，DELETE ROWS在提交时删除临时表数据。"
  source_anchor: "1.13.9.49 ON COMMIT 页1562"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_ilm
  type: syntax
  statement: "ILM ADD POLICY ROW STORE COMPRESS支持ADVANCED、TURBO或NONE；ADVANCED只支持day/month/year且不支持hour，TURBO支持hour/day/month/year；压缩级别缺省MEDIUM。"
  source_anchor: "1.13.9.49 ILM 页1562"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_tablespace_query
  type: syntax
  statement: "TABLESPACE指定新表所在表空间，缺省使用默认表空间；AS query可为SELECT、VALUES命令，或运行预准备SELECT/VALUES查询的EXECUTE命令。使用WITH [NO] DATA控制是否插入查询数据，缺省插入，NO表示不插入。"
  source_anchor: "1.13.9.49 TABLESPACE/AS query/WITH DATA 页1562-1563"
  source_refs: *refb1
  status: confirmed
- id: ctas_wave8_33_type_conversion
  type: constraint
  statement: "使用CREATE TABLE AS SELECT进行数据类型转换时建议显式转换，避免隐式转换意外；M兼容模式下当<>两侧类型不同时，CTAS SELECT与SELECT的datetime隐式转换行为可能不一致，两侧类型相同时行为一致。"
  source_anchor: "1.13.9.49 AS query须知/示例 页1562-1563"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: ctas_wave8_33_oq_runtime
  statement: "CREATE TABLE AS在真实数据规模、临时表、TDE、ILM压缩、类型转换和WITH [NO] DATA组合下的建表结果与性能矩阵需授权环境实机验证。"
  status: open
