facts:
- id: m_dt_wave8_124_adddate
  type: syntax
  statement: "M兼容ADDDATE(date, INTERVAL expr unit)在指定日期上添加一段时间间隔并返回计算结果（功能用法与DATE_ADD函数相同）；ADDDATE(date, days)将days指定的天数与date相加（expr/days可以是负值，返回值类型TEXT、DATE、DATETIME或TIME）；unit时间间隔单位包括YEAR、QUARTER、MONTH、WEEK、DAY、HOUR、MINUTE、SECOND、MICROSECOND等；示例SELECT ADDDATE('2018-05-01', INTERVAL 1 DAY)返回2018-05-02。"
  source_anchor: "2.5.8 ADDDATE 页2365-2366"
  source_refs: &refmdt
  - w8_124_2_5_8
  status: confirmed
- id: m_dt_wave8_124_addtime
  type: syntax
  statement: "M兼容ADDTIME(expr1, expr2)返回时间或时间日期表达式expr1与时间表达式expr2相加后的值（返回值的格式与expr1保持一致）。"
  source_anchor: "2.5.8 ADDTIME 页2366-2367"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_convert_curdate
  type: syntax
  statement: "M兼容CONVERT_TZ(dt, from_tz, to_tz)进行时区转换；CURDATE()返回当前日期；DATE(expr)提取日期部分。"
  source_anchor: "2.5.8 CONVERT_TZ/CURDATE/DATE 页2367"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_datediff
  type: syntax
  statement: "M兼容DATEDIFF(date1, date2)返回两个日期相差的天数；CURTIME([scale])返回当前时间（scale表示微秒部分的精度）。"
  source_anchor: "2.5.8 CURTIME/DATEDIFF 页2367-2368"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_date_add_sub
  type: syntax
  statement: "M兼容DATE_ADD(date, INTERVAL expr unit)与DATE_SUB(date, INTERVAL expr unit)分别进行时间间隔的加法和减法计算（expr为时间间隔可以是负值，unit为时间间隔单位：YEAR、QUARTER、MONTH、WEEK、DAY、HOUR、MINUTE、SECOND、MICROSECOND等，详见时间间隔表达式）。"
  source_anchor: "2.5.8 DATE_ADD/DATE_SUB 页2368-2369"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_date_format
  type: syntax
  statement: "M兼容DATE_FORMAT(date, format)将日期时间以指定格式输出（返回值类型TEXT）；表2-49格式化字符串全集：%a星期缩写（Sun..Sat）、%b月份缩写（Jan..Dec）、%c月份数字（0..12）、%D带英语前缀的每天（0th/1st/2nd/3rd…）、%d每天两位数字（00..31）、%e每天数字（0..31）、%f微秒（000000..999999）、%H小时（00..23）、%h和%I小时（01..12）、%i分钟（00..59）、%j一年中的每天（001..366）、%k小时（0..23）、%l小时（1..12）、%M月份名称（January..December）、%m两位数字月份（00..12）、%p AM或PM、%r十二小时制时间（hh:mm:ss后跟AM或PM）、%S和%s秒（00..59）、%T二十四小时制时间（hh:mm:ss）、%U和%u一年中的星期（00..53，每周开始分别为星期天/星期一）、%V和%v一年中的星期（01..53，每周开始分别为星期天/星期一）、%W星期名称（Sunday..Saturday）、%w星期中的每天（0=星期天..6=星期六）、%X和%x四位数字年份用于%V/%v、%Y四位数字年份、%y两位数字年份、%%文字字符%、%x任意x；示例SELECT DATE_FORMAT('2023-10-11 12:13:14.151617','%b %c %M %m')返回Oct 10 October 10。"
  source_anchor: "2.5.8 DATE_FORMAT 表2-49 页2369-2372"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_day_funcs
  type: constraint
  statement: "M兼容日期函数：DAY(date)与DAYOFMONTH(date)返回月份中的第几天；DAYNAME(date)返回星期名称；DAYOFWEEK(date)返回一周中的第几天；DAYOFYEAR(date)返回一年中的第几天；LAST_DAY(date)返回该月份的最后一天。"
  source_anchor: "2.5.8 DAY/DAYNAME/DAYOFMONTH/DAYOFWEEK/DAYOFYEAR/LAST_DAY 页2368-2373"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_extract
  type: syntax
  statement: "M兼容EXTRACT(unit FROM date)用于提取日期时间中的指定部分（unit为时间间隔单位）。"
  source_anchor: "2.5.8 EXTRACT 页2369"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_from_funcs
  type: syntax
  statement: "M兼容FROM_DAYS(days)将天数转换为日期；FROM_UNIXTIME(unix_timestamp[, format])将Unix时间戳转换为日期时间格式（Unix时间戳指从1970年1月1日 08:00:00 UTC到指定时间的秒数；format返回指定格式的日期时间字符串参考DATE_FORMAT函数；返回值类型TEXT/DATETIME）；示例SELECT FROM_UNIXTIME(1111885200)返回2005-03-27 09:00:00、SELECT FROM_UNIXTIME(1447430881, '%Y %D %M %h:%i:%s %x')返回2015 14th November 12:08:01 2015。"
  source_anchor: "2.5.8 FROM_DAYS/FROM_UNIXTIME 页2369-2376"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_get_format
  type: syntax
  statement: "M兼容GET_FORMAT({DATE | TIME | DATETIME | TIMESTAMP}, {'EUR' | 'USA' | 'JIS' | 'ISO' | 'INTERNAL'})返回指定格式的字符串，即不同地区的\"年月日 时分秒\"格式和排序标准（第一参数为时间类型关键字，第二参数为五种时间格式TEXT类型；返回值类型TEXT）。"
  source_anchor: "2.5.8 GET_FORMAT 页2376"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_hour_minute
  type: constraint
  statement: "M兼容时间部分提取函数：HOUR(expr)返回小时、MINUTE(expr)返回分钟、SECOND(expr)返回秒、MICROSECOND(expr)返回微秒。"
  source_anchor: "2.5.8 HOUR/MINUTE/SECOND/MICROSECOND 页2376-2377"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_make_funcs
  type: syntax
  statement: "M兼容MAKEDATE(year, dayofyear)根据年份和一年中的天数生成日期；MAKETIME(hour, minute, second)根据小时、分钟、秒生成时间。"
  source_anchor: "2.5.8 MAKEDATE/MAKETIME 页2377"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_now_sysdate
  type: constraint
  statement: "M兼容NOW([scale])返回本地函数调用开始时刻的日期时间（受时区设置影响，scale表示微秒部分精度有效值0到6默认0，示例SELECT NOW(6)返回2023-12-11 09:46:58.404811）；SYSDATE([precision])返回函数执行时刻的系统日期和时间（与NOW有差异）；LOCALTIME和LOCALTIMESTAMP是NOW的别名。"
  source_anchor: "2.5.8 NOW/SYSDATE 页2377-2384"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_period_quarter
  type: syntax
  statement: "M兼容PERIOD_ADD(period, month_number)在指定格式日期上添加指定月数并按YYYYMM格式返回（period使用YYYYMM或YYMM格式表示的日期，month_number允许为负数，返回值类型BIGINT）；PERIOD_DIFF(P1, P2)返回两个期间相差的月数；QUARTER(date)返回日期所在的季度。"
  source_anchor: "2.5.8 PERIOD_ADD/PERIOD_DIFF/QUARTER 页2377-2378"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_sec_time_funcs
  type: syntax
  statement: "M兼容SECOND(expr)返回秒、SEC_TO_TIME(seconds)将秒转换为时间格式、TIME(expr)提取时间部分、TIMEDIFF(date1, date2)返回两个时间的时间差、TIME_TO_SEC(time)将时间转换为秒、TO_DAYS(date)将日期转换为距离的天数、TO_SECONDS(expr)将日期时间转换为秒数。"
  source_anchor: "2.5.8 SECOND/SEC_TO_TIME/TIME/TIMEDIFF/TIME_TO_SEC/TO_DAYS/TO_SECONDS 页2378-2379"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_timestampadd_diff
  type: syntax
  statement: "M兼容TIMESTAMPADD(unit, interval, datetime_expr)返回一个新的日期时间（将unit的多个interval添加到datetime_expr计算得到；unit为时间间隔单位YEAR、QUARTER、MONTH、WEEK、DAY、HOUR、MINUTE、SECOND、MICROSECOND等；返回值类型TEXT、DATE、DATETIME或TIME）；TIMESTAMPDIFF(unit, date1, date2)返回两个日期时间之间的时间差；TIME_FORMAT(time, format)根据格式说明符format格式化time入参。"
  source_anchor: "2.5.8 TIMESTAMPADD/TIMESTAMPDIFF/TIME_FORMAT 页2379-2381"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_unix_timestamp
  type: syntax
  statement: "M兼容UNIX_TIMESTAMP([date])：不指定date参数时返回当前时间距离\"1970-01-01 00:00:00\"的秒数（受时区参数设置影响）；指定date参数时返回指定时间距离\"1970-01-01 00:00:00\"的秒数（受时区参数设置影响）；返回值类型DECIMAL/BIGINT（当入参存在小数部分或入参为非法的时间类型字符串时返回DECIMAL否则返回BIGINT）；示例SELECT UNIX_TIMESTAMP('2022-12-22')返回1671638400。"
  source_anchor: "2.5.8 UNIX_TIMESTAMP 页2383-2384"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_week_funcs
  type: constraint
  statement: "M兼容WEEK(date[, mode])返回日期的周数（周数根据ISO 8601:1988计算，一月份的前几天可能是前一年的第52或53周，十二月份的后几天可能是下一年的第1周；省略mode参数时使用系统变量default_week_format的值默认0）；表2-50 mode参数取值：mode 0（周日为一周第一天，返回0~53，第一个有周日的周）、1（周一，0~53，第一个有4天及以上的周）、2（周日，1~53，第一个有周日的周）、3（周一，1~53，第一个有4天及以上的周）、4（周日，0~53，第一个有4天及以上的周）、5（周一，0~53，第一个有周一的周）、6（周日，1~53，第一个有4天及以上的周）、7（周一，1~53，第一个有周一的周）；WEEKDAY(date)返回工作日索引；WEEKOFYEAR(date)返回一年中的周数；YEAR(date)返回年份；YEARWEEK(date[, mode])返回年份和周数。"
  source_anchor: "2.5.8 WEEK 表2-50/WEEKDAY/WEEKOFYEAR/YEAR/YEARWEEK 页2384-2392"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_week_example
  type: behavior_oracle
  statement: "示例（m_db）：SELECT WEEK('2000-01-01')返回周数（返回值类型BIGINT）。"
  source_anchor: "2.5.8 WEEK 示例 页2391"
  source_refs: *refmdt
  status: confirmed
- id: m_dt_wave8_124_refmct_note
  type: constraint
  statement: "M兼容日期时间函数中NOW返回本地函数调用开始时刻的日期时间（受时区设置影响），SYSDATE返回函数执行时刻的系统日期时间——两者在长事务或语句执行延迟场景下取值可能不同；FROM_UNIXTIME的Unix时间戳基准为1970年1月1日08:00:00 UTC（东八区）。"
  source_anchor: "2.5.8 NOW/SYSDATE/FROM_UNIXTIME 页2377,2376"
  source_refs: *refmdt
  status: confirmed
