  statement: "角色密码失效后的查询阻断行为矩阵、IN DATABASE会话参数跨库生效、KILL SESSION对长事务回滚的实际耗时、资源计划切换对运行中PDB负载的影响在授权环境下的完整行为与错误矩阵需实机验证。"
  status: open
