  statement: "UNION示例基线（m_db）：CREATE TABLE test_union1 (union_col1 INT)与test_union2 (union_col2 CHAR(5))各插入123后SELECT union_col1 FROM test_union1 UNION SELECT union_col2 FROM test_union2去重返回1行；UNION ALL返回2行（123、123）；非列值UNION应用SELECT '234' FROM test_union1 UNION SELECT '234'。"
