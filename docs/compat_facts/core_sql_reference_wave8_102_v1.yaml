facts:
- id: mcompat_sql_intro_wave8_102_overview
  type: syntax
  statement: "SQL是用于访问和处理数据库的标准计算机语言，提供各种任务的语句包括：查询数据；在表中插入、更新和删除行；创建、替换、更改和删除对象；控制对数据库及其对象的访问；保证数据库的一致性和完整性；SQL语言由处理数据库和数据库对象的命令和函数组成，并强制实施有关数据类型、表达式和文本使用的规则，因此SQL参考-M-Compatibility兼容模式章节除SQL语法参考外还包含数据类型、表达式、函数和操作符等信息。"
  source_anchor: "2.1 什么是SQL 页1962"
  source_refs: &refintro
  - w8_102_2_1
  status: confirmed
- id: mcompat_sql_intro_wave8_102_history
  type: constraint
  statement: "SQL发展简史：1986年ANSI X3.135-1986/ISO 9075:1986（SQL-86）、1989年SQL-89、1992年SQL-92、1999年SQL:1999、2003年SQL:2003、2011年SQL:2011、2016年SQL:2016、2019年SQL:2019；GaussDB默认支持SQL:2016的大部分特性。"
  source_anchor: "2.1 SQL发展简史/GaussDB支持的SQL标准 页1962-1963"
  source_refs: *refintro
  status: confirmed
- id: mcompat_keywords_wave8_102_categories
  type: constraint
  statement: "SQL关键字分保留关键字和非保留关键字：保留关键字绝不能用作其他标识符；非保留关键字只在特定环境有特殊含义，其他环境可作标识符；M-Compatibility在此基础上细化为四类：保留（一般的保留关键字，不可作为任何数据库对象（表、列、函数、类型、视图、索引以及变量等）的标识符）、非保留（一般的非保留关键字，可作为任何数据库对象的标识符）、保留（可以是函数或类型）（可用作函数和变量的标识符）、非保留（不能是函数或类型）（不能被用作函数和变量的标识符）。"
  source_anchor: "2.2 关键字 页1963"
  source_refs: &refkw
  - w8_102_2_2
  status: confirmed
- id: mcompat_keywords_wave8_102_var_limits
  type: constraint
  statement: "\"非保留\"关键字作为数据库对象标识符时的限制：不带反引号的BEGIN、BY、CLOSE、COMPILE、CURSOR、DECLARE、DELETE、EXECUTE、FUNCTION、IF、IMMEDIATE、INSERT、LOOP、MOVE、OF、REF、RELEASE、RETURN、SAVEPOINT、STRICT、TYPE以及UPDATE等关键字不支持作为变量名使用。"
  source_anchor: "2.2 关键字 须知 页1963"
  source_refs: *refkw
  status: confirmed
- id: mcompat_keywords_wave8_102_alias_limits
  type: constraint
  statement: "保留关键字以及以下关键字不能直接作为列别名使用（类似SELECT 1 BIGINT的用法会导致错误）：BETWEEN、BIGINT、BLOB、CHAR、CHARACTER、CROSS、DEC、DECIMAL、DIV、DOUBLE、EXISTS、FLOAT、FLOAT4、FLOAT8、GROUPING、INNER、INOUT、INT、INT1~INT8、INTEGER、JOIN、LEFT、LIKE、LONGBLOB、LONGTEXT、MEDIUMBLOB、MEDIUMINT、MEDIUMTEXT、MOD、NATURAL、NUMERIC、OUT、OUTER、PRECISION、REAL、RIGHT、ROW、ROW_NUMBER、SIGNED、SMALLINT、SOUNDS、TINYBLOB、TINYINT、TINYTEXT、VALUES、VARCHAR、VARYING、WITHOUT。"
  source_anchor: "2.2 关键字 须知 页1963"
  source_refs: *refkw
  status: confirmed
- id: mcompat_keywords_wave8_102_table
  type: constraint
  statement: "表2-1 SQL关键字列出关键字及其类型分类（保留/非保留/保留（可以是函数或类型）/非保留（不能是函数或类型）），例如ABSOLUTE为非保留、ACCESSIBLE为保留、ACCOUNT/ACTION/ACTIVE/ADD/ADDDATE/ADMIN等为非保留。"
  source_anchor: "2.2 表2-1 SQL关键字 页1963-1992"
  source_refs: *refkw
  status: confirmed
- id: mcompat_charset_wave8_102_overview
  type: constraint
  statement: "字符集（Character Set）是字符的编码规则，字符序（Collation）是字符的排序规则，相关规则和语法仅在M-Compatibility下支持；要求：每一个字符集都有一个或多个字符序且只有一个默认字符序；每一个字符序仅有一个相关联的字符集；相同数据使用不同字符序排序结果可能不同；utf8mb4与utf8为同一字符集；建议表字段和server_encoding选择相同字符集避免转码带来的性能损耗。"
  source_anchor: "2.3 字符集与字符序 页1992"
  source_refs: &refcs
  - w8_102_2_3
  status: confirmed
- id: mcompat_charset_wave8_102_functions
  type: constraint
  statement: "M-Compatibility字符集和字符序支持功能：支持多种字符集存储字符串；支持使用字符序比较字符串；支持数据库级、模式级、表级、字段级字符集和字符序；除SQL_ASCII库外，其他字符集的数据库支持多字符集混用。"
  source_anchor: "2.3 字符集与字符序 页1992-1993"
  source_refs: *refcs
  status: confirmed
- id: mcompat_charset_wave8_102_charsets
  type: constraint
  statement: "M-Compatibility支持的字符集（表2-2）：utf8（针对Unicode的可变长度字符编码，1~4字节，默认字符序utf8mb4_general_ci）、utf8mb4（与utf8为同一字符集，utf8mb4_general_ci）、gbk（国标汉字编码扩展字符集，gbk_chinese_ci）、gb18030（gb18030_chinese_ci）、binary（二进制伪字符集，binary）、latin1（latin1_swedish_ci）、gb18030_2022（gb18030最新标准，gb18030_2022_chinese_ci）；当前数据库级、模式级、表级和字段级语法仅支持指定上述字符集。"
  source_anchor: "2.3 表2-2 字符集列表 页1993"
  source_refs: *refcs
  status: confirmed
- id: mcompat_charset_wave8_102_notes
  type: constraint
  statement: "字符集注意事项：binary字符集实际通过已有字符集SQL_ASCII实现；GaussDB字符集间转换逻辑与mysql存在差异，可能存在特殊字符在M-Compatibility下可转换而mysql下转换失败，不建议使用生僻特殊字符；GaussDB对不属于当前字符集的非法字符未执行严格的编码逻辑校验，可能导致非法字符成功输入；字符集名称的输入支持仅字母与数字匹配（如gb180302022能正常识别为gb18030_2022）；由于binary字符集与其他字符集不进行编码转换，使用binary字符集时建议仅输入ASCII范围内的字符。"
  source_anchor: "2.3 表2-2 说明 页1993"
  source_refs: *refcs
  status: confirmed
- id: mcompat_charset_wave8_102_collations
  type: constraint
  statement: "M-Compatibility支持的字符序（表2-3）：utf8_bin（二进制排序）、utf8_general_ci（通用排序）、utf8_unicode_ci（基于UCA的排序）、utf8mb4_bin/utf8mb4_general_ci/utf8mb4_unicode_ci、utf8mb4_0900_ai_ci（UCA，不支持空白填充）、gbk_bin/gbk_chinese_ci（中文拼音排序）、gb18030_bin/gb18030_chinese_ci、binary（二进制，不支持空白填充）、latin1_swedish_ci（瑞典语排序）/latin1_bin、gb18030_2022_bin/gb18030_2022_chinese_ci；除utf8mb4_0900_ai_ci和binary外均支持空白填充。"
  source_anchor: "2.3 表2-3 字符序列表 页1993-1994"
  source_refs: *refcs
  status: confirmed
- id: mcompat_cslvl_wave8_102_syntax
  type: syntax
  statement: "库级字符集和字符序：创建库/模式并指定默认字符集和字符序的语法为CREATE {DATABASE | SCHEMA} [IF NOT EXISTS] db_name [create_option] ...，create_option为[DEFAULT] { CHARACTER SET [=] default_charset | CHAR SET [=] default_charset | CHARSET [=] default_charset | COLLATE [=] default_collation }；修改库/模式的默认字符集字符序属性语法为ALTER {DATABASE | SCHEMA} db_name [create_option] ...。"
  source_anchor: "2.3.2 语法格式 页1995-1996"
  source_refs: &refcslvl
  - w8_102_2_3_2
  status: confirmed
- id: mcompat_cslvl_wave8_102_params
  type: constraint
  statement: "参数：db_name为模式名称（字符串，符合标识符命名规范）；default_charset指定模式的默认字符集，单独指定时会将模式的默认字符序设置为指定的字符集的默认字符序；default_collation指定模式的默认字符序，单独指定时会将模式的默认字符集设置为指定的字符序对应的字符集。"
  source_anchor: "2.3.2 语法说明 页1996"
  source_refs: *refcslvl
  status: confirmed
- id: mcompat_cslvl_wave8_102_selection
  type: constraint
  statement: "GaussDB选择模式字符集和字符序的方式：同时指定default_charset和default_collation时使用二者且需要对应（不对应时报错）；仅指定default_charset时使用该字符集及其默认字符序；仅指定default_collation时使用该字符序及其对应的字符集；都不指定时库/模式字符集同server_encoding，字符序为该字符集的默认字符序；default_charset仅支持指定为带有默认字符序的字符集（否则报错）；default_collation仅支持支持的字符序章节中的字符序（其他报错）。"
  source_anchor: "2.3.2 语法说明 页1996"
  source_refs: *refcslvl
  status: confirmed
- id: mcompat_cslvl_wave8_102_example
  type: behavior_oracle
  statement: "示例：CREATE SCHEMA test CHARSET utf8（仅设置字符集，字符序为该字符集默认字符序）；CREATE SCHEMA test COLLATE utf8_bin（仅设置字符序，字符集为字符序关联字符集）；CREATE SCHEMA test CHARSET utf8 COLLATE utf8_bin（同时设置且需对应）；ALTER SCHEMA test CHARSET utf8mb4 COLLATE utf8mb4_bin（修改test默认字符集为utf8mb4、默认字符序为utf8mb4_bin）。"
  source_anchor: "2.3.2 示例 页1996"
  source_refs: *refcslvl
  status: confirmed
- id: mcompat_identifier_wave8_102_quoted
  type: constraint
  statement: "M-Compatibility标识符支持默认使用反引号（``）；当sql_mode设置为ANSI_QUOTES时标识符同时支持反引号（``）和双引号（\"\"）；特殊情况下可以使用引号规避特殊字符报错；有引号标识符中允许的字符：ASCII为U+0001~U+007F，扩展为U+0080~U+FFFF。"
  source_anchor: "2.4.1 命名规范 页2002-2003"
  source_refs: &refident
  - w8_102_2_4_1
  status: confirmed
- id: mcompat_identifier_wave8_102_unquoted
  type: constraint
  statement: "无引号标识符中允许的字符：ASCII为字母（a-zA-Z）、数字（0-9）、下划线（_）、美元符号（$）、井号（#）；扩展为U+0080~U+00FF；只允许字母、数字、下划线以及U+0080~U+00FF扩展字符作为开头。"
  source_anchor: "2.4.1 命名规范 页2002-2003"
  source_refs: *refident
  status: confirmed
- id: mcompat_identifier_wave8_102_char_limits
  type: constraint
  statement: "标识符不支持使用U+0000或U+10000以上编码的字符；标识符支持以数字开头，但不能全部由数字组成，除非在引号标识符中。"
  source_anchor: "2.4.1 命名规范 页2003"
  source_refs: *refident
  status: confirmed
- id: mcompat_identifier_wave8_102_case_sensitive
  type: constraint
  statement: "大小写敏感（lower_case_table_names=0时）：完全区分大小写的标识符有库名、Schema名、表名、用户视图名以及information_schema系统视图中以上对象对应字段的值，创建和使用过程严格区分大小写；lower_case_table_names=1时：库、Schema名、表名（包括auto_increment自增列生成的序列名）以及视图在创建和使用时不区分大小写，使用反引号或双引号修饰时也不区分大小写。"
  source_anchor: "2.4.1 大小写敏感 页2003"
  source_refs: *refident
  status: confirmed
- id: mcompat_identifier_wave8_102_column_case
  type: constraint
  statement: "列名存储区分大小写、比较时不区分大小写：列名在内部按照真实的大小写存储，正常使用则不区分大小写；其余标识符：在标识符内部为全小写不区分大小写，如果使用双引号（需设置sql_mode为ansi_quotes）或反引号修饰时则区分大小写；指定Schema或TABLE修饰时，lower_case_table_names=0时Schema和TABLE区分大小写，=1时不区分大小写。"
  source_anchor: "2.4.1 大小写敏感 页2003"
  source_refs: *refident
  status: confirmed
open_questions:
- id: mcompat_intro_wave8_102_oq_runtime
  statement: "多字符集混用在SQL_ASCII外字符集库中的转码边界、utf8_unicode_ci与0900_ai_ci排序差异、关键字在存储过程与预编译语句中的实际可用性需授权环境实机验证。"
  status: open
