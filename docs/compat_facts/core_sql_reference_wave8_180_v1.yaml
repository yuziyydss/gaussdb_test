facts:
- id: oracompat_wave8_180_overview
  type: syntax
  statement: "GaussDB在基本功能（数据类型、SQL、数据库对象等）和PL/SQL方面与Oracle数据库基本兼容，但由于架构设计方面差异仍存在不兼容项；本章主要介绍GaussDB的Oracle兼容模式与Oracle数据库19c版本的兼容性对比信息。"
  source_anchor: "4.3.1 Oracle数据库兼容性概述 页3134"
  source_refs: &refoc
  - w8_180_4_3
  status: confirmed
- id: oracompat_wave8_180_numeric_types
  type: constraint
  statement: "数值类型兼容：NUMBER[(p[,s])]支持有差异（GaussDB精度p与标度s的最大边界值比Oracle更大、不支持标度s为负值、支持插入NaN值而Oracle报错）；FLOAT[(p)]支持；BINARY_FLOAT不支持；BINARY_DOUBLE支持。"
  source_anchor: "4.3.2.1 表4-1数值类型 页3135"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_datetime_types
  type: constraint
  statement: "日期时间类型兼容：DATE支持有差异（未开启mapping_date_to_datea时GaussDB公元时间范围更大、开启后语法/操作符/格式控制与Oracle有差异）；TIMESTAMP[(fps)]支持有差异；TIMESTAMP WITH TIME ZONE支持有差异（GaussDB timestamptz等价于Oracle timestampwithlocaltimezone，时区文件更新不影响已有数据）；TIMESTAMP WITH LOCAL TIME ZONE不支持；INTERVAL YEAR TO MONTH和INTERVAL DAY TO SECOND均支持；A兼容模式下日历系统差异（Oracle有儒略历和格里历两套，GaussDB仅有格里历）。"
  source_anchor: "4.3.2.1 表4-2日期时间类型 页3135-3137"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_char_types
  type: constraint
  statement: "字符类型兼容：CHAR/NCHAR/VARCHAR2/NVARCHAR2支持有差异（GaussDB中VARCHAR2和NVARCHAR2支持的最大长度受限于max_component_length等参数）；CLOB/NCLOB支持（GaussDB中CLOB最大支持1GB而Oracle支持4GB）；LONG不支持。"
  source_anchor: "4.3.2.1 字符类型对比 页3138-3139"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_raw_lob_rowid_types
  type: constraint
  statement: "RAW/LOB/ROWID类型兼容：RAW支持有差异；BLOB支持；BFILE支持有差异；ROWID支持有差异（GaussDB按node_slice/table_oid/bucket_id/row_no比较而Oracle按data object number/relate file number/block number/row number比较）；UROWID不支持。"
  source_anchor: "4.3.2.1 RAW/LOB/ROWID类型 页3139-3140"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_userdefined_types
  type: constraint
  statement: "用户自定义/伪/XML/空间类型兼容：对象类型不支持、REF数据类型不支持、可变数组和嵌套表支持；anytype/anydata/anydataset伪类型不支持；XMLTYPE支持有差异（不能通过XMLELEMENT函数将字符串转变为XMLTYPE而是转变成XML类型）；URITYPE不支持；SDO_GEOMETRY等空间类型不支持。"
  source_anchor: "4.3.2.1 表4-6~4-9 页3140-3141"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_lock_modes
  type: syntax
  statement: "锁模式映射：Oracle null→GaussDB AccessShare、RS→RowShare、RX→RowExclusive、S→ShareUpdateExclusive、SRX→Share、X→Exclusive；GaussDB额外有ShareRowExclusive/AccessExclusive/INVALID（非法锁）。"
  source_anchor: "4.3.2.1 表4-10锁模式 页3141"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_comparison_rules
  type: constraint
  statement: "数据类型比较规则兼容：Numeric值/日期时间值/二进制值/数据类型优先级/数据转换支持；字符值支持有差异（比较规则名称不完全相同、GaussDB不支持表级比较规则、语法差异——GaussDB用ENCODING/LC_CTYPE/LC_COLLATE而Oracle用NLS前缀参数）；对象值不支持；Varrays和嵌套表支持有差异（GaussDB还支持同类型Varrays之间的比较）。"
  source_anchor: "4.3.2.2 表4-11比较规则 页3141-3142"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_literals_format
  type: syntax
  statement: "字面量与格式模型兼容：文本/数值/日期时间/区间字面量均支持；数字格式支持有差异（a_format_version=10c和a_format_dev_version=s1时支持$/C/TM/TM9/TME/U格式但不支持TH/PL/SG）；日期时间格式支持有差异；格式模型修饰符支持；字符串到日期转换规则支持有差异；xml格式模式不支持。"
  source_anchor: "4.3.2.3-4.3.2.4 页3142-3143"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_null_comments
  type: syntax
  statement: "空值与注释兼容：IS NULL和IS NOT NULL支持、NULLS in conditions支持；斜杠和星号（/*）注释支持、两个连字符（--）注释支持、COMMENT命令支持、HINT支持有差异（GaussDB不支持'--+'hint形式）。"
  source_anchor: "4.3.2.5-4.3.2.6 页3143-3144"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_schema_objects
  type: constraint
  statement: "数据库对象（schema对象）兼容：集群/约束/数据库链接/数据库触发器/尺寸/索引/物化视图/operators/包/序列/存储函数/存储过程/同义词/表/视图支持；分析视图/属性维度/外部过程库/分层结构/索引组织表/索引类型/Java类/Java资源/Java源码/join groups/物化视图日志/挖掘模型/对象表/对象类型/对象视图/zone map不支持；唯一索引组合列NULL行为差异（Oracle认为NULL==NULL而GaussDB遵守SQL标准认为NULL!=NULL，可通过enable_uniq_idx_a_compat参数兼容）；同义词有差异（GaussDB同义词可与表/视图/函数/package重名）。"
  source_anchor: "4.3.2.7 表4-16 页3144-3145"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_nonschema_objects
  type: constraint
  statement: "非schema对象兼容：目录/还原点/角色/表空间/统一审计策略/用户支持；上下文/版本/闪回存档/锁定配置文件/配置文件/表空间集不支持；回滚段——ustore支持、astore不支持。"
  source_anchor: "4.3.2.7 表4-17 页3145-3146"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_naming_reference
  type: syntax
  statement: "数据库对象命名与引用兼容：数据库对象命名规则支持有差异（GaussDB默认小写）；模式对象命名规则支持；引用对象的一般语法/解析对象的引用/引用外部模式对象/引用外部数据库对象/引用表和索引分区和子分区均支持。"
  source_anchor: "4.3.2.8-4.3.2.9 页3146-3147"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_pseudocolumns
  type: syntax
  statement: "伪列兼容：分层查询伪列connect_by_iscycle/connect_by_isleaf/level均支持；序列伪列currval/nextval支持有差异（GaussDB以函数形式实现并兼容Oracle调用方式）；rowid伪列支持有差异（Oracle创建表时支持rowid伪列，GaussDB创建表时使用hasrowid选项支持）。"
  source_anchor: "4.3.3 伪列 页3147-3148"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_operators_expressions
  type: syntax
  statement: "操作符与表达式兼容：操作符（算术/连接/集合/多集合操作符）支持；表达式包括条件表达式/日期时间表达式/函数表达式/JSON表达式/标量子查询表达式/类型构造器表达式/CASE表达式/列表表达式等均支持（具体差异在各表达式小节描述）。"
  source_anchor: "4.3.4-4.3.5 页3148-3155"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_conditions
  type: syntax
  statement: "条件兼容：Oracle条件（比较条件/逻辑条件/集合条件/多值条件/区间条件等）在GaussDB中的支持情况在4.3.6节描述，具体差异在各条件类型小节说明。"
  source_anchor: "4.3.6 条件 页3155"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_calendar_diff
  type: constraint
  statement: "A兼容模式日历系统差异：Oracle中存在两套日历系统（公元1582年10月5日前使用儒略历闰年规则为年份能被4整除，之后使用格里历闰年规则为能被4整除且不能被100整除或能被400整除）；GaussDB中只有格里历日历系统（公历），不涉及儒略历。"
  source_anchor: "4.3.2.1 说明 页3137"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_index_null_diff
  type: constraint
  statement: "唯一索引NULL行为差异：Oracle数据库的唯一索引为组合列时会认为NULL==NULL，而GaussDB默认遵守SQL标准认为NULL!=NULL；如需兼容这一行为可开启GUC参数enable_uniq_idx_a_compat（A兼容模式下默认关闭）。"
  source_anchor: "4.3.2.7 表4-16索引说明 页3144"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_synonym_search
  type: constraint
  statement: "同义词搜索顺序差异：Oracle数据库同一namespace内不能重名；GaussDB内同一namespace内同义词可与表/视图/函数/package重名——重名时优先访问该名称对象，未寻找到该名称对象时才寻找同义词指向的对象；同义词指向的对象的Schema名是用户名时才搜索PUBLIC同义词。"
  source_anchor: "4.3.2.7 表4-16同义词说明 页3145"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_180_format_version
  type: constraint
  statement: "格式模型版本依赖：GaussDB仅在a_format_version=10c且a_format_dev_version=s1的情况下支持$/C/TM/TM9/TME/U等数字格式以及时间截断/时间四舍五入参数；to_timestamp_tz函数在该参数组合下有效；同时不支持TH/PL/SG格式。"
  source_anchor: "4.3.2.4 表4-13格式 页3143"
  source_refs: *refoc
  status: confirmed
open_questions:
- id: pkg2_wave8_180_oq_runtime
  content: "NUMBER标度负值在GaussDB中的替代方案、TIMESTAMP WITH LOCAL TIME ZONE的迁移策略、ROWID比较规则差异对索引扫描的影响、唯一索引NULL行为在enable_uniq_idx_a_compat开启后的完整兼容度需授权环境实机验证。"
  status: open
