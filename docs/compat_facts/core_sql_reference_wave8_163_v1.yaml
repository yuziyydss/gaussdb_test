facts:
- id: dbestats_wave8_163_overview
  type: syntax
  statement: "DBE_STATS提供统计信息管理的功能，包括锁定、解锁、回退统计信息和清除历史统计信息等；接口分族——LOCK_TABLE/PARTITION/COLUMN/SCHEMA_STATS、UNLOCK_*4、RESTORE_TABLE/PARTITION/COLUMN/SCHEMA_STATS、PURGE_STATS、GET_STATS_HISTORY_RETENTION/GET_STATS_HISTORY_AVAILABILITY、CREATE_STAT_TABLE/DROP_STAT_TABLE、EXPORT_INDEX/TABLE/COLUMN/SCHEMA/DATABASE_STATS、IMPORT_*5、SET_COLUMN/INDEX/TABLE_STATS、DELETE_COLUMN/INDEX/TABLE/SCHEMA_STATS、GET_TABLES_BY_SQLID、ANALYZE_SQLID。"
  source_anchor: "3.12.2.20 DBE_STATS 表3-391 页2907-2911"
  source_refs: &refst
  - w8_163_3_12
  status: confirmed
- id: dbestats_wave8_163_no_temp_table
  type: constraint
  statement: "DBE_STATS不支持临时表。"
  source_anchor: "3.12.2.20 DBE_STATS说明 页2907"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_permission_model
  type: constraint
  statement: "DBE_STATS权限模型：LOCK/UNLOCK/RESTORE/EXPORT/IMPORT等接口使用时用户必须对指定的表拥有与ANALYZE命令相同的权限（详见ANALYZE|ANALYSE）；SCHEMA级接口调用时会锁定/解锁/回退该schema下所有当前用户有ANALYZE权限的表（没有权限的表直接跳过），且需拥有指定schema的USAGE权限；PURGE_STATS只有初始用户可调用；CREATE_STAT_TABLE需要用户拥有在指定schema与指定tablespace下创建表和创建索引的权限、DROP_STAT_TABLE需要删除表和删除索引的权限。"
  source_anchor: "3.12.2.20 表3-391权限要求 页2907-2909"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_export_import_flow
  type: constraint
  statement: "EXPORT/IMPORT与\\COPY配合流程：导出统计信息时需依次执行DBE_STATS.CREATE_STAT_TABLE、DBE_STATS.EXPORT_DATABASE_STATS、\\COPY TO、DBE_STATS.DROP_STAT_TABLE（需具备相应接口或命令权限及指定导出目录的读写权限）；导入统计信息时需依次执行DBE_STATS.CREATE_STAT_TABLE、DBE_STATS.EXPORT_DATABASE_STATS、\\COPY FROM、DBE_STATS.DROP_STAT_TABLE（需目录下文件的读取权限）。"
  source_anchor: "3.12.2.20 表3-391导入导出说明 页2910-2911"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_restore_preview
  type: syntax
  statement: "RESTORE族预览：RESTORE_TABLE_STATS/RESTORE_PARTITION_STATS/RESTORE_COLUMN_STATS/RESTORE_SCHEMA_STATS分别用于回退表级/分区级/列级统计信息及指定schema下所有表相关统计信息到指定时间点（详细原型与示例在后续切片覆盖）。"
  source_anchor: "3.12.2.20 表3-391 页2908-2909"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_purge_preview
  type: syntax
  statement: "历史统计信息管理预览：PURGE_STATS清除指定时间节点前的所有历史统计信息（只有初始用户可调用）；GET_STATS_HISTORY_RETENTION获取历史统计信息的保留时间；GET_STATS_HISTORY_AVAILABILITY获取最早可用的历史统计信息的时间。"
  source_anchor: "3.12.2.20 表3-391 页2909"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_lock_table
  type: syntax
  statement: "LOCK_TABLE_STATS原型：DBE_STATS.LOCK_TABLE_STATS(ownname VARCHAR2, tabname VARCHAR2)；锁定一个表的统计信息，锁定后该表的统计信息无法更新，该表下级的索引、分区和列也会同步被锁定；该接口无返回值；ownname为空时默认当前schema。"
  source_anchor: "3.12.2.20 LOCK_TABLE_STATS 页2911-2912"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_lock_table_state
  type: constraint
  statement: "表级锁定状态查看：可以通过查看表的reloptions中的stat_state状态获取该表的锁定状态；当一个表处于锁定状态时其统计信息无法更新。"
  source_anchor: "3.12.2.20 LOCK_TABLE_STATS说明 页2912"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_lock_table_example
  type: behavior_oracle
  statement: "LOCK_TABLE_STATS示例基线：dbe_stats_lock.t1锁定后通过PG_CLASS查询reloptions含stat_state=locked（exist_lock=t）；锁定后ANALYZE t1报错The statistics is locked, cannot be updated.。"
  source_anchor: "3.12.2.20 LOCK_TABLE_STATS示例 页2912"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_lock_partition
  type: syntax
  statement: "LOCK_PARTITION_STATS原型：DBE_STATS.LOCK_PARTITION_STATS(ownname VARCHAR2, tabname VARCHAR2, partname VARCHAR2)；锁定一个分区的统计信息（下级的索引、分区、列会同步锁定）；可通过该分区reloptions中的stat_state获取锁定状态；该分区或该表所属的表处于锁定状态时其统计信息无法更新。"
  source_anchor: "3.12.2.20 LOCK_PARTITION_STATS 页2912-2913"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_lock_column
  type: syntax
  statement: "LOCK_COLUMN_STATS原型：DBE_STATS.LOCK_COLUMN_STATS(ownname VARCHAR2, tabname VARCHAR2, colname VARCHAR2, partname VARCHAR2 DEFAULT NULL)；锁定一个列的统计信息；partname为空时默认锁定该列表级统计信息；若不存在该表的列级统计信息则锁定可执行成功但实际未生效；可查看PG_STATISTIC、PG_STATISTIC_EXT中的stastate获取锁定状态；锁定多列时需先查询PG_STATISTIC_EXT中的staextname字段获取多列别名作为colname入参。"
  source_anchor: "3.12.2.20 LOCK_COLUMN_STATS 页2914"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_lock_column_state
  type: constraint
  statement: "列级锁定状态可见性：当某一列被锁定或其所属的表或分区被锁定时其统计信息无法更新，该列被锁定的信息不会回显，需要在日志中通过DEBUG2级别的DBE_STATS的logging_module查看。"
  source_anchor: "3.12.2.20 LOCK_COLUMN_STATS说明 页2914"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_lock_column_example
  type: behavior_oracle
  statement: "LOCK_COLUMN_STATS示例基线：t1插入100行并ANALYZE后LOCK_COLUMN_STATS(ownname=>'dbe_stats_lock',tabname=>'t1',colname=>'a')，查询PG_STATISTIC输出staattnum=1 stastate=l、staattnum=2 stastate=u。"
  source_anchor: "3.12.2.20 LOCK_COLUMN_STATS示例 页2914-2915"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_lock_schema
  type: syntax
  statement: "LOCK_SCHEMA_STATS原型：DBE_STATS.LOCK_SCHEMA_STATS(ownname VARCHAR2)；锁定一个指定schema下所有表的统计信息（无权限表跳过）；用法与LOCK_TABLE_STATS一致。"
  source_anchor: "3.12.2.20 LOCK_SCHEMA_STATS 页2915"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_unlock_table
  type: syntax
  statement: "UNLOCK_TABLE_STATS原型：DBE_STATS.UNLOCK_TABLE_STATS(ownname VARCHAR2, tabname VARCHAR2)；解锁一个表的统计信息，解锁后该表的统计信息可以更新，该表下级的索引、分区、列会同步解锁。"
  source_anchor: "3.12.2.20 UNLOCK_TABLE_STATS 页2915-2916"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_unlock_partition
  type: syntax
  statement: "UNLOCK_PARTITION_STATS原型：DBE_STATS.UNLOCK_PARTITION_STATS(ownname VARCHAR2, tabname VARCHAR2, partname VARCHAR2)；解锁一个分区的统计信息（下级的索引、分区、列会同步解锁）。"
  source_anchor: "3.12.2.20 UNLOCK_PARTITION_STATS 页2916-2917"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_unlock_column
  type: syntax
  statement: "UNLOCK_COLUMN_STATS原型：DBE_STATS.UNLOCK_COLUMN_STATS(ownname VARCHAR2, tabname VARCHAR2, colname VARCHAR2, partname VARCHAR2 DEFAULT NULL)；解锁一个列的统计信息；当partname为空时默认解锁该列表级统计信息以及解锁其级联分区列级统计信息；解锁多列同锁定多列需staextname多列别名。"
  source_anchor: "3.12.2.20 UNLOCK_COLUMN_STATS 页2917-2918"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_unlock_schema
  type: syntax
  statement: "UNLOCK_SCHEMA_STATS原型：DBE_STATS.UNLOCK_SCHEMA_STATS(ownname VARCHAR2)；解锁一个指定schema下所有表的统计信息。"
  source_anchor: "3.12.2.20 UNLOCK_SCHEMA_STATS 页2918"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_ownname_null_rule
  type: constraint
  statement: "ownname空值规则：当ownname参数值设置为null时使用当前schema，需将behavior_compat_options参数值设置为bind_procedure_searchpath（LOCK/UNLOCK全族接口均适用）。"
  source_anchor: "3.12.2.20 LOCK/UNLOCK族说明 页2911-2918"
  source_refs: *refst
  status: confirmed
- id: dbestats_wave8_163_stastate_semantics
  type: syntax
  statement: "stastate字段语义：PG_STATISTIC/PG_STATISTIC_EXT中的stastate记录列级锁定状态，示例中锁定列显示为l（locked）、未锁定列显示为u（unlocked）。"
  source_anchor: "3.12.2.20 LOCK_COLUMN_STATS示例 页2915"
  source_refs: *refst
  status: confirmed
open_questions:
- id: pkg2_wave8_163_oq_runtime
  content: "锁定表后分区/列级联锁定的reloptions回显差异、列级锁定DEBUG2日志的logging_module配置、SCHEMA级锁定对并发ANALYZE任务的阻断范围需授权环境实机验证。"
  status: open
