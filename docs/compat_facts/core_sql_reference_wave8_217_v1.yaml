- id: guc_wave8_217_blackbox_perf
  type: syntax
  statement: "黑匣子/火焰图参数：blackbox_number POSTMASTER整型0~10默认5（192核~4核32G）或0（4核16G）$GAUSSLOG/gs_blackbox/{nodename}下保留黑匣子文件个数（0不使用黑匣子）；blackbox_directory POSTMASTER字符串默认/dev/shm黑匣子临时文件目录（需tmpfs类型/修改后需手动清理原目录文件）；gs_perf_retention_days SIGHUP整型1~8默认3火焰图文件保留时长。"
