- id: guc_wave8_217_security_policy
  type: constraint
  statement: "安全策略参数：enable_security_policy SIGHUP布尔型默认off统一审计和动态数据脱敏策略（on占用系统资源影响性能）；unified_audit_location SIGHUP整型0/1默认0统一审计日志位置——0 rsyslog/1传统审计日志文件（1需audit_enabled=on/挤占传统审计资源）；use_elastic_search POSTMASTER布尔型默认off统一审计日志发送Elastic Search（默认https/需elastic_search_ip_addr可达否则不生效）；elastic_search_ip_addr POSTMASTER字符串默认空ES IP地址（https://ip:port:username或http://ip:port/port 9200-9299/初始用户elastic）。"
  source_anchor: "7.3.30 安全配置 页4739-4741"
  source_refs: *refw8217
  status: confirmed
- id: guc_wave8_217_tde
  type: constraint
  statement: "透明数据加密参数：enable_tde POSTMASTER布尔型默认off创建加密表前需置on且tde_key_info配置密钥/关闭后无法读取加密表数据可能导致FATAL/PANIC重启失败；tde_key_info字符串访问外部密钥服务信息（错误配置密钥丢失无法读取加密数据）；tde_index_default_encrypt SIGHUP布尔型默认off加密表索引自动加密（on影响查询索引性能）；tde_encrypt_config POSTMASTER字符串格式key=value——log_encrypt on/off控制Xlog和undo-log加密/log_algorithm aes_128_ctr或sm4_ctr/table_algorithm aes_128_ctr/sm4_ctr/aes_128_ctr_sha256_hmac/sm4_ctr_sm3_hmac/aes_128_gcm；block_encryption_mode USERSET枚举aes-128-cbc等默认aes-128-cbc aes_encrypt/aes_decrypt函数块加密模式；enable_tde_async_encryption POSTMASTER布尔型默认off异步加密（提升性能但所有新建表同一异步加密DEK）；tde_async_dek SIGHUP字符串异步加密密钥（数据库自行填充不支持用户设置）；tde_dkcache_remain_time SIGHUP整型0~1440小时默认1透明加密DEK缓存有效时长（0永久/每小时周期性清理）。"
  source_anchor: "7.3.30 安全配置 页4741-4747"
  source_refs: *refw8217
  status: confirmed
- id: guc_wave8_217_fips_rls_access
  type: constraint
  statement: "FIPS/RLS/访问控制参数：enable_fips POSTMASTER布尔型默认off FIPS模式——on后password_encryption_type设0/1/3失效强制sha256/md5/sm3用户无法登录/仅对加解密函数/用户创建/登录/TLS算法FIPS标准拦截/需OpenSSL同时进入FIPS模式；enable_thread_permission_down SIGHUP布尔型默认on后台线程权限控制——on使用gs_role_signal_backend角色权限防止越权/off使用初始用户权限；allow_initialuser_exec_others_udf SUSET布尔型默认on初始用户执行其他用户UDF（建议off降低越权风险）；allow_sysadmin_exec_others_udf SUSET布尔型默认on系统管理员执行其他用户UDF（建议off可在会话中设on）；enable_rls_match_index SIGHUP布尔型默认off RLS行级访问控制谓词基表索引扫描（目标场景unleakproof系统函数或like/RLS策略多时lossy模式重复执行影响性能）；restrict_nonsystem_relation_kind USERSET字符串默认空用户创建关系对象访问限制（view禁用视图/foreign-table禁用外表/gs_dump时会话级设为view,foreign-table）。"
  source_anchor: "7.3.30 安全配置 页4744-4747"
  source_refs: *refw8217
  status: confirmed
- id: guc_wave8_217_gtt_hll
  type: syntax
  statement: "全局临时表/HyperLogLog参数：max_active_global_temporary_table POSTMASTER整型0~1000000默认1000全局临时表功能开关（0关闭/>0打开/决定共享缓存预留内存）；vacuum_gtt_defer_check_age USERSET整型0~1000000默认10000 vacuum后检查GTT relfrozenxid与普通表差异（PDB级别）；enable_gtt_concurrent_truncate SIGHUP布尔型默认on支持GTT truncate和DML并发以及truncate并发；hll_default_log2m USERSET整型10~16默认14 hll桶个数（误差范围±1.04/2^log2m^1/2）；hll_default_log2sparse USERSET整型0~14默认12 Sparse到Full模式阈值（0跳过Sparse）；hll_duplicate_check USERSET整型0/1默认0默认开启duplicate check。"
  source_anchor: "7.3.31-7.3.32 页4748-4750"
  source_refs: *refw8217
  status: confirmed
- id: guc_wave8_217_udf_job
  type: syntax
  statement: "UDF/定时任务参数：udf_memory_limit POSTMASTER整型200*1024~2147483647kB默认200MB UDF最大物理内存（当前版本不生效使用FencedUDFMemoryLimit和UDFWorkerMemHardLimit）；FencedUDFMemoryLimit USERSET整型0~2147483647kB默认0 fenced udf worker虚拟内存（0不做内存控制）；UDFWorkerMemHardLimit POSTMASTER整型默认1GB（1048576kB）FencedUDFMemoryLimit最大值；enable_cfunction SIGHUP布尔型默认off（新装）调用C function（505.2.0之前升级后默认on/其他版本升级后off）；enable_default_cfunc_libpath POSTMASTER布尔型默认on C函数so文件默认路径$libdir/proc_srclib（off任意目录存在安全风险）；job_queue_processes POSTMASTER整型0~1000默认10并发执行job数目（0不启用定时任务/建议100/超并发到期任务延期到下轮询周期）；enable_prevent_job_task_startup SIGHUP布尔型默认off控制是否可以启动job线程。"
  source_anchor: "7.3.33-7.3.34 页4750-4753"
  source_refs: *refw8217
  status: confirmed
- id: guc_wave8_217_thread_pool
  type: constraint
  statement: "线程池参数：enable_thread_pool POSTMASTER布尔型默认on线程池功能（多租enable_mtd需开启/低并发长连接性能敏感建议关闭）；enable_connect_thread_pool POSTMASTER布尔型默认on认证线程池（需enable_thread_pool=on）；thread_pool_attr POSTMASTER字符串默认按规格'4096,8,(nobind)'等——thread_num线程总数（预留max_connections+1/group_num组数/cpubind_info绑核（nobind/allbind/nodebind/cpubind/numabind）/enable_group_reuse（预留参数实际不生效）/线程池值>=max_connections时proc资源不足）；connect_thread_pool_attr POSTMASTER字符串默认auto建连线程池——thread_num [1,Max(8,CPU核数)]超配500/group_num固定1/enable_adjust_connect_pool扩容功能/2秒无法分配线程触发过载（强制关闭等待超2秒会话）；thread_pool_stream_attr POSTMASTER字符串默认'16,0.2,...'stream线程池——stream_thread_num 0~4096（0自动=CPU核数/推荐=CPU*(3~5)）/stream_proc_ratio 0~0.9默认0.2预留proc比例/group_num需与thread_pool_attr一致/cpubind_info需与thread_pool_attr一致；max_stream_threads SIGHUP整型0~4096默认4096/2048/1024/128/64/32/16按规格stream线程池最大线程数（过小无法生成SMP并行/过大CPU资源占用）；thread_pool_idle_time SIGHUP整型0~2147483647秒默认300线程池线程空闲退出时间（不作用于认证线程池/过小频繁启停影响性能）；resilience_threadpool_reject_cond字符串默认none线程池过载拒绝条件。"
  source_anchor: "7.3.35 线程池 页4753-4759"
  source_refs: *refw8217
  status: confirmed
- id: guc_wave8_217_fulltext_backup
  type: syntax
  statement: "全文检索/备份恢复参数：ngram_gram_size整型默认2 ngram分词长度；ngram_grapsymbol_ignore布尔默认off忽略空格；ngram_punctuation_ignore布尔默认off忽略标点；default_text_search_config字符串默认pg_catalog.simple全文检索配置；tsearch_options字符串默认simple tsearch选项；operation_mode枚举默认normal运行模式；enable_cbm_tracking SIGHUP布尔型默认off CBM追踪（备份恢复）；max_size_for_xlog_retention SIGHUP整型0~2147483647kB默认204800（200MB）Xlog保留大小（CBM备份场景）；max_cbm_retention_time SIGHUP整型0~7天默认7 CBM文件保留时间；hadr_max_size_for_xlog_receiver SIGHUP整型默认1GB容灾备机Xlog接收最大值。"
