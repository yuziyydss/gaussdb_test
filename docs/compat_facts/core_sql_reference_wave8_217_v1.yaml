- id: guc_wave8_217_dcf
  type: constraint
  statement: "DCF参数：dcf_ssl POSTMASTER布尔型默认on不再使用DCF复用ssl；dcf_config/dcf_data_path/dcf_log_path SIGHUP字符串OM配置不允许修改；dcf_node_id SIGHUP整型1~2147483647默认安装自定义DN节点ID；dcf_max_workers POSTMASTER整型0~262143默认40回调函数线程最大数；dcf_truncate_threshold SIGHUP整型1~2147483647默认100000日志truncate门限（过大长期不truncate挤占内存）；dcf_election_timeout SIGHUP整型1~600秒默认3选举超时（DCF节点间最大时钟差异小于超时一半/手动模式禁止配置修改）；dcf_enable_auto_election_priority SIGHUP整型0/1默认1优先级选主内部自动调整；dcf_election_switch_threshold SIGHUP整型0~2147483647秒默认0防频繁切主门限；dcf_mode SIGHUP枚举0自动选举/1手动选举/2去使能选举默认1（去使能仅少数派恢复/修改导致不可用）；dcf_log_level SIGHUP字符串默认RUN_ERR|RUN_WAR|DEBUG_ERR|OPER|RUN_INF|PROFILE日志级别（NONE关闭/不能与级别混用/竖线组合）；dcf_log_backup_file_count SIGHUP整型1~1000默认100运行日志备份保留个数；dcf_max_log_file_size SIGHUP整型1~1000MB默认10单个日志文件最大大小；dcf_socket_timeout SIGHUP整型10~600000ms默认6000通信socket超时（网络差需增大/重启生效）。"
