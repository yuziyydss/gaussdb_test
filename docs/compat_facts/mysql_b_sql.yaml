facts:
- id: b_unique_index_syntax
  type: constraint
  statement: B模式不支持UNIQUE INDEX|KEY index_name语法，使用时报错。
  source_anchor: 4.4.3.7.1 表4-193
  status: confirmed
- id: b_auto_increment_index_first
  type: constraint
  statement: 自增列建议为索引（非全局二级索引）第一个字段，否则建表警告且某些操作报错；MySQL要求必须第一。
  source_anchor: 4.4.3.7.1 表4-193
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3550）
- id: b_auto_increment_value_range
  type: constraint
  statement: AUTO_INCREMENT=value中value须为小于2^127正数；MySQL不校验。
  source_anchor: 4.4.3.7.1 表4-193
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3550）
- id: b_auto_increment_max_error
  type: behavior_oracle
  statement: 自增值达字段类型最大值时继续自增产生错误；MySQL部分场景仍自增为最大值。
  source_anchor: 4.4.3.7.1 表4-193
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3550）
- id: b_auto_increment_lock_mode
  type: environment
  statement: 不支持innodb_autoinc_lock_mode；GUC auto_increment_cache=0时批量插入行为与MySQL lock_mode=1相似。
  source_anchor: 4.4.3.7.1 表4-193
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3550）
- id: b_using_btree_to_ubtree
  type: behavior_oracle
  statement: 约束为全局二级索引或ustore表时，指定using btree底层建为ubtree。
  source_anchor: 4.4.3.7.1 表4-193
  status: confirmed
