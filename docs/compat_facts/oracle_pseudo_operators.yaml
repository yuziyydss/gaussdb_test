facts:
- id: oracle_pseudocolumn_connect_by
  type: syntax
  statement: 分层查询伪列connect_by_iscycle、connect_by_isleaf、level均支持。
  source_anchor: 4.3.3 表4-20
  status: confirmed
- id: oracle_pseudocolumn_sequence
  type: syntax
  statement: currval和nextval以函数形式实现，兼容Oracle调用方式。
  source_anchor: 4.3.3 表4-21
  status: confirmed
- id: oracle_pseudocolumn_rowid
  type: constraint
  statement: rowid伪列支持但有差异：Oracle创建表时自动支持，GaussDB需使用hasrowid选项。
  source_anchor: 4.3.3 表4-22
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页3147）
- id: oracle_pseudocolumn_rownum
  type: behavior_oracle
  statement: rownum支持但有差异：Oracle在left/right/full join条件中使用rownum过滤时可能忽略或部分忽略条件，GaussDB表现不同。
  source_anchor: 4.3.3 表4-23
  status: confirmed
