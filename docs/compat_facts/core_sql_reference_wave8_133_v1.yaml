  statement: "M兼容IGNORE将无效值调整为最接近值的完整映射表（NOT NULL/唯一键/分区不匹配场景）、ON DUPLICATE KEY UPDATE多唯一约束的冲突检查顺序、s2下同字段多次修改的最终值语义需授权环境实机验证。"
