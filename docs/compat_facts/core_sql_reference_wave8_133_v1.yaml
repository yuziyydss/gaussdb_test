facts:
- id: m_insert_wave8_133_overview
  type: syntax
  statement: "M兼容INSERT向表中插入一行或多行数据；六种语法形式：INSERT [/*+ plan_hint */] [IGNORE] [INTO] tbl_name [PARTITION (partition_name[,...])] [(column_name[,...])] {VALUES | VALUE} ([value_list]) [,(value_list)]... [AS row_alias[(col_alias[,...])]] [ON DUPLICATE KEY UPDATE column_name = {expression | DEFAULT}[,...]]；SET形式SET column_name = {expression | DEFAULT}[,...]；query查询插入形式；以及面向视图的三种形式（INSERT [IGNORE] [INTO] view_name...）；plan_hint以/*+ */形式在INSERT关键字后进行hint调优（每条语句只有第一个注释块生效）。"
  source_anchor: "2.4.2.12.1 语法格式 页2218-2219"
  source_refs: &refmins
  - w8_133_2_4_2_12_1
  status: confirmed
- id: m_insert_wave8_133_permission
  type: constraint
  statement: "M兼容INSERT权限：只有拥有表INSERT权限的用户才可以向表中插入数据（用户被授予insert any table权限相当于对除系统模式之外的任何模式具有USAGE权限并拥有这些模式下表的INSERT权限）；使用ON DUPLICATE KEY UPDATE须有该表的INSERT、UPDATE权限及UPDATE子句中列的SELECT权限；使用query子句插入查询数据还需拥有查询中使用的表的SELECT权限；生成列不能被直接写入（INSERT命令中不能为生成列指定值但可指定关键字DEFAULT）。"
  source_anchor: "2.4.2.12.1 注意事项 页2218"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_ignore
  type: constraint
  statement: "M兼容INSERT的IGNORE关键字将部分ERROR级别错误降级为WARNING级别并根据错误场景将无效值调整为最接近的值；支持错误降级的场景：破坏NOT NULL约束、唯一键冲突、插入的值无法匹配对应的分区、指定分区插入时插入的数据与指定分区不匹配、子查询返回多行、sql_mode为宽松模式的场景。"
  source_anchor: "2.4.2.12.1 注意事项/参数说明 IGNORE 页2219"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_column
  type: constraint
  statement: "M兼容INSERT字段列表规则：column_name具体形式为[[schema.]table.]column（可由子字段名或数组下标修饰）；未在字段列表中出现的字段由系统设置默认值或声明时的默认值填充（无默认值或声明值则用NULL填充）；目标字段可按顺序排列，未列出任何字段则默认全部字段且顺序为表声明时的顺序；value子句和query只提供N个字段时目标字段为前N个字段（值从左到右关联对应列）。"
  source_anchor: "2.4.2.12.1 参数说明 column_name 页2219-2220"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_expression
  type: constraint
  statement: "M兼容INSERT expression规则：INSERT ON DUPLICATE KEY UPDATE语句下expression可以为VALUES(column_name)表示引用冲突行对应的column_name字段的值（VALUES(column_name)支持嵌套在复合表达式中，如VALUES(column_name) + 1、VALUES(column_name) + VALUES(column_name)、function_name(VALUES(column_name))等；该特性仅支持在ON DUPLICATE KEY UPDATE子句中使用）；向表中字段插入单引号时需使用单引号自身转义；插入表达式不是正确数据类型时系统试图类型转换（不成功则插入失败返回错误信息）；DEFAULT为对应字段的缺省值（无缺省值为NULL）。"
  source_anchor: "2.4.2.12.1 参数说明 expression/DEFAULT 页2220"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_odku
  type: constraint
  statement: "M兼容ON DUPLICATE KEY UPDATE：对带唯一约束（UNIQUE INDEX或PRIMARY KEY）的表插入违反唯一约束时对冲突行执行UPDATE子句（不带唯一约束的表仅执行插入，可通过VALUES()选择源数据相应的列）；表中存在多个唯一约束且插入违反多个时对检测到冲突的第一行更新（检查顺序与索引维护强相关，一般先创建的索引先检查）；插入多行均与同一行冲突时按顺序第一条执行插入或更新之后依次更新；expression不支持使用子查询表达式。"
  source_anchor: "2.4.2.12.1 参数说明 ON DUPLICATE KEY UPDATE 页2220"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_odku_s2
  type: constraint
  statement: "M兼容ON DUPLICATE KEY UPDATE的s2行为：将GUC兼容性参数m_format_dev_version设置为's2'后UPDATE子句更新多列时如存在引用前面的字段名则使用其更新后的数据，且支持同一字段名可被修改多次；query为子查询时UPDATE子句支持引用子查询中列名的条件：子查询为UNION或EXCEPT操作不支持引用；第一层子查询包含聚集函数或GROUP BY聚集操作不支持引用；仅支持引用子查询中第一个FROM返回的所有字段（不支持投影列或多层嵌套子查询的列）；子查询FROM字段存在列别名时UPDATE子句只能引用列别名；表存在表别名时只能引用表别名。"
  source_anchor: "2.4.2.12.1 参数说明 页2220-2221"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_partition
  type: syntax
  statement: "M兼容INSERT的PARTITION子句：INSERT INTO tbl_name PARTITION (partition_name [, partition_name] ...)指定分区插入（分区名来自目标分区表的分区定义）。"
  source_anchor: "2.4.2.12.1 语法格式 PARTITION 页2218"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_examples_odku
  type: behavior_oracle
  statement: "ON DUPLICATE KEY UPDATE示例基线（m_db）：test_t4(id PRIMARY KEY, info)插入(1,'AA'),(2,'BB'),(3,'CC')后INSERT INTO test_t4 VALUES (3,'DD'),(4,'EE') ON DUPLICATE KEY UPDATE info = VALUES(info)——id=3冲突更新为DD、id=4插入EE（查询显示1|AA、2|BB、4|EE、3|DD）；子查询引用：INSERT INTO t1 (a, b) SELECT c, d FROM t2 ON DUPLICATE KEY UPDATE b = b + d后t1为2|7、5|13。"
  source_anchor: "2.4.2.12.1 示例 ON DUPLICATE KEY UPDATE 页2222-2223"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_ignore_notnull
  type: behavior_oracle
  statement: "IGNORE示例1破坏NOT NULL约束（m_db）：test_t5(f1 INT NOT NULL)执行INSERT IGNORE INTO test_t5 VALUES(NULL)产生WARNING: The null value in column \"f1\" violates not-null constraint.（DETAIL: Failing row contains (null)）并INSERT 0 1，查询显示f1为0（无效值调整为最接近值）。"
  source_anchor: "2.4.2.12.1 示例1 页2223"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_ignore_unique
  type: behavior_oracle
  statement: "IGNORE示例2唯一键冲突：test_t6(f1 INT PRIMARY KEY)已插入1后INSERT IGNORE INTO test_t6 VALUES(1)唯一键冲突降级为WARNING继续处理（不报ERROR）。"
  source_anchor: "2.4.2.12.1 示例2 页2223"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_ignore_partition
  type: behavior_oracle
  statement: "IGNORE分区示例（m_db）：示例3 LIST分区test_t7（p0 VALUES(1,4,7)、p1 VALUES(2,5,8)）插入(3,5)产生WARNING: inserted partition key does not map to any table partition且INSERT 0 0（数据被忽略）；示例4 RANGE分区test_t8指定分区PARTITION(p2)插入(20,...)产生WARNING: inserted partition key does not map to the table partition且INSERT 0 0。"
  source_anchor: "2.4.2.12.1 示例3/4 页2224-2225"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_ignore_subquery
  type: behavior_oracle
  statement: "IGNORE示例5子查询返回多行（m_db）：test_t9已有3行后INSERT IGNORE INTO test_t9 VALUES((SELECT f1 FROM test_t9), 0)产生WARNING: The subquery in the expression returns more than one row of result.并INSERT 0 1（f1无效值调整为最接近值插入空）。"
  source_anchor: "2.4.2.12.1 示例5 页2224-2225"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_view_example
  type: behavior_oracle
  statement: "插入视图示例（m_db）：CREATE VIEW v_ins1 AS SELECT * FROM t1与v_ins2（带WHERE y1 < 3条件）后INSERT INTO v_ins1 VALUES (1, 1)与INSERT INTO v_ins2 VALUES (5, 5)均INSERT 0 1（通过视图对基表插入）；多表视图CREATE VIEW vv_ins AS SELECT * FROM t1, t2 WHERE x1 = x2后INSERT INTO vv_ins (x1, y1) VALUES (2, 2)成功。"
  source_anchor: "2.4.2.12.1 示例 插入视图 页2225-2226"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_row_alias
  type: syntax
  statement: "M兼容INSERT的AS row_alias[(col_alias[, col_alias] ...)]子句为目标表和字段指定别名（row_alias为目标表别名，col_alias为字段别名）。"
  source_anchor: "2.4.2.12.1 参数说明 row_alias/col_alias 页2220"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_set_view_forms
  type: syntax
  statement: "M兼容INSERT的SET形式（INSERT [IGNORE] [INTO] tbl_name SET column_name = {expression | DEFAULT}[,...]）与三种视图插入形式（VALUES形式、SET形式、query形式，均支持IGNORE与plan_hint）。"
  source_anchor: "2.4.2.12.1 语法格式 页2218-2219"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_set_form_detail
  type: syntax
  statement: "M兼容INSERT的SET形式：INSERT [/*+ plan_hint */] [IGNORE] [INTO] tbl_name [PARTITION (...)] SET column_name = {expression | DEFAULT}[, ...] [AS row_alias[(col_alias[,...])]] [ON DUPLICATE KEY UPDATE ...]（使用SET语法逐列赋值，等价于VALUES形式）。"
  source_anchor: "2.4.2.12.1 语法格式 页2218-2219"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_view_forms
  type: syntax
  statement: "M兼容INSERT支持对视图插入的三种形式：INSERT [IGNORE] [INTO] view_name [(column_name[,...])] {VALUES | VALUE} ([value_list])[,...]、INSERT [IGNORE] [INTO] view_name SET column_name = {expression | DEFAULT}[,...]、INSERT [IGNORE] [INTO] view_name [(column_name[,...])] query。"
  source_anchor: "2.4.2.12.1 语法格式 页2218-2219"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_ignore_example2_detail
  type: behavior_oracle
  statement: "IGNORE示例2唯一键冲突细节（m_db）：test_t6(f1 INT PRIMARY KEY)已插入1后INSERT IGNORE INTO test_t6 VALUES(1)——唯一键冲突的ERROR降级为WARNING处理，不影响后续语句执行。"
  source_anchor: "2.4.2.12.1 示例2 页2223"
  source_refs: *refmins
  status: confirmed
- id: m_insert_wave8_133_partition_names
  type: constraint
  statement: "M兼容INSERT的PARTITION子句：INSERT INTO tbl_name PARTITION (partition_name [, partition_name] ...)可同时指定多个分区名（partition_name为目标分区表的已有分区名，插入数据须匹配指定分区的分区键范围）。"
  source_anchor: "2.4.2.12.1 语法格式 PARTITION 页2218"
  source_refs: *refmins
  status: confirmed
