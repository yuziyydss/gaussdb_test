facts:
- id: logs_wave8_11_type_overview
  type: syntax
  statement: "日志类型分为系统日志、操作日志、审计日志、WAL日志和内存日志。"
  source_anchor: "6.1 页4109"
  source_refs: &refb1
  - w8_11_6
  status: confirmed
- id: logs_wave8_11_system_log_purpose
  type: syntax
  statement: "系统日志记录数据库系统进程运行时产生的异常信息。"
  source_anchor: "6.1 页4109"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_operation_log_purpose
  type: syntax
  statement: "操作日志记录客户端工具（例如gs_guc）操作数据库时产生的日志。"
  source_anchor: "6.1 页4109"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_audit_log_purpose
  type: syntax
  statement: "开启数据库审计功能后，数据库用户的某些操作会记录在审计日志中。"
  source_anchor: "6.1 页4109"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_wal_log_purpose
  type: syntax
  statement: "WAL日志又称REDO日志，数据库异常损坏时可用于恢复，需要经常备份。"
  source_anchor: "6.1 页4109"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_memory_log_purpose
  type: syntax
  statement: "内存日志保存数据库进程动态内存使用超过90%时的内存上下文统计信息。"
  source_anchor: "6.1 页4109"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_system_log_path
  type: syntax
  statement: "系统日志gaussdb-current.log、gaussdb-创建时间.log和system_alarm-创建时间-current.log位于$GAUSSLOG/gs_log。"
  source_anchor: "6.1 页4109-4110"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_cm_agent_paths
  type: syntax
  statement: "cm_agent相关运行/告警/system_call/system_stat日志位于$GAUSSLOG/cm/cm_agent。"
  source_anchor: "6.1 页4110"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_cm_server_paths
  type: syntax
  statement: "cm_server相关运行、key_event和system_alarm日志位于$GAUSSLOG/cm/cm_server。"
  source_anchor: "6.1 页4110"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_om_paths
  type: syntax
  statement: "gs_install、gs_preinstall、gs_om、gs_expand、gs_replace、gs_local、checkRunStatus、JsonToDbclusterInfo、killall_log、uploader、cmd_sender等操作日志位于$GAUSSLOG/om。"
  source_anchor: "6.1 页4110-4111"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_bin_paths
  type: syntax
  statement: "gs_initdb、gs_guc、gs_cgroup、gs_ctl、gs_encrypt、gs_clean、gs_obs.run.log等工具日志位于$GAUSSLOG/bin。"
  source_anchor: "6.1 页4111"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_audit_path
  type: environment
  statement: "审计日志默认在$GAUSSLOG/pg_audit；使用om工具部署时为“$GAUSSLOG/pg_audit/实例名称”，可通过GUC参数audit_directory配置路径。"
  source_anchor: "6.1 页4111"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_wal_path
  type: environment
  statement: "WAL日志pg_xlog位于数据目录/pg_xlog，例如DN实例上为/gaussdb/data/data_dn/pg_xlog。"
  source_anchor: "6.1 页4111"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_memory_log_path
  type: environment
  statement: "内存日志mem_log-创建时间.log位于$GAUSSLOG/mem_log。"
  source_anchor: "6.1 页4111"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_dn_run_format
  type: syntax
  statement: "DN运行日志默认包含时间、节点名、rdsAdmin、用户、主机、线程ID、事务信息、数据库名、连接信息、BACKEND、日志级别和日志内容等字段。"
  source_anchor: "6.2 页4118"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_alarm_format
  type: syntax
  statement: "DN system_alarm日志默认格式为告警ID+告警名称+告警级别+主机所属领域列表+告警来源标识+告警操作类型+告警描述+清除类型+开始时间戳+结束时间戳。"
  source_anchor: "6.2 页4113"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_alarm_clear_type
  type: constraint
  statement: "system_alarm清除类型包括ADAC和ADMC：ADAC可自动检测故障发生和修复；ADMC可自动检测故障发生但无法检测修复情况。"
  source_anchor: "6.2 页4114"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_cm_run_format
  type: syntax
  statement: "cm_agent、cm_server、cm_ctl、om_monitor、gns_server、gns_ctl的运行日志默认格式为日期+时间+线程ID+线程名+日志级别+日志内容；cm_ctl/om_monitor/gns_ctl无线程名。"
  source_anchor: "6.2 页4114-4115"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_system_drop
  type: behavior_oracle
  statement: "系统日志写入异常时默认重试超时60秒，重试仍失败则执行日志丢弃并打印WARNING: logger pipe write failed, dropped a log message。"
  source_anchor: "6.2 页4120"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_operation_log_path
  type: environment
  statement: "操作日志默认在$GAUSSLOG/om和$GAUSSLOG/bin；若$GAUSSLOG不存在或为空，日志不会写入文件，仅打印到屏幕。"
  source_anchor: "6.3 页4120"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_operation_log_rotation
  type: constraint
  statement: "操作日志文件超过16MB时，下一次调用工具会将当前日志重命名为历史日志并生成新的current日志。"
  source_anchor: "6.3 页4120"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_operation_log_format
  type: syntax
  statement: "OM工具日志默认格式为调用链ID+日期时间+线程ID+日志上报位置+线程名+日志级别+[Step*]+日志内容。"
  source_anchor: "6.3 页4121"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_audit_config
  type: environment
  statement: "审计日志由audit_directory指定路径，审计相关行为由audit_enable等GUC参数控制。"
  source_anchor: "6.4 页4124"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_wal_reuse
  type: constraint
  statement: "数据库会复用旧的Xlog日志；重启或重置时，未被重用的Xlog会保留直到wal_keep_segments控制的数量被清理。"
  source_anchor: "6.5 页4127"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_wal_prune
  type: behavior_oracle
  statement: "enable_xlog_prune=on时，若备机断连且Xlog堆积大于max_size_for_xlog_prune（一般256GB），主机会触发Xlog清理。"
  source_anchor: "6.5 页4127"
  source_refs: *refb1
  status: confirmed
- id: logs_wave8_11_memory_log_trigger
  type: behavior_oracle
  statement: "内存日志由memory_trace_level和memory_log_config控制，支持动态内存阈值、内存波动和统计周期触发；阈值、波动和周期触发不会同时进行。"
  source_anchor: "6.6 页4128"
  source_refs: *refb1
  status: confirmed
