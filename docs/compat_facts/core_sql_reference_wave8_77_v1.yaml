facts:
- id: begin_wave8_77_purpose
  type: syntax
  statement: "BEGIN可以用于开始一个匿名块，也可以用于开始一个事务；匿名块是能够动态地创建和执行过程代码的结构，不需要以持久化的方式将代码作为数据库对象储存在数据库中。"
  source_anchor: "1.13.8.1 功能描述 页1362"
  source_refs: &refbegin
  - w8_77_1_13_8_1
  status: confirmed
- id: begin_wave8_77_anonymous_syntax
  type: syntax
  statement: "开启匿名块语法为[DECLARE [declare_statements]] BEGIN execution_statements END; /；declare_statements声明变量（包括变量名和变量类型，如sales_cnt int）；execution_statements为匿名块中需要执行的语句，取值范围为DML操作（SELECT、INSERT、DELETE、UPDATE）或系统表中已注册的函数名称。"
  source_anchor: "1.13.8.1 语法格式/参数说明 页1362-1363"
  source_refs: *refbegin
  status: confirmed
- id: begin_wave8_77_tx_syntax
  type: syntax
  statement: "开启事务语法为BEGIN [WORK | TRANSACTION] [{ISOLATION LEVEL {READ COMMITTED | READ UNCOMMITTED | SERIALIZABLE | REPEATABLE READ} | {READ WRITE | READ ONLY}}[, ...]]；WORK | TRANSACTION为BEGIN语法格式中的可选关键字，没有实际作用。"
  source_anchor: "1.13.8.1 语法格式 页1362-1363"
  source_refs: *refbegin
  status: confirmed
- id: begin_wave8_77_isolation
  type: constraint
  statement: "ISOLATION LEVEL指定事务隔离级别，用于控制并发事务之间的数据可见性；在事务中第一个数据修改语句（INSERT、DELETE、UPDATE、FETCH或COPY）执行之后，事务隔离级别无法再次设置；READ COMMITTED读已提交（未指定隔离级别时默认）；READ UNCOMMITTED行为和READ COMMITTED一致；REPEATABLE READ仅可看到事务开始之前提交的数据；SERIALIZABLE目前不支持，等价于REPEATABLE READ；READ WRITE | READ ONLY指定事务访问模式。"
  source_anchor: "1.13.8.1 参数说明 ISOLATION LEVEL 页1363"
  source_refs: *refbegin
  status: confirmed
- id: begin_wave8_77_example_tx
  type: behavior_oracle
  statement: "示例中BEGIN以默认方式启动事务插入(4,4)后END结束；BEGIN ISOLATION LEVEL REPEATABLE READ以可重复读方式启动事务查询后END。"
  source_anchor: "1.13.8.1 示例 开启事务 页1363"
  source_refs: *refbegin
  status: confirmed
- id: begin_wave8_77_example_anonymous
  type: behavior_oracle
  statement: "匿名块示例：BEGIN dbe_output.print_line('Hello'); END; /使用匿名块输出字符串（相关链接START TRANSACTION）。"
  source_anchor: "1.13.8.1 示例 匿名块 页1363"
  source_refs: *refbegin
  status: confirmed
- id: drop_aggregate_wave8_77_purpose
  type: syntax
  statement: "DROP AGGREGATE从数据库中删除一个聚集函数。"
  source_anchor: "1.13.10.5 功能描述 页1657"
  source_refs: &refdropagg
  - w8_77_1_13_10_5
  status: confirmed
- id: drop_aggregate_wave8_77_privileges
  type: constraint
  statement: "仅聚集函数的所有者可以对该聚集函数进行DROP AGGREGATE操作。"
  source_anchor: "1.13.10.5 注意事项 页1658"
  source_refs: *refdropagg
  status: confirmed
- id: drop_aggregate_wave8_77_syntax
  type: syntax
  statement: "语法为DROP AGGREGATE [IF EXISTS] name (argtype[, ...]) [CASCADE | RESTRICT]；IF EXISTS在聚集函数不存在时不删除仅产生NOTICE提示；name为需要删除的聚集函数，可使用模式具体指定；argtype为聚集函数操作的输入数据类型，零参数聚集函数用*代替输入数据类型列表；CASCADE级联删除依赖对象，RESTRICT（默认）在存在依赖对象时拒绝删除。"
  source_anchor: "1.13.10.5 语法格式/参数说明 页1658"
  source_refs: *refdropagg
  status: confirmed
- id: drop_aggregate_wave8_77_example
  type: behavior_oracle
  statement: "示例中CREATE AGGREGATE myavg(int)（sfunc = int_add, stype = int, initcond = '0'）后DROP AGGREGATE myavg(int)删除聚集函数，再DROP FUNCTION int_add(int,int)清理（相关链接ALTER AGGREGATE、CREATE AGGREGATE）。"
  source_anchor: "1.13.10.5 示例 页1658"
  source_refs: *refdropagg
  status: confirmed
- id: drop_aggregate_wave8_77_compat
  type: constraint
  statement: "SQL标准中没有DROP AGGREGATE语句。"
  source_anchor: "1.13.10.5 兼容性 页1659"
  source_refs: *refdropagg
  status: confirmed
- id: drop_audit_policy_wave8_77_purpose
  type: syntax
  statement: "DROP AUDIT POLICY从数据库中删除一个审计策略。"
  source_anchor: "1.13.10.6 功能描述 页1659"
  source_refs: &refdropaudit
  - w8_77_1_13_10_6
  status: confirmed
- id: drop_audit_policy_wave8_77_priv_syntax
  type: constraint
  statement: "仅POLADMIN、SYSADMIN或初始用户可以执行该操作；语法为DROP AUDIT POLICY [IF EXISTS] policy_name；policy_name为审计策略名称，需满足唯一约束不可重复（字符串，符合标识符命名规范）；IF EXISTS在审计策略不存在时不删除仅产生NOTICE提示。"
  source_anchor: "1.13.10.6 注意事项/语法格式/参数说明 页1659"
  source_refs: *refdropaudit
  status: confirmed
- id: drop_audit_policy_wave8_77_example
  type: behavior_oracle
  statement: "示例中CREATE AUDIT POLICY adt1 PRIVILEGES CREATE后DROP AUDIT POLICY adt1删除成功；删除不存在的adt0报错ERROR: adt0 policy does not exist, drop failed（相关链接ALTER AUDIT POLICY、CREATE AUDIT POLICY）。"
  source_anchor: "1.13.10.6 示例 页1659"
  source_refs: *refdropaudit
  status: confirmed
- id: drop_cast_wave8_77_purpose_priv
  type: constraint
  statement: "DROP CAST删除一个类型转换；仅拥有源数据类型或者目标数据类型的使用权限的用户可以删除一个类型转换，与创建一个类型转换的权限相同。"
  source_anchor: "1.13.10.7 功能描述/注意事项 页1660"
  source_refs: &refdropcast
  - w8_77_1_13_10_7
  status: confirmed
- id: drop_cast_wave8_77_syntax
  type: syntax
  statement: "语法为DROP CAST [IF EXISTS] (source_type AS target_type) [CASCADE | RESTRICT]；IF EXISTS在转换不存在时不删除仅产生NOTICE提示；source_type/target_type为类型转换中的源/目标数据类型；CASCADE和RESTRICT仅适配此语法，无对象依赖于类型转换，二者效果相同；示例参见CREATE CAST章节（相关链接CREATE CAST）。"
  source_anchor: "1.13.10.7 语法格式/参数说明 页1660"
  source_refs: *refdropcast
  status: confirmed
- id: drop_client_master_key_wave8_77_purpose_priv
  type: constraint
  statement: "DROP CLIENT MASTER KEY删除客户端加密主密钥（CMK）；仅客户端加密主密钥所有者或被授予了DROP权限的用户可以执行该操作，系统管理员默认拥有此权限；该命令只能删除数据库中系统表记录的密钥对象元数据信息，无法删除由客户端密钥工具或在线密钥服务中管理的密钥实体。"
  source_anchor: "1.13.10.8 功能描述/注意事项 页1660-1661"
  source_refs: &refdropcmk
  - w8_77_1_13_10_8
  status: confirmed
- id: drop_client_master_key_wave8_77_syntax
  type: syntax
  statement: "语法为DROP CLIENT MASTER KEY [IF EXISTS] client_master_key_name[, ...] [CASCADE | RESTRICT]；IF EXISTS不存在时不删除仅产生NOTICE提示；client_master_key_name取值为已存在的客户端加密主密钥对象名称；CASCADE级联删除依赖对象，RESTRICT（默认）拒绝删除存在依赖对象的密钥（相关链接CREATE CLIENT MASTER KEY）。"
  source_anchor: "1.13.10.8 语法格式/参数说明 页1661"
  source_refs: *refdropcmk
  status: confirmed
- id: drop_column_encryption_key_wave8_77_purpose_priv
  type: constraint
  statement: "DROP COLUMN ENCRYPTION KEY删除一个列加密密钥（CEK）；仅列加密密钥所有者或被授予了DROP权限的用户可以执行该操作，系统管理员默认拥有此权限。"
  source_anchor: "1.13.10.9 功能描述/注意事项 页1661"
  source_refs: &refdropcek
  - w8_77_1_13_10_9
  status: confirmed
- id: drop_column_encryption_key_wave8_77_syntax
  type: syntax
  statement: "语法为DROP COLUMN ENCRYPTION KEY [IF EXISTS] client_column_key_name[, ...] [CASCADE | RESTRICT]；IF EXISTS不存在时不删除仅产生NOTICE提示；client_column_key_name取值为已存在的列加密密钥名称；对于密态特性，级联删除加密列属于危险操作，实际上无法删除依赖于列加密密钥的加密列（相关链接ALTER COLUMN ENCRYPTION KEY、CREATE COLUMN ENCRYPTION KEY）。"
  source_anchor: "1.13.10.9 语法格式/参数说明 页1661-1662"
  source_refs: *refdropcek
  status: confirmed
open_questions:
- id: begin_wave8_77_oq_runtime
  statement: "BEGIN匿名块执行与事务特性、各DROP语句（聚集函数/审计策略/类型转换/密钥对象）在真实权限、依赖对象和密态特性组合下的完整行为与错误矩阵需授权环境实机验证。"
  status: open
