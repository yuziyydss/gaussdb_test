facts:
- id: m_json_append_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_APPEND(json_doc, path, val[, path, val] ...)向json_doc中path指定的路径追加一个值并返回修改后的json（JSON_APPEND是JSON_ARRAY_APPEND的别名行为与JSON_ARRAY_APPEND一致）；规则：path必须为一个数组或对象（数组末尾添加新值、对象key的value末尾添加新值、单独值转换为数组后末尾添加）；json_doc或path为null返回null；json_doc中不存在path则不修改；json_doc格式错误、path非有效路径表达式或path中包含*或**时报错；null值和格式错误场景同时在可变参数列表中按异常先后顺序处理（null在前返回null否则报错）；json_doc深度超过100时报错。示例SELECT json_append('[1, [2, 3]]', '$[1]', 4, '$[0]', false, '$[0]', null, '$[0]', 1)返回[[1, false, null, 1], [2, 3, 4]]。"
  source_anchor: "2.5.12.1 JSON_APPEND 页2416-2417"
  source_refs: &refmjson
  - w8_126_2_5_12
  status: confirmed
- id: m_json_array_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_ARRAY([val[, val] ...])从一个可变参数列表构造出一个数组并返回数组形式的JSON（没有任何参数则返回一个空的数组形式的JSON，返回值JSON）；示例SELECT json_array(TRUE, FALSE, NULL, 114, 'text')返回[true, false, null, 114, \"text\"]。"
  source_anchor: "2.5.12.1 JSON_ARRAY 页2417"
  source_refs: *refmjson
  status: confirmed
- id: m_json_array_append_insert_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_ARRAY_APPEND(json_doc, path, val[, path, val] ...)向json_doc中path指定的路径添加一个值并返回修改后的JSON（path必须为数组或对象：数组末尾添加、对象key的value末尾添加、单独值转数组后添加）；JSON_ARRAY_INSERT(json_doc, path, val[, path, val] ...)在path指定的位置插入值。"
  source_anchor: "2.5.12.1 JSON_ARRAY_APPEND/JSON_ARRAY_INSERT 页2417-2418"
  source_refs: *refmjson
  status: confirmed
- id: m_json_contains_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_CONTAINS(target_json_doc, candidate_json_doc[, path])检查target_json_doc是否包含candidate_json_doc（指定path参数则通过path定位，返回值BIGINT）；JSON_CONTAINS_PATH(json_doc, one_or_all, path [, path [, path …]])在json_doc中查询path指定的位置是否能匹配到子JSON数据（one_or_all控制匹配任一或全部路径，返回值BIGINT）。"
  source_anchor: "2.5.12.1 JSON_CONTAINS/JSON_CONTAINS_PATH 页2418-2419"
  source_refs: *refmjson
  status: confirmed
- id: m_json_depth_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_DEPTH(json_doc)返回一个JSON的最大深度（如果json_doc为null则返回null；json_doc存在错误则报错，返回值BIGINT）。"
  source_anchor: "2.5.12.1 JSON_DEPTH 页2419"
  source_refs: *refmjson
  status: confirmed
- id: m_json_extract_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_EXTRACT(json_doc, path[, path…])在json_doc中根据path提取子JSON数据（path参数可以有多个，提取的子JSON数据拼接成JSON数组返回，仅匹配到一个子JSON数据时直接返回该子JSON数据）；json_doc格式错误报错、为null返回null；path格式错误报错、为null返回null；null值和格式错误场景同时存在按异常先后顺序处理；json_doc深度超过100时报错；示例SELECT json_extract('{\"a\": {\"b\": 2, \"c\": 3}, \"d\": 4}', '$.a')返回{\"b\": 2, \"c\": 3}。"
  source_anchor: "2.5.12.1 JSON_EXTRACT 页2419-2420"
  source_refs: *refmjson
  status: confirmed
- id: m_json_insert_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_INSERT(json_doc, path, val[, path, val] ...)向json_doc中path指定的路径插入一个值并返回修改后的JSON（JSON_INSERT只能将数据插入到不存在的路径中，指定路径上有值则不修改）；示例SELECT json_insert('{\"x\": 1, \"y\": [1, 2]}', '$.x', '2')路径已存在插入不生效返回原json；SELECT json_insert('[1, [2, 3], {\"a\": [4, 5]}]', '$[10]', 10,'$[5]', 5)多个路径按顺序追加返回[1, [2, 3], {\"a\": [4, 5]}, 10, 5]。"
  source_anchor: "2.5.12.1 JSON_INSERT 页2421-2422"
  source_refs: *refmjson
  status: confirmed
- id: m_json_keys_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_KEYS(json_doc[, path])以JSON数组的形式返回json_doc中顶级对象的键key（存在path参数时以JSON数组形式返回path匹配之后的json_doc中顶级对象的键key）；json_doc或path为null、json_doc中不存在path指定路径时返回null；格式错误、无效path、path含*或**报错；深度超过100报错；示例SELECT json_keys('{\"a\": {\"b\": 2, \"c\": 3}, \"d\": 4}')返回[\"a\", \"d\"]。"
  source_anchor: "2.5.12.1 JSON_KEYS 页2422-2423"
  source_refs: *refmjson
  status: confirmed
- id: m_json_length_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_LENGTH(json_doc[,path])返回JSON中指定路径的值的长度（没有指定路径则返回JSON的长度）；json_doc或path为null、json_doc中不存在path指定的路径时结果返回null；格式错误、无效path、path含*或**报错；深度超过100报错（返回值BIGINT）。"
  source_anchor: "2.5.12.1 JSON_LENGTH 页2423"
  source_refs: *refmjson
  status: confirmed
- id: m_json_merge_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_MERGE(json_doc, json_doc[, json_doc] ...)合并多个json_doc：两个数组合并为一个数组保留所有元素（json_merge('[1, 2]','[2, 3]')返回[1, 2, 2, 3]）；一个纯值会被包装成一个数组并作为数组进行合并（纯值入参必须用单引号引起来，json_merge('[3, 2]','1')返回[3, 2, 1]）；两个对象合并为一个对象保留所有的键和值（对象组合时会重新排序）；对象和数组合并时会将对象包装到一个数组中并作为数组进行合并（json_merge('{\"b\":\"2\"}','{\"a\":\"1\"}','[1,2]')返回[{\"a\": \"1\", \"b\": \"2\"}, 1, 2]）。"
  source_anchor: "2.5.12.1 JSON_MERGE 页2423-2424"
  source_refs: *refmjson
  status: confirmed
- id: m_json_merge_patch_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_MERGE_PATCH(json_doc, json_doc[, json_doc] ...)对两个或多个json_doc执行符合RFC 7396标准的合并并返回合并后的结果（不保留具有重复键的成员）；作为参数传递的json_doc中至少有一个无效则产生报错；json_doc深度超过100时报错；示例SELECT json_merge_patch('{\"b\":\"2\"}','{\"a\":\"1\"}')返回{\"a\": \"1\", \"b\": \"2\"}、json_merge_patch('{\"b\":\"2\"}','{\"a\":\"1\"}','[1,2]')返回[1, 2]。"
  source_anchor: "2.5.12.1 JSON_MERGE_PATCH 页2424"
  source_refs: *refmjson
  status: confirmed
- id: m_json_merge_preserve_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_MERGE_PRESERVE(json_doc, json_doc[, json_doc] ...)将所有传入的json进行合并并返回合并后的结果（入参个数大于等于2时JSON对象从可变参数列表中构造）；入参中有null返回null；null值和格式错误场景同时存在按异常先后顺序处理；深度超过100报错；两个数组合并保留所有数组中的元素（json_merge_preserve('[1, 2]','[2]')返回[1, 2, 2]）；纯值包装成数组合并（json_merge_preserve('[3, 2]','1')返回[3, 2, 1]）。"
  source_anchor: "2.5.12.1 JSON_MERGE_PRESERVE 页2424-2425"
  source_refs: *refmjson
  status: confirmed
- id: m_json_object_pretty_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_OBJECT([key, val[, key1, val1] ...])从键值对列表构造JSON对象；JSON_PRETTY(json_val)将JSON格式化输出（示例json_pretty('{\"name\":\"Tom\", \"age\":24, \"like\":\"football\"}')按key排序后带缩进输出age/like/name）。"
  source_anchor: "2.5.12.1 JSON_OBJECT/JSON_PRETTY 页2424-2426"
  source_refs: *refmjson
  status: confirmed
- id: m_json_quote_unquote_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_QUOTE(str)使用双引号将入参str引用后输出使其成为一个JSON字符串值（返回值TEXT，示例json_quote('123')返回\"123\"、json_quote('\"1\"')返回\"\\\"1\\\"\"）；JSON_UNQUOTE(json_val)取消双引号引用JSON值并将结果作为字符串返回（返回值TEXT，示例json_unquote('\"abc\"')返回abc）。"
  source_anchor: "2.5.12.1 JSON_QUOTE/JSON_UNQUOTE 页2426-2428"
  source_refs: *refmjson
  status: confirmed
- id: m_json_remove_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_REMOVE(json_doc, path[, path] ...)将json_doc中path指定路径上的值删除并返回修改后的JSON（json_doc中不存在指定的路径则不修改；入参中存在多个path时较后的path会以删除过的json_doc为基准继续执行删除操作）；json_doc或path为null返回null；格式错误、无效path、path含*或**报错；存在path路径不存在、null值和格式错误场景同时在可变参数列表中按异常先后顺序处理；深度超过100报错；示例SELECT json_remove('{\"A\":1, \"B\":2}', '$.C')删除不存在的路径直接返回原json。"
  source_anchor: "2.5.12.1 JSON_REMOVE 页2426-2427"
  source_refs: *refmjson
  status: confirmed
- id: m_json_replace_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_REPLACE(json_doc, path, val[, path, val] ...)将json_doc中path指定路径上的值替换成新值并返回修改后的JSON（path为json_doc中不存在的路径时不修改原样返回json_doc；value为字符串时会将其作为字符串写入JSON）；可以对同一个路径做多次修改按参数从左往右的顺序执行最终结果以最后一次处理为准（示例json_replace('{\"x\": 1}', '$.x', true, '$.x', 123, '$.x', 'asd', '$.x', null)返回{\"x\": null}）。"
  source_anchor: "2.5.12.1 JSON_REPLACE 页2427-2428"
  source_refs: *refmjson
  status: confirmed
- id: m_json_search_set_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_SEARCH(json_doc, one_or_all, search_str[, escape_char[, path]...])返回json_doc中出现指定字符串search_str的位置（返回值JSON）；JSON_SET(json_doc, path, val[, path, val] ...)向path指定的路径插入一个值或将指定路径上的值替换成新值（指定的路径上有值则替换成新值，路径不存在则插入数据）；输入多个path-value对时json_set()按顺序进行set操作（同一个不存在的路径两次set第一次新增第二次修改值），示例json_set('{\"s\":3}','$.a','d','$.a','1')返回{\"a\": \"1\", \"s\": 3}。"
  source_anchor: "2.5.12.1 JSON_SEARCH/JSON_SET 页2427-2429"
  source_refs: *refmjson
  status: confirmed
- id: m_json_storage_type_valid_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON_STORAGE_SIZE(json_val)用于计算JSON数据类型的二进制大小（json_val格式错误报错、为null返回null、深度超过100报错；返回值BIGINT，示例json_storage_size('{ \"a\" : 100, \"b\" : 200 }')返回58）；JSON_TYPE(json_doc)返回一个给定的JSON值的类型（入参必须带单引号，不接受数值类型的入参，入参为字符类型需添加双引号，返回值TEXT如OBJECT、INTEGER、STRING）；JSON_VALID(str)判断指定入参是否为合法JSON（有效返回1无效返回0、入参为null返回null，返回值BIGINT；示例json_valid('{\"name\":\"tom\"}')返回1、json_valid('[}')返回0、json_valid(1)返回0）。"
  source_anchor: "2.5.12.1 JSON_STORAGE_SIZE/JSON_TYPE/JSON_VALID 页2429-2431"
  source_refs: *refmjson
  status: confirmed
- id: m_json_arrow_ops_wave8_126_syntax
  type: syntax
  statement: "M兼容JSON操作符：->操作符查询JSON中指定位置的数据返回带引号的查询结果（示例SELECT id,category->>'$.id',category->>'$.name',tags->>'$[0]',tags->>'$[2]' FROM muscleape）；->>操作符查询JSON中指定位置的数据返回不带引号的查询结果；如果->>操作符左侧的数据执行了::JSON强制类型转换，其实际转换的JSON类型与GUC参数m_format_behavior_compat_options兼容性选项是否设置了cast_as_new_json有关。"
  source_anchor: "2.5.12.2 JSON操作符 页2431-2432"
  source_refs: *refmjson
  status: confirmed
- id: m_json_comparison_wave8_126_syntax
  type: constraint
  statement: "M兼容JSON类型之间的比较操作符支持=、<=>、<>、<、<=、>和>=运算（返回结果为true或false；JSON类型和其他类型进行比较时会将其他类型转换为JSON类型后再比较）；JSON类型的排序规则：首先比较JSON数据的类型，类型优先级为OPAQUE > TIMESTAMP = DATETIME > TIME > DATE > BOOL > 数组 > 对象 > 字符串类型 > DOUBLE = UINT = INT = DECIMAL > NULL（结果相等则比较内容）；标量之间比较值的大小（OPAQUE先进行类型之间的比较：TYPE_STRING > TYPE_VAR_STRING > TYPE_BLOB > TYPE_BIT > TYPE_VARCHAR > TYPE_YEAR，类型相同时依次比较每个字节的大小）；数组之间依次比较元素的大小（其中一个数组的元素比较完之后元素个数多的大）；对象之间比较长度（长度相等则依次比较每个键值对，先比较键key再比较值value）。"
  source_anchor: "2.5.12.2 比较操作符 页2432-2433"
  source_refs: *refmjson
  status: confirmed
