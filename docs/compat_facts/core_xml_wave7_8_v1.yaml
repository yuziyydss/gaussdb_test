facts:
- id: xml_wave7_8_common_boundaries
  type: constraint
  statement: "XML类型函数受xmloption影响；xmloption为content时XML声明中的encoding值可为任意值；XML嵌套层数最大不能超过256层。"
  source_anchor: "1.6.43 页952"
  source_refs: &ref431
  - w7_8_1_6_43
  status: confirmed
- id: xml_wave7_8_parse_serialize
  type: syntax
  statement: "xmlparse({DOCUMENT|CONTENT}value[wellformed])解析XML；xmlserialize({DOCUMENT|CONTENT}value AS type)序列化XML。"
  source_anchor: "1.6.43 页952"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_comment_concat
  type: syntax
  statement: "xmlcomment(text)生成XML注释；xmlconcat(xml[,...])连接多个XML值。"
  source_anchor: "1.6.43 页953"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_element_attributes
  type: syntax
  statement: "xmlelement([ENTITYESCAPING|NOENTITYESCAPING]{[NAME]name[,xml_attributes][,content]})构造XML元素；xmlattributes根据参数构造元素属性。"
  source_anchor: "1.6.43 页954-955"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_element_escape
  type: behavior_oracle
  statement: "xmlelement和xmlattributes的name字段赋NULL时行为与A数据库不一致；设置特定A兼容参数后xmlelement内容转义规则为A兼容，未设置时使用GaussDB规则。"
  source_anchor: "1.6.43 页955"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_forest_pi_root_agg
  type: syntax
  statement: "xmlforest(content[AS name][,...])生成森林；xmlpi(name target[,content])生成处理指令；xmlroot(xml,version|no value[,standalone])设置根节点；xmlagg(xml[order_by_clause])聚合XML。"
  source_anchor: "1.6.43 页955-957"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_exists_wellformed
  type: syntax
  statement: "xmlexists(text PASSING [BY REF]xml[BY REF])判断XPath是否存在结果；xml_is_well_formed、xml_is_well_formed_document和xml_is_well_formed_content分别检查文本、文档和content格式。"
  source_anchor: "1.6.43 页957"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_xpath_functions
  type: syntax
  statement: "xpath(xpath,xml[,nsarray])和xpath_exists(xpath,xml[,nsarray])执行XPath查询和存在性判断。"
  source_anchor: "1.6.43 页958"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_query_cursor_mapping
  type: syntax
  statement: "query_to_xml和cursor_to_xml将查询/游标结果映射为XML；query_to_xmlschema和cursor_to_xmlschema返回对应XMLSchema；query_to_xml_and_xmlschema返回结果和Schema。"
  source_anchor: "1.6.43 页958-961"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_schema_database_mapping
  type: syntax
  statement: "schema_to_xml/schema_to_xmlschema/schema_to_xml_and_xmlschema和database_to_xml/database_to_xmlschema/database_to_xml_and_xmlschema分别将Schema或数据库映射为XML、XMLSchema或两者。"
  source_anchor: "1.6.43 页961-965"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_table_mapping
  type: syntax
  statement: "table_to_xml、table_to_xmlschema和table_to_xml_and_xmlschema将表映射为XML、XMLSchema或两者，入参包括tbl、nulls、tableforest和targetns。"
  source_anchor: "1.6.43 页965-967"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_xpath_limitations
  type: environment
  statement: "XPath相关函数仅支持xpath和xpath_exists；不支持xquery、xml extension和xslt功能。"
  source_anchor: "1.6.43 页967"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_value_functions
  type: syntax
  statement: "getclobval(xml)返回CLOB值；getstringval(xml)返回字符串值；xmlsequence(xml)将XML转换为序列。"
  source_anchor: "1.6.43 页967-969"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_cast
  type: syntax
  statement: "xmlcast(value_expression AS datatype)执行XML类型转换，仅在A兼容模式下支持。"
  source_anchor: "1.6.43 页969"
  source_refs: *ref431
  status: confirmed
- id: xml_wave7_8_cast_limitations
  type: constraint
  statement: "xmlcast的劣构XML文档仅支持value_expression返回多根节点XML；升级观察期不支持使用；部分密态类型等目标数据类型不支持转换。"
  source_anchor: "1.6.43 页969"
  source_refs: *ref431
  status: confirmed
- id: xmltype_wave7_8_constructors
  type: syntax
  statement: "XMLTYPE支持createxml和xmltype从varchar2、clob或blob构造；blob参数最大256MB-1；字符集id范围见对应章节限制。"
  source_anchor: "1.6.44 页969-974"
  source_refs: &ref441
  - w7_8_1_6_44
  status: confirmed
- id: xmltype_wave7_8_constructor_boundaries
  type: behavior_oracle
  statement: "PL/SQL中createxml/xmltype允许空串入参并返回NULL；字符串encoding仅支持UTF-8、GBK、ZHS16GBK和LATIN1~LATIN10；version字段限制见原文。"
  source_anchor: "1.6.44 页970-973"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_method_calls
  type: environment
  statement: "本章入参为xmltype的函数支持xmltype().func()方式调用；存储过程内支持xmltype变量以a.func()方式调用，该语法支持一层嵌套。"
  source_anchor: "1.6.44 页970"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_getters
  type: syntax
  statement: "XMLTYPE提供getblobval、getclobval、getnumberval、getstringval、getrootelement和getnamespace获取对应值或元素/命名空间信息。"
  source_anchor: "1.6.44 页971-975"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_isfragment
  type: syntax
  statement: "isfragment(xmltype)判断XMLTYPE是否为片段。"
  source_anchor: "1.6.44 页972"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_path_functions
  type: syntax
  statement: "existsnode(xmltype,varchar2[,varchar2])判断节点存在；extractxml提取XML片段；extractvalue提取节点值；支持命名空间参数。"
  source_anchor: "1.6.44 页975-976"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_path_boundaries
  type: constraint
  statement: "extractvalue需保证返回节点值唯一；XPath仅支持1.0；不支持命名空间URL为空格及部分命名空间表达式；默认命名空间以最先声明者为当前XML文本默认命名空间。"
  source_anchor: "1.6.44 页977"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_extract_mode
  type: constraint
  statement: "部分XMLTYPE路径函数仅在O模式且设置a_format_version='10c'等兼容参数时支持。"
  source_anchor: "1.6.44 页977"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_sequence
  type: syntax
  statement: "xmlsequence(xmltype)将XMLTYPE转换为序列。"
  source_anchor: "1.6.44 页978"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_cast
  type: syntax
  statement: "xmlcast(value_expression AS datatype)执行XMLTYPE类型转换，仅在A兼容模式下支持。"
  source_anchor: "1.6.44 页979"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_cast_limitations
  type: constraint
  statement: "xmlcast劣构XML仅支持value_expression返回多根节点XML；升级观察期不支持；部分密态类型等目标数据类型不支持转换。"
  source_anchor: "1.6.44 页979"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_query_sequence
  type: syntax
  statement: "xmlquery(sequence_string RETURNING SEQUENCE)生成序列，仅A兼容模式支持；仅支持'a to b'字符串且仅XMLTABLE中使用，范围见int64限制；升级观察期不支持。"
  source_anchor: "1.6.44 页980"
  source_refs: *ref441
  status: confirmed
- id: xmltype_wave7_8_query_xpath
  type: syntax
  statement: "xmlquery(xpath_string PASSING document_expression RETURNING SEQUENCE)执行XMLQuery，仅支持XPath 1.0，不支持XQuery表达式，仅A兼容模式且升级观察期不支持。"
  source_anchor: "1.6.44 页980"
  source_refs: *ref441
  status: confirmed
