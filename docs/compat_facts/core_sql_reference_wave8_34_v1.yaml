facts:
- id: view_wave8_34_purpose
  type: syntax
  statement: "CREATE VIEW创建虚拟表，数据库只保存视图定义不保存数据；查询结果随基表数据变化。视图可封装复杂SQL、隐藏基表字段并简化权限管理。"
  source_anchor: "1.13.9.60 页1636"
  source_refs: &refb1
  - w8_34_1_13_9_60
  status: confirmed
- id: view_wave8_34_permissions
  type: constraint
  statement: "被授予CREATE ANY TABLE权限的用户可在public模式和用户模式下创建视图；非初始用户不允许对SYS、DBE_PERF和INFORMATION_SCHEMA模式下的系统视图执行CREATE OR REPLACE。"
  source_anchor: "1.13.9.60 注意事项 页1636"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_main_syntax
  type: syntax
  statement: "CREATE VIEW支持OR REPLACE、TEMP/TEMPORARY、FORCE、视图名、字段名列表、WITH视图选项、AS query，并可指定WITH [CASCADED|LOCAL] CHECK OPTION或WITH READ ONLY。"
  source_anchor: "1.13.9.60 语法格式 页1636"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_or_replace
  type: syntax
  statement: "OR REPLACE用于视图已存在时重新定义视图；示例中可改变视图基表、删除/增加列、改变列类型或重命名列。"
  source_anchor: "1.13.9.60 OR REPLACE页1637与示例 页1639-1640"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_temp
  type: syntax
  statement: "TEMP/TEMPORARY创建临时视图，当前会话结束自动删除；如果视图引用的任何表是临时表，即使未显式指定TEMP/TEMPORARY，视图也会创建为临时视图。"
  source_anchor: "1.13.9.60 TEMP/TEMPORARY 页1637"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_force
  type: syntax
  statement: "FORCE指定创建视图时，即使依赖对象不存在或缺少查询权限，视图仍能创建成功。"
  source_anchor: "1.13.9.60 FORCE 页1637"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_names_options
  type: syntax
  statement: "view_name可用模式修饰；column_name可选，未给出时取查询字段名；视图选项当前仅支持security_barrier和check_option，security_barrier取Boolean值，check_option取CASCADED或LOCAL。"
  source_anchor: "1.13.9.60 view_name/view_option 页1637"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_security_barrier
  type: syntax
  statement: "WITH (security_barrier)创建相对安全视图，避免攻击者利用低成本函数的RAISE语句打印隐藏基表数据。"
  source_anchor: "1.13.9.60 语法说明 页1636"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_partition_oid_dependency
  type: behavior_oracle
  statement: "若query包含指定分区表分区的子句，创建视图会把指定分区OID直接写入系统表；DROP/SPLIT/MERGE等导致分区OID变更的分区DDL会使依赖视图失效。"
  source_anchor: "1.13.9.60 query须知 页1637"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_nested_invalidation
  type: constraint
  statement: "对嵌套视图中被依赖视图修改列名、列类型或删除列，无论enable_view_invalidation是否开启，都会导致依赖视图失效。"
  source_anchor: "1.13.9.60 语法说明 页1636"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_check_option
  type: syntax
  statement: "WITH CHECK OPTION要求对视图的INSERT/UPDATE检查新行满足视图定义条件并可被视图看到，否则拒绝修改；未指定该选项时允许通过视图INSERT/UPDATE创建视图不可见的行。"
  source_anchor: "1.13.9.60 CHECK OPTION 页1637"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_check_option_scopes
  type: syntax
  statement: "CASCADED检查当前视图和所有底层视图条件；LOCAL只检查视图自身直接定义条件，除非底层视图也定义CHECK OPTION。仅声明CHECK OPTION未声明LOCAL/CASCADED时默认CASCADED。"
  source_anchor: "1.13.9.60 CHECK OPTION 页1637"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_read_only
  type: syntax
  statement: "WITH READ ONLY定义只读视图，无法对其执行INSERT、UPDATE和DELETE。"
  source_anchor: "1.13.9.60 WITH READ ONLY 页1638"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_key_preserved
  type: constraint
  statement: "连接视图的多表DML受保留键表限制；源表每行与视图行一一对应时为保留键表。当前仅支持通过JOIN条件判断保留键表，不支持JOIN条件和WHERE条件联合形成的等价类判断。"
  source_anchor: "1.13.9.60 更新约束概念 页1638"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_updatable_view
  type: constraint
  statement: "可更新视图不包含DISTINCT、GROUP BY、HAVING、LIMIT、OFFSET、UNPIVOT、FOR UPDATE、FETCH、START WITH CONNECT BY、集合运算、聚集函数、窗口函数、返回集合函数或闪回；可更新列是非系统列/whole-row reference且直接引用基表用户列的列。"
  source_anchor: "1.13.9.60 可更新视图/可更新列 页1638"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_metadata_query
  type: syntax
  statement: "information_schema.columns.is_updatable可确认列是否可更新；information_schema.views.is_updatable表示是否可更新/删除，is_insertable_into表示是否可插入；information_schema.tables.is_insertable_into表示关系是否可插入。"
  source_anchor: "1.13.9.60 可更新视图 页1638与示例 页1641-1642"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_instead_check
  type: constraint
  statement: "可更新视图拥有INSTEAD OF触发器或INSTEAD规则时，CHECK OPTION不检查该视图条件；底层视图有INSTEAD OF触发器且顶层为CASCADED时，非A模式递归到该底层视图为止并不检查其条件，A模式下所有视图CHECK OPTION失效。有INSTEAD规则导致INSERT/UPDATE重写时，CHECK OPTION不检查所有视图条件。"
  source_anchor: "1.13.9.60 CHECK OPTION约束 页1638"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_cascade_override
  type: constraint
  statement: "上层视图定义CASCADED CHECK OPTION且底层视图定义LOCAL CHECK OPTION时，底层LOCAL会被上层CASCADED覆盖。"
  source_anchor: "1.13.9.60 CHECK OPTION约束 页1638"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_connection_columns
  type: constraint
  statement: "指定CHECK OPTION时，无法对多表连接视图或多表连接子查询中的连接列执行插入/更新；若连接视图/子查询出现重复基表且重复基表不都是保留键表，则无法执行删除。"
  source_anchor: "1.13.9.60 CHECK OPTION约束 页1638"
  source_refs: *refb1
  status: confirmed
- id: view_wave8_34_dml_examples
  type: behavior_oracle
  statement: "单表视图vt可INSERT/UPDATE/DELETE；vt_wco插入不满足视图条件的行报“New row violates WITH CHECK OPTION”。嵌套顶层视图vvtt未显式声明CHECK OPTION时information_schema.views.check_option为NONE，但底层vt_wco为CASCADED时会继续检查并拒绝违规插入。"
  source_anchor: "1.13.9.60 示例 页1641-1642"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: view_wave8_34_oq_runtime
  statement: "CREATE VIEW在真实依赖变更、分区OID失效、CHECK OPTION、INSTEAD触发器/规则和保留键表组合下的重编译与DML矩阵需授权环境实机验证。"
  status: open
