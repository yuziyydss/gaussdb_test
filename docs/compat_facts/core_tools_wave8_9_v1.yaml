facts:
- id: tools_wave8_9_overview
  type: syntax
  statement: "数据库升级工具包括gs_hotpatch、gs_upgradectl和omRollback.py。"
  source_anchor: "5.9.1 页3991"
  source_refs: &refb1
  - w8_9_5_9
  status: confirmed
- id: tools_wave8_9_hotpatch_scope
  type: constraint
  statement: "gs_hotpatch用于为节点内所有DN实例应用热补丁；集中式单节点不支持该工具。"
  source_anchor: "5.9.2 页3991-3992"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_hotpatch_modes
  type: syntax
  statement: "gs_hotpatch支持load、unload、active、deactive、info、list、recover、cleanLock和setLock。"
  source_anchor: "5.9.2 页3992"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_hotpatch_params
  type: syntax
  statement: "gs_hotpatch的-n PATCH_NAME需为热补丁文件绝对路径；-X XMLFILE和-S SOURCE_IP仅OM热补丁使用。"
  source_anchor: "5.9.2 页3992"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_hotpatch_single_node
  type: constraint
  statement: "gs_hotpatch仅操作单个节点上的实例，除特殊情况不建议直接使用；操作热补丁建议使用gs_om -t hotpatch。"
  source_anchor: "5.9.2 页3992"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_upgrade_modes
  type: syntax
  statement: "gs_upgradectl支持就地升级、灰度升级和滚动升级；策略分为大版本升级和小版本升级。"
  source_anchor: "5.9.3 页3992-3993"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_inplace_stop_business
  type: constraint
  statement: "就地升级需要停止业务并一次性升级数据库实例中所有节点；灰度升级支持全业务操作。"
  source_anchor: "5.9.3 页3993"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_grey_upgrade
  type: syntax
  statement: "灰度升级支持先升级部分节点，进入灰度观察期后再升级剩余节点；可使用-g NODENUMBER或-h HOSTNAME选择首批节点。"
  source_anchor: "5.9.3 页3992-3995"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_rolling_upgrade
  type: syntax
  statement: "滚动升级通过滚动升级DN分片完成，可指定部分DN分片先升级，也可一次升级所有分片。"
  source_anchor: "5.9.3 页3993"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_upgrade_conflicts
  type: constraint
  statement: "升级操作不能和节点替换同时执行，不支持虚拟IP，升级过程中不允许打开kerberos开关。"
  source_anchor: "5.9.3 页3993"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_roach_backup
  type: constraint
  statement: "就地升级不支持roach备份；灰度升级观察期支持roach备份；灰度升级部分节点时参与备份节点的大版本必须一致。"
  source_anchor: "5.9.3 页3993"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_upgrade_precondition
  type: constraint
  statement: "升级前数据库实例运行正常且主DN数据完全同步到备DN。"
  source_anchor: "5.9.3 页3993"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_upgrade_commands
  type: syntax
  statement: "gs_upgradectl支持chose-strategy、auto-upgrade、auto-rollback、commit-upgrade、component-upgrade和component-rollback。"
  source_anchor: "5.9.3 页3994-3995"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_commit_irreversible
  type: constraint
  statement: "commit-upgrade适用于就地升级、灰度升级和滚动升级；一旦提交完成，不能再执行回滚操作。"
  source_anchor: "5.9.3 页3995"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_component_upgrade
  type: syntax
  statement: "gs_upgradectl支持component-upgrade和component-rollback，通过--component-type和--component-version指定组件升级。"
  source_anchor: "5.9.3 页3995"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_admin_password_stdin
  type: environment
  statement: "云上环境未开启Peer认证时，可通过echo password | gs_upgradectl -t ...传入数据库管理员密码。"
  source_anchor: "5.9.3 页3995"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_grey_limits
  type: constraint
  statement: "灰度升级选择部分节点时-g不能超过5；选择全部节点时-g为实例全部节点个数；-h支持逗号分隔主机名。"
  source_anchor: "5.9.3 页3995"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_rollback_modes
  type: behavior_oracle
  statement: "auto-rollback用于撤销成功或失败的升级操作；--force用于实例状态不正常或二进制损坏导致的多数派进程故障场景强制回滚或小版本强制升级。"
  source_anchor: "5.9.3 页3996"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_dr_flags
  type: constraint
  statement: "--force_commit用于容灾场景强制提交主实例操作；--hadr_force在主备容灾关系断连时强制回滚主实例并跳过从灾备实例build升级phase_info文件。"
  source_anchor: "5.9.3 页3996"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_9_om_rollback
  type: syntax
  statement: "omRollback.py用于agent模式部署数据库时回滚代码；执行方式为python3 path_name/common/omRollback.py cluster_mode。"
  source_anchor: "5.9.4 页4023-4024"
  source_refs: *refb1
  status: confirmed
open_questions:
