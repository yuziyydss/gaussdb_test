facts:
- id: set_role_wave8_69_purpose
  type: syntax
  statement: "SET ROLE用于设置当前会话的当前用户标识符。"
  source_anchor: "1.13.19.7 功能描述 页1857"
  source_refs: &refsetrole
  - w8_69_1_13_19_7
  status: confirmed
- id: set_role_wave8_69_membership
  type: constraint
  statement: "当前会话的用户必须是指定的rolename角色的成员；系统管理员可以选择任何角色。"
  source_anchor: "1.13.19.7 注意事项 页1857"
  source_refs: *refsetrole
  status: confirmed
- id: set_role_wave8_69_inherits
  type: constraint
  statement: "SET ROLE可能增加也可能限制用户权限：如果会话用户的角色有INHERITS属性，它自动拥有能SET ROLE变成的角色的所有权限，此时SET ROLE实际删除了所有直接赋予会话用户的权限及所属角色的权限，只剩指定角色的权限；如果会话用户的角色有NOINHERITS属性，SET ROLE删除直接赋予会话用户的权限，而获取指定角色的权限。"
  source_anchor: "1.13.19.7 注意事项 页1857"
  source_refs: *refsetrole
  status: confirmed
- id: set_role_wave8_69_ldap
  type: constraint
  statement: "当用户被配置为通过LDAP方式进行登录认证时，无法通过SET ROLE操作设置用户标识符为该用户。"
  source_anchor: "1.13.19.7 注意事项 页1857"
  source_refs: *refsetrole
  status: confirmed
- id: set_role_wave8_69_syntax
  type: syntax
  statement: "语法：SET [SESSION | LOCAL] ROLE role_name PASSWORD 'password'设置当前会话的当前用户标识符；RESET ROLE重置当前用户标识为当前会话用户标识符；SESSION声明只对当前会话起作用且为缺省值；LOCAL只在当前事务中有效；role_name取值为数据库中已存在的用户名；password为角色密码，要求符合密码命名规则。"
  source_anchor: "1.13.19.7 语法格式/参数说明 页1857-1858"
  source_refs: *refsetrole
  status: confirmed
- id: set_role_wave8_69_ciphertext
  type: constraint
  statement: "SET ROLE使用密文密码限制：管理员用户不能使用密文密码切换到其他管理员用户，只能向权限更低用户切换；使用密文密码通常用于gs_dump、gs_dumpall导出场景，其他场景不建议直接使用密文密码。"
  source_anchor: "1.13.19.7 参数说明 password 说明 页1858"
  source_refs: *refsetrole
  status: confirmed
- id: set_role_wave8_69_example
  type: behavior_oracle
  statement: "示例中SELECT SESSION_USER, CURRENT_USER均为omm；CREATE ROLE paul并SET ROLE paul PASSWORD后SESSION_USER仍为omm而CURRENT_USER变为paul；RESET ROLE后恢复为omm（相关参考SET SESSION AUTHORIZATION）。"
  source_anchor: "1.13.19.7 示例 页1858-1859"
  source_refs: *refsetrole
  status: confirmed
- id: set_session_auth_wave8_69_purpose
  type: syntax
  statement: "SET SESSION AUTHORIZATION把当前会话里的会话用户标识和当前用户标识都设置为指定的用户。"
  source_anchor: "1.13.19.8 功能描述 页1859"
  source_refs: &refsessauth
  - w8_69_1_13_19_8
  status: confirmed
- id: set_session_auth_wave8_69_privileges
  type: constraint
  statement: "只有在初始会话用户有系统管理员权限的时候，会话用户标识符才能改变；否则，只有在指定了被认证的用户名的情况下，系统才接受该命令。"
  source_anchor: "1.13.19.8 注意事项 页1859"
  source_refs: *refsessauth
  status: confirmed
- id: set_session_auth_wave8_69_ldap
  type: constraint
  statement: "当用户被配置为通过LDAP方式进行登录认证时，无法通过SET SESSION AUTHORIZATION操作设置用户标识符为该用户。"
  source_anchor: "1.13.19.8 注意事项 页1859"
  source_refs: *refsessauth
  status: confirmed
- id: set_session_auth_wave8_69_syntax
  type: syntax
  statement: "语法：SET [SESSION | LOCAL] SESSION AUTHORIZATION role_name PASSWORD 'password'为当前会话设置会话用户标识符和当前用户标识符；SET [SESSION | LOCAL] SESSION AUTHORIZATION DEFAULT或RESET SESSION AUTHORIZATION重置会话和当前用户标识符为初始认证的用户名；SESSION声明只对当前会话起作用，LOCAL只在当前事务中有效；role_name取值为数据库中已存在的用户名；password为角色密码，要求符合密码命名规则；DEFAULT重置为初始认证的用户名。"
  source_anchor: "1.13.19.8 语法格式/参数说明 页1859-1860"
  source_refs: *refsessauth
  status: confirmed
- id: set_session_auth_wave8_69_ciphertext
  type: constraint
  statement: "SET SESSION AUTHORIZATION使用密文密码限制：管理员用户不能使用密文密码切换到其他管理员用户，只能向权限更低用户切换；使用密文密码通常用于gs_dump、gs_dumpall导出场景，其他场景不建议直接使用密文密码。"
  source_anchor: "1.13.19.8 参数说明 password 说明 页1860"
  source_refs: *refsessauth
  status: confirmed
- id: set_session_auth_wave8_69_example
  type: behavior_oracle
  statement: "示例中SET SESSION AUTHORIZATION paul PASSWORD后SESSION_USER和CURRENT_USER均变为paul；RESET SESSION AUTHORIZATION后恢复为omm/omm（相关参考SET ROLE）。"
  source_anchor: "1.13.19.8 示例 页1860"
  source_refs: *refsessauth
  status: confirmed
- id: set_transaction_wave8_69_purpose
  type: syntax
  statement: "SET TRANSACTION设置事务特性，包括事务隔离级别、事务访问模式（读/写或者只读）；可以设置当前事务的特性（LOCAL）、会话的默认事务特性（SESSION），也可以设置当前数据库的全局会话的事务特性（GLOBAL）。"
  source_anchor: "1.13.19.9 功能描述 页1860"
  source_refs: &refsettx
  - w8_69_1_13_19_9
  status: confirmed
- id: set_transaction_wave8_69_timing
  type: constraint
  statement: "设置当前事务特性需要在事务中执行（即执行SET TRANSACTION之前需要执行START TRANSACTION或者BEGIN），否则设置不生效；设置当前数据库全局会话（GLOBAL）的事务特性在重新连接后生效。"
  source_anchor: "1.13.19.9 注意事项 页1860"
  source_refs: *refsettx
  status: confirmed
- id: set_transaction_wave8_69_syntax
  type: syntax
  statement: "语法为{SET [LOCAL | SESSION | GLOBAL] TRANSACTION | SET SESSION CHARACTERISTICS AS TRANSACTION} {ISOLATION LEVEL {READ COMMITTED | READ UNCOMMITTED | SERIALIZABLE | REPEATABLE READ} | {READ WRITE | READ ONLY}}。"
  source_anchor: "1.13.19.9 语法格式 页1861"
  source_refs: *refsettx
  status: confirmed
- id: set_transaction_wave8_69_scopes
  type: constraint
  statement: "作用域：LOCAL只在当前事务中有效；SESSION只对当前会话起作用，SET SESSION TRANSACTION语句需要在sql_compatibility='B'场景下设置GUC参数b_format_behavior_compat_options为set_session_transaction后生效，作用等同于SET SESSION CHARACTERISTICS AS TRANSACTION；GLOBAL对当前数据库的全局会话生效，作用范围在sql_compatibility='B'场景下生效，对后续连接的会话生效。"
  source_anchor: "1.13.19.9 参数说明 LOCAL/SESSION/GLOBAL 页1861"
  source_refs: *refsettx
  status: confirmed
- id: set_transaction_wave8_69_isolation_timing
  type: constraint
  statement: "隔离级别设置时机：在事务中第一个数据修改语句（SELECT、INSERT、DELETE、UPDATE、FETCH、COPY）执行之后，当前事务的隔离级别就不能再次设置；事务块内SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL对当前事务不生效，需要COMMIT之后才生效。"
  source_anchor: "1.13.19.9 参数说明 ISOLATION LEVEL 说明 页1861"
  source_refs: *refsettx
  status: confirmed
- id: set_transaction_wave8_69_levels
  type: constraint
  statement: "隔离级别取值：READ COMMITTED读已提交，只能读到已提交数据（缺省值）；READ UNCOMMITTED指定后行为和READ COMMITTED一致；REPEATABLE READ仅仅能看到事务开始之前提交的数据，不能看到未提交数据及事务执行期间其它并发事务提交的修改；SERIALIZABLE目前功能上不支持，等价于REPEATABLE READ；READ WRITE | READ ONLY指定事务访问模式（读/写或只读）。"
  source_anchor: "1.13.19.9 参数说明 隔离级别取值 页1861-1862"
  source_refs: *refsettx
  status: confirmed
- id: set_transaction_wave8_69_example
  type: behavior_oracle
  statement: "示例中B库START TRANSACTION后SET LOCAL TRANSACTION ISOLATION LEVEL READ COMMITTED READ ONLY；SET SESSION TRANSACTION需先SET b_format_behavior_compat_options TO set_session_transaction；SET GLOBAL TRANSACTION ISOLATION LEVEL READ COMMITTED READ ONLY给B库设置全局会话事务特性。"
  source_anchor: "1.13.19.9 示例 页1862"
  source_refs: *refsettx
  status: confirmed
open_questions:
