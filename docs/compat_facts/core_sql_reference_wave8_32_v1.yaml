facts:
- id: revoke_wave8_32_purpose
  type: syntax
  statement: "REVOKE用于撤销一个或多个角色的权限，支持表/视图、列、序列、数据库、域、CMK/CEK、目录、FDW、外部服务器、函数、存储过程、语言、模式、表空间、类型、PACKAGE、角色、SYSADMIN、ANY权限、DATABASE LINK和PUBLIC同义词等对象。"
  source_anchor: "1.13.18.10 页1796-1798"
  source_refs: &refb1
  - w8_32_1_13_18_10
  status: confirmed
- id: revoke_wave8_32_non_owner_rules
  type: constraint
  statement: "非对象所有者REVOKE时：授权用户没有该对象权限则命令立即失败；有部分权限则只撤销拥有授权选项的权限；无授权选项时REVOKE ALL PRIVILEGES报错，其他形式对缺少授权选项的指定权限发出警告。"
  source_anchor: "1.13.18.10 注意事项 页1796"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_pdb_database
  type: constraint
  statement: "在PDB内执行REVOKE并指定ON DATABASE时，仅支持撤销PDB自身的CREATE权限；不支持在Non-PDB中对PDB执行REVOKE语句。"
  source_anchor: "1.13.18.10 注意事项 页1796"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_table_view
  type: syntax
  statement: "可按表或视图回收SELECT、INSERT、UPDATE、DELETE、TRUNCATE、REFERENCES、ALTER、DROP、COMMENT、INDEX、VACUUM或ALL PRIVILEGES；支持TABLE、ALL TABLES IN SCHEMA、[GROUP] role_name、PUBLIC、GRANT OPTION FOR和CASCADE/RESTRICT。"
  source_anchor: "1.13.18.10 语法 页1796"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_column_privileges
  type: syntax
  statement: "可按列回收SELECT、INSERT、UPDATE、REFERENCES、COMMENT或ALL PRIVILEGES，目标对象为TABLE。"
  source_anchor: "1.13.18.10 语法 页1796"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_sequence
  type: syntax
  statement: "可回收序列的SELECT、UPDATE、ALTER、DROP、COMMENT或ALL PRIVILEGES；支持SEQUENCE、LARGE SEQUENCE和ALL SEQUENCES IN SCHEMA，LARGE属性可选且回收语句不区分序列是否为LARGE。"
  source_anchor: "1.13.18.10 语法 页1796"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_database
  type: syntax
  statement: "可回收数据库的CREATE、CONNECT、TEMPORARY、TEMP、ALTER、DROP、COMMENT或ALL PRIVILEGES。"
  source_anchor: "1.13.18.10 语法 页1796"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_domain
  type: syntax
  statement: "REVOKE DOMAIN支持回收USAGE或ALL PRIVILEGES。"
  source_anchor: "1.13.18.10 语法 页1796"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_encryption_keys
  type: syntax
  statement: "可回收客户端加密主密钥CLIENT_MASTER_KEYS和列加密密钥COLUMN_ENCRYPTION_KEYS上的USAGE、DROP或ALL PRIVILEGES。"
  source_anchor: "1.13.18.10 语法 页1797"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_directory
  type: syntax
  statement: "可回收DIRECTORY对象的READ、WRITE、ALTER、DROP或ALL PRIVILEGES。"
  source_anchor: "1.13.18.10 语法 页1797"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_fdw_server
  type: syntax
  statement: "FOREIGN DATA WRAPPER可回收USAGE或ALL PRIVILEGES；FOREIGN SERVER可回收USAGE、ALTER、DROP、COMMENT或ALL PRIVILEGES。"
  source_anchor: "1.13.18.10 语法 页1797"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_function_procedure
  type: syntax
  statement: "函数和存储过程可回收EXECUTE、ALTER、DROP、COMMENT或ALL PRIVILEGES；函数支持ALL FUNCTIONS IN SCHEMA，存储过程支持ALL PROCEDURE IN SCHEMA，函数/过程签名可包含argmode、arg_name和arg_type。"
  source_anchor: "1.13.18.10 语法 页1797"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_language
  type: syntax
  statement: "过程语言可回收USAGE或ALL PRIVILEGES。"
  source_anchor: "1.13.18.10 语法 页1797"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_schema_tablespace
  type: syntax
  statement: "模式可回收CREATE、USAGE、ALTER、DROP、COMMENT或ALL PRIVILEGES；表空间可回收CREATE、ALTER、DROP、COMMENT或ALL PRIVILEGES。"
  source_anchor: "1.13.18.10 语法 页1797"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_type_package
  type: syntax
  statement: "TYPE可回收USAGE、ALTER、DROP、COMMENT或ALL PRIVILEGES；PACKAGE可回收EXECUTE、ALTER、DROP、COMMENT或ALL PRIVILEGES。"
  source_anchor: "1.13.18.10 语法 页1798"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_role_admin_option
  type: syntax
  statement: "REVOKE role_name FROM role_name可回收角色授权，ADMIN OPTION FOR只回收再授予该角色的权限而不回收角色权限本身，并可声明CASCADE/RESTRICT。"
  source_anchor: "1.13.18.10 语法 页1798"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_sysadmin_any
  type: syntax
  statement: "REVOKE ALL {PRIVILEGES|PRIVILEGE} FROM role_name可回收SYSADMIN权限；ANY权限可通过REVOKE [ADMIN OPTION FOR]回收，ANY列表覆盖表、序列、索引、函数、PACKAGE、类型、同义词和触发器的CREATE/ALTER/DROP/SELECT/INSERT/UPDATE/DELETE/TRUNCATE/EXECUTE等能力。"
  source_anchor: "1.13.18.10 语法 页1798"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_dblink_public_synonym
  type: syntax
  statement: "可回收CREATE、ALTER、DROP [PUBLIC] DATABASE LINK权限；可回收CREATE/DROP PUBLIC SYNONYM权限，也可通过内置角色gs_role_public_synonym_create和gs_role_public_synonym_drop回收对应PUBLIC同义词权限。"
  source_anchor: "1.13.18.10 语法 页1798"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_public_grant_option
  type: constraint
  statement: "PUBLIC是隐式拥有所有角色的组；角色特权包括直接授予、通过成员角色继承和授予PUBLIC的权限。仅从PUBLIC回收SELECT不必然使所有角色失去SELECT，直接或经由其他角色授予的角色仍可保留；从用户回收后PUBLIC仍有权限时用户仍可使用。GRANT OPTION FOR只撤销授权权，不撤销权限本身；撤销授权者权限或授权选项时必须CASCADE撤销依赖性权限。"
  source_anchor: "1.13.18.10 参数说明 页1798-1799"
  source_refs: *refb1
  status: confirmed
- id: revoke_wave8_32_direct_grant_rule
  type: behavior_oracle
  statement: "用户只能撤销自己直接赋予的权限；A通过WITH ADMIN OPTION授予B，B再授予C时，A不能直接撤销C，只能撤销B的授权选项并用CASCADE自动撤销C。若A和B都授予C同一权限，A只能撤销自己的授权选项，C仍保留B授予的权限。多层成员关系下执行REVOKE的角色不确定，建议先SET ROLE再执行。"
  source_anchor: "1.13.18.10 参数说明 页1799"
  source_refs: *refb1
  status: confirmed
open_questions:
