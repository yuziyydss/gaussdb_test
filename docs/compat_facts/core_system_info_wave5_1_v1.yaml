facts:
- id: sysinfo_wave5_1_sys_context
  type: syntax
  statement: "SYS_CONTEXT('namespace','parameter')返回当前时刻上下文命名空间关联参数值；第一入参为userenv时与USERENV功能一致，返回text。"
  source_anchor: "1.6.26 页560-561"
  source_refs: &id001
  - w5_1_1_6_26
  status: confirmed
- id: sysinfo_wave5_1_sys_context_supported
  type: syntax
  statement: "SYS_CONTEXT第二入参支持current_edition_name、current_schema、current_sql、current_user、current_userid、database_role、ip_address、is_apply_server、isdba、nls_currency、nls_date_format、nls_date_language、server_host、service_name、session_user、session_userid、db_name、db_unique_name、instance、instance_name、current_edition_id、current_schemaid、lang、language和sid。"
  source_anchor: "1.6.26 页560"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_userenv
  type: syntax
  statement: "USERENV('parameter')返回当前上下文参数值，功能与SYS_CONTEXT第一入参为userenv时一致，返回text。"
  source_anchor: "1.6.26 页561"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_userenv_unsupported
  type: behavior_oracle
  statement: "USERENV对action、is_application_root、sessionid、terminal、client_info等当前不支持的入参返回NULL；对非法入参报错，示例错误为The configuration parameter actijj cannot be identified。"
  source_anchor: "1.6.26 页561-562"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_current_catalog_database
  type: syntax
  statement: "current_catalog和current_database()均返回当前数据库名称，current_catalog对应标准SQL中的catalog，返回name。"
  source_anchor: "1.6.26 页562"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_current_query
  type: syntax
  statement: "current_query()返回客户端提交的当前执行语句，可能包含多个声明，返回text。"
  source_anchor: "1.6.26 页562"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_current_schema
  type: behavior_oracle
  statement: "current_schema[()]返回当前模式名；返回搜索路径中第一个有效模式，搜索路径为空或没有有效模式时返回NULL；未声明目标模式时创建表等命名对象使用该模式。"
  source_anchor: "1.6.26 页562-563"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_current_schemas
  type: syntax
  statement: "current_schemas(Boolean)返回搜索路径中所有模式名称数组；布尔参数决定是否包含pg_catalog等隐含系统模式；搜索路径可通过SET search_path运行时修改。"
  source_anchor: "1.6.26 页563"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_database_b_mode
  type: constraint
  statement: "database()返回当前Schema名称，返回name；仅当sql_compatibility='B'、b_format_version='5.7'且b_format_dev_version='s1'时生效。"
  source_anchor: "1.6.26 页563"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_current_user
  type: behavior_oracle
  statement: "current_user返回当前执行环境用户名并用于权限检查；通常为会话用户，可通过SET ROLE改变，并会随SECURITY DEFINER函数执行变化。"
  source_anchor: "1.6.26 页563"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_definer_current_user
  type: syntax
  statement: "definer_current_user()返回当前执行环境用户名，返回name。"
  source_anchor: "1.6.26 页563-564"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_pg_current_sessionid
  type: behavior_oracle
  statement: "pg_current_sessionid()返回当前执行环境会话ID，格式为时间戳.会话ID；线程池开启时会话ID为SessionID，线程池关闭时为ThreadID。"
  source_anchor: "1.6.26 页564"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_pg_current_sessid
  type: behavior_oracle
  statement: "pg_current_sessid返回当前会话ID；线程池模式下获得会话ID，非线程池模式下获得当前会话对应后台线程ID，返回text。"
  source_anchor: "1.6.26 页564"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_pg_current_userid
  type: syntax
  statement: "pg_current_userid()返回当前用户ID，返回text。"
  source_anchor: "1.6.26 页564"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_version_number
  type: syntax
  statement: "working_version_num()返回系统兼容性相关的版本序号信息，返回int。"
  source_anchor: "1.6.26 页564"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_tablespace_oid_name
  type: syntax
  statement: "tablespace_oid_name(oid)根据表空间OID查找表空间名称，返回text。"
  source_anchor: "1.6.26 页564-565"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_inet_client_server
  type: syntax
  statement: "inet_client_addr()返回当前客户端IP，inet_client_port()返回客户端端口，inet_server_addr()返回服务器接收当前连接的IP，inet_server_port()返回接收连接端口。"
  source_anchor: "1.6.26 页565"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_inet_remote_only
  type: constraint
  statement: "inet客户端和服务器地址/端口函数仅在远程连接模式下有效；通过Unix-domain socket连接时这些函数返回NULL。"
  source_anchor: "1.6.26 页565"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_backend_pid
  type: syntax
  statement: "pg_backend_pid()返回当前会话连接的服务线程线程ID，返回int。"
  source_anchor: "1.6.26 页565-566"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_conf_load_time
  type: syntax
  statement: "pg_conf_load_time()返回最后加载服务器配置文件的时间戳，返回timestamp with time zone。"
  source_anchor: "1.6.26 页566"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_temp_schema
  type: behavior_oracle
  statement: "pg_my_temp_schema()返回当前会话临时模式OID，未创建临时表时为0；pg_is_other_temp_schema(oid)判断给定OID是否为其它会话的临时模式。"
  source_anchor: "1.6.26 页566"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_listening_channels
  type: syntax
  statement: "pg_listening_channels()返回当前会话正在侦听的一组信道名称，返回setof text。"
  source_anchor: "1.6.26 页566"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_postmaster_start_time
  type: syntax
  statement: "pg_postmaster_start_time()返回服务器启动时间，返回timestamp with time zone。"
  source_anchor: "1.6.26 页566-567"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_ruledef
  type: syntax
  statement: "pg_get_ruledef(rule_oid)获取规则的CREATE RULE命令，返回text。"
  source_anchor: "1.6.26 页567"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_sessionid2pid
  type: syntax
  statement: "sessionid2pid()从sessionid得到pid信息，返回int8。"
  source_anchor: "1.6.26 页567"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_session_context
  type: constraint
  statement: "session_context('namespace','parameter')返回指定namespace下parameter的值，返回VARCHAR；当前支持parameter包括current_user、current_schema、client_info、ip_address、sessionid和sid。"
  source_anchor: "1.6.26 页567"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_trigger_depth
  type: syntax
  statement: "pg_trigger_depth()返回触发器嵌套层次，返回int。"
  source_anchor: "1.6.26 页567"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_session_user
  type: behavior_oracle
  statement: "session_user返回会话用户名；通常是连接当前数据库的初始用户，系统管理员可用SET SESSION AUTHORIZATION修改。"
  source_anchor: "1.6.26 页567-568"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_user_current_user
  type: syntax
  statement: "user等价于current_user，返回name。"
  source_anchor: "1.6.26 页568"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_user_projection_a_mode
  type: constraint
  statement: "在A兼容模式下设置GUC参数a_format_func_col_name='user'后，user函数返回的投影列名为user。"
  source_anchor: "1.6.26 页568"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_username_encoding
  type: syntax
  statement: "getpgusername()获取数据库用户名，getdatabaseencoding()获取数据库编码方式，均返回name。"
  source_anchor: "1.6.26 页568"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_version_functions
  type: syntax
  statement: "version()返回服务器版本信息字符串；opengauss_version()返回openGauss版本信息；gs_deployment()返回当前系统部署形态信息，均返回text。"
  source_anchor: "1.6.26 页568-569"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_node_info
  type: syntax
  statement: "get_hostname()返回当前节点hostname；get_nodename()返回当前节点名字；get_nodeinfo(text)按属性返回节点信息，当前支持node_name和node_type。"
  source_anchor: "1.6.26 页569-570"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_schema_oid_client_info
  type: syntax
  statement: "get_schema_oid(cstring)返回指定Schema的OID；get_client_info()返回客户端信息，多租场景下Non-PDB返回全部信息，PDB仅返回本PDB相关信息。"
  source_anchor: "1.6.26 页570"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_session_memory_detail
  type: syntax
  statement: "pv_session_memory_detail()返回会话内存使用情况，以MemoryContext节点统计；多租场景下Non-PDB返回全局统计，PDB仅返回本PDB统计。"
  source_anchor: "1.6.26 页570-571"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_1_session_memory_detail_fields
  type: syntax
  statement: "pv_session_memory_detail输出sessid、threadid、contextname、level、parent、totalsize、freesize和usedsize；线程池开关决定sessid为session或thread标识组合；usedsize在TempSmallContextGroup上下文中为统计计数。"
  source_anchor: "1.6.26 页570-571"
  source_refs: *id001
  status: confirmed
