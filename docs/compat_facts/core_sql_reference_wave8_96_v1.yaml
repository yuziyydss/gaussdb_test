  statement: "gs_global_config自定义key-value在集群内的同步行为、用户组权限等价的GRANT/REVOKE映射、脱敏策略ADD/REMOVE/MODIFY与过滤条件组合的真实脱敏输出、物化视图重命名后依赖对象引用在授权环境下的完整行为与错误矩阵需实机验证。"
