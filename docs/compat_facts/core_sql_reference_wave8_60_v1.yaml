facts:
- id: insert_all_wave8_60_purpose
  type: syntax
  statement: "INSERT ALL/FIRST用于向多个表添加一条或多条数据。"
  source_anchor: "1.13.14.8 功能描述 页1753"
  source_refs: &refmain
  - w8_60_1_13_14_8
  status: confirmed
- id: insert_all_wave8_60_privileges
  type: constraint
  statement: "用户需拥有目标表INSERT权限；被授予INSERT ANY TABLE时需对系统模式之外的任何模式具有USAGE权限且拥有这些模式下表的INSERT权限；使用QUERY子句时还需拥有查询中表的SELECT权限。"
  source_anchor: "1.13.14.8 注意事项 页1753"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_generated_columns
  type: constraint
  statement: "生成列不能被直接写入；INSERT命令中不能为生成列指定值，但可以指定关键字DEFAULT。"
  source_anchor: "1.13.14.8 注意事项 页1753"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_a_mode_only
  type: constraint
  statement: "INSERT ALL语法仅支持在A兼容模式下执行。"
  source_anchor: "1.13.14.8 注意事项 页1753"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_syntax
  type: syntax
  statement: "语法为INSERT [/*+ plan_hint */] [ALL | FIRST] { [WHEN condition THEN] {INTO table_name [别名/分区子句] [(column_name[, ...])] [VALUES ({expression | DEFAULT}[, ...])]}[, ...]}[, ...] {subquery}；subquery为带WITH、WHERE、CONNECT BY、ORDER BY、FETCH FIRST等子句的SELECT语句。"
  source_anchor: "1.13.14.8 语法格式 页1753"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_plan_hint
  type: constraint
  statement: "plan_hint子句以/*+ */形式写在INSERT关键字后，目前仅适配了语法格式，并未实现具体功能。"
  source_anchor: "1.13.14.8 参数说明 plan_hint 页1753"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_all_first_semantics
  type: constraint
  statement: "不带WHEN条件子句时ALL|FIRST不可省略且只能为ALL；含条件子句时可省略，默认为ALL。ALL遍历所有匹配条件的分支，满足条件即插入对应表；FIRST找到第一个满足条件的分支插入后不再检查剩余分支。"
  source_anchor: "1.13.14.8 参数说明 ALL|FIRST 页1753-1754"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_when_condition
  type: syntax
  statement: "WHEN condition THEN为插入表时的条件判断，只有满足条件才执行插入操作，condition中可以引用子查询（SUBQUERY）中的列。"
  source_anchor: "1.13.14.8 参数说明 WHEN condition THEN 页1754"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_alias_name
  type: constraint
  statement: "INTO子句不包含AS alias语法时的表别名不能为关键字（如SELECT、VALUE）或表达式，需符合标识符命名规范；不支持INTO table_name alias_name(alias_name.col1,...) VALUES(xxx)格式；分区表的此类别名不支持指定分区插入操作。"
  source_anchor: "1.13.14.8 参数说明 alias_name 页1754"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_partition_clause
  type: constraint
  statement: "partition_clause用于指定分区插入，形式为PARTITION {(partition_name) | FOR (partition_value[, ...])}或SUBPARTITION {(subpartition_name) | FOR (subpartition_value[, ...])}；如果VALUE子句的值和指定分区不一致，结果会提示异常。"
  source_anchor: "1.13.14.8 参数说明 partition_clause 页1754"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_column_name
  type: syntax
  statement: "字段名可以有子字段名或数组下标修饰；未在字段列表中出现的字段由默认值填充，无默认值则用NULL；省略字段列表时默认全部字段且按表声明顺序；VALUE子句和QUERY只提供N个字段时目标字段为前N个字段，值从左到右关联到对应列。"
  source_anchor: "1.13.14.8 参数说明 column_name 页1754"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_values_single_row
  type: constraint
  statement: "INSERT ALL的VALUES子句不可跟多行。"
  source_anchor: "1.13.14.8 参数说明 VALUES 页1754"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_expression_rules
  type: constraint
  statement: "向字段插入单引号时需用单引号对自身转义；插入表达式类型不正确时系统自动进行类型转换，转换失败则插入失败并返回错误；表达式中不支持聚集函数，也不支持子查询。"
  source_anchor: "1.13.14.8 参数说明 expression 页1754-1755"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_default
  type: syntax
  statement: "VALUES中的DEFAULT表示对应字段名的缺省值；如果没有缺省值则为NULL。"
  source_anchor: "1.13.14.8 参数说明 DEFAULT 页1755"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_subquery_required
  type: constraint
  statement: "subquery不可省略，将查询结果作为插入数据；如果没有子查询可以使用SELECT * FROM DUAL；如果子查询带表别名，不可在CONDITION子句和INTO子句中引用该别名。"
  source_anchor: "1.13.14.8 参数说明 subquery 页1755"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_example_unconditional
  type: behavior_oracle
  statement: "不带条件的多表插入示例中，INSERT ALL含10个INTO分支且省略VALUES时按列名对位插入子查询列；对insert_all_test0的5行源数据执行后，insert_all_test1得25行、insert_all_test2得10行、insert_all_test3得20行，每个INTO分支对子查询的每行结果各插入一次。"
  source_anchor: "1.13.14.8 示例 不带条件的多表插入 页1755-1756"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_example_first
  type: behavior_oracle
  statement: "INSERT FIRST示例中WHEN c1 < 4插入test1、WHEN c1 < 3插入test2、ELSE插入test3；对c1为1-5的源数据执行后test1得3行、test2得0行、test3得2行，验证FIRST命中第一个满足条件的分支后不再检查剩余分支。"
  source_anchor: "1.13.14.8 示例1 INSERT FIRST 页1756-1757"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_example_all_conditional
  type: behavior_oracle
  statement: "INSERT ALL示例中同样WHEN c1 < 4、WHEN c1 < 3、ELSE的条件对c1为1-5的源数据执行后test1得3行、test2得2行、test3得2行，验证ALL遍历所有匹配分支、ELSE兜底未被任何WHEN匹配的行。"
  source_anchor: "1.13.14.8 示例2 INSERT ALL 页1757-1758"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_plsql
  type: behavior_oracle
  statement: "支持在PL/SQL中使用INSERT ALL；INTO子句的VALUES可引用PL/SQL变量（如var1、var2）和子查询列，多个INTO分支对SELECT结果的每行各执行一次插入。"
  source_anchor: "1.13.14.8 示例 支持PLSQL中使用INSERT ALL 页1758-1759"
  source_refs: *refmain
  status: confirmed
- id: insert_all_wave8_60_exceptions
  type: behavior_oracle
  statement: "异常矩阵：VALUES内使用聚集函数报错An aggregate function cannot be used in VALUES；VALUES后跟多行报syntax error；WHEN条件中的列不存在于子查询时报Column does not exist并提示不能从查询该部分引用；为子查询表设置别名后在VALUES中引用报Missing FROM-clause entry；不支持插入数据到视图（Not allowed to insert into view）；省略子查询时报syntax error。"
  source_anchor: "1.13.14.8 示例 异常情况 页1759-1760"
  source_refs: *refmain
  status: confirmed
open_questions:
- id: insert_all_wave8_60_oq_runtime
  statement: "INSERT ALL/FIRST在真实A兼容模式、多表与分区目标、权限组合和错误路径下的完整行为与错误矩阵需授权环境实机验证。"
  status: open
