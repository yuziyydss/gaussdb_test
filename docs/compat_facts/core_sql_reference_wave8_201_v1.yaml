facts:
- id: oracle_wave8_201_static_dml
  type: constraint
  statement: "静态DML SQL差异（表4-69）：INSERT Oracle要求目标表列多于子查询列时必须显式指定列名而GaussDB可省略按顺序填充多出列插NULL或默认值；INSERT ALL Oracle不支持into_clause表设置别名而GaussDB支持/sequence首次引用nextval相同后续相同而GaussDB正常自增/plan_hint Oracle生效GaussDB不生效/目标列多于子查询列差异同INSERT。"
  source_anchor: "4.3.10.5 表4-69 页3196"
  source_refs: &refw8201
  - w8_201_4_3
  status: confirmed
- id: oracle_wave8_201_static_tcl
  type: constraint
  statement: "静态TCL SQL（表4-70）：COMMIT/ROLLBACK/SAVEPOINT支持；SET TRANSACTION有差异——GaussDB不支持NAME string语法和USE ROLLBACK SEGMENT rollback_segment语法。"
  source_anchor: "4.3.10.5 表4-70 页3196-3197"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_pseudocolumns
  type: constraint
  statement: "伪列（表4-71）：CURRVAL/NEXTVAL/LEVEL/ROWID支持；OBJECT_VALUE不支持；ROWNUM有差异——不推荐ROWNUM用于JOIN ON子句，LEFT/RIGHT/FULL JOIN和MERGE INTO场景与其他数据库行为不一致直接迁移存在风险。"
  source_anchor: "4.3.10.5 表4-71 页3197"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_implicit_cursor
  type: constraint
  statement: "隐式游标属性差异（表4-72）：SQL%FOUND/SQL%NOTFOUND/SQL%ROWCOUNT/SQL%ISOPEN——GaussDB commit/rollback后不刷新隐式游标结果而Oracle会刷新；SQL%BULK_ROWCOUNT不支持；SQL%BULK_EXCEPTIONS有差异。"
  source_anchor: "4.3.10.5 表4-72 页3197"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_explicit_cursor
  type: constraint
  statement: "显式游标（表4-73/4-74/4-75）：CURSOR声明/OPEN/FETCH/CURRENT OF CURSOR支持；CLOSE差异——GaussDB在exception内部自动关闭而Oracle不会；显式游标属性%FOUND/%NOTFOUND/%ROWCOUNT/%ISOPEN支持；FOR LOOP有差异——FORALL+BULK COLLECT INTO场景INTO变量GaussDB仅返回单条DML执行结果而Oracle返回DML累计执行结果。"
  source_anchor: "4.3.10.5 表4-73/4-74/4-75 页3198"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_autonomous_txn
  type: syntax
  statement: "自治事务支持场景（表4-76）：存储过程/匿名块/函数/Package均支持。"
  source_anchor: "4.3.10.5 表4-76 页3199"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_dynamic_sql
  type: constraint
  statement: "动态SQL差异（表4-77）：EXECUTE IMMEDIATE——GaussDB通过dynamic_sql_compat参数控制同名变量读取同一参数/检查绑定参数出入参类型/不支持匿名块嵌套动态语句使用表达式绑定参数/不支持RETURNING RETURN INTO；OPEN FOR FETCH CLOSE——GaussDB通过dynamic_sql_compat参数控制变量读取同名参数且检查出入参类型。"
  source_anchor: "4.3.10.6 表4-77 页3199"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_trigger_types
  type: constraint
  statement: "Trigger类型差异（表4-78）：DML TRIGGER支持有差异——GaussDB不支持Compound DML Triggers；SYSTEM TRIGGER不支持。"
  source_anchor: "4.3.10.7 表4-78 页3199"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_create_trigger
  type: constraint
  statement: "CREATE TRIGGER差异（表4-79）：GaussDB不支持EDITIONABLE|NONEDITIONABLE/schema/sharing_clause/default_collation_clause；simple_dml_trigger不支持referencing_clause/trigger_edition_clause/trigger_ordering_clause/ENABLE|DISABLE且GaussDB在无INSTEAD OF视图上创建语句级BEFORE/AFTER不报错但DML时报错；trigger_body不允许声明PRAGMA AUTONOMOUS_TRANSACTION且CALL routine_clause用EXECUTE PROCEDURE function_name(arguments)执行需用户定义返回触发器；instead_of_dml_trigger不支持NESTED TABLE/referencing_clause等；compound_dml_trigger/system_trigger/dml_event_clause不支持。"
  source_anchor: "4.3.10.7 表4-79 页3200-3202"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_alter_drop_trigger
  type: constraint
  statement: "ALTER TRIGGER差异（表4-80）：GaussDB不支持schema/trigger_compile_clause/ENABLE|DISABLE/EDITIONABLE|NONEDITIONABLE；DROP TRIGGER差异（表4-81）：GaussDB不支持schema需在trigger_name后加ON table_name；*_TRIGGERS视图GaussDB相关视图与Oracle存在差异参见DB_TRIGGERS/ADM_TRIGGERS/MY_TRIGGERS。"
  source_anchor: "4.3.10.7 表4-80/4-81 页3202"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_subprogram_types
  type: constraint
  statement: "子程序兼容性差异（表4-82）：nested subprogram——GaussDB不支持重载/自治事务/SETOF仅限一个限定符引用；package subprogram/standalone subprogram/匿名块支持；RETURN（表4-83）：Function/Procedure/匿名块支持。"
  source_anchor: "4.3.10.7 表4-82/4-83 页3203"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_function_params
  type: constraint
  statement: "Function相关参数差异（表4-84）：DETERMINISTIC有差异——GaussDB中为IMMUTABLE；PARALLEL_ENABLE/PIPELINED/RESULT_CACHE不支持；参数形式（表4-85）：IN/OUT/IN OUT均支持。"
  source_anchor: "4.3.10.7 表4-84/4-85 页3203"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_create_statements
  type: constraint
  statement: "CREATE语句差异（表4-86）：CREATE FUNCTION不支持IF NOT EXISTS/sharing_clause/仅支持invoker_rights_clause子句/不支持EDITIONABLE|NONEDITIONABLE；CREATE LIBRARY不支持；CREATE PACKAGE不支持IF NOT EXISTS/sharing_clause/仅支持invoker_rights_clause/不支持EDITIONABLE；CREATE PACKAGE BODY不支持IF NOT EXISTS/sharing_clause/EDITIONABLE；CREATE PROCEDURE不支持IF NOT EXISTS/sharing_clause及后面子句/EDITIONABLE；CREATE TRIGGER参见CREATE TRIGGER；CREATE TYPE不支持varray/object类型/UNDER语法；CREATE TYPE BODY不支持。"
  source_anchor: "4.3.10.7 表4-86 页3204"
  source_refs: *refw8201
  status: confirmed
- id: oracle_wave8_201_alter_drop_statements
  type: constraint
  statement: "ALTER语句差异（表4-87）：ALTER FUNCTION/PACKAGE/PROCEDURE不支持EDITIONABLE|NONEDITIONABLE/REUSE/SETTINGS/DEBUG；ALTER LIBRARY不支持；ALTER TRIGGER仅支持修改名字；ALTER TYPE仅支持部分语句。DROP语句差异（表4-88）：DROP FUNCTION/PACKAGE/PROCEDURE支持；DROP LIBRARY不支持；DROP TRIGGER语法不同需ON table_name；DROP TYPE不支持FORCE/VALIDATE；DROP TYPE BODY不支持。"
  source_anchor: "4.3.10.7 表4-87/4-88 页3205"
  source_refs: *refw8201
  status: confirmed
