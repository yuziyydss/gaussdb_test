facts:
- id: m_alter_table_wave8_105_overview
  type: syntax
  statement: "M兼容ALTER TABLE修改表，包括修改表的定义、重命名表、重命名表中指定的列、设置表的所属模式、添加/更新多个列；语法主体为ALTER TABLE { table_name [*] | ONLY table_name | ONLY ( table_name ) } [action [, ... ]]；目前ONLY和增加*选项保留语法但功能不支持。"
  source_anchor: "2.4.2.6.12 功能描述/语法格式/参数说明 页2032,2039"
  source_refs: &refmat
  - w8_105_2_4_2_6_12
  status: confirmed
- id: m_alter_table_wave8_105_permission
  type: constraint
  statement: "表的所有者、被授予了表ALTER权限的用户或被授予ALTER ANY TABLE权限的用户有权限执行ALTER TABLE（系统管理员默认拥有此权限），修改表所有者或模式时当前用户必须是表所有者或系统管理员且是新所有者角色的成员；不能修改分区表的TABLESPACE但可以修改分区的TABLESPACE；SET SCHEMA操作不支持修改为系统内部模式，当前仅支持用户模式之间的修改。"
  source_anchor: "2.4.2.6.12 注意事项 页2032"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_addcolumn_default
  type: constraint
  statement: "ADD COLUMN增加字段时所有现有行初始化为缺省值；新增列没有声明DEFAULT值时默认值为NULL且不会触发全表更新；新增列有DEFAULT值时必须符合以下所有要求否则会带来全表更新影响在线业务：数据类型必须为TINYINT、SMALLINT、BIGINT、INTEGER、NUMERIC、DECIMAL、BOOL、FLOAT、DOUBLE、CHAR、VARCHAR、TEXT、TIMESTAMP、DATE、TIME之一；DEFAULT值长度不超过128字节；DEFAULT值不包含易变函数（可用pg_proc系统表provolatile属性是否为'v'判断）；DEFAULT值不为NULL。"
  source_anchor: "2.4.2.6.12 注意事项 页2032-2033"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_first_after
  type: constraint
  statement: "使用FIRST | AFTER column_name新增列或修改列、或修改字段的字符集，会带来全表更新的操作影响在线业务；ALTER TABLE操作未指定具体动作action时系统通常会进行存在性校验、权限校验及记录审计日志等基本校验，但不会对表结构进行任何实际修改。"
  source_anchor: "2.4.2.6.12 注意事项 页2033"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_actions
  type: syntax
  statement: "action子句全集：column_clause；ADD [CONSTRAINT] table_constraint；DROP CONSTRAINT [ IF EXISTS ] constraint_name [ RESTRICT | CASCADE ]；SET/RESET存储参数；OWNER TO new_owner；TO { GROUP groupname | NODE ( nodename [, ... ] ) }与ADD/DELETE NODE（仅扩展模式support_extended_features=on时可用，主要供内部扩缩容工具使用一般用户不应使用）；AUTO_INCREMENT [ = ] value（大于当前自增计数器才生效，非负且不大于2^127-1）；COMMENT；CHARSET/COLLATE默认修改（不影响表中已存在列）；CONVERT TO CHARSET（转换所有字符字段编码，分区表不支持改字符序）；ADD index_clause；DROP {INDEX | KEY}；DROP PRIMARY KEY；DROP FOREIGN KEY；REPLICA IDENTITY。"
  source_anchor: "2.4.2.6.12 语法格式/说明 页2033-2034"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_replica_identity
  type: constraint
  statement: "REPLICA IDENTITY { DEFAULT | USING INDEX index_name | FULL | NOTHING }在逻辑复制场景指定UPDATE/DELETE旧元组记录级别：DEFAULT记录主键列旧值（无主键不记录）；USING INDEX记录命名索引覆盖列旧值（须唯一、不局部、不可延迟且仅NOT NULL列）；FULL记录该行所有列旧值；NOTHING不记录；无主键表须设为FULL否则解码旧元组为空；不建议NOTHING（回放SQL可能导致多行修改影响数据正确性）；ustore表NOTHING无效实际等同FULL，DEFAULT无主键时记录该行所有列。"
  source_anchor: "2.4.2.6.12 说明 页2034-2035"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_column_clause
  type: syntax
  statement: "column_clause子句：ADD [ COLUMN ] column_name data_type [{CHARSET} charset] [COLLATE collation] [column_constraint [...]] [ FIRST | AFTER column_name ]（FIRST|AFTER表示新增字段位置）；ADD ( { column_name data_type } [, ...] )增加多列；MODIFY column_name [CONSTRAINT constraint_name] NOT NULL [ENABLE]或NULL；MODIFY [ COLUMN ] column_name data_type [...] [FIRST|AFTER]（修改字段定义）；CHANGE [ COLUMN ] old_column_name new_column_name data_type [...]（改名改定义）；DROP [ COLUMN ] column_name [ RESTRICT | CASCADE ]；ALTER [ COLUMN ] column_name { SET DEFAULT default_expr | DROP DEFAULT }；MODIFY column_name data_type [GENERATED ALWAYS] AS generation_expr [STORED | VIRTUAL]（修改生成列）。"
  source_anchor: "2.4.2.6.12 语法格式 页2035"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_modify_definition
  type: constraint
  statement: "MODIFY修改字段定义：用新定义替换原定义，原字段上的索引、独立对象约束（主键、唯一键、CHECK约束等）不会被删除；不支持修改分区键信息；被修改数据类型或排序规则的字段若被生成列引用，生成列数据将重新生成；被索引/独立对象约束/视图等依赖的字段修改过程中将重建这些对象（修改后违反约束则失败）；被对象调用的字段修改后对象可能出现不可用；修改字段字符集或字符序会将字段数据转换为新字符集编码；此命令会导致该字段统计信息清空，建议修改后重新收集。"
  source_anchor: "2.4.2.6.12 说明 页2036"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_change
  type: constraint
  statement: "CHANGE修改字段名称和定义：字段新名称不能是已有字段名称，用新名称和定义替换原名称和定义，原字段索引、独立对象约束不会被删除；不支持修改分区键字段的数据类型和排序规则，不支持修改规则引用的字段的数据类型和排序规则；被生成列引用的字段数据重新生成；被依赖对象修改过程将重建（违反约束失败）；修改字符集或字符序转换数据编码。"
  source_anchor: "2.4.2.6.12 说明 页2036-2037"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_drop_column
  type: constraint
  statement: "DROP [ COLUMN ]删除字段时和该字段相关的索引和表约束也会被自动删除；CASCADE选项在M-compatibility模式兼容版本控制开关s1及以上版本（如m_format_dev_version = 's1'）时仅语法支持但实际不生效；DROP COLUMN并非物理删除，只是标记为对SQL操作不可见，随后插入和更新在该字段存储NULL；删除字段很快但不会立即释放磁盘空间，被删字段占据的空间将在执行VACUUM时回收。"
  source_anchor: "2.4.2.6.12 说明 页2037"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_rename_schema
  type: syntax
  statement: "重命名表：ALTER TABLE table_name RENAME [TO | AS | =] new_table_name（对名称的修改不会影响所存储的数据）；重命名表上索引：ALTER TABLE table_name RENAME {INDEX | KEY} old_index_name TO new_index_name；设置表的所属模式：ALTER TABLE [ IF EXISTS ] table_name SET SCHEMA new_schema（相关索引、约束都跟着移动，目前序列不支持改变schema，若表拥有序列需将序列删除、重建或取消拥有关系才能更改成功）。"
  source_anchor: "2.4.2.6.12 语法格式 页2037-2038"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_batch_actions
  type: constraint
  statement: "除RENAME和SET SCHEMA之外所有动作都可以捆绑在一个经过多次修改的列表中并行使用（如一个命令里增加几个字段或修改几个字段类型，大表此种操作效率提升更明显，只需对大表做一次处理）；增加一个CHECK或NOT NULL约束将会扫描该表以保证现有行符合约束；用一个非空缺省值增加字段或改变字段现有类型会重写整个表（大表可能花很长时间且临时需要两倍磁盘空间）。"
  source_anchor: "2.4.2.6.12 说明 页2038"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_storage_params
  type: constraint
  statement: "SET存储参数：FILLFACTOR数据页填充率（Ustore引擎默认92，Astore引擎默认100，取值10~100百分比，频繁更新的表选择较小填充因子更合适）；INIT_TD创建Ustore表时初始化TD数量（取值[2, 128]默认4，MAX_TUPLE_SIZE = BLCKSZ - INIT_TD * TD_SIZE，调整时单个元组最大存储空间随之变化）；PARALLEL_WORKERS控制创建索引时后台工作线程数量（取值[0, 32]，0表示不启用并行索引创建，未显式指定时默认不启用）。"
  source_anchor: "2.4.2.6.12 参数说明 页2039-2040"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_charset_fields
  type: constraint
  statement: "字段字符集与字符序：charset单独指定时字段字符序设置为该字符集的默认字符序；collation可从pg_collation系统表查询（默认为default开始的行），还支持utf8mb4_bin、utf8mb4_general_ci、utf8mb4_unicode_ci、binary、gbk_chinese_ci、gbk_bin、gb18030_chinese_ci、gb18030_bin；仅字符类型支持指定字符集，指定BINARY字符集或字符序实际是将字符类型转化为对应二进制类型（当前仅有TEXT类型转化为BLOB的映射，映射不存在则报错）；除BINARY外仅支持指定与数据库编码相同的字符集；字段未显式指定时若表指定了默认字符集或字符序则从表上继承；修改的字符集与当前字段字符集不同时会将字段数据转换编码。"
  source_anchor: "2.4.2.6.12 参数说明 页2040"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_check_default
  type: constraint
  statement: "CHECK ( expression )每次插入或更新的行必须使表达式结果为真否则抛异常（目前CHECK表达式不能包含子查询）；DEFAULT default_expr未嵌套括号格式支持常量、带正负号的数值常量、update_expr；嵌套括号(default_expr)格式另支持CURRENT_TIME/CURTIME、CURRENT_DATE/CURDATE函数（可不带括号调用）；仅TIMESTAMP以及DATETIME类型字段可指定update_expr作为默认值且字段精度与update_expr精度须一致（precision_num取值[0, 6]，不带括号或空括号精度为0，NOW关键字不支持不带括号）。"
  source_anchor: "2.4.2.6.12 参数说明 页2040-2041"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_on_update
  type: constraint
  statement: "ON UPDATE update_expr为字段属性约束：对表中元组执行UPDATE时若更新字段新值与旧值不相同，该元组上具有该属性且不在更新字段内的字段值自动更新为当前时间戳；若新值与旧值相同则保持原有值；若具有该属性的字段在更新字段内则直接按指定值更新；update_expr为CURRENT_TIMESTAMP | LOCALTIMESTAMP | NOW()。"
  source_anchor: "2.4.2.6.12 参数说明 页2041"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_add_constraint_notes
  type: constraint
  statement: "ADD CONSTRAINT操作：对于外键约束，constraint_name和index_name同时指定时索引名为constraint_name；对于唯一键约束，constraint_name和index_name同时指定时索引名为index_name；未指定USING method时ASTORE存储方式默认索引方法为btree，USTORE存储方式默认索引方法为ubtree；表的存储方式为USTORE时SQL语句中约束指定为using btree，底层会自动将约束建立为using ubtree；ASC为升序（默认）DESC为降序。"
  source_anchor: "2.4.2.6.12 参数说明 须知 页2039"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_fk_actions
  type: constraint
  statement: "外键ON DELETE/ON UPDATE可能动作：NO ACTION（缺省，创建违反外键约束错误）、RESTRICT（与NO ACTION相同）、CASCADE（删除引用行或更新引用字段值为被参考字段新值）、SET NULL（引用字段设为NULL）、SET DEFAULT（引用字段设为缺省值）；MATCH SIMPLE（缺省）允许任意外键字段为NULL；外键约束完整性检查由GUC参数foreign_key_checks控制（on/off，默认on）。"
  source_anchor: "2.4.2.6.12 参数说明 页2044-2045"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_cascade_restrict
  type: constraint
  statement: "CASCADE级联删除依赖于被删除字段或约束的对象（比如引用该字段的视图）；RESTRICT如果字段或约束还有任何依赖对象则拒绝删除（缺省行为）；该属性在M-compatibility模式兼容版本控制开关s1及以上版本时仅语法支持但实际不生效；有规则依赖的表不支持改变表列的位置（包括新增和修改导致列位置的变化）。"
  source_anchor: "2.4.2.6.12 参数说明 页2044-2045"
  source_refs: *refmat
  status: confirmed
- id: m_alter_table_wave8_105_examples
  type: behavior_oracle
  statement: "示例基线：ALTER TABLE aa RENAME TO test_alt1改名；SET SCHEMA test_schema后pg_tables查询schemaname=test_schema；OWNER TO test_user后pg_tables显示tableowner；CHANGE COLUMN c1 id INT改列名；ADD COLUMN name VARCHAR(20)加列；ADD COLUMN col int AUTO_INCREMENT添加本地自增列（现有行col初始化为1）；MODIFY name VARCHAR(50)改类型；DROP COLUMN areaid删列；ALTER COLUMN areaid SET DEFAULT '00000'与DROP DEFAULT设置/删除默认值（\\d显示default '00000'::bpchar）；ADD CONSTRAINT pk_test3_pid PRIMARY KEY (pid)加主键（\\d显示not null与btree索引）；ALTER TABLE t01 DROP INDEX idx1, DROP INDEX idx2删除表中索引（USTORE表索引为ubtree）。"
  source_anchor: "2.4.2.6.12 示例 页2045-2048"
  source_refs: *refmat
  status: confirmed
open_questions:
- id: m_alter_table_wave8_105_oq_runtime
  statement: "新增列DEFAULT值全表更新规避条件在真实数据规模下的生效边界、CONVERT TO CHARSET大表转换耗时、REPLICA IDENTITY逻辑复制解码行为、ON UPDATE时间戳自动更新与业务事务组合需授权环境实机验证。"
  status: open
