# M模式 — 数据类型完整兼容性 — 结构化参考事实
# 来源: gaussdb-rf-cent.pdf 4.4.2.1 (物理页3292-3331)
document: "集中式版参考 / 4.4.2.1 MySQL兼容性M模式数据类型"
version: "V2.0-10.0.0"
parent_pdf_sha256: "716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe"
extraction_date: "2026-09-14"
extraction_method: pdftotext -layout 逐页精读
verification_status: confirmed

facts:
  # 整数类型
  - id: m_dt_int_union_length
    type: behavior_oracle
    statement: "整数UNION CTAS差异：开启enable_precision_decimal时GaussDB取最大长度（INT=11，BIGINT=20）计算列长度；MySQL按实际长度。示例：SELECT 1234567 UNION ALL SELECT '456789'，GaussDB列类型varchar(11)，MySQL为varchar(7)。"
    source_anchor: "4.4.2.1.2 表4-131"
    status: confirmed
    verification_method: 逐页精读（页3293-3294）

  - id: m_dt_bool_output
    type: behavior_oracle
    statement: "BOOL/BOOLEAN输出差异：GaussDB SELECT TRUE/FALSE输出t/f，MySQL输出1/0。MySQL实际映射为TINYINT。"
    source_anchor: "4.4.2.1.2 表4-131"
    status: confirmed
    verification_method: 逐页精读（页3293）

  # 浮点类型
  - id: m_dt_float_range_error
    type: constraint
    statement: "FLOAT/DOUBLE带精度标度场景，驱动中数据输入超范围时不支持报错。"
    source_anchor: "4.4.2.1.2 表4-133"
    status: confirmed
    verification_method: 逐页精读（页3295）

  - id: m_dt_extra_float_digits
    type: environment
    statement: "extra_float_digits=0时FLOAT4不带标度值与MySQL 5.7一致；设为其他值可能不一致。"
    source_anchor: "4.4.2.1.2 表4-133"
    status: confirmed
    verification_method: 逐页精读（页3295）

  # 日期时间类型
  - id: m_dt_timestamp_explicit_defaults
    type: behavior_oracle
    statement: "TIMESTAMP差异：GaussDB不支持设置explicit_defaults_for_timestamp，行为与MySQL设为on时相同（NULL不替换为当前时间戳，不自动添加DEFAULT CURRENT_TIMESTAMP和ON UPDATE）。MySQL 5.7默认off，8.0默认on。"
    source_anchor: "4.4.2.1.3 表4-134"
    status: confirmed
    verification_method: 逐页精读（页3296）

  - id: m_dt_precision_truncate
    type: behavior_oracle
    statement: "DATETIME/TIME/TIMESTAMP精度超过最大时GaussDB截断为最大精度，MySQL报错。"
    source_anchor: "4.4.2.1.3 说明"
    status: confirmed
    verification_method: 逐页精读（页3297）

  - id: m_dt_time_negative_zero
    type: behavior_oracle
    statement: "带负号零时间（-00:00:00）GaussDB不显示负号，MySQL显示负号。"
    source_anchor: "4.4.2.1.3 说明"
    status: confirmed
    verification_method: 逐页精读（页3297）

  - id: m_dt_year_display
    type: behavior_oracle
    statement: "YEAR差异：MySQL 5.7默认显示year(4)，GaussDB与MySQL 8.0一致只显示year。"
    source_anchor: "4.4.2.1.3 表4-134"
    status: confirmed
    verification_method: 逐页精读（页3296）

  # 字符串类型
  - id: m_dt_text_binary_input
    type: behavior_oracle
    statement: "TEXT/BLOB二进制输入差异：无法转义的二进制/十六进制字符串GaussDB输出十六进制（\\x01），MySQL输出空字符串或乱码。"
    source_anchor: "4.4.2.1.4 表4-135"
    status: confirmed
    verification_method: 逐页精读（页3298）

  - id: m_dt_text_defaults
    type: behavior_oracle
    statement: "TINYTEXT/TEXT/MEDIUMTEXT/LONGTEXT：MySQL 5.7不允许设默认值，GaussDB及MySQL 8.0允许。"
    source_anchor: "4.4.2.1.4 说明"
    status: confirmed
    verification_method: 逐页精读（页3298）

  - id: m_dt_text_index_diff
    type: constraint
    statement: "TEXT主键：MySQL须指定前缀长度，GaussDB不支持指定前缀长度。索引：MySQL仅前缀索引，GaussDB支持其他方法。外键：MySQL不支持，GaussDB支持。"
    source_anchor: "4.4.2.1.4 说明"
    status: confirmed
    verification_method: 逐页精读（页3298）

  - id: m_dt_longtext_limit
    type: constraint
    statement: "LONGTEXT长度限制：GaussDB最大1GB-512字节，MySQL最大4GB-1字节。"
    source_anchor: "4.4.2.1.4 表4-135"
    status: confirmed
    verification_method: 逐页精读（页3297）

  # 二进制类型
  - id: m_dt_binary_fill
    type: behavior_oracle
    statement: "BINARY填充符：GaussDB填充0x20（空格），MySQL填充0x00。导致比较/函数/索引/导入导出差异。"
    source_anchor: "4.4.2.1.5 表4-136"
    status: confirmed
    verification_method: 逐页精读（页3249）

  - id: m_dt_binary_charset
    type: environment
    statement: "BINARY/VARBINARY默认字符集：GaussDB为数据库初始化字符集，MySQL为BINARY字符集。"
    source_anchor: "4.4.2.1.5 表4-136"
    status: confirmed
    verification_method: 逐页精读（页3249）

  - id: m_dt_binary_jdbc_output
    type: behavior_oracle
    statement: "JDBC输出BINARY末尾：GaussDB显示空格，MySQL显示\\x00。"
    source_anchor: "4.4.2.1.5 表4-136"
    status: confirmed
    verification_method: 逐页精读（页3249）

  - id: m_dt_blob_primary_key
    type: constraint
    statement: "BLOB系列：MySQL不允许默认值/主键/外键，GaussDB均支持。MySQL仅前缀索引，GaussDB支持其他方法。"
    source_anchor: "4.4.2.1.5 说明"
    status: confirmed
    verification_method: 逐页精读（页3250）

  - id: m_dt_bit_output
    type: behavior_oracle
    statement: "BIT输出：GaussDB按二进制字符串输出，MySQL按ASCII转义。MySQL 8.0+默认开头补0，GaussDB不补。"
    source_anchor: "4.4.2.1.5 表4-136"
    status: confirmed
    verification_method: 逐页精读（页3249）

  # 数据类型属性
  - id: m_dt_supported_attributes
    type: syntax
    statement: "支持的属性：NULL、NOT NULL、DEFAULT、ON UPDATE、PRIMARY KEY、AUTO_INCREMENT、CHARACTER SET、COLLATE、ZEROFILL。全部支持。"
    source_anchor: "4.4.2.1.7 表4-138"
    status: confirmed
    verification_method: 逐页精读（页3254）

  - id: m_dt_varbinary_default_display
    type: behavior_oracle
    statement: "VARBINARY默认值显示差异：GaussDB显示十六进制（X'6761757373'），MySQL显示原始值（'gauss'）。"
    source_anchor: "4.4.2.1.7 差异点"
    status: confirmed
    verification_method: 逐页精读（页3254-3255）

  # 数据类型转换
  - id: m_dt_conversion_scenarios
    type: environment
    statement: "类型转换场景：操作数类型不一致、函数实参形参不一致、DML目标列类型不一致、CAST显式转换、UNION/EXCEPT投影列、表达式计算、BINARY字符序转换（TEXT→BLOB、VARCHAR→VARBINARY）。"
    source_anchor: "4.4.2.1.8"
    status: confirmed
    verification_method: 逐页精读（页3255）

  - id: m_dt_conversion_diff_categories
    type: environment
    statement: "类型转换差异分类：隐式转换、UNION/CASE构造、双冒号转换、decimal类型差异。"
    source_anchor: "4.4.2.1.8"
    status: confirmed
    verification_method: 逐页精读（页3255）
