facts:
- id: guc_enable_alarm
  type: environment
  statement: enable_alarm控制是否打开告警上报线程以报告数据库可能故障场景，默认on；生效范围仅为DN节点。
  source_anchor: 7.3.11 enable_alarm
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4426）
- id: guc_connection_alarm_rate
  type: environment
  statement: connection_alarm_rate设置并发连接告警比率，阈值等于max_connections*connection_alarm_rate，超过后写connection_log；取值0~1，默认0.9。
  source_anchor: 7.3.11 connection_alarm_rate
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4427）
- id: guc_alarm_report_interval
  type: environment
  statement: alarm_report_interval设置告警上报时间间隔，单位s，取值0~2147483647，默认10；过大可能丢失同周期重复关键告警，过小会频繁上报同一告警。
  source_anchor: 7.3.11 alarm_report_interval
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4427）
- id: guc_alarm_component
  type: environment
  statement: alarm_component设置处理告警内容的告警组件位置，仅sysadmin可访问；未对接第三方时默认/opt/huawei/snas/bin/snas_cm_cmd，对接第三方时为组件可执行程序绝对路径。
  source_anchor: 7.3.11 alarm_component
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4428）
- id: guc_table_skewness_warning_threshold
  type: environment
  statement: table_skewness_warning_threshold设置表倾斜告警阈值，取值0~1，默认1；可在PDB级别设置。
  source_anchor: 7.3.11 table_skewness_warning_threshold
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4428）
- id: guc_table_skewness_warning_rows
  type: environment
  statement: table_skewness_warning_rows设置表倾斜告警行数，取值0~2147483647，默认100000；可在PDB级别设置。
  source_anchor: 7.3.11 table_skewness_warning_rows
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4428）
