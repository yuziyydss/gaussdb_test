facts:
- id: syn_wave8_36_purpose
  type: syntax
  statement: "CREATE SYNONYM创建同义词对象；同义词是数据库对象的别名，记录与其他数据库对象名的映射关系，用户可使用同义词访问关联对象。"
  source_anchor: "1.13.9.47 页1529"
  source_refs: &refsyn
  - w8_36_1_13_9_47
  status: confirmed
- id: syn_wave8_36_owner_schema
  type: syntax
  statement: "创建同义词的用户成为其所有者；指定模式名称时同义词在指定模式中创建，否则在当前模式下创建。"
  source_anchor: "1.13.9.47 注意事项 页1529"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_supported_objects
  type: syntax
  statement: "同义词可访问的数据库对象包括表、视图、类型、PACKAGE、函数和存储过程、序列以及其他同义词对象。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_dml_and_permissions
  type: constraint
  statement: "使用同义词时用户需要对关联对象具有相应权限；支持通过同义词执行的DML包括SELECT、INSERT、UPDATE、DELETE、EXPLAIN和CALL。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_stored_procedure_limit
  type: constraint
  statement: "不支持关联函数或存储过程的CREATE SYNONYM语句出现在存储过程中；建议存储过程中使用系统表pg_synonym中已存在的同义词对象。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_temp_table_limit
  type: constraint
  statement: "不建议对临时表创建同义词；若必须创建，需指定目标临时表的模式名，否则无法正常使用，并且应在当前会话结束前执行DROP SYNONYM。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_source_object_delete
  type: behavior_oracle
  statement: "删除原对象后，关联同义词不会被级联删除；继续访问同义词会报错，访问表提示已失效，访问函数、存储过程或包提示对象不存在。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_any_permission
  type: constraint
  statement: "被授予CREATE ANY SYNONYM权限的用户能够在用户模式下创建同义词。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_encrypted_objects
  type: constraint
  statement: "不支持针对包含加密列的密态表以及基于密态表的视图、函数或存储过程创建同义词。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_package_support
  type: syntax
  statement: "同义词关联对象可以是PACKAGE，但不支持直接关联PACKAGE下的函数；可通过PACKAGE同义词访问该PACKAGE下的函数和变量。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_owner_schema_rule
  type: constraint
  statement: "当同义词Schema是用户所在Schema时，同义词OWNER为该Schema的OWNER；其他场景同义词OWNER默认为同义词创建者。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_name_resolution
  type: constraint
  statement: "设置search_path且未指定同义词Schema时，存储过程和函数优先按名称检索pg_proc，没有同名函数时检索同义词，最后按search_path检索；其他对象优先检索search_path，同Schema下本名对象优先于同义词。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_ddl_access_limit
  type: constraint
  statement: "不支持通过CREATE、DROP、ALTER等DDL语句操作同义词的方式访问同义词所关联的对象。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_nested_synonyms
  type: syntax
  statement: "支持嵌套同义词；搜索时若同义词关联另一个同义词，会继续搜索关联同义词，直到搜索到最后关联对象。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_meta_commands
  type: constraint
  statement: "不支持使用\\d、\\df、\\sf等方式通过同义词访问关联对象的信息。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_search_process
  type: behavior_oracle
  statement: "给定Schema时先搜索schema1.object1对象，再搜索同义词；同义词关联schema2.object2时继续搜索该对象和同义词，仅当二者都不存在且schema2是用户名时额外搜索PUBLIC同义词。不给定Schema时先按search_path检索对象，再检索同义词，最后在Schema为用户名时搜索PUBLIC同义词。"
  source_anchor: "1.13.9.47 同义词搜索过程 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_sensitive_functions
  type: constraint
  statement: "避免对包含密码等敏感信息的函数（如gs_encrypt、gs_decrypt、gs_encrypt_bytea、gs_decrypt_bytea）创建别名或通过别名调用，防止敏感信息泄露。"
  source_anchor: "1.13.9.47 注意事项 页1530"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_create_syntax
  type: syntax
  statement: "CREATE [OR REPLACE] [PUBLIC] SYNONYM synonym_name FOR object_name；OR REPLACE重定义已存在同义词；synonym_name和object_name都可用模式限定，object_name可以是不存在对象，也可以是DATABASE LINK方式访问的远程对象。"
  source_anchor: "1.13.9.47 语法/参数 页1531"
  source_refs: *refsyn
  status: confirmed
- id: syn_wave8_36_public_synonym
  type: constraint
  statement: "PUBLIC同义词同一数据库下不能重名；升级提交前不支持创建/删除；所有用户可访问，非初始用户和系统管理员需相应CREATE/DROP PUBLIC SYNONYM权限。其pg_synonym.synnamespace和synowner为0，ADM/DB_SYNONYMS中owner为PUBLIC、schema_name为NULL。指定同义词Schema时不检索PUBLIC同义词。"
  source_anchor: "1.13.9.47 PUBLIC说明 页1531"
  source_refs: *refsyn
  status: confirmed
- id: dropview_wave8_36_syntax_dependencies
  type: syntax
  statement: "DROP VIEW删除数据库中的视图，语法为DROP VIEW [IF EXISTS] view_name[, ...] [CASCADE|RESTRICT]；仅视图所有者、视图所在模式所有者、被授予视图DROP权限的用户或拥有DROP ANY TABLE权限的用户可执行。IF EXISTS遇视图不存在时只产生NOTICE不删除；CASCADE级联删除依赖对象，RESTRICT在有依赖对象时拒绝删除，未指定默认RESTRICT。"
  source_anchor: "1.13.10.49 页1703-1704"
  source_refs: &refdrop
  - w8_36_1_13_10_49
  status: confirmed
open_questions:
- id: syn_wave8_36_oq_runtime
  statement: "同义词解析、嵌套映射、PUBLIC同义词、远程对象和失效同义词在真实Schema/search_path组合下的行为矩阵需授权环境实机验证。"
  status: open
