facts:
- id: proc_wave8_38_purpose_syntax
  type: syntax
  statement: "CREATE [OR REPLACE] PROCEDURE创建新的存储过程，支持参数、IMMUTABLE/STABLE/VOLATILE、SHIPPABLE、PACKAGE、LEAKPROOF、NULL输入、安全模式、COST和SET会话参数，并以IS|AS plsql_body结束。"
  source_anchor: "1.13.9.37 页1495与1497"
  source_refs: &refb1
  - w8_38_1_13_9_37
  status: confirmed
- id: proc_wave8_38_precision
  type: constraint
  statement: "创建存储过程时，如果参数或返回值带有精度，创建操作中不进行精度检测。"
  source_anchor: "1.13.9.37 注意事项 页1495"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_schema_search_path
  type: constraint
  statement: "存储过程定义中操作表对象建议明确指定模式，否则可能导致执行异常；存储过程内部SET设置current_schema和search_path无效，执行后与执行前保持一致。"
  source_anchor: "1.13.9.37 注意事项 页1495"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_locking
  type: constraint
  statement: "创建存储过程时仅对CREATE的存储过程或PACKAGE本身加写锁；执行过程中的编译和执行会对函数及函数依赖的PACKAGE加读锁。"
  source_anchor: "1.13.9.37 注意事项 页1495"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_out_arg_call
  type: constraint
  statement: "通过SELECT以及CALL调用函数时，必须在出参位置提供实参；该实参不会发生作用。"
  source_anchor: "1.13.9.37 注意事项 页1495"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_overload_rules
  type: constraint
  statement: "存储过程指定PACKAGE属性时支持重载；不能仅因形参名不同创建重载，重载调用时变量需明确类型；不能创建与函数同名同参数列表的存储过程，也不支持仅默认值不同的重载。仅IN/OUT/INOUT类型不同的参数在proc_outparam_override开启时不允许重载，关闭时支持重载。"
  source_anchor: "1.13.9.37 注意事项 页1495-1496"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_style_body_limits
  type: constraint
  statement: "A兼容模式创建Oracle风格对象，PG兼容模式创建PostgreSQL风格对象，不建议混合创建；函数支持重载需指定PACKAGE关键字；未声明变量在调用时报错；不能在avg函数外嵌套其他聚集函数或其他系统函数；存储过程不支持RETURN集合操作。"
  source_anchor: "1.13.9.37 注意事项 页1496"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_noarg_outfunc_call
  type: syntax
  statement: "存储过程内部调用其他无参数存储过程时可省略括号；调用带出参函数且在赋值表达式中使用时，需设置proc_outparam_override并定义与出参类型相同的变量作为出参，否则被调函数出参被忽略。"
  source_anchor: "1.13.9.37 注意事项 页1496"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_out_expression_contexts
  type: constraint
  statement: "使用EXECUTE IMMEDIATE sqlv USING func、SELECT func INTO、INSERT/UPDATE等DML执行函数、SELECT WHERE a=func()、带OUT函数作为入参或为变量默认值赋值时，OUT出参不会生效。"
  source_anchor: "1.13.9.37 注意事项 页1496"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_comments
  type: syntax
  statement: "存储过程支持参数注释的查看与导出/导入，也支持IS/AS与plsql_body之间注释的查看与导出/导入。"
  source_anchor: "1.13.9.37 注意事项 页1496"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_any_permission
  type: constraint
  statement: "被授予CREATE ANY FUNCTION权限的用户可以在用户模式下创建/替换存储过程。"
  source_anchor: "1.13.9.37 注意事项 页1496"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_out_variable_required
  type: constraint
  statement: "OUT/INOUT参数必须传入变量，不能传入常量。"
  source_anchor: "1.13.9.37 注意事项 页1496"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_security_mode
  type: constraint
  statement: "存储过程默认为SECURITY INVOKER；若要改为SECURITY DEFINER，需设置behavior_compat_options='plsql_security_definer'。定义者权限存储过程创建到其他用户Schema下会以该用户权限执行，存在越权风险。"
  source_anchor: "1.13.9.37 注意事项 页1496"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_out_override_effects
  type: constraint
  statement: "调用IN参数相同但OUT参数不同的存储过程需要proc_outparam_override；打开该参数后SELECT或CALL都必须加上OUT参数，且不支持PERFORM调用存储过程或函数，DBE_SQL.SQL_BIND_ARRAY不支持绑定参数。"
  source_anchor: "1.13.9.37 注意事项 页1496"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_dependency_replace
  type: constraint
  statement: "存储过程创建时依赖未定义对象：enable_force_create_obj打开时创建可执行并通过WARNING提示，未打开时创建不可执行；非初始用户无权对初始用户的存储过程执行REPLACE。"
  source_anchor: "1.13.9.37 注意事项 页1496-1497"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_separation_rebuild
  type: constraint
  statement: "打开三权分立时，定义者权限的存储过程只能由本用户自己重建。"
  source_anchor: "1.13.9.37 注意事项 页1496"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_complex_call_length
  type: constraint
  statement: "存储过程内部函数复杂调用func(x).a支持跨Schema，不支持database.schema.package.func(x).b。调用带OUT出参的存储过程设置proc_outparam_transfer_length可传递参数长度，支持CHAR(n)等字符串类型，不支持NUMERIC、TIME、TIMESTAMP、INTERVAL等精度/时间类型；集合元素长度还需tableof_elem_constraints。"
  source_anchor: "1.13.9.37 注意事项 页1496-1497"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_guc_session
  type: constraint
  statement: "函数中存在通过GUC参数控制特性的语法或函数时，若在会话内更改相关GUC参数，修改后调用函数可能维持修改前行为，需谨慎变更GUC配置。"
  source_anchor: "1.13.9.37 注意事项 页1497"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_args_defaults
  type: syntax
  statement: "参数可声明argname、argmode、argtype和默认表达式；argmode为IN、OUT、INOUT或VARIADIC，默认IN，只有OUT参数能跟在VARIADIC之后；argtype可用%TYPE或%ROWTYPE，PACKAGE外不支持%TYPE引用PACKAGE变量类型。默认参数建议放在非默认参数后，特殊版本和OUT/DEFAULT组合下默认值不可省略。"
  source_anchor: "1.13.9.37 参数说明 页1498-1499"
  source_refs: *refb1
  status: confirmed
- id: proc_wave8_38_body_end_name
  type: syntax
  statement: "plsql_body支持END;或END procedure_name;。END procedure_name仅A兼容模式且Oracle风格语法支持；END后名称不匹配会报错，嵌套子程序在不开启enable_force_create_obj时创建失败，开启时成功并WARNING；pg_proc和\\sf最外层END后不显示名称，gs_dump无法保留最外层END后名称。"
  source_anchor: "1.13.9.37 plsql_body 页1499-1500"
  source_refs: *refb1
  status: confirmed
open_questions:
