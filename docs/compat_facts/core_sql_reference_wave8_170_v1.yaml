facts:
- id: dbexmldom_wave8_170_overview_types
  type: syntax
  statement: "DBE_XMLDOM用于访问XMLType对象、实现DOM（Document Object Model），用于访问HTML和XML DOCUMENTS API；支持七种数据类型——DOMATTR（实现DOM Attribute接口）、DOMDOCUMENT（DOM Document）、DOMELEMENT（DOM Element）、DOMNAMEDNODEMAP（DOM Named Node Map）、DOMNODELIST（DOM Node List）、DOMNODE（DOM Node）、DOMTEXT（DOM Text）。"
  source_anchor: "3.12.2.23 DBE_XMLDOM 表3-451 页2995"
  source_refs: &refx
  - w8_170_3_12
  status: confirmed
- id: dbexmldom_wave8_170_ascii_limit
  type: constraint
  statement: "DBE_XMLDOM字符集限制：当数据库的字符集设置为SQL_ASCII的情况下使用DBE_XMLDOM高级包，传入超出ASCII范围的字符时会产生报错信息。"
  source_anchor: "3.12.2.23 DBE_XMLDOM说明 页2995"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_catalog
  type: syntax
  statement: "DBE_XMLDOM接口总账（约40个）：。"
  source_anchor: "3.12.2.23 DBE_XMLDOM 表3-452 页2996-2997"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_appendchild
  type: syntax
  statement: "APPENDCHILD原型：DBE_XMLDOM.APPENDCHILD(n IN DOMNode, newchild IN DOMNode) RETURN DOMNODE；将newchild node添加到parent(n)节点最后面并返回新添加的Node节点。"
  source_anchor: "3.12.2.23 APPENDCHILD 页2997-2998"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_appendchild_attr_rules
  type: constraint
  statement: "APPENDCHILD的ATTR差异：DOCUMENT类型节点下APPEND ATTR类型节点会报operation not support错误（A数据库不报错但实际并没有挂载成功）；ATTR类型节点下APPEND ATTR类型节点同样报operation not support（A数据库不报错但未挂载成功）；父节点添加多个ATTR类型子节点时不允许KEY值相同的子节点同时存在于同一个父节点下；示例中attr挂载后HASCHILDNODES输出NOT HAS CHILD NODES。"
  source_anchor: "3.12.2.23 APPENDCHILD说明/示例 页2998-2999"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_createelement
  type: syntax
  statement: "CREATEELEMENT原型（双原型）：DBE_XMLDOM.CREATEELEMENT(doc IN DOMDOCUMENT, tagName IN VARCHAR2) RETURN DOMELEMENT与CREATEELEMENT(doc, tagName, ns IN VARCHAR2) RETURN DOMELEMENT（创建指定名称和命名空间的DOMELEMENT对象）；tagName传入NULL和空字符串时都会抛出异常NULL or invalid TagName argument specified；tagName和ns默认的最大长度为32767，超过该长度会抛出异常。"
  source_anchor: "3.12.2.23 CREATEELEMENT 页2998-2999"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_createtextnode
  type: syntax
  statement: "CREATETEXTNODE：创建DOMTEXT节点（示例中newdomdocument解析含中文与DOCTYPE的XML后通过WRITETOBUFFER输出，buffer显示there is nothing场景）。"
  source_anchor: "3.12.2.23 CREATETEXTNODE 页3000-3001"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_freedocument
  type: syntax
  statement: "FREEDOCUMENT原型：DBE_XMLDOM.FREEDOCUMENT(doc IN DOMDOCUMENT)；释放DOMDOCUMENT节点相关资源；示例在DOC树中添加DOMNODE节点后将整个DOC树资源释放（newdomdocument→MAKENODE→CREATEELEMENT→APPENDCHILD→freedocument）。"
  source_anchor: "3.12.2.23 FREEDOCUMENT 页3001"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_freeelement
  type: syntax
  statement: "FREEELEMENT原型：DBE_XMLDOM.FREEELEMENT(elem IN DOMELEMENT)；释放DOMELEMENT节点相关资源；示例对GETDOCUMENTELEMENT获取的elem先判断ISNULL（输出NOT NULL）再FREEELEMENT后判断（输出IS NULL）。"
  source_anchor: "3.12.2.23 FREEELEMENT 页3001-3002"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_freenode
  type: syntax
  statement: "FREENODE原型：DBE_XMLDOM.FREENODE(n IN DOMNODE)；释放DOMNODE节点相关资源；示例对GETFIRSTCHILD获取的node释放前后ISNULL判断输出NOT NULL/IS NULL。"
  source_anchor: "3.12.2.23 FREENODE 页3002-3003"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_freenode_a_diff
  type: constraint
  statement: "FREENODE与A数据库差异：GaussDB进行FREENODE操作后被释放的节点不会出现重新可用的情况；A数据库在FREENODE后存在被释放的节点重新可用并变成其他节点的情况；其他接口在调用被释放的DOMNODE节点时与A数据库存在差异。"
  source_anchor: "3.12.2.23 FREENODE说明 页3003"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_freenodelist
  type: syntax
  statement: "FREENODELIST：释放DOMNODELIST节点相关资源（对DOMNODELIST对象执行free操作）。"
  source_anchor: "3.12.2.23 FREENODELIST 页3003-3004"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_getattribute
  type: syntax
  statement: "GETATTRIBUTE：按名称返回DOMELEMENT属性的值（示例对computer元素len属性读取输出50cm）；GETATTRIBUTE接口的参数ns不支持传入参数*（星号通配）。"
  source_anchor: "3.12.2.23 GETATTRIBUTE 页3004-3005"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_getattributes
  type: syntax
  statement: "GETATTRIBUTES：将DOMNODE节点属性值作为map返回。"
  source_anchor: "3.12.2.23 GETATTRIBUTES 页3005-3006"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_getchildnodes
  type: syntax
  statement: "GETCHILDNODES：将节点下的若干子节点转换成节点列表。"
  source_anchor: "3.12.2.23 GETCHILDNODES 页3006-3007"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_getchildrenbytagname
  type: syntax
  statement: "GETCHILDRENBYTAGNAME：按名称返回DOMELEMENT的子节点。"
  source_anchor: "3.12.2.23 GETCHILDRENBYTAGNAME 页3007-3009"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_getdocumentelement
  type: syntax
  statement: "GETDOCUMENTELEMENT原型：DBE_XMLDOM.GETDOCUMENTELEMENT(doc IN DOMDOCUMENT) RETURN DOMELEMENT；返回指定DOCUMENT的首个子节点；示例新建doc并CREATEELEMENT('staff')挂载后GETDOCUMENTELEMENT再GETTAGNAME输出staff。"
  source_anchor: "3.12.2.23 GETDOCUMENTELEMENT 页3009"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_getfirstchild
  type: syntax
  statement: "GETFIRSTCHILD原型：DBE_XMLDOM.GETFIRSTCHILD(n IN DOMNODE) RETURN DOMNODE；返回节点的第一个子节点；示例对students文档MAKENODE后GETFIRSTCHILD输出节点名students、节点类型1，再取其第一个子节点输出student1。"
  source_anchor: "3.12.2.23 GETFIRSTCHILD 页3010"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_getlastchild
  type: syntax
  statement: "GETLASTCHILD原型：DBE_XMLDOM.GETLASTCHILD(n IN DOMNODE) RETURN DOMNODE；返回节点的最后一个子节点；示例在students根节点上GETLASTCHILD输出student2。"
  source_anchor: "3.12.2.23 GETLASTCHILD 页3010-3011"
  source_refs: *refx
  status: confirmed
- id: dbexmldom_wave8_170_navigate_example
  type: behavior_oracle
  statement: "DOM导航示例基线：对含student1/student2的students文档，GETFIRSTCHILD(doc_node)输出节点名students与类型1，其GETFIRSTCHILD输出student1、GETLASTCHILD输出student2；FREEELEMENT与FREENODE释放前后ISNULL对比输出NOT NULL/IS NULL。"
  source_anchor: "3.12.2.23 GETFIRSTCHILD/GETLASTCHILD/FREE*示例 页3001-3011"
  source_refs: *refx
  status: confirmed
