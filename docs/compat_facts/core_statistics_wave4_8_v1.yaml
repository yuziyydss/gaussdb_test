facts:
- id: stats_wave4_8_user_space_info
  type: syntax
  statement: "gs_wlm_user_space_info()描述用户存储空间使用信息，输出user_name、永久/临时/算子落盘空间的最大值和当前值，单位byte；多租模式下禁用。"
  source_anchor: "1.6.29 页881"
  source_refs: &id001
  - w4_8_1_6_29
  status: confirmed
- id: stats_wave4_8_session_io_info
  type: syntax
  statement: "gs_wlm_session_io_info()描述session I/O使用信息，输出session_id、io_limits、io_priority、current_iops和wait_time；多租模式下禁用。"
  source_anchor: "1.6.29 页881-882"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_session_io_semantics
  type: behavior_oracle
  statement: "gs_wlm_session_io_info中io_limits为每秒IOPS上限，0表示不控制；io_priority在I/O利用率高达90%时生效，None表示不控制；current_iops可能因统计算法偶尔超过上限；wait_time为超过上限后等待时间总和；IOPS计数单位由GUC参数io_control_unit定义。"
  source_anchor: "1.6.29 页881-882"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_emergency_operation_records
  type: syntax
  statement: "gs_emergency_operation_records()展示当前节点对Unix Domain Socket运维通道的使用情况，输出record_time、action、source和detail；source取值为gsql或cm。"
  source_anchor: "1.6.29 页882"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_session_memory_info
  type: syntax
  statement: "gs_wlm_session_memory_info()描述session内存使用信息，输出session_id、sess_used_dynamic_memory和sess_max_dynamic_memory；多租场景下PDB仅返回本PDB数据，Non-PDB返回全局数据。"
  source_anchor: "1.6.29 页882-883"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_hot_standby_space_info
  type: syntax
  statement: "gs_hot_standby_space_info()查询standby_read/base_page、standby_read/block_info_meta和standby_read/lsn_info_meta目录中文件总数和总大小，输出三类文件的num和total_size。"
  source_anchor: "1.6.29 页883"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_exrto_file_read_stat
  type: constraint
  statement: "exrto_file_read_stat()查询备机读新增的base page file、lsn info meta file和block info meta file的磁盘访问次数与访问总时延；需连接备DN查询，其他情况结果为0。"
  source_anchor: "1.6.29 页883-884"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_exrto_file_read_fields
  type: syntax
  statement: "exrto_file_read_stat输出lsn_info_page_disk_read_counter/dur、blk_info_meta_disk_read_counter/dur和base_page_read_disk_counter/dur。"
  source_anchor: "1.6.29 页883-884"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_exrto_recycle_info
  type: constraint
  statement: "gs_exrto_recycle_info()查询资源回收位置，包括每个redo线程回收LSN、全局回收LSN和查询线程最旧快照LSN；需连接备DN查询，其他情况结果为0。"
  source_anchor: "1.6.29 页884"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_exrto_recycle_fields
  type: syntax
  statement: "gs_exrto_recycle_info输出page_redo_worker_thread_id、global_recycle_lsn和exrto_snapshot_oldest_lsn。"
  source_anchor: "1.6.29 页884"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_stat_get_db_conflict_all
  type: syntax
  statement: "gs_stat_get_db_conflict_all(oid)查询向指定数据库发送的不同类型回放冲突信号数量，输入数据库OID，返回record。"
  source_anchor: "1.6.29 页884-885"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_stat_get_db_conflict_all_fields
  type: syntax
  statement: "gs_stat_get_db_conflict_all输出conflict_all以及tablespace、lock、snapshot、bufferpin、startup_deadlock、truncate、standby_query_timeout和force_recycle类型冲突信号数量。"
  source_anchor: "1.6.29 页884-885"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_redo_stat_info
  type: constraint
  statement: "gs_redo_stat_info([operation])查询WAL日志回放统计，包括回放线程缓存命中率、DDL日志删除文件数量、读取数据页物理读等待事件和读取WAL日志等待事件；需连接备DN查询。"
  source_anchor: "1.6.29 页885-886"
  source_refs: *id001
  status: confirmed
- id: stats_wave4_8_redo_stat_info_operations
  type: constraint
  statement: "gs_redo_stat_info的operation可选：无输入或1表示查询统计信息，2表示重置缓存命中率统计信息。"
  source_anchor: "1.6.29 页885"
  source_refs: *id001
  status: confirmed
