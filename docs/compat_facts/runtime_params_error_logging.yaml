facts:
- id: guc_log_destination
  type: environment
  statement: log_destination为逗号分隔的服务器日志输出列表，有效值包括stderr、csvlog、syslog、eventlog；使用csvlog前提是logging_collector=on，默认stderr。
  source_anchor: 7.3.10.1 记录日志的位置 log_destination
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4404）
- id: guc_logging_collector
  type: environment
  statement: logging_collector控制logger线程收集stderr或csvlog日志并写入日志文件；默认on，属于POSTMASTER参数。
  source_anchor: 7.3.10.1 记录日志的位置 logging_collector
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4404）
- id: guc_log_directory
  type: environment
  statement: logging_collector开启时，log_directory决定服务器日志目录，可为绝对路径或相对数据目录路径；支持gs_guc reload动态修改，仅sysadmin可访问。
  source_anchor: 7.3.10.1 记录日志的位置 log_directory
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4405-4406）
- id: guc_log_filename
  type: environment
  statement: logging_collector开启时，log_filename按strftime模式设置运行日志文件名，默认gaussdb-%Y-%m-%d_%H%M%S.log；csvlog会生成带时间戳的.csv文件。
  source_anchor: 7.3.10.1 记录日志的位置 log_filename
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4405-4406）
- id: guc_log_truncate_on_rotation
  type: environment
  statement: log_truncate_on_rotation在日志回滚时控制同名日志写入方式：on覆盖写入，off追加写入；默认off。
  source_anchor: 7.3.10.1 记录日志的位置 log_truncate_on_rotation
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4406-4407）
- id: guc_log_rotation_age
  type: environment
  statement: logging_collector开启时，log_rotation_age设置创建新日志文件的时间间隔，默认1440min。
  source_anchor: 7.3.10.1 记录日志的位置 log_rotation_age
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4407）
- id: guc_log_rotation_size
  type: environment
  statement: logging_collector开启时，log_rotation_size设置单个日志文件最大尺寸，超过后生成新文件，默认20480kB即20MB。
  source_anchor: 7.3.10.1 记录日志的位置 log_rotation_size
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4407）
- id: guc_client_min_messages
  type: environment
  statement: client_min_messages控制发送到客户端的消息级别，级别不低于设置值的消息才发送；默认notice。
  source_anchor: 7.3.10.2 记录日志的时间 client_min_messages
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4409）
- id: guc_log_min_messages
  type: environment
  statement: log_min_messages控制写入服务器日志的消息级别，级别不低于设置值的消息才写入；默认warning。
  source_anchor: 7.3.10.2 记录日志的时间 log_min_messages
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4409）
- id: guc_log_min_error_statement
  type: environment
  statement: log_min_error_statement控制将对应错误消息的SQL语句写入服务器日志的级别，级别不低于设置值的错误SQL会被写入；默认error。
  source_anchor: 7.3.10.2 记录日志的时间 log_min_error_statement
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4410）
- id: guc_log_min_duration_statement
  type: environment
  statement: log_min_duration_statement设置SQL执行时间阈值，达到阈值时记录SQL和执行时间；扩展查询协议会分别记录语法分析、绑定和执行耗时，默认3000ms。
  source_anchor: 7.3.10.2 记录日志的时间 log_min_duration_statement
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4410-4411）
- id: guc_log_connections
  type: environment
  statement: log_connections控制是否记录客户端连接请求日志，包括IP、PORT、用户名、数据库名及连接关键步骤耗时；默认off。
  source_anchor: 7.3.10.3 记录日志的内容 log_connections
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4414-4415）
- id: guc_log_disconnections
  type: environment
  statement: log_disconnections控制是否记录客户端结束连接信息；默认off。
  source_anchor: 7.3.10.3 记录日志的内容 log_disconnections
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4415）
- id: guc_log_duration
  type: environment
  statement: log_duration控制记录每个已完成SQL语句的执行时间；扩展查询协议下分别记录语法分析、绑定和执行耗时，默认off。
  source_anchor: 7.3.10.3 记录日志的内容 log_duration
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4415）
- id: guc_log_error_verbosity
  type: environment
  statement: log_error_verbosity控制服务器日志错误信息详细度：terse省略DETAIL/HINT/QUERY/CONTEXT，verbose增加SQLSTATE、源文件、函数和行号，default介于二者之间；默认default。
  source_anchor: 7.3.10.3 记录日志的内容 log_error_verbosity
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4416）
- id: guc_log_hostname
  type: environment
  statement: log_hostname控制连接日志是否记录主机名；开启会做主机名解析并可能影响性能，关闭时仅显示IP，默认off。
  source_anchor: 7.3.10.3 记录日志的内容 log_hostname
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4416）
- id: guc_log_line_prefix
  type: environment
  statement: log_line_prefix用printf风格和%转义字符控制每条日志前缀，默认%m %n %u %d %h %p %S %x %a，可输出会话时间、节点、用户、数据库、主机、线程、会话、事务和应用名。
  source_anchor: 7.3.10.3 记录日志的内容 log_line_prefix
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4416-4418）
- id: guc_log_lock_waits
  type: environment
  statement: log_lock_waits控制会话等待锁超过deadlock_timeout时是否写日志，用于定位锁等待和潜在死锁；默认off。
  source_anchor: 7.3.10.3 记录日志的内容 log_lock_waits
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4418）
- id: guc_log_statement
  type: environment
  statement: log_statement控制记录SQL语句：none不记录，ddl记录DDL，mod记录DDL和INSERT/UPDATE/DELETE/TRUNCATE/COPY FROM，all记录全部语句；默认none。简单语法错误语句即使all也不会记录。
  source_anchor: 7.3.10.3 记录日志的内容 log_statement
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4418-4419）
- id: guc_log_temp_files
  type: environment
  statement: log_temp_files控制临时文件删除日志：正数只记录大于该值的文件，0记录全部，-1不记录；单位kB，默认-1。
  source_anchor: 7.3.10.3 记录日志的内容 log_temp_files
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4419）
