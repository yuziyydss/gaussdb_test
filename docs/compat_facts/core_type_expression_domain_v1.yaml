  source_refs:
  - cte_1_3_1
  status: confirmed
- id: core_type_serial_semantics
  type: constraint
  statement: SMALLSERIAL/SERIAL/BIGSERIAL/LARGESERIAL是唯一标识便利形式而非真实独立类型；列自动关联序列并加NOT NULL，但不会自动加UNIQUE/PRIMARY KEY，临时表不支持SERIAL列，且不能将既有列类型转换为SERIAL。
  source_anchor: 1.3.1 表1-4与说明 页91-92
  source_refs:
  - cte_1_3_1
  status: confirmed
- id: core_type_float_approximate_risk
  type: constraint
  statement: REAL、FLOAT4、DOUBLE、DOUBLE PRECISION、FLOAT8、FLOAT(p)、BINARY_DOUBLE为近似二进制浮点类型；货币等精确计算应使用numeric，浮点相等比较和下溢需特别复核。
  source_anchor: 1.3.1 说明 页96
  source_refs:
  - cte_1_3_1
  status: confirmed
- id: core_type_b_mode_float_input_output
  type: environment
  statement: B兼容模式在b_format_version=5.7且b_format_dev_version=s1时，FLOAT/DOUBLE/DEC/REAL等带精度的非法或越界输入在strict_trans_tables下报错，否则告警并返回0或截断值；DEC无精度时按NUMERIC(10,0)转换。
  source_anchor: 1.3.1 说明 页91、96
  source_refs:
  - cte_1_3_1
  status: confirmed
- id: core_type_money_conversion
  type: syntax
  statement: money为8字节固定两位小数类型；numeric/int/bigint可直接转money，float/double建议先转numeric再转money；money到float8需经numeric两步转换；money除法返回double precision。
  source_anchor: 1.3.2 页97-98
  source_refs:
  - cte_1_3_2
  status: confirmed
- id: core_type_boolean_values
  type: syntax
  statement: BOOLEAN为1字节，取值为true/false/null；文本真值包括TRUE、t、true、y、yes、on、1及非0数值，假值包括FALSE、f、false、n、no、off、0等。
  source_anchor: 1.3.3 表1-7 页98
