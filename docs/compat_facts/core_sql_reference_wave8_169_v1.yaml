facts:
- id: dbeutil_wave8_169_catalog
  type: syntax
  statement: "DBE_UTILITY接口总账：FORMAT_ERROR_BACKTRACE（输出存储过程异常的调用堆栈）、FORMAT_ERROR_STACK（输出异常具体信息）、FORMAT_CALL_STACK（输出调用堆栈）、GET_TIME（输出当前时间一般用于做差）、CANONICALIZE（给表名字符串做规范）、COMMA_TO_TABLE（逗号隔开名字列表转PL/SQL表名称列表）、DB_VERSION（返回数据库版本号和兼容性版本号）、EXEC_DDL_STATEMENT（执行用户输入的DDL语句）、EXPAND_SQL_TEXT_PROC（展开SQL查询的视图）、GET_CPU_TIME（返回当前CPU处理时间测量值）、GET_ENDIANNESS（获取平台字节序大小端信息）、GET_HASH_VALUE（返回给定字符串哈希值）、GET_SQL_HASH（MD5输出字符串哈希值，不打开proc_outparam_override时使用）、IS_BIT_SET（检查参数n是否存在于r）、IS_CLUSTER_DATABASE（判断是否集群模式运行）、NAME_RESOLVE（解析给定对象名称包括同义词翻译和授权检查）、NAME_TOKENIZE（解析a[.b[.c]][@dblink]形式名字）、OLD_CURRENT_SCHEMA（返回当前数据库模式名称）、OLD_CURRENT_USER（返回当前用户名称）、TABLE_TO_COMMA（表名转逗号列表字符串）、GET_SQL_HASH_FUNC（功能同GET_SQL_HASH，打开proc_outparam_override时使用）。"
  source_anchor: "3.12.2.22 DBE_UTILITY 表3-438 页2981-2982"
  source_refs: &refu
  - w8_169_3_12
  status: confirmed
- id: dbeutil_wave8_169_format_error_trio
