  source_anchor: "3.12.2.22 GET_TIME 页2982"
  source_refs: *refu
  status: confirmed
- id: dbeutil_wave8_169_canonicalize
  type: syntax
  statement: "CANONICALIZE原型：DBE_UTILITY.CANONICALIZE(name IN VARCHAR2, canon_name OUT VARCHAR2, canon_len IN BINARY_INTEGER DEFAULT 1024)；用于给表名字符串做规范（处理单个保留字或关键字并删除单个标识符的空白，使table成为TABLE）；canon_len为要规范的字符串长度（默认1024字节），若小于待规范字符串实际长度则会以字节为粒度截断字符串。"
  source_anchor: "3.12.2.22 CANONICALIZE 页2982-2983"
  source_refs: *refu
  status: confirmed
