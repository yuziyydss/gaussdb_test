- id: dbeutil_wave8_169_expand_sql
  type: constraint
  statement: "EXPAND_SQL_TEXT_PROC(input_sql_text IN CLOB, output_sql_text OUT CLOB)：用于展开SQL查询的视图，会递归展开视图中的视图对象一直展开显示到表；用户输入的input_sql_text中SQL语句的对象需要增加schema前缀，否则函数上报无法找到对象的错误；若设置behavior_compat_options参数值为bind_procedure_searchpath则无需强制指定schema前缀。"
  source_anchor: "3.12.2.22 EXPAND_SQL_TEXT_PROC 页2984"
  source_refs: *refu
  status: confirmed
