  statement: "异常信息三函数：FORMAT_ERROR_BACKTRACE() RETURN TEXT返回执行过程中出现错误时出现错误位置的调用堆栈；FORMAT_ERROR_STACK() RETURN TEXT返回出现错误位置的具体信息；FORMAT_CALL_STACK() RETURN TEXT设置输出函数调用堆栈。"
  source_anchor: "3.12.2.22 FORMAT_* 页2982"
  source_refs: *refu
  status: confirmed
