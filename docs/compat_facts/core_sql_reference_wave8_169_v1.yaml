- id: dbeutil_wave8_169_get_sql_hash_pair
  type: syntax
  statement: "GET_SQL_HASH双函数：GET_SQL_HASH(name IN VARCHAR2, hash OUT RAW, last4bytes OUT BIGINT)通过MD5算法输出给定字符串的hash值（hash为完整16进制MD5哈希值、last4bytes为MD5哈希值最后四字节的无符号整数形式），在不打开proc_outparam_override时使用；GET_SQL_HASH_FUNC(name, hash OUT RAW, last4bytes OUT BIGINT) RETURN BIGINT功能相同，在打开proc_outparam_override时使用（关闭时调用会赋值不成功，打开时调用GET_SQL_HASH会报参数不匹配异常）。"
  source_anchor: "3.12.2.22 GET_SQL_HASH/GET_SQL_HASH_FUNC 页2985-2989"
  source_refs: *refu
  status: confirmed
