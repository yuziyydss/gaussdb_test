facts:
- id: altidx_wave8_41_purpose
  type: syntax
  statement: "ALTER INDEX用于修改现有索引属性，支持重命名索引、修改表空间、设置/重置存储参数、设置UNUSABLE、REBUILD、重命名索引分区、移动索引分区表空间以及设置索引可见性。"
  source_anchor: "1.13.7.17 页1227-1228"
  source_refs: &refb1
  - w8_41_1_13_7_17
  status: confirmed
- id: altidx_wave8_41_permissions
  type: constraint
  statement: "索引所有者、拥有索引所在表INDEX权限的用户或被授予ALTER ANY INDEX权限的用户可执行ALTER INDEX；三权分立关闭时系统管理员默认拥有该权限。"
  source_anchor: "1.13.7.17 注意事项 页1227"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_invisible_dml
  type: constraint
  statement: "请勿在同一基表上保持大量不可见索引，否则可能影响INSERT、UPDATE、DELETE等DML操作性能。"
  source_anchor: "1.13.7.17 注意事项 页1227"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_rowid_index_limit
  type: constraint
  statement: "rowid系统列索引仅支持修改索引所属表空间及重建索引或索引分区。"
  source_anchor: "1.13.7.17 注意事项 页1227"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_rename_syntax
  type: syntax
  statement: "ALTER INDEX [IF EXISTS] index_name RENAME TO new_name用于重命名表索引。"
  source_anchor: "1.13.7.17 语法格式 页1227"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_tablespace_syntax
  type: syntax
  statement: "ALTER INDEX [IF EXISTS] index_name SET TABLESPACE tablespace_name用于修改索引所属空间。"
  source_anchor: "1.13.7.17 语法格式 页1228"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_set_params_syntax
  type: syntax
  statement: "ALTER INDEX [IF EXISTS] index_name SET ({storage_parameter=value}[, ...])用于修改索引存储参数。"
  source_anchor: "1.13.7.17 语法格式 页1228"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_reset_params_syntax
  type: syntax
  statement: "ALTER INDEX [IF EXISTS] index_name RESET (storage_parameter[, ...])用于重置索引存储参数。"
  source_anchor: "1.13.7.17 语法格式 页1228"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_unusable_syntax
  type: syntax
  statement: "ALTER INDEX [IF EXISTS] index_name [MODIFY PARTITION index_partition_name] UNUSABLE用于设置索引或索引分区不可用。"
  source_anchor: "1.13.7.17 语法格式 页1228"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_rebuild_syntax
  type: syntax
  statement: "ALTER INDEX index_name REBUILD [PARTITION index_partition_name]用于重建表索引或索引分区。"
  source_anchor: "1.13.7.17 语法格式 页1228"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_rename_partition_syntax
  type: syntax
  statement: "ALTER INDEX [IF EXISTS] index_name RENAME PARTITION index_partition_name TO new_index_partition_name用于重命名索引分区。"
  source_anchor: "1.13.7.17 语法格式 页1228"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_move_partition_syntax
  type: syntax
  statement: "ALTER INDEX [IF EXISTS] index_name MOVE PARTITION index_partition_name TABLESPACE new_tablespace用于修改索引分区的所属表空间。"
  source_anchor: "1.13.7.17 语法格式 页1228"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_visible_syntax
  type: syntax
  statement: "ALTER INDEX [IF EXISTS] index_name VISIBLE用于设置索引状态为可见。"
  source_anchor: "1.13.7.17 语法格式 页1229"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_invisible_syntax
  type: syntax
  statement: "ALTER INDEX [IF EXISTS] index_name INVISIBLE用于设置索引状态为不可见。"
  source_anchor: "1.13.7.17 语法格式 页1229"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_if_exists_names
  type: constraint
  statement: "IF EXISTS用于判断索引是否存在，索引不存在时发出NOTICE而不直接报错；index_name必须为要修改的索引名称，RENAME只改变名称、不影响存储数据，new_name需符合标识符命名规范。"
  source_anchor: "1.13.7.17 参数说明 页1229"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_tablespace_data_move
  type: syntax
  statement: "SET TABLESPACE将索引表空间改为指定已存在表空间，并把索引相关数据文件移动到新表空间。"
  source_anchor: "1.13.7.17 SET TABLESPACE 页1229"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_storage_params
  type: constraint
  statement: "SET/RESET可修改或重置索引方法特定存储参数；索引内容不会被立即修改，不同参数可能需要REINDEX才能获得期望效果。ACTIVE_PAGES表示索引页面数量并可用于优化器调优，目前仅对Ustore分区表LOCAL索引生效，会被VACUUM/ANALYZE更新，不建议手动设置。"
  source_anchor: "1.13.7.17 SET/RESET参数 页1229-1230"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_unusable_unique_guc
  type: constraint
  statement: "UNUSABLE将表或索引分区上的索引设置为不可用；当指定索引为唯一索引时，再次插入和更新的行为受GUC参数enable_unique_checking_of_unusable_index控制。"
  source_anchor: "1.13.7.17 UNUSABLE 页1230"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_rebuild_parallel
  type: constraint
  statement: "REBUILD重建表或索引分区索引；若索引带lpi_parallel_method=PARTITION且表parallel_workers大于0，则不支持并行重建；无该选项或取AUTO时默认走页面级并行重建。"
  source_anchor: "1.13.7.17 REBUILD 页1230"
  source_refs: *refb1
  status: confirmed
- id: altidx_wave8_41_visibility_limits
  type: constraint
  statement: "GSIVALID/GSIUSABLE为内部调用且当前版本不支持；VISIBLE/INVISIBLE在disable_keyword_options设置为visible/invisible时不可用。升级未提交阶段不支持VISIBLE/INVISIBLE；备机读下设置索引不可见后执行计划可能变化、备机查询性能可能受影响。"
  source_anchor: "1.13.7.17 GSIVALID/VISIBLE/INVISIBLE 页1230-1231"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: altidx_wave8_41_oq_runtime
  statement: "ALTER INDEX在真实索引规模、分区索引、不可用/重建、可见性切换和备机读组合下的计划与性能矩阵需授权环境实机验证。"
  status: open
