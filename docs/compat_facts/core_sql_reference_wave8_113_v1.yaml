facts:
- id: m_sub_wave8_113_overview
  type: syntax
  statement: "M兼容CREATE TABLE SUBPARTITION创建二级分区表：顶层节点表和一级分区都是逻辑表不存储数据，只有二级分区（叶子节点）存储数据；二级分区表的分区方案由两个一级分区的分区方案组合而来（一级分区方案参见CREATE TABLE PARTITION），M-Compatibility模式下只支持4种组合：Range-Hash分区、Range-Key分区、List-Hash分区、List-Key分区；二级分区仅支持行存；语法为CREATE TABLE [IF NOT EXISTS] subpartition_table_name (...) PARTITION BY { RANGE [ COLUMNS ] | LIST [ COLUMNS ] } (partition_key) [ PARTITIONS integer ] SUBPARTITION BY { HASH | KEY} (subpartition_key) [ SUBPARTITIONS integer ] ( PARTITION partition_name1 [ VALUES LESS THAN {(val1) | MAXVALUE} | VALUES [IN] (val1[, …]) ] [TABLESPACE] [( SUBPARTITION subpartition_name1 [TABLESPACE] [, ...])] [partition_options] [, ...] )。"
  source_anchor: "2.4.2.8.18 功能描述/语法格式 页2150-2151"
  source_refs: &refmsub
  - w8_113_2_4_2_8_18
  status: confirmed
- id: m_sub_wave8_113_limits
  type: constraint
  statement: "M兼容二级分区表限制：二级分区表有两个分区键，每个分区键只能支持1列；唯一约束和主键约束的约束键包含所有分区键将为约束创建LOCAL索引，否则创建GLOBAL索引（指定创建local唯一索引必须包含所有分区键）；创建二级分区表时一级分区下不显式指定二级分区会自动创建一个同范围的二级分区；一级分区下至少有一个二级分区；单个表最大分区数1048575（包括一级和二级，默认配置建议不超过400个）；分区数太多内存不足间接导致性能急剧下降；二级分区表只支持行存；不支持cluster。"
  source_anchor: "2.4.2.8.18 注意事项 页2151"
  source_refs: *refmsub
  status: confirmed
- id: m_sub_wave8_113_keyword_traps
  type: constraint
  statement: "M兼容二级分区表使用陷阱：指定分区查询select * from tablename partition/subpartition (partitionname)时关键字partition和subpartition注意不要写错——写错查询不会报错，查询会变为对表起别名进行查询；不支持密态数据库、账本数据库；PARTITION/SUBPARTITION FOR (VALUES)语法的VALUES只能是常量（需要数据类型转换时建议使用强制类型转换以防隐式转换与预期不符）；指定分区语句目前不能走全局索引扫描。"
  source_anchor: "2.4.2.8.18 注意事项 页2151"
  source_refs: *refmsub
  status: confirmed
- id: m_sub_wave8_113_table_option
  type: constraint
  statement: "M兼容二级分区表table_option规则与CREATE TABLE一致：COMMENT/AUTO_INCREMENT/COLLATE多次设置仅最后一个生效、ENGINE/ROW_FORMAT语法不报错但实际不生效；约束命名优先级：外键约束constraint_name和index_name同时指定时索引名为constraint_name、唯一键约束取index_name；partition_options为ENGINE [=] 'string' | STORAGE ENGINE [=] 'string'（仅语法上不报错无实际作用）；update_expr为{ CURRENT_TIMESTAMP | LOCALTIMESTAMP | NOW() }。"
  source_anchor: "2.4.2.8.18 语法格式 页2151-2152"
  source_refs: *refmsub
  status: confirmed
- id: m_sub_wave8_113_collate
  type: constraint
  statement: "M兼容二级分区表COLLATE支持字符序：utf8mb4_bin、utf8mb4_general_ci、utf8mb4_unicode_ci、binary、gbk_chinese_ci、gbk_bin、gb18030_chinese_ci、gb18030_bin、gb18030_2022_chinese_ci、gb18030_2022_bin；仅字符类型支持指定字符集（BINARY转二进制当前仅有TEXT→BLOB映射）；除BINARY字符集、字符序外仅支持指定与数据库编码相同的字符集；字段未显式指定时从表默认字符集/字符序继承。"
  source_anchor: "2.4.2.8.18 参数说明 COLLATE 页2153"
  source_refs: *refmsub
  status: confirmed
- id: m_sub_wave8_113_generated
  type: constraint
  statement: "M兼容二级分区表生成列限制与CREATE TABLE一致：STORED/VIRTUAL缺省规则（s2时缺省VIRTUAL）、生成表达式限制（只能IMMUTABLE函数、不能子查询/聚集/窗口/自定义函数、不能引用系统列自增列等）、存储生成列可作分区键一部分但不支持ALTER TABLE修改、虚拟生成列不支持作分区键/被外键引用/创建索引、不能直接写入（可指定DEFAULT）、精度传递开关前后创建的表存在差异。"
  source_anchor: "2.4.2.8.18 参数说明 生成列 页2153-2156"
  source_refs: *refmsub
  status: confirmed
- id: m_sub_wave8_113_subpartitions_auto
  type: constraint
  statement: "SUBPARTITIONS integer指定二级分区数量（必须为大于0的整数且不得大于1048575），只能在HASH和KEY二级分区后指定：若不列出各个二级分区定义，将在每个一级分区内自动生成integer个二级分区，自动生成的二级分区名为\"一级分区名+sp+数字\"；PARTITIONS integer指定一级分区个数（大于0且不大于1048575）：当在RANGE和LIST分区后指定时必须显式定义每个分区且定义数量与integer值相等（只能在RANGE和LIST分区后指定）；当在HASH和KEY分区后指定时，不列出分区定义将自动生成integer个分区（自动生成分区名为\"p+数字\"，数字依次0到integer-1，表空间默认为表的表空间），也可显式列出（数量须相等）；既不列出分区定义也不指定分区数量时将创建唯一一个分区。"
  source_anchor: "2.4.2.8.18 参数说明 PARTITIONS/SUBPARTITIONS 页2155-2156"
  source_refs: *refmsub
  status: confirmed
- id: m_sub_wave8_113_subpartition_key
  type: constraint
  statement: "M兼容二级分区键subpartition_key：分区策略的分区键仅支持1列；指定HASH关键字时可以使用表达式；分区键支持的数据类型和一级分区表约束保持一致。"
  source_anchor: "2.4.2.8.18 参数说明 页2155-2156"
  source_refs: *refmsub
  status: confirmed
- id: m_sub_wave8_113_examples_combo
  type: behavior_oracle
  statement: "示例1创建各种组合类型的二级分区表（m_db）：LIST-HASH组合CREATE TABLE list_hash PARTITION BY LIST (month_code) SUBPARTITION BY HASH (dept_code)，一级分区p_201901 VALUES('201902')与p_201902 VALUES('201903')各带两个SUBPARTITION（p_201901_a/b、p_201902_a/b），插入6行后SELECT验证；RANGE-HASH组合CREATE TABLE range_hash PARTITION BY RANGE (month_code) SUBPARTITION BY HASH (dept_code)，p_201901 VALUES LESS THAN('201903')与p_201902 VALUES LESS THAN('201904')各带两个二级分区，插入6行后SELECT验证。"
  source_anchor: "2.4.2.8.18 示例1 页2156-2157"
  source_refs: *refmsub
  status: confirmed
- id: m_sub_wave8_113_examples_dml
  type: behavior_oracle
  statement: "示例2对二级分区表进行DML指定分区操作（m_db）：INSERT INTO range_hash partition (p_201901) VALUES(...)与INSERT INTO range_hash partition (p_201902) VALUES(...)按一级分区插入；SELECT * from range_hash partition (p_201901)按分区查询；SELECT * from range_hash partition for ('201902')按分区键值查询；UPDATE range_hash partition (p_201901) SET user_no = '2'与UPDATE range_hash partition for ('201902') SET user_no = '4'按分区更新；DELETE FROM range_hash partition (p_201901)按分区删除。"
  source_anchor: "2.4.2.8.18 示例2 页2157-2158"
  source_refs: *refmsub
  status: confirmed
- id: m_cts_wave8_113_overview
  type: syntax
  statement: "M兼容CREATE TABLE SELECT创建一个表并使用来自SELECT命令的结果填充该表，字段名和字段类型来自自定义列和SELECT输出字段；只出现在自定义列中的字段排在最前面，否则按SELECT输出列顺序依次排列；列名相同但大小写不同会被识别为同一列（存在相同列时保留自定义列的数据类型、保留SELECT列名的大小写）；如果SELECT列和自定义列存在相同字段始终保留SELECT列的COMMENT（SELECT列为直接表列或视图展开后的直接表列时保留旧表该列COMMENT，否则COMMENT设置为NULL）；如果SELECT列为直接表列且未自定义该字段，保留旧表列的NULL、NOT NULL、DEFAULT VALUE、ON UPDATE、CHARSET和COLLATE；CREATE TABLE SELECT支持FOR UPDATE选项（锁机制与INSERT SELECT FOR UPDATE保持一致）。"
  source_anchor: "2.4.2.8.19 功能描述 页2162"
  source_refs: &refmcts
  - w8_113_2_4_2_8_19
  status: confirmed
- id: m_cts_wave8_113_limits
  type: constraint
  statement: "M兼容CREATE TABLE SELECT限制：不支持创建分区表；不支持REPLACE/IGNORE；SELECT列非直接表列则默认允许NULL且无默认值（如CREATE TABLE t1 SELECT unix_timestamp('2008-01-02 09:08:07.3465') AS a创建的新表字段a允许NULL且无默认值）；需将GUC参数m_format_behavior_compat_options开启enable_precision_decimal选项，否则涉及数据类型精度相关的类型将导致行为报错（SELECT列包含非直接表列表达式/函数/常量，以及UNION场景涉及结果类型推导都会报错）；建表过程中数据库系统故障后可能无法自动清除之前创建的大小非0的磁盘文件。"
  source_anchor: "2.4.2.8.19 注意事项 页2163"
  source_refs: *refmcts
  status: confirmed
- id: m_cts_wave8_113_syntax
  type: syntax
  statement: "M兼容CREATE TABLE SELECT语法：CREATE [ TEMPORARY | UNLOGGED ] TABLE [ IF NOT EXISTS ] table_name {(column定义|table_constraint|索引定义)[,...]} [ table_option ][[,...]|[...]] [ WITH ( {storage_parameter = value} [, ... ] ) ] [AS] query；table_option与CREATE TABLE一致（AUTO_INCREMENT/CHARSET/COLLATE/COMMENT/ENGINE/ROW_FORMAT）；AS query为一个SELECT语句（若SELECT语句首部带有CTE结构，需要使用括号包含query）。"
  source_anchor: "2.4.2.8.19 语法格式/参数说明 页2163-2170"
  source_refs: *refmcts
  status: confirmed
- id: m_cts_wave8_113_unique_pk
  type: constraint
  statement: "M兼容CREATE TABLE SELECT唯一与主键约束：列级唯一约束UNIQUE [KEY] index_parameters；表级唯一约束UNIQUE [INDEX | KEY][ index_name ][ USING method ]；UNIQUE约束表示表里一个字段或多个字段的组合必须在全表范围内唯一；对于唯一约束NULL被认为是互不相等的；column_name(length)是前缀键（具体参见CREATE INDEX章节的column_name ( length )）；index_name为索引名。"
  source_anchor: "2.4.2.8.19 参数说明 页2167-2168"
  source_refs: *refmcts
  status: confirmed
- id: m_cts_wave8_113_check_default
  type: constraint
  statement: "M兼容CREATE TABLE SELECT其他约束：NOT NULL/NULL设置列是否允许空值；CHECK ( condition )插入或更新的行必须使表达式为真；DEFAULT default_expr为字段指定缺省表达式；ON UPDATE now_expr为ON UPDATE属性约束（UPDATE时字段值自动更新为当前时间戳）；[GENERATED ALWAYS] AS ( generation_expr ) [STORED | VIRTUAL]创建生成列；AUTO_INCREMENT指定自动增长列。"
  source_anchor: "2.4.2.8.19 参数说明 页2165-2167"
  source_refs: *refmcts
  status: confirmed
- id: m_cts_wave8_113_fk
  type: constraint
  statement: "M兼容CREATE TABLE SELECT外键约束：REFERENCES reftable [(refcolumn)]，省略refcolumn时使用reftable的主键（被参考列应为被参考表中唯一字段或主键）；外键约束不能定义在临时表和永久表之间；MATCH FULL不允许多字段外键的字段为NULL除非全部外键字段都是NULL，MATCH SIMPLE（缺省）允许任意外键字段为NULL；ON DELETE/ON UPDATE动作NO ACTION（缺省）/RESTRICT/CASCADE/SET NULL/SET DEFAULT；外键约束完整性检查由GUC参数foreign_key_checks控制（on/off默认on）。"
  source_anchor: "2.4.2.8.19 参数说明 页2168-2169"
  source_refs: *refmcts
  status: confirmed
- id: m_cts_wave8_113_generated
  type: constraint
  statement: "M兼容CREATE TABLE SELECT生成列限制与CREATE TABLE一致：STORED/VIRTUAL缺省规则（s2时缺省VIRTUAL）、生成表达式只能IMMUTABLE函数且不能引用当前行以外数据/系统列/自增列、虚拟生成列不支持作分区键被外键引用和创建索引、不能直接写入（可指定DEFAULT）。"
  source_anchor: "2.4.2.8.19 参数说明 生成列 页2164-2167"
  source_refs: *refmcts
  status: confirmed
- id: m_cts_wave8_113_storage_charset
  type: constraint
  statement: "M兼容CREATE TABLE SELECT存储参数与字符集：WITH支持FILLFACTOR（10~100）、ORIENTATION（仅行存ROW）、STORAGE_TYPE（USTORE/ASTORE，默认USTORE）、INIT_TD（2~128默认4）、COMPRESSION、COMPRESSLEVEL、segment、enable_tde等（与CREATE TABLE一致）；{CHARSET} charset单独指定时字段字符序设为该字符集默认字符序；COLLATE从pg_collation查询（默认default行）；仅字符类型支持指定字符集（BINARY转二进制仅TEXT→BLOB映射）；字段未显式指定时从表默认继承。"
  source_anchor: "2.4.2.8.19 参数说明 页2165-2167"
  source_refs: *refmcts
  status: confirmed
- id: m_cts_wave8_113_examples
  type: behavior_oracle
  statement: "示例（m_db）：无自定义列CREATE TABLE test2 AS SELECT * FROM test1（SHOW CREATE TABLE显示CHARACTER SET = \"UTF8\" COLLATE = \"utf8mb4_general_ci\"、WITH orientation=row storage_type=USTORE）；含自定义列CREATE TABLE test3(col0 int, col2 varchar(55) not null) AS SELECT * FROM test1（col0排最前，col2继承NOT NULL）；含建表选项CREATE TABLE test4(col0 int, col2 varchar(55)) CHARACTER SET gb18030 COLLATE gb18030_bin WITH(storage_type=astore) AS SELECT * FROM test1（SHOW CREATE TABLE显示GB18030与astore）。"
  source_anchor: "2.4.2.8.19 示例 页2172-2173"
  source_refs: *refmcts
  status: confirmed
- id: m_cts_wave8_113_show_create
  type: syntax
  statement: "M兼容SHOW CREATE TABLE命令可查看表的建表语句（示例中SHOW CREATE TABLE test2返回SET search_path、CREATE TABLE字段定义、CHARACTER SET/COLLATE及WITH存储参数信息），为M兼容特性命令。"
