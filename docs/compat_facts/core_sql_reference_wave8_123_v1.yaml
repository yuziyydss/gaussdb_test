facts:
- id: m_str_wave8_123_overview
  type: constraint
  statement: "M兼容字符串函数通用规则：对于对字符串位置进行操作的函数，第一个位置的编号为1；对于使用了长度作为参数的函数，非整数的参数将四舍五入到最接近的整数；如果数据库字符集是SQL_ASCII，数据库将把字节值0-127根据ASCII标准解释，而字节值128-255则当作无法解析的字符（无法转换或校验非ASCII字符，导致CHAR_LENGTH、FIND_IN_SET、LEFT、LOWER、REVERSE、RIGHT、STRCMP、TRIM等字符串函数产生未预期结果；使用非ASCII数据时不建议将数据库字符集设置为SQL_ASCII）。"
  source_anchor: "2.5.7 通用规则 页2340"
  source_refs: &refmstr
  - w8_123_2_5_7
  status: confirmed
- id: m_str_wave8_123_ascii_bin
  type: syntax
  statement: "ASCII(str)返回字符串str最左侧字符的ASCII码值（str为空字符串返回0，str为NULL返回NULL，返回值类型INT），示例SELECT ASCII('abc')返回97；BIN(INT N)返回N的二进制值的字符串表示形式（与CONV(TEXT N, INT from_base, INT to_base)且from_base为10、to_base为2功能相同，返回值类型TEXT），示例SELECT BIN(12)返回1100。"
  source_anchor: "2.5.7 ASCII/BIN 页2340-2341"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_length_funcs
  type: constraint
  statement: "M兼容长度函数：BIT_LENGTH(str)返回字符串str的比特位长度（BIGINT，'text'为32）；LENGTH(str)返回字符串str包含的字节数（多字节字符计为多个字节，BIGINT）；CHAR_LENGTH(str)与CHARACTER_LENGTH(str)返回字符数；示例SELECT CHAR_LENGTH('你好')返回2而LENGTH('你好')返回6（UTF8三字节编码）。"
  source_anchor: "2.5.7 BIT_LENGTH/LENGTH/CHAR_LENGTH 页2341,2345-2346"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_concat
  type: syntax
  statement: "M兼容CONCAT(str1, str2, ..., strN)将字符串按顺序拼接（如果有一个字符串为NULL则返回NULL，返回值类型TEXT/BLOB）；CONCAT_WS(separator, str1, str2, ..., strN)按顺序拼接且相邻字符串使用separator分割（separator为NULL返回NULL，待拼接字符串为NULL时被忽略），示例SELECT CONCAT_WS(',', 'hello', NULL, 'world', '!')返回hello,world,!。"
  source_anchor: "2.5.7 CONCAT/CONCAT_WS 页2342-2343"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_elt_field
  type: constraint
  statement: "M兼容ELT(INT N, TEXT str1, TEXT str2, ...)返回字符串列表的第N个元素（N为空、小于1、大于字符串总个数或N位置处字符串为NULL则返回NULL）；FIELD(str, str1, str2, str3, ...)返回str在列表中的位置；FIND_IN_SET(str, strlist)在逗号分隔列表中查找。"
  source_anchor: "2.5.7 ELT/FIELD/FIND_IN_SET 页2343-2344"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_export_format
  type: syntax
  statement: "M兼容EXPORT_SET(INT bits, TEXT on, TEXT off[, TEXT separator[, INT length]])按bits的每一位生成on/off字符串序列（参数说明见表2-48）；FORMAT(INT X, INT D [, TEXT locale])格式化数字（千分位分隔与D位小数，支持locale参数）。"
  source_anchor: "2.5.7 EXPORT_SET/FORMAT 页2343-2344"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_insert_instr
  type: syntax
  statement: "M兼容INSERT(str,pos,len,newstr)将字符串str从pos位置开始长度为len的子串替换为newstr；INSTR(str,substr)返回子串substr在字符串str中第一次出现的位置。"
  source_anchor: "2.5.7 INSERT/INSTR 页2344-2345"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_left_lower
  type: constraint
  statement: "M兼容LEFT(str, len)返回字符串str最左侧的len个字符（str或len为NULL返回NULL，len超过字符串长度返回整个字符串，示例LEFT('abcdef', 3)返回abc、LEFT('abcdef', 11)返回abcdef，TEXT/BLOB）；LOWER(str)与LCASE(str)功能、用法一致，将字符串中大写字母转换为小写字母（TEXT/BLOB）。"
  source_anchor: "2.5.7 LEFT/LOWER/LCASE 页2345-2346"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_lpad_ltrim
  type: constraint
  statement: "M兼容LPAD(str, len, padstr)左侧填充至len长度；LTRIM(str)去除字符串左侧空格；MAKE_SET(INT bits, TEXT str1, TEXT str2,...)按位生成字符串集合。"
  source_anchor: "2.5.7 LPAD/LTRIM/MAKE_SET 页2346-2347"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_mid_ord
  type: syntax
  statement: "M兼容MID(TEXT str, INT pos)、MID(str FROM pos)、MID(TEXT str, INT pos, INT len)、MID(str FROM pos FOR len)与SUBSTR等价；OCT(INT N)返回N的八进制字符串表示形式；ORD(TEXT str)返回字符编码；POSITION(substr in str)等同于LOCATE。"
  source_anchor: "2.5.7 MID/OCT/ORD/POSITION 页2347-2348"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_quote_random
  type: constraint
  statement: "M兼容QUOTE(TEXT str)生成SQL转义字符串；RANDOM_BYTES(INT len)返回指定长度len的随机字符串（入参为NULL返回NULL，入参值不在[1, 1024]则返回Length value is out of range错误信息，返回值类型BLOB）。"
  source_anchor: "2.5.7 QUOTE/RANDOM_BYTES 页2348"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_repeat_replace
  type: constraint
  statement: "M兼容REPEAT(str, count)返回字符串str重复count次组成的字符串（count小于等于0返回NULL，str或count为NULL返回NULL；返回值长度受GUC参数max_allowed_packet影响，最大取值为Min(max_allowed_packet, 1073741819)）；REPLACE(str, from_str, to_str)字符串替换；REVERSE(str)字符串反转。"
  source_anchor: "2.5.7 REPEAT/REPLACE/REVERSE 页2348-2349"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_right_rpad
  type: constraint
  statement: "M兼容RIGHT(str, len)返回字符串str最右侧的len个字符；RPAD(str, len, padstr)右侧填充至len长度；RTRIM(str)去除字符串右侧空格。"
  source_anchor: "2.5.7 RIGHT/RPAD/RTRIM 页2349-2350"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_sha
  type: constraint
  statement: "M兼容SHA(str)计算SHA-1校验和（40个十六进制数字组成的字符串），SHA1(str)是SHA函数的别名功能用法相同；SHA2(str, hash_length)计算字符串str的SHA-2检验和（hash_length对应相应SHA2算法，可选值为0(SHA-256)、224(SHA-224)、256(SHA-256)、384(SHA-384)、512(SHA-512)）；SHA/SHA1/SHA2加密算法安全性低存在安全风险不建议使用，且会在日志中记录哈希的明文，不建议用户用该函数加密密钥等敏感信息。"
  source_anchor: "2.5.7 SHA/SHA1/SHA2 页2350-2351"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_md5
  type: constraint
  statement: "M兼容MD5(TEXT str)用于计算一个给定字符串的MD5摘要并将结果作为32位十六进制字符串返回；MD5加密算法安全性低存在安全风险不建议使用；MD5函数会在日志中记录哈希的明文，因此不建议用户用该函数加密密钥等敏感信息。"
  source_anchor: "2.5.7 MD5 页2348-2349"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_soundex_space
  type: constraint
  statement: "M兼容SOUNDEX(str)返回一个经过soundex规则转换后的字符串（返回值类型TEXT/VARCHAR/BLOB）；SPACE(N)返回由N个空格组成的字符串（如果N小于等于0返回空字符串，返回值类型TEXT）。"
  source_anchor: "2.5.7 SOUNDEX/SPACE 页2349-2350"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_strcmp_substr
  type: syntax
  statement: "M兼容STRCMP(str1, str2)比较str1与str2是否相同（相同返回0，不同返回-1或1）；SUBSTR有五种形式：SUBSTR(str, pos)、SUBSTR(str FROM pos)、SUBSTR(str, pos, len)、SUBSTR(str FROM pos FOR len)、SUBSTR(str FOR len)；规则：pos的位置从1开始计数；参数中包含NULL时返回NULL；pos为负数时从str尾部向头部倒序确定起始位置；len小于等于0、pos的位置为0、pos的位置越界时返回空字符串。"
  source_anchor: "2.5.7 STRCMP/SUBSTR 页2350-2351"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_substring_index
  type: syntax
  statement: "M兼容SUBSTRING_INDEX(str, delim, count)使用分隔符delim和次数count确定字符串str中最终分隔符的位置并返回最终分隔符左侧（或右侧）的全部字符（匹配分隔符delim时区分大小写）：count为正数从左侧开始计数直到delim出现count次返回最终分隔符左侧全部字符；count为负数从右侧开始计数返回最终分隔符右侧全部字符；任意参数为NULL返回NULL；str或delim为空字符串返回空字符串；count等于0返回空字符串。示例SELECT SUBSTRING_INDEX('abc..def..ghi..jkl....', '..', 3)返回abc..def..ghi、-3返回jkl....。"
  source_anchor: "2.5.7 SUBSTRING_INDEX 页2352-2353"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_to_base64_upper
  type: syntax
  statement: "M兼容TO_BASE64(TEXT str)将字符串转换为base-64编码形式（参数不为字符串时转换前先转换为字符串，返回值长度受GUC参数max_allowed_packet影响最大取值为Min(max_allowed_packet, 1073741819)）；UPPER(str)将字符串中小写字母转换为大写字母（示例SELECT UPPER('Hello,world!')返回HELLO,WORLD!）；LOCATE(TEXT substr, TEXT str[, INT pos])返回substr在str中第一次出现的位置（从位置pos默认1开始计算，无法匹配返回0，返回值类型BIGINT），示例LOCATE('bar', 'foobarbar')返回4、LOCATE('bar', 'foobarbar', 5)返回7。"
  source_anchor: "2.5.7 TO_BASE64/UPPER/LOCATE 页2354-2365"
  source_refs: *refmstr
  status: confirmed
- id: m_str_wave8_123_hex_compress
  type: syntax
  statement: "M兼容HEX(str)将字符串str转换为十六进制字符串（str中每个字符的每个字节转换为两个十六进制数字，逆运算为UNHEX）；HEX(N)将数字N转换为十六进制字符串；示例SELECT HEX('abc'), UNHEX(HEX('abc'))返回616263|abc；COMPRESS(TEXT string_to_compress)压缩字符串（可用HEX(COMPRESS('abcde'))查看）；UNCOMPRESS(LONGBLOB string_to_uncompress)解压COMPRESS压缩的字符串；UNCOMPRESSED_LENGTH(LONGBLOB compressed_string)返回压缩前字符串长度。"
  source_anchor: "2.5.7 HEX/COMPRESS/UNCOMPRESS 页2340,2354-2365"
  source_refs: *refmstr
  status: confirmed
