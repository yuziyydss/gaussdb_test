facts:
- id: resmgr_wave8_175_overview
  type: constraint
  statement: "RESOURCE_MANAGER功能与限制：资源计划高级功能包用于在内核多租模式下分配、管理PDB的资源；高级包仅允许在主机的CDB内执行，在PDB内部或者备机执行会报错。"
  source_anchor: "3.12.2.27 RESOURCE_MANAGER 页3077-3078"
  source_refs: &refrm
  - w8_175_3_12
  status: confirmed
- id: resmgr_wave8_175_catalog
  type: syntax
  statement: "RESOURCE_MANAGER接口总账（10个）：CREATE_PENDING_AREA（创建资源计划待决区）、VALIDATE_PENDING_AREA（校验待决区计划正确性）、CLEAR_PENDING_AREA（清空待决区，清空后所有修改作废）、SUBMIT_PENDING_AREA（提交待决区，提交后资源计划生效）、CREATE/UPDATE/DELETE_RESOURCE_PLAN（创建/更新/删除资源计划）、CREATE/UPDATE/DELETE_RESOURCE_PLAN_DIRECTIVE（创建/更新/删除资源计划指令）。"
  source_anchor: "3.12.2.27 RESOURCE_MANAGER 表3-518 页3077-3078"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_pending_area_concept
  type: constraint
  statement: "待决区概念：待决区是资源计划表gs_resource_plans和资源计划指令表gs_resource_plan_directives中待提交的改动数据，status字段显示为pending的数据对实际资源分配没有影响；使用submit_pending_area接口提交后改动才应用到实际资源分配、status由pending变为active；整个实例仅有一份待决区数据且不允许多个会话同时编辑。"
  source_anchor: "3.12.2.27 CREATE_PENDING_AREA 页3078"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_create_pending_area
  type: syntax
  statement: "CREATE_PENDING_AREA原型：RESOURCE_MANAGER.CREATE_PENDING_AREA() returns void；创建资源计划待决区，进入可编辑资源计划的状态；如果其他会话已经创建并持有待决区，此时创建待决区将报错失败。"
  source_anchor: "3.12.2.27 CREATE_PENDING_AREA 页3078"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_validate_pending_area
  type: constraint
  statement: "VALIDATE_PENDING_AREA()验证待决区所有资源计划的正确性，验证点：任一资源计划分配的min_cpu之和不能超过环境最大CPU核数；max_dynamic_memory之和不能超过CDB的max_dynamic_memory的90%（内存份额可通过gs_total_memory_detail视图获取）；max_shared_memory之和不能超过CDB的max_shared_memory的90%；max_connections之和不能超过CDB的max_connections的90%且不能超过CDB的max_connections减去CDB已占用的连接数；正在使用的资源计划为所有open状态的PDB均分配了资源；如果分配内存/连接数到PDB后将导致CDB可用内存或连接数资源不足，校验将报错失败。"
  source_anchor: "3.12.2.27 VALIDATE_PENDING_AREA 页3078"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_clear_submit
  type: syntax
  statement: "CLEAR_PENDING_AREA()与SUBMIT_PENDING_AREA()：CLEAR清空待决区——把gs_resource_plans和gs_resource_plan_directives表中status为pending的待决区数据全部删除并释放待决区（所有修改均作废）；SUBMIT激活PendingArea中的待决区计划指令并释放待决区（如涉及改动当前使用的计划，提交后资源按新改动分配；提交前会对PendingArea做一次资源配额校验，规则与VALIDATE_PENDING_AREA相同）。"
  source_anchor: "3.12.2.27 CLEAR/SUBMIT_PENDING_AREA 页3078"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_create_plan
  type: syntax
  statement: "CREATE_RESOURCE_PLAN原型：RESOURCE_MANAGER.CREATE_RESOURCE_PLAN(name name, comment text DEFAULT NULL::text)；创建资源计划：在gs_resource_plans系统表创建一条状态为pending的待决区资源计划。"
  source_anchor: "3.12.2.27 CREATE_RESOURCE_PLAN 页3079"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_update_delete_plan
  type: syntax
  statement: "UPDATE_RESOURCE_PLAN与DELETE_RESOURCE_PLAN：更新/删除资源计划（在PendingArea中进行，需提交待决区后生效）。"
  source_anchor: "3.12.2.27 UPDATE/DELETE_RESOURCE_PLAN 页3079-3080"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_create_directive
  type: syntax
  statement: "CREATE_RESOURCE_PLAN_DIRECTIVE原型：RESOURCE_MANAGER.CREATE_RESOURCE_PLAN_DIRECTIVE(plan_name name DEFAULT default_resource_plan, pdb_name name, min_cpu integer DEFAULT -1, max_dynamic_memory name DEFAULT -1, max_shared_memory name DEFAULT -1, max_connections integer DEFAULT -1, io_limits integer DEFAULT 0, io_priority name DEFAULT NULL, comment text DEFAULT NULL)；在PendingArea中为指定计划创建一条属于指定PDB的资源配额指令（plan_name大小写不敏感）。"
  source_anchor: "3.12.2.27 CREATE_RESOURCE_PLAN_DIRECTIVE 页3080-3081"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_directive_params
  type: constraint
  statement: "指令参数范围：min_cpu≥1（保证PDB可用CPU个数，不超过CDB最大核数）；max_dynamic_memory≥1G或-1不控制（不超过CDB max_dynamic_memory的90%，可用pv_total_memory_detail系统函数查询）；max_shared_memory≥256MB或-1（不超过90%）；max_connections≥10或-1（不超过CDB max_connections的90%）；io_limits≥0（每秒触发I/O次数上限，行存单位io_control_unit默认6000次/s，0表示不控制）；io_priority为None/Low/Medium/High——磁盘I/O利用率达到50%时生效（High为过去3s平均I/O速度的50%最低不低于50、Medium 20%最低20、Low 10%最低10）。"
  source_anchor: "3.12.2.27 表3-522 页3081-3083"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_update_directive
  type: syntax
  statement: "UPDATE_RESOURCE_PLAN_DIRECTIVE：更新计划指令（参数与CREATE一致，除plan_name/pdb_name外其余参数为NULL时不做变更；io_limits/io_priority/max_*等均NULL为不做变更）。"
  source_anchor: "3.12.2.27 UPDATE_RESOURCE_PLAN_DIRECTIVE 页3082-3083"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_delete_directive
  type: syntax
  statement: "DELETE_RESOURCE_PLAN_DIRECTIVE原型：RESOURCE_MANAGER.DELETE_RESOURCE_PLAN_DIRECTIVE(plan_name name DEFAULT default_resource_plan, pdb_name name) returns void；在PendingArea中为指定计划删除一条属于指定PDB的资源配额的指令；创建并提交多个资源计划后可以通过ALTER SYSTEM SET语法变更当前生效的资源计划。"
  source_anchor: "3.12.2.27 DELETE_RESOURCE_PLAN_DIRECTIVE 页3084"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_pending_area_exclusive
  type: constraint
  statement: "待决区互斥：整个实例仅有一份待决区数据且不允许多个会话同时编辑；如果其他会话已经创建并持有待决区，此时创建待决区将报错失败。"
  source_anchor: "3.12.2.27 CREATE_PENDING_AREA 页3078"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_internal_overview
  type: constraint
  statement: "3.12.3 内部接口概述：以下接口为各高级包内部接口，不建议用户直接调用，否则可能出现异常行为或非预期运行效果；涵盖DBE_DESCRIBE、DBE_ALERT、DBE_UTILITY三个高级包的内部接口。"
  source_anchor: "3.12.3 内部接口 页3084"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_internal_describe_alert
  type: syntax
  statement: "DBE_DESCRIBE内部接口：GET_PROCEDURE_NAME（从用户的原始输入中提取出存储过程或函数的名称）、IS_NUMBER_TYPE（判断类型是否为数值类型）。DBE_ALERT内部接口：WAITANY_FUNC（等待任一警报收到信号，功能同WAITANY）、WAITONE_FUNC（等待传入警报收到信号，警报必须在当前会话注册列表中，功能同WAITONE）、INFO_FUNC（获取当前会话中已注册警报信息）。"
  source_anchor: "3.12.3 表3-525/3-526 页3084"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_internal_utility_1
  type: syntax
  statement: "DBE_UTILITY内部接口（一）：EXPAND_SQL_TEXT（将包含视图或同义词的SQL语句展开为仅引用基表和表联接的等价查询）、CANONICALIZE_RET（对表/视图/列/用户等对象名称标准化格式化处理）、COMMA_TO_TABLE_FUNC（逗号分隔字符串列表转PL/SQL索引表并返回元素个数）、COMPILE_SCHEMA（推荐使用系统函数gs_compile_schema(schema_name, compile_all, retry_times)批量编译指定模式下无效或全部PL/SQL对象）、NAME_SEPARATE（按命名规则对对象名称结构化拆分出模式名/对象名/dblink）、NAME_TOKENIZE_FUNC/NAME_TOKENIZE_LOWER/NAME_TOKENIZE_LOWER_FUNC（将对象名称解析为五个部分，LOWER版并将所有部分转换为小写）。"
  source_anchor: "3.12.3 表3-527 页3084-3085"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_internal_utility_2
  type: syntax
  statement: "DBE_UTILITY内部接口（二）：PRIVILEGE_CHECK（检查当前用户对指定数据库对象的权限）、SEARCH_CLASS_WITH_NSPOID_ONAME_TYPE（指定命名空间中按名称和类型搜索对象返回oid及数量）、SEARCH_OBJECTS（按模式名/对象名/对象类型搜索返回oid、类型及是否同义词）、SEARCH_OBJECTS_SYNONYM_FILL_SECHEMA（多个可能模式中搜索指定名称和类型对象）、SEARCH_PROCEDURE_WITH_NSPOID_ONAME（检索指定模式oid和名称对应的函数/存储过程/包）、SEARCH_SYNONM_WITH_NSPOID_ONAME（检索同义词）、TABLE_TO_COMMA_FUNC（数组转字符串）、USER_NAME（返回当前数据库用户名）。"
  source_anchor: "3.12.3 表3-527 页3085"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_lifecycle
  type: behavior_oracle
  statement: "RESOURCE_MANAGER生命周期流程基线：CREATE_PENDING_AREA进入编辑态→CREATE_RESOURCE_PLAN/CREATE_RESOURCE_PLAN_DIRECTIVE（可UPDATE/DELETE调整）→VALIDATE_PENDING_AREA校验→SUBMIT_PENDING_AREA提交生效；CLEAR_PENDING_AREA作废全部改动；提交后通过ALTER SYSTEM SET变更当前生效的资源计划。"
  source_anchor: "3.12.2.27 待决区/校验/提交说明 页3078"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_stats_tables
  type: syntax
  statement: "待决区数据存储：资源计划存储于系统表gs_resource_plans、资源计划指令存储于gs_resource_plan_directives，status字段以pending/active标识待提交与生效状态。"
  source_anchor: "3.12.2.27 CREATE_PENDING_AREA 页3078"
  source_refs: *refrm
  status: confirmed
- id: resmgr_wave8_175_altersystem_switch
  type: constraint
  statement: "生效资源计划切换：创建并提交多个资源计划后，可以通过ALTER SYSTEM SET语法变更当前生效的资源计划（DELETE_RESOURCE_PLAN_DIRECTIVE与UPDATE_RESOURCE_PLAN_DIRECTIVE说明均强调该方式）。"
  source_anchor: "3.12.2.27 DELETE/UPDATE_RESOURCE_PLAN_DIRECTIVE说明 页3083-3084"
  source_refs: *refrm
  status: confirmed
