- id: guc_wave8_218_dcf_security_majority
  type: constraint
  statement: "DCF安全/多数派参数：dcf_encrypt_algorithm SIGHUP枚举PLAIN/AES_256_GCM/SM4_CBC默认PLAIN DCF加密算法（需与dcf_ssl配合使用）；dcf_log_file_permission SIGHUP枚举600/640默认600 DCF运行日志文件属性（安装阶段配置不支持修改）；dcf_log_path_permission SIGHUP枚举700/750默认700 DCF运行日志目录属性（同组用户访问选750否则700/安装阶段配置不支持修改）；dcf_majority_groups SIGHUP字符串默认空策略化多数派功能——空=关闭/有效group值逗号分隔=开启（group值需在dcf_config中存在/增删节点或调整group需同步修改/group内至少一台备机收到日志/所有节点故障做build需从列表移除待恢复后再配置）；dcf_node_id_map SIGHUP字符串默认空DN备机名称与DCF node_id映射字典（格式standby_name1:dcf_node_id1逗号分隔/synchronous_standby_names需包含在字典内/安装升级节点替换使用/设置不当集群安装升级失败）；dcf_candidate_names SIGHUP字符串默认空DCF候选者列表（自动模式下选举策略受此控制不在此列表的DN无法当主机/依赖dcf_node_id_map）；dcf_thread_effective_time SIGHUP整型0~2147483647秒默认600 DCF刷盘线程存活有效时间（0关闭I/O hang检测/超时触发降备）。"
