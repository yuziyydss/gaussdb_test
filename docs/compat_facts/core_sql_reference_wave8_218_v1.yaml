  statement: "Undo参数（仅对Ustore有效）：undo_space_limit_size SIGHUP整型102400~2147483647页默认33554432（256GB）undo强制回收阈值（达80%启动强制回收/建议不小于undo_limit_size_per_transaction/长事务大事务需调大参考gs_stat_undo info列/偏小可能报snapshot too old the undo record has been forcibly discard/磁盘不足时偏大可能影响业务）；undo_limit_size_per_transaction SIGHUP整型256~2147483647页默认4194304（32GB）单事务undo分配空间阈值（超过1TB实际生效为1TB/偏小报undo size of the transaction exceeds the threshold事务回滚）。"
