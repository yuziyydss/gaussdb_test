- id: guc_wave8_218_dcf_basic
  type: constraint
  statement: "DCF基础参数：enable_dcf SIGHUP布尔型默认off是否开启DCF模式（不建议手动修改/需DCF日志复制模式时用模式切换命令切勿手动修改）；dcf_ssl POSTMASTER布尔型默认on不再使用DCF复用GUC参数ssl；dcf_config SIGHUP字符串安装时由OM配置不允许修改；dcf_data_path SIGHUP字符串默认DN数据目录下dcf_data目录；dcf_log_path SIGHUP字符串默认DN数据目录下dcf_log目录；dcf_node_id SIGHUP整型1~2147483647默认安装自定义DCF所在DN节点ID。"
  source_anchor: "7.3.39 DCF参数设置 页4764-4766"
  source_refs: *refw8218
  status: confirmed
- id: guc_wave8_218_dcf_workers_threshold
  type: syntax
  statement: "DCF线程/阈值参数：dcf_max_workers POSTMASTER整型0~262143默认40 DCF回调函数线程最大个数（过大资源不足集群安装失败）；dcf_truncate_threshold SIGHUP整型1~2147483647默认100000 DN对DCF日志truncate门限（过大日志长期不truncate挤占内存）；dcf_election_timeout SIGHUP整型1~600秒默认3 leader和follower选举超时（DCF节点间最大时钟差异<超时一半/手动模式禁止修改按默认设置）。"
  source_anchor: "7.3.39 DCF参数设置 页4766-4767"
  source_refs: *refw8218
  status: confirmed
- id: guc_wave8_218_dcf_mode_log
  type: syntax
  statement: "DCF模式/日志参数：dcf_enable_auto_election_priority SIGHUP整型0/1默认1优先级选主自动调整；dcf_election_switch_threshold SIGHUP整型0~2147483647秒默认0防频繁切主门限（按业务可接受最大故障时间配置）；dcf_run_mode SIGHUP枚举0自动选举/1手动选举/2去使能选举默认1（去使能仅少数派恢复/修改导致不可用/手动模式切换命令cm_ctl set --param --server -k dn_arbitrate_mode=paxos+gs_guc reload dcf_run_mode=0/自动模式设0）；dcf_log_level SIGHUP字符串默认RUN_ERR|RUN_WAR|DEBUG_ERR|OPER|RUN_INF|PROFILE日志级别（NONE关闭不能与级别混用/9种级别竖线组合不能空字符串）；dcf_log_backup_file_count SIGHUP整型1~1000默认100运行日志备份保留个数；dcf_max_log_file_size SIGHUP整型1~1000MB默认10单个日志文件最大大小；dcf_socket_timeout POSTMASTER整型10~600000ms默认5000通信模块连接socket超时（重启生效/网络差需增大）；dcf_connect_timeout POSTMASTER整型10~600000ms默认60000建立连接超时（重启生效）。"
  source_anchor: "7.3.39 DCF参数设置 页4767-4770"
  source_refs: *refw8218
  status: confirmed
- id: guc_wave8_218_dcf_memory_flow
  type: syntax
  statement: "DCF内存/流控参数：dcf_mec_fragment_size POSTMASTER整型32~10240kB默认64通信模块fragment大小；dcf_stg_pool_max_size POSTMASTER整型32~2147483647MB默认2048存储模块内存池最大值；dcf_stg_pool_init_size POSTMASTER整型32~2147483647MB默认32存储模块内存池最小值；dcf_mec_pool_max_size POSTMASTER整型32~2147483647MB默认200通信模块内存池最大值；dcf_flow_control_disk_rawait_threshold SIGHUP整型0~2147483647微秒默认100000磁盘等待阈值（过大性能劣化内存升高）；dcf_flow_control_net_queue_message_num_threshold SIGHUP整型0~2147483647默认1024网络队列消息数阈值（过小性能劣化严重）；dcf_flow_control_cpu_threshold SIGHUP整型0~2147483647默认100 CPU流控阈值（过小性能劣化严重）；dcf_mec_batch_size等批量/缓冲区参数。"
