- id: dbe_alert_usage_pattern
  type: behavior_oracle
  statement: DBE_ALERT使用流程：1.REGISTER(name)注册 → 2.另一会话SIGNAL(name, message)发送 → 3.WAITANY/WAITONE等待接收
