    status: confirmed
    verification_method: 逐页精读（页2717）

  - id: dbe_alert_waitany
    type: syntax
    statement: "DBE_ALERT.WAITANY(name OUT VARCHAR2, message OUT VARCHAR2, status OUT INTEGER, timeout IN INTEGER)：等待注册列表中任一警报。"
    source_anchor: "3.12.2 表3-144"
    status: confirmed
    verification_method: 逐页精读（页2717-2718）

  - id: dbe_alert_waitone
    type: syntax
    statement: "DBE_ALERT.WAITONE(name IN VARCHAR2, message OUT VARCHAR2, status OUT INTEGER, timeout IN INTEGER)：等待指定警报的信号。"
    source_anchor: "3.12.2 表3-145"
    status: confirmed
    verification_method: 逐页精读（页2718）

  - id: dbe_alert_usage_pattern
    type: behavior_oracle
    statement: "DBE_ALERT使用流程：1.REGISTER(name)注册 → 2.另一会话SIGNAL(name, message)发送 → 3.WAITANY/WAITONE等待接收 → 4.REMOVE取消注册。用于跨会话事件通知。"
    source_anchor: "3.12.2 综合分析"
    status: confirmed
    verification_method: 综合接口定义分析

