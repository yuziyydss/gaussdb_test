facts:
- id: usermap_wave8_58_create_purpose
  type: syntax
  statement: "CREATE USER MAPPING用于创建用户到外部服务器的新映射；用户映射通常包含连接信息，外部数据包装器使用该信息和外部服务器信息一起访问外部数据源。"
  source_anchor: "1.13.9.59 页1634"
  source_refs: &refcreate
  - w8_58_1_13_9_59
  status: confirmed
- id: usermap_wave8_58_create_permissions
  type: constraint
  statement: "外部服务器所有者可以为任意用户创建该服务器的用户映射；如果用户被授予服务器上的USAGE特权，该用户可以为自己的用户名创建用户映射。"
  source_anchor: "1.13.9.59 页1634"
  source_refs: *refcreate
  status: confirmed
- id: usermap_wave8_58_password_key_files
  type: constraint
  statement: "OPTIONS中出现password选项时，需确保每个节点的$GAUSSHOME/bin目录下存在usermapping.key.cipher和usermapping.key.rand；若不存在，需使用gs_guc生成并用gs_ssh发布到各节点。"
  source_anchor: "1.13.9.59 注意事项 页1634"
  source_refs: *refcreate
  status: confirmed
- id: usermap_wave8_58_sensitive_options
  type: constraint
  statement: "OPTIONS中的敏感字段（如password）使用多层引号时，语义与不带引号场景不同，不会被识别为敏感字段进行脱敏。"
  source_anchor: "1.13.9.59 注意事项 页1635"
  source_refs: *refcreate
  status: confirmed
- id: usermap_wave8_58_create_syntax
  type: syntax
  statement: "CREATE USER MAPPING FOR {user_name|USER|CURRENT_USER|PUBLIC} SERVER server_name [OPTIONS (option 'value'[, ...])]。"
  source_anchor: "1.13.9.59 语法格式 页1635"
  source_refs: *refcreate
  status: confirmed
- id: usermap_wave8_58_target_users
  type: syntax
  statement: "CREATE USER MAPPING的目标可为现有用户名、USER、CURRENT_USER或PUBLIC；CURRENT_USER和USER匹配当前用户名称，PUBLIC创建公共映射。"
  source_anchor: "1.13.9.59 user_name/USER/CURRENT_USER/PUBLIC 页1635"
  source_refs: *refcreate
  status: confirmed
- id: usermap_wave8_58_server_name
  type: syntax
  statement: "server_name指定用于创建用户映射的现有外部服务器名称。"
  source_anchor: "1.13.9.59 server_name 页1635"
  source_refs: *refcreate
  status: confirmed
- id: usermap_wave8_58_create_options
  type: constraint
  statement: "CREATE USER MAPPING的OPTIONS定义映射实际使用的用户名和密码等，选项名必须唯一；允许的选项名和值取决于该服务器的外部数据包装器。"
  source_anchor: "1.13.9.59 OPTIONS 页1635"
  source_refs: *refcreate
  status: confirmed
- id: usermap_wave8_58_password_storage
  type: behavior_oracle
  statement: "用户密码会加密后保存到系统表PG_USER_MAPPING；加密使用usermapping.key.cipher和usermapping.key.rand作为密码文件和加密因子，两个文件需放入各节点$GAUSSHOME/bin并确保读权限。"
  source_anchor: "1.13.9.59 OPTIONS说明 页1635"
  source_refs: *refcreate
  status: confirmed
- id: usermap_wave8_58_key_generation
  type: syntax
  statement: "首次使用前可执行gs_ssh -c \"gs_guc generate -o usermapping -S default -D $GAUSSHOME/bin\"创建加密密码文件和加密因子；-S为default时随机生成密码，也可指定密码用于保证生成文件的安全性和唯一性。"
  source_anchor: "1.13.9.59 OPTIONS说明 页1635"
  source_refs: *refcreate
  status: confirmed
- id: usermap_wave8_58_create_example
  type: behavior_oracle
  statement: "示例中创建角色bob、外部服务器my_server后，可用CREATE USER MAPPING FOR bob SERVER my_server OPTIONS (USER 'bob', PASSWORD '...')创建映射。"
  source_anchor: "1.13.9.59 示例 页1635"
  source_refs: *refcreate
  status: confirmed
- id: usermap_wave8_58_alter_purpose_permissions
  type: constraint
  statement: "ALTER USER MAPPING更改用户到外部服务器的映射定义；外部服务器所有者可为任何用户更改该服务器的用户映射，拥有服务器USAGE权限的用户可更改自己用户名的映射。"
  source_anchor: "1.13.7.45 页1346"
  source_refs: &refalt
  - w8_58_1_13_7_45
  status: confirmed
- id: usermap_wave8_58_alter_key_files
  type: constraint
  statement: "ALTER USER MAPPING的OPTIONS中出现password时，需确保每个节点$GAUSSHOME/bin下存在usermapping.key.cipher和usermapping.key.rand；不存在时用gs_guc生成并用gs_ssh发布。"
  source_anchor: "1.13.7.45 注意事项 页1346"
  source_refs: *refalt
  status: confirmed
- id: usermap_wave8_58_alter_sensitive_options
  type: constraint
  statement: "ALTER USER MAPPING的OPTIONS中敏感字段（如password）使用多层引号时，语义与不带引号场景不同，不会被识别为敏感字段进行脱敏。"
  source_anchor: "1.13.7.45 注意事项 页1346"
  source_refs: *refalt
  status: confirmed
- id: usermap_wave8_58_alter_syntax
  type: syntax
  statement: "ALTER USER MAPPING FOR {user_name|USER|CURRENT_USER|PUBLIC} SERVER server_name OPTIONS ([ADD|SET|DROP] option['value'][, ...])用于更改映射定义。"
  source_anchor: "1.13.7.45 语法格式 页1346"
  source_refs: *refalt
  status: confirmed
- id: usermap_wave8_58_alter_target_users
  type: syntax
  statement: "ALTER USER MAPPING的user_name可为映射用户名；CURRENT_USER和USER匹配当前用户，PUBLIC匹配系统中所有当前及未来用户名。"
  source_anchor: "1.13.7.45 user_name 页1347"
  source_refs: *refalt
  status: confirmed
- id: usermap_wave8_58_alter_server_name
  type: syntax
  statement: "ALTER USER MAPPING的server_name为该用户映射的外部服务器名。"
  source_anchor: "1.13.7.45 server_name 页1347"
  source_refs: *refalt
  status: confirmed
- id: usermap_wave8_58_alter_options_semantics
  type: constraint
  statement: "ALTER USER MAPPING的OPTIONS用于更改映射选项，新选项会覆盖之前指定选项；ADD、SET和DROP指定动作，未显式指定时假定为ADD；选项名必须唯一并由服务器的外部数据包装器验证。"
  source_anchor: "1.13.7.45 OPTIONS 页1347"
  source_refs: *refalt
  status: confirmed
- id: usermap_wave8_58_drop_purpose_syntax
  type: syntax
  statement: "DROP USER MAPPING删除用户到外部服务器的用户映射，语法为DROP USER MAPPING [IF EXISTS] FOR {user_name|USER|CURRENT_USER|PUBLIC} SERVER server_name。"
  source_anchor: "1.13.10.48 页1702-1703"
  source_refs: &refdrop
  - w8_58_1_13_10_48
  status: confirmed
- id: usermap_wave8_58_drop_if_exists_targets
  type: constraint
  statement: "DROP USER MAPPING的IF EXISTS在映射存在时删除成功，不存在时不删除并返回NOTICE；user_name可用CURRENT_USER或USER匹配当前用户，PUBLIC匹配系统中所有现存和未来用户名；server_name为用户映射的服务器名。"
  source_anchor: "1.13.10.48 IF EXISTS/参数 页1702-1703"
  source_refs: *refdrop
  status: confirmed
open_questions:
- id: usermap_wave8_58_oq_runtime
  statement: "CREATE/ALTER/DROP USER MAPPING在真实FDW、加密密钥文件、PUBLIC映射、OPTIONS权限和跨节点发布组合下的行为与错误矩阵需授权环境实机验证。"
  status: open
