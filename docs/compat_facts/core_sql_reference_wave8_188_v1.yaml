facts:
- id: mcompat_wave8_188_overview
  type: syntax
  statement: "M-Compatibility模式数据类型兼容性概述：GaussDB数据类型大部分功能场景与MySQL一致但存在部分差异；除特别说明外GaussDB中的数据类型精度/标度/位数大小等默认不支持用浮点型数值定义（建议使用合法的整型数值定义）。"
  source_anchor: "4.4.2.1.1 数据类型兼容性概述 页3292"
  source_refs: &refmc
  - w8_188_4_4_2
  status: confirmed
- id: mcompat_wave8_188_int_types
  type: syntax
  statement: "整数类型支持：BOOL/BOOLEAN（GaussDB SELECT TRUE/FALSE输出t/f，MySQL为1/0，MySQL实际映射为TINYINT）/TINYINT[(M)][UNSIGNED][ZEROFILL]/SMALLINT[(M)][UNSIGNED][ZEROFILL]/MEDIUMINT[(M)][UNSIGNED][ZEROFILL]/INT[(M)][UNSIGNED][ZEROFILL]/INTEGER[(M)][UNSIGNED][ZEROFILL]/BIGINT[(M)][UNSIGNED][ZEROFILL]均支持；CTAS场景差异——开启enable_precision_decimal时GaussDB取最大长度（INT为11/BIGINT为20）计算列长度而MySQL按实际长度计算。"
  source_anchor: "4.4.2.1.2 表4-131整数类型/CTAS差异 页3293-3294"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_decimal_types
  type: syntax
  statement: "任意精度类型：DECIMAL[(M[,D])][ZEROFILL]/NUMERIC[(M[,D])][ZEROFILL]/DEC[(M[,D])][ZEROFILL]/FIXED[(M[,D])][ZEROFILL]均支持无差异。"
  source_anchor: "4.4.2.1.2 表4-132任意精度类型 页3294"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_float_types
  type: syntax
  statement: "浮点类型支持：FLOAT[(M,D)][ZEROFILL]/FLOAT(p)[ZEROFILL]/DOUBLE[(M,D)][ZEROFILL]/DOUBLE PRECISION[(M,D)][ZEROFILL]/REAL[(M,D)][ZEROFILL]均支持；差异——驱动中FLOAT和DOUBLE带精度标度场景数据输入超范围不支持报错；extra_float_digits=0时FLOAT4不带标度与MySQL5.7一致。"
  source_anchor: "4.4.2.1.2 表4-133浮点类型 页3295"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_datetime_types
  type: syntax
  statement: "日期与时间数据类型支持：DATE/DATETIME[(fsp)]/TIMESTAMP[(fsp)]/TIME[(fsp)]/YEAR[(4)]均支持；DATETIME/TIMESTAMP精度超最大支持精度时GaussDB截断而MySQL报错；TIME带负号零值GaussDB不显示负号MySQL显示；MySQL explicit_defaults_for_timestamp=off时TIMESTAMP自动添加NOT NULL/DEFAULT CURRENT_TIMESTAMP/ON UPDATE CURRENT_TIMESTAMP属性，=on时行为不同。"
  source_anchor: "4.4.2.1.3 表4-134日期与时间数据类型 页3295-3296"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_string_types
  type: syntax
  statement: "字符串数据类型支持：CHAR(M)/VARCHAR(M)/TINYTEXT/TEXT/MEDIUMTEXT/LONGTEXT均支持；LONGTEXT差异——GaussDB最大1GB-512字节而MySQL最大4GB-1字节；无法转义的二进制/十六进制字符串MySQL输出空字符串而GaussDB输出十六进制结果；TEXT类型——MySQL 5.7不允许设默认值而GaussDB及MySQL 8.0允许；主键差异——MySQL需指定前缀长度而GaussDB不支持指定前缀长度；索引差异——MySQL不支持除前缀索引外其他索引方法而GaussDB支持；外键差异——MySQL不支持作外键参考列而GaussDB支持。"
  source_anchor: "4.4.2.1.4 表4-135字符串数据类型 页3296-3298"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_binary_types
  type: constraint
  statement: "二进制数据类型：BINARY[(M)]/VARBINARY(M)/TINYBLOB/BLOB/MEDIUMBLOB/LONGBLOB均支持；输入格式差异——二进制/十六进制字符串GaussDB输出十六进制而MySQL按ASCII码表转义无法转义输出空；填充差异——插入字符串小于目标长度时GaussDB填充0x20而MySQL填充0x00；字符集差异——GaussDB默认数据库初始化字符集而MySQL默认BINARY字符集。"
  source_anchor: "4.4.2.1.5 表4-136二进制数据类型 页3298-3301"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_json_type
  type: syntax
  statement: "JSON类型：GaussDB支持JSON类型；M-Compatibility模式下JSON类型的使用与MySQL存在差异，具体差异在JSON函数章节描述。"
  source_anchor: "4.4.2.1.6 JSON类型 页3301-3303"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_type_attributes
  type: syntax
  statement: "数据类型支持的属性：UNSIGNED/ZEROFILL/AUTO_INCREMENT/DEFAULT/NOT NULL/NULL/ON UPDATE CURRENT_TIMESTAMP/COMMENT等属性在GaussDB和MySQL中的支持情况有差异，具体差异在各数据类型小节描述。"
  source_anchor: "4.4.2.1.7 数据类型支持的属性 页3303-3304"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_type_conversion
  type: syntax
  statement: "数据类型转换：M-Compatibility模式下数据类型转换的规则和差异在4.4.2.1.8节描述，包括隐式转换和显式转换在GaussDB与MySQL之间的差异。"
  source_anchor: "4.4.2.1.8 数据类型转换 页3304-3331"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_blob_detail
  type: constraint
  statement: "BLOB类型差异详情：MySQL 5.7中不允许设置默认值而GaussDB语法上允许；主键——MySQL不支持主键而GaussDB支持；索引——MySQL不支持除前缀索引外其他索引方法而GaussDB支持；外键——MySQL不支持而GaussDB支持；二进制/十六进制字符串输出格式——MySQL 5.7输出无法显示字符串、MySQL 8.0输出0x十六进制、GaussDB输出\\x十六进制。"
  source_anchor: "4.4.2.1.5 BLOB说明 页3299-3300"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_binary_hex_diff
  type: behavior_oracle
  statement: "BINARY类型hex输出差异基线：GaussDB INSERT 0x8000到BINARY(10)后hex(a)输出80002020202020202020（空格填充0x20）；MySQL输出80000000000000000000（零填充0x00）；WHERE hex(a)=指定值在GaussDB返回0行而MySQL返回1行。"
  source_anchor: "4.4.2.1.5 BINARY示例 页3300-3301"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_json_limits
  type: constraint
  statement: "JSON类型规格差异：MySQL JSON最大长度4GB而GaussDB最大长度小于1GB；键值对个数和数组元素个数最大值也小于MySQL。"
  source_anchor: "4.4.2.1.6 表4-137 JSON数据类型 页3301"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_json_charset
  type: constraint
  statement: "JSON字符集/字符序差异：CHARSET函数查询JSON列——MySQL返回BINARY而GaussDB返回utf8；collation函数查询JSON列——MySQL返回BINARY而GaussDB返回utf8mb4_bin；COLLATE显式指定——MySQL JSON转字符串且CTAS字段变LONGTEXT而GaussDB保持JSON且指定字符序不生效。"
  source_anchor: "4.4.2.1.6 表4-137字符集/字符序差异 页3301"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_json_orderby
  type: constraint
  statement: "JSON ORDER BY差异：MySQL中对非标量JSON类型排序行为不做规定（可能不支持排序并产生告警）；GaussDB支持对非标量JSON排序并按一定排序规则——首先比较JSON数据类型（OPAQUE>TIMESTAMP=DATETIME=TIME>DATE>...</STRING>...），同类型比较值。"
  source_anchor: "4.4.2.1.6 表4-137 ORDER BY差异 页3301-3303"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_zerofill_diff
  type: constraint
  statement: "ZEROFILL差异：MySQL 8.0以上版本默认会开头补0而GaussDB不会补0；ZEROFILL属性在整数类型（TINYINT/SMALLINT/MEDIUMINT/INT/INTEGER/BIGINT）和任意精度类型（DECIMAL/NUMERIC/DEC/FIXED）及浮点类型（FLOAT/DOUBLE/REAL）中均支持。"
  source_anchor: "4.4.2.1.2 整数类型 页3293"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_text_default_diff
  type: constraint
  statement: "TEXT类型默认值差异：MySQL 5.7不允许TEXT类型设置默认值而GaussDB及MySQL 8.0允许设置默认值；MySQL创建TEXT主键时必须指定前缀长度而GaussDB不支持指定前缀长度；MySQL不支持TEXT类型外键而GaussDB支持。"
  source_anchor: "4.4.2.1.4 TEXT类型差异 页3297"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_binary_fill_diff
  type: constraint
  statement: "BINARY类型填充差异：插入字符串长度小于目标长度时GaussDB填充符是0x20（空格）而MySQL是0x00（零字节）；默认字符集——GaussDB为数据库初始化字符集而MySQL默认类型字符集为BINARY字符集。"
  source_anchor: "4.4.2.1.5 表4-136 BINARY行 页3298"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_datetime_precision_diff
  type: constraint
  statement: "DATETIME/TIME/TIMESTAMP精度差异：指定DATETIME/TIME/TIMESTAMP精度超过支持的最大精度时GaussDB将精度截断成支持的最大精度而MySQL报错。"
  source_anchor: "4.4.2.1.3 页3295-3296"
  source_refs: *refmc
  status: confirmed
- id: mcompat_wave8_188_timestamp_defaults
  type: constraint
  statement: "MySQL TIMESTAMP默认值行为差异：explicit_defaults_for_timestamp=off时——未指定NULL/NOT NULL自动添加NOT NULL（插NULL替换为当前时间戳）、第一个TIMESTAMP字段自动添加DEFAULT CURRENT_TIMESTAMP和ON UPDATE CURRENT_TIMESTAMP、第二个及之后添加DEFAULT '0000-00-00 00:00:00'；=on时——插NULL不替换、未指定属性自动添加NULL、NOT NULL插NULL严格模式报错宽松模式插'0000-00-00 00:00:00'、不自动添加DEFAULT/ON UPDATE属性。"
  source_anchor: "4.4.2.1.3 TIMESTAMP说明 页3296"
  source_refs: *refmc
  status: confirmed
