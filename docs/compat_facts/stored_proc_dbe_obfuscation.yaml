facts:
  # 安全警告
  - id: dbe_obf_security_warning
    type: constraint
    statement: "DES、DES3和MD5算法存在安全风险，请谨慎使用DBE_OBFUSCATION_TOOLKIT。该包主要用于兼容性，不推荐新系统使用。执行时会输出WARNING: The DES/DES3/MD5 algorithm is an insecure algorithm。"
    source_anchor: "3.12.2.12 须知"
    status: confirmed
    verification_method: 逐页精读（页2794）

  # DES密钥
  - id: dbe_obf_desgetkey
    type: syntax
    statement: "DBE_OBFUSCATION_TOOLKIT.DESGETKEY(seed_string IN VARCHAR2) RETURN VARCHAR2 或 (seed IN RAW) RETURN RAW：生成DES算法密钥。生成的密钥为随机密钥。支持VARCHAR2和RAW两种入参类型。"
    source_anchor: "3.12.2.12 表3-242"
    status: confirmed
    verification_method: 逐页精读（页2794-2795）

  # DES加密
  - id: dbe_obf_desencrypt
    type: syntax
    statement: "DBE_OBFUSCATION_TOOLKIT.DESENCRYPT(input_string IN VARCHAR2, key_string IN VARCHAR2) RETURN VARCHAR2 或 (input IN RAW, key IN RAW) RETURN RAW：使用DES算法加密数据。"
    source_anchor: "3.12.2.12 表3-243"
    status: confirmed
    verification_method: 逐页精读（页2795-2796）

  # DES解密
  - id: dbe_obf_desdecrypt
    type: syntax
    statement: "DBE_OBFUSCATION_TOOLKIT.DESDECRYPT(input_string IN VARCHAR2, key_string IN VARCHAR2) RETURN VARCHAR2 或 (input IN RAW, key IN RAW) RETURN RAW：使用DES算法解密数据。"
    source_anchor: "3.12.2.12 表3-244"
    status: confirmed
    verification_method: 逐页精读（页2796-2797）

  # DES3密钥
  - id: dbe_obf_des3getkey
    type: syntax
    statement: "DBE_OBFUSCATION_TOOLKIT.DES3GETKEY(which IN INTEGER DEFAULT 0, seed_string IN VARCHAR2) RETURN VARCHAR2 或 (which IN INTEGER DEFAULT 0, seed IN RAW) RETURN RAW：生成DES3密钥。which=0返回16字节（两密钥），which=1返回24字节（三密钥）。默认0。"
    source_anchor: "3.12.2.12 表3-245"
    status: confirmed
    verification_method: 逐页精读（页2797-2798）

  # DES3加密
  - id: dbe_obf_des3encrypt
    type: syntax
    statement: "DBE_OBFUSCATION_TOOLKIT.DES3ENCRYPT(input_string IN VARCHAR2, key_string IN VARCHAR2, which IN INTEGER DEFAULT 0, iv_string IN VARCHAR2 DEFAULT NULL) RETURN VARCHAR2 或 RAW版本：使用DES3算法加密。which指定密钥模式（0=两密钥16字节，1=三密钥24字节）。iv为初始向量可选。"
    source_anchor: "3.12.2.12 表3-246"
    status: confirmed
    verification_method: 逐页精读（页2798-2799）

  # DES3解密
  - id: dbe_obf_des3decrypt
    type: syntax
    statement: "DBE_OBFUSCATION_TOOLKIT.DES3DECRYPT(input_string IN VARCHAR2, key_string IN VARCHAR2, which IN INTEGER DEFAULT 0, iv_string IN VARCHAR2 DEFAULT NULL) RETURN VARCHAR2 或 RAW版本：使用DES3算法解密。参数与DES3ENCRYPT相同。"
    source_anchor: "3.12.2.12 表3-247"
    status: confirmed
    verification_method: 逐页精读（页2799-2800）

  # MD5哈希
  - id: dbe_obf_md5
    type: syntax
    statement: "DBE_OBFUSCATION_TOOLKIT.MD5(input_string IN VARCHAR2) RETURN VARCHAR2 或 (input IN RAW) RETURN RAW：计算数据的MD5哈希值。输出WARNING警告MD5不安全。"
    source_anchor: "3.12.2.12 表3-248"
    status: confirmed
    verification_method: 逐页精读（页2800-2801）

  # 双类型接口模式
  - id: dbe_obf_dual_type_pattern
    type: behavior_oracle
    statement: "所有DBE_OBFUSCATION_TOOLKIT接口都有两种原型：VARCHAR2版本和RAW版本。VARCHAR2版本方便直接使用字符串，RAW版本可与DBE_RAW配合进行进制转换。"
    source_anchor: "3.12.2.12 综合分析"
    status: confirmed
    verification_method: 综合接口定义分析

  # 使用流程
  - id: dbe_obf_usage_pattern
    type: behavior_oracle
    statement: "DES加密流程：1.DESGETKEY生成密钥 → 2.DESENCRYPT(input, key)加密 → 3.DESDECRYPT(encrypted, key)解密。DES3流程类似但多which参数。MD5为单向哈希不可逆。RAW版本配合DBE_RAW.CAST_FROM_VARCHAR2_TO_RAW/CAST_TO_VARCHAR2转换。"
    source_anchor: "3.12.2.12 综合分析"
    status: confirmed
    verification_method: 综合接口定义分析

  # 示例
  - id: dbe_obf_example_des
    type: behavior_oracle
    statement: "示例：DESGETKEY(seed_string=>'000...0')返回随机DES密钥。执行时输出WARNING。结果用rawtohex()显示十六进制。"
    source_anchor: "3.12.2.12 示例"
    status: confirmed
    verification_method: 逐页精读（页2795）

  - id: dbe_obf_example_md5
    type: behavior_oracle
    statement: "示例：MD5(input_string=>'1234567890')返回E807F1FCF82D132F9BB018CA6738A19F。输入RAW版本：MD5(CAST_FROM_VARCHAR2_TO_RAW('1234567890'))结果相同。"
    source_anchor: "3.12.2.12 示例"
    status: confirmed
    verification_method: 逐页精读（页2800-2801）
