facts:
- id: tools_wave8_12_gsql_intro
  type: syntax
  statement: "gsql是GaussDB命令行数据库连接工具，可用于连接服务器并执行SQL语句和元命令。"
  source_anchor: "5.3.1.1 页3605"
  source_refs: &refb1
  - w8_12_5_3
  status: confirmed
- id: tools_wave8_12_gsql_connect_limit
  type: constraint
  statement: "gsql默认只支持从服务器本机连接；连接远端数据库需要在服务端配置。"
  source_anchor: "5.3.1.1 页3605"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_timeout
  type: constraint
  statement: "gsql创建连接时有5分钟超时时间；数据库未在时间内正确接受连接并完成身份认证时超时退出。"
  source_anchor: "5.3.1.1 页3605"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_basic_functions
  type: syntax
  statement: "gsql支持交互式执行SQL语句、执行SQL文件和执行元命令。"
  source_anchor: "5.3.1.1 页3605"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_variable_set
  type: syntax
  statement: "gsql通过\\set varname value设置变量，\\unset varname删除变量，不带参数的\\set显示全部变量。"
  source_anchor: "5.3.1.1 页3605"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_variable_name
  type: constraint
  statement: "gsql变量名由字母、数字和下划线组成，区分大小写；变量值可为任意长度。"
  source_anchor: "5.3.1.1 页3605"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_sql_substitution
  type: syntax
  statement: "gsql变量可在SQL中通过冒号引用，例如\\set foo 'HR.areaS'后执行SELECT * FROM :foo。"
  source_anchor: "5.3.1.1 页3606"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_prompt_vars
  type: syntax
  statement: "gsql使用PROMPT1、PROMPT2和PROMPT3分别控制普通提示符、续行提示符和COPY输入提示符。"
  source_anchor: "5.3.1.1 页3609"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_history
  type: environment
  statement: "gsql客户端操作历史由-r开启；HISTSIZE控制记录条数，默认32条，最多500条，HISTSIZE 0表示不记录。"
  source_anchor: "5.3.1.1 页3606"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_history_sensitive
  type: constraint
  statement: "gsql历史记录不会记录包含PASSWORD、IDENTIFIED、GS_ENCRYPT_AES128、GS_DECRYPT_AES128、SECRETKEY、ACCESSKEY等敏感字符串的SQL。"
  source_anchor: "5.3.1.1 页3606"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_command_option
  type: syntax
  statement: "-c/--command声明gsql执行一条字符串命令后退出。"
  source_anchor: "5.3.1.2 页3614"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_file_option
  type: syntax
  statement: "-f/--file使用文件作为命令源而不是交互式输入。"
  source_anchor: "5.3.1.2 页3614"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_list_option
  type: syntax
  statement: "-l/--list列出所有可用数据库后退出。"
  source_anchor: "5.3.1.2 页3614"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_transaction_script
  type: syntax
  statement: "-1/--single-transaction在使用-f执行脚本时把脚本放入单个事务执行。"
  source_anchor: "5.3.1.2 页3614"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_no_align
  type: syntax
  statement: "-A/--no-align切换为非对齐输出模式；-F/--field-separator设置域分隔符，默认“|”。"
  source_anchor: "5.3.1.2 页3615"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_output_redirect
  type: syntax
  statement: "-o/--output FILENAME将所有查询输出重定向到指定文件；-L/--log-file额外记录查询输出。"
  source_anchor: "5.3.1.2 页3615"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_tuples_only
  type: syntax
  statement: "-t/--tuples-only只打印行，不显示列标题和行计数；-x/--expanded启用扩展显示。"
  source_anchor: "5.3.1.2 页3615"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_connection_params
  type: syntax
  statement: "gsql使用-h指定主机，-p指定端口，-U指定用户，-W按需交互输入密码，-d指定数据库名。"
  source_anchor: "5.3.1.2 页3616"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_meta_patterns
  type: syntax
  statement: "元命令PATTERN支持*、?、字符类和schema.object形式；不指定PATTERN时显示当前搜索路径可见对象。"
  source_anchor: "5.3.1.3 页3632"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_12_gsql_permission_codes
  type: syntax
  statement: "\\dp权限显示中r=SELECT、w=UPDATE、a=INSERT、d=DELETE、D=TRUNCATE、x=REFERENCES、t=TRIGGER、X=EXECUTE、U=USAGE、C=CREATE、c=CONNECT、T=TEMPORARY、A=ALTER、P=DROP、m=COMMENT、i=INDEX、v=VACUUM，*=授权以上权限。"
  source_anchor: "5.3.1.3 页3634-3635"
  source_refs: *refb1
  status: confirmed
open_questions:
