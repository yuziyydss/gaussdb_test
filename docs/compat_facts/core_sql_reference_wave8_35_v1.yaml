facts:
- id: alvw_wave8_35_purpose
  type: syntax
  statement: "ALTER VIEW用于更改视图的各种辅助属性或重编译视图；若要修改视图的查询定义，应使用CREATE OR REPLACE VIEW。"
  source_anchor: "1.13.7.46 页1347"
  source_refs: &refb1
  - w8_35_1_13_7_46
  status: confirmed
- id: alvw_wave8_35_permissions
  type: constraint
  statement: "只有视图所有者或被授予视图ALTER权限的用户可执行ALTER VIEW；三权分立关闭时系统管理员默认拥有该权限。"
  source_anchor: "1.13.7.46 注意事项 页1348"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_schema_owner_permissions
  type: constraint
  statement: "修改视图模式要求当前用户是视图所有者或系统管理员，且对新模式有CREATE权限；修改视图所有者要求当前用户是视图所有者或系统管理员、是新所有者角色成员，且该角色对视图所在模式有CREATE权限。三权分立打开时系统管理员不能修改视图模式或所有者。"
  source_anchor: "1.13.7.46 注意事项 页1348"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_set_default_syntax
  type: syntax
  statement: "ALTER VIEW [IF EXISTS] view_name ALTER [COLUMN] column_name SET DEFAULT expression用于设置视图列默认值。"
  source_anchor: "1.13.7.46 语法格式 页1348"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_drop_default_syntax
  type: syntax
  statement: "ALTER VIEW [IF EXISTS] view_name ALTER [COLUMN] column_name DROP DEFAULT用于取消视图列默认值。"
  source_anchor: "1.13.7.46 语法格式 页1348"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_owner_syntax
  type: syntax
  statement: "ALTER VIEW [IF EXISTS] view_name OWNER TO new_owner用于修改视图所有者。"
  source_anchor: "1.13.7.46 语法格式 页1348"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_rename_syntax
  type: syntax
  statement: "ALTER VIEW [IF EXISTS] view_name RENAME TO new_name用于重命名视图。"
  source_anchor: "1.13.7.46 语法格式 页1348"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_set_schema_syntax
  type: syntax
  statement: "ALTER VIEW [IF EXISTS] view_name SET SCHEMA new_schema用于设置视图所属模式。"
  source_anchor: "1.13.7.46 语法格式 页1348"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_set_options_syntax
  type: syntax
  statement: "ALTER VIEW [IF EXISTS] view_name SET ({view_option_name [= view_option_value]}[, ...])用于设置视图选项。"
  source_anchor: "1.13.7.46 语法格式 页1348"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_reset_options_syntax
  type: syntax
  statement: "ALTER VIEW [IF EXISTS] view_name RESET (view_option_name[, ...])用于重置视图选项。"
  source_anchor: "1.13.7.46 语法格式 页1348"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_compile_syntax
  type: syntax
  statement: "ALTER VIEW view_name COMPILE用于手动重编译视图。"
  source_anchor: "1.13.7.46 语法格式 页1349"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_if_exists
  type: constraint
  statement: "IF EXISTS指定后，视图不存在时不产生错误，只产生提示信息。"
  source_anchor: "1.13.7.46 IF EXISTS 页1349"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_names
  type: syntax
  statement: "view_name必须为已存在视图名且可用模式修饰；column_name必须为已存在视图字段名；new_owner、new_name和new_schema分别表示视图的新所有者、新名称和新模式。"
  source_anchor: "1.13.7.46 参数说明 页1349"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_default_no_effect
  type: constraint
  statement: "ALTER VIEW的SET/DROP DEFAULT可设置或删除视图列缺省值，但该参数暂无实际意义。"
  source_anchor: "1.13.7.46 SET/DROP DEFAULT 页1349"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_security_barrier_option
  type: syntax
  statement: "视图选项security_barrier设置视图是否提供行级安全，取值为Boolean，缺省值为true。"
  source_anchor: "1.13.7.46 view_option 页1349"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_check_option_option
  type: constraint
  statement: "视图选项check_option控制更新视图行为，支持CASCADED或LOCAL，参数值不可缺省。"
  source_anchor: "1.13.7.46 view_option 页1349"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_compile_dependency
  type: behavior_oracle
  statement: "开启enable_view_invalidation后，若视图依赖基表被删除，pg_object.valid变为f；重建基表并执行ALTER VIEW ... COMPILE后，视图重新编译为有效，valid变为t。"
  source_anchor: "1.13.7.46 重编译视图示例 页1351-1352"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_rename_owner_schema_example
  type: behavior_oracle
  statement: "示例中ALTER VIEW可完成列默认值设置/取消、视图重命名、OWNER TO修改属主和SET SCHEMA修改模式，\\dv可观察到视图名称、所有者和模式变化。"
  source_anchor: "1.13.7.46 示例 页1349-1350"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_options_example
  type: behavior_oracle
  statement: "SET (security_barrier=TRUE)后\\dv显示{security_barrier=true}；继续SET (check_option='LOCAL')显示{security_barrier=true,check_option=LOCAL}；RESET对应选项后Storage恢复为空。"
  source_anchor: "1.13.7.46 示例 页1350-1351"
  source_refs: *refb1
  status: confirmed
- id: alvw_wave8_35_lifecycle_links
  type: syntax
  statement: "ALTER VIEW与CREATE VIEW和DROP VIEW构成视图生命周期链路。"
  source_anchor: "1.13.7.46 相关链接 页1352"
  source_refs: *refb1
  status: confirmed
