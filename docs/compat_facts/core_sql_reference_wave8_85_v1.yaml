facts:
- id: commit_end_wave8_85_purpose
  type: syntax
  statement: "通过COMMIT或者END可完成提交事务的功能，即提交事务的所有操作；语法为{COMMIT | END} [WORK | TRANSACTION]；WORK | TRANSACTION为可选关键字，仅语法兼容无实际含义。"
  source_anchor: "1.13.9.7 功能描述/语法格式/参数说明 页1374"
  source_refs: &refcommit
  - w8_85_1_13_9_7
  status: confirmed
- id: commit_end_wave8_85_visibility
  type: constraint
  statement: "COMMIT | END提交当前事务，让所有当前事务的更改为其他事务可见。"
  source_anchor: "1.13.9.7 参数说明 页1374"
  source_refs: *refcommit
  status: confirmed
- id: commit_end_wave8_85_privileges
  type: constraint
  statement: "执行COMMIT时，命令执行者必须是该事务的创建者或系统管理员，且创建和提交操作可以不在同一个会话中。"
  source_anchor: "1.13.9.7 注意事项 页1374"
  source_refs: *refcommit
  status: confirmed
- id: commit_end_wave8_85_example
  type: behavior_oracle
  statement: "示例中START TRANSACTION后INSERT两行数据，COMMIT提交事务让所有更改永久化，SELECT * FROM tpcds.customer_demographics_t2可查询到数据（相关链接ROLLBACK）。"
  source_anchor: "1.13.9.7 示例 页1374-1375"
  source_refs: *refcommit
  status: confirmed
- id: commit_prepared_wave8_85_purpose
  type: syntax
  statement: "COMMIT PREPARED提交一个早先为两阶段提交准备好的事务；语法为COMMIT PREPARED transaction_id [WITH commit_sequence_number]；transaction_id为待提交事务的标识符，不能和任何当前预备事务已经使用了的标识符同名；commit_sequence_number为待提交事务的序列号，为一个64位递增的无符号数。"
  source_anchor: "1.13.9.8 功能描述/语法格式/参数说明 页1375"
  source_refs: &refcommitp
  - w8_85_1_13_9_8
  status: confirmed
- id: commit_prepared_wave8_85_privileges
  type: constraint
  statement: "命令执行者必须是该事务的创建者或系统管理员，且创建和提交操作可以不在同一个会话中；事务功能由数据库自动维护，不应显式使用事务功能。"
  source_anchor: "1.13.9.8 注意事项 页1375"
  source_refs: *refcommitp
  status: confirmed
- id: commit_prepared_wave8_85_example_prepare
  type: behavior_oracle
  statement: "示例中BEGIN后CREATE TABLE item1，PREPARE TRANSACTION 'trans_test'准备事务；此后SELECT * FROM item1访问不到，报错ERROR: Relation \"item1\" does not exist on test.。"
  source_anchor: "1.13.9.8 示例 页1375-1376"
  source_refs: *refcommitp
  status: confirmed
- id: commit_prepared_wave8_85_example_commit
  type: behavior_oracle
  statement: "示例中COMMIT PREPARED 'trans_test'提交事务后SELECT * FROM item1可以访问（返回0 rows），DROP TABLE item1清理（相关链接PREPARE TRANSACTION、ROLLBACK PREPARED）。"
  source_anchor: "1.13.9.8 示例 页1376"
  source_refs: *refcommitp
  status: confirmed
- id: create_aggregate_wave8_85_purpose
  type: syntax
  statement: "CREATE AGGREGATE创建一个新的聚集函数。"
  source_anchor: "1.13.9.10 功能描述 页1399"
  source_refs: &refcagg
  - w8_85_1_13_9_10
  status: confirmed
- id: create_aggregate_wave8_85_syntax
  type: syntax
  statement: "新语法：CREATE AGGREGATE name (input_data_type[, ...]) (SFUNC = sfunc, STYPE = state_data_type [, FINALFUNC = ffunc] [, INITCOND = initial_condition] [, SORTOP = sort_operator] [, CFUNC = collection_func] [, INITCOLLECT = initial_collection_condition] [, IFUNC = init_func] [, SHIPPABLE = is_shippable])；原语法/较早的语法格式为CREATE AGGREGATE name (BASETYPE = base_type, SFUNC = sfunc, ...)。"
  source_anchor: "1.13.9.10 语法格式 页1399-1400"
  source_refs: *refcagg
  status: confirmed
- id: create_aggregate_wave8_85_name_input
  type: constraint
  statement: "name为要创建的聚集函数名，可以使用模式进行具体指定；input_data_type为该聚集函数要处理的输入数据类型；需要创建一个无入参的聚集函数时，可以使用*代替输入数据类型列表，count(*)即为零参数聚集函数的一个实例。"
  source_anchor: "1.13.9.10 参数说明 name/input_data_type 页1400"
  source_refs: *refcagg
  status: confirmed
- id: create_aggregate_wave8_85_basetype
  type: constraint
  statement: "base_type是在CREATE AGGREGATE语法中直接指定BASETYPE关键字的方式定义输入数据类型（并非直接将输入类型写在聚集函数名称后面）；当通过指定具体base_type的方式定义输入数据类型时，聚集函数应为具有一个输入参数的聚集函数；当创建的聚集函数为零参数聚集函数时，请将BASETYPE指定为ANY（而并非*）。"
  source_anchor: "1.13.9.10 参数说明 base_type 页1400"
  source_refs: *refcagg
  status: confirmed
- id: create_aggregate_wave8_85_sfunc
  type: constraint
  statement: "sfunc为在每一个输入行上调用的状态转换函数的名称：对于有N个参数的聚集函数，sfunc必须有N+1个参数（第一个参数类型为state_data_type，其余匹配已声明的输入数据类型），函数必须返回一个state_data_type类型的值；该函数接受当前状态值和当前输入数据并返回下个状态值；Oracle数据库的转换函数默认行为是STRICT（即跳过NULL输入值），GaussDB需要用户自行定义转换函数STRICT属性。"
  source_anchor: "1.13.9.10 参数说明 sfunc 页1400"
  source_refs: *refcagg
  status: confirmed
- id: create_aggregate_wave8_85_state_ffunc
  type: constraint
  statement: "state_data_type为聚集的状态值的数据类型；ffunc为在转换完所有输入行后调用的最终处理函数（计算聚集的结果），此函数必须接受一个类型为state_data_type的参数，聚集的输出数据类型被定义为此函数的返回类型；如果没有声明ffunc则使用聚集结果的状态值作为聚集结果，且输出类型为state_data_type。"
  source_anchor: "1.13.9.10 参数说明 state_data_type/ffunc 页1400"
  source_refs: *refcagg
  status: confirmed
- id: create_aggregate_wave8_85_initcond
  type: constraint
  statement: "initial_condition为状态值的初始设置（值），必须为一个state_data_type类型可以接受的文本常量值；如果没有声明，状态值的初始设置（值）为null。"
  source_anchor: "1.13.9.10 参数说明 initial_condition 页1400-1401"
  source_refs: *refcagg
  status: confirmed
- id: create_aggregate_wave8_85_sortop
  type: constraint
  statement: "sort_operator为用于MIN或MAX类型聚集的排序操作符，仅表示一个操作符名（可以有模式修饰）。"
  source_anchor: "1.13.9.10 参数说明 sort_operator 页1401"
  source_refs: *refcagg
  status: confirmed
- id: create_aggregate_wave8_85_cfunc_collection
  type: constraint
  statement: "collection_func（CFUNC）当前形态下该参数不生效；initial_collection_condition（INITCOLLECT）为collection_func状态值的初始设置（值），必须是一个state_data_type类型可以接受的文本常量值，如果没有声明，状态值的初始设置（值）为null。"
  source_anchor: "1.13.9.10 参数说明 collection_func/initial_collection_condition 页1401"
  source_refs: *refcagg
  status: confirmed
- id: create_aggregate_wave8_85_initfunc
  type: constraint
  statement: "init_func（IFUNC）为sfunc状态值的初始设置函数：不能返回null值，必须返回state_data_type类型并且没有入参；如果同时设置init_func和initial_condition，init_func的返回值将会优先作为初始状态值。"
  source_anchor: "1.13.9.10 参数说明 init_func 页1401"
  source_refs: *refcagg
  status: confirmed
- id: create_aggregate_wave8_85_shippable
  type: constraint
  statement: "is_shippable（SHIPPABLE）标记该聚集函数是否能够下推执行，仅可以取值true或者false；目前该参数不影响系统内置聚集函数的下推行为，仅影响用户自定义聚集函数的行为，默认值为false；当前形态下该参数不生效。"
  source_anchor: "1.13.9.10 参数说明 is_shippable 页1401"
  source_refs: *refcagg
  status: confirmed
- id: create_aggregate_wave8_85_example
  type: behavior_oracle
  statement: "示例中CREATE OR REPLACE FUNCTION int_add(int,int)后CREATE AGGREGATE sum_add(int) (sfunc = int_add, stype = int, initcond = '0')；test_sum表插入4行后SELECT sum_add(a) FROM test_sum返回10；DROP AGGREGATE sum_add(int)删除（相关链接ALTER AGGREGATE、DROP AGGREGATE）。"
  source_anchor: "1.13.9.10 示例 页1401-1402"
  source_refs: *refcagg
  status: confirmed
open_questions:
- id: commit_wave8_85_oq_runtime
  statement: "COMMIT跨会话提交、COMMIT PREPARED两阶段提交与CREATE AGGREGATE各参数（SHIPPABLE/CFUNC不生效）在真实并发与故障恢复路径下的完整行为与错误矩阵需授权环境实机验证。"
  status: open
