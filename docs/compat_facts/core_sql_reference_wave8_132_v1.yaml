facts:
- id: m_analyze_wave8_132_overview
  type: syntax
  statement: "M兼容ANALYZE收集与数据库中普通表内容相关的统计信息（统计结果存储在pg_statistic、pg_statistic_ext下，可通过pg_stats、pg_ext_stats视图查询；执行计划生成器使用统计数据确定最有效执行计划）；未指定参数时分析当前数据库中的每个表和分区表，也可通过table_name、column_name和partition_name限定；ANALYZE VERIFY校验数据库目标表相关文件（UHEAP/HEAP/FSM/VM/UBTREE/UBTREE.FSM(URQ)/BTREE/BTREE.FSM页面物理损坏校验，UHEAP/UBTREE/UBTREE.FSM逻辑校验，UHEAP/HEAP支持COMPLETE元组校验）；每次收集的统计信息存入历史表gs_statistic_history、gs_statistic_ext_history、gs_statistic_history（数量和保留时间由stats_history_record_limit和stats_history_retention_time控制）。"
  source_anchor: "2.4.2.6.17 功能描述/说明 页2065-2066"
  source_refs: &refmAna
  - w8_132_2_4_2_6_17
  status: confirmed
- id: m_analyze_wave8_132_limits
  type: constraint
  statement: "M兼容ANALYZE限制：ANALYZE操作（不包含ANALYZE VERIFY）支持在事务块、PREPARE语句中执行；统计信息回滚限制：不支持对PG_CLASS和PG_PARTITION中统计信息相关字段的回滚、基于这些字段的视图不支持回滚、相关函数（pg_stat_get_last_analyze_time、pg_stat_get_analyze_count）及依赖这些函数的视图不支持回滚；ANALYZE VERIFY场景不触发远程读，关键系统表页面损坏时直接报错不再继续检测；权限：通常用户必须是表所有者或被授予指定表ANALYZE权限（三权分立关闭时系统管理员默认有），数据库所有者允许对除共享目录以外的所有表ANALYZE（意味着只有系统管理员才能真正对数据库ANALYZE）；ANALYZE不收集无法做比较或等值运算的列（如cursor类型）。"
  source_anchor: "2.4.2.6.17 注意事项 页2066"
  source_refs: *refmAna
  status: confirmed
- id: m_analyze_wave8_132_syntax
  type: syntax
  statement: "M兼容ANALYZE语法：收集表统计信息ANALYZE [ VERBOSE ] [ table_name [ ( column_name [, ...] ) ] ]；收集分区表的分区统计信息ANALYZE [ VERBOSE ] table_name [ ( column_name [, ...] ) ] PARTITION ( partition_name )。"
  source_anchor: "2.4.2.6.17 语法格式 页2067"
  source_refs: *refmAna
  status: confirmed
- id: m_autohint_wave8_132_syntax
  type: syntax
  statement: "M兼容AUTOHINT [ ( option [, ...] ) ] statement启用AUTOHINT为指定SQL进行智能Hint推荐并输出能提升执行速度的推荐Hint组合；仅支持SELECT语句且需要使用者拥有管理员权限；除ANALYZE选项外其他选项需置于括号内；若SQL语句中已含有Hint，使用AUTOHINT进行推荐时将无视已有的Hint并重新推荐；选项（均boolean缺省TRUE）：ANALYZE（推荐前进行Hint探索）、VERBOSE（显示额外信息）、SQLPATCH（输出SQL PATCH指令）、TEST（验证推荐结果并输出实际计划执行时间）、DEBUG（输出更多细节信息）。"
  source_anchor: "2.4.2.6.18 AUTOHINT 页2070-2071"
  source_refs: &refmah
  - w8_132_2_4_2_6_18
  status: confirmed
- id: m_autohint_drop_wave8_132_syntax
  type: syntax
  statement: "M兼容AUTOHINT DROP statement删除指定SQL的历史智能Hint推荐结果（仅支持SELECT语句且需管理员权限）。"
  source_anchor: "2.4.2.6.19 AUTOHINT DROP 页2071-2072"
  source_refs: &refmahd
  - w8_132_2_4_2_6_19
  status: confirmed
- id: m_autohint_purge_wave8_132_syntax
  type: syntax
  statement: "M兼容AUTOHINT PURGE删除智能Hint推荐的所有历史推荐结果（需使用者拥有管理员权限）；语法为AUTOHINT PURGE;。"
  source_anchor: "2.4.2.6.20 AUTOHINT PURGE 页2072"
  source_refs: &refmahp
  - w8_132_2_4_2_6_20
  status: confirmed
- id: m_autohint_wave8_132_examples
  type: behavior_oracle
  statement: "AUTOHINT系列示例基线：AUTOHINT DROP后删除成功输出AUTOHINT: 1 MODEL REMOVED（无历史探索结果删除失败输出AUTOHINT: 0 MODELS REMOVE）；AUTOHINT PURGE后删除成功输出AUTOHINT: 12 MODELS REMOVED（无任何历史探索结果时输出AUTOHINT: 0 MODELS REMOVE）。"
  source_anchor: "2.4.2.6.19/20 示例 页2071-2072"
  source_refs: *refmahd
  status: confirmed
- id: m_gus_wave8_132_syntax
  type: constraint
  statement: "M兼容GENERATED UPDATE SYSTEM生成系统对象的升级回滚脚本文件，在升级回滚时由OM调用；内部语法不建议用户使用；注意事项：相关升级回滚参数说明与使用限制参见系统对象升级管理文档。"
  source_anchor: "2.4.2.11.1 GENERATED UPDATE SYSTEM 页2211"
  source_refs: &refmgus
  - w8_132_2_4_2_11_1
  status: confirmed
- id: m_grant_wave8_132_scenarios
  type: constraint
  statement: "M兼容GRANT对角色和用户授权包括四类场景：将系统权限授权给角色或用户（系统权限又称用户属性，包括SYSADMIN、CREATEDB、CREATEROLE、AUDITADMIN、MONADMIN、OPRADMIN、POLADMIN、INHERIT、REPLICATION和LOGIN等；一般通过CREATE/ALTER ROLE语法指定，其中SYSADMIN权限可通过GRANT/REVOKE ALL PRIVILEGES授予或撤销，但系统权限无法通过ROLE和USER的权限被继承也无法授予PUBLIC）；将数据库对象（表、视图、指定字段、数据库、模式、表空间等）的相关权限授予特定角色或用户；将角色或用户的权限授权给其他角色或用户；将ANY权限授予特定的角色和用户。"
  source_anchor: "2.4.2.11.2 GRANT 功能描述 页2211-2212"
  source_refs: &refmgrant
  - w8_132_2_4_2_11_2
  status: confirmed
- id: m_grant_wave8_132_public
  type: constraint
  statement: "M兼容GRANT的PUBLIC语义：关键字PUBLIC表示该权限要赋予所有角色包括以后创建的用户（PUBLIC可看做隐含定义好的组，总是包括所有角色）；如果声明WITH GRANT OPTION则被授权用户也可将此权限赋予他人（该选项不能赋予PUBLIC，此为M-Compatibility特有的属性）；M兼容默认将某些对象的权限授予PUBLIC：数据库的CONNECT权限和CREATE TEMP TABLE权限、语言和数据类型（包括域）的USAGE特权会授予PUBLIC，而表、表字段、序列、外部服务器、模式或表空间对象的权限默认不授予；对象拥有者可撤销默认授予PUBLIC的权限；建议在同一个事务中创建对象并设置权限以避免其他用户使用对象的时间窗口。"
  source_anchor: "2.4.2.11.2 GRANT 功能描述 页2212"
  source_refs: *refmgrant
  status: confirmed
- id: m_grant_wave8_132_owner_admin
  type: constraint
  statement: "M兼容GRANT所有者与ADMIN OPTION：对象所有者缺省具有该对象上的所有权限（出于安全考虑可舍弃部分权限，但ALTER、DROP、COMMENT、INDEX、VACUUM以及对象的可再授予权限属于所有者固有权限隐式拥有）；当声明WITH ADMIN OPTION，被授权的用户可将该权限再次授予其他角色或用户以及撤销所有由该角色或用户继承到的权限；三权分立关闭时系统管理员可赋予或撤销任何非永久用户和运维管理员角色的权限，安全管理员可赋予或撤销任何非系统管理员、内置角色、永久用户和运维管理员角色的权限。"
  source_anchor: "2.4.2.11.2 GRANT 功能描述 页2212"
  source_refs: *refmgrant
  status: confirmed
- id: m_grant_wave8_132_any
  type: constraint
  statement: "M兼容ANY权限：ANY权限可通过角色被继承但不能赋予PUBLIC（初始用户和三权分立关闭时的系统管理员用户可给任何角色/用户授予或撤销ANY权限）；目前支持CREATE ANY TABLE、ALTER ANY TABLE、DROP ANY TABLE、SELECT ANY TABLE、INSERT ANY TABLE、UPDATE ANY TABLE、DELETE ANY TABLE、TRUNCATE ANY TABLE、CREATE ANY SEQUENCE、ALTER ANY SEQUENCE、DROP ANY SEQUENCE、SELECT ANY SEQUENCE、ALTER ANY INDEX、DROP ANY INDEX等（详见表2-26）；ANY权限属于数据库内的权限只对授予该权限的数据库内的对象有效（如SELECT ANY TABLE只允许查看当前数据库内所有用户表数据）；ANY权限与原有的权限相互无影响；如果用户被授予CREATE ANY TABLE权限，在同名模式下创建表的属主是该模式的所有者（CREATE ANY SEQUENCE和CREATE ANY INDEX类似）。"
  source_anchor: "2.4.2.11.2 GRANT ANY权限 页2212-2213"
  source_refs: *refmgrant
  status: confirmed
- id: m_grant_wave8_132_any_limits
  type: constraint
  statement: "M兼容ANY权限限制：不允许将ANY权限授予PUBLIC，也不允许从PUBLIC回收ANY权限；通过GRANT授予用户使用表的权限时如果使用不当，可能通过ALTER语法在表的默认值、约束增加表达式、通过创建索引在索引上增加表达式等操作导致权限被利用的风险。"
  source_anchor: "2.4.2.11.2 GRANT 注意事项 页2213"
  source_refs: *refmgrant
  status: confirmed
- id: m_grant_wave8_132_table_syntax
  type: syntax
  statement: "M兼容GRANT表/视图授权语法：GRANT { { SELECT | INSERT | UPDATE | DELETE | TRUNCATE | REFERENCES | ALTER | DROP | COMMENT | INDEX | VACUUM } [, ...] | ALL [ PRIVILEGES ] } ON { [ TABLE ] table_name [, ...] | ALL TABLES IN SCHEMA schema_name [, ...] } TO { [ GROUP ] role_name | PUBLIC } [, ...] [ WITH GRANT OPTION ]；表字段授权：GRANT { {{ SELECT | INSERT | UPDATE | REFERENCES | COMMENT } ( column_name [, ...] )} [, ...] | ALL [ PRIVILEGES ] ( column_name [, ...] ) } ON [ TABLE ] table_name [, ...]；用户对表进行操作除表权限外还需拥有表所在模式的USAGE权限，表上创建索引必须拥有模式的CREATE权限和表上的INDEX权限。"
  source_anchor: "2.4.2.11.2 语法格式 页2213"
  source_refs: *refmgrant
  status: confirmed
- id: m_grant_wave8_132_risk
  type: constraint
  statement: "M兼容GRANT权限利用风险：用户被授予使用表的权限时，如果使用不当可能通过ALTER语法在表的默认值、约束增加表达式，或通过创建索引在索引上增加表达式等操作导致权限被利用的风险。"
  source_anchor: "2.4.2.11.2 GRANT 注意事项 页2213"
  source_refs: *refmgrant
  status: confirmed
- id: m_revoke_wave8_132_rules
  type: constraint
  statement: "M兼容REVOKE撤销一个或多个角色的权限；非对象所有者试图在对象上REVOKE权限时按以下规则执行：如果授权用户没有该对象上的权限则命令立即失败；如果授权用户有部分权限则只撤销那些有授权选项的权限；如果授权用户没有授权选项，REVOKE ALL PRIVILEGES形式将发出错误信息，其他形式的命令如果指定名称的权限没有相应授权选项则发出警告。"
  source_anchor: "2.4.2.15.6 REVOKE 注意事项 页2244"
  source_refs: &refmrev
  - w8_132_2_4_2_15_6
  status: confirmed
- id: m_revoke_wave8_132_table_column
  type: syntax
  statement: "M兼容REVOKE表/视图与字段语法：回收表或视图权限REVOKE [ GRANT OPTION FOR ] { { SELECT | INSERT | UPDATE | DELETE | TRUNCATE | REFERENCES | ALTER | DROP | COMMENT | INDEX | VACUUM }[, ...] | ALL [ PRIVILEGES ] } ON { [ TABLE ] table_name [, ...] | ALL TABLES IN SCHEMA schema_name [, ...] } FROM { [ GROUP ] role_name | PUBLIC } [, ...] [ CASCADE | RESTRICT ]；回收字段权限REVOKE [ GRANT OPTION FOR ] { {{ SELECT | INSERT | UPDATE | REFERENCES | COMMENT } ( column_name [, ...] )}[, ...] | ALL [ PRIVILEGES ] ( column_name [, ...] ) } ON [ TABLE ] table_name。"
  source_anchor: "2.4.2.15.6 语法格式 页2244"
  source_refs: *refmrev
  status: confirmed
- id: m_revoke_wave8_132_sequence_database
  type: syntax
  statement: "M兼容REVOKE序列与数据库语法：回收序列权限REVOKE [ GRANT OPTION FOR ] { { SELECT | UPDATE | ALTER | DROP | COMMENT }[, ...] | ALL [ PRIVILEGES ] } ON { [ SEQUENCE ] sequence_name [, ...] } FROM ... [ CASCADE | RESTRICT ]；回收数据库权限REVOKE [ GRANT OPTION FOR ] { { CREATE | CONNECT | TEMPORARY | TEMP | ALTER | DROP | COMMENT } [, ...] | ALL [ PRIVILEGES ] } ON DATABASE database_name [, ...] FROM ...；说明：m_format_behavior_compat_options开启grant_database_nomapping选项时该语法生效（回收用户或角色对数据库层级对象的访问权限），未开启时REVOKE ON DATABASE映射为REVOKE ON SCHEMA（回收模式层级对象访问权限且仅支持REVOKE ON SCHEMA支持的语法选项）。"
  source_anchor: "2.4.2.15.6 语法格式/说明 页2245"
  source_refs: *refmrev
  status: confirmed
- id: m_revoke_wave8_132_schema
  type: syntax
  statement: "M兼容REVOKE回收模式上权限：REVOKE [ GRANT OPTION FOR ] { { CREATE | USAGE | ALTER | DROP | COMMENT } [, ...] | ALL [ PRIVILEGES ] } ON SCHEMA schema_name [, ...] FROM { [ GROUP ] role_name | PUBLIC } [, ...] [ CASCADE | RESTRICT ]。"
  source_anchor: "2.4.2.15.6 语法格式 页2245"
  source_refs: *refmrev
  status: confirmed
- id: m_grant_revoke_wave8_132_examples
  type: behavior_oracle
  statement: "GRANT/REVOKE示例基线（m_db）：GRANT USAGE,CREATE ON SCHEMA tpcds TO jack后ALTER DEFAULT PRIVILEGES FOR ROLE jack授权；REVOKE SELECT ON TABLES FROM PUBLIC撤销；GRANT与REVOKE均支持表/视图/字段/序列/数据库/模式/表空间/函数等对象的授权与回收（参见语法格式）。"
  source_anchor: "2.4.2.11.2/2.4.2.15.6 示例 页2213-2218,2244-2246"
  source_refs: *refmgrant
  status: confirmed
open_questions:
- id: m_grant_revoke_wave8_132_oq_runtime
  statement: "M兼容ANY权限在跨数据库场景的实际限制、grant_database_nomapping开启前后REVOKE ON DATABASE的行为差异矩阵、WITH GRANT OPTION不能赋予PUBLIC的 enforcement 细节需授权环境实机验证。"
