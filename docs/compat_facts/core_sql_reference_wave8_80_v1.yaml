  source_anchor: "1.13.10.26 参数说明 name 页1679"
  source_refs: *refdropop
  status: confirmed
- id: drop_operator_wave8_80_types
  type: constraint
  statement: "left_type为操作符的左操作数的数据类型，如果没有左操作数，则需要指定为NONE；right_type为操作符的右操作数的数据类型，如果没有右操作数，则需要指定为NONE。"
  source_anchor: "1.13.10.26 参数说明 left_type/right_type 页1679"
