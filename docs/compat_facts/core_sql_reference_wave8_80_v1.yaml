facts:
- id: drop_masking_policy_wave8_80_purpose
  type: syntax
  statement: "DROP MASKING POLICY删除一种脱敏策略。"
  source_anchor: "1.13.10.23 功能描述 页1675"
  source_refs: &refdmp
  - w8_80_1_13_10_23
  status: confirmed
- id: drop_masking_policy_wave8_80_syntax
  type: syntax
  statement: "语法为DROP MASKING POLICY [IF EXISTS] policy_name；policy_name为审计策略名称（原文参数说明表述），不可重复，取值范围为字符串且为已存在的策略名称。"
  source_anchor: "1.13.10.23 语法格式/参数说明 页1675"
  source_refs: *refdmp
  status: confirmed
- id: drop_masking_policy_wave8_80_privileges
  type: constraint
  statement: "仅POLADMIN、SYSADMIN或初始用户可以执行该操作。"
  source_anchor: "1.13.10.23 注意事项 页1675"
  source_refs: *refdmp
  status: confirmed
- id: drop_masking_policy_wave8_80_example_create
  type: behavior_oracle
  statement: "示例中建表tb_for_masking并插入数据后，CREATE RESOURCE LABEL mask_lb1/mask_lb2/mask_lb3分别标记敏感列col1/col2/col3，创建脱敏策略maskpol1 maskall ON LABEL(mask_lb1)、maskpol2 randommasking ON LABEL(mask_lb2)、maskpol3 basicemailmasking ON LABEL(mask_lb3)。"
  source_anchor: "1.13.10.23 示例 页1675-1676"
  source_refs: *refdmp
  status: confirmed
- id: drop_masking_policy_wave8_80_example_drop
  type: behavior_oracle
  statement: "示例中DROP MASKING POLICY IF EXISTS maskpol1删除一个脱敏策略，DROP MASKING POLICY IF EXISTS maskpol2, maskpol3一次删除一组脱敏策略；随后DROP RESOURCE LABEL逐个删除资源标签并DROP TABLE清理（相关链接ALTER MASKING POLICY、CREATE MASKING POLICY）。"
  source_anchor: "1.13.10.23 示例 页1676"
  source_refs: *refdmp
  status: confirmed
- id: drop_materialized_view_wave8_80_purpose
  type: syntax
  statement: "DROP MATERIALIZED VIEW删除数据库中已有的物化视图。"
  source_anchor: "1.13.10.24 功能描述 页1676"
  source_refs: &refdmv
  - w8_80_1_13_10_24
  status: confirmed
- id: drop_materialized_view_wave8_80_syntax
  type: syntax
  statement: "语法为DROP MATERIALIZED VIEW [IF EXISTS] mv_name[, ...] [CASCADE | RESTRICT]；mv_name为要删除的物化视图名称，支持一次指定多个。"
  source_anchor: "1.13.10.24 语法格式/参数说明 页1676-1677"
  source_refs: *refdmv
  status: confirmed
- id: drop_materialized_view_wave8_80_privileges
  type: constraint
  statement: "物化视图的所有者、物化视图所在模式的所有者、被授予了物化视图DROP权限的用户或拥有DROP ANY TABLE权限的用户可以执行该操作，系统管理员默认拥有此权限。"
  source_anchor: "1.13.10.24 注意事项 页1676"
  source_refs: *refdmv
  status: confirmed
- id: drop_materialized_view_wave8_80_ifexists
  type: constraint
  statement: "IF EXISTS判断指定的物化视图是否存在：存在则删除成功；不存在不会进行删除操作，仅产生一个NOTICE提示，用于告知指定的物化视图不存在。"
  source_anchor: "1.13.10.24 参数说明 IF EXISTS 页1677"
  source_refs: *refdmv
  status: confirmed
- id: drop_materialized_view_wave8_80_cascade_restrict
  type: constraint
  statement: "CASCADE | RESTRICT可选，是否级联删除依赖于该物化视图的对象，未指定时默认为RESTRICT：CASCADE级联删除依赖此物化视图的对象；RESTRICT在存在依赖此物化视图的对象时拒绝删除此物化视图。"
  source_anchor: "1.13.10.24 参数说明 CASCADE|RESTRICT 页1677"
  source_refs: *refdmv
  status: confirmed
- id: drop_materialized_view_wave8_80_example
  type: behavior_oracle
  statement: "示例中ASTORE表my_table创建物化视图my_mv后DROP MATERIALIZED VIEW my_mv删除，DROP TABLE my_table清理（相关链接ALTER MATERIALIZED VIEW、CREATE INCREMENTAL MATERIALIZED VIEW、CREATE MATERIALIZED VIEW、CREATE TABLE、REFRESH INCREMENTAL MATERIALIZED VIEW、REFRESH MATERIALIZED VIEW）。"
  source_anchor: "1.13.10.24 示例 页1677"
  source_refs: *refdmv
  status: confirmed
