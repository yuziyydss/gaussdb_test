- id: drop_operator_wave8_80_syntax
  type: syntax
  statement: "语法为DROP OPERATOR [IF EXISTS] name ({left_type | NONE}, {right_type | NONE}) [CASCADE | RESTRICT]。"
  source_anchor: "1.13.10.26 语法格式 页1678"
  source_refs: *refdropop
  status: confirmed
