- id: pkgutil_wave8_145_modify_package_state
  type: constraint
  statement: "MODIFY_PACKAGE_STATE原型：PKG_UTIL.MODIFY_PACKAGE_STATE(flags INT) RETURNS VOID用于修改当前会话的PL/SQL的状态；当flags=1时在执行完最顶层的PL/SQL后会释放会话中目前运行的PL/SQL的会话缓存、清除任何包全局的当前值并关闭缓存的游标，后续使用时PL/SQL将重新实例化并重新初始化包全局；不支持其他位标志；示例CALL PKG_UTIL.MODIFY_PACKAGE_STATE(1)。"
  source_anchor: "3.12.1.2 MODIFY_PACKAGE_STATE 页2691-2692"
  source_refs: *refpt
  status: confirmed
- id: pkgutil_wave8_145_exception_compile_pairing
  type: constraint
  statement: "EXCEPTION与重编译工具配对使用场景：EXCEPTION_REPORT_ERROR用于主动抛出异常（code/log/flag），UTILITY_FORMAT_ERROR_BACKTRACE/STACK/CALL_STACK用于异常后查看错误堆栈、报错信息与调用堆栈；UTILITY_COMPILE_SCHEMA与GS_COMPILE_SCHEMA均可重编译指定schema但参数语义不同（前者compile_all默认TRUE，后者默认FALSE且带retry_times重试）。"
  source_anchor: "3.12.1.2 EXCEPTION/UTILITY/GS_COMPILE_SCHEMA 页2681-2689"
  source_refs: *refpt
  status: confirmed
