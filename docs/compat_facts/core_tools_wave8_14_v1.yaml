facts:
- id: tools_wave8_14_overview
  type: syntax
  statement: "导入导出工具包括COPY、\\COPY、gs_loader、gs_dump、gs_dumpall和gs_restore。"
  source_anchor: "5.7.1 页3921-3922"
  source_refs: &refb1
  - w8_14_5_7
  status: confirmed
- id: tools_wave8_14_copy_scope
  type: syntax
  statement: "COPY可用于表级数据导入导出以及查询结果集导出；\\COPY支持客户端数据文件导入导出并支持并发多事务导入。"
  source_anchor: "5.7.1 页3921-3922"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_loader_intro
  type: syntax
  statement: "gs_loader将控制文件支持的语法转换为\\COPY语法进行表级数据导入，并将\\COPY结果记录到客户端日志。"
  source_anchor: "5.7.2 页3922"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_loader_mode
  type: constraint
  statement: "gs_loader当前不支持M-Compatibility数据库，支持PDB。"
  source_anchor: "5.7.2 页3922"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_loader_version
  type: constraint
  statement: "gs_loader版本需与gsql版本、数据库版本保持一致。"
  source_anchor: "5.7.2 页3922"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_loader_log_level
  type: environment
  statement: "gs_loader日志级别可通过gs_loader_log_level设置为debug、info、warning或error。"
  source_anchor: "5.7.2 页3922"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_loader_privilege_guc
  type: environment
  statement: "gs_loader使用场景受enableSeparationOfDuty控制三权分立开关；enable_copy_error_log控制是否使用错误表pg_catalog.gs_copy_error_log和日志表pg_catalog.gs_copy_error_log。"
  source_anchor: "5.7.2 页3923"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_dump_intro
  type: syntax
  statement: "gs_dump是数据库级导出工具，可导出单个数据库下全部或部分对象的定义及数据。"
  source_anchor: "5.7.3 页3943"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_dump_scope
  type: constraint
  statement: "gs_dump可用于数据库级导出，但不能导出所有数据库和全局对象；跨数据库和全局对象需使用gs_dumpall。"
  source_anchor: "5.7.3 页3943"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_dump_formats
  type: syntax
  statement: "gs_dump支持纯文本、自定义归档、目录归档和tar归档格式。"
  source_anchor: "5.7.3 页3943-3944"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_dump_data_only
  type: syntax
  statement: "gs_dump的-a/--data-only只输出数据不输出模式，转储表数据和序列值。"
  source_anchor: "5.7.3 页3949"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_dump_clean
  type: constraint
  statement: "gs_dump的-c/--clean会在创建对象指令前输出非级联DROP指令；恢复时如存在依赖对象可能报错，需要手动处理依赖。"
  source_anchor: "5.7.3 页3949"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_dump_create
  type: constraint
  statement: "gs_dump的-C/--create使备份内容以创建数据库和连接该数据库的命令开始；多租导出指定PDB时不支持该选项，M-Compatibility模式数据库也不支持。"
  source_anchor: "5.7.3 页3949"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_dump_parallel
  type: constraint
  statement: "gs_dump的-j/--jobs启用并行导出，仅支持目录归档格式，默认使用表内并行；并行数不建议超过客户端CPU核数两倍。"
  source_anchor: "5.7.3 页3949-3950"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_dumpall_intro
  type: syntax
  statement: "gs_dumpall是实例级导出工具，导出实例下所有数据库的对象定义和数据以及全局对象。"
  source_anchor: "5.7.4 页3960"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_dumpall_restore
  type: syntax
  statement: "gs_dumpall的实例级恢复需要使用gsql进行恢复。"
  source_anchor: "5.7.4 页3922"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_restore_intro
  type: syntax
  statement: "gs_restore是数据库级导入工具，用于导入gs_dump导出生成的文件。"
  source_anchor: "5.7.5 页3966"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_restore_scope
  type: constraint
  statement: "gs_restore可用于恢复数据库对象和数据；纯文本格式备份应通过gsql恢复，而不是gs_restore。"
  source_anchor: "5.7.5 页3966"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_restore_jobs
  type: syntax
  statement: "gs_restore支持-j/--jobs设置并行恢复任务数。"
  source_anchor: "5.7.5 页3966-3967"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_14_gs_restore_parallel_format
  type: constraint
  statement: "gs_restore并行恢复要求归档格式支持并行恢复，纯文本格式不支持并行恢复。"
  source_anchor: "5.7.5 页3966-3967"
  source_refs: *refb1
  status: confirmed
