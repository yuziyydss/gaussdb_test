facts:
- id: dbestats_wave8_164_restore_table
  type: syntax
  statement: "RESTORE_TABLE_STATS原型：DBE_STATS.RESTORE_TABLE_STATS(ownname VARCHAR2, tabname VARCHAR2, as_of_timestamp TIMESTAMPTZ, restore_cluster_index BOOLEAN DEFAULT NULL, force BOOLEAN DEFAULT FALSE, no_invalidate BOOLEAN DEFAULT NULL)；将表的统计信息回退到指定的时间节点（选择该时间节点前最后一次收集的统计信息载入系统表），同时级联其下级未被锁定的分区、索引、列级统计信息；该接口无返回值；restore_cluster_index与no_invalidate暂不支持。"
  source_anchor: "3.12.2.20 RESTORE_TABLE_STATS 页2918-2919"
  source_refs: &refsr
  - w8_164_3_12
  status: confirmed
- id: dbestats_wave8_164_restore_locked_skip
  type: constraint
  statement: "RESTORE_TABLE_STATS锁定跳过：调用该接口时同时回退其下级分区、索引、列的统计信息，如果其下级的分区或列被锁定则直接跳过。"
  source_anchor: "3.12.2.20 RESTORE_TABLE_STATS说明 页2919"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_restore_table_example
  type: behavior_oracle
  statement: "RESTORE_TABLE_STATS示例基线：t1两次ANALYZE后GS_TABLESTATS_HISTORY中reltuples为3与6、PG_CLASS当前为6；RESTORE_TABLE_STATS(as_of_timestamp=>MIN(reltimestamp)+INTERVAL '1 second')后PG_CLASS reltuples回退为3。"
  source_anchor: "3.12.2.20 RESTORE_TABLE_STATS示例 页2919-2920"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_restore_partition
  type: syntax
  statement: "RESTORE_PARTITION_STATS原型：DBE_STATS.RESTORE_PARTITION_STATS(ownname VARCHAR2, tabname VARCHAR2, partname VARCHAR2, as_of_timestamp TIMESTAMPTZ, force BOOLEAN DEFAULT FALSE, no_invalidate BOOLEAN DEFAULT NULL)；将分区的统计信息回退到指定时间节点（级联下级未被锁定的分区、索引、列级统计信息）；用法与RESTORE_TABLE_STATS一致。"
  source_anchor: "3.12.2.20 RESTORE_PARTITION_STATS 页2920-2921"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_restore_column
  type: syntax
  statement: "RESTORE_COLUMN_STATS原型：DBE_STATS.RESTORE_COLUMN_STATS(ownname VARCHAR2, tabname VARCHAR2, colname VARCHAR2, partname VARCHAR2 DEFAULT NULL, as_of_timestamp TIMESTAMPTZ, force BOOLEAN DEFAULT FALSE, no_invalidate BOOLEAN DEFAULT NULL)；将列的统计信息回退到指定时间节点；当partname为空时默认回退该表列级统计信息；回退多列时需先查询PG_STATISTIC_EXT中的staextname字段获取多列别名作为colname入参。"
  source_anchor: "3.12.2.20 RESTORE_COLUMN_STATS 页2921-2922"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_restore_schema
  type: syntax
  statement: "RESTORE_SCHEMA_STATS原型：DBE_STATS.RESTORE_SCHEMA_STATS(ownname VARCHAR2, as_of_timestamp TIMESTAMPTZ, force BOOLEAN DEFAULT FALSE, no_invalidate BOOLEAN DEFAULT NULL)；回退指定schema下所有表相关的统计信息到指定时间点。"
  source_anchor: "3.12.2.20 RESTORE_SCHEMA_STATS 页2923-2924"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_restore_schema_example
  type: behavior_oracle
  statement: "RESTORE_SCHEMA_STATS示例基线：t1两次ANALYZE后历史表reltuples为3/6、当前6；RESTORE_SCHEMA_STATS后PG_CLASS reltuples回退为3。"
  source_anchor: "3.12.2.20 RESTORE_SCHEMA_STATS示例 页2924-2925"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_force_semantics
  type: constraint
  statement: "RESTORE族force参数：force为是否在统计信息被锁定时强行回退的标志位（默认FALSE）；no_invalidate暂不支持。"
  source_anchor: "3.12.2.20 RESTORE族参数说明 页2919-2924"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_purge_stats
  type: syntax
  statement: "PURGE_STATS原型：DBE_STATS.PURGE_STATS(before_timestamp TIMESTAMPTZ)；清除指定时间节点之前的所有历史统计信息（只有初始用户可调用）；该接口无返回值。"
  source_anchor: "3.12.2.20 PURGE_STATS 页2925"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_purge_example
  type: behavior_oracle
  statement: "PURGE_STATS示例基线：t1两次ANALYZE后历史表reltuples为3/6；PURGE_STATS(before_timestamp=>MIN(reltimestamp)+INTERVAL '1 second')后历史表仅剩reltuples=6一条。"
  source_anchor: "3.12.2.20 PURGE_STATS示例 页2925"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_get_history_retention
  type: syntax
  statement: "GET_STATS_HISTORY_RETENTION原型：DBE_STATS.GET_STATS_HISTORY_RETENTION()；获得当前历史统计信息的保留时间，返回用DBE_STATS.ALTER_STATS_HISTORY_RETENTION接口设置的保留时间；该接口没有入参。"
  source_anchor: "3.12.2.20 GET_STATS_HISTORY_RETENTION 页2925-2926"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_get_history_availability
  type: syntax
  statement: "GET_STATS_HISTORY_AVAILABILITY原型：DBE_STATS.GET_STATS_HISTORY_AVAILABILITY() returns TIMESTAMPTZ；获得当前历史统计信息的最早可用时间（返回当前数据库下所有历史统计信息的最早时间）；该接口没有入参；示例输出2023-08-27 02:07:04.065217+08。"
  source_anchor: "3.12.2.20 GET_STATS_HISTORY_AVAILABILITY 页2926"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_c_function_variants
  type: constraint
  statement: "C_FUNCTION变体与适用范围：以上所有接口函数原型都具备同等数据类型和字段的C_FUNCTION函数原型（命名为DBE_STATS.XXXX_C_FUNCTION）；DBE_STATS高级包接口仅对普通表有效。"
  source_anchor: "3.12.2.20 说明 页2926"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_create_stat_table
  type: syntax
  statement: "CREATE_STAT_TABLE原型：DBE_STATS.CREATE_STAT_TABLE(ownname VARCHAR2, stattab VARCHAR2, tblspace VARCHAR2 DEFAULT NULL, global_temporary BOOLEAN DEFAULT NULL)；创建用于保存用户统计信息的统计表（ownname为空默认当前schema；tblspace不指定使用默认表空间；global_temporary暂不支持）。"
  source_anchor: "3.12.2.20 CREATE_STAT_TABLE 页2926-2927"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_stat_table_reloptions
  type: constraint
  statement: "统计表标识与索引：为区分普通表和统计表，创建统计表后其reloptions中的statstable字段将不为空串（赋予当前统计信息表的版本信息实现前向兼容）；创建时自动生成索引gs_stattab_oid_statid_type_nameinfo_index用于索引扫描（oid为该统计表的oid），如若被删除则导入导出export、import接口不可用。"
  source_anchor: "3.12.2.20 CREATE_STAT_TABLE说明 页2927"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_create_stat_table_example
  type: behavior_oracle
  statement: "CREATE_STAT_TABLE示例基线：在dbe_stats_create_drop_schema下CREATE_STAT_TABLE(ownname=>…, stattab=>'stat_tab')后手动INSERT INTO stat_tab(statid, type, relname) VALUES('123','t','t1')，SELECT可查到该条数据。"
  source_anchor: "3.12.2.20 CREATE_STAT_TABLE示例 页2927"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_drop_stat_table
  type: syntax
  statement: "DROP_STAT_TABLE原型：DBE_STATS.DROP_STAT_TABLE(ownname VARCHAR2, stattab VARCHAR2)；删除用户统计信息表（ownname为null默认当前schema）。"
  source_anchor: "3.12.2.20 DROP_STAT_TABLE 页2927-2928"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_drop_stat_table_limits
  type: constraint
  statement: "DROP_STAT_TABLE限制：对于statstable属性为空的普通表无法使用此函数删除；如果在用户统计信息表上创建了索引或创建了其他依赖于该表的对象，调用此函数时会级联删除所有依赖于该表的对象。"
  source_anchor: "3.12.2.20 DROP_STAT_TABLE说明 页2928"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_history_tables
  type: syntax
  statement: "历史统计信息查询：GS_TABLESTATS_HISTORY系统表记录历史统计信息（relname/reltuples/reltimestamp等列），示例中通过SELECT MIN(reltimestamp)定位回退/清除的目标时间节点。"
  source_anchor: "3.12.2.20 RESTORE/PURGE示例 页2919-2925"
  source_refs: *refsr
  status: confirmed
- id: dbestats_wave8_164_restore_cascade
  type: constraint
  statement: "RESTORE族级联范围：RESTORE_TABLE_STATS级联其下级未被锁定的分区、索引、列级统计信息；RESTORE_PARTITION_STATS级联其下级分区、索引、列；RESTORE_COLUMN_STATS仅回退列本身；RESTORE_SCHEMA_STATS回退schema下所有表相关统计信息。"
  source_anchor: "3.12.2.20 RESTORE族接口 页2918-2924"
  source_refs: *refsr
  status: confirmed
