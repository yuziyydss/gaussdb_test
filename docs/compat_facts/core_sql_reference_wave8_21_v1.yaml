facts:
- id: copy_wave8_21_purpose
  type: syntax
  statement: "COPY在表和文件之间复制数据：COPY FROM把文件数据复制到表，COPY TO把表或query结果复制到文件；支持STDIN/STDOUT、字段列表、TEXT/CSV/FIXED/BINARY格式、分隔符、编码、错误容错和批量导入辅助参数。"
  source_anchor: "1.13.9.9 页1376与1378-1379"
  source_refs: &refb1
  - w8_21_1_13_9_9
  status: confirmed
- id: copy_wave8_21_server_file_security
  type: environment
  statement: "enable_copy_server_files关闭时，只有初始用户可执行COPY FROM/TO FILENAME；开启后允许SYSADMIN或继承gs_role_copy_files权限的用户执行，但默认禁止对配置文件、密钥文件、证书文件、环境变量分离文件和审计日志执行服务端文件COPY。"
  source_anchor: "1.13.9.9 注意事项 页1376"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_safe_data_path
  type: constraint
  statement: "safe_data_path可设置所有用户导入导出路径白名单且默认生效；设置为空则白名单失效，需谨慎配置；COPY路径中的相对路径会被报错处理。多租场景下仅初始用户可在PDB内执行服务端文件COPY。"
  source_anchor: "1.13.9.9 注意事项 页1376"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_object_permissions
  type: constraint
  statement: "COPY只能用于表，不能用于视图；COPY TO需要目标表SELECT权限，COPY FROM需要目标表INSERT权限。"
  source_anchor: "1.13.9.9 注意事项 页1376"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_column_list
  type: constraint
  statement: "指定字段列表时，COPY只在文件和表之间复制声明字段；COPY FROM对列表外字段插入缺省值。数据文件任意行的字段数多于或少于预期都会报错。"
  source_anchor: "1.13.9.9 注意事项 页1376"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_stdin_stdout
  type: syntax
  statement: "STDIN表示从标准输入导入，STDOUT表示输出到标准输出；STDIN文本中列间默认使用TAB分隔，新行中只含反斜杠和句点（\\.）表示输入结束。"
  source_anchor: "1.13.9.9 STDIN/STDOUT 页1376与1379"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_server_vs_client
  type: environment
  statement: "COPY是服务端命令，执行环境与数据库服务端进程一致；\\COPY是客户端gsql元命令，执行环境与gsql一致。云上与非云环境混合使用时，两者实际访问的路径可能不同。"
  source_anchor: "1.13.9.9 COPY与\\COPY 页1377"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_column_expressions
  type: constraint
  statement: "COPY FROM支持列表达式对数据做预处理，但不支持子查询，也不支持在COPY命令的列表达式中使用返回集合的函数（SRF）。"
  source_anchor: "1.13.9.9 注意事项 页1377-1378"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_generated_columns
  type: constraint
  statement: "生成列不能出现在COPY指定列列表中；COPY TO未指定列列表时导出除生成列外的所有列，COPY FROM导入时生成列会自动更新并像普通列一样保存。"
  source_anchor: "1.13.9.9 注意事项 页1377"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_runtime_scale
  type: constraint
  statement: "COPY FROM/TO适合低并发、本地小数据量导入导出；目标表存在trigger时支持COPY操作；COPY FROM遇到数据格式错误会回滚事务。"
  source_anchor: "1.13.9.9 注意事项 页1377"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_row_size_limits
  type: constraint
  statement: "非转码场景下单行数据元组大小不得超过1GB-1B；转码场景下不得超过256MB-1B。"
  source_anchor: "1.13.9.9 注意事项 页1377"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_protected_tables
  type: constraint
  statement: "出于安全考虑，禁止通过COPY FROM向pg_authid、pg_auth_history、gs_global_config和gs_workload_rule系统表导入数据。"
  source_anchor: "1.13.9.9 注意事项 页1377"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_query_to_syntax
  type: constraint
  statement: "COPY query TO中的query仅支持一个SELECT或VALUES命令且结尾不需要分号；当COPY TO数据来自query时，不能同时使用[USING] DELIMITERS子句。"
  source_anchor: "1.13.9.9 语法格式/query 页1378-1379"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_parameter_families
  type: syntax
  statement: "copy_option是COPY原生参数形式，option是兼容外表导入的参数形式；FILLER、SEQUENCE和CONSTANT仅在copy_option子句中支持，传入option子句会被忽略。"
  source_anchor: "1.13.9.9 语法格式 页1378"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_delimiters
  type: constraint
  statement: "分隔符最大长度10字节，TEXT缺省TAB，CSV缺省逗号；仅TEXT/CSV模式可指定分隔符。TEXT模式分隔符不能包含字母、数字或反斜杠点等保留字符；分隔符不能包含换行、NULL字符串、\\0，CSV下也不能包含QUOTE字符。"
  source_anchor: "1.13.9.9 DELIMITERS 页1380-1381"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_formats
  type: syntax
  statement: "FORMAT支持TEXT、CSV和BINARY，缺省TEXT；BINARY模式下不能声明DELIMITER、NULL、CSV、EOL且不支持STDIN/STDOUT；FIXED为定长模式，不能使用DELIMITER、NULL和CSV，必须指定FORMATTER。"
  source_anchor: "1.13.9.9 BINARY/CSV/FIXED/FORMAT 页1384-1386与1392"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_formatter
  type: constraint
  statement: "FORMATTER只能用于FIXED定长模式，按column(offset,length)定义字段位置；offset和length均不能小于0，所有列总长度不能大于1GB，列之间不能重叠，文件中未出现的列默认为空值。"
  source_anchor: "1.13.9.9 FORMATTER 页1386"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_null_header_freeze
  type: syntax
  statement: "NULL指定空值表示，TEXT缺省\\N、CSV缺省无引号空字符串；HEADER在CSV/FIXED模式处理标题行；FILEHEADER只包含一行标题且含换行符长度不超过1M；FREEZE需在同一事务创建/TRUNCATE后COPY、无打开游标且无原有快照。"
  source_anchor: "1.13.9.9 NULL/HEADER/FILEHEADER/FREEZE 页1383-1384"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_force_and_encoding
  type: syntax
  statement: "FORCE NOT NULL用于CSV COPY FROM，使指定字段空输入成为长度0字符串；FORCE QUOTE用于CSV COPY TO，对非NULL输出强制加封闭符；ENCODING指定文件编码，缺省为当前客户端编码。"
  source_anchor: "1.13.9.9 FORCE NOT NULL/FORCE QUOTE/ENCODING 页1384、1388、1395"
  source_refs: *refb1
  status: confirmed
- id: copy_wave8_21_error_tolerance
  type: constraint
  statement: "LOG ERRORS开启COPY FROM数据解析错误容错，LOG ERRORS DATA还会填充rawrecord且仅super用户可用；REJECT LIMIT设置错误上限，取值[1,2147483647]或unlimited。默认约束冲突不容错，A模式可通过会话参数开启非空、CHECK、主键、唯一约束和唯一索引冲突容错，但导入会退化为单行插入。"
  source_anchor: "1.13.9.9 LOG ERRORS/REJECT LIMIT 页1381-1383"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: copy_wave8_21_oq_runtime
  statement: "COPY在真实文件编码、大文件、并行、容错、触发器、生成列和权限白名单组合下的导入导出结果与错误矩阵需授权环境实机验证。"
  status: open
