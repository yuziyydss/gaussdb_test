facts:
- id: sql_format_wave8_101_conventions
  type: syntax
  statement: "SQL语法格式说明（表1-317）：[]表示用[]括起来的部分是可选的；...表示前面的元素可重复出现；[ x | y | ... ]表示从两个或多个选项中选取一个或者不选；{ x | y | ... }表示从两个或多个选项中选取一个；[ x | y | ... ] [ ... ]表示可选多个参数或者不选（选择多个时参数之间用空格分隔）；[ x | y | ... ] [ ,... ]表示可选多个参数或者不选（参数之间用逗号分隔）；{ x | y | ... } [ ... ]表示可选多个参数至少选一个（空格分隔）；{ x | y | ... } [ ,... ]表示可选多个参数至少选一个（逗号分隔）。"
  source_anchor: "1.13.1 表1-317 页1170-1171"
  source_refs: &reffmt
  - w8_101_1_13_1
  status: confirmed
- id: dcl_overview_wave8_101_syntax
  type: syntax
  statement: "DCL（Data Control Language，数据控制语言）用于定义和控制用户对数据库对象（如表、视图、存储过程等）以及数据库实例本身的访问权限：授权语句参见GRANT；收回权限参见REVOKE；设置应用于将来创建对象的默认权限参见ALTER DEFAULT PRIVILEGES；修改数据库对象属主参见REASSIGN OWNED。"
  source_anchor: "1.13.2 DCL语法一览表 页1171"
  source_refs: &refdcl
  - w8_101_1_13_2
  status: confirmed
- id: dcl_role_user_wave8_101_tables
  type: constraint
  statement: "角色定义相关SQL（表1-318）：创建角色CREATE ROLE、修改角色属性ALTER ROLE、删除角色DROP ROLE；用户定义相关SQL（表1-319）：创建用户CREATE USER、修改用户属性ALTER USER、删除用户DROP USER。"
  source_anchor: "1.13.2 表1-318/表1-319 页1171-1172"
  source_refs: *refdcl
  status: confirmed
- id: dcl_params_wave8_101_table
  type: constraint
  statement: "修改/显示/恢复运行参数相关SQL（表1-320）：修改运行时配置参数SET、修改会话ALTER SESSION、显示当前运行时参数的数值SHOW、将指定的运行时参数恢复为默认值RESET。"
  source_anchor: "1.13.2 表1-320 页1172"
  source_refs: *refdcl
  status: confirmed
- id: ddl_overview_wave8_101_syntax
  type: constraint
  statement: "DDL（Data Definition Language，数据定义语言）用于定义和修改数据库对象，主要包括CREATE、ALTER和DROP等语句，用于创建、修改和删除数据库中的对象（例如表、索引、视图、约束、数据类型定义等）；删除一个数据库角色所拥有的数据库对象参见DROP OWNED；说明：GaussDB不支持数据库主节点不完整时进行DDL操作，例如数据库中有1个数据库主节点故障时执行新建数据库、表等操作都会失败。"
  source_anchor: "1.13.3 DDL语法一览表 页1172"
  source_refs: &refddl
  - w8_101_1_13_3
  status: confirmed
- id: ddl_categories_wave8_101_part1
  type: constraint
  statement: "DDL语法一览表对象分类（表1-321~1-341）：客户端加密主密钥（表1-321）、列加密密钥（表1-322）、数据库（表1-323）、模式（表1-324）、表空间（表1-325）、表（表1-326）、分区表（表1-327）、索引（表1-328）、存储过程（表1-329）、函数（表1-330）、包（表1-331）、资源池（表1-332）、聚合函数（表1-333）、数据类型转换（表1-334）、插件扩展（表1-335）、操作符（表1-336）、数据类型（表1-337）、定时任务（表1-338）、DATABASE LINK对象（表1-339）、审计策略（表1-340）、目录对象（表1-341）。"
  source_anchor: "1.13.3 表1-321~1-341 页1172-1183"
  source_refs: *refddl
  status: confirmed
- id: ddl_categories_wave8_101_part2
  type: constraint
  statement: "DDL语法一览表对象分类续（表1-342~1-363）：外部数据封装器（表1-342）、外表（表1-343）、gs_global_config系统表相关SQL（表1-344）、用户组（表1-345）、过程语言（表1-346）、脱敏策略（表1-347）、物化视图（表1-348）、资源标签（表1-349）、行访问控制策略（表1-350）、序列（表1-351）、外部服务器（表1-352）、同义词对象（表1-353）、视图、模型、大模型服务、重写规则、安全标签等。"
  source_anchor: "1.13.3 表1-342~1-363 页1183-1186"
  source_refs: *refddl
  status: confirmed
- id: ddl_standalone_wave8_101_statements
  type: syntax
  statement: "DDL一览表中的独立语句：清理回收站PURGE；根据一个索引对表进行聚簇排序CLUSTER；创建或修改一个对象的注释COMMENT；根据查询结果创建一个新表并将查询到的数据插入新表SELECT INTO；人为操作或应用程序错误时将表恢复到一个早期状态TIMECAPSULE TABLE；快速地从表中删除所有行TRUNCATE；回收表或B-Tree索引中已经删除的行所占据的存储空间VACUUM。"
  source_anchor: "1.13.3 独立语句小节 页1185-1186"
  source_refs: *refddl
  status: confirmed
- id: ddl_pattern_wave8_101_mapping
  type: constraint
  statement: "一览表各对象分类通常按创建/修改/删除映射对应的CREATE/ALTER/DROP语句，例如：数据库定义（表1-323）为CREATE DATABASE、ALTER DATABASE、DROP DATABASE；列加密密钥定义（表1-322）为CREATE COLUMN ENCRYPTION KEY、ALTER COLUMN ENCRYPTION KEY（轮转加密列加密密钥的客户端主密钥）、DROP COLUMN ENCRYPTION KEY。"
  source_anchor: "1.13.3 表1-322/1-323 页1172-1173"
  source_refs: *refddl
  status: confirmed
- id: ddl_schema_wave8_101_category
  type: constraint
  statement: "定义数据库：数据库是组织、存储和管理数据的仓库，数据库定义主要包括创建数据库、修改数据库属性以及删除数据库（表1-323）；定义模式：模式是一组数据库对象的集合，主要用于控制对数据库对象的访问，涉及SQL语句如表1-324（CREATE SCHEMA等）。"
  source_anchor: "1.13.3 定义数据库/定义模式 页1173-1174"
  source_refs: *refddl
  status: confirmed
- id: dml_overview_wave8_101_statements
  type: syntax
  statement: "DML语法一览表：插入数据INSERT（向数据库表中添加一条或多条记录）、INSERT ALL（向多个表添加一条或多条记录，表1-364）；修改数据UPDATE（修改一条或多条记录）；修改或者插入数据MERGE INTO（匹配时对目标表UPDATE、无法匹配时INSERT）；查询数据SELECT；删除数据DELETE（删除表中指定条件的数据）。"
  source_anchor: "1.13.4 DML语法一览表 页1186"
  source_refs: &refdml
  - w8_101_1_13_4
  status: confirmed
- id: dml_misc_wave8_101_statements
  type: constraint
  statement: "DML其他语句：锁相关SQL（表1-365）LOCK（多种锁模式用于控制对表中数据的并发访问）、LOCK BUCKETS（bucket粒度的锁）；预备语句相关SQL（表1-366）PREPARE（创建预备语句）、EXECUTE（执行已提前准备好的预备语句）、DEALLOCATE（删除指定的预备语句）；以及调用函数、结束会话、执行匿名代码块、通过游标检索数据FETCH、插入或替换数据REPLACE、根据表达式计算值VALUES、导入数据LOAD DATA、显示SQL语句执行计划EXPLAIN。"
  source_anchor: "1.13.4 表1-365/1-366及独立小节 页1187-1188"
  source_refs: *refdml
  status: confirmed
- id: dml_copy_call_wave8_101_statements
  type: syntax
  statement: "复制数据：GaussDB提供了在表和文件之间复制数据的语句COPY；调用函数：GaussDB提供了多种用于调用函数的语句（语法结构上并无差别），参见CALL和CREATE FUNCTION；结束会话：用户与数据库之间建立的连接称为会话，GaussDB提供了结束会话的语句ALTER SYSTEM KILL SESSION；插入或替换数据参见REPLACE。"
  source_anchor: "1.13.4 复制数据/调用函数/结束会话/插入或替换数据 页1187-1188"
  source_refs: *refdml
  status: confirmed
