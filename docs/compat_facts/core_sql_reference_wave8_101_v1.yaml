- id: other_identity_upgrade_wave8_101_tables
  type: constraint
  statement: "设置用户标识符相关SQL（表1-369后续）：SET ROLE设置当前会话的当前用户标识符、SET SESSION AUTHORIZATION把当前会话里的会话用户标识和当前用户标识都设置为指定值；数据库升级相关SQL（表1-370）：GENERATED UPDATE SYSTEM OBJECT生成系统对象的升级回滚脚本文件、REFRESH SYSTEM OBJECT将系统对象的版本信息刷新到系统表GS_SYSTEM_OBJECTS_VERSION中用于升级时判断系统对象的变化情况。"
  source_anchor: "1.13.5 表1-370 页1189-1190"
