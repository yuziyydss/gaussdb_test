  status: confirmed
- id: online_ddl_wave8_101_instant
  type: constraint
  statement: "即时变更类DDL：仅修改表的元数据无需数据操作，执行速度快通常在毫秒级完成，执行期间短暂持有排他锁对并发业务影响小；正常场景（目标表上无长事务）对业务影响较小，异常场景（存在长事务）可能阻塞DDL执行并影响后续业务；支持操作（表1-371）：列操作（添加列设置默认值为表达式、删除列、重命名列、设置和删除列默认值、扩展varchar大小仅长度增加、修改numeric精度仅p增大s不变、修改ENUM/SET列定义）、表操作（重命名表、指定字符集、删除表）、表空间操作（重命名表空间、修改所有者、删除表空间）、约束操作（设置列约束为NULL）、分区操作（添加/删除/截断分区、行迁移开关、设置分区索引不可用）；仅修改元数据时耗时与数据量无关；即时变更类DDL无需结合ONLINE关键字，为其添加ONLINE关键字时会被忽略。"
  source_anchor: "1.13.6 表1-371 页1190-1191"
  source_refs: &refonline
  - w8_101_1_13_6
  status: confirmed
- id: online_ddl_wave8_101_data_class
  type: constraint
  statement: "数据操作类DDL：需要对实际数据进行重组或者检查操作，执行时间与数据量成正比；传统模式下执行期间表无法提供读写服务，可能导致长时间业务中断。"
  source_anchor: "1.13.6 数据操作类DDL 页1191"
  source_refs: *refonline
  status: confirmed
- id: online_ddl_wave8_101_online_class
  type: constraint
  statement: "在线DDL通过ONLINE关键字控制，数据操作类DDL通过基础数据重组（检查）和增量数据追增（检查）的方式进行在线变更；在线DDL不支持rowid表；执行期间大部分时间用户可继续进行数据库的读写操作，仅在前期和后期短暂持有排他锁；当前支持操作（表1-372）：列操作（修改列长度、修改列精度、修改列类型）、表操作（表级在线移动表空间）、约束操作（添加非空、检查、唯一、主键约束）、分区操作（切割/合并分区、交换分区、移动分区表空间）、回收存储空间VACUUM FULL、索引操作（创建索引CONCURRENTLY、重建索引CONCURRENTLY、删除索引CONCURRENTLY）。"
  source_anchor: "1.13.6 表1-372 页1192"
  source_refs: *refonline
  status: confirmed
