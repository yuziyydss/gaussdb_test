- id: wave2b6_forknum_mapping
  type: syntax
  statement: 段页式函数中forknum取值：0 main fork、1 fsm fork、2 vm fork。
  source_anchor: 1.6.27.11 页674-675
  source_refs: *id001
  status: confirmed
- id: wave2b6_page_contents
  type: syntax
  statement: 段页式函数contents取值：permanent永久、unlogged不记录日志、temporary全局临时、temporary2本地临时。
  source_anchor: 1.6.27.11 页674-675
  source_refs: *id001
