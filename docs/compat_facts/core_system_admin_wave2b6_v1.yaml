- id: wave2b6_free_spc_remain_segment
  type: constraint
  statement: gs_seg_free_spc_remain_segment释放指定表空间残留段在1号文件占用的页面；为兜底离线清理手段；同一节点同一database不允许并发运行多个残留清理操作。
  source_anchor: 1.6.27.11 页691-692
  source_refs: *id001
  status: confirmed
- id: wave2b6_auto_free_remain_segment
  type: constraint
  statement: gs_seg_auto_free_remain_segment()是在线段页式清理手段，需要GUC enable_auto_segment_remain_cleanup=on；同样不允许同一节点同一database并发执行多个残留清理操作。
  source_anchor: 1.6.27.11 页692
  source_refs: *id001
  status: confirmed
- id: wave2b6_free_spc_remain_extent
  type: constraint
  statement: gs_seg_free_spc_remain_extent释放残留孤立扩展；是离线清理的可靠保证；同一节点同一database不允许并发运行多个残留清理操作。
  source_anchor: 1.6.27.11 页692-694
  source_refs: *id001
  status: confirmed
- id: wave2b6_get_datafiles
  type: syntax
  statement: gs_seg_get_datafiles(database_name)查看实例所有段页式数据文件信息；仅管理员可查；contents包括permanent、unlogged、temporary、temporary2。
  source_anchor: 1.6.27.11 页694-695
  source_refs: *id001
  status: confirmed
- id: wave2b6_get_spc_extents
  type: syntax
  statement: gs_seg_get_spc_extents(tablespace_name,file_id,bucketnode,start_block,count)返回指定表空间扩展信息；仅管理员可查；包含extent_page_type、allocated和shrink_is_residual等字段。
  source_anchor: 1.6.27.11 页695-696
  source_refs: *id001
  status: confirmed
- id: wave2b6_extent_page_type_values
  type: syntax
  statement: 扩展页面类型包括segment head、fork head、level1 page和data extent；allocated Y/N表示已分配/未分配；shrink_is_residual Y/N表示是否为shrink残留扩展。
  source_anchor: 1.6.27.11 页695-696
  source_refs: *id001
