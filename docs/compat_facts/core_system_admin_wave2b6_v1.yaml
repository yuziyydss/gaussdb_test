- id: wave2b6_local_space_shrink
  type: constraint
  statement: local_space_shrink(tablespacename,databasename)在当前节点对指定段页式空间做物理收缩；目前仅支持当前连接database。
  source_anchor: 1.6.27.11 页674
  source_refs: *id001
  status: confirmed
- id: wave2b6_gs_space_shrink
  type: constraint
  statement: gs_space_shrink(tablespace,database,extent_type,forknum)按OID收缩段页式空间；extent_type范围[2,5]，1表示段页式元数据且不支持收缩；该函数仅限工具使用。
  source_anchor: 1.6.27.11 页674
  source_refs: *id001
  status: confirmed
- id: wave2b6_dump_page_by_file
  type: syntax
  statement: gs_seg_dump_page(tablespacename,file_id,bucketnode,file_block_id,forknum=0)解析指定段页式物理页面，返回解析内容；仅sysadmin或运维管理员可执行；结果不包含实际用户数据。
  source_anchor: 1.6.27.11 页674-676
  source_refs: *id001
  status: confirmed
- id: wave2b6_dump_page_by_relid
  type: syntax
  statement: gs_seg_dump_page(relid,bucketnode,block_id,partition)在DN上按relation OID解析指定页面；仅sysadmin或运维管理员可执行。
  source_anchor: 1.6.27.11 页675-677
  source_refs: *id001
  status: confirmed
- id: wave2b6_dump_page_page_types
  type: constraint
  statement: gs_seg_dump_page可识别业务页面（heap、uheap、btree、ubtree等）和段页式元页面（bucket main head、file head、spc header等），并输出unknown页面。
  source_anchor: 1.6.27.11 页674-677
  source_refs: *id001
  status: confirmed
- id: wave2b6_spc_location_overloads
  type: syntax
  statement: gs_seg_get_spc_location支持按tablespace_name/bucketnode/file_id/file_block_id，或按relid/bucketnode/block_id/partition获取空间位置信息。
  source_anchor: 1.6.27.11 页677-678
  source_refs: *id001
  status: confirmed
- id: wave2b6_seg_get_location
  type: syntax
  statement: gs_seg_get_location(block_id,as_extent=false)返回全局block id对应的段页式位置；as_extent=true时按扩展维度返回。
  source_anchor: 1.6.27.11 页678-679
  source_refs: *id001
  status: confirmed
- id: wave2b6_segment_layout
  type: syntax
  statement: gs_seg_get_segment_layout()返回段页式布局的version、section_id、section_type、extent_size、extent_page_count、extent_count_start/end和total_size。
