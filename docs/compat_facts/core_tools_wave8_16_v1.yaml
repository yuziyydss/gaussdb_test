facts:
- id: tools_wave8_16_intro
  type: syntax
  statement: "统一数据库管理工具负责实例故障后的高可用切换能力，核心组件包括CM_Agent、CM_Server和CM日志管理。"
  source_anchor: "5.11.1 页4029-4030"
  source_refs: &refb1
  - w8_16_5_11
  status: confirmed
- id: tools_wave8_16_omm_role
  type: syntax
  statement: "OMM由crontab定时任务控制拉起，主要负责OMM、ETCD、CM_Agent进程的保活及启停。"
  source_anchor: "5.11.1 页4030"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_etcd_role
  type: syntax
  statement: "ETCD由OMM拉起，是高可用顶层组件，协助CMS选主并持久化数据库仲裁信息。"
  source_anchor: "5.11.1 页4030"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_cma_role
  type: syntax
  statement: "CM_Agent由OMM拉起，负责CMS、DN进程保活及启停，仲裁指标采集和仲裁命令执行。"
  source_anchor: "5.11.1 页4031"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_cms_role
  type: syntax
  statement: "CM_Server是数据库仲裁中心，依赖etcd或DCC实现自选主。"
  source_anchor: "5.11.1 页4031"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_dn_role
  type: syntax
  statement: "DN是数据服务组件，由CMA拉起；异步备故障无影响，同步备故障导致数据服务卡顿，主故障导致数据服务不可用。"
  source_anchor: "5.11.1 页4031"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_cm_query_status
  type: syntax
  statement: "cm_ctl query可查询数据库状态；cm_ctl query -Cv可按主备关系成对显示CMS、ETCD、集群和DN状态。"
  source_anchor: "5.11.3.1 页4074-4075"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_cluster_states
  type: constraint
  statement: "集群状态Normal表示实例可用且主备关系正常；Degraded表示实例可用但无冗余备份；Unavailable表示实例不可用。"
  source_anchor: "5.11.3.1 页4075"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_query_flags
  type: syntax
  statement: "cm_ctl query支持-v、-C、-s、-S、-d、-i、-F、-x、-p、-z ALL、-r、-g、-l、-t等状态查询参数。"
  source_anchor: "5.11.3.1 页4074"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_start_stop
  type: syntax
  statement: "cm_ctl支持数据库启停，并可按AZ、节点、实例或独立cm_server范围执行。"
  source_anchor: "5.11.3.2 页4081-4082"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_force_stop
  type: syntax
  statement: "cm_ctl stop -m i用于强制停止数据库；cm_ctl stop --server用于停止独立启动的cm_server。"
  source_anchor: "5.11.3.2 页4082"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_switchover_prereq
  type: constraint
  statement: "switchover前需确保数据库状态正常、业务结束、无主备追赶，并主动执行CHECKPOINT保证脏页刷盘。"
  source_anchor: "5.11.3.3 页4082"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_switchover_params
  type: syntax
  statement: "cm_ctl switchover支持按AZ、节点+数据目录、重置初始主备、全部DN统一切换等方式，默认超时120秒。"
  source_anchor: "5.11.3.3 页4082"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_build
  type: syntax
  statement: "cm_ctl build用于重建备DN或cm_server；支持-c、-n NODEID -D DATADIR、-f强制重建和-b full全量build。"
  source_anchor: "5.11.3.4 页4083"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_16_check_process
  type: syntax
  statement: "cm_ctl check -B BINNAME -T DATAPATH检测实例进程运行状态，进程名可为cm_agent、cm_server、gaussdb、etcd和gs_gtm。"
  source_anchor: "5.11.3.5 页4084"
  source_refs: *refb1
  status: confirmed
