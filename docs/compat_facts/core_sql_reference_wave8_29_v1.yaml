facts:
- id: subpart_wave8_29_purpose_structure
  type: syntax
  statement: "CREATE TABLE SUBPARTITION创建二级分区表；顶层节点表和一级分区都是逻辑表且不存储数据，只有二级分区（叶子节点）存储数据。二级分区方案由两个一级分区方案组合而成。"
  source_anchor: "1.13.9.53 页1591"
  source_refs: &refb1
  - w8_29_1_13_9_53
  status: confirmed
- id: subpart_wave8_29_combinations
  type: syntax
  statement: "二级分区组合方案包括Range-Range、Range-List、Range-Hash、List-Range、List-List、List-Hash、Hash-Range、Hash-List和Hash-Hash；当前二级分区仅支持行存表。"
  source_anchor: "1.13.9.53 页1592"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_key_limits
  type: constraint
  statement: "二级分区表有两个分区键；Range/List分区键最多16列，Hash分区键只支持1列。"
  source_anchor: "1.13.9.53 注意事项 页1592"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_unique_pk_index
  type: constraint
  statement: "唯一约束和主键约束的约束键包含所有分区键时创建LOCAL索引，否则创建GLOBAL索引；指定创建LOCAL唯一索引时必须包含所有分区键。"
  source_anchor: "1.13.9.53 注意事项 页1592"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_auto_subpartition
  type: syntax
  statement: "创建二级分区表时，如果一级分区下未显式指定二级分区，会自动创建一个同范围的二级分区。"
  source_anchor: "1.13.9.53 注意事项 页1592"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_partition_limits
  type: constraint
  statement: "单个表最大分区数为1048575，包括一级和二级分区；默认配置下建议不超过400个分区。分区数过多导致内存不足时会间接造成性能急剧下降。"
  source_anchor: "1.13.9.53 注意事项 页1592"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_rowstore_hashbucket
  type: constraint
  statement: "二级分区表只支持行存，不支持hashbucket。"
  source_anchor: "1.13.9.53 注意事项 页1592"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_object_boundaries
  type: constraint
  statement: "不支持在rowid/rowno系统列上创建外键约束，不支持cluster，不支持密态数据库、账本数据库和行级访问控制。"
  source_anchor: "1.13.9.53 注意事项 页1592"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_partition_keyword_alias
  type: behavior_oracle
  statement: "指定分区查询时PARTITION/SUBPARTITION关键字必须准确；如果拼写错误，查询不报错，但会变成使用别名查询，而不是指定分区查询。"
  source_anchor: "1.13.9.53 注意事项 页1592"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_for_values
  type: constraint
  statement: "二级分区表PARTITION/SUBPARTITION FOR (VALUES)语法中的VALUES只能是常量；需要数据类型转换时建议使用强制类型转换，避免隐式转换结果与预期不符。"
  source_anchor: "1.13.9.53 注意事项 页1592"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_strategy_definitions
  type: syntax
  statement: "创建二级分区表时，RANGE策略分区定义使用VALUES LESS THAN (val)，LIST策略使用VALUES (val[, ...])，HASH策略没有VALUES定义。"
  source_anchor: "1.13.9.53 注意事项 页1592"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_main_syntax
  type: syntax
  statement: "CREATE TABLE SUBPARTITION支持IF NOT EXISTS、列/表约束、LIKE、table_option、htap_option、WITH存储参数、ILM压缩策略、TABLESPACE，并由PARTITION BY和SUBPARTITION BY组合定义一级与二级分区，最后可设置ENABLE/DISABLE ROW MOVEMENT。"
  source_anchor: "1.13.9.53 语法格式 页1592-1594"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_like
  type: syntax
  statement: "LIKE选项支持INCLUDING/EXCLUDING DEFAULTS、GENERATED、CONSTRAINTS、INDEXES、STORAGE、COMMENTS、RELOPTIONS、UPDATE、IDENTITY、ILM和ALL，用于控制从源表继承的列属性、约束、索引、存储参数、注释、IDENTITY和ILM策略。"
  source_anchor: "1.13.9.53 like选项 页1594"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_table_options_constraints
  type: syntax
  statement: "table_option支持COMMENT、AUTO_INCREMENT、默认字符集/字符序和ENGINE；列约束支持NOT NULL、CHECK、DEFAULT、ON UPDATE、生成列、IDENTITY、AUTO_INCREMENT、COMMENT、UNIQUE、PRIMARY KEY和外键，表约束支持CHECK、UNIQUE、PRIMARY KEY和FOREIGN KEY。"
  source_anchor: "1.13.9.53 table_option/约束 页1593-1594与1599-1604"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_storage_params
  type: constraint
  statement: "WITH支持FILLFACTOR、ORIENTATION、STORAGE_TYPE、segment、统计粒度、hasrowid、vacuum_truncate等参数；ORIENTATION缺省ROW且不支持修改，STORAGE_TYPE设置成功后不再支持修改。"
  source_anchor: "1.13.9.53 WITH存储参数 页1596-1598"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_ilm
  type: syntax
  statement: "ILM ADD POLICY ROW STORE COMPRESS支持ADVANCED行存高级压缩、TURBO跨页透明压缩或NONE；压缩级别缺省MEDIUM。子分区可单独指定策略，未指定时先继承一级分区策略，一级分区也未指定则继承表策略；行级EXPR只支持白名单函数。"
  source_anchor: "1.13.9.53 ILM 页1598-1599"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_partition_strategies
  type: syntax
  statement: "PARTITION BY和SUBPARTITION BY支持RANGE、LIST、HASH、KEY；COLUMNS只能用于RANGE/LIST，KEY仅B模式且与HASH同义。INTERVAL可指定自动分区间隔，数值和日期/时间类型；STORE IN为自动创建分区循环选择表空间。"
  source_anchor: "1.13.9.53 PARTITION BY/SUBPARTITION BY 页1599"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_automatic
  type: behavior_oracle
  statement: "AUTOMATIC只支持列表分区自动扩展。一级分区开启时插入未匹配一级分区会自动创建一级分区且二级分区为全集；仅二级开启时未匹配一级分区插入失败，匹配一级但未匹配二级会自动创建二级分区；两层都开启时会在对应层级自动创建分区。"
  source_anchor: "1.13.9.53 AUTOMATIC 页1599"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_counts_template
  type: syntax
  statement: "PARTITIONS和SUBPARTITIONS integer必须大于0且不超过1048575；SUBPARTITIONS只能在HASH/KEY二级分区后指定，未列定义时按“一级分区名+sp+数字”自动生成二级分区。SUBPARTITION TEMPLATE可统一定义二级分区模板及其表空间。"
  source_anchor: "1.13.9.53 PARTITIONS/SUBPARTITIONS/TEMPLATE 页1599-1600"
  source_refs: *refb1
  status: confirmed
- id: subpart_wave8_29_row_movement_dml
  type: constraint
  statement: "ENABLE/DISABLE ROW MOVEMENT控制更新分区键导致跨分区时的行为，ENABLE为缺省，开启时并发UPDATE/DELETE可能报错。二级分区表DML可通过PARTITION/SUBPARTITION名称或FOR分区键定位；INSERT实际分区与指定分区不一致会报错，B模式还支持多分区删除。"
  source_anchor: "1.13.9.53 ROW MOVEMENT与DML示例 页1600-1607"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: subpart_wave8_29_oq_runtime
  statement: "二级分区表在真实数据规模、两层自动扩展、模板、行迁移、ILM压缩和约束索引组合下的路由、错误与性能矩阵需授权环境实机验证。"
  status: open
