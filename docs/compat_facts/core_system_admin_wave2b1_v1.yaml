facts:
- id: wave2b1_current_setting
  type: syntax
  statement: current_setting(setting_name)以查询形式返回指定GUC当前值，等价于SHOW，返回text。
  source_anchor: 1.6.27.1 页592
  source_refs: &id001
  - w2b1_1_6_27
  status: confirmed
- id: wave2b1_set_working_grand_version_num_manually
  type: syntax
  statement: set_working_grand_version_num_manually(tmp_version)通过切换授权版本号更新/升级GaussDB特性，返回void。
  source_anchor: 1.6.27.1 页593
  source_refs: *id001
  status: confirmed
- id: wave2b1_shell_route_functions
  type: syntax
  statement: shell_in(type)和shell_out(type)用于处理shell类型输入/输出路由，返回void。
  source_anchor: 1.6.27.1 页593
  source_refs: *id001
  status: confirmed
- id: wave2b1_set_config_scope
  type: behavior_oracle
  statement: set_config(setting_name,new_value,is_local)设置GUC并返回新值；is_local=true仅当前事务生效，false等价于SET并作用于当前会话；不允许设置ROLE参数。
  source_anchor: 1.6.27.1 页593
  source_refs: *id001
  status: confirmed
- id: wave2b1_file_access_scope
  type: constraint
  statement: 通用文件访问函数只能访问数据库目录以及log_directory目录内文件；相对路径访问数据库目录，日志路径按log_directory匹配；仅数据库初始化用户可使用。
  source_anchor: 1.6.27.2 页593
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_ls_dir
  type: syntax
  statement: pg_ls_dir(dirname)返回目录内除“.”和“..”外的文件/目录名，返回setof text。
  source_anchor: 1.6.27.2 页593-594
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_read_file
  type: syntax
  statement: pg_read_file(filename[,offset,length])返回文本文件内容；offset/length可省略，offset为负时相对文件结尾回退，省略offset/length返回整个文件。
  source_anchor: 1.6.27.2 页594
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_read_binary_file
  type: syntax
  statement: pg_read_binary_file(filename[,offset,length[,missing_ok]])返回二进制文件内容bytea；功能类似pg_read_file但不做编码检查。
  source_anchor: 1.6.27.2 页594-595
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_read_binary_file_blocks
  type: constraint
  statement: pg_read_binary_file_blocks(path,block_begin,block_count)用于读取跨页透明压缩文件二进制内容；不支持旧签名pg_read_binary_file_blocks(input,blocknum,blockcount)。
  source_anchor: 1.6.27.2 页595
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_stat_file
  type: syntax
  statement: pg_stat_file(filename[,missing_ok])返回文件大小、访问/修改/创建/变更时间、是否目录等文件状态。
  source_anchor: 1.6.27.2 页595-596
  source_refs: *id001
  status: confirmed
- id: wave2b1_server_signal_permission
  type: constraint
  statement: 服务器信号函数向服务器线程发送控制信号，仅系统管理员或继承gs_role_signal_backend权限的用户可执行；部分函数另有属主限制。
  source_anchor: 1.6.27.3 页596
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_cancel_backend
  type: behavior_oracle
  statement: pg_cancel_backend(pid)向目标后端发送查询取消信号(SIGINT)；pid可从PG_STAT_ACTIVITY.pid获取；只取消语句，不终止会话。
  source_anchor: 1.6.27.3 页596
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_cancel_session
  type: behavior_oracle
  statement: pg_cancel_session(pid,sessionid)用于线程池模式取消活跃会话正在执行的语句；PDB内仅取消本PDB会话，Non-PDB可全局操作；pid=sessionid且均为线程id时等价pg_cancel_backend。
  source_anchor: 1.6.27.3 页596
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_reload_conf
  type: behavior_oracle
  statement: pg_reload_conf()发送SIGHUP触发所有服务器线程重新加载配置文件，返回Boolean；多租场景PDB内禁用。
  source_anchor: 1.6.27.3 页596
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_rotate_logfile
  type: behavior_oracle
  statement: pg_rotate_logfile()滚动服务器日志文件并返回Boolean；仅当redirect_stderr用于日志输出时有效；多租场景PDB内报错。
  source_anchor: 1.6.27.3 页596
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_terminate_backend
  type: behavior_oracle
  statement: pg_terminate_backend(pid)终止后端线程并返回Boolean；支持非线程池线程和活跃线程池线程，不支持非活跃线程池线程；锁等待、硬件异常或阻塞场景可能无法立即终止。
  source_anchor: 1.6.27.3 页596-597
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_terminate_session
  type: behavior_oracle
  statement: pg_terminate_session(pid,sessionid)终止后台session；pid=sessionid且均为线程id时按线程粒度，pid≠sessionid时按会话粒度；可清理非活跃线程池会话及客户端socket。
  source_anchor: 1.6.27.3 页597
  source_refs: *id001
  status: confirmed
- id: wave2b1_pg_terminate_active_session_socket
  type: behavior_oracle
  statement: pg_terminate_active_session_socket(pid,sessionid)关闭活跃session与客户端socket连接，返回Boolean。
  source_anchor: 1.6.27.3 页597
  source_refs: *id001
  status: confirmed
- id: wave2b1_terminate_session_has_temp_file
  type: constraint
  statement: terminate_session_has_temp_file()中断所有正在打开临时文件的会话，返回void；仅系统管理员可执行，且主要由CM组件在特定流程中调用，不建议手动调用。
  source_anchor: 1.6.27.3 页597
  source_refs: *id001
  status: confirmed
- id: wave2b1_scope_note
  type: environment
  statement: Wave 2B-1覆盖1.6.27.1配置设置函数、1.6.27.2通用文件访问函数、1.6.27.3服务器信号函数，物理页592-596。
  source_anchor: 1.6.27.1-1.6.27.3 页592-596
  source_refs: *id001
  status: confirmed
