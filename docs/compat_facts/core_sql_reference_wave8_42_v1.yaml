facts:
- id: seq_wave8_42_purpose
  type: syntax
  statement: "CREATE SEQUENCE向当前数据库增加新序列；序列是存放等差数列的特殊表，通常用于为行或表生成唯一标识符。"
  source_anchor: "1.13.9.45 页1524"
  source_refs: &refb1
  - w8_42_1_13_9_45
  status: confirmed
- id: seq_wave8_42_owner_schema_name
  type: constraint
  statement: "序列所有者为创建用户；指定模式名时在指定模式创建，否则在当前模式创建。序列名必须与同一模式中的其他序列、表、索引、视图或外表不同。"
  source_anchor: "1.13.9.45 注意事项 页1524"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_nextval_generate_series
  type: constraint
  statement: "创建序列后，若在表中同时使用nextval()和generate_series(1,N)插入数据，需保证nextval可调用次数大于等于N+1次；generate_series会调用N+1次，否则报错。"
  source_anchor: "1.13.9.45 注意事项 页1524"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_any_permission
  type: constraint
  statement: "被授予CREATE ANY SEQUENCE权限的用户可以在PUBLIC模式和用户模式下创建序列。"
  source_anchor: "1.13.9.45 注意事项 页1524"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_rowid_rowno
  type: constraint
  statement: "不支持将序列与rowid、rowno系统列关联。"
  source_anchor: "1.13.9.45 注意事项 页1524"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_main_syntax
  type: syntax
  statement: "CREATE [LARGE|TEMPORARY|TEMP] SEQUENCE [IF NOT EXISTS] name支持INCREMENT BY、MINVALUE/NO MINVALUE/NOMINVALUE、MAXVALUE/NO MAXVALUE/NOMAXVALUE、START WITH、CACHE、CYCLE/NO CYCLE/NOCYCLE和OWNED BY table_name.column_name|NONE。"
  source_anchor: "1.13.9.45 语法格式 页1525"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_large
  type: syntax
  statement: "LARGE关键字创建int128位序列，未指定时默认int64；默认序列最大值为2^63-1，LARGE序列最大值可支持到2^127-1。"
  source_anchor: "1.13.9.45 LARGE 页1525"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_temporary
  type: syntax
  statement: "TEMPORARY/TEMP创建临时序列，需要启用PG兼容；其生命周期为会话级，对象会话隔离，会话退出后自动删除清理。"
  source_anchor: "1.13.9.45 TEMPORARY/TEMP 页1525"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_temp_schema
  type: constraint
  statement: "临时序列存在于特殊模式，每个会话有且仅有一个临时模式；已提前创建临时模式时可给出模式名，否则不能给出模式名。每个会话只能访问自己的临时模式对象，访问其他会话的临时模式会报错。"
  source_anchor: "1.13.9.45 TEMPORARY说明 页1525"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_temporary_shadowing
  type: constraint
  statement: "临时序列存在时，该会话中已有的同名永久序列不可见；但可以使用模式限定名称引用同名永久序列。"
  source_anchor: "1.13.9.45 TEMPORARY说明 页1525"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_if_not_exists
  type: constraint
  statement: "IF NOT EXISTS在当前Schema存在同名relation时不新建并返回NOTICE；未指定时同名relation返回ERROR。"
  source_anchor: "1.13.9.45 IF NOT EXISTS 页1525"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_name_length
  type: constraint
  statement: "序列名称必须符合标识符命名规范，最大长度不超过63个字符。"
  source_anchor: "1.13.9.45 name 页1525"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_increment
  type: constraint
  statement: "INCREMENT指定步长：正数生成递增序列，负数生成递减序列，默认值为1；B兼容模式下浮点步长自动转为整型，其他模式不支持输入浮点数。"
  source_anchor: "1.13.9.45 increment 页1525-1526"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_minvalue
  type: syntax
  statement: "MINVALUE/NO MINVALUE/NOMINVALUE指定最小值，NOMINVALUE等价NO MINVALUE；未声明或NO时，普通序列递增默认1、递减默认-(2^63-1)，LARGE序列递增默认1、递减默认-(2^127-1)。"
  source_anchor: "1.13.9.45 MINVALUE 页1526"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_maxvalue
  type: syntax
  statement: "MAXVALUE/NO MAXVALUE/NOMAXVALUE指定最大值，NOMAXVALUE等价NO MAXVALUE；未声明或NO时，普通序列递增默认2^63-1、递减默认-1，LARGE序列递增默认2^127-1、递减默认-1。"
  source_anchor: "1.13.9.45 MAXVALUE 页1526"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_start
  type: syntax
  statement: "START指定序列起始值；递增序列默认为minvalue，递减序列默认为maxvalue。"
  source_anchor: "1.13.9.45 start 页1526"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_cache
  type: constraint
  statement: "CACHE指定内存中预先存储的序列号个数，默认1表示一次只生成一个值；不建议同时定义cache和maxvalue/minvalue，cache不保证连续性，可能产生空洞并浪费号段。"
  source_anchor: "1.13.9.45 cache 页1526"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_cycle
  type: syntax
  statement: "CYCLE使序列达到maxvalue或minvalue后继续循环；NO CYCLE/NOCYCLE在达到最大值后nextval返回错误，NOCYCLE等价NO CYCLE且为默认。定义CYCLE时不保证序列唯一性。"
  source_anchor: "1.13.9.45 CYCLE 页1526"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_owned_by
  type: syntax
  statement: "OWNED BY将序列与表的指定字段关联，删除字段或表时自动删除关联序列；表和序列所有者必须相同且在同一模式。OWNED BY只建立关联，不会在插入数据时让该列自动自增；缺省OWNED BY NONE。不建议OWNED BY序列用于其他表，多表共享序列不应从属特定表。"
  source_anchor: "1.13.9.45 OWNED BY 页1526-1527"
  source_refs: *refb1
  status: confirmed
- id: seq_wave8_42_auto_increment_pattern
  type: behavior_oracle
  statement: "可将序列作为表自增列实现：创建序列并以OWNED BY关联表列，再用ALTER TABLE ... SET DEFAULT nextval(sequence)设置默认值；插入后列值按序列生成，CYCLE序列达到MAXVALUE后重新从MINVALUE开始。"
  source_anchor: "1.13.9.45 示例 页1527-1528"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: seq_wave8_42_oq_runtime
  statement: "CREATE SEQUENCE在真实并发、缓存、CYCLE、临时序列和OWNED BY组合下的取值连续性与错误矩阵需授权环境实机验证。"
  status: open
