  source_refs: *refw8198
  status: confirmed
- id: bmode_wave8_198_json_search
  type: constraint
  statement: "JSON_SEARCH()返回值差异：GaussDB返回text而MySQL返回JSON。"
  source_anchor: "4.4.3.2.8 表4-185 页3543-3544"
  source_refs: *refw8198
  status: confirmed
- id: bmode_wave8_198_group_concat_default
  type: constraint
  statement: "GROUP_CONCAT差异：DISTINCT+ORDER BY时ORDER BY表达式须在DISTINCT中；order by数字不代表第几个参数排序；返回值始终text而MySQL含二进制返回二进制超512为大对象；group_concat_max_len有效范围0-1073741823比MySQL小；DEFAULT()差异：数组默认值GaussDB返回数组MySQL不支持/隐藏列返回空/支持分区表临时表多表连接/支持字符串值节点和A_Star节点/不校验字段类型范围/默认值为函数表达式时返回计算值而MySQL返回NULL。"
  source_anchor: "4.4.3.2.9 表4-186 页3544-3545"
  source_refs: *refw8198
  status: confirmed
- id: bmode_wave8_198_log_rand
  type: constraint
  statement: "log2/log10差异：小数位显示差异受浮点数据类型限制可通过extra_float_digits控制；输入精度内部处理差异导致结果计算差异；RAND([seed])差异：随机数生成算法影响返回与MySQL存在差异。"
  source_anchor: "4.4.3.2.10 表4-187 页3545-3546"
  source_refs: *refw8198
  status: confirmed
