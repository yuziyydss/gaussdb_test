facts:
- id: oracompat_wave8_182_ddl_clauses
  type: constraint
  statement: "常见SQL DDL子句兼容：分配扩展子句（ALLOCATE EXTENT）不支持；约束支持；取消分配未使用子句（DEALLOCATE UNUSED）不支持；文件规范不支持；日志记录子句部分支持有差异（不支持LOGGING和FILESYSTEM_LIKE_LOGGING约束子句——CREATE LOGGING TABLE语法报错）；并行子句支持有差异；物理属性子句支持有差异；大小子句支持有差异；存储子句支持有差异；聚集函数嵌套支持有差异。"
  source_anchor: "4.3.8 表4-44常用SQL DDL子句 页3178-3184"
  source_refs: &refoc
  - w8_182_4_3
  status: confirmed
- id: oracompat_wave8_182_sql_queries
  type: constraint
  statement: "SQL查询和子查询兼容：跨节点连接查询支持；分层查询支持有差异——GaussDB语法上允许ORDER SIBLINGS BY和ORDER BY同时使用（最终排序以外层ORDER BY为准）而Oracle不支持该用法；子查询支持。"
  source_anchor: "4.3.9 SQL查询和子查询 页3184-3186"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_plsql_operators
  type: syntax
  statement: "PL/SQL操作符兼容：算术/比较/逻辑运算符（+/:=/=>/%/'/./||/'/**不支持/括号/冒号/逗号/标签/注释/*\"/区间/=/<>/!=/~=/^=/</>+/<=/>=/@/--/;-）、逻辑运算符（NOT/AND/OR）、比较表达式（IS [NOT] NULL/LIKE/BETWEEN/IN）、条件表达式（simple CASE/searched CASE）均支持。"
  source_anchor: "4.3.10.1 表4-46~4-49 页3186-3187"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_variable_declaration
  type: constraint
  statement: "变量声明兼容限制：%TYPE支持有差异（不支持record变量%type、pkg.record%type/schema.pkg.record%type作为出入参、表/视图.column.column%type嵌套1层及以上、record变量.column.column%type嵌套1层及以上）；%ROWTYPE支持有差异（不支持view%rowtype/schema.view%rowtype作为出入参、不支持package.cursor变量%rowtype作为出入参）。"
  source_anchor: "4.3.10.2 表4-50变量声明 页3188"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_plsql_datatypes
  type: constraint
  statement: "PL/SQL数据类型兼容：CHARACTER/VARCHAR支持有差异（GaussDB字节长度1~10485760 vs Oracle 1~32767）；STRING不支持；PLS_INTEGER不支持（可使用int类型替代）；BINARY_INTEGER支持；SUBTYPE支持（GaussDB仅INT类型支持range约束 vs Oracle仅PLS_INTEGER/BINARY_INTEGER支持RANGE约束；GaussDB定义变量时不支持指定range约束；subtype基类型为字符数据类型时不支持指定字符集信息）。"
  source_anchor: "4.3.10.2 表4-51/4-52 页3188-3189"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_control_statements
  type: syntax
  statement: "PL/SQL控制语句兼容：条件语句（IF THEN/IF THEN ELSE/IF THEN ELSIF/simple CASE/searched CASE）均支持；LOOP循环（LOOP/EXIT/EXIT WHEN/CONTINUE/CONTINUE WHEN）支持；FOR循环支持有差异（REVERSE时lower_bound必须≥upper_bound否则循环体不执行）；WHILE LOOP支持；GOTO支持；NULL语句支持。"
  source_anchor: "4.3.10.3 表4-53~4-58 页3189-3191"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_collection_types
  type: syntax
  statement: "集合和Record类型兼容：Associative array（index-by table）/VARRAY/Nested table/record类型均支持；语法差异——Associative array不支持PLS_INTEGER索引（可用基础数据类型/record/集合/数组类型但不含ref cursor）、NOT NULL仅语法不支持功能；VARRAY不支持NOT NULL语法、不支持datatype为varray类型（varray不能嵌套）、size_limit需behavior_compat_options开启varray_compat；Nested table NOT NULL仅语法；record列可定义NOT NULL和默认值但嵌套record/通过package.record_type创建的record变量不生效。"
  source_anchor: "4.3.10.4 表4-59/4-60 页3191-3192"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_collection_operators
  type: constraint
  statement: "集合操作符兼容差异：=/<>^=/[NOT] IN——Oracle比较时忽略集合成员先后顺序而GaussDB严格按照集合成员先后顺序；IS [NOT] NULL支持；IS [NOT] A SET/IS [NOT] EMPTY/expr [NOT] MEMBER [OF]/nested_table1 [NOT] SUBMULTISET [OF]不支持；MULTISET UNION/EXCEPT/INTERSECT [ALL|DISTINCT]支持。"
  source_anchor: "4.3.10.4 表4-63/4-64 页3193-3194"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_collection_functions
  type: constraint
  statement: "集合类型函数兼容：exists(idx)/delete[(idx1[,idx2])]/count/first/last/prior(idx)/next(idx)支持；extend[(count[,idx])]支持有差异（GaussDB仅支持nesttable类型）；trim[(n)]支持有差异（仅nesttable）；limit支持有差异（仅nesttable）。"
  source_anchor: "4.3.10.4 表4-65 页3194-3195"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_ddl_parallel
  type: constraint
  statement: "并行子句差异：Oracle的PARALLEL [integer | AUTO]子句在GaussDB中支持有差异——GaussDB不支持NOPARALLEL关键字（需省略或使用其他方式）。"
  source_anchor: "4.3.8 表4-44并行子句 页3180-3181"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_ddl_storage
  type: constraint
  statement: "存储子句差异：Oracle的STORAGE子句（INITIAL/NEXT/MINEXTENTS/MAXEXTENTS/PCTINCREASE/FREELISTS等）在GaussDB中支持有差异——GaussDB不支持部分存储参数如FREELISTS和FREELIST GROUPS。"
  source_anchor: "4.3.8 表4-44存储子句 页3181"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_ddl_physical
  type: constraint
  statement: "物理属性子句差异：Oracle的物理属性子句（PCTFREE/PCTUSED/INITRANS/MAXTRANS/COMPRESS等）在GaussDB中支持有差异——GaussDB不支持部分物理属性参数如PCTUSED和INITRANS。"
  source_anchor: "4.3.8 表4-44物理属性子句 页3181"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_ddl_agg_nesting
  type: constraint
  statement: "聚集函数嵌套：Oracle支持聚集函数嵌套（如AVG(SUM(x))），GaussDB中支持有差异。"
  source_anchor: "4.3.8 表4-44聚集函数嵌套 页3184"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_varray_assignment
  type: constraint
  statement: "VARRAY变量赋值差异：GaussDB不同VARRAY类型的数据可以相互赋值（取决于其元素之间是否能相互隐式转换），Oracle要求VARRAY类型完全一致才能赋值。"
  source_anchor: "4.3.10.4 表4-62变量赋值 页3194"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_record_assignment
  type: constraint
  statement: "record变量赋值差异：GaussDB不同record类型的数据可以相互赋值（取决于列与列之间是否能相互隐式转换），Oracle要求record类型完全一致才能赋值。"
  source_anchor: "4.3.10.4 表4-62变量赋值 页3194"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_record_operations
  type: syntax
  statement: "record变量操作：record变量支持INSERT INTO表/UPDATE表SET/SELECT INTO/FETCH INTO等操作（参考Oracle record操作），record的列可定义为NOT NULL属性也可以指定默认值，其他类型嵌套record时默认值和NOT NULL不生效。"
  source_anchor: "4.3.10.4 表4-66 record变量操作 页3195-3196"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_collection_size_limit
  type: constraint
  statement: "VARRAY size_limit依赖：VARRAY的size_limit功能生效需要在behavior_compat_options GUC参数中开启varray_compat参数；GaussDB内不支持datatype为varray类型（varray不能嵌套）。"
  source_anchor: "4.3.10.4 表4-60 VARRAY行 页3192"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_collection_notnull
  type: constraint
  statement: "集合NOT NULL约束差异：GaussDB内Associative array和Nested table的NOT NULL只支持语法不支持功能（不会校验元素是否为NULL）；VARRAY不支持NOT NULL语法。"
  source_anchor: "4.3.10.4 表4-60 页3191-3192"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_plsql_not_supported
  type: constraint
  statement: "PL/SQL不支持项汇总：预定义的PL/SQL常量和类型/子类型不支持；**（幂运算）操作符不支持；STRING数据类型不支持；PLS_INTEGER不支持（可用int替代）。"
  source_anchor: "4.3.10 页3186-3189"
  source_refs: *refoc
  status: confirmed
- id: oracompat_wave8_182_plsql_subtype_range
  type: constraint
  statement: "SUBTYPE range约束差异：GaussDB仅INT类型支持range约束而Oracle仅PLS_INTEGER/BINARY_INTEGER及其预定义子类型支持RANGE约束；GaussDB中在定义变量时不支持指定range约束；GaussDB中subtype基类型为字符数据类型时不支持指定字符集信息。"
  source_anchor: "4.3.10.2 表4-52 SUBTYPE 页3189"
  source_refs: *refoc
  status: confirmed
open_questions:
- id: pkg2_wave8_182_oq_runtime
  content: "LOGGING/NOLOGGING子句缺失对迁移性能的影响、ORDER SIBLINGS BY+ORDER BY同时使用的排序结果确定性、集合操作符成员顺序差异对业务逻辑的影响、VARRAY类型相互赋值的隐式转换规则需授权环境实机验证。"
  status: open
