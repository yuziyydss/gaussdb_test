facts:
- id: m_op_overview_wave8_121_table
  type: syntax
  statement: "M兼容操作符连接操作数或参数并返回结果（分一元运算符\"运算符 操作数\"和二元运算符\"操作数1 运算符 操作数2\"）；表2-35操作符全集：逻辑操作NOT (!)一元逻辑非、AND（&&）二元逻辑与、OR（||）二元逻辑或、XOR二元逻辑异或；位操作&（按位与）、|（按位或）、^（按位异或）、<<（左移）、>>（右移）二元和~（按位非）一元；模式匹配[NOT] LIKE二元；比较操作<、>、<=、>=、=、<>或!=（二元）、<=>（NULL安全等于二元）、[NOT] BETWEEN AND（三元，判断操作数1是否大于等于操作数2且小于等于操作数3）、IS/IS NOT（二元）、IS NULL/IS NOT NULL（一元）；算术操作+和-（一元/二元）、*、/、%或MOD（整数除法返回余数）、DIV（整数除法返回商值）；类型转换BINARY一元（转换为BINARY类型）。"
  source_anchor: "2.5.1 表2-35 页2311-2312"
  source_refs: &refmop
  - w8_121_2_5_1
  status: confirmed
- id: m_op_overview_wave8_121_types
  type: constraint
  statement: "M兼容操作符支持的数据类型（表2-36）：布尔类型BOOLEAN/BOOL；二进制类型BINARY、VARBINARY、TINYBLOB、BLOB、MEDIUMBLOB、LONGBLOB；字符串类型CHAR、VARCHAR、TINYTEXT、TEXT、MEDIUMTEXT、LONGTEXT；日期时间类型DATE、TIME、TIMESTAMP、DATETIME、YEAR；位串类型BIT；数值类型TINYINT、SMALLINT、MEDIUMINT、INT/INTEGER、BIGINT、NUMERIC/DECIMAL、DEC、FIXED、FLOAT、FLOAT4、FLOAT8、DOUBLE及各UNSIGNED类型；JSON类型JSON；枚举类型ENUM；集合类型SET。"
  source_anchor: "2.5.1 表2-36 页2313"
  source_refs: *refmop
  status: confirmed
- id: m_op_overview_wave8_121_null_safe
  type: constraint
  statement: "<=>为NULL安全等于（区别于普通等于=）；%或MOD为整数除法返回余数、DIV为整数除法返回商值；IS判断是否与布尔值等价、IS NOT为IS的否定。"
  source_anchor: "2.5.1 表2-35 页2312"
  source_refs: *refmop
  status: confirmed
- id: m_logic_wave8_121_ops
  type: syntax
  statement: "M兼容逻辑操作符支持AND（&&）、OR（||）、NOT（!）、XOR四个（表2-38），运算结果有三种：TRUE、FALSE和空值；\"!\"和\"NOT\"功能相同但\"!\"的优先级高于\"NOT\"；操作符AND、XOR和OR具有交换性（交换左右两个操作数不影响结果）。"
  source_anchor: "2.5.2 表2-38/说明 页2314-2316"
  source_refs: &refmlogic
  - w8_121_2_5_2
  status: confirmed
- id: m_logic_wave8_121_not_rules
  type: constraint
  statement: "NOT操作符运算规则（表2-39，操作数为布尔类型）：NOT TRUE结果为FALSE、NOT FALSE结果为TRUE、NOT NULL结果为空值。"
  source_anchor: "2.5.2 表2-39 页2315"
  source_refs: *refmlogic
  status: confirmed
- id: m_logic_wave8_121_andor_rules
  type: constraint
  statement: "AND、OR、XOR运算规则（表2-40）：TRUE AND TRUE=TRUE、TRUE AND FALSE=FALSE、TRUE AND NULL=空值、FALSE AND FALSE=FALSE、FALSE AND NULL=FALSE、NULL AND NULL=空值；TRUE OR TRUE=TRUE、TRUE OR FALSE=TRUE、TRUE OR NULL=TRUE、FALSE OR FALSE=FALSE、FALSE OR NULL=空值、NULL OR NULL=空值；TRUE XOR TRUE=FALSE、TRUE XOR FALSE=TRUE、TRUE XOR NULL=空值、FALSE XOR FALSE=FALSE、FALSE XOR NULL=空值、NULL XOR NULL=空值。"
  source_anchor: "2.5.2 表2-40 页2315"
  source_refs: *refmlogic
  status: confirmed
- id: m_logic_wave8_121_type_rules
  type: constraint
  statement: "逻辑运算类型归类（表2-41）：不同大类型之间的数据操作时先提升到大类型，再根据提升后的大类型的结果是否为0进行计算；XOR所有类型归类BIGINT；AND/OR/NOT对整型系列（TINYINT、SMALLINT、MEDIUMINT、INT/INTEGER、BIGINT及各UNSIGNED）、BIT、YEAR、BOOL/LBOOLEAN归类BIGINT；其他类型归类DOUBLE。"
  source_anchor: "2.5.2 表2-41 页2316"
  source_refs: *refmlogic
  status: confirmed
- id: m_bit_wave8_121_ops
  type: syntax
  statement: "M兼容位运算操作符六个：按位与（&）、按位或（|）、按位异或（^）、左移（<<）、右移（>>）、按位取反（~）（表2-35）；优先级：按位取反 > 按位异或 > 左移 = 右移 > 按位与 > 按位或。"
  source_anchor: "2.5.3 功能描述 页2317"
  source_refs: &refmbit
  - w8_121_2_5_3
  status: confirmed
- id: m_bit_wave8_121_semantics
  type: constraint
  statement: "位运算语义：&按位进行与操作；|按位进行或操作；^按位进行异或操作；<<左移操作；>>右移操作；~按位进行非操作。"
  source_anchor: "2.5.3 各操作符描述 页2317-2318"
  source_refs: *refmbit
  status: confirmed
- id: m_bit_wave8_121_examples
  type: behavior_oracle
  statement: "位运算示例（m_db）：SELECT 1 & 1返回1；SELECT 1 | 1返回1；SELECT -1 ^ -1返回0；SELECT 1 << 1返回2；SELECT -1 >> -1返回0。"
  source_anchor: "2.5.3 示例 页2317-2318"
  source_refs: *refmbit
  status: confirmed
- id: m_match_like_wave8_121_rules
  type: syntax
  statement: "M兼容[NOT] LIKE模式匹配：字符串与提供的模式匹配则LIKE返回真（NOT LIKE返回假）；匹配规则1：此操作符只有在模式匹配整个串时才能成功（要匹配串内任何位置的序列该模式必须以百分号开头和结尾）；规则2：下划线_匹配任何单个字符、百分号%代表任意串的通配符。"
  source_anchor: "2.5.4 [NOT] LIKE 页2318"
  source_refs: &refmmatch
  - w8_121_2_5_4
  status: confirmed
- id: m_match_like_wave8_121_escape
  type: constraint
  statement: "M兼容LIKE逃逸规则：规则3：要匹配文本里的下划线或百分号，模式里相应字符必须前导逃逸字符（逃逸字符禁用元字符特殊含义，缺省逃逸字符是反斜杠，可用ESCAPE子句指定不同的逃逸字符）；规则4：要匹配逃逸字符本身写两个逃逸字符（包含反斜线的模式常量在SQL语句里写两个反斜杠）。"
  source_anchor: "2.5.4 [NOT] LIKE 页2318"
  source_refs: *refmmatch
  status: confirmed
- id: m_match_like_wave8_121_case_equiv
  type: constraint
  statement: "M兼容LIKE大小写与等价符：是否区分大小写与字符序有关（如默认的utf8mb4_general_ci不区分大小写）；操作符~~等效于LIKE，操作符!~~等效于NOT LIKE。"
  source_anchor: "2.4.2.5.4 [NOT] LIKE 页2318"
  source_refs: *refmmatch
  status: confirmed
- id: m_match_like_wave8_121_examples
  type: behavior_oracle
  statement: "LIKE示例基线（m_db，字符序utf8mb4_general_ci不区分大小写）：SELECT c FROM t WHERE c LIKE '%B^c%'匹配ab^CD&eF；BINARY/BLOB字段字符序utf8mb4_bin区分大小写（WHERE b LIKE 'ab%'）；用ESCAPE字符匹配_及%（WHERE c LIKE '%B\\_c%'）；指定ESCAPE字符（WHERE c LIKE '%B^_c%' ESCAPE '^'）。"
  source_anchor: "2.5.4 示例 页2318-2319"
  source_refs: *refmmatch
  status: confirmed
- id: m_match_regexp_wave8_121_ops
  type: syntax
  statement: "M兼容[NOT] REGEXP正则表达式匹配：REGEXP判断字符串是否与正则表达式匹配（语法expr REGEXP pat），NOT REGEXP为REGEXP的否定（expr NOT REGEXP pat），根据模式是否匹配给定字符串返回真或假。"
  source_anchor: "2.5.4 [NOT] REGEXP 页2319"
  source_refs: *refmmatch
  status: confirmed
- id: m_match_regexp_wave8_121_syntax
  type: constraint
  statement: "M兼容正则表达式语法：^匹配字符串开头；$匹配字符串末尾；.匹配任意字符（包括回车和换行符）；a*匹配零个或多个a；a+匹配一个或多个a；a?匹配零个或一个a；de | abc匹配de或abc；(abc)*匹配零个或多个abc；a{1}/a{2,3}指定重复次数；[a-dX]与[^a-dX]范围匹配；[.characters.]匹配用于校对元素的字符序列；[=character_class=]等价类匹配具有相同排序校对值的所有字符（如o和(+)是等同类成员则[[=o=]]、[[=(+)=]]和[o(+)]是同义词）；[[:<:]]与[[:>:]]分别匹配字符串的开始和结束。"
  source_anchor: "2.5.4 正则表达式语法 页2319,2322"
  source_refs: *refmmatch
  status: confirmed
- id: m_match_regexp_wave8_121_charclass
  type: constraint
  statement: "M兼容正则[:character_class:]标准字符类：alnum文字数字[0-9a-zA-Z]、alpha文字[a-zA-Z]、blank空白[\\t]、cntrl控制字符[\\x01-\\x1F]、digit数字[0-9]、graph图形字符[^\\x01-\\x20]、lower小写[a-z]、print图形字符、punct标点字符、space空格制表符新行回车[\\n\\r\\t\\x0B]、upper大写[A-Z]、xdigit十六进制[0-9a-fA-F]；[.characters.]允许的字符名称如NUL=0、BS=10、backspace=\\b、tab=\\t、LF=\\n、newline=\\n、VT=\\v、FF=\\f、CR=\\r、carriage-return=\\r、space、exclamation-mark=!、quotation-mark=\"、dollar-sign=$、percent-sign=%、ampersand=&、apostrophe='、left-parenthesis=(、asterisk=*等。"
  source_anchor: "2.5.4 字符类表 页2321-2322"
  source_refs: *refmmatch
  status: confirmed
- id: m_match_regexp_wave8_121_examples
  type: behavior_oracle
  statement: "REGEXP示例基线（m_db）：SELECT 'fo\\nfo' REGEXP '^fo$'返回f；SELECT 'fofo' REGEXP '^fo'返回t；SELECT 'Ban' REGEXP '^Ba*n'返回t；SELECT 'Bn' REGEXP '^Ba?n'返回t；SELECT 'pi' REGEXP 'pi|apa'返回t；SELECT 'aXbc' NOT REGEXP '^[a-dXYZ]$'返回t。"
  source_anchor: "2.5.4 示例 页2322"
  source_refs: *refmmatch
  status: confirmed
- id: m_match_escape_wave8_121_on
  type: constraint
  statement: "m_format_behavior_compat_options开启enable_escape_string配置开关时支持的转义字符匹配：\\'单引号、\\\"双引号、\\b退格符、\\n换行符、\\r回车符、\\t制表符、\\Z为ASCII 26（Control Z）、\\\\反斜杠符、\\%一个%符、\\_一个_符；\\0在GaussDB报错invalid byte sequence for encoding \"UTF8\": 0x00。"
  source_anchor: "2.5.4 转义字符匹配 页2323"
  source_refs: *refmmatch
  status: confirmed
- id: m_match_escape_wave8_121_off
  type: constraint
  statement: "m_format_behavior_compat_options关闭enable_escape_string且设置standard_conforming_strings='off'、escape_string_warning='off'、backslash_quote='on'时支持的转义字符：\\'、\\b退格键、\\f换页符、\\n换行符、\\r回车符、\\t水平制表符、\\uwxyz（wxyz为四个十六进制数字）十六进制0xwxyz的字符、\\xhhh（hhh为任意十六进制序列）十六进制0xhhh的字符、\\0报错invalid byte sequence for encoding \"UTF8\": 0x00、\\xy（xy为两个八进制数字）八进制0xy的字符、\\xyz（xyz为三个八进制数字）八进制0xyz的字符；注意：词法语法解析按字节流解析，多字节字符包含与\\、\\'、\\\\等符号一致的编码时会与mysql行为不一致（建议暂时关闭转义符开关规避）。"
  source_anchor: "2.5.4 转义字符匹配 页2323-2324"
  source_refs: *refmmatch
  status: confirmed
