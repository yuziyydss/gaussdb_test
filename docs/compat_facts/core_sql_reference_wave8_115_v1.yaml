facts:
- id: m_describe_wave8_115_output
  type: syntax
  statement: "M兼容DESCRIBE显示指定表中列的信息（同时也适用于视图）；输出列信息包括：Field列名、Type列数据类型、Null列值是否可以为NULL（YES/NO）、Key列是否被索引（PRI被主键索引、UNI唯一索引中的第一列、MUL非唯一索引中的第一列、NULL未被索引或不是唯一/非唯一索引第一列）、Default列默认值、Extra列附加信息（auto_increment自增列、on update CURRENT_TIMESTAMP具有ON UPDATE约束、VIRTUAL GENERATED虚拟生成列、STORED GENERATED存储生成列）。"
  source_anchor: "2.4.2.9.3 功能描述 页2187"
  source_refs: &refmdesc
  - w8_115_2_4_2_9_3
  status: confirmed
- id: m_describe_wave8_115_wild
  type: syntax
  statement: "M兼容DESCRIBE默认显示表中所有列的信息；给出表中列的名称时仅显示指定列信息；给出带%或_通配符的字符串时仅显示名称与字符串匹配的列的输出（字符串不含空格或其他特殊字符时无需括在引号内）；语法为{ DESCRIBE | DESC } tbl_name [ col_name | wild ]，wild为可包含%和_通配符的模式字符串。"
  source_anchor: "2.4.2.9.3 注意事项/语法格式/参数说明 页2188"
  source_refs: *refmdesc
  status: confirmed
- id: m_describe_wave8_115_example
  type: behavior_oracle
  statement: "示例（m_db）：建t01表（含AUTO_INCREMENT、CHECK、DEFAULT 5、ON UPDATE current_timestamp、STORED生成列、UNIQUE、外键、前缀键索引INDEX USING btree (c13(10))）后DESCRIBE t01显示14列（c1为PRI且Extra=auto_increment、c6 Extra=STORED GENERATED、c7/c11为UNI、c13为MUL）；DESCRIBE t01 c_模糊匹配9行；DESCRIBE t01 c%匹配14行；相关链接EXPLAIN、SHOW。"
  source_anchor: "2.4.2.9.3 示例 页2188-2189"
  source_refs: *refmdesc
  status: confirmed
- id: m_do_wave8_115_syntax
  type: syntax
  statement: "M兼容DO语法仅内部工具使用，执行匿名代码块（代码块被看作没有参数的一段函数体，返回值类型void，解析和执行同一时刻发生）；目前只支持plpgsql安装语言；如果语言不受信任，用户必须有使用程序语言的USAGE权限或系统管理员权限；语法为DO code（code为可执行的程序语言代码，必须指定为字符串）。"
  source_anchor: "2.4.2.9.4 功能描述/注意事项/语法格式 页2189"
  source_refs: &refmdo
  - w8_115_2_4_2_9_4
  status: confirmed
- id: m_do_wave8_115_example
  type: behavior_oracle
  statement: "示例（m_db）：DO $$DECLARE r record; BEGIN FOR r IN SELECT ... FROM pg_class c,pg_namespace n WHERE ... relkind IN ('r','v') LOOP EXECUTE 'GRANT ALL ON ' || quote_ident(...) || ' TO webuser'; END LOOP; END$$;授予用户webuser对模式tpcds下视图的所有操作权限。"
  source_anchor: "2.4.2.9.4 示例 页2190"
  source_refs: *refmdo
  status: confirmed
- id: m_drop_audit_policy_wave8_115_syntax
  type: syntax
  statement: "M兼容DROP AUDIT POLICY删除审计策略；仅POLADMIN、SYSADMIN或初始用户可以执行；语法为DROP AUDIT POLICY [IF EXISTS] policy_name；IF EXISTS指定的审计策略不存在时产生NOTICE不抛出错误。"
  source_anchor: "2.4.2.9.5 功能描述/注意事项/语法格式/参数说明 页2190"
  source_refs: &refmdap
  - w8_115_2_4_2_9_5
  status: confirmed
- id: m_drop_audit_policy_wave8_115_example
  type: behavior_oracle
  statement: "示例（m_db）：DROP AUDIT POLICY adt1返回DROP AUDIT POLICY；删除不存在的审计策略adt0报ERROR: adt0 policy does not exist, drop failed；相关链接ALTER AUDIT POLICY、CREATE AUDIT POLICY。"
  source_anchor: "2.4.2.9.5 示例 页2190-2191"
  source_refs: *refmdap
  status: confirmed
- id: m_drop_database_wave8_115_syntax
  type: syntax
  statement: "M-Compatibility中DATABASE与SCHEMA是同义词，DROP DATABASE该语法表示删除数据库（模式）；只有数据库所有者或被授予了数据库DROP权限的用户可以执行（系统管理员默认拥有此权限）；除初始用户和运维管理员外其他用户无法DROP掉运维管理员的DATABASE；语法为DROP DATABASE [ IF EXISTS ] database_name（IF EXISTS不存在时发出notice而非报错）。"
  source_anchor: "2.4.2.9.6 功能描述/注意事项/语法格式/参数说明 页2191"
  source_refs: &refmdd
  - w8_115_2_4_2_9_6
  status: confirmed
- id: m_drop_database_wave8_115_caution
  type: constraint
  statement: "DROP DATABASE一旦执行将无法撤销，请谨慎使用；不要随意删除pg_temp或pg_toast_temp开头的模式（这些模式是系统内部使用的，删除可能导致无法预知的结果）。"
  source_anchor: "2.4.2.9.6 须知 页2191"
  source_refs: *refmdd
  status: confirmed
- id: m_drop_extension_wave8_115_syntax
  type: syntax
  statement: "M兼容DROP EXTENSION当前不支持用户使用此语法（删除一个扩展，该特性为内部使用只允许删除数据库内部的高级包或扩展）；删除扩展的过程中构成扩展的组件也会一起删除；必须是扩展的拥有者才能使用DROP EXTENSION命令；语法为DROP EXTENSION [ IF EXISTS ] name [, ...] [ CASCADE | RESTRICT ]。"
  source_anchor: "2.4.2.9.7 功能描述/注意事项/语法格式 页2191-2192"
  source_refs: &refmdext
  - w8_115_2_4_2_9_7
  status: confirmed
- id: m_drop_extension_wave8_115_cascade
  type: constraint
  statement: "M兼容DROP EXTENSION参数：IF EXISTS扩展不存在时不抛出错误而产生通知；CASCADE自动删除依赖于该扩展的对象；RESTRICT如果有依赖对象则不允许删除（除非其所有成员对象和其它扩展对象在一条DROP命令一起删除，此为缺省行为）；示例DROP EXTENSION IF EXISTS plpgsql（plpgsql为数据库默认创建extension，如有使用plpgsql对象的表字段则命令失败，增加CASCADE强制删除扩展和依赖对象）。"
  source_anchor: "2.4.2.9.7 参数说明/示例 页2192"
  source_refs: *refmdext
  status: confirmed
- id: m_drop_function_wave8_115_syntax
  type: syntax
  statement: "M兼容DROP FUNCTION删除一个已存在的函数（内部使用功能不支持用户使用）；语法为DROP FUNCTION [ IF EXISTS ] function_name [ ( [ {[ argname ] [ argmode ] argtype} [, ...] ] ) [ CASCADE | RESTRICT ] ]；IF EXISTS函数不存在时不报错只产生NOTICE；CASCADE级联删除依赖于函数的对象，RESTRICT有任何依赖对象存在则拒绝删除（缺省行为）。"
  source_anchor: "2.4.2.9.8 功能描述/语法格式/参数说明 页2192-2193"
  source_refs: &refmdf
  - w8_115_2_4_2_9_8
  status: confirmed
- id: m_drop_function_wave8_115_notes_example
  type: behavior_oracle
  statement: "限制与示例：函数中涉及对临时表的相关操作则无法使用DROP FUNCTION删除；只有函数所有者或被授予函数DROP权限的用户才能执行（系统管理员默认）；删除函数可省略参数列表（DROP FUNCTION func_add_sql）；存在同名函数时删除需加上参数列表否则报错（重载函数分别DROP FUNCTION func_add(int)与DROP FUNCTION func_add(int,int)）。"
  source_anchor: "2.4.2.9.8 注意事项/示例 页2192-2194"
  source_refs: *refmdf
  status: confirmed
- id: m_drop_group_wave8_115_syntax
  type: syntax
  statement: "M兼容DROP GROUP删除用户组，是DROP ROLE的别名；DROP GROUP是M-Compatibility管理工具封装的接口（用来实现M-Compatibility管理，不建议用户直接使用以免对M-Compatibility状态造成影响）；语法为DROP GROUP [ IF EXISTS ] group_name [, ...]（IF EXISTS不存在该角色时发通知；支持一次删除多个用户组）；示例参见示例；相关链接ALTER GROUP、CREATE GROUP、DROP ROLE。"
  source_anchor: "2.4.2.9.9 功能描述/注意事项/语法格式/参数说明 页2194"
  source_refs: &refmdg
  - w8_115_2_4_2_9_9
  status: confirmed
- id: m_drop_index_wave8_115_syntax
  type: syntax
  statement: "M兼容DROP INDEX删除索引；两种语法：DROP INDEX [ CONCURRENTLY ] [ IF EXISTS ] index_name [, ...] [ CASCADE | RESTRICT ]与DROP INDEX index_name [, ...] [CASCADE | RESTRICT] ON table_name [algorithm_option | lock_option]；权限：索引的所有者、索引所在模式的所有者、拥有索引所在表的INDEX权限的用户或被授予DROP ANY INDEX权限的用户可执行（三权分立关闭时系统管理员默认拥有）；全局临时表某会话已初始化（创建或首次插入数据）时其他会话无法执行该表上索引的删除操作。"
  source_anchor: "2.4.2.9.10 功能描述/注意事项/语法格式 页2195"
  source_refs: &refmdi
  - w8_115_2_4_2_9_10
  status: confirmed
- id: m_drop_index_wave8_115_concurrently
  type: constraint
  statement: "CONCURRENTLY以不阻塞DML的方式在线删除索引（加四级锁）；限制：只能指定一个索引名称且不支持CASCADE选项；普通DROP INDEX可在事务内执行但DROP INDEX CONCURRENTLY不可在事务内执行；临时表支持CONCURRENTLY但实际采用阻塞式删除（无其他会话并发访问且阻塞式成本更低）；在线删除索引需等待索引对应表上相关其他事务结束，可能出现锁超时导致失败，也可能与其他DDL出现死锁（在线删除持四级锁等待并发DDL，并发DDL持事务锁等待释放四级锁）；锁超时、死锁、宕机或用户取消可能残留非法状态索引，需尽快用DROP INDEX CONCURRENTLY或DROP INDEX清理（持续失败可用DROP INDEX）；在线删除索引时间与并发业务量及运行时间有关（无并发业务秒级，有并发业务需额外等待正在运行的并发业务结束）。"
  source_anchor: "2.4.2.9.10 参数说明 CONCURRENTLY 页2195"
  source_refs: *refmdi
  status: confirmed
- id: m_drop_index_wave8_115_params_example
  type: constraint
  statement: "参数与示例：IF EXISTS索引不存在时发notice而非抛出ERROR；CASCADE允许级联删除依赖该索引的对象，RESTRICT有依赖对象则无法删除（缺省值）；algorithm_option与lock_option参见CREATE INDEX；示例（m_db）：DROP INDEX IF EXISTS idx_test1 CASCADE；CREATE INDEX CONCURRENTLY idx_test2 ON test1_index(name)后DROP INDEX CONCURRENTLY idx_test2在线删除。"
  source_anchor: "2.4.2.9.10 参数说明/示例 页2196"
  source_refs: *refmdi
  status: confirmed
- id: m_describe_wave8_115_t01_structure
  type: constraint
  statement: "M兼容DESCRIBE示例表t01结构同时覆盖多种列特性：c1 int AUTO_INCREMENT（主键）、c2 int NOT NULL CHECK (c2 > 0)、c3 text CHARACTER SET utf8mb4 COLLATE utf8mb4_bin NULL、c4 int DEFAULT 5、c5 datetime ON UPDATE current_timestamp、c6 int GENERATED ALWAYS AS (c2 + c4) STORED、c7 int UNIQUE、c13 text前缀键索引INDEX USING btree (c13(10))与组合索引INDEX (c13(10),c14)，以及CONSTRAINT FOREIGN KEY (c8) REFERENCES t01(c1)、CONSTRAINT CHECK (c10 > 0)、CONSTRAINT UNIQUE (c11)。"
  source_anchor: "2.4.2.9.3 示例 页2188"
  source_refs: *refmdesc
  status: confirmed
- id: m_drop_owned_wave8_115_syntax
  type: syntax
  statement: "M兼容DROP OWNED删除一个数据库角色所拥有的数据库对象的权限：该角色在当前数据库里和共享对象（数据库、表空间）上所有对象上的权限都将被撤销；DROP OWNED常用来为移除一个或多个角色做准备（只影响当前数据库中的对象，通常需要在包含被移除角色对象的每一个数据库中都执行）；使用CASCADE可能递归删除其他用户拥有的对象；角色所拥有的数据库、表空间不会被移除；语法为DROP OWNED BY name [, ...] [ CASCADE | RESTRICT ]（CASCADE级联删除依赖对象，RESTRICT拒绝删除有依赖对象的对象为缺省值）。"
  source_anchor: "2.4.2.9.11 功能描述/注意事项/语法格式/参数说明 页2196-2197"
  source_refs: &refmdo2
  - w8_115_2_4_2_9_11
  status: confirmed
- id: m_drop_owned_wave8_115_example
  type: behavior_oracle
  statement: "示例（m_db）：CREATE USER jim后DROP OWNED BY jim撤销jim在当前数据库和共享对象上的所有权限，再DROP USER jim删除用户；相关链接DROP ROLE。"
  source_anchor: "2.4.2.9.11 示例 页2197"
  source_refs: *refmdo2
  status: confirmed
