facts:
- id: tools_wave8_13_overview
  type: syntax
  statement: "数据库性能监控工具包括gs_checkos、gs_cgroup、gs_check和gstrace。"
  source_anchor: "5.5.1 页3785"
  source_refs: &refb1
  - w8_13_5_5
  status: confirmed
- id: tools_wave8_13_checkos_intro
  type: syntax
  statement: "gs_checkos用于检查操作系统、控制参数、磁盘配置等内容，并对系统控制参数、I/O配置、网络配置和THP服务进行配置。"
  source_anchor: "5.5.1 页3785"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_checkos_scope
  type: constraint
  statement: "gs_checkos是系统内部工具，不支持单独调用；数据库前置完成后会自动删除。"
  source_anchor: "5.5.2 页3785-3786"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_checkos_prereq
  type: constraint
  statement: "gs_checkos要求硬件和网络正常、各主机root互信正常，且只能使用root用户执行。"
  source_anchor: "5.5.2 页3786"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_checkos_command
  type: syntax
  statement: "gs_checkos检查命令为gs_checkos -i ITEM [-f HOSTFILE] [-h HOSTNAME] [-X XMLFILE] [--detail] [-o OUTPUT] [-l LOGFILE]。"
  source_anchor: "5.5.2 页3786"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_checkos_items
  type: syntax
  statement: "gs_checkos检查项A1...A14只检查操作系统参数不进行设置；B1...B6将系统参数设置为期望值；A和B不能同时输入。"
  source_anchor: "5.5.2 页3786"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_checkos_hostfile
  type: constraint
  statement: "gs_checkos的-f和-h参数不能同时使用。"
  source_anchor: "5.5.2 页3786"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_checkos_output
  type: syntax
  statement: "gs_checkos的-o指定OS检查报告输出文件；不指定则输出到屏幕；-l指定日志文件，默认路径为/tmp/gs_checkos/gs_checkos-YYYY-MM-DD_hhmmss.log。"
  source_anchor: "5.5.2 页3787"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_cgroup_intro
  type: syntax
  statement: "gs_cgroup负责创建默认控制组、创建/删除/更新用户自定义控制组、显示控制组配置文件内容、显示控制组树形结构和删除用户所有控制组。"
  source_anchor: "5.5.1 页3785"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_check_intro
  type: syntax
  statement: "gs_check统一数据库运行环境、操作系统环境、网络环境和数据库执行环境的检查工具。"
  source_anchor: "5.5.1 页3785"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_gstrace_intro
  type: syntax
  statement: "gstrace用于侦听内核代码执行路径、记录内核数据结构并分析代码性能。"
  source_anchor: "5.5.1 页3785"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_gstrace_modes
  type: syntax
  statement: "gstrace支持start、stop、config、dump、detail、codepath和analyze等子命令。"
  source_anchor: "5.5.5 页3823-3824"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_gstrace_dump
  type: syntax
  statement: "gstrace dump -p <port> -o <output file>将共享内存中的trace信息写入指定文件。"
  source_anchor: "5.5.5 页3824"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_gstrace_analyze
  type: syntax
  statement: "gstrace analyze统计各函数的执行次数、总耗时、平均耗时、最长耗时和最短耗时。"
  source_anchor: "5.5.5 页3824"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_gstrace_module
  type: syntax
  statement: "gstrace -m指定追踪模块和函数，格式为[comp…][ALL].[func…][ALL]，ALL表示全部模块或函数。"
  source_anchor: "5.5.5 页3824"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_gstrace_buffer
  type: constraint
  statement: "gstrace共享内存默认1073741824字节；指定小于2048时自动调整为2048，非2^N时向下对齐到2^N。"
  source_anchor: "5.5.5 页3824"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_checkos_os_items
  type: syntax
  statement: "gs_checkos A1检查操作系统版本，要求主机平台为SUSE12、kylin、Euler、uniontech、hce或openeuler之一。"
  source_anchor: "5.5.2 页3787"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_checkos_timezone
  type: syntax
  statement: "gs_checkos A4检查数据库实例各主机时区状态一致。"
  source_anchor: "5.5.2 页3787"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_checkos_swap
  type: constraint
  statement: "gs_checkos A5检查Swap分区大小必须小于等于各主机内存总大小。"
  source_anchor: "5.5.2 页3787"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_13_gstrace_stop
  type: behavior_oracle
  statement: "gstrace stop会删除共享内存并清除trace配置；trace buffer中已捕获的信息会丢失。"
  source_anchor: "5.5.5 页3824"
  source_refs: *refb1
  status: confirmed
open_questions:
