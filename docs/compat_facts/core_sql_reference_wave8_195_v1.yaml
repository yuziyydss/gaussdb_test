facts:
- id: mcompat_wave8_195_set_names_collate
  type: constraint
  statement: "SET NAMES指定COLLATE差异：GaussDB SQL_ASCII库下不支持指定charset_name与数据库字符集不同；不指定字符集时MySQL报错而GaussDB不报错。"
  source_anchor: "4.4.2.7.6 表4-165 页3485"
  source_refs: &refw8195
  - w8_195_4_4_2
  status: confirmed
- id: mcompat_wave8_195_describe
  type: constraint
  statement: "DESCRIBE语句差异：GaussDB需Schema USAGE权限+表级/列级权限仅显示SELECT/INSERT/UPDATE/REFERENCES/COMMENT权限列，MySQL仅需表级/列级权限；模糊匹配Field字段用utf8mb4_general_ci。"
  source_anchor: "4.4.2.7.6 表4-165 页3486"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_start_transaction_snapshot
  type: constraint
  statement: "START TRANSACTION WITH CONSISTENT SNAPSHOT差异：MySQL可重复读下只在第一个SELECT后开始快照读；GaussDB事务一旦开启第一个SELECT/DDL/DML/DCL均建立一致性读快照；GaussDB支持设置多次隔离级别/访问模式/开启一致性快照覆盖生效。"
  source_anchor: "4.4.2.7.6 表4-165 页3486-3487"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_set_user_variable
  type: constraint
  statement: "SET设置用户变量差异：GaussDB用户变量名不支持转义字符/单引号/双引号/反引号中含引号变量名（解析报错或匹配不到）；连续赋值@var1=@var2=@var3=@var4=expr MySQL支持而GaussDB不支持；expr在GaussDB中可为聚集函数而MySQL不支持。"
  source_anchor: "4.4.2.7.6 表4-165 页3487-3488"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_set_system_parameter
  type: constraint
  statement: "SET系统参数差异：BOOLEAN参数直接设置'1'/'0'/'true'/'false'GaussDB成功而MySQL失败；子查询结果'true'/'false'/非整数1/0时GaussDB成功MySQL失败但NULL时GaussDB失败MySQL成功；sql_mode数字形式设置MySQL校验整数类型而GaussDB不做限制。"
  source_anchor: "4.4.2.7.6 表4-165 页3488-3489"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_use_schema
  type: constraint
  statement: "USE切换当前模式差异：用户无对应模式权限时MySQL报错而GaussDB将当前模式指定为空。"
  source_anchor: "4.4.2.7.6 表4-165 页3489"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_lock_mechanism
  type: constraint
  statement: "锁机制差异：GaussDB锁只能在事务块中使用而MySQL无限制；MySQL read锁后当前会话无法写而GaussDB可以写；MySQL表上锁后读取其他表报错而GaussDB无限制；MySQL同一会话获取同表锁自动释放上一锁并提交事务而GaussDB无该机制；GaussDB LOCK TABLE只能在事务块内部且无UNLOCK TABLE锁在事务结束释放。"
  source_anchor: "4.4.2.7.7 表4-166 页3489"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_pbe
  type: constraint
  statement: "PBE差异：重复创建同名PREPARE GaussDB报已存在需先删除而MySQL覆盖；SQL执行报错阶段（解析层/执行层）不同导致PBE下异常报错位置在PREPARE或EXECUTE阶段GaussDB和MySQL存在可能差异。"
  source_anchor: "4.4.2.7.7 表4-166 页3490"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_odbc_escape
  type: constraint
  statement: "ODBC转义表达式{identifier expr}差异：identifier判定差异；GaussDB当前仅支持普通标识符与非保留关键字，不支持的identifier会出现语法报错。"
  source_anchor: "4.4.2.7.7 表4-166 页3490"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_grant_privilege_types
  type: constraint
  statement: "赋权类型差异：MySQL支持ALL/ALTER/ALTER ROUTINE/CREATE/CREATE ROUTINE/CREATE TABLESPACE/CREATE TEMPORARY TABLES/CREATE USER/CREATE VIEW/DELETE/DROP/EVENT/EXECUTE/FILE/GRANT OPTION/INDEX/INSERT/RELOAD/REPLICATION CLIENT/REPLICATION SLAVE/SELECT/SHOW DATABASES/SHOW VIEW/SHUTDOWN/SUPER/TRIGGER/UPDATE/USAGE；GaussDB按级别支持数据库（CREATE/CONNECT/TEMPORARY/TEMP/ALTER/DROP/COMMENT）、模式（CREATE/USAGE/ALTER/DROP/COMMENT）、表视图（SELECT/INSERT/UPDATE/DELETE/TRUNCATE/REFERENCES/TRIGGER/ALTER/DROP/COMMENT/INDEX/VACUUM）、列（SELECT/INSERT/UPDATE/REFERENCES/COMMENT）、序列（SELECT/USAGE/UPDATE/ALTER/DROP/COMMENT）。"
  source_anchor: "4.4.2.7.8 表4-167/4-168 页3491-3494"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_grant_syntax_diff
  type: constraint
  statement: "GRANT语法差异：MySQL '*.*'全局层级对应GaussDB '{DATABASE} db_name'数据库层级；MySQL 'schema_name.*'对应GaussDB '{SCHEMA} schema_name'模式层级；MySQL用户名两部分user@host而GaussDB仅用户名；MySQL支持auth_option/tls_option/resource_option在GRANT中而GaussDB不支持需CREATE USER/ALTER USER设置；MySQL支持GRANT PROXY用户代理赋权而GaussDB通过角色替代。"
  source_anchor: "4.4.2.7.8 差异说明 页3494"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_grant_public_owner
  type: constraint
  statement: "public/owner差异：GaussDB拥有public概念所有用户都拥有public权限可grant/revoke而MySQL新创建用户仅全局usage权限；GaussDB对象所有者缺省具有所有权限且ALTER/DROP/COMMENT/INDEX/VACUUM/可再授权为固有权限无法回收而MySQL无owner概念；MySQL中USAGE表示无权限revoke/grant usage实际不修改而GaussDB模式USAGE允许访问对象、序列USAGE允许nextval。"
  source_anchor: "4.4.2.7.8 差异说明 页3494"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_admin_roles_any_privilege
  type: constraint
  statement: "管理员角色/ANY权限差异：GaussDB支持SYSADMIN/CREATEROLE/AUDITADMIN/MONADMIN/OPRADMIN/POLADMIN管理员角色和三权分立而MySQL不支持；GaussDB支持ANY权限（CREATE ANY TABLE/SELECT ANY TABLE等）而MySQL不支持ANY权限。"
  source_anchor: "4.4.2.7.8 差异说明 页3494"
  source_refs: *refw8195
  status: confirmed
- id: mcompat_wave8_195_show_grants_delete_recreate
  type: constraint
  statement: "权限查询/删除重建差异：MySQL通过SHOW GRANTS查询而GaussDB通过gsql元命令'\\l+'/'\\dn+'/'\\dp'或查询系统表；MySQL删除对象后授权信息保留重建同名对象有权限而GaussDB删除后授权信息被删除需重新授权；MySQL支持'_'和'%'模糊匹配数据库名而GaussDB不支持；MySQL GRANT指定用户不存在时默认创建（MySQL 8.0移除）而GaussDB不支持给未创建用户赋权。"
  source_anchor: "4.4.2.7.8 差异说明 页3494-3495"
  source_refs: *refw8195
  status: confirmed
open_questions:
- id: pkg2_wave8_195_oq_runtime
  content: "PBE报错阶段/SET系统参数BOOLEAN/GRANT权限映射等差异的完整影响范围需授权环境实机验证。"
  status: open
