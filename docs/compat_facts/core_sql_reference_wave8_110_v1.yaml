facts:
- id: m_create_resource_label_wave8_110_syntax
  type: syntax
  statement: "M兼容CREATE RESOURCE LABEL创建资源标签；语法为CREATE RESOURCE LABEL [IF NOT EXISTS] label_name ADD label_item_list [, ...]，label_item_list为resource_type (resource_path [, ...])，resource_type为{ TABLE | COLUMN | SCHEMA | VIEW | FUNCTION }；仅POLADMIN、SYSADMIN或初始用户能执行；IF NOT EXISTS时资源标签存在则产生NOTICE不抛出错误；label_name唯一、符合标识符说明、最大63字符（超过截断保留前63），大写自动转小写（需大写用反引号括起来——M兼容用反引号而非A模式的双引号）。"
  source_anchor: "2.4.2.8.12 功能描述/注意事项/语法格式/参数说明 页2108-2109"
  source_refs: &refmcrl
  - w8_110_2_4_2_8_12
  status: confirmed
- id: m_create_resource_label_wave8_110_example
  type: behavior_oracle
  statement: "示例（m_db）：重复创建已存在标签时IF NOT EXISTS输出NOTICE: table_label label already defined, skipping并成功，不加则ERROR: table_label label already defined；基于表/列/模式/视图创建资源标签（ADD TABLE(public.tb_for_label)、ADD COLUMN(...col1)、ADD SCHEMA(schema_for_label)、ADD VIEW(view_for_label)）；清理使用DROP RESOURCE LABEL IF EXISTS。"
  source_anchor: "2.4.2.8.12 示例 页2109-2110"
  source_refs: *refmcrl
  status: confirmed
- id: m_create_role_wave8_110_syntax
  type: syntax
  statement: "M兼容CREATE ROLE创建角色（角色是拥有数据库对象和权限的实体，不同环境可认为是一个用户、一个组或兼顾两者）；新角色无登录权限；创建角色的用户必须具备CREATE ROLE权限或系统管理员；语法为CREATE ROLE role_name [ [ WITH ] option [ ... ] ] { PASSWORD | IDENTIFIED BY } { 'password' [EXPIRED] | DISABLE }；role_name最多63字符（超过截断），需为字母、下划线、数字或$且以字母或下划线开头，支持反引号括起来（sql_mode=ANSI_QUOTES时也可双引号），不用引号括起来的角色名转换为小写。"
  source_anchor: "2.4.2.8.13 功能描述/注意事项/语法格式/参数说明 页2110-2111"
  source_refs: &refmcrole
  - w8_110_2_4_2_8_13
  status: confirmed
- id: m_create_role_wave8_110_password
  type: constraint
  statement: "M兼容密码规则：默认不少于8个字符；不能与用户名及用户名倒序相同；至少包含大写字母（A-Z）、小写字母（a-z）、数字（0-9）、非字母数字字符（限定为~!@#$%^&*()-_=+\\|[{}];:,<.>/?）四类字符中的三类；密码也可以是符合格式要求的密文字符串（主要用于用户数据导入场景不推荐直接使用，数据库不会校验密文密码复杂度，安全性由用户保证）；创建角色时应使用单引号或双引号包裹密码。"
  source_anchor: "2.4.2.8.13 参数说明 password 页2111"
  source_refs: *refmcrole
  status: confirmed
- id: m_create_role_wave8_110_expired_disable
  type: constraint
  statement: "EXPIRED：创建用户时可指定EXPIRED参数创建密码失效用户，该用户不允许执行简单查询和扩展查询，只有在修改自身密码后才可正常执行语句；DISABLE：默认用户可以更改自己的密码，指定DISABLE禁用密码后从系统中删除该密码，此类用户只能通过外部认证（如kerberos）连接数据库；只有管理员才能启用或禁用密码，普通用户不能禁用初始用户的密码，启用密码运行ALTER USER并指定密码。"
  source_anchor: "2.4.2.8.13 参数说明 EXPIRED/DISABLE 页2112"
  source_refs: *refmcrole
  status: confirmed
- id: m_create_role_wave8_110_admin_roles
  type: constraint
  statement: "管理员属性：SYSADMIN缺省NOSYSADMIN（三权分立关闭时sysadmin可创建SYSADMIN、CREATEROLE、AUDITADMIN、MONADMIN、POLADMIN、CREATEDB属性用户和普通用户；三权分立打开时sysadmin无权创建用户）；MONADMIN/OPRADMIN/POLADMIN/AUDITADMIN/CREATEDB/CREATEROLE/LOGIN/REPLICATION均缺省NO（新角色无登录权限）；USEFT为保留参数暂未启用；CREATEROLE可创建新角色并修改删除其他角色（三权分立关闭时可创建CREATEROLE/AUDITADMIN/MONADMIN/POLADMIN/CREATEDB和普通用户，打开时无AUDITADMIN）；INHERIT不推荐使用；PERSISTENCE永久用户仅允许初始用户创建、修改和删除。"
  source_anchor: "2.4.2.8.13 参数说明 页2112-2113"
  source_refs: *refmcrole
  status: confirmed
- id: m_create_role_wave8_110_conn_misc
  type: constraint
  statement: "CONNECTION LIMIT connlimit声明并发连接数量（系统管理员不受限；connlimit按数据库主节点单独统计，M-Compatibility整体连接数=connlimit*当前正常数据库主节点个数；取值[-1, 2^31-1]缺省-1无限制）；VALID BEGIN/UNTIL设置生效/失效时间戳（格式'YYYY-MM-DD HH:mm:ss'，省略则无限制）；USER GROUP创建user子用户当前版本暂不支持；IN ROLE新角色立即拥有列出角色的权限（不推荐）；IN GROUP是IN ROLE过时拼法；ROLE子句列出的角色自动添加为新角色成员并拥有新角色所有权限；ADMIN类似ROLE但ADMIN后的角色可把新角色权限赋给其他角色；USER是ROLE过时拼法；DEFAULT TABLESPACE与PROFILE子句被忽略无实际意义；PGUSER无实际意义仅为前向兼容保留。"
  source_anchor: "2.4.2.8.13 参数说明 页2113-2114"
  source_refs: *refmcrole
  status: confirmed
- id: m_create_role_wave8_110_membership
  type: constraint
  statement: "M兼容成员关系子句：IN ROLE role_name表示新角色立即拥有IN ROLE子句中列出的一个或多个现有角色拥有的权限（不推荐使用）；IN GROUP是IN ROLE过时的拼法；ROLE子句列出一个或多个现有角色，它们将自动添加为这个新角色的成员并拥有新角色所有的权限；ADMIN子句类似ROLE子句，不同的是ADMIN后的角色可以把新角色的权限赋给其他角色；USER子句是ROLE子句过时的拼法。"
  source_anchor: "2.4.2.8.13 参数说明 页2113-2114"
  source_refs: *refmcrole
  status: confirmed
- id: m_create_role_wave8_110_example
  type: behavior_oracle
  statement: "示例（m_db）：CREATE ROLE manager IDENTIFIED BY '********'；CREATE ROLE miriam WITH LOGIN PASSWORD '********' VALID BEGIN '2015-01-01' VALID UNTIL '2026-01-01'；ALTER ROLE manager IDENTIFIED BY '********' REPLACE '**********'改密码；ALTER ROLE manager SYSADMIN改为系统管理员；DROP ROLE manager与DROP GROUP miriam删除；相关链接SET ROLE、ALTER ROLE、DROP ROLE、GRANT。"
  source_anchor: "2.4.2.8.13 示例 页2114"
  source_refs: *refmcrole
  status: confirmed
- id: m_create_schema_wave8_110_syntax
  type: syntax
  statement: "M-Compatibility中DATABASE与SCHEMA是同义词，CREATE SCHEMA该语法表示创建模式；只要用户对当前数据库有CREATE权限就可以创建模式；语法为CREATE {DATABASE | SCHEMA} [IF NOT EXISTS] schema_name [[create_option] [,...]]，create_option为[DEFAULT] { CHARACTER SET | CHAR SET | CHARSET [=] default_charset | COLLATE [=] default_collation }；系统管理员在普通用户同名Schema下创建的对象，所有者为Schema的同名用户（非系统管理员）。"
  source_anchor: "2.4.2.8.14 功能描述/注意事项/语法格式 页2114-2115"
  source_refs: &refmschema
  - w8_110_2_4_2_8_14
  status: confirmed
- id: m_create_schema_wave8_110_naming
  type: constraint
  statement: "M兼容模式命名限制：模式名不能和当前数据库里其他的模式重名；不能和当前数据库的初始用户重名；不可以\"pg_\"开头；不可以\"gs_role_\"开头；当前搜索路径上的模式中存在同名对象时需明确指定引用对象所在的模式（SHOW SEARCH_PATH查看）；COLLATE影响字符串排序顺序（如ORDER BY及文本列索引顺序）、CHARSET影响字符分类（大小写数字），默认使用模板数据库；取值范围参见库级字符集和字符序。"
  source_anchor: "2.4.2.8.14 参数说明 页2115"
  source_refs: *refmschema
  status: confirmed
- id: m_create_schema_wave8_110_example
  type: behavior_oracle
  statement: "示例（m_db）：CREATE SCHEMA test1后USE test1、CREATE TABLE a(id int)、DROP TABLE a、USE public、DROP SCHEMA test1；相关链接ALTER SCHEMA、DROP SCHEMA。"
  source_anchor: "2.4.2.8.14 示例 页2115"
  source_refs: *refmschema
  status: confirmed
- id: m_create_sequence_wave8_110_overview
  type: constraint
  statement: "M兼容CREATE SEQUENCE向当前数据库增加一个新的序列（序列的Owner为创建此序列的用户）；Sequence是存放等差数列的特殊表（无实际意义，通常用于为行或者表生成唯一的标识符）；给出模式名则在给定模式创建否则在当前模式创建；序列名必须和同一个模式中的其他序列、表、索引、视图或外表的名称不同；被授予CREATE ANY SEQUENCE权限的用户可在public模式和用户模式下创建序列。"
  source_anchor: "2.4.2.8.15 功能描述/注意事项 页2115-2116"
  source_refs: &refmseq
  - w8_110_2_4_2_8_15
  status: confirmed
- id: m_create_sequence_wave8_110_nextval_note
  type: constraint
  statement: "创建序列后在表中使用序列的nextval()函数和generate_series(1,N)函数对表插入数据时，请保证nextval的可调用次数大于等于N+1次，否则会因为generate_series()函数会调用N+1次而导致报错；Sequence默认最大值为2^63-1。"
  source_anchor: "2.4.2.8.15 注意事项 页2116"
  source_refs: *refmseq
  status: confirmed
- id: m_create_sequence_wave8_110_syntax
  type: syntax
  statement: "M兼容CREATE SEQUENCE语法：CREATE SEQUENCE name [ INCREMENT [ BY ] increment ] [ MINVALUE minvalue | NO MINVALUE | NOMINVALUE ] [ MAXVALUE maxvalue | NO MAXVALUE | NOMAXVALUE] [ START [ WITH ] start ] [ CACHE cache ] [ [ NO ] CYCLE | NOCYCLE ] [ RESTART [ WITH ] value | RESTART ] [ OWNED BY { table_name.column_name | NONE } ]。"
  source_anchor: "2.4.2.8.15 语法格式 页2116"
  source_refs: *refmseq
  status: confirmed
- id: m_create_sequence_wave8_110_name
  type: constraint
  statement: "M兼容序列name取值范围：仅可以使用小写字母（a~z）、大写字母（A~Z）、数字和特殊字符\"#\"、\"_\"、\"$\"的组合。"
  source_anchor: "2.4.2.8.15 参数说明 name 页2116"
  source_refs: *refmseq
  status: confirmed
- id: m_create_sequence_wave8_110_increment_minmax
  type: constraint
  statement: "increment可选指定步长（正数递增、负数递减，缺省1）；MINVALUE未声明或NO MINVALUE时递增序列缺省为1、递减序列缺省为-2^63-1（NOMINVALUE等价NO MINVALUE）；MAXVALUE未声明或NO MAXVALUE时递增序列缺省为2^63-1、递减序列缺省为-1（NOMAXVALUE等价NO MAXVALUE）；start指定起始值（缺省：递增序列为minvalue，递减序列为maxvalue）。"
  source_anchor: "2.4.2.8.15 参数说明 页2116"
  source_refs: *refmseq
  status: confirmed
- id: m_create_sequence_wave8_110_cache_cycle
  type: constraint
  statement: "cache为快速访问在内存中预先存储序列号的个数（缺省1表示一次只能生成一个值即没有缓存）；不建议同时定义cache和maxvalue或minvalue（定义cache后不能保证序列的连续性，可能产生空洞造成序列号段浪费）；[NO] CYCLE|NOCYCLE使序列达到maxvalue或minvalue后可循环继续；NO CYCLE时序列达到最大值后任何nextval调用都返回错误；NOCYCLE等价于NO CYCLE（缺省值为NO CYCLE）；定义序列为CYCLE则不能保证序列的唯一性。"
  source_anchor: "2.4.2.8.15 参数说明 页2116-2117"
  source_refs: *refmseq
  status: confirmed
- id: m_create_sequence_wave8_110_owned
  type: constraint
  statement: "OWNED BY将序列和一个表的指定字段关联（删除指定字段或其所在表时自动删除已关联序列；关联的表和序列所有者必须是同一个用户且在同一个模式中；通过指定OWNED BY仅建立表的对应列和sequence之间关联关系，不会在插入数据时在该列上产生自增序列；缺省OWNED BY NONE表示不存在关联）；通过OWNED BY创建的Sequence不建议用于其他表（希望多个表共享Sequence时，该Sequence不应从属于特定表）。"
  source_anchor: "2.4.2.8.15 参数说明 OWNED BY 页2117"
  source_refs: *refmseq
  status: confirmed
- id: m_create_sequence_wave8_110_example
  type: behavior_oracle
  statement: "示例（m_db）：CREATE SEQUENCE seq1 START 101 INCREMENT 10后SELECT nextval('seq1')返回101。"
  source_anchor: "2.4.2.8.15 示例 页2117"
  source_refs: *refmseq
  status: confirmed
open_questions:
- id: m_create2_wave8_110_oq_runtime
  statement: "M兼容EXPIRED密码失效用户的查询阻断范围、CONNECTION LIMIT与多主节点乘积在连接池场景的实际效果、OWNED BY序列在删除表事务回滚后的关联关系需授权环境实机验证。"
  status: open
