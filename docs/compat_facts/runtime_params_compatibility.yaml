- id: guc_b_enable_set_variables
  type: behavior_oracle
  statement: enable_set_variables不设置时不支持set自定义变量和set[global|session]语法；设置后支持如set @v1=1。
  source_anchor: 7 表7-21
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4511）
- id: guc_b_enable_modify_column
  type: behavior_oracle
  statement: enable_modify_column不设置时ALTER TABLE MODIFY仅修改列类型；设置时修改整列定义。
  source_anchor: 7 表7-21
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4511）
