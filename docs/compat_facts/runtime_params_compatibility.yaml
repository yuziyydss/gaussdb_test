  statement: sql_compatibility控制SQL语法兼容性：A=Oracle、B=MySQL、C=TD、PG=Postgres、M=M-Compatibility。默认A。INTERNAL类型，只能CREATE
    DATABASE时设置，不可修改。
  source_anchor: 7 sql_compatibility
