- id: guc_b_format_options
  type: environment
  statement: b_format_behavior_compat_options控制B模式行为：enable_set_variables、set_session_transaction、enable_modify_column、default_collation、all。b_format_version不为空时自动设为all。
  source_anchor: 7 b_format_behavior_compat_options 表7-21
