facts:
- id: wave2b2_backup_restore_point
  type: syntax
  statement: pg_create_restore_point(name)创建命名事务日志恢复点并返回日志位置；恢复时可用recovery_target_name定位；应避免重复名称，恢复在第一个匹配名称停止。
  source_anchor: 1.6.27.4 页598
  source_refs: &id001
  - w2b2_1_6_27
  status: confirmed
- id: wave2b2_backup_wal_locations
  type: syntax
  statement: pg_current_xlog_location()、pg_current_xlog_insert_location()和gs_current_xlog_insert_end_location()分别获取当前WAL写入、插入和实际插入终点位置，返回text；只读查询不需管理员权限。
  source_anchor: 1.6.27.4 页598
  source_refs: *id001
  status: confirmed
- id: wave2b2_backup_start_stop
  type: constraint
  statement: pg_start_backup(label[,fast])开始在线备份并写入backup_label；pg_stop_backup()结束备份、删除标签并创建备份历史文件；两者必须配合使用，单独pg_start_backup可能造成backup_label残留和WAL回收后启动失败。
  source_anchor: 1.6.27.4 页598-599
  source_refs: *id001
  status: confirmed
- id: wave2b2_backup_xlog_switch_name
  type: syntax
  statement: pg_switch_xlog()切换到新事务日志文件；pg_xlogfile_name(location)返回日志文件名；pg_xlogfile_name_offset(location)返回文件名和字节偏移量。
  source_anchor: 1.6.27.4 页599
  source_refs: *id001
  status: confirmed
- id: wave2b2_backup_wal_location_diff
  type: syntax
  statement: pg_xlog_location_diff(location,location)计算两个事务日志位置的差值。
  source_anchor: 1.6.27.4 页600
  source_refs: *id001
  status: confirmed
