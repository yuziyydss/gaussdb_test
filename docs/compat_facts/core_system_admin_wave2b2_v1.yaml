- id: wave2b2_recovery_pause_resume
  type: behavior_oracle
  statement: pg_is_xlog_replay_paused()查询恢复是否暂停；pg_xlog_replay_pause()暂停恢复；pg_xlog_replay_resume()恢复；多租场景PDB内禁用。
  source_anchor: 1.6.27.4 页608
  source_refs: *id001
  status: confirmed
- id: wave2b2_archiving_standby_status
  type: syntax
  statement: gs_get_active_archiving_standby()查询同一分片内归档备机信息；gs_pitr_get_warning_for_xlog_force_recycle()查询归档槽不推进导致日志回收的告警。
  source_anchor: 1.6.27.4 页608
  source_refs: *id001
  status: confirmed
