  statement: "运行时统计参数：track_activities SUSET布尔型默认on收集每个会话正在执行命令统计数据（存储过程内perform/OPEN CURSOR可见/off影响存储引擎空间回收导致膨胀）；track_counts SUSET布尔型默认on收集数据库活动统计（AutoVacuum选择清理数据库需要/off影响空间回收）；track_procedure_sql USERSET布尔型默认on pg_stat_activity中query列同时打印存储过程内SQL；track_io_timing SUSET布尔型默认off收集I/O时序统计（可能引起重大开销）；track_functions SUSET枚举pl/all/none默认none函数调用次数耗时统计（内联函数无法追踪）；track_activity_query_size POSTMASTER整型100~102400默认1024活动会话命令字节数（过高共享内存增大）；update_process_title INTERNAL布尔型默认off（固定参数不可修改）。"
