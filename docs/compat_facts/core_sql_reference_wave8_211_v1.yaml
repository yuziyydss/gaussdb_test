- id: guc_wave8_211_resource_track
  type: syntax
  statement: "资源监控参数：enable_resource_track SIGHUP布尔型默认on资源监控功能；enable_resource_record SIGHUP布尔型默认off资源监控记录归档；enable_logical_io_statistics SIGHUP布尔型默认on逻辑I/O统计（PG_TOTAL_USER_RESOURCE_INFO视图中read/write_kbytes等）；enable_user_metric_persistent SIGHUP布尔型默认on用户历史资源监控转存GS_WLM_USER_RESOURCE_HISTORY；user_metric_retention_time SIGHUP整型0~3650天默认7用户数据保存天数（0永久）；enable_instance_metric_persistent SIGHUP布尔型默认on实例资源监控转存GS_WLM_INSTANCE_HISTORY；instance_metric_retention_time SIGHUP整型0~3650天默认7实例数据保存天数；resource_track_level USERSET枚举none/query/operator默认query资源监控等级（PDB级别）；resource_track_cost USERSET整型-1~2147483647默认100000资源监控最小执行代价（-1不监控/0-9监控代价>=10/>=10监控代价超值）；resource_track_duration USERSET整型0~2147483647秒默认60实时视图转存历史视图最小执行时间。"
