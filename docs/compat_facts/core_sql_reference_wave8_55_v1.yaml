facts:
- id: tsdict_wave8_55_create_purpose
  type: syntax
  statement: "CREATE TEXT SEARCH DICTIONARY创建新的全文检索词典；词典指定全文检索时识别特定词并处理的方法。该功能为内部使用功能，不建议用户使用。"
  source_anchor: "1.13.9.55 页1608-1609"
  source_refs: &refcreate
  - w8_55_1_13_9_55
  status: confirmed
- id: tsdict_wave8_55_create_permissions
  type: constraint
  statement: "具有SYSADMIN权限的用户可创建词典，创建者自动成为词典所有者。"
  source_anchor: "1.13.9.55 注意事项 页1609"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_templates
  type: syntax
  statement: "词典创建依赖系统表pg_ts_template中的预定义模板，当前支持Simple、Ispell、Synonym、Thesaurus、Snowball和Tokenweight词典。"
  source_anchor: "1.13.9.55 注意事项/template 页1609"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_pg_temp_limit
  type: constraint
  statement: "临时模式pg_temp下不允许创建词典。"
  source_anchor: "1.13.9.55 注意事项 页1609"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_filepath_refresh
  type: constraint
  statement: "创建或修改词典后，如果再次修改词典的FILEPATH文件，需要使用ALTER语句更新对应词典的FILEPATH文件。"
  source_anchor: "1.13.9.55 注意事项 页1609"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_create_syntax
  type: syntax
  statement: "CREATE TEXT SEARCH DICTIONARY name (TEMPLATE=template [, option=value, ...])；name可使用模式限定，未指定时在当前模式创建，名称最长63字符且需符合标识符命名规范。"
  source_anchor: "1.13.9.55 语法/name 页1609"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_simple
  type: syntax
  statement: "Simple词典/停用词词典将token转换为小写，并按停用词文件检查；停用词命中返回空数组并忽略，否则按小写标准化。可通过ACCEPT控制非停用词是否已识别，STOPWORDS指定停用词文件，FILEPATH指定定义文件目录且FILEPATH必须与STOPWORDS同时指定。"
  source_anchor: "1.13.9.55 Simple词典 页1609-1610"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_synonym
  type: syntax
  statement: "Synonym词典用于将单词替换为同义词；SYNONYM指定定义文件（默认后缀syn，每行token synonym），CASESENSITIVE控制大小写敏感且默认false，FILEPATH指定本地定义文件目录。"
  source_anchor: "1.13.9.55 Synonym词典 页1610"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_thesaurus
  type: syntax
  statement: "Thesaurus分类词典用首选词替换非首选词并可选择保留原始术语；DICTFILE定义词典文件，DICTIONARY必须指定且仅能指定一个子词典，FILEPATH指定定义文件目录，多个匹配sample words时选择最长匹配。"
  source_anchor: "1.13.9.55 Thesaurus词典 页1610-1611"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_ispell
  type: syntax
  statement: "Ispell词典支持多语言词法，将词的不同语言学形式标准化为相同词位；可配置DICTFILE、AFFFILE、STOPWORDS和FILEPATH。"
  source_anchor: "1.13.9.55 Ispell词典 页1610-1611"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_snowball
  type: syntax
  statement: "Snowball词典提供多语言词干分析算法，LANGUAGE选择具体语言的词干解析器；STOPWORDS可选停用词表，FILEPATH指定定义文件目录且FILEPATH必须与STOPWORDS同时指定。"
  source_anchor: "1.13.9.55 Snowball词典 页1611"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_tokenweight
  type: syntax
  statement: "Tokenweight词典用于干预特定词汇权重；TOKENFILE定义词权重或同义词相似度，STOPFILE指定停用词表，FILEPATH指定定义文件目录且FILEPATH必须与STOPFILE或TOKENFILE同时指定。"
  source_anchor: "1.13.9.55 Tokenweight词典 页1611-1612"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_file_rules
  type: constraint
  statement: "词典定义文件名仅支持小写字母、数字和下划线混合；字符串类型参数值必须使用单引号包裹，标识符和数字也可用单引号包裹。"
  source_anchor: "1.13.9.55 文件名/value 页1612"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_fulltext_workflow
  type: behavior_oracle
  statement: "示例流程可先创建文本搜索配置ts_conf（COPY=pg_catalog.english），再创建Synonym和Ispell词典，ALTER TEXT SEARCH CONFIGURATION调整token映射，DROP MAPPING排除部分token，并用ts_debug('ts_conf', ...)测试。"
  source_anchor: "1.13.9.55 示例 页1612-1614"
  source_refs: *refcreate
  status: confirmed
- id: tsdict_wave8_55_alter_purpose
  type: syntax
  statement: "ALTER TEXT SEARCH DICTIONARY修改全文检索词典的参数、名称、所有者和模式；该功能为内部使用功能，不建议用户使用。"
  source_anchor: "1.13.7.41 页1335"
  source_refs: &refalt
  - w8_55_1_13_7_41
  status: confirmed
- id: tsdict_wave8_55_alter_permissions
  type: constraint
  statement: "预定义词典不支持ALTER操作；只有词典所有者可执行ALTER，三权分立关闭时系统管理员默认拥有该权限。"
  source_anchor: "1.13.7.41 注意事项 页1335"
  source_refs: *refalt
  status: confirmed
- id: tsdict_wave8_55_alter_filepath_plan_cache
  type: constraint
  statement: "创建或修改词典后，修改FILEPATH路径下的自定义词典定义文件不会自动影响数据库中的词典；需使用ALTER更新定义文件。修改词典配置后，PBE或自动参数化等计划缓存场景下查询结果可能未同步更新，应清空计划缓存。"
  source_anchor: "1.13.7.41 注意事项 页1335"
  source_refs: *refalt
  status: confirmed
- id: tsdict_wave8_55_alter_syntax
  type: syntax
  statement: "ALTER TEXT SEARCH DICTIONARY支持name (option[=value][,...])修改定义，RENAME TO修改名称，SET SCHEMA修改模式，OWNER TO修改所有者。"
  source_anchor: "1.13.7.41 语法格式 页1335-1336"
  source_refs: *refalt
  status: confirmed
- id: tsdict_wave8_55_alter_option_rules
  type: constraint
  statement: "ALTER不支持修改TEMPLATE参数值；不支持仅修改FILEPATH而不修改对应词典定义文件参数；省略等号和value表示删除该option设置并使用默认值；new_name最长63字符，new_owner和new_schema必须已存在。"
  source_anchor: "1.13.7.41 参数说明 页1336"
  source_refs: *refalt
  status: confirmed
- id: tsdict_wave8_55_drop_syntax
  type: syntax
  statement: "DROP TEXT SEARCH DICTIONARY删除已有全文检索词典，语法为DROP TEXT SEARCH DICTIONARY [IF EXISTS] name [CASCADE|RESTRICT]；该功能为内部使用不建议用户使用，预定义词典模板不支持删除，仅词典所有者可执行，系统管理员默认拥有该权限。IF EXISTS在词典不存在时不删除并返回NOTICE；CASCADE自动删除依赖词典的对象及后续依赖对象，RESTRICT在存在依赖词典的对象时拒绝删除，未指定默认RESTRICT。"
  source_anchor: "1.13.10.44 页1695-1696"
  source_refs: &refdrop
  - w8_55_1_13_10_44
  status: confirmed
