facts:
- id: dberand_wave8_157_overview
  type: syntax
  statement: "DBE_RANDOM接口：SET_SEED(seed IN INTEGER)存储过程用于设置一个随机数的种子；GET_VALUE(min IN NUMBER default 0, max IN NUMBER default 1) RETURN NUMBER生成一个大小介于指定的low及high之间的随机数（生成的随机数大于或等于min、小于max）。"
  source_anchor: "3.12.2.15 DBE_RANDOM 页2813-2814"
  source_refs: &refrr
  - w8_157_3_12
  status: confirmed
- id: dberand_wave8_157_limits
  type: constraint
  statement: "DBE_RANDOM限制：GET_VALUE要求参数类型是NUMERIC、对于左右边界的大小并没有要求；DBE_RANDOM实现的是伪随机，若使用的初值（种子）不变则伪随机数的数序也不变，使用时需注意、建议不要在安全场景下使用DBE_RANDOM；生成的随机数有效数字为15位。"
  source_anchor: "3.12.2.15 DBE_RANDOM说明 页2814"
  source_refs: *refrr
  status: confirmed
- id: dberand_wave8_157_example
  type: behavior_oracle
  statement: "DBE_RANDOM示例基线：SELECT DBE_RANDOM.GET_VALUE(0,1)输出.917468812743886；0到99之间的整数使用SELECT TRUNC(DBE_RANDOM.GET_VALUE(0,100))输出26（最大值不能被作为可能的值）。"
  source_anchor: "3.12.2.15 示例 页2814-2815"
  source_refs: *refrr
  status: confirmed
- id: dberaw_wave8_157_overview_permissions
  type: constraint
  statement: "DBE_RAW概述与权限：DBE_RAW包提供了用于操作RAW类型的接口；RAW类型的外部表现形式是十六进制、内部存储形式是二进制（如RAW数据11001011的表现形式为'CB'，实际类型转换中输入'CB'）；DBE_RAW模式属于系统目录，除系统管理员用户在初始化数据库时拥有创建权限外，模式及模式下的所有接口所有用户仅具有使用权限。"
  source_anchor: "3.12.2.16 DBE_RAW概述/权限介绍 页2815"
  source_refs: &refrw
  - w8_157_3_12
  status: confirmed
- id: dberaw_wave8_157_catalog
  type: syntax
  statement: "DBE_RAW接口总账：CAST_FROM_BINARY_INTEGER_TO_RAW/CAST_FROM_RAW_TO_BINARY_INTEGER/GET_LENGTH/CAST_FROM_VARCHAR2_TO_RAW/CAST_TO_VARCHAR2/BIT_OR/SUBSTR/BIT_AND/BIT_COMPLEMENT/BIT_XOR/CAST_FROM_BINARY_DOUBLE_TO_RAW/CAST_FROM_RAW_TO_BINARY_DOUBLE/CAST_FROM_RAW_TO_BINARY_FLOAT/CAST_FROM_BINARY_FLOAT_TO_RAW/CAST_FROM_RAW_TO_NUMBER/CAST_FROM_NUMBER_TO_RAW/CAST_FROM_RAW_TO_NVARCHAR2/COMPARE/CONCAT/CONVERT/COPIES/OVERLAY/REVERSE/TRANSLATE/TRANSLITERATE/XRANGE。"
  source_anchor: "3.12.2.16 DBE_RAW 表3-269 页2815-2817"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_cast_bi_pair
  type: syntax
  statement: "INTEGER与RAW互转：CAST_FROM_BINARY_INTEGER_TO_RAW(value IN BIGINT, endianess IN INTEGER DEFAULT 1) RETURN RAW（预期处理INTEGER类型值，为兼容性考虑参数定义为BIGINT，不影响使用）；CAST_FROM_RAW_TO_BINARY_INTEGER(value IN RAW, endianess IN INTEGER DEFAULT 1) RETURN INTEGER；endianess字节序取值1/2/3——1 BIG_ENDIAN（默认）、2 LITTLE_ENDIAN、3 MACHINE_ENDIAN（机器默认BIG_ENDIAN时MACHINE_ENDIAN结果与BIG_ENDIAN一致，反之与LITTLE_ENDIAN一致）。"
  source_anchor: "3.12.2.16 CAST_FROM_BINARY_INTEGER_TO_RAW/CAST_FROM_RAW_TO_BINARY_INTEGER 页2817-2818"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_length_cast_varchar
  type: syntax
  statement: "长度与字符串转换：GET_LENGTH(value IN RAW) RETURN INTEGER返回RAW类型值的长度；CAST_FROM_VARCHAR2_TO_RAW(str IN VARCHAR2) RETURN RAW将VARCHAR2转换为RAW；CAST_TO_VARCHAR2(str IN RAW) RETURN VARCHAR2将RAW转换为VARCHAR2。"
  source_anchor: "3.12.2.16 GET_LENGTH/CAST_FROM_VARCHAR2_TO_RAW/CAST_TO_VARCHAR2 页2818"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_bit_or_hist
  type: constraint
  statement: "BIT_OR历史类型说明：DBE_RAW.BIT_OR(str1 IN TEXT, str2 IN TEXT) RETURN TEXT返回两个RAW类型值按位或计算后的值；由于历史原因参数被定义为TEXT类型，但该接口预期并处理RAW类型值，定义为TEXT类型不影响对RAW类型值的处理。"
  source_anchor: "3.12.2.16 BIT_OR 页2818-2819"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_substr
  type: syntax
  statement: "SUBSTR原型：DBE_RAW.SUBSTR(IN lob_loc BLOB, IN off_set INTEGER DEFAULT 1, IN amount INTEGER DEFAULT 32767) RETURN RAW；将RAW类型值按起始位off_set和长度amount截取；lob_loc由于历史原因被定义为BLOB类型，接口预期并处理RAW类型值。"
  source_anchor: "3.12.2.16 SUBSTR 页2819"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_bit_and_complement_xor
  type: syntax
  statement: "位运算三函数：BIT_AND(r1 IN RAW, r2 IN RAW) RETURN RAW求按位与；BIT_COMPLEMENT(r IN RAW) RETURN RAW求按位取反；BIT_XOR(r1 IN RAW, r2 IN RAW) RETURN RAW求按位异或；各参数最大长度不超过32767。"
  source_anchor: "3.12.2.16 BIT_AND/BIT_COMPLEMENT/BIT_XOR 页2819-2820"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_cast_double_pair
  type: syntax
  statement: "BINARY_DOUBLE与RAW互转：CAST_FROM_BINARY_DOUBLE_TO_RAW(n IN BINARY_DOUBLE, endianess IN INTEGER DEFAULT 1) RETURN RAW与CAST_FROM_RAW_TO_BINARY_DOUBLE(r IN RAW, endianess IN INTEGER DEFAULT 1) RETURN BINARY_DOUBLE；r最短长度不低于8、最大不超过32767；endianess取值1/2/3语义同前。"
  source_anchor: "3.12.2.16 CAST_FROM_BINARY_DOUBLE_TO_RAW/CAST_FROM_RAW_TO_BINARY_DOUBLE 页2820-2821"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_cast_float_pair
  type: syntax
  statement: "FLOAT4与RAW互转：CAST_FROM_RAW_TO_BINARY_FLOAT(r IN RAW, endianess IN INTEGER DEFAULT 1) RETURN FLOAT4（r最短不低于4、最大不超过32767）与CAST_FROM_BINARY_FLOAT_TO_RAW(n IN FLOAT4, endianess IN INTEGER DEFAULT 1) RETURN RAW；endianess取值1/2/3语义同前。"
  source_anchor: "3.12.2.16 CAST_FROM_RAW_TO_BINARY_FLOAT/CAST_FROM_BINARY_FLOAT_TO_RAW 页2821-2822"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_cast_number_pair
  type: constraint
  statement: "NUMBER与RAW互转及跨库差异：CAST_FROM_RAW_TO_NUMBER(r IN RAW) RETURN NUMERIC（r最短不低于6、最大不超过32767）与CAST_FROM_NUMBER_TO_RAW(n IN NUMERIC) RETURN RAW；由于A数据库与GaussDB的NUMBER数据类型底层实现不同（RAW为底层二进制流的十六进制表示），用户不能将A数据库NUMBER对应的RAW在GaussDB中得到相同NUMBER数据，两函数在A数据库与GaussDB表现不同。"
  source_anchor: "3.12.2.16 CAST_FROM_RAW_TO_NUMBER/CAST_FROM_NUMBER_TO_RAW 页2822-2823"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_cast_nvarchar2
  type: syntax
  statement: "CAST_FROM_RAW_TO_NVARCHAR2原型：DBE_RAW.CAST_FROM_RAW_TO_NVARCHAR2(r IN RAW) RETURN NVARCHAR2；将RAW类型值转换为NVARCHAR2类型（r最大长度不超过32767）。"
  source_anchor: "3.12.2.16 CAST_FROM_RAW_TO_NVARCHAR2 页2823"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_compare_concat
  type: syntax
  statement: "COMPARE与CONCAT：COMPARE(r1 IN RAW, r2 IN RAW, pad IN RAW DEFAULT NULL) RETURN INTEGER返回两个RAW类型值首个不相同的位置（r1/r2可为NULL或长度0、最大不超过32767；pad取首字节扩展较短的一个，NULL/长度0/缺省时扩展值为0x00）；CONCAT(r1..r12 IN RAW DEFAULT NULL) RETURN RAW将最多12个RAW类型值连接到一个新的RAW中，连接后长度超过32767则报错。"
  source_anchor: "3.12.2.16 COMPARE/CONCAT 页2823-2824"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_convert
  type: constraint
  statement: "CONVERT：DBE_RAW.CONVERT(r IN RAW, to_charset IN VARCHAR2, from_charset IN VARCHAR2) RETURN RAW将RAW值从原编码from_charset转换为目标编码to_charset（r最大不超过32767；from_charset编码下r必须合法）；如果原编码到目标编码的转化规则不存在则参数r不进行任何转换直接返回（如GBK和LATIN1之间转换规则不存在），具体转换规则可通过查看系统表PG_CONVERSION获得。"
  source_anchor: "3.12.2.16 CONVERT 页2824-2825"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_copies_overlay
  type: syntax
  statement: "COPIES与OVERLAY：COPIES(r IN RAW, n IN NUMERIC) RETURN RAW将RAW值复制n次串联（n必须为正数、小数四舍五入，复制后长度超过32767报错）；OVERLAY(overlay_str IN RAW, target IN RAW, pos IN BINARY_INTEGER DEFAULT 1, len IN BINARY_INTEGER DEFAULT NULL, pad IN RAW DEFAULT NULL) RETURN RAW用一个RAW值覆盖另一个（可指定起始位置和长度）——overlay_str/target不能为NULL且target最大32767字节、pos>=1且len+pos<=32767、len>=0缺省为overlay_str长度、pad只有第一个字节有效（NULL默认0x00）。"
  source_anchor: "3.12.2.16 COPIES/OVERLAY 页2825"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_reverse_translate
  type: syntax
  statement: "REVERSE与TRANSLATE：REVERSE(r IN RAW) RETURN RAW按字节翻转（最大32767字节，NULL返回NULL）；TRANSLATE(r IN RAW, from_set IN RAW, to_set IN RAW) RETURN RAW转换或舍弃指定字节——r[x]=from_set[n]则r[x]替换成to_set[n]（from_set中多个相同字节只替换成第一个对应的字节），to_set[n]不存在时r[x]被舍弃；r/from_set/to_set均不能为NULL、最大32767字节。"
  source_anchor: "3.12.2.16 REVERSE/TRANSLATE 页2825-2826"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_transliterate_xrange
  type: syntax
  statement: "TRANSLITERATE与XRANGE：TRANSLITERATE(r IN RAW, from_set IN RAW DEFAULT NULL, to_set IN RAW DEFAULT NULL, pad IN RAW DEFAULT NULL) RETURN RAW转换指定字节——from_set为NULL时r所有字节转换成pad填充的等长数据、to_set[n]不存在时转换成pad（与TRANSLATE的舍弃不同）；XRANGE(start_byte IN RAW, end_byte IN RAW) RETURN RAW返回以指定字节码开始和结束的连续一字节编码（start默认0x00、end默认0xFF；end_byte<start_byte时从end_byte拼接到0xFF再从0x00拼接到start_byte）。"
  source_anchor: "3.12.2.16 TRANSLITERATE/XRANGE 页2826-2827"
  source_refs: *refrw
  status: confirmed
- id: dberaw_wave8_157_example
  type: behavior_oracle
  statement: "DBE_RAW示例基线：CAST_FROM_BINARY_INTEGER_TO_RAW(170,1)=000000AA、(170,2)=AA000000；GET_LENGTH(...)=4；CAST_FROM_VARCHAR2_TO_RAW('AA')=4141、CAST_TO_VARCHAR2('4141')=AA；BIT_OR('0000','1111')=1111、SUBSTR('ABCD',1,2)=AB、BIT_AND('AFF','FF0B')=0A0B、BIT_COMPLEMENT('0AFF')=F500、BIT_XOR('AFF','FF0B')=F5F4；DOUBLE/FLOAT/NUMBER互转（1.0001↔3FF00068DB8BAC71、2.5↔40200000、2.5↔808002008813）；COMPARE('ABCD','AB')=2、CONCAT='ABCDAB'、CONVERT('E695B0','GBK','UTF8')=CAFD、COPIES='ABCDABCD'、OVERLAY='120ABCEF999956'、REVERSE='78563412'、TRANSLATE='55225522'、TRANSLITERATE='55225522FF'、XRANGE('00','03')=00010203。"
  source_anchor: "3.12.2.16 示例 页2827-2828"
  source_refs: *refrw
  status: confirmed
open_questions:
