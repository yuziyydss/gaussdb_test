  content: "CONVERT在PG_CONVERSION规则外的编码对行为、OVERLAY/TRANSLITERATE的pad多字节取首字节边界、DBE_RANDOM伪随机序列在不同会话间的一致性需授权环境实机验证。"
  status: open
