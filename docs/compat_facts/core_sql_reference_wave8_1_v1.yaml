facts:
- id: sqlref_wave8_1_tx_atomicity
  type: syntax
  statement: "事务是用户定义的数据库操作序列，这些操作要么全做要么全不做，是一个不可分割的工作单位。"
  source_anchor: "1.11 页1147"
  source_refs: &refb1
  - w8_1_1_11
  status: confirmed
- id: sqlref_wave8_1_tx_start
  type: syntax
  statement: "GaussDB通过START TRANSACTION或BEGIN语法启动事务。"
  source_anchor: "1.11 页1147"
  source_refs: *refb1
  status: confirmed
- id: sqlref_wave8_1_tx_set
  type: syntax
  statement: "GaussDB通过SET TRANSACTION或SET LOCAL TRANSACTION语法设置事务。"
  source_anchor: "1.11 页1147"
  source_refs: *refb1
  status: confirmed
- id: sqlref_wave8_1_tx_commit
  type: syntax
  statement: "GaussDB通过COMMIT或END完成提交事务的功能，提交事务的所有操作。"
  source_anchor: "1.11 页1147"
  source_refs: *refb1
  status: confirmed
- id: sqlref_wave8_1_tx_rollback
  type: behavior_oracle
  statement: "ROLLBACK撤销事务中已完成的操作；不在事务块中的单次多语句请求会打包成一个事务，其中任一语句失败则整个请求回滚。"
  source_anchor: "1.11 页1147"
  source_refs: *refb1
  status: confirmed
- id: sqlref_wave8_1_fts_pipeline
  type: behavior_oracle
  statement: "全文检索预处理把文档解析成token，通过词典标准化为词素，并把标准化词素和位置信息保存为tsvector；文档包含查询词越密集排序越高。"
  source_anchor: "1.12 页1147-1148"
  source_refs: &refb2
  - w8_1_1_12
  status: confirmed
- id: sqlref_wave8_1_fts_types_operator
  type: syntax
  statement: "tsvector存储预处理文档，tsquery存储查询条件；匹配运算符@@是全文检索的核心操作符。"
  source_anchor: "1.12 页1148"
  source_refs: *refb2
  status: confirmed
- id: sqlref_wave8_1_fts_document
  type: constraint
  statement: "文档可以是数据库表中一行的文本字段或字段组合，也可以存放在文件系统；数据库可保存全文索引并用唯一标识检索外部文档。"
  source_anchor: "1.12 页1148"
  source_refs: *refb2
  status: confirmed
- id: sqlref_wave8_1_fts_gin_index
  type: constraint
  statement: "GIN索引可加速文本搜索；创建索引时应使用指定文本搜索配置的两参数to_tsvector，避免索引内容受default_text_search_config影响。"
  source_anchor: "1.12 页1152-1153"
  source_refs: *refb2
  status: confirmed
- id: sqlref_wave8_1_fts_config
  type: environment
  statement: "文本搜索配置指定解析器和词典列表；未显式指定配置时使用GUC default_text_search_config，session级当前支持ngram、pound、simple、english。"
  source_anchor: "1.12 页1165-1167"
  source_refs: *refb2
  status: confirmed
- id: sqlref_wave8_1_fts_ranking
  type: behavior_oracle
  statement: "ts_rank基于匹配词位频率排序，ts_rank_cd计算覆盖密度并考虑匹配词位接近度；ts_rank_cd需要位置信息，匹配token没有位置时结果为0。"
  source_anchor: "1.12 页1155-1156"
  source_refs: *refb2
  status: confirmed
- id: sqlref_wave8_1_fts_headline
  type: syntax
  statement: "ts_headline用于高亮搜索结果。"
  source_anchor: "1.12 页1158"
  source_refs: *refb2
  status: confirmed
- id: sqlref_wave8_1_fts_rewrite_stat
  type: syntax
  statement: "ts_rewrite用目标/替换子查询重写tsquery；ts_stat返回词素、文档数和出现次数，可用于检查配置和查找候选停用词。"
  source_anchor: "1.12 页1160-1162"
  source_refs: *refb2
  status: confirmed
- id: sqlref_wave8_1_fts_lexize
  type: behavior_oracle
  statement: "ts_lexize支持单一token且不支持文本；识别token返回词素数组，识别为停用词返回空数组，不可识别返回NULL。"
  source_anchor: "1.12 页1169-1170"
  source_refs: *refb2
  status: confirmed
- id: sqlref_wave8_1_fts_limits
  type: constraint
  statement: "tsvector每个分词字符长度必须小于2047字节，结构长度必须小于1MB；位置值必须大于0且小于等于16383，大于16383强制置为16383；每个分词位置数不超过255；tsquery关键字及操作符最大支持32768；词组操作符距离必须在0到16384之间。"
  source_anchor: "1.12 页1170"
  source_refs: *refb2
  status: confirmed
