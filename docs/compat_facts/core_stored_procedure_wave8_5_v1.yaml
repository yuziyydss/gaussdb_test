facts:
- id: sp_bytecode_wave8_5_definition
  type: syntax
  statement: "字节码是为PL/SQL专门定义的一组指令；一个字节码对应一个原子化操作，一条语句对应一个或多个字节码，执行时转化为顺序字节码数组。"
  source_anchor: "3.17 页3109"
  source_refs: &refb1
  - w8_5_3_17
  status: confirmed
- id: sp_bytecode_wave8_5_performance
  type: behavior_oracle
  statement: "字节码执行框架将传统基于AST的解释执行引擎转为基于字节码的解释执行引擎，用于提升支持场景下存储过程的执行性能。"
  source_anchor: "3.17 页3109"
  source_refs: *refb1
  status: confirmed
- id: sp_bytecode_wave8_5_guc
  type: environment
  statement: "plsql_code_type=BYTECODE时走字节码框架，INTERPRETED时走传统AST框架；不支持设置为其他值。"
  source_anchor: "3.17 页3109"
  source_refs: *refb1
  status: confirmed
- id: sp_bytecode_wave8_5_compat_options
  type: environment
  statement: "A兼容模式下，behavior_compat_options需包含compat_cursor、allow_procedure_compile_check、proc_outparam_override、dynamic_sql_compat、proc_outparam_transfer_length、varray_compat。"
  source_anchor: "3.17 页3109"
  source_refs: *refb1
  status: confirmed
- id: sp_bytecode_wave8_5_unsupported_dfk
  type: constraint
  statement: "字节码框架不支持PLDEBUGGER，PG_STAT_USER_FUNCTIONS视图只统计传统引擎执行时间。"
  source_anchor: "3.17 页3109"
  source_refs: *refb1
  status: confirmed
- id: sp_bytecode_wave8_5_unsupported_features
  type: constraint
  statement: "不支持PACKAGE实例化、匿名块、TRIGGER、返回集合的函数、高级包及系统函数、子程序、自治事务嵌套表达式、BULK COLLECT、FORALL SAVE EXCEPTIONS、参数默认值为PACKAGE变量等。"
  source_anchor: "3.17 页3109-3110"
  source_refs: *refb1
  status: confirmed
- id: sp_bytecode_wave8_5_expression_guc
  type: environment
  statement: "执行表达式前需设置plsql_code_type=BYTECODE，以及compat_cursor、allow_procedure_compile_check、proc_outparam_override、dynamic_sql_compat、proc_outparam_transfer_length、varray_compat。"
  source_anchor: "3.17 页3110"
  source_refs: *refb1
  status: confirmed
- id: sp_bytecode_wave8_5_expression_types
  type: syntax
  statement: "字节码表达式涵盖常量、变量、字段选择、操作符、函数调用、条件表达式、复合类型构造器、空值条件、布尔测试、数组/集合构造器、XML表达式等。"
  source_anchor: "3.17 页3110-3118"
  source_refs: *refb1
  status: confirmed
