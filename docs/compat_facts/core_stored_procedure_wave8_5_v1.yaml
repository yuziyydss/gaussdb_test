  source_anchor: "3.18 页3127-3132"
  source_refs: *refb2
  status: confirmed
- id: sp_keyword_wave8_5_reserved_examples
  type: syntax
  statement: "BEGIN、CASE、DECLARE、END、EXCEPTION、FETCH、FOR、IF、LOOP、OPEN、RETURN、SELECT、THEN、WHEN、WHILE等为保留关键字。"
  source_anchor: "3.18 页3127-3132"
  source_refs: *refb2
  status: confirmed
- id: sp_keyword_wave8_5_nonreserved_examples
  type: syntax
