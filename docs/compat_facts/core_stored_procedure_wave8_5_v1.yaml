  source_anchor: "3.18 页3127-3132"
  source_refs: *refb2
  status: confirmed
- id: sp_keyword_wave8_5_sql_keyword_boundary
  type: constraint
  statement: "同一关键字在存储过程上下文和SQL上下文的保留状态可以不同，例如CASE、COLLATE、DEFAULT、ELSE、END、FETCH、FOR、FROM、NOT、NULL、PROCEDURE、SELECT、THEN、TO、WHEN均为SQL关键字。"
  source_anchor: "3.18 页3127-3132"
  source_refs: *refb2
  status: confirmed
