facts:
- id: altsyn_wave8_53_purpose
  type: syntax
  statement: "ALTER SYNONYM用于修改SYNONYM对象的所有者；当前仅支持修改所有者。"
  source_anchor: "1.13.7.33 页1269"
  source_refs: &refalt
  - w8_53_1_13_7_33
  status: confirmed
- id: altsyn_wave8_53_permissions
  type: constraint
  statement: "只有系统管理员有权限修改SYNONYM对象的所有者；三权分立开关打开时，系统管理员默认没有该权限。"
  source_anchor: "1.13.7.33 注意事项 页1269"
  source_refs: *refalt
  status: confirmed
- id: altsyn_wave8_53_new_owner_permission
  type: constraint
  statement: "同义词的新所有者必须具有SYNONYM对象所在模式的CREATE权限。"
  source_anchor: "1.13.7.33 注意事项 页1269"
  source_refs: *refalt
  status: confirmed
- id: altsyn_wave8_53_public_unsupported
  type: constraint
  statement: "ALTER SYNONYM不支持修改PUBLIC同义词。"
  source_anchor: "1.13.7.33 注意事项 页1269"
  source_refs: *refalt
  status: confirmed
- id: altsyn_wave8_53_syntax
  type: syntax
  statement: "ALTER SYNONYM synonym_name OWNER TO new_owner用于修改同义词所有者。"
  source_anchor: "1.13.7.33 语法格式 页1269"
  source_refs: *refalt
  status: confirmed
- id: altsyn_wave8_53_synonym_name
  type: syntax
  statement: "synonym_name为待修改的同义词名，可带模式名，必须符合标识符命名规范。"
  source_anchor: "1.13.7.33 synonym_name 页1270"
  source_refs: *refalt
  status: confirmed
- id: altsyn_wave8_53_new_owner
  type: syntax
  statement: "new_owner为同义词对象的新所有者，取值为有效的用户名。"
  source_anchor: "1.13.7.33 new_owner 页1270"
  source_refs: *refalt
  status: confirmed
- id: altsyn_wave8_53_example
  type: behavior_oracle
  statement: "示例中系统管理员创建同义词t1后，可执行ALTER SYNONYM t1 OWNER TO u1修改所有者；授权模式权限后可完成变更，最后可DROP SYNONYM。"
  source_anchor: "1.13.7.33 示例 页1270"
  source_refs: *refalt
  status: confirmed
- id: altsyn_wave8_53_lifecycle
  type: syntax
  statement: "ALTER SYNONYM与CREATE SYNONYM和DROP SYNONYM构成同义词生命周期链路。"
  source_anchor: "1.13.7.33 相关链接 页1270"
  source_refs: *refalt
  status: confirmed
- id: dropsyn_wave8_53_purpose
  type: syntax
  statement: "DROP SYNONYM用于删除一个同义词对象。"
  source_anchor: "1.13.10.40 页1691"
  source_refs: &refdrop
  - w8_53_1_13_10_40
  status: confirmed
- id: dropsyn_wave8_53_permissions
  type: constraint
  statement: "仅同义词所有者或被授予DROP ANY SEQUENCE权限的用户可执行DROP SYNONYM；系统管理员默认拥有该权限。"
  source_anchor: "1.13.10.40 注意事项 页1691"
  source_refs: *refdrop
  status: confirmed
- id: dropsyn_wave8_53_public_keyword
  type: syntax
  statement: "DROP [PUBLIC] SYNONYM中的PUBLIC为可选关键字，删除PUBLIC同义词时使用。"
  source_anchor: "1.13.10.40 PUBLIC 页1692"
  source_refs: *refdrop
  status: confirmed
- id: dropsyn_wave8_53_if_exists
  type: constraint
  statement: "IF EXISTS判断同义词是否存在；存在则删除成功，不存在时不执行删除，仅产生NOTICE提示。"
  source_anchor: "1.13.10.40 IF EXISTS 页1692"
  source_refs: *refdrop
  status: confirmed
- id: dropsyn_wave8_53_main_syntax
  type: syntax
  statement: "DROP [PUBLIC] SYNONYM [IF EXISTS] synonym_name [CASCADE|RESTRICT]用于删除同义词，synonym_name可使用模式限定。"
  source_anchor: "1.13.10.40 语法/参数 页1691-1692"
  source_refs: *refdrop
  status: confirmed
- id: dropsyn_wave8_53_cascade_restrict
  type: syntax
  statement: "CASCADE级联删除依赖同义词的对象（如视图）；RESTRICT在存在依赖对象时拒绝删除；未指定时默认RESTRICT。"
  source_anchor: "1.13.10.40 CASCADE/RESTRICT 页1692"
  source_refs: *refdrop
  status: confirmed
- id: dropsyn_wave8_53_example
  type: behavior_oracle
  statement: "示例中CREATE OR REPLACE SYNONYM test_tbl1 FOR test_tbl1创建同义词后，可使用DROP SYNONYM test_tbl1删除。"
  source_anchor: "1.13.10.40 示例 页1692"
  source_refs: *refdrop
  status: confirmed
- id: dropsyn_wave8_53_lifecycle
  type: syntax
  statement: "DROP SYNONYM与ALTER SYNONYM和CREATE SYNONYM构成同义词生命周期链路。"
  source_anchor: "1.13.10.40 相关链接 页1692"
  source_refs: *refdrop
  status: confirmed
- id: syn_wave8_53_scope_summary
  type: syntax
  statement: "同义词生命周期覆盖创建、所有者变更和删除；ALTER只支持修改私有同义词所有者，DROP支持私有和PUBLIC同义词。"
  source_anchor: "1.13.7.33/1.13.10.40 页1269、1691-1692"
  source_refs:
  - w8_53_1_13_7_33
  - w8_53_1_13_10_40
  status: confirmed
- id: syn_wave8_53_permission_asymmetry
  type: constraint
  statement: "ALTER SYNONYM只有系统管理员可修改所有者且不支持PUBLIC；DROP SYNONYM允许同义词所有者或DROP ANY SEQUENCE权限用户执行，并可通过PUBLIC关键字删除PUBLIC同义词。"
  source_anchor: "1.13.7.33/1.13.10.40 注意事项 页1269、1691"
  source_refs:
  - w8_53_1_13_7_33
  - w8_53_1_13_10_40
  status: confirmed
- id: syn_wave8_53_dependency_semantics
  type: constraint
  statement: "删除同义词时默认RESTRICT；只有显式指定CASCADE才级联删除依赖同义词的对象，如视图。"
  source_anchor: "1.13.10.40 CASCADE/RESTRICT 页1692"
  source_refs: *refdrop
  status: confirmed
