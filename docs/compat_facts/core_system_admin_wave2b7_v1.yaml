  statement: gs_undo_meta_dump_zone(zone_id,read_memory)解析UndoZone元信息；zone_id为0~1048575，read_memory=true从内存读取，false从物理文件读取。
  source_anchor: 1.6.27.13 页701-702
  source_refs: *id001
