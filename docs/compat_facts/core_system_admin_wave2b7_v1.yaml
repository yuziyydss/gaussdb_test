- id: wave2b7_undo_storage_type
  type: environment
  statement: 通过gs_global_config的undostoragetype字段确认回滚段存储方式：segpage为段页式且为预留参数暂不支持；page为页式。
  source_anchor: 1.6.27.13 页697
  source_refs: *id001
  status: confirmed
- id: wave2b7_undo_meta
  type: syntax
  statement: gs_undo_meta(type,zoneId,location)返回Undo模块元信息；type 0/1/2/3分别表示UndoZone Record、UndoZone Transaction Slot、UndoSpace Record、UndoSpace Transaction Slot；zoneId=-1表示全部，0~1048575表示指定Zone；location 0内存、1物理文件；仅支持页式存储。
  source_anchor: 1.6.27.13 页697-698
  source_refs: *id001
  status: confirmed
- id: wave2b7_undo_translot
  type: syntax
  statement: gs_undo_translot(location,zoneId)返回Undo事务槽信息。
  source_anchor: 1.6.27.13 页698
  source_refs: *id001
  status: confirmed
- id: wave2b7_undo_translot_status
  type: syntax
  statement: Undo事务槽状态枚举：0已提交、1正在执行中、2回滚中、3回滚完成。
  source_anchor: 1.6.27.13 页698
  source_refs: *id001
  status: confirmed
- id: wave2b7_stat_undo
  type: syntax
  statement: gs_stat_undo([init])返回Undo统计信息，包括当前使用Zone数量、前三个使用量最大Zone、Undo总空间、阈值、global_recycle_xid、oldest_xmin、Undo链长度、创建/删除Undo文件计数和参数建议；init=true清理并重新开始统计。
  source_anchor: 1.6.27.13 页698-700
  source_refs: *id001
  status: confirmed
- id: wave2b7_undo_record
  type: syntax
  statement: gs_undo_record(undoptr)按Undo记录指针解析Undo记录，返回record。
  source_anchor: 1.6.27.13 页701
  source_refs: *id001
  status: confirmed
- id: wave2b7_undo_dump_parsepage_mv
  type: syntax
  statement: gs_undo_dump_parsepage_mv(relpath,blkno,reltype,rmem)解析USTORE表磁盘页的页头、元组头和标识位信息，返回text；需系统管理员或运维管理人员。
  source_anchor: 1.6.27.13 页701
  source_refs: *id001
  status: confirmed
