  # 使用场景
  - id: dbe_utility_usage_pattern
    type: behavior_oracle
    statement: "DBE_UTILITY核心用途：1.异常调试——FORMAT_ERROR_BACKTRACE/STACK/CALL_STACK获取异常信息 2.性能测量——GET_TIME/GET_CPU_TIME做差计算耗时 3.名称规范化——CANONICALIZE/COMMA_TO_TABLE 4.动态DDL——EXEC_DDL_STATEMENT 5.哈希计算——GET_HASH_VALUE/GET_SQL_HASH。"
    source_anchor: "3.12.2 综合分析"
    status: confirmed
