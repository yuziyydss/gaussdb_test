  source_anchor: 1.6.27.15 页720-722
  source_refs: *id001
  status: confirmed
- id: wave2b8_imcv_bgworker_status
  type: syntax
  statement: gs_imcv_bgworker_status()显示IMCV表重建bgworker状态信息，返回record。
  source_anchor: 1.6.27.15 页722
  source_refs: *id001
  status: confirmed
- id: wave2b8_htap_scan_hit_status
  type: syntax
  statement: gs_htap_scan_hit_status(relname,partname)查询表/分区粒度IMCU命中率；reloid重载返回数据库内所有表/分区信息；推荐使用relname/partname重载。
  source_anchor: 1.6.27.15 页723-724
  source_refs: *id001
  status: confirmed
- id: wave2b8_imcu_meta
  type: syntax
  statement: gs_imcu_meta(rel_name[,partname])显示指定IMCV表的IMCU元信息；每行代表一个IMCU，attnum为0的列为CTID列。
  source_anchor: 1.6.27.15 页724-726
  source_refs: *id001
  status: confirmed
- id: wave2b8_imcu_meta_fields
  type: syntax
  statement: IMCU元信息包括压缩方式、行数、空行、最大/最小值、求和值、内存/磁盘位置等；压缩方式包括uncompressed、delta_plus_rle、lz4_compressed和dict_compressed。
  source_anchor: 1.6.27.15 页725-726
  source_refs: *id001
  status: confirmed
