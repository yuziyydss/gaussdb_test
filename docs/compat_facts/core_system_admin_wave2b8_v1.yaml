- id: wave2b8_htap_data_maintenance
  type: constraint
  statement: gs_htap_data_maintenance(rel_oid,type)为列存维护接口，支持卸载列存数据（清理内存和磁盘）和将IMCV数据全部落盘；需SYSADMIN/运维管理员，enable_htap=on，不允许事务内执行，仅作为逃生手段。
  source_anchor: 1.6.27.15 页730
  source_refs: *id001
  status: confirmed
