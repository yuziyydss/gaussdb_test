- id: wave2b8_htap_common_precondition
  type: constraint
  statement: HTAP函数需enable_htap=on；通常仅系统管理员或运维管理人员可执行。
  source_anchor: 1.6.27.15 页715起
  source_refs: *id001
  status: confirmed
- id: wave2b8_imcv_flush_overloads
  type: syntax
  statement: gs_imcv_flush支持(relname,partname,parallelism,rebuild_mode)、(reloid,partoid,parallelism,rebuild_mode)和(reloid)三种重载，立即加载/重建指定IMCV表或分区。
  source_anchor: 1.6.27.15 页716-718
  source_refs: *id001
  status: confirmed
- id: wave2b8_imcv_flush_constraints
  type: constraint
  statement: gs_imcv_flush需enable_htap=on、SYSADMIN或运维管理员，且不允许在事务块内执行；并行加载/重建会额外占用内存、CPU和I/O。
  source_anchor: 1.6.27.15 页716-718
  source_refs: *id001
  status: confirmed
- id: wave2b8_imcv_flush_rebuild_mode
  type: syntax
  statement: gs_imcv_flush的rebuild_mode=0触发增量加载，1强制重建，2强制重建并支持同步precheck结果。
  source_anchor: 1.6.27.15 页716-718
  source_refs: *id001
  status: confirmed
