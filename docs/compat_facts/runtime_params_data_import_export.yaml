- id: guc_safe_data_path
  type: environment
  statement: safe_data_path对COPY、LOAD DATA、本地节点外表及非初始用户高级包的文件读写路径做白名单限制；默认值为copydir_default,copydir_logical_decode，置空表示不开启白名单校验。
  source_anchor: 7.3.5 safe_data_path
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4238-4239）
- id: guc_enable_copy_server_files
  type: environment
  statement: enable_copy_server_files开启时允许SYSADMIN用户或继承gs_role_copy_files角色的用户执行COPY FROM/TO FILENAME；关闭时仅初始用户可执行。多租场景下仍不支持非初始用户在PDB内执行。
  source_anchor: 7.3.5 enable_copy_server_files
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4239）
- id: guc_enable_copy_when_filler
  type: environment
  statement: enable_copy_when_filler控制gs_loader控制文件的WHEN条件是否可使用FILLER字段过滤；开启时支持，但WHEN常量字符串不支持\0、\r等特殊字符。
  source_anchor: 7.3.5 enable_copy_when_filler
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4239-4240）
- id: guc_a_format_load_with_constraints_violation
  type: environment
  statement: a_format_load_with_constraints_violation控制COPY、\copy和gs_loader导入遇约束冲突时是否跳过并继续：空值均不支持跳过；s1仅gs_loader支持；s2三者均支持。跳过错误可通过bad文件或gs_copy_error_log查看。
  source_anchor: 7.3.5 a_format_load_with_constraints_violation
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4240）
- id: guc_support_binary_copy_version
  type: environment
  statement: support_binary_copy_version为header_encoding时，COPY TO BINARY导出的二进制文件头包含当前服务端编码信息；空字符串用于前向兼容并保持原二进制格式。默认header_encoding。
  source_anchor: 7.3.5 support_binary_copy_version
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4240）
- id: guc_copy_special_character_version
  type: environment
  statement: copy_special_character_version控制COPY导入导出非法编码处理：no_error在文件编码与服务端编码一致时容错插入；per_byte使GBK/ZHS16GBK导出按单字节处理；空值保持报错。默认空字符串。
  source_anchor: 7.3.5 copy_special_character_version
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4241）
- id: guc_enable_log_copy_illegal_chars
  type: environment
  statement: enable_log_copy_illegal_chars开启时，gs_loader和COPY导入导出每遇到一行非法编码字符数据就写一条运行日志；关闭时不记录。默认on。
  source_anchor: 7.3.5 enable_log_copy_illegal_chars
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4242）
- id: guc_batch_insert_index_types
  type: environment
  statement: batch_insert_index_types控制特定批量插入场景是否开启索引性能优化：rcr_ubtree仅对RCR ubtree索引开启；空字符串对所有索引关闭。默认空字符串。
  source_anchor: 7.3.5 batch_insert_index_types
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4242-4243）
- id: guc_a_format_enable_copy_empty_lobs
  type: environment
  statement: Oracle兼容模式下COPY FROM空串输入BLOB/CLOB时，a_format_enable_copy_empty_lobs开启则存为长度0的空串且不能用IS NULL过滤；关闭则转换为NULL。默认on。
  source_anchor: 7.3.5 a_format_enable_copy_empty_lobs
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4243-4244）
- id: guc_enable_copy_case_sensitive
  type: environment
  statement: enable_copy_case_sensitive控制gs_loader及COPY...TRANSFORM()表达式处理时是否保留大写或特殊列名的大小写敏感；开启后控制文件可用双引号转义保留列名。默认off。
  source_anchor: 7.3.5 enable_copy_case_sensitive
  status: confirmed
  verification_method: pdftotext双模式交叉验证通过（页4244）
