- id: guc_raise_errors_if_no_files
  type: environment
  statement: raise_errors_if_no_files开启时导入区分“文件记录数为空”和“文件不存在”，文件不存在将抛错；该参数仅在GDS工具使用场景有意义，当前形态不生效。
