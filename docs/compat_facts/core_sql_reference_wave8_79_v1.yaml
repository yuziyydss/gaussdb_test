facts:
- id: drop_function_wave8_79_purpose
  type: syntax
  statement: "DROP FUNCTION从数据库中删除一个已存在的函数；语法为DROP FUNCTION [IF EXISTS] function_name [({[argname] [argmode] argtype}[, ...]) [CASCADE | RESTRICT]]。"
  source_anchor: "1.13.10.17 功能描述/语法格式 页1670"
  source_refs: &refdropfunc
  - w8_79_1_13_10_17
  status: confirmed
- id: drop_function_wave8_79_privileges
  type: constraint
  statement: "仅函数的所有者或者被授予了函数DROP权限的用户可以执行该操作，系统管理员默认拥有该权限；仅初始用户可以对初始用户的函数进行删除操作；如果函数中涉及对临时表的相关操作，则无法使用该操作进行删除。"
  source_anchor: "1.13.10.17 注意事项 页1670"
  source_refs: *refdropfunc
  status: confirmed
- id: drop_function_wave8_79_ifexists_cascade
  type: constraint
  statement: "IF EXISTS判断指定的函数是否存在：存在则删除成功，不存在不会进行删除操作，仅产生一个NOTICE提示；CASCADE级联删除依赖于该函数的对象；RESTRICT（未指定时默认）如果有任何依赖对象存在则拒绝删除该函数。"
  source_anchor: "1.13.10.17 参数说明 页1670"
  source_refs: *refdropfunc
  status: confirmed
- id: drop_function_wave8_79_args
  type: constraint
  statement: "函数参数说明：argmode为函数参数的模式；argname为函数参数的名称；argtype为函数参数的类型。"
  source_anchor: "1.13.10.17 参数说明 页1670"
  source_refs: *refdropfunc
  status: confirmed
- id: drop_function_wave8_79_overload
  type: constraint
  statement: "如果存在同名函数，删除时需加上参数列表，否则报错；function_name取值范围为已存在的函数名。"
  source_anchor: "1.13.10.17 参数说明/示例 页1670-1671"
  source_refs: *refdropfunc
  status: confirmed
- id: drop_function_wave8_79_example
  type: behavior_oracle
  statement: "示例：删除函数可省略参数列表（DROP FUNCTION func_test）；重载场景CREATE FUNCTION func_add(int)与func_add(int,int)后分别DROP FUNCTION func_add(int)和DROP FUNCTION func_add(int,int)删除（相关链接ALTER FUNCTION、CREATE FUNCTION）。"
  source_anchor: "1.13.10.17 示例 页1670-1671"
  source_refs: *refdropfunc
  status: confirmed
- id: drop_global_configuration_wave8_79_purpose
  type: syntax
  statement: "DROP GLOBAL CONFIGURATION删除系统表gs_global_config中的参数值；语法为DROP GLOBAL CONFIGURATION name[, ...]。"
  source_anchor: "1.13.10.18 功能描述/语法格式 页1671"
  source_refs: &refgcfg
  - w8_79_1_13_10_18
  status: confirmed
- id: drop_global_configuration_wave8_79_name_rule
  type: constraint
  statement: "name参数名称必须是gs_global_config中已经存在的，删除不存在的参数将报错。"
  source_anchor: "1.13.10.18 参数说明 页1671"
  source_refs: *refgcfg
  status: confirmed
- id: drop_global_configuration_wave8_79_limits
  type: constraint
  statement: "仅支持数据库初始用户运行此命令；参数名称不能为weak_password和undostoragetype；示例请参见ALTER GLOBAL CONFIGURATION章节（相关链接ALTER GLOBAL CONFIGURATION）。"
  source_anchor: "1.13.10.18 注意事项/示例 页1671-1672"
  source_refs: *refgcfg
  status: confirmed
- id: drop_group_wave8_79_purpose
  type: syntax
  statement: "DROP GROUP删除一个用户组，与DROP ROLE为同义词；语法为DROP GROUP [IF EXISTS] group_name[, ...]；IF EXISTS在用户组不存在时不删除仅产生NOTICE提示；group_name取值范围为已存在的用户组/角色；示例请参见CREATE GROUP章节（相关链接ALTER GROUP、CREATE GROUP、DROP ROLE）。"
  source_anchor: "1.13.10.19 功能描述/语法格式/参数说明 页1672"
  source_refs: &refdropgrp
  - w8_79_1_13_10_19
  status: confirmed
- id: drop_group_wave8_79_tool_note
  type: constraint
  statement: "DROP GROUP为GaussDB管理工具封装的接口，用于实现GaussDB管理；不建议用户直接使用该操作，以免对GaussDB状态造成影响。"
  source_anchor: "1.13.10.19 注意事项 页1672"
  source_refs: *refdropgrp
  status: confirmed
- id: drop_index_wave8_79_purpose
  type: syntax
  statement: "DROP INDEX删除一个索引；语法为DROP INDEX [CONCURRENTLY] [IF EXISTS] index_name[, ...] [CASCADE | RESTRICT]；IF EXISTS在索引不存在时不删除仅产生NOTICE提示；index_name取值为已存在的索引；CASCADE允许级联删除依赖于该索引的对象；RESTRICT（未指定默认）存在依赖对象时该索引无法被删除。"
  source_anchor: "1.13.10.20 功能描述/语法格式/参数说明 页1673-1674"
  source_refs: &refdropidx
  - w8_79_1_13_10_20
  status: confirmed
- id: drop_index_wave8_79_privileges
  type: constraint
  statement: "索引的所有者、索引所在模式的所有者、拥有索引所在表的INDEX权限的用户或者被授予了DROP ANY INDEX权限的用户可以执行该操作；三权分立关闭时，系统管理员默认拥有此权限。"
  source_anchor: "1.13.10.20 注意事项 页1673"
  source_refs: *refdropidx
  status: confirmed
- id: drop_index_wave8_79_gtt
  type: constraint
  statement: "对于全局临时表，当会话已经对全局临时表对象（包括创建全局临时表和第一次向全局临时表内插入数据）进行初始化后，其他的会话无法执行该全局临时表上索引的删除操作。"
  source_anchor: "1.13.10.20 注意事项 页1673"
  source_refs: *refdropidx
  status: confirmed
- id: drop_index_wave8_79_concurrently
  type: constraint
  statement: "CONCURRENTLY以不阻塞DML的方式在线删除索引（加四级锁）：指定时只能指定一个索引的名称且不支持CASCADE选项；普通DROP INDEX可在事务内执行，DROP INDEX CONCURRENTLY不可以在事务内执行；临时表支持CONCURRENTLY但实际采用阻塞式删除（无并发访问且成本更低）；在线删除存在锁超时问题，也可能与其他DDL出现死锁（在线删除持四级锁等待并发DDL事务结束，并发DDL持事务锁等待四级锁释放）；锁超时、死锁、数据库异常或用户取消可能残留非法状态索引，需尽快用DROP INDEX CONCURRENTLY或DROP INDEX清理（CONCURRENTLY持续失败时用DROP INDEX）；在线删除时间与并发业务量、运行时间有关（无并发为秒级，有并发需额外等待正在运行的所有并发业务结束）。"
  source_anchor: "1.13.10.20 参数说明 CONCURRENTLY 说明 页1673"
  source_refs: *refdropidx
  status: confirmed
- id: drop_index_wave8_79_example
  type: behavior_oracle
  statement: "示例中DROP INDEX IF EXISTS idx_test1 CASCADE；CREATE INDEX CONCURRENTLY idx_test2 ON test1_index(name)在线创建后DROP INDEX CONCURRENTLY idx_test2在线删除（相关链接ALTER INDEX、CREATE INDEX）。"
  source_anchor: "1.13.10.20 示例 页1674"
  source_refs: *refdropidx
  status: confirmed
- id: drop_language_wave8_79_unsupported
  type: constraint
  statement: "DROP LANGUAGE删除一个过程语言；当前形态暂不支持使用该语法。"
  source_anchor: "1.13.10.21 功能描述/注意事项 页1674"
  source_refs: &refdroplang
  - w8_79_1_13_10_21
  status: confirmed
- id: drop_llm_wave8_79_purpose
  type: syntax
  statement: "DROP LLM删除库内大模型服务；语法为DROP LLM model gs_model_name。"
  source_anchor: "1.13.10.22 功能描述/语法格式 页1674-1675"
  source_refs: &refdropllm
  - w8_79_1_13_10_22
  status: confirmed
- id: drop_llm_wave8_79_limits
  type: constraint
  statement: "drop llm命令需要拥有sysadmin的用户权限；当前版本不支持M兼容模式。"
  source_anchor: "1.13.10.22 注意事项 页1674-1675"
  source_refs: *refdropllm
  status: confirmed
- id: drop_llm_wave8_79_name
  type: constraint
  statement: "gs_model_name必选，为模型服务在GaussDB中的名称，该名称作为标识符在以后的语义函数中作为参数输入；不超过63字节，输入大小写不敏感，在系统中自动转写至小写字母存储；只支持数字、字母和下划线符号，且不能以数字开头，如果超过长度则会被自动截断；示例：DROP LLM model mod_q删除mod_q模型服务。"
  source_anchor: "1.13.10.22 参数说明/示例 页1675"
  source_refs: *refdropllm
  status: confirmed
