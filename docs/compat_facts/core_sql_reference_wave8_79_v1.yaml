  statement: "DROP FUNCTION重载与临时表限制、DROP INDEX CONCURRENTLY失败清理、全局配置删除和大模型服务删除在真实权限、并发DDL和依赖对象组合下的完整行为与错误矩阵需授权环境实机验证。"
