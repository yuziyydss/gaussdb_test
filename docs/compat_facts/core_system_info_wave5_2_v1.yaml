  type: constraint
  statement: "has_server_privilege有(user,server,privilege)和(server,privilege)两个重载；检查访问外部服务器权限，访问权限类型必须是USAGE、ALTER、DROP或COMMENT之一。"
  source_anchor: "1.6.26 页576"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_2_has_table_privilege
  type: syntax
  statement: "has_table_privilege有(user,table,privilege)和(table,privilege)两个重载；用户可用name或pg_authid.oid指定，public表示PUBLIC伪角色，缺省用户时使用current_user；表可用名称或OID指定。"
  source_anchor: "1.6.26 页576"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_2_has_table_privilege_types
  type: constraint
  statement: "has_table_privilege的权限类型必须是SELECT、INSERT、UPDATE、DELETE、TRUNCATE、REFERENCES、TRIGGER、ALTER、DROP、COMMENT、INDEX或VACUUM之一；可添加WITH GRANT OPTION；逗号分隔多个权限时拥有任一权限即返回true。"
  source_anchor: "1.6.26 页576-577"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_2_has_tablespace_privilege
  type: constraint
  statement: "has_tablespace_privilege有(user,tablespace,privilege)和(tablespace,privilege)两个重载；检查访问表空间权限，访问权限类型必须是CREATE、ALTER、DROP或COMMENT之一。"
  source_anchor: "1.6.26 页577"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_2_pg_has_role
  type: constraint
  statement: "pg_has_role有(user,role,privilege)和(role,privilege)两个重载；public不能作为用户名；访问权限类型必须是MEMBER或USAGE；MEMBER表示直接或间接成员关系，USAGE表示无需SET ROLE直接拥有角色使用权。"
  source_anchor: "1.6.26 页577"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_2_has_any_privilege
  type: syntax
  statement: "has_any_privilege(user,privilege)检查指定用户是否拥有ANY权限；同时查询多个权限时，拥有其中任一权限即返回true，返回Boolean。"
  source_anchor: "1.6.26 页577-578"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_2_has_any_privilege_list
  type: syntax
  statement: "has_any_privilege的privilege可选取值包括CREATE/ALTER/DROP/SELECT/INSERT/UPDATE/DELETE/TRUNCATE ANY TABLE、CREATE ANY SEQUENCE/INDEX/FUNCTION/PACKAGE/TYPE、EXECUTE ANY FUNCTION/PACKAGE，均可带WITH ADMIN OPTION。"
  source_anchor: "1.6.26 页578"
