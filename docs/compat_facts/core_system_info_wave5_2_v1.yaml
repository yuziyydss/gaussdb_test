- id: sysinfo_wave5_2_owner_implicit_ddl
  type: constraint
  statement: "ALTER、DROP、COMMENT、INDEX和VACUUM属于对象所有者固有权限；所有者及继承所有者权限者实际有权限，但只有通过GRANT显式授权后，权限查询函数才返回TRUE。"
  source_anchor: "1.6.26 页571"
  source_refs: &id001
  - w5_2_1_6_26
  status: confirmed
- id: sysinfo_wave5_2_has_any_column_privilege
  type: syntax
  statement: "has_any_column_privilege有(user,table,privilege)和(table,privilege)两个重载；user支持name/oid，table支持text/oid，返回Boolean。"
  source_anchor: "1.6.26 页571-572"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_2_has_any_column_privilege_types
  type: constraint
  statement: "has_any_column_privilege检查访问表任何列的权限；访问权限类型必须是SELECT、INSERT、UPDATE、COMMENT或REFERENCES的组合；拥有表级权限隐含拥有每列列级权限。"
  source_anchor: "1.6.26 页572"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_2_has_column_privilege
  type: syntax
