  source_anchor: "1.6.26 页572"
  source_refs: *id001
  status: confirmed
- id: sysinfo_wave5_2_has_column_privilege_types
  type: constraint
  statement: "has_column_privilege检查以特定方式访问一列；可用列名或属性号；访问权限类型必须是SELECT、INSERT、UPDATE、COMMENT或REFERENCES的组合；表级权限隐含每列权限。"
  source_anchor: "1.6.26 页572"
  source_refs: *id001
  status: confirmed
