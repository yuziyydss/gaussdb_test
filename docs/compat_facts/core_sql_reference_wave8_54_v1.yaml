document: 集中式版参考 / 1.13.9.54 CREATE TEXT SEARCH CONFIGURATION、1.13.7.40 ALTER TEXT SEARCH CONFIGURATION 与 1.13.10.43 DROP TEXT SEARCH CONFIGURATION（Wave 8-54）
