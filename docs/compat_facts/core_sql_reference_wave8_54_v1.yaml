facts:
- id: tsconf_wave8_54_create_purpose
  type: syntax
  statement: "CREATE TEXT SEARCH CONFIGURATION用于创建新的文本搜索配置；文本搜索配置指定一个文本搜索解析器及对应词典列表。该功能为内部使用功能，不建议用户使用。"
  source_anchor: "1.13.9.54 页1607"
  source_refs: &refcreate
  - w8_54_1_13_9_54
  status: confirmed
- id: tsconf_wave8_54_parser_only_limit
  type: constraint
  statement: "创建时如果仅声明PARSER，新配置没有从字符串类型到词典的映射，必须调用ALTER TEXT SEARCH CONFIGURATION创建词典映射后配置才生效。"
  source_anchor: "1.13.9.54 注意事项 页1607"
  source_refs: *refcreate
  status: confirmed
- id: tsconf_wave8_54_copy_semantics
  type: syntax
  statement: "声明COPY选项时会自动复制指定文本搜索配置的解析器、映射和配置选项等信息。"
  source_anchor: "1.13.9.54 注意事项 页1607"
  source_refs: *refcreate
  status: confirmed
- id: tsconf_wave8_54_schema_owner
  type: constraint
  statement: "指定模式名称时文本搜索配置在声明模式中创建，否则在当前模式创建；创建自定义文本搜索配置的用户自动成为其所有者。"
  source_anchor: "1.13.9.54 注意事项 页1607"
  source_refs: *refcreate
  status: confirmed
- id: tsconf_wave8_54_parser_copy_mutex
  type: constraint
  statement: "PARSER和COPY选项互相排斥；复制现有文本搜索配置时会同时复制其解析器。"
  source_anchor: "1.13.9.54 注意事项 页1607"
  source_refs: *refcreate
  status: confirmed
- id: tsconf_wave8_54_create_syntax
  type: syntax
  statement: "CREATE TEXT SEARCH CONFIGURATION name (PARSER=parser_name|COPY=source_config) [WITH ({configuration_option=value}[, ...])]；name可用模式限定，source_config为要复制的现有配置。"
  source_anchor: "1.13.9.54 语法/参数 页1607"
  source_refs: *refcreate
  status: confirmed
- id: tsconf_wave8_54_ngram_options
  type: constraint
  statement: "当前支持default和ngram解析器；default无配置参数，ngram支持gram_size（正整数1~4，默认2）、punctuation_ignore（是否忽略标点，默认true）和grapsymbol_ignore（是否忽略图形化字符，默认false）。"
  source_anchor: "1.13.9.54 配置参数 页1608"
  source_refs: *refcreate
  status: confirmed
- id: tsconf_wave8_54_create_examples
  type: behavior_oracle
  statement: "示例中可用(PARSER=ngram)创建ngram2并设置GRAM_SIZE=2、GRAPSYMBOL_IGNORE=false；也可用(COPY=ngram2)创建ngram3并重新指定相同参数。"
  source_anchor: "1.13.9.54 示例 页1608"
  source_refs: *refcreate
  status: confirmed
- id: tsconf_wave8_54_alter_purpose
  type: syntax
  statement: "ALTER TEXT SEARCH CONFIGURATION用于更改文本搜索配置定义，可将映射从字符串类型调整为字典，或修改配置名称、所有者和配置参数。"
  source_anchor: "1.13.7.40 页1331"
  source_refs: &refalt
  - w8_54_1_13_7_40
  status: confirmed
- id: tsconf_wave8_54_referenced_limit
  type: constraint
  statement: "当文本搜索配置已被引用（如用于创建索引）时，不允许用户修改该文本搜索配置。"
  source_anchor: "1.13.7.40 注意事项 页1331"
  source_refs: *refalt
  status: confirmed
- id: tsconf_wave8_54_owner_permission
  type: constraint
  statement: "要执行ALTER TEXT SEARCH CONFIGURATION，用户必须是配置所有者。"
  source_anchor: "1.13.7.40 注意事项 页1331"
  source_refs: *refalt
  status: confirmed
- id: tsconf_wave8_54_add_mapping
  type: syntax
  statement: "ADD MAPPING FOR为文本搜索配置增加字符串类型映射；ADD MAPPING FOR后任何一个字符串类型映射已存在于配置中时系统报错。"
  source_anchor: "1.13.7.40 ADD MAPPING 页1331"
  source_refs: *refalt
  status: confirmed
- id: tsconf_wave8_54_alter_mapping_semantics
  type: constraint
  statement: "ALTER MAPPING FOR会先清除已有字符串类型映射，再添加指定映射。"
  source_anchor: "1.13.7.40 ALTER MAPPING FOR 页1332"
  source_refs: *refalt
  status: confirmed
- id: tsconf_wave8_54_replace_semantics
  type: constraint
  statement: "ALTER MAPPING REPLACE...WITH...与ALTER MAPPING FOR...REPLACE...WITH...直接用new_dictionary替换old_dictionary；只有pg_ts_config_map中存在maptokentype与old_dictionary对应关系的元组时才会更新成功，否则不成功且无提示。"
  source_anchor: "1.13.7.40 REPLACE映射 页1332"
  source_refs: *refalt
  status: confirmed
- id: tsconf_wave8_54_drop_mapping
  type: constraint
  statement: "DROP MAPPING FOR删除当前文本搜索配置中指定字符串类型映射；若映射不存在且未指定IF EXISTS，数据库报错。"
  source_anchor: "1.13.7.40 DROP MAPPING 页1332"
  source_refs: *refalt
  status: confirmed
- id: tsconf_wave8_54_plan_cache_warning
  type: behavior_oracle
  statement: "修改文本搜索配置后，已缓存查询计划不会立即更新；PBE或自动参数化等含计划缓存场景下再次调用相关函数时返回结果可能未同步更新，需清空计划缓存。"
  source_anchor: "1.13.7.40 注意事项 页1332"
  source_refs: *refalt
  status: confirmed
- id: tsconf_wave8_54_mapping_syntax
  type: syntax
  statement: "ALTER TEXT SEARCH CONFIGURATION支持ADD MAPPING FOR、ALTER MAPPING FOR...REPLACE、ALTER MAPPING FOR...WITH、ALTER MAPPING REPLACE和DROP MAPPING [IF EXISTS] FOR；多字典按指定顺序搜索。"
  source_anchor: "1.13.7.40 映射语法/参数 页1332-1333"
  source_refs: *refalt
  status: confirmed
- id: tsconf_wave8_54_metadata_syntax
  type: syntax
  statement: "ALTER TEXT SEARCH CONFIGURATION支持OWNER TO new_owner、RENAME TO new_name和SET SCHEMA new_schema，分别修改所有者、名称和模式。"
  source_anchor: "1.13.7.40 元数据语法 页1333"
  source_refs: *refalt
  status: confirmed
- id: tsconf_wave8_54_set_reset_syntax
  type: syntax
  statement: "ALTER TEXT SEARCH CONFIGURATION name SET ({configuration_option=value}[, ...])和RESET ({configuration_option}[, ...])用于修改或重置配置属性；可用配置项参见CREATE TEXT SEARCH CONFIGURATION。"
  source_anchor: "1.13.7.40 SET/RESET 页1333"
  source_refs: *refalt
  status: confirmed
- id: tsconf_wave8_54_drop_syntax
  type: syntax
  statement: "DROP TEXT SEARCH CONFIGURATION [IF EXISTS] name [CASCADE|RESTRICT]；仅文本搜索配置所有者可执行。IF EXISTS在配置不存在时不删除并返回NOTICE；CASCADE级联删除依赖对象，RESTRICT在存在依赖对象时拒绝删除，未指定默认RESTRICT。"
  source_anchor: "1.13.10.43 页1694-1695"
  source_refs: &refdrop
  - w8_54_1_13_10_43
  status: confirmed
open_questions:
- id: tsconf_wave8_54_oq_runtime
  statement: "文本搜索配置在真实解析器、映射、计划缓存、依赖索引和DROP级联组合下的行为与错误矩阵需授权环境实机验证。"
  status: open
