facts:
- id: tools_wave8_7_encrypt_intro
  type: syntax
  statement: "gs_encrypt用于对输入的明文字符串执行加密操作。"
  source_anchor: "5.10.1 页4027"
  source_refs: &refb1
  - w8_7_5_10
  status: confirmed
- id: tools_wave8_7_encrypt_history
  type: environment
  statement: "建议将Linux环境变量HISTCONTROL设为ignorespace，并在gs_encrypt命令前加空格执行，避免命令历史记录明文。"
  source_anchor: "5.10.1 页4027"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_7_encrypt_key
  type: constraint
  statement: "gs_encrypt的-k PASSWORD有效范围为8~128字符，且至少包含大写字母、小写字母、数字和特殊字符中的三种。"
  source_anchor: "5.10.1 页4027"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_7_encrypt_vector
  type: constraint
  statement: "gs_encrypt的-v VectorValue用于密码单向哈希加扰，字符串长度必须等于16。"
  source_anchor: "5.10.1 页4027"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_7_encrypt_file_prefix
  type: syntax
  statement: "gs_encrypt的-f FilePrefix指定cipher和rand文件前缀；文件必须位于$GAUSSHOME/bin目录下。"
  source_anchor: "5.10.1 页4027"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_7_encrypt_base64
  type: constraint
  statement: "gs_encrypt的-B Value和-D Value分别提供base64编码明文密钥和随机数；base64编码前的字符串长度必须为16。"
  source_anchor: "5.10.1 页4028"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_7_encrypt_plaintext_limit
  type: constraint
  statement: "单次加密的明文字符串最大长度为335字节；未传入时进入交互式输入，推荐交互式输入。"
  source_anchor: "5.10.1 页4027"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_7_encrypt_random_iv
  type: behavior_oracle
  statement: "使用明文key和vector时每次加密的IV随机生成，相同key、vector和明文会得到不同密文。"
  source_anchor: "5.10.1 页4028"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_7_sdf_checker_intro
  type: syntax
  statement: "gs_sdf_checker用于快速检测基于鲲鹏TEE内生密钥管理或sdf_kms加密机时，动态库是否满足内核要求。"
  source_anchor: "5.10.2 页4029"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_7_sdf_checker_params
  type: syntax
  statement: "gs_sdf_checker支持-h、-i <kek_id>、-g <GUC_PARAM>和-k <KMS>；当前-k仅支持sdf_kms。"
  source_anchor: "5.10.2 页4029"
  source_refs: *refb1
  status: confirmed
open_questions:
- id: tools_wave8_7_oq_runtime
  statement: "gs_encrypt边界值、随机IV输出与gs_sdf_checker在真实sdf_kms动态库下的行为需授权环境实机验证。"
  status: open
