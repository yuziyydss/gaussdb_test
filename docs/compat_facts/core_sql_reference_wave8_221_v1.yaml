- id: sys_table_wave8_221_overview
  type: syntax
  statement: "系统表和系统视图概述：系统表存放结构元数据是GaussDB数据库系统运行控制信息来源核心组成部分；系统视图提供查询系统表和访问数据库内部状态方法；系统表和系统视图要么只对管理员可见要么对所有用户可见；不建议用户修改系统表和系统视图权限/禁止增删改操作/人为修改导致系统异常甚至数据库不可用；ADM类视图默认仅系统管理员访问（部分公开非敏感字段）/DB类视图查询当前用户有权限访问的对象普通用户可访问/MY类视图查询当前用户所属对象。"
  source_anchor: "8.1 概述 页4887"
  source_refs: &refw8221
  - w8_221_8
  status: confirmed
