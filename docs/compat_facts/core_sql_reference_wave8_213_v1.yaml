- id: guc_wave8_213_product_version
  type: syntax
  statement: "云服务版本号参数：product_version SIGHUP字符串默认空云服务产品版本号（≤50字符/不能包含|;&$><`\\!和换行符）；hotpatch_version SIGHUP字符串默认空热补丁版本号（≤1500字符/不能包含|;&$><`\\!和换行符）。"
  source_anchor: "7.3.17.3 云服务产品版本号 页4649"
