  - w8_213_7_3
  status: confirmed
- id: guc_wave8_213_fault_tolerance
  type: constraint
  statement: "容错性参数：exit_on_error SUSET布尔型默认off ERROR升级为PANIC产生core堆栈（问题定位和业务测试用/PDB级别）；restart_after_crash SIGHUP布尔型默认on后端线程崩溃时自动重新初始化（管理工具xCAT场景提高可用性/off让管理工具获取控制权）；omit_encoding_error USERSET布尔型默认off UTF-8字符编码转换错误打印日志忽略以?代替/on打印日志/off打印终端。"
  source_anchor: "7.3.18 容错性 页4649-4651"
  source_refs: *refw8213
  status: confirmed
- id: guc_wave8_213_cn_buffer_remote_read
  type: syntax
  statement: "缓冲/远程读参数：cn_send_buffer_size POSTMASTER整型8~128kB默认8数据库主节点发送数据缓存区大小；data_sync_retry POSTMASTER布尔型默认off fsync到磁盘失败后是否继续运行——on重试继续运行/off直接panic停止（某些OS下fsync失败重试不报错导致数据丢失）；remote_read_mode POSTMASTER枚举off/non_authentication/authentication默认authentication远程读功能开关（主机读取页面失败时从备机读取/authentication证书认证/non_authentication不认证）。"
  source_anchor: "7.3.18 容错性 页4651-4652"
  source_refs: *refw8213
  status: confirmed
- id: guc_wave8_213_connection_pool
  type: syntax
  statement: "连接池参数：cache_connection SIGHUP布尔型默认on是否回收连接池连接——on回收连接池连接/off会话执行语句结束后直接清理连接导致业务频繁建立连接性能损耗（集中式中该参数不生效）。"
  source_anchor: "7.3.19 连接池参数 页4652"
  source_refs: *refw8213
  status: confirmed
- id: guc_wave8_213_transaction_isolation_read_only
  type: constraint
  statement: "事务隔离/只读参数：transaction_isolation USERSET字符串默认default当前事务隔离级别——serializable等价repeatable read/read committed/read uncommitted等价read committed/repeatable read/支持大小写和空格敏感；M兼容m_format_dev_version=s2时支持SERIALIZABLE/READ-COMMITTED等大写格式（SET [local|session|@@session.]修改会话级事务特性同时修改default值/SET @@transaction_isolation=value设置下一个事务不允许显式事务内使用/查询tx_isolation效果相同）；transaction_read_only USERSET布尔型默认off当前事务只读（恢复过程或备机固定on/CDB固定为default_transaction_read_only/设置pdb_transaction_read_only后以其值为准/M兼容s2时SET @@transaction_read_only=value设置下一事务访问模式）。"
  source_anchor: "7.3.20 事务 页4652-4654"
  source_refs: *refw8213
  status: confirmed
- id: guc_wave8_213_autocommit
  type: constraint
  statement: "autocommit：USERSET布尔型默认on自动提交模式——on每个单独语句隐式提交/off必须commit提交或rollback取消（off修改为on时对所有未完成事务执行自动commit/M兼容支持修改为off否则只能on/pg_settings不能查询需SHOW autocommit查看/要求打开内部自动提交模式\\echo :AUTOCOMMIT确认）。"
  source_anchor: "7.3.20 事务 页4654-4655"
  source_refs: *refw8213
  status: confirmed
- id: guc_wave8_213_maintenance_misc
  type: syntax
  statement: "维护/杂项参数：xc_maintenance_mode SUSET布尔型默认off维护模式（谨慎打开避免数据不一致/仅方式三设置/一般供维护人员排查问题）；allow_concurrent_tuple_update USERSET布尔型默认on允许并发更新；enable_show_any_tuples USERSET布尔型默认off只读事务中表中元组所有版本可见（分析用/toast场景reindex+DML后可能报missing chunk number）；replication_type POSTMASTER整型0~3默认1部署模式——1一主多备全场景覆盖推荐/2单主机无法扩展备机/0和3预留（CM部署参数用户不能设置）；pgxc_node_name POSTMASTER字符串默认当前节点名称指定节点名称（备机请求主机流复制槽名/最大61字符超过截断/不建议修改导致连接实例失败）。"
  source_anchor: "7.3.20 事务 页4655-4657"
  source_refs: *refw8213
  status: confirmed
- id: guc_wave8_213_snapshot_transaction_opt
  type: syntax
  statement: "快照/事务优化参数：enable_defer_calculate_snapshot SIGHUP布尔型默认on延迟计算快照xmin和oldestxmin——on延迟计算（执行1000事务或间隔1s才触发/减少高负载开销但oldestxmin推进较慢影响垃圾回收）/off实时计算（增加开销）；seqscan_csn_cache_num SIGHUP整型0~1000默认100 csn cache大小（仅seqscan MVCC快照扫描heap页面可见性使用/0不使用csn缓存）；enable_interp_reuse_tran USERSET布尔型默认on存储过程嵌套异常块子事务复用（需behavior_compat_options含plstmt_implicit_savepoint/PDB级别）；enable_lightweight_transaction SIGHUP布尔型默认on点查语句轻量事务优化；verify_clog_csnlog_mode SIGHUP枚举off/warning/error/panic默认warning（新装）或off（升级）Clog与Csnlog页面校验报错级别和告警输出。"
  source_anchor: "7.3.20 事务 页4657-4659"
  source_refs: *refw8213
  status: confirmed
