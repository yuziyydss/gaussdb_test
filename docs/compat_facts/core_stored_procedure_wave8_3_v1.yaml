facts:
- id: sp_lock_wave8_3_read_lock
  type: syntax
  statement: "存储过程执行过程中会获取读锁；事务提交或会话处于IDLE、IDLE IN TRANSACTION、IDLE IN TRANSACTION(ABORTED)时释放当前session读锁。"
  source_anchor: "3.10 页2627"
  source_refs: &refb1
  - w8_3_3_10
  status: confirmed
- id: sp_lock_wave8_3_write_lock
  type: constraint
  statement: "如果当前事务包含存储过程写锁，不会释放锁。"
  source_anchor: "3.10 页2627"
  source_refs: *refb1
  status: confirmed
- id: sp_lock_wave8_3_ddl_deadlock
  type: constraint
  statement: "高并发DDL场景下可能偶现死锁，需要手动重试DDL；强烈不推荐在单个事务内执行多条DDL语句。"
  source_anchor: "3.10 页2627"
  source_refs: *refb1
  status: confirmed
- id: sp_lock_wave8_3_ddl_write_lock
  type: constraint
  statement: "存储过程DDL在事务结束时对存储过程对象加写锁；存储过程错误捕获语句无法捕获DDL死锁。"
  source_anchor: "3.10 页2627"
  source_refs: *refb1
  status: confirmed
- id: sp_lock_wave8_3_package_read_lock
  type: constraint
  statement: "执行存储过程会对类型依赖的PACKAGE加读锁；存储过程DDL变更因依赖该PACKAGE会被读锁阻塞。"
  source_anchor: "3.10 页2627"
  source_refs: *refb1
  status: confirmed
- id: sp_lock_wave8_3_invalidation_deadlock
  type: behavior_oracle
  statement: "开启失效重编译相关参数后，变更表会触发级联失效；并发访问依赖该表的对象可能在事务提交/级联失效时触发死锁报错。"
  source_anchor: "3.10 页2628-2629"
  source_refs: *refb1
  status: confirmed
- id: sp_cursor_wave8_3_definition
  type: syntax
  statement: "游标是指向存储过程上下文区域的句柄或指针，用于保存SQL执行上下文并控制上下文区域变化。"
  source_anchor: "3.11 页2631-2632"
  source_refs: &refb2
  - w8_3_3_11
  status: confirmed
- id: sp_cursor_wave8_3_jdbc_returns
  type: constraint
  statement: "存储过程用returns返回游标时，JDBC调用返回的游标不可用；使用out出参不受影响。"
  source_anchor: "3.11 页2632"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_commit_rollback_cache
  type: behavior_oracle
  statement: "存储过程内commit/rollback时，显式游标为保证仍可用会缓存所有数据；游标数据量大时耗时可能较长。"
  source_anchor: "3.11 页2632"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_rollback_fetch_error
  type: behavior_oracle
  statement: "在存储过程内修改表数据后打开相关游标，rollback后继续FETCH游标数据会产生报错。"
  source_anchor: "3.11 页2632"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_extra_output_vars
  type: behavior_oracle
  statement: "FETCH游标时输出变量个数大于查询结果列数，多余变量会被赋空值，不会报错。"
  source_anchor: "3.11 页2632"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_hold_cursor_guc
  type: environment
  statement: "开启forbid_hold_cursor_with_forupdate后，带FOR UPDATE/FOR NO KEY UPDATE/FOR SHARE/FOR KEY SHARE的游标在事务提交或回滚后的下次循环访问时报错。"
  source_anchor: "3.11 页2632"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_sql_usage
  type: syntax
  statement: "非查询语句使用隐式游标；单行查询可用隐式或显式游标；多行查询必须使用显式游标。"
  source_anchor: "3.11 页2632"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_explicit_steps
  type: syntax
  statement: "显式游标处理包含六个PL/SQL步骤：定义静态或动态游标、打开游标、提取数据、处理记录、继续处理直到无记录、关闭游标。"
  source_anchor: "3.11 页2632-2635"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_static_params
  type: constraint
  statement: "静态游标参数只能为输入参数，可用:=、=或default定义默认值；语法上支持输出参数但行为与输入参数一致；游标在exception内部自动关闭。"
  source_anchor: "3.11 页2633"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_dynamic_cursor
  type: syntax
  statement: "动态游标是ref游标，先定义ref游标类型和游标变量，再通过OPEN FOR动态绑定SELECT语句。"
  source_anchor: "3.11 页2633-2634"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_open_semantics
  type: constraint
  statement: "OPEN静态游标会执行对应SELECT并把指针指向结果集首部；带FOR UPDATE时还会锁定对应数据行；PL/SQL程序不能用OPEN重复打开同一个游标。"
  source_anchor: "3.11 页2634"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_implicit_attributes
  type: behavior_oracle
  statement: "隐式游标属性包括SQL%FOUND、SQL%NOTFOUND、SQL%ROWCOUNT；SQL%ISOPEN总是FALSE，因为SQL执行完立即关闭隐式游标。"
  source_anchor: "3.11 页2638"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_compat_cursor_guc
  type: environment
  statement: "A兼容模式且behavior_compat_options含compat_cursor时，隐式游标跨存储过程有效，且其属性受savepoint/commit/rollback影响并重置为默认值。"
  source_anchor: "3.11 页2638"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_for_as_loop
  type: syntax
  statement: "FOR AS循环适用于静态游标，简化掉OPEN/FETCH/CLOSE；循环内不能更新查询的表，loop_name自动定义且只在循环内有效。"
  source_anchor: "3.11 页2639"
  source_refs: *refb2
  status: confirmed
- id: sp_cursor_wave8_3_shared_attributes
  type: constraint
  statement: "%FOUND、%NOTFOUND和%ROWCOUNT访问同一个内部变量；事务和匿名块不支持多个游标同时访问这些属性。"
  source_anchor: "3.11 页2639"
  source_refs: *refb2
  status: confirmed
open_questions:
- id: sp_wave8_3_oq_lock_cursor_runtime
  statement: "失效重编译DDL死锁、游标缓存耗时和FOR UPDATE游标在事务边界后的行为需要授权环境实机验证。"
  status: open
