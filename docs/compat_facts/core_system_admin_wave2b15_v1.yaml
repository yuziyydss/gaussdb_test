- id: wave2b15_gstrace_show_traced_func
  type: syntax
  statement: "gstrace_show_traced_func(scope)查看正在跟踪函数的状态；需MONADMIN或SYSADMIN权限，scope仅支持LOCAL，输出函数名称、so_index、so_name、so_offset、level、module、if_traced、if_hp_conflict、if_blacklist和ref_count。"
  source_anchor: "1.6.27.17 页800-802"
  source_refs: *id001
  status: confirmed
- id: wave2b15_gstrace_show_traced_func_semantics
  type: behavior_oracle
  statement: "gstrace_show_traced_func中if_traced表示函数汇编是否有跳转跟踪指令，if_hp_conflict表示是否因热补丁冲突自动取消跟踪，if_blacklist表示函数是否在跟踪函数黑名单中，ref_count表示函数被跟踪的引用次数。"
  source_anchor: "1.6.27.17 页801-802"
  source_refs: *id001
  status: confirmed
