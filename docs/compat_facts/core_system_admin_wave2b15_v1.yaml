  source_anchor: "1.6.27.17 页802-803"
  source_refs: *id001
  status: confirmed
- id: wave2b15_gstrace_so_index_semantics
  type: syntax
  statement: "GSTrace函数输出中so_index为函数所在So序列号：0表示gaussdb bin，1表示libgtmclient.so；so_name为So名称，so_offset为函数在So中的偏移量。"
  source_anchor: "1.6.27.17 页800-802"
  source_refs: *id001
  status: confirmed
- id: wave2b15_last_demote_spent_time
  type: constraint
  statement: "gs_last_demote_spent_time()获取主降备关键步骤耗时，覆盖线程退出及初始化、checkpoint、共享内存退出及初始化、双写初始化和bufferpool初始化等，返回setof record。"
  source_anchor: "1.6.27.17 页803-804"
  source_refs: *id001
  status: confirmed
- id: wave2b15_last_demote_spent_time_query_boundary
  type: constraint
  statement: "gs_last_demote_spent_time的主降备信息需在执行主降备操作的数据库主节点上查询；数据库间及数据库内switchover主降备成功后可查询相关信息；信息存储在内存，重启后重置。"
  source_anchor: "1.6.27.17 页803-804"
  source_refs: *id001
  status: confirmed
- id: wave2b15_last_demote_steps
  type: syntax
  statement: "gs_last_demote_spent_time输出的key_step_name包括thread_exit、checkpoint、shmem_exit、shmem_init、bufferpool_init、dw_init和thread_init，spent_time为主降备关键步骤耗时。"
  source_anchor: "1.6.27.17 页804"
  source_refs: *id001
  status: confirmed
- id: wave2b15_tcache_memory_flush
  type: syntax
  statement: "gs_tcache_memory_flush()手动唤醒空闲业务线程和stream业务线程，并在线程上执行mallctl(\"thread.tcache.flush\",NULL,NULL,NULL,0)，主动清理jemalloc的tcache缓存；成功返回t，失败返回f。"
  source_anchor: "1.6.27.17 页804"
  source_refs: *id001
  status: confirmed
- id: wave2b15_tcache_memory_flush_boundaries
  type: constraint
  statement: "gs_tcache_memory_flush仅在开启线程池时生效；仅SYSADMIN用户可用；可降低other memory，但只消减jemalloc tcache，对大量硬解析引起内存碎片等其他原因导致的other memory升高无效。"
  source_anchor: "1.6.27.17 页804"
  source_refs: *id001
  status: confirmed
