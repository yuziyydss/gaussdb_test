  type: syntax
  statement: "gstrace_show_mangled_func(scope,function_name)查看指定函数mangle后的名称；需MONADMIN或SYSADMIN权限，scope仅支持LOCAL，function_name仅支持系统函数名称，输出函数名称、so_index、so_name和so_offset。"
  source_anchor: "1.6.27.17 页802"
  source_refs: *id001
  status: confirmed
