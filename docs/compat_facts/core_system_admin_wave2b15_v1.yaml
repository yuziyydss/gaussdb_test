- id: wave2b15_gstrace_reg_sql_params
  type: syntax
  statement: "gstrace_reg_sql的scope必选且当前仅支持LOCAL；unique_sql_id必选，为通过statement_history表查询到的unique_query_id。"
  source_anchor: "1.6.27.17 页796"
  source_refs: *id001
  status: confirmed
- id: wave2b15_gstrace_reg_func
  type: constraint
  statement: "gstrace_reg_func(scope,function_name,so_index,so_offset,level)添加跟踪函数；每个数据库实例最多支持1000个函数跟踪，需MONADMIN或SYSADMIN权限，返回text表示成功或失败。"
  source_anchor: "1.6.27.17 页796-797"
  source_refs: *id001
  status: confirmed
- id: wave2b15_gstrace_reg_func_params
  type: syntax
  statement: "gstrace_reg_func的scope仅支持LOCAL；function_name仅支持系统函数名称；so_index和so_offset可选，但填入so_index时必须填so_offset；level必选，'0'只跟踪函数本身，'1'跟踪函数及其子函数。"
  source_anchor: "1.6.27.17 页796"
  source_refs: *id001
  status: confirmed
