facts:
- id: reassign_owned_wave8_64_purpose
  type: syntax
  statement: "REASSIGN OWNED用于修改数据库对象的所有者，将旧角色的数据库对象所有者改为新角色；常用于在删除角色之前的准备工作。"
  source_anchor: "1.13.18.1 功能描述/注意事项 页1780"
  source_refs: &refreassign
  - w8_64_1_13_18_1
  status: confirmed
- id: reassign_owned_wave8_64_syntax
  type: syntax
  statement: "语法为REASSIGN OWNED BY old_role[, ...] TO new_role；old_role为旧属主的角色名，new_role为将要成为这些对象属主的新角色的名称。"
  source_anchor: "1.13.18.1 语法格式/参数说明 页1780-1781"
  source_refs: *refreassign
  status: confirmed
- id: reassign_owned_wave8_64_privileges
  type: constraint
  statement: "执行REASSIGN OWNED需要有原角色和目标角色上的权限。"
  source_anchor: "1.13.18.1 注意事项 页1780"
  source_refs: *refreassign
  status: confirmed
- id: reassign_owned_wave8_64_initial_user
  type: constraint
  statement: "只有初始用户才可以通过REASSIGN OWNED语法将属主修改为初始化用户。"
  source_anchor: "1.13.18.1 参数说明 new_role 页1781"
  source_refs: *refreassign
  status: confirmed
- id: reassign_owned_wave8_64_example
  type: behavior_oracle
  statement: "示例中创建test_jim和test_tom用户后同名模式属主为同名用户；REASSIGN OWNED BY test_jim TO test_tom执行后test_jim模式的属主更换为test_tom；最后DROP USER test_jim, test_tom CASCADE删除用户（相关链接DROP OWNED）。"
  source_anchor: "1.13.18.1 示例 页1781"
  source_refs: *refreassign
  status: confirmed
- id: refresh_incr_mv_wave8_64_purpose
  type: syntax
  statement: "REFRESH INCREMENTAL MATERIALIZED VIEW会以增量刷新的方式对物化视图进行刷新。"
  source_anchor: "1.13.18.2 功能描述 页1781"
  source_refs: &refincr
  - w8_64_1_13_18_2
  status: confirmed
- id: refresh_incr_mv_wave8_64_only_incremental
  type: constraint
  statement: "增量刷新仅支持增量物化视图。"
  source_anchor: "1.13.18.2 注意事项 页1781"
  source_refs: *refincr
  status: confirmed
- id: refresh_incr_mv_wave8_64_privileges
  type: constraint
  statement: "刷新物化视图需要当前用户拥有基表的SELECT权限。"
  source_anchor: "1.13.18.2 注意事项 页1781"
  source_refs: *refincr
  status: confirmed
- id: refresh_incr_mv_wave8_64_syntax
  type: syntax
  statement: "语法为REFRESH INCREMENTAL MATERIALIZED VIEW mv_name；mv_name为要刷新的物化视图的名称。"
  source_anchor: "1.13.18.2 语法格式/参数说明 页1782"
  source_refs: *refincr
  status: confirmed
- id: refresh_incr_mv_wave8_64_example
  type: behavior_oracle
  statement: "示例中ASTORE表创建CREATE INCREMENTAL MATERIALIZED VIEW my_imv后向基表INSERT两行，REFRESH INCREMENTAL MATERIALIZED VIEW my_imv增量刷新，SELECT可见2行，最后DROP MATERIALIZED VIEW与DROP TABLE清理（相关链接ALTER/CREATE INCREMENTAL/CREATE MATERIALIZED VIEW、CREATE TABLE、DROP MATERIALIZED VIEW、REFRESH MATERIALIZED VIEW）。"
  source_anchor: "1.13.18.2 示例 页1782"
  source_refs: *refincr
  status: confirmed
