  source_anchor: "1.13.18.3 注意事项 页1782"
  source_refs: *refmv
  status: confirmed
- id: refresh_mv_wave8_64_syntax
  type: syntax
  statement: "语法为REFRESH MATERIALIZED VIEW mv_name；mv_name为要刷新的物化视图的名称。"
  source_anchor: "1.13.18.3 语法格式/参数说明 页1783"
  source_refs: *refmv
  status: confirmed
- id: refresh_mv_wave8_64_example
  type: behavior_oracle
  statement: "示例中对全量物化视图my_mv和增量物化视图my_imv分别执行REFRESH MATERIALIZED VIEW均完成全量刷新，最后DROP MATERIALIZED VIEW与DROP TABLE清理（相关链接含REFRESH INCREMENTAL MATERIALIZED VIEW等）。"
  source_anchor: "1.13.18.3 示例 页1783"
  source_refs: *refmv
  status: confirmed
- id: refresh_sysobj_wave8_64_purpose
  type: syntax
  statement: "REFRESH SYSTEM OBJECT将系统对象的版本信息刷新到系统表GS_SYSTEM_OBJECTS_VERSION中，用于升级时判断系统对象的变化情况。"
  source_anchor: "1.13.18.4 功能描述 页1783"
  source_refs: &refsys
  - w8_64_1_13_18_4
  status: confirmed
- id: refresh_sysobj_wave8_64_internal
  type: constraint
  statement: "REFRESH SYSTEM OBJECT从507.0之前的版本升级时调用；属于内部语法，不建议用户使用。"
  source_anchor: "1.13.18.4 功能描述 页1783"
  source_refs: *refsys
  status: confirmed
- id: refresh_sysobj_wave8_64_upgrade_mode
  type: constraint
  statement: "REFRESH SYSTEM OBJECT仅支持升级阶段调用，即在GUC参数upgrade_mode不为0时此语句可被执行。"
  source_anchor: "1.13.18.4 注意事项 页1783"
  source_refs: *refsys
  status: confirmed
- id: refresh_sysobj_wave8_64_initial_user
  type: constraint
  statement: "只有初始用户有权限执行REFRESH SYSTEM OBJECT语句。"
  source_anchor: "1.13.18.4 注意事项 页1784"
  source_refs: *refsys
  status: confirmed
- id: refresh_sysobj_wave8_64_syntax
  type: syntax
  statement: "语法为REFRESH SYSTEM OBJECT；语句无其他参数。"
  source_anchor: "1.13.18.4 语法格式 页1784"
  source_refs: *refsys
  status: confirmed
