facts:
- id: tools_wave8_18_overview
  type: syntax
  statement: "数据库运维管理工具覆盖信息收集、参数设置、实例维护、服务控制、ETCD/DCC切换、控制文件检查、事务文件重置、节点命令执行、etcd管理、gaussdb主进程管理、Kerberos认证、节点文件传输与并行命令、故障主机替换、共享存储、GNS维护、数据抢救、SSH互信、黑匣子诊断以及统计信息、性能采集、DCF和硬件辅助工具。"
  source_anchor: "5.4.1 页3655-3657"
  source_refs: &refb1
  - w8_18_5_4
  status: confirmed
- id: tools_wave8_18_collector_scope
  type: syntax
  statement: "gs_collector用于数据库故障定位，收集OS信息、数据库日志、系统表/视图信息和配置文件；集中式单节点不支持该工具。"
  source_anchor: "5.4.2 页3657-3661"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_collector_speed_limit
  type: constraint
  statement: "gs_collector的--speed-limit必须为非负整数，单位MB/s；为避免过高磁盘或网络I/O导致ETCD或DN故障，该值应不超过相关磁盘I/O与网络I/O速率最小值的1/3。"
  source_anchor: "5.4.2 页3665"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_guc_scope
  type: syntax
  statement: "gs_guc用于设置gaussdb.conf、gs_hba.conf和pdb.conf中的参数，支持check、set、reload、encrypt和generate等命令。"
  source_anchor: "5.4.3 页3666-3669"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_guc_constraints
  type: constraint
  statement: "gs_guc不支持参数值中包含#和反引号；同一配置参数多行同时生效时只有最后一行会被设置；reload模式生效存在短暂延迟，极短时间内各实例参数可能不一致。"
  source_anchor: "5.4.3 页3667"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_om_scope
  type: syntax
  statement: "gs_om是系统内部工具，不支持单独调用；它支持启动、停止、查询状态、切换主备、修改IP、生成静态配置文件、SSL证书替换、日常巡检和耗时评估等数据库维护功能。"
  source_anchor: "5.4.4 页3674-3676"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_om_switch_prereq
  type: constraint
  statement: "gs_om switch是维护操作，执行前需确保数据库实例状态正常、所有业务结束，并使用pg_get_senders_catchup_time视图确认无主备追赶。"
  source_anchor: "5.4.4 页3674-3675"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_om_change_mode_constraints
  type: constraint
  statement: "gs_om change_mode在dcf与quorum模式间切换时，DN副本数小于3不支持切换；初始安装为dcf模式的实例不建议切换到quorum；dcf模式带logger部署形态不支持切换为quorum。"
  source_anchor: "5.4.4 页3675"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_ctl_scope
  type: syntax
  statement: "gs_ctl支持init、start、restart、stop、reload、status、build、restore、failover、switchover、query、hotpatch、member、changerole和waltruncate等数据库服务控制命令。"
  source_anchor: "5.4.5 页3693-3694"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_ctl_safety
  type: constraint
  statement: "通常不建议用户直接通过gs_ctl启动数据库实例或执行主备切换，因为gs_ctl内部不进行多数派副本一致性校验，严重时可能导致双主或数据丢失；应使用cm_ctl执行相关操作。"
  source_anchor: "5.4.5 页3694"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_switch_ddb_topology
  type: constraint
  statement: "gs_switch_ddb仅支持集中式，要求各实例状态正常且调用节点不能被删；切换需提供目标拓扑XML，DCC切换到ETCD时目标CMS拓扑需满足原有安装条件，ETCD切换到DCC时每个AZ至少有一个CMS。"
  source_anchor: "5.4.6 页3711"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_controldata
  type: syntax
  statement: "gs_controldata用于显示数据目录下pg_control文件信息；-P可打印PDB控制文件信息，但未预安装初始化多租特性时不存在PDB控制文件，尝试打印会报错。"
  source_anchor: "5.4.7 页3712"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_resetxlog_risk
  type: constraint
  statement: "gs_resetxlog是高危操作，使用后数据库可能包含不完整数据；仅建议在数据库无法启动且用户强烈期望启动的场景使用，执行前需停止数据库，且当前工具不支持DCF模式。"
  source_anchor: "5.4.8 页3713"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_node_execution
  type: constraint
  statement: "gs_ssh是系统内部工具，用于在数据库各节点执行相同命令，要求agent服务正常、命令可执行且返回内容不能过多或无限制；包含敏感信息的命令应通过管道符传入，避免命令在进程信息中暴露。"
  source_anchor: "5.4.9 页3714-3715"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_etcd_io
  type: environment
  statement: "etcd基于Raft一致性算法并依赖频繁磁盘写入，建议磁盘单次I/O响应时间在2ms以内；若I/O时延持续超过10ms，可能影响数据库实例读写业务及仲裁功能。"
  source_anchor: "5.4.10 页3715-3716"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_gaussdb_process
  type: syntax
  statement: "gaussdb是数据库主进程，一个系统可使用不同数据目录和端口同时运行多个gaussdb进程；启动时必须通过-D指定数据目录，单用户模式用于初始化和灾难恢复等特殊场景。"
  source_anchor: "5.4.12 页3728-3729"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_replace_scope
  type: syntax
  statement: "gs_replace用于将故障主机替换为正常主机或将故障实例修复为正常实例，支持不换IP替换和换IP温备替换两类场景；集中式单节点不支持该工具。"
  source_anchor: "5.4.24 页3741-3742"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_rescue_boundary
  type: constraint
  statement: "gs_rescue仅适用于数据库无法启动且无备份、无备机、无其他恢复手段的极端场景；数据库应处于离线状态，只解析落盘数据且不解析Xlog/undo内数据，离线解析无法保证数据一致性。"
  source_anchor: "5.4.27 页3751-3753"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_gns_maintenance
  type: behavior_oracle
  statement: "gns_ctl用于计划内无损透明维护，通过gns_server通知JDBC客户端暂存新事务并等待运行中事务结束；执行gns_ctl stop后不会自动重启DN、节点或数据库实例，需要手动执行cm_ctl start。"
  source_anchor: "5.4.26 页3749-3751"
  source_refs: *refb1
  status: confirmed
- id: tools_wave8_18_auxiliary_diagnostics
  type: syntax
  statement: "辅助运维工具包括：dbe_stats_tools.py导出/导入库级统计信息并生成gs_stats.csv与gs_stats.meta；gs_perf_service采集on-cpu/off-cpu和多核多线程火焰图；dcf_tool支持dump、create和truncate DCF数据文件。"
  source_anchor: "5.4.31-5.4.33 页3777-3781"
  source_refs: *refb1
  status: confirmed
open_questions:
