facts:
- id: user_wave8_50_purpose
  type: syntax
  statement: "CREATE USER用于创建一个带有指定密码的新用户。"
  source_anchor: "1.13.9.58 页1629"
  source_refs: &refb1
  - w8_50_1_13_9_58
  status: confirmed
- id: user_wave8_50_authentication
  type: syntax
  statement: "用户是GaussDB数据库认证的基本元素；用户可通过正确用户名和密码登录数据库，并可被授予不同权限执行不同操作。"
  source_anchor: "1.13.9.58 页1630"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_default_login
  type: constraint
  statement: "通过CREATE USER创建的用户默认具有LOGIN权限。"
  source_anchor: "1.13.9.58 注意事项 页1630"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_auto_schema
  type: behavior_oracle
  statement: "CREATE USER创建用户时，系统会在执行该命令的数据库中为该用户创建一个同名SCHEMA。"
  source_anchor: "1.13.9.58 注意事项 页1630"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_admin_schema_owner
  type: constraint
  statement: "系统管理员在普通用户同名SCHEMA下创建的对象，所有者为该SCHEMA的同名用户（非系统管理员）。"
  source_anchor: "1.13.9.58 注意事项 页1630"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_main_syntax
  type: syntax
  statement: "CREATE USER user_name支持WITH选项、ENCRYPTED/UNENCRYPTED、PASSWORD/IDENTIFIED BY、密码EXPIRED/DISABLE和PASSWORD EXPIRE INTERVAL；option可设置SYSADMIN、MONADMIN、OPRADMIN、POLADMIN、AUDITADMIN、CREATEDB、CREATEROLE、INHERIT、LOGIN、REPLICATION、PERSISTENCE、连接限制、有效期、资源池、空间限额、角色成员、默认表空间和PROFILE等。"
  source_anchor: "1.13.9.58 语法格式 页1630"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_name_rules
  type: constraint
  statement: "user_name最长63个字符，超长截断保留前63个；包含大写字母时自动转为小写，需要大写名称须双引号括起。标识符只能由大小写字母、下划线、数字或美元符号组成且以字母或下划线开头；redisuser为内部保留对象。"
  source_anchor: "1.13.9.58 user_name 页1632"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_password_rules
  type: constraint
  statement: "密码默认不少于8字符，不能与用户名及用户名倒序相同；至少包含大写字母、小写字母、数字和非字母数字字符四类中的三类，非字母数字限定为~!@#$%^&*()-_=+\\|[{}];:,<.>/?等。"
  source_anchor: "1.13.9.58 password 页1632"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_cipher_password
  type: constraint
  statement: "密码可为符合格式要求的密文字符串，主要用于用户数据导入；不推荐直接使用。直接使用时用户需知道对应明文并保证明文复杂度，数据库不校验密文复杂度，安全性由用户保证。"
  source_anchor: "1.13.9.58 password 页1632"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_password_quoting
  type: syntax
  statement: "创建用户时，应使用单引号或双引号包裹用户密码。"
  source_anchor: "1.13.9.58 password 页1632"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_other_options_role
  type: constraint
  statement: "CREATE USER未单独说明的其他参数值参见CREATE ROLE章节。"
  source_anchor: "1.13.9.58 参数说明 页1632"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_createdb
  type: syntax
  statement: "CREATE USER dim CREATEDB PASSWORD '...'创建具有创建数据库权限的用户；\\du dim显示Attributes为Create DB。"
  source_anchor: "1.13.9.58 示例 页1632"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_name_case_behavior
  type: behavior_oracle
  statement: "CREATE USER TOM自动转为小写tom；CREATE USER \"TOM\"通过双引号创建大写名称TOM。"
  source_anchor: "1.13.9.58 示例 页1632"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_followup_password
  type: syntax
  statement: "示例中可用ALTER USER jim IDENTIFIED BY 'new_password' REPLACE 'old_password'修改用户jim登录密码。"
  source_anchor: "1.13.9.58 示例 页1632"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_followup_createrole
  type: syntax
  statement: "示例中ALTER USER jim CREATEROLE可为用户追加CREATEROLE权限，\\du显示Attributes为Create role。"
  source_anchor: "1.13.9.58 示例 页1633"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_followup_parameters
  type: syntax
  statement: "示例中ALTER USER jim SET enable_seqscan TO on用于设置用户参数，ALTER USER jim RESET enable_seqscan用于重置该参数。"
  source_anchor: "1.13.9.58 示例 页1633"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_followup_lock
  type: syntax
  statement: "示例中ALTER USER jim ACCOUNT LOCK和ACCOUNT UNLOCK分别用于锁定和解锁用户账户。"
  source_anchor: "1.13.9.58 示例 页1633"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_admin_roles
  type: syntax
  statement: "可使用CREATE USER user1 WITH OPRADMIN和CREATE USER user2 WITH SYSADMIN分别创建运维管理员和系统管理员用户；\\du显示对应Operatoradmin和Sysadmin属性。"
  source_anchor: "1.13.9.58 示例 页1633"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_admin_membership
  type: behavior_oracle
  statement: "CREATE USER user4 WITH CREATEDB ADMIN user3创建新用户后，user3的Member of显示user4，表示ADMIN子句建立的成员关系。"
  source_anchor: "1.13.9.58 示例 页1633-1634"
  source_refs: *refb1
  status: confirmed
- id: user_wave8_50_separation_of_duty
  type: constraint
  statement: "设置enableSeparationOfDuty=on后开启三权分立，限制系统管理员权限，不允许系统管理员创建或更改用户配置，以控制系统管理员访问用户私有数据。"
  source_anchor: "1.13.9.58 示例 页1634"
  source_refs: *refb1
  status: confirmed
open_questions:
