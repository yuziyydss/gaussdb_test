  type: constraint
  statement: "分区/索引优化参数：enable_gpi_auto_update USERSET布尔型默认off分区DDL默认更新GLOBAL索引（M兼容m_format_dev_version=s4时无论on/off均兼容on行为）；enable_gpi_fast_prune USERSET布尔型默认on Ustore全局分区索引DML清理DDL垃圾元组（高频DDL/DML+GPI建议开启/未使用GPI建议关闭/off时仅AutoVacuum清理GPI可能膨胀）；enable_partition_autoextend_retry SUSET布尔型默认off分区表自动扩展新增分区自治事务异常重试一次同事务（wal_level=logical时不重试直接抛出）；enable_partrouting_optimization USERSET布尔型默认on分区表插入优化（INSERT SELECT常量分区键只做一次路由/约束——仅insert select/分区键值须为常量/不支持聚合函数/自增列/生成列/默认值列/upsert/before instead触发器）。"
