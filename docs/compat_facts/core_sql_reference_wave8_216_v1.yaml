  source_refs: *refw8216
  status: confirmed
- id: guc_wave8_216_unique_check_extension
  type: syntax
  statement: "唯一检查/扩展参数：enable_unique_checking_of_unusable_index USERSET布尔型默认off表中存在UNUSABLE唯一索引时INSERT和UPDATE是否阻塞（on报错提示处理UNUSABLE唯一索引/off不报错/推荐on/off导致插入重复数据索引无法重建/astore更新非UNUSABLE索引列也报错/ustore非分区表原地更新不报错）；enable_extension USERSET布尔型默认off创建扩展（on所有扩展/off仅特定扩展）。"
  source_anchor: "7.3.25 其它选项 页4712"
  source_refs: *refw8216
  status: confirmed
- id: guc_wave8_216_bisheng_plsql_bytecode
  type: syntax
  statement: "毕昇编译/存储过程参数：bisheng_compiler_option SIGHUP枚举all_module_off/vecengine_on/mmgr_on/fmgr_on/imcv_on/all_module_on默认all_module_off毕昇编译动态库切换（仅ARM架构TPCH场景/测试极限性能设all_module_on）；plsql_code_type USERSET枚举INTERPRETED/BYTECODE默认INTERPRETED存储过程执行框架（字节码场景下BYTECODE按字节码框架否则AST）；enable_gsplsql_execopt USERSET布尔型默认on存储过程初始化分配不改变信息避免重复调用；dynamic_procedure_cache_count USERSET整型0~1024默认128存储过程动态语句缓存最大条数（0不缓存）。"
