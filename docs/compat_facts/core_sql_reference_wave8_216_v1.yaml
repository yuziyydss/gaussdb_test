- id: guc_wave8_216_upgrade_params
  type: syntax
  statement: "升级参数：IsInplaceUpgrade SUSET布尔型默认off是否在升级过程中（用户无法修改仅sysadmin查看）；inplace_upgrade_next_system_object_oids SUSET字符串默认空就地升级新增系统对象OID（用户无法修改）；om_operation_mode SIGHUP枚举upgrade_system_object_mode/running_mode默认running_mode数据库实例运维或正常运行状态（内部组件交互/upgrade_system_object_mode时不能重命名数据库名称）；upgrade_mode SIGHUP整型0/1/2默认0升级模式——0不在升级/1就地升级/2灰度升级（严禁升级过程中自行修改否则升级失败且无法回滚/灰度升级大版本升级设2小版本不设）。"
  source_anchor: "7.3.24 升级参数 页4696-4698"
  source_refs: &refw8216
  - w8_216_7_3
  status: confirmed
- id: guc_wave8_216_enable_access_server_directory
  type: constraint
  statement: "enable_access_server_directory SIGHUP布尔型默认off允许非初始用户创建修改删除DIRECTORY对象——on时SYSADMIN或gs_role_directory_create权限用户可创建/SYSADMIN或directory属主或被授予DROP权限或gs_role_directory_drop可删除/SYSADMIN和directory属主可修改所有者/off仅初始用户。"
  source_anchor: "7.3.24 升级参数前 页4696"
  source_refs: *refw8216
  status: confirmed
- id: guc_wave8_216_ustore_options
  type: syntax
  statement: "Ustore选项：enable_default_ustore_table USERSET布尔型默认on默认使用Ustore存储引擎（仅enable_ustore开启时有效/on默认Ustore表/off默认Astore表/升级场景优先保证兼容性/需开启track_counts和track_activities否则空间膨胀/PDB级别）；enable_ustore POSTMASTER布尔型默认on开启Ustore存储引擎（版本控制不建议修改）；enable_segment_datafile_preallocate SIGHUP布尔型默认on段页式文件扩展立即分配磁盘空间（fallocate/不支持时逐字节写零）；consistency_check_module USERSET字符串默认off(ALL)一致性校验模块（仅INDEX模块——Astore表B-Tree IndexScan校验索引元组与堆表元组一致性/on(INDEX)/off(ALL)）；reserve_space_for_nullable_atts USERSET布尔型默认on Ustore表可空属性预留空间。"
  source_anchor: "7.3.25 其它选项 页4698-4701"
  source_refs: *refw8216
  status: confirmed
- id: guc_wave8_216_internal_fixed_params
  type: syntax
  statement: "INTERNAL固定参数（用户无法修改只能查看）：server_version默认9.2.4/server_version_num默认90204（查询内核版本号用opengauss_version()函数）；block_size默认8192/segment_size默认131072（1GB）/max_index_keys默认32/integer_datetimes默认on 64位整数日期时间/lc_collate/lc_ctype字符串排序/字符分类区域设置（安装部署配置）/max_identifier_length默认63/server_encoding由系统环境决定；is_sysadmin INTERNAL布尔型默认off当前用户是否初始用户。"
  source_anchor: "7.3.25 其它选项 页4701-4704"
  source_refs: *refw8216
  status: confirmed
- id: guc_wave8_216_backup_heartbeat
  type: syntax
  statement: "备份/心跳参数：basebackup_timeout USERSET整型0~2147483647秒默认600备份传输完成后连接无读写超时（0禁用）；datanode_heartbeat_interval SIGHUP整型1000~60000ms默认1000（1s）心跳线程发送消息间隔（建议不超wal_receiver_timeout/2）；dfs_partition_directory_length USERSET整型92~7999默认512 HDFS VALUE分区表分区目录名长度上限。"
  source_anchor: "7.3.25 其它选项 页4704"
  source_refs: *refw8216
  status: confirmed
- id: guc_wave8_216_autonomous_txn_smp
  type: constraint
  statement: "自治事务/SMP参数：max_concurrent_autonomous_transactions POSTMASTER整型0~10000默认200/150/120/100/80/40/20/10按规格自治事务最大并发数（实际最大值=262143-job_queue_processes-autovacuum_max_workers-max_inner_tool_connections-max_connections-AUXILIARY_BACKENDS(20)-AV_LAUNCHER_PROCS(2)/0时无法执行/建议不超max_connections 1/10/仅调大未同比例调内存参数时易内存不足/升级回滚需调整至升级前范围否则无法启动）；enable_force_smp USERSET布尔型默认off强制开启SMP计划（仅支持SMP算子/数据量少或资源不足可能劣化/SMP非适用场景不支持）；stream_queue_batch_size USERSET整型0~64默认0 local stream算子batch缓冲数量（建议4/仅SMP向量化引擎local stream算子有效）。"
  source_anchor: "7.3.25 其它选项 页4705-4711"
  source_refs: *refw8216
  status: confirmed
