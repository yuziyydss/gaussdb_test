facts:
- id: drop_owned_wave8_81_purpose
  type: syntax
  statement: "DROP OWNED删除一个数据库角色所拥有的数据库对象；语法为DROP OWNED BY name[, ...] [CASCADE | RESTRICT]；name为指定的角色名。"
  source_anchor: "1.13.10.27 功能描述/语法格式/参数说明 页1679"
  source_refs: &refowned
  - w8_81_1_13_10_27
  status: confirmed
- id: drop_owned_wave8_81_revoke
  type: constraint
  statement: "DROP OWNED会移除指定角色在当前数据库中所拥有的对象上的所有权限，并且会移除该角色在共享对象（即数据库和表空间）上拥有的所有权限；DROP OWNED常常是为移除一个或者多个角色做准备，只影响当前数据库中的对象，通常需要在包含将被移除角色所拥有的对象所在的每一个数据库中都执行该命令。"
  source_anchor: "1.13.10.27 注意事项 页1679"
  source_refs: *refowned
  status: confirmed
- id: drop_owned_wave8_81_cascade_restrict
  type: constraint
  statement: "CASCADE | RESTRICT可选，是否级联删除依赖于该角色的对象，未指定时默认为RESTRICT：CASCADE级联删除所有依赖于被删除角色对象的对象，可能导致该操作递归删除其他用户所拥有的对象，请谨慎使用；RESTRICT拒绝删除存在依赖对象的角色对象。"
  source_anchor: "1.13.10.27 注意事项/参数说明 页1679-1680"
  source_refs: *refowned
  status: confirmed
- id: drop_owned_wave8_81_limits
  type: constraint
  statement: "角色所拥有的数据库及表空间不会被移除；角色所拥有的私有DATABASE LINK连接，需要添加CASCADE才可以被删除。"
  source_anchor: "1.13.10.27 注意事项 页1679"
  source_refs: *refowned
  status: confirmed
- id: drop_owned_wave8_81_example
  type: behavior_oracle
  statement: "示例中CREATE USER jim后DROP OWNED BY jim撤销jim在当前数据库和共享对象上的所有权限，再DROP USER jim删除用户（相关链接REASSIGN OWNED、DROP ROLE）。"
  source_anchor: "1.13.10.27 示例 页1680"
  source_refs: *refowned
  status: confirmed
- id: drop_package_wave8_81_purpose
  type: syntax
  statement: "DROP PACKAGE删除已存在的PACKAGE或PACKAGE BODY；语法为DROP PACKAGE [IF EXISTS] package_name与DROP PACKAGE BODY [IF EXISTS] package_name；package_name取值为已存在的PACKAGE名。"
  source_anchor: "1.13.10.28 功能描述/语法格式/参数说明 页1680-1681"
  source_refs: &refpkg
  - w8_81_1_13_10_28
  status: confirmed
- id: drop_package_wave8_81_body_invalidates
  type: constraint
  statement: "删除PACKAGE BODY后，PACKAGE内的存储过程及函数会同时失效。"
  source_anchor: "1.13.10.28 注意事项 页1680"
  source_refs: *refpkg
  status: confirmed
- id: drop_package_wave8_81_initial_ifexists
  type: constraint
  statement: "仅初始用户有权对初始用户的PACKAGE进行DROP操作；IF EXISTS判断指定的PACKAGE或PACKAGE BODY是否存在，不存在时不会进行删除操作，仅产生一个NOTICE提示。"
  source_anchor: "1.13.10.28 注意事项/参数说明 页1680-1681"
  source_refs: *refpkg
  status: confirmed
- id: drop_package_wave8_81_example
  type: behavior_oracle
  statement: "示例中CREATE OR REPLACE PACKAGE PCK1（a int; END pck1; /）后DROP PACKAGE PCK1删除（相关链接ALTER PACKAGE、CREATE PACKAGE）。"
  source_anchor: "1.13.10.28 示例 页1681"
  source_refs: *refpkg
  status: confirmed
- id: drop_pluggable_database_wave8_81_purpose
  type: syntax
  statement: "DROP PLUGGABLE DATABASE pdb_name INCLUDING DATAFILES删除Pluggable Database（PDB）对象以及PDB内所有数据库对象与数据；pdb_name为需要删除的PDB名称。"
  source_anchor: "1.13.10.29 功能描述/语法格式/参数说明 页1681"
  source_refs: &refdroppdb
  - w8_81_1_13_10_29
  status: confirmed
- id: drop_pluggable_database_wave8_81_preconditions
  type: constraint
  statement: "仅在GUC参数enable_mtd为on的状态下可以执行该操作；只能在非PDB中进行该操作，且不可在M-Compatibility兼容模式数据库中执行；操作用户需要为PDB所有者（系统表PG_DATABASE中的datdba）或拥有SYSADMIN权限；执行该操作前需要先进行ALTER PLUGGABLE DATABASE操作对PDB进行关闭。"
  source_anchor: "1.13.10.29 注意事项 页1681"
  source_refs: *refdroppdb
  status: confirmed
- id: drop_pluggable_database_wave8_81_limits
  type: constraint
  statement: "无法使用该语句删除模板PDB（template_pdb）；删除PDB时不会级联删除与其关联的资源计划指令（Resource Plan Directive）对象。"
  source_anchor: "1.13.10.29 注意事项 页1681"
  source_refs: *refdroppdb
  status: confirmed
- id: drop_pluggable_database_wave8_81_example
  type: behavior_oracle
  statement: "示例中PDB状态为open时无法删除，先ALTER PLUGGABLE DATABASE my_pdb CLOSE IMMEDIATE关闭，再使用系统管理员连接postgres执行DROP PLUGGABLE DATABASE my_pdb INCLUDING DATAFILES（相关链接CREATE PLUGGABLE DATABASE、PG_DATABASE）。"
  source_anchor: "1.13.10.29 示例 页1682"
  source_refs: *refdroppdb
  status: confirmed
- id: drop_procedure_wave8_81_purpose
  type: syntax
  statement: "DROP PROCEDURE删除已存在的存储过程；语法为DROP PROCEDURE [IF EXISTS] procedure_name；procedure_name取值为已存在的存储过程名。"
  source_anchor: "1.13.10.30 功能描述/语法格式/参数说明 页1682"
  source_refs: &refdropproc
  - w8_81_1_13_10_30
  status: confirmed
- id: drop_procedure_wave8_81_initial_ifexists
  type: constraint
  statement: "仅初始用户有权对初始用户的存储过程进行DROP操作；IF EXISTS判断指定的存储过程是否存在，存在则删除成功，不存在不会进行删除操作，仅产生一个NOTICE提示。"
  source_anchor: "1.13.10.30 注意事项/参数说明 页1682"
  source_refs: *refdropproc
  status: confirmed
- id: drop_procedure_wave8_81_example_ref
  type: constraint
  statement: "示例请参见CREATE PROCEDURE章节的示例（相关链接ALTER PROCEDURE、CREATE PROCEDURE）。"
  source_anchor: "1.13.10.30 示例/相关链接 页1682"
  source_refs: *refdropproc
  status: confirmed
- id: drop_resource_label_wave8_81_purpose
  type: syntax
  statement: "DROP RESOURCE LABEL删除一个资源标签；语法为DROP RESOURCE LABEL [IF EXISTS] label_name[, ...]；label_name为资源标签名称，取值范围为字符串且要符合标识符命名规范。"
  source_anchor: "1.13.10.31 功能描述/语法格式/参数说明 页1683"
  source_refs: &reflabel
  - w8_81_1_13_10_31
