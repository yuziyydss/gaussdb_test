- id: drop_resource_label_wave8_81_privileges
  type: constraint
  statement: "仅POLADMIN、SYSADMIN或初始用户可以执行该操作。"
  source_anchor: "1.13.10.31 注意事项 页1683"
  source_refs: *reflabel
  status: confirmed
- id: drop_resource_label_wave8_81_example_create
  type: behavior_oracle
  statement: "示例覆盖基于表（add TABLE(public.tb_for_label)）、列（add COLUMN(...col1)）、模式（add SCHEMA）、视图（add VIEW）、函数（add FUNCTION）创建资源标签；重复创建时加IF NOT EXISTS产生NOTICE: table_label label already defined, skipping并成功，不加IF NOT EXISTS报错ERROR: table_label label already defined。"
  source_anchor: "1.13.10.31 示例 页1683-1684"
  source_refs: *reflabel
  status: confirmed
- id: drop_resource_label_wave8_81_example_drop
  type: behavior_oracle
  statement: "示例中DROP RESOURCE LABEL IF EXISTS table_label、DROP RESOURCE LABEL IF EXISTS column_label删除表/列资源标签（相关链接ALTER RESOURCE LABEL、CREATE RESOURCE LABEL）。"
  source_anchor: "1.13.10.31 示例 页1684"
  source_refs: *reflabel
