facts:
- id: altdb_wave8_45_purpose
  type: syntax
  statement: "ALTER DATABASE用于修改数据库属性，包括名称、所有者、连接数限制、对象隔离属性、会话参数、时区、ILM特性和bucket迁移等。"
  source_anchor: "1.13.7.6 页1200-1202"
  source_refs: &refb1
  - w8_45_1_13_7_6
  status: confirmed
- id: altdb_wave8_45_general_permissions
  type: constraint
  statement: "仅数据库所有者或被授予数据库ALTER权限的用户可执行ALTER DATABASE；系统管理员默认拥有该权限。"
  source_anchor: "1.13.7.6 注意事项 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_rename_permission
  type: constraint
  statement: "修改数据库名称必须拥有CREATEDB权限。"
  source_anchor: "1.13.7.6 注意事项 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_owner_permissions
  type: constraint
  statement: "修改数据库所有者时，当前用户必须是数据库所有者或系统管理员，必须拥有CREATEDB权限，且必须是新所有者角色的成员。"
  source_anchor: "1.13.7.6 注意事项 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_tablespace_permissions
  type: constraint
  statement: "修改数据库默认表空间时，用户必须拥有新表空间的CREATE权限；该操作会从物理上将原默认表空间上的表和索引移至新表空间，不在缺省表空间中的表和索引不受影响。"
  source_anchor: "1.13.7.6 注意事项 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_current_database_rename
  type: constraint
  statement: "不能直接重命名当前使用的数据库；需要重命名时，应先连接到其他数据库，再对原数据库执行RENAME。"
  source_anchor: "1.13.7.6 注意事项 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_templatem_rename
  type: constraint
  statement: "不允许将其他模式重命名为templatem，也不允许将templatem模式重命名为其他名称。"
  source_anchor: "1.13.7.6 注意事项 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_connection_limit_syntax
  type: syntax
  statement: "ALTER DATABASE database_name [WITH] CONNECTION LIMIT connlimit用于修改数据库最大连接数。"
  source_anchor: "1.13.7.6 语法格式 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_rename_syntax
  type: syntax
  statement: "ALTER DATABASE database_name RENAME TO new_name用于修改数据库名称。"
  source_anchor: "1.13.7.6 语法格式 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_owner_syntax
  type: syntax
  statement: "ALTER DATABASE database_name OWNER TO new_owner用于修改数据库所有者。"
  source_anchor: "1.13.7.6 语法格式 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_tablespace_syntax
  type: syntax
  statement: "ALTER DATABASE database_name SET TABLESPACE new_tablespace用于修改数据库默认表空间。"
  source_anchor: "1.13.7.6 语法格式 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_tablespace_conflict
  type: constraint
  statement: "如果数据库中某些表或对象已经创建在new_tablespace下，则无法将该数据库默认表空间修改为new_tablespace，执行会报错。"
  source_anchor: "1.13.7.6 SET TABLESPACE须知 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_set_parameter_syntax
  type: syntax
  statement: "ALTER DATABASE database_name SET configuration_parameter {TO|= value|DEFAULT|FROM CURRENT}用于修改数据库指定会话参数值。"
  source_anchor: "1.13.7.6 语法格式 页1201"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_reset_parameter_syntax
  type: syntax
  statement: "ALTER DATABASE database_name RESET {configuration_parameter|ALL}用于重置指定或全部数据库会话参数。"
  source_anchor: "1.13.7.6 语法格式 页1202"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_private_object_syntax
  type: syntax
  statement: "ALTER DATABASE database_name [WITH] {ENABLE|DISABLE} PRIVATE OBJECT用于修改数据库对象隔离属性。"
  source_anchor: "1.13.7.6 语法格式 页1202"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_private_object_behavior
  type: behavior_oracle
  statement: "修改对象隔离属性须连接至该数据库；新库默认关闭。开启后PG_CLASS、PG_ATTRIBUTE、PG_PROC、PG_NAMESPACE、PGXC_SLICE和PG_PARTITION会自动添加行级访问控制策略，普通用户只查看有权访问对象，管理员仍可查看全量对象。"
  source_anchor: "1.13.7.6 PRIVATE OBJECT说明 页1202"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_dbtimezone_syntax
  type: syntax
  statement: "ALTER DATABASE database_name SET DBTIMEZONE = time_zone用于修改数据库时区；取值支持系统时区及缩写，或-15:59到+15:00，且需要拥有数据库操作权限。"
  source_anchor: "1.13.7.6 语法格式/参数说明 页1202-1203"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_move_buckets
  type: constraint
  statement: "ALTER DATABASE database_name MOVE BUCKETS(bucketlist) FROM datanode_name TO datanode_name用于将指定bucket从一个DN迁移至另一个DN；当前版本不支持该操作。"
  source_anchor: "1.13.7.6 语法格式 页1202"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_ilm
  type: syntax
  statement: "ALTER DATABASE set ilm = {on|off}用于开启或关闭数据库的ILM特性。"
  source_anchor: "1.13.7.6 语法格式 页1202"
  source_refs: *refb1
  status: confirmed
- id: altdb_wave8_45_parameter_timing
  type: constraint
  statement: "修改的数据库会话参数值将在下一次会话中生效。"
  source_anchor: "1.13.7.6 参数说明 页1203"
  source_refs: *refb1
  status: confirmed
