facts:
- id: integration_wave6_7_close_dblink
  type: behavior_oracle
  statement: "close_database_link(dblink_name)主动关闭当前session指定DBLink连接，返回Boolean；存在活跃事务时不允许关闭。"
  source_anchor: "1.6.53 页1039"
  source_refs: &ref531
  - w6_7_1_6_53
  status: confirmed
- id: integration_wave6_7_ora_diag
  type: syntax
  statement: "gs_ora_diag([dblink_name])获取Oracle DBLink诊断信息，包括gs_ora_fdw、GaussDB、Oracle客户端和服务器版本；参数NULL且管理员查询时还返回ORACLE_HOME、ORACLE_SID、TNS_ADMIN、TWO_TASK、LDAP_ADMIN等，非管理员不显示。"
  source_anchor: "1.6.53 页1039-1040"
  source_refs: *ref531
  status: confirmed
- id: integration_wave6_7_oci_memory
  type: syntax
  statement: "gs_ora_get_handle_alloc(dblink_oid)获取指定DBLink通过OCI使用的内存大小；gs_ora_get_handle_alloc_all()获取所有DBLink OCI内存总和，单位字节，返回numeric。"
  source_anchor: "1.6.53 页1040-1041"
  source_refs: *ref531
  status: confirmed
- id: integration_wave6_7_connection_status
  type: syntax
  statement: "gs_ora_connection_status(dblink_oid)返回DBLink在当前session下连接状态，取值为CONNECTED或LOST。"
  source_anchor: "1.6.53 页1041"
  source_refs: *ref531
  status: confirmed
- id: integration_wave6_7_fdw_handler_validator
  type: syntax
  statement: "gs_ora_fdw_handler()返回oracle_fdw处理函数结构体；gs_ora_fdw_validator(option,dblink_oid)检查gs_ora_fdw通用选项，选项或选项值无效/缺失时报错。"
  source_anchor: "1.6.53 页1041-1042"
  source_refs: *ref531
  status: confirmed
- id: integration_wave6_7_dblink_state_functions
  type: syntax
  statement: "is_dblink_in_use(dblink_oid)、dblink_has_updatasent(dblink_oid)和is_dblink_in_transaction(dblink_oid)分别检查DBLink使用状态、是否已发送更新和是否处于事务中。"
  source_anchor: "1.6.53 页1042-1043"
  source_refs: *ref531
  status: confirmed
- id: monitor_wave6_7_cpustat
  type: syntax
  statement: "gs_get_cpustat(start_time,end_time)查询CPU资源统计，需MONADMIN或SYSADMIN权限；输出采集时间、CPU名、总/用户/系统/空闲/IO等待百分比和1/5/15分钟负载。"
  source_anchor: "1.6.54 页1043-1044"
  source_refs: &ref541
  - w6_7_1_6_54
  status: confirmed
- id: monitor_wave6_7_procstat
  type: syntax
  statement: "gs_get_procstat(start_time,end_time,sort_order[,display_type])查询进程统计；sort_order支持IO_R、IO_W、CPU、MEM，display_type支持pretty；需MONADMIN或SYSADMIN权限。"
  source_anchor: "1.6.54 页1044-1045"
  source_refs: *ref541
  status: confirmed
- id: monitor_wave6_7_iostat
  type: syntax
  statement: "gs_get_iostat(start_time,end_time[,display_type])查询IO资源统计，需MONADMIN或SYSADMIN权限；输出读写速率、IOPS、读写等待、服务时间、队列长度和磁盘使用率。"
  source_anchor: "1.6.54 页1045-1046"
  source_refs: *ref541
  status: confirmed
- id: monitor_wave6_7_memstat
  type: syntax
  statement: "gs_get_memstat(start_time,end_time)查询内存资源统计，需MONADMIN或SYSADMIN权限；输出总量、已用、空闲、使用率、buffer/cache、available、active/inactive和swap信息。"
  source_anchor: "1.6.54 页1046-1047"
  source_refs: *ref541
  status: confirmed
- id: monitor_wave6_7_netstat
  type: syntax
  statement: "gs_get_netstat(start_time,end_time)查询网络资源统计，需MONADMIN或SYSADMIN权限；输出接口、标签、收发速率、包速率和错误率。"
  source_anchor: "1.6.54 页1047-1048"
  source_refs: *ref541
  status: confirmed
- id: autonomous_wave6_7_detail
  type: syntax
  statement: "gs_autonomous_transaction_detail()查看自治事务会话及父子事务关系；MONADMIN或SYSADMIN可查看所有，返回autonomous_transaction_session_id、thread_id和parent_session_id。"
  source_anchor: "1.6.55 页1048"
  source_refs: &ref551
  - w6_7_1_6_55
  status: confirmed
- id: autonomous_wave6_7_count
  type: syntax
  statement: "gs_get_autonomous_transaction_count()查询当前自治事务计数，返回integer。"
  source_anchor: "1.6.55 页1048-1049"
  source_refs: *ref551
  status: confirmed
- id: autonomous_wave6_7_reset
  type: constraint
  statement: "gs_reset_autonomous_transaction_count()将当前自治事务计数恢复至正确值并返回正确计数；需MONADMIN或SYSADMIN权限。"
  source_anchor: "1.6.55 页1049-1050"
  source_refs: *ref551
  status: confirmed
- id: dsl_wave6_7_add_rule
  type: syntax
  statement: "dsl_add_rule(rulename,ruletext,priority[,enabled,ruledesc,ruledbcompatibility,planmode])新增DSL规则并返回规则NAME；仅初始用户可调用。"
  source_anchor: "1.6.56 页1050-1051"
  source_refs: &ref561
  - w6_7_1_6_56
  status: confirmed
- id: dsl_wave6_7_add_rule_params
  type: constraint
  statement: "dsl_add_rule的rulename必须字母开头且不超过64字节，支持字母、数字、下划线和中划线；priority为1-9999且全局唯一，数字越大优先级越低；兼容模式支持A/B/C/PG/M/ANY并可竖线组合；planmode支持Stream/RemoteQuery/ANY。"
  source_anchor: "1.6.56 页1050-1051"
  source_refs: *ref561
  status: confirmed
- id: dsl_wave6_7_del_set_reload
  type: syntax
  statement: "dsl_del_rule(rulename)删除DSL规则并返回删除条数；dsl_set_rule(rulename,attrname,attrval)修改单个属性且不能修改规则文本；dsl_reload_rule()加载规则到缓存并返回success/failed。"
  source_anchor: "1.6.56 页1051-1052"
  source_refs: *ref561
  status: confirmed
- id: dsl_wave6_7_permissions_attrs
  type: constraint
  statement: "dsl_del_rule需系统管理员或初始用户；dsl_set_rule需系统管理员或初始用户；可修改属性包括enabled、priority、ruledesc、dbcompatibility和planmode。"
  source_anchor: "1.6.56 页1051-1052"
  source_refs: *ref561
  status: confirmed
- id: mq_wave6_7_model_boundaries
  type: constraint
  statement: "消息队列仅支持主节点；实例异常会丢失全部数据；发布后需提交事务或主动COMMIT，事务回滚会自动清除未提交消息；同一会话同一group/topic只能有一个订阅；操作内部模块dbe_alert需SYSADMIN权限。"
  source_anchor: "1.6.57 页1052-1053"
  source_refs: &ref571
  - w6_7_1_6_57
  status: confirmed
- id: mq_wave6_7_params_limits
  type: constraint
  statement: "消息最大4096字节，group和topic最大127字节；全局最多32个group，每个group最多32个topic；队列最大长度499，满时需消费后才能继续生产。"
  source_anchor: "1.6.57 页1053-1054"
  source_refs: *ref571
  status: confirmed
- id: mq_wave6_7_register_send_query
  type: syntax
  statement: "mq_register_pull(group,request_id,topic)订阅；mq_unregister取消订阅；mq_send_message发送到所有订阅者；mq_query获取指定topic的一条消息；均返回Boolean或text。"
  source_anchor: "1.6.57 页1053-1054"
  source_refs: *ref571
  status: confirmed
- id: mq_wave6_7_query_consumption
  type: behavior_oracle
  statement: "mq_query一旦成功获取消息即视为已消费，不受事务回滚影响；未注册、没有消息或已接收全部消息时返回空值。"
  source_anchor: "1.6.57 页1054"
  source_refs: *ref571
  status: confirmed
- id: mq_wave6_7_admin_sync_functions
  type: syntax
  statement: "mq_transaction_processing(id,is_message,is_commit)手动提交/回滚消息或订阅；mq_get_queue()和mq_clear()查看/清除所有队列并需SYSADMIN权限；mq_sync_ccn()与mq_sync(message_queue)当前版本不可用。"
  source_anchor: "1.6.57 页1054-1055"
  source_refs: *ref571
  status: confirmed
- id: rowid_wave6_7_functions
  type: syntax
  statement: "rowid_tableoid(rowid)获取rowid中的table_oid并返回oid；rowid_sequence(rowid)获取rowid中的row_no并返回int8。"
  source_anchor: "1.6.58 页1055-1056"
  source_refs: &ref581
  - w6_7_1_6_58
  status: confirmed
- id: integration_tools_wave6_7_scope_note
  type: environment
  statement: "Wave 6-7完整覆盖1.6.53 DBLink、1.6.54 GSMonitor资源统计、1.6.55自治事务、1.6.56 DSL规则、1.6.57消息队列和1.6.58 ROWID函数，物理页1039-1056。"
  source_anchor: "1.6.53–1.6.58 页1039-1056"
