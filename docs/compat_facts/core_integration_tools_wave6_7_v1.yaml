open_questions:
- id: integration_wave6_7_oq_dblink_monitor_matrix
  statement: "DBLink诊断/状态/OCI内存和GSMonitor资源统计在真实Oracle链路、不同权限、时间窗口和负载下的输出矩阵需授权环境验证。"
  status: open
- id: integration_wave6_7_oq_dsl_mq_rowid_evidence
  statement: "DSL规则生命周期、消息队列订阅/投递/事务边界、自治事务计数和ROWID解析在主备、异常恢复和并发场景下的行为矩阵需实机验证。"
  status: open
