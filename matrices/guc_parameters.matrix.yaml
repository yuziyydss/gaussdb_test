# GaussDB 全局 GUC 参数等价类池与环境矩阵
id: matrix_gaussdb_guc
name: "GaussDB 核心 GUC 参数等价类池"
description: "覆盖查询优化器算子开关、兼容模式多态、事务隔离级别与存储引擎控制参数"

guc_parameters:
  # 1. 查询优化器执行算子开关 (用于 NoREC 优化器等价性验证)
  enable_seqscan:
    scope: "session"
    type: "boolean"
    description: "控制优化器是否允许全表顺序扫描"
    classes:
      - { name: "开启全表扫描", value: "on" }
      - { name: "强制禁用全表扫描", value: "off" }

  enable_indexscan:
    scope: "session"
    type: "boolean"
    description: "控制优化器是否允许普通索引扫描"
    classes:
      - { name: "开启索引扫描", value: "on" }
      - { name: "强制禁用索引扫描", value: "off" }

  enable_indexonlyscan:
    scope: "session"
    type: "boolean"
    description: "控制优化器是否允许仅索引扫描 (Index Only Scan)"
    classes:
      - { name: "开启仅索引扫描", value: "on" }
      - { name: "禁用仅索引扫描", value: "off" }

  enable_nestloop:
    scope: "session"
    type: "boolean"
    description: "控制优化器是否允许嵌套循环连接 (Nested Loop Join)"
    classes:
      - { name: "允许NestLoop", value: "on" }
      - { name: "禁用NestLoop", value: "off" }

  enable_hashjoin:
    scope: "session"
    type: "boolean"
    description: "控制优化器是否允许哈希连接 (Hash Join)"
    classes:
      - { name: "允许HashJoin", value: "on" }
      - { name: "禁用HashJoin", value: "off" }

  # 2. 数据库多态兼容模式
  sql_compatibility:
    scope: "session / db_init"
    type: "enum"
    description: "GaussDB SQL 兼容模式"
    classes:
      - { name: "PostgreSQL 原生兼容 (PG模式)", value: "'PG'" }
      - { name: "MySQL 兼容模式 (B模式)", value: "'B'" }
      - { name: "Oracle 兼容模式 (A模式)", value: "'A'" }
      - { name: "Teradata 兼容模式 (TD模式)", value: "'TD'" }

  dolphin.b_compatibility_mode:
    scope: "session"
    type: "boolean"
    description: "控制 Dolphin 插件 MySQL 语法高保真兼容开关"
    classes:
      - { name: "开启B兼容开关", value: "on" }
      - { name: "关闭B兼容开关", value: "off" }

  # 3. 事务行为与隔离级别
  default_transaction_isolation:
    scope: "session"
    type: "enum"
    description: "当前会话默认事务隔离级别"
    classes:
      - { name: "读已提交 (Read Committed)", value: "'read committed'" }
      - { name: "可重复读 (Repeatable Read)", value: "'repeatable read'" }

  synchronous_commit:
    scope: "session"
    type: "enum"
    description: "事务提交时 WAL 日志同步刷新策略"
    classes:
      - { name: "强同步刷新 (on)", value: "on" }
      - { name: "异步提交 (off)", value: "off" }

  # 4. 存储引擎与性能控制
  enable_default_ustore_table:
    scope: "session"
    type: "boolean"
    description: "新建表默认存储引擎是否为 Ustore 原地更新表"
    classes:
      - { name: "默认Ustore", value: "on" }
      - { name: "默认Astore", value: "off" }
