<!-- Case List Fragment -->
<div class="max-w-5xl">
  <div class="flex items-center gap-3 mb-4">
    <div>
      <h2 class="text-lg font-semibold text-slate-800">{{ factor.name }} · 测试用例</h2>
      <p class="text-xs text-slate-400">策略: {{ strategy }} | 共 {{ cases | length }} 条</p>
    </div>
    <div class="flex-1"></div>
    <form hx-post="/execute" hx-target="#main-content" hx-swap="innerHTML" hx-indicator="#exec-indicator">
      <input type="hidden" name="factor_id" value="{{ factor.id }}">
      <input type="hidden" name="strategy" value="{{ strategy }}">
      <button type="submit"
              class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 text-slate-600 text-sm font-medium rounded-lg hover:bg-slate-200 transition-colors border border-slate-200">
        <i data-lucide="play" class="w-3.5 h-3.5"></i>
        执行并生成报告
      </button>
    </form>
    <span id="exec-indicator" class="htmx-indicator text-xs text-blue-500">执行中...</span>
  </div>

  <div class="bg-white rounded-lg border border-slate-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="bg-slate-50 border-b border-slate-200 text-xs text-slate-400 uppercase tracking-wider">
          <th class="py-2 px-3 text-left font-medium w-20">ID</th>
          <th class="py-2 px-3 text-left font-medium">SQL 语句</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-50">
        {% for case in cases %}
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="py-2 px-3 font-mono text-xs text-slate-400 align-top">{{ case.case_id }}</td>
          <td class="py-2 px-3 sql-code text-xs text-slate-700 leading-relaxed break-all">{{ case.sql }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
<script>lucide.createIcons();</script>
