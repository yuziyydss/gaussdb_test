<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GaussDB 测试因子库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .sql-code { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-5 py-2.5 flex items-center gap-3 flex-shrink-0">
    <div class="w-7 h-7 rounded bg-blue-600 flex items-center justify-center">
      <i data-lucide="database" class="w-4 h-4 text-white"></i>
    </div>
    <h1 class="text-base font-semibold tracking-tight">GaussDB 测试因子库</h1>
    <span class="text-xs text-slate-400 ml-2">{{ factor_count }} 个因子定义</span>
    <div class="flex-1"></div>
    <span class="text-xs text-slate-400">桩模式 · 未连接数据库</span>
    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-56 bg-white border-r border-slate-200 flex flex-col overflow-y-auto flex-shrink-0">
      <div class="px-3 pt-3 pb-1 flex items-center justify-between">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">因子列表</span>
        <button onclick="location.reload()"
                title="重新加载因子定义"
                class="text-slate-400 hover:text-blue-600 transition-colors p-0.5">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
      {% for cat, factors in categories.items() %}
      <div class="px-3 pt-2 pb-1">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">{{ cat }}</span>
      </div>
      {% for f in factors %}
      <a href="/factor/{{ f.id }}"
         hx-get="/factor/{{ f.id }}" hx-target="#main-content" hx-swap="innerHTML"
         class="flex items-center gap-2 px-3 py-1.5 mx-1.5 rounded text-sm text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors cursor-pointer">
        <i data-lucide="file-text" class="w-3.5 h-3.5 text-slate-400 flex-shrink-0"></i>
        <span class="truncate">{{ f.name }}</span>
      </a>
      {% endfor %}
      {% endfor %}

      <div class="mt-auto px-3 py-3 border-t border-slate-100">
        <details class="text-[11px] text-slate-400 leading-relaxed">
          <summary class="cursor-pointer hover:text-slate-600">如何添加新因子?</summary>
          <div class="mt-2">
            在 <code class="text-slate-500">factors/</code> 下新建 .yaml 文件，
            按 create_table.yaml 格式编写，
            保存后点上方刷新按钮。
          </div>
        </details>
      </div>
    </aside>

    <!-- Main -->
    <main id="main-content" class="flex-1 overflow-y-auto p-6">
      <div class="max-w-4xl mx-auto pt-8">
        <div class="text-center">
          <div class="w-12 h-12 mx-auto rounded-xl bg-blue-50 flex items-center justify-center mb-3">
            <i data-lucide="layers" class="w-6 h-6 text-blue-500"></i>
          </div>
          <h2 class="text-lg font-semibold text-slate-700">选择左侧的 SQL 语法开始</h2>
          <p class="text-sm text-slate-400 mt-1">选择因子定义 → 选覆盖策略 → 生成 SQL → 执行 → 看报告</p>
        </div>
      </div>
    </main>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
