facts:
- id: m_alter_default_privileges_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.3 L2-2
- id: m_alter_default_privileges_fact_syntax
  type: syntax
  statement: 默认权限按可选目标角色、Schema与GRANT/REVOKE子句修改。
  status: confirmed
  source_anchor: 2.4.2.6.3 L12-15
- id: m_alter_default_privileges_fact_object_scope
  type: constraint
  statement: 当前只支持表（含视图）和序列；表与序列的权限集合不同。
  status: confirmed
  source_anchor: 2.4.2.6.3 L9-9
- id: m_alter_default_privileges_fact_tables
  type: syntax
  statement: 表默认权限支持 SELECT、INSERT 等及再授权。
  status: confirmed
  source_anchor: 2.4.2.6.3 L24-29
- id: m_alter_default_privileges_fact_sequences
  type: syntax
  statement: 序列默认权限支持 SELECT、USAGE 等及再授权。
  status: confirmed
  source_anchor: 2.4.2.6.3 L32-36
- id: m_alter_default_privileges_fact_table_privileges
  type: constraint
  statement: 表默认权限枚举中不包含USAGE。
  status: confirmed
  source_anchor: 2.4.2.6.3 L24-27
- id: m_alter_default_privileges_fact_sequence_privileges
  type: constraint
  statement: 序列默认权限枚举中不包含INSERT。
  status: confirmed
  source_anchor: 2.4.2.6.3 L32-34
- id: m_alter_default_privileges_fact_revoke
  type: syntax
  statement: 回收可指定 GRANT OPTION FOR 与缺省/RESTRICT；当前不生成级联。
  status: confirmed
  source_anchor: 2.4.2.6.3 L39-45
- id: m_alter_default_privileges_fact_owner
  type: environment
  statement: 未指定 FOR ROLE/USER 时目标为当前角色；本批不修改其他创建者的默认ACL。
  status: confirmed
  source_anchor: 2.4.2.6.3 L58-58
- id: m_alter_default_privileges_fact_schema
  type: environment
  statement: 目标Schema必须存在，目标创建者需有其CREATE权限；本批由Schema创建者操作。
  status: confirmed
  source_anchor: 2.4.2.6.3 L62-62
- id: m_alter_default_privileges_fact_existing
  type: behavior_oracle
  statement: 默认权限修改不影响既有对象已分配的权限。
  status: confirmed
  source_anchor: 2.4.2.6.3 L5-6
- id: m_alter_default_privileges_fact_cleanup
  type: lifecycle
  statement: 删除受权角色前需恢复修改的默认权限；本批只做专用Schema定向恢复，不使用DROP OWNED。
  status: confirmed
  source_anchor: 2.4.2.6.3 L71-72
- id: m_alter_default_privileges_fact_purpose
  type: example
  statement: m_alter_default_privileges的M-Compatibility语法功能描述。
  status: confirmed
  source_anchor: M-Compatibility L4-4
