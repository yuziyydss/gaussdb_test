schema_version: 1
kind: syntax
id: syntax_m_grant
name: syntax_m_grant
status: needs_review
description: M 有限模型；不承诺全章覆盖或实机成功。
factor_ref: m_grant
category: DCL
ast:
  kind: sequence
  items:
  - kind: literal
    text: 'GRANT '
  - kind: choice
    selector: scope
    branches:
      m_grant_scope_table:
        kind: slot
        slot: table_privilege
      m_grant_scope_columns:
        kind: slot
        slot: column_privilege
  - kind: sequence
    items:
    - kind: literal
      text: ' ON '
    - kind: slot
      slot: table_keyword
    - kind: literal
      text: ' m_grant_namespace.source TO '
    - kind: slot
      slot: group_keyword
    - kind: literal
      text: ' '
    - kind: repeat
      slot: recipients
      separator: ', '
      items_property: items
  - kind: literal
    text: ' '
  - kind: slot
    slot: grant_option
subgrammars: {}
rendering:
  whitespace: collapse
  statement_terminator: ;
slots:
  scope:
    type: sql_fragment
    optional: true
    dimension_ref: m_grant.scope
  table_privilege:
    type: sql_fragment
    optional: true
    dimension_ref: m_grant.table_privilege
  column_privilege:
    type: sql_fragment
    optional: true
    dimension_ref: m_grant.column_privilege
  table_keyword:
    type: sql_fragment
    optional: true
    dimension_ref: m_grant.table_keyword
  group_keyword:
    type: sql_fragment
    optional: true
    dimension_ref: m_grant.group_keyword
  recipients:
    type: sql_fragment
    optional: true
    dimension_ref: m_grant.recipients
  grant_option:
    type: sql_fragment
    optional: true
    dimension_ref: m_grant.grant_option
source_fact_refs:
- m_grant_fact_syntax
- m_grant_fact_columns
