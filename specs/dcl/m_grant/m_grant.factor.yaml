facts:
- id: m_grant_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.11.2 L2-2
- id: m_grant_fact_syntax
  type: example
  statement: 对象授权包含表和列级权限、可选 TABLE/GROUP、多个接收角色及 WITH GRANT OPTION。
  status: confirmed
  source_anchor: 2.4.2.11.2 L78-84
- id: m_grant_fact_columns
  type: example
  statement: 列权限允许 SELECT/INSERT/UPDATE/REFERENCES/COMMENT 的列列表。
  status: confirmed
  source_anchor: 2.4.2.11.2 L92-96
- id: m_grant_fact_owner
  type: environment
  statement: 对象所有者缺省拥有对象权限及固有再授予权限；本批由对象创建者操作。
  status: confirmed
  source_anchor: 2.4.2.11.2 L33-35
- id: m_grant_fact_schema_usage
  type: environment
  statement: 实际访问表还需要所属 Schema 的 USAGE；本批 fixture 显式授予专用 Schema USAGE。
  status: confirmed
  source_anchor: 2.4.2.11.2 L88-90
- id: m_grant_fact_column_access
  type: example
  statement: 表权限会覆盖全部列；验证仅列授权时应先撤销表权限。
  status: confirmed
  source_anchor: 2.4.2.11.2 L100-101
- id: m_grant_fact_public_option
  type: example
  statement: WITH GRANT OPTION 不能授予 PUBLIC。
  status: confirmed
  source_anchor: 2.4.2.11.2 L24-25
- id: m_grant_fact_database_mapping
  type: environment
  statement: ON DATABASE 是否指物理库由 grant_database_nomapping 决定，否则映射为 ON SCHEMA。
  status: confirmed
  source_anchor: 2.4.2.11.2 L118-122
- id: m_grant_fact_admin_bypass
  type: environment
  statement: 三权分立关闭的系统管理员绕过对象权限，不能用该身份判定被授权角色的访问 Oracle。
  status: confirmed
  source_anchor: 2.4.2.11.2 L231-233
- id: m_grant_fact_system_privileges
  type: example
  statement: 系统权限（用户属性）：SYSADMIN、CREATEDB、CREATEROLE、AUDITADMIN、MONADMIN、OPRADMIN、POLADMIN、INHERIT、REPLICATION、LOGIN。SYSADMIN可通过GRANT
    ALL PRIVILEGES授予。不可被ROLE继承或授予PUBLIC。
  status: confirmed
  source_anchor: 2.4.2.11.2 L8-19
- id: m_grant_fact_public_keyword
  type: example
  statement: PUBLIC表示权限赋予所有角色（含以后创建的用户）。WITH GRANT OPTION不能赋予PUBLIC（M-Compatibility特有）。
  status: confirmed
  source_anchor: 2.4.2.11.2 L20-32
- id: m_grant_fact_public_defaults
  type: example
  statement: 默认表/字段/序列/外部服务器/模式/表空间不授予PUBLIC；数据库CONNECT和CREATE TEMP TABLE、语言和数据类型USAGE授予PUBLIC。
  status: confirmed
  source_anchor: 2.4.2.11.2 L26-32
- id: m_grant_fact_with_admin_option
  type: example
  statement: WITH ADMIN OPTION允许被授权用户再次授予权限及撤销继承权限。角色变更时继承者权限随之变更。
  status: confirmed
  source_anchor: 2.4.2.11.2 L48-55
- id: m_grant_fact_any_privileges
  type: example
  statement: ANY权限包括：CREATE/ALTER/DROP/SELECT/INSERT/UPDATE/DELETE/TRUNCATE ANY TABLE, CREATE/ALTER/DROP/SELECT
    ANY SEQUENCE, ALTER/DROP ANY INDEX。可通过角色继承但不能赋予PUBLIC。
  status: confirmed
  source_anchor: 2.4.2.11.2 L57-58
- id: m_grant_fact_any_scope
  type: example
  statement: ANY权限属于数据库内权限，只对授予该权限的数据库内对象有效。ANY权限与原有权限相互无影响。
  status: confirmed
  source_anchor: 2.4.2.11.2 L61-72
- id: m_grant_fact_any_create_owner
  type: example
  statement: CREATE ANY TABLE权限下同名模式创建的表属主是该模式所有者。同理CREATE ANY SEQUENCE/INDEX。
  status: confirmed
  source_anchor: 2.4.2.11.2 L61-72
- id: m_grant_fact_grant_option_rule
  type: example
  statement: 非对象所有者授权时：有WITH GRANT OPTION才能授权给他人；用户没有指定权限时命令立即失败。
  status: confirmed
  source_anchor: 2.4.2.11.2 L222-227
- id: m_grant_fact_role_no_inherit
  type: example
  statement: GRANT role1 TO role2时role2不继承role1的系统权限，仅继承对象权限。
  status: confirmed
  source_anchor: 2.4.2.11.2 L142-147
- id: m_grant_fact_any_grants_usage
  type: example
  statement: 用户被授予任何ANY权限后自动获得public模式和用户模式的USAGE权限。
  status: confirmed
  source_anchor: 2.4.2.11.2 L301-303
- id: m_grant_fact_security_risk
  type: example
  statement: GRANT表权限时用户可通过ALTER默认值/约束增加表达式或创建索引增加表达式导致权限利用风险。
  status: confirmed
  source_anchor: 2.4.2.11.2 L73-73
- id: m_grant_fact_privilege_types
  type: example
  statement: 表/视图权限：SELECT/INSERT/UPDATE/DELETE/TRUNCATE/REFERENCES/ALTER/DROP/COMMENT/INDEX/VACUUM。序列：USAGE/SELECT/UPDATE/ALTER/DROP。模式：USAGE/CREATE。
  status: confirmed
  source_anchor: 2.4.2.11.2 L162-203
