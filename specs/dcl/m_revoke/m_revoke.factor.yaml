facts:
- id: m_revoke_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.15.6 L2-2
- id: m_revoke_fact_syntax
  type: syntax
  statement: "对象回收包括表/列权限、GRANT OPTION FOR、TABLE/GROUP 与 RESTRICT。"
  status: confirmed
  source_anchor: 2.4.2.15.6 L17-24
- id: m_revoke_fact_columns
  type: syntax
  statement: 列级回收允许按列列表撤销指定权限。
  status: confirmed
  source_anchor: 2.4.2.15.6 L28-32
- id: m_revoke_fact_grant_option
  type: behavior_oracle
  statement: GRANT OPTION FOR 只撤销再授权权力，不撤销权限本身。
  status: confirmed
  source_anchor: 2.4.2.15.6 L91-91
- id: m_revoke_fact_grantor
  type: environment
  statement: 用户只能撤销自己直接赋予的权限；本批 setup 和目标使用同一对象创建者。
  status: confirmed
  source_anchor: 2.4.2.15.6 L96-100
- id: m_revoke_fact_alternative_paths
  type: behavior_oracle
  statement: 撤销某一路授权不等于失去通过 PUBLIC 或其他角色继承的权限。
  status: confirmed
  source_anchor: 2.4.2.15.6 L86-91
- id: m_revoke_fact_dependent_grants
  type: constraint
  statement: 存在下游依赖授权时必须 CASCADE；本批不创建下游授权，使用缺省/RESTRICT。
  status: confirmed
  source_anchor: 2.4.2.15.6 L93-94
- id: m_revoke_fact_database_mapping
  type: environment
  statement: ON DATABASE 是否映射到 ON SCHEMA 取决于 grant_database_nomapping。
  status: confirmed
  source_anchor: 2.4.2.15.6 L52-56
- id: m_revoke_fact_purpose
  type: example
  statement: 撤销角色和用户的权限。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_revoke_fact_constraint
  type: example
  statement: 撤销权限时需要具有相应权限或为对象所有者。
  status: confirmed
  source_anchor: M-Compatibility L7-13
- id: m_revoke_fact_permission
  type: environment
  statement: 需要对象所有者或具有REVOKE权限。
  status: confirmed
  source_anchor: M-Compatibility L26-27
- id: m_revoke_fact_params
  type: example
  statement: GRANT OPTION FOR只撤销授权选项不撤销权限本身。RESTRICT如果有依赖权限则报错（缺省）。CASCADE级联撤销所有依赖权限。
  status: confirmed
  source_anchor: M-Compatibility L83-85
- id: m_revoke_fact_example
  type: example
  statement: m_revoke的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L108-109
