schema_version: 1
kind: factor
id: grant
name: GRANT
category: DCL
status: needs_review
description: 分离建模对象权限、角色成员关系、SYSADMIN、ANY、DATABASE LINK 与 PUBLIC SYNONYM 六类授权语法。
source:
  product: GaussDB
  document: 集中式版参考 / 1.13.13.2 GRANT
  version: V2.0-10.0.0
  artifact_sha256: 2295bae9bcf806fe3f381008275c62dfbeeafca22b215162e370c7f36ef431a4
  parent_pdf_sha256: 716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe
  extraction_rule_version: gaussdb-pdf-outline-v1
  extraction_date: "2026-09-04"
  catalog_chapter_ref:
    document_id: gaussdb_v2_0_10_0_0_centralized_reference_01
    source_relpath: general/dcl/grant.txt
    chapter_sha256: 2295bae9bcf806fe3f381008275c62dfbeeafca22b215162e370c7f36ef431a4
source_ledger_ref: source_ledger_grant
syntax_ref: syntax_grant
dimensions:
  statement_form:
    description: 六类互不混写的顶层 GRANT 产生式。
    default_value_id: grant_form_object
    classes:
      - id: grant_form_object_class
        meaning: 授予数据库对象权限。
        values:
          - {id: grant_form_object, render: "", representative: true, validity: valid, fact_refs: [grant_fact_object_grants]}
      - id: grant_form_membership_class
        meaning: 授予角色成员关系。
        values:
          - {id: grant_form_role_membership, render: "", representative: true, validity: valid, fact_refs: [grant_fact_role_syntax]}
      - id: grant_form_sysadmin_class
        meaning: 通过 ALL PRIVILEGE(S) 授予 SYSADMIN。
        values:
          - {id: grant_form_sysadmin, render: "", representative: true, validity: valid, fact_refs: [grant_fact_sysadmin_syntax]}
      - id: grant_form_any_class
        meaning: 授予 ANY 权限。
        values:
          - {id: grant_form_any, render: "", representative: true, validity: valid, fact_refs: [grant_fact_any_syntax]}
      - id: grant_form_database_link_class
        meaning: 授予 DATABASE LINK 权限。
        values:
          - {id: grant_form_database_link, render: "", representative: true, validity: valid, fact_refs: [grant_fact_database_link_syntax]}
      - id: grant_form_public_synonym_class
        meaning: 授予 PUBLIC SYNONYM 权限。
        values:
          - {id: grant_form_public_synonym, render: "", representative: true, validity: valid, fact_refs: [grant_fact_public_synonym_syntax]}
  object_privilege:
    description: 对象授权中的权限子句，与对象目标通过 allowed_target_kinds 约束。
    default_value_id: grant_priv_select
    classes:
      - id: grant_priv_table_and_sequence_class
        meaning: 表或序列共用及表专属权限。
        values:
          - {id: grant_priv_select, render: SELECT, representative: true, validity: valid, properties: {allowed_target_kinds: [table, sequence]}, fact_refs: [grant_fact_table_syntax, grant_fact_sequence_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_insert, render: INSERT, representative: true, validity: valid, properties: {allowed_target_kinds: [table]}, fact_refs: [grant_fact_table_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_update, render: UPDATE, representative: true, validity: valid, properties: {allowed_target_kinds: [table, sequence]}, fact_refs: [grant_fact_table_syntax, grant_fact_sequence_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_delete, render: DELETE, representative: true, validity: valid, properties: {allowed_target_kinds: [table]}, fact_refs: [grant_fact_table_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_truncate, render: TRUNCATE, representative: false, validity: valid, properties: {allowed_target_kinds: [table]}, fact_refs: [grant_fact_table_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_references, render: REFERENCES, representative: false, validity: valid, properties: {allowed_target_kinds: [table]}, fact_refs: [grant_fact_table_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_trigger, render: TRIGGER, representative: false, validity: valid, properties: {allowed_target_kinds: [table]}, fact_refs: [grant_fact_table_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_index, render: INDEX, representative: false, validity: valid, properties: {allowed_target_kinds: [table]}, fact_refs: [grant_fact_table_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_vacuum, render: VACUUM, representative: false, validity: valid, properties: {allowed_target_kinds: [table]}, fact_refs: [grant_fact_table_syntax, grant_fact_privilege_semantics]}
      - id: grant_priv_shared_management_class
        meaning: 多种对象共用的管理权限。
        values:
          - {id: grant_priv_alter, render: ALTER, representative: true, validity: valid, properties: {allowed_target_kinds: [table, sequence, schema]}, fact_refs: [grant_fact_table_syntax, grant_fact_sequence_syntax, grant_fact_schema_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_drop, render: DROP, representative: false, validity: valid, properties: {allowed_target_kinds: [table, sequence, schema]}, fact_refs: [grant_fact_table_syntax, grant_fact_sequence_syntax, grant_fact_schema_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_comment, render: COMMENT, representative: false, validity: valid, properties: {allowed_target_kinds: [table, sequence, schema]}, fact_refs: [grant_fact_table_syntax, grant_fact_sequence_syntax, grant_fact_schema_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_usage, render: USAGE, representative: true, validity: valid, properties: {allowed_target_kinds: [sequence, schema]}, fact_refs: [grant_fact_sequence_syntax, grant_fact_schema_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_create, render: CREATE, representative: true, validity: valid, properties: {allowed_target_kinds: [schema]}, fact_refs: [grant_fact_schema_syntax, grant_fact_privilege_semantics]}
      - id: grant_priv_all_class
        meaning: 适用于已建模对象目标的 ALL 拼写。
        values:
          - {id: grant_priv_all, render: ALL, representative: true, validity: valid, properties: {allowed_target_kinds: [table, sequence, schema]}, fact_refs: [grant_fact_table_syntax, grant_fact_sequence_syntax, grant_fact_schema_syntax, grant_fact_all_privileges_environment]}
          - {id: grant_priv_all_privileges, render: ALL PRIVILEGES, representative: false, validity: valid, properties: {allowed_target_kinds: [table, sequence, schema]}, fact_refs: [grant_fact_table_syntax, grant_fact_sequence_syntax, grant_fact_schema_syntax, grant_fact_all_privileges_environment]}
      - id: grant_priv_column_class
        meaning: 字段级权限把列清单保留在权限子句内。
        values:
          - {id: grant_priv_column_select, render: "SELECT (col_1)", representative: true, validity: valid, properties: {allowed_target_kinds: [column]}, fact_refs: [grant_fact_column_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_column_insert, render: "INSERT (col_1)", representative: false, validity: valid, properties: {allowed_target_kinds: [column]}, fact_refs: [grant_fact_column_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_column_update, render: "UPDATE (col_2)", representative: true, validity: valid, properties: {allowed_target_kinds: [column]}, fact_refs: [grant_fact_column_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_column_references, render: "REFERENCES (col_1)", representative: false, validity: valid, properties: {allowed_target_kinds: [column]}, fact_refs: [grant_fact_column_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_column_comment, render: "COMMENT (col_2)", representative: false, validity: valid, properties: {allowed_target_kinds: [column]}, fact_refs: [grant_fact_column_syntax, grant_fact_privilege_semantics]}
          - {id: grant_priv_column_select_update, render: "SELECT (col_1, col_2), UPDATE (col_2)", representative: true, validity: valid, properties: {allowed_target_kinds: [column]}, fact_refs: [grant_fact_column_syntax, grant_example_column_permissions]}
          - {id: grant_priv_column_all, render: "ALL (col_1, col_2)", representative: true, validity: valid, properties: {allowed_target_kinds: [column]}, fact_refs: [grant_fact_column_syntax, grant_fact_all_privileges_environment]}
          - {id: grant_priv_column_all_privileges, render: "ALL PRIVILEGES (col_1, col_2)", representative: false, validity: valid, properties: {allowed_target_kinds: [column]}, fact_refs: [grant_fact_column_syntax, grant_fact_all_privileges_environment]}
  object_target:
    description: 对象种类和受控对象名称；未具备安全前置对象的种类保留在矩阵缺口。
    profile_source:
      matrix_ref: matrix_grant_object_targets
      profile_id_path: profiles.id
    default_value_id: grant_target_table
  object_grantee:
    description: 对象权限的一个或两个受权主体，独立于对象和权限。
    default_value_id: grant_grantee_role
    classes:
      - id: grant_grantee_role_class
        meaning: 角色或用户。
        values:
          - {id: grant_grantee_role, render: grant_recipient, representative: true, validity: valid, properties: {is_public: false}, fact_refs: [grant_fact_object_grants, grant_fact_existing_identifiers]}
          - {id: grant_grantee_group_role, render: GROUP grant_recipient, representative: false, validity: valid, properties: {is_public: false}, fact_refs: [grant_fact_object_grants, grant_fact_existing_identifiers]}
          - {id: grant_grantee_two_roles, render: "grant_recipient, grant_recipient_two", representative: true, validity: valid, properties: {is_public: false}, fact_refs: [grant_fact_object_grants, grant_open_unbounded_lists]}
      - id: grant_grantee_public_class
        meaning: 所有当前和未来角色。
        values:
          - {id: grant_grantee_public, render: PUBLIC, representative: true, validity: valid, properties: {is_public: true}, fact_refs: [grant_fact_public_semantics]}
  grant_option:
    description: 对象权限是否可由受权主体继续授予。
    default_value_id: grant_option_absent
    classes:
      - id: grant_option_none_class
        meaning: 不允许转授。
        values:
          - {id: grant_option_absent, render: "", representative: true, validity: valid}
      - id: grant_option_present_class
        meaning: 允许转授对象权限。
        values:
          - {id: grant_option_with_grant, render: " WITH GRANT OPTION", representative: true, validity: valid, fact_refs: [grant_fact_grant_option]}
  role_source:
    description: 角色成员关系中的源角色列表，有限展开至两个。
    default_value_id: grant_role_source_one
    classes:
      - id: grant_role_source_class
        meaning: 一个或两个已存在源角色。
        values:
          - {id: grant_role_source_one, render: grant_source_role, representative: true, validity: valid, fact_refs: [grant_fact_role_syntax, grant_fact_existing_identifiers]}
          - {id: grant_role_source_two, render: "grant_source_role, grant_source_role_two", representative: false, validity: valid, fact_refs: [grant_fact_role_syntax, grant_open_unbounded_lists]}
  role_recipient:
    description: 角色、ANY 和专用权限语法的受权角色列表，有限展开至两个。
    default_value_id: grant_role_recipient_one
    classes:
      - id: grant_role_recipient_class
        meaning: 一个或两个已存在受权角色。
        values:
          - {id: grant_role_recipient_one, render: grant_recipient, representative: true, validity: valid, fact_refs: [grant_fact_existing_identifiers]}
          - {id: grant_role_recipient_group, render: GROUP grant_recipient, representative: false, validity: valid, fact_refs: [grant_fact_any_syntax, grant_fact_existing_identifiers]}
          - {id: grant_role_recipient_two, render: "grant_recipient, grant_recipient_two", representative: true, validity: valid, fact_refs: [grant_open_unbounded_lists]}
  admin_option:
    description: 角色成员关系或 ANY/PUBLIC SYNONYM 权限是否允许再授权。
    default_value_id: grant_admin_option_absent
    classes:
      - id: grant_admin_none_class
        meaning: 不带 ADMIN OPTION。
        values:
          - {id: grant_admin_option_absent, render: "", representative: true, validity: valid}
      - id: grant_admin_present_class
        meaning: 带 ADMIN OPTION。
        values:
          - {id: grant_admin_option_with_admin, render: " WITH ADMIN OPTION", representative: true, validity: valid, fact_refs: [grant_fact_admin_option]}
  sysadmin_spelling:
    description: SYSADMIN 授权产生式的两个文档拼写。
    default_value_id: grant_sysadmin_privileges
    classes:
      - id: grant_sysadmin_spelling_class
        meaning: PRIVILEGES 复数或 PRIVILEGE 单数。
        values:
          - {id: grant_sysadmin_privileges, render: PRIVILEGES, representative: true, validity: valid, fact_refs: [grant_fact_sysadmin_syntax]}
          - {id: grant_sysadmin_privilege, render: PRIVILEGE, representative: false, validity: valid, fact_refs: [grant_fact_sysadmin_syntax]}
  any_privilege:
    description: 文档列出的 ANY 权限；每个权限保持独立候选，另含一个双项列表代表。
    default_value_id: grant_any_create_table
    classes:
      - id: grant_any_privilege_class
        meaning: 受支持的单项 ANY 权限。
        values:
          - {id: grant_any_create_table, render: CREATE ANY TABLE, representative: true, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_alter_table, render: ALTER ANY TABLE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_drop_table, render: DROP ANY TABLE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_select_table, render: SELECT ANY TABLE, representative: true, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_insert_table, render: INSERT ANY TABLE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_update_table, render: UPDATE ANY TABLE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_delete_table, render: DELETE ANY TABLE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_truncate_table, render: TRUNCATE ANY TABLE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_create_sequence, render: CREATE ANY SEQUENCE, representative: true, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_create_index, render: CREATE ANY INDEX, representative: true, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_create_function, render: CREATE ANY FUNCTION, representative: true, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_execute_function, render: EXECUTE ANY FUNCTION, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_create_package, render: CREATE ANY PACKAGE, representative: true, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_execute_package, render: EXECUTE ANY PACKAGE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_create_type, render: CREATE ANY TYPE, representative: true, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_alter_type, render: ALTER ANY TYPE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_drop_type, render: DROP ANY TYPE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_alter_sequence, render: ALTER ANY SEQUENCE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_drop_sequence, render: DROP ANY SEQUENCE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_select_sequence, render: SELECT ANY SEQUENCE, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_alter_index, render: ALTER ANY INDEX, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_drop_index, render: DROP ANY INDEX, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_create_synonym, render: CREATE ANY SYNONYM, representative: true, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_drop_synonym, render: DROP ANY SYNONYM, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_create_trigger, render: CREATE ANY TRIGGER, representative: true, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_alter_trigger, render: ALTER ANY TRIGGER, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
          - {id: grant_any_drop_trigger, render: DROP ANY TRIGGER, representative: false, validity: valid, fact_refs: [grant_fact_any_supported_list]}
      - id: grant_any_list_class
        meaning: 有限代表两个 ANY 权限的逗号列表。
        values:
          - {id: grant_any_select_update_pair, render: "SELECT ANY TABLE, UPDATE ANY TABLE", representative: true, validity: valid, fact_refs: [grant_fact_any_syntax, grant_open_unbounded_lists]}
  database_link_privilege:
    description: DATABASE LINK 权限词。
    default_value_id: grant_dblink_create
    classes:
      - id: grant_dblink_privilege_class
        meaning: 创建、修改或删除 DATABASE LINK。
        values:
          - {id: grant_dblink_create, render: CREATE, representative: true, validity: valid, fact_refs: [grant_fact_database_link_syntax]}
          - {id: grant_dblink_alter, render: ALTER, representative: false, validity: valid, fact_refs: [grant_fact_database_link_syntax]}
          - {id: grant_dblink_drop, render: DROP, representative: false, validity: valid, fact_refs: [grant_fact_database_link_syntax]}
  database_link_public:
    description: DATABASE LINK 是否为 PUBLIC。
    default_value_id: grant_dblink_private
    classes:
      - id: grant_dblink_visibility_class
        meaning: 私有或所有用户可见。
        values:
          - {id: grant_dblink_private, render: "", representative: true, validity: valid}
          - {id: grant_dblink_public, render: "PUBLIC ", representative: true, validity: valid, fact_refs: [grant_fact_database_link_public]}
  public_synonym_privilege:
    description: PUBLIC SYNONYM 权限词。
    default_value_id: grant_public_synonym_create
    classes:
      - id: grant_public_synonym_privilege_class
        meaning: 创建或删除 PUBLIC SYNONYM。
        values:
          - {id: grant_public_synonym_create, render: CREATE, representative: true, validity: valid, fact_refs: [grant_fact_public_synonym_syntax]}
          - {id: grant_public_synonym_drop, render: DROP, representative: false, validity: valid, fact_refs: [grant_fact_public_synonym_syntax]}
rules:
  - id: grant_rule_object_privilege_matches_target
    kind: requires
    expression: "statement_form != 'grant_form_object' or object_target.properties.target_kind in object_privilege.properties.allowed_target_kinds"
    severity: error
    fact_refs: [grant_fact_table_syntax, grant_fact_column_syntax, grant_fact_sequence_syntax, grant_fact_schema_syntax]
  - id: grant_rule_public_without_grant_option
    kind: requires
    expression: "statement_form != 'grant_form_object' or object_grantee.properties.is_public == False or grant_option == 'grant_option_absent'"
    severity: error
    fact_refs: [grant_fact_public_restrictions, grant_fact_grant_option]
structural_checks: []
facts:
  - {id: grant_fact_purpose, type: syntax, statement: "GRANT 对角色和用户执行授权。", status: confirmed, source_anchor: "L2-L5"}
  - {id: grant_fact_system_privileges, type: syntax, statement: "SYSADMIN 可由 GRANT ALL PRIVILEGE(S) 授予，其余系统权限通常由 CREATE/ALTER ROLE 指定。", status: confirmed, source_anchor: "L6-L14"}
  - {id: grant_fact_system_privilege_noninheritance, type: behavior_oracle, statement: "系统权限不通过 ROLE 或 USER 权限继承。", status: confirmed, source_anchor: "L12-L14; L226-L231"}
  - {id: grant_fact_object_grants, type: syntax, statement: "对象权限由权限、对象目标、主体和可选 GRANT OPTION 构成并追加生效。", status: confirmed, source_anchor: "L15-L24"}
  - {id: grant_fact_public_semantics, type: behavior_oracle, statement: "PUBLIC 代表当前和未来所有角色。", status: confirmed, source_anchor: "L20-L22"}
  - {id: grant_fact_public_restrictions, type: constraint, statement: "WITH GRANT OPTION 和 ANY 权限不能授予 PUBLIC。", status: confirmed, source_anchor: "L23-L24; L65-L66; L377-L379"}
  - {id: grant_fact_grant_option, type: behavior_oracle, statement: "WITH GRANT OPTION 允许受权者继续授予对象权限。", status: confirmed, source_anchor: "L23-L24; L377-L379"}
  - {id: grant_fact_default_public_privileges, type: behavior_oracle, statement: "不同对象类型具有不同的默认 PUBLIC 权限，且默认值可修改。", status: confirmed, source_anchor: "L25-L33"}
  - {id: grant_fact_security_guidance, type: environment, statement: "文档给出同事务授权、最小授权和定义者代码等安全约束与建议。", status: confirmed, source_anchor: "L30-L33; L77-L87; L252-L260"}
  - {id: grant_fact_owner_implicit_privileges, type: behavior_oracle, statement: "对象所有者隐式拥有文档列出的固有管理权限和再授予权。", status: confirmed, source_anchor: "L34-L36"}
  - {id: grant_fact_role_membership, type: lifecycle, statement: "角色成员关系传递对象权限，源角色变化会影响继承者。", status: confirmed, source_anchor: "L37-L43; L188-L193"}
  - {id: grant_fact_admin_option, type: behavior_oracle, statement: "WITH ADMIN OPTION 允许再次授予或回收角色及 ANY 权限。", status: confirmed, source_anchor: "L40-L43; L393-L397"}
  - {id: grant_fact_role_admin_environment, type: environment, statement: "角色授权能力受三权分立状态和管理员类型约束。", status: confirmed, source_anchor: "L44-L46; L387-L391"}
  - {id: grant_fact_any_permissions, type: behavior_oracle, statement: "ANY 权限是独立的数据库内权限，可继承并可带 ADMIN OPTION。", status: confirmed, source_anchor: "L47-L52"}
  - {id: grant_fact_any_environment, type: environment, statement: "ANY 权限由初始用户或三权分立关闭时的系统管理员授予。", status: confirmed, source_anchor: "L47-L52"}
  - {id: grant_fact_any_supported_list, type: syntax, statement: "文档明确列出 27 项受支持 ANY 权限。", status: confirmed, source_anchor: "L53-L63; L236-L245"}
  - {id: grant_fact_any_database_scope, type: behavior_oracle, statement: "ANY 权限仅作用于授予它的当前数据库，且与原有权限独立。", status: confirmed, source_anchor: "L67-L70"}
