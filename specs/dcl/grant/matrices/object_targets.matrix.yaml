schema_version: 1
kind: matrix
id: matrix_grant_object_targets
name: GRANT 对象目标与前置能力矩阵
status: needs_review
description: 当前只提供可由本包安全 fixture 构造的表、字段、序列和模式目标；其余文档对象保持 needs_profile。
factor_ref: grant
profile_property_defaults: {requires_existing_object: true}
profiles:
  - id: grant_target_table
    render: TABLE grant_schema.grant_table
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: table, target_scope: single, object_type: table}
    fact_refs: [grant_fact_table_syntax, grant_fact_existing_identifiers]
  - id: grant_target_table_bare
    render: grant_schema.grant_table
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: table, target_scope: single, object_type: table, table_keyword: absent}
    fact_refs: [grant_fact_table_syntax, grant_fact_existing_identifiers]
  - id: grant_target_table_pair
    render: "TABLE grant_schema.grant_table, grant_schema.grant_table_two"
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: table, target_scope: two_objects, object_type: table}
    fact_refs: [grant_fact_table_syntax, grant_fact_existing_identifiers, grant_open_unbounded_lists]
  - id: grant_target_all_tables_schema
    render: ALL TABLES IN SCHEMA grant_schema
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: table, target_scope: all_in_schema, object_type: table}
    fact_refs: [grant_fact_table_syntax, grant_fact_existing_identifiers]
  - id: grant_target_column_table
    render: TABLE grant_schema.grant_table
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: column, target_scope: single, object_type: table}
    fact_refs: [grant_fact_column_syntax, grant_fact_existing_identifiers]
  - id: grant_target_column_table_bare
    render: grant_schema.grant_table
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: column, target_scope: single, object_type: table, table_keyword: absent}
    fact_refs: [grant_fact_column_syntax, grant_fact_existing_identifiers]
  - id: grant_target_column_table_pair
    render: "TABLE grant_schema.grant_table, grant_schema.grant_table_two"
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: column, target_scope: two_objects, object_type: table}
    fact_refs: [grant_fact_column_syntax, grant_fact_existing_identifiers, grant_open_unbounded_lists]
  - id: grant_target_sequence
    render: SEQUENCE grant_schema.grant_seq
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: sequence, target_scope: single, object_type: sequence}
    fact_refs: [grant_fact_sequence_syntax, grant_fact_existing_identifiers]
  - id: grant_target_sequence_bare
    render: grant_schema.grant_seq
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: sequence, target_scope: single, object_type: sequence, sequence_keyword: absent}
    fact_refs: [grant_fact_sequence_syntax, grant_fact_existing_identifiers]
  - id: grant_target_sequence_pair
    render: "SEQUENCE grant_schema.grant_seq, grant_schema.grant_seq_two"
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: sequence, target_scope: two_objects, object_type: sequence}
    fact_refs: [grant_fact_sequence_syntax, grant_fact_existing_identifiers, grant_open_unbounded_lists]
  - id: grant_target_large_sequence
    render: LARGE SEQUENCE grant_schema.grant_seq
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: sequence, target_scope: single, object_type: large_sequence}
    fact_refs: [grant_fact_sequence_syntax, grant_fact_existing_identifiers]
  - id: grant_target_all_sequences_schema
    render: ALL SEQUENCES IN SCHEMA grant_schema
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: sequence, target_scope: all_in_schema, object_type: sequence}
    fact_refs: [grant_fact_sequence_syntax, grant_fact_existing_identifiers]
  - id: grant_target_schema
    render: SCHEMA grant_schema
    validity: valid
    fixture_refs: [fixture_grant_core_objects]
    properties: {target_kind: schema, target_scope: single, object_type: schema}
    fact_refs: [grant_fact_schema_syntax, grant_fact_existing_identifiers]
documented_features:
  - {id: grant_target_feature_table, profile_refs: [grant_target_table, grant_target_table_bare, grant_target_table_pair, grant_target_all_tables_schema], status: covered, coverage_mode: all, fact_refs: [grant_fact_table_syntax]}
  - {id: grant_target_feature_view, status: needs_profile, fact_refs: [grant_fact_table_syntax, grant_open_object_target_profiles]}
  - {id: grant_target_feature_column, profile_refs: [grant_target_column_table, grant_target_column_table_bare, grant_target_column_table_pair], status: covered, coverage_mode: all, fact_refs: [grant_fact_column_syntax]}
  - {id: grant_target_feature_sequence, profile_refs: [grant_target_sequence, grant_target_sequence_bare, grant_target_sequence_pair, grant_target_large_sequence, grant_target_all_sequences_schema], status: covered, coverage_mode: all, fact_refs: [grant_fact_sequence_syntax]}
  - {id: grant_target_feature_database, status: needs_profile, fact_refs: [grant_fact_database_syntax, grant_open_object_target_profiles]}
  - {id: grant_target_feature_domain_unsupported, status: needs_profile, fact_refs: [grant_fact_domain_syntax, grant_fact_domain_unsupported, grant_open_object_target_profiles]}
  - {id: grant_target_feature_client_master_key, status: needs_profile, fact_refs: [grant_fact_cmk_syntax, grant_fact_encryption_environment, grant_open_object_target_profiles]}
  - {id: grant_target_feature_column_encryption_key, status: needs_profile, fact_refs: [grant_fact_cek_syntax, grant_fact_encryption_environment, grant_open_object_target_profiles]}
  - {id: grant_target_feature_foreign_data_wrapper, status: needs_profile, fact_refs: [grant_fact_fdw_syntax, grant_open_object_target_profiles]}
  - {id: grant_target_feature_foreign_server, status: needs_profile, fact_refs: [grant_fact_foreign_server_syntax, grant_open_object_target_profiles]}
  - {id: grant_target_feature_function, status: needs_profile, fact_refs: [grant_fact_function_syntax, grant_fact_function_signature_identifiers, grant_open_object_target_profiles]}
  - {id: grant_target_feature_procedure, status: needs_profile, fact_refs: [grant_fact_procedure_syntax, grant_fact_function_signature_identifiers, grant_open_object_target_profiles]}
  - {id: grant_target_feature_language, status: needs_profile, fact_refs: [grant_fact_language_syntax, grant_open_object_target_profiles]}
  - {id: grant_target_feature_schema, profile_refs: [grant_target_schema], status: covered, coverage_mode: all, fact_refs: [grant_fact_schema_syntax]}
  - {id: grant_target_feature_tablespace, status: needs_profile, fact_refs: [grant_fact_tablespace_syntax, grant_open_object_target_profiles]}
  - {id: grant_target_feature_type_unsupported, status: needs_profile, fact_refs: [grant_fact_type_syntax, grant_fact_type_unsupported, grant_open_object_target_profiles]}
  - {id: grant_target_feature_directory, status: needs_profile, fact_refs: [grant_fact_directory_syntax, grant_open_object_target_profiles]}
  - {id: grant_target_feature_package, status: needs_profile, fact_refs: [grant_fact_package_syntax, grant_open_object_target_profiles]}
fact_refs:
  - grant_fact_existing_identifiers
  - grant_fact_table_syntax
  - grant_fact_column_syntax
  - grant_fact_sequence_syntax
  - grant_fact_database_syntax
  - grant_fact_domain_syntax
  - grant_fact_cmk_syntax
  - grant_fact_cek_syntax
  - grant_fact_fdw_syntax
  - grant_fact_foreign_server_syntax
