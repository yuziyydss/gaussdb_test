schema_version: 1
kind: fixture
id: fixture_grant_core_objects
name: GRANT 普通模式内对象
status: ready
description: 只为表、字段、序列和模式授权提供受控前置对象；不创建、删除或接管任何全局角色。
factor_ref: grant
provides:
  tables:
    - name: grant_schema.grant_table
      persistence: permanent
      table_kind: regular
      columns:
        - {name: col_1, type: INTEGER, nullable: false}
        - {name: col_2, type: INTEGER, nullable: true}
    - name: grant_schema.grant_table_two
      persistence: permanent
      table_kind: regular
      columns:
        - {name: col_1, type: INTEGER, nullable: false}
        - {name: col_2, type: INTEGER, nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP SCHEMA IF EXISTS grant_schema CASCADE
    - CREATE SCHEMA grant_schema
    - CREATE TABLE grant_schema.grant_table (col_1 INTEGER NOT NULL, col_2 INTEGER)
    - CREATE TABLE grant_schema.grant_table_two (col_1 INTEGER NOT NULL, col_2 INTEGER)
    - INSERT INTO grant_schema.grant_table VALUES (1, 10), (2, 20)
    - INSERT INTO grant_schema.grant_table_two VALUES (1, 100), (2, 200)
    - CREATE SEQUENCE grant_schema.grant_seq
    - CREATE SEQUENCE grant_schema.grant_seq_two
  teardown_sqls:
    - DROP SCHEMA IF EXISTS grant_schema CASCADE
  note: 显式生命周期同时准备序列；V1 provides 当前只能声明表。具名受权主体必须由 manifest 的 environment_requirements 预置，固定全局角色绝不在 fixture 中无条件删除。
