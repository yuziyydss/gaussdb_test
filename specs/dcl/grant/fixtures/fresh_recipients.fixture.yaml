schema_version: 1
kind: fixture
id: fixture_grant_fresh_recipients
name: GRANT 独占新受权角色
status: needs_review
description: >-
  为非对象权限语法准备两个新受权角色，不创建无关源角色或业务对象。
  CREATE ROLE 来源由 manifest/scenario 的 create_role 导出事实绑定。
  角色不属于 Schema，不能用空 Schema 代替全局名字隔离。
factor_ref: grant
provides: {tables: []}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - BEGIN;
    - CREATE ROLE grant_recipient NOSYSADMIN NOLOGIN PASSWORD DISABLE;
    - CREATE ROLE grant_recipient_two NOSYSADMIN NOLOGIN PASSWORD DISABLE;
  teardown_sqls:
    - ROLLBACK;
  note: >-
    SQL 已定义但尚未执行验证；未来需独立授权、隔离实例、新连接且无外层事务。
    两个全局名字必须未占用，任一 CREATE 失败就停止目标并回滚；不预先 DROP，
    不接管已有角色，不 DROP OWNED、不吞异常。必须核验角色与权限实际无残留，
    不能从 ROLLBACK 文本推断成功。禁止把本 fixture 接到已有主体的提权用例。
