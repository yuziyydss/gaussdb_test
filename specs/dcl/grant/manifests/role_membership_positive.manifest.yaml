schema_version: 1
kind: manifest
id: manifest_grant_role_membership_positive
name: GRANT 普通新角色成员关系有限组合
status: needs_review
description: >-
  原文 L222-L225 的单/双源角色、单/双接收角色与 ADMIN OPTION 有限 Pairwise。
  使用独占新角色，不修改已有主体；只做静态语法候选，不验证权限传播、回滚或角色残留。
  长度一和二是测试选域，不是产品列表上界。
factor_ref: grant
syntax_ref: syntax_grant
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_grant_fresh_membership_roles]
identifier_policy: {}
environment_requirements:
  - key: executor_role
    allowed_values: [system_administrator]
    fact_refs: [grant_fact_role_admin_environment, create_role::create_role_fact_privilege, create_role::create_role_fact_disable_admin]
  - key: separation_of_duties
    allowed_values: ["off"]
    fact_refs: [grant_fact_role_admin_environment, create_role::create_role_fact_sysadmin_duty_off]
  - key: role_test_environment
    allowed_values: [isolated_instance_fresh_names]
    fact_refs: [grant_fact_security_guidance, grant_fact_existing_identifiers]
bindings:
  statement_form: [grant_form_role_membership]
  role_source: [grant_role_source_one, grant_role_source_two]
  role_recipient: [grant_role_recipient_one, grant_role_recipient_two]
  admin_option: [grant_admin_option_absent, grant_admin_option_with_admin]
local_rules:
  - expression: "role_recipient != 'grant_role_recipient_group'"
    rationale: 本角色成员关系产生式未包含 GROUP；GROUP 取值属于对象或 ANY 分支，不因共享维度而混入本清单。
    fact_refs: [grant_fact_role_syntax, grant_fact_any_syntax]
expected:
  default: success
  scope: syntax_only
  fact_refs: [grant_fact_role_syntax, grant_fact_existing_identifiers]
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
