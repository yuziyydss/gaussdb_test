schema_version: 1
kind: manifest
id: manifest_grant_sysadmin_spelling
name: GRANT SYSADMIN 单接收方两种拼写
status: needs_review
description: >-
  原文L232-L235的PRIVILEGE/PRIVILEGES两条有限语法候选，不是对象级ALL授权。
  只有一个变化轴，采用两项全枚举，不把固定轴pair数解释成功能组合覆盖。
  未执行，必须另外审批SYSADMIN授权测试；不用于既有或可登录主体。
factor_ref: grant
syntax_ref: syntax_grant
suite_type: positive
strategy: full_cartesian
fixture_refs: [fixture_grant_fresh_single_recipient]
identifier_policy: {}
environment_requirements:
  - key: executor_role
    allowed_values: [system_administrator]
    fact_refs: [grant_fact_all_privileges_environment, create_role::create_role_fact_privilege, create_role::create_role_fact_disable_admin]
  - key: separation_of_duties
    allowed_values: ["off"]
    fact_refs: [create_role::create_role_fact_sysadmin_duty_off]
  - key: role_test_environment
    allowed_values: [isolated_instance_fresh_names]
    fact_refs: [grant_fact_security_guidance, grant_fact_existing_identifiers]
bindings:
  statement_form: [grant_form_sysadmin]
  sysadmin_spelling: [grant_sysadmin_privileges, grant_sysadmin_privilege]
  role_recipient: [grant_role_recipient_one]
local_rules:
  - expression: "role_recipient == 'grant_role_recipient_one'"
    rationale: SYSADMIN产生式只给单个role_name，不含GROUP或逗号列表；不得混用其他分支的共享接收方值。
    fact_refs: [grant_fact_sysadmin_syntax]
expected:
  default: success
  scope: syntax_only
  fact_refs: [grant_fact_sysadmin_syntax, grant_fact_all_privileges_environment, grant_fact_existing_identifiers]
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
