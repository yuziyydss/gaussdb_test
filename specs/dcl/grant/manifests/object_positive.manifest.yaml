  object_privilege:
    - grant_priv_select
    - grant_priv_insert
    - grant_priv_update
    - grant_priv_delete
    - grant_priv_truncate
    - grant_priv_references
    - grant_priv_trigger
    - grant_priv_index
    - grant_priv_vacuum
    - grant_priv_alter
    - grant_priv_drop
    - grant_priv_comment
    - grant_priv_usage
    - grant_priv_create
    - grant_priv_column_select
    - grant_priv_column_insert
    - grant_priv_column_update
    - grant_priv_column_references
    - grant_priv_column_comment
    - grant_priv_column_select_update
  object_target:
    - grant_target_table
    - grant_target_table_bare
    - grant_target_table_pair
    - grant_target_all_tables_schema
    - grant_target_column_table
    - grant_target_column_table_bare
    - grant_target_column_table_pair
    - grant_target_sequence
    - grant_target_sequence_bare
    - grant_target_sequence_pair
