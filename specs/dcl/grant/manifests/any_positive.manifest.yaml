schema_version: 1
kind: manifest
id: manifest_grant_any_positive
name: GRANT ANY 文档有限语法组合
status: needs_review
description: >-
  根据原文 L47-L86、L236-L247 选择27个独立ANY权限与一个双项列表代表，
  组合三种已存在接收角色写法及ADMIN OPTION。只生成静态语法候选；不执行授权，
  不验证这些权限所允许的具体操作，不代表穷尽任意长度列表或跨数据库行为。
factor_ref: grant
syntax_ref: syntax_grant
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_grant_fresh_recipients]
identifier_policy: {}
environment_requirements:
  - key: executor_role
    allowed_values: [system_administrator]
    fact_refs: [grant_fact_any_environment, create_role::create_role_fact_privilege, create_role::create_role_fact_disable_admin]
  - key: separation_of_duties
    allowed_values: ["off"]
    fact_refs: [grant_fact_any_environment, create_role::create_role_fact_sysadmin_duty_off]
  - key: role_test_environment
    allowed_values: [isolated_instance_fresh_names]
    fact_refs: [grant_fact_security_guidance, grant_fact_existing_identifiers]
bindings:
  statement_form: [grant_form_any]
  any_privilege:
    - grant_any_create_table
    - grant_any_alter_table
    - grant_any_drop_table
    - grant_any_select_table
    - grant_any_insert_table
    - grant_any_update_table
    - grant_any_delete_table
    - grant_any_truncate_table
    - grant_any_create_sequence
    - grant_any_create_index
    - grant_any_create_function
    - grant_any_execute_function
    - grant_any_create_package
    - grant_any_execute_package
    - grant_any_create_type
    - grant_any_alter_type
    - grant_any_drop_type
    - grant_any_alter_sequence
    - grant_any_drop_sequence
    - grant_any_select_sequence
    - grant_any_alter_index
    - grant_any_drop_index
    - grant_any_create_synonym
    - grant_any_drop_synonym
    - grant_any_create_trigger
    - grant_any_alter_trigger
    - grant_any_drop_trigger
    - grant_any_select_update_pair
  role_recipient: [grant_role_recipient_one, grant_role_recipient_group, grant_role_recipient_two]
  admin_option: [grant_admin_option_absent, grant_admin_option_with_admin]
expected:
  default: success
  scope: syntax_only
  fact_refs: [grant_fact_any_syntax, grant_fact_any_supported_list, grant_fact_existing_identifiers]
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
