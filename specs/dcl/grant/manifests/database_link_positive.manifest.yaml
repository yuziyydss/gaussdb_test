schema_version: 1
kind: manifest
id: manifest_grant_database_link_positive
name: GRANT DATABASE LINK 专用权限有限语法
status: needs_review
description: >-
  PDF L249-L250三个权限词乘两种PUBLIC范围，共六条语法候选。
  这里只授予权限，不创建DATABASE LINK、不连接远端。PUBLIC修饰权限对象，不是TO PUBLIC。
  创建fixture角色的管理员条件不证明其有权授予全部专用权限；执行前另行核实授权者与安全审批。
factor_ref: grant
syntax_ref: syntax_grant
suite_type: positive
strategy: full_cartesian
fixture_refs: [fixture_grant_fresh_single_recipient]
identifier_policy: {}
environment_requirements:
  - key: fixture_executor_role
    allowed_values: [system_administrator]
    fact_refs: [create_role::create_role_fact_privilege, create_role::create_role_fact_disable_admin]
  - key: separation_of_duties
    allowed_values: ["off"]
    fact_refs: [create_role::create_role_fact_sysadmin_duty_off]
  - key: role_test_environment
    allowed_values: [isolated_instance_fresh_names]
    fact_refs: [grant_fact_security_guidance, grant_fact_existing_identifiers]
  - key: special_grant_authorization
    allowed_values: [independent_approval_and_grantor_preflight]
    fact_refs: [grant_fact_security_guidance]
bindings:
  statement_form: [grant_form_database_link]
  database_link_privilege: [grant_dblink_create, grant_dblink_alter, grant_dblink_drop]
  database_link_public: [grant_dblink_private, grant_dblink_public]
  role_recipient: [grant_role_recipient_one]
local_rules:
  - expression: "role_recipient == 'grant_role_recipient_one'"
    rationale: 本产生式只给单个role_name；不能混入其他GRANT分支的GROUP或逗号列表。
    fact_refs: [grant_fact_database_link_syntax]
expected:
  default: success
  scope: syntax_only
  fact_refs: [grant_fact_database_link_syntax, grant_fact_existing_identifiers]
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
