schema_version: 1
kind: manifest
id: manifest_grant_object_all_public_positive
name: GRANT 核心对象 PUBLIC ALL 权限环境门正向组合
status: ready
description: 在系统管理员环境对受控对象覆盖可授予 PUBLIC 的 ALL 两种拼写及字段 ALL 两种拼写；不依赖具名主体或全局角色 fixture。
factor_ref: grant
syntax_ref: syntax_grant
suite_type: positive
strategy: pairwise
fixture_refs: []
environment_requirements:
  - {key: executor_role, allowed_values: [system_administrator], fact_refs: [grant_fact_all_privileges_environment]}
identifier_policy: {}
bindings:
  statement_form: [grant_form_object]
  object_privilege: [grant_priv_all, grant_priv_all_privileges, grant_priv_column_all, grant_priv_column_all_privileges]
  object_target:
    - grant_target_table
    - grant_target_table_bare
    - grant_target_table_pair
    - grant_target_all_tables_schema
    - grant_target_column_table
    - grant_target_column_table_bare
    - grant_target_column_table_pair
    - grant_target_sequence
    - grant_target_sequence_bare
    - grant_target_sequence_pair
    - grant_target_large_sequence
    - grant_target_all_sequences_schema
    - grant_target_schema
  object_grantee: [grant_grantee_public]
  grant_option: [grant_option_absent]
local_rules:
  - expression: "object_target.properties.target_kind in object_privilege.properties.allowed_target_kinds"
    rationale: 权限的allowed_target_kinds与目标target_kind必须匹配；列权限只配列目标，表/序列/Schema权限只配对应目标。
    fact_refs: [grant_fact_object_grants, grant_fact_table_syntax, grant_fact_column_syntax, grant_fact_sequence_syntax, grant_fact_schema_syntax]

expected: {default: success, scope: syntax_and_semantics}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
