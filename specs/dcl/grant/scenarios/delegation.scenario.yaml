schema_version: 1
kind: scenario
id: scenario_grant_delegation
name: GRANT 转授权决策表
status: planned
description: 分支验证 WITH GRANT OPTION 及非所有者拥有全部、部分或没有可用授权选项时的行为。
factor_ref: grant
fixture_refs: [fixture_grant_core_objects]
fact_refs: [grant_fact_grant_option, grant_fact_public_restrictions, grant_fact_delegated_grant_behavior]
preconditions: [对象所有者与两个普通角色, 能捕获警告与目标错误]
steps:
  - {id: seed_options, action: execute_as_owner, detail: "分别授予无 GRANT OPTION、部分 GRANT OPTION 和全部 GRANT OPTION"}
  - {id: delegate, action: execute_as_grantee, detail: "尝试向第二角色转授权限以及向 PUBLIC 带 GRANT OPTION 授权"}
oracles:
  - {kind: delegation_decision_table, expected: "无权限失败；部分仅授予可转授部分；无可用选项产生文档所述警告；PUBLIC 组合被拒绝"}
execution_requirements: [database, multiple_users, warning_capture, target_error_calibration]
