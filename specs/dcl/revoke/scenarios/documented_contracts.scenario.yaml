schema_version: 1
kind: "scenario"
id: "scenario_revoke_documented_contracts"
name: "REVOKE documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "revoke"
fixture_refs: []
fact_refs:
  - "revoke_fact_purpose"
  - "revoke_fact_no_privilege"
  - "revoke_fact_partial_privilege"
  - "revoke_fact_missing_grant_option"
  - "revoke_fact_pdb"
  - "revoke_fact_effective_privileges"
  - "revoke_fact_grant_option"
  - "revoke_fact_cascade_dependency"
  - "revoke_fact_grantor_scope"
  - "revoke_fact_role_ambiguity"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "撤销一个或多个角色权限。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "非对象属主且无对象权限时立即失败。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "仅撤销具有授权选项的权限。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "无授权选项时ALL PRIVILEGES报错；指定具体无授权选项权限则警告。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "PDB内ON DATABASE仅可回收PDB自身CREATE，Non-PDB不能对PDB执行REVOKE。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "有效权限可来自直接、成员或PUBLIC，撤销单一路径不保证丧失最终权限。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "GRANT OPTION FOR只撤销转授权能力，保留权限本身。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "A授予B后回收A权限或授权选项，存在依赖授权须CASCADE。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "只能撤回自己直接授予的路径；CASCADE可沿链撤回，其他授权者路径仍可能保留。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "多层成员权限下实际执行角色可能不确定，建议先SET ROLE明确身份。"
oracles:
  -
    kind: "documented_behavior"
    expected: "仅撤销具有授权选项的权限。"
  -
    kind: "documented_behavior"
    expected: "无授权选项时ALL PRIVILEGES报错；指定具体无授权选项权限则警告。"
  -
    kind: "documented_behavior"
    expected: "有效权限可来自直接、成员或PUBLIC，撤销单一路径不保证丧失最终权限。"
  -
    kind: "documented_behavior"
    expected: "GRANT OPTION FOR只撤销转授权能力，保留权限本身。"
  -
    kind: "documented_behavior"
    expected: "只能撤回自己直接授予的路径；CASCADE可沿链撤回，其他授权者路径仍可能保留。"
execution_requirements:
  - "database"
  - "same_session"
