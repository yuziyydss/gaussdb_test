facts:
  -
    id: "revoke_fact_purpose"
    type: "lifecycle"
    statement: "撤销一个或多个角色权限。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "revoke_fact_no_privilege"
    type: "environment"
    statement: "非对象属主且无对象权限时立即失败。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "revoke_fact_partial_privilege"
    type: "behavior_oracle"
    statement: "仅撤销具有授权选项的权限。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "revoke_fact_missing_grant_option"
    type: "behavior_oracle"
    statement: "无授权选项时ALL PRIVILEGES报错；指定具体无授权选项权限则警告。"
    status: "confirmed"
    source_anchor: "L11-L13"
  -
    id: "revoke_fact_pdb"
    type: "environment"
    statement: "PDB内ON DATABASE仅可回收PDB自身CREATE，Non-PDB不能对PDB执行REVOKE。"
    status: "confirmed"
    source_anchor: "L14-L16"
  -
    id: "revoke_fact_large_sequence"
    type: "syntax"
    statement: "序列LARGE可选，回收不区分是否LARGE。"
    status: "confirmed"
    source_anchor: "L37-L38"
  -
    id: "revoke_fact_public"
    type: "syntax"
    statement: "PUBLIC表示包含全部角色的隐式组。"
    status: "confirmed"
    source_anchor: "L183-L183"
  -
    id: "revoke_fact_grant_reference"
    type: "syntax"
    statement: "权限与参数解释链接GRANT参数说明。"
    status: "confirmed"
    source_anchor: "L184-L184"
  -
    id: "revoke_fact_effective_privileges"
    type: "behavior_oracle"
    statement: "有效权限可来自直接、成员或PUBLIC，撤销单一路径不保证丧失最终权限。"
    status: "confirmed"
    source_anchor: "L185-L189"
  -
    id: "revoke_fact_grant_option"
    type: "behavior_oracle"
    statement: "GRANT OPTION FOR只撤销转授权能力，保留权限本身。"
    status: "confirmed"
    source_anchor: "L190-L190"
  -
    id: "revoke_fact_cascade_dependency"
    type: "constraint"
    statement: "A授予B后回收A权限或授权选项，存在依赖授权须CASCADE。"
    status: "confirmed"
    source_anchor: "L191-L193"
  -
    id: "revoke_fact_grantor_scope"
    type: "behavior_oracle"
    statement: "只能撤回自己直接授予的路径；CASCADE可沿链撤回，其他授权者路径仍可能保留。"
    status: "confirmed"
    source_anchor: "L195-L200"
  -
    id: "revoke_fact_role_ambiguity"
    type: "environment"
    statement: "多层成员权限下实际执行角色可能不确定，建议先SET ROLE明确身份。"
    status: "confirmed"
    source_anchor: "L202-L205"
  -
    id: "revoke_fact_syntax_tables"
    type: "syntax"
    statement: "原文选项/产生式：●   回收指定表或视图上权限。 REVOKE [ GRANT OPTION FOR ] { { SELECT | INSERT | UPDATE | DELETE | TRUNCATE | REFERENCES | ALTER | DROP | COMMENT | INDEX | VACUUM }[, ...] | ALL [ PRIVILEGES ] } ON { [ TABLE ] table_name [, ...] | ALL TABLES IN SCHEMA schema_name [, ...] } FROM { [ GROUP ] role_name | PUBLIC } [, ...] [ CASCADE | RESTRICT ];"
    status: "confirmed"
    source_anchor: "L19-L27"
  -
    id: "revoke_fact_syntax_columns"
    type: "syntax"
    statement: "原文选项/产生式：●   回收表上指定字段权限。 REVOKE [ GRANT OPTION FOR ] { {{ SELECT | INSERT | UPDATE | REFERENCES | COMMENT } ( column_name [, ...] )}[, ...] | ALL [ PRIVILEGES ] ( column_name [, ...] ) } ON [ TABLE ] table_name [, ...] FROM { [ GROUP ] role_name | PUBLIC } [, ...] [ CASCADE | RESTRICT ];"
    status: "confirmed"
