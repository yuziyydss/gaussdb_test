facts:
  -
    id: "timecapsule_database_fact_body_5"
    type: "behavior_oracle"
    statement: "在人为操作或应用程序错误时，使用TIMECAPSULE DATABASE语句可将库回收站中的 数据库对象恢复。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "timecapsule_database_fact_body_10"
    type: "constraint"
    statement: "●   TIMECAPSULE DATABASE语句的用法支持库级回收站对象从回收站中闪回，不支 持M兼容库下创建的Schema库对象闪回。"
    status: "confirmed"
    source_anchor: "L10-L11"
  -
    id: "timecapsule_database_fact_body_12"
    type: "constraint"
    statement: "●   不适用闪回DROP功能的场景："
    status: "confirmed"
    source_anchor: "L12-L12"
  -
    id: "timecapsule_database_fact_body_13"
    type: "constraint"
    statement: "–   回收站关闭场景：enable_db_recyclebin = off。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "timecapsule_database_fact_body_15"
    type: "environment"
    statement: "–    系统处于维护态（xc_maintenance_mode = on）或从不支持的基线版本升级 到支持的版本的升级场景。"
    status: "confirmed"
    source_anchor: "L15-L16"
  -
    id: "timecapsule_database_fact_body_17"
    type: "constraint"
    statement: "–    回收站对象被清理后无法闪回DROP，dbrecyclebin_retention_time参数用于 设置回收站对象保留时间。"
    status: "confirmed"
    source_anchor: "L17-L18"
  -
    id: "timecapsule_database_fact_body_19"
    type: "constraint"
    statement: "–    回收站中的数据库，不支持连接、DQL、DML、DDL、DCL操作。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "timecapsule_database_fact_body_20"
    type: "behavior_oracle"
    statement: "●   数据库DROP闪回约束： 可以指定原始用户指定的数据库名称，或对象删除时系统分配的生成名称。"
    status: "confirmed"
    source_anchor: "L20-L21"
  -
    id: "timecapsule_database_fact_body_22"
    type: "behavior_oracle"
    statement: "–    回收站中的数据库，在没有恢复前需要占用额外的存储空间。"
    status: "confirmed"
    source_anchor: "L22-L22"
  -
    id: "timecapsule_database_fact_body_23"
    type: "constraint"
    statement: "–    支持包含Astore、Ustore数据表的数据库场景，不支持Dstore场景。"
    status: "confirmed"
    source_anchor: "L23-L23"
  -
    id: "timecapsule_database_fact_body_24"
    type: "behavior_oracle"
    statement: "–    对齐DROP DATABASE的报错场景。"
    status: "confirmed"
    source_anchor: "L24-L24"
  -
    id: "timecapsule_database_fact_body_25"
    type: "constraint"
    statement: "–    不支持PDB闪回。"
    status: "confirmed"
    source_anchor: "L25-L25"
  -
    id: "timecapsule_database_fact_body_26"
    type: "constraint"
    statement: "–    数据库所在表空间的磁盘达到容量阈值，被设置为磁盘只读后，无法进行闪 回。"
    status: "confirmed"
    source_anchor: "L26-L27"
  -
    id: "timecapsule_database_fact_body_28"
    type: "constraint"
    statement: "–    回收站中系统生成的对象名称是唯一的。"
    status: "confirmed"
    source_anchor: "L28-L30"
  -
    id: "timecapsule_database_fact_body_28_1"
    type: "constraint"
    statement: "因此，如果指定系统生成名称，那 么数据库将在回收站检索指定的对象。"
    status: "confirmed"
    source_anchor: "L28-L30"
  -
    id: "timecapsule_database_fact_body_28_2"
    type: "constraint"
    statement: "使用“SELECT * FROM gs_db_recyclebin;”语句查看回收站中的内容。"
    status: "confirmed"
    source_anchor: "L28-L30"
  -
    id: "timecapsule_database_fact_body_31"
    type: "constraint"
    statement: "–    如果指定了用户指定的名称，且回收站中包含多个该名称的对象，那么数据 库检索回收站中最近移动的对象。"
    status: "confirmed"
    source_anchor: "L31-L33"
  -
    id: "timecapsule_database_fact_body_31_1"
    type: "constraint"
    statement: "如果需要检索更早版本的表，请按以下步 骤执行："
    status: "confirmed"
    source_anchor: "L31-L33"
  -
    id: "timecapsule_database_fact_body_35"
    type: "constraint"
    statement: "▪    指定需要检索的库的系统生成名称。"
    status: "confirmed"
    source_anchor: "L35-L35"
  -
    id: "timecapsule_database_fact_body_37"
    type: "constraint"
    statement: "▪    执行TIMECAPSULE DATABASE ... TO BEFORE DROP语句，直到找到要 检索的表。"
    status: "confirmed"
    source_anchor: "L37-L38"
  -
    id: "timecapsule_database_fact_body_39"
    type: "behavior_oracle"
    statement: "–    dbrecyclebin_retention_time配置参数用于设置回收站对象保留时间，超过 该时间的回收站对象将被自动清理。"
    status: "confirmed"
    source_anchor: "L39-L40"
  -
    id: "timecapsule_database_fact_body_41"
    type: "behavior_oracle"
    statement: "–    若表空间的DML操作导致表空间容量不足，会自动清理库回收站中此表空间 关联的数据库对象。"
    status: "confirmed"
    source_anchor: "L41-L42"
  -
    id: "timecapsule_database_fact_body_43"
    type: "environment"
    statement: "–    用户需持有管理员权限或者目标库的创建权限。"
    status: "confirmed"
    source_anchor: "L43-L43"
  -
    id: "timecapsule_database_fact_body_44"
    type: "constraint"
    statement: "–    TIMECAPSULE DATABASE支持在事务块内运行。"
    status: "confirmed"
    source_anchor: "L44-L44"
  -
    id: "timecapsule_database_fact_grammar_line_48"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：TIMECAPSULE DATABASE database_name TO BEFORE DROP [RENAME TO new_name];"
    status: "confirmed"
    source_anchor: "L48-L48"
  -
    id: "timecapsule_database_fact_body_54"
    type: "constraint"
    statement: "●   database_name 指定需要闪回的库名。"
    status: "confirmed"
    source_anchor: "L54-L55"
  -
    id: "timecapsule_database_fact_body_56"
    type: "behavior_oracle"
    statement: "●   TO BEFORE DROP 使用这个子句检索回收站中已删除的数据库。"
    status: "confirmed"
    source_anchor: "L56-L57"
  -
    id: "timecapsule_database_fact_body_58"
    type: "constraint"
    statement: "●   RENAME TO 为从回收站中检索的库指定一个新名称。"
    status: "confirmed"
    source_anchor: "L58-L59"
  -
    id: "timecapsule_database_fact_example_62"
    type: "example"
    statement: "示例原文片段：●   从库回收站中闪回数据库 前提条件："
    status: "confirmed"
    source_anchor: "L62-L63"
  -
    id: "timecapsule_database_fact_example_64"
    type: "example"
    statement: "示例原文片段：–     开启enable_db_recyclebin参数，启用回收站，参数使用请参见数据库运行参 数说明。"
    status: "confirmed"
    source_anchor: "L64-L65"
  -
    id: "timecapsule_database_fact_example_66"
    type: "example"
    statement: "示例原文片段：–     dbrecyclebin_retention_time参数用于设置回收站对象保留时间，超过该时 间的回收站对象将被自动清理，参数使用请参见数据库运行参数说明。"
    status: "confirmed"
    source_anchor: "L66-L67"
  -
    id: "timecapsule_database_fact_example_68"
    type: "example"
    statement: "示例原文片段：–     dbrecyclebin_maxsize参数用于设置回收站最大容量，参数使用请参见数据库 运行参数说明。 示例一：闪回数据库不重命名。 --建库。 gaussdb=# create database flashback_test; CREATE DATABASE --删除库。 gaussdb=# drop database flashback_test; DROP DATABASE --查看回收站。"
    status: "confirmed"
    source_anchor: "L68-L77"
  -
    id: "timecapsule_database_fact_example_78"
    type: "example"
    statement: "示例原文片段：gaussdb=# select * from gs_db_recyclebin; rcydbid |        rcyname           | rcyoriginname | rcyrecyclecsn |         rcyrecycletime          | rcytablespaces | rcydbsize ---------+---------------------------+----------------+---------------+------------------------------- +----------------+----------- 82513 | BIN$1425167F$2F524358==$0 | flashback_test |                 13888 | 2024-12-11 08:55:18.631069-05 | 1663               |   26272 (1 row) --通过回收站对象名闪回已删除的库。 gaussdb=# timecapsule database \"BIN$1425167F$2F524358==$0\" to before drop;"
    status: "confirmed"
    source_anchor: "L78-L87"
  -
    id: "timecapsule_database_fact_example_88"
    type: "example"
    statement: "示例原文片段：TimeCapsule Database --或通过原名闪回已删除的库。 gaussdb=# timecapsule database flashback_test to before drop; TimeCapsule Database gaussdb=# select * from gs_db_recyclebin; rcydbid | rcyname | rcyoriginname | rcyrecyclecsn | rcyrecycletime | rcytablespaces | rcydbsize ---------+---------+---------------+---------------+----------------+----------------+----------- (0 rows) --连接库。 gaussdb=# \\c flashback_test"
    status: "confirmed"
    source_anchor: "L88-L97"
  -
    id: "timecapsule_database_fact_example_98"
    type: "example"
    statement: "示例原文片段：Non-SSL connection (SSL connection is recommended when requiring high-security) You are now connected to database \"flashback_test\" as user \"omm\". flashback_test=#"
    status: "confirmed"
    source_anchor: "L98-L100"
  -
    id: "timecapsule_database_fact_example_102"
    type: "example"
    statement: "示例原文片段：示例二：闪回数据库并重命名。 --建库。 gaussdb=# create database flashback_test; CREATE DATABASE --删除库。 gaussdb=# drop database flashback_test; DROP DATABASE --查看回收站。 gaussdb=# select * from gs_db_recyclebin; rcydbid |        rcyname           | rcyoriginname | rcyrecyclecsn |         rcyrecycletime          |"
    status: "confirmed"
    source_anchor: "L102-L111"
  -
    id: "timecapsule_database_fact_example_112"
    type: "example"
    statement: "示例原文片段：rcytablespaces | rcydbsize ---------+---------------------------+----------------+---------------+------------------------------- +----------------+----------- 82513 | BIN$1425167F$2F524358==$0 | flashback_test |                 13888 | 2024-12-11 08:55:18.631069-05 | 1663               |   26272 (1 row) --通过回收站对象名闪回已删除的库并重命名。 gaussdb=# timecapsule database \"BIN$1425167F$2F524358==$0\" to before drop rename to flashback_test2; TimeCapsule Database"
    status: "confirmed"
    source_anchor: "L112-L121"
  -
    id: "timecapsule_database_fact_example_122"
    type: "example"
    statement: "示例原文片段：--或者通过原名闪回已删除的库并重命名。 gaussdb=# timecapsule database flashback_test to before drop rename to flashback_test2;"
    status: "confirmed"
    source_anchor: "L122-L123"
  -
    id: "timecapsule_database_fact_example_125"
    type: "example"
    statement: "示例原文片段：TimeCapsule Database gaussdb=# select * from gs_db_recyclebin; rcydbid | rcyname | rcyoriginname | rcyrecyclecsn | rcyrecycletime | rcytablespaces | rcydbsize ---------+---------+---------------+---------------+----------------+----------------+----------- (0 rows) --连接库。 gaussdb=# \\c flashback_test2 Non-SSL connection (SSL connection is recommended when requiring high-security) You are now connected to database \"flashback_test2\" as user \"omm\". flashback_test2=#"
    status: "confirmed"
    source_anchor: "L125-L134"
  -
    id: "timecapsule_database_fact_runtime_contract"
    type: "open_question"
    statement: "需真实独占数据库删除/回收站身份和跨连接恢复契约；不从共享库回收站恢复或清理任意对象。"
    status: "needs_verification"
    source_anchor: "L5-L6"
  -
    id: "timecapsule_database_fact_atomic_19_0"
    type: "constraint"
    statement: "回收站中的数据库不支持连接。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "timecapsule_database_fact_atomic_19_1"
    type: "constraint"
    statement: "回收站中的数据库不支持DQL。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "timecapsule_database_fact_atomic_19_2"
    type: "constraint"
    statement: "回收站中的数据库不支持DML。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "timecapsule_database_fact_atomic_19_3"
    type: "constraint"
    statement: "回收站中的数据库不支持DDL。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "timecapsule_database_fact_atomic_19_4"
    type: "constraint"
    statement: "回收站中的数据库不支持DCL。"
    status: "confirmed"
    source_anchor: "L19-L19"
