  -
    kind: "documented_behavior"
    expected: "–    回收站中的数据库，在没有恢复前需要占用额外的存储空间。"
  -
    kind: "documented_behavior"
    expected: "–    对齐DROP DATABASE的报错场景。"
  -
    kind: "documented_behavior"
    expected: "–    dbrecyclebin_retention_time配置参数用于设置回收站对象保留时间，超过 该时间的回收站对象将被自动清理。"
  -
    kind: "documented_behavior"
    expected: "–    若表空间的DML操作导致表空间容量不足，会自动清理库回收站中此表空间 关联的数据库对象。"
  -
    kind: "documented_behavior"
    expected: "●   TO BEFORE DROP 使用这个子句检索回收站中已删除的数据库。"
