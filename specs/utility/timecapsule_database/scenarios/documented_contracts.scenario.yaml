preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "在人为操作或应用程序错误时，使用TIMECAPSULE DATABASE语句可将库回收站中的 数据库对象恢复。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "●   TIMECAPSULE DATABASE语句的用法支持库级回收站对象从回收站中闪回，不支 持M兼容库下创建的Schema库对象闪回。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "●   不适用闪回DROP功能的场景："
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "–   回收站关闭场景：enable_db_recyclebin = off。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "–    系统处于维护态（xc_maintenance_mode = on）或从不支持的基线版本升级 到支持的版本的升级场景。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "–    回收站对象被清理后无法闪回DROP，dbrecyclebin_retention_time参数用于 设置回收站对象保留时间。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "–    回收站中的数据库，不支持连接、DQL、DML、DDL、DCL操作。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "●   数据库DROP闪回约束： 可以指定原始用户指定的数据库名称，或对象删除时系统分配的生成名称。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "–    回收站中的数据库，在没有恢复前需要占用额外的存储空间。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "–    支持包含Astore、Ustore数据表的数据库场景，不支持Dstore场景。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "–    对齐DROP DATABASE的报错场景。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "–    不支持PDB闪回。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "–    数据库所在表空间的磁盘达到容量阈值，被设置为磁盘只读后，无法进行闪 回。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "–    回收站中系统生成的对象名称是唯一的。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "因此，如果指定系统生成名称，那 么数据库将在回收站检索指定的对象。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "使用“SELECT * FROM gs_db_recyclebin;”语句查看回收站中的内容。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "–    如果指定了用户指定的名称，且回收站中包含多个该名称的对象，那么数据 库检索回收站中最近移动的对象。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "如果需要检索更早版本的表，请按以下步 骤执行："
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "▪    指定需要检索的库的系统生成名称。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "▪    执行TIMECAPSULE DATABASE ... TO BEFORE DROP语句，直到找到要 检索的表。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "–    dbrecyclebin_retention_time配置参数用于设置回收站对象保留时间，超过 该时间的回收站对象将被自动清理。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "–    若表空间的DML操作导致表空间容量不足，会自动清理库回收站中此表空间 关联的数据库对象。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "–    用户需持有管理员权限或者目标库的创建权限。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "–    TIMECAPSULE DATABASE支持在事务块内运行。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "●   database_name 指定需要闪回的库名。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "●   TO BEFORE DROP 使用这个子句检索回收站中已删除的数据库。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "●   RENAME TO 为从回收站中检索的库指定一个新名称。"
  -
    id: "verify_timecapsule_database_fact_atomic_19_0"
    action: "verify_documented_contract"
    note: "回收站中的数据库不支持连接。"
  -
    id: "verify_timecapsule_database_fact_atomic_19_1"
    action: "verify_documented_contract"
    note: "回收站中的数据库不支持DQL。"
  -
    id: "verify_timecapsule_database_fact_atomic_19_2"
    action: "verify_documented_contract"
    note: "回收站中的数据库不支持DML。"
  -
    id: "verify_timecapsule_database_fact_atomic_19_3"
    action: "verify_documented_contract"
    note: "回收站中的数据库不支持DDL。"
  -
    id: "verify_timecapsule_database_fact_atomic_19_4"
    action: "verify_documented_contract"
    note: "回收站中的数据库不支持DCL。"
oracles:
  -
    kind: "documented_behavior"
    expected: "在人为操作或应用程序错误时，使用TIMECAPSULE DATABASE语句可将库回收站中的 数据库对象恢复。"
