id: "scenario_timecapsule_database_documented_contracts"
name: "TIMECAPSULE DATABASE documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
