  -
    id: "timecapsule_database_su_body_5_5"
    section: "正文"
    source_anchor: "L5-L6"
    line_start: 5
    line_end: 6
    statement: "在人为操作或应用程序错误时，使用TIMECAPSULE DATABASE语句可将库回收站中的 数据库对象恢复。"
    status: "open_question"
    fact_refs:
      - "timecapsule_database_fact_body_5"
      - "timecapsule_database_fact_runtime_contract"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "timecapsule_database_su_body_10_10"
    section: "正文"
    source_anchor: "L10-L11"
    line_start: 10
    line_end: 11
    statement: "●   TIMECAPSULE DATABASE语句的用法支持库级回收站对象从回收站中闪回，不支 持M兼容库下创建的Schema库对象闪回。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_10"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_12_12"
    section: "正文"
    source_anchor: "L12-L12"
    line_start: 12
    line_end: 12
    statement: "●   不适用闪回DROP功能的场景："
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_12"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_13_13"
    section: "正文"
    source_anchor: "L13-L13"
    line_start: 13
    line_end: 13
    statement: "–   回收站关闭场景：enable_db_recyclebin = off。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_13"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_15_15"
    section: "正文"
    source_anchor: "L15-L16"
    line_start: 15
    line_end: 16
    statement: "–    系统处于维护态（xc_maintenance_mode = on）或从不支持的基线版本升级 到支持的版本的升级场景。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_15"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_17_17"
    section: "正文"
    source_anchor: "L17-L18"
    line_start: 17
    line_end: 18
    statement: "–    回收站对象被清理后无法闪回DROP，dbrecyclebin_retention_time参数用于 设置回收站对象保留时间。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_17"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_19_19"
    section: "正文"
    source_anchor: "L19-L19"
    line_start: 19
    line_end: 19
    statement: "–    回收站中的数据库，不支持连接、DQL、DML、DDL、DCL操作。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_19"
      - "timecapsule_database_fact_atomic_19_0"
      - "timecapsule_database_fact_atomic_19_1"
      - "timecapsule_database_fact_atomic_19_2"
      - "timecapsule_database_fact_atomic_19_3"
      - "timecapsule_database_fact_atomic_19_4"
    atomicity: "grouped"
    independent_claim_count: 6
  -
    id: "timecapsule_database_su_body_20_20"
    section: "正文"
    source_anchor: "L20-L21"
    line_start: 20
    line_end: 21
    statement: "●   数据库DROP闪回约束： 可以指定原始用户指定的数据库名称，或对象删除时系统分配的生成名称。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_20"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_22_22"
    section: "正文"
    source_anchor: "L22-L22"
    line_start: 22
    line_end: 22
    statement: "–    回收站中的数据库，在没有恢复前需要占用额外的存储空间。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_22"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_23_23"
    section: "正文"
    source_anchor: "L23-L23"
    line_start: 23
    line_end: 23
    statement: "–    支持包含Astore、Ustore数据表的数据库场景，不支持Dstore场景。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_23"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_24_24"
    section: "正文"
    source_anchor: "L24-L24"
    line_start: 24
    line_end: 24
    statement: "–    对齐DROP DATABASE的报错场景。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_24"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_25_25"
    section: "正文"
    source_anchor: "L25-L25"
    line_start: 25
    line_end: 25
    statement: "–    不支持PDB闪回。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_25"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_26_26"
    section: "正文"
    source_anchor: "L26-L27"
    line_start: 26
    line_end: 27
    statement: "–    数据库所在表空间的磁盘达到容量阈值，被设置为磁盘只读后，无法进行闪 回。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_26"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_28_28"
    section: "正文"
    source_anchor: "L28-L30"
    line_start: 28
    line_end: 30
    statement: "–    回收站中系统生成的对象名称是唯一的。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_28"
      - "timecapsule_database_fact_body_28_1"
      - "timecapsule_database_fact_body_28_2"
    atomicity: "grouped"
    independent_claim_count: 3
  -
    id: "timecapsule_database_su_body_31_31"
    section: "正文"
    source_anchor: "L31-L33"
    line_start: 31
    line_end: 33
    statement: "–    如果指定了用户指定的名称，且回收站中包含多个该名称的对象，那么数据 库检索回收站中最近移动的对象。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_31"
      - "timecapsule_database_fact_body_31_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "timecapsule_database_su_body_35_35"
    section: "正文"
    source_anchor: "L35-L35"
    line_start: 35
    line_end: 35
    statement: "▪    指定需要检索的库的系统生成名称。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_35"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_37_37"
    section: "正文"
    source_anchor: "L37-L38"
    line_start: 37
    line_end: 38
    statement: "▪    执行TIMECAPSULE DATABASE ... TO BEFORE DROP语句，直到找到要 检索的表。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_37"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_39_39"
    section: "正文"
    source_anchor: "L39-L40"
    line_start: 39
    line_end: 40
    statement: "–    dbrecyclebin_retention_time配置参数用于设置回收站对象保留时间，超过 该时间的回收站对象将被自动清理。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_39"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_41_41"
    section: "正文"
    source_anchor: "L41-L42"
    line_start: 41
    line_end: 42
    statement: "–    若表空间的DML操作导致表空间容量不足，会自动清理库回收站中此表空间 关联的数据库对象。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_41"
    atomicity: "atomic"
  -
    id: "timecapsule_database_su_body_43_43"
    section: "正文"
    source_anchor: "L43-L43"
    line_start: 43
    line_end: 43
    statement: "–    用户需持有管理员权限或者目标库的创建权限。"
    status: "mapped"
    fact_refs:
      - "timecapsule_database_fact_body_43"
    atomicity: "atomic"
