schema_version: 1
kind: fixture
id: fixture_m_execute_prepared
name: fixture_m_execute_prepared
status: needs_review
description: M 有限模型；不承诺全章覆盖或实机成功。
factor_ref: m_execute
requires_fixture_refs: []
provides:
  tables:
  - name: m_execute_data
    persistence: permanent
    table_kind: regular
    columns:
    - name: id
      type: INTEGER
      nullable: true
    - name: qty
      type: INTEGER
      nullable: true
seed:
  required: false
  rows: []
execution:
  status: ready
  mode: explicit
  setup_sqls:
  - CREATE TABLE m_execute_data (id INT,qty INT);
  - INSERT INTO m_execute_data VALUES (1,10),(2,20);
  - PREPARE m_execute_read FROM 'SELECT id,qty FROM m_execute_data ORDER BY id';
  - PREPARE m_execute_write FROM 'UPDATE m_execute_data SET qty=99 WHERE id=1';
  teardown_sqls:
  - DEALLOCATE PREPARE m_execute_read;
  - DEALLOCATE PREPARE m_execute_write;
  - DROP TABLE m_execute_data;
  note: 仅静态产物；将来须独占隔离测试空间、逐 case 生命周期。对象名必须预先不存在；setup 失败不能运行目标或清理他人对象。不依赖 DDL 回滚，不关闭约束，不吞异常。
