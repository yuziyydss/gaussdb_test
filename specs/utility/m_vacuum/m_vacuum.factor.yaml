facts:
- id: m_vacuum_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.19.1 L2-2
- id: m_vacuum_fact_syntax
  type: syntax
  statement: VACUUM 有无括号普通形式、固定顺序 ANALYZE 形式以及括号选项列表。
  status: confirmed
  source_anchor: 2.4.2.19.1 L60-71
- id: m_vacuum_fact_transaction
  type: environment
  statement: VACUUM 不能在事务块内执行。
  status: confirmed
  source_anchor: 2.4.2.19.1 L17-17
- id: m_vacuum_fact_owner
  type: environment
  statement: 仅处理显式指定的本 case 表，由表创建者进行维护。
  status: confirmed
  source_anchor: 2.4.2.19.1 L12-16
- id: m_vacuum_fact_columns
  type: constraint
  statement: 列列表需要 ANALYZE 选项。
  status: confirmed
  source_anchor: 2.4.2.19.1 L95-96
- id: m_vacuum_fact_order
  type: syntax
  statement: 括号选项顺序任意，无括号时必须遵循语法顺序。
  status: confirmed
  source_anchor: 2.4.2.19.1 L39-40
- id: m_vacuum_fact_partial
  type: lifecycle
  statement: VACUUM ANALYZE 列名错误时可能已完成 VACUUM，不能认为失败意味着没有副作用。
  status: confirmed
  source_anchor: 2.4.2.19.1 L100-102
- id: m_vacuum_fact_full
  type: behavior_oracle
  statement: FULL 重建表释放空间且施加排他锁；空间效果不是简单 DELETE 后立即可验证。
  status: confirmed
  source_anchor: 2.4.2.19.1 L52-54
- id: m_vacuum_fact_purpose
  type: example
  statement: m_vacuum的M-Compatibility语法功能描述。
  status: confirmed
  source_anchor: M-Compatibility L4-7
- id: m_vacuum_fact_constraint
  type: example
  statement: m_vacuum的M-Compatibility注意事项和限制。
  status: confirmed
  source_anchor: M-Compatibility L9-11
- id: m_vacuum_fact_params
  type: example
  statement: m_vacuum的参数说明。
  status: confirmed
  source_anchor: M-Compatibility L41-51
- id: m_vacuum_fact_example
  type: example
  statement: m_vacuum的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L107-109
rules:
- id: m_vacuum_rule_columns_require_analyze
  kind: requires
  expression: columns == 'm_vacuum_columns_all' or form == 'm_vacuum_form_analyze' or (form == 'm_vacuum_form_options'
    and options != 'm_vacuum_options_verbose')
  fact_refs:
  - m_vacuum_fact_columns
  severity: error
