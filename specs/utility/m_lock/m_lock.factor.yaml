facts:
- id: m_lock_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.13.2 L2-2
- id: m_lock_fact_syntax
  type: syntax
  statement: LOCK 可选 TABLE/TABLES，支持表列表、READ/WRITE/IN ACCESS SHARE MODE 和 NOWAIT。
  status: confirmed
  source_anchor: 2.4.2.13.2 L27-36
- id: m_lock_fact_transaction
  type: environment
  statement: LOCK 必须在事务块内，事务结束释放锁；没有 UNLOCK TABLE。
  status: confirmed
  source_anchor: 2.4.2.13.2 L17-21
- id: m_lock_fact_supported_modes
  type: constraint
  statement: M 不支持显式 LOCK 获取 ROW SHARE/ROW EXCLUSIVE 等其余锁模式。
  status: confirmed
  source_anchor: 2.4.2.13.2 L100-100
- id: m_lock_fact_order
  type: behavior_oracle
  statement: 表列表顺序就是加锁顺序。
  status: confirmed
  source_anchor: 2.4.2.13.2 L84-84
- id: m_lock_fact_nowait
  type: behavior_oracle
  statement: NOWAIT 遇到冲突立即报错，不指定则等待。
  status: confirmed
  source_anchor: 2.4.2.13.2 L102-105
- id: m_lock_fact_access_share_conflict
  type: open_question
  statement: ACCESS SHARE 文字称禁止修改，但表2-27仅与WRITE冲突；已核对物理页2231，不直接推导并发写 Oracle。
  status: needs_verification
  source_anchor: 2.4.2.13.2 L95-97
- id: m_lock_fact_purpose
  type: example
  statement: LOCK TABLE获取表级锁。 M-Compatibility模式数据库在为一个引用了表的命令自动请求锁时，尽可能选择最小 限制的锁模式。如果用户需要一种更为严格的锁模式，可以使用LOCK命令。例如，一
  status: confirmed
  source_anchor: M-Compatibility L4-14
- id: m_lock_fact_constraint
  type: example
  statement: LOCK TABLE只能在一个事务块的内部有用，因为锁在事务结束时就会被释放。出 如果没有声明锁模式，缺省为最严格的模式WRITE。
  status: confirmed
  source_anchor: M-Compatibility L16-16
- id: m_lock_fact_params
  type: example
  statement: 表 2-27 冲突的锁模式 请求的        ACCES   ROW    ROW     SHAR    READ   SHAR    EXCLU   WRITE 锁模         S       SHAR   EXCLU   E              E       SIVE
  status: confirmed
  source_anchor: M-Compatibility L38-38
- id: m_lock_fact_example
  type: example
  statement: m_lock的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L107-109
