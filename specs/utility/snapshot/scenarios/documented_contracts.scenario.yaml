schema_version: 1
kind: "scenario"
id: "scenario_snapshot_documented_contracts"
name: "SNAPSHOT documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "snapshot"
fixture_refs: []
fact_refs:
  - "snapshot_fact_body_5"
  - "snapshot_fact_body_8"
  - "snapshot_fact_body_9"
  - "snapshot_fact_body_9_1"
  - "snapshot_fact_body_11"
  - "snapshot_fact_body_11_1"
  - "snapshot_fact_body_14"
  - "snapshot_fact_body_17"
  - "snapshot_fact_body_36"
  - "snapshot_fact_body_36_1"
  - "snapshot_fact_body_39"
  - "snapshot_fact_body_39_1"
  - "snapshot_fact_body_44"
  - "snapshot_fact_body_44_1"
  - "snapshot_fact_body_47"
  - "snapshot_fact_body_47_1"
  - "snapshot_fact_body_50"
  - "snapshot_fact_body_50_1"
  - "snapshot_fact_body_55"
  - "snapshot_fact_body_55_1"
  - "snapshot_fact_body_58"
  - "snapshot_fact_body_58_1"
  - "snapshot_fact_body_58_2"
  - "snapshot_fact_body_61"
  - "snapshot_fact_body_64"
  - "snapshot_fact_body_67"
  - "snapshot_fact_body_67_1"
  - "snapshot_fact_body_70"
  - "snapshot_fact_body_70_1"
  - "snapshot_fact_body_73"
  - "snapshot_fact_body_73_1"
  - "snapshot_fact_body_77"
  - "snapshot_fact_body_77_1"
  - "snapshot_fact_body_80"
  - "snapshot_fact_body_80_1"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "针对多用户情况下，对数据进行统一的版本控制。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "●    本特性GUC参数db4ai_snapshot_mode，快照存储模型分为MSS和CSS。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "●    当快照选用增量存储方式时，各个快照中具有依赖关系。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "删除快照需要按照依赖 顺序进行删除。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "●    snapshot特性用于团队不同成员间维护数据，涉及管理员和普通用户之间的数据 转写。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "所以在三权分立(enableSeparationOfDuty=ON)等状态下，数据库不支持 snapshot功能特性。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "●    当需要稳定可用的快照用于AI训练等任务时，用户需要将快照发布。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "1.   创建快照 可以采用“CREATE SNAPSHOT … AS”以及“CREATE SNAPSHOT … FROM” 语句创建数据表快照。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "2.   删除快照。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "PURGE SNAPSHOT PURGE SNAPSHOT <qualified_name> @ <version | ident | sconst>;"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "3.   快照采样。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "SAMPLE SNAPSHOT SAMPLE SNAPSHOT <qualified_name> @ <version | ident | sconst> [STRATIFY BY <attr_list>] { AS <label> AT RATIO <num> [COMMENT IS <comment>] } [, …]"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "4.   快照发布。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "PUBLISH SNAPSHOT PUBLISH SNAPSHOT <qualified_name> @ <version | ident | sconst>;"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "5.   快照存档。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "ARCHIVE SNAPSHOT ARCHIVE SNAPSHOT <qualified_name> @ <version | ident | sconst>;"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "6.   查询快照。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "SELECT * FROM DB4AISHOT(<qualified_name> @ <version | ident | sconst>）;"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "●    qualified_name 创建snapshot的名称。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "取值范围：字符串，需要符合标识符命名规范。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "●    version (可省略)snapshot的版本号，当省略设置。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "系统会自动顺延编号。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "取值范围：字符串，数字编号配合分隔符。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "●    ident 用于标定快照后缀编号(或者大版本) 取值范围：整数(int)，数字编号。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "●    sconst 字符串常量，用于描述名称后缀或者快照评论 取值范围：字符数，需要符合标识符命名规范。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "●    comment 指定添加的评论内容。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "取值范围：字符串，需要符合标识符命名规范。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "●    alias 对当前对象取的别名。"
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "取值范围：字符串，需要符合标识符命名规范。"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "●    attr_list 目标对象的list集合。"
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "取值范围：字符串，需要符合标识符命名规范。"
  -
    id: "contract_31"
    action: "verify_documented_contract"
    note: "●    label 采样数据列别名。"
  -
    id: "contract_32"
    action: "verify_documented_contract"
    note: "取值范围：字符串，需要符合标识符命名规范。"
  -
    id: "contract_33"
    action: "verify_documented_contract"
    note: "●    num 指定的比例值。"
  -
    id: "contract_34"
    action: "verify_documented_contract"
    note: "取值范围：数字。"
oracles:
  -
    kind: "documented_behavior"
    expected: "●    当快照选用增量存储方式时，各个快照中具有依赖关系。"
  -
    kind: "documented_behavior"
    expected: "删除快照需要按照依赖 顺序进行删除。"
  -
    kind: "documented_behavior"
    expected: "2.   删除快照。"
  -
    kind: "documented_behavior"
    expected: "PURGE SNAPSHOT PURGE SNAPSHOT <qualified_name> @ <version | ident | sconst>;"
  -
    kind: "documented_behavior"
    expected: "6.   查询快照。"
  -
    kind: "documented_behavior"
    expected: "SELECT * FROM DB4AISHOT(<qualified_name> @ <version | ident | sconst>）;"
  -
    kind: "documented_behavior"
    expected: "●    version (可省略)snapshot的版本号，当省略设置。"
  -
    kind: "documented_behavior"
    expected: "系统会自动顺延编号。"
  -
    kind: "documented_behavior"
    expected: "取值范围：字符串，数字编号配合分隔符。"
execution_requirements:
  - "database"
  - "same_session"
