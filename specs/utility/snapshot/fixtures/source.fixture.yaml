schema_version: 1
kind: "fixture"
id: "fixture_snapshot_source"
name: "SNAPSHOT source"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "snapshot"
requires_fixture_refs:
  - "fixture_create_schema_pair"
provides:
  tables:
    -
      name: "fp_cs_one.b11_snapshot_source"
      persistence: "permanent"
      table_kind: "regular"
      columns:
        -
          name: "col_1"
          type: "INTEGER"
          nullable: true
        -
          name: "col_2"
          type: "INTEGER"
          nullable: true
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "CREATE TABLE fp_cs_one.b11_snapshot_source (col_1 INT, col_2 INT);"
    - "INSERT INTO fp_cs_one.b11_snapshot_source VALUES (1,10),(2,20);"
  teardown_sqls:
    - "PURGE SNAPSHOT fp_cs_one.b11_snapshot @1.0;"
    - "DROP TABLE fp_cs_one.b11_snapshot_source;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
