schema_version: 1
kind: "manifest"
id: "manifest_snapshot_create_as"
name: "SNAPSHOT create_as"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "snapshot"
syntax_ref: "syntax_snapshot"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_snapshot_source"
identifier_policy: {}
bindings:
  comment:
    - "snapshot_comment_off"
    - "snapshot_comment_on"
  query:
    - "snapshot_query_all"
    - "snapshot_query_where"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "enable_separation_of_duty"
    allowed_values:
      - "off"
    fact_refs:
      - "snapshot_fact_body_11"
  -
    key: "db4ai_snapshot_mode"
    allowed_values:
      - "MSS"
      - "CSS"
    fact_refs:
      - "snapshot_fact_body_8"
