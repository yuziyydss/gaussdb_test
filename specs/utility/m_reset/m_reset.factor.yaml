facts:
- id: m_reset_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.15.5 L2-2
- id: m_reset_fact_syntax
  type: syntax
  statement: 当前 RESET 正式产生式只有 RESET ALL。
  status: confirmed
  source_anchor: 2.4.2.15.5 L15-15
- id: m_reset_fact_only_all
  type: constraint
  statement: 当前版本不支持 RESET configuration_parameter，只支持 ALL。
  status: confirmed
  source_anchor: 2.4.2.15.5 L8-8
- id: m_reset_fact_rollback
  type: environment
  statement: RESET ALL 的事务影响能由 ROLLBACK 撤销。
  status: confirmed
  source_anchor: 2.4.2.15.5 L11-11
- id: m_reset_fact_defaults
  type: behavior_oracle
  statement: RESET 缺省来自 gaussdb.conf 配置，不是测试硬编码值。
  status: confirmed
  source_anchor: 2.4.2.15.5 L5-6
- id: m_reset_fact_identity
  type: behavior_oracle
  statement: RESET ALL 不恢复 role/session authorization。
  status: confirmed
  source_anchor: 2.4.2.15.5 L12-12
- id: m_reset_fact_purpose
  type: example
  statement: RESET将指定的运行时参数恢复为缺省值。这些参数的缺省值是指gaussdb.conf配置文 件中所描述的参数缺省值。 当前版本不支持 RESET configuration_parameter，只支持RESET
    ALL。
  status: confirmed
  source_anchor: M-Compatibility L4-4
- id: m_reset_fact_constraint
  type: example
  statement: RESET ALL的事务性行为和SET相同，它的影响将会被事务回滚撤销。 RESET ALL不能对role和session authorization恢复为缺省值。
  status: confirmed
  source_anchor: M-Compatibility L10-10
- id: m_reset_fact_params
  type: example
  statement: reset_parameter是要重置的参数名。ALL表示重置所有参数为默认值。
  status: confirmed
  source_anchor: M-Compatibility L18-20
rules:
- id: m_reset_rule_only_all
  kind: requires
  expression: target == 'm_reset_target_all'
  fact_refs:
