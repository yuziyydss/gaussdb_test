facts:
- id: m_show_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.16.8 L2-2
- id: m_show_fact_syntax
  type: syntax
  statement: SHOW 参数、列、定义、索引、表列表是不同顶层产生式。
  status: confirmed
  source_anchor: 2.4.2.16.8 L23-34
- id: m_show_fact_parameters
  type: syntax
  statement: SHOW 支持时区、事务隔离级别、会话身份与 ALL。
  status: confirmed
  source_anchor: 2.4.2.16.8 L14-19
- id: m_show_fact_columns
  type: syntax
  statement: COLUMNS 适用表和视图，FULL 额外显示字符序、注释和权限；支持 LIKE/WHERE。
  status: confirmed
  source_anchor: 2.4.2.16.8 L74-80
- id: m_show_fact_authority
  type: environment
  statement: 显示对象信息需要对象权限；列需所在 Schema USAGE 与表级或列级权限。
  status: confirmed
  source_anchor: 2.4.2.16.8 L74-77
- id: m_show_fact_definition
  type: syntax
  statement: SHOW CREATE TABLE 也适用于视图。
  status: confirmed
  source_anchor: 2.4.2.16.8 L115-116
- id: m_show_fact_version
  type: environment
  statement: SHOW CREATE TABLE 的结果格式随 m_format_dev_version=s2 改变。
  status: confirmed
  source_anchor: 2.4.2.16.8 L119-120
- id: m_show_fact_temporary
  type: environment
  statement: 临时表索引指定 db_name 时须使用实际临时 Schema。
  status: confirmed
  source_anchor: 2.4.2.16.8 L139-142
- id: m_show_fact_tables
  type: behavior_oracle
  statement: SHOW TABLES 不含临时表且升序输出。
  status: confirmed
  source_anchor: 2.4.2.16.8 L161-164
- id: m_show_fact_key
  type: behavior_oracle
  statement: Key 的 PRI/UNI/MUL 与是否主键及索引首列相关，普通列为 NULL。
  status: confirmed
  source_anchor: 2.4.2.16.8 L87-96
- id: m_show_fact_metadata_gap
  type: open_question
  statement: SHOW TABLE STATUS 的全部目录字段映射、版本和精度开关尚未接入精确 Oracle。
  status: needs_verification
  source_anchor: 2.4.2.16.8 L178-178
