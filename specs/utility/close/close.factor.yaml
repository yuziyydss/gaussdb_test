    status: "confirmed"
    source_anchor: "L26-L27"
  -
    id: "close_fact_all"
    type: "lifecycle"
    statement: "ALL 关闭所有已打开的游标。"
    status: "confirmed"
    source_anchor: "L28-L29"
  -
    id: "close_fact_all_scope"
    type: "environment"
    statement: "ALL 的作用范围是所有已打开游标，非单个指定名称。"
    status: "confirmed"
    source_anchor: "L28-L29"
  -
