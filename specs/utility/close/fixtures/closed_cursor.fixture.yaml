schema_version: 1
kind: "fixture"
id: "fixture_close_closed_cursor"
name: "CLOSE closed_cursor"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "close"
requires_fixture_refs:
  - "fixture_declare_transaction"
provides: {}
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "DECLARE c_close_closed CURSOR FOR SELECT col_1, col_2 FROM t_cursor_source ORDER BY col_1;"
    - "CLOSE c_close_closed;"
  teardown_sqls:
    - "ROLLBACK;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
