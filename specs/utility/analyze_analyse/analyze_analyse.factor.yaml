dimensions:
  keyword:
    description: "同义命令"
    classes:
      -
        id: "analyze_analyse_keyword_analyze_class"
        meaning: "analyze"
        values:
          -
            id: "analyze_analyse_keyword_analyze"
            render: "ANALYZE"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_syntax_stats"
      -
        id: "analyze_analyse_keyword_analyse_class"
        meaning: "analyse"
        values:
          -
            id: "analyze_analyse_keyword_analyse"
            render: "ANALYSE"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_syntax_stats"
    default_value_id: "analyze_analyse_keyword_analyze"
  form:
    description: "顶层统计与校验分支"
    classes:
      -
        id: "analyze_analyse_form_statistics_class"
        meaning: "statistics"
        values:
          -
            id: "analyze_analyse_form_statistics"
            render: ""
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_syntax_stats"
      -
        id: "analyze_analyse_form_verify_class"
        meaning: "verify"
        values:
          -
            id: "analyze_analyse_form_verify"
            render: ""
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_syntax_verify_target"
    default_value_id: "analyze_analyse_form_statistics"
  verbose:
    description: "进度开关"
    classes:
      -
        id: "analyze_analyse_verbose_none_class"
        meaning: "none"
        values:
          -
            id: "analyze_analyse_verbose_none"
            render: ""
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_verbose"
      -
        id: "analyze_analyse_verbose_yes_class"
        meaning: "yes"
        values:
          -
            id: "analyze_analyse_verbose_yes"
            render: "VERBOSE"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_verbose"
    default_value_id: "analyze_analyse_verbose_none"
  target:
    description: "受控表或索引"
    classes:
      -
        id: "analyze_analyse_target_table_class"
        meaning: "table"
        values:
          -
            id: "analyze_analyse_target_table"
            render: "t_analyze_source"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_table"
            fixture_refs:
              - "fixture_analyze_analyse_index"
            properties:
              is_index: false
      -
        id: "analyze_analyse_target_index_class"
        meaning: "index"
        values:
          -
            id: "analyze_analyse_target_index"
            render: "i_analyze_source"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_index"
            fixture_refs:
              - "fixture_analyze_analyse_index"
            properties:
              is_index: true
    default_value_id: "analyze_analyse_target_table"
  columns:
    description: "单列/逐列/联合统计分开"
    classes:
      -
        id: "analyze_analyse_columns_all_class"
        meaning: "all"
        values:
          -
            id: "analyze_analyse_columns_all"
            render: ""
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_columns"
      -
        id: "analyze_analyse_columns_one_class"
        meaning: "one"
        values:
          -
            id: "analyze_analyse_columns_one"
            render: "(col_1)"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_columns"
      -
        id: "analyze_analyse_columns_two_class"
        meaning: "two"
        values:
          -
            id: "analyze_analyse_columns_two"
            render: "(col_1, col_2)"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_columns"
      -
        id: "analyze_analyse_columns_joint_class"
        meaning: "joint"
        values:
          -
            id: "analyze_analyse_columns_joint"
            render: "((col_1, col_2))"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_syntax_multicolumn"
    default_value_id: "analyze_analyse_columns_all"
  mode:
    description: "校验深度"
    classes:
      -
        id: "analyze_analyse_mode_fast_class"
        meaning: "fast"
        values:
          -
            id: "analyze_analyse_mode_fast"
            render: "FAST"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_mode"
      -
        id: "analyze_analyse_mode_complete_class"
        meaning: "complete"
        values:
          -
            id: "analyze_analyse_mode_complete"
            render: "COMPLETE"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_mode"
    default_value_id: "analyze_analyse_mode_fast"
  cascade:
    description: "仅表校验可选 CASCADE"
    classes:
      -
        id: "analyze_analyse_cascade_none_class"
        meaning: "none"
        values:
          -
            id: "analyze_analyse_cascade_none"
            render: ""
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_cascade"
      -
        id: "analyze_analyse_cascade_yes_class"
        meaning: "yes"
        values:
          -
            id: "analyze_analyse_cascade_yes"
            render: "CASCADE"
            representative: true
            validity: "valid"
            fact_refs:
              - "analyze_analyse_fact_cascade"
    default_value_id: "analyze_analyse_cascade_none"
rules:
  -
    id: "analyze_analyse_rule_index_cascade"
    kind: "requires"
    expression: "form != 'analyze_analyse_form_verify' or target.properties.is_index == False or cascade == 'analyze_analyse_cascade_none'"
    fact_refs:
      - "analyze_analyse_fact_index_cascade"
    severity: "error"
structural_checks: []
facts:
  -
    id: "analyze_analyse_fact_statistics"
    type: "metadata_oracle"
    statement: "统计写入 PG_STATISTIC/PG_STATISTIC_EXT，可经 PG_STATS/PG_EXT_STATS 查询并用于计划生成。"
    status: "confirmed"
    source_anchor: "L5-L8"
  -
    id: "analyze_analyse_fact_scope"
    type: "syntax"
    statement: "无目标为当前库；可限定表、列或分区。"
    status: "confirmed"
    source_anchor: "L9-L11"
  -
    id: "analyze_analyse_fact_verify"
    type: "syntax"
    statement: "VERIFY 校验目标文件，能力按页面类型区分。"
    status: "confirmed"
    source_anchor: "L12-L13"
  -
    id: "analyze_analyse_fact_matrix_axes"
    type: "syntax"
    statement: "校验矩阵轴为物理、逻辑、元组校验。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "analyze_analyse_fact_duration"
    type: "environment"
    statement: "VERIFY 耗时取决于对象大小和机器性能。"
    status: "confirmed"
    source_anchor: "L37-L38"
  -
    id: "analyze_analyse_fact_history"
    type: "metadata_oracle"
    statement: "每次统计写入三类历史表，保留受 stats_history_record_limit 和 stats_history_retention_time 控制。"
    status: "confirmed"
    source_anchor: "L39-L42"
  -
    id: "analyze_analyse_fact_class_rollback"
    type: "behavior_oracle"
    statement: "PG_CLASS/PG_PARTITION 统计字段及基于这些字段的视图不支持回滚。"
    status: "confirmed"
    source_anchor: "L47-L50"
  -
    id: "analyze_analyse_fact_function_rollback"
    type: "behavior_oracle"
    statement: "ANALYZE 相关统计函数及依赖视图不支持回滚。"
    status: "confirmed"
    source_anchor: "L51-L53"
  -
    id: "analyze_analyse_fact_remote"
    type: "environment"
    statement: "不涉及远程读时远程读参数无效；关键系统表损坏直接报错。"
    status: "confirmed"
    source_anchor: "L54-L55"
  -
    id: "analyze_analyse_fact_permitted_scope"
    type: "environment"
    statement: "未指定目标只处理当前用户有权限的表。"
    status: "confirmed"
    source_anchor: "L56-L57"
  -
    id: "analyze_analyse_fact_privilege"
    type: "environment"
    statement: "表所有者或 VACUUM 授权可分析；整库受数据库所有权和共享目录权限限制，无权限表跳过。"
    status: "confirmed"
    source_anchor: "L58-L62"
  -
    id: "analyze_analyse_fact_comparable"
    type: "constraint"
    statement: "不收集不能比较或等值运算的列，例如 CURSOR。"
    status: "confirmed"
    source_anchor: "L63-L63"
  -
    id: "analyze_analyse_fact_empty"
    type: "behavior_oracle"
    statement: "空表不记录新统计，旧统计保留。"
    status: "confirmed"
    source_anchor: "L64-L65"
  -
    id: "analyze_analyse_fact_syntax_stats"
    type: "syntax"
    statement: "普通统计语法含可选 VERBOSE、表名及列列表。"
    status: "confirmed"
    source_anchor: "L69-L71"
  -
    id: "analyze_analyse_fact_syntax_partition"
    type: "syntax"
    statement: "分区统计使用 PARTITION 或 SUBPARTITION 名称。"
    status: "confirmed"
    source_anchor: "L76-L78"
  -
    id: "analyze_analyse_fact_partition_level"
    type: "constraint"
    statement: "PARTITION 必须一级分区名，SUBPARTITION 必须二级分区名。"
    status: "confirmed"
    source_anchor: "L85-L86"
  -
    id: "analyze_analyse_fact_syntax_multicolumn"
    type: "syntax"
    statement: "手动多列联合统计采用双括号列组。"
    status: "confirmed"
    source_anchor: "L88-L90"
  -
    id: "analyze_analyse_fact_column_limit"
    type: "constraint"
    statement: "enable_functional_dependency 关闭时联合统计最多32列，开启时最多4列。"
    status: "confirmed"
    source_anchor: "L94-L96"
  -
    id: "analyze_analyse_fact_no_multicolumn"
    type: "constraint"
    statement: "系统表和全局临时表不支持多列统计。"
    status: "confirmed"
    source_anchor: "L97-L97"
  -
    id: "analyze_analyse_fact_auto_columns"
    type: "environment"
    statement: "auto_statistic_ext_columns 开启后按索引前缀自动创建联合统计且不超出设置列数。"
    status: "confirmed"
    source_anchor: "L98-L101"
  -
    id: "analyze_analyse_fact_auto_example"
    type: "example"
    statement: "四列索引示例自动创建2/3/4列前缀统计。"
    status: "confirmed"
    source_anchor: "L102-L104"
  -
    id: "analyze_analyse_fact_syntax_verify_database"
    type: "syntax"
    statement: "VERIFY FAST/COMPLETE 不带对象时检测当前库。"
    status: "confirmed"
    source_anchor: "L109-L110"
  -
    id: "analyze_analyse_fact_concurrent_dml"
    type: "environment"
    statement: "VERIFY 直接读磁盘，并发 DML 可能造成误报，建议低峰或无业务执行。"
    status: "confirmed"
    source_anchor: "L117-L119"
  -
    id: "analyze_analyse_fact_checkpoint"
    type: "environment"
    statement: "VERIFY 前建议 checkpoint，整库输出建议重定向保存。"
    status: "confirmed"
    source_anchor: "L120-L122"
  -
    id: "analyze_analyse_fact_visible_notice"
    type: "behavior_oracle"
    statement: "仅外部可见表发 NOTICE，内部表随外部表检测。"
    status: "confirmed"
    source_anchor: "L124-L125"
  -
    id: "analyze_analyse_fact_critical_damage"
    type: "behavior_oracle"
    statement: "整库遇关键系统表损坏立即终止。"
    status: "confirmed"
    source_anchor: "L126-L126"
  -
    id: "analyze_analyse_fact_verify_types"
    type: "constraint"
    statement: "VERIFY 支持普通表和索引，不支持本地临时表或非日志表，整库时跳过不支持类型。"
    status: "confirmed"
    source_anchor: "L127-L128"
  -
    id: "analyze_analyse_fact_standby_cancel"
    type: "environment"
    statement: "备机支持 VERIFY，但 recovery 可能取消长时间校验。"
    status: "confirmed"
    source_anchor: "L129-L130"
  -
    id: "analyze_analyse_fact_syntax_verify_target"
    type: "syntax"
    statement: "VERIFY 目标为可选 CASCADE 的表，或单个索引。"
    status: "confirmed"
    source_anchor: "L131-L132"
  -
    id: "analyze_analyse_fact_index_cascade"
    type: "constraint"
    statement: "CASCADE 用于表的索引，不允许对单个索引指定。"
    status: "confirmed"
    source_anchor: "L136-L138"
  -
    id: "analyze_analyse_fact_internal"
    type: "behavior_oracle"
    statement: "主表检测包含内部表如 TOAST。"
    status: "confirmed"
    source_anchor: "L139-L139"
  -
    id: "analyze_analyse_fact_repair"
    type: "lifecycle"
    statement: "索引损坏后建议用 REINDEX 重建。"
    status: "confirmed"
    source_anchor: "L140-L140"
  -
    id: "analyze_analyse_fact_no_temp"
    type: "constraint"
    statement: "目标 VERIFY 不支持本地临时和非日志表。"
    status: "confirmed"
    source_anchor: "L141-L141"
  -
    id: "analyze_analyse_fact_standby"
    type: "environment"
    statement: "目标 VERIFY 支持在备机执行。"
    status: "confirmed"
    source_anchor: "L142-L142"
  -
    id: "analyze_analyse_fact_syntax_verify_partition"
    type: "syntax"
    statement: "VERIFY 表分区使用 PARTITION(name)，后接可选 CASCADE。"
    status: "confirmed"
    source_anchor: "L143-L145"
  -
    id: "analyze_analyse_fact_partition_index_cascade"
    type: "constraint"
    statement: "单分区检测也不允许单个索引加 CASCADE。"
    status: "confirmed"
    source_anchor: "L152-L152"
  -
    id: "analyze_analyse_fact_no_subpartition"
    type: "constraint"
    statement: "VERIFY 不能指定二级分区。"
    status: "confirmed"
    source_anchor: "L153-L153"
  -
    id: "analyze_analyse_fact_verbose"
    type: "behavior_oracle"
    statement: "VERBOSE 打印正在处理的表与统计进度信息。"
    status: "confirmed"
    source_anchor: "L158-L163"
  -
    id: "analyze_analyse_fact_table"
    type: "constraint"
    statement: "统计只支持行存，目标是已有表；省略目标不分析外部表。"
    status: "confirmed"
    source_anchor: "L164-L168"
  -
    id: "analyze_analyse_fact_columns"
    type: "syntax"
    statement: "列名必须存在，省略时为全部列。"
    status: "confirmed"
    source_anchor: "L169-L171"
  -
    id: "analyze_analyse_fact_partition"
    type: "syntax"
    statement: "partition_name 为目标表已有分区。"
    status: "confirmed"
    source_anchor: "L172-L175"
  -
    id: "analyze_analyse_fact_index"
    type: "syntax"
    statement: "index_name 为已有索引名称，可带模式。"
    status: "confirmed"
    source_anchor: "L176-L178"
  -
    id: "analyze_analyse_fact_mode"
    type: "behavior_oracle"
    statement: "FAST 主要校验 CRC/page header 并告警；COMPLETE 解析指针和 tuple。"
    status: "confirmed"
    source_anchor: "L179-L183"
  -
    id: "analyze_analyse_fact_cascade"
    type: "behavior_oracle"
    statement: "CASCADE 检测当前表全部索引。"
    status: "confirmed"
    source_anchor: "L184-L185"
  -
    id: "analyze_analyse_fact_partition_only"
    type: "constraint"
    statement: "PARTITION_MODE 仅适用于分区表级联统计。"
    status: "confirmed"
    source_anchor: "L186-L188"
  -
    id: "analyze_analyse_fact_partition_axes"
    type: "syntax"
    statement: "PARTITION_MODE 选项与统计层级对应。"
    status: "confirmed"
    source_anchor: "L190-L192"
  -
    id: "analyze_analyse_fact_partition_all"
    type: "syntax"
    statement: "ALL 收集整表以及一二级分区统计。"
    status: "confirmed"
    source_anchor: "L194-L195"
  -
    id: "analyze_analyse_fact_partition_global"
    type: "syntax"
    statement: "GLOBAL 只收集整表统计。"
    status: "confirmed"
    source_anchor: "L197-L197"
  -
    id: "analyze_analyse_fact_partition_partition"
    type: "syntax"
    statement: "PARTITION 只收集一级分区统计。"
    status: "confirmed"
    source_anchor: "L199-L199"
  -
    id: "analyze_analyse_fact_partition_global_partition"
    type: "syntax"
    statement: "GLOBAL AND PARTITION 收集整表及一级分区统计。"
    status: "confirmed"
    source_anchor: "L201-L201"
  -
    id: "analyze_analyse_fact_partition_subpartition"
    type: "syntax"
    statement: "SUBPARTITION 只收集二级分区统计。"
    status: "confirmed"
    source_anchor: "L203-L203"
  -
    id: "analyze_analyse_fact_partition_all_complete"
    type: "syntax"
    statement: "ALL COMPLETE 收集整表以及一二级分区统计。"
    status: "confirmed"
    source_anchor: "L205-L206"
  -
    id: "analyze_analyse_fact_partition_auto"
    type: "environment"
    statement: "AUTO 为缺省值，表级 statistic_granularity 优先于全局 default_statistic_granularity。"
    status: "confirmed"
    source_anchor: "L208-L214"
  -
    id: "analyze_analyse_fact_all_sample"
    type: "behavior_oracle"
    statement: "ALL 级联收集时分区采样率较低。"
    status: "confirmed"
    source_anchor: "L221-L223"
  -
    id: "analyze_analyse_fact_complete_sample"
    type: "behavior_oracle"
    statement: "ALL_COMPLETE 采用更高采样率，统计耗时更长。"
    status: "confirmed"
    source_anchor: "L224-L225"
  -
    id: "analyze_analyse_fact_partition_use"
    type: "environment"
    statement: "分区统计供 cplan 单分区裁剪使用，大量导数后建议 ALL COMPLETE。"
    status: "confirmed"
    source_anchor: "L226-L228"
  -
    id: "analyze_analyse_fact_upgrade"
    type: "environment"
    statement: "升级到505.0.0的观察期内 PARTITION_MODE 不生效。"
    status: "confirmed"
    source_anchor: "L229-L230"
  -
    id: "analyze_analyse_fact_no_database_mode"
    type: "constraint"
    statement: "整库 ANALYZE 不能显式指定 partition mode。"
    status: "confirmed"
    source_anchor: "L231-L231"
  -
    id: "analyze_analyse_fact_database_granularity"
    type: "behavior_oracle"
    statement: "整库全局粒度设为 GLOBAL/ALL 按相应定义工作，其他值退化为 GLOBAL。"
    status: "confirmed"
    source_anchor: "L232-L234"
  -
    id: "analyze_analyse_fact_transaction"
    type: "environment"
    statement: "普通 ANALYZE 可在事务块内执行；本声明不包含 VERIFY。"
    status: "confirmed"
    source_anchor: "L45-L46"
  -
    id: "analyze_analyse_fact_anonymous"
    type: "environment"
    statement: "普通 ANALYZE 可在匿名块内执行。"
    status: "confirmed"
    source_anchor: "L45-L46"
  -
    id: "analyze_analyse_fact_function"
    type: "environment"
    statement: "普通 ANALYZE 可在函数内执行。"
    status: "confirmed"
    source_anchor: "L45-L46"
  -
    id: "analyze_analyse_fact_procedure"
    type: "environment"
    statement: "普通 ANALYZE 可在存储过程内执行。"
    status: "confirmed"
    source_anchor: "L45-L46"
  -
    id: "analyze_analyse_fact_uheap_physical"
    type: "constraint"
    statement: "uheap 物理校验：支持。"
    status: "confirmed"
    source_anchor: "L17-L18"
  -
    id: "analyze_analyse_fact_uheap_logical"
    type: "constraint"
    statement: "uheap 逻辑校验：支持。"
    status: "confirmed"
