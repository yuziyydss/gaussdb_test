schema_version: 1
kind: "syntax"
id: "syntax_analyze_analyse"
name: "ANALYZE | ANALYSE 语法"
factor_ref: "analyze_analyse"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  keyword:
    type: "token"
    optional: true
    dimension_ref: "analyze_analyse.keyword"
  form:
    type: "token"
    optional: true
    dimension_ref: "analyze_analyse.form"
  verbose:
    type: "token"
    optional: true
    dimension_ref: "analyze_analyse.verbose"
  target:
    type: "token"
    optional: true
    dimension_ref: "analyze_analyse.target"
  columns:
    type: "token"
    optional: true
    dimension_ref: "analyze_analyse.columns"
  mode:
    type: "token"
    optional: true
    dimension_ref: "analyze_analyse.mode"
  cascade:
    type: "token"
    optional: true
    dimension_ref: "analyze_analyse.cascade"
source_fact_refs:
  - "analyze_analyse_fact_scope"
  - "analyze_analyse_fact_verify"
  - "analyze_analyse_fact_matrix_axes"
  - "analyze_analyse_fact_syntax_stats"
  - "analyze_analyse_fact_syntax_partition"
  - "analyze_analyse_fact_syntax_multicolumn"
  - "analyze_analyse_fact_syntax_verify_database"
  - "analyze_analyse_fact_syntax_verify_target"
  - "analyze_analyse_fact_syntax_verify_partition"
  - "analyze_analyse_fact_columns"
  - "analyze_analyse_fact_partition"
  - "analyze_analyse_fact_index"
  - "analyze_analyse_fact_partition_axes"
  - "analyze_analyse_fact_partition_all"
  - "analyze_analyse_fact_partition_global"
  - "analyze_analyse_fact_partition_partition"
  - "analyze_analyse_fact_partition_global_partition"
  - "analyze_analyse_fact_partition_subpartition"
  - "analyze_analyse_fact_partition_all_complete"
ast:
  kind: "sequence"
  items:
    -
      kind: "slot"
      slot: "keyword"
    -
      kind: "literal"
      text: " "
    -
      kind: "choice"
      selector: "form"
      branches:
        analyze_analyse_form_statistics:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "verbose"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "target"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "columns"
        analyze_analyse_form_verify:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "VERIFY "
            -
              kind: "slot"
              slot: "mode"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "target"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "cascade"
