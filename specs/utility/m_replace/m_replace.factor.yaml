facts:
- id: m_replace_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.15.4 L2-2
- id: m_replace_fact_syntax
  type: syntax
  statement: REPLACE 值形式允许省略INTO，VALUES/VALUE、显式列列表和多行输入。
  status: confirmed
  source_anchor: 2.4.2.15.4 L83-88
- id: m_replace_fact_query_syntax
  type: syntax
  statement: REPLACE 查询形式通过 query 提供输入，INTO和列列表可省略。
  status: confirmed
  source_anchor: 2.4.2.15.4 L93-99
- id: m_replace_fact_set_syntax
  type: syntax
  statement: REPLACE SET 使用有序列赋值列表，INTO可省略。
  status: confirmed
  source_anchor: 2.4.2.15.4 L102-108
- id: m_replace_fact_conflict
  type: behavior_oracle
  statement: 主键/唯一键冲突时先删除旧行再插入新行；无冲突直接插入。
  status: confirmed
  source_anchor: 2.4.2.15.4 L17-18
- id: m_replace_fact_count
  type: behavior_oracle
  statement: REPLACE 0 X 中 X 是删除和插入的操作数。
  status: confirmed
  source_anchor: 2.4.2.15.4 L19-19
- id: m_replace_fact_arity
  type: constraint
  statement: SELECT 输出列数应与显式目标字段数一致。
  status: confirmed
  source_anchor: 2.4.2.15.4 L20-20
- id: m_replace_fact_default
  type: syntax
  statement: DEFAULT 对应字段缺省值；无缺省则 NULL。
  status: confirmed
  source_anchor: 2.4.2.15.4 L137-137
- id: m_replace_fact_left_to_right
  type: behavior_oracle
  statement: SET 后赋值读取前面已设置列；未设置的列取默认值。
  status: confirmed
  source_anchor: 2.4.2.15.4 L65-67
- id: m_replace_fact_deferrable
  type: constraint
  statement: 不支持 DEFERRABLE 唯一或主键约束。
  status: confirmed
  source_anchor: 2.4.2.15.4 L68-68
- id: m_replace_fact_multi_conflict
  type: behavior_oracle
  statement: 多个唯一约束冲突会删除所有冲突行，再插入新行。
  status: confirmed
  source_anchor: 2.4.2.15.4 L69-71
- id: m_replace_fact_permissions
  type: environment
  statement: 执行 REPLACE 同时需要 DELETE 和 INSERT 权限。
  status: confirmed
  source_anchor: 2.4.2.15.4 L16-16
- id: m_replace_fact_zero_value_numeric
  type: behavior_oracle
  statement: REPLACE...SET无默认值且NOT NULL时，tinyint/smallint/mediumint/int/bigint/float4/float8/numeric/bool默认零值为0；numeric指定小数位则显示小数位。
  status: confirmed
  source_anchor: 2.4.2.15.4 L31-36
- id: m_replace_fact_zero_value_string
  type: behavior_oracle
  statement: char/varchar/tinytext/text/mediumtext/longtext/tinyblob/blob/mediumblob/longblob/bit/varbinary默认零值为空串。
  status: confirmed
  source_anchor: 2.4.2.15.4 L38-41
- id: m_replace_fact_zero_value_binary
  type: behavior_oracle
  statement: binary默认零值为空串，长度等于声明长度；未指定长度时长度为1。
  status: confirmed
  source_anchor: 2.4.2.15.4 L43-44
- id: m_replace_fact_zero_value_temporal
  type: behavior_oracle
  statement: time默认00:00:00；date默认0000-00-00；timestamp/datetime默认0000-00-00 00:00:00；year默认0000。
  status: confirmed
  source_anchor: 2.4.2.15.4 L46-54
- id: m_replace_fact_zero_value_lenient_mode
  type: environment
  statement: date、timestamp和datetime需在宽松模式下才能插入时间零值。
  status: confirmed
  source_anchor: 2.4.2.15.4 L61-64
- id: m_replace_fact_function_default
  type: behavior_oracle
  statement: 函数表达式默认值解析时可计算则取常量结果，否则为NULL。
  status: confirmed
  source_anchor: 2.4.2.15.4 L64-70
- id: m_replace_fact_default_null
  type: behavior_oracle
  statement: 除以上场景外，默认值为NULL。
  status: confirmed
  source_anchor: 2.4.2.15.4 L70-70
- id: m_replace_fact_multi_row_sequential
  type: behavior_oracle
  statement: 插入多行均与同一行冲突时，按执行顺序依次REPLACE。
  status: confirmed
  source_anchor: 2.4.2.15.4 L72-79
- id: m_replace_fact_set_length_limit
  type: constraint
  statement: SET col_name=col_name+1中col_name长度不支持超过1，如table_name.col_name形式不支持。
  status: confirmed
  source_anchor: 2.4.2.15.4 L91-94
- id: m_replace_fact_float_precision
  type: behavior_oracle
  statement: 浮点型比较时可能存在精度丢失。
  status: confirmed
  source_anchor: 2.4.2.15.4 L95-96
- id: m_replace_fact_encrypted_table
  type: environment
  statement: 不支持密态表。
  status: confirmed
  source_anchor: 2.4.2.15.4 L97-97
- id: m_replace_fact_memory_table
  type: environment
  statement: 不支持内存表。
  status: confirmed
  source_anchor: 2.4.2.15.4 L98-98
- id: m_replace_fact_partition_mismatch
  type: constraint
  statement: PARTITION子句的值与指定分区不一致时提示异常。
  status: confirmed
  source_anchor: 2.4.2.15.4 L131-132
- id: m_replace_fact_col_subfield
  type: syntax
  statement: 字段名可由子字段名或数组下标修饰。
  status: confirmed
  source_anchor: 2.4.2.15.4 L123-124
- id: m_replace_fact_col_default_fill
  type: behavior_oracle
  statement: 未在字段列表中的字段由系统设默认值或声明默认值填充；均无则NULL。
  status: confirmed
  source_anchor: 2.4.2.15.4 L125-127
- id: m_replace_fact_col_order
  type: syntax
  statement: 目标字段可按顺序排列；未列出字段时默认全部字段且按表声明顺序。
  status: confirmed
  source_anchor: 2.4.2.15.4 L128-130
- id: m_replace_fact_partial_columns
  type: syntax
  statement: VALUE/QUERY只提供N个字段时目标字段为前N个。
  status: confirmed
  source_anchor: 2.4.2.15.4 L130-131
- id: m_replace_fact_value_column_association
  type: behavior_oracle
  statement: VALUE子句和QUERY提供的值在表中从左到右关联到对应列。
  status: confirmed
  source_anchor: 2.4.2.15.4 L123-131
- id: m_replace_fact_quote_escape
  type: syntax
  statement: 插入单引号时需使用单引号自身转义。
  status: confirmed
  source_anchor: 2.4.2.15.4 L133-133
- id: m_replace_fact_type_conversion
  type: behavior_oracle
  statement: 表达式类型不正确时系统尝试类型转换；转换失败则插入失败并返回错误。
  status: confirmed
  source_anchor: 2.4.2.15.4 L135-136
