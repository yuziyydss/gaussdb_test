facts:
- id: m_timecapsule_table_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.17.2 L2-2
- id: m_timecapsule_table_fact_syntax
  type: syntax
  statement: TIMECAPSULE TABLE支持BEFORE DROP可选RENAME、BEFORE TRUNCATE和版本点分支。
  status: confirmed
  source_anchor: 2.4.2.17.2 L88-90
- id: m_timecapsule_table_fact_storage
  type: environment
  statement: TO CSN/TIMESTAMP仅Ustore；回收站DROP/TRUNCATE支持Ustore与Astore。
  status: confirmed
  source_anchor: 2.4.2.17.2 L11-16
- id: m_timecapsule_table_fact_authority
  type: environment
  statement: DROP闪回要求Schema CREATE/USAGE及Schema或对象所有者；TRUNCATE另需TRUNCATE权限。
  status: confirmed
  source_anchor: 2.4.2.17.2 L24-28
- id: m_timecapsule_table_fact_switches
  type: environment
  statement: 回收站必须开启，非维护/不支持升级场景，保留期内目标仍存在。
  status: confirmed
  source_anchor: 2.4.2.17.2 L30-41
- id: m_timecapsule_table_fact_unsupported
  type: constraint
  statement: 临时/UNLOGGED/系统等表不支持；本批仅普通永久整数表。
  status: confirmed
  source_anchor: 2.4.2.17.2 L17-18
- id: m_timecapsule_table_fact_single
  type: constraint
  statement: 一次删除或截断多个对象不支持闪回回收站。
  status: confirmed
  source_anchor: 2.4.2.17.2 L33-34
- id: m_timecapsule_table_fact_ddl_gap
  type: constraint
  statement: TRUNCATE与恢复间影响结构或物理文件的DDL/DCL/VACUUM FULL导致失败。
  status: confirmed
  source_anchor: 2.4.2.17.2 L40-42
- id: m_timecapsule_table_fact_rename
  type: constraint
  statement: RENAME TO只支持DROP恢复，不支持TRUNCATE。
  status: confirmed
  source_anchor: 2.4.2.17.2 L74-75
- id: m_timecapsule_table_fact_rename_error
  type: behavior_oracle
  statement: 'RENAME TO用于TRUNCATE恢复时，原文错误为“ERROR: recycle object %s desired does not exist.”。'
  status: confirmed
  source_anchor: 2.4.2.17.2 L84-85
- id: m_timecapsule_table_fact_names
  type: lifecycle
  statement: 同原始名选择最新回收对象，系统生成名唯一；本批专用Schema避免重名历史。
  status: confirmed
  source_anchor: 2.4.2.17.2 L52-55
- id: m_timecapsule_table_fact_dependents
  type: behavior_oracle
  statement: DROP恢复只还原基表名，不恢复序列/函数DEFAULT或已级联删除的视图。
  status: confirmed
  source_anchor: 2.4.2.17.2 L61-67
- id: m_timecapsule_table_fact_statistics
  type: metadata_oracle
  statement: TRUNCATE恢复后统计仍为0，不代表数据没有恢复。
  status: confirmed
  source_anchor: 2.4.2.17.2 L72-73
- id: m_timecapsule_table_fact_ddl_modified_error
  type: behavior_oracle
  statement: 'TRUNCATE与闪回间执行过DDL时，原文错误为“ERROR: The table definition of %s has been modified.”。'
  status: confirmed
  source_anchor: 2.4.2.17.2 L81-L82
- id: m_timecapsule_table_fact_version_point
  type: environment
  statement: 历史版本依赖保留的UNDO，必须运行时取得真实CSN/时间点，不能照抄示例。
  status: confirmed
  source_anchor: 2.4.2.17.2 L124-125
- id: m_timecapsule_table_fact_cleanup
  type: syntax
  statement: 恢复后DROP TABLE ... PURGE物理删除本case表与相关回收站数据，避免再次入回收站。
  status: confirmed
  source_anchor: 2.4.2.17.2 L195-196
- id: m_timecapsule_table_fact_purpose
  type: example
  statement: 在人为操作或应用程序错误时，可以使用TIMECAPSULE TABLE语句将表恢复到指定的 早期状态。
  status: confirmed
  source_anchor: M-Compatibility L4-6
- id: m_timecapsule_table_fact_constraint
  type: example
  statement: TIMECAPSULE TABLE的主要用法分为：闪回旧版本数据和从回收站中进行闪回。 目前不支持闪回表的对象类型：系统表、DFS表、全局临时表、本地临时表、
  status: confirmed
  source_anchor: M-Compatibility L9-10
- id: m_timecapsule_table_fact_params
  type: example
  statement: ●    schema 可选，指定模式包含的表。如未指定模式，则默认为当前模式。 ●    table_name
  status: confirmed
  source_anchor: M-Compatibility L95-105
- id: m_timecapsule_table_fact_example
  type: example
  statement: m_timecapsule_table的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L120-122
rules:
- id: m_timecapsule_table_rule_rename_only_drop
  kind: requires
  expression: operation == 'm_timecapsule_table_operation_drop' or rename == 'm_timecapsule_table_rename_none'
  fact_refs:
  - m_timecapsule_table_fact_rename
  - m_timecapsule_table_fact_rename_error
  severity: error
- id: m_timecapsule_table_rule_no_intervening_ddl
  kind: requires
  expression: intervening_ddl != 'm_timecapsule_table_intervening_ddl_alter'
  fact_refs:
  - m_timecapsule_table_fact_ddl_gap
  - m_timecapsule_table_fact_ddl_modified_error
  severity: error
