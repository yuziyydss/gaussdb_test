facts:
- id: m_set_transaction_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.16.7 L2-2
- id: m_set_transaction_fact_syntax
  type: syntax
  statement: 事务特性包括四种隔离级别以及 READ WRITE/READ ONLY。
  status: confirmed
  source_anchor: 2.4.2.16.7 L17-19
- id: m_set_transaction_fact_local_session
  type: environment
  statement: SET TRANSACTION 的 LOCAL 等价 SESSION，仅对当前会话生效。
  status: confirmed
  source_anchor: 2.4.2.16.7 L24-26
- id: m_set_transaction_fact_before_data
  type: environment
  statement: 当前事务的隔离级别必须在首个 SELECT/INSERT/DELETE/UPDATE/COPY 前设置。
  status: confirmed
  source_anchor: 2.4.2.16.7 L34-35
- id: m_set_transaction_fact_global_reconnect
  type: environment
  statement: GLOBAL 修改当前数据库全局会话特性，重新连接后生效。
  status: confirmed
  source_anchor: 2.4.2.16.7 L10-10
- id: m_set_transaction_fact_s2_next
  type: environment
  statement: s2 的无修饰 SET TRANSACTION 设置下一个事务，不允许在当前事务内使用。
  status: confirmed
  source_anchor: 2.4.2.16.7 L11-13
- id: m_set_transaction_fact_uncommitted_alias
  type: behavior_oracle
  statement: READ UNCOMMITTED 行为同 READ COMMITTED，不承诺脏读。
  status: confirmed
  source_anchor: 2.4.2.16.7 L39-40
- id: m_set_transaction_fact_serializable_alias
  type: behavior_oracle
  statement: SERIALIZABLE 功能等价 REPEATABLE READ，不当作语法不支持。
  status: confirmed
  source_anchor: 2.4.2.16.7 L44-45
- id: m_set_transaction_fact_combined_gap
  type: syntax
  statement: 示例确认LOCAL可在隔离级别后以空格连接READ ONLY；不推广为全组合矩阵。
  status: confirmed
  source_anchor: 2.4.2.16.7 L52-52
- id: m_set_transaction_fact_purpose
  type: example
  statement: 为事务设置特性。事务特性包括事务隔离级别、事务访问模式(读/写或者只读)。可以 设置会话的默认事务特性（SESSION），也可以设置当前数据库的全局会话的事务特 性（GLOBAL）。
  status: confirmed
  source_anchor: M-Compatibility L4-7
- id: m_set_transaction_fact_constraint
  type: example
  statement: 设置当前数据库全局会话（GLOBAL）的事务特性在重新连接后生效。开启 m_format_dev_version='s2'参数时，SET TRANSACTION默认是设置下一个事务特
  status: confirmed
  source_anchor: M-Compatibility L9-9
- id: m_set_transaction_fact_params
  type: example
  statement: ●   LOCAL 声明这个命令只对当前会话起作用。效果等价于SESSION。 ●   SESSION
  status: confirmed
  source_anchor: M-Compatibility L22-23
- id: m_set_transaction_fact_example
  type: example
  statement: m_set_transaction的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L49-51
