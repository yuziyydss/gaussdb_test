schema_version: 1
kind: "scenario"
id: "scenario_purge_documented_contracts"
name: "PURGE documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "purge"
fixture_refs: []
fact_refs:
  - "purge_fact_body_5"
  - "purge_fact_body_7"
  - "purge_fact_body_8"
  - "purge_fact_body_11"
  - "purge_fact_body_15"
  - "purge_fact_body_16"
  - "purge_fact_body_19"
  - "purge_fact_body_21"
  - "purge_fact_body_21_1"
  - "purge_fact_body_25"
  - "purge_fact_body_27"
  - "purge_fact_body_27_1"
  - "purge_fact_body_31"
  - "purge_fact_body_33"
  - "purge_fact_body_35"
  - "purge_fact_body_39"
  - "purge_fact_body_40"
  - "purge_fact_body_41"
  - "purge_fact_body_43"
  - "purge_fact_body_45"
  - "purge_fact_body_59"
  - "purge_fact_body_62"
  - "purge_fact_body_64"
  - "purge_fact_body_66"
  - "purge_fact_body_68"
  - "purge_fact_body_70"
  - "purge_fact_atomic_11_0"
  - "purge_fact_atomic_11_1"
  - "purge_fact_atomic_11_2"
  - "purge_fact_atomic_11_3"
  - "purge_fact_atomic_11_4"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "使用PURGE语句可以实现如下功能："
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "●     从回收站中清理表、索引或数据库对象，并释放对象相关的全部空间。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "●     清理表回收站或者库回收站。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "●     清除（PURGE）操作支持：表（PURGE TABLE）、索引（PURGE INDEX）、数 据库（PURGE DATABASE）、表回收站（PURGE RECYCLEBIN）、库回收站 （PURGE DATABASE RECYCLEBIN）。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "●     执行PURGE操作的权限要求如下："
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "–   PURGE TABLE：用户必须是表的所有者，且用户必须拥有表所在模式的 USAGE权限，当三权分立开关关闭时，系统管理员默认拥有此权限。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "–    PURGE INDEX：用户必须是索引的所有者，用户必须拥有索引所在模式的 USAGE权限，当三权分立开关关闭时，系统管理员默认拥有此权限。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "–    PURGE RECYCLEBIN：具有superuser或sysdba权限的用户可以执行该操作， 普通用户无此权限。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "普通用户只能清理回收站中当前用户拥有的对象，且用 户必须拥有对象所在模式的USAGE权限，当三权分立开关关闭时，系统管理 员默认可以清理回收站所有对象。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "–    PURGE DATABASE：用户必须是数据库的所有者，且用户必须拥有数据库的 DROP权限，当三权分立开关关闭时，系统管理员默认拥有此权限。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "–    PURGE DATABASE RECYCLEBIN：具有系统管理员权限或sysdba权限的用户 可以执行该操作，普通用户无此权限。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "普通用户只能清理回收站对象中当前 用户拥有DROP权限的数据库对象，当三权分立开关关闭时，系统管理员默认 可以清理库级回收站所有对象。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "–    PURGE DATABASE和PURGE DATABASE RECYCLEBIN不支持在事务块内运 行。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "–    并发删除多个库时，可能提示回收站容量不足导致并发操作失败，实际回收 站能满足部分库的空间要求，可重试规避。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "–    PURGE DATABASE和PURGE DATABASE RECYCLEBIN继承DROP DATABASE 的文件残留约束。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "●    开启enable_recyclebin参数，启用表回收站，参数使用请联系管理员。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "●    开启enable_db_recyclebin参数，启用库回收站，参数使用请联系管理员。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "●    recyclebin_retention_time参数用于设置回收站对象保留时间，超过该时间的回收 站对象将被自动清理，参数使用请联系管理员。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "●    dbrecyclebin_retention_time参数用于设置库回收站对象保留时间，超过该时间 的回收站对象将被自动清理，参数使用请联系管理员。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "●    dbrecyclebin_maxsize参数用户设置回收站最大容量，参数使用请联系管理员。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "●    schema_name 模式名。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "●    TABLE [ schema_name. ] table_name 清空表级回收站中指定的表，可用模式名修饰。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "●    INDEX index_name 清空表级回收站中指定的索引。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "●    RECYCLEBIN 清空表级回收站中的所有对象。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "●    DATABASE database_name 清除库级回收站中指定的数据库对象。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "●    DATABASE RECYCLEBIN 清空库级回收站中归属当前用户的所有数据库对象。"
  -
    id: "verify_purge_fact_atomic_11_0"
    action: "verify_documented_contract"
    note: "PURGE支持TABLE目标。"
  -
    id: "verify_purge_fact_atomic_11_1"
    action: "verify_documented_contract"
    note: "PURGE支持INDEX目标。"
  -
    id: "verify_purge_fact_atomic_11_2"
    action: "verify_documented_contract"
    note: "PURGE支持DATABASE目标。"
  -
    id: "verify_purge_fact_atomic_11_3"
    action: "verify_documented_contract"
    note: "PURGE支持RECYCLEBIN目标。"
  -
    id: "verify_purge_fact_atomic_11_4"
    action: "verify_documented_contract"
    note: "PURGE支持DATABASE RECYCLEBIN目标。"
oracles:
  -
    kind: "documented_behavior"
    expected: "–    并发删除多个库时，可能提示回收站容量不足导致并发操作失败，实际回收 站能满足部分库的空间要求，可重试规避。"
  -
    kind: "documented_behavior"
    expected: "–    PURGE DATABASE和PURGE DATABASE RECYCLEBIN继承DROP DATABASE 的文件残留约束。"
execution_requirements:
  - "database"
  - "same_session"
