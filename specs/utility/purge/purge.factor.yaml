facts:
  -
    id: "purge_fact_body_5"
    type: "constraint"
    statement: "使用PURGE语句可以实现如下功能："
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "purge_fact_body_7"
    type: "constraint"
    statement: "●     从回收站中清理表、索引或数据库对象，并释放对象相关的全部空间。"
    status: "confirmed"
    source_anchor: "L7-L7"
  -
    id: "purge_fact_body_8"
    type: "constraint"
    statement: "●     清理表回收站或者库回收站。"
    status: "confirmed"
    source_anchor: "L8-L8"
  -
    id: "purge_fact_body_11"
    type: "constraint"
    statement: "●     清除（PURGE）操作支持：表（PURGE TABLE）、索引（PURGE INDEX）、数 据库（PURGE DATABASE）、表回收站（PURGE RECYCLEBIN）、库回收站 （PURGE DATABASE RECYCLEBIN）。"
    status: "confirmed"
    source_anchor: "L11-L13"
  -
    id: "purge_fact_body_15"
    type: "environment"
    statement: "●     执行PURGE操作的权限要求如下："
    status: "confirmed"
    source_anchor: "L15-L15"
  -
    id: "purge_fact_body_16"
    type: "environment"
    statement: "–   PURGE TABLE：用户必须是表的所有者，且用户必须拥有表所在模式的 USAGE权限，当三权分立开关关闭时，系统管理员默认拥有此权限。"
    status: "confirmed"
    source_anchor: "L16-L17"
  -
    id: "purge_fact_body_19"
    type: "environment"
    statement: "–    PURGE INDEX：用户必须是索引的所有者，用户必须拥有索引所在模式的 USAGE权限，当三权分立开关关闭时，系统管理员默认拥有此权限。"
    status: "confirmed"
    source_anchor: "L19-L20"
  -
    id: "purge_fact_body_21"
    type: "environment"
    statement: "–    PURGE RECYCLEBIN：具有superuser或sysdba权限的用户可以执行该操作， 普通用户无此权限。"
    status: "confirmed"
    source_anchor: "L21-L24"
  -
    id: "purge_fact_body_21_1"
    type: "environment"
    statement: "普通用户只能清理回收站中当前用户拥有的对象，且用 户必须拥有对象所在模式的USAGE权限，当三权分立开关关闭时，系统管理 员默认可以清理回收站所有对象。"
    status: "confirmed"
    source_anchor: "L21-L24"
  -
    id: "purge_fact_body_25"
    type: "environment"
    statement: "–    PURGE DATABASE：用户必须是数据库的所有者，且用户必须拥有数据库的 DROP权限，当三权分立开关关闭时，系统管理员默认拥有此权限。"
    status: "confirmed"
    source_anchor: "L25-L26"
  -
    id: "purge_fact_body_27"
    type: "environment"
    statement: "–    PURGE DATABASE RECYCLEBIN：具有系统管理员权限或sysdba权限的用户 可以执行该操作，普通用户无此权限。"
    status: "confirmed"
    source_anchor: "L27-L30"
  -
    id: "purge_fact_body_27_1"
    type: "environment"
    statement: "普通用户只能清理回收站对象中当前 用户拥有DROP权限的数据库对象，当三权分立开关关闭时，系统管理员默认 可以清理库级回收站所有对象。"
    status: "confirmed"
    source_anchor: "L27-L30"
  -
    id: "purge_fact_body_31"
    type: "constraint"
    statement: "–    PURGE DATABASE和PURGE DATABASE RECYCLEBIN不支持在事务块内运 行。"
    status: "confirmed"
    source_anchor: "L31-L32"
  -
    id: "purge_fact_body_33"
    type: "behavior_oracle"
    statement: "–    并发删除多个库时，可能提示回收站容量不足导致并发操作失败，实际回收 站能满足部分库的空间要求，可重试规避。"
    status: "confirmed"
    source_anchor: "L33-L34"
  -
    id: "purge_fact_body_35"
    type: "behavior_oracle"
    statement: "–    PURGE DATABASE和PURGE DATABASE RECYCLEBIN继承DROP DATABASE 的文件残留约束。"
    status: "confirmed"
    source_anchor: "L35-L36"
  -
    id: "purge_fact_body_39"
    type: "environment"
    statement: "●    开启enable_recyclebin参数，启用表回收站，参数使用请联系管理员。"
    status: "confirmed"
    source_anchor: "L39-L39"
  -
    id: "purge_fact_body_40"
    type: "environment"
    statement: "●    开启enable_db_recyclebin参数，启用库回收站，参数使用请联系管理员。"
    status: "confirmed"
    source_anchor: "L40-L40"
  -
    id: "purge_fact_body_41"
    type: "environment"
    statement: "●    recyclebin_retention_time参数用于设置回收站对象保留时间，超过该时间的回收 站对象将被自动清理，参数使用请联系管理员。"
    status: "confirmed"
    source_anchor: "L41-L42"
  -
    id: "purge_fact_body_43"
    type: "environment"
    statement: "●    dbrecyclebin_retention_time参数用于设置库回收站对象保留时间，超过该时间 的回收站对象将被自动清理，参数使用请联系管理员。"
    status: "confirmed"
    source_anchor: "L43-L44"
  -
    id: "purge_fact_body_45"
    type: "environment"
    statement: "●    dbrecyclebin_maxsize参数用户设置回收站最大容量，参数使用请联系管理员。"
    status: "confirmed"
    source_anchor: "L45-L45"
  -
    id: "purge_fact_grammar_line_48"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：PURGE { TABLE [schema_name.]table_name"
    status: "confirmed"
    source_anchor: "L48-L48"
  -
    id: "purge_fact_grammar_line_49"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：| INDEX index_name"
    status: "confirmed"
    source_anchor: "L49-L49"
  -
    id: "purge_fact_grammar_line_50"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：| RECYCLEBIN"
    status: "confirmed"
    source_anchor: "L50-L50"
  -
    id: "purge_fact_grammar_line_51"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：| DATABASE database_name"
    status: "confirmed"
    source_anchor: "L51-L51"
  -
    id: "purge_fact_grammar_line_52"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：| DATABASE RECYCLEBIN"
    status: "confirmed"
    source_anchor: "L52-L52"
  -
    id: "purge_fact_grammar_line_53"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：};"
    status: "confirmed"
    source_anchor: "L53-L53"
  -
    id: "purge_fact_body_59"
    type: "constraint"
    statement: "●    schema_name 模式名。"
    status: "confirmed"
    source_anchor: "L59-L60"
  -
    id: "purge_fact_body_62"
    type: "constraint"
    statement: "●    TABLE [ schema_name. ] table_name 清空表级回收站中指定的表，可用模式名修饰。"
    status: "confirmed"
    source_anchor: "L62-L63"
  -
    id: "purge_fact_body_64"
    type: "constraint"
    statement: "●    INDEX index_name 清空表级回收站中指定的索引。"
    status: "confirmed"
    source_anchor: "L64-L65"
  -
    id: "purge_fact_body_66"
    type: "constraint"
    statement: "●    RECYCLEBIN 清空表级回收站中的所有对象。"
    status: "confirmed"
    source_anchor: "L66-L67"
  -
    id: "purge_fact_body_68"
    type: "constraint"
    statement: "●    DATABASE database_name 清除库级回收站中指定的数据库对象。"
    status: "confirmed"
    source_anchor: "L68-L69"
  -
    id: "purge_fact_body_70"
    type: "constraint"
    statement: "●    DATABASE RECYCLEBIN 清空库级回收站中归属当前用户的所有数据库对象。"
    status: "confirmed"
    source_anchor: "L70-L71"
  -
    id: "purge_fact_example_74"
    type: "example"
    statement: "示例原文片段：示例一：表级回收站清理 --创建表reason_t1。 gaussdb=# CREATE TABLE reason_t1( r_reason_sk integer, r_reason_id character(16), r_reason_desc character(100) ) WITH(STORAGE_TYPE = ustore);"
    status: "confirmed"
    source_anchor: "L74-L80"
  -
    id: "purge_fact_example_82"
    type: "example"
    statement: "示例原文片段：--创建表reason_t2。 gaussdb=# CREATE TABLE reason_t2( r_reason_sk integer, r_reason_id character(16), r_reason_desc character(100) ) WITH(STORAGE_TYPE = ustore);"
    status: "confirmed"
    source_anchor: "L82-L87"
  -
    id: "purge_fact_example_89"
    type: "example"
    statement: "示例原文片段：-- 对表reason_t1和reason_t2添加索引。 gaussdb=# CREATE INDEX idx_t1 on reason_t1(r_reason_id); gaussdb=# CREATE INDEX idx_t2 on reason_t2(r_reason_id); gaussdb=# DROP TABLE reason_t1; gaussdb=# DROP TABLE reason_t2;"
    status: "confirmed"
    source_anchor: "L89-L93"
  -
    id: "purge_fact_example_95"
    type: "example"
    statement: "示例原文片段：--查看回收站。 gaussdb=# SELECT rcyname,rcyoriginname,rcytablespace FROM GS_RECYCLEBIN; rcyname            | rcyoriginname | rcytablespace ----------------------------+---------------+--------------- BIN$31C94EB4207$8001$0==$0 | reason_t1                |       0 BIN$31C94EB420D$8001$0==$0 | idx_t1                 |       0 BIN$31C94EB420A$8004$0==$0 | reason_t2                |       0 BIN$31C94EB420E$8004$0==$0 | idx_t2                |        0 (4 rows)"
    status: "confirmed"
    source_anchor: "L95-L103"
  -
    id: "purge_fact_example_105"
    type: "example"
    statement: "示例原文片段：--PURGE清除表。 gaussdb=# PURGE TABLE reason_t1; gaussdb=# SELECT rcyname,rcyoriginname,rcytablespace FROM GS_RECYCLEBIN; rcyname            | rcyoriginname | rcytablespace ----------------------------+---------------+--------------- BIN$31C94EB420A$8004$0==$0 | reason_t2               |        0 BIN$31C94EB420E$8004$0==$0 | idx_t2                |        0 (2 rows)"
    status: "confirmed"
    source_anchor: "L105-L112"
  -
    id: "purge_fact_example_114"
    type: "example"
    statement: "示例原文片段：--PURG清除索引。 gaussdb=# PURGE INDEX idx_t2; gaussdb=# SELECT rcyname,rcyoriginname,rcytablespace FROM GS_RECYCLEBIN; rcyname            | rcyoriginname | rcytablespace ----------------------------+---------------+--------------- BIN$31C94EB420A$8004$0==$0 | reason_t2               |      0 (1 row)"
    status: "confirmed"
    source_anchor: "L114-L120"
  -
    id: "purge_fact_example_122"
    type: "example"
    statement: "示例原文片段：--PURGE清除回收站所有对象。 gaussdb=# PURGE recyclebin; gaussdb=# SELECT rcyname,rcyoriginname,rcytablespace FROM GS_RECYCLEBIN; rcyname          | rcyoriginname | rcytablespace -----------------------+---------------+--------------- (0 rows)"
    status: "confirmed"
    source_anchor: "L122-L127"
  -
    id: "purge_fact_example_129"
    type: "example"
    statement: "示例原文片段：示例二：库级回收站清理 --创建库。 gaussdb=# CREATE DATABASE dbflashback; CREATE DATABASE --删除库。 gaussdb=# DROP DATABASE dbflashback; DROP DATABASE --查看库级回收站。 gaussdb=# select * from gs_db_recyclebin; rcydbid |        rcyname           | rcyoriginname | rcyrecyclecsn |        rcyrecycletime          | rcytablespaces |"
    status: "confirmed"
    source_anchor: "L129-L138"
  -
    id: "purge_fact_example_139"
    type: "example"
    statement: "示例原文片段：rcydbsize ---------+---------------------------+---------------+---------------+-------------------------------+---------------- +----------- 82510 | BIN$1424E67F$2F48D700==$0 | dbflashback |                    13881 | 2024-10-11 08:52:33.670809-05 | 1663          |    26312 (1 row)"
    status: "confirmed"
    source_anchor: "L139-L144"
  -
    id: "purge_fact_example_146"
    type: "example"
    statement: "示例原文片段：--使用系统生成名称清理库对象。 gaussdb=# purge database \"BIN$C1CE67F$26839300==$0\"; PURGE DATABASE --或者使用数据库原名清理库对象。 gaussdb=# purge database dbflashback; PURGE DATABASE --查看库回收站清理完成。 gaussdb=# select * from gs_db_recyclebin; rcydbid | rcyname | rcyoriginname | rcyrecyclecsn | rcyrecycletime | rcytablespaces | rcydbsize ---------+---------+---------------+---------------+----------------+----------------+-----------"
    status: "confirmed"
    source_anchor: "L146-L155"
  -
    id: "purge_fact_example_156"
    type: "example"
    statement: "示例原文片段：(0 rows) --批量清理库级回收站对象。 gaussdb=# purge database recyclebin; PURGE DATABASE RECYCLEBIN gaussdb=# select * from gs_db_recyclebin; rcydbid | rcyname | rcyoriginname | rcyrecyclecsn | rcyrecycletime | rcytablespaces | rcydbsize ---------+---------+---------------+---------------+----------------+----------------+----------- (0 rows)"
    status: "confirmed"
    source_anchor: "L156-L163"
  -
    id: "purge_fact_global_and_acl"
    type: "open_question"
    statement: "RECYCLEBIN/DATABASE RECYCLEBIN涉及全局或用户全部对象，不进入普通清单；正文普通用户无权限与只能清理自有对象的措辞也需澄清。当前只指定本轮独占Schema中的单表/索引。"
    status: "needs_verification"
    source_anchor: "L21-L24"
