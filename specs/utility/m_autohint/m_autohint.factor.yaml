facts:
- id: m_autohint_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.18 L2-2
- id: m_autohint_fact_syntax
  type: syntax
  statement: AUTOHINT可含括号选项，目标必须为SELECT；本批为真实整数表连接聚合查询。
  status: confirmed
  source_anchor: 2.4.2.6.18 L15-23
- id: m_autohint_fact_authority
  type: environment
  statement: 仅支持SELECT且使用者须有管理员权限。
  status: confirmed
  source_anchor: 2.4.2.6.18 L9-9
- id: m_autohint_fact_parentheses
  type: constraint
  statement: 除ANALYZE之外的选项必须位于括号内。
  status: confirmed
  source_anchor: 2.4.2.6.18 L10-11
- id: m_autohint_fact_analyze
  type: lifecycle
  statement: ANALYZE TRUE默认先探索；FALSE直接依赖历史探索记录。
  status: confirmed
  source_anchor: 2.4.2.6.18 L36-41
- id: m_autohint_fact_verbose
  type: behavior_oracle
  statement: VERBOSE控制额外信息输出，默认TRUE。
  status: confirmed
  source_anchor: 2.4.2.6.18 L42-45
- id: m_autohint_fact_patch
  type: behavior_oracle
  statement: SQLPATCH默认TRUE表示输出SQL PATCH指令，不据此推断已经执行指令或安装补丁。
  status: confirmed
  source_anchor: 2.4.2.6.18 L47-51
- id: m_autohint_fact_test
  type: behavior_oracle
  statement: TEST默认TRUE实际执行原始与推荐查询并输出计划时间，FALSE不进行结果验证。
  status: confirmed
  source_anchor: 2.4.2.6.18 L53-58
- id: m_autohint_fact_debug
  type: behavior_oracle
  statement: DEBUG默认TRUE输出计划树、时间和探索图等详细信息。
  status: confirmed
  source_anchor: 2.4.2.6.18 L59-65
- id: m_autohint_fact_existing_hint
  type: behavior_oracle
  statement: 已有Hint将被忽略，从无Hint查询重新推荐。
