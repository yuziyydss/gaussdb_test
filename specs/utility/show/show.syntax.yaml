schema_version: 1
kind: "syntax"
id: "syntax_show"
name: "SHOW 语法"
factor_ref: "show"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "show.form"
  parameter:
    type: "token"
    optional: true
    dimension_ref: "show.parameter"
  pattern:
    type: "token"
    optional: true
    dimension_ref: "show.pattern"
  special:
    type: "token"
    optional: true
    dimension_ref: "show.special"
source_fact_refs:
  - "show_fact_syntax"
  - "show_fact_parameter_form"
  - "show_fact_schema_form"
  - "show_fact_zone_form"
  - "show_fact_isolation_form"
  - "show_fact_authorization_form"
  - "show_fact_all_form"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "SHOW "
    -
      kind: "choice"
      selector: "form"
      branches:
        show_form_parameter:
          kind: "slot"
          slot: "parameter"
        show_form_like:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "VARIABLES LIKE "
            -
              kind: "slot"
              slot: "pattern"
        show_form_special:
          kind: "slot"
          slot: "special"
