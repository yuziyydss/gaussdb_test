    status: "confirmed"
    source_anchor: "L19-L21"
  -
    id: "show_fact_parameter_domain"
    type: "constraint"
    statement: "静态域仅覆盖timezone与max_datanodes两个原文参数；完整GUC名称和目标环境可用性保留为来源限制。"
    status: "confirmed"
    source_anchor: "L19-L21"
  -
    id: "show_fact_not_settable"
    type: "constraint"
    statement: "SHOW ALL 可见不等于 SET 可设置；例如 max_datanodes 不可通过 SET 设置。"
    status: "confirmed"
    source_anchor: "L24-L24"
  -
    id: "show_fact_schema"
