facts:
- id: m_clean_connection_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.1 L2-2
- id: m_clean_connection_fact_syntax
  type: syntax
  statement: M CLEAN CONNECTION仅TO ALL，可选CHECK/FORCE及数据库、用户过滤。
  status: confirmed
  source_anchor: 2.4.2.8.1 L12-15
- id: m_clean_connection_fact_nodes
  type: constraint
  statement: M不支持指定节点，仅TO ALL。
  status: confirmed
  source_anchor: 2.4.2.8.1 L8-8
- id: m_clean_connection_fact_scope
  type: environment
  statement: 不指定dbname或username会扩大到全部数据库或全部用户，当前两个过滤均必需。
  status: confirmed
  source_anchor: 2.4.2.8.1 L29-34
- id: m_clean_connection_fact_check
  type: behavior_oracle
  statement: CHECK发现其他会话连接访问时会报错；不能把CHECK等同于无副作用查询。
  status: confirmed
  source_anchor: 2.4.2.8.1 L20-22
- id: m_clean_connection_fact_force
  type: lifecycle
  statement: FORCE向匹配线程发送SIGTERM；本批不生成FORCE或终止其他连接。
  status: confirmed
  source_anchor: 2.4.2.8.1 L24-25
- id: m_clean_connection_fact_mapping
  type: environment
  statement: 本章示例的M建库与物理datname映射不作为通用证据；当前模型绑定独立M建库计划物理名，不复制示例建库。
  status: confirmed
  source_anchor: 2.4.2.8.1 L36-37
- id: m_clean_connection_fact_purpose
  type: example
  statement: 用来清理数据库连接。允许在节点上清理指定数据库的指定用户的相关连接。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_clean_connection_fact_constraint
  type: example
  statement: M-Compatibility下不支持指定节点，仅支持TO ALL。 该功能仅在force模式下，可以清理正在使用的正常连接。
  status: confirmed
  source_anchor: M-Compatibility L7-7
- id: m_clean_connection_fact_params
  type: example
  statement: ●    CHECK 仅在节点列表为TO ALL时可以指定。如果指定该参数，会在清理连接之前检查数 据库是否被其他会话连接访问。此参数主要用于DROP DATABASE之前的连接访
  status: confirmed
  source_anchor: M-Compatibility L18-19
- id: m_clean_connection_fact_example
  type: example
  statement: m_clean_connection的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L35-35
