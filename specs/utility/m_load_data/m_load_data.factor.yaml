facts:
- id: m_load_data_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.13.1 L2-2
- id: m_load_data_fact_syntax
  type: example
  statement: LOAD DATA INFILE指定文件，INTO TABLE指定真实目标表；支持冲突模式和字段子句。
  status: confirmed
  source_anchor: 2.4.2.13.1 L36-47
- id: m_load_data_fact_columns
  type: example
  statement: 可指定输入列列表，SET指定表达式或DEFAULT。
  status: confirmed
  source_anchor: 2.4.2.13.1 L54-55
- id: m_load_data_fact_all_columns
  type: example
  statement: 输入列列表可省略；未声明字段列表时使用所有字段。有限空表两列输入由真实TSV与列序对齐，不套用SET或跳行行为。
  status: confirmed
  source_anchor: 2.4.2.13.1 L125-127
- id: m_load_data_fact_authority
  type: environment
  statement: LOAD DATA需要INSERT/DELETE；enable_copy_server_files打开时SYSADMIN可用文件导入。
  status: confirmed
  source_anchor: 2.4.2.13.1 L8-13
- id: m_load_data_fact_path
  type: environment
  statement: 文件路径必须位于safe_data_path白名单内；本批只声明专用部署路径，不修改白名单。
  status: confirmed
  source_anchor: 2.4.2.13.1 L14-17
- id: m_load_data_fact_server
  type: environment
  statement: 未指定LOCAL从服务端导入；相对路径使用数据目录，本批只用绝对路径。
  status: confirmed
  source_anchor: 2.4.2.13.1 L61-62
- id: m_load_data_fact_local
  type: environment
  statement: LOCAL是否从客户端导入取决于enable_load_data_remote_transmission，并有单语句执行要求。
  status: confirmed
  source_anchor: 2.4.2.13.1 L63-73
- id: m_load_data_fact_tab
  type: example
  statement: 字段分隔符缺省为TAB，可用FIELDS或COLUMNS的TERMINATED BY指定。
  status: confirmed
  source_anchor: 2.4.2.13.1 L95-95
- id: m_load_data_fact_line
  type: example
  statement: LINES TERMINATED BY指定行分隔，本批SQL字面值使用真实LF，不依赖反斜杠转义开关。
  status: confirmed
  source_anchor: 2.4.2.13.1 L118-118
- id: m_load_data_fact_no_column_expr
  type: example
  statement: SET表达式不支持引用列名。
  status: confirmed
  source_anchor: 2.4.2.13.1 L137-137
- id: m_load_data_fact_assignment_type
  type: example
  statement: SET结果必须可隐式赋值给对应列；本批仅INTEGER常量与目标列DEFAULT。
  status: confirmed
  source_anchor: 2.4.2.13.1 L138-138
- id: m_load_data_fact_collision_error
  type: example
  statement: 非LOCAL且未指定REPLACE/IGNORE时，数据与既有行冲突会报错。
  status: confirmed
  source_anchor: 2.4.2.13.1 L84-85
- id: m_load_data_fact_replace_ignore
  type: example
  statement: REPLACE替换冲突行，IGNORE跳过；当前只准备真实冲突，不宣称行为已验证。
  status: confirmed
  source_anchor: 2.4.2.13.1 L76-82
- id: m_load_data_fact_format_match
  type: example
  statement: 导出/导入FIELDS、LINES、CHARACTER SET必须一致；不把COPY TO格式当作等价输入。
  status: confirmed
  source_anchor: 2.4.2.13.1 L24-26
- id: m_load_data_fact_skip
  type: example
  statement: IGNORE number LINES/ROWS跳过输入前若干行。
  status: confirmed
  source_anchor: 2.4.2.13.1 L124-124
- id: m_load_data_fact_purpose
  type: example
  statement: 从文件批量导入数据到表中，类似于MySQL的LOAD DATA语法。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_load_data_fact_constraint
  type: example
  statement: LOAD DATA语法需要具有表的INSERT和DELETE权限。 当参数enable_copy_server_files关闭时，只允许初始用户执行LOAD DATA命令；
  status: confirmed
  source_anchor: M-Compatibility L7-7
- id: m_load_data_fact_params
  type: example
  statement: ●      LOCAL –    指定导入文件的位置。 –    不指定LOCAL时，则从服务端所在环境中导入数据，若'file_name'为相对路
  status: confirmed
  source_anchor: M-Compatibility L58-60
- id: m_load_data_fact_example
  type: example
  statement: m_load_data的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L141-152
rules:
- id: m_load_data_rule_no_column_expr
  kind: requires
  expression: assignment != 'm_load_data_assignment_column'
  fact_refs:
  - m_load_data_fact_no_column_expr
  severity: error
- id: m_load_data_rule_collision_error
  kind: requires
  expression: table != 'm_load_data_table_conflict' or conflict_mode != 'm_load_data_conflict_mode_none'
  fact_refs:
  - m_load_data_fact_collision_error
  severity: error
