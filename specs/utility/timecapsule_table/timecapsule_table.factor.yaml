facts:
  -
    id: "timecapsule_table_fact_body_5"
    type: "behavior_oracle"
    statement: "在人为操作或应用程序错误时，使用TIMECAPSULE TABLE语句恢复可将表恢复到一个 早期状态。"
    status: "confirmed"
    source_anchor: "L5-L8"
  -
    id: "timecapsule_table_fact_body_5_1"
    type: "behavior_oracle"
    statement: "表可以闪回到过去的时间点，这依赖于系统中保存的旧版本数据。"
    status: "confirmed"
    source_anchor: "L5-L8"
  -
    id: "timecapsule_table_fact_body_5_2"
    type: "behavior_oracle"
    statement: "此外GaussDB数据 库不能恢复到通过DDL操作改变了表结构的早期状态。"
    status: "confirmed"
    source_anchor: "L5-L8"
  -
    id: "timecapsule_table_fact_body_11"
    type: "constraint"
    statement: "●   TIMECAPSULE TABLE语句的用法主要分为两大类：闪回旧版本数据和从回收站中 闪回。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "timecapsule_table_fact_body_13"
    type: "constraint"
    statement: "–   TO TIMESTAMP和TO CSN能够将表闪回到过去的某个版本，当前仅支持 Ustore存储引擎。"
    status: "confirmed"
    source_anchor: "L13-L14"
  -
    id: "timecapsule_table_fact_body_15"
    type: "constraint"
    statement: "–   回收站记录了DROP和TRUNCATE的对象数据。"
    status: "confirmed"
    source_anchor: "L15-L17"
  -
    id: "timecapsule_table_fact_body_15_1"
    type: "constraint"
    statement: "TO BEFORE DROP和TO BEFORE TRUNCATE就是从回收站中闪回，当前支持Ustore以及Astore存储 引擎。"
    status: "confirmed"
    source_anchor: "L15-L17"
  -
    id: "timecapsule_table_fact_body_18"
    type: "constraint"
    statement: "●   不支持闪回表的对象类型：系统表、DFS表、全局临时表、本地临时表、 UNLOGGED表、序列表、密态表。"
    status: "confirmed"
    source_anchor: "L18-L19"
  -
    id: "timecapsule_table_fact_body_20"
    type: "constraint"
    statement: "●   不支持含有自定义类型表的闪回。"
    status: "confirmed"
    source_anchor: "L20-L20"
  -
    id: "timecapsule_table_fact_body_21"
    type: "behavior_oracle"
    statement: "●   开启闪回后，回收站里的表可以进行表级备份，无法进行表级恢复。"
    status: "confirmed"
    source_anchor: "L21-L21"
  -
    id: "timecapsule_table_fact_body_22"
    type: "constraint"
    statement: "●   闪回点和当前点之间，执行过修改表结构或影响物理存储的语句（DDL、DCL、 VACUUM FULL），则闪回失败。"
    status: "confirmed"
    source_anchor: "L22-L23"
  -
    id: "timecapsule_table_fact_body_24"
    type: "environment"
    statement: "●   执行闪回删除需要用户具有如下权限：用户必须具有垃圾对象所在Schema的 CREATE和USAGE权限，并且用户必须是Schema的所有者或者是垃圾对象的所有 者。"
    status: "confirmed"
    source_anchor: "L24-L29"
  -
    id: "timecapsule_table_fact_body_24_1"
    type: "environment"
    statement: "执行闪回TRUNCATE需要用户具有如下权限：用户必须具有垃圾对象所在Schema 的CREATE和USAGE权限，并且用户必须是Schema的所有者或者是垃圾对象的所 有者，另外用户必须具有垃圾对象的TRUNCATE权限。"
    status: "confirmed"
    source_anchor: "L24-L29"
  -
    id: "timecapsule_table_fact_body_30"
    type: "constraint"
    statement: "●   不适用闪回DROP/TRUNCATE功能的场景或表："
    status: "confirmed"
    source_anchor: "L30-L30"
  -
    id: "timecapsule_table_fact_body_31"
    type: "environment"
    statement: "–   回收站关闭场景：enable_recyclebin = off。"
    status: "confirmed"
    source_anchor: "L31-L31"
  -
    id: "timecapsule_table_fact_body_32"
    type: "environment"
    statement: "–   系统处于维护态（xc_maintenance_mode = on）。"
    status: "confirmed"
    source_anchor: "L32-L32"
  -
    id: "timecapsule_table_fact_body_33"
    type: "environment"
    statement: "–   从不支持的基线版本升级到支持的版本且处于升级观察期时。"
    status: "confirmed"
    source_anchor: "L33-L33"
  -
    id: "timecapsule_table_fact_body_34"
    type: "behavior_oracle"
    statement: "–   多对象删除场景：DROP/TRUNCATE TABLE命令同时指定多个对象。"
    status: "confirmed"
    source_anchor: "L34-L34"
  -
    id: "timecapsule_table_fact_body_35"
    type: "constraint"
    statement: "–   系统表、DFS表、全局临时表、本地临时表、UNLOGGED表、序列表、 hashbucket表、密态表。"
    status: "confirmed"
    source_anchor: "L35-L36"
  -
    id: "timecapsule_table_fact_body_37"
    type: "constraint"
    statement: "–   回收站对象被清理后无法闪回DROP/TRUNCATE，recyclebin_retention_time 参数用于设置回收站对象保留时间。"
    status: "confirmed"
    source_anchor: "L37-L38"
  -
    id: "timecapsule_table_fact_body_39"
    type: "behavior_oracle"
    statement: "–   回收站对象禁止DML、DCL、DDL等写操作，不支持DQL查询操作。"
    status: "confirmed"
    source_anchor: "L39-L39"
  -
    id: "timecapsule_table_fact_body_40"
    type: "behavior_oracle"
    statement: "–   truncate表和闪回truncate操作之间，执行过修改表结构或影响物理文件的语 句（DDL、DCL、VACUUM FULL、增加/删除/切割/合成等分区操作），闪 回失败。"
    status: "confirmed"
    source_anchor: "L40-L42"
  -
    id: "timecapsule_table_fact_body_43"
    type: "behavior_oracle"
    statement: "–   整表删除或截断时，分区会随着整表放入回收站，单个删除的分区不支持放 入回收站，避免破坏数据一致性。"
    status: "confirmed"
    source_anchor: "L43-L44"
  -
    id: "timecapsule_table_fact_body_45"
    type: "behavior_oracle"
    statement: "–   如果表依赖的对象为外部对象（如表列为复合类型、自定义类型等），则采 用物理删除，不将表放入回收站。"
    status: "confirmed"
    source_anchor: "L45-L46"
  -
    id: "timecapsule_table_fact_body_48"
    type: "behavior_oracle"
    statement: "●    DROP闪回约束 可以指定原始用户指定的表的名称，或对象删除时数据库分配的系统生成名称。"
    status: "confirmed"
    source_anchor: "L48-L49"
  -
    id: "timecapsule_table_fact_body_50"
    type: "constraint"
    statement: "–    回收站中系统生成的对象名称是唯一的。"
    status: "confirmed"
    source_anchor: "L50-L52"
  -
    id: "timecapsule_table_fact_body_50_1"
    type: "constraint"
    statement: "因此，如果指定系统生成名称，那 么数据库检索指定的对象。"
    status: "confirmed"
    source_anchor: "L50-L52"
  -
    id: "timecapsule_table_fact_body_50_2"
    type: "constraint"
    statement: "使用“SELECT * FROM gs_recyclebin;”语句查看 回收站中的内容。"
    status: "confirmed"
    source_anchor: "L50-L52"
  -
    id: "timecapsule_table_fact_body_53"
    type: "constraint"
    statement: "–    如果指定了用户指定的名称，且回收站中包含多个该名称的对象，那么数据 库检索回收站中最近移动的对象。"
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "timecapsule_table_fact_body_53_1"
    type: "constraint"
    statement: "如果需要检索更早版本的表，请按以下步 骤执行："
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "timecapsule_table_fact_body_57"
    type: "constraint"
    statement: "▪    指定需要检索的表的系统生成名称。"
    status: "confirmed"
    source_anchor: "L57-L57"
  -
    id: "timecapsule_table_fact_body_59"
    type: "constraint"
    statement: "▪    执行TIMECAPSULE TABLE ... TO BEFORE DROP语句，直到找到要检索 的表。"
    status: "confirmed"
    source_anchor: "L59-L60"
  -
    id: "timecapsule_table_fact_body_61"
    type: "behavior_oracle"
    statement: "–    恢复DROP表时，只恢复基表名，其他子对象名均保持回收站对象名。"
    status: "confirmed"
    source_anchor: "L61-L62"
  -
    id: "timecapsule_table_fact_body_61_1"
    type: "behavior_oracle"
    statement: "用户可 根据需要，执行DDL命令手工调整子对象名。"
    status: "confirmed"
    source_anchor: "L61-L62"
  -
    id: "timecapsule_table_fact_body_63"
    type: "behavior_oracle"
    statement: "–    如果表存在缺省值引用序列和自定义函数，那么闪回DROP表成功但不会恢复 缺省值。"
    status: "confirmed"
    source_anchor: "L63-L64"
  -
    id: "timecapsule_table_fact_body_65"
    type: "behavior_oracle"
    statement: "–    如果表存在视图引用，DROP表时需要级联删除视图，那么闪回DROP表成功 但不会恢复视图。"
    status: "confirmed"
    source_anchor: "L65-L66"
  -
    id: "timecapsule_table_fact_body_67"
    type: "behavior_oracle"
    statement: "–    回收站对象不支持DML、DCL、DDL等写操作，不支持DQL查询操作（后续 支持）。"
    status: "confirmed"
    source_anchor: "L67-L68"
  -
    id: "timecapsule_table_fact_body_69"
    type: "behavior_oracle"
    statement: "–    recyclebin_retention_time配置参数用于设置回收站对象保留时间，超过该时 间的回收站对象将被自动清理。"
    status: "confirmed"
    source_anchor: "L69-L70"
  -
    id: "timecapsule_table_fact_body_71"
    type: "constraint"
    statement: "●    TRUNCATE闪回约束"
    status: "confirmed"
    source_anchor: "L71-L71"
  -
    id: "timecapsule_table_fact_body_72"
    type: "constraint"
    statement: "–    TRUNCATE闪回后，统计信息无变化，仍显示为0，可以在业务低峰期（降低 性能影响）时候手动ANALYZE来修正统计信息。"
    status: "confirmed"
    source_anchor: "L72-L73"
  -
    id: "timecapsule_table_fact_body_74"
    type: "constraint"
    statement: "–    RENAME TO仅支持DROP闪回操作为检索表指定新名称，不支持TRUNCATE 闪回。"
    status: "confirmed"
    source_anchor: "L74-L75"
  -
    id: "timecapsule_table_fact_body_76"
    type: "behavior_oracle"
    statement: "–    TRUNCATE闪回不能跨越影响表结构或物理存储的语句，否则会报错。"
    status: "confirmed"
    source_anchor: "L76-L81"
  -
    id: "timecapsule_table_fact_body_76_1"
    type: "behavior_oracle"
    statement: "即闪 回点和当前点之间，如果执行过修改表结构或影响物理存储的语句（DDL、 DCL、VACUUM FULL、增加/删除/切割/合成等分区操作），则闪回失败。"
    status: "confirmed"
    source_anchor: "L76-L81"
  -
    id: "timecapsule_table_fact_body_76_2"
    type: "behavior_oracle"
    statement: "执行过DDL的表进行闪回操作报错：“ERROR：The table definition of %s has been modified.”。"
    status: "confirmed"
    source_anchor: "L76-L81"
  -
    id: "timecapsule_table_fact_body_76_3"
    type: "behavior_oracle"
    statement: "涉及namespace、表名改变等操作的DDL执行闪回操 作报错：“ERROR: recycle object %s desired does not exist.”。"
    status: "confirmed"
    source_anchor: "L76-L81"
  -
    id: "timecapsule_table_fact_body_82"
    type: "behavior_oracle"
    statement: "●    vacuum更新库级frozenXid时会参考回收站中rcyfrozenxid64的值，若回收站中存 在长时间未清理的表，可能会导致frozenXid无法推进，影响clog的回收（clog文 件占存储空间较小，实际场景影响较小），可通过清理回收站中不再需要闪回的 表来推进frozenXid。"
    status: "confirmed"
    source_anchor: "L82-L85"
  -
    id: "timecapsule_table_fact_body_86"
    type: "environment"
    statement: "●    从503.0之前的版本升级到最新版本时，若升级前已开启回收站，需确保回收站中 不存在分区表对象后再进行升级操作，否则升级将失败。"
    status: "confirmed"
    source_anchor: "L86-L87"
  -
    id: "timecapsule_table_fact_body_88"
    type: "environment"
    statement: "●    从503.0之前的版本升级到最新版本时，对于分区表，无论是在升级未提交状态还 是升级已提交状态，执行闪回表或闪回查询操作均会报错，提示表结构发生变 更。"
    status: "confirmed"
    source_anchor: "L88-L90"
  -
    id: "timecapsule_table_fact_grammar_line_93"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：TIMECAPSULE TABLE"
    status: "confirmed"
    source_anchor: "L93-L93"
  -
    id: "timecapsule_table_fact_grammar_line_94"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：[schema.]table_name TO { CSN expr | TIMESTAMP expr | BEFORE { DROP [RENAME TO table_name] |"
    status: "confirmed"
    source_anchor: "L94-L94"
  -
    id: "timecapsule_table_fact_grammar_line_95"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：TRUNCATE } };"
    status: "confirmed"
    source_anchor: "L95-L95"
  -
    id: "timecapsule_table_fact_body_98"
    type: "behavior_oracle"
    statement: "●   schema 指定模式包含的表。"
    status: "confirmed"
    source_anchor: "L98-L99"
  -
    id: "timecapsule_table_fact_body_98_1"
    type: "behavior_oracle"
    statement: "如果缺省，则为当前模式。"
    status: "confirmed"
    source_anchor: "L98-L99"
  -
    id: "timecapsule_table_fact_body_100"
    type: "constraint"
    statement: "●   table_name 指定表名。"
    status: "confirmed"
    source_anchor: "L100-L101"
  -
    id: "timecapsule_table_fact_body_102"
    type: "behavior_oracle"
    statement: "●   TO CSN 指定要返回表的时间点对应的事务提交序列号（CSN）。"
    status: "confirmed"
    source_anchor: "L102-L104"
  -
    id: "timecapsule_table_fact_body_102_1"
    type: "behavior_oracle"
    statement: "expr必须计算一个数 字，代表有效的CSN。"
    status: "confirmed"
    source_anchor: "L102-L104"
  -
    id: "timecapsule_table_fact_body_105"
    type: "behavior_oracle"
    statement: "●   TO TIMESTAMP 指定要返回表的时间点对应的时间戳。"
    status: "confirmed"
    source_anchor: "L105-L110"
  -
    id: "timecapsule_table_fact_body_105_1"
    type: "behavior_oracle"
    statement: "expr必须计算一个过去有效的时间戳（使 用TO_TIMESTAMP函数将字符串转换为时间类型）。"
    status: "confirmed"
    source_anchor: "L105-L110"
  -
    id: "timecapsule_table_fact_body_105_2"
    type: "behavior_oracle"
    statement: "表将被闪回到指定时间戳大 约3秒内的时间点。"
    status: "confirmed"
    source_anchor: "L105-L110"
  -
    id: "timecapsule_table_fact_body_105_3"
    type: "behavior_oracle"
    statement: "说明：闪回点过旧时，因旧版本被回收导致无法获取旧版本，会导致闪回失败并 报错：Restore point too old。"
    status: "confirmed"
    source_anchor: "L105-L110"
  -
    id: "timecapsule_table_fact_body_111"
    type: "behavior_oracle"
    statement: "●   TO BEFORE DROP 使用这个子句检索回收站中已删除的表及其子对象。"
    status: "confirmed"
    source_anchor: "L111-L112"
  -
    id: "timecapsule_table_fact_body_113"
    type: "constraint"
    statement: "●   RENAME TO 为从回收站中检索的表指定一个新名称。"
    status: "confirmed"
    source_anchor: "L113-L114"
  -
    id: "timecapsule_table_fact_body_115"
    type: "constraint"
    statement: "●   TO BEFORE TRUNCATE 闪回到TRUNCATE之前。"
    status: "confirmed"
    source_anchor: "L115-L116"
  -
    id: "timecapsule_table_fact_example_119"
    type: "example"
    statement: "示例原文片段：●   闪回到某个时间点 需要设置undo_retention_time参数，用于设置旧版本undo的保留时间。 参数使用请联系管理员。 --建表并插入数据。 gaussdb=# CREATE TABLE tbl_test(c1 int, c2 int); gaussdb=# INSERT INTO tbl_test VALUES (1,1),(2,2),(3,3);"
    status: "confirmed"
    source_anchor: "L119-L124"
  -
    id: "timecapsule_table_fact_example_126"
    type: "example"
    statement: "示例原文片段：--查询当前时间和全局所有节点上的next_csn。 gaussdb=# SELECT now(); now ------------------------------- 2023-11-27 17:06:34.840698+08 (1 row)"
    status: "confirmed"
    source_anchor: "L126-L131"
  -
    id: "timecapsule_table_fact_example_133"
    type: "example"
    statement: "示例原文片段：gaussdb=# SELECT int8in(xidout(next_csn)) FROM gs_get_next_xid_csn(); int8in -------- 25391 (6 row)"
    status: "confirmed"
    source_anchor: "L133-L137"
  -
    id: "timecapsule_table_fact_example_139"
    type: "example"
    statement: "示例原文片段：--修改数据。 gaussdb=# UPDATE tbl_test SET c1=111, c2=222 WHERE c1=1;"
    status: "confirmed"
    source_anchor: "L139-L140"
  -
    id: "timecapsule_table_fact_example_142"
    type: "example"
    statement: "示例原文片段：--查询数据。 gaussdb=# SELECT * FROM tbl_test; c1 | c2 -----+----- 111 | 222 2| 2 3| 3 (3 rows) --将数据闪回至修改之前，需要按照实际情况替换时间 gaussdb=# TIMECAPSULE table tbl_test TO TIMESTAMP to_timestamp('2023-11-27"
    status: "confirmed"
