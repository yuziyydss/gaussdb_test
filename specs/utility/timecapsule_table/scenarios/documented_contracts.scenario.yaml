steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "在人为操作或应用程序错误时，使用TIMECAPSULE TABLE语句恢复可将表恢复到一个 早期状态。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "表可以闪回到过去的时间点，这依赖于系统中保存的旧版本数据。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "此外GaussDB数据 库不能恢复到通过DDL操作改变了表结构的早期状态。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "●   TIMECAPSULE TABLE语句的用法主要分为两大类：闪回旧版本数据和从回收站中 闪回。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "–   TO TIMESTAMP和TO CSN能够将表闪回到过去的某个版本，当前仅支持 Ustore存储引擎。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "–   回收站记录了DROP和TRUNCATE的对象数据。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "TO BEFORE DROP和TO BEFORE TRUNCATE就是从回收站中闪回，当前支持Ustore以及Astore存储 引擎。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "●   不支持闪回表的对象类型：系统表、DFS表、全局临时表、本地临时表、 UNLOGGED表、序列表、密态表。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "●   不支持含有自定义类型表的闪回。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "●   开启闪回后，回收站里的表可以进行表级备份，无法进行表级恢复。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "●   闪回点和当前点之间，执行过修改表结构或影响物理存储的语句（DDL、DCL、 VACUUM FULL），则闪回失败。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "●   执行闪回删除需要用户具有如下权限：用户必须具有垃圾对象所在Schema的 CREATE和USAGE权限，并且用户必须是Schema的所有者或者是垃圾对象的所有 者。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "执行闪回TRUNCATE需要用户具有如下权限：用户必须具有垃圾对象所在Schema 的CREATE和USAGE权限，并且用户必须是Schema的所有者或者是垃圾对象的所 有者，另外用户必须具有垃圾对象的TRUNCATE权限。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "●   不适用闪回DROP/TRUNCATE功能的场景或表："
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "–   回收站关闭场景：enable_recyclebin = off。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "–   系统处于维护态（xc_maintenance_mode = on）。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "–   从不支持的基线版本升级到支持的版本且处于升级观察期时。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "–   多对象删除场景：DROP/TRUNCATE TABLE命令同时指定多个对象。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "–   系统表、DFS表、全局临时表、本地临时表、UNLOGGED表、序列表、 hashbucket表、密态表。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "–   回收站对象被清理后无法闪回DROP/TRUNCATE，recyclebin_retention_time 参数用于设置回收站对象保留时间。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "–   回收站对象禁止DML、DCL、DDL等写操作，不支持DQL查询操作。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "–   truncate表和闪回truncate操作之间，执行过修改表结构或影响物理文件的语 句（DDL、DCL、VACUUM FULL、增加/删除/切割/合成等分区操作），闪 回失败。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "–   整表删除或截断时，分区会随着整表放入回收站，单个删除的分区不支持放 入回收站，避免破坏数据一致性。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "–   如果表依赖的对象为外部对象（如表列为复合类型、自定义类型等），则采 用物理删除，不将表放入回收站。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "●    DROP闪回约束 可以指定原始用户指定的表的名称，或对象删除时数据库分配的系统生成名称。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "–    回收站中系统生成的对象名称是唯一的。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "因此，如果指定系统生成名称，那 么数据库检索指定的对象。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "使用“SELECT * FROM gs_recyclebin;”语句查看 回收站中的内容。"
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "–    如果指定了用户指定的名称，且回收站中包含多个该名称的对象，那么数据 库检索回收站中最近移动的对象。"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "如果需要检索更早版本的表，请按以下步 骤执行："
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "▪    指定需要检索的表的系统生成名称。"
  -
    id: "contract_31"
    action: "verify_documented_contract"
    note: "▪    执行TIMECAPSULE TABLE ... TO BEFORE DROP语句，直到找到要检索 的表。"
  -
    id: "contract_32"
    action: "verify_documented_contract"
    note: "–    恢复DROP表时，只恢复基表名，其他子对象名均保持回收站对象名。"
  -
    id: "contract_33"
    action: "verify_documented_contract"
    note: "用户可 根据需要，执行DDL命令手工调整子对象名。"
  -
    id: "contract_34"
    action: "verify_documented_contract"
    note: "–    如果表存在缺省值引用序列和自定义函数，那么闪回DROP表成功但不会恢复 缺省值。"
  -
    id: "contract_35"
    action: "verify_documented_contract"
    note: "–    如果表存在视图引用，DROP表时需要级联删除视图，那么闪回DROP表成功 但不会恢复视图。"
  -
    id: "contract_36"
    action: "verify_documented_contract"
    note: "–    回收站对象不支持DML、DCL、DDL等写操作，不支持DQL查询操作（后续 支持）。"
  -
    id: "contract_37"
    action: "verify_documented_contract"
    note: "–    recyclebin_retention_time配置参数用于设置回收站对象保留时间，超过该时 间的回收站对象将被自动清理。"
  -
    id: "contract_38"
    action: "verify_documented_contract"
    note: "●    TRUNCATE闪回约束"
  -
    id: "contract_39"
    action: "verify_documented_contract"
    note: "–    TRUNCATE闪回后，统计信息无变化，仍显示为0，可以在业务低峰期（降低 性能影响）时候手动ANALYZE来修正统计信息。"
  -
    id: "contract_40"
    action: "verify_documented_contract"
    note: "–    RENAME TO仅支持DROP闪回操作为检索表指定新名称，不支持TRUNCATE 闪回。"
  -
    id: "contract_41"
    action: "verify_documented_contract"
    note: "–    TRUNCATE闪回不能跨越影响表结构或物理存储的语句，否则会报错。"
  -
    id: "contract_42"
    action: "verify_documented_contract"
    note: "即闪 回点和当前点之间，如果执行过修改表结构或影响物理存储的语句（DDL、 DCL、VACUUM FULL、增加/删除/切割/合成等分区操作），则闪回失败。"
  -
    id: "contract_43"
    action: "verify_documented_contract"
    note: "执行过DDL的表进行闪回操作报错：“ERROR：The table definition of %s has been modified.”。"
  -
    id: "contract_44"
    action: "verify_documented_contract"
    note: "涉及namespace、表名改变等操作的DDL执行闪回操 作报错：“ERROR: recycle object %s desired does not exist.”。"
  -
    id: "contract_45"
    action: "verify_documented_contract"
    note: "●    vacuum更新库级frozenXid时会参考回收站中rcyfrozenxid64的值，若回收站中存 在长时间未清理的表，可能会导致frozenXid无法推进，影响clog的回收（clog文 件占存储空间较小，实际场景影响较小），可通过清理回收站中不再需要闪回的 表来推进frozenXid。"
  -
    id: "contract_46"
    action: "verify_documented_contract"
    note: "●    从503.0之前的版本升级到最新版本时，若升级前已开启回收站，需确保回收站中 不存在分区表对象后再进行升级操作，否则升级将失败。"
  -
    id: "contract_47"
    action: "verify_documented_contract"
    note: "●    从503.0之前的版本升级到最新版本时，对于分区表，无论是在升级未提交状态还 是升级已提交状态，执行闪回表或闪回查询操作均会报错，提示表结构发生变 更。"
  -
    id: "contract_48"
    action: "verify_documented_contract"
    note: "●   schema 指定模式包含的表。"
  -
    id: "contract_49"
    action: "verify_documented_contract"
    note: "如果缺省，则为当前模式。"
  -
    id: "contract_50"
    action: "verify_documented_contract"
    note: "●   table_name 指定表名。"
  -
    id: "contract_51"
    action: "verify_documented_contract"
    note: "●   TO CSN 指定要返回表的时间点对应的事务提交序列号（CSN）。"
  -
    id: "contract_52"
    action: "verify_documented_contract"
    note: "expr必须计算一个数 字，代表有效的CSN。"
  -
    id: "contract_53"
    action: "verify_documented_contract"
    note: "●   TO TIMESTAMP 指定要返回表的时间点对应的时间戳。"
  -
    id: "contract_54"
    action: "verify_documented_contract"
    note: "expr必须计算一个过去有效的时间戳（使 用TO_TIMESTAMP函数将字符串转换为时间类型）。"
  -
    id: "contract_55"
    action: "verify_documented_contract"
    note: "表将被闪回到指定时间戳大 约3秒内的时间点。"
  -
    id: "contract_56"
    action: "verify_documented_contract"
    note: "说明：闪回点过旧时，因旧版本被回收导致无法获取旧版本，会导致闪回失败并 报错：Restore point too old。"
  -
    id: "contract_57"
    action: "verify_documented_contract"
    note: "●   TO BEFORE DROP 使用这个子句检索回收站中已删除的表及其子对象。"
  -
    id: "contract_58"
    action: "verify_documented_contract"
    note: "●   RENAME TO 为从回收站中检索的表指定一个新名称。"
  -
    id: "contract_59"
    action: "verify_documented_contract"
    note: "●   TO BEFORE TRUNCATE 闪回到TRUNCATE之前。"
  -
    id: "verify_timecapsule_table_fact_atomic_18_0"
    action: "verify_documented_contract"
    note: "系统表不适用本段所述闪回功能。"
  -
