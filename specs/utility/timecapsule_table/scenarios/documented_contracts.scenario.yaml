oracles:
  -
    kind: "documented_behavior"
    expected: "在人为操作或应用程序错误时，使用TIMECAPSULE TABLE语句恢复可将表恢复到一个 早期状态。"
  -
    kind: "documented_behavior"
    expected: "表可以闪回到过去的时间点，这依赖于系统中保存的旧版本数据。"
  -
    kind: "documented_behavior"
    expected: "此外GaussDB数据 库不能恢复到通过DDL操作改变了表结构的早期状态。"
  -
    kind: "documented_behavior"
    expected: "●   开启闪回后，回收站里的表可以进行表级备份，无法进行表级恢复。"
  -
    kind: "documented_behavior"
    expected: "–   多对象删除场景：DROP/TRUNCATE TABLE命令同时指定多个对象。"
  -
    kind: "documented_behavior"
    expected: "–   回收站对象禁止DML、DCL、DDL等写操作，不支持DQL查询操作。"
  -
    kind: "documented_behavior"
    expected: "–   truncate表和闪回truncate操作之间，执行过修改表结构或影响物理文件的语 句（DDL、DCL、VACUUM FULL、增加/删除/切割/合成等分区操作），闪 回失败。"
  -
    kind: "documented_behavior"
    expected: "–   整表删除或截断时，分区会随着整表放入回收站，单个删除的分区不支持放 入回收站，避免破坏数据一致性。"
  -
    kind: "documented_behavior"
    expected: "–   如果表依赖的对象为外部对象（如表列为复合类型、自定义类型等），则采 用物理删除，不将表放入回收站。"
  -
    kind: "documented_behavior"
    expected: "●    DROP闪回约束 可以指定原始用户指定的表的名称，或对象删除时数据库分配的系统生成名称。"
  -
    kind: "documented_behavior"
    expected: "–    恢复DROP表时，只恢复基表名，其他子对象名均保持回收站对象名。"
  -
    kind: "documented_behavior"
    expected: "用户可 根据需要，执行DDL命令手工调整子对象名。"
  -
    kind: "documented_behavior"
    expected: "–    如果表存在缺省值引用序列和自定义函数，那么闪回DROP表成功但不会恢复 缺省值。"
  -
    kind: "documented_behavior"
    expected: "–    如果表存在视图引用，DROP表时需要级联删除视图，那么闪回DROP表成功 但不会恢复视图。"
  -
    kind: "documented_behavior"
    expected: "–    回收站对象不支持DML、DCL、DDL等写操作，不支持DQL查询操作（后续 支持）。"
  -
    kind: "documented_behavior"
    expected: "–    recyclebin_retention_time配置参数用于设置回收站对象保留时间，超过该时 间的回收站对象将被自动清理。"
  -
    kind: "documented_behavior"
    expected: "–    TRUNCATE闪回不能跨越影响表结构或物理存储的语句，否则会报错。"
  -
    kind: "documented_behavior"
    expected: "即闪 回点和当前点之间，如果执行过修改表结构或影响物理存储的语句（DDL、 DCL、VACUUM FULL、增加/删除/切割/合成等分区操作），则闪回失败。"
  -
    kind: "documented_behavior"
    expected: "执行过DDL的表进行闪回操作报错：“ERROR：The table definition of %s has been modified.”。"
  -
    kind: "documented_behavior"
    expected: "涉及namespace、表名改变等操作的DDL执行闪回操 作报错：“ERROR: recycle object %s desired does not exist.”。"
  -
    kind: "documented_behavior"
    expected: "●    vacuum更新库级frozenXid时会参考回收站中rcyfrozenxid64的值，若回收站中存 在长时间未清理的表，可能会导致frozenXid无法推进，影响clog的回收（clog文 件占存储空间较小，实际场景影响较小），可通过清理回收站中不再需要闪回的 表来推进frozenXid。"
  -
    kind: "documented_behavior"
    expected: "●   schema 指定模式包含的表。"
  -
    kind: "documented_behavior"
    expected: "如果缺省，则为当前模式。"
  -
    kind: "documented_behavior"
    expected: "●   TO CSN 指定要返回表的时间点对应的事务提交序列号（CSN）。"
  -
    kind: "documented_behavior"
    expected: "expr必须计算一个数 字，代表有效的CSN。"
  -
    kind: "documented_behavior"
    expected: "●   TO TIMESTAMP 指定要返回表的时间点对应的时间戳。"
  -
    kind: "documented_behavior"
    expected: "expr必须计算一个过去有效的时间戳（使 用TO_TIMESTAMP函数将字符串转换为时间类型）。"
  -
    kind: "documented_behavior"
    expected: "表将被闪回到指定时间戳大 约3秒内的时间点。"
  -
    kind: "documented_behavior"
    expected: "说明：闪回点过旧时，因旧版本被回收导致无法获取旧版本，会导致闪回失败并 报错：Restore point too old。"
  -
    kind: "documented_behavior"
    expected: "●   TO BEFORE DROP 使用这个子句检索回收站中已删除的表及其子对象。"
