facts:
- id: m_table_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.17.1 L2-2
- id: m_table_fact_syntax
  type: syntax
  statement: "原文语法片段（仅此来源区间，不等同完整生成能力）：[ WITH [ RECURSIVE ] with_query [, ...] ] TABLE table_name [ORDER BY {col_name | expression | position} [ASC | DESC][ NULLS { FIRST | LAST } ], ...] [[LIMIT {[offset,] row_count | row_count OFFSET offset}] | FETCH {FIRST | NEXT} [(expr)] {ROW| ROWS} ONLY] [into_option] [ FOR READ ONLY | [ {FOR { UPDATE | SHARE } [ OF table_name [, ...] ] [ NOWAIT | WAIT N | SKIP LOCKED ]} [...] ] | LOCK IN SHARE MODE]  TABLE ... UNION以及TABLE ... EXCEPT语法： TABLE ... UNION [ALL | DISTINCT] TABLE ... [UNION [ALL | DISTINCT] TABLE ...] TABLE ... EXCEPT[ALL | DISTINCT] TABLE ..."
  status: confirmed
  source_anchor: 2.4.2.17.1 L22-38
- id: m_table_fact_pagination
  type: behavior_oracle
  statement: TABLE 等价 SELECT *；本批 ORDER/LIMIT 使用整数列与种子行。
  status: confirmed
  source_anchor: 2.4.2.17.1 L7-7
- id: m_table_fact_set_contract
  type: constraint
  statement: 集合运算左右列数相同、类型兼容；本批仅同一已知两整数列表自集合。
  status: confirmed
  source_anchor: 2.4.2.17.1 L172-173
- id: m_table_fact_scalar_scope
  type: environment
  statement: M模式不支持子查询结果包含多列；当前模型不生成多列子查询，不把该限制泛化到所有上下文。
  status: confirmed
  source_anchor: 2.4.2.17.1 L149-150
- id: m_table_fact_purpose
  type: example
  statement: 从表或视图中查询数据，TABLE语法主要为简化SELECT从表或视图中查询数据的操 作。 TABLE table_name与SELECT * FROM table_name实现功能一致。
  status: confirmed
  source_anchor: M-Compatibility L4-6
- id: m_table_fact_constraint
  type: example
  statement: 仅表或视图的所有者、拥有表或视图SELECT权限的用户或拥有SELECT ANY 执行TABLE命令，当前用户必须拥有TABLE中使用字段的SELECT权限
  status: confirmed
  source_anchor: M-Compatibility L9-13
- id: m_table_fact_params
  type: example
  statement: ●    table_name 表名或视图名，可以使用模式进行具体指定，如：schema_name.table_name。 须知
  status: confirmed
  source_anchor: M-Compatibility L68-70
- id: m_table_fact_example
  type: example
  statement: m_table的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L81-92
