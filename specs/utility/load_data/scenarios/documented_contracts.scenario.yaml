preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "将文件中的数据导入到数据库指定表中。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "●   LOAD DATA语法仅在B兼容模式（sql_compatibility = 'B'）以及M-Compatibility 模式数据库（sql_compatibility = 'M'）下支持。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "●   LOAD DATA语法仅在开启b_format_version='5.7'和b_format_dev_version='s2'参 数后与B数据库功能一致。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "●   LOAD DATA语法权限相关GUC参数与COPY FROM语法注意事项一致。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "●   LOAD DATA语法需要表的INSERT和DELETE权限。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "●   执行LOAD DATA语法写入表中的数据若无法转换为表中数据类型格式时将导致导 入失败。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "●   LOAD DATA只能用于表，不能用于视图。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "●   LOAD DATA与SELECT … INTO OUTFILE可配合使用，实现数据的导出与导入： 先通过SELECT … INTO OUTFILE将表数据导出至文件，再通过LOAD DATA将文 件数据导入回表中。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "配合使用时需注意以下事项："
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "–   语句子句必须匹配：LOAD DATA与SELECT … INTO OUTFILE中的FIELDS子 句、LINES子句及CHARACTER SET子句应保持一致，否则可能导致文件内容 无法被正确加载。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "–     避免使用空字符串作为特殊字符：不建议将转义符、列分隔符、行分隔符设 置为空字符串。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "若数据表中包含这类特殊字符，使用空字符串可能导致这些 字符在导回时无法被正确处理。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "–     避免特殊字符重复：转义符、列分隔符、引号字符和行分隔符不宜设置为相 同字符，否则可能造成部分功能失效，影响数据的准确导入。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "●    LOCAL 指定导入文件的位置。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "–     不指定LOCAL时，若'file_name'为相对路径，则默认导入路径为数据目录。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "–     若指定LOCAL参数则需要指定'file_name'为绝对路径，当指定为相对路径时 默认导入路径为数据库二进制所在路径，即$GAUSSHOME/bin/。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "●    REPLACE | IGNORE 控制导入文件数据冲突及错误处理的行为选项。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "–     指定REPLACE选项 当导入数据与表中原有数据冲突时，替换冲突行数据；"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "当文件中字段数小于 指定表的字段数时，宽松模式下告警，严格模式下报错。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "–     指定IGNORE选项 当导入数据与表中原有数据冲突时，跳过冲突行数据；"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "当文件中字段数小于 指定表的字段数时，按默认值填充表中未指定的字段，并产生告警。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "–     不指定REPLACE与IGNORE选项"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "▪     不指定LOCAL选项时，当导入数据与表中原有数据冲突时报错；"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "当文件 中字段数小于指定表的字段数时，宽松模式下告警，严格模式下报错。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "▪    指定LOCAL选项时，行为与指定IGNORE选项一致。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "●   PARTITION 当导入表为分区表时，此参数用来指定分区。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "若数据与指定分区范围不一致则报 错。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "●   CHARACTER SET 指定数据文件的编码格式名称，缺省为当前客户端编码格式。"
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "●   FIELDS | COLUMNS"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "–   TERMINATED BY 指定两列之间分隔符，缺省为'\\t'。"
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "指定换行符不能与分隔符相同。"
  -
    id: "contract_31"
    action: "verify_documented_contract"
    note: "–   [OPTIONALLY] ENCLOSED BY 指定引号字符，缺省为''。"
  -
    id: "contract_32"
    action: "verify_documented_contract"
    note: "OPTIONALLY参数为可选参数，无实际作用。"
  -
    id: "contract_33"
    action: "verify_documented_contract"
    note: "引号符仅支持单字符，不支持字符串。"
  -
    id: "contract_34"
    action: "verify_documented_contract"
    note: "–   ESCAPED BY 指定转义符，缺省为'\\'。"
  -
    id: "contract_35"
    action: "verify_documented_contract"
    note: "● 转义字符仅支持单字符，不支持字符串。"
  -
    id: "contract_36"
    action: "verify_documented_contract"
    note: "● 如果转义符非空，当处理到转义符时，会判断转义符及其后的字符序列是否满足 指定的转义序列。"
  -
    id: "contract_37"
    action: "verify_documented_contract"
    note: "如果满足指定的转义序列，则将转义符及其后的字符转义成指 定字符。"
  -
    id: "contract_38"
    action: "verify_documented_contract"
    note: "如果不满足指定的转义序列，则会忽略该转义符并继续导入数据。"
  -
    id: "contract_39"
    action: "verify_documented_contract"
    note: "支持 的转义序列受GUC参数load_data_behavior_compat_options是否配置 new_escape_string选项控制。"
  -
    id: "contract_40"
    action: "verify_documented_contract"
    note: "●   LINES"
  -
    id: "contract_41"
    action: "verify_documented_contract"
    note: "–   STARTING BY 指定导入数据文件起始字段样式。"
  -
    id: "contract_42"
    action: "verify_documented_contract"
    note: "–   TERMINATED BY 指定导入数据文件换行符样式。"
  -
    id: "contract_43"
    action: "verify_documented_contract"
    note: "GUC参数load_data_behavior_compat_options的配置选项new_escape_string，控 制是否对指定的行终结符做转义处理。"
  -
    id: "contract_44"
    action: "verify_documented_contract"
    note: "●   IGNORE 指定数据导入时，跳过数据文件的前 number行。"
  -
    id: "contract_45"
    action: "verify_documented_contract"
    note: "●   col_name_or_user_var 可选的待复制字段列表。"
  -
    id: "contract_46"
    action: "verify_documented_contract"
    note: "取值范围：如果没有声明字段列表，将使用所有字段。"
  -
    id: "contract_47"
    action: "verify_documented_contract"
    note: "● 指定列参数不支持重复指定列。"
  -
    id: "contract_48"
    action: "verify_documented_contract"
    note: "● LOAD DATA语法指定列时，col_name_or_user_var支持指定为表中存在列或用户变 量。"
  -
    id: "contract_49"
    action: "verify_documented_contract"
    note: "若指定为用户变量，需设置GUC参数b_format_behavior_compat_options值包含 enable_set_variables（set b_format_behavior_compat_options = 'enable_set_variables'）。"
  -
    id: "contract_50"
    action: "verify_documented_contract"
    note: "●    SET 指定列值，可以指定为表达式或DEFAULT。"
  -
    id: "contract_51"
    action: "verify_documented_contract"
    note: "● 表达式中不支持列名。"
  -
    id: "contract_52"
    action: "verify_documented_contract"
    note: "● 若表达式结果类型与被赋值列对应类型之间不存在隐式转换函数则报错。"
  -
    id: "upstream_contract_0"
    action: "verify_documented_contract"
    note: "使用已导出的跨章事实 copy::copy_fact_body_21；来源变化须使本包验证快照过期，尚未执行数据库验证。"
  -
    id: "upstream_contract_1"
    action: "verify_documented_contract"
    note: "使用已导出的跨章事实 copy::copy_fact_body_22；来源变化须使本包验证快照过期，尚未执行数据库验证。"
