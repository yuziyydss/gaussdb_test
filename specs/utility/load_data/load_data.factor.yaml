  -
    id: "load_data_fact_body_55"
    type: "constraint"
    statement: "●    LOCAL 指定导入文件的位置。"
    status: "confirmed"
    source_anchor: "L55-L56"
  -
    id: "load_data_fact_body_57"
    type: "behavior_oracle"
    statement: "–     不指定LOCAL时，若'file_name'为相对路径，则默认导入路径为数据目录。"
    status: "confirmed"
    source_anchor: "L57-L57"
  -
    id: "load_data_fact_body_58"
    type: "behavior_oracle"
    statement: "–     若指定LOCAL参数则需要指定'file_name'为绝对路径，当指定为相对路径时 默认导入路径为数据库二进制所在路径，即$GAUSSHOME/bin/。"
    status: "confirmed"
    source_anchor: "L58-L59"
  -
    id: "load_data_fact_body_60"
    type: "constraint"
    statement: "●    REPLACE | IGNORE 控制导入文件数据冲突及错误处理的行为选项。"
    status: "confirmed"
    source_anchor: "L60-L61"
  -
    id: "load_data_fact_body_62"
    type: "behavior_oracle"
    statement: "–     指定REPLACE选项 当导入数据与表中原有数据冲突时，替换冲突行数据；"
    status: "confirmed"
    source_anchor: "L62-L64"
  -
    id: "load_data_fact_body_62_1"
    type: "behavior_oracle"
    statement: "当文件中字段数小于 指定表的字段数时，宽松模式下告警，严格模式下报错。"
    status: "confirmed"
    source_anchor: "L62-L64"
  -
    id: "load_data_fact_body_65"
    type: "behavior_oracle"
    statement: "–     指定IGNORE选项 当导入数据与表中原有数据冲突时，跳过冲突行数据；"
    status: "confirmed"
    source_anchor: "L65-L67"
  -
    id: "load_data_fact_body_65_1"
    type: "behavior_oracle"
    statement: "当文件中字段数小于 指定表的字段数时，按默认值填充表中未指定的字段，并产生告警。"
    status: "confirmed"
    source_anchor: "L65-L67"
  -
    id: "load_data_fact_body_68"
    type: "constraint"
    statement: "–     不指定REPLACE与IGNORE选项"
    status: "confirmed"
    source_anchor: "L68-L68"
  -
    id: "load_data_fact_body_70"
    type: "behavior_oracle"
    statement: "▪     不指定LOCAL选项时，当导入数据与表中原有数据冲突时报错；"
    status: "confirmed"
    source_anchor: "L70-L71"
  -
    id: "load_data_fact_body_70_1"
    type: "behavior_oracle"
    statement: "当文件 中字段数小于指定表的字段数时，宽松模式下告警，严格模式下报错。"
    status: "confirmed"
    source_anchor: "L70-L71"
  -
    id: "load_data_fact_body_73"
    type: "constraint"
    statement: "▪    指定LOCAL选项时，行为与指定IGNORE选项一致。"
    status: "confirmed"
    source_anchor: "L73-L73"
  -
    id: "load_data_fact_body_74"
    type: "constraint"
    statement: "●   PARTITION 当导入表为分区表时，此参数用来指定分区。"
    status: "confirmed"
    source_anchor: "L74-L76"
  -
    id: "load_data_fact_body_74_1"
    type: "constraint"
    statement: "若数据与指定分区范围不一致则报 错。"
    status: "confirmed"
    source_anchor: "L74-L76"
  -
    id: "load_data_fact_body_77"
    type: "behavior_oracle"
    statement: "●   CHARACTER SET 指定数据文件的编码格式名称，缺省为当前客户端编码格式。"
    status: "confirmed"
    source_anchor: "L77-L78"
  -
    id: "load_data_fact_body_79"
    type: "constraint"
    statement: "●   FIELDS | COLUMNS"
    status: "confirmed"
    source_anchor: "L79-L79"
  -
    id: "load_data_fact_body_80"
    type: "behavior_oracle"
    statement: "–   TERMINATED BY 指定两列之间分隔符，缺省为'\\t'。"
    status: "confirmed"
    source_anchor: "L80-L81"
  -
    id: "load_data_fact_body_85"
    type: "constraint"
    statement: "指定换行符不能与分隔符相同。"
    status: "confirmed"
    source_anchor: "L85-L85"
  -
    id: "load_data_fact_body_86"
    type: "behavior_oracle"
    statement: "–   [OPTIONALLY] ENCLOSED BY 指定引号字符，缺省为''。"
    status: "confirmed"
    source_anchor: "L86-L89"
  -
    id: "load_data_fact_body_86_1"
    type: "behavior_oracle"
    statement: "OPTIONALLY参数为可选参数，无实际作用。"
    status: "confirmed"
    source_anchor: "L86-L89"
  -
    id: "load_data_fact_body_86_2"
    type: "behavior_oracle"
    statement: "引号符仅支持单字符，不支持字符串。"
    status: "confirmed"
    source_anchor: "L86-L89"
  -
    id: "load_data_fact_body_90"
    type: "behavior_oracle"
    statement: "–   ESCAPED BY 指定转义符，缺省为'\\'。"
    status: "confirmed"
    source_anchor: "L90-L91"
  -
    id: "load_data_fact_body_95"
    type: "constraint"
    statement: "● 转义字符仅支持单字符，不支持字符串。"
    status: "confirmed"
    source_anchor: "L95-L95"
  -
    id: "load_data_fact_body_96"
    type: "environment"
    statement: "● 如果转义符非空，当处理到转义符时，会判断转义符及其后的字符序列是否满足 指定的转义序列。"
    status: "confirmed"
    source_anchor: "L96-L100"
  -
    id: "load_data_fact_body_96_1"
    type: "environment"
    statement: "如果满足指定的转义序列，则将转义符及其后的字符转义成指 定字符。"
    status: "confirmed"
    source_anchor: "L96-L100"
  -
    id: "load_data_fact_body_96_2"
    type: "environment"
    statement: "如果不满足指定的转义序列，则会忽略该转义符并继续导入数据。"
    status: "confirmed"
    source_anchor: "L96-L100"
  -
    id: "load_data_fact_body_96_3"
    type: "environment"
    statement: "支持 的转义序列受GUC参数load_data_behavior_compat_options是否配置 new_escape_string选项控制。"
    status: "confirmed"
    source_anchor: "L96-L100"
  -
    id: "load_data_fact_body_101"
    type: "constraint"
    statement: "●   LINES"
    status: "confirmed"
    source_anchor: "L101-L101"
  -
    id: "load_data_fact_body_102"
    type: "constraint"
    statement: "–   STARTING BY 指定导入数据文件起始字段样式。"
    status: "confirmed"
    source_anchor: "L102-L103"
  -
    id: "load_data_fact_body_104"
    type: "constraint"
    statement: "–   TERMINATED BY 指定导入数据文件换行符样式。"
    status: "confirmed"
    source_anchor: "L104-L105"
  -
    id: "load_data_fact_body_109"
    type: "environment"
    statement: "GUC参数load_data_behavior_compat_options的配置选项new_escape_string，控 制是否对指定的行终结符做转义处理。"
    status: "confirmed"
    source_anchor: "L109-L110"
  -
    id: "load_data_fact_body_111"
    type: "constraint"
    statement: "●   IGNORE 指定数据导入时，跳过数据文件的前 number行。"
    status: "confirmed"
    source_anchor: "L111-L112"
  -
    id: "load_data_fact_body_113"
    type: "constraint"
    statement: "●   col_name_or_user_var 可选的待复制字段列表。"
    status: "confirmed"
    source_anchor: "L113-L115"
  -
    id: "load_data_fact_body_113_1"
    type: "constraint"
    statement: "取值范围：如果没有声明字段列表，将使用所有字段。"
    status: "confirmed"
    source_anchor: "L113-L115"
  -
    id: "load_data_fact_body_119"
    type: "constraint"
    statement: "● 指定列参数不支持重复指定列。"
    status: "confirmed"
    source_anchor: "L119-L119"
  -
    id: "load_data_fact_body_120"
    type: "environment"
    statement: "● LOAD DATA语法指定列时，col_name_or_user_var支持指定为表中存在列或用户变 量。"
    status: "confirmed"
    source_anchor: "L120-L123"
  -
    id: "load_data_fact_body_120_1"
    type: "environment"
    statement: "若指定为用户变量，需设置GUC参数b_format_behavior_compat_options值包含 enable_set_variables（set b_format_behavior_compat_options = 'enable_set_variables'）。"
    status: "confirmed"
    source_anchor: "L120-L123"
  -
    id: "load_data_fact_body_124"
    type: "constraint"
    statement: "●    SET 指定列值，可以指定为表达式或DEFAULT。"
    status: "confirmed"
    source_anchor: "L124-L125"
  -
    id: "load_data_fact_body_128"
    type: "constraint"
    statement: "● 表达式中不支持列名。"
    status: "confirmed"
    source_anchor: "L128-L128"
  -
    id: "load_data_fact_body_129"
    type: "behavior_oracle"
    statement: "● 若表达式结果类型与被赋值列对应类型之间不存在隐式转换函数则报错。"
    status: "confirmed"
    source_anchor: "L129-L129"
  -
    id: "load_data_fact_example_133"
    type: "example"
    statement: "示例原文片段：-- 环境准备。 gaussdb=# CREATE DATABASE test_load WITH DBCOMPATIBILITY = 'b'; gaussdb=# \\c test_load test_load=# SET b_format_version='5.7'; test_load=# SET b_format_dev_version='s2';"
    status: "confirmed"
    source_anchor: "L133-L137"
  -
    id: "load_data_fact_example_139"
    type: "example"
    statement: "示例原文片段：-- 准备待导入的文件。 test_load=# CREATE TABLE load_data_tmp1(a int, b int); test_load=# INSERT INTO load_data_tmp1 VALUES(1,1),(2,2),(3,3); test_load=# SELECT * FROM load_data_tmp1 INTO OUTFILE '/tmp/load1.csv'; test_load=# CREATE TABLE load_data_tmp2(a int, b int); test_load=# INSERT INTO load_data_tmp2 VALUES(1,2); test_load=# SELECT * FROM load_data_tmp2 INTO OUTFILE '/tmp/load2.csv'; test_load=# CREATE TABLE load_data_tmp3(a int, b int); test_load=# INSERT INTO load_data_tmp3 VALUES(4,4),(5,5); test_load=# SELECT * FROM load_data_tmp3 INTO OUTFILE '/tmp/load3.csv';"
    status: "confirmed"
    source_anchor: "L139-L148"
  -
    id: "load_data_fact_example_149"
    type: "example"
    statement: "示例原文片段：test_load=# CREATE TABLE load_data_tmp4(a char(50)); test_load=# INSERT INTO load_data_tmp4 VALUES('\"load test quote\"'), ('\\'load test single_quote\\''); test_load=# SELECT * FROM load_data_tmp4 INTO OUTFILE '/tmp/load4.csv';"
    status: "confirmed"
    source_anchor: "L149-L151"
  -
    id: "load_data_fact_example_153"
    type: "example"
    statement: "示例原文片段：-- 创建表。 test_load=# CREATE TABLE load_data_tbl1(load_col1 INT UNIQUE, load_col2 INT, load_col3 CHAR(10));"
    status: "confirmed"
    source_anchor: "L153-L154"
  -
    id: "load_data_fact_example_156"
    type: "example"
    statement: "示例原文片段：-- 向表中插入一条数据。 test_load=# INSERT INTO load_data_tbl1 VALUES(0,0,'load0');"
    status: "confirmed"
    source_anchor: "L156-L157"
  -
