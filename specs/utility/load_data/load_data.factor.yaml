facts:
  -
    id: "load_data_fact_body_5"
    type: "constraint"
    statement: "将文件中的数据导入到数据库指定表中。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "load_data_fact_body_8"
    type: "environment"
    statement: "●   LOAD DATA语法仅在B兼容模式（sql_compatibility = 'B'）以及M-Compatibility 模式数据库（sql_compatibility = 'M'）下支持。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "load_data_fact_body_10"
    type: "constraint"
    statement: "●   LOAD DATA语法仅在开启b_format_version='5.7'和b_format_dev_version='s2'参 数后与B数据库功能一致。"
    status: "confirmed"
    source_anchor: "L10-L11"
  -
    id: "load_data_fact_body_12"
    type: "environment"
    statement: "●   LOAD DATA语法权限相关GUC参数与COPY FROM语法注意事项一致。"
    status: "confirmed"
    source_anchor: "L12-L12"
  -
    id: "load_data_fact_body_13"
    type: "environment"
    statement: "●   LOAD DATA语法需要表的INSERT和DELETE权限。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "load_data_fact_body_14"
    type: "constraint"
    statement: "●   执行LOAD DATA语法写入表中的数据若无法转换为表中数据类型格式时将导致导 入失败。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "load_data_fact_body_16"
    type: "constraint"
    statement: "●   LOAD DATA只能用于表，不能用于视图。"
    status: "confirmed"
    source_anchor: "L16-L16"
  -
    id: "load_data_fact_body_17"
    type: "constraint"
    statement: "●   LOAD DATA与SELECT … INTO OUTFILE可配合使用，实现数据的导出与导入： 先通过SELECT … INTO OUTFILE将表数据导出至文件，再通过LOAD DATA将文 件数据导入回表中。"
    status: "confirmed"
    source_anchor: "L17-L19"
  -
    id: "load_data_fact_body_17_1"
    type: "constraint"
    statement: "配合使用时需注意以下事项："
    status: "confirmed"
    source_anchor: "L17-L19"
  -
    id: "load_data_fact_body_20"
    type: "constraint"
    statement: "–   语句子句必须匹配：LOAD DATA与SELECT … INTO OUTFILE中的FIELDS子 句、LINES子句及CHARACTER SET子句应保持一致，否则可能导致文件内容 无法被正确加载。"
    status: "confirmed"
    source_anchor: "L20-L22"
  -
    id: "load_data_fact_body_24"
    type: "constraint"
    statement: "–     避免使用空字符串作为特殊字符：不建议将转义符、列分隔符、行分隔符设 置为空字符串。"
    status: "confirmed"
    source_anchor: "L24-L26"
  -
    id: "load_data_fact_body_24_1"
    type: "constraint"
    statement: "若数据表中包含这类特殊字符，使用空字符串可能导致这些 字符在导回时无法被正确处理。"
    status: "confirmed"
    source_anchor: "L24-L26"
  -
    id: "load_data_fact_body_27"
    type: "constraint"
    statement: "–     避免特殊字符重复：转义符、列分隔符、引号字符和行分隔符不宜设置为相 同字符，否则可能造成部分功能失效，影响数据的准确导入。"
    status: "confirmed"
    source_anchor: "L27-L28"
