schema_version: 1
kind: "manifest"
id: "manifest_cluster_repeat"
name: "CLUSTER repeat"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "cluster"
syntax_ref: "syntax_cluster"
suite_type: "positive"
strategy: "pairwise"
fixture_refs: []
identifier_policy: {}
bindings:
  target:
    - "cluster_target_repeat"
  index:
    - "cluster_index_none"
  verbose:
    - "cluster_verbose_none"
    - "cluster_verbose_verbose"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "autocommit_no_transaction"
    allowed_values:
      - "true"
    fact_refs:
      - "cluster_fact_no_transaction"
  -
    key: "cluster_disk_capacity_ready"
    allowed_values:
      - "true"
    fact_refs:
      - "cluster_fact_disk"
