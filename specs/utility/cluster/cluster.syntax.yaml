schema_version: 1
kind: "syntax"
id: "syntax_cluster"
name: "CLUSTER 语法"
factor_ref: "cluster"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
production: "CLUSTER {verbose} {target} {index}"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  verbose:
    type: "token"
    optional: true
    dimension_ref: "cluster.verbose"
  target:
    type: "token"
    optional: true
    dimension_ref: "cluster.target"
  index:
    type: "token"
    optional: true
    dimension_ref: "cluster.index"
source_fact_refs:
  - "cluster_fact_table_syntax"
  - "cluster_fact_partition_syntax"
  - "cluster_fact_all_syntax"
  - "cluster_fact_table"
  - "cluster_fact_partition"
