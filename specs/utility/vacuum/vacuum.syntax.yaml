schema_version: 1
kind: "syntax"
id: "syntax_vacuum"
name: "VACUUM 语法"
factor_ref: "vacuum"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  full:
    type: "token"
    optional: true
    dimension_ref: "vacuum.full"
  freeze:
    type: "token"
    optional: true
    dimension_ref: "vacuum.freeze"
  verbose:
    type: "token"
    optional: true
    dimension_ref: "vacuum.verbose"
  analyze:
    type: "token"
    optional: true
    dimension_ref: "vacuum.analyze"
  columns:
    type: "token"
    optional: true
    dimension_ref: "vacuum.columns"
  execution_mode:
    type: "token"
    optional: true
    dimension_ref: "vacuum.execution_mode"
  options:
    type: "token"
    optional: true
    dimension_ref: "vacuum.options"
  form:
    type: "token"
    optional: true
    dimension_ref: "vacuum.form"
source_fact_refs:
  - "vacuum_fact_order"
  - "vacuum_fact_parenthesized"
  - "vacuum_fact_plain"
  - "vacuum_fact_analyze_syntax"
  - "vacuum_fact_verbose_parameter"
  - "vacuum_fact_table"
  - "vacuum_fact_partition"
  - "vacuum_fact_subpartition"
  - "vacuum_fact_offline"
  - "vacuum_fact_online_parameters"
  - "vacuum_fact_parenthesized_target"
  - "vacuum_fact_parenthesized_tail"
ast:
  kind: "choice"
  selector: "form"
  branches:
    vacuum_form_plain:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "VACUUM "
        -
          kind: "slot"
          slot: "full"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "freeze"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "verbose"
        -
          kind: "literal"
          text: " t_vacuum_source "
        -
          kind: "slot"
          slot: "execution_mode"
    vacuum_form_analyze:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "VACUUM "
        -
          kind: "slot"
          slot: "full"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "freeze"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "verbose"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "analyze"
        -
          kind: "literal"
          text: " t_vacuum_source "
        -
          kind: "slot"
          slot: "columns"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "execution_mode"
    vacuum_form_paren:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "VACUUM ("
        -
          kind: "repeat"
          slot: "options"
          separator: ", "
          items_property: "items"
        -
          kind: "literal"
          text: ") t_vacuum_source "
        -
          kind: "slot"
          slot: "columns"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "execution_mode"
