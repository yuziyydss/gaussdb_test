factor_ref: "vacuum"
requires_fixture_refs: []
provides:
  tables:
    -
      name: "t_vacuum_source"
      persistence: "permanent"
      table_kind: "regular"
      columns:
        -
          name: "col_1"
          type: "INTEGER"
          nullable: true
        -
          name: "col_2"
          type: "INTEGER"
          nullable: true
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "CREATE TABLE t_vacuum_source (col_1 INTEGER, col_2 INTEGER) WITH (STORAGE_TYPE=ASTORE, segment=off);"
