rules: []
structural_checks: []
facts:
  -
    id: "vacuum_fact_purpose"
    type: "lifecycle"
    statement: "回收表或B-Tree中已删除行的存储空间，删除不立即物理释放。"
    status: "confirmed"
    source_anchor: "L5-L7"
  -
    id: "vacuum_fact_scope"
    type: "environment"
    statement: "无目标时处理当前库有权限表，带目标则仅该表。"
    status: "confirmed"
    source_anchor: "L10-L11"
  -
    id: "vacuum_fact_permission"
    type: "environment"
    statement: "表拥有者或VACUUM授权者可清理；数据库所有者不含共享目录，管理员默认权限受三权分立影响，无权限表跳过。"
    status: "confirmed"
    source_anchor: "L12-L17"
  -
    id: "vacuum_fact_no_transaction"
    type: "environment"
    statement: "VACUUM不能在事务块内执行。"
    status: "confirmed"
    source_anchor: "L18-L18"
  -
    id: "vacuum_fact_maintenance"
    type: "lifecycle"
    statement: "频繁清理并在大量增删后VACUUM ANALYZE可更新优化器统计。"
    status: "confirmed"
    source_anchor: "L19-L22"
  -
    id: "vacuum_fact_full_advice"
    type: "lifecycle"
    statement: "FULL不宜日常使用，删除大量行后可缩小表；其他活跃长事务会阻止回收。"
    status: "confirmed"
    source_anchor: "L23-L28"
  -
    id: "vacuum_fact_full_storage"
    type: "behavior_oracle"
    statement: "FULL重建需额外有效数据大小空间；非段页空间归还OS，段页归还段数据文件。"
    status: "confirmed"
    source_anchor: "L29-L33"
  -
    id: "vacuum_fact_io"
    type: "environment"
    statement: "VACUUM增加IO可能影响其他会话，可考虑开销延迟。"
    status: "confirmed"
    source_anchor: "L34-L35"
  -
    id: "vacuum_fact_verbose"
    type: "behavior_oracle"
    statement: "VERBOSE输出当前表进度及统计。"
    status: "confirmed"
    source_anchor: "L36-L37"
  -
    id: "vacuum_fact_order"
    type: "syntax"
    statement: "括号选项可任意顺序，无括号必须按语法顺序。"
    status: "confirmed"
    source_anchor: "L38-L39"
  -
    id: "vacuum_fact_age"
    type: "environment"
    statement: "vacuum_defer_cleanup_age延迟清理行存刚删除记录。"
    status: "confirmed"
    source_anchor: "L40-L41"
  -
    id: "vacuum_fact_analyze_order"
    type: "lifecycle"
    statement: "VACUUM ANALYZE先VACUUM再逐表ANALYZE。"
    status: "confirmed"
    source_anchor: "L42-L43"
  -
    id: "vacuum_fact_locks"
    type: "lifecycle"
    statement: "普通VACUUM复用空间可并发读写，FULL移动行且加排他锁。"
    status: "confirmed"
    source_anchor: "L44-L47"
  -
    id: "vacuum_fact_deadlock"
    type: "lifecycle"
    statement: "并发多个FULL可能死锁。"
    status: "confirmed"
    source_anchor: "L48-L48"
  -
    id: "vacuum_fact_system"
    type: "environment"
    statement: "未开xc_maintenance_mode时FULL跳过系统表。"
    status: "confirmed"
    source_anchor: "L49-L50"
  -
    id: "vacuum_fact_delay"
    type: "lifecycle"
    statement: "DELETE后立即FULL不回收，需1000个非SELECT事务或等1s再1个事务。"
    status: "confirmed"
    source_anchor: "L51-L53"
  -
    id: "vacuum_fact_peak"
    type: "environment"
    statement: "FULL排他锁不宜业务高峰。"
    status: "confirmed"
    source_anchor: "L54-L55"
  -
    id: "vacuum_fact_ustore"
    type: "behavior_oracle"
    statement: "Ustore与Astore手动清理一致；Ustore自动清理仅做GPI清理、FSM更新及索引页回收。"
    status: "confirmed"
    source_anchor: "L56-L58"
  -
    id: "vacuum_fact_gpi"
    type: "lifecycle"
    statement: "离线分区FULL清理后重建GPI，在线表级同步重建，在线单分区完成后重建。"
    status: "confirmed"
    source_anchor: "L59-L64"
  -
    id: "vacuum_fact_online_fallback"
    type: "behavior_oracle"
    statement: "列出的库级、索引、二级分区、段页、bucket、临时、unlogged、HTAP对象不支持在线，将NOTICE降级离线。"
    status: "confirmed"
    source_anchor: "L65-L68"
  -
    id: "vacuum_fact_disk"
    type: "environment"
    statement: "在线需剩余空间达到表及附属索引大小总和。"
    status: "confirmed"
    source_anchor: "L69-L70"
  -
    id: "vacuum_fact_cancel"
    type: "lifecycle"
    statement: "取消在线进入残留清理，再次取消会中断清理并留残留。"
    status: "confirmed"
    source_anchor: "L71-L72"
  -
    id: "vacuum_fact_resource"
    type: "environment"
    statement: "在线会争抢业务资源，资源不足不建议并行加速。"
    status: "confirmed"
    source_anchor: "L73-L75"
  -
    id: "vacuum_fact_compat"
    type: "environment"
    statement: "M兼容模式不支持在线FULL。"
    status: "confirmed"
    source_anchor: "L76-L76"
  -
    id: "vacuum_fact_freeze_online"
    type: "behavior_oracle"
    statement: "FREEZE与ONLINE同用将NOTICE降级离线，而不是目标错误。"
    status: "confirmed"
    source_anchor: "L77-L79"
  -
    id: "vacuum_fact_online_tx"
    type: "environment"
    statement: "在线FULL不能事务/存储过程执行，JDBC不能将多SQL隐式事务一起执行。"
    status: "confirmed"
    source_anchor: "L80-L81"
  -
    id: "vacuum_fact_failure"
    type: "lifecycle"
    statement: "在线失败可能存储膨胀，长事务可能阻塞在线。"
    status: "confirmed"
    source_anchor: "L82-L84"
  -
    id: "vacuum_fact_late_lock"
    type: "lifecycle"
    statement: "在线FULL后期阻塞DQL/DML。"
    status: "confirmed"
    source_anchor: "L85-L85"
  -
    id: "vacuum_fact_ddl"
    type: "lifecycle"
    statement: "并发DDL可能死锁/报错，需重连重试。"
    status: "confirmed"
    source_anchor: "L86-L87"
  -
    id: "vacuum_fact_online_schema"
    type: "metadata_oracle"
    statement: "在线创建online$$ddl$$哈希命名模式。"
    status: "confirmed"
    source_anchor: "L88-L88"
  -
    id: "vacuum_fact_schema_owner"
    type: "environment"
    statement: "在线模式属主初始用户，不建议操作或查询，gs_dump默认不导出。"
    status: "confirmed"
    source_anchor: "L89-L91"
  -
    id: "vacuum_fact_schema_conflict"
    type: "behavior_oracle"
    statement: "用户不能创建online$$前缀模式；既有同名冲突会使在线降级离线并提示。"
    status: "confirmed"
    source_anchor: "L92-L94"
  -
    id: "vacuum_fact_parenthesized"
    type: "syntax"
    statement: "VACUUM括号选项列表允许任意关键字顺序。"
    status: "confirmed"
    source_anchor: "L97-L98"
  -
    id: "vacuum_fact_plain"
    type: "syntax"
    statement: "无分析分支按FULL FREEZE VERBOSE顺序，后接表/分区及执行模式。"
    status: "confirmed"
    source_anchor: "L103-L106"
  -
    id: "vacuum_fact_analyze_syntax"
    type: "syntax"
    statement: "分析分支按FULL FREEZE VERBOSE ANALYZE/ANALYSE VERBOSE顺序，表后可列与分区。"
    status: "confirmed"
    source_anchor: "L108-L111"
  -
    id: "vacuum_fact_buckets"
    type: "constraint"
    statement: "VACUUM FREEZE BUCKETS当前版本暂不支持。"
    status: "confirmed"
    source_anchor: "L113-L116"
  -
    id: "vacuum_fact_full"
    type: "behavior_oracle"
    statement: "FULL回收更多空间但更慢且排他锁。"
    status: "confirmed"
    source_anchor: "L120-L122"
  -
    id: "vacuum_fact_statistics"
    type: "behavior_oracle"
    statement: "FULL会丢失统计，需要ANALYZE重新收集。"
    status: "confirmed"
    source_anchor: "L126-L127"
  -
    id: "vacuum_fact_freeze"
    type: "behavior_oracle"
    statement: "FREEZE等价本次vacuum_freeze_min_age=0。"
    status: "confirmed"
    source_anchor: "L128-L129"
  -
    id: "vacuum_fact_verbose_parameter"
    type: "syntax"
    statement: "VERBOSE输出各表详细清理报告。"
    status: "confirmed"
    source_anchor: "L130-L131"
  -
    id: "vacuum_fact_analyze"
    type: "behavior_oracle"
    statement: "ANALYZE/ANALYSE更新优化器统计。"
    status: "confirmed"
    source_anchor: "L132-L133"
  -
    id: "vacuum_fact_auto_analyze"
    type: "behavior_oracle"
    statement: "Ustore分区autovacuum=analyze也触发vacuum。"
    status: "confirmed"
    source_anchor: "L136-L136"
  -
    id: "vacuum_fact_table"
    type: "syntax"
    statement: "表可模式修饰，省略时为当前库所有表。"
    status: "confirmed"
    source_anchor: "L137-L139"
  -
    id: "vacuum_fact_column"
    type: "constraint"
    statement: "列列表需ANALYZE选项，省略为全部列。"
    status: "confirmed"
    source_anchor: "L140-L142"
  -
    id: "vacuum_fact_column_error"
    type: "lifecycle"
    statement: "错误列可能使VACUUM先成功后ANALYZE失败，分区也可能部分成功。"
    status: "confirmed"
    source_anchor: "L145-L147"
  -
    id: "vacuum_fact_partition"
    type: "syntax"
    statement: "PARTITION指定一级分区，缺省为全部一级分区。"
    status: "confirmed"
    source_anchor: "L148-L149"
  -
    id: "vacuum_fact_subpartition"
    type: "syntax"
    statement: "SUBPARTITION指定二级分区，缺省为全部二级分区。"
    status: "confirmed"
    source_anchor: "L150-L151"
  -
    id: "vacuum_fact_online"
    type: "behavior_oracle"
    statement: "ONLINE旨在减少FULL长期阻塞，不支持场景忽略ONLINE并NOTICE离线。"
    status: "confirmed"
    source_anchor: "L152-L158"
  -
    id: "vacuum_fact_offline"
    type: "syntax"
    statement: "OFFLINE离线执行且为默认模式。"
    status: "confirmed"
    source_anchor: "L159-L161"
  -
    id: "vacuum_fact_recovery"
    type: "lifecycle"
    statement: "在线失败会自动清残留，但失败或严重故障可能需online_ddl_cleanup手动恢复，无残留不建议调用。"
    status: "confirmed"
    source_anchor: "L165-L170"
  -
    id: "vacuum_fact_online_parameters"
    type: "syntax"
    statement: "在线参数仅在ONLINE且满足在线条件时生效。"
    status: "confirmed"
    source_anchor: "L171-L174"
  -
    id: "vacuum_fact_parallel"
    type: "constraint"
    statement: "parallel_threads整数1到32，默认1。"
    status: "confirmed"
    source_anchor: "L175-L176"
  -
    id: "vacuum_fact_resource_override"
    type: "environment"
    statement: "parallel_threads忽略用户会话资源管控并提示，实际遵循初始用户资源管控。"
    status: "confirmed"
    source_anchor: "L178-L181"
  -
    id: "vacuum_fact_workers"
    type: "behavior_oracle"
    statement: "parallel_workers控制索引构建，parallel_threads控制追增，可共同生效。"
    status: "confirmed"
    source_anchor: "L183-L185"
  -
    id: "vacuum_fact_catchup"
    type: "constraint"
    statement: "max_catchup_times整数1到50，默认50。"
    status: "confirmed"
    source_anchor: "L186-L187"
  -
    id: "vacuum_fact_catchup_work"
    type: "lifecycle"
    statement: "在线记录IUD增量并多轮追增，最大轮次限制防止持续无法完成。"
    status: "confirmed"
    source_anchor: "L189-L192"
  -
    id: "vacuum_fact_example_basic"
    type: "example"
    statement: "删除、重插及清理后空间复用的示例。"
    status: "confirmed"
    source_anchor: "L195-L204"
  -
    id: "vacuum_fact_example_full"
    type: "example"
    statement: "FULL前后大小以及ONLINE示例，数值不是通用Oracle。"
    status: "confirmed"
    source_anchor: "L232-L241"
  -
    id: "vacuum_fact_partitions"
    type: "environment"
    statement: "静态域不生成分区目标；一级/二级分区及GPI重建需专用fixture。"
    status: "confirmed"
    source_anchor: "L148-L149"
  -
    id: "vacuum_fact_subpartitions"
    type: "environment"
    statement: "静态域不生成二级分区目标；独立目标域需专用fixture。"
    status: "confirmed"
    source_anchor: "L150-L151"
  -
    id: "vacuum_fact_online_profile"
    type: "environment"
    statement: "静态域不执行在线并发或离线降级；需受控对象能力与状态执行器。"
    status: "confirmed"
    source_anchor: "L152-L158"
  -
    id: "vacuum_fact_parallel_profile"
    type: "environment"
    statement: "静态域不生成parallel_threads；边界及资源管控Oracle需专用环境。"
    status: "confirmed"
    source_anchor: "L175-L176"
  -
    id: "vacuum_fact_catchup_profile"
    type: "environment"
    statement: "静态域不生成max_catchup_times；边界及追增状态需专用环境。"
    status: "confirmed"
    source_anchor: "L186-L187"
  -
    id: "vacuum_fact_bucket_profile"
    type: "constraint"
    statement: "静态域不生成BUCKETS分支；不支持目标负向错误保留为来源限制。"
    status: "confirmed"
