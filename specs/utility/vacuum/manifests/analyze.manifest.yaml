schema_version: 1
kind: "manifest"
id: "manifest_vacuum_analyze"
name: "VACUUM analyze"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "vacuum"
syntax_ref: "syntax_vacuum"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_vacuum_source"
identifier_policy: {}
bindings:
  form:
    - "vacuum_form_analyze"
  full:
    - "vacuum_full_none"
    - "vacuum_full_full"
  freeze:
    - "vacuum_freeze_none"
    - "vacuum_freeze_freeze"
  verbose:
    - "vacuum_verbose_none"
    - "vacuum_verbose_verbose"
  analyze:
    - "vacuum_analyze_analyze"
    - "vacuum_analyze_analyse"
  columns:
    - "vacuum_columns_none"
    - "vacuum_columns_one"
    - "vacuum_columns_two"
  execution_mode:
    - "vacuum_execution_mode_default"
    - "vacuum_execution_mode_offline"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "autocommit_no_transaction"
    allowed_values:
      - "true"
    fact_refs:
      - "vacuum_fact_no_transaction"
