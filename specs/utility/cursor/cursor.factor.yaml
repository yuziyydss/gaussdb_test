rules: []
structural_checks: []
facts:
  -
    id: "cursor_fact_purpose"
    type: "lifecycle"
    statement: "创建从查询中检索部分行的游标。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "cursor_fact_context"
    type: "lifecycle"
    statement: "游标是存储过程上下文内存区域的句柄。"
    status: "confirmed"
    source_anchor: "L6-L7"
  -
    id: "cursor_fact_transaction"
    type: "environment"
    statement: "游标命令只能在事务块使用。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "cursor_fact_format"
    type: "behavior_oracle"
    statement: "默认返回文本，FETCH 可返回文本或二进制格式。"
    status: "confirmed"
    source_anchor: "L11-L14"
  -
    id: "cursor_fact_binary"
    type: "behavior_oracle"
    statement: "二进制游标返回内部二进制形态，整数示例为4字节大端表示。"
    status: "confirmed"
    source_anchor: "L15-L19"
  -
    id: "cursor_fact_parameter"
    type: "constraint"
    statement: "静态游标支持默认参数，但默认值不能直接引用 PACKAGE 外变量。"
    status: "confirmed"
    source_anchor: "L20-L22"
  -
    id: "cursor_fact_dependency"
    type: "lifecycle"
    statement: "游标定义产生查询对象，PACKAGE 或过程暂不建立对查询对象的依赖。"
    status: "confirmed"
    source_anchor: "L23-L24"
  -
    id: "cursor_fact_syntax"
    type: "syntax"
    statement: "CURSOR 名称后可带 BINARY、NO SCROLL、WITH/WITHOUT HOLD，再 FOR 查询。"
    status: "confirmed"
    source_anchor: "L27-L29"
  -
    id: "cursor_fact_name"
    type: "syntax"
    statement: "cursor_name 是符合标识符规则的游标名。"
    status: "confirmed"
    source_anchor: "L35-L37"
  -
    id: "cursor_fact_binary_token"
    type: "syntax"
    statement: "BINARY 指定二进制数据。"
    status: "confirmed"
    source_anchor: "L38-L39"
  -
    id: "cursor_fact_no_scroll"
    type: "constraint"
    statement: "NO SCROLL 不允许倒序检索。"
    status: "confirmed"
    source_anchor: "L40-L43"
  -
    id: "cursor_fact_plan_scroll"
    type: "environment"
    statement: "未声明滚动选项时根据执行计划判断能否倒序。"
    status: "confirmed"
    source_anchor: "L44-L45"
  -
    id: "cursor_fact_cmdsql"
    type: "environment"
    statement: "cmdsql 不支持显式 SCROLL，只支持 NO SCROLL 或省略。"
    status: "confirmed"
    source_anchor: "L48-L49"
  -
    id: "cursor_fact_pl_scroll"
    type: "environment"
    statement: "存储过程中支持 SCROLL、NO SCROLL 或省略。"
    status: "confirmed"
    source_anchor: "L50-L50"
  -
    id: "cursor_fact_concurrent"
    type: "constraint"
    statement: "显式游标只有 NO SCROLL 可以并发执行。"
    status: "confirmed"
    source_anchor: "L51-L52"
  -
    id: "cursor_fact_hold_default"
    type: "behavior_oracle"
    statement: "不指定 HOLD 选项默认 WITHOUT HOLD。"
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "cursor_fact_hold"
    type: "lifecycle"
    statement: "WITH HOLD 在创建事务结束后仍可用。"
    status: "confirmed"
    source_anchor: "L56-L56"
  -
    id: "cursor_fact_without_hold"
    type: "lifecycle"
    statement: "WITHOUT HOLD 随创建事务结束自动关闭。"
    status: "confirmed"
    source_anchor: "L57-L58"
  -
    id: "cursor_fact_query"
    type: "syntax"
    statement: "查询源为 SELECT 或 VALUES。"
    status: "confirmed"
    source_anchor: "L59-L61"
  -
    id: "cursor_fact_example_hold"
    type: "example"
    statement: "示例演示 WITH HOLD 跨事务存活。"
    status: "confirmed"
    source_anchor: "L98-L107"
  -
    id: "cursor_fact_static_parameter_profile"
    type: "environment"
    statement: "静态域不生成带参游标或假默认值；PACKAGE默认值约束需独立PL/SQL场景。"
    status: "confirmed"
    source_anchor: "L20-L22"
  -
    id: "cursor_fact_pl_scroll_profile"
    type: "environment"
    statement: "静态域仅生成cmdsql有限代表；存储过程SCROLL分支需PL/SQL fixture。"
    status: "confirmed"
    source_anchor: "L50-L50"
  -
    id: "cursor_fact_example_basic"
    type: "example"
    statement: "示例创建整数源表。"
    status: "confirmed"
    source_anchor: "L64-L68"
  -
    id: "cursor_fact_ex_cursor"
    type: "example"
    statement: "示例在事务中声明游标。"
    status: "confirmed"
    source_anchor: "L69-L72"
  -
    id: "cursor_fact_ex_fetch"
    type: "example"
    statement: "示例检索前三行。"
    status: "confirmed"
    source_anchor: "L73-L81"
  -
    id: "cursor_fact_ex_move"
    type: "example"
    statement: "示例向前移动两行而不返回结果。"
    status: "confirmed"
    source_anchor: "L82-L85"
  -
    id: "cursor_fact_ex_fetch_after_move"
    type: "example"
    statement: "示例移动后返回第六和第七行。"
    status: "confirmed"
    source_anchor: "L86-L93"
  -
    id: "cursor_fact_ex_close"
    type: "example"
    statement: "示例关闭游标并结束事务。"
    status: "confirmed"
    source_anchor: "L94-L96"
