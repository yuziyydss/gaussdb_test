schema_version: 1
kind: "syntax"
id: "syntax_execute"
name: "EXECUTE 语法"
factor_ref: "execute"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  name:
    type: "token"
    optional: true
    dimension_ref: "execute.name"
  parameters:
    type: "token"
    optional: true
    dimension_ref: "execute.parameters"
source_fact_refs:
  - "execute_fact_syntax"
  - "execute_fact_name"
  - "execute_fact_expression"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "EXECUTE "
    -
      kind: "slot"
      slot: "name"
    -
      kind: "optional"
      selector: "parameters"
      enabled_values:
        - "execute_parameters_integer"
        - "execute_parameters_expression"
        - "execute_parameters_null"
        - "execute_parameters_three"
        - "execute_parameters_text"
        - "execute_parameters_two"
        - "execute_parameters_rownum"
      item:
        kind: "sequence"
        items:
          -
            kind: "literal"
            text: "("
          -
            kind: "repeat"
            slot: "parameters"
            separator: ", "
            items_property: "items"
          -
            kind: "literal"
            text: ")"
