schema_version: 1
kind: "manifest"
id: "manifest_execute_compatible"
name: "EXECUTE compatible"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "execute"
syntax_ref: "syntax_execute"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_execute_prepared_session"
identifier_policy: {}
bindings:
  name:
    - "execute_name_zero"
    - "execute_name_one"
    - "execute_name_three"
  parameters:
    - "execute_parameters_absent"
    - "execute_parameters_integer"
    - "execute_parameters_expression"
    - "execute_parameters_null"
    - "execute_parameters_three"
    - "execute_parameters_text"
    - "execute_parameters_two"
local_rules:
  - expression: "name.properties.count == 0 or name.properties.signature in parameters.properties.compatible_signatures"
    rationale: EXECUTE参数数量与PREPARE签名必须匹配；不兼容组合是负向审阅，不是正向候选。
    fact_refs: [execute_fact_compatible_parameters]

expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "session_ownership"
    allowed_values:
      - "exclusive_test_connection"
    fact_refs:
      - "execute_fact_current_session"
