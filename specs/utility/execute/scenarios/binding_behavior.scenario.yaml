schema_version: 1
kind: "scenario"
id: "scenario_execute_binding_behavior"
name: "EXECUTE binding_behavior"
status: "planned"
description: "验证无参数语句忽略合法绑定，以及一参数表达式结果；未执行。"
factor_ref: "execute"
fixture_refs:
  - "fixture_execute_prepared_session"
fact_refs:
  - "execute_fact_parameter_error"
  - "execute_fact_ignored_bindings"
  - "execute_fact_current_session"
  - "prepare::prepare_fact_release"
preconditions:
  - "独占测试连接；fixture 和目标 SQL 必须使用同一连接。"
steps:
  -
    id: "zero"
    action: "execute_sql"
    sql: "EXECUTE p_ps_zero(1, 2);"
  -
    id: "one"
    action: "execute_sql"
    sql: "EXECUTE p_ps_one(1 + 1);"
oracles:
  -
    after_step: "zero"
    kind: "result_rows"
    expected:
      -
        - 1
  -
    after_step: "one"
    kind: "result_rows"
    expected:
      -
        - 2
execution_requirements:
  - "database"
  - "same_session"
