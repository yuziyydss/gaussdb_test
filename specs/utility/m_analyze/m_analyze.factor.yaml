facts:
- id: m_analyze_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.17 L2-2
- id: m_analyze_fact_syntax
  type: "syntax"
  statement: 普通表 ANALYZE 可选 VERBOSE、单层括号列列表。
  status: confirmed
  source_anchor: 2.4.2.6.17 L72-73
- id: m_analyze_fact_multi
  type: "syntax"
  statement: 手动多列统计采用双层括号列列表。
  status: confirmed
  source_anchor: 2.4.2.6.17 L85-85
- id: m_analyze_fact_column_exists
  type: "constraint"
  statement: ANALYZE 指定列必须是已有列。
  status: confirmed
  source_anchor: 2.4.2.6.17 L155-155
- id: m_analyze_fact_owner
  type: environment
  statement: ANALYZE 需要表所有者或表 ANALYZE 权限，本批为 fixture 表创建者。
  status: confirmed
  source_anchor: 2.4.2.6.17 L63-67
- id: m_analyze_fact_transaction
  type: environment
  statement: 普通 ANALYZE 可在事务/PREPARE 中执行，不包括 VERIFY。
  status: confirmed
  source_anchor: 2.4.2.6.17 L49-50
- id: m_analyze_fact_row_storage
  type: environment
  statement: ANALYZE 收集统计信息目前仅支持行存表。
  status: confirmed
  source_anchor: 2.4.2.6.17 L151-151
- id: m_analyze_fact_rollback
  type: "behavior_oracle"
  statement: PG_CLASS/PG_PARTITION 和相关统计函数字段不支持统计回滚。
  status: confirmed
  source_anchor: 2.4.2.6.17 L52-58
- id: m_analyze_fact_multi_limits
  type: "constraint"
  statement: 多列统计根据 enable_functional_dependency 最多4或32列；系统表、全局临时表不支持。
  status: confirmed
  source_anchor: 2.4.2.6.17 L89-92
- id: m_analyze_fact_verify
  type: environment
  statement: ANALYZE VERIFY 用于异常检测，需要 RELEASE 版本；不混入普通统计清单。
  status: confirmed
  source_anchor: 2.4.2.6.17 L58-60
- id: m_analyze_fact_purpose
  type: example
  statement: 收集普通表统计信息，结果存pg_statistic/pg_statistic_ext，可通过pg_stats/pg_ext_stats查询。执行计划生成器使用统计数据。
  status: confirmed
  source_anchor: 2.4.2.6.17 L4-8
- id: m_analyze_fact_no_params
  type: example
  statement: 无参数时分析当前数据库每个表和分区表；可指定table/column/partition限定范围。
  status: confirmed
  source_anchor: 2.4.2.6.17 L10-12
- id: m_analyze_fact_verify_types
  type: example
  statement: ANALYZE VERIFY支持校验类型：UHEAP/HEAP支持物理损坏+逻辑校验+COMPLETE元组校验；UBTREE支持物理+逻辑；BTREE/FSM仅物理；VM不支持。
  status: confirmed
  source_anchor: 2.4.2.6.17 L16-35
- id: m_analyze_fact_verify_time
  type: environment
  statement: ANALYZE VERIFY执行时间与目标对象大小和机器性能相关。
  status: confirmed
  source_anchor: 2.4.2.6.17 L40-41
- id: m_analyze_fact_history_tables
  type: example
  statement: 统计信息存入gs_statistic_history/gs_statistic_ext_history，保留时间由stats_history_record_limit和stats_history_retention_time控制。
  status: confirmed
  source_anchor: 2.4.2.6.17 L43-45
- id: m_analyze_fact_no_cursor_columns
  type: example
  statement: ANALYZE不收集无法做比较或等值运算的列，例如cursor类型。
  status: confirmed
  source_anchor: 2.4.2.6.17 L68-68
- id: m_analyze_fact_partition_first_level
  type: example
  statement: 使用PARTITION关键字时partition_name必须为一级分区名。
  status: confirmed
  source_anchor: 2.4.2.6.17 L81-81
- id: m_analyze_fact_auto_multi_stats
  type: example
  statement: 打开auto_statistic_ext_columns后执行ANALYZE自动按索引前缀创建多列统计信息。
  status: confirmed
  source_anchor: 2.4.2.6.17 L93-99
- id: m_analyze_fact_verify_concurrent_dml
  type: example
  statement: ANALYZE VERIFY直接从磁盘读取数据；并发DML可能导致校验数据不准确。
  status: confirmed
  source_anchor: 2.4.2.6.17 L106-117
- id: m_analyze_fact_verify_cascade
  type: example
  statement: 支持普通表和索引表操作，但不支持对索引表使用CASCADE。CASCADE模式对当前表所有索引检测。
  status: confirmed
  source_anchor: 2.4.2.6.17 L124-138
- id: m_analyze_fact_verbose
  type: example
  statement: VERBOSE指定时ANALYZE发出进度信息。
  status: confirmed
  source_anchor: 2.4.2.6.17 L146-150
