facts:
- id: m_analyze_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.17 L2-2
- id: m_analyze_fact_syntax
  type: syntax
  statement: 普通表 ANALYZE 可选 VERBOSE、单层括号列列表。
  status: confirmed
  source_anchor: 2.4.2.6.17 L72-73
- id: m_analyze_fact_multi
  type: syntax
  statement: 手动多列统计采用双层括号列列表。
  status: confirmed
  source_anchor: 2.4.2.6.17 L85-85
- id: m_analyze_fact_column_exists
  type: constraint
  statement: ANALYZE 指定列必须是已有列。
  status: confirmed
  source_anchor: 2.4.2.6.17 L155-155
- id: m_analyze_fact_owner
  type: environment
  statement: ANALYZE 需要表所有者或表 ANALYZE 权限，本批为 fixture 表创建者。
  status: confirmed
  source_anchor: 2.4.2.6.17 L63-67
- id: m_analyze_fact_transaction
  type: environment
  statement: 普通 ANALYZE 可在事务/PREPARE 中执行，不包括 VERIFY。
  status: confirmed
  source_anchor: 2.4.2.6.17 L49-50
- id: m_analyze_fact_row_storage
  type: environment
  statement: ANALYZE 收集统计信息目前仅支持行存表。
  status: confirmed
  source_anchor: 2.4.2.6.17 L151-151
- id: m_analyze_fact_rollback
  type: behavior_oracle
  statement: PG_CLASS/PG_PARTITION 和相关统计函数字段不支持统计回滚。
  status: confirmed
  source_anchor: 2.4.2.6.17 L52-58
- id: m_analyze_fact_multi_limits
  type: constraint
  statement: 多列统计根据 enable_functional_dependency 最多4或32列；系统表、全局临时表不支持。
  status: confirmed
  source_anchor: 2.4.2.6.17 L89-92
- id: m_analyze_fact_verify
  type: environment
  statement: ANALYZE VERIFY 用于异常检测，需要 RELEASE 版本；不混入普通统计清单。
  status: confirmed
  source_anchor: 2.4.2.6.17 L58-60
rules:
- id: m_analyze_rule_column_exists
  kind: requires
  expression: columns != 'm_analyze_columns_missing'
  fact_refs:
  - m_analyze_fact_column_exists
  severity: error
