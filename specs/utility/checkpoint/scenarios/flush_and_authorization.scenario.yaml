schema_version: 1
kind: "scenario"
id: "scenario_checkpoint_flush_and_authorization"
name: "CHECKPOINT flush_and_authorization"
status: "planned"
description: "仅隔离实例验证刷新语义、立即执行、管理员授权及 PDB 拒绝，不在当前阶段执行。"
factor_ref: "checkpoint"
fixture_refs: []
fact_refs:
  - "checkpoint_fact_flush"
  - "checkpoint_fact_immediate"
  - "checkpoint_fact_permission"
  - "checkpoint_fact_no_pdb"
preconditions: []
steps:
  -
    id: "checkpoint"
    action: "execute_sql"
    sql: "CHECKPOINT;"
oracles:
  -
    after_step: "checkpoint"
    kind: "review_required"
    expected: "核对刷新证据和独立权限/PDB负向分支；不能用任意错误代替。"
execution_requirements:
  - "database"
  - "same_session"
