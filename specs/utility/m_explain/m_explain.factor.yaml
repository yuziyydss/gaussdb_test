facts:
- id: m_explain_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.10.2 L2-2
- id: m_explain_fact_syntax
  type: "syntax"
  statement: 括号选项无顺序要求；另有 ANALYZE 后 VERBOSE 的顺序形式。
  status: confirmed
  source_anchor: 2.4.2.10.2 L37-57
- id: m_explain_fact_executes
  type: "behavior_oracle"
  statement: ANALYZE 实际执行目标语句；DML 会改变数据。
  status: confirmed
  source_anchor: 2.4.2.10.2 L15-19
- id: m_explain_fact_buffers
  type: "constraint"
  statement: BUFFERS 需要结合 ANALYZE。
  status: confirmed
  source_anchor: 2.4.2.10.2 L101-101
- id: m_explain_fact_format
  type: "syntax"
  statement: 输出格式可为 TEXT/XML/JSON/YAML。
  status: confirmed
  source_anchor: 2.4.2.10.2 L137-139
- id: m_explain_fact_distributed
  type: environment
  statement: DETAIL/NODES/NUM_NODES 是分布式功能，集中式禁止。
  status: confirmed
  source_anchor: 2.4.2.10.2 L22-23
- id: m_explain_fact_plan
  type: "constraint"
  statement: PLAN 开启时不能与其他选项同时使用。
  status: confirmed
  source_anchor: 2.4.2.10.2 L113-114
- id: m_explain_fact_opteval
  type: "constraint"
  statement: OPTEVAL 只能与 COSTS/VERBOSE/FORMAT 共存。
  status: confirmed
  source_anchor: 2.4.2.10.2 L156-157
- id: m_explain_fact_opteval_syntax
  type: "syntax"
  statement: OPTEVAL 接受可选布尔参数。
  status: confirmed
  source_anchor: 2.4.2.10.2 L54-54
- id: m_explain_fact_performance_gap
  type: environment
  statement: 参数说明有 PERFORMANCE，但本章产生式未列出；不猜测可执行拼写。
  status: confirmed
  source_anchor: 2.4.2.10.2 L140-140
- id: m_explain_fact_normal
  type: example
  statement: 本章 JSON/YAML 示例在 explain_perf_mode=normal 下展示。
  status: confirmed
  source_anchor: 2.4.2.10.2 L183-183
- id: m_explain_fact_purpose
  type: example
  statement: EXPLAIN显示SQL语句执行计划：扫描方式、JOIN算法、预计执行开销。ANALYZE时执行语句并显示实际统计。
  status: confirmed
  source_anchor: 2.4.2.10.2 L4-12
- id: m_explain_fact_analyze_rollback
  type: example
  statement: 分析DML不改动数据的方法：START TRANSACTION; EXPLAIN ANALYZE...; ROLLBACK。
  status: confirmed
  source_anchor: 2.4.2.10.2 L14-20
- id: m_explain_fact_audit_type
  type: example
  statement: EXPLAIN查看执行计划时，审计日志的审计类型由分析的具体SQL决定。
  status: confirmed
  source_anchor: 2.4.2.10.2 L31-32
- id: m_explain_fact_verbose
  type: example
  statement: VERBOSE boolean显示计划额外信息。TRUE为缺省。
  status: confirmed
  source_anchor: 2.4.2.10.2 L72-83
- id: m_explain_fact_costs
  type: example
  statement: COSTS boolean包括每个规划节点的估计总成本、估计行数和行宽度。TRUE为缺省。
  status: confirmed
  source_anchor: 2.4.2.10.2 L84-86
- id: m_explain_fact_cpu
  type: example
  statement: CPU boolean打印CPU使用情况，需结合ANALYZE使用。
  status: confirmed
  source_anchor: 2.4.2.10.2 L88-99
- id: m_explain_fact_timing
  type: example
  statement: TIMING boolean显示每个计划节点的实际启动时间和总消耗时间，需结合ANALYZE。
  status: confirmed
  source_anchor: 2.4.2.10.2 L102-112
- id: m_explain_fact_plan_option
  type: example
  statement: PLAN boolean以PLAN形式显示执行计划。
  status: confirmed
  source_anchor: 2.4.2.10.2 L115-126
- id: m_explain_fact_outline
  type: example
  statement: OUTLINE boolean显示计划的Outline Hint信息。
  status: confirmed
  source_anchor: 2.4.2.10.2 L127-129
- id: m_explain_fact_adaptcost
  type: example
  statement: ADAPTCOST boolean打印执行中所有相关信息。
  status: confirmed
  source_anchor: 2.4.2.10.2 L131-136
- id: m_explain_fact_blockname
  type: example
  statement: BLOCKNAME boolean显示计划块名称。
  status: confirmed
  source_anchor: 2.4.2.10.2 L102-112
- id: m_explain_fact_perf_mode
  type: environment
  statement: JSON/YAML格式输出在explain_perf_mode=normal时展示。
  status: confirmed
  source_anchor: 2.4.2.10.2 L192-203
