schema_version: 1
kind: syntax
id: syntax_m_set
name: syntax_m_set
status: needs_review
description: M 有限模型；不承诺全章覆盖或实机成功。
factor_ref: m_set
category: UTILITY
ast:
  kind: choice
  selector: form
  branches:
    m_set_form_timezone:
      kind: sequence
      items:
      - kind: literal
        text: 'SET '
      - kind: slot
        slot: scope
      - kind: literal
        text: ' TIME ZONE '
      - kind: slot
        slot: timezone
    m_set_form_user_variable:
      kind: sequence
      items:
      - kind: literal
        text: 'SET @m_set_value '
      - kind: slot
        slot: assignment_operator
      - kind: literal
        text: ' '
      - kind: slot
        slot: variable_value
    m_set_form_user_variable_list:
      kind: sequence
      items:
      - kind: literal
        text: 'SET @m_set_first '
      - kind: slot
        slot: assignment_operator
      - kind: literal
        text: ' ''first value'', @m_set_second '
      - kind: slot
        slot: assignment_operator
      - kind: literal
        text: ' '
      - kind: slot
        slot: variable_value
    m_set_form_user_variable_chain:
      kind: sequence
      items:
      - kind: literal
        text: 'SET @m_set_chain_left '
      - kind: slot
        slot: assignment_operator
      - kind: literal
        text: ' @m_set_chain_right := '
      - kind: slot
        slot: variable_value
    m_set_form_user_variable_subquery:
      kind: sequence
      items:
      - kind: literal
        text: 'SET @m_set_subquery_value '
      - kind: slot
        slot: assignment_operator
      - kind: literal
        text: ' ('
      - kind: sequence
        items:
        - kind: literal
          text: 'SELECT '
        - kind: slot
          slot: variable_value
      - kind: literal
        text: )
    m_set_form_schema_to:
      kind: sequence
      items:
      - kind: literal
        text: 'SET '
      - kind: slot
        slot: scope
      - kind: literal
        text: ' CURRENT_SCHEMA TO m_set_owned_namespace'
    m_set_form_schema_equals:
      kind: sequence
      items:
      - kind: literal
        text: 'SET '
      - kind: slot
        slot: scope
      - kind: literal
        text: ' CURRENT_SCHEMA = m_set_owned_namespace'
    m_set_form_schema_string:
      kind: sequence
      items:
      - kind: literal
        text: 'SET '
      - kind: slot
        slot: scope
      - kind: literal
        text: ' SCHEMA ''m_set_owned_namespace'''
subgrammars: {}
rendering:
  whitespace: collapse
  statement_terminator: ;
slots:
  scope:
    type: sql_fragment
    optional: true
    dimension_ref: m_set.scope
  timezone:
    type: sql_fragment
    optional: true
    dimension_ref: m_set.timezone
  form:
    type: sql_fragment
    optional: true
    dimension_ref: m_set.form
  assignment_operator:
    type: sql_fragment
    optional: true
    dimension_ref: m_set.assignment_operator
  variable_value:
    type: sql_fragment
    optional: true
    dimension_ref: m_set.variable_value
source_fact_refs:
- m_set_fact_syntax
- m_set_fact_timezone
- m_set_fact_user_variable
- m_set_fact_user_variable_subquery
- m_select::m_select_fact_from_optional
- m_select::m_select_fact_projection_expression
- m_set_fact_schema_syntax
