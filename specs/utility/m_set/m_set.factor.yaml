facts:
- id: m_set_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.16.4 L2-2
- id: m_set_fact_syntax
  type: syntax
  statement: TIME ZONE 接受 SESSION/LOCAL 与具体时区、LOCAL、DEFAULT。
  status: confirmed
  source_anchor: 2.4.2.16.4 L13-13
- id: m_set_fact_session
  type: environment
  statement: SET 缺省 SESSION；会话参数在事务回滚时撤销，提交后持续到会话结束。
  status: confirmed
  source_anchor: 2.4.2.16.4 L41-44
- id: m_set_fact_local
  type: lifecycle
  statement: SET LOCAL 只到当前事务结束；COMMIT/ROLLBACK 后恢复会话级设置。
  status: confirmed
  source_anchor: 2.4.2.16.4 L46-51
- id: m_set_fact_timezone
  type: syntax
  statement: TIME ZONE 使用有效本地时区，文档给出 PRC 缺省值。
  status: confirmed
  source_anchor: 2.4.2.16.4 L53-55
- id: m_set_fact_global
  type: constraint
  statement: 不支持用 @@global 语法修改参数值。
  status: confirmed
  source_anchor: 2.4.2.16.4 L88-89
- id: m_set_fact_charset
  type: constraint
  statement: SET NAMES 暂不支持与数据库字符集不同的 charset_name。
  status: confirmed
  source_anchor: 2.4.2.16.4 L68-69
- id: m_set_fact_schema_absent
  type: behavior_oracle
  statement: 不存在的模式使 CURRENT_SCHEMA 为空，不从此推断应报错。
  status: confirmed
  source_anchor: 2.4.2.16.4 L58-59
- id: m_set_fact_parameter_grammar
  type: open_question
  statement: 通用参数产生式 FROM CURRENT 的归属及多余右花括号需复核，不自动转义后直接输出。
  status: needs_verification
  source_anchor: 2.4.2.16.4 L29-29
- id: m_set_fact_user_variable
  type: syntax
  statement: 用户变量支持 SET @var_name := expr 与 SET @var_name = expr。
  status: confirmed
  source_anchor: 2.4.2.16.4 L23-25
- id: m_set_fact_user_variable_types
  type: constraint
  statement: 用户变量允许存储字符类型及NULL；此fixture不推断其他类型转换行为。
  status: confirmed
  source_anchor: 2.4.2.16.4 L97-97
- id: m_set_fact_user_variable_profile_gap
  type: open_question
  statement: 已有单变量字符串/NULL和两种赋值符号的有限代表；数值/二进制/其他类型转换、多变量列表、连续赋值及子查询表达式仍缺合同，实际读回未验证。
  status: needs_verification
  source_anchor: 2.4.2.16.4 L23-25
