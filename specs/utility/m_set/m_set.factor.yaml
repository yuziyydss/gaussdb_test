facts:
- id: m_set_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.16.4 L2-2
- id: m_set_fact_syntax
  type: syntax
  statement: TIME ZONE 接受 SESSION/LOCAL 与具体时区、LOCAL、DEFAULT。
  status: confirmed
  source_anchor: 2.4.2.16.4 L13-13
- id: m_set_fact_session
  type: environment
  statement: SET 缺省 SESSION；会话参数在事务回滚时撤销，提交后持续到会话结束。
  status: confirmed
  source_anchor: 2.4.2.16.4 L41-44
- id: m_set_fact_local
  type: lifecycle
  statement: SET LOCAL 只到当前事务结束；COMMIT/ROLLBACK 后恢复会话级设置。
  status: confirmed
  source_anchor: 2.4.2.16.4 L46-51
- id: m_set_fact_timezone
  type: syntax
  statement: TIME ZONE 使用有效本地时区，文档给出 PRC 缺省值。
  status: confirmed
  source_anchor: 2.4.2.16.4 L53-55
- id: m_set_fact_global
  type: constraint
  statement: 不支持用 @@global 语法修改参数值。
  status: confirmed
  source_anchor: 2.4.2.16.4 L88-89
- id: m_set_fact_charset
  type: constraint
  statement: SET NAMES 暂不支持与数据库字符集不同的 charset_name。
  status: confirmed
  source_anchor: 2.4.2.16.4 L68-69
- id: m_set_fact_schema_absent
  type: behavior_oracle
  statement: 不存在的模式使 CURRENT_SCHEMA 为空，不从此推断应报错。
  status: confirmed
  source_anchor: 2.4.2.16.4 L58-59
- id: m_set_fact_parameter_grammar
  type: open_question
  statement: 通用参数产生式 FROM CURRENT 的归属及多余右花括号需复核，不自动转义后直接输出。
  status: needs_verification
  source_anchor: 2.4.2.16.4 L29-29
- id: m_set_fact_user_variable
  type: syntax
  statement: 用户变量支持 SET @var_name := expr 与 SET @var_name = expr。
  status: confirmed
  source_anchor: 2.4.2.16.4 L23-25
- id: m_set_fact_user_variable_types
  type: constraint
  statement: 用户变量允许存储字符类型及NULL；此fixture不推断其他类型转换行为。
  status: confirmed
  source_anchor: 2.4.2.16.4 L97-97
- id: m_set_fact_user_variable_integer
  type: syntax
  statement: 用户变量表达式支持可直接或间接转为整型的表达式；本代表只选择7/-7整数文字，不推断全部类型转换、整数边界或驱动返回类型。
  status: confirmed
  source_anchor: 2.4.2.16.4 L109-109
- id: m_set_fact_user_variable_chain
  type: constraint
  statement: 连续赋值首位允许:=或=，后续赋值位只能用:=；中间的=表示比较，不是赋值。本代表只取两个变量及字符串/NULL。
  status: confirmed
  source_anchor: 2.4.2.16.4 L102-105
- id: m_set_fact_user_variable_profile_gap
  type: open_question
  statement: 已有单变量、两个独立变量列表及两个变量连续赋值的字符串/NULL有限代表，单变量另有7/-7整数文字；子查询仅单列无FROM的字符串/NULL/7/-7常量代表。更长列表/赋值链、内部等号拒绝Oracle、FROM/关联/多行子查询、任意表达式组合、其他数值/二进制/类型转换仍缺合同，实际读回未验证。
  status: needs_verification
  source_anchor: 2.4.2.16.4 L23-25
- id: m_set_fact_user_variable_subquery
  type: syntax
  statement: 用户变量expr可为子查询；此代表只取M SELECT单个常量投影且无FROM，不混入多行/关联查询。
  status: confirmed
  source_anchor: 2.4.2.16.4 L114-116
- id: m_set_fact_user_variable_subquery_result
  type: behavior_oracle
  statement: expr为子查询时，变量结果与直接查询结果一致；本场景逐步对照单列常量结果，运行期尚待校准。
  status: confirmed
  source_anchor: 2.4.2.16.4 L114-116
- id: m_set_fact_schema_syntax
  type: syntax
  statement: 设置模式支持CURRENT_SCHEMA TO/=标识符及SCHEMA字符串，并可选择SESSION/LOCAL；本代表只用已存在专属模式。
  status: confirmed
  source_anchor: 2.4.2.16.4 L16-18
- id: m_set_fact_schema_selected
  type: behavior_oracle
  statement: CURRENT_SCHEMA指定当前模式，SCHEMA字符串同义；已存在模式的选择与回滚恢复需逐步验证，不硬编码初始模式。
  status: confirmed
  source_anchor: 2.4.2.16.4 L56-62
- id: m_set_fact_schema_profile_gap
  type: open_question
  statement: 仅同一专属模式的三种拼写与三scope有限代表；DEFAULT、缺失模式空值、提交与SESSION/LOCAL交错、名称引用域和实际元数据接口仍待验证。
  status: needs_verification
  source_anchor: 2.4.2.16.4 L16-18
- id: m_set_fact_purpose
  type: example
  statement: m_set的M-Compatibility语法功能描述。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_set_fact_constraint
  type: example
  statement: m_set的M-Compatibility注意事项和限制。
  status: confirmed
  source_anchor: M-Compatibility L7-9
- id: m_set_fact_params
  type: example
  statement: m_set的参数说明。
  status: confirmed
  source_anchor: M-Compatibility L27-28
- id: m_set_fact_example
  type: example
  statement: m_set的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L119-121
