schema_version: 1
kind: "fixture"
id: "fixture_reassign_owned_owned_tables"
name: "REASSIGN OWNED owned_tables"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "reassign_owned"
requires_fixture_refs:
  - "fixture_create_role_isolated_roles"
provides:
  tables:
    -
      name: "b9_owned_a"
      persistence: "permanent"
      table_kind: "regular"
      columns:
        -
          name: "col_1"
          type: "INTEGER"
          nullable: true
        -
          name: "col_2"
          type: "INTEGER"
          nullable: true
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "CREATE TABLE b9_owned_a (col_1 INTEGER, col_2 INTEGER);"
    - "CREATE TABLE b9_owned_b (col_1 INTEGER, col_2 INTEGER);"
    - "ALTER TABLE b9_owned_a OWNER TO b9_role_a;"
    - "ALTER TABLE b9_owned_b OWNER TO b9_role_b;"
  teardown_sqls:
    - "DROP TABLE IF EXISTS b9_owned_b;"
    - "DROP TABLE IF EXISTS b9_owned_a;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
