schema_version: 1
kind: "scenario"
id: "scenario_reset_default_equivalence"
name: "RESET default_equivalence"
status: "planned"
description: "在同一个隔离配置上下文中比较 RESET 与 SET DEFAULT。"
factor_ref: "reset"
fixture_refs: []
fact_refs:
  - "reset_fact_equivalent"
  - "reset_fact_defaults"
  - "set::set_fact_default"
  - "reset_fact_alias_example"
preconditions:
  - "失败仍需 ROLLBACK；不要执行未经审查的 ALTER SESSION 扩展。"
steps:
  -
    id: "begin"
    action: "execute_sql"
    sql: "BEGIN;"
  -
    id: "reset"
    action: "execute_sql"
    sql: "RESET timezone;"
  -
    id: "reset_value"
    action: "execute_sql"
    sql: "SHOW timezone;"
  -
    id: "change"
    action: "execute_sql"
    sql: "SET timezone TO 'Europe/Rome';"
  -
    id: "set_default"
    action: "execute_sql"
    sql: "SET timezone TO DEFAULT;"
  -
    id: "set_value"
    action: "execute_sql"
    sql: "SHOW timezone;"
  -
    id: "rollback"
    action: "execute_sql"
    sql: "ROLLBACK;"
oracles:
  -
    after_step: "set_value"
    kind: "result_equals_step"
    expected: "reset_value"
execution_requirements:
  - "database"
  - "same_session"
