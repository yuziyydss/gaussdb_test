schema_version: 1
kind: "manifest"
id: "manifest_reset_targets"
name: "RESET targets"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "reset"
syntax_ref: "syntax_reset"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_reset_changed_timezone"
identifier_policy: {}
bindings:
  target:
    - "reset_target_parameter"
    - "reset_target_schema"
    - "reset_target_timezone"
    - "reset_target_isolation"
    - "reset_target_authorization"
    - "reset_target_all"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "session_ownership"
    allowed_values:
      - "exclusive_test_connection"
    fact_refs:
      - "set::set_fact_session_scope"
