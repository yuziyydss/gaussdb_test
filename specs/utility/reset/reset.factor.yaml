facts:
  -
    id: "reset_fact_defaults"
    type: "behavior_oracle"
    statement: "RESET 恢复 gaussdb.conf 描述的参数缺省值，而非自动恢复测试前的任意会话值。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "reset_fact_equivalent"
    type: "behavior_oracle"
    statement: "RESET configuration_parameter 与 SET configuration_parameter TO DEFAULT 作用相同。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "reset_fact_rollback"
    type: "lifecycle"
    statement: "RESET 的事务性与 SET 相同，事务回滚会撤销 RESET 的影响。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "reset_fact_syntax"
    type: "syntax"
    statement: "RESET 参数名、CURRENT_SCHEMA、TIME ZONE、TRANSACTION ISOLATION LEVEL、SESSION AUTHORIZATION 或 ALL；没有 LOCAL/SESSION 作用域前缀。"
    status: "confirmed"
    source_anchor: "L16-L17"
  -
    id: "reset_fact_parameter"
    type: "constraint"
    statement: "configuration_parameter 为运行时参数名称，可由 SHOW ALL 查询。"
    status: "confirmed"
    source_anchor: "L20-L22"
  -
    id: "reset_fact_parameter_domain"
    type: "open_question"
    statement: "未枚举完整可重置 GUC 名单及特殊参数限制；只生成本文 timezone 代表和列出的专用分支。"
    status: "needs_verification"
    source_anchor: "L20-L22"
  -
    id: "reset_fact_schema"
    type: "syntax"
    statement: "CURRENT_SCHEMA 指当前模式。"
    status: "confirmed"
    source_anchor: "L23-L24"
  -
    id: "reset_fact_timezone"
    type: "syntax"
    statement: "TIME ZONE 指时区。"
    status: "confirmed"
    source_anchor: "L25-L26"
  -
    id: "reset_fact_isolation"
    type: "syntax"
    statement: "TRANSACTION ISOLATION LEVEL 指事务隔离级别。"
    status: "confirmed"
    source_anchor: "L27-L28"
  -
    id: "reset_fact_authorization"
    type: "syntax"
    statement: "SESSION AUTHORIZATION 指会话用户标识符。"
    status: "confirmed"
    source_anchor: "L29-L30"
  -
    id: "reset_fact_all"
    type: "syntax"
    statement: "ALL 指全部运行时参数。"
    status: "confirmed"
    source_anchor: "L31-L32"
  -
    id: "reset_fact_rome_example"
    type: "example"
    statement: "设置 timezone 为 Europe/Rome 后 SHOW 返回 Europe/Rome 的原文例子。"
    status: "confirmed"
    source_anchor: "L35-L42"
  -
    id: "reset_fact_default_example"
    type: "example"
    statement: "原文 RESET timezone 后 SHOW 返回 PRC；不能把例子结果当作所有配置下的缺省值。"
    status: "confirmed"
    source_anchor: "L44-L51"
  -
    id: "reset_fact_alias_example"
    type: "example"
    statement: "例子列出 SET timezone TO DEFAULT 和 ALTER SESSION SET timezone TO DEFAULT。"
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "reset_fact_alter_session_gap"
    type: "open_question"
    statement: "ALTER SESSION 是例子中的相关语法，本批未提供其完整正文；不在 RESET 产生式中外推其余 ALTER SESSION 语法。"
    status: "needs_verification"
    source_anchor: "L53-L55"
