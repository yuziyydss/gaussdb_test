    id: "explain_autohint_su_body_5_5"
    section: "正文"
    source_anchor: "L5-L7"
    line_start: 5
    line_end: 7
    statement: "EXPLAIN AUTOHINT用于在正常执行EXPLAIN命令的同时将查询执行的计划信息与执 行结果存储于AUTOHINT内存上下文中，以便进行AUTOHINT特性的HINT探索与推 荐。"
    status: "open_question"
    fact_refs:
      - "explain_autohint_fact_body_5"
      - "explain_autohint_fact_runtime_contract"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "explain_autohint_su_body_10_10"
    section: "正文"
    source_anchor: "L10-L11"
    line_start: 10
    line_end: 11
    statement: "●    该语句只允许在AUTOHINT任务进行时由内核进行自动调用，用户自行调用无任 何效果，或可能会触发AUTOHINT的报错阻拦。"
    status: "mapped"
    fact_refs:
      - "explain_autohint_fact_body_10"
    atomicity: "atomic"
  -
    id: "explain_autohint_su_body_12_12"
    section: "正文"
    source_anchor: "L12-L14"
    line_start: 12
    line_end: 14
    statement: "●    AUTOHINT内存上下文中存储的数据是session级生命周期并且session隔离和用户 隔离，当前session下调用的AUTOHINT特性功能用户只能访问并调用当前 session、当前用户的数据。"
    status: "mapped"
    fact_refs:
      - "explain_autohint_fact_body_12"
    atomicity: "atomic"
