schema_version: 1
kind: "scenario"
id: "scenario_explain_autohint_documented_contracts"
name: "EXPLAIN AUTOHINT documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "explain_autohint"
fixture_refs: []
fact_refs:
  - "explain_autohint_fact_body_5"
  - "explain_autohint_fact_body_10"
  - "explain_autohint_fact_body_12"
  - "explain_autohint_fact_body_22"
  - "explain_autohint_fact_body_22_1"
  - "explain_autohint_fact_body_25"
  - "explain_autohint_fact_body_27"
  - "explain_autohint_fact_body_27_1"
  - "explain_autohint_fact_body_30"
  - "explain_autohint_fact_body_31"
  - "explain_autohint_fact_body_32"
  - "explain_autohint_fact_body_32_1"
  - "explain_autohint_fact_body_32_2"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "EXPLAIN AUTOHINT用于在正常执行EXPLAIN命令的同时将查询执行的计划信息与执 行结果存储于AUTOHINT内存上下文中，以便进行AUTOHINT特性的HINT探索与推 荐。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "●    该语句只允许在AUTOHINT任务进行时由内核进行自动调用，用户自行调用无任 何效果，或可能会触发AUTOHINT的报错阻拦。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "●    AUTOHINT内存上下文中存储的数据是session级生命周期并且session隔离和用户 隔离，当前session下调用的AUTOHINT特性功能用户只能访问并调用当前 session、当前用户的数据。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "●    statement 当前AUTOHINT任务需要进行的计划与执行结果存储的SQL语句。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "（仅支持 SELECT语句）"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "●    cache_id 当前AUTOHINT任务的任务ID，int型。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "●    exec_type 当前执行该语句所存储的结果类型。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "取值范围："
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "–     PLAN：存储计划信息。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "–     EXECUTE：存储执行结果信息。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "●    argument 当前执行该语句所需的执行参数，json格式文本。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "若exec_type参数为PLAN类型，则为当前语句所应用的HINT。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "若exec_type参数为EXECUTE类型，则为当前语句对应的执行计划的HASH值。"
oracles:
  -
    kind: "documented_behavior"
    expected: "EXPLAIN AUTOHINT用于在正常执行EXPLAIN命令的同时将查询执行的计划信息与执 行结果存储于AUTOHINT内存上下文中，以便进行AUTOHINT特性的HINT探索与推 荐。"
  -
    kind: "documented_behavior"
    expected: "●    该语句只允许在AUTOHINT任务进行时由内核进行自动调用，用户自行调用无任 何效果，或可能会触发AUTOHINT的报错阻拦。"
execution_requirements:
  - "database"
  - "same_session"
