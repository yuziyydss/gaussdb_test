facts:
  -
    id: "explain_autohint_fact_body_5"
    type: "behavior_oracle"
    statement: "EXPLAIN AUTOHINT用于在正常执行EXPLAIN命令的同时将查询执行的计划信息与执 行结果存储于AUTOHINT内存上下文中，以便进行AUTOHINT特性的HINT探索与推 荐。"
    status: "confirmed"
    source_anchor: "L5-L7"
  -
    id: "explain_autohint_fact_body_10"
    type: "behavior_oracle"
    statement: "●    该语句只允许在AUTOHINT任务进行时由内核进行自动调用，用户自行调用无任 何效果，或可能会触发AUTOHINT的报错阻拦。"
    status: "confirmed"
    source_anchor: "L10-L11"
  -
    id: "explain_autohint_fact_body_12"
    type: "constraint"
    statement: "●    AUTOHINT内存上下文中存储的数据是session级生命周期并且session隔离和用户 隔离，当前session下调用的AUTOHINT特性功能用户只能访问并调用当前 session、当前用户的数据。"
    status: "confirmed"
    source_anchor: "L12-L14"
  -
    id: "explain_autohint_fact_grammar_line_17"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：EXPLAIN AUTOHINT cache_id exec_type argument"
    status: "confirmed"
    source_anchor: "L17-L17"
  -
    id: "explain_autohint_fact_grammar_line_18"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：FOR statement ;"
    status: "confirmed"
    source_anchor: "L18-L18"
  -
    id: "explain_autohint_fact_body_22"
    type: "constraint"
    statement: "●    statement 当前AUTOHINT任务需要进行的计划与执行结果存储的SQL语句。"
    status: "confirmed"
    source_anchor: "L22-L24"
  -
    id: "explain_autohint_fact_body_22_1"
    type: "constraint"
    statement: "（仅支持 SELECT语句）"
    status: "confirmed"
    source_anchor: "L22-L24"
  -
    id: "explain_autohint_fact_body_25"
    type: "constraint"
    statement: "●    cache_id 当前AUTOHINT任务的任务ID，int型。"
    status: "confirmed"
    source_anchor: "L25-L26"
  -
    id: "explain_autohint_fact_body_27"
    type: "constraint"
    statement: "●    exec_type 当前执行该语句所存储的结果类型。"
    status: "confirmed"
    source_anchor: "L27-L29"
  -
    id: "explain_autohint_fact_body_27_1"
    type: "constraint"
    statement: "取值范围："
    status: "confirmed"
    source_anchor: "L27-L29"
  -
    id: "explain_autohint_fact_body_30"
    type: "constraint"
    statement: "–     PLAN：存储计划信息。"
    status: "confirmed"
    source_anchor: "L30-L30"
  -
    id: "explain_autohint_fact_body_31"
    type: "constraint"
    statement: "–     EXECUTE：存储执行结果信息。"
    status: "confirmed"
    source_anchor: "L31-L31"
  -
    id: "explain_autohint_fact_body_32"
    type: "constraint"
    statement: "●    argument 当前执行该语句所需的执行参数，json格式文本。"
    status: "confirmed"
    source_anchor: "L32-L35"
  -
    id: "explain_autohint_fact_body_32_1"
    type: "constraint"
    statement: "若exec_type参数为PLAN类型，则为当前语句所应用的HINT。"
    status: "confirmed"
    source_anchor: "L32-L35"
  -
    id: "explain_autohint_fact_body_32_2"
    type: "constraint"
    statement: "若exec_type参数为EXECUTE类型，则为当前语句对应的执行计划的HASH值。"
    status: "confirmed"
    source_anchor: "L32-L35"
  -
    id: "explain_autohint_fact_example_37"
    type: "example"
    statement: "示例原文片段：示例 1 --AUTOHINT执行语句为对应SQL存储计划信息。 gaussdb=# EXPLAIN AUTOHINT 2 PLAN '{\"hints\":[{\"type\": 0, \"name\": \"enable_seqscan\", \"value\": \"true\"}, {\"type\": 0, \"name\": \"enable_mergejoin\", \"value\": \"false\"}]}' FOR SELECT * FROM t1, t2 WHERE t1.id = t2.id and t1.a > 100 and t2.b < 200; --用户直接执行无效。 QUERY PLAN ------------ (0 rows)"
    status: "confirmed"
    source_anchor: "L37-L46"
  -
    id: "explain_autohint_fact_example_47"
    type: "example"
    statement: "示例原文片段：--用户直接执行被报错阻拦。 ERROR: Can not get exploration cache for cache id: 2."
    status: "confirmed"
    source_anchor: "L47-L48"
  -
    id: "explain_autohint_fact_example_51"
    type: "example"
    statement: "示例原文片段：示例 2 --AUTOHINT执行语句为对应SQL存储执行信息。 gaussdb=# EXPLAIN AUTOHINT 2 EXECUTE '{\"topology\": 740798663, \"cards\": [18936500, 10592, 9308, 9308]}' FOR SELECT * FROM t1, t2 WHERE t1.id = t2.id and t1.a > 100 and t2.b < 200; --用户直接执行无效。 QUERY PLAN ------------ (0 rows) --用户直接执行被报错阻拦。"
    status: "confirmed"
    source_anchor: "L51-L60"
  -
    id: "explain_autohint_fact_example_61"
    type: "example"
    statement: "示例原文片段：ERROR: Can not get exploration cache for cache id: 2."
    status: "confirmed"
    source_anchor: "L61-L61"
  -
    id: "explain_autohint_fact_runtime_contract"
    type: "open_question"
    statement: "仅供内核自动调用；cache_id、计划HASH及会话内部上下文不能用示例常量模拟。"
    status: "needs_verification"
    source_anchor: "L5-L7"
