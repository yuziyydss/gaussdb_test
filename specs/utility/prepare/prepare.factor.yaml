facts:
  -
    id: "prepare_fact_purpose"
    type: "lifecycle"
    statement: "PREPARE 创建服务端预备语句对象。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "prepare_fact_parse_stage"
    type: "lifecycle"
    statement: "PREPARE 阶段解析、分析和重写，EXECUTE 阶段才规划与执行。"
    status: "confirmed"
    source_anchor: "L7-L9"
  -
    id: "prepare_fact_optimization"
    type: "behavior_oracle"
    statement: "两阶段设计避免重复解析和分析；不承诺具体加速比例。"
    status: "confirmed"
    source_anchor: "L7-L9"
  -
    id: "prepare_fact_session_scope"
    type: "environment"
    statement: "预备语句在创建它的数据库会话内有效。"
    status: "confirmed"
    source_anchor: "L10-L12"
  -
    id: "prepare_fact_rollback_survival"
    type: "lifecycle"
    statement: "成功创建的预备语句不因所在事务回滚而删除。"
    status: "confirmed"
    source_anchor: "L9-L12"
  -
    id: "prepare_fact_release"
    type: "lifecycle"
    statement: "显式 DEALLOCATE 或会话结束会删除预备语句。"
    status: "confirmed"
    source_anchor: "L10-L12"
  -
    id: "prepare_fact_syntax"
    type: "syntax"
    statement: "PREPARE 名称后可有逗号分隔的参数类型列表，AS 后为目标语句。"
    status: "confirmed"
    source_anchor: "L15-L15"
  -
    id: "prepare_fact_unique_name"
    type: "constraint"
    statement: "预备语句名称须在当前会话内唯一。"
    status: "confirmed"
    source_anchor: "L21-L22"
  -
    id: "prepare_fact_duplicate_oracle"
    type: "environment"
    statement: "名称冲突的目标 SQLSTATE 未由本章给出，负向错误身份仍待校准。"
    status: "confirmed"
    source_anchor: "L21-L22"
  -
    id: "prepare_fact_datatype"
    type: "syntax"
    statement: "data_type 声明预备语句的参数类型。"
    status: "confirmed"
    source_anchor: "L23-L24"
  -
    id: "prepare_fact_statement_family"
    type: "syntax"
    statement: "statement 可选 SELECT、INSERT、UPDATE、DELETE、MERGE INTO 或 VALUES。"
    status: "confirmed"
    source_anchor: "L25-L26"
  -
    id: "prepare_fact_unknown_resolution"
    type: "constraint"
    statement: "参数解析初始按 unknown 处理；操作符和函数选择沿用类型解析章节。"
    status: "confirmed"
    source_anchor: "L29-L30"
  -
    id: "prepare_fact_resolution_gap"
    type: "environment"
    statement: "已读取操作符/函数类型解析正文；当前只生成显式 INTEGER 上下文，未建立完整重载候选选择模型。"
    status: "confirmed"
    source_anchor: "L29-L30"
