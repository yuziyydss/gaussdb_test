schema_version: 1
kind: "fixture"
id: "fixture_prepare_statements"
name: "PREPARE statements"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "prepare"
requires_fixture_refs:
  - "fixture_prepare_isolated_session"
  - "fixture_prepare_table"
provides: {}
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "PREPARE p_ps_zero AS SELECT 1 AS a;"
    - "PREPARE p_ps_one(INTEGER) AS SELECT CAST($1 AS INTEGER) AS a;"
    - "PREPARE p_ps_three(INTEGER, VARCHAR(10), VARCHAR(10)) AS INSERT INTO t_prepare_source VALUES ($1, $2, $3);"
  teardown_sqls:
    - "DEALLOCATE ALL;"
  note: "固定名称和签名的提供者；下游复用同一连接，逆拓扑先释放语句再删表；独占连接以防 ALL 波及用户语句。"
