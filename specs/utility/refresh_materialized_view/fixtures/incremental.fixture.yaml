schema_version: 1
kind: "fixture"
id: "fixture_refresh_materialized_view_incremental"
name: "REFRESH MATERIALIZED VIEW incremental"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "refresh_materialized_view"
requires_fixture_refs:
  - "fixture_create_materialized_view_source"
provides: {}
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "CREATE INCREMENTAL MATERIALIZED VIEW mv_incremental AS SELECT col_1, col_2 FROM t_mv_source;"
  teardown_sqls:
    - "DROP MATERIALIZED VIEW IF EXISTS mv_incremental CASCADE;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
