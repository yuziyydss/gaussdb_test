schema_version: 1
kind: "syntax"
id: "syntax_lock"
name: "LOCK 语法"
factor_ref: "lock"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  table_keyword:
    type: "token"
    optional: true
    dimension_ref: "lock.table_keyword"
  targets:
    type: "token"
    optional: true
    dimension_ref: "lock.targets"
  mode:
    type: "token"
    optional: true
    dimension_ref: "lock.mode"
  nowait:
    type: "token"
    optional: true
    dimension_ref: "lock.nowait"
source_fact_refs:
  - "lock_fact_target_syntax"
  - "lock_fact_mode_syntax"
  - "lock_fact_matrix_axes"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "LOCK "
    -
      kind: "slot"
      slot: "table_keyword"
    -
      kind: "literal"
      text: " "
    -
      kind: "repeat"
      slot: "targets"
      separator: ", "
      items_property: "items"
    -
      kind: "literal"
      text: " "
    -
      kind: "slot"
      slot: "mode"
    -
      kind: "literal"
      text: " "
    -
      kind: "slot"
      slot: "nowait"
