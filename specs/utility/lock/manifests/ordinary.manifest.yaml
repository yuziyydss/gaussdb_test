schema_version: 1
kind: "manifest"
id: "manifest_lock_ordinary"
name: "LOCK ordinary"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "lock"
syntax_ref: "syntax_lock"
suite_type: "positive"
strategy: "pairwise"
fixture_refs: []
identifier_policy: {}
bindings:
  table_keyword:
    - "lock_table_keyword_absent"
    - "lock_table_keyword_present"
  targets:
    - "lock_targets_one"
    - "lock_targets_two"
    - "lock_targets_only"
    - "lock_targets_star"
  mode:
    - "lock_mode_default"
    - "lock_mode_m0"
    - "lock_mode_m1"
    - "lock_mode_m2"
    - "lock_mode_m3"
    - "lock_mode_m4"
    - "lock_mode_m5"
    - "lock_mode_m6"
    - "lock_mode_m7"
  nowait:
    - "lock_nowait_wait"
    - "lock_nowait_nowait"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "target_privileges"
    allowed_values:
      - "owner"
    fact_refs:
      - "lock_fact_permission"
