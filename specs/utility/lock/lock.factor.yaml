  status: confirmed
  source_anchor: L181-L186
- id: lock_fact_ae_commands
  type: behavior_oracle
  statement: ALTER TABLE / DROP TABLE / TRUNCATE / REINDEX 自动请求 ACCESS EXCLUSIVE。
  status: confirmed
  source_anchor: L129-L129
