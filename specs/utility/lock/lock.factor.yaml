rules: []
structural_checks: []
facts:
- id: lock_fact_purpose
  type: behavior_oracle
  statement: LOCK 获取表级锁。
  status: confirmed
  source_anchor: L5-L5
- id: lock_fact_minimum
  type: behavior_oracle
  statement: 自动加锁尽量使用最小限制模式；需要稳定读取的事务可显式请求 SHARE。
  status: confirmed
  source_anchor: L6-L9
- id: lock_fact_share_writes
  type: lifecycle
  statement: SHARE 等待冲突写事务结束；获得后阻止其他写操作直至释放。
  status: confirmed
  source_anchor: L10-L14
- id: lock_fact_transaction
  type: constraint
  statement: LOCK TABLE 必须在事务块内执行，事务外报错。
  status: confirmed
  source_anchor: L17-L18
- id: lock_fact_default
  type: behavior_oracle
  statement: 省略锁模式时为 ACCESS EXCLUSIVE。
  status: confirmed
  source_anchor: L19-L19
- id: lock_fact_permission
  type: environment
  statement: ACCESS SHARE 需 SELECT 权限；其他 LOCK 形式需 UPDATE 或 DELETE 权限。
  status: confirmed
  source_anchor: L20-L21
- id: lock_fact_release
  type: lifecycle
  statement: 没有 UNLOCK TABLE，锁随事务结束释放。
  status: confirmed
  source_anchor: L22-L22
- id: lock_fact_table_level
  type: behavior_oracle
  statement: ROW 字样不表示行锁；所有 LOCK 模式都是表级，差异由冲突表决定。
  status: confirmed
  source_anchor: L23-L27
- id: lock_fact_system
  type: constraint
  statement: xc_maintenance_mode 未开启时不能对系统表请求 ACCESS EXCLUSIVE。
  status: confirmed
  source_anchor: L28-L29
- id: lock_fact_target_syntax
  type: syntax
  statement: TABLE 可省略，目标支持 ONLY 名称列表或带可选星号的名称列表。
  status: confirmed
  source_anchor: L32-L32
- id: lock_fact_mode_syntax
  type: syntax
  statement: 可选 IN 锁模式 MODE，尾部可选 NOWAIT。
  status: confirmed
  source_anchor: L33-L35
- id: lock_fact_matrix_axes
  type: syntax
  statement: 表1-384以请求/当前锁模式定义八种表级锁之间的冲突矩阵。
  status: confirmed
  source_anchor: L39-L45
- id: lock_fact_name
  type: constraint
  statement: 目标为已存在表，可模式修饰；按照声明顺序依次加锁。
  status: confirmed
  source_anchor: L81-L86
- id: lock_fact_remote
  type: environment
  statement: 远程表通过 DATABASE LINK，细节依赖本地缺失的开发指南。
  status: confirmed
  source_anchor: L89-L90
- id: lock_fact_only
  type: behavior_oracle
  statement: ONLY 仅锁指定表，否则同时锁子表。
  status: confirmed
  source_anchor: L92-L94
- id: lock_fact_access_share
  type: constraint
  statement: ACCESS SHARE 仅与 ACCESS EXCLUSIVE 冲突。
  status: confirmed
  source_anchor: L95-L96
- id: lock_fact_select_auto
  type: behavior_oracle
  statement: 普通只读查询自动请求 ACCESS SHARE。
  status: confirmed
  source_anchor: L97-L98
- id: lock_fact_row_share
  type: constraint
  statement: ROW SHARE 与 EXCLUSIVE/ACCESS EXCLUSIVE 冲突。
  status: confirmed
  source_anchor: L99-L100
- id: lock_fact_row_share_auto
  type: behavior_oracle
  statement: SELECT FOR UPDATE/SHARE 的目标自动请求 ROW SHARE，其他引用表请求 ACCESS SHARE。
  status: confirmed
  source_anchor: L101-L103
- id: lock_fact_row_exclusive_text
  type: behavior_oracle
  statement: 正文称 ROW EXCLUSIVE 允许读取但禁止修改，且 UPDATE/DELETE/INSERT 自动请求该模式；需与冲突表复核。
  status: confirmed
  source_anchor: L104-L108
- id: lock_fact_sue_effect
  type: behavior_oracle
  statement: SHARE UPDATE EXCLUSIVE 防止并发模式修改及垃圾回收。
  status: confirmed
  source_anchor: L109-L111
- id: lock_fact_sue_auto
  type: behavior_oracle
  statement: 非 FULL VACUUM、ANALYZE 与 CREATE INDEX CONCURRENTLY 自动请求 SHARE UPDATE EXCLUSIVE。
  status: confirmed
  source_anchor: L112-L113
- id: lock_fact_share_auto
  type: behavior_oracle
  statement: SHARE 允许读而禁止改，非 CONCURRENTLY CREATE INDEX 自动请求该锁。
  status: confirmed
  source_anchor: L114-L116
- id: lock_fact_sre_effect
  type: behavior_oracle
  statement: SHARE ROW EXCLUSIVE 防并发修改，正文描述为独占且单会话只能获取一次。
  status: confirmed
  source_anchor: L117-L119
- id: lock_fact_sre_auto
  type: behavior_oracle
  statement: 没有 SQL 自动请求 SHARE ROW EXCLUSIVE。
  status: confirmed
  source_anchor: L120-L120
- id: lock_fact_exclusive_effect
  type: behavior_oracle
  statement: EXCLUSIVE 仅允许并发 ACCESS SHARE。
  status: confirmed
  source_anchor: L121-L124
- id: lock_fact_exclusive_auto
  type: behavior_oracle
  statement: 用户表不自动请求 EXCLUSIVE，部分操作会在系统表请求。
  status: confirmed
  source_anchor: L125-L126
- id: lock_fact_ae_auto
  type: behavior_oracle
  statement: ACCESS EXCLUSIVE 只允许持有者事务访问表。
  status: confirmed
  source_anchor: L127-L128
- id: lock_fact_nowait
  type: behavior_oracle
  statement: NOWAIT 无法立即获取锁时退出并报错。
  status: confirmed
  source_anchor: L131-L133
- id: lock_fact_wait
  type: lifecycle
  statement: 省略 NOWAIT 时等待互斥锁释放。
  status: confirmed
  source_anchor: L134-L135
- id: lock_fact_conflict_0
  type: constraint
  statement: ACCESS SHARE 行的冲突标记（列顺序按表头）为 00000001；1=X，0=-。
  status: confirmed
  source_anchor: L47-L49
- id: lock_fact_conflict_1
  type: constraint
  statement: ROW SHARE 行的冲突标记（列顺序按表头）为 00000011；1=X，0=-。
  status: confirmed
  source_anchor: L51-L52
- id: lock_fact_conflict_2
  type: constraint
  statement: ROW EXCLUSIVE 行的冲突标记（列顺序按表头）为 00001111；1=X，0=-。
  status: confirmed
  source_anchor: L54-L56
- id: lock_fact_conflict_3
  type: constraint
  statement: SHARE UPDATE EXCLUSIVE 行的冲突标记（列顺序按表头）为 00011111；1=X，0=-。
  status: confirmed
  source_anchor: L58-L62
- id: lock_fact_conflict_4
  type: constraint
  statement: SHARE 行的冲突标记（列顺序按表头）为 00110111；1=X，0=-。
  status: confirmed
  source_anchor: L64-L64
- id: lock_fact_conflict_5
  type: constraint
  statement: SHARE ROW EXCLUSIVE 行的冲突标记（列顺序按表头）为 00111111；1=X，0=-。
  status: confirmed
  source_anchor: L66-L69
- id: lock_fact_conflict_6
  type: constraint
  statement: EXCLUSIVE 行的冲突标记（列顺序按表头）为 01111111；1=X，0=-。
  status: confirmed
  source_anchor: L71-L72
- id: lock_fact_conflict_7
  type: constraint
  statement: ACCESS EXCLUSIVE 行的冲突标记（列顺序按表头）为 11111111；1=X，0=-。
  status: confirmed
  source_anchor: L74-L77
- id: lock_fact_row_exclusive_ambiguity
  type: environment
  statement: 正文禁止修改的说法与 ROW EXCLUSIVE 互不冲突的矩阵不一致；不擅自改写其中一方。
  status: confirmed
  source_anchor: L104-L108
- id: lock_fact_same_session_ambiguity
  type: environment
  statement: 单会话只能获取一次的措辞需通过重入请求验证，不由跨事务自冲突直接推出。
  status: confirmed
  source_anchor: L117-L119
- id: lock_fact_remote_gap
  type: environment
  statement: 开发指南 DATABASE LINK 正文未提供，远程目标保留 planned。
  status: confirmed
  source_anchor: L89-L90
- id: lock_fact_transaction_error
  type: environment
  statement: 事务外错误未给 SQLSTATE，目标错误身份待验证。
  status: confirmed
  source_anchor: L17-L18
- id: lock_fact_schema_example
  type: example
  statement: 示例创建模式。
  status: confirmed
