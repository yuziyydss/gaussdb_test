facts:
- id: m_prepare_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.14.1 L2-2
- id: m_prepare_fact_syntax
  type: syntax
  statement: M 使用 PREPARE name FROM 字符串，而不是通用 AS 形式。
  status: confirmed
  source_anchor: 2.4.2.14.1 L19-19
- id: m_prepare_fact_bodies
  type: syntax
  statement: 预备 SQL 字符串允许 SELECT/INSERT/UPDATE/DELETE。
  status: confirmed
  source_anchor: 2.4.2.14.1 L27-30
- id: m_prepare_fact_body_alter_database
  type: syntax
  statement: 预备 SQL 字符串支持 ALTER [SCHEMA|DATABASE] 语句族；尚无本包有限代表测试。
  status: confirmed
  source_anchor: 2.4.2.14.1 L31-31
- id: m_prepare_fact_body_alter_relation
  type: syntax
  statement: 预备 SQL 字符串支持 ALTER [TABLE|VIEW|INDEX] 语句族；本包仅覆盖ALTER TABLE新增一个可空INTEGER列代表，ALTER VIEW和INDEX仍待补。
  status: confirmed
  source_anchor: 2.4.2.14.1 L35-35
- id: m_prepare_fact_body_alter_user
  type: syntax
  statement: 预备 SQL 字符串支持 ALTER USER 语句族；尚无本包有限代表测试。
  status: confirmed
  source_anchor: 2.4.2.14.1 L36-36
- id: m_prepare_fact_body_create_table
  type: syntax
  statement: 预备 SQL 字符串支持 CREATE TABLE 语句族；本包仅覆盖专属新模式下两INTEGER列普通新表的预备代表；不含IF NOT EXISTS、临时、分区或约束分支。
  status: confirmed
  source_anchor: 2.4.2.14.1 L37-37
- id: m_prepare_fact_body_create_user
  type: syntax
  statement: 预备 SQL 字符串支持 CREATE USER 语句族；尚无本包有限代表测试。
  status: confirmed
  source_anchor: 2.4.2.14.1 L38-38
- id: m_prepare_fact_body_create_database
  type: syntax
  statement: 预备 SQL 字符串支持 CREATE [SCHEMA|DATABASE] 语句族；本包仅覆盖CREATE SCHEMA创建新命名空间的预备代表；不含DATABASE拼写、IF NOT EXISTS、字符集或字符序选项，不是物理建库。
  status: confirmed
  source_anchor: 2.4.2.14.1 L39-39
- id: m_prepare_fact_body_drop_relation
  type: syntax
  statement: 预备 SQL 字符串支持 DROP [TABLE|VIEW|INDEX|SCHEMA|DATABASE] 语句族；本包仅覆盖独占新模式内普通TABLE PURGE、VIEW、INDEX及独占空SCHEMA的预备代表；不含DATABASE拼写、在线、级联或其他删除形态。
  status: confirmed
  source_anchor: 2.4.2.14.1 L40-40
- id: m_prepare_fact_body_drop_user
  type: syntax
  statement: 预备 SQL 字符串支持 DROP USER 语句族；尚无本包有限代表测试。
  status: confirmed
  source_anchor: 2.4.2.14.1 L41-41
- id: m_prepare_fact_body_privilege
  type: syntax
  statement: 预备 SQL 字符串支持 [GRANT|REVOKE] 语句族；尚无本包有限代表测试。
  status: confirmed
  source_anchor: 2.4.2.14.1 L42-42
- id: m_prepare_fact_body_create_index
  type: syntax
  statement: 预备 SQL 字符串支持 CREATE INDEX 语句族；本包仅覆盖普通表单个整数直接键BTREE代表，不包括分区、表达式或算法锁语义。
  status: confirmed
  source_anchor: 2.4.2.14.1 L43-43
- id: m_prepare_fact_body_commit
  type: syntax
  statement: 预备 SQL 字符串支持 COMMIT 语句族；本包仅预备同会话COMMIT；解析不提交，实际执行与回滚阶段由独立场景验证。
  status: confirmed
  source_anchor: 2.4.2.14.1 L44-44
- id: m_prepare_fact_body_truncate
  type: syntax
  statement: 预备 SQL 字符串支持 TRUNCATE TABLE 语句族；本包仅覆盖指定普通单表的 TRUNCATE TABLE PURGE 代表，不包含分区、继承或CASCADE。
  status: confirmed
  source_anchor: 2.4.2.14.1 L45-45
- id: m_prepare_fact_body_set
  type: syntax
  statement: 预备 SQL 字符串支持 SET 语句族；本包仅覆盖SET SESSION TIME ZONE PRC代表，不推断用户变量或其他参数可预备。
  status: confirmed
  source_anchor: 2.4.2.14.1 L46-46
- id: m_prepare_fact_body_create_view
  type: syntax
  statement: 预备 SQL 字符串支持 CREATE VIEW 语句族；本包仅覆盖普通表两列直接投影的新视图代表，不包括替换、FORCE或检查选项。
  status: confirmed
  source_anchor: 2.4.2.14.1 L47-47
- id: m_prepare_fact_body_analyze
  type: syntax
  statement: 预备 SQL 字符串支持 ANALYZE 语句族；本包仅覆盖指定普通行存表的 ANALYZE 代表，不包含 VERIFY 或全库分析。
  status: confirmed
  source_anchor: 2.4.2.14.1 L48-48
- id: m_prepare_fact_database_owner_limit
  type: constraint
  statement: 预备 ALTER SCHEMA/DATABASE 支持修改数据库字符集字符序，不支持修改数据库所有者。
  status: confirmed
  source_anchor: 2.4.2.14.1 L34-34
- id: m_prepare_fact_prepare_phase
  type: lifecycle
  statement: PREPARE 阶段解析、分析、重写查询，不等于已经执行预备 SQL。
  status: confirmed
  source_anchor: 2.4.2.14.1 L7-8
- id: m_prepare_fact_execute_phase
  type: lifecycle
  statement: 随后 EXECUTE 阶段对预备语句进行规划和执行。
  status: confirmed
  source_anchor: 2.4.2.14.1 L8-9
- id: m_prepare_fact_body_profile_gap
  type: open_question
  statement: 原文明示额外语句族受支持，但各子分支的真实前置条件、有限代表与目标预期尚未建模；不是判为不支持。
  status: needs_verification
  source_anchor: 2.4.2.14.1 L31-31
- id: m_prepare_fact_session
  type: environment
  statement: 预备语句会话内存活，回滚不删除；DEALLOCATE 或会话结束才释放。
  status: confirmed
  source_anchor: 2.4.2.14.1 L9-13
- id: m_prepare_fact_duplicate
  type: constraint
  statement: 不支持同名 PREPARE。
  status: confirmed
  source_anchor: 2.4.2.14.1 L16-16
- id: m_prepare_fact_variable
  type: constraint
  statement: FROM 不支持用户变量 @var_name。
  status: confirmed
  source_anchor: 2.4.2.14.1 L26-26
- id: m_prepare_fact_purpose
  type: example
  statement: 创建一个预备语句。 预备语句是服务端的对象，可以用于优化性能。在执行PREPARE语句的时候，指定的 查询被解析、分析、重写。当随后发出EXECUTE语句的时候，预备语句被规划和执
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_prepare_fact_constraint
  type: example
  statement: PREPARE语句用于创建预处理语句。同一会话中预处理语句名不能重复。
  status: confirmed
  source_anchor: M-Compatibility L15-15
- id: m_prepare_fact_params
  type: example
  statement: ●    name 预备查询标识符。 ●    string
  status: confirmed
  source_anchor: M-Compatibility L22-25
