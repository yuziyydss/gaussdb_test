schema_version: 1
kind: scenario
id: scenario_m_prepare_set_phase
name: scenario_m_prepare_set_phase
status: planned
description: M 有限模型；不承诺全章覆盖或实机成功。
factor_ref: m_prepare
fact_refs:
- m_prepare_fact_session
- m_prepare_fact_prepare_phase
- m_prepare_fact_execute_phase
- m_set::m_set_fact_session
fixture_refs:
- fixture_m_prepare_set_timezone
preconditions:
- M-Compatibility；独立隔离测试空间
steps:
- id: baseline
  sql: SHOW TimeZone;
- id: prepare
  sql: PREPARE m_prepare_stmt FROM 'SET SESSION TIME ZONE ''PRC''';
- id: after_prepare
  sql: SHOW TimeZone;
- id: execute
  sql: EXECUTE m_prepare_stmt;
- id: after_execute
  sql: SHOW TimeZone;
oracles:
- kind: manual_assertion
  expected: after_prepare与baseline一致；after_execute为PRC对应的时区语义。不要猜测SHOW的返回规范化拼写；清理ROLLBACK恢复事前参数，但仍必须显式释放预备语句。
execution_requirements:
- database_authorization
- target_oracle_calibration
- isolated_connection
- per_step_oracle
- close_case_connection
