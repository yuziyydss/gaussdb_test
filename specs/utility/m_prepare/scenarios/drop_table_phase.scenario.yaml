schema_version: 1
kind: scenario
id: scenario_m_prepare_drop_table_phase
name: scenario_m_prepare_drop_table_phase
status: planned
description: 验证PREPARE与EXECUTE的对象生命周期差异；只操作新建专属对象，仍planned且未执行。
factor_ref: m_prepare
fact_refs:
- m_prepare_fact_session
- m_prepare_fact_prepare_phase
- m_prepare_fact_execute_phase
- m_prepare_fact_body_drop_relation
- m_drop_table::m_drop_table_fact_authority
- m_drop_table::m_drop_table_fact_purge
fixture_refs:
- fixture_m_prepare_drop_table
preconditions:
- M-Compatibility；独立隔离测试空间
steps:
- id: prepare
  sql: PREPARE m_prepare_stmt FROM 'DROP TABLE m_prepare_drop_table_ns.base_table PURGE';
- id: before_execute
  sql: SELECT id,qty FROM m_prepare_drop_table_ns.base_table ORDER BY id;
- id: execute
  sql: EXECUTE m_prepare_stmt;
- id: after_execute
  action: 使用已校准目录接口，断言仅目标对象消失；同case其他资产仍存在。不得用任意查询报错替代目录Oracle。
oracles:
- kind: result_set
  step_id: before_execute
  expected:
  - - 1
    - 10
  - - 2
    - 20
- kind: manual_assertion
  step_id: after_execute
  expected: 目标对象消失且非目标资产保持；目录接口和每步结果待校准，不是已执行Oracle。
execution_requirements:
- database_authorization
- target_oracle_calibration
- isolated_connection
- per_step_oracle
- ownership_scoped_cleanup
- actual_catalog_calibration
- close_case_connection
