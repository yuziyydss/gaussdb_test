facts:
  -
    id: "set_constraints_fact_purpose"
    type: "behavior_oracle"
    statement: "设置当前事务的约束检查行为。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "set_constraints_fact_immediate"
    type: "behavior_oracle"
    statement: "IMMEDIATE 在每条语句结束检查。"
    status: "confirmed"
    source_anchor: "L6-L7"
  -
    id: "set_constraints_fact_deferred"
    type: "behavior_oracle"
    statement: "DEFERRED 在事务提交时检查；每个约束各有模式。"
    status: "confirmed"
    source_anchor: "L6-L7"
  -
    id: "set_constraints_fact_initial"
    type: "lifecycle"
    statement: "DEFERRABLE 约束按 INITIALLY 指定模式开始事务，之后可改变。"
    status: "confirmed"
    source_anchor: "L8-L11"
  -
    id: "set_constraints_fact_not_deferrable"
    type: "constraint"
    statement: "NOT DEFERRABLE 始终 IMMEDIATE，不受 SET CONSTRAINTS 影响。"
    status: "confirmed"
    source_anchor: "L8-L11"
  -
    id: "set_constraints_fact_named"
    type: "constraint"
    statement: "名称列表指向可推迟约束；同名的多个匹配约束都受影响。"
    status: "confirmed"
    source_anchor: "L12-L14"
  -
    id: "set_constraints_fact_all"
    type: "behavior_oracle"
    statement: "ALL 改变所有可推迟约束，而不是把不可推迟约束改为可推迟。"
    status: "confirmed"
    source_anchor: "L12-L14"
  -
    id: "set_constraints_fact_retroactive"
    type: "behavior_oracle"
    statement: "DEFERRED 切 IMMEDIATE 时立即检查待提交修改。"
    status: "confirmed"
    source_anchor: "L15-L18"
  -
    id: "set_constraints_fact_violation"
    type: "behavior_oracle"
    statement: "检查违反约束时 SET CONSTRAINTS 失败，约束模式不改变。"
    status: "confirmed"
    source_anchor: "L15-L18"
  -
    id: "set_constraints_fact_outside"
    type: "behavior_oracle"
    statement: "事务块外执行 SET CONSTRAINTS 没有效果，不据此声明报错。"
    status: "confirmed"
    source_anchor: "L21-L22"
  -
    id: "set_constraints_fact_syntax"
    type: "syntax"
    statement: "目标 ALL 或约束名称列表，尾部 DEFERRED 或 IMMEDIATE。"
    status: "confirmed"
    source_anchor: "L25-L25"
  -
    id: "set_constraints_fact_name"
    type: "metadata_oracle"
    statement: "约束名应存在，可从 pg_constraint 查询。"
    status: "confirmed"
    source_anchor: "L28-L30"
  -
    id: "set_constraints_fact_all_parameter"
    type: "syntax"
    statement: "ALL 为目标关键字。"
    status: "confirmed"
    source_anchor: "L31-L32"
  -
    id: "set_constraints_fact_deferred_parameter"
    type: "syntax"
    statement: "DEFERRED 为提交检查模式。"
    status: "confirmed"
    source_anchor: "L33-L34"
  -
    id: "set_constraints_fact_immediate_parameter"
    type: "syntax"
    statement: "IMMEDIATE 为语句检查模式。"
    status: "confirmed"
    source_anchor: "L35-L36"
  -
    id: "set_constraints_fact_deferred_example"
    type: "example"
    statement: "ALL DEFERRED 示例。"
    status: "confirmed"
    source_anchor: "L39-L40"
  -
    id: "set_constraints_fact_immediate_example"
    type: "example"
    statement: "ALL IMMEDIATE 示例。"
    status: "confirmed"
    source_anchor: "L42-L43"
  -
    id: "set_constraints_fact_constraint_domain"
    type: "open_question"
    statement: "有限验证 UNIQUE 约束，外键/主键及跨模式同名匹配仍需独立契约。"
    status: "needs_verification"
    source_anchor: "L12-L14"
  -
    id: "set_constraints_fact_error_identity"
    type: "open_question"
    statement: "违反约束时的 SQLSTATE 未在本章提供；保留待验证目标错误。"
    status: "needs_verification"
    source_anchor: "L15-L18"
