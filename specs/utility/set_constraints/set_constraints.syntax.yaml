schema_version: 1
kind: "syntax"
id: "syntax_set_constraints"
name: "SET CONSTRAINTS 语法"
factor_ref: "set_constraints"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "set_constraints.form"
  names:
    type: "token"
    optional: true
    dimension_ref: "set_constraints.names"
  mode:
    type: "token"
    optional: true
    dimension_ref: "set_constraints.mode"
source_fact_refs:
  - "set_constraints_fact_syntax"
  - "set_constraints_fact_all_parameter"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "SET CONSTRAINTS "
    -
      kind: "choice"
      selector: "form"
      branches:
        set_constraints_form_all:
          kind: "literal"
          text: "ALL"
        set_constraints_form_named:
          kind: "repeat"
          slot: "names"
          separator: ", "
          items_property: "items"
    -
      kind: "literal"
      text: " "
    -
      kind: "slot"
      slot: "mode"
