schema_version: 1
kind: "scenario"
id: "scenario_set_transaction_timing"
name: "SET TRANSACTION timing"
status: "planned"
description: "分别在六种首条语句之后设置当前事务隔离级别，错误身份待校准。"
factor_ref: "set_transaction"
fixture_refs: []
fact_refs:
  - "set_transaction_fact_timing"
preconditions:
  - "首条 COPY/FETCH 还需相应来源和前置对象"
steps:
  -
    id: "timing_matrix"
    action: "prepare_then_set_isolation"
    statements:
      - "SELECT"
      - "INSERT"
      - "DELETE"
      - "UPDATE"
      - "FETCH"
      - "COPY"
oracles:
  -
    after_step: "timing_matrix"
    kind: "target_error"
    oracle_status: "needs_verification"
    note: "正文没有 SQLSTATE，先获得各分支目标错误证据。"
execution_requirements:
  - "database"
  - "same_session"
