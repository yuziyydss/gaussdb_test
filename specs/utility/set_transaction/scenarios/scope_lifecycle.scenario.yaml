schema_version: 1
kind: "scenario"
id: "scenario_set_transaction_scope_lifecycle"
name: "SET TRANSACTION scope_lifecycle"
status: "planned"
description: "逐一验证 LOCAL/session/global 的影响范围与事务/连接边界。"
factor_ref: "set_transaction"
fixture_refs: []
fact_refs:
  - "set_transaction_fact_scopes"
  - "set_transaction_fact_active_required"
  - "set_transaction_fact_global_reconnect"
  - "set_transaction_fact_local"
  - "set_transaction_fact_session"
  - "set_transaction_fact_global_gate"
  - "set_transaction_fact_session_characteristics"
  - "set_transaction_fact_session_timing"
preconditions:
  - "B 模式 GLOBAL 使用获授权独占测试数据库"
steps:
  -
    id: "scope_matrix"
    action: "verify_session_scope"
    scopes:
      - "current_transaction"
      - "current_session"
      - "new_connections"
    note: "执行前保存默认值，关闭专用会话并恢复专用数据库默认值；不得对共享数据库试验 GLOBAL。"
oracles:
  -
    after_step: "scope_matrix"
    kind: "scope_visibility_matrix"
    expected: "仅目标作用域观察到配置变更"
execution_requirements:
  - "database"
  - "same_session"
