schema_version: 1
kind: "syntax"
id: "syntax_set_transaction"
name: "SET TRANSACTION 语法"
factor_ref: "set_transaction"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  scope:
    type: "token"
    optional: true
    dimension_ref: "set_transaction.scope"
  characteristic:
    type: "token"
    optional: true
    dimension_ref: "set_transaction.characteristic"
source_fact_refs:
  - "set_transaction_fact_characteristics"
  - "set_transaction_fact_syntax"
  - "set_transaction_fact_access"
ast:
  kind: "sequence"
  items:
    -
      kind: "choice"
      selector: "scope"
      branches:
        set_transaction_scope_implicit:
          kind: "literal"
          text: "SET TRANSACTION"
        set_transaction_scope_local:
          kind: "literal"
          text: "SET LOCAL TRANSACTION"
        set_transaction_scope_session:
          kind: "literal"
          text: "SET SESSION TRANSACTION"
        set_transaction_scope_global:
          kind: "literal"
          text: "SET GLOBAL TRANSACTION"
        set_transaction_scope_session_characteristics:
          kind: "literal"
          text: "SET SESSION CHARACTERISTICS AS TRANSACTION"
    -
      kind: "literal"
      text: " "
    -
      kind: "slot"
      slot: "characteristic"
