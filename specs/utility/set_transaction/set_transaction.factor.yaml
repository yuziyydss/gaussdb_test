rules: []
structural_checks: []
facts:
  -
    id: "set_transaction_fact_characteristics"
    type: "syntax"
    statement: "事务特性包括隔离级别和访问模式。"
    status: "confirmed"
    source_anchor: "L5-L7"
  -
    id: "set_transaction_fact_scopes"
    type: "environment"
    statement: "LOCAL 当前事务、SESSION 当前会话、GLOBAL 当前数据库后续会话。"
    status: "confirmed"
    source_anchor: "L5-L7"
  -
    id: "set_transaction_fact_active_required"
    type: "environment"
    statement: "当前事务设置需先 START TRANSACTION/BEGIN，否则不生效。"
    status: "confirmed"
    source_anchor: "L11-L13"
  -
    id: "set_transaction_fact_global_reconnect"
    type: "lifecycle"
    statement: "GLOBAL 设置对重新连接后的会话生效。"
    status: "confirmed"
    source_anchor: "L11-L13"
  -
    id: "set_transaction_fact_syntax"
    type: "syntax"
    statement: "五种命令前缀，后接一个隔离级别或访问模式；语法段没有属性重复记法。"
    status: "confirmed"
    source_anchor: "L16-L19"
  -
    id: "set_transaction_fact_local"
    type: "environment"
    statement: "LOCAL 仅作用于当前事务。"
    status: "confirmed"
    source_anchor: "L25-L26"
  -
    id: "set_transaction_fact_session"
    type: "environment"
    statement: "SESSION 仅作用于当前会话。"
    status: "confirmed"
    source_anchor: "L27-L28"
  -
    id: "set_transaction_fact_session_gate"
    type: "environment"
    statement: "SET SESSION TRANSACTION 需要 B 兼容模式与 b_format_behavior_compat_options=set_session_transaction，等同 SESSION CHARACTERISTICS。"
    status: "confirmed"
    source_anchor: "L29-L31"
  -
    id: "set_transaction_fact_global_gate"
    type: "environment"
    statement: "GLOBAL 限 B 模式，影响当前数据库后续连接的会话。"
    status: "confirmed"
    source_anchor: "L32-L34"
  -
    id: "set_transaction_fact_session_characteristics"
    type: "environment"
    statement: "SESSION CHARACTERISTICS 仅作用于当前会话。"
    status: "confirmed"
    source_anchor: "L35-L36"
  -
    id: "set_transaction_fact_isolation"
    type: "behavior_oracle"
    statement: "隔离级别决定并发事务的数据可见性。"
    status: "confirmed"
    source_anchor: "L37-L39"
  -
    id: "set_transaction_fact_timing"
    type: "constraint"
    statement: "首个 SELECT/INSERT/DELETE/UPDATE/FETCH/COPY 后不能再设置当前事务隔离级别。"
    status: "confirmed"
    source_anchor: "L42-L43"
  -
    id: "set_transaction_fact_session_timing"
    type: "lifecycle"
    statement: "事务块内 SESSION CHARACTERISTICS ISOLATION LEVEL 不影响当前事务，COMMIT 后生效。"
    status: "confirmed"
    source_anchor: "L44-L45"
  -
    id: "set_transaction_fact_read_committed"
    type: "behavior_oracle"
    statement: "READ COMMITTED 只读已提交数据。"
    status: "confirmed"
    source_anchor: "L47-L48"
  -
    id: "set_transaction_fact_default"
    type: "behavior_oracle"
    statement: "READ COMMITTED 是默认隔离级别。"
    status: "confirmed"
    source_anchor: "L47-L48"
  -
    id: "set_transaction_fact_read_uncommitted"
    type: "behavior_oracle"
    statement: "READ UNCOMMITTED 行为等同 READ COMMITTED。"
    status: "confirmed"
    source_anchor: "L50-L51"
  -
    id: "set_transaction_fact_repeatable"
    type: "behavior_oracle"
    statement: "REPEATABLE READ 只见事务开始前已提交数据，不见事务期间他人提交修改。"
    status: "confirmed"
    source_anchor: "L52-L54"
  -
    id: "set_transaction_fact_serializable"
    type: "behavior_oracle"
    statement: "SERIALIZABLE 在此版本等同 REPEATABLE READ，不作真正串行化承诺。"
    status: "confirmed"
    source_anchor: "L55-L56"
  -
    id: "set_transaction_fact_access"
    type: "syntax"
    statement: "访问模式为 READ WRITE 或 READ ONLY。"
    status: "confirmed"
    source_anchor: "L57-L58"
  -
    id: "set_transaction_fact_example_database"
    type: "example"
    statement: "示例在创建的 B 模式测试数据库中连接；不自动创建/切换数据库。"
    status: "confirmed"
    source_anchor: "L61-L63"
  -
    id: "set_transaction_fact_example_local"
    type: "example"
    statement: "示例事务中一次 SET LOCAL 同时设置 READ COMMITTED 与 READ ONLY 后提交。"
    status: "confirmed"
    source_anchor: "L65-L68"
  -
    id: "set_transaction_fact_example_session"
    type: "example"
    statement: "示例在 B 模式启用 GUC 后一次 SET SESSION 设置两种属性。"
    status: "confirmed"
    source_anchor: "L70-L73"
  -
    id: "set_transaction_fact_example_global"
    type: "example"
    statement: "示例 GLOBAL 同时设置两种属性，限定 B 模式。"
    status: "confirmed"
    source_anchor: "L75-L77"
  -
    id: "set_transaction_fact_combined_ambiguity"
    type: "syntax"
    statement: "示例确认LOCAL、SESSION、GLOBAL可在隔离级别后以空格连接READ ONLY；不推广为全组合矩阵。"
    status: "confirmed"
    source_anchor: "L65-L77"
