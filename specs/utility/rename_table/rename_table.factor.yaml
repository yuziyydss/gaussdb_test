facts:
  -
    id: "rename_table_fact_purpose"
    type: "lifecycle"
    statement: "单条可重命名单表/多表，不影响存储数据。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "rename_table_fact_single"
    type: "behavior_oracle"
    statement: "单表等价 ALTER TABLE RENAME。"
    status: "confirmed"
    source_anchor: "L8-L8"
  -
    id: "rename_table_fact_mixed_temp"
    type: "constraint"
    statement: "多表等价多次ALTER RENAME，但不能混合本地临时表和非本地临时表。"
    status: "confirmed"
    source_anchor: "L9-L10"
  -
    id: "rename_table_fact_syntax"
    type: "syntax"
    statement: "RENAME TABLE或TABLES 后重复旧名TO新名对。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "rename_table_fact_b_gate"
    type: "environment"
    statement: "B/5.7/s2有特殊命名行为。"
    status: "confirmed"
    source_anchor: "L18-L19"
  -
    id: "rename_table_fact_mysql_prefix"
    type: "behavior_oracle"
    statement: "该模式下新名以#MySQL50#开头且有后缀时忽略前缀。"
    status: "confirmed"
    source_anchor: "L20-L20"
  -
    id: "rename_table_fact_same_name"
    type: "behavior_oracle"
    statement: "该模式下新旧名相同不报错。"
    status: "confirmed"
    source_anchor: "L21-L21"
  -
    id: "rename_table_fact_keyword"
    type: "syntax"
    statement: "TABLE与TABLES可互换，不依赖表数量。"
    status: "confirmed"
    source_anchor: "L25-L26"
  -
    id: "rename_table_fact_pairs"
    type: "syntax"
    statement: "重复项各含旧表名 TO 新表名。"
    status: "confirmed"
    source_anchor: "L27-L31"
  -
    id: "rename_table_fact_single_example"
    type: "example"
    statement: "单表创建/重命名/清理。"
    status: "confirmed"
    source_anchor: "L34-L37"
  -
    id: "rename_table_fact_multi_example"
    type: "example"
    statement: "两表重命名和清理。"
    status: "confirmed"
    source_anchor: "L39-L43"
  -
    id: "rename_table_fact_temp_profile"
    type: "environment"
    statement: "静态RENAME TABLE代表使用普通表fixture；本地临时与非临时混合需同session受控fixture和错误Oracle，普通manifest不验证临时分支。"
    status: "confirmed"
    source_anchor: "L9-L10"
  -
    id: "rename_table_fact_compat_profile"
    type: "constraint"
    statement: "静态域只覆盖general普通重命名；B/5.7/s2特殊行为是独立能力门禁，不推广到general域。"
    status: "confirmed"
    source_anchor: "L18-L19"
