schema_version: 1
kind: "scenario"
id: "scenario_rename_table_preserve_data"
name: "RENAME TABLE preserve_data"
status: "planned"
description: "重命名后新表仍含原数据。"
factor_ref: "rename_table"
fixture_refs:
  - "fixture_rename_table_cleanup"
fact_refs:
  - "rename_table_fact_purpose"
  - "rename_table_fact_single"
preconditions: []
steps:
  -
    id: "rename"
    action: "execute_sql"
    sql: "RENAME TABLE t_rename_one TO t_renamed_one;"
  -
    id: "read"
    action: "execute_sql"
    sql: "SELECT col_1, col_2 FROM t_renamed_one ORDER BY col_1;"
oracles:
  -
    after_step: "read"
    kind: "result_rows"
    expected:
      -
        - 1
        - 2
      -
        - 3
        - 4
execution_requirements:
  - "database"
  - "same_session"
