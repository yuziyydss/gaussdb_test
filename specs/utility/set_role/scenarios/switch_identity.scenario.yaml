schema_version: 1
kind: "scenario"
id: "scenario_set_role_switch_identity"
name: "SET ROLE switch_identity"
status: "planned"
description: "先由操作员提供专用已授权角色及安全凭据，再实施 SESSION/LOCAL 切换与身份断言；禁止把密码写入生成快照。"
factor_ref: "set_role"
fixture_refs:
  - "fixture_set_role_session"
fact_refs:
  - "set_role_fact_switch_syntax"
  - "set_role_fact_membership"
  - "set_role_fact_role"
  - "set_role_fact_password"
  - "set_role_fact_purpose"
preconditions: []
steps:
  -
    id: "switch"
    action: "credential_injected_role_switch"
    note: "尚未实现凭据注入，不能直接执行。"
  -
    id: "identity"
    action: "execute_sql"
    sql: "SELECT SESSION_USER, CURRENT_USER;"
oracles:
  -
    after_step: "identity"
    kind: "review_required"
    expected: "SESSION_USER不变，CURRENT_USER为目标角色"
execution_requirements:
  - "database"
  - "same_session"
