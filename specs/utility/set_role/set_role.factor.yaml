    status: "confirmed"
    source_anchor: "L32-L33"
  -
    id: "set_role_fact_role"
    type: "environment"
    statement: "角色名必须是数据库中已存在用户名。"
    status: "confirmed"
    source_anchor: "L34-L36"
  -
    id: "set_role_fact_password"
    type: "constraint"
    statement: "密码必须符合密码命名规则。"
    status: "confirmed"
    source_anchor: "L37-L38"
  -
    id: "set_role_fact_cipher_admin"
