    status: "confirmed"
    source_anchor: "L47-L48"
  -
    id: "set_role_fact_example"
    type: "example"
    statement: "示例创建角色并切换后重置；不导入其中密码或创建用户。"
    status: "confirmed"
    source_anchor: "L52-L61"
  -
    id: "set_role_fact_switch_profile"
    type: "syntax"
    statement: "静态切换代表使用专用fixture中的一对一非秘密一次性密码；实机仍需会话成员关系、密码策略和隔离契约。"
    status: "confirmed"
    source_anchor: "L20-L21"
  -
    id: "set_role_fact_static_switch_environment"
