    note: "–      没有在字段列表中出现的每个字段，将由系统默认值，或者声明时的默认值 填充，若都没有则用NULL填充。"
  -
    id: "contract_92"
    action: "verify_documented_contract"
    note: "例如，向一个复合类型中的某些字段插入数 据，那么其他字段将是NULL。"
