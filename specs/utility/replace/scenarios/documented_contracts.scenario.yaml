    id: "contract_46"
    action: "verify_documented_contract"
    note: "timestamp                  timestamp '1970-01-01 00:00:00'"
  -
    id: "contract_47"
    action: "verify_documented_contract"
    note: "timestamp with time zone   timestamptz '1970-01-01 00:00:00'"
  -
    id: "contract_48"
    action: "verify_documented_contract"
    note: "date                       date '1970-01-01'"
  -
    id: "contract_49"
    action: "verify_documented_contract"
    note: "datea                      datea '01-JAN-70'"
  -
    id: "contract_50"
    action: "verify_documented_contract"
    note: "time                       time '00:00:00'"
  -
    id: "contract_51"
    action: "verify_documented_contract"
    note: "time with time zone        timetz '00:00:00'"
  -
    id: "contract_52"
    action: "verify_documented_contract"
    note: "smalldatetime              smalldatetime '1970-01-01 00:00:00'"
  -
    id: "contract_53"
    action: "verify_documented_contract"
    note: "● 枚举类型（ENUM）默认值为第一个元素，如果没有第一个元素，则返回NULL。"
  -
    id: "contract_54"
    action: "verify_documented_contract"
    note: "● SET数据类型仅在B模式（即sql_compatibility = 'B'）下支持，默认值为空字符 串。"
  -
    id: "contract_55"
    action: "verify_documented_contract"
    note: "● A模式数据库下（即sql_compatibility = 'A'），text、clob、blob、raw、bytea、 varchar、nvarchar2、bpchar、char、name、byteawithoutorderwithqualcol、 byteawithoutordercol类型的空串等价于NULL，在列有NOT NULL约束时，使用 引用列插入表时会报错。"
  -
    id: "contract_56"
    action: "verify_documented_contract"
    note: "● B模式数据库下（即sql_compatibility = 'B'），如果b_format_version = '5.7'， b_format_dev_version = 's1'，sql_mode不包含'strict_trans_tables、 only_full_group_by、no_zero_in_date、no_zero_date、 error_for_division_by_zero'，timestamp和datetime在NOT NULL约束下默认值 为0000-00-00 00:00:00，DATE在NOT NULL约束下默认值为0000-00-00。"
  -
    id: "contract_57"
    action: "verify_documented_contract"
    note: "● uint1、uint2、uint4、uint8数据类型仅在B模式数据库下（即sql_compatibility = 'B'）支持。"
  -
    id: "contract_58"
    action: "verify_documented_contract"
    note: "● 函数表达式的默认值，如果在解析时可计算出结果，则默认值为计算出的常量， 否则为NULL。"
  -
    id: "contract_59"
    action: "verify_documented_contract"
    note: "● 除以上场景，默认值为NULL。"
  -
    id: "contract_60"
    action: "verify_documented_contract"
    note: "● datea类型以字面量形式输入时，输入字符串需符合nls_date_format格式，否则 可能会报错或产生错误数据。"
  -
    id: "contract_61"
    action: "verify_documented_contract"
    note: "●   REPLACE ... SET语法中，后面设置的col_name依赖于前面col_name的值，如果前 面没有设置，则取默认值。"
  -
    id: "contract_62"
    action: "verify_documented_contract"
    note: "如SET f1 = f1 + 1, f2 = f1场景下，f1等于f1的默认值 （假设为0）+1，f2等于f1计算后的值1。"
  -
    id: "contract_63"
    action: "verify_documented_contract"
    note: "●   REPLACE INTO语句中支持触发行级（ROW）触发器；"
  -
    id: "contract_64"
    action: "verify_documented_contract"
    note: "对于语句级 （STATEMENT）触发器，仅支持触发INSERT STATEMENT触发器，不支持触发 DELETE STATEMENT触发器。"
  -
    id: "contract_65"
    action: "verify_documented_contract"
    note: "触发器执行顺序由实际执行流程决定："
  -
    id: "contract_66"
    action: "verify_documented_contract"
    note: "–    执行INSERT：触发BEFORE INSERT、AFTER INSERT触发器。"
  -
    id: "contract_67"
    action: "verify_documented_contract"
    note: "–    执行DELETE：触发BEFORE DELETE、AFTER DELETE触发器。"
  -
    id: "contract_68"
    action: "verify_documented_contract"
    note: "●   不支持延迟生效（DEFERRABLE）的唯一约束或主键。"
  -
    id: "contract_69"
    action: "verify_documented_contract"
    note: "●   如果表中存在多个唯一约束，如果所插入数据违反多个唯一约束， 则会删除所有 违反约束的数据，插入新的数据。"
  -
    id: "contract_70"
    action: "verify_documented_contract"
    note: "此场景需要注意，可能会误删不需要删除的数 据，该场景需要慎重操作。"
  -
    id: "contract_71"
    action: "verify_documented_contract"
    note: "●   如果插入多行，这些行均与表中同一行数据存在唯一约束冲突，则按照执行顺 序，依次进行REPLACE操作。"
  -
    id: "contract_72"
    action: "verify_documented_contract"
    note: "●   SET col_name = col_name + 1，col_name的长度不支持超过1。"
  -
    id: "contract_73"
    action: "verify_documented_contract"
    note: "如SET col_name = table_name.col_name + 1中，table_name.col_name的长度为2，形 如B.A、C.B.A、D.C.B.A格式都不支持。"
  -
    id: "contract_74"
    action: "verify_documented_contract"
    note: "●   浮点型比较时，需要注意浮点型可能存在精度丢失。"
  -
    id: "contract_75"
    action: "verify_documented_contract"
    note: "●   如果表上创建了行访问控制策略，则不支持REPLACE INTO。"
  -
    id: "contract_76"
    action: "verify_documented_contract"
    note: "●   不支持外表。"
  -
    id: "contract_77"
    action: "verify_documented_contract"
    note: "●   不支持密态表。"
  -
    id: "contract_78"
    action: "verify_documented_contract"
    note: "●   不支持内存表。"
  -
    id: "contract_79"
    action: "verify_documented_contract"
    note: "●   值替换插入。"
  -
    id: "contract_80"
    action: "verify_documented_contract"
    note: "REPLACE [ INTO ] table_name [ PARTITION ( partition_name [, ... ] ) ]"
  -
    id: "contract_81"
    action: "verify_documented_contract"
    note: "其中value格式为： { expression | DEFAULT }"
  -
    id: "contract_82"
    action: "verify_documented_contract"
    note: "●   查询替换插入。"
  -
    id: "contract_83"
    action: "verify_documented_contract"
    note: "REPLACE [ INTO ] table_name [ PARTITION ( partition_name [, ... ] ) ] [ ( col_name [, ... ]) ] query;"
  -
    id: "contract_84"
    action: "verify_documented_contract"
    note: "●   设置指定字段值。"
  -
    id: "contract_85"
    action: "verify_documented_contract"
    note: "REPLACE [ INTO ] table_name [ PARTITION ( partition_name [, ... ] ) ] SET col_name = value [, ... ];"
  -
    id: "contract_86"
    action: "verify_documented_contract"
    note: "其中value格式为： { expression | DEFAULT }"
  -
    id: "contract_87"
    action: "verify_documented_contract"
    note: "●   table_name 要插入数据的目标表名。"
  -
    id: "contract_88"
    action: "verify_documented_contract"
    note: "取值范围：已存在的表名。"
  -
    id: "contract_89"
    action: "verify_documented_contract"
    note: "●   col_name 目标表中的字段名。"
  -
    id: "contract_90"
    action: "verify_documented_contract"
    note: "–      字段名可以有子字段名或者数组下标修饰。"
  -
    id: "contract_91"
