    kind: "documented_behavior"
    expected: "在表中插入或者替换新的数据。"
  -
    kind: "documented_behavior"
    expected: "当插入的数据与原有数据存在主键或唯一键冲突时， 执行REPLACE语句会先删除原有数据，再插入新的数据。"
  -
    kind: "documented_behavior"
    expected: "●   值替换插入。"
  -
    kind: "documented_behavior"
    expected: "即通过VALUES或VALUE构造一行记录，并插入到表中。"
  -
    kind: "documented_behavior"
    expected: "●   查询替换插入。"
  -
    kind: "documented_behavior"
    expected: "通过SELECT子句返回的结果集构造一行或多行记录，并插入到表 中。"
  -
    kind: "documented_behavior"
    expected: "●   设定指定字段值。"
  -
    kind: "documented_behavior"
    expected: "与值插入类似，对于没有指定的列取其默认值。"
  -
    kind: "documented_behavior"
    expected: "●   主键/唯一键不冲突的情况下，可直接插入；"
  -
    kind: "documented_behavior"
    expected: "对于主键或唯一键冲突的情况，先删 除原有数据，再插入新的数据。"
  -
    kind: "documented_behavior"
    expected: "●   REPLACE操作返回格式为REPLACE 0 X，X表示删除和插入的操作数。"
  -
    kind: "documented_behavior"
    expected: "●   REPLACE...SELECT形式，select_list列数必须与待插入的字段数保持一致。"
  -
    kind: "documented_behavior"
