    id: "contract_93"
    action: "verify_documented_contract"
    note: "–      目标字段（col_name）可以按顺序排列。"
  -
    id: "contract_94"
    action: "verify_documented_contract"
    note: "如果没有列出任何字段，则默认全 部字段，且顺序为表声明时的顺序。"
  -
    id: "contract_95"
    action: "verify_documented_contract"
    note: "–      如果VALUE子句和QUERY中只提供了N个字段，则目标字段为前N个字段。"
  -
    id: "contract_96"
    action: "verify_documented_contract"
    note: "–      VALUE子句和QUERY提供的值在表中从左到右关联到对应列。"
  -
    id: "contract_97"
    action: "verify_documented_contract"
    note: "取值范围：已存在的字段名。"
  -
    id: "contract_98"
    action: "verify_documented_contract"
    note: "●   PARTITION ( partition_name [, ... ] ) 指定分区插入操作。"
  -
