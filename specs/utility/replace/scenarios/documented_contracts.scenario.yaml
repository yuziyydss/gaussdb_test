    action: "verify_documented_contract"
    note: "在表中插入或者替换新的数据。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "当插入的数据与原有数据存在主键或唯一键冲突时， 执行REPLACE语句会先删除原有数据，再插入新的数据。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "REPLACE语句有如下三种形式："
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "●   值替换插入。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "即通过VALUES或VALUE构造一行记录，并插入到表中。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "●   查询替换插入。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "通过SELECT子句返回的结果集构造一行或多行记录，并插入到表 中。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "●   设定指定字段值。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "与值插入类似，对于没有指定的列取其默认值。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "●   执行该语句的用户需要有表的DELETE和INSERT权限。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "●   主键/唯一键不冲突的情况下，可直接插入；"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "对于主键或唯一键冲突的情况，先删 除原有数据，再插入新的数据。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "●   REPLACE操作返回格式为REPLACE 0 X，X表示删除和插入的操作数。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "●   REPLACE...SELECT形式，select_list列数必须与待插入的字段数保持一致。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "●   REPLACE...SET语法中："
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "–   若col_name有默认值，则SET col_name = col_name + 1等同于 SET col_name = col_name的默认值 + 1；"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "–   若col_name无默认值且没有NOT NULL约束时，则SET col_name = col_name + 1等同于col_name = NULL；"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "–   若col_name无默认值但存在NOT NULL约束时，支持有默认值的数据类型 为：timestamp、timestamp with time zone、time、time with time zone、interval、tinterval、smalldatetime、date、datea（仅在A兼容性生 效）、uuid、name、point、polygon、circle、lseg、box、json、jsonb、 xml、varbit、numeric、cidr、inet、macaddr、numrange、int8range、 int4range、tsrange、tstzrange、daterange、hash16、hash32、bool、 bytea、char、bigint、int、smallint、tinyint、text、raw、blob、clob、 float4、float8、abstime、reltime、bpchar、varchar、nvarchar2、 money、uint1、uint2、uint4、uint8、set、enum。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "默认值如下表所示："
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "表 1-385"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "数据类型                           col_name默认值"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "int8、int4、int2、int1、float8、    0，如果numeric指定小数位，则显 float4、numeric、uint1、uint2、    示小数位。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "如NUMERIC(10, 3)： uint4、uint8                    0.000"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "text、clob、bpchar、varchar、      空字符串 char、nvarchar2、name、blob、 raw、varbit"
