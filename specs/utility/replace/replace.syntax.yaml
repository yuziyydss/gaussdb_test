schema_version: 1
kind: "syntax"
id: "syntax_replace"
name: "REPLACE 语法"
factor_ref: "replace"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "replace.form"
  into:
    type: "token"
    optional: true
    dimension_ref: "replace.into"
  columns:
    type: "token"
    optional: true
    dimension_ref: "replace.columns"
  rows:
    type: "token"
    optional: true
    dimension_ref: "replace.rows"
source_fact_refs:
  - "replace_fact_body_159"
  - "replace_fact_grammar_line_163"
  - "replace_fact_grammar_line_164"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "REPLACE "
    -
      kind: "slot"
      slot: "into"
    -
      kind: "literal"
      text: " fp_cs_one.b11_replace_target "
    -
      kind: "choice"
      selector: "form"
      branches:
        replace_form_values:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "columns"
            -
              kind: "literal"
              text: " VALUES "
            -
              kind: "repeat"
              slot: "rows"
              separator: ", "
              items_property: "items"
        replace_form_value:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "columns"
            -
              kind: "literal"
              text: " VALUE "
            -
              kind: "repeat"
              slot: "rows"
              separator: ", "
              items_property: "items"
        replace_form_query:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "columns"
            -
              kind: "literal"
              text: " SELECT col_1,col_2 FROM fp_cs_one.b11_replace_source"
        replace_form_set:
          kind: "literal"
          text: "SET col_1 = col_1 + 1, col_2 = col_1 + 2"
