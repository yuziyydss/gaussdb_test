facts:
  -
    id: "replace_fact_body_5"
    type: "behavior_oracle"
    statement: "在表中插入或者替换新的数据。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "replace_fact_body_5_1"
    type: "behavior_oracle"
    statement: "当插入的数据与原有数据存在主键或唯一键冲突时， 执行REPLACE语句会先删除原有数据，再插入新的数据。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "replace_fact_body_8"
    type: "constraint"
    statement: "REPLACE语句有如下三种形式："
    status: "confirmed"
