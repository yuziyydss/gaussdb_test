    type: "behavior_oracle"
    statement: "● 枚举类型（ENUM）默认值为第一个元素，如果没有第一个元素，则返回NULL。"
    status: "confirmed"
    source_anchor: "L116-L116"
  -
    id: "replace_fact_body_117"
    type: "behavior_oracle"
    statement: "● SET数据类型仅在B模式（即sql_compatibility = 'B'）下支持，默认值为空字符 串。"
    status: "confirmed"
    source_anchor: "L117-L118"
  -
    id: "replace_fact_body_119"
    type: "environment"
    statement: "● A模式数据库下（即sql_compatibility = 'A'），text、clob、blob、raw、bytea、 varchar、nvarchar2、bpchar、char、name、byteawithoutorderwithqualcol、 byteawithoutordercol类型的空串等价于NULL，在列有NOT NULL约束时，使用 引用列插入表时会报错。"
    status: "confirmed"
    source_anchor: "L119-L122"
  -
    id: "replace_fact_body_123"
    type: "environment"
    statement: "● B模式数据库下（即sql_compatibility = 'B'），如果b_format_version = '5.7'， b_format_dev_version = 's1'，sql_mode不包含'strict_trans_tables、 only_full_group_by、no_zero_in_date、no_zero_date、 error_for_division_by_zero'，timestamp和datetime在NOT NULL约束下默认值 为0000-00-00 00:00:00，DATE在NOT NULL约束下默认值为0000-00-00。"
    status: "confirmed"
    source_anchor: "L123-L127"
  -
    id: "replace_fact_body_128"
    type: "environment"
    statement: "● uint1、uint2、uint4、uint8数据类型仅在B模式数据库下（即sql_compatibility = 'B'）支持。"
    status: "confirmed"
    source_anchor: "L128-L129"
  -
    id: "replace_fact_body_130"
    type: "behavior_oracle"
    statement: "● 函数表达式的默认值，如果在解析时可计算出结果，则默认值为计算出的常量， 否则为NULL。"
    status: "confirmed"
    source_anchor: "L130-L131"
  -
    id: "replace_fact_body_132"
    type: "behavior_oracle"
    statement: "● 除以上场景，默认值为NULL。"
    status: "confirmed"
    source_anchor: "L132-L132"
  -
    id: "replace_fact_body_133"
    type: "behavior_oracle"
    statement: "● datea类型以字面量形式输入时，输入字符串需符合nls_date_format格式，否则 可能会报错或产生错误数据。"
    status: "confirmed"
    source_anchor: "L133-L134"
  -
    id: "replace_fact_body_135"
    type: "behavior_oracle"
    statement: "●   REPLACE ... SET语法中，后面设置的col_name依赖于前面col_name的值，如果前 面没有设置，则取默认值。"
    status: "confirmed"
    source_anchor: "L135-L137"
  -
    id: "replace_fact_body_135_1"
    type: "behavior_oracle"
    statement: "如SET f1 = f1 + 1, f2 = f1场景下，f1等于f1的默认值 （假设为0）+1，f2等于f1计算后的值1。"
    status: "confirmed"
    source_anchor: "L135-L137"
  -
    id: "replace_fact_body_138"
    type: "constraint"
    statement: "●   REPLACE INTO语句中支持触发行级（ROW）触发器；"
    status: "confirmed"
    source_anchor: "L138-L140"
  -
    id: "replace_fact_body_138_1"
    type: "constraint"
    statement: "对于语句级 （STATEMENT）触发器，仅支持触发INSERT STATEMENT触发器，不支持触发 DELETE STATEMENT触发器。"
    status: "confirmed"
    source_anchor: "L138-L140"
  -
    id: "replace_fact_body_138_2"
    type: "constraint"
    statement: "触发器执行顺序由实际执行流程决定："
    status: "confirmed"
    source_anchor: "L138-L140"
  -
    id: "replace_fact_body_141"
    type: "constraint"
    statement: "–    执行INSERT：触发BEFORE INSERT、AFTER INSERT触发器。"
    status: "confirmed"
    source_anchor: "L141-L141"
  -
    id: "replace_fact_body_142"
    type: "constraint"
    statement: "–    执行DELETE：触发BEFORE DELETE、AFTER DELETE触发器。"
    status: "confirmed"
    source_anchor: "L142-L142"
  -
    id: "replace_fact_body_143"
    type: "constraint"
    statement: "●   不支持延迟生效（DEFERRABLE）的唯一约束或主键。"
