rules:
  -
    id: "set_rule_settable"
    kind: "requires"
    expression: "form in ['set_form_generic', 'set_form_current'] => parameter.properties.settable == True"
    fact_refs:
      - "set_fact_not_settable"
    severity: "error"
  -
    id: "set_rule_b_timezone"
    kind: "requires"
    expression: "form == 'set_form_b_zone' => zone.properties.b_compatible == True"
    fact_refs:
      - "set_fact_b_zone"
    severity: "error"
structural_checks: []
facts:
  -
    id: "set_fact_purpose"
    type: "behavior_oracle"
    statement: "SET 修改运行时配置参数。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "set_fact_mutability"
    type: "environment"
    statement: "大多数参数可运行时设置；部分参数在服务运行或会话开始后不可修改。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "set_fact_zone_syntax"
    type: "syntax"
    statement: "SET 可选 SESSION/LOCAL 后接 TIME ZONE timezone、LOCAL 或 DEFAULT。"
    status: "confirmed"
    source_anchor: "L12-L13"
  -
    id: "set_fact_schema_syntax"
    type: "syntax"
    statement: "CURRENT_SCHEMA 使用 TO 或 =；SCHEMA 后必须为字符串名称。"
    status: "confirmed"
    source_anchor: "L15-L18"
  -
    id: "set_fact_names_syntax"
    type: "syntax"
    statement: "NAMES 接带引号字符集和可选 COLLATE，或者 DEFAULT；DEFAULT 不带 COLLATE。"
    status: "confirmed"
    source_anchor: "L20-L21"
  -
    id: "set_fact_generic_syntax"
    type: "syntax"
    statement: "普通参数支持 TO 或 = 接 value/DEFAULT，或 FROM CURRENT；后者不再带右值。"
    status: "confirmed"
    source_anchor: "L23-L25"
  -
    id: "set_fact_b_syntax"
    type: "syntax"
    statement: "B 表达式赋值前缀可省略或 SESSION、@@SESSION.、@@；参数后为 = expr/DEFAULT。"
    status: "confirmed"
    source_anchor: "L27-L29"
  -
    id: "set_fact_user_colon_syntax"
    type: "syntax"
    statement: "用户变量支持 := 赋值和逗号分隔重复赋值。"
    status: "confirmed"
    source_anchor: "L31-L32"
  -
    id: "set_fact_user_equal_syntax"
    type: "syntax"
    statement: "用户变量也支持 = 赋值和逗号分隔重复赋值。"
    status: "confirmed"
    source_anchor: "L34-L34"
  -
    id: "set_fact_xml_syntax"
    type: "syntax"
    statement: "XML OPTION 接 DOCUMENT 或 CONTENT，前可选 SESSION/LOCAL。"
    status: "confirmed"
    source_anchor: "L36-L37"
  -
    id: "set_fact_session_scope"
    type: "environment"
    statement: "SESSION 只影响当前连接；省略 SESSION/LOCAL 时默认为 SESSION。"
    status: "confirmed"
    source_anchor: "L41-L43"
  -
    id: "set_fact_session_rollback"
    type: "lifecycle"
    statement: "事务内 SET 在回滚后撤销；提交后持续到连接结束或后续 SET。"
    status: "confirmed"
    source_anchor: "L44-L45"
  -
    id: "set_fact_default"
    type: "behavior_oracle"
    statement: "DEFAULT 使用对应字段的缺省值，不等同执行前的任意值。"
    status: "confirmed"
    source_anchor: "L46-L47"
  -
    id: "set_fact_local_end"
    type: "lifecycle"
    statement: "SET LOCAL 只对当前事务有效，提交或回滚后恢复会话级设置。"
    status: "confirmed"
    source_anchor: "L48-L50"
  -
    id: "set_fact_session_then_local"
    type: "lifecycle"
    statement: "同事务先 SET 再 SET LOCAL，事务内 LOCAL 生效，提交后前面的 SESSION 设置生效。"
    status: "confirmed"
    source_anchor: "L51-L54"
  -
    id: "set_fact_zone_domain"
    type: "constraint"
    statement: "TIME ZONE 取有效本地时区，参数名 TimeZone，本文记载 DEFAULT 为 PRC。"
    status: "confirmed"
    source_anchor: "L55-L58"
  -
    id: "set_fact_b_zone"
    type: "constraint"
    statement: "B 模式禁止 -12:30 式时分时区；接受 EST、America/New_York、-12.5 等命名或小数写法。"
    status: "confirmed"
    source_anchor: "L61-L62"
  -
    id: "set_fact_schema_domain"
    type: "behavior_oracle"
    statement: "CURRENT_SCHEMA 应为已存在模式；不存在时 CURRENT_SCHEMA 值为空，不自动推导为 SQL 错误。"
    status: "confirmed"
    source_anchor: "L63-L66"
  -
    id: "set_fact_schema_string"
    type: "constraint"
    statement: "SCHEMA 等同 CURRENT_SCHEMA，但模式名使用字符串，例如 'public'。"
    status: "confirmed"
    source_anchor: "L67-L69"
  -
    id: "set_fact_names_heading"
    type: "syntax"
    statement: "NAMES 字符集、可选 COLLATE 或 DEFAULT 的参数声明。"
    status: "confirmed"
    source_anchor: "L70-L70"
  -
    id: "set_fact_collate_gate"
    type: "environment"
    statement: "指定 COLLATE 需要 B 模式且 b_format_version=5.7、b_format_dev_version=s2。"
    status: "confirmed"
    source_anchor: "L71-L72"
  -
    id: "set_fact_b_names_effect"
    type: "behavior_oracle"
    statement: "B 扩展场景 NAMES 设置 client_encoding。"
    status: "confirmed"
    source_anchor: "L73-L77"
  -
    id: "set_fact_charset_match"
    type: "constraint"
    statement: "B 字符集和字符序必须受支持，且 charset_name 暂不能不同于数据库字符集。"
    status: "confirmed"
    source_anchor: "L78-L79"
  -
    id: "set_fact_no_other_collate"
    type: "constraint"
    statement: "其他场景不支持 COLLATE 子句。"
    status: "confirmed"
    source_anchor: "L80-L80"
  -
    id: "set_fact_plain_names"
    type: "behavior_oracle"
    statement: "其他场景 NAMES 等同 SET client_encoding，取有效编码，本文默认 UTF8。"
    status: "confirmed"
    source_anchor: "L82-L86"
  -
    id: "set_fact_parameter"
    type: "constraint"
    statement: "普通参数必须可设置，可用名可由 SHOW ALL 查看；详细设置规则转引设置参数章。"
    status: "confirmed"
    source_anchor: "L87-L89"
  -
    id: "set_fact_not_settable"
    type: "constraint"
    statement: "max_datanodes 等 SHOW ALL 可见参数不能通过 SET 设置。"
    status: "confirmed"
    source_anchor: "L92-L92"
  -
    id: "set_fact_rhs"
    type: "syntax"
    statement: "value 支持字符串、标识符、数字及逗号分隔列表；DEFAULT 恢复参数默认值。"
    status: "confirmed"
    source_anchor: "L93-L95"
  -
    id: "set_fact_b_context"
