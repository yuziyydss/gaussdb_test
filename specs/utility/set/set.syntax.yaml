schema_version: 1
kind: "syntax"
id: "syntax_set"
name: "SET 语法"
factor_ref: "set"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "set.form"
  scope:
    type: "token"
    optional: true
    dimension_ref: "set.scope"
  zone:
    type: "token"
    optional: true
    dimension_ref: "set.zone"
  schema_name:
    type: "token"
    optional: true
    dimension_ref: "set.schema_name"
  quoted_schema:
    type: "token"
    optional: true
    dimension_ref: "set.quoted_schema"
  operator:
    type: "token"
    optional: true
    dimension_ref: "set.operator"
  charset:
    type: "token"
    optional: true
    dimension_ref: "set.charset"
  parameter:
    type: "token"
    optional: true
    dimension_ref: "set.parameter"
  rhs:
    type: "token"
    optional: true
    dimension_ref: "set.rhs"
  b_scope:
    type: "token"
    optional: true
    dimension_ref: "set.b_scope"
  b_expr:
    type: "token"
    optional: true
    dimension_ref: "set.b_expr"
  xml_mode:
    type: "token"
    optional: true
    dimension_ref: "set.xml_mode"
source_fact_refs:
  - "set_fact_user_colon_syntax"
  - "set_fact_user_equal_syntax"
  - "set_fact_zone_syntax"
  - "set_fact_schema_syntax"
  - "set_fact_names_syntax"
  - "set_fact_generic_syntax"
  - "set_fact_b_syntax"
  - "set_fact_xml_syntax"
  - "set_fact_rhs"
ast:
  kind: "choice"
  selector: "form"
  branches:
    set_form_zone:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "SET "
        -
          kind: "slot"
          slot: "scope"
        -
          kind: "literal"
          text: " "
        -
          kind: "literal"
          text: "TIME ZONE "
        -
          kind: "slot"
          slot: "zone"
    set_form_current_schema:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "SET "
        -
          kind: "slot"
          slot: "scope"
        -
          kind: "literal"
          text: " "
        -
          kind: "literal"
          text: "CURRENT_SCHEMA "
        -
          kind: "slot"
          slot: "operator"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "schema_name"
    set_form_schema:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "SET "
        -
          kind: "slot"
          slot: "scope"
        -
          kind: "literal"
          text: " "
        -
          kind: "literal"
          text: "SCHEMA "
        -
          kind: "slot"
          slot: "quoted_schema"
    set_form_names:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "SET "
        -
          kind: "slot"
          slot: "scope"
        -
          kind: "literal"
          text: " "
        -
          kind: "literal"
          text: "NAMES "
        -
          kind: "slot"
          slot: "charset"
    set_form_generic:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "SET "
        -
          kind: "slot"
          slot: "scope"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "parameter"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "operator"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "rhs"
    set_form_current:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "SET "
        -
          kind: "slot"
          slot: "scope"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "parameter"
        -
          kind: "literal"
          text: " FROM CURRENT"
    set_form_b_expression:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "SET "
        -
          kind: "slot"
          slot: "b_scope"
        -
          kind: "literal"
          text: "codegen_cost_threshold = "
        -
          kind: "slot"
          slot: "b_expr"
    set_form_xml:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "SET "
        -
          kind: "slot"
          slot: "scope"
        -
          kind: "literal"
          text: " "
        -
          kind: "literal"
          text: "XML OPTION "
        -
          kind: "slot"
          slot: "xml_mode"
    set_form_b_zone:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "SET "
        -
          kind: "slot"
          slot: "scope"
        -
          kind: "literal"
          text: " "
        -
          kind: "literal"
          text: "TIME ZONE "
        -
          kind: "slot"
          slot: "zone"
