schema_version: 1
kind: "manifest"
id: "manifest_set_generic"
name: "SET generic"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "set"
syntax_ref: "syntax_set"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_set_schema_transaction"
identifier_policy: {}
bindings:
  form:
    - "set_form_generic"
  scope:
    - "set_scope_implicit"
    - "set_scope_session"
    - "set_scope_local"
  operator:
    - "set_operator_to"
    - "set_operator_equal"
  parameter:
    - "set_parameter_encoding"
    - "set_parameter_date"
    - "set_parameter_path"
  rhs:
    - "set_rhs_encoding"
    - "set_rhs_date"
    - "set_rhs_path"
    - "set_rhs_default"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "session_ownership"
    allowed_values:
      - "exclusive_test_connection"
    fact_refs:
      - "set_fact_session_scope"
local_rules:
  -
    expression: "rhs.properties.target == 'any' or rhs.properties.target == parameter.properties.target"
    rationale: "本清单只将原文示例右值与其对应 GUC 配对；其他配对没有被判定为产品非法值，不要求为了局部采样约束伪造负向 Oracle。"
    fact_refs:
      - "set_fact_encoding_example"
      - "set_fact_date_example"
      - "set_fact_path_example"
