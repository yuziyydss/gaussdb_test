schema_version: 1
kind: "manifest"
id: "manifest_set_b_expression"
name: "SET b_expression"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "set"
syntax_ref: "syntax_set"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_set_b_expression_transaction"
identifier_policy: {}
bindings:
  form:
    - "set_form_b_expression"
  b_scope:
    - "set_b_scope_implicit"
    - "set_b_scope_session"
    - "set_b_scope_at"
    - "set_b_scope_session_at"
  b_expr:
    - "set_b_expr_number"
    - "set_b_expr_double"
    - "set_b_expr_default"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "session_ownership"
    allowed_values:
      - "exclusive_test_connection"
    fact_refs:
      - "set_fact_session_scope"
  -
    key: "sql_compatibility"
    allowed_values:
      - "B"
    fact_refs:
      - "set_fact_b_variables_gate"
  -
    key: "b_format_behavior_compat_options_contains"
    allowed_values:
      - "enable_set_variables"
    fact_refs:
      - "set_fact_b_variables_gate"
  -
    key: "parameter_context"
    allowed_values:
      - "user"
      - "superuser"
    fact_refs:
      - "set_fact_b_context"
