facts:
  -
    id: "clean_connection_fact_purpose"
    type: "lifecycle"
    statement: "清理指定数据库和指定用户的数据库连接。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "clean_connection_fact_all_only"
    type: "constraint"
    statement: "当前仅支持 TO ALL，不支持指定节点。"
    status: "confirmed"
    source_anchor: "L8-L8"
  -
    id: "clean_connection_fact_active"
    type: "behavior_oracle"
    statement: "只有 FORCE 模式可以清理正在使用的正常连接。"
    status: "confirmed"
    source_anchor: "L9-L9"
  -
    id: "clean_connection_fact_syntax"
    type: "syntax"
    statement: "CLEAN CONNECTION 后依次为 TO 目标和可选 FOR DATABASE、TO USER。"
    status: "confirmed"
    source_anchor: "L12-L15"
  -
    id: "clean_connection_fact_check_token"
    type: "syntax"
    statement: "CHECK 是 TO ALL 的可选参数。"
    status: "confirmed"
    source_anchor: "L21-L21"
  -
    id: "clean_connection_fact_check"
    type: "behavior_oracle"
    statement: "CHECK 在清理前检查其他会话访问，若存在则报错并停止删除数据库。"
    status: "confirmed"
    source_anchor: "L23-L25"
  -
    id: "clean_connection_fact_force"
    type: "behavior_oracle"
    statement: "TO ALL FORCE 向匹配数据库及用户的线程发 SIGTERM 并强制关闭。"
    status: "confirmed"
    source_anchor: "L26-L28"
  -
    id: "clean_connection_fact_node"
    type: "constraint"
    statement: "目标参数必选，当前只支持 TO ALL。"
    status: "confirmed"
    source_anchor: "L29-L30"
  -
    id: "clean_connection_fact_db_scope"
    type: "behavior_oracle"
    statement: "省略 FOR DATABASE 时清理所有数据库的连接。"
    status: "confirmed"
    source_anchor: "L31-L32"
  -
    id: "clean_connection_fact_database_exists"
    type: "environment"
    statement: "dbname 必须为已存在的数据库名。"
    status: "confirmed"
    source_anchor: "L33-L33"
  -
    id: "clean_connection_fact_user_scope"
    type: "behavior_oracle"
    statement: "省略 TO USER 时清理所有用户的连接。"
    status: "confirmed"
    source_anchor: "L34-L35"
  -
    id: "clean_connection_fact_user_exists"
    type: "environment"
    statement: "username 必须为已存在的用户。"
    status: "confirmed"
    source_anchor: "L36-L36"
  -
    id: "clean_connection_fact_example"
    type: "example"
    statement: "清理连接示例包含创建及删除用户、数据库；不是当前测试环境授权。"
    status: "confirmed"
    source_anchor: "L39-L48"
  -
    id: "clean_connection_fact_scope_profile"
    type: "open_question"
    statement: "未生成省略数据库、可能影响所有数据库的变体；需要独占实例与显式执行审批。"
    status: "needs_verification"
    source_anchor: "L31-L32"
  -
