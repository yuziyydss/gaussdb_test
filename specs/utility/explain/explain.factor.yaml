dimensions:
  statement:
    description: 受控且可回滚的目标语句
    classes:
    - id: explain_statement_select_class
      meaning: select
      values:
      - id: explain_statement_select
        render: SELECT col_1, col_2 FROM t_explain_source WHERE col_1 > 0
        representative: true
        validity: valid
        fact_refs:
        - explain_fact_statement
        fixture_refs:
        - fixture_explain_transaction
    - id: explain_statement_insert_class
      meaning: insert
      values:
      - id: explain_statement_insert
        render: INSERT INTO t_explain_source (col_1, col_2) VALUES (5, 6)
        representative: true
        validity: valid
        fact_refs:
        - explain_fact_rollback
        fixture_refs:
        - fixture_explain_transaction
    - id: explain_statement_update_class
      meaning: update
      values:
      - id: explain_statement_update
        render: UPDATE t_explain_source SET col_2 = 8 WHERE col_1 = 1
        representative: true
        validity: valid
        fact_refs:
        - explain_fact_rollback
        fixture_refs:
        - fixture_explain_transaction
    - id: explain_statement_delete_class
      meaning: delete
      values:
      - id: explain_statement_delete
        render: DELETE FROM t_explain_source WHERE col_1 = 1
        representative: true
        validity: valid
        fact_refs:
        - explain_fact_rollback
        fixture_refs:
        - fixture_explain_transaction
    default_value_id: explain_statement_select
  form:
