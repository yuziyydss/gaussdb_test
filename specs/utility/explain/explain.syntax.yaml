schema_version: 1
kind: "syntax"
id: "syntax_explain"
name: "EXPLAIN 语法"
factor_ref: "explain"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "explain.form"
  analyze:
    type: "token"
    optional: true
    dimension_ref: "explain.analyze"
  verbose:
    type: "token"
    optional: true
    dimension_ref: "explain.verbose"
  costs:
    type: "token"
    optional: true
    dimension_ref: "explain.costs"
  format:
    type: "token"
    optional: true
    dimension_ref: "explain.format"
  resource:
    type: "token"
    optional: true
    dimension_ref: "explain.resource"
  legacy:
    type: "token"
    optional: true
    dimension_ref: "explain.legacy"
  statement:
    type: "token"
    optional: true
    dimension_ref: "explain.statement"
source_fact_refs:
  - "explain_fact_syntax_options"
  - "explain_fact_syntax_analyze"
  - "explain_fact_syntax_basic"
  - "explain_fact_syntax_costs"
  - "explain_fact_syntax_cpu"
  - "explain_fact_syntax_detail"
  - "explain_fact_syntax_execution"
  - "explain_fact_syntax_timing"
  - "explain_fact_syntax_plan"
  - "explain_fact_syntax_blockname"
  - "explain_fact_syntax_more"
  - "explain_fact_syntax_adaptcost"
  - "explain_fact_syntax_format"
  - "explain_fact_syntax_opteval"
  - "explain_fact_syntax_legacy"
  - "explain_fact_statement"
  - "explain_fact_format"
  - "explain_fact_opteval_default"
  - "explain_fact_option_true_default"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "EXPLAIN "
    -
      kind: "choice"
      selector: "form"
      branches:
        explain_form_options:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "("
            -
              kind: "slot"
              slot: "analyze"
            -
              kind: "literal"
              text: ", "
            -
              kind: "slot"
              slot: "verbose"
            -
              kind: "literal"
              text: ", "
            -
              kind: "slot"
              slot: "costs"
            -
              kind: "literal"
              text: ", "
            -
              kind: "slot"
              slot: "format"
            -
              kind: "optional"
              selector: "resource"
              enabled_values:
                - "explain_resource_cpu"
                - "explain_resource_detail"
                - "explain_resource_buffers"
                - "explain_resource_timing"
              item:
                kind: "sequence"
                items:
                  -
                    kind: "literal"
                    text: ", "
                  -
                    kind: "slot"
                    slot: "resource"
            -
              kind: "literal"
              text: ") "
        explain_form_legacy:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "legacy"
            -
              kind: "literal"
              text: " "
        explain_form_performance:
          kind: "literal"
          text: "PERFORMANCE "
    -
      kind: "slot"
      slot: "statement"
