schema_version: 1
kind: "manifest"
id: "manifest_explain_options"
name: "EXPLAIN options"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "explain"
syntax_ref: "syntax_explain"
suite_type: "positive"
strategy: "pairwise"
fixture_refs: []
identifier_policy: {}
bindings:
  form:
    - "explain_form_options"
  statement:
    - "explain_statement_select"
    - "explain_statement_insert"
    - "explain_statement_update"
    - "explain_statement_delete"
  analyze:
    - "explain_analyze_false"
    - "explain_analyze_implicit"
    - "explain_analyze_true"
    - "explain_analyze_analyse"
  verbose:
    - "explain_verbose_false"
    - "explain_verbose_true"
  costs:
    - "explain_costs_false"
    - "explain_costs_true"
  format:
    - "explain_format_text"
    - "explain_format_xml"
    - "explain_format_json"
    - "explain_format_yaml"
  resource:
    - "explain_resource_none"
    - "explain_resource_cpu"
    - "explain_resource_detail"
    - "explain_resource_buffers"
    - "explain_resource_timing"
local_rules:
  - expression: "analyze != 'explain_analyze_false' or resource == 'explain_resource_none'"
    rationale: ANALYZE FALSE不执行语句，资源选项需独立执行合同；不是正向组合。
    fact_refs: [explain_fact_rollback]

expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "session_ownership"
    allowed_values:
      - "exclusive_test_connection"
    fact_refs:
      - "explain_fact_rollback"
