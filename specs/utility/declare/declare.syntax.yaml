schema_version: 1
kind: "syntax"
id: "syntax_declare"
name: "DECLARE 语法"
factor_ref: "declare"
category: "UTILITY"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "declare.form"
  cursor_name:
    type: "token"
    optional: true
    dimension_ref: "declare.cursor_name"
  binary:
    type: "token"
    optional: true
    dimension_ref: "declare.binary"
  scroll:
    type: "token"
    optional: true
    dimension_ref: "declare.scroll"
  hold:
    type: "token"
    optional: true
    dimension_ref: "declare.hold"
  query_form:
    type: "token"
    optional: true
    dimension_ref: "declare.query_form"
  projection:
    type: "token"
    optional: true
    dimension_ref: "declare.projection"
  value_rows:
    type: "token"
    optional: true
    dimension_ref: "declare.value_rows"
  declarations:
    type: "token"
    optional: true
    dimension_ref: "declare.declarations"
source_fact_refs:
  - "declare_fact_purpose"
  - "declare_fact_scope"
  - "declare_fact_cursor_syntax"
  - "declare_fact_anonymous_syntax"
  - "declare_fact_name"
  - "declare_fact_query"
  - "declare_fact_declarations"
  - "declare_fact_execution"
ast:
  kind: "choice"
  selector: "form"
  branches:
    declare_form_cursor:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "DECLARE "
        -
          kind: "slot"
          slot: "cursor_name"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "binary"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "scroll"
        -
          kind: "literal"
          text: " CURSOR "
        -
          kind: "slot"
          slot: "hold"
        -
          kind: "literal"
          text: " FOR "
        -
          kind: "ref"
          ref: "query"
    declare_form_anonymous:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "DECLARE "
        -
          kind: "slot"
          slot: "declarations"
        -
          kind: "literal"
          text: " BEGIN dbe_output.print_line(num); END"
subgrammars:
  query:
    kind: "choice"
    selector: "query_form"
    branches:
      declare_query_form_select:
        kind: "sequence"
        items:
          -
            kind: "literal"
            text: "SELECT "
          -
            kind: "slot"
            slot: "projection"
          -
            kind: "literal"
            text: " FROM t_cursor_source ORDER BY col_1"
      declare_query_form_values:
        kind: "sequence"
        items:
          -
            kind: "literal"
            text: "VALUES "
          -
            kind: "repeat"
            slot: "value_rows"
            separator: ", "
            items_property: "items"
