rules: []
structural_checks: []
facts:
  -
    id: "declare_fact_purpose"
    type: "syntax"
    statement: "DECLARE 包含游标定义和匿名块声明两种用途。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "declare_fact_scope"
    type: "syntax"
    statement: "本节主要介绍游标；匿名块用法交叉参见 BEGIN。"
    status: "confirmed"
    source_anchor: "L8-L8"
  -
    id: "declare_fact_context"
    type: "lifecycle"
    statement: "游标为查询上下文区域的句柄，过程可借它控制上下文状态。"
    status: "confirmed"
    source_anchor: "L10-L11"
  -
    id: "declare_fact_text"
    type: "behavior_oracle"
    statement: "默认返回文本；FETCH 可返回文本或二进制，由客户端按格式处理。"
    status: "confirmed"
    source_anchor: "L13-L16"
  -
    id: "declare_fact_transaction"
    type: "environment"
    statement: "游标命令只能在事务块中使用。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "declare_fact_binary_example"
    type: "example"
    statement: "二进制传输整数 1 的示例为四字节大端形式；文本展示与二进制处理成本不同。"
    status: "confirmed"
    source_anchor: "L20-L24"
  -
    id: "declare_fact_cursor_syntax"
    type: "syntax"
    statement: "游标 DECLARE 依次包含名称、可选 BINARY、可选 NO SCROLL、CURSOR、可选 HOLD、FOR query。"
    status: "confirmed"
    source_anchor: "L27-L29"
  -
    id: "declare_fact_anonymous_syntax"
    type: "syntax"
    statement: "匿名块包含可选 DECLARE 声明、BEGIN 执行体和 END；独立行 / 为客户端提交形式。"
    status: "confirmed"
    source_anchor: "L34-L39"
  -
    id: "declare_fact_name"
    type: "syntax"
    statement: "游标名称须符合标识符规范；本包只选择安全固定名称。"
    status: "confirmed"
    source_anchor: "L45-L47"
  -
    id: "declare_fact_binary"
    type: "syntax"
    statement: "BINARY 选择二进制返回格式。"
    status: "confirmed"
    source_anchor: "L48-L49"
  -
    id: "declare_fact_no_scroll"
    type: "constraint"
    statement: "NO SCROLL 游标不能倒序检索数据行。"
    status: "confirmed"
    source_anchor: "L50-L52"
  -
    id: "declare_fact_scroll_plan"
    type: "environment"
    statement: "省略 NO SCROLL 时，是否支持倒序检索由执行计划决定。"
    status: "confirmed"
    source_anchor: "L53-L54"
  -
    id: "declare_fact_hold_default"
    type: "lifecycle"
    statement: "未指定 WITH/WITHOUT HOLD 时默认为 WITHOUT HOLD。"
    status: "confirmed"
    source_anchor: "L56-L58"
  -
    id: "declare_fact_hold"
    type: "lifecycle"
    statement: "WITH HOLD 允许游标在创建事务结束后继续使用；回滚例外需结合 CLOSE 正文。"
    status: "confirmed"
    source_anchor: "L59-L59"
  -
    id: "declare_fact_without_hold"
    type: "lifecycle"
    statement: "WITHOUT HOLD 游标在事务结束时自动关闭。"
    status: "confirmed"
    source_anchor: "L60-L61"
  -
    id: "declare_fact_materialize"
    type: "lifecycle"
    statement: "WITH HOLD 在事务结束时缓存全部数据，大结果可能耗时。"
    status: "confirmed"
    source_anchor: "L67-L68"
  -
    id: "declare_fact_query"
    type: "syntax"
    statement: "游标查询由 SELECT 或 VALUES 子句提供。"
    status: "confirmed"
    source_anchor: "L70-L72"
  -
    id: "declare_fact_declarations"
    type: "syntax"
    statement: "匿名块声明包含变量名和变量类型。"
    status: "confirmed"
    source_anchor: "L73-L74"
  -
    id: "declare_fact_execution"
    type: "syntax"
    statement: "匿名块执行体可调用已经存在的函数。"
    status: "confirmed"
    source_anchor: "L75-L77"
  -
    id: "declare_fact_example_table"
    type: "example"
    statement: "示例准备两列整数表和十行数据。"
    status: "confirmed"
    source_anchor: "L81-L84"
  -
    id: "declare_fact_example_declare"
    type: "example"
    statement: "在事务内创建有序游标。"
    status: "confirmed"
    source_anchor: "L86-L88"
  -
    id: "declare_fact_example_fetch"
    type: "example"
    statement: "向前 FETCH 3 返回三行 (1,1)、(2,2)、(3,3)。"
    status: "confirmed"
    source_anchor: "L90-L97"
  -
    id: "declare_fact_example_close"
    type: "example"
    statement: "先关闭游标，再结束事务。"
    status: "confirmed"
    source_anchor: "L99-L101"
  -
    id: "declare_fact_example_drop"
    type: "example"
    statement: "最后删除源表。"
    status: "confirmed"
    source_anchor: "L103-L104"
  -
    id: "declare_fact_example_block"
    type: "example"
    statement: "匿名块声明 num=10 并打印该变量。"
    status: "confirmed"
    source_anchor: "L106-L112"
  -
    id: "declare_fact_query_gap"
    type: "constraint"
    statement: "静态域只覆盖一层SELECT与两行VALUES代表；通用表达式、递归查询和完整类型域不进入本批静态域。"
    status: "confirmed"
    source_anchor: "L70-L72"
  -
    id: "declare_fact_block_gap"
    type: "constraint"
    statement: "静态匿名块代表只实现固定整数声明与打印样例；完整声明列表、函数调用域和更深过程结构不进入本批静态域。"
    status: "confirmed"
    source_anchor: "L34-L39"
  -
    id: "declare_fact_reverse_gap"
    type: "constraint"
    statement: "静态DECLARE代表不执行FETCH/MOVE；反向禁用行为由导出约束保留，DECLARE单句不验证反向失败或错误身份。"
    status: "confirmed"
    source_anchor: "L50-L52"
exported_fact_refs:
