  - "fixture_declare_no_scroll_cursor"
  - "fixture_declare_two_cursors"
  - "fixture_declare_positioned_cursor"
scenario_refs:
  - "scenario_declare_forward"
  - "scenario_declare_hold_commit"
  - "scenario_declare_binary_format"
  - "scenario_declare_reverse_policy"
  - "scenario_declare_query_domain"
