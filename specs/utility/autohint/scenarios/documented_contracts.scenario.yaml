preconditions:
  - "super或管理员权限须单独验证；历史结果作用域、SQL身份和归属未校准前，仅保留planned，不凭新Schema推定隔离。"
  - "ANALYZE会探索，TEST会实际运行原查询和推荐查询；须核SELECT的表/函数副作用、并发/CPU/内存/I/O预算。MEMSIZE小于32768会退为不限额0，且依赖enable_memory_limit，不能把小值当安全限额。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "启用AUTOHINT用于指定SQL探索Hint组合，并输出能提升当前SQL执行速度的推荐 Hint组合。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "●   仅支持SELECT语句，并且需要使用者拥有super权限或管理员权限。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "●   支持的多种选项中，除ANALYZE选项外，使用其他选项时需将其置于括号内，例 如：AUTOHINT (VERBOSE) statement。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "●   使用AUTOHINT为执行SQL进行Hint推荐，支持多种选项，对选项顺序无要求。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "AUTOHINT [ ( option [, ...] ) ] statement;"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "其中选项option子句的语法为。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "ANALYZE [ boolean ] | VERBOSE [ boolean ] | SQLPATCH [ boolean ] | TEST [ boolean ] | DEBUG [ boolean ] | WORKERS [ int ] | MEMSIZE [ int ] | IOLIMITS [ int ]"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "●   statement 指定进行Hint推荐的SQL语句（仅支持SELECT语句）。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "若SQL语句已经自带Hint，AUTOHINT将会无视已有的Hint进行推荐。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "例如，对 于语句SELECT /*+IndexScan(t1)*/* FROM t1, t2 where t1.id = t2.id and t1.a > 20;，使用AUTOHINT进行推荐后，得到的推荐结果是基于语句SELECT * FROM t1, t2 where t1.id = t2.id and t1.a > 20;的推荐结果，而非在已有IndexScan(t1) 的基础上进行的进一步推荐。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "●   ANALYZE boolean 在进行Hint推荐前首先进行Hint探索，若关闭则根据历史Hint探索记录直接对当 前SQL进行Hint推荐。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "取值范围："
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "–   TRUE（缺省值）：在推荐前进行HINT探索。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "–   FALSE：不进行HINT探索。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "●   VERBOSE boolean 显示Hint探索与推荐过程的额外信息。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "取值范围："
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "–   TRUE（缺省值）：显示额外信息。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "–   FALSE：不显示。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "●   SQLPATCH boolean 推荐Hint后输出相应的SQLPATCH指令。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "取值范围："
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "–   TRUE（缺省值）：输出SQLPATCH指令。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "–   FALSE：不输出。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "●   TEST boolean 推荐Hint后，分别执行初始查询和应用Hint后的查询来验证推荐结果，并输出实 际计划执行时间。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "取值范围："
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "–   TRUE（缺省值）：进行推荐结果验证并输出验证结果。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "–   FALSE：不进行验证。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "●   DEBUG boolean 输出相对于VERBOSE选项更多的细节信息，包括每轮探索时的初始计划树及执行 时间，并打印每轮探索结束后得到的探索子图，以及最终合并后总的探索图。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "取值范围："
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "–   TRUE（缺省值）：输出细节信息。"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "–   FALSE：不输出。"
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "●   WORKERS int 设置AutoHint在验证Hint时的最大的并发验证任务数量。"
  -
    id: "contract_31"
    action: "verify_documented_contract"
    note: "取值范围：2 ~ 当前环境CPU核数（当设置的值超过当前环境CPU核数时，将被自 动调整为当前环境CPU核数）。"
  -
    id: "contract_32"
    action: "verify_documented_contract"
    note: "默认值：当前环境CPU核数/3（向下取整），若该值小于2，则会被调整为2。"
  -
    id: "contract_33"
    action: "verify_documented_contract"
    note: "●   MEMSIZE int 设置AUTOHINT在验证Hint时，单个验证任务所能占用的内存大小上限。"
  -
    id: "contract_34"
    action: "verify_documented_contract"
    note: "取值范围：0 ~ 2147483647，单位kB。"
  -
    id: "contract_35"
    action: "verify_documented_contract"
    note: "如果设置的值大于32768（即32MB）， 当任务执行时所使用内存超过该值时，将终止该任务。"
  -
    id: "contract_36"
    action: "verify_documented_contract"
    note: "如果设置的值小于32768 （即32M），将设置为默认值0，此时不会限制任务执行的内存使用。"
  -
    id: "contract_37"
    action: "verify_documented_contract"
    note: "默认值：0"
  -
    id: "contract_38"
    action: "verify_documented_contract"
    note: "若需要使用该选项，需要开启GUC参数enable_memory_limit，否则该选项不生效。"
  -
    id: "contract_39"
    action: "verify_documented_contract"
    note: "●    IOLIMITS int 设置AUTOHINT在验证Hint时，单个验证任务每秒触发I/O的次数上限。"
  -
    id: "contract_40"
    action: "verify_documented_contract"
    note: "取值范围：0 ~ 1073741823，单位万次。"
  -
    id: "contract_41"
    action: "verify_documented_contract"
    note: "如果设置值为0，此时不会根据该值限 制任务执行的I/O使用上限。"
  -
    id: "contract_42"
    action: "verify_documented_contract"
    note: "默认值：0"
