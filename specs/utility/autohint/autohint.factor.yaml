dimensions:
  options:
    description: "关闭探索的ANALYZE选项"
    classes:
      -
        id: "autohint_options_analyze_false_class"
        meaning: "analyze_false"
        values:
          -
            id: "autohint_options_analyze_false"
            render: "ANALYZE FALSE"
            representative: true
            validity: "valid"
            fact_refs:
              - "autohint_fact_body_42"
              - "autohint_fact_body_47"
    default_value_id: "autohint_options_analyze_false"
  query:
    description: "无表SELECT静态查询"
    classes:
      -
        id: "autohint_query_select_one_class"
        meaning: "select_one"
        values:
          -
            id: "autohint_query_select_one"
            render: "SELECT 1"
            representative: true
            validity: "valid"
            fact_refs:
              - "autohint_fact_body_31"
    default_value_id: "autohint_query_select_one"
rules: []
structural_checks: []
facts:
  -
    id: "autohint_fact_body_5"
    type: "constraint"
    statement: "启用AUTOHINT用于指定SQL探索Hint组合，并输出能提升当前SQL执行速度的推荐 Hint组合。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "autohint_fact_body_10"
    type: "environment"
    statement: "●   仅支持SELECT语句，并且需要使用者拥有super权限或管理员权限。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "autohint_fact_body_11"
    type: "constraint"
    statement: "●   支持的多种选项中，除ANALYZE选项外，使用其他选项时需将其置于括号内，例 如：AUTOHINT (VERBOSE) statement。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "autohint_fact_body_16"
    type: "constraint"
    statement: "●   使用AUTOHINT为执行SQL进行Hint推荐，支持多种选项，对选项顺序无要求。"
    status: "confirmed"
    source_anchor: "L16-L17"
  -
    id: "autohint_fact_body_16_1"
    type: "constraint"
    statement: "AUTOHINT [ ( option [, ...] ) ] statement;"
    status: "confirmed"
    source_anchor: "L16-L17"
  -
    id: "autohint_fact_body_19"
    type: "constraint"
    statement: "其中选项option子句的语法为。"
    status: "confirmed"
    source_anchor: "L19-L27"
  -
    id: "autohint_fact_body_19_1"
    type: "constraint"
    statement: "ANALYZE [ boolean ] | VERBOSE [ boolean ] | SQLPATCH [ boolean ] | TEST [ boolean ] | DEBUG [ boolean ] | WORKERS [ int ] | MEMSIZE [ int ] | IOLIMITS [ int ]"
    status: "confirmed"
    source_anchor: "L19-L27"
  -
    id: "autohint_fact_body_31"
    type: "constraint"
    statement: "●   statement 指定进行Hint推荐的SQL语句（仅支持SELECT语句）。"
    status: "confirmed"
    source_anchor: "L31-L32"
  -
    id: "autohint_fact_body_36"
    type: "constraint"
    statement: "若SQL语句已经自带Hint，AUTOHINT将会无视已有的Hint进行推荐。"
    status: "confirmed"
    source_anchor: "L36-L40"
  -
    id: "autohint_fact_body_36_1"
    type: "constraint"
    statement: "例如，对 于语句SELECT /*+IndexScan(t1)*/* FROM t1, t2 where t1.id = t2.id and t1.a > 20;，使用AUTOHINT进行推荐后，得到的推荐结果是基于语句SELECT * FROM t1, t2 where t1.id = t2.id and t1.a > 20;的推荐结果，而非在已有IndexScan(t1) 的基础上进行的进一步推荐。"
    status: "confirmed"
    source_anchor: "L36-L40"
  -
    id: "autohint_fact_body_42"
    type: "constraint"
    statement: "●   ANALYZE boolean 在进行Hint推荐前首先进行Hint探索，若关闭则根据历史Hint探索记录直接对当 前SQL进行Hint推荐。"
    status: "confirmed"
    source_anchor: "L42-L45"
  -
    id: "autohint_fact_body_42_1"
    type: "constraint"
    statement: "取值范围："
    status: "confirmed"
    source_anchor: "L42-L45"
  -
    id: "autohint_fact_body_46"
    type: "behavior_oracle"
    statement: "–   TRUE（缺省值）：在推荐前进行HINT探索。"
    status: "confirmed"
    source_anchor: "L46-L46"
  -
    id: "autohint_fact_body_47"
    type: "constraint"
    statement: "–   FALSE：不进行HINT探索。"
    status: "confirmed"
    source_anchor: "L47-L47"
  -
    id: "autohint_fact_body_48"
    type: "constraint"
    statement: "●   VERBOSE boolean 显示Hint探索与推荐过程的额外信息。"
    status: "confirmed"
    source_anchor: "L48-L50"
  -
    id: "autohint_fact_body_48_1"
    type: "constraint"
    statement: "取值范围："
    status: "confirmed"
    source_anchor: "L48-L50"
  -
    id: "autohint_fact_body_51"
    type: "behavior_oracle"
    statement: "–   TRUE（缺省值）：显示额外信息。"
    status: "confirmed"
    source_anchor: "L51-L51"
  -
    id: "autohint_fact_body_52"
    type: "constraint"
    statement: "–   FALSE：不显示。"
    status: "confirmed"
    source_anchor: "L52-L52"
  -
    id: "autohint_fact_body_53"
    type: "constraint"
    statement: "●   SQLPATCH boolean 推荐Hint后输出相应的SQLPATCH指令。"
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "autohint_fact_body_53_1"
    type: "constraint"
    statement: "取值范围："
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "autohint_fact_body_56"
    type: "behavior_oracle"
    statement: "–   TRUE（缺省值）：输出SQLPATCH指令。"
    status: "confirmed"
    source_anchor: "L56-L56"
  -
    id: "autohint_fact_body_57"
    type: "constraint"
    statement: "–   FALSE：不输出。"
    status: "confirmed"
    source_anchor: "L57-L57"
  -
    id: "autohint_fact_body_58"
    type: "behavior_oracle"
    statement: "●   TEST boolean 推荐Hint后，分别执行初始查询和应用Hint后的查询来验证推荐结果，并输出实 际计划执行时间。"
    status: "confirmed"
    source_anchor: "L58-L61"
  -
    id: "autohint_fact_body_58_1"
    type: "behavior_oracle"
    statement: "取值范围："
    status: "confirmed"
    source_anchor: "L58-L61"
  -
    id: "autohint_fact_body_62"
    type: "behavior_oracle"
    statement: "–   TRUE（缺省值）：进行推荐结果验证并输出验证结果。"
    status: "confirmed"
    source_anchor: "L62-L62"
  -
    id: "autohint_fact_body_63"
    type: "constraint"
    statement: "–   FALSE：不进行验证。"
    status: "confirmed"
    source_anchor: "L63-L63"
  -
    id: "autohint_fact_body_64"
    type: "constraint"
    statement: "●   DEBUG boolean 输出相对于VERBOSE选项更多的细节信息，包括每轮探索时的初始计划树及执行 时间，并打印每轮探索结束后得到的探索子图，以及最终合并后总的探索图。"
    status: "confirmed"
    source_anchor: "L64-L67"
  -
    id: "autohint_fact_body_64_1"
    type: "constraint"
    statement: "取值范围："
    status: "confirmed"
    source_anchor: "L64-L67"
  -
    id: "autohint_fact_body_68"
    type: "behavior_oracle"
    statement: "–   TRUE（缺省值）：输出细节信息。"
    status: "confirmed"
    source_anchor: "L68-L68"
  -
    id: "autohint_fact_body_69"
    type: "constraint"
    statement: "–   FALSE：不输出。"
    status: "confirmed"
    source_anchor: "L69-L69"
  -
    id: "autohint_fact_body_70"
    type: "behavior_oracle"
    statement: "●   WORKERS int 设置AutoHint在验证Hint时的最大的并发验证任务数量。"
    status: "confirmed"
    source_anchor: "L70-L74"
  -
    id: "autohint_fact_body_70_1"
    type: "behavior_oracle"
    statement: "取值范围：2 ~ 当前环境CPU核数（当设置的值超过当前环境CPU核数时，将被自 动调整为当前环境CPU核数）。"
    status: "confirmed"
    source_anchor: "L70-L74"
  -
    id: "autohint_fact_body_70_2"
    type: "behavior_oracle"
    statement: "默认值：当前环境CPU核数/3（向下取整），若该值小于2，则会被调整为2。"
    status: "confirmed"
    source_anchor: "L70-L74"
  -
    id: "autohint_fact_body_75"
    type: "constraint"
    statement: "●   MEMSIZE int 设置AUTOHINT在验证Hint时，单个验证任务所能占用的内存大小上限。"
    status: "confirmed"
    source_anchor: "L75-L76"
  -
    id: "autohint_fact_body_78"
    type: "behavior_oracle"
    statement: "取值范围：0 ~ 2147483647，单位kB。"
    status: "confirmed"
    source_anchor: "L78-L81"
  -
    id: "autohint_fact_body_78_1"
    type: "behavior_oracle"
    statement: "如果设置的值大于32768（即32MB）， 当任务执行时所使用内存超过该值时，将终止该任务。"
    status: "confirmed"
    source_anchor: "L78-L81"
  -
    id: "autohint_fact_body_78_2"
    type: "behavior_oracle"
    statement: "如果设置的值小于32768 （即32M），将设置为默认值0，此时不会限制任务执行的内存使用。"
    status: "confirmed"
    source_anchor: "L78-L81"
  -
    id: "autohint_fact_body_78_3"
    type: "behavior_oracle"
    statement: "默认值：0"
    status: "confirmed"
    source_anchor: "L78-L81"
  -
    id: "autohint_fact_body_84"
    type: "environment"
    statement: "若需要使用该选项，需要开启GUC参数enable_memory_limit，否则该选项不生效。"
    status: "confirmed"
    source_anchor: "L84-L84"
  -
    id: "autohint_fact_body_85"
    type: "behavior_oracle"
    statement: "●    IOLIMITS int 设置AUTOHINT在验证Hint时，单个验证任务每秒触发I/O的次数上限。"
    status: "confirmed"
    source_anchor: "L85-L89"
  -
    id: "autohint_fact_body_85_1"
    type: "behavior_oracle"
    statement: "取值范围：0 ~ 1073741823，单位万次。"
    status: "confirmed"
    source_anchor: "L85-L89"
  -
    id: "autohint_fact_body_85_2"
    type: "behavior_oracle"
    statement: "如果设置值为0，此时不会根据该值限 制任务执行的I/O使用上限。"
    status: "confirmed"
    source_anchor: "L85-L89"
  -
    id: "autohint_fact_body_85_3"
    type: "behavior_oracle"
    statement: "默认值：0"
    status: "confirmed"
    source_anchor: "L85-L89"
  -
    id: "autohint_fact_example_91"
    type: "example"
    statement: "示例原文片段：示例 1 使用AUTOHINT为慢SQL语句推荐Hint。以JOB数据集中的语句为例。 --导入JOB数据集，使用ANALYZE选项为02a查询进行Hint探索推荐。 gaussdb=# AUTOHINT ANALYZE SELECT MIN(t.title) AS movie_title FROM company_name AS cn, keyword AS k, movie_companies AS mc, movie_keyword AS mk, title AS t WHERE cn.country_code ='[de]'"
    status: "confirmed"
    source_anchor: "L91-L100"
  -
    id: "autohint_fact_example_101"
    type: "example"
    statement: "示例原文片段：AND k.keyword ='character-name-in-title' AND cn.id = mc.company_id AND mc.movie_id = t.id AND t.id = mk.movie_id AND mk.keyword_id = k.id AND mc.movie_id = mk.movie_id; --得到Hint推荐结果与预期提升。 gaussdb=# AUTOHINT --------------------------------------------------------"
    status: "confirmed"
    source_anchor: "L101-L110"
  -
    id: "autohint_fact_example_111"
    type: "example"
    statement: "示例原文片段：Recommended hintset: MergeJoin(@sel$1 k@sel$1 mk@sel$1 mc@sel$1 cn@sel$1)"
    status: "confirmed"
    source_anchor: "L111-L112"
  -
    id: "autohint_fact_example_114"
    type: "example"
    statement: "示例原文片段：Expected boost: planning:   0% execution: 50% overall:  50% (7 rows)"
    status: "confirmed"
    source_anchor: "L114-L118"
  -
    id: "autohint_fact_runtime_contract"
    type: "environment"
    statement: "静态AUTOHINT代表使用ANALYZE FALSE且不执行查询；探索执行计划、TEST执行、历史写入、耗时预算和查询级历史恢复需专用环境，普通manifest不验证推荐行为。"
    status: "confirmed"
    source_anchor: "L42-L47; L58-L63; L70-L89"

  -
    id: "autohint_fact_memory_exact_boundary"
    type: "constraint"
    statement: "静态域不生成MEMSIZE边界值；32768相等场景与0的资源上限语义保留为来源限制，不猜测边界行为。"
    status: "confirmed"
    source_anchor: "L78-L81"

