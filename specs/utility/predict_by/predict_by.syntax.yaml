schema_version: 1
kind: "syntax"
id: "syntax_predict_by"
name: "PREDICT BY 语法"
factor_ref: "predict_by"
category: "UTILITY"
status: "ready"
description: "静态语法代表复用原文输入表；训练模型、特征契约与预测行为仍单独留账。"
production: "SELECT PREDICT BY {model_name} (FEATURES {feature_expressions}) FROM {source_table}"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  model_name:
    type: "token"
    dimension_ref: "predict_by.model_name"
    optional: false
  feature_expressions:
    type: "token"
    dimension_ref: "predict_by.feature_expressions"
    optional: false
  source_table:
    type: "token"
    dimension_ref: "predict_by.source_table"
    optional: false
source_fact_refs:
  - "predict_by_fact_grammar_line_11"
