schema_version: 1
kind: "syntax"
id: "syntax_predict_by"
name: "PREDICT BY 语法"
factor_ref: "predict_by"
category: "UTILITY"
status: "draft"
description: "PREDICT BY是表达式而不是独立可执行语句；需要训练时特征顺序/数量/类型契约及真实模型fixture，不能用任意SELECT列替换。"
production: "SELECT PREDICT BY {model_name} (FEATURES {feature_expressions}) FROM {source_table}"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  model_name:
    type: "token"
    optional: false
  feature_expressions:
    type: "token"
    optional: false
  source_table:
    type: "token"
    optional: false
source_fact_refs:
  - "predict_by_fact_grammar_line_11"
