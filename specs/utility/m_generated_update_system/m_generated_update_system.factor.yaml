  status: confirmed
  source_anchor: 2.4.2.11.1 L5-6
- id: m_generated_update_system_fact_upgrade
  type: environment
  statement: 仅支持升级中通过OM调用；upgrade_mode非零且application_name为OM。
  status: confirmed
  source_anchor: 2.4.2.11.1 L9-10
- id: m_generated_update_system_fact_initial_user
  type: environment
  statement: 只有初始用户有权限；不将普通SYSADMIN身份视为等价。
  status: confirmed
  source_anchor: 2.4.2.11.1 L11-11
- id: m_generated_update_system_fact_om_contract
  type: environment
  statement: 静态M命令代表只证明固定语法；OM升级阶段准备、初始身份核验和前置恢复需权威集成测试环境，普通manifest不执行OM升级。
  status: confirmed
  source_anchor: 2.4.2.11.1 L9-10
- id: m_generated_update_system_fact_artifact_contract
  type: environment
  statement: 静态M命令代表不生成回滚脚本文件；脚本路径、命名、归属、内容Oracle和部分失败清理需专用环境，普通manifest不验证产物。
  status: confirmed
  source_anchor: 2.4.2.11.1 L5-6
- id: m_generated_update_system_fact_constraint
  type: example
  statement: 此语句仅支持升级中通过OM调用，即在GUC参数upgrade_mode不为0且GUC参 只有初始用户有权限执行此语句。
  status: confirmed
  source_anchor: M-Compatibility L8-8
