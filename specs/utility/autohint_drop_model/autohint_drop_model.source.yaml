    id: "autohint_drop_model_su_example_23_23"
    section: "示例"
    source_anchor: "L23-L32"
    line_start: 23
    line_end: 32
    statement: "示例原文片段：使用AUTOHINT DROP MODEL删除指定SQL的Hint历史探索结果。 gaussdb=# AUTOHINT DROP MODEL SELECT MIN(t.title) AS movie_title FROM company_name AS cn, keyword AS k, movie_companies AS mc, movie_keyword AS mk, title AS t WHERE cn.country_code ='[de]' AND k.keyword ='character-name-in-title' AND cn.id = mc.company_id"
    status: "mapped"
    fact_refs:
      - "autohint_drop_model_fact_example_23"
    atomicity: "atomic"
    atomicity_rationale: "L23–32：示例原文连续片段，不由其中列表或操作推导新的产品规则。"
  -
    id: "autohint_drop_model_su_example_33_33"
    section: "示例"
    source_anchor: "L33-L40"
    line_start: 33
    line_end: 40
    statement: "示例原文片段：AND mc.movie_id = t.id AND t.id = mk.movie_id AND mk.keyword_id = k.id AND mc.movie_id = mk.movie_id; --删除成功。 AUTOHINT: 1 MODEL REMOVED --若无该SQL的历史探索结果，删除失败。 AUTOHINT: 0 MODELS REMOVE"
    status: "mapped"
