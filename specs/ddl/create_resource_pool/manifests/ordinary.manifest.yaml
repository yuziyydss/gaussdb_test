schema_version: 1
kind: "manifest"
id: "manifest_create_resource_pool_ordinary"
name: "CREATE RESOURCE POOL ordinary"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "create_resource_pool"
syntax_ref: "syntax_create_resource_pool"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_create_resource_pool_new_pool"
identifier_policy: {}
bindings:
  options:
    - "create_resource_pool_options_default"
    - "create_resource_pool_options_high"
    - "create_resource_pool_options_medium"
    - "create_resource_pool_options_mem_zero"
    - "create_resource_pool_options_mem_one"
    - "create_resource_pool_options_mem_max"
    - "create_resource_pool_options_active_unlimited"
    - "create_resource_pool_options_active_disabled"
    - "create_resource_pool_options_active_one"
    - "create_resource_pool_options_io_priority_low"
    - "create_resource_pool_options_io_priority_medium"
    - "create_resource_pool_options_io_priority_high"
    - "create_resource_pool_options_io_priority_none"
    - "create_resource_pool_options_memory_min"
    - "create_resource_pool_options_memory"
    - "create_resource_pool_options_memory_max"
    - "create_resource_pool_options_precedence"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "resource_pool_admin"
    allowed_values:
      - "true"
    fact_refs:
      - "create_resource_pool_fact_privilege"
  -
    key: "upgrade_in_progress"
    allowed_values:
      - "false"
    fact_refs:
      - "create_resource_pool_fact_no_upgrade"
  -
    key: "multitenant"
    allowed_values:
      - "false"
    fact_refs:
      - "create_resource_pool_fact_no_multitenant"
  -
    key: "io_control_scope"
    allowed_values:
      - "complex_jobs_only"
    fact_refs:
      - "create_resource_pool_fact_complex_jobs"
  -
    key: "default_timeshare_groups_available"
    allowed_values:
      - "High,Medium"
    fact_refs:
      - "create_resource_pool_fact_timeshare"
