schema_version: 1
kind: "scenario"
id: "scenario_create_resource_pool_documented_contracts"
name: "CREATE RESOURCE POOL documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "create_resource_pool"
fixture_refs: []
fact_refs:
  - "create_resource_pool_fact_purpose"
  - "create_resource_pool_fact_privilege"
  - "create_resource_pool_fact_no_upgrade"
  - "create_resource_pool_fact_no_multitenant"
  - "create_resource_pool_fact_name"
  - "create_resource_pool_fact_group"
  - "create_resource_pool_fact_group_case"
  - "create_resource_pool_fact_timeshare"
  - "create_resource_pool_fact_active_statements"
  - "create_resource_pool_fact_dop"
  - "create_resource_pool_fact_memory"
  - "create_resource_pool_fact_mem_percent"
  - "create_resource_pool_fact_memory_precedence"
  - "create_resource_pool_fact_io_priority"
  - "create_resource_pool_fact_complex_jobs"
  - "create_resource_pool_fact_max_worker"
  - "create_resource_pool_fact_connections"
  - "create_resource_pool_fact_connection_capacity"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "创建资源池并关联控制组。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "仅SYSADMIN或初始用户可创建。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "升级期间不支持。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "多租场景不支持，应使用RESOURCE_MANAGER高级包。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "资源池名唯一且符合标识符规范。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "需指定符合规则的控制组名称。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "控制组名大小写敏感。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "Rush/High/Medium/Low指DefaultClass中的对应Timeshare组。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "最大并发语句范围[-1,2147483647]，-1不限制，0禁止执行。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "最大DOP正整数1..2147483647。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "MEMORY_LIMIT为1KB..2047GB字符串。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "普通场景MEM_PERCENT范围0..100，默认0。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "MEM_PERCENT和MEMORY_LIMIT同时设置时仅MEM_PERCENT生效。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "创建章节称I/O利用率达到50%时控制重I/O作业，等级Low/Medium/High，None不控制且为默认。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "I/O设置仅适用复杂作业：批量导入、大于约500MB/DN复杂查询及VACUUM FULL等。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "MAX_WORKER仅用于扩容重分布的表内插入并发度。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "MAX_CONNECTIONS限制资源池最大连接。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "所有池连接限额之和不可超过进程GUC max_connections。"
oracles:
  -
    kind: "documented_behavior"
    expected: "MEM_PERCENT和MEMORY_LIMIT同时设置时仅MEM_PERCENT生效。"
  -
    kind: "documented_behavior"
    expected: "创建章节称I/O利用率达到50%时控制重I/O作业，等级Low/Medium/High，None不控制且为默认。"
execution_requirements:
  - "database"
  - "same_session"
