schema_version: 1
kind: "manifest"
id: "manifest_create_masking_policy_functions"
name: "CREATE MASKING POLICY functions"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "create_masking_policy"
syntax_ref: "syntax_create_masking_policy"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_create_masking_policy_source_labels"
identifier_policy: {}
bindings:
  function:
    - "create_masking_policy_function_maskall"
    - "create_masking_policy_function_randommasking"
    - "create_masking_policy_function_creditcardmasking"
    - "create_masking_policy_function_basicemailmasking"
    - "create_masking_policy_function_fullemailmasking"
    - "create_masking_policy_function_shufflemasking"
    - "create_masking_policy_function_alldigitsmasking"
  labels:
    - "create_masking_policy_labels_one"
    - "create_masking_policy_labels_two"
  filter:
    - "create_masking_policy_filter_none"
    - "create_masking_policy_filter_app"
    - "create_masking_policy_filter_ip"
  enabled:
    - "create_masking_policy_enabled_none"
    - "create_masking_policy_enabled_enable"
    - "create_masking_policy_enabled_disable"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "security_policy_admin"
    allowed_values:
      - "true"
    fact_refs:
      - "create_masking_policy_fact_privilege"
  -
    key: "enable_security_policy"
    allowed_values:
      - "on"
    fact_refs:
      - "create_masking_policy_fact_switch"
  -
    key: "resource_label_authorized"
    allowed_values:
      - "true"
    fact_refs:
      - "create_resource_label::create_resource_label_fact_privilege"
