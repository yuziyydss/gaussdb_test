schema_version: 1
kind: factor
id: create_index
name: CREATE INDEX
category: DDL
status: needs_review
description: >-
  基于 GaussDB V2.0-10.0.0 集中式版 1.13.9.27 的 CREATE INDEX V10 因子包；
  覆盖双顶层语法、五种显式索引方法、键/类型/存储引擎契约、WITH/ILM/WHERE 与文档示例账本。

source:
  product: GaussDB
  document: GaussDB V2.0-10.0.0 集中式版参考 / 1.13.9.27 CREATE INDEX
  version: V2.0-10.0.0
  artifact_sha256: 7a8ce69c11e865868cb75fd990000d6a41ceb91ce200dd3e882dc41496863d0d
  parent_pdf_sha256: 716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe
  extraction_rule_version: gaussdb-pdf-outline-v1
  extraction_date: "2026-09-04"
  catalog_chapter_ref:
    document_id: gaussdb_v2_0_10_0_0_centralized_reference_01
    source_relpath: general/ddl/create_index.txt
    chapter_sha256: 7a8ce69c11e865868cb75fd990000d6a41ceb91ce200dd3e882dc41496863d0d

source_ledger_ref: source_ledger_create_index
syntax_ref: syntax_create_index_v1
source_only_fact_refs:
  - create_table_partition::create_table_partition_fact_body_370
  - create_table_subpartition::create_table_subpartition_fact_body_12
  - create_table_subpartition::create_table_subpartition_fact_body_12_1

dimensions:
  statement_form:
    description: 普通表和分区表两个顶层产生式。
    default_value_id: ci_statement_regular
    classes:
      - id: ci_statement_form_class
        meaning: 选择原文两个 CREATE INDEX 产生式之一。
        values:
          - {id: ci_statement_regular, render: "", representative: true, validity: valid, fact_refs: [ci_fact_main_grammar]}
          - {id: ci_statement_partition, render: "", representative: true, validity: valid, fact_refs: [ci_fact_partition_grammar]}

  unique_modifier:
    description: 普通或唯一索引。
    default_value_id: ci_unique_none
    classes:
      - id: ci_unique_class
        meaning: UNIQUE 只适用于最终 B-Tree/UB-Tree 访问方法。
        values:
          - {id: ci_unique_none, render: "", representative: true, validity: valid}
          - {id: ci_unique, render: "UNIQUE ", representative: true, validity: valid, fact_refs: [ci_fact_unique]}

  concurrently:
    description: 是否使用 CONCURRENTLY 在线创建。
    default_value_id: ci_concurrently_none
    classes:
      - id: ci_concurrently_class
        meaning: 分区与非分区产生式都包含此位置。
        values:
          - {id: ci_concurrently_none, render: "", representative: true, validity: valid}
          - {id: ci_concurrently, render: "CONCURRENTLY ", representative: true, validity: valid, fact_refs: [ci_fact_concurrently]}

  if_not_exists:
    description: 同名 relation 存在时返回 NOTICE 而非 ERROR。
    default_value_id: ci_if_not_exists_none
    classes:
      - id: ci_if_not_exists_class
        meaning: 分区与非分区产生式都包含此位置。
        values:
          - {id: ci_if_not_exists_none, render: "", representative: true, validity: valid}
          - {id: ci_if_not_exists, render: "IF NOT EXISTS ", representative: true, validity: valid, fact_refs: [ci_fact_if_not_exists]}

  index_name_presence:
    description: 文法允许显式名称或省略名称。
    default_value_id: ci_index_name_present
    classes:
      - id: ci_index_name_class
        meaning: IF NOT EXISTS 与无名组合保留为待验证问题，不进正向清单。
        values:
          - {id: ci_index_name_present, render: "", representative: true, validity: valid}
          - {id: ci_index_name_absent, render: "", representative: true, validity: valid, fact_refs: [ci_fact_main_grammar]}

  table_profile:
    description: 目标表形态、存储引擎和列类型契约。
    default_value_id: ci_table_astore_regular
    profile_source: {matrix_ref: matrix_create_index_table_profiles, profile_id_path: profiles.id}

  method:
    description: 省略 USING 或显式 btree/ubtree/ugin/gin/gist。
    default_value_id: ci_method_default
    profile_source: {matrix_ref: matrix_create_index_method_capabilities, profile_id_path: profiles.id}

  key_profile:
    description: 键列表、表达式、length、COLLATE、opclass、排序及方法专用类型。
    default_value_id: ci_key_id
    profile_source: {matrix_ref: matrix_create_index_key_profiles, profile_id_path: profiles.id}

  scope_clause:
    description: 分区索引省略 scope（默认 GLOBAL）、LOCAL/GLOBAL 或显式索引分区。
    default_value_id: ci_scope_none
    classes:
      - id: ci_scope_class
        meaning: scope 只由分区产生式渲染。
        values:
          - {id: ci_scope_none, render: "", representative: true, validity: valid, properties: {local_scope: false, global_scope: false}}
          - {id: ci_scope_local, render: " LOCAL", representative: true, validity: valid, properties: {local_scope: true, global_scope: false}, fact_refs: [ci_fact_partition_scope]}
          - {id: ci_scope_global, render: " GLOBAL", representative: true, validity: valid, properties: {local_scope: false, global_scope: true}, fact_refs: [ci_fact_partition_scope]}
          - id: ci_scope_local_subpartition_named_fresh
            render: " LOCAL (PARTITION idx_p1 (SUBPARTITION idx_p1s1, SUBPARTITION idx_p1s2), PARTITION idx_p2 (SUBPARTITION idx_p2s1, SUBPARTITION idx_p2s2))"
            representative: true
            validity: valid
            properties: {local_scope: true, global_scope: false, explicit_partitions: true, mapping_contract: range_range_positional}
            fact_refs: [ci_fact_index_partition_clause, ci_fact_partition_grammar]
          - id: ci_scope_local_named
            render: " LOCAL (PARTITION idx_p_low, PARTITION idx_p_max)"
            representative: true
            validity: valid
            properties: {local_scope: true, global_scope: false, explicit_partitions: true}
            fact_refs: [ci_fact_index_partition_clause]

  include_profile:
    description: INCLUDE 非键列；V10 明确只有最终 UB-Tree 支持。
    default_value_id: ci_include_none
    classes:
      - id: ci_include_class
        meaning: 不包含或携带一至两个非键列。
        values:
          - {id: ci_include_none, render: "", representative: true, validity: valid, properties: {include_column_count: 0, source_columns: []}}
          - {id: ci_include_note, render: " INCLUDE (note)", representative: true, validity: valid, properties: {include_column_count: 1, source_columns: [note]}, fact_refs: [ci_fact_include]}
          - {id: ci_include_note_postcode, render: " INCLUDE (note, postcode)", representative: true, validity: valid, properties: {include_column_count: 2, source_columns: [note, postcode]}, fact_refs: [ci_fact_include]}

  storage_profile:
    description: WITH 参数值域及方法/表形态适用契约。
    default_value_id: ci_storage_none
    profile_source: {matrix_ref: matrix_create_index_storage_profiles, profile_id_path: profiles.id}

  ilm_clause:
    description: 跨页透明压缩策略，位于 WITH 后、TABLESPACE 前。
    default_value_id: ci_ilm_none
    classes:
      - id: ci_ilm_class
        meaning: 省略、显式 NONE 或 TURBO 策略。
        values:
          - {id: ci_ilm_none, render: "", representative: true, validity: valid}
          - {id: ci_ilm_explicit_none, render: " ILM ADD POLICY ROW STORE COMPRESS NONE", representative: true, validity: valid, fact_refs: [ci_fact_ilm]}
          - {id: ci_ilm_turbo_high, render: " ILM ADD POLICY ROW STORE COMPRESS TURBO HIGH UNIT AFTER 3 HOUR OF NO MODIFICATION", representative: true, validity: valid, fact_refs: [ci_fact_ilm]}

  tablespace_clause:
    description: 已存在索引表空间；省略时使用数据库默认表空间。
    default_value_id: ci_tablespace_none
    classes:
      - id: ci_tablespace_class
        meaning: 默认或显式内建 pg_default。
        values:
          - {id: ci_tablespace_none, render: "", representative: true, validity: valid}
          - {id: ci_tablespace_default, render: " TABLESPACE pg_default", representative: true, validity: valid, fact_refs: [ci_fact_tablespace]}

  comment_clause:
    description: COMMENT 语法仅 B 兼容模式有效，因此普通正向清单不选择。
    default_value_id: ci_comment_none
    classes:
      - id: ci_comment_class
        meaning: 环境门控的索引注释。
        values:
          - {id: ci_comment_none, render: "", representative: true, validity: valid}
          - {id: ci_comment_basic, render: " COMMENT 'factor index'", representative: true, validity: conditional, fact_refs: [ci_fact_comment]}
          - {id: ci_comment_short_b, render: " COMMENT 'factor index'", representative: true, validity: valid, properties: {required_compatibility_modes: [B], original_value_ref: ci_comment_basic}, fact_refs: [ci_fact_comment_syntax, ci_fact_comment_b_mode, ci_fact_comment_length]}

  visibility_clause:
    description: VISIBLE/INVISIBLE 仅 A 兼容模式有效且受升级和 GUC 门控。
    default_value_id: ci_visibility_none
    classes:
      - id: ci_visibility_class
        meaning: 环境门控的索引可见性。
        values:
          - {id: ci_visibility_none, render: "", representative: true, validity: valid}
          - {id: ci_visibility_visible, render: " VISIBLE", representative: true, validity: conditional, fact_refs: [ci_fact_visibility]}
          - {id: ci_visibility_invisible, render: " INVISIBLE", representative: true, validity: conditional, fact_refs: [ci_fact_visibility]}
          - {id: ci_visibility_visible_a_fresh, render: " VISIBLE", representative: true, validity: valid, properties: {required_compatibility_modes: [A], required_environment_capabilities: {disable_keyword_options_state: [empty], upgrade_phase: [not_upgrading]}, original_value_ref: ci_visibility_visible}, fact_refs: [ci_fact_visibility, ci_fact_visible_definition, ci_fact_visible_mode, ci_fact_visible_keyword, ci_fact_visible_upgrade]}
          - {id: ci_visibility_invisible_a_fresh, render: " INVISIBLE", representative: true, validity: valid, properties: {required_compatibility_modes: [A], required_environment_capabilities: {disable_keyword_options_state: [empty], upgrade_phase: [not_upgrading]}, original_value_ref: ci_visibility_invisible}, fact_refs: [ci_fact_visibility, ci_fact_invisible_definition, ci_fact_invisible_mode, ci_fact_invisible_keyword, ci_fact_invisible_upgrade]}

  predicate_clause:
    description: 普通表产生式的末尾 WHERE 部分索引谓词。
    default_value_id: ci_predicate_none
    classes:
      - id: ci_predicate_class
        meaning: 省略或使用仅引用本表列、无子查询/聚集的谓词。
        values:
          - {id: ci_predicate_none, render: "", representative: true, validity: valid, properties: {source_columns: []}}
          - {id: ci_predicate_id_not_null, render: " WHERE id IS NOT NULL", representative: true, validity: valid, properties: {source_columns: [id]}, fact_refs: [ci_fact_partial_index]}
          - {id: ci_predicate_note_like, render: " WHERE note LIKE 'A%'", representative: true, validity: valid, properties: {source_columns: [note]}, fact_refs: [ci_fact_partial_index]}

rules:
  - id: ci_rule_method_storage_engine
    kind: requires
    expression: >-
      table_profile.properties.storage_engine in method.properties.allowed_storage_engines
      and method in table_profile.properties.supported_methods
    severity: error
    fact_refs: [ci_fact_method_storage_contract, ci_fact_ugin_capability, ci_fact_gin_capability, ci_fact_gist_capability]
  - id: ci_rule_key_method_compatible
    kind: requires
    expression: method in key_profile.properties.allowed_methods
    severity: error
    fact_refs: [ci_fact_method_catalog, ci_fact_ugin_opclass, ci_fact_gin_capability, ci_fact_gist_capability]
  - id: ci_rule_key_definition_supported
    kind: requires
    expression: key_profile.properties.definition_supported == True
    severity: error
    fact_refs: [ci_fact_expression, ci_fact_prefix_key, ci_fact_system_column_restriction]
  - id: ci_rule_online_shape_supported
    kind: requires
    expression: >-
      concurrently == 'ci_concurrently'
      => method.properties.online_supported == True
      and storage_profile.properties.online_supported == True
      and table_profile.properties.online_supported == True
    severity: error
    fact_refs: [ci_fact_online_capability]
  - id: ci_rule_unique_method_supported
    kind: requires
    expression: unique_modifier == 'ci_unique' => method.properties.unique_supported == True
    severity: error
    fact_refs: [ci_fact_unique]
  - id: ci_rule_include_ubtree_only
    kind: requires
    expression: >-
      include_profile == 'ci_include_none'
      or (table_profile.properties.storage_engine == 'USTORE'
      and method in ['ci_method_default', 'ci_method_btree', 'ci_method_ubtree'])
    severity: error
    fact_refs: [ci_fact_include, ci_fact_method_storage_contract]
  - id: ci_rule_storage_profile_compatible
    kind: requires
    expression: >-
      method in storage_profile.properties.allowed_methods
      and table_profile.properties.storage_engine in storage_profile.properties.allowed_storage_engines
      and statement_form in storage_profile.properties.allowed_forms
    severity: error
    fact_refs: [ci_fact_storage_parameters, ci_fact_storage_type, ci_fact_indexsplit, ci_fact_index_txntype, ci_fact_deduplication, ci_fact_gist_buffering]
  - id: ci_rule_storage_parameter_domain
    kind: requires
    expression: >-
      storage_profile.properties.user_settable == True
      and storage_profile.properties.value_domain_valid == True
    severity: error
    fact_refs: [ci_fact_fillfactor, ci_fact_fastupdate, ci_fact_gin_pending_limit, ci_fact_tde_parameters]
  - id: ci_rule_lpi_shape_supported
    kind: requires
    expression: >-
      storage_profile.properties.lpi == True
      => statement_form == 'ci_statement_partition'
      and scope_clause in ['ci_scope_local', 'ci_scope_local_named']
      and concurrently == 'ci_concurrently_none'
      and table_profile.properties.storage_engine == 'ASTORE'
      and method in ['ci_method_default', 'ci_method_btree', 'ci_method_ubtree']
    severity: error
    fact_refs: [ci_fact_lpi_parallel]
  - id: ci_rule_partition_key_syntax_supported
    kind: requires
    expression: statement_form == 'ci_statement_partition' => key_profile.properties.partition_supported == True
    severity: error
    fact_refs: [ci_fact_partition_grammar, ci_fact_sort_nulls]
  - id: ci_rule_global_method_supported
    kind: requires
    expression: scope_clause == 'ci_scope_global' => method.properties.global_supported == True
    severity: error
    fact_refs: [ci_fact_ugin_capability, ci_fact_gin_capability, ci_fact_gist_capability]
  - id: ci_rule_ugin_single_key
    kind: requires
    expression: method == 'ci_method_ugin' => key_profile.properties.key_column_count == 1
    severity: error
    fact_refs: [ci_fact_ugin_capability]
  - id: ci_rule_ilm_method_supported
    kind: requires
    expression: ilm_clause in ['ci_ilm_none', 'ci_ilm_explicit_none'] or method.properties.compression_supported != False
    severity: error
    fact_refs: [ci_fact_ilm, ci_fact_gin_capability, ci_fact_gist_capability]

structural_checks:
  - id: ci_check_index_column_contract
    kind: index_column_count_contract
    fact_refs: [ci_fact_key_column_limits, ci_fact_include]

facts:
  - {id: ci_fact_ugin_non_m_environment, type: environment, statement: "UGIN 不支持在 M 兼容数据库中创建和使用。", status: confirmed, source_anchor: "L268"}
  - {id: ci_fact_purpose, type: syntax, statement: "CREATE INDEX 在指定表上创建索引。", status: confirmed, source_anchor: "L4-L5"}
  - {id: ci_fact_usage_guidance, type: environment, statement: "索引适用于常查、连接、过滤、排序、分组和去重字段，同时占用存储和写入资源。", status: confirmed, source_anchor: "L7-L25"}
  - {id: ci_fact_partition_selection, type: behavior_oracle, statement: "分区索引由显式 scope、分区名和 UNIQUE 是否含全部分区键决定；省略 scope 默认 GLOBAL。", status: confirmed, source_anchor: "L16-L21,L412-L417"}
  - {id: ci_open_unique_local_missing_partition_key, type: open_question, statement: "原文同时说明显式 LOCAL 决定 LOCAL、UNIQUE 未含全部分区键时创建 GLOBAL；二者同时出现时的优先级及结果未说明，不能直接断言报错。", status: needs_verification, source_anchor: "L16-L21,L412-L417"}
  - {id: ci_fact_immutable, type: constraint, statement: "索引定义和 WHERE 中的函数与操作符必须 immutable。", status: confirmed, source_anchor: "L26-L29"}
  - {id: ci_fact_immutable_environment, type: environment, statement: "创建索引所用函数及操作符的immutable属性是前置条件；这里不提供具体操作符的OID或实际目录验证结果。", status: confirmed, source_anchor: "L26-L29，与ci_fact_immutable为同一原文要求的前置阶段视图，不新增独立文档覆盖"}
  - {id: ci_fact_partition_scope, type: metadata_oracle, statement: "LOCAL 绑定分区，GLOBAL 覆盖整个分区表；省略 LOCAL/GLOBAL 默认 GLOBAL。", status: confirmed, source_anchor: "L30-L31,L412-L417"}
  - {id: ci_fact_permissions, type: environment, statement: "CREATE ANY INDEX 与表达式索引权限受模式、表 Owner、角色及三权分立影响。", status: confirmed, source_anchor: "L32-L40"}
  - {id: ci_fact_expression_permissions, type: environment, statement: "表达式索引中的用户函数按表 Owner 权限执行。", status: confirmed, source_anchor: "L34-L40"}
  - {id: ci_fact_xml_restriction, type: constraint, statement: "XML 类型不能用于普通、UNIQUE、GLOBAL、LOCAL 或部分索引。", status: confirmed, source_anchor: "L41-L42"}
  - {id: ci_fact_online_capability, type: constraint, statement: "在线创建只支持最终 B-Tree/UB-Tree，普通与分区 GLOBAL/LOCAL 支持，但 PCR UB-Tree、二级分区和 GSI 不支持。", status: confirmed, source_anchor: "L43-L46"}
  - {id: ci_open_online_tree_key_shapes, type: open_question, statement: "本章在线创建限制未说明 B-Tree/UB-Tree 的表达式、前缀、COLLATE 或 opclass 键是否另有限制；不得据此推断这些键必然失败。", status: needs_verification, source_anchor: "L43-L46,L363-L403"}
  - {id: ci_fact_ugin_capability, type: constraint, statement: "UGIN 仅 USTORE、单键、Bitmap Scan，不支持排序/NULLS/INCLUDE/UNIQUE/CONCURRENTLY/GLOBAL 分区索引。", status: confirmed, source_anchor: "L47-L48,L229-L279"}
  - {id: ci_open_ugin_ilm_compression_support, type: open_question, statement: "UGIN 能力说明未声明是否支持 ILM 跨页透明压缩；不能从 GIN/GiST 的明确压缩限制类推 UGIN 也不支持。", status: needs_verification, source_anchor: "L257-L268,L310,L343,L629-L645"}
  - {id: ci_fact_gin_capability, type: constraint, statement: "GIN 仅 ASTORE，支持数组/tsvector/jsonb 与 Bitmap Scan，不支持排序/NULLS/INCLUDE/UNIQUE/在线/GLOBAL。", status: confirmed, source_anchor: "L49,L280-L312"}
  - {id: ci_fact_gist_capability, type: constraint, statement: "GiST 仅 ASTORE，支持几何、范围和文本检索类型，不支持排序/NULLS/INCLUDE/UNIQUE/在线。", status: confirmed, source_anchor: "L49,L313-L343"}
  - {id: ci_fact_plan_change, type: behavior_oracle, statement: "创建索引可能改变访问方式和查询执行计划。", status: confirmed, source_anchor: "L50"}
  - {id: ci_fact_index_size, type: constraint, statement: "B-Tree/UB-Tree 元组上限为 2696 字节，USTORE UB-Tree 实际为 2688 字节。", status: confirmed, source_anchor: "L51-L55"}
  - {id: ci_fact_system_column_restriction, type: constraint, statement: "不能为 rowid 或 rowno 系统列创建索引。", status: confirmed, source_anchor: "L56"}
  - {id: ci_fact_sql_length_warning, type: environment, statement: "CREATE INDEX SQL 长度大于等于 5250 字符会产生 WARNING，并可能影响备份恢复。", status: confirmed, source_anchor: "L57-L64"}
  - {id: ci_fact_leftmost_prefix, type: behavior_oracle, statement: "组合索引应遵守最左连续列匹配原则。", status: confirmed, source_anchor: "L65-L79"}
  - {id: ci_fact_main_grammar, type: syntax, statement: "普通表产生式含 UNIQUE、CONCURRENTLY、IF NOT EXISTS、可选名、USING、键、INCLUDE、WITH、ILM、TABLESPACE、COMMENT、可见性和 WHERE。", status: confirmed, source_anchor: "L83-L98"}
  - {id: ci_fact_partition_grammar, type: syntax, statement: "分区表产生式同样含 CONCURRENTLY 与 IF NOT EXISTS，并在键后提供 LOCAL/GLOBAL 和索引分区结构；无 WHERE。", status: confirmed, source_anchor: "L100-L121"}
  - {id: ci_fact_unique, type: behavior_oracle, statement: "UNIQUE 拒绝重复写入且仅 B-Tree/UB-Tree 支持。", status: confirmed, source_anchor: "L126-L129"}
  - {id: ci_fact_concurrently, type: lifecycle, statement: "CONCURRENTLY 不阻塞 DML、不能在事务或存储过程内执行；临时表实际退化为阻塞创建。", status: confirmed, source_anchor: "L130-L140"}
  - {id: ci_fact_concurrent_lifecycle, type: lifecycle, statement: "在线创建扫描并合并 cctmp，失败可能残留 NOT VALID/ready 索引并需自动或手工清理。", status: confirmed, source_anchor: "L144-L170"}
  - {id: ci_fact_concurrent_performance, type: environment, statement: "在线创建存在锁、死锁、资源和长事务风险，文档给出性能估计而非确定成功条件。", status: confirmed, source_anchor: "L151-L194"}
  - {id: ci_fact_if_not_exists, type: lifecycle, statement: "IF NOT EXISTS 对当前 Schema 同名 relation 返回 NOTICE，否则同名返回 ERROR。", status: confirmed, source_anchor: "L206-L211"}
  - {id: ci_open_if_not_exists_unnamed, type: open_question, statement: "文法同时允许无名索引与 IF NOT EXISTS，但无名时同名 relation 匹配对象不明确，暂不组合生成。", status: needs_verification, source_anchor: "L85,L101,L206-L211"}
  - {id: ci_fact_identifiers, type: syntax, statement: "索引与表名支持文档规定的模式限定和标识符规则，索引模式归属目标表。", status: confirmed, source_anchor: "L212-L220"}
  - {id: ci_fact_method_catalog, type: syntax, statement: "USING method 的完整目录为 btree、ubtree、ugin、gin、gist。", status: confirmed, source_anchor: "L221-L228,L280,L313"}
  - {id: ci_fact_method_storage_contract, type: constraint, statement: "ASTORE 支持 btree/gin/gist，USTORE 支持 ubtree/ugin；显式 btree/ubtree 与表引擎不匹配时自动转换。", status: confirmed, source_anchor: "L345-L350"}
  - {id: ci_fact_ugin_opclass, type: constraint, statement: "UGIN 明确列出 trgm、tsvector 与数组 opclass、数据类型、操作符、字符序和字符集条件。", status: confirmed, source_anchor: "L232-L279"}
  - {id: ci_open_ugin_database_example_quote, type: open_question, statement: "L275-L276 的 CREATE DATABASE 示例中 LC_CTYPE 字符串缺少结束引号，按原文保留而不执行。", status: needs_verification, source_anchor: "L275-L276"}
  - {id: ci_fact_key_column_limits, type: constraint, statement: "GLOBAL 最多 31 个键列，其他索引最多 32 个键列。", status: confirmed, source_anchor: "L359-L362"}
  - {id: ci_open_key_profile_domain_completion, type: open_question, statement: "当前仅有键定义代表值；前缀边界、排序/NULLS 完整组合以及 UGIN/GIN/GiST 文档列出的全部类型和 opclass 尚未形成可执行 profile。", status: needs_verification, source_anchor: "L229-L411"}
  - {id: ci_fact_prefix_key, type: constraint, statement: "前缀键仅 btree/ubtree、字符或二进制列，length 为不超过 2676 且不超过列最大长度的正整数。", status: confirmed, source_anchor: "L363-L383"}
  - {id: ci_fact_expression, type: constraint, statement: "表达式索引通常使用括号；包含 IS NULL 的表达式索引无效。", status: confirmed, source_anchor: "L384-L390"}
  - {id: ci_fact_collation, type: syntax, statement: "COLLATE 为可排序列指定排序规则。", status: confirmed, source_anchor: "L391-L394"}
  - {id: ci_fact_opclass, type: syntax, statement: "每个索引列可指定 opclass；非 C/POSIX 字符序下的前缀匹配可用 varchar_pattern_ops。", status: confirmed, source_anchor: "L395-L403"}
  - {id: ci_fact_sort_nulls, type: syntax, statement: "普通键支持 ASC/DESC 与 NULLS FIRST/LAST；分区产生式只列 NULLS LAST。", status: confirmed, source_anchor: "L87-L88,L103-L104,L404-L411"}
  - {id: ci_fact_include, type: constraint, statement: "INCLUDE 列不参与扫描条件或唯一性，只由 UB-Tree 支持并增加宽度与空间风险。", status: confirmed, source_anchor: "L418-L428"}
  - {id: ci_fact_index_partition_clause, type: syntax, statement: "LOCAL 支持 PARTITION/SUBPARTITION、FOR 名称或值及分区表空间。", status: confirmed, source_anchor: "L429-L482"}
  - {id: ci_fact_classified_index, type: lifecycle, statement: "带 FOR 的分类索引是单分区 LOCAL 树索引，带 sparse 属性，升级期受限；自动扩展可在自治事务中遗留新分区。", status: confirmed, source_anchor: "L436-L467"}
  - {id: ci_open_subpartition_fixture, type: open_question, statement: "二级分区与分类索引需要独立、可验证的表定义和生命周期 Fixture，当前只保留语法与场景。", status: needs_verification, source_anchor: "L433-L479"}
  - {id: ci_fact_storage_parameters, type: syntax, statement: "WITH 参数按索引方法分配：fillfactor、storage_type、GIN/UGIN、UB-Tree、B-Tree 与 GiST 各有适用集合。", status: confirmed, source_anchor: "L483-L494"}
  - {id: ci_open_storage_profile_domain_completion, type: open_question, statement: "当前 WITH/ILM 仅有代表值；GIN fastupdate=off、INDEXSPLIT=INSERTPT、INDEX_TXNTYPE=RCR、STAT_STATE=unlock、LPI PAGE/AUTO、GiST buffering on/off 及 ILM 级别/时间单位尚未形成可执行 profile。", status: needs_verification, source_anchor: "L483-L645"}
  - {id: ci_fact_storage_type, type: constraint, statement: "STORAGE_TYPE 为 ASTORE/USTORE，方法冲突时数据库自动修正；不支持 GiST。", status: confirmed, source_anchor: "L495-L505"}
  - {id: ci_fact_fillfactor, type: constraint, statement: "FILLFACTOR 的合法值为 10 到 100。", status: confirmed, source_anchor: "L506-L510"}
  - {id: ci_fact_fastupdate, type: constraint, statement: "GIN/UGIN 支持 FASTUPDATE；UGIN 只允许 on。", status: confirmed, source_anchor: "L511-L515"}
  - {id: ci_fact_gin_pending_limit, type: constraint, statement: "GIN_PENDING_LIST_LIMIT 范围 64 到 2147483647 kB。", status: confirmed, source_anchor: "L516-L521"}
  - {id: ci_fact_indexsplit, type: constraint, statement: "INDEXSPLIT 仅 UB-Tree，取 INSERTPT 或 DEFAULT。", status: confirmed, source_anchor: "L522-L534"}
  - {id: ci_fact_index_txntype, type: constraint, statement: "INDEX_TXNTYPE 仅 UB-Tree，取 RCR/PCR；PCR 不支持在线、GSI 等能力。", status: confirmed, source_anchor: "L535-L546"}
  - {id: ci_fact_active_pages, type: environment, statement: "ACTIVE_PAGES 仅 USTORE 分区表 LOCAL 生效且会被 VACUUM/ANALYZE 更新，不建议手工设置。", status: confirmed, source_anchor: "L547-L550"}
  - {id: ci_fact_deduplication, type: constraint, statement: "DEDUPLICATION 仅非分区 B-Tree，主键/唯一索引不生效。", status: confirmed, source_anchor: "L551-L557"}
  - {id: ci_fact_stat_state, type: metadata_oracle, statement: "STAT_STATE 为 locked/unlock，锁定后统计信息不能更新。", status: confirmed, source_anchor: "L558-L562"}
  - {id: ci_fact_tde_parameters, type: environment, statement: "enable_tde 只支持 B-Tree/UB-Tree并依赖加密基表、GUC 与密钥；其余密钥参数不能手工设置。", status: confirmed, source_anchor: "L563-L594"}
  - {id: ci_open_tde_fixture, type: open_question, statement: "缺少安全可复用的密钥服务与加密基表 Fixture，TDE 只登记为环境门控场景。", status: needs_verification, source_anchor: "L563-L594"}
  - {id: ci_fact_lpi_parallel, type: constraint, statement: "LPI_PARALLEL_METHOD 为 PAGE/PARTITION/AUTO，仅 ASTORE 分区表 BTREE LOCAL 非在线索引。", status: confirmed, source_anchor: "L595-L615"}
  - {id: ci_fact_gist_buffering, type: constraint, statement: "GiST buffering 支持 on/off/auto，默认 auto。", status: confirmed, source_anchor: "L617-L628"}
  - {id: ci_fact_ilm, type: syntax, statement: "ILM ADD POLICY ROW STORE COMPRESS 支持 TURBO 级别/时间单位或 NONE，位于 WITH 后、TABLESPACE 前。", status: confirmed, source_anchor: "L629-L645"}
  - {id: ci_fact_tablespace, type: syntax, statement: "TABLESPACE 必须引用已存在表空间；省略使用默认表空间。", status: confirmed, source_anchor: "L646-L648"}
  - {id: ci_fact_partial_index, type: constraint, statement: "普通索引 WHERE 创建部分索引；谓词只引用本表列且不能含子查询/聚集；GLOBAL 分区索引不支持。", status: confirmed, source_anchor: "L649-L658"}
  - {id: ci_fact_comment, type: environment, statement: "COMMENT 只在 B 模式有效，最大 1024 字符。", status: confirmed, source_anchor: "L659-L665"}
  - {id: ci_fact_comment_syntax, type: syntax, statement: "COMMENT 'string' 在CREATE INDEX尾部设置索引注释。", status: confirmed, source_anchor: "L659-L660"}
  - {id: ci_fact_comment_b_mode, type: environment, statement: "行内COMMENT子句仅在B模式数据库有效。", status: confirmed, source_anchor: "L664"}
  - {id: ci_fact_comment_length, type: constraint, statement: "索引级注释最大长度为1024字符；短ASCII候选不代表边界已覆盖。", status: confirmed, source_anchor: "L665"}
  - {id: ci_fact_visibility, type: environment, statement: "VISIBLE/INVISIBLE 只在 A 模式有效，并受 disable_keyword_options 和升级状态限制。", status: confirmed, source_anchor: "L666-L683"}
  - {id: ci_fact_visible_definition, type: syntax, statement: "VISIBLE设置索引可见，也是默认选项。", status: confirmed, source_anchor: "L666-L670"}
  - {id: ci_fact_visible_mode, type: environment, statement: "VISIBLE仅在A兼容数据库可设置。", status: confirmed, source_anchor: "L671-L672"}
  - {id: ci_fact_visible_keyword, type: environment, statement: "disable_keyword_options为visible时不能使用VISIBLE关键字。", status: confirmed, source_anchor: "L673"}
  - {id: ci_fact_visible_upgrade, type: environment, statement: "升级未提交阶段不能使用VISIBLE。", status: confirmed, source_anchor: "L674"}
  - {id: ci_fact_invisible_definition, type: syntax, statement: "INVISIBLE设置索引不可见。", status: confirmed, source_anchor: "L675-L679"}
  - {id: ci_fact_invisible_mode, type: environment, statement: "INVISIBLE仅在A兼容数据库可设置。", status: confirmed, source_anchor: "L680-L681"}
  - {id: ci_fact_invisible_keyword, type: environment, statement: "disable_keyword_options为invisible时不能使用INVISIBLE关键字。", status: confirmed, source_anchor: "L682"}
  - {id: ci_fact_invisible_upgrade, type: environment, statement: "升级未提交阶段不能使用INVISIBLE。", status: confirmed, source_anchor: "L683"}
  - {id: ci_fact_example_basic, type: example, statement: "示例覆盖普通表、表空间及目录查询。", status: confirmed, source_anchor: "L686-L714"}
  - {id: ci_fact_example_unique, type: example, statement: "示例覆盖唯一 B-Tree 索引。", status: confirmed, source_anchor: "L715-L731"}
  - {id: ci_fact_example_expression, type: example, statement: "示例覆盖 substr 表达式索引。", status: confirmed, source_anchor: "L733-L750"}
  - {id: ci_fact_example_partial, type: example, statement: "示例覆盖 WHERE id IS NOT NULL 部分索引。", status: confirmed, source_anchor: "L752-L760"}
  - {id: ci_fact_example_partition, type: example, statement: "示例覆盖 LOCAL/GLOBAL 及对应 pg_partition 元数据。", status: confirmed, source_anchor: "L762-L823"}
  - {id: ci_fact_example_ugin, type: example, statement: "示例覆盖 UGIN trgm 与 bool[] opclass。", status: confirmed, source_anchor: "L825-L861"}
  - {id: ci_fact_example_gin, type: example, statement: "示例覆盖 ASTORE int[] GIN 及 @> 查询。", status: confirmed, source_anchor: "L863-L877"}
  - {id: ci_fact_example_gist, type: example, statement: "示例覆盖 ASTORE point GiST 及 ~= 查询。", status: confirmed, source_anchor: "L879-L895"}

