schema_version: 1
kind: manifest
id: manifest_create_index_concurrent_positive
name: CREATE INDEX CONCURRENTLY 普通/分区组合
status: ready
description: 验证 V10 两个顶层产生式都保留 CONCURRENTLY 与 IF NOT EXISTS，并过滤不支持形态。
factor_ref: create_index
syntax_ref: syntax_create_index_v1
suite_type: positive
strategy: pairwise
fixture_refs: []
identifier_policy: {index_name: {generator: deterministic, prefix: idx_ci_on, unique_per_case: true}}
bindings:
  statement_form: [ci_statement_regular, ci_statement_partition]
  unique_modifier: [ci_unique_none, ci_unique]
  concurrently: [ci_concurrently]
  if_not_exists: [ci_if_not_exists_none, ci_if_not_exists]
  index_name_presence: [ci_index_name_present]
  table_profile: [ci_table_astore_regular, ci_table_ustore_regular, ci_table_astore_temporary, ci_table_astore_partitioned]
  method: [ci_method_default, ci_method_btree, ci_method_ubtree]
  key_profile: [ci_key_id, ci_key_id_note, ci_key_name_asc_nulls_last]
  scope_clause: [ci_scope_none, ci_scope_local, ci_scope_global]
  include_profile: [ci_include_none]
  storage_profile: [ci_storage_none, ci_fillfactor_70]
  ilm_clause: [ci_ilm_none]
  predicate_clause: [ci_predicate_none]
local_rules:
  - expression: >-
      (statement_form == 'ci_statement_regular' and table_profile.properties.partitioned == False)
      or (statement_form == 'ci_statement_partition' and table_profile.properties.partitioned == True)
    rationale: statement_form 选择与目标表形态一致的原文顶层产生式。
    fact_refs: [ci_fact_main_grammar, ci_fact_partition_grammar]
  - expression: >-
      statement_form == 'ci_statement_regular'
      => scope_clause == 'ci_scope_none'
    rationale: 普通表产生式没有 LOCAL/GLOBAL 位置。
    fact_refs: [ci_fact_main_grammar, ci_fact_partition_grammar]
expected: {default: success, scope: syntax_and_semantics}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
