schema_version: 1
kind: manifest
id: manifest_create_index_partition_positive
name: CREATE INDEX ASTORE 分区表组合
status: ready
description: 覆盖默认 GLOBAL、显式 LOCAL/GLOBAL、命名索引分区、LPI 和分区表达式键。
factor_ref: create_index
syntax_ref: syntax_create_index_v1
suite_type: positive
strategy: pairwise
fixture_refs: []
identifier_policy: {index_name: {generator: deterministic, prefix: idx_ci_part, unique_per_case: true}}
bindings:
  statement_form: [ci_statement_partition]
  unique_modifier: [ci_unique_none, ci_unique]
  concurrently: [ci_concurrently_none]
  if_not_exists: [ci_if_not_exists_none, ci_if_not_exists]
  index_name_presence: [ci_index_name_present]
  table_profile: [ci_table_astore_partitioned]
  method: [ci_method_default, ci_method_btree, ci_method_ubtree]
  key_profile: [ci_key_id, ci_key_id_note, ci_key_name_asc_nulls_last, ci_key_expression_abs_id]
  scope_clause: [ci_scope_none, ci_scope_local, ci_scope_global, ci_scope_local_named]
  include_profile: [ci_include_none]
  storage_profile: [ci_storage_none, ci_fillfactor_70, ci_lpi_partition]
  ilm_clause: [ci_ilm_none, ci_ilm_explicit_none]
  tablespace_clause: [ci_tablespace_none, ci_tablespace_default]
  predicate_clause: [ci_predicate_none]
local_rules:
  - expression: >-
      unique_modifier != 'ci_unique'
      or scope_clause not in ['ci_scope_local', 'ci_scope_local_named']
      or key_profile.properties.contains_partition_key == True
    rationale: 显式 LOCAL 与 UNIQUE 缺少分区键的优先级原文未说明，正向清单暂不生成该 open-question 组合。
    fact_refs: [ci_open_unique_local_missing_partition_key]
expected: {default: success, scope: syntax_and_semantics}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
