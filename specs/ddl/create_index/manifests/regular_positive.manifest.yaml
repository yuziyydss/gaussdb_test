schema_version: 1
kind: manifest
id: manifest_create_index_regular_positive
name: CREATE INDEX 普通表核心组合
status: ready
description: 约束感知 Pairwise 覆盖唯一性、名称、BTREE、键形态、INCLUDE、FILLFACTOR、注释、可见性和表空间。
factor_ref: create_index
syntax_ref: syntax_create_index_v1
suite_type: positive
strategy: pairwise
fixture_refs: []
identifier_policy:
  index_name: {generator: deterministic, prefix: idx_ci_regular, unique_per_case: true}
bindings:
  statement_form: [ci_statement_regular]
  unique_modifier: [ci_unique_none, ci_unique]
  concurrently: [ci_concurrently_none]
  if_not_exists: [ci_if_not_exists_none, ci_if_not_exists]
  index_name_presence: [ci_index_name_present, ci_index_name_absent]
  table_profile: [ci_table_regular]
  method: [ci_method_default, ci_method_btree]
  key_profile: [ci_key_id, ci_key_id_note, ci_key_name_asc_nulls_last, ci_key_name_desc_nulls_first, ci_key_name_desc_nulls_last, ci_key_expression_lower_name, ci_key_expression_abs_id]
  scope_clause: [ci_scope_none]
  include_profile: [ci_include_none, ci_include_note, ci_include_note_postcode]
  storage_profile: [ci_storage_none, ci_fillfactor_10, ci_fillfactor_70, ci_fillfactor_100]
  comment_clause: [ci_comment_none, ci_comment_basic]
  visibility_clause: [ci_visibility_none, ci_visibility_visible, ci_visibility_invisible]
  tablespace_clause: [ci_tablespace_none, ci_tablespace_default]
local_rules:
  - expression: >-
      if_not_exists == 'ci_if_not_exists'
      => index_name_presence == 'ci_index_name_present'
    rationale: 无名 IF NOT EXISTS 的语法与同名查找语义矛盾，等待 open question 解决前不生成。
    fact_refs: [ci_open_if_not_exists_unnamed]
expected: {default: success, scope: syntax_and_semantics}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
