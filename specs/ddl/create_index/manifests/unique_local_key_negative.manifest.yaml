schema_version: 1
kind: manifest
id: manifest_create_index_unique_local_key_negative
name: CREATE UNIQUE LOCAL INDEX 缺少分区键负向
status: ready
description: 验证 UNIQUE LOCAL 索引必须包含全部分区键。
factor_ref: create_index
syntax_ref: syntax_create_index_v1
suite_type: negative
strategy: pairwise
fixture_refs: []
identifier_policy:
  index_name: {generator: deterministic, prefix: idx_ci_unique_local, unique_per_case: true}
bindings:
  statement_form: [ci_statement_partition]
  unique_modifier: [ci_unique]
  index_name_presence: [ci_index_name_present]
  table_profile: [ci_table_partitioned]
  key_profile: [ci_key_name_desc_nulls_last]
  scope_clause: [ci_scope_local]
violates_rule_refs: [ci_rule_unique_local_contains_partition_key]
expected:
  default: error
  scope: syntax_and_semantics
  error_category: unique_local_missing_partition_key
  error_message_regex: "(?i)(unique|local|partition key|partition column)"
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}

