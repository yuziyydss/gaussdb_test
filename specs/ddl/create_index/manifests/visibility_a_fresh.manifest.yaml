schema_version: 1
kind: manifest
id: manifest_create_index_visibility_a_fresh
name: A模式普通索引显式可见与不可见
status: needs_review
description: 非升级中且关键字禁用列表为空的受限普通ASTORE整数BTREE代表；不证明查询计划或元数据，不覆盖所有可用GUC组合。
factor_ref: create_index
syntax_ref: syntax_create_index_v1
suite_type: positive
strategy: full_cartesian
fixture_refs: []
identifier_policy: {index_name: {generator: deterministic, prefix: idx_ci_visibility, unique_per_case: true}}
bindings:
  statement_form: [ci_statement_regular]
  index_name_presence: [ci_index_name_present]
  table_profile: [ci_table_visibility_fresh]
  method: [ci_method_btree]
  key_profile: [ci_key_id]
  visibility_clause: [ci_visibility_visible_a_fresh, ci_visibility_invisible_a_fresh]
environment_requirements:
- {key: compatibility_mode, allowed_values: [A], fact_refs: [ci_fact_visible_mode, ci_fact_invisible_mode]}
# empty 是原始GUC为空字符串的显式能力状态，不是字面量GUC值，也不表示已实测。
- {key: disable_keyword_options_state, allowed_values: [empty], fact_refs: [ci_fact_visible_keyword, ci_fact_invisible_keyword]}
- {key: upgrade_phase, allowed_values: [not_upgrading], fact_refs: [ci_fact_visible_upgrade, ci_fact_invisible_upgrade]}
- {key: actor_authority, allowed_values: [create_any_index], fact_refs: [ci_fact_permissions]}
- {key: case_namespace, allowed_values: [isolated_user_schema], fact_refs: [ci_fact_permissions]}
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
