schema_version: 1
kind: matrix
id: matrix_create_index_method_capabilities
name: CREATE INDEX 方法与存储引擎能力矩阵
status: ready
description: V10 文档明确列出的 btree、ubtree、ugin、gin、gist 方法；default 表示省略 USING， 由表存储引擎选择 B-Tree 或 UB-Tree。btree/ubtree 与表存储类型不匹配时数据库会自动转换。
factor_ref: create_index
profile_property_defaults:
  unique_supported: false
  online_supported: false
  include_capable: false
  global_supported: false
  compression_supported: false
profiles:
