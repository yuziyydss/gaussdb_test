schema_version: 1
kind: matrix
id: matrix_create_index_key_profiles
name: CREATE INDEX 键定义与类型契约矩阵
status: ready
description: 保存普通列、组合键、排序、表达式、前缀 length、COLLATE、opclass 以及 UGIN/GIN/GiST 专用键，并显式声明每个键可配的方法与 Fixture 列契约。
factor_ref: create_index
profile_property_defaults:
  definition_supported: true
  online_supported: true
  partition_supported: true
  contains_partition_key: false
  allowed_methods:
  - ci_method_default
  - ci_method_btree
  - ci_method_ubtree
profiles:
- id: ci_key_id
  render: ''
  validity: valid
  properties:
    items:
    - id
    key_column_count: 1
    source_columns:
    - id
    contains_partition_key: true
    expression: false
  fact_refs:
  - ci_fact_main_grammar
- id: ci_key_id_note
  render: ''
  validity: valid
  properties:
    items:
    - id
    - note
    key_column_count: 2
    source_columns:
    - id
    - note
    contains_partition_key: true
    expression: false
  fact_refs:
  - ci_fact_key_column_limits
- id: ci_key_name_asc_nulls_last
  render: ''
  validity: valid
  properties:
    items:
    - name ASC NULLS LAST
    key_column_count: 1
    source_columns:
    - name
    expression: false
  fact_refs:
  - ci_fact_sort_nulls
- id: ci_key_name_desc_nulls_first
  render: ''
  validity: valid
  properties:
    items:
    - name DESC NULLS FIRST
    key_column_count: 1
    source_columns:
    - name
    expression: false
    partition_supported: false
  fact_refs:
  - ci_fact_sort_nulls
  - ci_fact_partition_grammar
- id: ci_key_expression_lower_name
  render: ''
  validity: valid
  properties:
    items:
    - (lower(name))
    key_column_count: 1
    source_columns:
    - name
    expression: true
    immutable: true
  fact_refs:
  - ci_fact_expression
  - ci_fact_immutable
- id: ci_key_expression_abs_id
  render: ''
  validity: valid
  properties:
    items:
    - (abs(id))
    key_column_count: 1
    source_columns:
    - id
    expression: true
    immutable: true
    contains_partition_key: false
  fact_refs:
  - ci_fact_expression
  - ci_fact_immutable
- id: ci_key_prefix_name_8
  render: ''
  validity: valid
  properties:
    items:
    - name (8)
    key_column_count: 1
    source_columns:
    - name
    expression: true
    prefix_length: 8
  fact_refs:
  - ci_fact_prefix_key
- id: ci_key_name_collate_c
  render: ''
  validity: valid
  properties:
