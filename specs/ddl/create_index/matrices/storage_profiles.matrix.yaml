schema_version: 1
kind: matrix
id: matrix_create_index_storage_profiles
name: CREATE INDEX WITH 参数能力矩阵
status: ready
description: >-
  把 WITH 参数本身的值域与方法、存储引擎、顶层产生式适用性分离；
  TDE、ACTIVE_PAGES 等环境依赖项保留为 conditional，不伪装成普通正向用例。
factor_ref: create_index
profile_property_defaults:
  online_supported: true
  user_settable: true
  value_domain_valid: true
  allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree, ci_method_ugin, ci_method_gin, ci_method_gist]
  allowed_storage_engines: [ASTORE, USTORE]
  allowed_forms: [ci_statement_regular, ci_statement_partition]
  lpi: false
profiles:
  - id: ci_storage_none
    render: ""
    validity: valid
    properties: {online_supported: true}
    fact_refs: [ci_fact_storage_parameters]
  - id: ci_fillfactor_10
    render: " WITH (fillfactor = 10)"
    validity: valid
    properties: {online_supported: true, allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree, ci_method_gist]}
    fact_refs: [ci_fact_fillfactor]
  - id: ci_fillfactor_70
    render: " WITH (fillfactor = 70)"
    validity: valid
    properties: {online_supported: true, allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree, ci_method_gist]}
    fact_refs: [ci_fact_fillfactor]
  - id: ci_fillfactor_100
    render: " WITH (fillfactor = 100)"
    validity: valid
    properties: {online_supported: true, allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree, ci_method_gist]}
    fact_refs: [ci_fact_fillfactor]
  - id: ci_storage_type_astore
    render: " WITH (storage_type = ASTORE)"
    validity: valid
    properties: {allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree, ci_method_ugin, ci_method_gin]}
    fact_refs: [ci_fact_storage_type]
  - id: ci_storage_type_ustore
    render: " WITH (storage_type = USTORE)"
    validity: valid
    properties: {allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree, ci_method_ugin, ci_method_gin]}
    fact_refs: [ci_fact_storage_type]
  - id: ci_fastupdate_on
    render: " WITH (fastupdate = on)"
    validity: valid
    properties: {allowed_methods: [ci_method_ugin, ci_method_gin]}
    fact_refs: [ci_fact_fastupdate]
  - id: ci_gin_pending_64
    render: " WITH (gin_pending_list_limit = 64)"
    validity: valid
    properties: {allowed_methods: [ci_method_ugin, ci_method_gin]}
    fact_refs: [ci_fact_gin_pending_limit]
  - id: ci_gin_pending_max
    render: " WITH (gin_pending_list_limit = 2147483647)"
    validity: valid
    properties: {allowed_methods: [ci_method_ugin, ci_method_gin]}
    fact_refs: [ci_fact_gin_pending_limit]
  - id: ci_indexsplit_default
    render: " WITH (indexsplit = default)"
    validity: valid
    properties: {allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree], allowed_storage_engines: [USTORE]}
    fact_refs: [ci_fact_indexsplit]
  - id: ci_index_txntype_pcr
    render: " WITH (index_txntype = 'pcr')"
    validity: valid
    properties: {online_supported: false, allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree], allowed_storage_engines: [USTORE]}
    fact_refs: [ci_fact_index_txntype]
  - id: ci_deduplication_on
    render: " WITH (deduplication = on)"
    validity: valid
    properties: {allowed_methods: [ci_method_default, ci_method_btree], allowed_storage_engines: [ASTORE], allowed_forms: [ci_statement_regular]}
    fact_refs: [ci_fact_deduplication]
  - id: ci_stat_state_locked
    render: " WITH (stat_state = locked)"
    validity: valid
    properties: {}
    fact_refs: [ci_fact_stat_state]
  - id: ci_lpi_partition
    render: " WITH (lpi_parallel_method = 'partition')"
    validity: valid
    properties: {online_supported: false, allowed_methods: [ci_method_default, ci_method_btree], allowed_storage_engines: [ASTORE], allowed_forms: [ci_statement_partition], lpi: true}
    fact_refs: [ci_fact_lpi_parallel]
  - id: ci_gist_buffering_auto
    render: " WITH (buffering = auto)"
    validity: valid
    properties: {allowed_methods: [ci_method_gist], allowed_storage_engines: [ASTORE]}
    fact_refs: [ci_fact_gist_buffering]
  - id: ci_enable_tde_on
    render: " WITH (enable_tde = on)"
    validity: conditional
    properties: {allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree]}
    fact_refs: [ci_fact_tde_parameters, ci_open_tde_fixture]
  - id: ci_active_pages_manual
    render: " WITH (active_pages = 16)"
    validity: conditional
    properties: {allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree], allowed_storage_engines: [USTORE], allowed_forms: [ci_statement_partition]}
    fact_refs: [ci_fact_active_pages]
  - id: ci_fillfactor_9
    render: " WITH (fillfactor = 9)"
    validity: invalid
    properties: {online_supported: true, value_domain_valid: false}
    fact_refs: [ci_fact_fillfactor]
  - id: ci_fillfactor_101
    render: " WITH (fillfactor = 101)"
    validity: invalid
    properties: {online_supported: true, value_domain_valid: false}
    fact_refs: [ci_fact_fillfactor]
  - id: ci_fastupdate_off_ugin
    render: " WITH (fastupdate = off)"
    validity: invalid
    properties: {allowed_methods: [ci_method_ugin], value_domain_valid: false}
    fact_refs: [ci_fact_fastupdate]
  - id: ci_gin_pending_63
    render: " WITH (gin_pending_list_limit = 63)"
    validity: invalid
    properties: {allowed_methods: [ci_method_ugin, ci_method_gin], value_domain_valid: false}
    fact_refs: [ci_fact_gin_pending_limit]
  - id: ci_encrypt_algo_manual
    render: " WITH (encrypt_algo = 'AES_128_CTR')"
    validity: invalid
    properties: {user_settable: false, allowed_methods: [ci_method_default, ci_method_btree, ci_method_ubtree]}
    fact_refs: [ci_fact_tde_parameters]
documented_features:
  - {id: ci_feature_fillfactor_boundaries, profile_refs: [ci_fillfactor_10, ci_fillfactor_70, ci_fillfactor_100], status: covered, coverage_mode: representative, fact_refs: [ci_fact_fillfactor]}
  - {id: ci_feature_storage_type, profile_refs: [ci_storage_type_astore, ci_storage_type_ustore], status: covered, fact_refs: [ci_fact_storage_type]}
  - {id: ci_feature_fastupdate_on_representative, profile_refs: [ci_fastupdate_on], status: covered, coverage_mode: representative, fact_refs: [ci_fact_fastupdate]}
  - {id: ci_feature_fastupdate_full_domain, status: needs_profile, fact_refs: [ci_open_storage_profile_domain_completion]}
  - {id: ci_feature_gin_pending_boundaries, profile_refs: [ci_gin_pending_64, ci_gin_pending_max], status: covered, coverage_mode: representative, fact_refs: [ci_fact_gin_pending_limit]}
  - {id: ci_feature_indexsplit_default_representative, profile_refs: [ci_indexsplit_default], status: covered, coverage_mode: representative, fact_refs: [ci_fact_indexsplit]}
  - {id: ci_feature_indexsplit_full_domain, status: needs_profile, fact_refs: [ci_open_storage_profile_domain_completion]}
  - {id: ci_feature_index_txntype_pcr_representative, profile_refs: [ci_index_txntype_pcr], status: covered, coverage_mode: representative, fact_refs: [ci_fact_index_txntype]}
  - {id: ci_feature_index_txntype_full_domain, status: needs_profile, fact_refs: [ci_open_storage_profile_domain_completion]}
  - {id: ci_feature_deduplication_on_representative, profile_refs: [ci_deduplication_on], status: covered, coverage_mode: representative, fact_refs: [ci_fact_deduplication]}
  - {id: ci_feature_deduplication_full_domain, status: needs_profile, fact_refs: [ci_open_storage_profile_domain_completion]}
  - {id: ci_feature_stat_state_locked_representative, profile_refs: [ci_stat_state_locked], status: covered, coverage_mode: representative, fact_refs: [ci_fact_stat_state]}
  - {id: ci_feature_stat_state_full_domain, status: needs_profile, fact_refs: [ci_open_storage_profile_domain_completion]}
  - {id: ci_feature_lpi_partition_representative, profile_refs: [ci_lpi_partition], status: covered, coverage_mode: representative, fact_refs: [ci_fact_lpi_parallel]}
  - {id: ci_feature_lpi_full_domain, status: needs_profile, fact_refs: [ci_open_storage_profile_domain_completion]}
  - {id: ci_feature_gist_buffering_auto_representative, profile_refs: [ci_gist_buffering_auto], status: covered, coverage_mode: representative, fact_refs: [ci_fact_gist_buffering]}
  - {id: ci_feature_gist_buffering_full_domain, status: needs_profile, fact_refs: [ci_open_storage_profile_domain_completion]}
  - {id: ci_feature_tde_environment_profile, status: needs_profile, fact_refs: [ci_open_tde_fixture]}
  - {id: ci_feature_active_pages_execution_profile, status: needs_profile, fact_refs: [ci_open_storage_profile_domain_completion]}
  - {id: ci_feature_ilm_representatives, value_refs: [ci_ilm_explicit_none, ci_ilm_turbo_high], status: covered, coverage_mode: representative, fact_refs: [ci_fact_ilm]}
  - {id: ci_feature_ilm_full_domain, status: needs_profile, fact_refs: [ci_open_storage_profile_domain_completion]}
fact_refs: [ci_fact_storage_parameters, ci_fact_tde_parameters, ci_fact_active_pages]
