schema_version: 1
kind: fixture
id: fixture_create_index_schema_qualified
name: CREATE INDEX 模式限定目标表
status: ready
description: >-
  为 schema.index_name 正向用例创建同一目标模式中的表，确保索引模式与表模式一致。
factor_ref: create_index
provides:
  tables:
    - name: ci_target_schema.t_ci_schema
      persistence: permanent
      table_kind: regular
      columns:
        - {name: id, type: INTEGER, nullable: false}
        - {name: note, type: VARCHAR(64), nullable: true}
        - {name: name, type: VARCHAR(64), nullable: true}
        - {name: postcode, type: CHAR(6), nullable: true}
seed:
  required: true
  rows:
    - {id: 1, note: one, name: Alpha, postcode: "100001"}
    - {id: 2, note: two, name: Beta, postcode: "100002"}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - "DROP SCHEMA IF EXISTS ci_target_schema CASCADE;"
    - "CREATE SCHEMA ci_target_schema;"
    - "CREATE TABLE ci_target_schema.t_ci_schema (id INTEGER NOT NULL, note VARCHAR(64), name VARCHAR(64), postcode CHAR(6));"
    - "INSERT INTO ci_target_schema.t_ci_schema (id, note, name, postcode) VALUES (1, 'one', 'Alpha', '100001'), (2, 'two', 'Beta', '100002');"
  teardown_sqls:
    - "DROP SCHEMA IF EXISTS ci_target_schema CASCADE;"
  note: 每个 case 独立重建模式；目标表和索引显式位于同一模式。
