facts:
- id: m_create_table_subpartition_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.18 L2-2
- id: m_create_table_subpartition_fact_syntax
  type: syntax
  statement: 二级建表：RANGE/LIST一级和HASH/KEY二级，两个层级各单列键。
  status: confirmed
  source_anchor: 2.4.2.8.18 L40-58
- id: m_create_table_subpartition_fact_combinations
  type: constraint
  statement: M只支持Range-Hash、Range-Key、List-Hash、List-Key四种组合。
  status: confirmed
  source_anchor: 2.4.2.8.18 L13-14
- id: m_create_table_subpartition_fact_single_key
  type: constraint
  statement: 一级分区键和二级分区键各自仅一列。
  status: confirmed
  source_anchor: 2.4.2.8.18 L17-17
- id: m_create_table_subpartition_fact_root_count
  type: constraint
  statement: 一级显式PARTITIONS值必须等于分区定义数。
  status: confirmed
  source_anchor: 2.4.2.8.18 L272-273
- id: m_create_table_subpartition_fact_sub_count
  type: constraint
  statement: 显式二级数量必须与SUBPARTITIONS相等，自动生成在每个父分区分别进行。
  status: confirmed
  source_anchor: 2.4.2.8.18 L284-293
- id: m_create_table_subpartition_fact_implicit
  type: metadata_oracle
  statement: 未列出二级定义且未指定数量时，每个父分区自动一个子分区。
  status: confirmed
  source_anchor: 2.4.2.8.18 L291-292
- id: m_create_table_subpartition_fact_row
  type: environment
  statement: 仅行存，不支持密态/账本库等；本批普通隔离M库。
  status: confirmed
  source_anchor: 2.4.2.8.18 L27-34
- id: m_create_table_subpartition_fact_storage
  type: syntax
  statement: STORAGE_TYPE可显式ASTORE，本批不依赖默认USTORE及其开关。
  status: confirmed
  source_anchor: 2.4.2.8.18 L214-223
- id: m_create_table_subpartition_fact_lookup
  type: behavior_oracle
  statement: 指定分区查询的PARTITION/SUBPARTITION写错可能变别名，不可只依无错误推导正确选区。
  status: confirmed
  source_anchor: 2.4.2.8.18 L30-31
- id: m_create_table_subpartition_fact_key_types
  type: constraint
  statement: 两层键类型约束与一级分区相同，COLUMNS只用于RANGE/LIST，表达式不能同时用COLUMNS。
  status: confirmed
  source_anchor: 2.4.2.8.18 L258-267
rules:
