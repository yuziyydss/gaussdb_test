facts:
- id: m_create_table_subpartition_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.18 L2-2
- id: m_create_table_subpartition_fact_syntax
  type: syntax
  statement: 二级建表：RANGE/LIST一级和HASH/KEY二级，两个层级各单列键。
  status: confirmed
  source_anchor: 2.4.2.8.18 L40-58
- id: m_create_table_subpartition_fact_combinations
  type: constraint
  statement: M只支持Range-Hash、Range-Key、List-Hash、List-Key四种组合。
  status: confirmed
  source_anchor: 2.4.2.8.18 L13-14
- id: m_create_table_subpartition_fact_single_key
  type: constraint
  statement: 一级分区键和二级分区键各自仅一列。
  status: confirmed
  source_anchor: 2.4.2.8.18 L17-17
- id: m_create_table_subpartition_fact_root_count
  type: constraint
  statement: 一级显式PARTITIONS值必须等于分区定义数。
  status: confirmed
  source_anchor: 2.4.2.8.18 L272-273
- id: m_create_table_subpartition_fact_sub_count
  type: constraint
  statement: 显式二级数量必须与SUBPARTITIONS相等，自动生成在每个父分区分别进行。
  status: confirmed
  source_anchor: 2.4.2.8.18 L284-293
- id: m_create_table_subpartition_fact_implicit
  type: metadata_oracle
  statement: 未列出二级定义且未指定数量时，每个父分区自动一个子分区。
  status: confirmed
  source_anchor: 2.4.2.8.18 L291-292
- id: m_create_table_subpartition_fact_row
  type: environment
  statement: 仅行存，不支持密态/账本库等；本批普通隔离M库。
  status: confirmed
  source_anchor: 2.4.2.8.18 L27-34
- id: m_create_table_subpartition_fact_storage
  type: syntax
  statement: STORAGE_TYPE可显式ASTORE，本批不依赖默认USTORE及其开关。
  status: confirmed
  source_anchor: 2.4.2.8.18 L214-223
- id: m_create_table_subpartition_fact_lookup
  type: behavior_oracle
  statement: 指定分区查询的PARTITION/SUBPARTITION写错可能变别名，不可只依无错误推导正确选区。
  status: confirmed
  source_anchor: 2.4.2.8.18 L30-31
- id: m_create_table_subpartition_fact_key_types
  type: constraint
  statement: 两层键类型约束与一级分区相同，COLUMNS只用于RANGE/LIST，表达式不能同时用COLUMNS。
  status: confirmed
  source_anchor: 2.4.2.8.18 L258-267
- id: m_ctsp_combination
  type: syntax
  statement: 二级分区组合方案仅支持4种：Range-Hash、Range-Key、List-Hash、List-Key。仅支持行存表。
  status: confirmed
  source_anchor: 2.4.2.8.18 L10-11
- id: m_ctsp_two_keys_single_col
  type: constraint
  statement: 二级分区表有两个分区键，每个分区键只能支持1列。
  status: confirmed
  source_anchor: 2.4.2.8.18 L18-26
- id: m_ctsp_unique_local_global
  type: behavior_oracle
  statement: 唯一/主键约束含所有分区键创建LOCAL索引否则GLOBAL。指定local唯一索引必须包含所有分区键。
  status: confirmed
  source_anchor: 2.4.2.8.18 L18-26
- id: m_ctsp_auto_subpartition
  type: behavior_oracle
  statement: 一级分区下不显式指定二级分区时自动创建同范围二级分区。一级分区至少有一个二级分区。
  status: confirmed
  source_anchor: 2.4.2.8.18 L18-26
- id: m_ctsp_max_partitions
  type: constraint
  statement: 最大分区数1048575（含一级和二级）。建议不超过400个。
  status: confirmed
  source_anchor: 2.4.2.8.18 L18-26
- id: m_ctsp_no_cluster
  type: constraint
  statement: 不支持cluster。不支持密态数据库和账本数据库。
  status: confirmed
  source_anchor: 2.4.2.8.18 L18-26
- id: m_ctsp_partition_keyword
  type: behavior_oracle
  statement: 指定分区查询时partition和subpartition关键字不能写错，写错不报错但查询变为对表起别名查询。
  status: confirmed
  source_anchor: 2.4.2.8.18 L18-26
- id: m_ctsp_for_values_constants
  type: constraint
  statement: PARTITION/SUBPARTITION FOR(VALUES)语法VALUES只能是常量，建议用强制类型转换。
  status: confirmed
  source_anchor: 2.4.2.8.18 L35-37
- id: m_ctsp_no_global_index_scan
  type: constraint
  statement: 指定分区语句目前不能走全局索引扫描。
  status: confirmed
  source_anchor: 2.4.2.8.18 L35-37
- id: m_ctsp_btree_only
  type: constraint
  statement: 目前只支持索引方法为btree。
  status: confirmed
  source_anchor: 2.4.2.8.18 L166
- id: m_ctsp_tde_storage
  type: environment
  statement: 支持透明加密存储参数：enable_tde、encrypt_algo、dek_cipher、key_type等。
  status: confirmed
  source_anchor: 2.4.2.8.18 L190-201
- id: m_ctsp_orientation_immutable
  type: constraint
  statement: orientation不支持修改。二级分区表只支持行存。
  status: confirmed
  source_anchor: 2.4.2.8.18 L211
- id: m_ctsp_unique_index_naming
  type: behavior_oracle
  statement: 唯一键constraint_name和index_name同时指定时索引名为constraint_name。
  status: confirmed
  source_anchor: 2.4.2.8.18 L154-157
- id: m_ctsp_generated_column
  type: constraint
  statement: STORED/VIRTUAL缺省STORED。不支持虚拟生成列上创建索引。s2下存储生成列基列不能与ON UPDATE/AUTO_INCREMENT共存。
  status: confirmed
  source_anchor: 2.4.2.8.18 L383-406
- id: m_ctsp_hash_partitions_auto
  type: syntax
  statement: HASH/KEY分区后指定PARTITIONS integer时不列出分区定义将自动生成对应数量分区。
  status: confirmed
  source_anchor: 2.4.2.8.18 L274-282
