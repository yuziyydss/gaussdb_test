  status: confirmed
  source_anchor: 2.4.2.6.16 L2-2
- id: m_alter_view_fact_syntax
  type: syntax
  statement: ALTER VIEW 默认值、重命名、模式移动、定义与 COMPILE 是不同产生式。
  status: confirmed
  source_anchor: 2.4.2.6.16 L20-49
- id: m_alter_view_fact_authority
  type: environment
  statement: 执行 ALTER VIEW 需要视图所有者或 ALTER 权限。
  status: confirmed
  source_anchor: 2.4.2.6.16 L8-10
- id: m_alter_view_fact_move_authority
  type: environment
  statement: 移动视图需要所有者身份及新模式 CREATE 权限。
  status: confirmed
  source_anchor: 2.4.2.6.16 L11-12
- id: m_alter_view_fact_defaults_noop
  type: behavior_oracle
  statement: 本章明确 SET/DROP DEFAULT 暂无实际意义，不能据此推导 INSERT DEFAULT 生效。
  status: confirmed
  source_anchor: 2.4.2.6.16 L62-62
- id: m_alter_view_fact_definition
  type: syntax
  statement: AS query 修改定义等价 CREATE OR REPLACE VIEW；支持检查选项。
  status: confirmed
  source_anchor: 2.4.2.6.16 L40-41
- id: m_alter_view_fact_check
  type: behavior_oracle
  statement: CHECK OPTION 缺省 CASCADED，LOCAL 与 CASCADED 的下层检查范围不同。
  status: confirmed
  source_anchor: 2.4.2.6.16 L74-78
- id: m_alter_view_fact_compile
  type: lifecycle
  statement: COMPILE 手工重编译；失效流程需补开发指南前置条件。
  status: confirmed
  source_anchor: 2.4.2.6.16 L80-84
- id: m_alter_view_fact_missing
  type: behavior_oracle
  statement: IF EXISTS 遇到不存在视图只提示，不产生错误。
  status: confirmed
  source_anchor: 2.4.2.6.16 L54-54
