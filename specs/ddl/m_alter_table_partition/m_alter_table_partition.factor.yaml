facts:
- id: m_alter_table_partition_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.13 L2-2
- id: m_alter_table_partition_fact_syntax
  type: "syntax"
  statement: ALTER TABLE可选IF EXISTS，后跟分区维护动作；此有限批单动作。
  status: confirmed
  source_anchor: 2.4.2.6.13 L34-35
- id: m_alter_table_partition_fact_authority
  type: environment
  statement: 分区表所有者或ALTER授权者可以维护分区。
  status: confirmed
  source_anchor: 2.4.2.6.13 L9-10
- id: m_alter_table_partition_fact_add_bound
  type: "constraint"
  statement: 新增RANGE上界必须大于当前末分区上界，类型一致且名称不重复。
  status: confirmed
  source_anchor: 2.4.2.6.13 L12-15
- id: m_alter_table_partition_fact_hash
  type: "constraint"
  statement: HASH不支持增删、切割、合并；本批只用真实RANGE表。
  status: confirmed
  source_anchor: 2.4.2.6.13 L21-21
- id: m_alter_table_partition_fact_last
  type: "constraint"
  statement: 只有一个分区时不能删除，本fixture起始3分区。
  status: confirmed
  source_anchor: 2.4.2.6.13 L18-18
- id: m_alter_table_partition_fact_global_index
  type: "lifecycle"
  statement: 分区维护可能令GLOBAL索引失效，enable_gpi_auto_update或s4改变自动更新行为；本批未创建索引。
  status: confirmed
  source_anchor: 2.4.2.6.13 L22-28
- id: m_alter_table_partition_fact_add
  type: "syntax"
  statement: ADD PARTITION包含括号内新分区定义。
  status: confirmed
  source_anchor: 2.4.2.6.13 L208-212
- id: m_alter_table_partition_fact_truncate
  type: "syntax"
  statement: TRUNCATE PARTITION支持名称列表、ALL或FOR常量值。
  status: confirmed
  source_anchor: 2.4.2.6.13 L234-235
- id: m_alter_table_partition_fact_analyze
  type: "syntax"
  statement: ANALYZE PARTITION可指定名称/列表/ALL，示例补充主语法未闭合括号。
  status: confirmed
  source_anchor: 2.4.2.6.13 L543-546
- id: m_alter_table_partition_fact_rename
  type: "syntax"
  statement: RENAME PARTITION名称或FOR值到新名。
  status: confirmed
  source_anchor: 2.4.2.6.13 L242-242
- id: m_alter_table_partition_fact_split
  type: "constraint"
  statement: RANGE切割点必须在目标范围内部，指定AT时分为两个新分区。
  status: confirmed
  source_anchor: 2.4.2.6.13 L126-127
- id: m_alter_table_partition_fact_merge
  type: "constraint"
  statement: RANGE合并源需连续递增；本批ASTORE，不套用Ustore事务限制。
  status: confirmed
  source_anchor: 2.4.2.6.13 L98-103
- id: m_alter_table_partition_fact_exchange
  type: "constraint"
  statement: 交换要求列、物理删除列、约束、索引、存储等严格一致；当前不提供交换清单。
  status: confirmed
  source_anchor: 2.4.2.6.13 L58-71
- id: m_atp_purpose
  type: example
  statement: 修改表分区：增加/删除/切割/合并/清空/移动/交换/重命名/收集/自动扩展/修改属性。
  status: confirmed
  source_anchor: 2.4.2.6.13 L4-6
- id: m_atp_no_pg_global
  type: example
  statement: 添加分区的表空间不能是pg_global。
  status: confirmed
  source_anchor: 2.4.2.6.13 L11-11
- id: m_atp_no_hash_add
  type: example
  statement: 不支持添加哈希分区。哈希分区不支持切割/合并/添加/删除分区。
  status: confirmed
  source_anchor: 2.4.2.6.13 L16-17
- id: m_atp_range_add_boundary
  type: example
  statement: 添加RANGE分区键值要大于最后一个范围分区上边界。添加LIST分区键值不能与现有重复。
  status: confirmed
  source_anchor: 2.4.2.6.13 L8-20
- id: m_atp_partition_for_values
  type: example
  statement: PARTITION FOR()括号里指定值个数应与定义分区时列数相同且一一对应。
  status: confirmed
  source_anchor: 2.4.2.6.13 L19-20
- id: m_atp_max_partitions
  type: example
  statement: 已有分区数达最大值1048575时不能继续添加。只有一个分区时不能删除。
  status: confirmed
  source_anchor: 2.4.2.6.13 L8-20
- id: m_atp_global_index_invalidation
  type: example
  statement: 删除/切割/合并/清空/交换分区使GLOBAL索引失效。可申明UPDATE GLOBAL INDEX同步更新。enable_gpi_auto_update=on或s4时自动更新。
  status: confirmed
  source_anchor: 2.4.2.6.13 L8-20
- id: m_atp_action_order
  type: example
  statement: 多个分区维护子句时无论排序如何，先执行DROP PARTITION再ADD PARTITION，最后顺序执行其它。
  status: confirmed
  source_anchor: 2.4.2.6.13 L37-45
- id: m_atp_exchange
  type: example
  statement: 交换后普通表和分区数据置换，表空间信息也置换。一级分区与普通表交换，二级分区与普通表交换。
  status: confirmed
  source_anchor: 2.4.2.6.13 L74-89
- id: m_atp_merge
  type: example
  statement: merge_clause把多个分区合并成一个分区。合并的源分区必须是连续分区。
  status: confirmed
  source_anchor: 2.4.2.6.13 L91-94
- id: m_atp_split
  type: example
  statement: split_clause把一个分区切割成多个分区。SPLIT后分区名可与源相同视为不同分区。切割点须是源分区非空真子集。
  status: confirmed
  source_anchor: 2.4.2.6.13 L105-136
- id: m_atp_split_range_maxvalue
  type: example
  statement: RANGE分区支持MAXVALUE关键字不带括号；不支持二级分区子分区指定MAXVALUE切割。
  status: confirmed
  source_anchor: 2.4.2.6.13 L164-165
- id: m_atp_split_list_subset
  type: example
  statement: 列表分区不指定切割点时每个新分区须是源分区非空真子集且互不相交。
  status: confirmed
  source_anchor: 2.4.2.6.13 L202-205
- id: m_atp_owner_permission
  type: environment
  statement: 分区表所有者或ALTER权限用户可执行；三权分立关闭时系统管理员默认有权限。
  status: confirmed
  source_anchor: 2.4.2.6.13 L8-10
rules:
- id: m_alter_table_partition_rule_add_above_last
  kind: requires
  expression: action != 'm_alter_table_partition_action_bad_add'
  fact_refs:
