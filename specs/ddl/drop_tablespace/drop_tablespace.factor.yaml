facts:
  -
    id: "drop_tablespace_fact_body_5"
    type: "behavior_oracle"
    statement: "删除一个表空间。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "drop_tablespace_fact_body_8"
    type: "environment"
    statement: "●    仅表空间所有者或者被授予了表空间DROP权限的用户可以执行该操作，系统管理 员默认拥有此权限。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "drop_tablespace_fact_body_10"
    type: "behavior_oracle"
    statement: "●    在删除一个表空间之前，表空间里面不能有任何数据库对象，否则会报错。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "drop_tablespace_fact_body_11"
    type: "behavior_oracle"
    statement: "●    删除表空间后不支持回滚，因此，不能在事务块内部执行删除表空间操作。"
    status: "confirmed"
    source_anchor: "L11-L11"
  -
    id: "drop_tablespace_fact_body_12"
    type: "behavior_oracle"
    statement: "●    执行删除表空间操作时，如果存在执行\\db查询操作的其他会话，可能会由于表空 间事务的原因导致查询失败，请重新执行\\db查询操作。"
    status: "confirmed"
    source_anchor: "L12-L13"
  -
    id: "drop_tablespace_fact_body_14"
    type: "constraint"
    statement: "●    如果执行DROP TABLESPACE失败，需要再次执行一次DROP TABLESPACE IF EXISTS。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "drop_tablespace_fact_grammar_line_18"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：DROP TABLESPACE [ IF EXISTS ] tablespace_name;"
    status: "confirmed"
    source_anchor: "L18-L18"
  -
    id: "drop_tablespace_fact_body_24"
    type: "constraint"
    statement: "●    IF EXISTS 判断指定的表空间是否存在。"
    status: "confirmed"
    source_anchor: "L24-L25"
  -
    id: "drop_tablespace_fact_body_26"
    type: "behavior_oracle"
    statement: "–    如果指定的表空间存在，则删除成功。"
    status: "confirmed"
    source_anchor: "L26-L26"
  -
    id: "drop_tablespace_fact_body_27"
    type: "behavior_oracle"
    statement: "–    如果指定的表空间不存在，不会进行删除操作，仅产生一个NOTICE提示，用 于告知指定的表空间不存在。"
    status: "confirmed"
    source_anchor: "L27-L28"
  -
    id: "drop_tablespace_fact_body_29"
    type: "constraint"
    statement: "●    tablespace_name 表空间的名称。"
    status: "confirmed"
    source_anchor: "L29-L31"
  -
    id: "drop_tablespace_fact_body_29_1"
    type: "constraint"
    statement: "取值范围：已存在的表空间的名称。"
    status: "confirmed"
    source_anchor: "L29-L31"
  -
    id: "drop_tablespace_fact_example_34"
    type: "example"
    statement: "示例原文片段：--创建表空间。 gaussdb=# CREATE TABLESPACE tbs_location1 RELATIVE LOCATION 'test_tablespace/test_tablespace_1';"
    status: "confirmed"
    source_anchor: "L34-L35"
  -
    id: "drop_tablespace_fact_example_37"
    type: "example"
    statement: "示例原文片段：--删除表空间。 gaussdb=# DROP TABLESPACE tbs_location1;"
    status: "confirmed"
    source_anchor: "L37-L38"
  -
    id: "drop_tablespace_fact_runtime_contract"
    type: "environment"
    statement: "需要空表空间、事务外执行和专用目录清理合同；当前仅限专用空RELATIVE表空间，不删除业务表空间。"
    status: "confirmed"
    source_anchor: "L5-L15"
