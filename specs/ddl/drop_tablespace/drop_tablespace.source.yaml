    section: "正文"
    source_anchor: "L8-L9"
    line_start: 8
    line_end: 9
    statement: "●    仅表空间所有者或者被授予了表空间DROP权限的用户可以执行该操作，系统管理 员默认拥有此权限。"
    status: "mapped"
    fact_refs:
      - "drop_tablespace_fact_body_8"
    atomicity: "atomic"
  -
    id: "drop_tablespace_su_body_10_10"
    section: "正文"
    source_anchor: "L10-L10"
    line_start: 10
    line_end: 10
    statement: "●    在删除一个表空间之前，表空间里面不能有任何数据库对象，否则会报错。"
    status: "mapped"
    fact_refs:
      - "drop_tablespace_fact_body_10"
    atomicity: "atomic"
  -
    id: "drop_tablespace_su_body_11_11"
    section: "正文"
    source_anchor: "L11-L11"
    line_start: 11
    line_end: 11
    statement: "●    删除表空间后不支持回滚，因此，不能在事务块内部执行删除表空间操作。"
    status: "mapped"
    fact_refs:
      - "drop_tablespace_fact_body_11"
    atomicity: "atomic"
  -
    id: "drop_tablespace_su_body_12_12"
    section: "正文"
    source_anchor: "L12-L13"
    line_start: 12
    line_end: 13
    statement: "●    执行删除表空间操作时，如果存在执行\\db查询操作的其他会话，可能会由于表空 间事务的原因导致查询失败，请重新执行\\db查询操作。"
    status: "mapped"
    fact_refs:
      - "drop_tablespace_fact_body_12"
    atomicity: "atomic"
  -
    id: "drop_tablespace_su_body_14_14"
    section: "正文"
    source_anchor: "L14-L15"
    line_start: 14
    line_end: 15
    statement: "●    如果执行DROP TABLESPACE失败，需要再次执行一次DROP TABLESPACE IF EXISTS。"
    status: "mapped"
    fact_refs:
      - "drop_tablespace_fact_body_14"
    atomicity: "atomic"
  -
    id: "drop_tablespace_su_grammar_line_18_18"
    section: "正文"
    source_anchor: "L18-L18"
    line_start: 18
    line_end: 18
    statement: "语法产生式片段（与本段其他行共同组成结构）：DROP TABLESPACE [ IF EXISTS ] tablespace_name;"
    status: "mapped"
    fact_refs:
      - "drop_tablespace_fact_grammar_line_18"
    atomicity: "atomic"
    atomicity_rationale: "L18：原文产生式的一行；仅登记结构来源，不将其直接作为可执行 SQL。"
