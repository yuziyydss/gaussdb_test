    source_anchor: "L26-L26"
    line_start: 26
    line_end: 26
    statement: "–    如果指定的表空间存在，则删除成功。"
    status: "mapped"
    fact_refs:
      - "drop_tablespace_fact_body_26"
    atomicity: "atomic"
  -
