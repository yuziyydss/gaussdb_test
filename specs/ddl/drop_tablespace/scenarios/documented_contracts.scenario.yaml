schema_version: 1
kind: "scenario"
id: "scenario_drop_tablespace_documented_contracts"
name: "DROP TABLESPACE documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "drop_tablespace"
fixture_refs: []
fact_refs:
  - "drop_tablespace_fact_body_5"
  - "drop_tablespace_fact_body_8"
  - "drop_tablespace_fact_body_10"
  - "drop_tablespace_fact_body_11"
  - "drop_tablespace_fact_body_12"
  - "drop_tablespace_fact_body_14"
  - "drop_tablespace_fact_body_24"
  - "drop_tablespace_fact_body_26"
  - "drop_tablespace_fact_body_27"
  - "drop_tablespace_fact_body_29"
  - "drop_tablespace_fact_body_29_1"
  - "create_tablespace::create_tablespace_fact_body_9"
preconditions:
  - "不能用新Schema隔离文件系统表空间；须另行授权独占测试环境，核实目录/符号链接和对象归属，不能碰预存同名对象。"
  - "CREATE与DROP不得放在事务块；ALTER按目标行存形态核实非事务限制。部分创建失败仍可能留下文件，SQL回滚不能证明恢复完成。"
  - "先实现本次创建回执、空表空间确认及部分失败恢复审查；文档的手工清理说明不是本项目自动删除文件或重复DROP的授权。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "删除一个表空间。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "●    仅表空间所有者或者被授予了表空间DROP权限的用户可以执行该操作，系统管理 员默认拥有此权限。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "●    在删除一个表空间之前，表空间里面不能有任何数据库对象，否则会报错。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "●    删除表空间后不支持回滚，因此，不能在事务块内部执行删除表空间操作。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "●    执行删除表空间操作时，如果存在执行\\db查询操作的其他会话，可能会由于表空 间事务的原因导致查询失败，请重新执行\\db查询操作。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "●    如果执行DROP TABLESPACE失败，需要再次执行一次DROP TABLESPACE IF EXISTS。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "●    IF EXISTS 判断指定的表空间是否存在。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "–    如果指定的表空间存在，则删除成功。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "–    如果指定的表空间不存在，不会进行删除操作，仅产生一个NOTICE提示，用 于告知指定的表空间不存在。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "●    tablespace_name 表空间的名称。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "取值范围：已存在的表空间的名称。"
  -
    id: "upstream_contract_0"
    action: "verify_documented_contract"
    note: "使用已导出的跨章事实 create_tablespace::create_tablespace_fact_body_9；来源变化须使本包验证快照过期，尚未执行数据库验证。"
oracles:
  -
    kind: "documented_behavior"
    expected: "删除一个表空间。"
  -
    kind: "documented_behavior"
    expected: "●    在删除一个表空间之前，表空间里面不能有任何数据库对象，否则会报错。"
  -
    kind: "documented_behavior"
    expected: "●    删除表空间后不支持回滚，因此，不能在事务块内部执行删除表空间操作。"
  -
    kind: "documented_behavior"
    expected: "●    执行删除表空间操作时，如果存在执行\\db查询操作的其他会话，可能会由于表空 间事务的原因导致查询失败，请重新执行\\db查询操作。"
  -
    kind: "documented_behavior"
    expected: "–    如果指定的表空间存在，则删除成功。"
  -
    kind: "documented_behavior"
    expected: "–    如果指定的表空间不存在，不会进行删除操作，仅产生一个NOTICE提示，用 于告知指定的表空间不存在。"
execution_requirements:
  - "database"
  - "same_session"
  - "nontransactional_execution_review"
  - "tablespace_filesystem_inventory"
  - "owned_tablespace_receipts"
  - "partial_failure_recovery_review"
