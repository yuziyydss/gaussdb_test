facts:
- id: m_drop_function_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.9.8 L2-2
- id: m_drop_function_fact_internal
  type: environment
  statement: 内部使用功能，不支持用户使用；只建受限离线候选。
  status: confirmed
  source_anchor: 2.4.2.9.8 L9-9
- id: m_drop_function_fact_syntax
  type: syntax
  statement: DROP FUNCTION 可省略或指定签名；RESTRICT/CASCADE 随显式签名分支。
  status: confirmed
  source_anchor: 2.4.2.9.8 L18-19
- id: m_drop_function_fact_owner
  type: environment
  statement: 删除需要函数所有者或 DROP 权限；本批由 fixture 创建者删除。
  status: confirmed
  source_anchor: 2.4.2.9.8 L14-15
- id: m_drop_function_fact_temporary
  type: constraint
  statement: 涉及临时表操作的函数无法用 DROP FUNCTION 删除；本批纯整数函数无表依赖。
  status: confirmed
  source_anchor: 2.4.2.9.8 L13-13
- id: m_drop_function_fact_overloads
  type: constraint
  statement: 同名重载删除时必须提供参数列表，否则报错。
  status: confirmed
  source_anchor: 2.4.2.9.8 L59-59
- id: m_drop_function_fact_restrict
  type: behavior_oracle
  statement: RESTRICT 遇到依赖对象拒绝删除，本批不建立函数依赖者。
  status: confirmed
  source_anchor: 2.4.2.9.8 L39-39
- id: m_drop_function_fact_missing
  type: behavior_oracle
  statement: IF EXISTS 对缺失函数产出 NOTICE 而不报错。
  status: confirmed
  source_anchor: 2.4.2.9.8 L26-27
rules:
