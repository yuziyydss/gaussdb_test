schema_version: 1
kind: "manifest"
id: "manifest_alter_audit_policy_enable"
name: "ALTER AUDIT POLICY enable"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "alter_audit_policy"
syntax_ref: "syntax_alter_audit_policy"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_alter_audit_policy_existing_policy"
identifier_policy: {}
bindings:
  if_exists:
    - "alter_audit_policy_if_exists_none"
    - "alter_audit_policy_if_exists_yes"
  operation:
    - "alter_audit_policy_operation_enable"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "security_policy_admin"
    allowed_values:
      - "true"
    fact_refs:
      - "alter_audit_policy_fact_privilege"
  -
    key: "enable_security_policy"
    allowed_values:
      - "on"
    fact_refs:
      - "alter_audit_policy_fact_switch"
