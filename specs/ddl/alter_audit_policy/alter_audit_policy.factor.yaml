facts:
  -
    id: "alter_audit_policy_fact_purpose"
    type: "lifecycle"
    statement: "修改统一审计策略。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "alter_audit_policy_fact_privilege"
    type: "environment"
    statement: "维护需要POLADMIN、SYSADMIN或初始用户。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "alter_audit_policy_fact_switch"
    type: "environment"
    statement: "enable_security_policy开启才使统一审计策略生效。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "alter_audit_policy_fact_change_actions"
    type: "syntax"
    statement: "原文选项/产生式：添加/删除审计策略中的操作类型。 [[PDF_PAGE physical=1197 printed=1148]] ALTER AUDIT POLICY [ IF EXISTS ] policy_name { ADD | REMOVE } { [ privilege_audit_clause ] [ access_audit_clause ] };"
    status: "confirmed"
    source_anchor: "L13-L16"
  -
    id: "alter_audit_policy_fact_modify_filter"
    type: "syntax"
    statement: "原文选项/产生式：修改审计策略中的过滤条件。 ALTER AUDIT POLICY [ IF EXISTS ] policy_name MODIFY ( filter_group_clause );"
    status: "confirmed"
    source_anchor: "L21-L22"
  -
    id: "alter_audit_policy_fact_drop_filter"
    type: "syntax"
    statement: "原文选项/产生式：将审计策略中的过滤条件删除。 ALTER AUDIT POLICY [ IF EXISTS ] policy_name DROP FILTER;"
    status: "confirmed"
    source_anchor: "L27-L28"
  -
    id: "alter_audit_policy_fact_comments"
    type: "syntax"
    statement: "原文选项/产生式：修改审计策略描述。 ALTER AUDIT POLICY [ IF EXISTS ] policy_name COMMENTS policy_comments;"
    status: "confirmed"
    source_anchor: "L33-L34"
  -
    id: "alter_audit_policy_fact_enabled"
    type: "syntax"
    statement: "原文选项/产生式：打开或者关闭审计策略。 ALTER AUDIT POLICY [ IF EXISTS ] policy_name { ENABLE | DISABLE };"
    status: "confirmed"
    source_anchor: "L39-L40"
  -
    id: "alter_audit_policy_fact_privilege_clause"
    type: "syntax"
    statement: "原文选项/产生式：●    privilege_audit_clause： 审计策略中具体的PRIVILEGES操作类型及目标资源标签。 PRIVILEGES ({ PRIVILEGES | ALL } [ ON LABEL ( resource_label_name [, ... ] ) ])"
    status: "confirmed"
    source_anchor: "L45-L47"
  -
    id: "alter_audit_policy_fact_access_clause"
    type: "syntax"
    statement: "原文选项/产生式：●    access_audit_clause： 审计策略中具体的ACCESS操作类型及目标资源标签。 ACCESS ({ ACCESS | ALL } [ ON LABEL ( resource_label_name [, ... ] ) ])"
    status: "confirmed"
    source_anchor: "L52-L54"
  -
    id: "alter_audit_policy_fact_filter_clause"
    type: "syntax"
    statement: "原文选项/产生式：●    filter_group_clause： 审计策略中的过滤条件。 FILTER ON { filter_type ( filter_value [, ... ] ) } [, ... ]"
    status: "confirmed"
    source_anchor: "L59-L61"
  -
    id: "alter_audit_policy_fact_privileges"
    type: "syntax"
    statement: "原文选项/产生式：●    PRIVILEGES： 指的是针对数据库执行如下操作时进行审计。 { ( ALTER | ANALYZE | COMMENT | CREATE | DROP | GRANT | REVOKE | SET | SHOW ) }"
    status: "confirmed"
    source_anchor: "L66-L68"
  -
    id: "alter_audit_policy_fact_access"
    type: "syntax"
    statement: "原文选项/产生式：●   ACCESS： 指的是针对数据库执行如下操作时进行审计。 { ( COPY | DEALLOCATE | DELETE | EXECUTE | REINDEX | INSERT | PREPARE | SELECT | TRUNCATE | UPDATE ) }"
    status: "confirmed"
    source_anchor: "L70-L73"
  -
    id: "alter_audit_policy_fact_unique"
    type: "constraint"
    statement: "已有策略名称唯一。"
    status: "confirmed"
    source_anchor: "L79-L80"
  -
    id: "alter_audit_policy_fact_identifier"
    type: "constraint"
    statement: "策略名遵守标识符规范。"
    status: "confirmed"
    source_anchor: "L81-L81"
  -
    id: "alter_audit_policy_fact_label"
    type: "syntax"
    statement: "操作可指向资源标签。"
    status: "confirmed"
    source_anchor: "L82-L83"
  -
    id: "alter_audit_policy_fact_privileges_repeat"
    type: "syntax"
    statement: "权限审计包含CREATE/ALTER/DROP/ANALYZE/COMMENT/GRANT/REVOKE/SET/SHOW。"
    status: "confirmed"
    source_anchor: "L84-L86"
  -
    id: "alter_audit_policy_fact_access_repeat"
    type: "syntax"
    statement: "访问审计包含SELECT/COPY/DEALLOCATE/DELETE/EXECUTE/INSERT/PREPARE/REINDEX/TRUNCATE/UPDATE。"
    status: "confirmed"
    source_anchor: "L87-L91"
  -
    id: "alter_audit_policy_fact_all_scope"
    type: "behavior_oracle"
    statement: "ALL只指所属审计类别的全部操作。"
    status: "confirmed"
    source_anchor: "L92-L95"
  -
    id: "alter_audit_policy_fact_filter_types"
    type: "syntax"
    statement: "支持IP、ROLES、APP过滤。"
    status: "confirmed"
    source_anchor: "L96-L97"
  -
    id: "alter_audit_policy_fact_filter_value"
    type: "syntax"
    statement: "过滤器需具体值。"
    status: "confirmed"
    source_anchor: "L98-L99"
  -
    id: "alter_audit_policy_fact_comment_text"
