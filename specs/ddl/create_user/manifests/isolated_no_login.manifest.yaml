schema_version: 1
kind: "manifest"
id: "manifest_create_user_isolated_no_login"
name: "CREATE USER isolated_no_login"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "create_user"
syntax_ref: "syntax_create_user"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_create_user_new_user"
identifier_policy: {}
bindings:
  with_keyword:
    - "create_user_with_keyword_none"
    - "create_user_with_keyword_with"
  password_keyword:
    - "create_user_password_keyword_password"
    - "create_user_password_keyword_identified"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "user_creator_authorized"
    allowed_values:
      - "true"
    fact_refs:
      - "create_role::create_role_fact_privilege"
  -
    key: "password_disable_admin"
    allowed_values:
      - "true"
    fact_refs:
      - "create_role::create_role_fact_disable_admin"
