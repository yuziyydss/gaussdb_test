fact_refs:
  - "create_user_fact_purpose"
  - "create_user_fact_authentication"
  - "create_user_fact_default_login"
  - "create_user_fact_same_schema"
  - "create_user_fact_admin_schema_owner"
  - "create_user_fact_name"
  - "create_user_fact_identifier_chars"
  - "create_user_fact_redis_reserved"
  - "create_user_fact_password"
  - "create_user_fact_password_length"
  - "create_user_fact_password_username"
  - "create_user_fact_password_classes"
  - "create_user_fact_ciphertext"
  - "create_user_fact_identifier_start"
  - "create_user_fact_password_symbol_domain"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "创建具有指定密码的新用户。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "用户是认证基础，凭用户名密码登录并按授权操作。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "CREATE USER默认LOGIN。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "在执行命令的数据库自动创建同名SCHEMA。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "管理员在普通用户同名SCHEMA中创建对象，所有者为同名普通用户。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "用户名合法、最多63字符，超长截断，未引用大写折叠。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "名称由字母/下划线/数字/美元组成，以字母或下划线开头。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "不能创建redisuser。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "密码用于登录认证。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "默认至少8字符。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "不得等于用户名或其倒序。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "大小写字母、数字、限定特殊字符四类中至少三类。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "可导入符合格式密文但不校验明文复杂度，用户须保证安全且不推荐直接使用。"
  -
    id: "check_create_user_fact_identifier_start"
    action: "verify_documented_contract"
    note: "名称首字符必须为字母或下划线。"
  -
    id: "check_create_user_fact_password_symbol_domain"
    action: "verify_documented_contract"
    note: "原文限定的符号与字符类别全文：–     至少包含大写字母（A~Z）、小写字母（a~z）、数字（0~9）和非字母数字 字符（限定为~!@#$%^&*()-_=+\\|[{}];:,<.>/?）四类字符中的三类字符。"
oracles:
  -
    kind: "documented_behavior"
    expected: "管理员在普通用户同名SCHEMA中创建对象，所有者为同名普通用户。"
execution_requirements:
  - "database"
  - "same_session"
