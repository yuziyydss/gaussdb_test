rules:
- id: m_alter_schema_rule_charset_pair
  kind: requires
  expression: form != 'm_alter_schema_form_combined' or ((charset in ['m_alter_schema_charset_utf8', 'm_alter_schema_charset_utf8mb4']
    and collation in ['m_alter_schema_collation_utf8', 'm_alter_schema_collation_utf8mb4']) or (charset == 'm_alter_schema_charset_gbk'
    and collation == 'm_alter_schema_collation_gbk'))
  fact_refs:
  - m_alter_database::m_alter_database_fact_charset_pair
  severity: error
