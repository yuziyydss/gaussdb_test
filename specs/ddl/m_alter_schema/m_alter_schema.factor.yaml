  source_anchor: M-Compatibility L4-4
- id: m_alter_schema_fact_constraint
  type: constraint
  statement: m_alter_schema的M-Compatibility注意事项和限制。
  status: confirmed
  source_anchor: M-Compatibility L8-8
- id: m_alter_schema_fact_params
  type: syntax
  statement: m_alter_schema的参数说明。
  status: confirmed
  source_anchor: M-Compatibility L35-40
- id: m_alter_schema_fact_example
