facts:
- id: m_alter_schema_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.9 L2-2
- id: m_alter_schema_fact_syntax
  type: syntax
  statement: M ALTER DATABASE/SCHEMA 修改命名空间字符集、字符序；不是物理数据库参数。
  status: confirmed
  source_anchor: 2.4.2.6.9 L25-32
- id: m_alter_schema_fact_namespace
  type: environment
  statement: DATABASE 与 SCHEMA 在 M 中为同义词。
  status: confirmed
  source_anchor: 2.4.2.6.9 L5-6
- id: m_alter_schema_fact_authority
  type: environment
  statement: 修改属性需要命名空间所有者或 ALTER 权限；本批限定 case 所有者并有当前库 CREATE 权限。
  status: confirmed
  source_anchor: 2.4.2.6.9 L9-12
- id: m_alter_schema_fact_owner
  type: environment
  statement: 转移所有者另需当前用户为新所有者角色成员。
  status: confirmed
  source_anchor: 2.4.2.6.9 L12-13
- id: m_alter_schema_fact_description_conflict
  type: open_question
  statement: 本章 COLLATE/CHARSET 的字符集/字符分类描述混用；以本 PDF 2.3、2.3.2 关联表解释，保留本章术语差异。
  status: needs_verification
  source_anchor: 2.4.2.6.9 L45-47
- id: m_alter_schema_fact_purpose
  type: syntax
  statement: m_alter_schema的M-Compatibility语法功能描述。
