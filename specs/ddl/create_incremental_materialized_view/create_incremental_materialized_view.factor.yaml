    status: "confirmed"
    source_anchor: "L51-L52"
  -
    id: "create_incremental_materialized_view_fact_create_example"
    type: "example"
    statement: "建表空间与 ASTORE 源表后创建增量视图。"
    status: "confirmed"
    source_anchor: "L55-L63"
  -
    id: "create_incremental_materialized_view_fact_stale_example"
    type: "example"
    statement: "基表写入但未刷新时物化结果为空。"
    status: "confirmed"
    source_anchor: "L65-L72"
  -
    id: "create_incremental_materialized_view_fact_refresh_example"
    type: "example"
    statement: "增量刷新后结果包含新行。"
    status: "confirmed"
    source_anchor: "L74-L82"
  -
    id: "create_incremental_materialized_view_fact_cleanup_example"
