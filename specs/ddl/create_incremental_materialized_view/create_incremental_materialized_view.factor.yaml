  -
    id: "create_incremental_materialized_view_fact_source_restrictions"
    type: "constraint"
    statement: "不支持 DATABASE LINK/临时/全局临时基表。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "create_incremental_materialized_view_fact_simple_union"
    type: "constraint"
    statement: "仅简单过滤查询及基表 UNION ALL。"
    status: "confirmed"
    source_anchor: "L20-L20"
  -
    id: "create_incremental_materialized_view_fact_unsupported_queries"
    type: "constraint"
    statement: "不支持 WITH/GROUP BY/ORDER BY/LIMIT/WINDOW/DISTINCT/聚合及除 UNION ALL 外子查询。"
    status: "confirmed"
    source_anchor: "L21-L23"
  -
    id: "create_incremental_materialized_view_fact_base_ddl"
    type: "constraint"
    statement: "创建后基表绝大多数 DDL 不支持，未逐项枚举。"
    status: "confirmed"
    source_anchor: "L24-L24"
  -
    id: "create_incremental_materialized_view_fact_no_iud"
    type: "constraint"
    statement: "不支持对增量物化视图 INSERT/UPDATE/DELETE。"
    status: "confirmed"
    source_anchor: "L25-L25"
  -
    id: "create_incremental_materialized_view_fact_refresh_sync"
    type: "behavior_oracle"
    statement: "基表修改后需刷新同步物化结果。"
    status: "confirmed"
    source_anchor: "L26-L27"
  -
    id: "create_incremental_materialized_view_fact_no_ustore"
    type: "constraint"
    statement: "Ustore 不支持创建和使用物化视图。"
    status: "confirmed"
    source_anchor: "L28-L28"
  -
    id: "create_incremental_materialized_view_fact_syntax"
    type: "syntax"
    statement: "CREATE INCREMENTAL MATERIALIZED VIEW 可列别名和表空间，后接 AS query。"
    status: "confirmed"
    source_anchor: "L31-L34"
  -
    id: "create_incremental_materialized_view_fact_name"
    type: "syntax"
    statement: "物化视图名可模式限定，满足标识符规则。"
    status: "confirmed"
    source_anchor: "L40-L42"
  -
    id: "create_incremental_materialized_view_fact_column_count"
    type: "constraint"
    statement: "显式别名数须等于查询结果列数，省略则继承输出列名。"
    status: "confirmed"
    source_anchor: "L43-L47"
  -
    id: "create_incremental_materialized_view_fact_tablespace"
    type: "syntax"
    statement: "表空间可省略，省略采用默认。"
    status: "confirmed"
    source_anchor: "L48-L50"
  -
    id: "create_incremental_materialized_view_fact_query"
    type: "syntax"
