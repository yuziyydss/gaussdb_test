    status: "confirmed"
    source_anchor: "L84-L91"
  -
    id: "create_incremental_materialized_view_fact_ddl_matrix"
    type: "open_question"
    statement: "绝大多数 DDL 的逐项禁止列表缺失，不能臆造全禁规则。"
    status: "needs_verification"
    source_anchor: "L24-L24"
  -
    id: "create_incremental_materialized_view_fact_tablespace_profile"
    type: "open_question"
    statement: "非默认表空间需预配置权限和目录，不在本批创建。"
    status: "needs_verification"
    source_anchor: "L48-L50"
  -
    id: "create_incremental_materialized_view_fact_complex_queries"
    type: "open_question"
    statement: "复杂查询目标负向仅选DISTINCT；其他禁止子句需独立负向和准确Oracle。"
    status: "needs_verification"
    source_anchor: "L21-L23"
