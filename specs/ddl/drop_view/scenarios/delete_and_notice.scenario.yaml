schema_version: 1
kind: "scenario"
id: "scenario_drop_view_delete_and_notice"
name: "DROP VIEW delete_and_notice"
status: "planned"
description: "区分真实删除与缺失 NOTICE；同一会话顺序执行。"
factor_ref: "drop_view"
fixture_refs:
  - "fixture_drop_view_views"
fact_refs:
  - "drop_view_fact_purpose"
  - "drop_view_fact_existing"
  - "drop_view_fact_notice"
  - "drop_view_fact_missing_error"
  - "drop_view_fact_error_identity"
preconditions: []
steps:
  -
    id: "drop"
    action: "execute_sql"
    sql: "DROP VIEW v_dv_one;"
  -
    id: "missing"
    action: "execute_sql"
    sql: "DROP VIEW IF EXISTS v_dv_one;"
oracles:
  -
    after_step: "drop"
    kind: "relation_absent"
    expected: "v_dv_one"
  -
    after_step: "missing"
    kind: "notice"
    expected: "对象不存在且语句不报错"
execution_requirements:
  - "database"
  - "same_session"
