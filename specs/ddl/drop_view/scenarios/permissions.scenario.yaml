schema_version: 1
kind: "scenario"
id: "scenario_drop_view_permissions"
name: "DROP VIEW permissions"
status: "planned"
description: "逐个角色与三权分立开关验证 DROP VIEW 权限，不对共享系统改开关。"
factor_ref: "drop_view"
fixture_refs: []
fact_refs:
  - "drop_view_fact_authorization"
  - "drop_view_fact_sysadmin"
preconditions:
  - "预配置隔离权限环境"
steps:
  -
    id: "roles"
    action: "permission_matrix"
    roles:
      - "view_owner"
      - "schema_owner"
      - "drop_grantee"
      - "drop_any_table_grantee"
      - "sysadmin"
      - "unprivileged"
oracles:
  -
    after_step: "roles"
    kind: "authorization_matrix"
    expected: "按正文权限分支判定"
execution_requirements:
  - "database"
  - "same_session"
