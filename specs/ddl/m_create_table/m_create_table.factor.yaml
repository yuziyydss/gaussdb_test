facts:
- id: m_create_table_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.16 L2-2
- id: m_create_table_fact_authority
  type: environment
  statement: 被授予CREATE ANY TABLE权限的用户可在PUBLIC和用户模式创建表。
  status: confirmed
  source_anchor: 2.4.2.8.16 L12-13
- id: m_create_table_fact_syntax
  type: "syntax"
  statement: 普通列定义与 LIKE 是不同顶层产生式。
  status: confirmed
  source_anchor: 2.4.2.8.16 L18-31
- id: m_create_table_fact_default
  type: "syntax"
  statement: 表列缺省可为常量；缺省表达式在省略赋值时使用。
  status: confirmed
  source_anchor: 2.4.2.8.16 L399-412
- id: m_create_table_fact_generated
  type: "constraint"
  statement: 生成列不能指定 DEFAULT 缺省属性。
  status: confirmed
  source_anchor: 2.4.2.8.16 L458-458
- id: m_create_table_fact_generated_storage
  type: "syntax"
  statement: 生成列可显式使用 STORED/VIRTUAL。
  status: confirmed
  source_anchor: 2.4.2.8.16 L441-447
- id: m_create_table_fact_generated_recompute
  type: "behavior_oracle"
  statement: 插入或更新元组时，由生成表达式计算存储生成列的列值。
  status: confirmed
  source_anchor: 2.4.2.8.16 L444-445
- id: m_create_table_fact_row_only
  type: "constraint"
  statement: M 表不支持列存 ORIENTATION=column。
  status: confirmed
  source_anchor: 2.4.2.8.16 L50-50
- id: m_create_table_fact_inline_unique
  type: "constraint"
  statement: 列级 UNIQUE 为该字段建立独立唯一约束，UNIQUE KEY 语义相同。
  status: confirmed
  source_anchor: 2.4.2.8.16 L566-568
- id: m_create_table_fact_inline_primary_key
  type: "constraint"
  statement: 主键字段唯一且非NULL；一张表只能有一个主键。
  status: confirmed
  source_anchor: 2.4.2.8.16 L584-588
- id: m_create_table_fact_comment
  type: "syntax"
  statement: 表级 COMMENT 可使用等号。
  status: confirmed
  source_anchor: 2.4.2.8.16 L224-227
- id: m_create_table_fact_like
  type: "lifecycle"
  statement: LIKE 建表后源表修改不传播给新表。
  status: confirmed
  source_anchor: 2.4.2.8.16 L204-205
- id: m_create_table_fact_if_exists_conflict
  type: open_question
  statement: 示例导语写表不存在，与正文及后续已存在示例矛盾；不提升导语为规则。
  status: needs_verification
  source_anchor: 2.4.2.8.16 L667-668
- id: m_ct_purpose
  type: example
  statement: 在当前数据库创建新空白表，由命令执行者所有。
  status: confirmed
  source_anchor: 2.4.2.8.16 L4-5
- id: m_ct_create_any_table
  type: environment
  statement: 被授予CREATE ANY TABLE权限的用户可在PUBLIC和用户模式下创建表。
  status: confirmed
  source_anchor: 2.4.2.8.16 L7-11
- id: m_ct_pk_no_prefix
  type: example
  statement: 主键不支持前缀索引。
  status: confirmed
  source_anchor: 2.4.2.8.16 L14
- id: m_ct_jdbc_default
  type: environment
  statement: 使用JDBC时支持通过PrepareStatement对DEFAULT值进行参数化设置。
  status: confirmed
  source_anchor: 2.4.2.8.16 L7-11
- id: m_ct_temporary
  type: example
  statement: TEMPORARY表分会话级(PRESERVE ROWS)和事务级(DELETE ROWS)两种。
  status: confirmed
  source_anchor: 2.4.2.8.16 L96-103
- id: m_ct_table_options
  type: example
  statement: table_option支持AUTO_INCREMENT、CHARSET、COLLATE、COMMENT、ENGINE、ROW_FORMAT等。
  status: confirmed
  source_anchor: 2.4.2.8.16 L33-41
- id: m_ct_comment_limit
  type: example
  statement: 同一地方多次设置COMMENT仅最后一个生效。
  status: confirmed
  source_anchor: 2.4.2.8.16 L45-49
- id: m_ct_like_clause
  type: example
  statement: LIKE source_table复制源表结构。创建后新表与源表完全无关。
  status: confirmed
  source_anchor: 2.4.2.8.16 L16-30
- id: m_ct_btree_only
  type: example
  statement: 目前只支持索引方法为btree。
  status: confirmed
  source_anchor: 2.4.2.8.16 参数说明
- id: m_ct_unique_index_naming
  type: example
  statement: 唯一键constraint_name和index_name同时指定时索引名为constraint_name。
  status: confirmed
  source_anchor: 2.4.2.8.16 参数说明
- id: m_ct_tde_storage
  type: environment
  statement: WITH支持透明加密存储参数：enable_tde、encrypt_algo、dek_cipher、key_type等。
  status: confirmed
  source_anchor: 2.4.2.8.16 参数说明
- id: m_ct_orientation
  type: example
  statement: orientation支持ROW/USTORE/ASTORE。orientation不支持修改。
  status: confirmed
  source_anchor: 2.4.2.8.16 参数说明
- id: m_ct_generated_column
  type: example
  statement: STORED/VIRTUAL缺省STORED。不支持虚拟生成列上创建索引。s2下存储生成列基列不能与ON UPDATE/AUTO_INCREMENT共存。
  status: confirmed
  source_anchor: 2.4.2.8.16 参数说明
- id: m_ct_auto_increment
  type: example
  statement: 自动增长列仅整数、4/8字节浮点、布尔类型。自增计数器自增和刷新不回滚。
  status: confirmed
  source_anchor: 2.4.2.8.16 参数说明
- id: m_ct_charset
  type: example
  statement: 仅字符类型支持指定字符集。BINARY字符集实际转为二进制。表未指定时继承模式默认字符集。
  status: confirmed
  source_anchor: 2.4.2.8.16 参数说明
- id: m_ct_foreign_key_checks
  type: environment
  statement: 外键完整性检查由GUC参数foreign_key_checks控制。REFERENCES需s1以上版本。
  status: confirmed
  source_anchor: 2.4.2.8.16 参数说明
- id: m_ct_fillfactor
  type: example
  statement: 不更新的表填充因子100最佳；频繁更新选较小值。
  status: confirmed
  source_anchor: 2.4.2.8.16 参数说明
rules:
