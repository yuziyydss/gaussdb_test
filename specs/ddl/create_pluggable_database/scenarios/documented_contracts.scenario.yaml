schema_version: 1
kind: "scenario"
id: "scenario_create_pluggable_database_documented_contracts"
name: "CREATE PLUGGABLE DATABASE documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "create_pluggable_database"
fixture_refs: []
fact_refs:
  - "create_pluggable_database_fact_purpose"
  - "create_pluggable_database_fact_no_transaction"
  - "create_pluggable_database_fact_mtd"
  - "create_pluggable_database_fact_non_pdb"
  - "create_pluggable_database_fact_not_m"
  - "create_pluggable_database_fact_privilege"
  - "create_pluggable_database_fact_max_pdbs"
  - "create_pluggable_database_fact_initial_password"
  - "create_pluggable_database_fact_name"
  - "create_pluggable_database_fact_encoding_default"
  - "create_pluggable_database_fact_template_encoding"
  - "create_pluggable_database_fact_collate"
  - "create_pluggable_database_fact_ctype"
  - "create_pluggable_database_fact_timezone_gate"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "创建多租特性中的租户PDB，是实例中划分的逻辑实例。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "CREATE、ALTER、DROP PDB均不能在事务块中执行。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "要求enable_mtd=on。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "只能在非PDB执行。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "不可从M兼容数据库执行此命令。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "要求gs_role_create_pdb角色或SYSADMIN。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "最多创建128个用户PDB。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "安装未指定初始化密码、初始账户大小写敏感且新PDB为M时，先由gs_guc设置该PDB的sql_mode=ansi_quotes，再打开并按提示重置密码。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "PDB名遵守标识符规则，不能包含美元符号。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "M默认UTF8，其余默认模板编码。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "模板编码取决于OS；template1不允许改变编码，A用templatea，非A用template0或templatem。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "LC_COLLATE控制字符串排序，默认模板值，取OS支持字符集，M不生效。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "LC_CTYPE控制字符分类，默认模板值，取OS支持分类，M不生效。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "DBTIMEZONE仅A且a_format_version=10c、a_format_dev_version=s2时生效。"
oracles: []
execution_requirements:
  - "database"
  - "same_session"
