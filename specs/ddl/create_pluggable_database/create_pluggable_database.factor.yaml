    status: "confirmed"
    source_anchor: "L118-L120"
  -
    id: "create_pluggable_database_fact_option_multiplicity"
    type: "constraint"
    statement: "静态域仅生成单选项代表；主语法未标重复，不推断任意多选项或WITH/等号组合。"
    status: "confirmed"
    source_anchor: "L27-L32"
  -
    id: "create_pluggable_database_fact_missing_developer_guide"
