    status: "confirmed"
    source_anchor: "L93-L102"
  -
    id: "create_pluggable_database_fact_resource_submit"
    type: "example"
    statement: "提交资源计划编辑。"
    status: "confirmed"
    source_anchor: "L103-L107"
  -
    id: "create_pluggable_database_fact_create"
    type: "example"
    statement: "创建PDB示例。"
    status: "confirmed"
    source_anchor: "L109-L111"
  -
    id: "create_pluggable_database_fact_close"
