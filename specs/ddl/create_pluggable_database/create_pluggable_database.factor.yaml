facts:
  -
    id: "create_pluggable_database_fact_purpose"
    type: "lifecycle"
    statement: "创建多租特性中的租户PDB，是实例中划分的逻辑实例。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "create_pluggable_database_fact_no_transaction"
    type: "environment"
    statement: "CREATE、ALTER、DROP PDB均不能在事务块中执行。"
    status: "confirmed"
    source_anchor: "L9-L9"
  -
    id: "create_pluggable_database_fact_mtd"
    type: "environment"
    statement: "要求enable_mtd=on。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "create_pluggable_database_fact_non_pdb"
    type: "environment"
    statement: "只能在非PDB执行。"
    status: "confirmed"
    source_anchor: "L11-L11"
  -
    id: "create_pluggable_database_fact_not_m"
    type: "environment"
    statement: "不可从M兼容数据库执行此命令。"
    status: "confirmed"
    source_anchor: "L12-L12"
  -
    id: "create_pluggable_database_fact_privilege"
    type: "environment"
    statement: "要求gs_role_create_pdb角色或SYSADMIN。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "create_pluggable_database_fact_max_pdbs"
    type: "constraint"
    statement: "最多创建128个用户PDB。"
    status: "confirmed"
    source_anchor: "L14-L14"
  -
    id: "create_pluggable_database_fact_default_compat"
    type: "syntax"
    statement: "未指定时创建A兼容PDB。"
    status: "confirmed"
    source_anchor: "L15-L15"
  -
    id: "create_pluggable_database_fact_initial_password"
    type: "environment"
    statement: "安装未指定初始化密码、初始账户大小写敏感且新PDB为M时，先由gs_guc设置该PDB的sql_mode=ansi_quotes，再打开并按提示重置密码。"
    status: "confirmed"
    source_anchor: "L16-L23"
  -
    id: "create_pluggable_database_fact_name"
    type: "constraint"
    statement: "PDB名遵守标识符规则，不能包含美元符号。"
    status: "confirmed"
    source_anchor: "L38-L43"
  -
    id: "create_pluggable_database_fact_encoding"
    type: "syntax"
    statement: "编码可以使用字符串或整数编号，常用GBK、UTF8、Latin1、GB18030。"
    status: "confirmed"
    source_anchor: "L45-L48"
  -
    id: "create_pluggable_database_fact_encoding_default"
    type: "environment"
    statement: "M默认UTF8，其余默认模板编码。"
    status: "confirmed"
    source_anchor: "L51-L52"
  -
    id: "create_pluggable_database_fact_template_encoding"
    type: "constraint"
    statement: "模板编码取决于OS；template1不允许改变编码，A用templatea，非A用template0或templatem。"
    status: "confirmed"
    source_anchor: "L53-L56"
  -
    id: "create_pluggable_database_fact_collate"
    type: "environment"
    statement: "LC_COLLATE控制字符串排序，默认模板值，取OS支持字符集，M不生效。"
    status: "confirmed"
    source_anchor: "L57-L61"
  -
    id: "create_pluggable_database_fact_ctype"
    type: "environment"
    statement: "LC_CTYPE控制字符分类，默认模板值，取OS支持分类，M不生效。"
    status: "confirmed"
    source_anchor: "L62-L66"
  -
    id: "create_pluggable_database_fact_compat"
    type: "syntax"
    statement: "兼容类型A、C、PG、M；默认A。"
    status: "confirmed"
    source_anchor: "L67-L70"
  -
    id: "create_pluggable_database_fact_timezone"
    type: "syntax"
    statement: "DBTIMEZONE默认PRC，支持OS名称/缩写及-15:59至+15:00。"
    status: "confirmed"
    source_anchor: "L71-L75"
  -
    id: "create_pluggable_database_fact_timezone_gate"
    type: "environment"
    statement: "DBTIMEZONE仅A且a_format_version=10c、a_format_dev_version=s2时生效。"
    status: "confirmed"
    source_anchor: "L78-L79"
  -
    id: "create_pluggable_database_fact_syntax"
    type: "syntax"
    statement: "CREATE PLUGGABLE DATABASE pdb_name后可带WITH及五种选项；主式未明确标注选项重复。"
    status: "confirmed"
    source_anchor: "L27-L32"
  -
