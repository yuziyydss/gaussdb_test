schema_version: 1
kind: "manifest"
id: "manifest_drop_index_ordinary"
name: "DROP INDEX ordinary"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "drop_index"
syntax_ref: "syntax_drop_index"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_drop_index_indexes"
identifier_policy: {}
bindings:
  concurrently:
    - "drop_index_concurrently_absent"
  if_exists:
    - "drop_index_if_exists_absent"
    - "drop_index_if_exists_present"
  targets:
    - "drop_index_targets_one"
    - "drop_index_targets_two"
    - "drop_index_targets_missing"
  behavior:
    - "drop_index_behavior_default"
    - "drop_index_behavior_restrict"
    - "drop_index_behavior_cascade"
local_rules:
  - expression: "targets != 'drop_index_targets_missing' or if_exists != 'drop_index_if_exists_absent'"
    rationale: 缺失目标且未带IF EXISTS不是正向用例；原负向候选退回审阅。
    fact_refs: [drop_index_fact_name, drop_index_fact_missing_error]

expected:
  default: "success"
  scope: "syntax_and_semantics"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
