rules:
  -
    id: "drop_index_rule_online_single"
    kind: "requires"
    expression: "concurrently == 'drop_index_concurrently_absent' or targets.properties.count == 1"
    fact_refs:
      - "drop_index_fact_online_single"
    severity: "error"
  -
    id: "drop_index_rule_online_no_cascade"
    kind: "requires"
    expression: "concurrently == 'drop_index_concurrently_absent' or behavior != 'drop_index_behavior_cascade'"
    fact_refs:
      - "drop_index_fact_online_no_cascade"
    severity: "error"
  -
    id: "drop_index_rule_exists"
    kind: "requires"
    expression: "targets.properties.exists == True or if_exists == 'drop_index_if_exists_present'"
    fact_refs:
      - "drop_index_fact_name"
    severity: "error"
