schema_version: 1
kind: "fixture"
id: "fixture_drop_index_indexes"
name: "DROP INDEX indexes"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "drop_index"
requires_fixture_refs:
  - "fixture_create_index_astore_regular"
provides: {}
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "CREATE INDEX idx_di_one ON t_ci_astore(id);"
    - "CREATE INDEX idx_di_two ON t_ci_astore(note);"
    - "DROP INDEX IF EXISTS idx_di_missing;"
  teardown_sqls:
    - "DROP INDEX IF EXISTS idx_di_online;"
    - "DROP INDEX IF EXISTS idx_di_two;"
    - "DROP INDEX IF EXISTS idx_di_one;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
