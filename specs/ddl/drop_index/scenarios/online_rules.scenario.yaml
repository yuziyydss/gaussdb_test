schema_version: 1
kind: "scenario"
id: "scenario_drop_index_online_rules"
name: "DROP INDEX online_rules"
status: "planned"
description: "分别验证事务内拒绝、单索引限制与 CASCADE 限制；每个错误单独事务/会话。"
factor_ref: "drop_index"
fixture_refs:
  - "fixture_drop_index_indexes"
fact_refs:
  - "drop_index_fact_transaction"
  - "drop_index_fact_online_single"
  - "drop_index_fact_online_no_cascade"
  - "drop_index_fact_online_rejection"
  - "drop_index_fact_error_identity"
preconditions: []
steps:
  -
    id: "probes"
    action: "isolated_negative_matrix"
    cases:
      - "transaction_block"
      - "multiple_indexes"
      - "cascade"
    note: "不叠加多个违约条件。"
oracles:
  -
    after_step: "probes"
    kind: "target_error"
    oracle_status: "needs_verification"
execution_requirements:
  - "database"
  - "same_session"
