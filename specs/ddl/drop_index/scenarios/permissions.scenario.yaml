schema_version: 1
kind: "scenario"
id: "scenario_drop_index_permissions"
name: "DROP INDEX permissions"
status: "planned"
description: "覆盖四种授权来源、系统管理员条件及无权限拒绝。"
factor_ref: "drop_index"
fixture_refs: []
fact_refs:
  - "drop_index_fact_authorization"
  - "drop_index_fact_sysadmin"
preconditions:
  - "预配置隔离角色与三权分立状态"
steps:
  -
    id: "roles"
    action: "permission_matrix"
    roles:
      - "index_owner"
      - "schema_owner"
      - "table_index_grantee"
      - "drop_any_index_grantee"
      - "sysadmin"
      - "unprivileged"
oracles:
  -
    after_step: "roles"
    kind: "authorization_matrix"
    expected: "按正文权限条件"
execution_requirements:
  - "database"
  - "same_session"
