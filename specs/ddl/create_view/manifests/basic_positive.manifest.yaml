schema_version: 1
kind: manifest
id: manifest_create_view_basic_positive
name: CREATE VIEW 基础正向组合
status: ready
description: 覆盖主修饰符、列名列表、SELECT/VALUES 查询和尾部检查/只读分支。
factor_ref: create_view
syntax_ref: syntax_create_view
suite_type: positive
strategy: pairwise
fixture_refs: []

identifier_policy:
  view_name:
    generator: deterministic
    prefix: v_cv_basic
    unique_per_case: true

bindings:
  or_replace: [or_replace_absent, or_replace_keyword]
  temp_modifier: [temp_absent, temp_keyword, temporary_keyword]
  force_modifier: [force_absent, force_keyword]
  column_list: [column_list_inherited, column_list_two_aliases]
  view_options_profile: [view_options_none]
  query_profile:
    - query_select_star
    - query_simple_two_columns
    - query_filtered_two_columns
    - query_values_two_columns
  post_query_option:
    - post_query_none
    - check_default
    - check_cascaded
    - check_local
    - read_only

expected:
  default: success
  scope: syntax_and_semantics

coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
