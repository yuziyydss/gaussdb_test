schema_version: 1
kind: manifest
id: manifest_create_view_invalid_options_negative
name: CREATE VIEW 非法参数名和值负向语法
status: needs_review
description: 覆盖未知 view option、非法 security_barrier 值和非法 check_option 值；本章未给 SQLSTATE 或固定错误文本，执行前仍需校准错误身份。
factor_ref: create_view
syntax_ref: syntax_create_view
suite_type: negative
strategy: pairwise
fixture_refs: []

identifier_policy:
  view_name:
    generator: deterministic
    prefix: v_cv_bad_option
    unique_per_case: true

bindings:
  or_replace: [or_replace_absent]
  temp_modifier: [temp_absent]
  force_modifier: [force_absent]
  column_list: [column_list_inherited]
  view_options_profile:
    - view_option_unknown_name
    - view_option_security_invalid
    - view_option_check_invalid
  query_profile: [query_simple_two_columns]
  post_query_option: [post_query_none]

violates_rule_refs:
  - cv_rule_view_option_name_supported
  - cv_rule_view_option_value_domain

expected:
  default: error
  scope: syntax_and_semantics
  oracle_status: needs_verification
  error_category: invalid_view_option

coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
