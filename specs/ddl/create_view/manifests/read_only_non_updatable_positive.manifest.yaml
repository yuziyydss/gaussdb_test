schema_version: 1
kind: manifest
id: manifest_create_view_read_only_non_updatable_positive
name: CREATE VIEW 不可更新查询只读正向语法
status: ready
description: 验证文档列明的不可更新查询形态仍可使用独立的 WITH READ ONLY 分支，避免把 CHECK OPTION 限制误套到 READ ONLY。
factor_ref: create_view
syntax_ref: syntax_create_view
suite_type: positive
strategy: pairwise
fixture_refs: []

identifier_policy:
