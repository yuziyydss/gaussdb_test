schema_version: 1
kind: syntax
id: syntax_create_view
name: CREATE VIEW 主语法
category: DDL
status: ready
factor_ref: create_view
description: 按集中式版参考 1.13.9.60 第 22 至 25 行描述 CREATE VIEW 的完整槽位顺序和符号动作，不维护候选值。

production: >-
  CREATE {or_replace} {temp_modifier} {force_modifier} VIEW {view_name}
  {column_list} {view_options_profile} AS {query_profile} {post_query_option}

rendering:
  whitespace: collapse
  statement_terminator: ";"

slots:
  or_replace:
    type: token
    optional: true
    dimension_ref: create_view.or_replace

  temp_modifier:
    type: token
    optional: true
    dimension_ref: create_view.temp_modifier

  force_modifier:
    type: token
    optional: true
    dimension_ref: create_view.force_modifier

  view_name:
    type: identifier
    optional: false
    symbol_action: creates_view
    identifier_role: view

  column_list:
    type: token_list
    optional: true
    dimension_ref: create_view.column_list

  view_options_profile:
    type: option_list
    optional: true
    dimension_ref: create_view.view_options_profile

  query_profile:
    type: sql_fragment
    optional: false
    dimension_ref: create_view.query_profile
    symbol_action: reads_relations

  post_query_option:
    type: choice
    optional: true
    dimension_ref: create_view.post_query_option

source_fact_refs:
  - select::select_fact_target_list
  - cv_fact_main_grammar
  - cv_fact_or_replace
  - cv_fact_column_names
  - cv_fact_view_option_names
  - cv_fact_view_option_check
  - cv_fact_schema_qualified_name
  - cv_fact_query_select_or_values
