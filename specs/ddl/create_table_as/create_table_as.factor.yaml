facts:
- id: create_table_as_fact_purpose
  type: lifecycle
  statement: 根据查询结果创建新表。
  status: confirmed
  source_anchor: L5-L5
- id: create_table_as_fact_inherit
  type: metadata_oracle
  statement: 新表继承查询字段名称及类型，可显式改列名。
  status: confirmed
  source_anchor: L6-L8
- id: create_table_as_fact_snapshot
  type: lifecycle
  statement: 只复制首次查询结果，后续源表变化不更新新表。
  status: confirmed
  source_anchor: L9-L11
- id: create_table_as_fact_only_names_types
  type: metadata_oracle
  statement: 只继承查询的字段名称及类型，不复制源表约束。
  status: confirmed
  source_anchor: L14-L14
- id: create_table_as_fact_no_partition
  type: constraint
  statement: 不能通过 CREATE TABLE AS 创建分区表。
  status: confirmed
  source_anchor: L15-L15
- id: create_table_as_fact_crash_files
  type: lifecycle
  statement: 建表故障后可能残留非零磁盘文件，不影响正常运行。
  status: confirmed
  source_anchor: L16-L18
- id: create_table_as_fact_ilm_whitelist
  type: constraint
  statement: ILM 行级表达式只能使用白名单函数。
  status: confirmed
  source_anchor: L19-L21
- id: create_table_as_fact_b_upper
  type: environment
  statement: B 模式 5.7/s2 下 upper 不能转大写，影响 ILM 表达式。
  status: confirmed
  source_anchor: L24-L26
- id: create_table_as_fact_syntax_target
  type: syntax
  statement: 目标修饰符后为 TABLE、IF NOT EXISTS、名称和可选别名列表。
  status: confirmed
  source_anchor: L30-L31
- id: create_table_as_fact_syntax_engine
  type: syntax
  statement: ENGINE 支持可选等号、InnoDB 的三种引号形式和重复项。
  status: confirmed
  source_anchor: L32-L32
- id: create_table_as_fact_syntax_options
  type: syntax
  statement: WITH 存储参数在 ON COMMIT 之前。
  status: confirmed
  source_anchor: L33-L34
- id: create_table_as_fact_syntax_ilm
  type: syntax
  statement: ILM 压缩策略三分支为 ADVANCED、TURBO 和 NONE。
  status: confirmed
  source_anchor: L35-L39
- id: create_table_as_fact_syntax_tail
  type: syntax
  statement: TABLESPACE 后是 AS 查询及可选 WITH [NO] DATA。
  status: confirmed
  source_anchor: L40-L42
- id: create_table_as_fact_unlogged_wal
  type: lifecycle
  statement: 非日志表不写 WAL，异常重启等故障后可能全部清空。
  status: confirmed
  source_anchor: L46-L49
- id: create_table_as_fact_unlogged_replica
  type: lifecycle
  statement: 非日志数据不复制到备机，其索引同样不记录日志。
  status: confirmed
  source_anchor: L51-L52
- id: create_table_as_fact_backup
  type: environment
  statement: 使用非日志表前应先备份数据。
  status: confirmed
  source_anchor: L53-L54
- id: create_table_as_fact_rebuild
  type: lifecycle
  statement: 非日志索引异常数据丢失后应重建索引。
  status: confirmed
  source_anchor: L55-L56
- id: create_table_as_fact_global_local
  type: syntax
  statement: GLOBAL TEMP 创建全局临时表，不指定 GLOBAL 则为本地临时表。
  status: confirmed
  source_anchor: L57-L59
- id: create_table_as_fact_temp_alias
  type: syntax
  statement: TEMP 和 TEMPORARY 都用于声明临时表。
  status: confirmed
  source_anchor: L60-L63
- id: create_table_as_fact_global_meta
  type: metadata_oracle
  statement: 全局临时表元数据跨会话持续存在。
  status: confirmed
  source_anchor: L64-L66
- id: create_table_as_fact_global_preserve
  type: lifecycle
  statement: 全局临时表 PRESERVE ROWS 在会话结束时清空数据。
  status: confirmed
  source_anchor: L68-L69
- id: create_table_as_fact_global_delete
  type: lifecycle
  statement: 全局临时表 DELETE ROWS 在 COMMIT 或 ROLLBACK 时清空数据。
  status: confirmed
  source_anchor: L71-L72
- id: create_table_as_fact_global_default
  type: lifecycle
  statement: 全局临时表缺省为会话级，可使用非 pg_temp 的 Schema。
  status: confirmed
  source_anchor: L73-L74
- id: create_table_as_fact_local_end
  type: lifecycle
  statement: 本地临时表仅当前会话可见，结束后自动删除，跨会话 DDL 有风险。
  status: confirmed
  source_anchor: L75-L77
- id: create_table_as_fact_temp_schema_safety
  type: environment
  statement: 不要手工删除系统维护的临时 Schema。
  status: confirmed
  source_anchor: L82-L84
- id: create_table_as_fact_implicit_temp
  type: lifecycle
  statement: 指定当前会话 pg_temp Schema 也会创建临时表。
  status: confirmed
  source_anchor: L85-L86
- id: create_table_as_fact_global_busy
  type: constraint
  statement: 其他会话使用全局临时对象时禁止 ALTER/DROP。
  status: confirmed
  source_anchor: L87-L88
- id: create_table_as_fact_global_ddl
  type: behavior_oracle
  statement: 全局临时表的数据及索引维护操作只影响当前会话。
  status: confirmed
  source_anchor: L89-L90
- id: create_table_as_fact_collision
  type: behavior_oracle
  statement: 同名 relation 存在时，IF NOT EXISTS 返回 NOTICE；否则报错。
  status: confirmed
  source_anchor: L92-L96
- id: create_table_as_fact_name
  type: syntax
  statement: 名称必须符合标识符规范。
  status: confirmed
  source_anchor: L97-L100
- id: create_table_as_fact_aliases
  type: syntax
  statement: 可显式声明新字段名，否则继承查询输出名。
  status: confirmed
  source_anchor: L101-L104
- id: create_table_as_fact_engine
  type: environment
  statement: ENGINE 仅 B 模式支持 InnoDB，只有语法兼容效果。
  status: confirmed
  source_anchor: L105-L106
- id: create_table_as_fact_storage
  type: syntax
  statement: WITH 存储参数为可选设置。
  status: confirmed
  source_anchor: L107-L108
- id: create_table_as_fact_tde
  type: syntax
  statement: 透明加密参数详见 CREATE TABLE。
  status: confirmed
  source_anchor: L111-L113
- id: create_table_as_fact_fillfactor
  type: constraint
  statement: 行存表 fillfactor 范围 10 至 100；Ustore 默认 92，Astore 默认 100。
  status: confirmed
  source_anchor: L114-L123
- id: create_table_as_fact_orientation
  type: syntax
  statement: ORIENTATION 只列 ROW，默认 ROW。
  status: confirmed
  source_anchor: L124-L126
- id: create_table_as_fact_autovacuum_enabled
  type: syntax
