facts:
  -
    id: "alter_database_fact_purpose"
    type: "lifecycle"
    statement: "修改数据库名称、属主、连接数与对象隔离等属性。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "alter_database_fact_privilege"
    type: "environment"
    statement: "要求数据库属主或ALTER授权，管理员默认拥有。"
    status: "confirmed"
    source_anchor: "L9-L11"
  -
    id: "alter_database_fact_rename_privilege"
    type: "environment"
    statement: "改名需要CREATEDB。"
    status: "confirmed"
    source_anchor: "L12-L12"
  -
    id: "alter_database_fact_owner_privilege"
    type: "environment"
    statement: "改属主要求原属主或管理员、CREATEDB且为新属主角色成员。"
    status: "confirmed"
    source_anchor: "L13-L14"
  -
    id: "alter_database_fact_tablespace_move"
    type: "environment"
    statement: "改默认表空间须目标表空间CREATE权限；移动原默认表空间内表和索引，其他表空间不变。"
    status: "confirmed"
    source_anchor: "L15-L17"
  -
    id: "alter_database_fact_not_current_database"
