    id: "alter_database_fact_tablespace_empty"
    type: "constraint"
    statement: "目标表空间若已存在此库的表或对象，则不能作为新默认表空间。"
    status: "confirmed"
    source_anchor: "L54-L55"
  -
    id: "alter_database_fact_private_target_connection"
    type: "environment"
    statement: "更改PRIVATE OBJECT须连接至目标数据库。"
    status: "confirmed"
    source_anchor: "L76-L76"
