schema_version: 1
kind: "fixture"
id: "fixture_alter_database_renamed_database_cleanup"
name: "ALTER DATABASE renamed_database_cleanup"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "alter_database"
requires_fixture_refs:
  - "fixture_alter_database_existing_database"
provides: {}
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "SELECT 1 / (1 - COUNT(*)) AS assert_rename_target_absent FROM pg_database WHERE datname = 'b8_database_renamed';"
  teardown_sqls:
    - "DROP DATABASE IF EXISTS b8_database_renamed PURGE;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
