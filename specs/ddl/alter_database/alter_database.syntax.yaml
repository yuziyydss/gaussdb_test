schema_version: 1
kind: "syntax"
id: "syntax_alter_database"
name: "ALTER DATABASE 语法"
factor_ref: "alter_database"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "alter_database.form"
  with_keyword:
    type: "token"
    optional: true
    dimension_ref: "alter_database.with_keyword"
  limit:
    type: "token"
    optional: true
    dimension_ref: "alter_database.limit"
  assignment:
    type: "token"
    optional: true
    dimension_ref: "alter_database.assignment"
  value:
    type: "token"
    optional: true
    dimension_ref: "alter_database.value"
  reset_target:
    type: "token"
    optional: true
    dimension_ref: "alter_database.reset_target"
source_fact_refs:
  - "alter_database_fact_syntax_limit"
  - "alter_database_fact_syntax_rename"
  - "alter_database_fact_syntax_set"
  - "alter_database_fact_syntax_reset"
  - "alter_database_fact_name"
  - "alter_database_fact_new_name"
  - "alter_database_fact_config_parameter"
  - "alter_database_fact_off"
  - "alter_database_fact_syntax_owner"
  - "alter_database_fact_syntax_tablespace"
  - "alter_database_fact_syntax_private"
  - "alter_database_fact_syntax_timezone"
  - "alter_database_fact_syntax_buckets"
  - "alter_database_fact_syntax_ilm"
ast:
  kind: "choice"
  selector: "form"
  branches:
    alter_database_form_limit:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER DATABASE b8_database "
        -
          kind: "slot"
          slot: "with_keyword"
        -
          kind: "literal"
          text: " CONNECTION LIMIT "
        -
          kind: "slot"
          slot: "limit"
    alter_database_form_rename:
      kind: "literal"
      text: "ALTER DATABASE b8_database RENAME TO b8_database_renamed"
    alter_database_form_set:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER DATABASE b8_database SET DATESTYLE "
        -
          kind: "slot"
          slot: "assignment"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "value"
    alter_database_form_from_current:
      kind: "literal"
      text: "ALTER DATABASE b8_database SET DATESTYLE FROM CURRENT"
    alter_database_form_reset:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER DATABASE b8_database RESET "
        -
          kind: "slot"
          slot: "reset_target"
