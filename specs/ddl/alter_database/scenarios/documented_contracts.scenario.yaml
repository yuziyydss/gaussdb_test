schema_version: 1
kind: "scenario"
id: "scenario_alter_database_documented_contracts"
name: "ALTER DATABASE documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "alter_database"
fixture_refs: []
fact_refs:
  - "alter_database_fact_purpose"
  - "alter_database_fact_privilege"
  - "alter_database_fact_rename_privilege"
  - "alter_database_fact_owner_privilege"
  - "alter_database_fact_tablespace_move"
  - "alter_database_fact_not_current_database"
  - "alter_database_fact_templatem_rename"
  - "alter_database_fact_tablespace_empty"
  - "alter_database_fact_private_target_connection"
  - "alter_database_fact_private_behavior"
  - "alter_database_fact_move_unsupported"
  - "alter_database_fact_connlimit"
  - "alter_database_fact_owner"
  - "alter_database_fact_tablespace"
  - "alter_database_fact_default"
  - "alter_database_fact_reset"
  - "alter_database_fact_parameter_domain"
  - "alter_database_fact_from_current"
  - "alter_database_fact_reset_one"
  - "alter_database_fact_reset_all"
  - "alter_database_fact_timezone"
  - "alter_database_fact_tablespace_move_scope"
  - "alter_database_fact_next_session"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "修改数据库名称、属主、连接数与对象隔离等属性。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "要求数据库属主或ALTER授权，管理员默认拥有。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "改名需要CREATEDB。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "改属主要求原属主或管理员、CREATEDB且为新属主角色成员。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "改默认表空间须目标表空间CREATE权限；移动原默认表空间内表和索引，其他表空间不变。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "不能直接重命名当前连接数据库，必须从其他库操作。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "不允许将templatem改名或改其他对象名为templatem；本章措辞称模式。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "目标表空间若已存在此库的表或对象，则不能作为新默认表空间。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "更改PRIVATE OBJECT须连接至目标数据库。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "新库对象隔离默认关闭；开启后6个系统表添加行级访问策略，普通用户仅看到有权对象，管理员不受影响。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "当前版本不支持MOVE BUCKETS。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "连接上限[-1,2147483647]，默认-1，管理员除外，建议1..50。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "新属主必须为有效用户。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "新表空间必须已存在，默认pg_default。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "DEFAULT在新会话使用系统缺省值。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "RESET在新会话使用系统缺省值。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "用户指定值须符合对应参数范围。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "FROM CURRENT复制当前会话值为库级默认。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "RESET指定参数。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "RESET ALL重置全部数据库会话参数。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "设置时区须有数据库操作权限，取系统时区/缩写或-15:59..+15:00。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "仅迁移旧默认表空间的表和索引，其他表空间不受影响。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "修改库级会话参数在下一次会话生效。"
oracles:
  -
    kind: "documented_behavior"
    expected: "新库对象隔离默认关闭；开启后6个系统表添加行级访问策略，普通用户仅看到有权对象，管理员不受影响。"
  -
    kind: "documented_behavior"
    expected: "DEFAULT在新会话使用系统缺省值。"
  -
    kind: "documented_behavior"
    expected: "RESET在新会话使用系统缺省值。"
  -
    kind: "documented_behavior"
    expected: "FROM CURRENT复制当前会话值为库级默认。"
  -
    kind: "documented_behavior"
    expected: "修改库级会话参数在下一次会话生效。"
execution_requirements:
  - "database"
  - "same_session"
