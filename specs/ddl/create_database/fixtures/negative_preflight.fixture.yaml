id: fixture_create_database_negative_preflight
name: CREATE DATABASE 负向候选只读前置核查
status: needs_review
description: 不创建任何资产，只检查专属库名不存在；不复用正向fixture的PURGE清理。
factor_ref: create_database
requires_fixture_refs: []
provides: {}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - "SELECT 1 / (1 - COUNT(*)) AS assert_test_database_absent FROM pg_database WHERE datname = 'b8_database';"
  teardown_sqls:
    - "SELECT 1 / (1 - COUNT(*)) AS assert_negative_database_absent FROM pg_database WHERE datname = 'b8_database';"
  note: 仅离线候选，运行需另行授权及独占名称预留；计数核查不能消除并发抢占。预期目标失败而不创建数据库。若意外成功，停止批次并隔离记录实际创建对象，人工确认归属后另行清理；不默认DROP/PURGE。fixture执行状态表示SQL已给出，不是生命周期安全证明。
