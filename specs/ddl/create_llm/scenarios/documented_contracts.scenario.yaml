schema_version: 1
kind: "scenario"
id: "scenario_create_llm_documented_contracts"
name: "CREATE LLM documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "create_llm"
fixture_refs: []
fact_refs:
  - "create_llm_fact_body_5"
  - "create_llm_fact_body_8"
  - "create_llm_fact_body_9"
  - "create_llm_fact_body_10"
  - "create_llm_fact_body_12"
  - "create_llm_fact_body_14"
  - "create_llm_fact_body_16"
  - "create_llm_fact_body_19"
  - "create_llm_fact_body_20"
  - "create_llm_fact_body_48"
  - "create_llm_fact_body_48_1"
  - "create_llm_fact_body_48_2"
  - "create_llm_fact_body_53"
  - "create_llm_fact_body_53_1"
  - "create_llm_fact_body_56"
  - "create_llm_fact_body_58"
  - "create_llm_fact_body_58_1"
  - "create_llm_fact_body_58_2"
  - "create_llm_fact_body_62"
  - "create_llm_fact_body_62_1"
  - "create_llm_fact_body_62_2"
  - "create_llm_fact_body_66"
  - "create_llm_fact_body_66_1"
  - "create_llm_fact_body_66_2"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "创建大模型服务。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "1.   功能依赖于LLM/embedding/rerank模型服务正常运行。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "2.   create llm命令需要拥有sysadmin的用户权限。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "3.   QUERY MODEL中调用的大语言模型需通过兼容OpenAI开放API中 v1/chat/ completion API格式提供服务。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "4.   EMBED MODEL中调用的embedding模型需通过兼容OpenAI开放API中 v1/ embedding API格式提供服务。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "5.   RERANK MODEL中调用的重排序模型需通过兼容Jina AI开放API中 /rerank API格 式提供服务。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "6.   创建服务时会对API KEY进行加密操作，原理是复用OBS传输使用的密钥文件，如 果该文件不存在则需要参考如下命令生成： gs_guc generate -S xxxxx -D $GAUSSHOME/bin -o obsserver"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "7.   服务仅支持HTTPS协议，需要用户配置系统可信的CA证书对服务端进行校验。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "8.   当前版本不支持M兼容模式。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "●    gs_model_name 必选，模型服务在GaussDB中的名称。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "该名称作为标识符，在以后的语义函数中 作为参数输入，不超过63字节。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "输入大小写不敏感，在系统中自动转写至小写字 母存储，只支持数字、字母和下划线“_”符号，且不能以数字开头，如果超过长 度则会自动截断。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "●    model 必选，在外部模型服务中需要指定的模型名称，长度不超过64字节。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "在支持 OpenAI标准的API的模型服务中，需要在请求体中指定模型名。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "●    url 必选，模型服务的地址，不超过256字节。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "●    api_key 必选，认证所需的API KEY，长度16到256字节。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "模型服务往往需要通过API KEY 进行认证，通过认证才可以返回结果。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "在模型注册时指定API KEY，之后每次模型 调用直接复用。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "●    system_prompt 可选，OpenAI v1/chat/completions API中输入的参数。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "对应给模型服务输入的 系统提示词，代表给大模型提前输入的系统指令。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "如果system_prompt长度超过 大模型最大tokens范围则模型侧会拒绝服务并返回异常信息。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "●    extra_params 可选，其他需要透传到模型服务的参数。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "OpenAI的API规范中，可以在请求体内 添加支持的参数。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "详细的支持参数请参照待添加的模型服务对应的API文档，各模 型服务可能存在差异，通过JSON字典的字符串格式输入，在数据库侧会校验json 格式的合法性，除了创建大语言模型时会校验temperature和max_tokens的范围 之外，其余参数会被直接透传到模型服务上, 如果属于大模型参数范围则会生效， 否则会忽略该参数，不合法参数会返回模型侧异常信息。"
