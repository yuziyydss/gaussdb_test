    type: "constraint"
    statement: "创建大模型服务。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_llm_fact_body_8"
    type: "constraint"
    statement: "1.   功能依赖于LLM/embedding/rerank模型服务正常运行。"
    status: "confirmed"
    source_anchor: "L8-L8"
  -
    id: "create_llm_fact_body_9"
    type: "environment"
    statement: "2.   create llm命令需要拥有sysadmin的用户权限。"
    status: "confirmed"
    source_anchor: "L9-L9"
  -
    id: "create_llm_fact_body_10"
    type: "constraint"
    statement: "3.   QUERY MODEL中调用的大语言模型需通过兼容OpenAI开放API中 v1/chat/ completion API格式提供服务。"
    status: "confirmed"
    source_anchor: "L10-L11"
  -
    id: "create_llm_fact_body_12"
    type: "constraint"
    statement: "4.   EMBED MODEL中调用的embedding模型需通过兼容OpenAI开放API中 v1/ embedding API格式提供服务。"
    status: "confirmed"
    source_anchor: "L12-L13"
  -
    id: "create_llm_fact_body_14"
    type: "constraint"
    statement: "5.   RERANK MODEL中调用的重排序模型需通过兼容Jina AI开放API中 /rerank API格 式提供服务。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "create_llm_fact_body_16"
    type: "constraint"
    statement: "6.   创建服务时会对API KEY进行加密操作，原理是复用OBS传输使用的密钥文件，如 果该文件不存在则需要参考如下命令生成： gs_guc generate -S xxxxx -D $GAUSSHOME/bin -o obsserver"
    status: "confirmed"
    source_anchor: "L16-L18"
  -
    id: "create_llm_fact_body_19"
    type: "constraint"
    statement: "7.   服务仅支持HTTPS协议，需要用户配置系统可信的CA证书对服务端进行校验。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "create_llm_fact_body_20"
