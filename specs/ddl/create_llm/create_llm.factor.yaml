  -
    id: "create_llm_fact_body_48"
    type: "behavior_oracle"
    statement: "●    gs_model_name 必选，模型服务在GaussDB中的名称。"
    status: "confirmed"
    source_anchor: "L48-L52"
  -
    id: "create_llm_fact_body_48_1"
    type: "behavior_oracle"
    statement: "该名称作为标识符，在以后的语义函数中 作为参数输入，不超过63字节。"
    status: "confirmed"
    source_anchor: "L48-L52"
  -
    id: "create_llm_fact_body_48_2"
    type: "behavior_oracle"
    statement: "输入大小写不敏感，在系统中自动转写至小写字 母存储，只支持数字、字母和下划线“_”符号，且不能以数字开头，如果超过长 度则会自动截断。"
    status: "confirmed"
    source_anchor: "L48-L52"
  -
    id: "create_llm_fact_body_53"
    type: "constraint"
    statement: "●    model 必选，在外部模型服务中需要指定的模型名称，长度不超过64字节。"
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "create_llm_fact_body_53_1"
    type: "constraint"
    statement: "在支持 OpenAI标准的API的模型服务中，需要在请求体中指定模型名。"
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "create_llm_fact_body_56"
    type: "constraint"
    statement: "●    url 必选，模型服务的地址，不超过256字节。"
    status: "confirmed"
    source_anchor: "L56-L57"
  -
    id: "create_llm_fact_body_58"
    type: "behavior_oracle"
    statement: "●    api_key 必选，认证所需的API KEY，长度16到256字节。"
    status: "confirmed"
    source_anchor: "L58-L61"
  -
    id: "create_llm_fact_body_58_1"
    type: "behavior_oracle"
    statement: "模型服务往往需要通过API KEY 进行认证，通过认证才可以返回结果。"
    status: "confirmed"
    source_anchor: "L58-L61"
  -
    id: "create_llm_fact_body_58_2"
    type: "behavior_oracle"
    statement: "在模型注册时指定API KEY，之后每次模型 调用直接复用。"
    status: "confirmed"
    source_anchor: "L58-L61"
  -
    id: "create_llm_fact_body_62"
    type: "behavior_oracle"
    statement: "●    system_prompt 可选，OpenAI v1/chat/completions API中输入的参数。"
    status: "confirmed"
    source_anchor: "L62-L65"
  -
    id: "create_llm_fact_body_62_1"
    type: "behavior_oracle"
    statement: "对应给模型服务输入的 系统提示词，代表给大模型提前输入的系统指令。"
    status: "confirmed"
    source_anchor: "L62-L65"
  -
    id: "create_llm_fact_body_62_2"
    type: "behavior_oracle"
    statement: "如果system_prompt长度超过 大模型最大tokens范围则模型侧会拒绝服务并返回异常信息。"
    status: "confirmed"
    source_anchor: "L62-L65"
  -
    id: "create_llm_fact_body_66"
    type: "behavior_oracle"
    statement: "●    extra_params 可选，其他需要透传到模型服务的参数。"
    status: "confirmed"
    source_anchor: "L66-L72"
  -
    id: "create_llm_fact_body_66_1"
    type: "behavior_oracle"
    statement: "OpenAI的API规范中，可以在请求体内 添加支持的参数。"
    status: "confirmed"
    source_anchor: "L66-L72"
  -
    id: "create_llm_fact_body_66_2"
    type: "behavior_oracle"
    statement: "详细的支持参数请参照待添加的模型服务对应的API文档，各模 型服务可能存在差异，通过JSON字典的字符串格式输入，在数据库侧会校验json 格式的合法性，除了创建大语言模型时会校验temperature和max_tokens的范围 之外，其余参数会被直接透传到模型服务上, 如果属于大模型参数范围则会生效， 否则会忽略该参数，不合法参数会返回模型侧异常信息。"
    status: "confirmed"
    source_anchor: "L66-L72"
  -
    id: "create_llm_fact_example_76"
    type: "example"
    statement: "示例原文片段：创建标准的过程语言的推荐方法： CREATE LLM RERANK MODEL mod_r using model = 'BAAI/bge-reranker-v2-m3', url = 'https://ip:port/v1/ rerank', api_key='api_key'; --创建rerank模型 CREATE LLM QUERY MODEL mod_q USING model = 'Qwen/Qwen2.5-7B-Instruct', url ='https://ip:port/v1/ chat/completions', api_key='api_key', extra_params='{\"max_tokens\": 5, \"temperature\": 0.1}'; --创建大语言模型 CREATE LLM EMBED MODEL mod_e USING MODEL = 'Qwen/gte-Qwen2-1.5B-instruct', url ='https:// ip:port/v1/embeddings', api_key='api_key'; --创建embedding模型"
    status: "confirmed"
    source_anchor: "L76-L82"
  -
    id: "create_llm_fact_runtime_contract"
    type: "environment"
    statement: "静态LLM语法代表不连接外部服务；运行时密钥注入、HTTPS可信CA、外部服务和OBS加密密钥文件契约需专用环境，普通manifest不验证模型登记。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_llm_fact_example_secret_length"
    type: "constraint"
    statement: "静态域使用NOT_A_SECRET长占位符；示例api_key仅7字符且与正文16–256字节约束冲突，不得照抄为正向值。"
    status: "confirmed"
    source_anchor: "L76-L82"
  -
    id: "create_llm_fact_api_path_conflict"
    type: "constraint"
    statement: "静态域使用.invalid端点；注意事项接口路径completion/embedding与参数及示例completions/embeddings不一致保留为来源限制，不推断服务契约。"
    status: "confirmed"
    source_anchor: "L10-L11"
