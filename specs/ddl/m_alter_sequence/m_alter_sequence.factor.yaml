facts:
- id: m_alter_sequence_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.10 L2-2
- id: m_alter_sequence_fact_syntax
  type: syntax
  statement: MAXVALUE 分支与 CACHE 分支互斥且可省略，可后接 OWNED BY；OWNER TO 为独立分支。
  status: confirmed
  source_anchor: 2.4.2.6.10 L21-29
- id: m_alter_sequence_fact_authority
  type: environment
  statement: 序列所有者、获序列ALTER权限或ALTER ANY SEQUENCE权限的用户可修改序列。
  status: confirmed
  source_anchor: 2.4.2.6.10 L9-10
- id: m_alter_sequence_fact_limited
  type: constraint
  statement: 当前只支持拥有者、归属列、最大值和 CACHE；不从 CREATE 复制其他参数。
  status: confirmed
  source_anchor: 2.4.2.6.10 L13-14
- id: m_alter_sequence_fact_cache_range
  type: constraint
  statement: 普通序列 CACHE 取值范围从 1 开始至 2^63-1。
  status: confirmed
  source_anchor: 2.4.2.6.10 L46-46
- id: m_alter_sequence_fact_outside_transaction
  type: environment
  statement: 修改 MAXVALUE 不支持事务、函数和存储过程上下文。
  status: confirmed
  source_anchor: 2.4.2.6.10 L15-15
- id: m_alter_sequence_fact_bound_conflict
  type: open_question
  statement: 参数要求新 MAXVALUE 大于 last_value，但示例设置为已返回的 101；相等边界待核实。
  status: needs_verification
  source_anchor: 2.4.2.6.10 L40-41
- id: m_alter_sequence_fact_large_diagram
  type: open_question
  statement: PDF 物理页 2029 语法图含 LARGE，而相邻文本语法未列出；保留差异，本批只生成普通序列。
  status: needs_verification
  source_anchor: 2.4.2.6.10 L21-21
- id: m_alter_sequence_fact_cache_clear
  type: lifecycle
  statement: 修改 MAXVALUE 清空所有会话的序列 cache。
  status: confirmed
  source_anchor: 2.4.2.6.10 L16-16
- id: m_alter_sequence_fact_owned
  type: lifecycle
  statement: OWNED BY NONE 解除关联，新的列关联替换旧关联。
  status: confirmed
  source_anchor: 2.4.2.6.10 L50-52
- id: m_alter_sequence_fact_association_scope
  type: environment
  statement: 关联的表和序列必须由同一用户拥有，且处于同一模式。
  status: confirmed
  source_anchor: 2.4.2.6.10 L51-51
