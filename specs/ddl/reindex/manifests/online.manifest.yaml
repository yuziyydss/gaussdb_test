schema_version: 1
kind: "manifest"
id: "manifest_reindex_online"
name: "REINDEX online"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "reindex"
syntax_ref: "syntax_reindex"
suite_type: "positive"
strategy: "pairwise"
fixture_refs: []
identifier_policy: {}
bindings:
  target:
    - "reindex_target_index"
    - "reindex_target_table"
  concurrently:
    - "reindex_concurrently_yes"
  force:
    - "reindex_force_none"
    - "reindex_force_yes"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "transaction_context"
    allowed_values:
      - "outside_transaction"
    fact_refs:
      - "reindex_fact_concurrent"
  -
    key: "object_maintenance_exclusivity"
    allowed_values:
      - "single_maintenance_job"
    fact_refs:
      - "reindex_fact_deadlock"
