schema_version: 1
kind: "factor"
id: "reindex"
name: "REINDEX"
category: "DDL"
status: "needs_review"
description: "第四批 PDF 抽取；有限生成域与未执行场景分开报告。"
source:
  product: "GaussDB"
  document: "集中式版参考 / 1.13.18.5 REINDEX"
  version: "V2.0-10.0.0"
  artifact_sha256: "7796ad73ed8140d21b31a7010760da4899dc4a9f248814170ec9f6dd64f9bcde"
  parent_pdf_sha256: "716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe"
  extraction_rule_version: "gaussdb-pdf-outline-v1"
  extraction_date: "2026-09-05"
  catalog_chapter_ref:
    document_id: "gaussdb_v2_0_10_0_0_centralized_reference_01"
    source_relpath: "general/ddl/reindex.txt"
    chapter_sha256: "7796ad73ed8140d21b31a7010760da4899dc4a9f248814170ec9f6dd64f9bcde"
source_ledger_ref: "source_ledger_reindex"
syntax_ref: "syntax_reindex"
dimensions:
  target:
    description: "实际消费的对象/事务状态"
    classes:
      -
        id: "reindex_target_index_class"
        meaning: "index"
        values:
          -
            id: "reindex_target_index"
            render: "INDEX i_reindex_source"
            representative: true
            validity: "valid"
            fact_refs:
              - "reindex_fact_index"
            properties:
              object_kind: "INDEX"
              name: "i_reindex_source"
              in_transaction: false
            fixture_refs:
              - "fixture_reindex_index"
      -
        id: "reindex_target_table_class"
        meaning: "table"
        values:
          -
            id: "reindex_target_table"
            render: "TABLE t_reindex_source"
            representative: true
            validity: "valid"
            fact_refs:
              - "reindex_fact_table"
            properties:
              object_kind: "TABLE"
              name: "t_reindex_source"
              in_transaction: false
            fixture_refs:
              - "fixture_reindex_index"
      -
        id: "reindex_target_in_tx_class"
        meaning: "in_tx"
        values:
          -
            id: "reindex_target_in_tx"
            render: "INDEX i_reindex_tx"
            representative: true
            validity: "valid"
            fact_refs:
              - "reindex_fact_concurrent"
            properties:
              object_kind: "INDEX"
              name: "i_reindex_tx"
              in_transaction: true
            fixture_refs:
              - "fixture_reindex_transaction"
    default_value_id: "reindex_target_index"
  concurrently:
    description: "在线重建"
    classes:
      -
        id: "reindex_concurrently_none_class"
        meaning: "none"
        values:
          -
            id: "reindex_concurrently_none"
            render: ""
            representative: true
            validity: "valid"
            fact_refs:
              - "reindex_fact_syntax"
      -
        id: "reindex_concurrently_yes_class"
        meaning: "yes"
        values:
          -
            id: "reindex_concurrently_yes"
            render: "CONCURRENTLY"
            representative: true
            validity: "valid"
            fact_refs:
              - "reindex_fact_concurrent"
    default_value_id: "reindex_concurrently_none"
  force:
    description: "兼容关键字"
    classes:
      -
        id: "reindex_force_none_class"
        meaning: "none"
        values:
          -
            id: "reindex_force_none"
            render: ""
            representative: true
            validity: "valid"
            fact_refs:
              - "reindex_fact_force"
      -
        id: "reindex_force_yes_class"
        meaning: "yes"
        values:
          -
            id: "reindex_force_yes"
            render: "FORCE"
            representative: true
            validity: "valid"
            fact_refs:
              - "reindex_fact_force"
    default_value_id: "reindex_force_none"
rules:
  -
    id: "reindex_rule_transaction"
    kind: "requires"
    expression: "concurrently != 'reindex_concurrently_yes' or target.properties.in_transaction == False"
    fact_refs:
      - "reindex_fact_concurrent"
    severity: "error"
structural_checks: []
facts:
  -
    id: "reindex_fact_purpose"
    type: "lifecycle"
    statement: "根据表数据重建索引。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "reindex_fact_corrupt"
    type: "lifecycle"
    statement: "索引失效或损坏是重建用途。"
    status: "confirmed"
    source_anchor: "L8-L8"
  -
    id: "reindex_fact_bloat"
    type: "lifecycle"
    statement: "大量空页造成索引膨胀是重建用途。"
    status: "confirmed"
    source_anchor: "L9-L9"
  -
    id: "reindex_fact_storage_change"
    type: "lifecycle"
    statement: "重建让变更的索引存储参数完全生效。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "reindex_fact_invalid"
    type: "lifecycle"
    statement: "可重建并发创建失败留下的非法索引。"
    status: "confirmed"
    source_anchor: "L11-L11"
  -
    id: "reindex_fact_database_transaction"
    type: "constraint"
    statement: "DATABASE/SYSTEM 重建不能在事务块内。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "reindex_fact_parallel"
    type: "environment"
    statement: "lpi_parallel_method=PARTITION 且 parallel_workers>0 不支持并行重建；AUTO/缺省采用页面级并行。"
    status: "confirmed"
    source_anchor: "L16-L18"
  -
    id: "reindex_fact_plan_change"
    type: "behavior_oracle"
    statement: "在线重建改变索引顺序时可能改变查询计划。"
    status: "confirmed"
    source_anchor: "L19-L20"
  -
    id: "reindex_fact_rcr_pcr"
    type: "constraint"
    statement: "REINDEX 不改变 ubtree 的 RCR/PCR 类型。"
    status: "confirmed"
    source_anchor: "L21-L22"
  -
    id: "reindex_fact_rowid"
    type: "constraint"
    statement: "在线重建不支持 rowid 系统列索引。"
    status: "confirmed"
    source_anchor: "L23-L24"
  -
    id: "reindex_fact_syntax"
    type: "syntax"
    statement: "普通重建按对象种类选择，再跟 CONCURRENTLY、名称及 FORCE。"
    status: "confirmed"
    source_anchor: "L27-L28"
  -
    id: "reindex_fact_convert_syntax"
    type: "syntax"
    statement: "索引转换选项列表位于 INDEX 前。"
    status: "confirmed"
    source_anchor: "L33-L34"
  -
    id: "reindex_fact_partition_syntax"
    type: "syntax"
    statement: "分区重建在名称后指定 PARTITION partition_name，无 CONCURRENTLY。"
    status: "confirmed"
    source_anchor: "L36-L38"
  -
    id: "reindex_fact_index"
    type: "syntax"
    statement: "INDEX 重建指定索引。"
    status: "confirmed"
    source_anchor: "L44-L45"
  -
    id: "reindex_fact_table"
    type: "lifecycle"
    statement: "TABLE 重建其索引及 TOAST；unusable 索引不能重建，在线方式不重建 TOAST。"
    status: "confirmed"
    source_anchor: "L46-L49"
  -
    id: "reindex_fact_database"
    type: "lifecycle"
    statement: "DATABASE 处理当前库索引，在线方式不重建 TOAST。"
    status: "confirmed"
    source_anchor: "L50-L52"
  -
    id: "reindex_fact_system"
    type: "lifecycle"
    statement: "SYSTEM 只重建当前库系统表索引。"
    status: "confirmed"
    source_anchor: "L53-L54"
  -
    id: "reindex_fact_crossbucket"
    type: "constraint"
    statement: "仅 CROSSBUCKET ON/OFF 转换 CBI/LBI，不支持集中式 hashbucket 或 GSI。"
    status: "confirmed"
    source_anchor: "L55-L59"
  -
    id: "reindex_fact_concurrent"
    type: "environment"
    statement: "CONCURRENTLY 不阻塞 DML，禁止事务内执行。"
    status: "confirmed"
    source_anchor: "L60-L67"
  -
    id: "reindex_fact_online_types"
    type: "constraint"
    statement: "在线重建仅支持 B-tree/UB-tree 的普通及 GLOBAL/LOCAL 索引；PCR、二级分区和 GSI 不支持。"
    status: "confirmed"
    source_anchor: "L68-L71"
  -
    id: "reindex_fact_auto_cleanup"
    type: "lifecycle"
    statement: "在线重建失败时尝试自动清理新索引，该清理可能失败。"
    status: "confirmed"
    source_anchor: "L72-L74"
  -
    id: "reindex_fact_manual_cleanup"
    type: "lifecycle"
    statement: "无法自动清理时需人工清除非法新索引及临时表，常见新索引后缀 _ccnew。"
    status: "confirmed"
    source_anchor: "L76-L78"
  -
    id: "reindex_fact_deadlock"
    type: "environment"
    statement: "在线重建持有4级会话锁，同一对象并发重建可能死锁。"
    status: "confirmed"
    source_anchor: "L79-L82"
  -
    id: "reindex_fact_astore_scan"
    type: "lifecycle"
    statement: "Astore 在线重建先后扫描两次，第二次合并期间修改。"
    status: "confirmed"
    source_anchor: "L85-L86"
  -
    id: "reindex_fact_ustore_scan"
    type: "lifecycle"
    statement: "Ustore 在线重建扫描一次，临时表收集并发修改后合并并交换索引。"
    status: "confirmed"
    source_anchor: "L87-L90"
  -
    id: "reindex_fact_name"
    type: "syntax"
    statement: "目标名称可为索引、表或数据库，表/索引可带模式。"
    status: "confirmed"
    source_anchor: "L91-L92"
  -
    id: "reindex_fact_current_database"
    type: "constraint"
    statement: "DATABASE/SYSTEM 名称必须是当前数据库。"
    status: "confirmed"
    source_anchor: "L95-L96"
  -
    id: "reindex_fact_force"
    type: "syntax"
    statement: "FORCE 仅语法兼容无实际含义。"
    status: "confirmed"
    source_anchor: "L97-L98"
  -
    id: "reindex_fact_partition_name"
    type: "open_question"
    statement: "参数说明把 partition_name 描述为表/索引名称，与分区语法不一致，需核实。"
    status: "needs_verification"
    source_anchor: "L99-L103"
  -
    id: "reindex_fact_internal_advice"
    type: "environment"
    statement: "INTERNAL TABLE 多用于故障恢复，不建议并发。"
    status: "confirmed"
    source_anchor: "L155-L157"
  -
    id: "reindex_fact_no_mv"
    type: "constraint"
    statement: "不支持对物化视图执行 REINDEX。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "reindex_fact_online_forbidden"
    type: "constraint"
    statement: "不支持在线重建系统索引、INTERNAL TABLE、SYSTEM 或 INVALID INDEX。"
    status: "confirmed"
    source_anchor: "L60-L67"
  -
    id: "reindex_fact_source_example"
    type: "example"
    statement: "创建 Ustore 源表及三条记录。"
    status: "confirmed"
    source_anchor: "L112-L114"
  -
    id: "reindex_fact_index_example"
    type: "example"
    statement: "创建索引并显示大小。"
    status: "confirmed"
    source_anchor: "L116-L122"
  -
    id: "reindex_fact_bloat_example"
    type: "example"
    statement: "插入删除数据后示例索引变大，大小非固定 Oracle。"
    status: "confirmed"
    source_anchor: "L124-L132"
  -
    id: "reindex_fact_rebuild_example"
    type: "example"
    statement: "重建后示例索引缩小。"
    status: "confirmed"
    source_anchor: "L134-L140"
  -
    id: "reindex_fact_online_index_example"
    type: "example"
    statement: "在线重建单个索引。"
    status: "confirmed"
    source_anchor: "L142-L143"
  -
    id: "reindex_fact_table_example"
    type: "example"
    statement: "重建表上全部索引。"
    status: "confirmed"
    source_anchor: "L145-L146"
  -
    id: "reindex_fact_online_table_example"
    type: "example"
    statement: "在线重建表上全部索引。"
    status: "confirmed"
    source_anchor: "L148-L149"
  -
    id: "reindex_fact_cleanup_example"
    type: "example"
    statement: "删除示例表。"
    status: "confirmed"
    source_anchor: "L151-L152"
  -
    id: "reindex_fact_broad_targets"
    type: "open_question"
    statement: "整库和系统索引维护不纳入默认生成域。"
    status: "needs_verification"
    source_anchor: "L53-L54"
  -
    id: "reindex_fact_online_failure"
    type: "open_question"
    statement: "失败清理与死锁需隔离多会话，不允许按后缀批量删除实例对象。"
    status: "needs_verification"
    source_anchor: "L72-L74"
  -
    id: "reindex_fact_storage_profiles"
    type: "open_question"
    statement: "本轮只生成普通 Astore B-tree；其余存储、分区与 GSI 限制留账。"
    status: "needs_verification"
    source_anchor: "L68-L71"
  -
    id: "reindex_fact_transaction_error"
    type: "open_question"
    statement: "在线重建在事务内的目标 SQLSTATE 待验证。"
    status: "needs_verification"
    source_anchor: "L60-L67"
exported_fact_refs: []
manifest_refs:
  - "manifest_reindex_ordinary"
  - "manifest_reindex_online"
  - "manifest_reindex_transaction_negative"
matrix_refs:
  - "matrix_reindex_coverage"
fixture_refs:
  - "fixture_reindex_source"
  - "fixture_reindex_index"
  - "fixture_reindex_transaction"
scenario_refs:
  - "scenario_reindex_rebuild_contracts"
