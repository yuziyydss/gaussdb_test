schema_version: 1
kind: "syntax"
id: "syntax_reindex"
name: "REINDEX 语法"
factor_ref: "reindex"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  target:
    type: "token"
    optional: true
    dimension_ref: "reindex.target"
  concurrently:
    type: "token"
    optional: true
    dimension_ref: "reindex.concurrently"
  force:
    type: "token"
    optional: true
    dimension_ref: "reindex.force"
source_fact_refs:
  - "reindex_fact_syntax"
  - "reindex_fact_convert_syntax"
  - "reindex_fact_partition_syntax"
  - "reindex_fact_index"
  - "reindex_fact_name"
  - "reindex_fact_force"
ast:
  kind: "choice"
  selector: "target"
  branches:
    reindex_target_index:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "REINDEX INDEX "
        -
          kind: "slot"
          slot: "concurrently"
        -
          kind: "literal"
          text: " i_reindex_source "
        -
          kind: "slot"
          slot: "force"
    reindex_target_table:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "REINDEX TABLE "
        -
          kind: "slot"
          slot: "concurrently"
        -
          kind: "literal"
          text: " t_reindex_source "
        -
          kind: "slot"
          slot: "force"
    reindex_target_in_tx:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "REINDEX INDEX "
        -
          kind: "slot"
          slot: "concurrently"
        -
          kind: "literal"
          text: " i_reindex_tx "
        -
          kind: "slot"
          slot: "force"
