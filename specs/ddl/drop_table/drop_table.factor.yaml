schema_version: 1
kind: factor
id: drop_table
name: DROP TABLE
category: DDL
status: needs_review
description: >-
  基于 GaussDB V2.0-10.0.0 集中式版 1.13.10.41 的 PDF-first 因子包；
  表列表按有限 profile 展开，无界重复域明确保留为模型缺口。
source:
  product: GaussDB
  document: GaussDB V2.0-10.0.0 集中式版参考 / 1.13.10.41 DROP TABLE
  version: V2.0-10.0.0
  artifact_sha256: b060c7191c1a81ea68a31d7821e33a98872b19c4da4a3f2a0fa2717e1051a7a4
  parent_pdf_sha256: 716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe
  extraction_rule_version: gaussdb-pdf-outline-v1
  extraction_date: "2026-09-04"
  catalog_chapter_ref:
    document_id: gaussdb_v2_0_10_0_0_centralized_reference_01
    source_relpath: general/ddl/drop_table.txt
    chapter_sha256: b060c7191c1a81ea68a31d7821e33a98872b19c4da4a3f2a0fa2717e1051a7a4
source_ledger_ref: source_ledger_drop_table
syntax_ref: syntax_drop_table_v1
dimensions:
  if_exists:
    description: 省略或声明 IF EXISTS。
    default_value_id: dt_if_absent
    classes:
      - id: dt_if_class
        meaning: 同名表不存在时的 NOTICE 保护。
        values:
          - {id: dt_if_absent, render: "", representative: true, validity: valid}
          - {id: dt_if_present, render: "IF EXISTS ", representative: true, validity: valid, fact_refs: [dt_fact_if_exists]}
  table_profile:
    description: 有限的一表、模式限定、两表和依赖视图目标能力。
    default_value_id: dt_table_single
    profile_source: {matrix_ref: matrix_drop_table_targets, profile_id_path: profiles.id}
  dependency_clause:
    description: 缺省 RESTRICT、显式 CASCADE 或显式 RESTRICT。
    default_value_id: dt_dependency_default
    classes:
      - id: dt_dependency_restrict_class
        meaning: 省略或显式 RESTRICT，存在依赖时拒绝。
        values:
          - {id: dt_dependency_default, render: "", representative: true, validity: valid, fact_refs: [dt_fact_dependency_modes]}
          - {id: dt_dependency_restrict, render: " RESTRICT", representative: false, validity: valid, fact_refs: [dt_fact_dependency_modes]}
      - id: dt_dependency_cascade_class
        meaning: 允许级联删除依赖对象。
        values:
          - {id: dt_dependency_cascade, render: " CASCADE", representative: true, validity: valid, fact_refs: [dt_fact_dependency_modes]}
  purge_clause:
    description: 省略或强制绕过回收站物理删除。
    default_value_id: dt_purge_absent
    classes:
      - id: dt_purge_class
        meaning: 回收站处理方式。
        values:
          - {id: dt_purge_absent, render: "", representative: true, validity: valid}
          - {id: dt_purge_present, render: " PURGE", representative: true, validity: valid, fact_refs: [dt_fact_purge]}
rules:
  - id: dt_rule_restrict_requires_no_dependency
    kind: requires
    expression: dependency_clause == 'dt_dependency_cascade' or table_profile.properties.blocking_dependency == False
    severity: error
    fact_refs: [dt_fact_dependency_modes]
structural_checks: []
facts:
  - {id: dt_fact_purpose, type: syntax, statement: "DROP TABLE 删除指定表。", status: confirmed, source_anchor: "L5"}
  - {id: dt_fact_index_lifecycle, type: lifecycle, statement: "删除表会删除依赖该表的索引。", status: confirmed, source_anchor: "L8-L9"}
  - {id: dt_fact_routine_dependency, type: lifecycle, statement: "引用已删除表的函数和存储过程将无法执行。", status: confirmed, source_anchor: "L8-L9"}
  - {id: dt_fact_partition_lifecycle, type: lifecycle, statement: "删除分区表会删除其全部分区。", status: confirmed, source_anchor: "L8-L9"}
  - {id: dt_fact_permissions, type: environment, statement: "表 Owner、Schema Owner、表 DROP 权限、DROP ANY TABLE 权限或三权分立关闭时的系统管理员可执行 DROP TABLE。", status: confirmed, source_anchor: "L10-L12"}
  - {id: dt_fact_fk_trigger_lifecycle, type: lifecycle, statement: "删除作为外键表的表会级联删除被引用表上的触发器。", status: confirmed, source_anchor: "L13-L14"}
  - {id: dt_fact_fk_lock, type: environment, statement: "该外键情形需对被引用表加八级锁，可能阻塞业务。", status: confirmed, source_anchor: "L13-L15"}
  - {id: dt_fact_grammar, type: syntax, statement: "DROP TABLE 支持 IF EXISTS、一个或多个模式可限定表名、CASCADE/RESTRICT 和 PURGE。", status: confirmed, source_anchor: "L16-L18"}
  - {id: dt_open_table_list_unbounded, type: constraint, statement: "PDF 表列表为 [, ...] 无界重复；V1 静态域只展开一表、模式限定和两表代表，不宣称无界列表全覆盖。", status: confirmed, source_anchor: "L17-L18"}
  - {id: dt_fact_if_exists, type: lifecycle, statement: "IF EXISTS 对存在表执行删除，对不存在表只产生 NOTICE。", status: confirmed, source_anchor: "L21-L25"}
  - {id: dt_fact_schema_name, type: syntax, statement: "schema 是可选的表名限定。", status: confirmed, source_anchor: "L26-L27"}
  - {id: dt_fact_table_name, type: syntax, statement: "table_name 是目标表名。", status: confirmed, source_anchor: "L28-L29"}
  - {id: dt_fact_dependency_modes, type: constraint, statement: "CASCADE 删除依赖对象但不删除关联表；RESTRICT 在有依赖时拒绝且为默认。", status: confirmed, source_anchor: "L30-L34"}
  - {id: dt_fact_purge, type: lifecycle, statement: "PURGE 在回收站开启时仍直接物理删除表。", status: confirmed, source_anchor: "L35-L37"}
  - {id: dt_fact_example_basic, type: example, statement: "示例使用 DROP TABLE IF EXISTS test。", status: confirmed, source_anchor: "L41-L44"}
  - {id: dt_fact_example_dependency, type: example, statement: "示例中默认删除因依赖视图失败，CASCADE 删除表并级联删除视图。", status: confirmed, source_anchor: "L46-L59"}
  - {id: dt_fact_restrict_error_message, type: behavior_oracle, statement: "依赖视图示例的目标错误文本包含 cannot be dropped because other objects depend on it。", status: confirmed, source_anchor: "L50-L54"}
exported_fact_refs: [dt_fact_permissions, dt_fact_purge, dt_fact_dependency_modes]
