schema_version: 1
kind: syntax
id: syntax_drop_table_v1
name: DROP TABLE 有限表列表 AST
category: DDL
status: ready
factor_ref: drop_table
description: 以 repeat 节点表达表列表；matrix 仅提供一表和两表的有限代表值。
ast:
  kind: sequence
  items:
    - {kind: literal, text: "DROP TABLE "}
    - {kind: slot, slot: if_exists}
    - {kind: repeat, slot: table_profile, separator: ", ", items_property: items}
    - {kind: slot, slot: dependency_clause}
    - {kind: slot, slot: purge_clause}
rendering: {whitespace: collapse, statement_terminator: ";"}
slots:
  if_exists: {type: token, optional: true, dimension_ref: drop_table.if_exists}
  table_profile: {type: ast_repeat, optional: false, dimension_ref: drop_table.table_profile, symbol_action: drops_relation}
  dependency_clause: {type: token, optional: true, dimension_ref: drop_table.dependency_clause}
  purge_clause: {type: token, optional: true, dimension_ref: drop_table.purge_clause}
source_fact_refs: [dt_fact_purpose, dt_fact_grammar, dt_fact_if_exists, dt_fact_schema_name, dt_fact_table_name, dt_fact_dependency_modes, dt_fact_purge]
