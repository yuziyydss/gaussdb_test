schema_version: 1
kind: matrix
id: matrix_drop_table_targets
name: DROP TABLE 有限目标列表能力
status: needs_review
description: 保存一表、模式限定、两表及带依赖视图的一组有限 repeat items。
factor_ref: drop_table
profile_property_defaults: {blocking_dependency: false}
profiles:
  - id: dt_table_single
    render: ""
    validity: valid
    fixture_refs: [fixture_drop_table_regular]
    properties: {items: [t_dt_base], source_tables: [t_dt_base], blocking_dependency: false}
    fact_refs: [dt_fact_grammar, dt_fact_table_name]
  - id: dt_table_schema_qualified
    render: ""
    validity: valid
    fixture_refs: [fixture_drop_table_schema_qualified]
    properties: {items: [dt_fixture_schema.t_dt_base], source_tables: [dt_fixture_schema.t_dt_base], blocking_dependency: false}
    fact_refs: [dt_fact_schema_name, dt_fact_table_name]
  - id: dt_table_two
    render: ""
    validity: valid
    fixture_refs: [fixture_drop_table_multi]
    properties: {items: [t_dt_one, t_dt_two], source_tables: [t_dt_one, t_dt_two], blocking_dependency: false}
    fact_refs: [dt_fact_grammar]
  - id: dt_table_dependent_view
    render: ""
    validity: valid
    fixture_refs: [fixture_drop_table_dependent_view]
    properties: {items: [t_dt_dep_base], source_tables: [t_dt_dep_base], blocking_dependency: true}
    fact_refs: [dt_fact_dependency_modes, dt_fact_example_dependency]
documented_features:
  - {id: dt_feature_single_table, profile_refs: [dt_table_single], status: covered, fact_refs: [dt_fact_grammar]}
  - {id: dt_feature_schema_qualified, profile_refs: [dt_table_schema_qualified], status: covered, fact_refs: [dt_fact_schema_name]}
  - {id: dt_feature_multi_table_representative, profile_refs: [dt_table_two], status: covered, coverage_mode: any, fact_refs: [dt_fact_grammar]}
  - {id: dt_feature_unbounded_table_list, profile_refs: [dt_table_two], status: covered, coverage_mode: any, fact_refs: [dt_open_table_list_unbounded]}
  - {id: dt_feature_dependency_target, profile_refs: [dt_table_dependent_view], status: covered, fact_refs: [dt_fact_dependency_modes]}
fact_refs: [dt_fact_grammar, dt_fact_schema_name, dt_fact_table_name, dt_fact_dependency_modes, dt_open_table_list_unbounded]
