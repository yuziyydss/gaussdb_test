schema_version: 1
kind: fixture
id: fixture_drop_table_schema_qualified
name: DROP TABLE 专用模式限定目标
status: ready
description: 在专用测试模式中显式创建与 schema-qualified profile 完全同名的目标表，不依赖 search_path 或 public。
factor_ref: drop_table
provides:
  tables:
    - name: dt_fixture_schema.t_dt_base
      persistence: permanent
      table_kind: regular
      columns:
        - {name: id, type: INTEGER, nullable: false}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP SCHEMA IF EXISTS dt_fixture_schema CASCADE;
    - CREATE SCHEMA dt_fixture_schema;
    - CREATE TABLE dt_fixture_schema.t_dt_base (id INTEGER NOT NULL);
    - INSERT INTO dt_fixture_schema.t_dt_base (id) VALUES (1);
  teardown_sqls:
    - DROP SCHEMA IF EXISTS dt_fixture_schema CASCADE;
  note: 每个 case 前重建专用模式；目标 SQL、provides 和实际建表名称完全一致。
