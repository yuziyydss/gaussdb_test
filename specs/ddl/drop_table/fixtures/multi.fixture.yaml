schema_version: 1
kind: fixture
id: fixture_drop_table_multi
name: DROP TABLE 两表目标
status: ready
description: 为逗号列表提供两个相互独立的已存在表。
factor_ref: drop_table
provides:
  tables:
    - {name: t_dt_one, persistence: permanent, table_kind: regular, columns: [{name: id, type: INTEGER, nullable: false}]}
    - {name: t_dt_two, persistence: permanent, table_kind: regular, columns: [{name: id, type: INTEGER, nullable: false}]}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP TABLE IF EXISTS t_dt_one CASCADE;
    - DROP TABLE IF EXISTS t_dt_two CASCADE;
    - CREATE TABLE t_dt_one (id INTEGER NOT NULL);
    - CREATE TABLE t_dt_two (id INTEGER NOT NULL);
  teardown_sqls: [DROP TABLE IF EXISTS t_dt_two CASCADE;, DROP TABLE IF EXISTS t_dt_one CASCADE;]
  note: 两表均由当前用户创建且无依赖。
