schema_version: 1
kind: fixture
id: fixture_drop_table_dependent_view
name: DROP TABLE 依赖视图目标
status: ready
description: 为 RESTRICT 目标负向和 CASCADE 正向建立单一依赖视图。
factor_ref: drop_table
requires_fixture_refs: [fixture_create_table_drop_view_base]
provides:
  tables:
    - name: v_dt_dep
      persistence: permanent
      table_kind: view
      columns:
        - {name: id, type: INTEGER, nullable: false}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP VIEW IF EXISTS v_dt_dep;
    - CREATE VIEW v_dt_dep AS SELECT id FROM t_dt_dep_base;
  teardown_sqls: [DROP VIEW IF EXISTS v_dt_dep;]
  note: setup 本身合法；目标错误只能由 DROP TABLE 的 RESTRICT 依赖检查产生。
