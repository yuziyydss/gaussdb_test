    status: "confirmed"
    source_anchor: "L39-L44"
  -
    id: "alter_pluggable_database_fact_force_close"
    type: "lifecycle"
    statement: "CLOSE IMMEDIATE主动清退业务连接后关闭PDB。"
    status: "confirmed"
    source_anchor: "L45-L47"
