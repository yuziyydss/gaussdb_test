    id: "alter_pluggable_database_fact_syntax"
    type: "syntax"
    statement: "PDB名称后为OPEN、CLOSE、CLOSE IMMEDIATE三选一。"
    status: "confirmed"
    source_anchor: "L22-L22"
  -
