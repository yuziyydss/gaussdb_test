steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "打开、关闭或强制关闭PDB。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "要求enable_mtd=on。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "只在非PDB且非M兼容库执行。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "要求PDB属主或sysadmin。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "只有初始用户可变更template_pdb。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "只有初始用户可连接模板PDB。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "禁止模板PDB内执行数据操作；例如模板表空间软链接不会被新PDB同步，可能发生异常。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "OPEN启动服务，只有开启状态允许连接。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "当前资源计划须有与PDB关联的资源计划指令才能打开。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "CLOSE停止服务并保留基本维护；有业务连接时最多等5秒，仍有连接则关闭失败。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "CLOSE IMMEDIATE主动清退业务连接后关闭PDB。"
oracles: []
execution_requirements:
