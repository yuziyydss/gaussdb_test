  - "alter_pluggable_database_fact_non_pdb_not_m"
  - "alter_pluggable_database_fact_privilege"
  - "alter_pluggable_database_fact_template_admin"
  - "alter_pluggable_database_fact_template_connect"
  - "alter_pluggable_database_fact_template_data"
  - "alter_pluggable_database_fact_open"
  - "alter_pluggable_database_fact_resource_plan"
  - "alter_pluggable_database_fact_close"
  - "alter_pluggable_database_fact_force_close"
preconditions:
