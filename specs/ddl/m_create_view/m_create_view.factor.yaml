facts:
- id: m_create_view_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.21 L2-2
- id: m_create_view_fact_authority
  type: environment
  statement: 被授予CREATE ANY TABLE权限的用户可以在public和用户模式创建视图。
  status: confirmed
  source_anchor: 2.4.2.8.21 L16-16
- id: m_create_view_fact_syntax
  type: syntax
  statement: CREATE VIEW 有 OR REPLACE、TEMPORARY、FORCE、列名、选项及 CHECK OPTION。
  status: confirmed
  source_anchor: 2.4.2.8.21 L19-22
- id: m_create_view_fact_updatable_column
  type: constraint
  statement: 可更新列直接引用基表用户列，不是系统列或 whole-row reference。
  status: confirmed
  source_anchor: 2.4.2.8.21 L68-68
- id: m_create_view_fact_check
  type: behavior_oracle
  statement: CHECK OPTION 拒绝视图定义不可见的新行。
  status: confirmed
  source_anchor: 2.4.2.8.21 L120-124
- id: m_create_view_fact_security
  type: syntax
  statement: security_barrier 选项接受 true/false。
  status: confirmed
  source_anchor: 2.4.2.8.21 L105-107
- id: m_create_view_fact_force
  type: lifecycle
  statement: FORCE 允许缺依赖或查询权限时创建；创建成功不证明可用。
  status: confirmed
  source_anchor: 2.4.2.8.21 L94-95
- id: m_create_view_fact_precision
  type: environment
  statement: 精度传递选项影响视图定义中受限类型的计算。
  status: confirmed
  source_anchor: 2.4.2.8.21 L28-33
- id: m_create_view_fact_purpose
  type: syntax
  statement: 视图是虚拟表，数据库仅存定义不存数据；基表数据变化时视图查询结果随之改变。
  status: confirmed
  source_anchor: 2.4.2.8.21 L4-13
- id: m_create_view_fact_security_barrier
  type: behavior_oracle
  statement: WITH(security_barrier)创建相对安全视图，避免低成本函数RAISE打印隐藏基表数据。
  status: confirmed
  source_anchor: 2.4.2.8.21 L26-27
- id: m_create_view_fact_precision_types
  type: constraint
  statement: 精度开关未开启时，BINARY/CHAR/VARCHAR/TIME/DATETIME/TIMESTAMP/BIT/NUMERIC/FLOAT/TEXT/BLOB等类型字段在query中不允许计算操作，仅允许直接字段调用。
  status: confirmed
  source_anchor: 2.4.2.8.21 L28-67
- id: m_create_view_fact_join_view
  type: syntax
  statement: 连接视图是多张表JOIN创建的视图。
  status: confirmed
  source_anchor: 2.4.2.8.21 L69-70
- id: m_create_view_fact_key_preserved
  type: constraint
  statement: 保留键表：源表每行与视图每行一一对应，无一对多展开则为保留键表。
  status: confirmed
  source_anchor: 2.4.2.8.21 L69-70
- id: m_create_view_fact_top_bottom
  type: syntax
  statement: 顶层是DML直接操作的视图；底层是构成视图的表、视图及WITH子句中的表和视图。
  status: confirmed
  source_anchor: 2.4.2.8.21 L69-70
- id: m_create_view_fact_updatable_view
  type: constraint
  statement: 可更新视图不含DISTINCT、GROUP BY、HAVING、LIMIT、OFFSET、集合运算、聚集函数、窗口函数或返回集合函数。
  status: confirmed
  source_anchor: 2.4.2.8.21 L69-79
- id: m_create_view_fact_nested_invalidation
  type: lifecycle
  statement: 嵌套视图中被依赖视图修改列名/类型或删除列，无论失效参数是否开启，均导致依赖视图失效。
  status: confirmed
  source_anchor: 2.4.2.8.21 L79-82
- id: m_create_view_fact_precision_rebuild
  type: environment
  statement: 精度开关未开启时创建的视图在开关开启后使用，建议重建以避免小数位和比较结果不一致。
  status: confirmed
  source_anchor: 2.4.2.8.21 L82-89
- id: m_create_view_fact_temporary
  type: lifecycle
  statement: 临时视图会话结束时自动删除；引用临时表的视图自动为临时视图；临时视图不支持自动重编译。
  status: confirmed
  source_anchor: 2.4.2.8.21 L91-93
- id: m_create_view_fact_view_name
  type: syntax
  statement: view_name可用模式修饰，取值为符合标识符说明的字符串。
  status: confirmed
  source_anchor: 2.4.2.8.21 L96-104
- id: m_create_view_fact_column_name
  type: syntax
  statement: column_name为可选名称列表；未给出时字段名取自查询。
  status: confirmed
  source_anchor: 2.4.2.8.21 L96-104
- id: m_create_view_fact_partition_oid
  type: lifecycle
  statement: query含分区子句时创建视图将分区OID固化到系统表；后续分区DDL可能导致视图失效。
  status: confirmed
  source_anchor: 2.4.2.8.21 L114-117
- id: m_create_view_fact_check_cascaded
  type: behavior_oracle
  statement: CASCADED检查该视图和所有底层视图条件；仅声明CHECK OPTION未指定时默认CASCADED。
  status: confirmed
  source_anchor: 2.4.2.8.21 L119-129
- id: m_create_view_fact_check_local
  type: behavior_oracle
  statement: LOCAL只检查视图本身直接定义的条件；底层视图条件不检查除非底层也定义了CHECK OPTION。
  status: confirmed
  source_anchor: 2.4.2.8.21 L125-129
- id: m_create_view_fact_check_join_column
  type: constraint
  statement: 指定CHECK OPTION时无法对多表连接视图或子查询中的连接列进行插入更新。
  status: confirmed
  source_anchor: 2.4.2.8.21 L131-134
- id: m_create_view_fact_check_duplicate_base
  type: constraint
  statement: CHECK OPTION时多表连接视图/子查询出现重复基表且不都是保留键表，则无法删除。
  status: confirmed
  source_anchor: 2.4.2.8.21 L131-134
