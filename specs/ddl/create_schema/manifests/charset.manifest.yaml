schema_version: 1
kind: "manifest"
id: "manifest_create_schema_charset"
name: "CREATE SCHEMA charset"
status: "ready"
description: "选取原文 B/UTF8 示例的 utf8mb4 代表域；编码门禁不自动创建或修改数据库。"
factor_ref: "create_schema"
syntax_ref: "syntax_create_schema"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_create_schema_new_name"
identifier_policy: {}
bindings:
  form:
    - "create_schema_form_charset"
  charset:
    - "create_schema_charset_absent"
    - "create_schema_charset_set"
    - "create_schema_charset_default"
    - "create_schema_charset_short"
    - "create_schema_charset_equals"
  collation:
    - "create_schema_collation_absent"
    - "create_schema_collation_plain"
    - "create_schema_collation_equals"
    - "create_schema_collation_default"
    - "create_schema_collation_default_equals"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "server_encoding"
    allowed_values:
      - "UTF8"
    fact_refs:
      - "create_schema_fact_encoding_match"
  -
    key: "compatibility_mode"
    allowed_values:
      - "B"
    fact_refs:
      - "create_schema_fact_compatibility"
local_rules:
  -
    expression: "charset != 'create_schema_charset_absent' or collation != 'create_schema_collation_absent'"
    rationale: "空字符选项已经由 named/basic 覆盖，第三产生式只选择至少一个显式字符选项。"
    fact_refs:
      - "create_schema_fact_charset_syntax"
