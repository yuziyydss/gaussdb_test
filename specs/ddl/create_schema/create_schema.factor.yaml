schema_version: 1
kind: factor
id: create_schema
name: CREATE SCHEMA
category: DDL
status: needs_review
description: 第三批 PDF 抽取；有限生成域与未执行场景分开报告。
source:
  product: GaussDB
  document: 集中式版参考 / 1.13.9.43 CREATE SCHEMA
  version: V2.0-10.0.0
  artifact_sha256: edcb7f3358f4a0f8024ca2eee29da6f52b3b5e86ad809b11855c9d657410774e
  parent_pdf_sha256: 716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe
  extraction_rule_version: gaussdb-pdf-outline-v1
  extraction_date: '2026-09-05'
  catalog_chapter_ref:
    document_id: gaussdb_v2_0_10_0_0_centralized_reference_01
    source_relpath: general/ddl/create_schema.txt
    chapter_sha256: edcb7f3358f4a0f8024ca2eee29da6f52b3b5e86ad809b11855c9d657410774e
source_ledger_ref: source_ledger_create_schema
syntax_ref: syntax_create_schema
dimensions:
  form:
    description: 顶层产生式
    classes:
    - id: create_schema_form_named_class
      meaning: named
      values:
      - id: create_schema_form_named
        render: ''
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_named_syntax
    - id: create_schema_form_owner_class
      meaning: owner
      values:
      - id: create_schema_form_owner
        render: ''
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_owner_syntax
    - id: create_schema_form_charset_class
      meaning: charset
      values:
      - id: create_schema_form_charset
        render: ''
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_charset_syntax
    default_value_id: create_schema_form_named
  schema_name:
    description: 受控新名与已存在名
    classes:
    - id: create_schema_schema_name_new_class
      meaning: new
      values:
      - id: create_schema_schema_name_new
        render: fp_cs_new
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_identifier
        properties:
          available: true
    - id: create_schema_schema_name_existing_class
      meaning: existing
      values:
      - id: create_schema_schema_name_existing
        render: fp_cs_one
        representative: true
        validity: unknown
        fact_refs:
        - create_schema_fact_unique
        properties:
          available: false
        fixture_refs:
        - fixture_create_schema_pair
    default_value_id: create_schema_schema_name_new
  authorization:
    description: 授权修饰
    classes:
    - id: create_schema_authorization_absent_class
      meaning: absent
      values:
      - id: create_schema_authorization_absent
        render: ''
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_named_syntax
    - id: create_schema_authorization_present_class
      meaning: present
      values:
      - id: create_schema_authorization_present
        render: AUTHORIZATION fp_cs_owner
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_owner_syntax
        - create_schema_fact_existing_role
    default_value_id: create_schema_authorization_absent
  blockchain:
    description: 防篡改修饰
    classes:
    - id: create_schema_blockchain_absent_class
      meaning: absent
      values:
      - id: create_schema_blockchain_absent
        render: ''
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_named_syntax
    - id: create_schema_blockchain_present_class
      meaning: present
      values:
      - id: create_schema_blockchain_present
        render: WITH BLOCKCHAIN
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_blockchain
    default_value_id: create_schema_blockchain_absent
  elements:
    description: 内嵌对象的有限列表
    classes:
    - id: create_schema_elements_absent_class
      meaning: absent
      values:
      - id: create_schema_elements_absent
        render: ''
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_elements
        properties:
          items: []
    - id: create_schema_elements_table_class
      meaning: table
      values:
      - id: create_schema_elements_table
        render: ''
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_elements
        properties:
          items:
          - CREATE TABLE t_cs_inline (id INT)
    - id: create_schema_elements_table_view_class
      meaning: table_view
      values:
      - id: create_schema_elements_table_view
        render: ''
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_element_kinds
        properties:
          items:
          - CREATE TABLE t_cs_inline (id INT)
          - CREATE VIEW v_cs_inline AS SELECT id FROM fp_cs_new.t_cs_inline
    - id: create_schema_elements_table_index_class
      meaning: 单个ASTORE整数表后跟该表的普通btree索引；仅命名模式有限代表
      values:
      - id: create_schema_elements_table_index
        render: ''
        representative: true
        validity: valid
        fixture_refs:
        - fixture_create_schema_inline_index
        fact_refs:
        - create_schema_fact_element_kinds
        - create_index::ci_fact_main_grammar
        - create_index::ci_fact_method_storage_contract
        properties:
          items:
          - CREATE TABLE fp_cs_new.t_cs_index (id INTEGER) WITH (storage_type=astore)
          - CREATE INDEX fp_cs_new.i_cs_index ON fp_cs_new.t_cs_index USING btree (id)
    - id: create_schema_elements_sequence_class
      meaning: 独立永久序列的起点101及步长10代表；不关联列DEFAULT
      values:
      - id: create_schema_elements_sequence
        render: ''
        representative: true
        validity: valid
        fixture_refs:
        - fixture_create_schema_inline_sequence
        fact_refs:
        - create_schema_fact_element_kinds
        - create_sequence::cs_fact_grammar
        - create_sequence::cs_fact_start
        - create_sequence::cs_fact_increment
        properties:
          items:
          - CREATE SEQUENCE fp_cs_new.s_cs_inline START WITH 101 INCREMENT BY 10
    default_value_id: create_schema_elements_absent
  charset:
    description: 字符集片段代表值
    classes:
    - id: create_schema_charset_absent_class
      meaning: absent
      values:
      - id: create_schema_charset_absent
        render: ''
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_charset_syntax
    - id: create_schema_charset_set_class
      meaning: set
      values:
      - id: create_schema_charset_set
        render: CHARACTER SET utf8mb4
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_example_charset
    - id: create_schema_charset_default_class
      meaning: default
      values:
      - id: create_schema_charset_default
        render: DEFAULT CHARACTER SET utf8mb4
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_charset_syntax
    - id: create_schema_charset_short_class
      meaning: short
      values:
      - id: create_schema_charset_short
        render: CHARSET utf8mb4
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_charset_syntax
    - id: create_schema_charset_equals_class
      meaning: equals
      values:
      - id: create_schema_charset_equals
        render: CHARSET = utf8mb4
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_charset_syntax
    default_value_id: create_schema_charset_absent
  collation:
    description: 字符序片段代表值
    classes:
    - id: create_schema_collation_absent_class
      meaning: absent
      values:
      - id: create_schema_collation_absent
        render: ''
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_charset_syntax
    - id: create_schema_collation_plain_class
      meaning: plain
      values:
      - id: create_schema_collation_plain
        render: COLLATE utf8mb4_bin
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_example_charset
    - id: create_schema_collation_equals_class
      meaning: equals
      values:
      - id: create_schema_collation_equals
        render: COLLATE = utf8mb4_bin
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_charset_syntax
    - id: create_schema_collation_default_class
      meaning: default
      values:
      - id: create_schema_collation_default
        render: DEFAULT COLLATE utf8mb4_bin
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_charset_syntax
    - id: create_schema_collation_default_equals_class
      meaning: default_equals
      values:
      - id: create_schema_collation_default_equals
        render: DEFAULT COLLATE = utf8mb4_bin
        representative: true
        validity: valid
        fact_refs:
        - create_schema_fact_charset_syntax
    default_value_id: create_schema_collation_absent
rules: []
structural_checks: []
facts:
- id: create_schema_fact_purpose
  type: lifecycle
  statement: 创建模式。
  status: confirmed
  source_anchor: L5-L5
- id: create_schema_fact_permission
  type: environment
  statement: 需要数据库 CREATE 权限。
  status: confirmed
  source_anchor: L8-L8
- id: create_schema_fact_same_named_owner
  type: lifecycle
  statement: 系统管理员在普通用户同名 Schema 创建对象时，对象所有者为同名用户。
  status: confirmed
  source_anchor: L9-L10
- id: create_schema_fact_qualification
  type: syntax
  statement: 命名对象可带模式前缀；省略时使用当前模式。
  status: confirmed
  source_anchor: L11-L12
- id: create_schema_fact_elements_order
  type: lifecycle
  statement: 内嵌子命令等效于先创建模式再执行子命令。
  status: confirmed
  source_anchor: L13-L15
- id: create_schema_fact_element_owner
  type: lifecycle
  statement: 带 AUTHORIZATION 时子对象由指定用户拥有。
  status: confirmed
  source_anchor: L13-L15
- id: create_schema_fact_named_syntax
  type: syntax
  statement: 命名创建支持可选授权、防篡改及子命令列表。
  status: confirmed
  source_anchor: L18-L20
- id: create_schema_fact_owner_syntax
  type: syntax
  statement: 可按 AUTHORIZATION 角色名称创建同名模式。
  status: confirmed
  source_anchor: L25-L26
- id: create_schema_fact_charset_syntax
  type: syntax
  statement: 第三种产生式设置字符集和字符序。
  status: confirmed
  source_anchor: L31-L34
- id: create_schema_fact_identifier
  type: syntax
  statement: 模式名称须符合标识符规范。
  status: confirmed
  source_anchor: L37-L40
- id: create_schema_fact_unique
  type: constraint
  statement: 新模式名不能与现有模式重名。
  status: confirmed
  source_anchor: L41-L41
- id: create_schema_fact_initial_name
  type: constraint
  statement: 新模式名不能与数据库初始用户重名。
  status: confirmed
  source_anchor: L42-L42
- id: create_schema_fact_reserved_names
  type: environment
  statement: 不应使用 pg_、gs_role_ 前缀及 data_redis 名称。
  status: confirmed
  source_anchor: L43-L43
- id: create_schema_fact_owner
  type: lifecycle
  statement: AUTHORIZATION 指定模式所有者，省略模式名时用角色名作为模式名。
  status: confirmed
  source_anchor: L44-L46
- id: create_schema_fact_existing_role
  type: environment
  statement: 授权目标必须是已有用户或角色。
  status: confirmed
  source_anchor: L47-L47
- id: create_schema_fact_blockchain
  type: syntax
  statement: WITH BLOCKCHAIN 声明防篡改属性。
  status: confirmed
  source_anchor: L48-L49
- id: create_schema_fact_ledger_gate
  type: environment
  statement: 创建防篡改模式需要 enable_ledger=on；默认 off，参数级别 SIGHUP。
  status: confirmed
  source_anchor: L53-L54
- id: create_schema_fact_ledger_tables
  type: lifecycle
  statement: 防篡改模式下普通行存用户表自动扩展为防篡改表。
  status: confirmed
  source_anchor: L55-L55
- id: create_schema_fact_elements
  type: syntax
  statement: schema_element 是新模式中的对象创建 SQL。
  status: confirmed
  source_anchor: L56-L57
- id: create_schema_fact_element_kinds
  type: syntax
  statement: 允许 TABLE、VIEW、INDEX、TABLE PARTITION、SEQUENCE、TRIGGER、GRANT 七类内嵌子命令。
  status: confirmed
  source_anchor: L58-L59
- id: create_schema_fact_element_gap
  type: environment
  statement: 已有TABLE、TABLE→VIEW、TABLE→INDEX及独立SEQUENCE有限列表；PARTITION/TRIGGER/GRANT、其他索引和序列属性、任意混合顺序及跨阶段生命周期依赖仍待补齐，不能当作未支持。
  status: confirmed
  source_anchor: L58-L59
- id: create_schema_fact_search_path
  type: environment
  statement: 搜索路径有同名对象时需显式模式限定，可 SHOW search_path 检查。
  status: confirmed
  source_anchor: L65-L66
- id: create_schema_fact_charset_domain
  type: syntax
  statement: default_charset 指定默认字符集，值域引用表1-379。
  status: confirmed
  source_anchor: L67-L69
- id: create_schema_fact_charset_gap
  type: environment
  statement: 当前只取本章示例 utf8mb4，不冒充表1-379完整字符集与兼容模式值域。
  status: confirmed
  source_anchor: L67-L69
- id: create_schema_fact_compatibility
  type: environment
  statement: 字符集语法仅 B 或 M 模式支持；本章描述 B，M 需独立章节。
  status: confirmed
  source_anchor: L73-L75
- id: create_schema_fact_charset_default
  type: behavior_oracle
  statement: 仅指定字符集时采用其默认字符序。
  status: confirmed
  source_anchor: L76-L76
- id: create_schema_fact_collation_default
  type: behavior_oracle
  statement: 仅指定字符序时采用其对应字符集；值域参见表1-379。
  status: confirmed
  source_anchor: L77-L80
- id: create_schema_fact_encoding_match
  type: environment
  statement: 新建模式的字符集须与数据库 server_encoding 一致（补充章节 1.4.3 L41）；本章 utf8mb4 示例的数据库编码为 UTF8，当前候选仅选择该环境，不将其推广为所有字符集的固定编码。
  status: confirmed
  source_anchor: L91-L94；补充 create_schema_source_1_4_3 L41
- id: create_schema_fact_example_database
  type: example
  statement: 示例创建并连接 B/UTF8 数据库。
  status: confirmed
  source_anchor: L91-L94
- id: create_schema_fact_example_role
  type: example
  statement: 示例准备 role1。
  status: confirmed
  source_anchor: L96-L97
- id: create_schema_fact_example_elements
  type: example
  statement: 按 role1 创建模式及 TABLE→VIEW 子对象。
  status: confirmed
  source_anchor: L99-L102
- id: create_schema_fact_example_charset
  type: example
  statement: 示例使用 utf8mb4 与 utf8mb4_bin。
  status: confirmed
  source_anchor: L104-L106
- id: create_schema_fact_example_authorization
  type: example
  statement: 显式 schema1 授权给 role2。
  status: confirmed
  source_anchor: L111-L113
- id: create_schema_fact_example_config
  type: example
  statement: 示例由管理员重新加载 enable_ledger。
  status: confirmed
  source_anchor: L115-L117
- id: create_schema_fact_example_show
  type: example
  statement: SHOW enable_ledger 结果为 on。
  status: confirmed
  source_anchor: L119-L124
- id: create_schema_fact_example_ledger
  type: example
  statement: 示例创建防篡改模式。
  status: confirmed
  source_anchor: L126-L128
- id: create_schema_fact_example_ledger_table
  type: example
  statement: 示例在防篡改模式创建普通表。
  status: confirmed
  source_anchor: L130-L132
- id: create_schema_fact_error_identity
  type: environment
  statement: 正文未给模式重名的 SQLSTATE/稳定消息，负向 Oracle 待校准。
  status: confirmed
  source_anchor: L41-L41
