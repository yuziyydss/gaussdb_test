schema_version: 1
kind: "syntax"
id: "syntax_create_schema"
name: "CREATE SCHEMA 语法"
factor_ref: "create_schema"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "create_schema.form"
  schema_name:
    type: "token"
    optional: true
    dimension_ref: "create_schema.schema_name"
  authorization:
    type: "token"
    optional: true
    dimension_ref: "create_schema.authorization"
  blockchain:
    type: "token"
    optional: true
    dimension_ref: "create_schema.blockchain"
  elements:
    type: "token"
    optional: true
    dimension_ref: "create_schema.elements"
  charset:
    type: "token"
    optional: true
    dimension_ref: "create_schema.charset"
  collation:
    type: "token"
    optional: true
    dimension_ref: "create_schema.collation"
source_fact_refs:
  - create_schema_fact_charset_domain
  - "create_schema_fact_named_syntax"
  - "create_schema_fact_owner_syntax"
  - "create_schema_fact_charset_syntax"
  - "create_schema_fact_qualification"
  - "create_schema_fact_identifier"
  - "create_schema_fact_elements"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "CREATE SCHEMA "
    -
      kind: "choice"
      selector: "form"
      branches:
        create_schema_form_named:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "schema_name"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "authorization"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "blockchain"
            -
              kind: "literal"
              text: " "
            -
              kind: "optional"
              selector: "elements"
              enabled_values:
                - "create_schema_elements_table"
                - "create_schema_elements_table_view"
              item:
                kind: "repeat"
                slot: "elements"
                separator: " "
                items_property: "items"
        create_schema_form_owner:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "authorization"
            -
              kind: "literal"
              text: " "
            -
              kind: "optional"
              selector: "elements"
              enabled_values:
                - "create_schema_elements_table"
                - "create_schema_elements_table_view"
              item:
                kind: "repeat"
                slot: "elements"
                separator: " "
                items_property: "items"
        create_schema_form_charset:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "schema_name"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "charset"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "collation"
