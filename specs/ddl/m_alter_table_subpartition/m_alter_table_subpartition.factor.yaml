facts:
- id: m_alter_table_subpartition_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.14 L2-2
- id: m_alter_table_subpartition_fact_syntax
  type: syntax
  statement: 二级维护主语法后跟单个或多个动作，本批只生成单个TRUNCATE或RENAME。
  status: confirmed
  source_anchor: 2.4.2.6.14 L38-39
- id: m_alter_table_subpartition_fact_authority
  type: environment
  statement: 只有表所有者或ALTER授权者、管理员可修改。
  status: confirmed
  source_anchor: 2.4.2.6.14 L21-22
- id: m_alter_table_subpartition_fact_hash_limits
  type: constraint
  statement: HASH/KEY子分区禁止直接增删切合；有限模型不声称支持这些动作。
  status: confirmed
  source_anchor: 2.4.2.6.14 L17-20
- id: m_alter_table_subpartition_fact_truncate
  type: syntax
  statement: TRUNCATE SUBPARTITION指定子名或FOR两级键，父分区TRUNCATE可用名称/ALL。
  status: confirmed
  source_anchor: 2.4.2.6.14 L90-91
- id: m_alter_table_subpartition_fact_rename
  type: syntax
  statement: RENAME SUBPARTITION支持名称或FOR到新名，重命名语法允许IF EXISTS。
  status: confirmed
  source_anchor: 2.4.2.6.14 L99-100
- id: m_alter_table_subpartition_fact_for_keys
  type: constraint
  statement: SUBPARTITION FOR需要同时提供一级和二级键值，数量顺序一一对应。
  status: confirmed
  source_anchor: 2.4.2.6.14 L125-129
- id: m_alter_table_subpartition_fact_index
  type: lifecycle
  statement: 清空/交换可能使GLOBAL索引失效；s4或enable_gpi_auto_update改变行为。
  status: confirmed
  source_anchor: 2.4.2.6.14 L23-29
- id: m_alter_table_subpartition_fact_exchange
  type: constraint
  statement: 交换要求普通表与子分区完整列/约束/索引/存储一致，包含物理已删除列。
  status: confirmed
  source_anchor: 2.4.2.6.14 L57-69
- id: m_alter_table_subpartition_fact_purpose
  type: example
  statement: 修改二级分区表分区，包括增删分区、清空分区、切割/合并分区、移动分区表空间、 交换分区、重命名分区、开启/关闭分区自动扩展功能，以及修改分区属性等。
  status: confirmed
  source_anchor: M-Compatibility L4-6
- id: m_alter_table_subpartition_fact_constraint
  type: example
  statement: 添加分区的表空间不能是pg_global。 添加分区的名称不能与该分区表已有一级分区和二级分区的名称相同。
  status: confirmed
  source_anchor: M-Compatibility L8-12
- id: m_alter_table_subpartition_fact_params
  type: example
  statement: ●   table_name 分区表名。 取值范围：已存在的分区表名。
  status: confirmed
  source_anchor: M-Compatibility L103-114
- id: m_alter_table_subpartition_fact_example
  type: example
  statement: m_alter_table_subpartition的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L166-167
