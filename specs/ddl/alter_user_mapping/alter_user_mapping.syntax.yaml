schema_version: 1
kind: "syntax"
id: "syntax_alter_user_mapping"
name: "ALTER USER MAPPING 语法"
factor_ref: "alter_user_mapping"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  mapped_user:
    type: "token"
    optional: true
    dimension_ref: "alter_user_mapping.mapped_user"
  options:
    type: "token"
    optional: true
    dimension_ref: "alter_user_mapping.options"
source_fact_refs:
  - "alter_user_mapping_fact_syntax"
  - "alter_user_mapping_fact_default_add"
  - "alter_user_mapping_fact_user"
  - "alter_user_mapping_fact_server"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "ALTER USER MAPPING FOR "
    -
      kind: "slot"
      slot: "mapped_user"
    -
      kind: "literal"
      text: " SERVER srv_map_b7 OPTIONS ("
    -
      kind: "repeat"
      slot: "options"
      separator: ", "
      items_property: "items"
    -
      kind: "literal"
      text: ")"
