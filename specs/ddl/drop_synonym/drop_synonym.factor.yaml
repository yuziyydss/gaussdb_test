    statement: "不指定行为时默认为 RESTRICT。"
    status: "confirmed"
    source_anchor: "L24-L27"
  -
    id: "drop_synonym_fact_cascade"
    type: "lifecycle"
    statement: "CASCADE 删除依赖同义词的对象，例如视图。"
    status: "confirmed"
    source_anchor: "L24-L27"
  -
    id: "drop_synonym_fact_restrict"
    type: "constraint"
