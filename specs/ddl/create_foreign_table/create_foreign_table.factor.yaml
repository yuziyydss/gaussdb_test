dimensions:
  table_name:
    description: 文档log_fdw示例的有限目录对象，不是file_fdw数据源
    profile_source: {matrix_ref: matrix_create_foreign_table_log_catalog, profile_id_path: profiles.id}
    default_value_id: create_foreign_table_log_catalog_target
  column_definitions:
    description: 文档示例的单TEXT列
    default_value_id: create_foreign_table_log_catalog_column
    classes:
    - id: create_foreign_table_log_catalog_column_class
      meaning: 固定单列示例；递归列列表另行建模
      values:
      - {id: create_foreign_table_log_catalog_column, render: "col1 TEXT", representative: true, validity: valid, fact_refs: [create_foreign_table_fact_log_fdw_example]}
  server_name:
    description: 真实前置创建的log_fdw服务器
    default_value_id: create_foreign_table_log_catalog_server
    classes:
    - id: create_foreign_table_log_catalog_server_class
      meaning: 无地址或凭据的语法兼容服务器
      values:
      - {id: create_foreign_table_log_catalog_server, render: g_a3_log_server, representative: true, validity: valid, fact_refs: [create_foreign_table_fact_log_fdw_example]}
  table_options:
    description: log_fdw示例选项，不混入file_fdw文件参数
    default_value_id: create_foreign_table_log_catalog_options
    classes:
    - id: create_foreign_table_log_catalog_options_class
      meaning: 文档gs_log示例选项
      values:
      - {id: create_foreign_table_log_catalog_options, render: "logtype 'gs_log'", representative: true, validity: valid, fact_refs: [create_foreign_table_fact_log_fdw_example]}
  if_not_exists:
    description: "存在选项"
    classes:
      - id: create_foreign_table_log_fresh_class
        meaning: 独占新schema中的log_fdw示例，不推广原conditional选项
        values:
        - {id: create_foreign_table_if_not_exists_log_fresh, render: "", representative: true, validity: valid, properties: {original_value_ref: create_foreign_table_if_not_exists_none}, fact_refs: [create_foreign_table_fact_log_fdw_example]}
      - id: create_foreign_table_if_not_exists_yes_log_fresh_class
        meaning: 独占新schema中的log_fdw目录示例显式IF NOT EXISTS，不推广原conditional选项
        values:
        - {id: create_foreign_table_if_not_exists_yes_log_fresh, render: "IF NOT EXISTS", representative: true, validity: valid, properties: {original_value_ref: create_foreign_table_if_not_exists_yes}, fact_refs: [create_foreign_table_fact_syntax, create_foreign_table_fact_log_fdw_example]}
      -
        id: "create_foreign_table_if_not_exists_none_class"
        meaning: "none"
        values:
          -
            id: "create_foreign_table_if_not_exists_none"
            render: ""
            representative: true
            validity: "conditional"
            fact_refs:
              - "create_foreign_table_fact_syntax"
      -
        id: "create_foreign_table_if_not_exists_yes_class"
        meaning: "yes"
        values:
          -
            id: "create_foreign_table_if_not_exists_yes"
            render: "IF NOT EXISTS"
            representative: true
            validity: "conditional"
            fact_refs:
              - "create_foreign_table_fact_syntax"
    default_value_id: "create_foreign_table_if_not_exists_none"
  format:
    description: "文件格式"
    classes:
      - id: create_foreign_table_format_not_applicable_class
        meaning: log_fdw目录示例不使用文件格式，不代表覆盖任何file_fdw格式
        values:
        - {id: create_foreign_table_format_not_applicable, render: "", representative: true, validity: valid, fact_refs: [create_foreign_table_fact_log_fdw_example]}
      -
        id: "create_foreign_table_format_text_class"
        meaning: "text"
        values:
          -
            id: "create_foreign_table_format_text"
            render: "text"
            representative: true
            validity: "conditional"
            fact_refs:
              - "create_foreign_table_fact_format"
      -
        id: "create_foreign_table_format_csv_class"
        meaning: "csv"
        values:
          -
            id: "create_foreign_table_format_csv"
            render: "csv"
            representative: true
            validity: "conditional"
            fact_refs:
              - "create_foreign_table_fact_format"
      -
        id: "create_foreign_table_format_binary_class"
        meaning: "binary"
        values:
          -
            id: "create_foreign_table_format_binary"
            render: "binary"
            representative: true
            validity: "conditional"
            fact_refs:
              - "create_foreign_table_fact_format"
      -
        id: "create_foreign_table_format_fixed_class"
        meaning: "fixed"
        values:
          -
            id: "create_foreign_table_format_fixed"
            render: "fixed"
            representative: true
            validity: "conditional"
            fact_refs:
              - "create_foreign_table_fact_format"
    default_value_id: "create_foreign_table_format_text"
rules: []
structural_checks: []
facts:
  -
    id: "create_foreign_table_fact_purpose"
    type: "lifecycle"
    statement: "创建外表。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_foreign_table_fact_no_system_columns"
    type: "constraint"
    statement: "外表暂不支持tableoid、ctid等系统列。"
    status: "confirmed"
    source_anchor: "L9-L10"
  -
    id: "create_foreign_table_fact_sensitive_quotes"
    type: "environment"
    statement: "OPTIONS敏感键多层引号改变语义，可能不被识别脱敏，不能把密码/secret_access_key写入快照。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "create_foreign_table_fact_pdb_admin"
    type: "environment"
    statement: "多租PDB内部仅初始用户可创建外表。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "create_foreign_table_fact_if_not_exists"
    type: "behavior_oracle"
    statement: "同名关系存在时IF NOT EXISTS不报错而提示，不保证已有对象结构匹配。"
    status: "confirmed"
    source_anchor: "L35-L37"
  -
    id: "create_foreign_table_fact_table_name"
    type: "constraint"
    statement: "外表名符合标识符规范。"
    status: "confirmed"
    source_anchor: "L38-L40"
  -
    id: "create_foreign_table_fact_column_name"
    type: "constraint"
    statement: "字段名符合标识符规范。"
    status: "confirmed"
    source_anchor: "L41-L43"
  -
    id: "create_foreign_table_fact_type"
    type: "syntax"
    statement: "type_name指定字段类型。"
    status: "confirmed"
    source_anchor: "L44-L45"
  -
    id: "create_foreign_table_fact_collatable"
    type: "constraint"
    statement: "COLLATE只适用可排序类型，省略使用默认排序规则。"
    status: "confirmed"
    source_anchor: "L46-L48"
  -
    id: "create_foreign_table_fact_collation_catalog"
    type: "metadata_oracle"
    statement: "可查询pg_collation取得排序规则。"
    status: "confirmed"
    source_anchor: "L49-L49"
  -
    id: "create_foreign_table_fact_server"
    type: "constraint"
    statement: "SERVER引用外表服务器对象。"
    status: "confirmed"
    source_anchor: "L50-L51"
  -
    id: "create_foreign_table_fact_options"
    type: "syntax"
    statement: "OPTIONS定义外表参数，正文按file_fdw介绍。"
    status: "confirmed"
    source_anchor: "L52-L53"
  -
    id: "create_foreign_table_fact_validator"
    type: "environment"
    statement: "允许选项由FDW定义并由validator校验，完整file_fdw合同在开发指南。"
    status: "confirmed"
    source_anchor: "L56-L58"
  -
    id: "create_foreign_table_fact_unique_options"
    type: "constraint"
    statement: "同一选项域不得重名；表与列选项可同名。"
    status: "confirmed"
    source_anchor: "L59-L59"
  -
    id: "create_foreign_table_fact_filename"
    type: "environment"
    statement: "file_fdw filename必选且必须绝对路径，要求服务端受控文件。"
    status: "confirmed"
    source_anchor: "L60-L62"
  -
    id: "create_foreign_table_fact_format"
    type: "syntax"
    statement: "file_fdw格式TEXT/CSV/BINARY/FIXED，与COPY FORMAT相同。"
    status: "confirmed"
    source_anchor: "L63-L65"
  -
    id: "create_foreign_table_fact_header"
    type: "syntax"
    statement: "HEADER与COPY标题行定义相同。"
    status: "confirmed"
    source_anchor: "L66-L68"
  -
    id: "create_foreign_table_fact_delimiter"
    type: "syntax"
    statement: "delimiter与COPY DELIMITER相同。"
    status: "confirmed"
    source_anchor: "L69-L71"
  -
    id: "create_foreign_table_fact_quote"
    type: "syntax"
    statement: "quote与COPY QUOTE相同。"
    status: "confirmed"
    source_anchor: "L72-L74"
  -
    id: "create_foreign_table_fact_escape"
    type: "syntax"
    statement: "escape与COPY ESCAPE相同。"
    status: "confirmed"
    source_anchor: "L75-L77"
  -
    id: "create_foreign_table_fact_null"
    type: "syntax"
    statement: "null标记与COPY NULL相同。"
    status: "confirmed"
    source_anchor: "L78-L80"
  -
    id: "create_foreign_table_fact_encoding"
    type: "syntax"
    statement: "encoding与COPY ENCODING相同。"
    status: "confirmed"
    source_anchor: "L81-L83"
  -
    id: "create_foreign_table_fact_force_not_null"
    type: "behavior_oracle"
    statement: "列force_not_null为真时不匹配文件级空串NULL，语义同COPY FORCE_NOT_NULL。"
    status: "confirmed"
    source_anchor: "L84-L87"
  -
    id: "create_foreign_table_fact_not_null"
    type: "constraint"
    statement: "NOT NULL禁止空值。"
    status: "confirmed"
    source_anchor: "L89-L90"
  -
    id: "create_foreign_table_fact_nullable"
    type: "constraint"
    statement: "NULL允许空值。"
    status: "confirmed"
    source_anchor: "L91-L92"
  -
    id: "create_foreign_table_fact_default_expression"
    type: "constraint"
    statement: "默认表达式不能有变量/子查询/本表列交叉引用，类型必须匹配列类型。"
    status: "confirmed"
    source_anchor: "L93-L96"
  -
    id: "create_foreign_table_fact_default_omitted"
    type: "behavior_oracle"
    statement: "未声明列值插入时用DEFAULT，未指定默认则NULL。"
    status: "confirmed"
    source_anchor: "L97-L98"
  -
    id: "create_foreign_table_fact_private_shared_privilege"
    type: "environment"
    statement: "Private/Shared外表需要初始用户或operation_mode下运维管理员。"
    status: "confirmed"
    source_anchor: "L9-L10"
  -
    id: "create_foreign_table_fact_syntax"
    type: "syntax"
    statement: "原文选项/产生式：CREATE FOREIGN TABLE [ IF NOT EXISTS ] table_name ( [ column_name type_name [ OPTIONS ( { option 'value' } [, ... ] ) ] [ COLLATE collation ] [ column_constraint [ ... ] ] [, ... ] ]) SERVER server_name [ OPTIONS ( { option 'value' } [, ... ] ) ];"
    status: "confirmed"
    source_anchor: "L17-L23"
  -
    id: "create_foreign_table_fact_column_constraints"
    type: "syntax"
    statement: "原文选项/产生式：其中列约束column_constraint为： [ CONSTRAINT constraint_name ] { NOT NULL | NULL | DEFAULT default_expr }"
    status: "confirmed"
    source_anchor: "L25-L29"
  -
    id: "create_foreign_table_fact_log_fdw_example"
    type: "example"
    statement: "示例是log_fdw服务器加logtype='gs_log'，不能与file_fdw filename选项混用。"
    status: "confirmed"
    source_anchor: "L101-L111"
  -
    id: "create_foreign_table_fact_fdw_runtime"
    type: "open_question"
    statement: "尚缺授权的服务端绝对路径、文件字节/编码seed、FDW validator和回收合同；不生成假路径或用log_fdw冒充file_fdw。"
    status: "needs_verification"
    source_anchor: "L60-L62"
  -
    id: "create_foreign_table_fact_recursive_columns"
    type: "open_question"
    statement: "列OPTIONS/COLLATE/约束重复结构需列类型与COPY文件布局合同；单TEXT列log_fdw目录示例不覆盖这些结构。"
    status: "needs_verification"
    source_anchor: "L17-L23"
  -
    id: "create_foreign_table_fact_fixed_formatter"
    type: "open_question"
    statement: "COPY FIXED要求FORMATTER且全列，外表本章未列FORMATTER选项；不能仅按格式枚举宣称FIXED可执行。"
    status: "needs_verification"
    source_anchor: "L63-L65"
