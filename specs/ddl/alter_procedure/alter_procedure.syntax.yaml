schema_version: 1
kind: "syntax"
id: "syntax_alter_procedure"
name: "ALTER PROCEDURE 语法"
factor_ref: "alter_procedure"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  signature:
    type: "token"
    optional: true
    dimension_ref: "alter_procedure.signature"
  action:
    type: "token"
    optional: true
    dimension_ref: "alter_procedure.action"
  restrict:
    type: "token"
    optional: true
    dimension_ref: "alter_procedure.restrict"
  form:
    type: "token"
    optional: true
    dimension_ref: "alter_procedure.form"
source_fact_refs:
  - "alter_procedure_fact_attributes"
  - "alter_procedure_fact_action_a"
  - "alter_procedure_fact_action_b"
  - "alter_procedure_fact_action_c"
  - "alter_procedure_fact_rename"
  - "alter_procedure_fact_owner"
  - "alter_procedure_fact_schema"
  - "alter_procedure_fact_compile"
  - "alter_procedure_fact_name"
  - "alter_procedure_fact_argmode"
  - "alter_procedure_fact_argname"
  - "alter_procedure_fact_argtype"
  - "alter_procedure_fact_external"
  - "alter_procedure_fact_set_value"
  - "alter_procedure_fact_off"
  - "alter_procedure_fact_default_syntax"
  - "alter_procedure_fact_new_name"
  - "alter_procedure_fact_new_schema"
ast:
  kind: "choice"
  selector: "form"
  branches:
    alter_procedure_form_attributes:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER PROCEDURE fp_proc_ready"
        -
          kind: "slot"
          slot: "signature"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "action"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "restrict"
    alter_procedure_form_compile:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER PROCEDURE fp_proc_ready"
        -
          kind: "slot"
          slot: "signature"
        -
          kind: "literal"
          text: " COMPILE"
    alter_procedure_form_rename:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER PROCEDURE fp_proc_ready"
        -
          kind: "slot"
          slot: "signature"
        -
          kind: "literal"
          text: " RENAME TO fp_proc_renamed"
