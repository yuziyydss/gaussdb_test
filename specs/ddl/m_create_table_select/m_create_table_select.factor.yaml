facts:
- id: m_create_table_select_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.19 L2-2
- id: m_create_table_select_fact_syntax
  type: "syntax"
  statement: CREATE TABLE SELECT 含自定义列、表选项、WITH 和可选 AS 后的查询。
  status: confirmed
  source_anchor: 2.4.2.8.19 L39-49
- id: m_create_table_select_fact_order
  type: "behavior_oracle"
  statement: 自定义独有列排在前面，其他列依 SELECT 输出顺序。
  status: confirmed
  source_anchor: 2.4.2.8.19 L8-8
- id: m_create_table_select_fact_same_name
  type: "behavior_oracle"
  statement: 同名列不区分大小写；采用自定义类型并保留 SELECT 列名大小写。
  status: confirmed
  source_anchor: 2.4.2.8.19 L9-10
- id: m_create_table_select_fact_inherit
  type: "behavior_oracle"
  statement: 未自定义的直接表列继承原 NULL/NOT NULL、DEFAULT、ON UPDATE、CHARSET、COLLATE。
  status: confirmed
  source_anchor: 2.4.2.8.19 L15-17
- id: m_create_table_select_fact_nullability
  type: constraint
  statement: NOT NULL禁止NULL；允许NULL是普通字段的缺省可空性。
  status: confirmed
  source_anchor: 2.4.2.8.19 L284-286
- id: m_create_table_select_fact_default_on_omission
  type: constraint
  statement: 缺省表达式用于未明确指定值的字段；不能用默认值替换显式NULL。
  status: confirmed
  source_anchor: 2.4.2.8.19 L296-297
- id: m_create_table_select_fact_precision
  type: environment
  statement: 表达式、常量和 UNION 等非直接列需要 enable_precision_decimal；本轮只直接整数列。
  status: confirmed
  source_anchor: 2.4.2.8.19 L30-33
- id: m_create_table_select_fact_row_only
  type: "constraint"
  statement: 不支持 WITH (ORIENTATION=column)。
  status: confirmed
  source_anchor: 2.4.2.8.19 L70-70
- id: m_create_table_select_fact_prepare
  type: "constraint"
  statement: 不支持 PREPARE 中嵌套 CREATE TABLE AS。
  status: confirmed
  source_anchor: 2.4.2.8.19 L71-71
- id: m_create_table_select_fact_cte
  type: "syntax"
  statement: 查询首部含 CTE 时，需要括号包住 query。
  status: confirmed
  source_anchor: 2.4.2.8.19 L461-461
- id: m_create_table_select_fact_comment
  type: "syntax"
  statement: 表选项 COMMENT 可带等号。
  status: confirmed
  source_anchor: 2.4.2.8.19 L41-41
- id: m_create_table_select_fact_index_conflict
  type: open_question
  statement: 本章称不支持 USTORE 建 BTREE，M CREATE INDEX 称自动转 UBTREE；未确定适用边界，暂不生成内联索引。
  status: needs_verification
  source_anchor: 2.4.2.8.19 L157-157
- id: m_create_table_select_fact_optional_columns
  type: open_question
  statement: 语法格式自定义列外围花括号未明确可选，但本章无自定义列示例与功能描述支持省略；保留文本记法差异。
  status: needs_verification
  source_anchor: 2.4.2.8.19 L40-40
- id: m_cts_comment_priority
  type: example
  statement: SELECT列和自定义列同字段时始终保留SELECT列的COMMENT。直接表列保留旧COMMENT否则NULL。
  status: confirmed
  source_anchor: 2.4.2.8.19 L12-14
- id: m_cts_for_update
  type: example
  statement: CREATE TABLE SELECT支持FOR UPDATE选项，锁机制与INSERT SELECT FOR UPDATE一致。
  status: confirmed
  source_anchor: 2.4.2.8.19 L20-21
- id: m_cts_no_partition
  type: example
  statement: 不支持创建分区表。不支持REPLACE/IGNORE。
  status: confirmed
  source_anchor: 2.4.2.8.19 L24-29
- id: m_cts_non_direct_null
  type: example
  statement: SELECT列非直接表列（表达式/函数/常量）时默认允许NULL且无默认值。
  status: confirmed
  source_anchor: 2.4.2.8.19 L24-29
- id: m_cts_precision_guc
  type: environment
  statement: 需开启m_format_behavior_compat_options的enable_precision_decimal，否则涉及精度类型报错。UNION场景需结果类型推导也报错。
  status: confirmed
  source_anchor: 2.4.2.8.19 L24-29
- id: m_cts_temp_schema
  type: example
  statement: 本地临时表通过每个会话独立pg_temp开头schema保证会话隔离。
  status: confirmed
  source_anchor: 2.4.2.8.19 L110-116
- id: m_cts_foreign_key_index
  type: example
  statement: 外键constraint_name和index_name同时指定时索引名为constraint_name。唯一键同。
  status: confirmed
  source_anchor: 2.4.2.8.19 L145-148
- id: m_cts_charset
  type: example
  statement: 仅字符类型支持指定字符集。BINARY字符集实际转为二进制类型。表未显式指定时继承模式默认字符集。
  status: confirmed
  source_anchor: 2.4.2.8.19 L176-187, L406-417
- id: m_cts_comment_limit
  type: example
  statement: 表级注释最大2048字符，列级和索引级最大1024字符。同一地方多次设置COMMENT仅最后一个生效。
  status: confirmed
  source_anchor: 2.4.2.8.19 L64-69, L193-195
- id: m_cts_storage_tde
  type: environment
  statement: WITH支持透明加密参数：enable_tde、encrypt_algo、dek_cipher、key_type等。
  status: confirmed
  source_anchor: 2.4.2.8.19 L203-210
- id: m_cts_orientation
  type: example
  statement: orientation支持ROW（行式）、USTORE（Inplace-Update）、ASTORE（Append-Only）。
  status: confirmed
  source_anchor: 2.4.2.8.19 L221-244
- id: m_cts_generated_column
  type: example
  statement: STORED/VIRTUAL关键字可省略，缺省STORED。s2下存储生成列基列不能与ON UPDATE或AUTO_INCREMENT共存。
  status: confirmed
  source_anchor: 2.4.2.8.19 L344-367
- id: m_cts_auto_increment
  type: example
  statement: 自动增长列仅整数、4/8字节浮点、布尔类型。自增计数器自增和刷新不回滚。
  status: confirmed
  source_anchor: 2.4.2.8.19 L378-401
- id: m_cts_null_comparison
  type: example
  statement: 表达式中<>NULL或!=NULL写法不生效，需改为IS NOT NULL。
  status: confirmed
  source_anchor: 2.4.2.8.19 L293-295
- id: m_cts_foreign_key_checks
  type: environment
  statement: 外键完整性检查由GUC参数foreign_key_checks控制。REFERENCES需s1以上版本。
  status: confirmed
  source_anchor: 2.4.2.8.19 L437-460
