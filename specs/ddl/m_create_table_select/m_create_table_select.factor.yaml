facts:
- id: m_create_table_select_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.19 L2-2
- id: m_create_table_select_fact_syntax
  type: syntax
  statement: CREATE TABLE SELECT 含自定义列、表选项、WITH 和可选 AS 后的查询。
  status: confirmed
  source_anchor: 2.4.2.8.19 L39-49
- id: m_create_table_select_fact_order
  type: behavior_oracle
  statement: 自定义独有列排在前面，其他列依 SELECT 输出顺序。
  status: confirmed
  source_anchor: 2.4.2.8.19 L8-8
- id: m_create_table_select_fact_same_name
  type: behavior_oracle
  statement: 同名列不区分大小写；采用自定义类型并保留 SELECT 列名大小写。
  status: confirmed
  source_anchor: 2.4.2.8.19 L9-10
- id: m_create_table_select_fact_inherit
  type: behavior_oracle
  statement: 未自定义的直接表列继承原 NULL/NOT NULL、DEFAULT、ON UPDATE、CHARSET、COLLATE。
  status: confirmed
  source_anchor: 2.4.2.8.19 L15-17
- id: m_create_table_select_fact_nullability
  type: constraint
  statement: NOT NULL禁止NULL；允许NULL是普通字段的缺省可空性。
  status: confirmed
  source_anchor: 2.4.2.8.19 L284-286
- id: m_create_table_select_fact_default_on_omission
  type: constraint
  statement: 缺省表达式用于未明确指定值的字段；不能用默认值替换显式NULL。
  status: confirmed
  source_anchor: 2.4.2.8.19 L296-297
- id: m_create_table_select_fact_precision
  type: environment
  statement: 表达式、常量和 UNION 等非直接列需要 enable_precision_decimal；本轮只直接整数列。
  status: confirmed
  source_anchor: 2.4.2.8.19 L30-33
- id: m_create_table_select_fact_row_only
  type: constraint
  statement: 不支持 WITH (ORIENTATION=column)。
  status: confirmed
  source_anchor: 2.4.2.8.19 L70-70
- id: m_create_table_select_fact_prepare
  type: constraint
  statement: 不支持 PREPARE 中嵌套 CREATE TABLE AS。
  status: confirmed
  source_anchor: 2.4.2.8.19 L71-71
- id: m_create_table_select_fact_cte
  type: syntax
  statement: 查询首部含 CTE 时，需要括号包住 query。
  status: confirmed
  source_anchor: 2.4.2.8.19 L461-461
- id: m_create_table_select_fact_comment
  type: syntax
  statement: 表选项 COMMENT 可带等号。
  status: confirmed
  source_anchor: 2.4.2.8.19 L41-41
- id: m_create_table_select_fact_index_conflict
  type: open_question
  statement: 本章称不支持 USTORE 建 BTREE，M CREATE INDEX 称自动转 UBTREE；未确定适用边界，暂不生成内联索引。
  status: needs_verification
  source_anchor: 2.4.2.8.19 L157-157
- id: m_create_table_select_fact_optional_columns
  type: open_question
  statement: 语法格式自定义列外围花括号未明确可选，但本章无自定义列示例与功能描述支持省略；保留文本记法差异。
  status: needs_verification
  source_anchor: 2.4.2.8.19 L40-40
