schema_version: 1
kind: "scenario"
id: "scenario_drop_sequence_permissions"
name: "DROP SEQUENCE permissions"
status: "planned"
description: "按文档权限分支与三权分立状态验证。"
factor_ref: "drop_sequence"
fixture_refs: []
fact_refs:
  - "drop_sequence_fact_authorization"
  - "drop_sequence_fact_sysadmin"
preconditions:
  - "隔离角色、独占环境；不修改共享权限"
steps:
  -
    id: "roles"
    action: "permission_matrix"
    roles:
      - "sequence_owner"
      - "schema_owner"
      - "drop_grantee"
      - "drop_any_sequence_grantee"
      - "sysadmin"
      - "unprivileged"
oracles:
  -
    after_step: "roles"
    kind: "authorization_matrix"
    expected: "按权限条件允许或拒绝"
execution_requirements:
  - "database"
  - "same_session"
