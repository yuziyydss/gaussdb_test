schema_version: 1
kind: "scenario"
id: "scenario_drop_sequence_large_requirement"
name: "DROP SEQUENCE large_requirement"
status: "planned"
description: "LARGE 序列缺失 LARGE 修饰符时应拒绝，正常 LARGE 删除应成功；普通序列配 LARGE 的行为不由本段推断。"
factor_ref: "drop_sequence"
fixture_refs:
  - "fixture_drop_sequence_sequences"
fact_refs:
  - "drop_sequence_fact_large_required"
  - "drop_sequence_fact_error_identity"
preconditions:
  - "目标错误后使用可继续的会话；只测试专用序列"
steps:
  -
    id: "wrong"
    action: "execute_sql"
    sql: "DROP SEQUENCE seq_ds_large_one;"
  -
    id: "right"
    action: "execute_sql"
    sql: "DROP LARGE SEQUENCE seq_ds_large_one;"
oracles:
  -
    after_step: "wrong"
    kind: "target_error"
    oracle_status: "needs_verification"
  -
    after_step: "right"
    kind: "sequence_absent"
    expected: "seq_ds_large_one"
execution_requirements:
  - "database"
  - "same_session"
