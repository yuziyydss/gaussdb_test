schema_version: 1
kind: "scenario"
id: "scenario_drop_sequence_delete_notice"
name: "DROP SEQUENCE delete_notice"
status: "planned"
description: "删除存在序列，再 IF EXISTS 删除相同名称应只有 NOTICE。"
factor_ref: "drop_sequence"
fixture_refs:
  - "fixture_drop_sequence_sequences"
fact_refs:
  - "drop_sequence_fact_purpose"
  - "drop_sequence_fact_existing"
  - "drop_sequence_fact_notice"
  - "drop_sequence_fact_example_create"
  - "drop_sequence_fact_example_drop"
preconditions: []
steps:
  -
    id: "drop"
    action: "execute_sql"
    sql: "DROP SEQUENCE seq_ds_one;"
  -
    id: "notice"
    action: "execute_sql"
    sql: "DROP SEQUENCE IF EXISTS seq_ds_one;"
oracles:
  -
    after_step: "drop"
    kind: "sequence_absent"
    expected: "seq_ds_one"
  -
    after_step: "notice"
    kind: "notice"
    expected: "对象不存在但语句成功"
execution_requirements:
  - "database"
  - "same_session"
