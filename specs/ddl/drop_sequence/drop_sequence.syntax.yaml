schema_version: 1
kind: "syntax"
id: "syntax_drop_sequence"
name: "DROP SEQUENCE 语法"
factor_ref: "drop_sequence"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  large:
    type: "token"
    optional: true
    dimension_ref: "drop_sequence.large"
  if_exists:
    type: "token"
    optional: true
    dimension_ref: "drop_sequence.if_exists"
  targets:
    type: "token"
    optional: true
    dimension_ref: "drop_sequence.targets"
  behavior:
    type: "token"
    optional: true
    dimension_ref: "drop_sequence.behavior"
source_fact_refs:
  - "drop_sequence_fact_syntax"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "DROP "
    -
      kind: "slot"
      slot: "large"
    -
      kind: "literal"
      text: "SEQUENCE "
    -
      kind: "slot"
      slot: "if_exists"
    -
      kind: "literal"
      text: " "
    -
      kind: "repeat"
      slot: "targets"
      items_property: "items"
      separator: ", "
    -
      kind: "literal"
      text: " "
    -
      kind: "slot"
      slot: "behavior"
