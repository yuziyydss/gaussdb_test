facts:
  - id: drop_sequence_fact_large_error
    type: behavior_oracle
    statement: 由目标合法性条件导出的负向预期；具体错误类别及 SQLSTATE 需在目标版本校准。
    status: confirmed
    source_anchor: L19-L21
  -
    id: "drop_sequence_fact_purpose"
    type: "lifecycle"
    statement: "从当前数据库删除序列。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "drop_sequence_fact_authorization"
    type: "environment"
    statement: "序列/模式所有者、获序列 DROP 或 DROP ANY SEQUENCE 权限者可删除。"
    status: "confirmed"
    source_anchor: "L8-L10"
  -
    id: "drop_sequence_fact_sysadmin"
    type: "environment"
    statement: "三权分立关闭时系统管理员默认有该权限。"
    status: "confirmed"
    source_anchor: "L8-L10"
  -
    id: "drop_sequence_fact_syntax"
    type: "syntax"
    statement: "支持 LARGE、IF EXISTS、模式限定序列名、重复名称和 CASCADE/RESTRICT。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "drop_sequence_fact_large_required"
    type: "constraint"
    statement: "创建时使用 LARGE 的序列，删除时也必须使用 LARGE。"
    status: "confirmed"
    source_anchor: "L19-L21"
  -
    id: "drop_sequence_fact_if_exists"
    type: "syntax"
    statement: "IF EXISTS 检查序列存在性。"
    status: "confirmed"
    source_anchor: "L22-L23"
  -
    id: "drop_sequence_fact_existing"
    type: "behavior_oracle"
    statement: "存在序列在 IF EXISTS 删除时成功删除。"
    status: "confirmed"
    source_anchor: "L24-L24"
  -
    id: "drop_sequence_fact_notice"
    type: "behavior_oracle"
    statement: "缺失序列用 IF EXISTS 删除时只 NOTICE，不执行删除。"
    status: "confirmed"
    source_anchor: "L25-L26"
  -
    id: "drop_sequence_fact_name"
    type: "syntax"
    statement: "sequence_name 指序列名称。"
    status: "confirmed"
    source_anchor: "L27-L28"
  -
    id: "drop_sequence_fact_default_restrict"
    type: "behavior_oracle"
    statement: "未指定依赖处理策略时默认 RESTRICT。"
    status: "confirmed"
    source_anchor: "L29-L30"
  -
    id: "drop_sequence_fact_cascade"
    type: "lifecycle"
    statement: "CASCADE 删除依赖序列的对象。"
    status: "confirmed"
    source_anchor: "L31-L31"
  -
    id: "drop_sequence_fact_restrict"
    type: "constraint"
    statement: "RESTRICT 遇任何依赖对象时拒绝删除序列。"
    status: "confirmed"
    source_anchor: "L32-L32"
  -
    id: "drop_sequence_fact_restrict_error"
    type: "behavior_oracle"
    statement: "RESTRICT 因依赖而失败，序列不应被删除。"
    status: "confirmed"
    source_anchor: "L32-L32"
  -
    id: "drop_sequence_fact_error_identity"
    type: "environment"
    statement: "依赖拒绝和遗漏 LARGE 的准确错误身份未给出，负向 Oracle 待校准。"
    status: "confirmed"
    source_anchor: "L32-L32"
  -
    id: "drop_sequence_fact_example_create"
    type: "example"
    statement: "示例建立 START 101 的递增序列。"
    status: "confirmed"
    source_anchor: "L35-L36"
  -
    id: "drop_sequence_fact_example_drop"
    type: "example"
    statement: "示例删除该序列。"
    status: "confirmed"
    source_anchor: "L38-L39"
