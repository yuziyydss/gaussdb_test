schema_version: 1
kind: "scenario"
id: "scenario_create_text_search_configuration_empty_then_mapping"
name: "CREATE TEXT SEARCH CONFIGURATION empty_then_mapping"
status: "planned"
description: "PARSER 创建后核对无映射，添加后核对有映射。"
factor_ref: "create_text_search_configuration"
fixture_refs:
  - "fixture_create_text_search_configuration_empty_default"
fact_refs:
  - "create_text_search_configuration_fact_parser_empty"
preconditions:
  - "内部功能测试环境已授权"
steps:
  -
    id: "before"
    action: "execute_sql"
    sql: "SELECT count(*) FROM pg_ts_config_map WHERE mapcfg = 'fp_tsc_empty'::regconfig;"
  -
    id: "add"
    action: "execute_sql"
    sql: "ALTER TEXT SEARCH CONFIGURATION fp_tsc_empty ADD MAPPING FOR word WITH simple;"
  -
    id: "after"
    action: "execute_sql"
    sql: "SELECT count(*) FROM pg_ts_config_map WHERE mapcfg = 'fp_tsc_empty'::regconfig;"
oracles:
  -
    after_step: "before"
    kind: "result_rows"
    expected:
      -
        - 0
  -
    after_step: "after"
    kind: "result_rows"
    expected:
      -
        - 1
execution_requirements:
  - "database"
  - "same_session"
