schema_version: 1
kind: "manifest"
id: "manifest_alter_schema_charset"
name: "ALTER SCHEMA charset"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "alter_schema"
syntax_ref: "syntax_alter_schema"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_alter_schema_targets"
identifier_policy: {}
bindings:
  action:
    - "alter_schema_action_charset"
  charset:
    - "alter_schema_charset_set"
    - "alter_schema_charset_short"
    - "alter_schema_charset_absent"
  collation:
    - "alter_schema_collation_plain"
    - "alter_schema_collation_default"
    - "alter_schema_collation_absent"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "compatibility_mode"
    allowed_values:
      - "B"
    fact_refs:
      - "alter_schema_fact_compatibility"
  -
    key: "server_encoding"
    allowed_values:
      - "UTF8"
    fact_refs:
      - "alter_schema_fact_encoding"
local_rules:
  -
    expression: "charset != 'alter_schema_charset_absent' or collation != 'alter_schema_collation_absent'"
    rationale: "仅选择至少一个显式修改项，空 ALTER 形式尚未确认。"
    fact_refs:
      - "alter_schema_fact_charset_syntax"
