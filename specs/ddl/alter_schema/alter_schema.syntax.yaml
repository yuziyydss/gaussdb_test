schema_version: 1
kind: "syntax"
id: "syntax_alter_schema"
name: "ALTER SCHEMA 语法"
factor_ref: "alter_schema"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  action:
    type: "token"
    optional: true
    dimension_ref: "alter_schema.action"
  schema_name:
    type: "token"
    optional: true
    dimension_ref: "alter_schema.schema_name"
  new_name:
    type: "token"
    optional: true
    dimension_ref: "alter_schema.new_name"
  new_owner:
    type: "token"
    optional: true
    dimension_ref: "alter_schema.new_owner"
  charset:
    type: "token"
    optional: true
    dimension_ref: "alter_schema.charset"
  collation:
    type: "token"
    optional: true
    dimension_ref: "alter_schema.collation"
source_fact_refs:
  - "alter_schema_fact_block_syntax"
  - "alter_schema_fact_rename_syntax"
  - "alter_schema_fact_owner_syntax"
  - "alter_schema_fact_charset_syntax"
  - "alter_schema_fact_new_name"
  - "alter_schema_fact_charset"
  - "alter_schema_fact_collation"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "ALTER SCHEMA "
    -
      kind: "slot"
      slot: "schema_name"
    -
      kind: "literal"
      text: " "
    -
      kind: "choice"
      selector: "action"
      branches:
        alter_schema_action_rename:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "RENAME TO "
            -
              kind: "slot"
              slot: "new_name"
        alter_schema_action_owner:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "OWNER TO "
            -
              kind: "slot"
              slot: "new_owner"
        alter_schema_action_with:
          kind: "slot"
          slot: "action"
        alter_schema_action_without:
          kind: "slot"
          slot: "action"
        alter_schema_action_charset:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "charset"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "collation"
