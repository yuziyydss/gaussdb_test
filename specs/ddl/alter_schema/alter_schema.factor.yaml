    classes:
      -
        id: "alter_schema_schema_name_empty_class"
        meaning: "empty"
        values:
          -
            id: "alter_schema_schema_name_empty"
            render: "fp_cs_one"
            representative: true
            validity: "valid"
            fact_refs:
              - "alter_schema_fact_existing"
            properties:
              empty: true
      -
        id: "alter_schema_schema_name_occupied_class"
        meaning: "occupied"
        values:
          -
            id: "alter_schema_schema_name_occupied"
            render: "fp_as_occupied"
            representative: true
            validity: "valid"
            fact_refs:
              - "alter_schema_fact_empty_required"
            properties:
              empty: false
    default_value_id: "alter_schema_schema_name_empty"
  new_name:
    description: "新名称/碰撞名称"
    classes:
      -
        id: "alter_schema_new_name_new_class"
        meaning: "new"
        values:
          -
            id: "alter_schema_new_name_new"
            render: "fp_as_renamed"
            representative: true
            validity: "valid"
            fact_refs:
              - "alter_schema_fact_new_name"
