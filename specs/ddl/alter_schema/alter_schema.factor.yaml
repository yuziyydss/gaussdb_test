rules:
  -
    id: "alter_schema_rule_unique"
    kind: "requires"
    expression: "action != 'alter_schema_action_rename' or new_name.properties.available == True"
    fact_refs:
      - "alter_schema_fact_unique"
    severity: "error"
  -
    id: "alter_schema_rule_empty"
    kind: "requires"
    expression: "action not in ['alter_schema_action_with','alter_schema_action_without'] or schema_name.properties.empty == True"
    fact_refs:
      - "alter_schema_fact_empty_required"
    severity: "error"
structural_checks: []
facts:
  -
    id: "alter_schema_fact_purpose"
    type: "lifecycle"
    statement: "修改模式名称、所有者或其他属性。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "alter_schema_fact_permission"
    type: "environment"
    statement: "模式所有者或 ALTER 授权者还需数据库 CREATE 权限；三权分立关闭时系统管理员默认有权限。"
    status: "confirmed"
    source_anchor: "L8-L10"
  -
    id: "alter_schema_fact_owner_membership"
    type: "environment"
    statement: "更改所有者需当前用户是模式所有者或系统管理员，并且是新所有者角色成员。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "alter_schema_fact_system_owner"
    type: "environment"
    statement: "除 PUBLIC 外的系统模式只能由初始用户更改所有者。"
    status: "confirmed"
    source_anchor: "L13-L17"
  -
    id: "alter_schema_fact_operations_owner"
    type: "environment"
    statement: "非初始用户不能把模式所有者改为运维管理员。"
    status: "confirmed"
    source_anchor: "L18-L18"
  -
    id: "alter_schema_fact_block_syntax"
    type: "syntax"
    statement: "WITH/WITHOUT BLOCKCHAIN 为一个独立 ALTER 分支。"
    status: "confirmed"
    source_anchor: "L21-L22"
  -
    id: "alter_schema_fact_rename_syntax"
    type: "syntax"
    statement: "RENAME TO 修改名称。"
    status: "confirmed"
    source_anchor: "L27-L29"
  -
    id: "alter_schema_fact_owner_syntax"
    type: "syntax"
    statement: "OWNER TO 修改所有者。"
    status: "confirmed"
    source_anchor: "L34-L36"
  -
    id: "alter_schema_fact_charset_syntax"
    type: "syntax"
    statement: "独立字符集/字符序修改分支。"
    status: "confirmed"
    source_anchor: "L41-L44"
  -
    id: "alter_schema_fact_existing"
    type: "constraint"
    statement: "schema_name 必须是已存在模式名。"
    status: "confirmed"
    source_anchor: "L50-L52"
  -
    id: "alter_schema_fact_new_name"
    type: "syntax"
    statement: "new_name 是符合标识符规范的新模式名。"
    status: "confirmed"
    source_anchor: "L54-L57"
  -
    id: "alter_schema_fact_unique"
    type: "constraint"
    statement: "新名称不能与已有模式重名。"
    status: "confirmed"
    source_anchor: "L58-L58"
  -
    id: "alter_schema_fact_initial_name"
    type: "constraint"
    statement: "新名称不能与初始用户重名。"
    status: "confirmed"
    source_anchor: "L59-L59"
  -
    id: "alter_schema_fact_reserved"
    type: "environment"
    statement: "不应使用 pg_、gs_role_ 或 data_redis 命名。"
    status: "confirmed"
    source_anchor: "L60-L60"
  -
    id: "alter_schema_fact_rename_permission"
    type: "environment"
    statement: "非系统管理员重命名需要数据库 CREATE 权限。"
    status: "confirmed"
    source_anchor: "L64-L64"
  -
    id: "alter_schema_fact_new_owner"
    type: "environment"
    statement: "new_owner 是已存在的用户名或角色名。"
    status: "confirmed"
    source_anchor: "L65-L67"
  -
    id: "alter_schema_fact_owner_permission"
    type: "environment"
    statement: "非系统管理员还需是新所有者直接/间接成员，文档要求该成员有数据库 CREATE 权限。"
    status: "confirmed"
    source_anchor: "L71-L72"
  -
    id: "alter_schema_fact_block_attribute"
    type: "lifecycle"
    statement: "WITH BLOCKCHAIN 表示防篡改模式。"
    status: "confirmed"
    source_anchor: "L73-L74"
  -
    id: "alter_schema_fact_ledger_gate"
    type: "environment"
    statement: "普通模式改防篡改需要 enable_ledger=on（默认 off，SIGHUP）。"
    status: "confirmed"
    source_anchor: "L78-L79"
  -
    id: "alter_schema_fact_table_kinds"
    type: "lifecycle"
    statement: "防篡改模式下普通行存表为防篡改历史表，不包括外表、临时表和系统表。"
    status: "confirmed"
    source_anchor: "L80-L81"
  -
    id: "alter_schema_fact_protected_ledger"
    type: "constraint"
    statement: "临时表模式、toast 模式、dbe_perf、blockchain 模式不支持变更防篡改属性。"
    status: "confirmed"
    source_anchor: "L82-L82"
  -
    id: "alter_schema_fact_empty_required"
    type: "constraint"
    statement: "只有模式内不包含任何表时才可切换防篡改属性。"
    status: "confirmed"
    source_anchor: "L83-L84"
  -
    id: "alter_schema_fact_charset"
    type: "syntax"
    statement: "默认字符集的值域参见表1-379。"
    status: "confirmed"
    source_anchor: "L86-L88"
  -
    id: "alter_schema_fact_compatibility"
    type: "environment"
    statement: "字符属性只在 B/M 支持，此处为 B 语义，M 另查专章。"
    status: "confirmed"
    source_anchor: "L94-L96"
  -
    id: "alter_schema_fact_charset_default"
    type: "behavior_oracle"
    statement: "未指定字符序时使用指定字符集的默认字符序。"
    status: "confirmed"
    source_anchor: "L97-L97"
  -
    id: "alter_schema_fact_collation"
    type: "syntax"
    statement: "默认字符序的值域参见表1-379。"
    status: "confirmed"
    source_anchor: "L99-L101"
  -
    id: "alter_schema_fact_collation_default"
    type: "behavior_oracle"
    statement: "未指定字符集时使用字符序对应的字符集。"
    status: "confirmed"
    source_anchor: "L109-L109"
  -
    id: "alter_schema_fact_encoding"
    type: "environment"
    statement: "除 binary 字符集/字符序外，仅支持与数据库编码相同的字符集。"
    status: "confirmed"
    source_anchor: "L165-L165"
  -
    id: "alter_schema_fact_system_rename"
    type: "environment"
    statement: "系统模式重命名默认禁止；启动、升级或 allow_system_table_mods=on 才允许，可能影响数据库正常运行。"
    status: "confirmed"
    source_anchor: "L13-L17"
  -
    id: "alter_schema_fact_charset_gap"
    type: "open_question"
    statement: "仅取示例 utf8mb4/utf8mb4_bin；表1-379、binary与 M 分支及完整编码匹配域尚未生成。"
    status: "needs_verification"
    source_anchor: "L86-L88"
  -
    id: "alter_schema_fact_error_identity"
    type: "open_question"
    statement: "重名、非空模式切换等目标错误身份未给 SQLSTATE，必须后续校准。"
    status: "needs_verification"
    source_anchor: "L58-L58"
  -
    id: "alter_schema_fact_example_setup"
    type: "example"
    statement: "示例由管理员配置 enable_ledger 后创建普通模式。"
    status: "confirmed"
    source_anchor: "L113-L117"
  -
    id: "alter_schema_fact_example_enable"
