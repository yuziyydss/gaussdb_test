            validity: "valid"
            fact_refs:
              - "alter_schema_fact_owner_syntax"
      -
        id: "alter_schema_action_with_class"
        meaning: "with"
        values:
          -
            id: "alter_schema_action_with"
            render: "WITH BLOCKCHAIN"
            representative: true
            validity: "valid"
            fact_refs:
              - "alter_schema_fact_block_syntax"
      -
        id: "alter_schema_action_without_class"
        meaning: "without"
        values:
          -
            id: "alter_schema_action_without"
            render: "WITHOUT BLOCKCHAIN"
            representative: true
            validity: "valid"
