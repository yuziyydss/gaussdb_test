    statement: "示例启用防篡改。"
    status: "confirmed"
    source_anchor: "L119-L120"
  -
    id: "alter_schema_fact_example_metadata"
    type: "example"
    statement: "客户端模式列表 WithBlockChain=t。"
    status: "confirmed"
    source_anchor: "L122-L128"
  -
    id: "alter_schema_fact_example_rename"
    type: "example"
    statement: "示例把 test_schema1 改为 test_sch1。"
    status: "confirmed"
    source_anchor: "L130-L132"
  -
    id: "alter_schema_fact_example_renamed_metadata"
