    status: "confirmed"
    source_anchor: "L134-L140"
  -
    id: "alter_schema_fact_example_role"
    type: "example"
    statement: "示例创建新所有者角色。"
    status: "confirmed"
    source_anchor: "L142-L144"
  -
    id: "alter_schema_fact_example_owner"
    type: "example"
    statement: "示例更改所有者。"
    status: "confirmed"
    source_anchor: "L146-L147"
  -
    id: "alter_schema_fact_example_owner_metadata"
    type: "example"
    statement: "模式列表显示新所有者，防篡改属性不变。"
    status: "confirmed"
    source_anchor: "L149-L155"
  -
    id: "alter_schema_fact_example_charset"
    type: "example"
    statement: "字符属性修改示例标题。"
    status: "confirmed"
    source_anchor: "L161-L161"
  -
    id: "alter_schema_fact_example_database"
    type: "example"
    statement: "示例进入 B/UTF8 数据库。"
    status: "confirmed"
    source_anchor: "L167-L171"
  -
    id: "alter_schema_fact_example_charset_schema"
