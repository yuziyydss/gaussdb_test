      -
        id: "alter_schema_charset_absent_class"
        meaning: "absent"
        values:
          -
            id: "alter_schema_charset_absent"
            render: ""
            representative: true
            validity: "valid"
            fact_refs:
              - "alter_schema_fact_charset_syntax"
