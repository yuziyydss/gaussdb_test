schema_version: 1
kind: "fixture"
id: "fixture_alter_schema_targets"
name: "ALTER SCHEMA targets"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "alter_schema"
requires_fixture_refs:
  - "fixture_create_schema_pair"
provides:
  tables:
    -
      name: "fp_as_occupied.t"
      persistence: "permanent"
      table_kind: "regular"
      columns:
        -
          name: "id"
          type: "INTEGER"
          nullable: true
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "DROP SCHEMA IF EXISTS fp_as_renamed;"
    - "CREATE SCHEMA fp_as_occupied;"
    - "CREATE TABLE fp_as_occupied.t (id INT);"
  teardown_sqls:
    - "DROP SCHEMA IF EXISTS fp_as_renamed CASCADE;"
    - "DROP SCHEMA IF EXISTS fp_as_occupied CASCADE;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
