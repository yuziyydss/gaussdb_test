schema_version: 1
kind: "manifest"
id: "manifest_drop_extension_existing"
name: "DROP EXTENSION existing"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "drop_extension"
syntax_ref: "syntax_drop_extension"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_drop_extension_two_extensions"
identifier_policy: {}
bindings:
  if_exists:
    - "drop_extension_if_exists_no"
    - "drop_extension_if_exists_yes"
  behavior:
    - "drop_extension_behavior_default"
    - "drop_extension_behavior_restrict"
    - "drop_extension_behavior_cascade"
  targets:
    - "drop_extension_targets_one"
    - "drop_extension_targets_two"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "isolated_internal_test"
    allowed_values:
      - "true"
    fact_refs:
      - "drop_extension_fact_internal"
  -
    key: "extension_owner_authorized"
    allowed_values:
      - "true"
    fact_refs:
      - "drop_extension_fact_privilege"
  -
    key: "enable_extension"
    allowed_values:
      - "true"
    fact_refs:
      - "create_extension::create_extension_fact_enabled"
  -
    key: "extension_support_contract"
    allowed_values:
      - "ext_b7,ext_b7_second:isolated"
    fact_refs:
      - "create_extension::create_extension_fact_support_files"
