  type: syntax
  statement: CREATE CLIENT MASTER KEY name WITH键值参数；主模板同时列出KEY_STORE/KEY_PATH/ALGORITHM，参数说明定义按管理器省略。
  status: confirmed
  source_anchor: L21-L22
- id: create_client_master_key_fact_hcs
  type: constraint
  statement: hcs_kms KEY_PATH为KmsApiUrl/密钥ID，算法AES_256或SM4。
  status: confirmed
  source_anchor: L50-L53
- id: create_client_master_key_fact_user_token
  type: constraint
  statement: user_token无KEY_PATH，算法AES_256_CBC/AES_256_GCM/SM4/SM4_HMAC_SM3/SM4_CTR_HMAC_SM3。
  status: confirmed
  source_anchor: L55-L60
- id: create_client_master_key_fact_sdf
  type: constraint
  statement: sdf_kms KEY_PATH为KEK ID，可由iTrustee或SJJ1994工具生成；不提供ALGORITHM。
  status: confirmed
  source_anchor: L62-L67
- id: create_client_master_key_fact_lifecycle_example
  type: example
  statement: user_token AES_256_GCM省略KEY_PATH创建CMK再删除，关闭会话并清理用户。
  status: confirmed
  source_anchor: L93-L103
- id: create_client_master_key_fact_runtime_credentials
  type: environment
  statement: 静态候选不连接驱动-C、不注入秘密或恢复外部密钥；运行时凭据与生命周期需专用安全环境。
  status: confirmed
  source_anchor: L10-L11
- id: create_client_master_key_fact_capability_matrix
  type: environment
  statement: 静态域仅生成user_token五种文档算法；hcs_kms/sdf_kms管理器×算法×KEY_PATH兼容性需外部管理器环境，不伪造KEY_PATH。
  status: confirmed
  source_anchor: L12-L16
