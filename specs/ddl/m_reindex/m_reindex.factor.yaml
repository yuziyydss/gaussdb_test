facts:
- id: m_reindex_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.15.1 L2-2
- id: m_reindex_fact_syntax
  type: syntax
  statement: REINDEX 的 INDEX/TABLE 指定对象形式可选 CONCURRENTLY 和 FORCE。
  status: confirmed
  source_anchor: 2.4.2.15.1 L22-23
- id: m_reindex_fact_online
  type: environment
  statement: CONCURRENTLY 不可在事务内执行，只支持普通/分区 B-tree/UB-tree，排除 PCR ubtree 等。
  status: confirmed
  source_anchor: 2.4.2.15.1 L48-53
- id: m_reindex_fact_force
  type: behavior_oracle
  statement: FORCE 只为语法兼容，无实际含义。
  status: confirmed
  source_anchor: 2.4.2.15.1 L79-79
- id: m_reindex_fact_invalid
  type: constraint
  statement: TABLE 不会重建已被 alter unusable 失效的索引。
  status: confirmed
  source_anchor: 2.4.2.15.1 L35-35
- id: m_reindex_fact_failure
  type: lifecycle
  statement: 在线重建故障可能留下非法索引和临时表，需按确切对象识别清理，不猜后缀广泛删除。
  status: confirmed
  source_anchor: 2.4.2.15.1 L55-60
- id: m_reindex_fact_partition
  type: environment
  statement: partition_name参数说明与分区产生式存在歧义；当前模型不生成分区分支，不推广示例语义。
  status: confirmed
  source_anchor: 2.4.2.15.1 L81-85
- id: m_reindex_fact_purpose
  type: example
  statement: 为表中的数据重建索引。 在以下几种情况下需要使用REINDEX重建索引： ●   索引崩溃，并且不再包含有效的数据。
  status: confirmed
  source_anchor: M-Compatibility L4-6
- id: m_reindex_fact_constraint
  type: example
  statement: REINDEX DATABASE和SYSTEM这种形式的重建索引不能在事务块中执行。 若索引带有lpi_parallel_method选项，取值为PARTITION且表的parallel_workers
  status: confirmed
  source_anchor: M-Compatibility L13-18
- id: m_reindex_fact_params
  type: example
  statement: ●   INDEX 重新建立指定的索引。 ●   TABLE
  status: confirmed
  source_anchor: M-Compatibility L11-11
- id: m_reindex_fact_example
  type: example
  statement: m_reindex的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L92-94
