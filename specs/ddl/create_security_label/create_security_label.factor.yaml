facts:
  -
    id: "create_security_label_fact_purpose"
    type: "lifecycle"
    statement: "在当前数据库为安全策略创建标签。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_security_label_fact_privilege"
    type: "environment"
    statement: "初始用户、SYSADMIN或继承gs_role_seclabel的用户可创建。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "create_security_label_fact_name"
    type: "constraint"
    statement: "标签名在库内唯一，合法标识符且最长63字符。"
    status: "confirmed"
    source_anchor: "L18-L20"
  -
    id: "create_security_label_fact_truncate_name"
    type: "behavior_oracle"
    statement: "长于63字符截断。"
    status: "confirmed"
    source_anchor: "L23-L23"
  -
    id: "create_security_label_fact_name_case"
    type: "behavior_oracle"
    statement: "未引用大写转小写，双引号保留。"
    status: "confirmed"
    source_anchor: "L24-L25"
  -
    id: "create_security_label_fact_name_chars"
    type: "constraint"
    statement: "名称允许字母、数字、下划线及美元符号。"
    status: "confirmed"
    source_anchor: "L26-L27"
  -
    id: "create_security_label_fact_content_structure"
    type: "constraint"
    statement: "内容为等级:范围，有且仅一个等级且至少一个范围，多个范围逗号分隔，可用连字符区间。"
    status: "confirmed"
    source_anchor: "L28-L32"
  -
    id: "create_security_label_fact_levels"
    type: "constraint"
    statement: "等级L1..L1024，编号比较给出等级偏序。"
    status: "confirmed"
    source_anchor: "L33-L34"
  -
    id: "create_security_label_fact_groups"
    type: "constraint"
    statement: "范围G1..G1024，无大小比较，可集合运算，连字符表示闭区间。"
    status: "confirmed"
    source_anchor: "L35-L37"
  -
    id: "create_security_label_fact_content_digits"
    type: "constraint"
    statement: "L/G须大写，其后至少一位数字且首位非零，区间终点不得小于起点。"
    status: "confirmed"
    source_anchor: "L38-L40"
  -
    id: "create_security_label_fact_invalid_content"
    type: "behavior_oracle"
    statement: "不符合要求的等级/范围输入报错。"
    status: "confirmed"
    source_anchor: "L41-L41"
  -
    id: "create_security_label_fact_syntax"
    type: "syntax"
    statement: "CREATE SECURITY LABEL名称后为引号括起的内容。"
    status: "confirmed"
    source_anchor: "L12-L12"
  -
    id: "create_security_label_fact_invalid_empty_group"
    type: "example"
    statement: "L3:缺少范围示例。"
    status: "confirmed"
    source_anchor: "L42-L43"
  -
    id: "create_security_label_fact_invalid_result"
    type: "example"
    statement: "示例报至少一个等级和范围。"
    status: "confirmed"
    source_anchor: "L44-L44"
  -
    id: "create_security_label_fact_create"
    type: "example"
    statement: "创建L1:G4。"
    status: "confirmed"
    source_anchor: "L47-L48"
  -
    id: "create_security_label_fact_duplicate"
    type: "example"
