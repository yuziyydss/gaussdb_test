    type: "example"
    statement: "多范围标签。"
    status: "confirmed"
    source_anchor: "L53-L54"
  -
    id: "create_security_label_fact_interval"
    type: "example"
    statement: "范围区间标签。"
    status: "confirmed"
    source_anchor: "L56-L57"
  -
