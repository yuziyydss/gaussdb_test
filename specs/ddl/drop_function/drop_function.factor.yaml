    id: "drop_function_fact_arguments"
    type: "syntax"
    statement: "参数列表可含名称、模式和类型。"
    status: "confirmed"
    source_anchor: "L29-L34"
  -
    id: "drop_function_fact_behavior"
    type: "constraint"
    statement: "默认 RESTRICT；CASCADE 删除依赖，RESTRICT 在有依赖时拒绝。"
    status: "confirmed"
    source_anchor: "L35-L38"
  -
    id: "drop_function_fact_overload_signature"
    type: "constraint"
    statement: "同名重载存在时必须加参数列表，否则报错。"
    status: "confirmed"
    source_anchor: "L53-L54"
