schema_version: 1
kind: "scenario"
id: "scenario_drop_database_documented_contracts"
name: "DROP DATABASE documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "drop_database"
fixture_refs: []
fact_refs:
  - "drop_database_fact_purpose"
  - "drop_database_fact_privilege"
  - "drop_database_fact_protected"
  - "drop_database_fact_no_connections"
  - "drop_database_fact_no_transaction"
  - "drop_database_fact_retry"
  - "drop_database_fact_irreversible"
  - "drop_database_fact_recyclebin"
  - "drop_database_fact_if_exists"
  - "drop_database_fact_recyclebin_environment"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "删除数据库。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "要求数据库属主或DROP授权，管理员默认拥有。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "禁止删除postgres、template0、template1、templatea、templatem；gsql\\l可查看数据库。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "存在用户连接时不能删除，可通过DV_SESSIONS查看。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "不能在事务块中执行。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "失败回滚后需再执行DROP DATABASE IF EXISTS。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "库级回收站未开启时删除不可撤销。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "库级回收站开启时数据库放入回收站；表级回收站含对象时不能删库。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "IF EXISTS删除已有库；不存在时不删也不报错，仅NOTICE。"
  -
    id: "environment_recyclebin"
    action: "verify_documented_contract"
    note: "执行删除前须区分库级回收站开启与关闭环境。"
oracles:
  -
    kind: "documented_behavior"
    expected: "IF EXISTS删除已有库；不存在时不删也不报错，仅NOTICE。"
execution_requirements:
  - "database"
  - "same_session"
