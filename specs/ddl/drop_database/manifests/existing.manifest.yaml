schema_version: 1
kind: "manifest"
id: "manifest_drop_database_existing"
name: "DROP DATABASE existing"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "drop_database"
syntax_ref: "syntax_drop_database"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_drop_database_existing_database"
identifier_policy: {}
bindings:
  if_exists:
    - "drop_database_if_exists_none"
    - "drop_database_if_exists_yes"
  purge:
    - "drop_database_purge_none"
    - "drop_database_purge_purge"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "drop_database_authorized"
    allowed_values:
      - "true"
    fact_refs:
      - "drop_database_fact_privilege"
  -
    key: "autocommit_no_transaction_block"
    allowed_values:
      - "true"
    fact_refs:
      - "drop_database_fact_no_transaction"
  -
    key: "test_database_has_connections"
    allowed_values:
      - "false"
    fact_refs:
      - "drop_database_fact_no_connections"
  -
    key: "enable_db_recyclebin"
    allowed_values:
      - "off"
    fact_refs:
      - "drop_database_fact_recyclebin_environment"
  -
    key: "exclusive_test_database"
    allowed_values:
      - "b8_database"
    fact_refs:
      - "drop_database_fact_privilege"
