    id: "drop_database_fact_retry"
    type: "lifecycle"
    statement: "失败回滚后需再执行DROP DATABASE IF EXISTS。"
    status: "confirmed"
    source_anchor: "L17-L18"
  -
    id: "drop_database_fact_irreversible"
    type: "lifecycle"
    statement: "库级回收站未开启时删除不可撤销。"
    status: "confirmed"
    source_anchor: "L19-L20"
