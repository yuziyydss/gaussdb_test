schema_version: 1
kind: "scenario"
id: "scenario_alter_materialized_view_column_contract"
name: "ALTER MATERIALIZED VIEW column_contract"
status: "planned"
description: "列重命名不改变两列数据。"
factor_ref: "alter_materialized_view"
fixture_refs:
  - "fixture_alter_materialized_view_full"
fact_refs:
  - "alter_materialized_view_fact_purpose"
preconditions: []
steps:
  -
    id: "rename"
    action: "execute_sql"
    sql: "ALTER MATERIALIZED VIEW mv_full RENAME COLUMN col_1 TO renamed_1;"
  -
    id: "query"
    action: "execute_sql"
    sql: "SELECT renamed_1, col_2 FROM mv_full ORDER BY renamed_1;"
oracles:
  -
    after_step: "query"
    kind: "result_rows"
    expected:
      -
        - 1
        - 2
      -
        - 3
        - 4
execution_requirements:
  - "database"
  - "same_session"
