    id: "alter_table_partition_fact_body_474_3"
    type: "behavior_oracle"
    statement: "所以在保证当前普通表中的 数据满足分区的分区键范围时，可以加上WITHOUT来指明不进行检查。"
    status: "confirmed"
    source_anchor: "L474-L477"
