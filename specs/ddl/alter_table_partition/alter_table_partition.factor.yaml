    id: "alter_table_partition_fact_body_478"
    type: "behavior_oracle"
    statement: "●   VERBOSE 在VALIDATION是WITH状态时，如果检查出普通表有不满足要交换分区的分区键 范围的数据，那么把这些数据插入到正确的分区，如果路由不到任何分区，再报 错。"
    status: "confirmed"
    source_anchor: "L478-L481"
