facts:
  -
    id: "alter_table_partition_fact_body_5"
    type: "behavior_oracle"
    statement: "修改表分区，包括增加/删除分区、切割/合并分区、清空分区、移动分区表空间、交换 分区、重命名分区、开启/关闭分区自动扩展功能，以及修改分区属性等。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "alter_table_partition_fact_body_9"
    type: "environment"
    statement: "●   只有分区表的所有者或者被授予了分区表ALTER权限的用户有权限执行ALTER TABLE PARTITION命令，当三权分立开关关闭时，系统管理员默认拥有此权限。"
    status: "confirmed"
    source_anchor: "L9-L10"
  -
    id: "alter_table_partition_fact_body_11"
    type: "constraint"
    statement: "●   添加分区的表空间不能是PG_GLOBAL。"
    status: "confirmed"
    source_anchor: "L11-L11"
  -
    id: "alter_table_partition_fact_body_12"
    type: "constraint"
    statement: "●   添加分区的名称不能与该分区表已有分区的名称相同。"
    status: "confirmed"
    source_anchor: "L12-L12"
  -
    id: "alter_table_partition_fact_body_13"
    type: "constraint"
    statement: "●   添加分区的分区键值要和分区表的分区键类型一致。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "alter_table_partition_fact_body_14"
    type: "constraint"
    statement: "●   若添加RANGE分区，添加分区键值要大于分区表中最后一个范围分区的上边界。"
    status: "confirmed"
    source_anchor: "L14-L14"
  -
    id: "alter_table_partition_fact_body_15"
    type: "constraint"
    statement: "●   若添加LIST分区，添加分区键值不能与现有分区键值重复。"
    status: "confirmed"
    source_anchor: "L15-L15"
  -
    id: "alter_table_partition_fact_body_16"
    type: "constraint"
    statement: "●   不支持添加哈希分区。"
    status: "confirmed"
    source_anchor: "L16-L16"
  -
    id: "alter_table_partition_fact_body_17"
    type: "constraint"
    statement: "●   如果目标分区表中已有分区数达到了最大值1048575，则不能继续添加分区。"
    status: "confirmed"
    source_anchor: "L17-L17"
  -
    id: "alter_table_partition_fact_body_18"
    type: "behavior_oracle"
    statement: "●   当分区表只有一个分区时，不能删除该分区。"
    status: "confirmed"
    source_anchor: "L18-L18"
  -
    id: "alter_table_partition_fact_body_19"
    type: "constraint"
    statement: "●   选择分区使用PARTITION FOR()，括号里指定值个数应该与定义分区时使用的列 个数相同，并且一一对应。"
    status: "confirmed"
    source_anchor: "L19-L20"
  -
    id: "alter_table_partition_fact_body_19_1"
    type: "constraint"
    statement: "ALTER TABLE操作会处理partition_value落入的分区。"
    status: "confirmed"
    source_anchor: "L19-L20"
  -
    id: "alter_table_partition_fact_body_21"
    type: "constraint"
    statement: "●   Value分区表不支持Alter Partition操作。"
    status: "confirmed"
    source_anchor: "L21-L21"
  -
    id: "alter_table_partition_fact_body_22"
    type: "constraint"
    statement: "●   间隔分区表不支持添加分区。"
    status: "confirmed"
    source_anchor: "L22-L22"
  -
    id: "alter_table_partition_fact_body_23"
    type: "behavior_oracle"
    statement: "●   哈希分区表不支持切割分区，不支持合并分区，不支持添加/删除分区。"
    status: "confirmed"
    source_anchor: "L23-L23"
  -
    id: "alter_table_partition_fact_body_24"
    type: "behavior_oracle"
    statement: "●   删除、切割、合并、清空、交换分区的操作会使Global索引失效，可以申明 UPDATE GLOBAL INDEX子句同步更新索引。"
    status: "confirmed"
    source_anchor: "L24-L25"
  -
    id: "alter_table_partition_fact_body_26"
    type: "behavior_oracle"
    statement: "●   如果删除、切割、合并、清空、交换分区操作不申明UPDATE GLOBAL INDEX子 句，并发的DML业务有可能因为索引不可用而报错。"
    status: "confirmed"
    source_anchor: "L26-L27"
  -
    id: "alter_table_partition_fact_body_28"
    type: "behavior_oracle"
    statement: "●   若设置参数enable_gpi_auto_update为on，即使不申明UPDATE GLOBAL INDEX 子句，也会自动更新Global索引。"
    status: "confirmed"
    source_anchor: "L28-L29"
  -
    id: "alter_table_partition_fact_body_30"
    type: "constraint"
    statement: "●   在为数据对象增加或者变更ILM策略的时候，如果追加了行级表达式，需要注意行 表达式目前只支持白名单中列出的函数。"
    status: "confirmed"
    source_anchor: "L30-L32"
  -
    id: "alter_table_partition_fact_body_30_1"
    type: "constraint"
    statement: "具体白名单函数列表请参见行表达式函 数白名单。"
    status: "confirmed"
    source_anchor: "L30-L32"
  -
    id: "alter_table_partition_fact_body_35"
    type: "environment"
    statement: "在ILM策略的ON(EXPR)行级表达式支持的函数中，有部分函数的输出可能会受兼容性参数 影响。"
    status: "confirmed"
    source_anchor: "L35-L37"
  -
    id: "alter_table_partition_fact_body_35_1"
    type: "environment"
    statement: "例如，upper函数在B兼容模式下设置b_format_version='5.7'和 b_format_dev_version='s2'后，将无法转大写。"
    status: "confirmed"
    source_anchor: "L35-L37"
  -
    id: "alter_table_partition_fact_body_38"
    type: "behavior_oracle"
    statement: "●   开启范围分区自动扩展要求分区表中不能存在分区键值为MAXVALUE的分区。"
    status: "confirmed"
    source_anchor: "L38-L38"
  -
    id: "alter_table_partition_fact_body_39"
    type: "behavior_oracle"
    statement: "●   开启范围分区自动扩展只支持单分区键。"
    status: "confirmed"
    source_anchor: "L39-L39"
  -
    id: "alter_table_partition_fact_body_40"
    type: "behavior_oracle"
    statement: "●   开启列表分区自动扩展要求分区表中不能存在分区键值为DEFAULT的分区。"
    status: "confirmed"
    source_anchor: "L40-L40"
  -
    id: "alter_table_partition_fact_body_41"
    type: "constraint"
    statement: "●   执行在线DDL进行切割/合并分区、交换分区、移动分区表空间操作时，需预留足 够的磁盘空间，即剩余空间是所操作的表或分区（及其上索引等附属品）总和。"
    status: "confirmed"
    source_anchor: "L41-L42"
  -
    id: "alter_table_partition_fact_body_43"
    type: "constraint"
    statement: "●   在线DDL不支持在事务内执行（通过JDBC驱动执行多条SQL时会隐式启动事务， 禁止多条SQL一起执行），不支持在存储过程中执行。"
    status: "confirmed"
    source_anchor: "L43-L44"
  -
    id: "alter_table_partition_fact_body_46"
    type: "constraint"
    statement: "●   如果用户取消在线DDL执行过程，首先进入残留清理流程，如果用户再次取消， 则会结束清理流程导致残留。"
    status: "confirmed"
    source_anchor: "L46-L47"
  -
    id: "alter_table_partition_fact_body_48"
    type: "constraint"
    statement: "●   在线DDL与用户业务之间存在资源争抢，不适合大业务背景下做在线DDL。"
    status: "confirmed"
    source_anchor: "L48-L50"
  -
    id: "alter_table_partition_fact_body_48_1"
    type: "constraint"
    statement: "对于 资源有限的场景，建议采用细粒度资源管控进行操作，且不建议使用并行加速功 能。"
    status: "confirmed"
    source_anchor: "L48-L50"
  -
    id: "alter_table_partition_fact_body_51"
    type: "environment"
    statement: "●   M-Compatibility模式数据库下不支持在线DDL操作。"
    status: "confirmed"
    source_anchor: "L51-L51"
  -
    id: "alter_table_partition_fact_body_52"
    type: "behavior_oracle"
    statement: "●   以下情况中，在线DDL操作将不会生效，DDL操作默认以离线方式执行，如果指 定ONLINE关键字，则会产生忽略ONLINE关键字的提示。"
    status: "confirmed"
    source_anchor: "L52-L53"
  -
    id: "alter_table_partition_fact_body_54"
    type: "constraint"
    statement: "–   如在线修改表分区语句包含当前在线DDL特性支持操作（在线切割/合并分 区、交换分区、移动分区表空间）以外的操作。"
    status: "confirmed"
    source_anchor: "L54-L55"
  -
    id: "alter_table_partition_fact_body_56"
    type: "constraint"
    statement: "–   在线修改表分区语句包含多子句操作时（比如语句同时包含在线切割分区和 交换分区）。"
    status: "confirmed"
    source_anchor: "L56-L57"
  -
    id: "alter_table_partition_fact_body_58"
    type: "behavior_oracle"
    statement: "●   对数据库级、索引级、二级分区表、段页式表、hash bucket表、临时表、 unlogged表、HTAP表进行在线DDL操作时（包含在线切割/合并分区、交换分 区、移动分区表空间），在线DDL操作将不会生效，DDL操作默认以离线方式执 行，并提示当前DDL语句不支持在线执行。"
    status: "confirmed"
    source_anchor: "L58-L61"
  -
    id: "alter_table_partition_fact_body_62"
    type: "constraint"
    statement: "●   长事务可能会阻塞在线DDL执行结果（包含在线切割/合并分区、交换分区、移动 分区表空间），建议避免在存在长事务时进行在线DDL操作 。"
    status: "confirmed"
    source_anchor: "L62-L63"
  -
    id: "alter_table_partition_fact_body_64"
    type: "behavior_oracle"
    statement: "●   在线DDL修改表分区（包含在线切割/合并分区、交换分区、移动分区表空间）执 行后期将阻塞DQL和DML操作。"
    status: "confirmed"
    source_anchor: "L64-L67"
  -
    id: "alter_table_partition_fact_body_64_1"
    type: "behavior_oracle"
    statement: "因此，对于存在超时报错机制的业务模型可能出 现阻塞导致的请求失败，使用本特性前需要谨慎评估业务模型对等锁的容忍程 度，以确认是否能够进行本特性操作。"
    status: "confirmed"
    source_anchor: "L64-L67"
  -
    id: "alter_table_partition_fact_body_68"
    type: "behavior_oracle"
    statement: "●   在线DDL修改表分区执行期间，应尽量避免与其他DDL并发执行，否则可能会出 现无响应以及报错等异常，请重新连接客户端进行重试。"
    status: "confirmed"
    source_anchor: "L68-L69"
  -
    id: "alter_table_partition_fact_body_70"
    type: "environment"
    statement: "●   从不支持在线DDL修改表分区操作的版本升级至支持在线DDL修改表分区的版 本，升级待观察期间不支持使用在线DDL修改表分区操作（包含在线切割/合并分 区、交换分区、移动分区表空间），DDL默认以离线方式执行，并提示升级期间 不支持在线DDL操作。"
    status: "confirmed"
    source_anchor: "L70-L73"
  -
    id: "alter_table_partition_fact_body_74"
    type: "constraint"
    statement: "●   在线DDL修改表分区执行（包含在线切割/合并分区、交换分区、移动分区表空 间）过程中会生成指定的Schema，Schema命名格式为online$$ddl$$[(表所在的 Schema 表名)的hash值]。"
    status: "confirmed"
    source_anchor: "L74-L76"
  -
    id: "alter_table_partition_fact_body_77"
    type: "environment"
    statement: "–   Schema的属主默认为初始用户，在线DDL执行中不建议操作此Schema，可 能会导致中止在线DDL并产生未知错误。"
    status: "confirmed"
    source_anchor: "L77-L78"
  -
    id: "alter_table_partition_fact_body_79"
    type: "behavior_oracle"
    statement: "–   用户不可创建online$$为前缀的Schema，否则会产生报错提示。"
    status: "confirmed"
    source_anchor: "L79-L81"
  -
    id: "alter_table_partition_fact_body_79_1"
    type: "behavior_oracle"
    statement: "若已存在同 名Schema冲突，在线DDL操作将不会生效，DDL默认以离线方式执行，并提 示Schema名冲突导致当前DDL语句不可在线。"
    status: "confirmed"
    source_anchor: "L79-L81"
  -
    id: "alter_table_partition_fact_body_82"
    type: "constraint"
    statement: "●   若在线DDL（包含在线切割/合并分区、移动分区表空间）操作失败时，表上可能 会存在明显存储空间膨胀。"
    status: "confirmed"
    source_anchor: "L82-L85"
  -
    id: "alter_table_partition_fact_body_82_1"
    type: "constraint"
    statement: "在线分区交换操作无论失败与否，表上可能会有明显 存储空间膨胀。"
    status: "confirmed"
    source_anchor: "L82-L85"
  -
    id: "alter_table_partition_fact_body_82_2"
    type: "constraint"
    statement: "其膨胀程度与DDL执行时长以及并发写操作数成正比，建议避免 在存在长事务时进行在线DDL操作。"
    status: "confirmed"
    source_anchor: "L82-L85"
  -
    id: "alter_table_partition_fact_body_86"
    type: "behavior_oracle"
    statement: "●   在线DDL（包含在线切割/合并分区、交换分区、移动分区表空间）操作继承 CREATE TABLE的使用约束。"
    status: "confirmed"
    source_anchor: "L86-L87"
  -
    id: "alter_table_partition_fact_body_88"
    type: "constraint"
    statement: "●   在线DDL合并分区操作时，若待合并分区的数据在操作前已被压缩，可能存在在 线DDL合并操作完成后数据被解压的情况。"
    status: "confirmed"
    source_anchor: "L88-L89"
  -
    id: "alter_table_partition_fact_body_90"
    type: "behavior_oracle"
    statement: "●   在线DDL（包含在线切割/合并分区、交换分区、移动分区表空间）若涉及自动更 新Global索引时，在线DDL执行后期可能存在长时间阻塞并发查询、DML业务。"
    status: "confirmed"
    source_anchor: "L90-L91"
  -
    id: "alter_table_partition_fact_body_94"
    type: "behavior_oracle"
    statement: "修改分区表分区包括修改表分区主语法、修改表分区名称的语法、重置分区ID和开启/ 关闭分区自动扩展功能的语法。"
    status: "confirmed"
    source_anchor: "L94-L95"
  -
