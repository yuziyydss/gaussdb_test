  -
    id: "alter_table_partition_su_body_5_5"
    section: "正文"
    source_anchor: "L5-L6"
    line_start: 5
    line_end: 6
    statement: "修改表分区，包括增加/删除分区、切割/合并分区、清空分区、移动分区表空间、交换 分区、重命名分区、开启/关闭分区自动扩展功能，以及修改分区属性等。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_5"
      - "alter_table_partition_fact_atomic_5_0"
      - "alter_table_partition_fact_atomic_5_1"
      - "alter_table_partition_fact_atomic_5_2"
      - "alter_table_partition_fact_atomic_5_3"
      - "alter_table_partition_fact_atomic_5_4"
      - "alter_table_partition_fact_atomic_5_5"
      - "alter_table_partition_fact_atomic_5_6"
      - "alter_table_partition_fact_atomic_5_7"
      - "alter_table_partition_fact_atomic_5_8"
      - "alter_table_partition_fact_atomic_5_9"
      - "alter_table_partition_fact_atomic_5_10"
    atomicity: "grouped"
    independent_claim_count: 12
  -
    id: "alter_table_partition_su_body_9_9"
    section: "正文"
    source_anchor: "L9-L10"
    line_start: 9
    line_end: 10
    statement: "●   只有分区表的所有者或者被授予了分区表ALTER权限的用户有权限执行ALTER TABLE PARTITION命令，当三权分立开关关闭时，系统管理员默认拥有此权限。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_9"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_11_11"
    section: "正文"
    source_anchor: "L11-L11"
    line_start: 11
    line_end: 11
    statement: "●   添加分区的表空间不能是PG_GLOBAL。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_11"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_12_12"
    section: "正文"
    source_anchor: "L12-L12"
    line_start: 12
    line_end: 12
    statement: "●   添加分区的名称不能与该分区表已有分区的名称相同。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_12"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_13_13"
    section: "正文"
    source_anchor: "L13-L13"
    line_start: 13
    line_end: 13
    statement: "●   添加分区的分区键值要和分区表的分区键类型一致。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_13"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_14_14"
    section: "正文"
    source_anchor: "L14-L14"
    line_start: 14
    line_end: 14
    statement: "●   若添加RANGE分区，添加分区键值要大于分区表中最后一个范围分区的上边界。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_14"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_15_15"
    section: "正文"
    source_anchor: "L15-L15"
    line_start: 15
    line_end: 15
    statement: "●   若添加LIST分区，添加分区键值不能与现有分区键值重复。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_15"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_16_16"
    section: "正文"
    source_anchor: "L16-L16"
    line_start: 16
    line_end: 16
    statement: "●   不支持添加哈希分区。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_16"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_17_17"
    section: "正文"
    source_anchor: "L17-L17"
    line_start: 17
    line_end: 17
    statement: "●   如果目标分区表中已有分区数达到了最大值1048575，则不能继续添加分区。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_17"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_18_18"
    section: "正文"
    source_anchor: "L18-L18"
    line_start: 18
    line_end: 18
    statement: "●   当分区表只有一个分区时，不能删除该分区。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_18"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_19_19"
    section: "正文"
    source_anchor: "L19-L20"
    line_start: 19
    line_end: 20
    statement: "●   选择分区使用PARTITION FOR()，括号里指定值个数应该与定义分区时使用的列 个数相同，并且一一对应。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_19"
      - "alter_table_partition_fact_body_19_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "alter_table_partition_su_body_21_21"
    section: "正文"
    source_anchor: "L21-L21"
    line_start: 21
    line_end: 21
    statement: "●   Value分区表不支持Alter Partition操作。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_21"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_22_22"
    section: "正文"
    source_anchor: "L22-L22"
    line_start: 22
    line_end: 22
    statement: "●   间隔分区表不支持添加分区。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_22"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_23_23"
    section: "正文"
    source_anchor: "L23-L23"
    line_start: 23
    line_end: 23
    statement: "●   哈希分区表不支持切割分区，不支持合并分区，不支持添加/删除分区。"
    status: "mapped"
    fact_refs:
      - "alter_table_partition_fact_body_23"
    atomicity: "atomic"
  -
    id: "alter_table_partition_su_body_24_24"
    section: "正文"
    source_anchor: "L24-L25"
    line_start: 24
    line_end: 25
    statement: "●   删除、切割、合并、清空、交换分区的操作会使Global索引失效，可以申明 UPDATE GLOBAL INDEX子句同步更新索引。"
    status: "open_question"
    fact_refs:
      - "alter_table_partition_fact_body_24"
      - "alter_table_partition_fact_global_index_oracle"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "alter_table_partition_su_body_26_26"
    section: "正文"
    source_anchor: "L26-L27"
    line_start: 26
    line_end: 27
    statement: "●   如果删除、切割、合并、清空、交换分区操作不申明UPDATE GLOBAL INDEX子 句，并发的DML业务有可能因为索引不可用而报错。"
    status: "mapped"
