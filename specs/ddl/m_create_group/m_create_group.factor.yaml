- id: m_create_group_fact_syntax
  type: syntax
  statement: CREATE GROUP 是 CREATE ROLE 的非标准别名；密码分支必需，支持 DISABLE。
  status: confirmed
  source_anchor: 2.4.2.8.10 L12-13
- id: m_create_group_fact_alias
  type: syntax
  statement: CREATE GROUP 等价于 CREATE ROLE，参数定义引用 CREATE ROLE。
  status: confirmed
  source_anchor: 2.4.2.8.10 L8-9
- id: m_create_group_fact_parameters
  type: syntax
  statement: 本章参数说明显式引用 CREATE ROLE，不复制其权限和连接范围。
  status: confirmed
  source_anchor: 2.4.2.8.10 L45-45
- id: m_create_group_fact_purpose
  type: example
  statement: 创建用户组。用户组是一组用户的集合，便于批量授权。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_create_group_fact_constraint
  type: example
  statement: CREATE GROUP是CREATE ROLE的别名，非SQL标准语法，不推荐使用，建议用户直 接使用CREATE ROLE。
  status: confirmed
  source_anchor: M-Compatibility L7-7
- id: m_create_group_fact_params
  type: example
  statement: 参数与CREATE ROLE相同，包括组名和角色选项。
  status: confirmed
  source_anchor: M-Compatibility L44-44
