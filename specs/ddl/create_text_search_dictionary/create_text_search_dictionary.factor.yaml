source_ledger_ref: "source_ledger_create_text_search_dictionary"
syntax_ref: "syntax_create_text_search_dictionary"
dimensions:
  template:
    description: "实际支持的无文件模板"
    classes:
      -
        id: "create_text_search_dictionary_template_simple_class"
        meaning: "simple"
        values:
          -
            id: "create_text_search_dictionary_template_simple"
            render: "simple"
            representative: true
            validity: "valid"
            fact_refs:
              - "create_text_search_dictionary_fact_template"
    default_value_id: "create_text_search_dictionary_template_simple"
  accept:
    description: "Simple非停用词策略"
    classes:
      -
        id: "create_text_search_dictionary_accept_default_class"
        meaning: "default"
        values:
          -
            id: "create_text_search_dictionary_accept_default"
            render: ""
            representative: true
            validity: "valid"
            fact_refs:
              - "create_text_search_dictionary_fact_accept"
      -
        id: "create_text_search_dictionary_accept_true_class"
        meaning: "true"
        values:
          -
            id: "create_text_search_dictionary_accept_true"
            render: ", ACCEPT = true"
            representative: true
            validity: "valid"
            fact_refs:
              - "create_text_search_dictionary_fact_accept"
      -
        id: "create_text_search_dictionary_accept_false_class"
        meaning: "false"
        values:
          -
            id: "create_text_search_dictionary_accept_false"
            render: ", ACCEPT = false"
            representative: true
            validity: "valid"
            fact_refs:
              - "create_text_search_dictionary_fact_accept"
    default_value_id: "create_text_search_dictionary_accept_default"
rules: []
structural_checks: []
facts:
  -
    id: "create_text_search_dictionary_fact_purpose"
    type: "lifecycle"
    statement: "创建全文检索词典用于识别和处理词。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "create_text_search_dictionary_fact_internal"
    type: "environment"
    statement: "内部使用功能，不建议用户使用。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "create_text_search_dictionary_fact_sysadmin"
    type: "environment"
    statement: "创建需 SYSADMIN，创建者成为所有者。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "create_text_search_dictionary_fact_templates"
    type: "syntax"
    statement: "系统 pg_ts_template 预定义六类词典模板。"
    status: "confirmed"
    source_anchor: "L16-L18"
  -
    id: "create_text_search_dictionary_fact_no_temp"
    type: "constraint"
    statement: "pg_temp 不允许创建词典。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "create_text_search_dictionary_fact_file_refresh"
    type: "lifecycle"
    statement: "修改用户定义文件后需 ALTER 重新加载。"
    status: "confirmed"
    source_anchor: "L20-L21"
  -
    id: "create_text_search_dictionary_fact_syntax"
    type: "syntax"
    statement: "名称后 TEMPLATE 与重复 option=value 列表。"
    status: "confirmed"
    source_anchor: "L24-L27"
  -
    id: "create_text_search_dictionary_fact_name"
    type: "syntax"
    statement: "可指定模式，默认当前模式，标识符最长63字符。"
    status: "confirmed"
    source_anchor: "L33-L36"
  -
    id: "create_text_search_dictionary_fact_template"
    type: "constraint"
    statement: "模板须来自 pg_ts_template。"
    status: "confirmed"
    source_anchor: "L37-L39"
  -
    id: "create_text_search_dictionary_fact_simple"
    type: "behavior_oracle"
    statement: "Simple 转小写并移除停用词，非停用词可标未识别继续传递。"
    status: "confirmed"
    source_anchor: "L40-L44"
  -
    id: "create_text_search_dictionary_fact_synonym"
    type: "behavior_oracle"
    statement: "Synonym 进行同义词替换。"
    status: "confirmed"
    source_anchor: "L45-L45"
  -
    id: "create_text_search_dictionary_fact_thesaurus"
    type: "behavior_oracle"
    statement: "Thesaurus/TZ 表达词与短语关系，用首选词替换并可保留原词。"
    status: "confirmed"
    source_anchor: "L46-L49"
  -
    id: "create_text_search_dictionary_fact_ispell"
    type: "behavior_oracle"
    statement: "Ispell 将多语言词形变化规范为词位。"
    status: "confirmed"
    source_anchor: "L50-L54"
  -
    id: "create_text_search_dictionary_fact_snowball"
    type: "behavior_oracle"
    statement: "Snowball 按 LANGUAGE 使用词干算法，可 STOPWORDS。"
    status: "confirmed"
    source_anchor: "L55-L58"
  -
    id: "create_text_search_dictionary_fact_tokenweight"
    type: "behavior_oracle"
    statement: "Tokenweight 调整词汇权重。"
    status: "confirmed"
    source_anchor: "L59-L60"
  -
    id: "create_text_search_dictionary_fact_options"
    type: "syntax"
    statement: "参数列表由模板决定。"
    status: "confirmed"
    source_anchor: "L61-L63"
  -
    id: "create_text_search_dictionary_fact_simple_stop"
    type: "constraint"
    statement: "STOPWORDS 默认 .stop，每行一个词，忽略空白且转小写。"
    status: "confirmed"
    source_anchor: "L65-L69"
  -
    id: "create_text_search_dictionary_fact_accept"
    type: "behavior_oracle"
    statement: "ACCEPT 默认 true 识别非停用词且不继续传递；false 传后继，位于末尾不生效。"
    status: "confirmed"
    source_anchor: "L71-L77"
  -
    id: "create_text_search_dictionary_fact_simple_path"
    type: "constraint"
    statement: "Simple FILEPATH 为本地绝对目录，与 STOPWORDS 同设不能单独设。"
    status: "confirmed"
    source_anchor: "L79-L82"
  -
    id: "create_text_search_dictionary_fact_synonym_file"
    type: "constraint"
    statement: "Synonym 定义文件默认 .syn，每行 token 与 synonym 空格相连。"
    status: "confirmed"
    source_anchor: "L83-L88"
  -
    id: "create_text_search_dictionary_fact_case_sensitive"
    type: "behavior_oracle"
    statement: "Synonym CASESENSITIVE 默认 false，true 不转小写。"
    status: "confirmed"
    source_anchor: "L90-L92"
  -
    id: "create_text_search_dictionary_fact_synonym_path"
    type: "syntax"
    statement: "Synonym FILEPATH 默认为预定义目录，可 file:// 绝对路径。"
    status: "confirmed"
    source_anchor: "L94-L96"
  -
    id: "create_text_search_dictionary_fact_thesaurus_file"
    type: "constraint"
    statement: "Thesaurus DICTFILE 默认 .ths，sample words 冒号 indexed words，多匹配选最长。"
    status: "confirmed"
    source_anchor: "L97-L105"
  -
    id: "create_text_search_dictionary_fact_subdictionary"
    type: "constraint"
    statement: "Thesaurus 必需唯一已存在子词典，sample 必须识别，indexed 可加 * 跳过识别。"
    status: "confirmed"
    source_anchor: "L107-L113"
  -
    id: "create_text_search_dictionary_fact_thesaurus_stop"
    type: "behavior_oracle"
    statement: "sample 中停用词用 ? 替代，示例展示两短语同输出。"
    status: "confirmed"
    source_anchor: "L114-L120"
  -
    id: "create_text_search_dictionary_fact_thesaurus_path"
    type: "syntax"
    statement: "Thesaurus FILEPATH 为 file:// 绝对目录，默认预定义目录。"
    status: "confirmed"
    source_anchor: "L122-L124"
  -
    id: "create_text_search_dictionary_fact_ispell_dict"
    type: "syntax"
    statement: "Ispell DICTFILE 默认 .dict。"
    status: "confirmed"
    source_anchor: "L125-L128"
  -
    id: "create_text_search_dictionary_fact_ispell_aff"
    type: "syntax"
    statement: "Ispell AFFFILE 默认 .affix。"
    status: "confirmed"
    source_anchor: "L130-L131"
  -
    id: "create_text_search_dictionary_fact_ispell_stop"
    type: "syntax"
    statement: "Ispell STOPWORDS 默认 .stop，格式同 Simple。"
    status: "confirmed"
    source_anchor: "L133-L135"
  -
    id: "create_text_search_dictionary_fact_ispell_path"
    type: "syntax"
    statement: "Ispell FILEPATH 为本地绝对目录。"
    status: "confirmed"
    source_anchor: "L137-L139"
  -
    id: "create_text_search_dictionary_fact_snowball_language"
    type: "syntax"
    statement: "Snowball LANGUAGE 选择语言词干算法。"
    status: "confirmed"
    source_anchor: "L140-L144"
  -
    id: "create_text_search_dictionary_fact_snowball_stop"
    type: "syntax"
    statement: "Snowball STOPWORDS 默认 .stop，格式同 Simple。"
    status: "confirmed"
    source_anchor: "L146-L148"
  -
    id: "create_text_search_dictionary_fact_snowball_path"
    type: "constraint"
    statement: "Snowball FILEPATH 必须同时指定 STOPWORDS。"
    status: "confirmed"
    source_anchor: "L150-L153"
  -
    id: "create_text_search_dictionary_fact_tokenfile"
    type: "constraint"
    statement: "TOKENFILE 默认 .tokw，忽略空行/#注释/首尾空格。"
    status: "confirmed"
    source_anchor: "L154-L160"
  -
    id: "create_text_search_dictionary_fact_weight"
    type: "constraint"
    statement: "词权重数值可小数或整数默认3，越高越容易组合为词。"
    status: "confirmed"
    source_anchor: "L161-L163"
  -
    id: "create_text_search_dictionary_fact_similarity"
    type: "constraint"
    statement: "相似度0至1默认0.8且为单向关系，双向需反向另一行。"
    status: "confirmed"
    source_anchor: "L164-L168"
  -
    id: "create_text_search_dictionary_fact_stopfile"
    type: "syntax"
    statement: "Tokenweight STOPFILE 默认 .stop，格式同 Simple。"
    status: "confirmed"
    source_anchor: "L170-L172"
  -
    id: "create_text_search_dictionary_fact_token_path"
    type: "constraint"
    statement: "Tokenweight FILEPATH 必须同设 STOPFILE 或 TOKENFILE。"
    status: "confirmed"
    source_anchor: "L174-L178"
  -
    id: "create_text_search_dictionary_fact_filename"
    type: "constraint"
    statement: "定义文件名仅小写字母/数字/下划线混合。"
    status: "confirmed"
    source_anchor: "L181-L181"
  -
    id: "create_text_search_dictionary_fact_value"
    type: "syntax"
    statement: "字符串必须单引号，标识符和数字也可单引号。"
    status: "confirmed"
    source_anchor: "L182-L184"
  -
    id: "create_text_search_dictionary_fact_config_components"
    type: "behavior_oracle"
    statement: "文本配置包含解析器与按 token 转词位的词典列表。"
    status: "confirmed"
    source_anchor: "L187-L191"
  -
    id: "create_text_search_dictionary_fact_default_config"
    type: "environment"
    statement: "to_tsvector/to_tsquery 未指定配置时采用 default_text_search_config。"
    status: "confirmed"
    source_anchor: "L193-L195"
  -
    id: "create_text_search_dictionary_fact_metadata_commands"
    type: "metadata_oracle"
    statement: "预定义与自定义配置可通过 gsql 元命令显示。"
    status: "confirmed"
    source_anchor: "L197-L199"
  -
    id: "create_text_search_dictionary_fact_copy_example"
    type: "example"
    statement: "复制 english 配置。"
    status: "confirmed"
    source_anchor: "L201-L205"
  -
    id: "create_text_search_dictionary_fact_synonym_example"
    type: "example"
    statement: "示例用 SYNONYMS 及本地文件目录创建词典。"
    status: "confirmed"
    source_anchor: "L207-L216"
  -
    id: "create_text_search_dictionary_fact_ispell_example"
    type: "example"
    statement: "外部开源 Ispell 文件示例。"
    status: "confirmed"
    source_anchor: "L219-L226"
  -
    id: "create_text_search_dictionary_fact_mapping_example"
    type: "example"
    statement: "按顺序配置三词典。"
    status: "confirmed"
    source_anchor: "L228-L232"
  -
    id: "create_text_search_dictionary_fact_debug_example"
    type: "example"
    statement: "移除指定 token 并 ts_debug 调试。"
    status: "confirmed"
    source_anchor: "L234-L243"
  -
    id: "create_text_search_dictionary_fact_display_example"
    type: "example"
    statement: "gsql 配置映射输出。"
    status: "confirmed"
    source_anchor: "L245-L254"
  -
    id: "create_text_search_dictionary_fact_session_example"
    type: "example"
    statement: "设置会话默认配置并 SHOW。"
    status: "confirmed"
    source_anchor: "L267-L274"
  -
    id: "create_text_search_dictionary_fact_synonym_spelling"
    type: "constraint"
    statement: "参数说明使用SYNONYM而示例使用SYNONYMS；静态域不生成该文件依赖分支，保留来源冲突。"
    status: "confirmed"
    source_anchor: "L83-L88"
  -
    id: "create_text_search_dictionary_fact_template_profiles"
    type: "environment"
    statement: "静态域仅生成无文件Simple；Ispell/Synonym/Thesaurus/Snowball/Tokenweight需模板专属输入与文件或语言能力。"
    status: "confirmed"
    source_anchor: "L16-L18"
  -
    id: "create_text_search_dictionary_fact_authorized_profile"
    type: "environment"
    statement: "静态候选要求SYSADMIN与内部功能测试授权，不自动提权。"
    status: "confirmed"
    source_anchor: "L14-L15"
exported_fact_refs:
