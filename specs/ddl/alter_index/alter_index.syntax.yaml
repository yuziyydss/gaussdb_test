schema_version: 1
kind: "syntax"
id: "syntax_alter_index"
name: "ALTER INDEX 语法"
factor_ref: "alter_index"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  action:
    type: "token"
    optional: true
    dimension_ref: "alter_index.action"
  if_exists:
    type: "token"
    optional: true
    dimension_ref: "alter_index.if_exists"
  index_name:
    type: "token"
    optional: true
    dimension_ref: "alter_index.index_name"
  partition_name:
    type: "token"
    optional: true
    dimension_ref: "alter_index.partition_name"
  new_name:
    type: "token"
    optional: true
    dimension_ref: "alter_index.new_name"
  new_partition:
    type: "token"
    optional: true
    dimension_ref: "alter_index.new_partition"
  tablespace:
    type: "token"
    optional: true
    dimension_ref: "alter_index.tablespace"
  storage_parameters:
    type: "token"
    optional: true
    dimension_ref: "alter_index.storage_parameters"
  reset_parameters:
    type: "token"
    optional: true
    dimension_ref: "alter_index.reset_parameters"
source_fact_refs:
  - "alter_index_fact_rename_syntax"
  - "alter_index_fact_tablespace_syntax"
  - "alter_index_fact_set_syntax"
  - "alter_index_fact_reset_syntax"
  - "alter_index_fact_unusable_syntax"
  - "alter_index_fact_rebuild_syntax"
  - "alter_index_fact_rename_partition_syntax"
  - "alter_index_fact_move_partition_syntax"
  - "alter_index_fact_visible_syntax"
  - "alter_index_fact_invisible_syntax"
  - "alter_index_fact_name"
  - "alter_index_fact_new_name"
  - "alter_index_fact_tablespace_name"
  - "alter_index_fact_storage_value"
  - "alter_index_fact_new_partition"
  - "alter_index_fact_partition_name"
  - "alter_index_fact_new_tablespace"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "ALTER INDEX "
    -
      kind: "choice"
      selector: "action"
      branches:
        alter_index_action_rebuild:
          kind: "literal"
          text: ""
        alter_index_action_rebuild_partition:
          kind: "literal"
          text: ""
        "*":
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "if_exists"
            -
              kind: "literal"
              text: " "
    -
      kind: "slot"
      slot: "index_name"
    -
      kind: "literal"
      text: " "
    -
      kind: "choice"
      selector: "action"
      branches:
        alter_index_action_rename:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "RENAME TO "
            -
              kind: "slot"
              slot: "new_name"
        alter_index_action_tablespace:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "SET TABLESPACE "
            -
              kind: "slot"
              slot: "tablespace"
        alter_index_action_set:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "SET ("
            -
              kind: "repeat"
              slot: "storage_parameters"
              separator: ", "
              items_property: "items"
            -
              kind: "literal"
              text: ")"
        alter_index_action_reset:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "RESET ("
            -
              kind: "repeat"
              slot: "reset_parameters"
              separator: ", "
              items_property: "items"
            -
              kind: "literal"
              text: ")"
        alter_index_action_unusable:
          kind: "literal"
          text: "UNUSABLE"
        alter_index_action_unusable_partition:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "MODIFY PARTITION "
            -
              kind: "slot"
              slot: "partition_name"
            -
              kind: "literal"
              text: " UNUSABLE"
        alter_index_action_rebuild:
          kind: "literal"
          text: "REBUILD"
        alter_index_action_rebuild_partition:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "REBUILD PARTITION "
            -
              kind: "slot"
              slot: "partition_name"
        alter_index_action_rename_partition:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "RENAME PARTITION "
            -
              kind: "slot"
              slot: "partition_name"
            -
              kind: "literal"
              text: " TO "
            -
              kind: "slot"
              slot: "new_partition"
        alter_index_action_move_partition:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "MOVE PARTITION "
            -
              kind: "slot"
              slot: "partition_name"
            -
              kind: "literal"
              text: " TABLESPACE "
            -
              kind: "slot"
              slot: "tablespace"
        alter_index_action_visible:
          kind: "literal"
          text: "VISIBLE"
        alter_index_action_invisible:
          kind: "literal"
          text: "INVISIBLE"
