schema_version: 1
kind: "fixture"
id: "fixture_alter_index_regular"
name: "ALTER INDEX regular"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "alter_index"
requires_fixture_refs:
  - "fixture_create_index_astore_regular"
provides: {}
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "DROP INDEX IF EXISTS idx_ai_missing;"
    - "DROP INDEX IF EXISTS idx_ai_new;"
    - "CREATE INDEX idx_ai_regular ON t_ci_astore(id);"
  teardown_sqls:
    - "DROP INDEX IF EXISTS idx_ai_new;"
    - "DROP INDEX IF EXISTS idx_ai_regular;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
