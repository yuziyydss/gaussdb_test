schema_version: 1
kind: "manifest"
id: "manifest_alter_index_visibility"
name: "ALTER INDEX visibility"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "alter_index"
syntax_ref: "syntax_alter_index"
suite_type: "positive"
strategy: "pairwise"
fixture_refs: []
identifier_policy: {}
bindings:
  action:
    - "alter_index_action_visible"
    - "alter_index_action_invisible"
  if_exists:
    - "alter_index_if_exists_absent"
    - "alter_index_if_exists_present"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "upgrade_stage"
    allowed_values:
      - "normal_or_committed"
    fact_refs:
      - "alter_index_fact_upgrade"
  -
    key: "visibility_keywords_enabled"
    allowed_values:
      - "true"
    fact_refs:
      - "alter_index_fact_visible_gate"
      - "alter_index_fact_invisible_gate"
