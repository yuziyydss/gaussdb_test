facts:
  -
    id: "alter_index_fact_purpose"
    type: "lifecycle"
    statement: "修改现有索引属性。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "alter_index_fact_permission"
    type: "environment"
    statement: "索引所有者、基表 INDEX 权限或 ALTER ANY INDEX 权限用户可执行；三权分立关闭时管理员默认可执行。"
    status: "confirmed"
    source_anchor: "L8-L10"
  -
    id: "alter_index_fact_invisible_cost"
    type: "behavior_oracle"
    statement: "同一基表大量不可见索引可能影响 DML 性能，不保证固定变慢比例。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "alter_index_fact_rowid_limit"
    type: "constraint"
    statement: "rowid 系统列索引仅支持表空间迁移与索引/分区重建。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "alter_index_fact_rowid_gap"
    type: "environment"
    statement: "静态候选不建立rowid系统列索引；系统生成对象的受控前置需专用索引环境。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "alter_index_fact_rename_syntax"
    type: "syntax"
    statement: "RENAME TO 更改索引名称。"
    status: "confirmed"
    source_anchor: "L16-L18"
  -
    id: "alter_index_fact_tablespace_syntax"
    type: "syntax"
    statement: "SET TABLESPACE 更改索引表空间。"
    status: "confirmed"
    source_anchor: "L20-L22"
  -
    id: "alter_index_fact_set_syntax"
    type: "syntax"
    statement: "SET 括号内为逗号分隔的存储参数赋值。"
    status: "confirmed"
    source_anchor: "L27-L29"
  -
    id: "alter_index_fact_reset_syntax"
    type: "syntax"
    statement: "RESET 括号内为存储参数名称列表。"
    status: "confirmed"
    source_anchor: "L34-L36"
  -
    id: "alter_index_fact_unusable_syntax"
    type: "syntax"
    statement: "UNUSABLE 前可加 MODIFY PARTITION。"
    status: "confirmed"
    source_anchor: "L41-L43"
  -
    id: "alter_index_fact_rebuild_syntax"
    type: "syntax"
    statement: "REBUILD 后可加 PARTITION；该产生式不含 IF EXISTS。"
    status: "confirmed"
    source_anchor: "L48-L50"
  -
    id: "alter_index_fact_rename_partition_syntax"
    type: "syntax"
    statement: "RENAME PARTITION 原名 TO 新名。"
    status: "confirmed"
    source_anchor: "L55-L57"
  -
    id: "alter_index_fact_move_partition_syntax"
    type: "syntax"
    statement: "MOVE PARTITION 分区名 TABLESPACE 新表空间。"
    status: "confirmed"
    source_anchor: "L62-L64"
  -
    id: "alter_index_fact_visible_syntax"
    type: "syntax"
    statement: "VISIBLE 设置可见。"
    status: "confirmed"
    source_anchor: "L66-L67"
  -
    id: "alter_index_fact_invisible_syntax"
    type: "syntax"
    statement: "INVISIBLE 设置不可见。"
    status: "confirmed"
    source_anchor: "L75-L76"
  -
    id: "alter_index_fact_upgrade"
    type: "environment"
    statement: "升级未提交阶段不支持可见性语法。"
    status: "confirmed"
    source_anchor: "L74-L74"
  -
    id: "alter_index_fact_standby_plan"
    type: "behavior_oracle"
    statement: "备机读场景中设为不可见可能改变查询计划和性能。"
    status: "confirmed"
    source_anchor: "L84-L85"
  -
    id: "alter_index_fact_name"
    type: "syntax"
    statement: "index_name 为待修改索引名。"
    status: "confirmed"
    source_anchor: "L89-L90"
  -
    id: "alter_index_fact_notice"
    type: "behavior_oracle"
    statement: "缺失索引带 IF EXISTS 返回 NOTICE，不直接产生 ERROR。"
    status: "confirmed"
    source_anchor: "L91-L93"
  -
    id: "alter_index_fact_rename_data"
    type: "lifecycle"
    statement: "重命名只变名称，不影响存储数据。"
    status: "confirmed"
    source_anchor: "L94-L97"
  -
    id: "alter_index_fact_new_name"
    type: "syntax"
    statement: "新索引名须符合标识符规范。"
    status: "confirmed"
    source_anchor: "L94-L97"
  -
    id: "alter_index_fact_tablespace_move"
    type: "lifecycle"
    statement: "SET TABLESPACE 将索引数据文件移动到指定表空间。"
    status: "confirmed"
    source_anchor: "L98-L102"
  -
    id: "alter_index_fact_tablespace_existing"
    type: "environment"
    statement: "目标表空间必须已存在。"
    status: "confirmed"
    source_anchor: "L98-L102"
  -
    id: "alter_index_fact_tablespace_name"
    type: "syntax"
    statement: "tablespace_name 是目标表空间名。"
    status: "confirmed"
    source_anchor: "L98-L102"
  -
    id: "alter_index_fact_set_deferred"
    type: "lifecycle"
    statement: "SET 存储参数不立即改写索引内容，部分参数需 REINDEX 后才完全生效。"
    status: "confirmed"
    source_anchor: "L103-L106"
  -
    id: "alter_index_fact_active_pages"
    type: "behavior_oracle"
    statement: "ACTIVE_PAGES 表示索引页面数量，可能小于物理文件页数，可用于调优。"
    status: "confirmed"
    source_anchor: "L107-L111"
  -
    id: "alter_index_fact_active_scope"
    type: "environment"
    statement: "ACTIVE_PAGES 当前只对 Ustore 分区表 LOCAL 索引生效。"
    status: "confirmed"
    source_anchor: "L107-L111"
  -
    id: "alter_index_fact_active_refresh"
    type: "lifecycle"
    statement: "VACUUM/ANALYZE（含自动任务）会更新 ACTIVE_PAGES，不建议人工设置。"
    status: "confirmed"
    source_anchor: "L107-L111"
  -
    id: "alter_index_fact_storage_gap"
    type: "constraint"
    statement: "静态域仅生成FILLFACTOR=70与RESET FILLFACTOR；ACTIVE_PAGES、其他方法和多参数组合保留为来源限制。"
    status: "confirmed"
    source_anchor: "L107-L111"
  -
    id: "alter_index_fact_storage_value"
    type: "syntax"
    statement: "存储参数值按方法可为数字或字符串。"
    status: "confirmed"
    source_anchor: "L113-L115"
  -
    id: "alter_index_fact_reset_deferred"
    type: "lifecycle"
    statement: "RESET 恢复存储参数默认值，可能需要 REINDEX 完全更新。"
    status: "confirmed"
    source_anchor: "L116-L118"
  -
    id: "alter_index_fact_unusable"
    type: "lifecycle"
    statement: "将索引或其分区设置为不可用。"
    status: "confirmed"
    source_anchor: "L119-L120"
  -
    id: "alter_index_fact_unique_unusable"
    type: "environment"
    statement: "不可用唯一索引对应 INSERT/UPDATE 行为由 enable_unique_checking_of_unusable_index 控制。"
    status: "confirmed"
    source_anchor: "L123-L124"
  -
    id: "alter_index_fact_rebuild"
    type: "lifecycle"
    statement: "REBUILD 重建普通索引或指定分区。"
    status: "confirmed"
    source_anchor: "L125-L126"
  -
    id: "alter_index_fact_parallel_rebuild"
    type: "constraint"
    statement: "lpi_parallel_method=PARTITION 且表 parallel_workers>0 时不支持并行重建。"
    status: "confirmed"
    source_anchor: "L127-L130"
  -
    id: "alter_index_fact_parallel_default"
    type: "behavior_oracle"
    statement: "无 LPI 选项或 AUTO 时，并行重建默认采用页面级方式。"
    status: "confirmed"
    source_anchor: "L127-L130"
  -
    id: "alter_index_fact_parallel_gap"
    type: "environment"
    statement: "静态域仅普通离线重建；并行触发条件和禁用组合需专用资源与参数环境。"
    status: "confirmed"
    source_anchor: "L127-L130"
  -
    id: "alter_index_fact_rename_partition"
    type: "lifecycle"
    statement: "可重命名索引分区。"
    status: "confirmed"
    source_anchor: "L131-L132"
  -
    id: "alter_index_fact_move_partition"
