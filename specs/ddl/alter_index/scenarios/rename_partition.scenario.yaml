schema_version: 1
kind: "scenario"
id: "scenario_alter_index_rename_partition"
name: "ALTER INDEX rename_partition"
status: "planned"
description: "命名与分区元数据；未执行。"
factor_ref: "alter_index"
fixture_refs:
  - "fixture_alter_index_partitioned"
fact_refs:
  - "alter_index_fact_rename_partition"
  - "alter_index_fact_move_partition"
preconditions: []
steps:
  -
    id: "rename"
    action: "execute_sql"
    sql: "ALTER INDEX idx_ai_local RENAME PARTITION p_ai_low TO p_ai_renamed;"
  -
    id: "query"
    action: "execute_sql"
    sql: "SELECT relname FROM pg_partition WHERE parentid = 'idx_ai_local'::regclass ORDER BY relname;"
oracles:
  -
    after_step: "query"
    kind: "result_rows"
    expected:
      -
        - "p_ai_max"
      -
        - "p_ai_renamed"
execution_requirements:
  - "database"
  - "same_session"
