facts:
- id: m_drop_view_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.9.19 L2-2
- id: m_drop_view_fact_syntax
  type: syntax
  statement: "原文语法片段（仅此来源区间，不等同完整生成能力）：DROP VIEW [ IF EXISTS ] view_name [, ...] [ CASCADE | RESTRICT ]; "
  status: confirmed
  source_anchor: 2.4.2.9.19 L13-14
- id: m_drop_view_fact_authority
  type: environment
  statement: 对象所有者、所在模式所有者、持有对象DROP权限或DROP ANY TABLE权限的用户可删除；三权分立关闭时系统管理员默认有权。
  status: confirmed
  source_anchor: 2.4.2.9.19 L8-10
- id: m_drop_view_fact_dependency_version
  type: environment
  statement: s1 及以上 CASCADE/RESTRICT 仅语法支持，不能宣称级联行为。
  status: confirmed
  source_anchor: 2.4.2.9.19 L29-30
- id: m_drop_view_fact_purpose
  type: example
  statement: 删除视图。视图删除不影响底层基表。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_drop_view_fact_constraint
  type: example
  statement: 视图的所有者、视图所在模式的所有者、被授予了视图DROP权限的用户或拥有DROP ANY TABLE权限的用户可以执行DROP VIEW的命令，三权分立关闭时的系统管理员默
  status: confirmed
  source_anchor: M-Compatibility L7-7
- id: m_drop_view_fact_params
  type: example
  statement: ●    IF EXISTS 如果指定的视图不存在，则发出一个notice而不是抛出一个错误。 ●    view_name
  status: confirmed
  source_anchor: M-Compatibility L16-20
