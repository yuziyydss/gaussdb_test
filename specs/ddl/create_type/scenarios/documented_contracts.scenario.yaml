schema_version: 1
kind: "scenario"
id: "scenario_create_type_documented_contracts"
name: "CREATE TYPE documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "create_type"
fixture_refs: []
fact_refs:
  - "create_type_fact_purpose"
  - "create_type_fact_composite_usage"
  - "create_type_fact_shell"
  - "create_type_fact_enum_limit"
  - "create_type_fact_unique"
  - "create_type_fact_owner"
  - "create_type_fact_any_type"
  - "create_type_fact_row_only"
  - "create_type_fact_io_risk"
  - "create_type_fact_named_a"
  - "create_type_fact_named_contiguous"
  - "create_type_fact_base_required"
  - "create_type_fact_input_signature"
  - "create_type_fact_input_null"
  - "create_type_fact_shell_lifecycle"
  - "create_type_fact_internal_io"
  - "create_type_fact_output_signature"
  - "create_type_fact_receive_optional"
  - "create_type_fact_receive_signature"
  - "create_type_fact_receive_null"
  - "create_type_fact_send_signature"
  - "create_type_fact_typmod_storage"
  - "create_type_fact_typmod_validation"
  - "create_type_fact_typmod_missing"
  - "create_type_fact_typmod_output_contract"
  - "create_type_fact_analyze"
  - "create_type_fact_length_layout"
  - "create_type_fact_by_value"
  - "create_type_fact_alignment_variable"
  - "create_type_fact_plain"
  - "create_type_fact_extended"
  - "create_type_fact_external"
  - "create_type_fact_main"
  - "create_type_fact_toast"
  - "create_type_fact_implicit_cast"
  - "create_type_fact_collatable_behavior"
  - "create_type_fact_label_characters"
  - "create_type_fact_array_type"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "在当前数据库定义新数据类型。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "创建复合类型需拥有所有属性类型USAGE权限。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "仅CREATE TYPE名称创建shell占位类型，供基本类型前向引用。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "枚举标签为非空字符串且长度不超过63字节。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "类型名不能与同模式已有类型或表重名。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "创建者成为类型所有者。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "CREATE ANY TYPE权限可在PUBLIC及用户模式创建。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "类型仅适用于行存表。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "非系统类型关联函数使用不当可能导致权限滥用，需审核类型和函数定义。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "复合类型构造器命名赋值=>仅兼容A模式支持。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "命名=>赋值必须连续使用至最后一个参数，不可在其后跟位置参数。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "基本类型参数可任意顺序，INPUT和OUTPUT必须指定。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "INPUT从外部文本转换内部表示，参数可为cstring或cstring/oid/integer。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "输入函数返回新类型；建议STRICT，否则NULL输入仍须返回NULL或报错。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "先shell、再C写I/O函数、最后完整CREATE TYPE替换shell为合法类型。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "INTERNAL系统I/O函数的参数类型和新类型长度及传值属性需一致。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "OUTPUT接受新类型返回cstring，NULL不调用。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "缺少RECEIVE不能二进制输入；接收器须检查输入值有效性。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "RECEIVE参数可为internal或internal/oid/integer。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "接收函数返回新类型；非STRICT接收NULL时仍须返回NULL或报错。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "SEND可选，接受新类型返回bytea；缺少则不能二进制输出，NULL不调用。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "修饰符可为简单常量或标识符，但为存目录须打包为非负整数。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "TYPMOD_IN接收cstring数组，非法值报错，合法值返回非负integer存typmod。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "没有TYPMOD_IN则拒绝类型修饰符。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "TYPMOD_OUT返回追加到类型名后的cstring；默认括号整数显示可省略。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "ANALYZE函数可覆盖默认Btree相等/小于统计，签名internal到boolean。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "定长为正整数，变长VARIABLE且typlen=-1，变长表示必须以4字节整数开始。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "PASSEDBYVALUE仅可用于定长且长度不超过Datum尺寸的类型。"
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "对齐边界1/2/4/8字节，变长类型至少4字节对齐。"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "plain在线内且不压缩，定长仅允许plain。"
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "extended先压缩，仍过长再移出主表行。"
  -
    id: "contract_31"
    action: "verify_documented_contract"
    note: "external允许移出主表但不压缩。"
  -
    id: "contract_32"
    action: "verify_documented_contract"
    note: "main允许压缩并优先保留主表，必要时仍可移出。"
  -
    id: "contract_33"
    action: "verify_documented_contract"
    note: "非plain类型函数需支持TOAST，列级SET STORAGE可覆盖默认策略。"
  -
    id: "contract_34"
    action: "verify_documented_contract"
    note: "分类及首选类型影响同类类型之间为消除重载歧义的隐式转换选择。"
  -
    id: "contract_35"
    action: "verify_documented_contract"
    note: "标记collatable允许传递排序信息，函数实现仍需真正使用该信息。"
  -
    id: "contract_36"
    action: "verify_documented_contract"
    note: "参数说明将label上限写成63字符且非空，与功能描述的字节口径有差异。"
  -
    id: "contract_37"
    action: "verify_documented_contract"
    note: "创建用户类型时自动创建以下划线前缀命名的关联数组类型。"
oracles:
  -
    kind: "documented_behavior"
    expected: "缺少RECEIVE不能二进制输入；接收器须检查输入值有效性。"
  -
    kind: "documented_behavior"
    expected: "TYPMOD_IN接收cstring数组，非法值报错，合法值返回非负integer存typmod。"
  -
    kind: "documented_behavior"
    expected: "没有TYPMOD_IN则拒绝类型修饰符。"
  -
    kind: "documented_behavior"
    expected: "plain在线内且不压缩，定长仅允许plain。"
  -
    kind: "documented_behavior"
    expected: "extended先压缩，仍过长再移出主表行。"
  -
    kind: "documented_behavior"
    expected: "external允许移出主表但不压缩。"
  -
    kind: "documented_behavior"
    expected: "main允许压缩并优先保留主表，必要时仍可移出。"
  -
    kind: "documented_behavior"
    expected: "分类及首选类型影响同类类型之间为消除重载歧义的隐式转换选择。"
  -
    kind: "documented_behavior"
    expected: "标记collatable允许传递排序信息，函数实现仍需真正使用该信息。"
execution_requirements:
  - "database"
  - "same_session"
