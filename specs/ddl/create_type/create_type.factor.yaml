facts:
  -
    id: "create_type_fact_purpose"
    type: "lifecycle"
    statement: "在当前数据库定义新数据类型。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_type_fact_forms"
    type: "syntax"
    statement: "支持复合、基本、shell、枚举、集合五种类型。"
    status: "confirmed"
    source_anchor: "L7-L8"
  -
    id: "create_type_fact_composite"
    type: "syntax"
    statement: "复合类型为属性名和数据类型列表，可排序属性允许COLLATE；不创建实际表。"
    status: "confirmed"
    source_anchor: "L10-L14"
  -
    id: "create_type_fact_composite_usage"
    type: "environment"
    statement: "创建复合类型需拥有所有属性类型USAGE权限。"
    status: "confirmed"
    source_anchor: "L15-L15"
  -
    id: "create_type_fact_base"
    type: "syntax"
    statement: "可自定义基本标量类型。"
    status: "confirmed"
    source_anchor: "L16-L17"
  -
    id: "create_type_fact_shell"
    type: "lifecycle"
    statement: "仅CREATE TYPE名称创建shell占位类型，供基本类型前向引用。"
    status: "confirmed"
    source_anchor: "L18-L21"
  -
    id: "create_type_fact_enum_limit"
    type: "constraint"
    statement: "枚举标签为非空字符串且长度不超过63字节。"
    status: "confirmed"
    source_anchor: "L22-L24"
  -
    id: "create_type_fact_collection"
