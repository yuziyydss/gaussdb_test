    status: "confirmed"
    source_anchor: "L25-L26"
  -
    id: "create_type_fact_schema"
    type: "syntax"
    statement: "显式模式则在该模式创建，否则使用当前模式。"
    status: "confirmed"
    source_anchor: "L30-L31"
  -
    id: "create_type_fact_unique"
    type: "constraint"
    statement: "类型名不能与同模式已有类型或表重名。"
    status: "confirmed"
    source_anchor: "L32-L33"
  -
    id: "create_type_fact_owner"
