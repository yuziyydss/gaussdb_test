schema_version: 1
kind: "syntax"
id: "syntax_create_type"
name: "CREATE TYPE 语法"
factor_ref: "create_type"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "create_type.form"
  attributes:
    type: "token"
    optional: true
    dimension_ref: "create_type.attributes"
  labels:
    type: "token"
    optional: true
    dimension_ref: "create_type.labels"
  type_name:
    type: "identifier"
    optional: false
source_fact_refs:
  - "create_type_fact_syntax_composite"
  - "create_type_fact_syntax_enum"
  - "create_type_fact_syntax_shell"
  - "create_type_fact_syntax_collection"
  - "create_type_fact_forms"
  - "create_type_fact_composite"
  - "create_type_fact_base"
  - "create_type_fact_collection"
  - "create_type_fact_schema"
  - "create_type_fact_name"
  - "create_type_fact_attribute"
  - "create_type_fact_attribute_type"
  - "create_type_fact_collation"
  - "create_type_fact_input_cstring"
  - "create_type_fact_input_oid"
  - "create_type_fact_input_typmod"
  - "create_type_fact_receive_internal"
  - "create_type_fact_receive_oid_typmod"
  - "create_type_fact_typmod_in"
  - "create_type_fact_typmod_out"
  - "create_type_fact_length_default"
  - "create_type_fact_alignment"
  - "create_type_fact_storage"
  - "create_type_fact_like"
  - "create_type_fact_category"
  - "create_type_fact_preferred"
  - "create_type_fact_category_choice"
  - "create_type_fact_default"
  - "create_type_fact_element"
  - "create_type_fact_delimiter"
  - "create_type_fact_collatable"
  - "create_type_fact_syntax_base_required"
  - "create_type_fact_syntax_base_functions"
  - "create_type_fact_syntax_base_layout"
  - "create_type_fact_syntax_base_values"
  - "create_type_fact_syntax_passed"
  - "create_type_fact_syntax_alignment"
  - "create_type_fact_syntax_storage"
  - "create_type_fact_syntax_like"
  - "create_type_fact_syntax_category"
  - "create_type_fact_syntax_preferred"
  - "create_type_fact_syntax_element"
  - "create_type_fact_syntax_delimiter"
  - "create_type_fact_syntax_collatable"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "CREATE TYPE "
    -
      kind: "slot"
      slot: "type_name"
    -
      kind: "choice"
      selector: "form"
      branches:
        create_type_form_composite:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: " AS ("
            -
              kind: "optional"
              selector: "attributes"
              enabled_values:
                - "create_type_attributes_one"
                - "create_type_attributes_two"
              item:
                kind: "repeat"
                slot: "attributes"
                separator: ", "
                items_property: "items"
            -
              kind: "literal"
              text: ")"
        create_type_form_enum:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: " AS ENUM ("
            -
              kind: "optional"
              selector: "labels"
              enabled_values:
                - "create_type_labels_one"
                - "create_type_labels_three"
                - "create_type_labels_max_ascii"
              item:
                kind: "repeat"
                slot: "labels"
                separator: ", "
                items_property: "items"
            -
              kind: "literal"
              text: ")"
        create_type_form_shell:
          kind: "literal"
          text: ""
        create_type_form_collection:
          kind: "literal"
          text: " AS TABLE OF INTEGER"
