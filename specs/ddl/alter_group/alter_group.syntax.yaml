schema_version: 1
kind: "syntax"
id: "syntax_alter_group"
name: "ALTER GROUP 语法"
factor_ref: "alter_group"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "alter_group.form"
  members:
    type: "token"
    optional: true
    dimension_ref: "alter_group.members"
source_fact_refs:
  - "create_group::create_group_fact_role_alias"
  - "alter_group_fact_add_syntax"
  - "alter_group_fact_drop_syntax"
  - "alter_group_fact_rename_syntax"
  - "alter_group_fact_rename"
ast:
  kind: "choice"
  selector: "form"
  branches:
    alter_group_form_add:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER GROUP b9_role_a ADD USER "
        -
          kind: "repeat"
          slot: "members"
          separator: ", "
          items_property: "items"
    alter_group_form_remove:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER GROUP b9_role_a DROP USER "
        -
          kind: "repeat"
          slot: "members"
          separator: ", "
          items_property: "items"
    alter_group_form_rename:
      kind: "literal"
      text: "ALTER GROUP b9_role_a RENAME TO b9_group_renamed"
