schema_version: 1
kind: "fixture"
id: "fixture_alter_group_renamed_group"
name: "ALTER GROUP renamed_group"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "alter_group"
requires_fixture_refs:
  - "fixture_alter_group_isolated_roles"
provides: {}
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "SELECT 1 / (1 - COUNT(*)) AS assert_group_name_absent FROM gs_roles WHERE rolname = 'b9_group_renamed';"
  teardown_sqls:
    - "DROP ROLE IF EXISTS b9_group_renamed;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
