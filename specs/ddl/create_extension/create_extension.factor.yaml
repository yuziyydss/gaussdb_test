    statement: "扩展可能导致兼容风险，创建必须设置enable_extension=true。"
    status: "confirmed"
    source_anchor: "L25-L27"
  -
    id: "create_extension_fact_schema_special"
    type: "constraint"
    statement: "特殊字符开关off且脚本使用@extschema@时，control schema不能包含列出的特殊字符。"
    status: "confirmed"
    source_anchor: "L28-L30"
  -
    id: "create_extension_fact_if_not_exists"
