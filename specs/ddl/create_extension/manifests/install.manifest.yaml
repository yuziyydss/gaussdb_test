schema_version: 1
kind: "manifest"
id: "manifest_create_extension_install"
name: "CREATE EXTENSION install"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "create_extension"
syntax_ref: "syntax_create_extension"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_create_extension_schema_transaction"
identifier_policy: {}
bindings:
  if_not_exists:
    - "create_extension_if_not_exists_no"
    - "create_extension_if_not_exists_yes"
  with_keyword:
    - "create_extension_with_keyword_no"
    - "create_extension_with_keyword_yes"
  version:
    - "create_extension_version_default"
    - "create_extension_version_string"
    - "create_extension_version_identifier"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "isolated_internal_test"
    allowed_values:
      - "true"
    fact_refs:
      - "create_extension_fact_internal"
  -
    key: "enable_extension"
    allowed_values:
      - "true"
    fact_refs:
      - "create_extension_fact_enabled"
  -
    key: "extension_support_contract"
    allowed_values:
      - "ext_b7:default,1.0,b7_version"
    fact_refs:
      - "create_extension_fact_support_files"
