  -
    id: "alter_event_fact_compat_b"
    type: "environment"
    statement: "仅B模式支持。"
    status: "confirmed"
    source_anchor: "L8-L8"
  -
    id: "alter_event_fact_privilege"
    type: "environment"
    statement: "仅任务所有者可改，管理员默认可改全部。"
    status: "confirmed"
    source_anchor: "L9-L10"
  -
    id: "alter_event_fact_owner_metadata"
    type: "metadata_oracle"
    statement: "SHOW EVENTS或PG_JOB.log_user可查所有者。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "alter_event_fact_owner_transition"
    type: "lifecycle"
    statement: "修改成功所有者变为当前用户，指定DEFINER则变为DEFINER。"
    status: "confirmed"
    source_anchor: "L13-L14"
  -
    id: "alter_event_fact_definer_inherited"
    type: "constraint"
    statement: "DEFINER限制同CREATE EVENT。"
    status: "confirmed"
    source_anchor: "L15-L15"
  -
    id: "alter_event_fact_admin_transition"
    type: "behavior_oracle"
    statement: "管理员修改他人任务后所有者与执行权限切为管理员。"
    status: "confirmed"
    source_anchor: "L16-L17"
  -
    id: "alter_event_fact_definer"
    type: "environment"
    statement: "默认创建者权限或指定者权限；指定DEFINER需SYSADMIN。"
    status: "confirmed"
    source_anchor: "L47-L50"
  -
    id: "alter_event_fact_schedule"
    type: "syntax"
    statement: "schedule同CREATE EVENT。"
    status: "confirmed"
