  -
    id: "alter_event_fact_body"
    type: "syntax"
    statement: "DO为待执行SQL。"
    status: "confirmed"
    source_anchor: "L66-L67"
  -
    id: "alter_event_fact_underscore"
    type: "syntax"
    statement: "复合interval可写下划线形式。"
    status: "confirmed"
    source_anchor: "L68-L70"
