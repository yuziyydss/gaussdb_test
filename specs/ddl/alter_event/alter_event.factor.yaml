    id: "alter_event_fact_underscore_gate"
    type: "environment"
    statement: "下划线单位仅B模式且5.7/s1配置。"
    status: "confirmed"
    source_anchor: "L73-L74"
  -
    id: "alter_event_fact_syntax"
    type: "syntax"
    statement: "原文选项/产生式：ALTER [DEFINER = user] EVENT event_name [ON SCHEDULE schedule] [ON COMPLETION [NOT] PRESERVE] [RENAME TO new_event_name] [ENABLE | DISABLE | DISABLE ON SLAVE] [COMMENT 'string'] [DO event_body];"
    status: "confirmed"
    source_anchor: "L20-L28"
  -
    id: "alter_event_fact_schedule_syntax"
    type: "syntax"
    statement: "原文选项/产生式：●    schedule： { AT timestamp [+ INTERVAL interval] ... | EVERY interval [STARTS timestamp [+ INTERVAL interval] ...] [ENDS timestamp [+ INTERVAL interval] ...] }"
    status: "confirmed"
    source_anchor: "L30-L36"
  -
    id: "alter_event_fact_interval_syntax"
    type: "syntax"
    statement: "原文选项/产生式：●    interval： quantity {YEAR | MONTH | DAY | HOUR | MINUTE | SECOND | YEAR TO MONTH | DAY TO HOUR | DAY TO MINUTE | DAY TO SECOND | HOUR TO MINUTE | HOUR TO SECOND | MINUTE TO SECOND}"
    status: "confirmed"
    source_anchor: "L38-L43"
  -
    id: "alter_event_fact_rename_example"
    type: "example"
    statement: "改名、删除任务表并切库清理。"
    status: "confirmed"
    source_anchor: "L133-L144"
  -
    id: "alter_event_fact_combined_alter"
    type: "open_question"
    statement: "多可选修改子句的组合、空ALTER与ENABLE状态迁移未生成；只修改已禁用的独占任务。"
    status: "needs_verification"
    source_anchor: "L20-L28"
  -
    id: "alter_event_fact_interval_profiles"
    type: "open_question"
    statement: "STARTS/ENDS、浮点及复合interval仍待完整调度契约。"
    status: "needs_verification"
    source_anchor: "L30-L36"
  -
    id: "alter_event_fact_owner_oracle"
    type: "open_question"
    statement: "修改所有者/执行身份需要双用户会话验证，当前不改变DEFINER。"
    status: "needs_verification"
    source_anchor: "L15-L15"
  -
    id: "alter_event_fact_example_lines_78"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建并切换至测试数据库。 gaussdb=# CREATE DATABASE test_event WITH DBCOMPATIBILITY = 'B'; gaussdb=# \\c test_event"
    status: "confirmed"
    source_anchor: "L78-L80"
  -
    id: "alter_event_fact_example_lines_82"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建表。 test_event=# CREATE TABLE t_ev(num int);"
    status: "confirmed"
    source_anchor: "L82-L83"
  -
    id: "alter_event_fact_example_lines_85"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建一个状态为DISABLE的定时任务，表示此定时任务不开启。 test_event=# CREATE EVENT IF NOT EXISTS event_e1 ON SCHEDULE AT sysdate + interval 5 second DISABLE DO insert into t_ev values(0);"
    status: "confirmed"
    source_anchor: "L85-L87"
  -
    id: "alter_event_fact_example_lines_89"
    type: "example"
    statement: "示例片段（仅作来源证据）：--查询定时任务，ENABLE值为'f'。 test_event=# SHOW EVENTS; job_name | schema_name | log_user | priv_user | job_status |           start_date      | interval |    end_date      | enable | failure_msg ----------+-------------+----------+-----------+------------+---------------------+----------+--------------------- +--------+------------- event_e1 | public      | omm       | omm       |s         | 2023-11-28 09:10:58 | null       | 3999-12-31 16:00:00 | f     | (1 row)"
    status: "confirmed"
    source_anchor: "L89-L97"
  -
    id: "alter_event_fact_example_lines_99"
    type: "example"
    statement: "示例片段（仅作来源证据）：--修改定时任务状态为ENABLE,并五秒后查询表。 test_event=# ALTER EVENT event_e1 ENABLE; test_event=# SELECT * FROM t_ev; num ----- 0 (1 row)"
    status: "confirmed"
    source_anchor: "L99-L105"
  -
    id: "alter_event_fact_example_lines_107"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建一个每隔一分钟执行一次的定时任务。 test_event=# CREATE EVENT IF NOT EXISTS event_e2 ON SCHEDULE EVERY 1 minute DO insert into t_ev values(1);"
    status: "confirmed"
    source_anchor: "L107-L109"
  -
    id: "alter_event_fact_example_lines_111"
    type: "example"
    statement: "示例片段（仅作来源证据）：--每隔一分钟查询表，会看到新增一条数据。 test_event=# SELECT * FROM t_ev; num ----- 0 1 1 (3 rows)"
    status: "confirmed"
    source_anchor: "L111-L119"
  -
    id: "alter_event_fact_example_lines_121"
    type: "example"
    statement: "示例片段（仅作来源证据）：--修改定时任务中待执行语句并查询表。 test_event=# ALTER EVENT event_e2 DO insert into t_ev values(3);"
    status: "confirmed"
    source_anchor: "L121-L122"
  -
    id: "alter_event_fact_example_lines_124"
    type: "example"
    statement: "示例片段（仅作来源证据）：test_event=# SELECT * FROM t_ev; num ----- 0 1 1 3 (4 rows)"
    status: "confirmed"
    source_anchor: "L124-L131"
