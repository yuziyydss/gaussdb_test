    type: "behavior_oracle"
    statement: "默认ENABLE，DISABLE ON SLAVE与DISABLE相同。"
    status: "confirmed"
    source_anchor: "L60-L63"
  -
    id: "alter_event_fact_comments"
    type: "metadata_oracle"
    statement: "COMMENT存GS_JOB_ATTRIBUTE。"
    status: "confirmed"
