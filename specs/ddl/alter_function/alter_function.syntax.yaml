schema_version: 1
kind: "syntax"
id: "syntax_alter_function"
name: "ALTER FUNCTION 语法"
factor_ref: "alter_function"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "alter_function.form"
  name:
    type: "token"
    optional: true
    dimension_ref: "alter_function.name"
  signature:
    type: "token"
    optional: true
    dimension_ref: "alter_function.signature"
  action:
    type: "token"
    optional: true
    dimension_ref: "alter_function.action"
  restrict:
    type: "token"
    optional: true
    dimension_ref: "alter_function.restrict"
source_fact_refs:
  - "alter_function_fact_actions"
  - "alter_function_fact_action_tokens"
  - "alter_function_fact_action_more"
  - "alter_function_fact_rename"
  - "alter_function_fact_owner"
  - "alter_function_fact_schema"
  - "alter_function_fact_compile"
  - "alter_function_fact_argmode"
  - "alter_function_fact_argname"
  - "alter_function_fact_external"
  - "alter_function_fact_config"
  - "alter_function_fact_config_values"
  - "alter_function_fact_current"
ast:
  kind: "choice"
  selector: "form"
  branches:
    alter_function_form_attributes:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER FUNCTION "
        -
          kind: "slot"
          slot: "name"
        -
          kind: "literal"
          text: " ("
        -
          kind: "slot"
          slot: "signature"
        -
          kind: "literal"
          text: ") "
        -
          kind: "slot"
          slot: "action"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "restrict"
    alter_function_form_rename:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER FUNCTION "
        -
          kind: "slot"
          slot: "name"
        -
          kind: "literal"
          text: " ("
        -
          kind: "slot"
          slot: "signature"
        -
          kind: "literal"
          text: ") RENAME TO fp_af_renamed"
    alter_function_form_schema:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER FUNCTION "
        -
          kind: "slot"
          slot: "name"
        -
          kind: "literal"
          text: " ("
        -
          kind: "slot"
          slot: "signature"
        -
          kind: "literal"
          text: ") SET SCHEMA fp_af_schema"
    alter_function_form_compile:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER FUNCTION "
        -
          kind: "slot"
          slot: "name"
        -
          kind: "literal"
          text: " COMPILE"
