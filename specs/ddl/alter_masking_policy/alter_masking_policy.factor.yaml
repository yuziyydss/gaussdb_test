facts:
- id: alter_masking_policy_fact_purpose
  type: lifecycle
  statement: 修改脱敏策略内容。
  status: confirmed
  source_anchor: L5-L5
- id: alter_masking_policy_fact_privilege
  type: environment
  statement: 仅POLADMIN、SYSADMIN或初始用户可维护。
  status: confirmed
  source_anchor: L8-L8
- id: alter_masking_policy_fact_switch
  type: environment
  statement: 安全开关enable_security_policy开启才生效。
  status: confirmed
  source_anchor: L9-L10
- id: alter_masking_policy_fact_name
  type: constraint
  statement: 策略名称唯一且遵守标识符规则。
  status: confirmed
  source_anchor: L59-L62
- id: alter_masking_policy_fact_comment_text
  type: syntax
  statement: COMMENTS指定描述信息。
  status: confirmed
  source_anchor: L63-L64
- id: alter_masking_policy_fact_function
  type: syntax
  statement: 支持预置及用户自定义脱敏函数，可带模式。
  status: confirmed
  source_anchor: L65-L66
- id: alter_masking_policy_fact_maskall_catalog
  type: metadata_oracle
  statement: maskall在代码中内置，不支持\df展示。
  status: confirmed
  source_anchor: L67-L67
- id: alter_masking_policy_fact_function_enum
  type: syntax
  statement: 参数列表使用regexpmasking拼写。
  status: confirmed
  source_anchor: L68-L70
- id: alter_masking_policy_fact_label
  type: syntax
  statement: label_name引用资源标签。
  status: confirmed
  source_anchor: L72-L73
- id: alter_masking_policy_fact_filter_types
  type: syntax
  statement: 过滤类型IP、ROLES、APP。
  status: confirmed
  source_anchor: L74-L75
- id: alter_masking_policy_fact_filter_values
  type: syntax
  statement: 过滤器需具体内容。
  status: confirmed
  source_anchor: L76-L77
- id: alter_masking_policy_fact_enabled_behavior
  type: behavior_oracle
  statement: ENABLE/DISABLE打开关闭，原文称省略默认ENABLE。
  status: confirmed
  source_anchor: L78-L79
- id: alter_masking_policy_fact_comments
  type: syntax
  statement: 原文选项/产生式：●   修改脱敏策略描述 ALTER MASKING POLICY policy_name COMMENTS policy_comments;
  status: confirmed
  source_anchor: L13-L14
- id: alter_masking_policy_fact_actions
  type: syntax
  statement: 原文选项/产生式：●   修改脱敏策略方式 ALTER MASKING POLICY policy_name { ADD | REMOVE | MODIFY } masking_actions[, ...];
  status: confirmed
  source_anchor: L19-L20
- id: alter_masking_policy_fact_masking_clause
  type: syntax
  statement: '原文选项/产生式：–    其中masking_actions为: masking_function ON LABEL(label_name[, ...])'
  status: confirmed
  source_anchor: L22-L23
- id: alter_masking_policy_fact_function_syntax_enum
  type: syntax
  statement: 原文选项/产生式：–    其中masking_function为： { maskall | randommasking | creditcardmasking | basicemailmasking | fullemailmasking
    | shufflemasking | alldigitsmasking | regepmasking }
  status: confirmed
  source_anchor: L28-L30
- id: alter_masking_policy_fact_modify_filter
  type: syntax
  statement: 原文选项/产生式：●   修改脱敏策略生效场景 ALTER MASKING POLICY policy_name MODIFY (filter_group_clause);
  status: confirmed
  source_anchor: L35-L36
- id: alter_masking_policy_fact_filter_clause
  type: syntax
  statement: 原文选项/产生式：–    其中filter_group_clause为： FILTER ON { ( FILTER_TYPE ( filter_value [, ... ] ) ) [, ... ] }
  status: confirmed
  source_anchor: L40-L41
- id: alter_masking_policy_fact_drop_filter
  type: syntax
  statement: 原文选项/产生式：●   移除脱敏策略生效场景并使策略对所用场景生效 ALTER MASKING POLICY policy_name DROP FILTER;
  status: confirmed
  source_anchor: L46-L47
- id: alter_masking_policy_fact_enabled
  type: syntax
  statement: 原文选项/产生式：●   开启/关闭脱敏策略 ALTER MASKING POLICY policy_name {ENABLE | DISABLE};
  status: confirmed
  source_anchor: L52-L53
- id: alter_masking_policy_fact_modify_example
  type: example
  statement: 对已有标签MODIFY为randommasking。
  status: confirmed
  source_anchor: L144-L152
- id: alter_masking_policy_fact_drop_filter_example
  type: example
  statement: 移除过滤器。
  status: confirmed
  source_anchor: L179-L180
- id: alter_masking_policy_fact_disable_example
  type: example
  statement: 禁用后目录polenabled为f。
  status: confirmed
  source_anchor: L182-L191
- id: alter_masking_policy_fact_cleanup_example
  type: example
  statement: 先策略再标签表用户清理。
  status: confirmed
  source_anchor: L193-L204
- id: alter_masking_policy_fact_regexp_typo
  type: constraint
  statement: 静态域不生成regepmasking；原文regepmasking与预期regexpmasking拼写差异保留为来源限制。
  status: confirmed
  source_anchor: L28-L30
- id: alter_masking_policy_fact_filter_parentheses
  type: constraint
  statement: 静态域不生成MODIFY FILTER分支；主产生式与示例括号差异保留为来源限制。
  status: confirmed
  source_anchor: L35-L36
- id: alter_masking_policy_fact_remaining_actions
  type: environment
  statement: 静态域只生成有限ADD/REMOVE/COMMENT/ENABLE/DISABLE代表；剩余action和多策略组合需专用环境。
  status: confirmed
  source_anchor: L19-L20
