facts:
  -
    id: "drop_user_fact_purpose"
    type: "lifecycle"
    statement: "删除指定用户。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "drop_user_fact_privilege_schema"
    type: "environment"
    statement: "需创建用户权限，成功删除同时删除同名SCHEMA。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "drop_user_fact_locked_dependencies"
    type: "lifecycle"
    statement: "CASCADE删除依赖对象（除数据库）时，锁定对象须解锁或终止锁定线程。"
    status: "confirmed"
    source_anchor: "L10-L12"
  -
    id: "drop_user_fact_no_cross_database_cascade"
    type: "constraint"
    statement: "DROP USER不跨数据库级联，其他库依赖须先处理。"
    status: "confirmed"
    source_anchor: "L13-L15"
  -
    id: "drop_user_fact_other_schema"
    type: "constraint"
    statement: "跨库删除前先删用户所在库的同名SCHEMA。"
    status: "confirmed"
    source_anchor: "L16-L17"
  -
    id: "drop_user_fact_ownership_acl"
    type: "constraint"
    statement: "先删除所有对象并回收其他对象权限，或CASCADE处理当前库依赖。"
    status: "confirmed"
    source_anchor: "L18-L19"
  -
    id: "drop_user_fact_if_exists"
    type: "behavior_oracle"
    statement: "IF EXISTS缺失时仅NOTICE。"
    status: "confirmed"
    source_anchor: "L28-L32"
  -
    id: "drop_user_fact_name"
    type: "syntax"
    statement: "目标为已存在用户。"
    status: "confirmed"
    source_anchor: "L33-L35"
  -
    id: "drop_user_fact_default_restrict"
    type: "syntax"
    statement: "可选CASCADE/RESTRICT，默认RESTRICT。"
    status: "confirmed"
    source_anchor: "L36-L38"
  -
    id: "drop_user_fact_cascade"
    type: "lifecycle"
    statement: "CASCADE删除依赖对象并回收该用户被授予的权限。"
    status: "confirmed"
    source_anchor: "L39-L39"
  -
    id: "drop_user_fact_restrict"
    type: "behavior_oracle"
    statement: "RESTRICT遇依赖对象或授权拒绝删除。"
    status: "confirmed"
    source_anchor: "L40-L41"
  -
    id: "drop_user_fact_kill_parameter"
    type: "environment"
    statement: "enable_kill_query影响锁定依赖处理。"
    status: "confirmed"
    source_anchor: "L44-L45"
  -
    id: "drop_user_fact_kill_on"
    type: "behavior_oracle"
    statement: "开关on且CASCADE时自动终止锁定依赖线程并删除。"
    status: "confirmed"
    source_anchor: "L46-L47"
  -
    id: "drop_user_fact_kill_off"
    type: "behavior_oracle"
    statement: "开关off且CASCADE时等待线程结束后删除。"
    status: "confirmed"
    source_anchor: "L48-L49"
  -
    id: "drop_user_fact_syntax"
    type: "syntax"
    statement: "DROP USER可选IF EXISTS、多用户、CASCADE/RESTRICT。"
    status: "confirmed"
    source_anchor: "L22-L22"
  -
    id: "drop_user_fact_create"
    type: "example"
    statement: "创建jim。"
    status: "confirmed"
    source_anchor: "L53-L54"
  -
    id: "drop_user_fact_missing"
    type: "example"
    statement: "不存在tom仅NOTICE。"
    status: "confirmed"
    source_anchor: "L56-L59"
  -
    id: "drop_user_fact_drop"
    type: "example"
    statement: "CASCADE删除jim。"
    status: "confirmed"
    source_anchor: "L61-L62"
  -
    id: "drop_user_fact_cascade_safety"
    type: "environment"
    statement: "静态DROP USER代表只删除空NOLOGIN用户且不用CASCADE；锁等待、多库依赖和权限链需独占环境，普通manifest不验证CASCADE行为。"
    status: "confirmed"
    source_anchor: "L39-L39"
  -
    id: "drop_user_fact_missing_profile"
    type: "constraint"
    statement: "静态域只使用确认存在的空用户；缺失用户NOTICE及目标错误需单独场景，不生成缺失分支。"
    status: "confirmed"
    source_anchor: "L28-L32"
  -
    id: "drop_user_fact_optional_if_exists"
    type: "syntax"
    statement: "IF EXISTS可省略。"
    status: "confirmed"
    source_anchor: "L22-L22"
  -
    id: "drop_user_fact_multiple_targets"
    type: "syntax"
    statement: "允许逗号分隔多个用户。"
    status: "confirmed"
    source_anchor: "L22-L22"
  -
    id: "drop_user_fact_optional_behavior"
    type: "syntax"
    statement: "可省略或选择CASCADE/RESTRICT。"
    status: "confirmed"
    source_anchor: "L22-L22"
