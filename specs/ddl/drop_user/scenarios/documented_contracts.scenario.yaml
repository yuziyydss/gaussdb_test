schema_version: 1
kind: "scenario"
id: "scenario_drop_user_documented_contracts"
name: "DROP USER documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "drop_user"
fixture_refs: []
fact_refs:
  - "drop_user_fact_purpose"
  - "drop_user_fact_privilege_schema"
  - "drop_user_fact_locked_dependencies"
  - "drop_user_fact_no_cross_database_cascade"
  - "drop_user_fact_other_schema"
  - "drop_user_fact_ownership_acl"
  - "drop_user_fact_if_exists"
  - "drop_user_fact_cascade"
  - "drop_user_fact_restrict"
  - "drop_user_fact_kill_parameter"
  - "drop_user_fact_kill_on"
  - "drop_user_fact_kill_off"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "删除指定用户。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "需创建用户权限，成功删除同时删除同名SCHEMA。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "CASCADE删除依赖对象（除数据库）时，锁定对象须解锁或终止锁定线程。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "DROP USER不跨数据库级联，其他库依赖须先处理。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "跨库删除前先删用户所在库的同名SCHEMA。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "先删除所有对象并回收其他对象权限，或CASCADE处理当前库依赖。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "IF EXISTS缺失时仅NOTICE。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "CASCADE删除依赖对象并回收该用户被授予的权限。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "RESTRICT遇依赖对象或授权拒绝删除。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "enable_kill_query影响锁定依赖处理。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "开关on且CASCADE时自动终止锁定依赖线程并删除。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "开关off且CASCADE时等待线程结束后删除。"
oracles:
  -
    kind: "documented_behavior"
    expected: "IF EXISTS缺失时仅NOTICE。"
  -
    kind: "documented_behavior"
    expected: "RESTRICT遇依赖对象或授权拒绝删除。"
  -
    kind: "documented_behavior"
    expected: "开关on且CASCADE时自动终止锁定依赖线程并删除。"
  -
    kind: "documented_behavior"
    expected: "开关off且CASCADE时等待线程结束后删除。"
execution_requirements:
  - "database"
  - "same_session"
