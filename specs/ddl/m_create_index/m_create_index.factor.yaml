facts:
- id: m_create_index_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.11 L2-2
- id: m_create_index_fact_authority
  type: environment
  statement: 被授予CREATE ANY INDEX权限的用户可以在public和用户模式创建索引。
  status: confirmed
  source_anchor: 2.4.2.8.11 L25-26
- id: m_create_index_fact_syntax
  type: syntax
  statement: 普通表索引：可选 UNIQUE/USING，非空键列表，WITH、TABLESPACE、index_option 与算法/锁尾部。
  status: confirmed
  source_anchor: 2.4.2.8.11 L59-64
- id: m_create_index_fact_key
  type: syntax
  statement: 键可指定 ASC/DESC 与 NULLS FIRST/LAST，多键以逗号分隔。
  status: confirmed
  source_anchor: 2.4.2.8.11 L66-68
- id: m_create_index_fact_comment
  type: syntax
  statement: M index_option 允许行内 COMMENT；不套用通用模式的 COMMENT 处理。
  status: confirmed
  source_anchor: 2.4.2.8.11 L70-73
- id: m_create_index_fact_algorithm
  type: syntax
  statement: ALGORITHM 的 DEFAULT/INPLACE/COPY 及 LOCK 的 DEFAULT/NONE/SHARED/EXCLUSIVE 语法。
  status: confirmed
  source_anchor: 2.4.2.8.11 L78-82
- id: m_create_index_fact_method
  type: syntax
  statement: M 方法列表为 BTREE、UBTREE。
  status: confirmed
  source_anchor: 2.4.2.8.11 L76-76
- id: m_create_index_fact_engine
  type: behavior_oracle
  statement: BTREE 随主表存储引擎转换：ASTORE 为 BTREE，USTORE 为 UBTREE。
  status: confirmed
  source_anchor: 2.4.2.8.11 L141-144
- id: m_create_index_fact_unique
  type: behavior_oracle
  statement: 唯一索引在插入/更新造成重复记录时拒绝操作。
  status: confirmed
  source_anchor: 2.4.2.8.11 L116-117
- id: m_create_index_fact_fillfactor
  type: constraint
  statement: 索引填充因子范围为 10 至 100。
  status: confirmed
  source_anchor: 2.4.2.8.11 L234-234
- id: m_create_index_fact_limits
  type: constraint
  statement: 普通索引最多 32 列，GLOBAL 最多 31 列。
  status: confirmed
  source_anchor: 2.4.2.8.11 L30-31
- id: m_create_index_fact_key_source
  type: constraint
  statement: 直接列索引键必须引用目标表中存在的字段。
  status: confirmed
  source_anchor: 2.4.2.8.11 L146-146
- id: m_create_index_fact_prefix
  type: constraint
  statement: 前缀键只用于二进制或字符类型；正长度不超过 2676 和字段长度。
  status: confirmed
  source_anchor: 2.4.2.8.11 L158-162
- id: m_create_index_fact_partition_gap
  type: environment
  statement: PDF 物理页 2102 分区产生式未列键列表且中间有分号，示例有 ON table(id) LOCAL；需要独立分区语法复核。
  status: confirmed
  source_anchor: 2.4.2.8.11 L84-95
- id: m_create_index_fact_algorithm_effect
  type: environment
  statement: 本章只列 ALGORITHM/LOCK 语法，未说明各值效果和组合限制；本轮只取 DEFAULT，不宣称在线语义。
  status: confirmed
  source_anchor: 2.4.2.8.11 L78-82
- id: m_ci_purpose
  type: example
  statement: 在指定表上创建索引以提高查询性能。建议仅在经常查询字段、连接条件、WHERE过滤、ORDER BY/GROUP BY/DISTINCT字段上创建。
  status: confirmed
  source_anchor: 2.4.2.8.11 L4-13
- id: m_ci_immutable_functions
  type: example
  statement: 索引定义里所有函数和操作符必须是immutable类型，结果只依赖输入参数。
  status: confirmed
  source_anchor: 2.4.2.8.11 L17-21
- id: m_ci_local_global
  type: example
  statement: 分区表索引分LOCAL（绑定具体分区）与GLOBAL（对应整个分区表）。未指定时默认GLOBAL；UNIQUE含全部分区键时创建LOCAL。
  status: confirmed
  source_anchor: 2.4.2.8.11 L22-24, L37-40
- id: m_ci_global_restrictions
  type: example
  statement: 分区表GLOBAL索引约束：不支持表达式索引；仅支持B-tree（ASTORE），USTORE下为UB-tree。
  status: confirmed
  source_anchor: 2.4.2.8.11 L42-50
- id: m_ci_column_limit
  type: example
  statement: 普通表索引最大32列；分区表GLOBAL索引最大31列。
  status: confirmed
  source_anchor: 2.4.2.8.11 L30-31
- id: m_ci_page_size_limit
  type: example
  statement: 单个索引大小不超过8k页面；B-tree/UB-tree不超过页面三分之一。
  status: confirmed
  source_anchor: 2.4.2.8.11 L32-35
- id: m_ci_same_order_restriction
  type: example
  statement: 顺序不同的索引列可同时创建LOCAL和GLOBAL；顺序相同的不支持同时创建。
  status: confirmed
  source_anchor: 2.4.2.8.11 L50-52
- id: m_ci_precision_invalidation
  type: example
  statement: 未开启精度传递参数时创建的索引，开启参数后会失效，需重新创建。
  status: confirmed
  source_anchor: 2.4.2.8.11 L52-54
- id: m_ci_init_user_restriction
  type: example
  statement: 禁止其他用户在初始用户的表上创建包含用户自定义函数的表达式索引。
  status: confirmed
  source_anchor: 2.4.2.8.11 L27-29
- id: m_ci_unique_btree_only
  type: example
  statement: 目前只有B-tree及UB-tree索引支持唯一索引。
  status: confirmed
  source_anchor: 2.4.2.8.11 L118-129
- id: m_ci_algorithm_lock_options
  type: example
  statement: CREATE/DROP INDEX的algorithm_option和lock_option仅语法支持，实际不起作用。
  status: confirmed
  source_anchor: 2.4.2.8.11 L96-111
