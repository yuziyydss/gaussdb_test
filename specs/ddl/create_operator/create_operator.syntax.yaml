schema_version: 1
kind: "syntax"
id: "syntax_create_operator"
name: "CREATE OPERATOR 语法"
factor_ref: "create_operator"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  arity:
    type: "token"
    optional: true
    dimension_ref: "create_operator.arity"
  operator_name:
    type: "token"
    optional: true
    dimension_ref: "create_operator.operator_name"
source_fact_refs:
  - "create_operator_fact_syntax"
  - "create_function::create_function_fact_pg_signature"
  - "create_operator_fact_name"
  - "create_operator_fact_left"
  - "create_operator_fact_right"
  - "create_operator_fact_commutator"
  - "create_operator_fact_negator"
  - "create_operator_fact_restrict"
  - "create_operator_fact_join"
  - "create_operator_fact_hashes"
  - "create_operator_fact_merges"
  - "create_operator_fact_syntax_arguments"
  - "create_operator_fact_syntax_operator_links"
  - "create_operator_fact_syntax_selectivity"
  - "create_operator_fact_syntax_join_capabilities"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "CREATE OPERATOR "
    -
      kind: "slot"
      slot: "operator_name"
    -
      kind: "literal"
      text: " ("
    -
      kind: "choice"
      selector: "arity"
      branches:
        create_operator_arity_binary:
          kind: "literal"
          text: "PROCEDURE = fp_cf_callable, LEFTARG = INTEGER, RIGHTARG = INTEGER"
        create_operator_arity_prefix:
          kind: "literal"
          text: "PROCEDURE = op_b7_unary, RIGHTARG = INTEGER"
        create_operator_arity_postfix:
          kind: "literal"
          text: "PROCEDURE = op_b7_unary, LEFTARG = INTEGER"
    -
      kind: "literal"
      text: ")"
