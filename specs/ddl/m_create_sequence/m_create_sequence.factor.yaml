facts:
- id: m_create_sequence_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.15 L2-2
- id: m_create_sequence_fact_authority
  type: environment
  statement: 被授予CREATE ANY SEQUENCE权限的用户可在public和用户模式创建序列。
  status: confirmed
  source_anchor: 2.4.2.8.15 L17-18
- id: m_create_sequence_fact_syntax
  type: syntax
  statement: "创建序列的增量、边界、起点、缓存、循环、重启与归属语法。"
  status: confirmed
  source_anchor: 2.4.2.8.15 L22-27
- id: m_create_sequence_fact_direction
  type: syntax
  statement: 正增量递增，负增量递减，缺省为 1。
  status: confirmed
  source_anchor: 2.4.2.8.15 L37-39
- id: m_create_sequence_fact_owned
  type: lifecycle
  statement: OWNED BY 关联同一用户、同一模式的列，删列或表时关联序列被删除。
  status: confirmed
  source_anchor: 2.4.2.8.15 L66-68
- id: m_create_sequence_fact_not_default
  type: behavior_oracle
  statement: OWNED BY 不自动给列添加自增赋值。
  status: confirmed
  source_anchor: 2.4.2.8.15 L68-69
- id: m_create_sequence_fact_no_cycle
  type: behavior_oracle
  statement: NO CYCLE 到达上限后再次 nextval 报错；NOCYCLE 与 NO CYCLE 等价。
  status: confirmed
  source_anchor: 2.4.2.8.15 L61-63
- id: m_create_sequence_fact_min_ambiguity
  type: environment
  statement: 原文递减最小值排版为-263-1，符号边界存在歧义；当前模型只用显式小整数范围，不生成默认边界。
  status: confirmed
  source_anchor: 2.4.2.8.15 L42-43
- id: m_create_sequence_fact_restart
  type: environment
  statement: RESTART出现在语法但无参数语义说明；当前模型不生成RESTART，不推断CREATE时与START的优先级。
  status: confirmed
  source_anchor: 2.4.2.8.15 L22-L27
- id: m_create_sequence_fact_purpose
  type: example
  statement: 创建序列。序列是存放等差数列的特殊表，通常用于生成唯一标识符。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_create_sequence_fact_constraint
  type: example
  statement: 序列名须区别于同模式的序列、表、索引、视图和外表。INCREMENT为0时报错。
  status: confirmed
  source_anchor: M-Compatibility L7-16
- id: m_create_sequence_fact_params
  type: example
  statement: INCREMENT指定步长（正数升序/负数降序）。MINVALUE/MAXVALUE指定范围。START指定起始值。CACHE指定预分配数量。CYCLE允许循环。OWNED BY关联表列。
  status: confirmed
  source_anchor: M-Compatibility L31-36
- id: m_create_sequence_fact_example
  type: example
  statement: m_create_sequence的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L79-83
