schema_version: 1
kind: "manifest"
id: "manifest_alter_extension_update"
name: "ALTER EXTENSION update"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "alter_extension"
syntax_ref: "syntax_alter_extension"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_alter_extension_member"
identifier_policy: {}
bindings:
  form:
    - "alter_extension_form_update"
  to_version:
    - "alter_extension_to_version_default"
    - "alter_extension_to_version_specified"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "isolated_internal_test"
    allowed_values:
      - "true"
    fact_refs:
      - "alter_extension_fact_internal"
  -
    key: "support_extended_features"
    allowed_values:
      - "true"
    fact_refs:
      - "alter_extension_fact_enabled"
  -
    key: "enable_extension"
    allowed_values:
      - "true"
    fact_refs:
      - "create_extension::create_extension_fact_enabled"
  -
    key: "extension_support_contract"
    allowed_values:
      - "ext_b7:default,1.0,b7_version"
    fact_refs:
      - "create_extension::create_extension_fact_support_files"
  -
    key: "extension_update_contract"
    allowed_values:
      - "ext_b7:default_to_2.0"
    fact_refs:
      - "alter_extension_fact_update"
