schema_version: 1
kind: "syntax"
id: "syntax_alter_view"
name: "ALTER VIEW 语法"
factor_ref: "alter_view"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  action:
    type: "token"
    optional: true
    dimension_ref: "alter_view.action"
  if_exists:
    type: "token"
    optional: true
    dimension_ref: "alter_view.if_exists"
  view_name:
    type: "token"
    optional: true
    dimension_ref: "alter_view.view_name"
  column_name:
    type: "token"
    optional: true
    dimension_ref: "alter_view.column_name"
  column_keyword:
    type: "token"
    optional: true
    dimension_ref: "alter_view.column_keyword"
  expression:
    type: "token"
    optional: true
    dimension_ref: "alter_view.expression"
  new_name:
    type: "token"
    optional: true
    dimension_ref: "alter_view.new_name"
  new_owner:
    type: "token"
    optional: true
    dimension_ref: "alter_view.new_owner"
  new_schema:
    type: "token"
    optional: true
    dimension_ref: "alter_view.new_schema"
  options:
    type: "token"
    optional: true
    dimension_ref: "alter_view.options"
  reset_options:
    type: "token"
    optional: true
    dimension_ref: "alter_view.reset_options"
source_fact_refs:
  - "alter_view_fact_set_default_syntax"
  - "alter_view_fact_drop_default_syntax"
  - "alter_view_fact_owner_syntax"
  - "alter_view_fact_rename_syntax"
  - "alter_view_fact_schema_syntax"
  - "alter_view_fact_set_syntax"
  - "alter_view_fact_reset_syntax"
  - "alter_view_fact_compile_syntax"
  - "alter_view_fact_option_syntax"
  - "alter_view_fact_expression"
  - "alter_view_fact_new_owner"
  - "alter_view_fact_new_name"
  - "alter_view_fact_new_schema"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "ALTER VIEW "
    -
      kind: "choice"
      selector: "action"
      branches:
        alter_view_action_compile:
          kind: "literal"
          text: ""
        "*":
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "if_exists"
            -
              kind: "literal"
              text: " "
    -
      kind: "slot"
      slot: "view_name"
    -
      kind: "literal"
      text: " "
    -
      kind: "choice"
      selector: "action"
      branches:
        alter_view_action_set_default:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "ALTER "
            -
              kind: "slot"
              slot: "column_keyword"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "column_name"
            -
              kind: "literal"
              text: " SET DEFAULT "
            -
              kind: "slot"
              slot: "expression"
        alter_view_action_drop_default:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "ALTER "
            -
              kind: "slot"
              slot: "column_keyword"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "column_name"
            -
              kind: "literal"
              text: " DROP DEFAULT"
        alter_view_action_owner:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "OWNER TO "
            -
              kind: "slot"
              slot: "new_owner"
        alter_view_action_rename:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "RENAME TO "
            -
              kind: "slot"
              slot: "new_name"
        alter_view_action_schema:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "SET SCHEMA "
            -
              kind: "slot"
              slot: "new_schema"
        alter_view_action_set:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "SET ("
            -
              kind: "repeat"
              slot: "options"
              separator: ", "
              items_property: "items"
            -
              kind: "literal"
              text: ")"
        alter_view_action_reset:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "RESET ("
            -
              kind: "repeat"
              slot: "reset_options"
              separator: ", "
              items_property: "items"
            -
              kind: "literal"
              text: ")"
        alter_view_action_compile:
          kind: "literal"
          text: "COMPILE"
