facts:
- id: alter_view_fact_purpose
  type: lifecycle
  statement: ALTER VIEW 修改辅助属性或重编译；修改查询定义应使用 CREATE OR REPLACE VIEW。
  status: confirmed
  source_anchor: L5-L6
- id: alter_view_fact_permission
  type: environment
  statement: 视图所有者或有视图 ALTER 权限的用户可修改；三权分立关闭时系统管理员默认拥有权限。
  status: confirmed
  source_anchor: L9-L11
- id: alter_view_fact_schema_permission
  type: environment
  statement: 迁移模式要求所有者/管理员及新模式 CREATE 权限；三权分立打开时管理员不能迁移。
  status: confirmed
  source_anchor: L12-L13
- id: alter_view_fact_owner_permission
  type: environment
  statement: 修改所有者要求所有者/管理员为新角色成员，新角色有当前模式 CREATE 权限；三权分立打开时管理员不能改属主。
  status: confirmed
  source_anchor: L14-L16
- id: alter_view_fact_set_default_syntax
  type: syntax
  statement: 设置列默认值，COLUMN 可选，IF EXISTS 可选。
  status: confirmed
  source_anchor: L19-L21
- id: alter_view_fact_drop_default_syntax
  type: syntax
  statement: 删除列默认值，COLUMN 可选，IF EXISTS 可选。
  status: confirmed
  source_anchor: L26-L28
- id: alter_view_fact_owner_syntax
  type: syntax
  statement: OWNER TO 更改所有者。
  status: confirmed
  source_anchor: L33-L35
- id: alter_view_fact_rename_syntax
  type: syntax
  statement: RENAME TO 重命名视图。
  status: confirmed
  source_anchor: L40-L42
- id: alter_view_fact_schema_syntax
  type: syntax
  statement: SET SCHEMA 修改所属模式。
  status: confirmed
  source_anchor: L47-L49
- id: alter_view_fact_set_syntax
  type: syntax
  statement: SET 括号中为逗号分隔的选项赋值列表。
  status: confirmed
  source_anchor: L54-L56
- id: alter_view_fact_reset_syntax
  type: syntax
  statement: RESET 括号中为逗号分隔的选项名称列表。
  status: confirmed
  source_anchor: L61-L63
- id: alter_view_fact_compile_syntax
  type: syntax
  statement: COMPILE 产生式没有 IF EXISTS。
  status: confirmed
  source_anchor: L65-L66
- id: alter_view_fact_if_notice
  type: behavior_oracle
  statement: IF EXISTS 在视图不存在时仅提示而不报错。
  status: confirmed
  source_anchor: L72-L73
- id: alter_view_fact_name
  type: constraint
  statement: 目标名称可用模式修饰，须指向既有视图。
  status: confirmed
  source_anchor: L74-L76
- id: alter_view_fact_error_identity
  type: environment
  statement: 缺失视图/列及非法选项的错误 SQLSTATE 本章未提供，负向保持待校准。
  status: confirmed
  source_anchor: L74-L76
- id: alter_view_fact_column
  type: constraint
  statement: 列名必须是视图中的既有字段。
  status: confirmed
  source_anchor: L77-L79
- id: alter_view_fact_default_no_effect
  type: behavior_oracle
  statement: SET/DROP DEFAULT 暂无实际意义，不据此推导 INSERT 默认值行为。
  status: confirmed
  source_anchor: L80-L81
- id: alter_view_fact_new_owner
  type: syntax
  statement: new_owner 是新所有者名称。
  status: confirmed
  source_anchor: L82-L83
- id: alter_view_fact_new_name
  type: syntax
  statement: new_name 是视图的新名称。
  status: confirmed
  source_anchor: L84-L85
- id: alter_view_fact_new_schema
  type: syntax
  statement: new_schema 是视图的新模式。
  status: confirmed
  source_anchor: L86-L87
- id: alter_view_fact_option_syntax
  type: syntax
  statement: 视图选项项支持名称及可选赋值。
  status: confirmed
  source_anchor: L88-L89
- id: alter_view_fact_option_list_gap
  type: environment
  statement: 只展开最多两个不同选项；重复/冲突选项及更长列表未建模。
  status: confirmed
  source_anchor: L88-L89
- id: alter_view_fact_barrier_domain
