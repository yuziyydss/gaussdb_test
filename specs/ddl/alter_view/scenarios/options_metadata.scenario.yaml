schema_version: 1
kind: "scenario"
id: "scenario_alter_view_options_metadata"
name: "ALTER VIEW options_metadata"
status: "planned"
description: "选项设置、省略赋值与重置的目录观测；未执行。"
factor_ref: "alter_view"
fixture_refs:
  - "fixture_alter_view_view"
fact_refs:
  - "alter_view_fact_barrier_default"
  - "alter_view_fact_check_behavior"
  - "alter_view_fact_option_list_gap"
preconditions: []
steps:
  -
    id: "set"
    action: "execute_sql"
    sql: "ALTER VIEW v_av_base SET (security_barrier);"
  -
    id: "inspect"
    action: "execute_sql"
    sql: "SELECT reloptions FROM pg_class WHERE oid = 'v_av_base'::regclass;"
  -
    id: "reset"
    action: "execute_sql"
    sql: "ALTER VIEW v_av_base RESET (security_barrier, check_option);"
oracles:
  -
    after_step: "inspect"
    kind: "contains_option"
    expected: "security_barrier=true"
execution_requirements:
  - "database"
  - "same_session"
