schema_version: 1
kind: "fixture"
id: "fixture_alter_view_view"
name: "ALTER VIEW view"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "alter_view"
requires_fixture_refs:
  - "fixture_create_view_source_two_ints"
provides:
  tables:
    -
      name: "v_av_base"
      persistence: "permanent"
      table_kind: "view"
      columns:
        -
          name: "col_1"
          type: "INTEGER"
          nullable: true
        -
          name: "col_2"
          type: "INTEGER"
          nullable: true
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "DROP VIEW IF EXISTS v_av_missing;"
    - "DROP VIEW IF EXISTS v_av_new;"
    - "CREATE VIEW v_av_base AS SELECT col_1, col_2 FROM t_view_source WHERE col_1 > 0;"
  teardown_sqls:
    - "DROP VIEW IF EXISTS v_av_new;"
    - "DROP VIEW IF EXISTS v_av_base;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
