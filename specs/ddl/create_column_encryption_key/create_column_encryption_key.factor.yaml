facts:
  -
    id: "create_column_encryption_key_fact_purpose"
    type: "lifecycle"
    statement: "创建列加密密钥用于加密表中指定列。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_column_encryption_key_fact_encrypted_only"
    type: "environment"
    statement: "全密态数据库专用语法。"
    status: "confirmed"
    source_anchor: "L8-L8"
  -
    id: "create_column_encryption_key_fact_driver"
    type: "environment"
    statement: "gsql连接需-C开启全密态。"
    status: "confirmed"
    source_anchor: "L9-L10"
  -
    id: "create_column_encryption_key_fact_column_reference"
    type: "behavior_oracle"
    statement: "建表列可引用CEK进行列级加密。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "create_column_encryption_key_fact_unique"
    type: "constraint"
    statement: "CEK在同一命名空间唯一。"
    status: "confirmed"
    source_anchor: "L20-L21"
  -
    id: "create_column_encryption_key_fact_identifier"
    type: "constraint"
    statement: "CEK名称符合标识符规范。"
    status: "confirmed"
    source_anchor: "L22-L22"
  -
    id: "create_column_encryption_key_fact_cmk"
    type: "constraint"
    statement: "CLIENT_MASTER_KEY必须引用CREATE CLIENT MASTER KEY创建的CMK。"
    status: "confirmed"
    source_anchor: "L23-L25"
  -
    id: "create_column_encryption_key_fact_algorithms"
    type: "syntax"
    statement: "支持AEAD_AES_256_CBC_HMAC_SHA256、AEAD_AES_128_CBC_HMAC_SHA256、AEAD_AES_256_CTR_HMAC_SHA256、AES_256_GCM、SM4_HMAC_SM3、SM4_CTR_HMAC_SM3、SM4_SM3。"
    status: "confirmed"
    source_anchor: "L26-L30"
  -
    id: "create_column_encryption_key_fact_expansion"
    type: "behavior_oracle"
    statement: "膨胀率CTR_AES=CTR_SM4 < AES_GCM < CBC_AES256=CBC_AES128=SM4_SM3=SM4_HMAC_SM3，文档推荐前三种低膨胀算法。"
    status: "confirmed"
    source_anchor: "L31-L36"
  -
    id: "create_column_encryption_key_fact_third_kms"
    type: "constraint"
    statement: "本章称KEY_STORE=third_kms无需ALGORITHM，但CMK章支持列表不含third_kms。"
    status: "confirmed"
    source_anchor: "L37-L37"
  -
    id: "create_column_encryption_key_fact_key_length"
    type: "constraint"
    statement: "可选ENCRYPTED_VALUE为28至256字符。"
    status: "confirmed"
    source_anchor: "L38-L39"
  -
    id: "create_column_encryption_key_fact_aes128_length"
    type: "constraint"
    statement: "28字符派生密钥满足AES128强度。"
    status: "confirmed"
    source_anchor: "L40-L40"
  -
    id: "create_column_encryption_key_fact_aes256_length"
    type: "constraint"
    statement: "AES256需求密钥长度39字符。"
    status: "confirmed"
    source_anchor: "L41-L41"
  -
    id: "create_column_encryption_key_fact_generated_length"
    type: "behavior_oracle"
    statement: "省略ENCRYPTED_VALUE自动生成256字符密钥。"
    status: "confirmed"
    source_anchor: "L42-L42"
  -
    id: "create_column_encryption_key_fact_sm_family"
    type: "constraint"
    statement: "CMK用SM4/SM4_HMAC_SM3/SM4_CTR_HMAC_SM3时，CEK须SM4_SM3/SM4_HMAC_SM3/SM4_CTR_HMAC_SM3；sdf_kms例外。"
    status: "confirmed"
    source_anchor: "L46-L50"
  -
    id: "create_column_encryption_key_fact_huawei_block"
    type: "constraint"
    statement: "Huawei KMS生成CMK时，用户传入ENCRYPTED_VALUE长度须为16字节整数倍。"
    status: "confirmed"
    source_anchor: "L51-L54"
  -
    id: "create_column_encryption_key_fact_syntax"
    type: "syntax"
    statement: "CREATE COLUMN ENCRYPTION KEY name WITH VALUES(CLIENT_MASTER_KEY=cmk,ALGORITHM=algorithm[,ENCRYPTED_VALUE=value])。"
    status: "confirmed"
    source_anchor: "L15-L16"
  -
    id: "create_column_encryption_key_fact_manager_conflict"
    type: "open_question"
    statement: "third_kms不在本PDF CMK支持列表，不能擅自当作sdf_kms或支持新增管理器；待产品确认。"
    status: "needs_verification"
    source_anchor: "L37-L37"
  -
    id: "create_column_encryption_key_fact_char_byte_boundary"
    type: "open_question"
    statement: "字符长度28/39/256与Huawei KMS16字节倍数需结合编码与管理器求交集，不盲目生成不兼容边界。"
    status: "needs_verification"
    source_anchor: "L38-L39"
  -
    id: "create_column_encryption_key_fact_driver_contract"
    type: "open_question"
    statement: "缺少密态驱动与CMK运行时秘密契约；不生成假密钥SQL。"
    status: "needs_verification"
    source_anchor: "L9-L10"
