steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "创建列加密密钥用于加密表中指定列。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "全密态数据库专用语法。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "gsql连接需-C开启全密态。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "建表列可引用CEK进行列级加密。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "CEK在同一命名空间唯一。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "CEK名称符合标识符规范。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "CLIENT_MASTER_KEY必须引用CREATE CLIENT MASTER KEY创建的CMK。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "膨胀率CTR_AES=CTR_SM4 < AES_GCM < CBC_AES256=CBC_AES128=SM4_SM3=SM4_HMAC_SM3，文档推荐前三种低膨胀算法。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "本章称KEY_STORE=third_kms无需ALGORITHM，但CMK章支持列表不含third_kms。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "可选ENCRYPTED_VALUE为28至256字符。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "28字符派生密钥满足AES128强度。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "AES256需求密钥长度39字符。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "省略ENCRYPTED_VALUE自动生成256字符密钥。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "CMK用SM4/SM4_HMAC_SM3/SM4_CTR_HMAC_SM3时，CEK须SM4_SM3/SM4_HMAC_SM3/SM4_CTR_HMAC_SM3；sdf_kms例外。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "Huawei KMS生成CMK时，用户传入ENCRYPTED_VALUE长度须为16字节整数倍。"
oracles:
  -
    kind: "documented_behavior"
    expected: "建表列可引用CEK进行列级加密。"
  -
    kind: "documented_behavior"
    expected: "膨胀率CTR_AES=CTR_SM4 < AES_GCM < CBC_AES256=CBC_AES128=SM4_SM3=SM4_HMAC_SM3，文档推荐前三种低膨胀算法。"
  -
    kind: "documented_behavior"
    expected: "省略ENCRYPTED_VALUE自动生成256字符密钥。"
execution_requirements:
