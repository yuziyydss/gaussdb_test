schema_version: 1
kind: "scenario"
id: "scenario_create_trigger_insert_behavior"
name: "CREATE TRIGGER insert_behavior"
status: "planned"
description: "BEFORE INSERT行级保持NEW并校验插入结果；仍未实机执行。"
factor_ref: "create_trigger"
fixture_refs:
  - "fixture_create_trigger_existing_trigger"
fact_refs:
  - "create_trigger_fact_normal_return"
  - "create_trigger_fact_before"
  - "create_trigger_fact_new"
preconditions: []
steps:
  -
    id: "insert"
    action: "execute_sql"
    sql: "INSERT INTO t_trigger_source VALUES (7, 8);"
  -
    id: "select"
    action: "execute_sql"
    sql: "SELECT col_1, col_2 FROM t_trigger_source WHERE col_1=7;"
oracles:
  -
    after_step: "select"
    kind: "result_rows"
    expected:
      -
        - 7
        - 8
execution_requirements:
  - "database"
  - "same_session"
