schema_version: 1
kind: "fixture"
id: "fixture_create_trigger_functions"
name: "CREATE TRIGGER functions"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "create_trigger"
requires_fixture_refs:
  - "fixture_create_trigger_source"
provides: {}
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "CREATE FUNCTION fp_trigger_new() RETURNS TRIGGER AS 'BEGIN RETURN NEW; END;' LANGUAGE plpgsql;"
    - "CREATE FUNCTION fp_trigger_old() RETURNS TRIGGER AS 'BEGIN RETURN OLD; END;' LANGUAGE plpgsql;"
  teardown_sqls:
    - "DROP FUNCTION IF EXISTS fp_trigger_new() CASCADE;"
    - "DROP FUNCTION IF EXISTS fp_trigger_old() CASCADE;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
