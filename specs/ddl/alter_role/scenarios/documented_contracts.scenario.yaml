schema_version: 1
kind: "scenario"
id: "scenario_alter_role_documented_contracts"
name: "ALTER ROLE documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "alter_role"
fixture_refs: []
fact_refs:
  - "alter_role_fact_purpose"
  - "alter_role_fact_no_pdb_database"
  - "alter_role_fact_no_pdb_initial_password"
  - "alter_role_fact_role_name"
  - "alter_role_fact_redis_rename"
  - "alter_role_fact_next_session"
  - "alter_role_fact_default"
  - "alter_role_fact_from_current"
  - "alter_role_fact_reset"
  - "alter_role_fact_lock"
  - "alter_role_fact_unlock"
  - "alter_role_fact_pguser_forbidden"
  - "alter_role_fact_self_old_password"
  - "alter_role_fact_reset_regular"
  - "alter_role_fact_reset_sysadmin"
  - "alter_role_fact_expired"
  - "alter_role_fact_expired_privilege"
  - "alter_role_fact_initial_never_expired"
  - "alter_role_fact_expired_behavior"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "修改角色名称、锁定/解锁和权限等属性。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "PDB内不支持ALTER ROLE IN DATABASE。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "PDB内不支持修改初始用户密码。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "目标角色必须已有，名称有大写须双引号。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "redisuser不能被重命名，也不能将其他角色改名redisuser。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "参数仅针对指定角色，在该角色下一次会话生效。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "DEFAULT清除覆盖值，新会话继承默认。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "FROM CURRENT复制当前会话参数值。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "RESET指定参数或ALL，与SET TO DEFAULT相同。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "ACCOUNT LOCK禁止密码认证登录。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "ACCOUNT UNLOCK允许角色登录。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "当前不能修改PGUSER属性。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "除初始用户外，自改密码需正确旧密码。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "初始用户、三权分立关闭的SYSADMIN或CREATEROLE用户可免旧密码重置普通用户。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "初始用户可重置SYSADMIN密码；SYSADMIN不能重置其他SYSADMIN。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "设置密码失效。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "初始用户/SYSADMIN/CREATEROLE可设置失效；SYSADMIN设置自己或其他SYSADMIN失效需三权分立关闭。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "不能设置初始用户密码失效。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "失效用户可登录但不能查询，改密码或管理员重置后恢复。"
oracles:
  -
    kind: "documented_behavior"
    expected: "参数仅针对指定角色，在该角色下一次会话生效。"
  -
    kind: "documented_behavior"
    expected: "DEFAULT清除覆盖值，新会话继承默认。"
  -
    kind: "documented_behavior"
    expected: "FROM CURRENT复制当前会话参数值。"
  -
    kind: "documented_behavior"
    expected: "RESET指定参数或ALL，与SET TO DEFAULT相同。"
  -
    kind: "documented_behavior"
    expected: "ACCOUNT LOCK禁止密码认证登录。"
  -
    kind: "documented_behavior"
    expected: "ACCOUNT UNLOCK允许角色登录。"
  -
    kind: "documented_behavior"
    expected: "失效用户可登录但不能查询，改密码或管理员重置后恢复。"
execution_requirements:
  - "database"
  - "same_session"
