schema_version: 1
kind: "manifest"
id: "manifest_alter_role_options"
name: "ALTER ROLE options"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "alter_role"
syntax_ref: "syntax_alter_role"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_alter_role_isolated_roles"
identifier_policy: {}
bindings:
  form:
    - "alter_role_form_options"
  with_keyword:
    - "alter_role_with_keyword_none"
    - "alter_role_with_keyword_with"
  options:
    - "alter_role_options_nologin"
    - "alter_role_options_no_createdb"
    - "alter_role_options_no_createrole"
    - "alter_role_options_conn_one"
    - "alter_role_options_conn_unlimited"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "dedicated_role_admin"
    allowed_values:
      - "true"
    fact_refs:
      - "create_role::create_role_fact_privilege"
  -
    key: "password_disable_admin"
    allowed_values:
      - "true"
    fact_refs:
      - "create_role::create_role_fact_disable_admin"
