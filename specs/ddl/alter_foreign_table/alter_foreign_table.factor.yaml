facts:
  -
    id: "alter_foreign_table_fact_purpose"
    type: "lifecycle"
    statement: "修改外表属性。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "alter_foreign_table_fact_sensitive_quotes"
    type: "environment"
    statement: "OPTIONS敏感字段多层引号可能失去脱敏识别，禁止实际秘密落盘。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "alter_foreign_table_fact_pdb_admin"
    type: "environment"
    statement: "PDB内仅初始用户可ALTER。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "alter_foreign_table_fact_table"
    type: "constraint"
    statement: "目标须已有外表。"
    status: "confirmed"
    source_anchor: "L25-L27"
  -
    id: "alter_foreign_table_fact_option_operations"
    type: "constraint"
    statement: "OPTIONS用ADD/SET/DROP，省略默认ADD；名称域唯一，表列域可同名，由FDW验证名称和值。"
    status: "confirmed"
    source_anchor: "L28-L31"
  -
    id: "alter_foreign_table_fact_filename"
    type: "environment"
    statement: "file_fdw filename必选且为服务端绝对路径。"
    status: "confirmed"
    source_anchor: "L32-L34"
  -
    id: "alter_foreign_table_fact_format"
    type: "syntax"
    statement: "format支持text/csv/binary/fixed，引用COPY FORMAT。"
    status: "confirmed"
    source_anchor: "L35-L37"
  -
    id: "alter_foreign_table_fact_header"
    type: "syntax"
    statement: "header语义引用COPY HEADER。"
    status: "confirmed"
    source_anchor: "L38-L39"
  -
    id: "alter_foreign_table_fact_delimiter"
    type: "syntax"
    statement: "delimiter引用COPY DELIMITER。"
    status: "confirmed"
    source_anchor: "L41-L42"
  -
    id: "alter_foreign_table_fact_quote"
    type: "syntax"
    statement: "quote引用COPY QUOTE。"
    status: "confirmed"
    source_anchor: "L44-L45"
  -
    id: "alter_foreign_table_fact_escape"
    type: "syntax"
    statement: "escape引用COPY ESCAPE。"
    status: "confirmed"
    source_anchor: "L47-L48"
  -
    id: "alter_foreign_table_fact_null"
    type: "syntax"
    statement: "null引用COPY NULL。"
    status: "confirmed"
    source_anchor: "L50-L51"
  -
    id: "alter_foreign_table_fact_encoding"
    type: "syntax"
    statement: "encoding引用COPY ENCODING。"
    status: "confirmed"
    source_anchor: "L53-L54"
  -
    id: "alter_foreign_table_fact_force_not_null"
    type: "behavior_oracle"
    statement: "列force_not_null为true不匹配文件级NULL空串，引用COPY FORCE_NOT_NULL。"
    status: "confirmed"
    source_anchor: "L56-L59"
  -
    id: "alter_foreign_table_fact_external_guide"
    type: "environment"
    statement: "完整file_fdw用法依赖未提供开发指南。"
    status: "confirmed"
    source_anchor: "L62-L63"
  -
    id: "alter_foreign_table_fact_value"
    type: "syntax"
    statement: "value为选项新值。"
    status: "confirmed"
    source_anchor: "L64-L65"
  -
    id: "alter_foreign_table_fact_column"
    type: "constraint"
    statement: "column_name须已有字段并符合标识符规范。"
    status: "confirmed"
    source_anchor: "L66-L68"
  -
    id: "alter_foreign_table_fact_table_syntax"
    type: "syntax"
    statement: "原文选项/产生式：●   修改外表属性 ALTER FOREIGN TABLE [ IF EXISTS ] table_name OPTIONS ( {[ ADD | SET | DROP ] option ['value']}[, ... ]);"
    status: "confirmed"
    source_anchor: "L13-L15"
  -
    id: "alter_foreign_table_fact_column_syntax"
    type: "syntax"
    statement: "原文选项/产生式：●   修改外表字段选项 ALTER FOREIGN TABLE [ IF EXISTS ] table_name ALTER column_name OPTIONS;"
    status: "confirmed"
    source_anchor: "L20-L22"
  -
    id: "alter_foreign_table_fact_incomplete_column_production"
    type: "open_question"
    statement: "本章列产生式只有ALTER column_name OPTIONS，没有参数列表；不能转义后当合法SQL，需补充产品语法证据。"
    status: "needs_verification"
    source_anchor: "L20-L22"
  -
    id: "alter_foreign_table_fact_runtime_fixture"
    type: "open_question"
    statement: "file_fdw/log_fdw使用不同validator选项域；须已有独占外表、列、文件与ADD不存在/SET存在/REMOVE存在的初始状态。"
    status: "needs_verification"
    source_anchor: "L32-L34"
  -
    id: "alter_foreign_table_fact_example_lines_71"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建server。 gaussdb=# CREATE SERVER my_server FOREIGN DATA WRAPPER log_fdw;"
    status: "confirmed"
    source_anchor: "L71-L72"
  -
    id: "alter_foreign_table_fact_example_lines_74"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建外表。 gaussdb=# CREATE FOREIGN TABLE foreign_tbl (col1 text) SERVER my_server OPTIONS (logtype 'gs_log');"
    status: "confirmed"
    source_anchor: "L74-L75"
  -
    id: "alter_foreign_table_fact_example_lines_77"
    type: "example"
    statement: "示例片段（仅作来源证据）：--修改外表属性。 gaussdb=# ALTER FOREIGN TABLE foreign_tbl OPTIONS (ADD latest_files '2'); gaussdb=# ALTER FOREIGN TABLE foreign_tbl OPTIONS ( SET latest_files '5'); gaussdb=# ALTER FOREIGN TABLE foreign_tbl OPTIONS ( DROP latest_files);"
    status: "confirmed"
    source_anchor: "L77-L80"
  -
    id: "alter_foreign_table_fact_example_lines_82"
    type: "example"
    statement: "示例片段（仅作来源证据）：--删除外表。 gaussdb=# DROP FOREIGN TABLE foreign_tbl;"
    status: "confirmed"
    source_anchor: "L82-L83"
  -
    id: "alter_foreign_table_fact_example_lines_85"
    type: "example"
    statement: "示例片段（仅作来源证据）：--删除server。 gaussdb=# DROP SERVER my_server;"
    status: "confirmed"
    source_anchor: "L85-L86"
