schema_version: 1
kind: fixture
id: fixture_alter_foreign_table_log_present
name: log_fdw latest_files present初始状态
status: needs_review
description: 复用服务器资产，只做目录DDL；不读取外表或部署文件。
factor_ref: alter_foreign_table
requires_fixture_refs: [fixture_shared_log_fdw_catalog_server]
provides:
  tables:
  - name: g_a3_aft_ns.foreign_table
    persistence: permanent
    table_kind: foreign
    columns: [{name: col1, type: TEXT, nullable: true}]
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
  - "CREATE SCHEMA g_a3_aft_ns;"
  - "CREATE FOREIGN TABLE g_a3_aft_ns.foreign_table (col1 TEXT) SERVER g_a3_log_server OPTIONS (logtype 'gs_log');"
  - "ALTER FOREIGN TABLE g_a3_aft_ns.foreign_table OPTIONS (ADD latest_files '2');"
  teardown_sqls:
  - "DROP FOREIGN TABLE g_a3_aft_ns.foreign_table RESTRICT;"
  - "DROP SCHEMA g_a3_aft_ns RESTRICT;"
  note: 获授权并逐项取得归属回执后才可清理；setup失败不执行目标，不以错误充当通过。显式DDL就绪不代表实机验证。
