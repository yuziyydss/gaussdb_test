schema_version: 1
kind: manifest
id: manifest_drop_directory_missing_if_exists
name: DROP DIRECTORY missing_if_exists
status: needs_review
description: 一个确认缺失目录的IF EXISTS静态代表；不验证NOTICE文本或操作系统路径行为。
factor_ref: drop_directory
syntax_ref: syntax_drop_directory
suite_type: positive
strategy: pairwise
fixture_refs: []
identifier_policy: {}
bindings:
  if_exists:
    - drop_directory_if_exists_yes
  directory_name:
    - drop_directory_directory_name_missing
environment_requirements:
  - key: directory_drop_authorized
    allowed_values:
      - "true"
    fact_refs:
      - drop_directory_fact_on_privilege
  - key: pdb_context
    allowed_values:
      - "false"
    fact_refs:
      - drop_directory_fact_no_pdb
expected:
  default: success
  scope: syntax_only
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
