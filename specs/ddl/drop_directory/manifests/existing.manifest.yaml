schema_version: 1
kind: "manifest"
id: "manifest_drop_directory_existing"
name: "DROP DIRECTORY existing"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "drop_directory"
syntax_ref: "syntax_drop_directory"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_drop_directory_directory"
identifier_policy: {}
bindings:
  if_exists:
    - "drop_directory_if_exists_no"
    - "drop_directory_if_exists_yes"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "directory_drop_authorized"
    allowed_values:
      - "true"
    fact_refs:
      - "drop_directory_fact_on_privilege"
  -
    key: "pdb_context"
    allowed_values:
      - "false"
    fact_refs:
      - "drop_directory_fact_no_pdb"
  -
    key: "directory_creator_authorized"
    allowed_values:
      - "true"
    fact_refs:
      - "create_directory::create_directory_fact_privilege"
  -
    key: "approved_isolated_directory_path"
    allowed_values:
      - "/tmp/gaussdb_b7_directory"
    fact_refs:
      - "create_directory::create_directory_fact_security"
