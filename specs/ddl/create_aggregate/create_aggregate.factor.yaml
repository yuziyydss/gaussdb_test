    statement: "四行输入求和10。"
    status: "confirmed"
    source_anchor: "L113-L121"
  -
    id: "create_aggregate_fact_cleanup_example"
    type: "example"
    statement: "依次删除聚集/函数/表。"
    status: "confirmed"
    source_anchor: "L123-L130"
  -
    id: "create_aggregate_fact_zero_input_profile"
    type: "open_question"
    statement: "零输入 * 与旧格式 ANY 需一参数状态函数，不能用两输入相加 fixture。"
    status: "needs_verification"
    source_anchor: "L44-L47"
  -
    id: "create_aggregate_fact_sort_profile"
    type: "open_question"
    statement: "排序操作符的 MIN/MAX 合同需专用聚集，不把求和随意标记排序。"
    status: "needs_verification"
    source_anchor: "L73-L75"
  -
    id: "create_aggregate_fact_ifunc_profile"
    type: "open_question"
    statement: "IFUNC 非空初值优先级与 FINALFUNC/集合初值需独立 fixture 和断言。"
    status: "needs_verification"
    source_anchor: "L82-L85"
