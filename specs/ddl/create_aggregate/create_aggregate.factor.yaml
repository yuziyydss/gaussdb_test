facts:
  -
    id: "create_aggregate_fact_purpose"
    type: "lifecycle"
    statement: "创建聚集函数对象。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_aggregate_fact_modern"
    type: "syntax"
    statement: "现代签名为重复输入类型，必须 SFUNC 与 STYPE；带 -- 的 SFUNC1/STYPE1 为注释不是候选。"
    status: "confirmed"
    source_anchor: "L8-L12"
  -
    id: "create_aggregate_fact_options"
    type: "syntax"
    statement: "可选 FINALFUNC/INITCOND/SORTOP/CFUNC/INITCOLLECT；INITCOND1 为注释。"
    status: "confirmed"
    source_anchor: "L13-L18"
  -
    id: "create_aggregate_fact_options_more"
    type: "syntax"
    statement: "另可选 IFUNC 与 SHIPPABLE。"
    status: "confirmed"
    source_anchor: "L20-L22"
  -
    id: "create_aggregate_fact_legacy"
    type: "syntax"
    statement: "早期语法以 BASETYPE 定义输入而非名称后参数列表。"
    status: "confirmed"
    source_anchor: "L24-L30"
  -
    id: "create_aggregate_fact_legacy_options"
    type: "syntax"
    statement: "早期格式支持 FINALFUNC/INITCOND/SORTOP/CFUNC/INITCOLLECT/IFUNC，不列 SHIPPABLE。"
    status: "confirmed"
    source_anchor: "L31-L38"
  -
    id: "create_aggregate_fact_name"
    type: "syntax"
    statement: "聚集函数名可模式限定。"
    status: "confirmed"
    source_anchor: "L42-L43"
  -
    id: "create_aggregate_fact_inputs"
    type: "syntax"
    statement: "零参数聚集使用 *，否则为输入类型列表。"
    status: "confirmed"
    source_anchor: "L44-L47"
  -
    id: "create_aggregate_fact_basetype"
    type: "syntax"
    statement: "旧格式单输入用 BASETYPE，零输入使用 ANY 而非 *。"
    status: "confirmed"
    source_anchor: "L48-L54"
  -
    id: "create_aggregate_fact_sfunc"
    type: "constraint"
    statement: "N 输入聚集的转换函数有 N+1 参数，首参数及返回值为状态类型，其余匹配输入。"
    status: "confirmed"
    source_anchor: "L55-L59"
  -
    id: "create_aggregate_fact_strict"
    type: "behavior_oracle"
    statement: "GaussDB 转换函数需自行声明 STRICT，不能沿用 Oracle 默认跳过 NULL 的假设。"
    status: "confirmed"
    source_anchor: "L60-L61"
  -
    id: "create_aggregate_fact_state"
    type: "syntax"
    statement: "STYPE 是聚集状态类型。"
    status: "confirmed"
    source_anchor: "L62-L63"
  -
    id: "create_aggregate_fact_final"
    type: "constraint"
    statement: "FINALFUNC 接收一个状态类型输入，其返回为聚集返回；省略则直接输出状态值。"
    status: "confirmed"
    source_anchor: "L64-L68"
  -
    id: "create_aggregate_fact_init"
    type: "constraint"
    statement: "INITCOND 是状态类型可接受的文本常量，默认 NULL。"
    status: "confirmed"
    source_anchor: "L69-L71"
  -
    id: "create_aggregate_fact_sort"
    type: "constraint"
    statement: "SORTOP 为 MIN/MAX 类聚集的排序操作符名，可模式限定。"
    status: "confirmed"
    source_anchor: "L73-L75"
  -
    id: "create_aggregate_fact_collection"
    type: "environment"
    statement: "当前集中式形态 CFUNC 不生效。"
    status: "confirmed"
    source_anchor: "L76-L77"
  -
    id: "create_aggregate_fact_initcollect"
    type: "constraint"
    statement: "INITCOLLECT 是状态类型可接受的文本常量，默认 NULL。"
    status: "confirmed"
    source_anchor: "L78-L81"
  -
    id: "create_aggregate_fact_ifunc"
    type: "constraint"
    statement: "IFUNC 无参数且返回非 NULL 状态类型；与 INITCOND 同设时优先 IFUNC。"
    status: "confirmed"
    source_anchor: "L82-L85"
  -
    id: "create_aggregate_fact_shipping"
    type: "syntax"
    statement: "SHIPPABLE 仅 true/false 默认 false，只影响用户自定义聚集的下推说明。"
    status: "confirmed"
    source_anchor: "L86-L89"
  -
    id: "create_aggregate_fact_shipping_noop"
    type: "environment"
    statement: "当前形态 SHIPPABLE 不生效。"
    status: "confirmed"
    source_anchor: "L90-L90"
  -
    id: "create_aggregate_fact_function_example"
