rules: []
structural_checks: []
facts:
  -
    id: "alter_table_subpartition_fact_body_5"
    type: "behavior_oracle"
    statement: "修改二级分区表分区，包括增删分区、清空分区、切割/合并分区、移动分区表空间、 交换分区、重命名分区、开启/关闭分区自动扩展功能，以及修改分区属性等。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "alter_table_subpartition_fact_body_9"
    type: "constraint"
    statement: "●   添加分区的表空间不能是PG_GLOBAL。"
    status: "confirmed"
    source_anchor: "L9-L9"
  -
    id: "alter_table_subpartition_fact_body_10"
    type: "constraint"
    statement: "●   添加分区的名称不能与该分区表已有一级分区和二级分区的名称相同。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "alter_table_subpartition_fact_body_11"
    type: "constraint"
    statement: "●   添加分区的分区键值要和分区表的分区键的类型一致。"
    status: "confirmed"
    source_anchor: "L11-L11"
  -
    id: "alter_table_subpartition_fact_body_12"
    type: "constraint"
    statement: "●   若添加RANGE分区，添加分区键值要大于分区表中最后一个范围分区的上边界。"
    status: "confirmed"
    source_anchor: "L12-L13"
  -
    id: "alter_table_subpartition_fact_body_12_1"
    type: "constraint"
    statement: "若需要在有MAXVALUE分区的表上新增分区，建议使用SPLIT语法。"
    status: "confirmed"
    source_anchor: "L12-L13"
  -
    id: "alter_table_subpartition_fact_body_14"
    type: "constraint"
    statement: "●   若添加LIST分区，添加分区键值不能与现有分区键值重复。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "alter_table_subpartition_fact_body_14_1"
    type: "constraint"
    statement: "若需要在有DEFAULT 分区的表上新增分区，建议使用SPLIT语法。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "alter_table_subpartition_fact_body_16"
    type: "constraint"
    statement: "●   不支持添加HASH分区。"
    status: "confirmed"
    source_anchor: "L16-L17"
  -
    id: "alter_table_subpartition_fact_body_16_1"
    type: "constraint"
    statement: "只有一种情况例外，二级分区表的二级分区方式为HASH 且一级分区方式不是HASH，此时支持新增一级分区并创建对应的二级分区。"
    status: "confirmed"
    source_anchor: "L16-L17"
  -
    id: "alter_table_subpartition_fact_body_18"
    type: "constraint"
    statement: "●   如果目标分区表中已有分区数达到了最大值1048575，则不能继续添加分区。"
    status: "confirmed"
    source_anchor: "L18-L18"
  -
    id: "alter_table_subpartition_fact_body_19"
    type: "behavior_oracle"
    statement: "●   当分区表只有一个一级分区或二级分区时，不能删除该分区。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "alter_table_subpartition_fact_body_20"
    type: "behavior_oracle"
    statement: "●   不支持删除HASH分区。"
    status: "confirmed"
    source_anchor: "L20-L20"
  -
    id: "alter_table_subpartition_fact_body_21"
    type: "constraint"
    statement: "●   选择分区使用PARTITION FOR()或SUBPARTITION FOR()，括号里指定值个数应 该与定义分区时使用的列个数相同，并且一一对应。"
    status: "confirmed"
    source_anchor: "L21-L22"
  -
    id: "alter_table_subpartition_fact_body_23"
    type: "constraint"
    statement: "●   切割分区只能对二级分区（叶子节点）进行切割，被切割分区只能是RANGE、 LIST分区策略，不支持切割 HASH分区策略。"
    status: "confirmed"
    source_anchor: "L23-L24"
  -
    id: "alter_table_subpartition_fact_body_25"
    type: "constraint"
    statement: "●   合并分区只能对二级分区（叶子节点）进行合并，且源分区必须属于同一个一级 分区。"
    status: "confirmed"
    source_anchor: "L25-L26"
  -
    id: "alter_table_subpartition_fact_body_27"
    type: "environment"
    statement: "●   只有分区表的所有者或者被授予了分区表ALTER权限的用户有权限执行ALTER TABLE PARTITION命令，系统管理员默认拥有此权限。"
    status: "confirmed"
    source_anchor: "L27-L28"
  -
    id: "alter_table_subpartition_fact_body_30"
    type: "behavior_oracle"
    statement: "●   删除、切割、清空、交换分区的操作会使Global索引失效，可以申明UPDATE GLOBAL INDEX子句同步更新索引。"
    status: "confirmed"
    source_anchor: "L30-L31"
  -
    id: "alter_table_subpartition_fact_body_32"
    type: "behavior_oracle"
    statement: "●   如果删除、切割、清空、交换分区操作不申明UPDATE GLOBAL INDEX子句，并 发的DML业务有可能因为索引不可用而报错。"
    status: "confirmed"
    source_anchor: "L32-L33"
  -
    id: "alter_table_subpartition_fact_body_34"
    type: "behavior_oracle"
    statement: "●   若设置参数enable_gpi_auto_update为on，即使不申明UPDATE GLOBAL INDEX 子句，也会自动更新Global索引。"
    status: "confirmed"
    source_anchor: "L34-L35"
  -
    id: "alter_table_subpartition_fact_body_36"
    type: "constraint"
    statement: "●   在为数据对象增加或者变更ILM策略的时候，如果追加了行级表达式，需要注意行 表达式目前只支持白名单中列出的函数。"
    status: "confirmed"
    source_anchor: "L36-L38"
  -
    id: "alter_table_subpartition_fact_body_36_1"
    type: "constraint"
    statement: "具体白名单函数列表请参见行表达式函 数白名单。"
    status: "confirmed"
    source_anchor: "L36-L38"
  -
    id: "alter_table_subpartition_fact_body_41"
    type: "environment"
    statement: "在ILM策略的ON(EXPR)行级表达式支持的函数中，有部分函数的输出可能会受兼容性参数 影响。"
    status: "confirmed"
    source_anchor: "L41-L43"
  -
    id: "alter_table_subpartition_fact_body_41_1"
    type: "environment"
    statement: "例如，upper函数在B兼容模式下设置b_format_version='5.7'和 b_format_dev_version='s2'后，将无法转大写。"
    status: "confirmed"
    source_anchor: "L41-L43"
  -
    id: "alter_table_subpartition_fact_body_44"
    type: "behavior_oracle"
    statement: "●   开启一级/二级列表分区自动扩展要求对应层级的分区中不能存在分区键值为 DEFAULT的分区。"
    status: "confirmed"
    source_anchor: "L44-L45"
  -
    id: "alter_table_subpartition_fact_body_49"
    type: "behavior_oracle"
    statement: "修改二级分区表分区包括修改表分区主语法、修改表分区名称的语法、重置分区ID和 开启/关闭分区自动扩展功能的语法。"
    status: "confirmed"
    source_anchor: "L49-L50"
  -
    id: "alter_table_subpartition_fact_body_52"
    type: "constraint"
    statement: "●   修改表分区主语法。"
    status: "confirmed"
    source_anchor: "L52-L54"
  -
    id: "alter_table_subpartition_fact_body_52_1"
    type: "constraint"
    statement: "ALTER TABLE [ IF EXISTS ] { table_name [*] | ONLY table_name | ONLY ( table_name )} action [, ... ];"
    status: "confirmed"
    source_anchor: "L52-L54"
  -
    id: "alter_table_subpartition_fact_body_56"
    type: "constraint"
    statement: "其中action统指如下分区维护子语法。"
    status: "confirmed"
    source_anchor: "L56-L70"
  -
    id: "alter_table_subpartition_fact_body_56_1"
    type: "constraint"
    statement: "当存在多个分区维护子句时，保证了分区 的连续性，无论这些子句的排序如何，GaussDB总会先执行DROP PARTITION再 执行ADD PARTITION操作，最后顺序执行其它分区维护操作。"
    status: "confirmed"
    source_anchor: "L56-L70"
  -
    id: "alter_table_subpartition_fact_body_56_2"
    type: "constraint"
    statement: "move_clause | exchange_clause | row_clause | merge_clause | modify_clause | add_clause | drop_clause | split_clause | truncate_clause | ilm_clause | set_partitioning_clause | set_subpartition_template_clause"
    status: "confirmed"
    source_anchor: "L56-L70"
  -
    id: "alter_table_subpartition_fact_body_72"
    type: "constraint"
    statement: "–     move_clause子语法用于移动分区到新的表空间。"
    status: "confirmed"
    source_anchor: "L72-L74"
  -
    id: "alter_table_subpartition_fact_body_72_1"
    type: "constraint"
    statement: "MOVE SUBPARTITION { subpartition_name | FOR ( subpartition_value [, ...] ) } TABLESPACE tablespacename"
    status: "confirmed"
    source_anchor: "L72-L74"
  -
    id: "alter_table_subpartition_fact_body_76"
    type: "constraint"
    statement: "–     exchange_clause子语法用于把普通表的数据迁移到指定的分区。"
    status: "confirmed"
    source_anchor: "L76-L80"
  -
    id: "alter_table_subpartition_fact_body_76_1"
    type: "constraint"
    statement: "EXCHANGE SUBPARTITION { ( subpartition_name ) | FOR ( subpartition_value [, ...] ) } WITH TABLE {[ ONLY ] ordinary_table_name | ordinary_table_name * | ONLY ( ordinary_table_name )} [ { WITH | WITHOUT } VALIDATION ] [ VERBOSE ] [ UPDATE GLOBAL INDEX ]"
    status: "confirmed"
    source_anchor: "L76-L80"
  -
    id: "alter_table_subpartition_fact_body_82"
    type: "constraint"
    statement: "进行交换的普通表和分区必须满足如下条件："
    status: "confirmed"
    source_anchor: "L82-L82"
  -
    id: "alter_table_subpartition_fact_body_84"
    type: "constraint"
    statement: "▪     普通表和分区的列数目相同，对应列的信息严格一致，包括：列名、列 的数据类型、列约束、列的Collation信息、列的存储参数、列的压缩信 息等。"
    status: "confirmed"
    source_anchor: "L84-L86"
  -
    id: "alter_table_subpartition_fact_body_88"
    type: "constraint"
    statement: "▪     普通表和分区的表压缩信息严格一致。"
    status: "confirmed"
    source_anchor: "L88-L88"
  -
    id: "alter_table_subpartition_fact_body_90"
    type: "constraint"
    statement: "▪    普通表索引和分区Local索引个数相同，且对应索引的信息严格一致。"
    status: "confirmed"
    source_anchor: "L90-L90"
  -
    id: "alter_table_subpartition_fact_body_92"
    type: "constraint"
    statement: "▪    普通表和分区的表约束个数相同，且对应表约束的信息严格一致。"
    status: "confirmed"
    source_anchor: "L92-L92"
  -
    id: "alter_table_subpartition_fact_body_94"
    type: "constraint"
    statement: "▪    普通表不可以是临时表，分区表只能是二级分区表。"
    status: "confirmed"
    source_anchor: "L94-L94"
  -
    id: "alter_table_subpartition_fact_body_96"
    type: "constraint"
    statement: "▪    普通表和分区表上不可以有动态数据脱敏，行访问控制约束。"
    status: "confirmed"
    source_anchor: "L96-L96"
  -
    id: "alter_table_subpartition_fact_body_102"
    type: "constraint"
    statement: "● 完成交换后，普通表和分区的数据被置换，同时普通表和分区的表空间信 息被置换。"
    status: "confirmed"
    source_anchor: "L102-L104"
  -
    id: "alter_table_subpartition_fact_body_102_1"
    type: "constraint"
    statement: "此时，普通表和分区的统计信息变得不可靠，需要对普通表和 分区重新执行analyze。"
    status: "confirmed"
    source_anchor: "L102-L104"
  -
    id: "alter_table_subpartition_fact_body_105"
    type: "behavior_oracle"
    statement: "● 由于非分区键不能建立本地唯一索引，只能建立全局唯一索引，所以如果 普通表含有唯一索引时，可能会导致不能交换数据。"
    status: "confirmed"
    source_anchor: "L105-L109"
  -
    id: "alter_table_subpartition_fact_body_105_1"
    type: "behavior_oracle"
    statement: "如果需要进行数交换数据操作可以通过创建中间表的方式，先将分区数据 插入到中间表，truncate分区，普通表数据插入分区表，drop普通表，重 命名中间表的方式完成数据交换操作。"
    status: "confirmed"
    source_anchor: "L105-L109"
  -
    id: "alter_table_subpartition_fact_body_110"
    type: "behavior_oracle"
    statement: "● 如果在普通表/分区表上进行了drop column操作，被删除的列依然物理存 在，所以需要保证普通表和分区的被删除列也严格对齐才能交换成功。"
    status: "confirmed"
    source_anchor: "L110-L111"
  -
    id: "alter_table_subpartition_fact_body_112"
    type: "behavior_oracle"
    statement: "● 当执行交换分区操作的普通表和分区包含rowid列且处于压缩状态时，进 行交换分区后，普通表和分区的数据将被自动解压。"
    status: "confirmed"
    source_anchor: "L112-L113"
  -
    id: "alter_table_subpartition_fact_body_115"
    type: "constraint"
    statement: "–   row_clause子语法用于设置分区表的行迁移开关。"
    status: "confirmed"
    source_anchor: "L115-L116"
  -
    id: "alter_table_subpartition_fact_body_115_1"
    type: "constraint"
    statement: "{ ENABLE | DISABLE } ROW MOVEMENT"
    status: "confirmed"
    source_anchor: "L115-L116"
  -
    id: "alter_table_subpartition_fact_body_118"
    type: "constraint"
    statement: "–   merge_clause子语法用于把多个分区合并成一个分区。"
    status: "confirmed"
    source_anchor: "L118-L124"
  -
    id: "alter_table_subpartition_fact_body_118_1"
    type: "constraint"
