      - "alter_table_subpartition_fact_atomic_32_3"
    atomicity: "grouped"
    independent_claim_count: 5
  -
    id: "alter_table_subpartition_su_body_34_34"
    section: "正文"
    source_anchor: "L34-L35"
    line_start: 34
    line_end: 35
    statement: "●   若设置参数enable_gpi_auto_update为on，即使不申明UPDATE GLOBAL INDEX 子句，也会自动更新Global索引。"
    status: "mapped"
    fact_refs:
