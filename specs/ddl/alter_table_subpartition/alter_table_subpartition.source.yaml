    section: "正文"
    source_anchor: "L9-L9"
    line_start: 9
    line_end: 9
    statement: "●   添加分区的表空间不能是PG_GLOBAL。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_9"
    atomicity: "atomic"
  -
    id: "alter_table_subpartition_su_body_10_10"
    section: "正文"
    source_anchor: "L10-L10"
    line_start: 10
    line_end: 10
    statement: "●   添加分区的名称不能与该分区表已有一级分区和二级分区的名称相同。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_10"
    atomicity: "atomic"
  -
    id: "alter_table_subpartition_su_body_11_11"
    section: "正文"
    source_anchor: "L11-L11"
    line_start: 11
    line_end: 11
    statement: "●   添加分区的分区键值要和分区表的分区键的类型一致。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_11"
    atomicity: "atomic"
  -
    id: "alter_table_subpartition_su_body_12_12"
    section: "正文"
    source_anchor: "L12-L13"
    line_start: 12
    line_end: 13
    statement: "●   若添加RANGE分区，添加分区键值要大于分区表中最后一个范围分区的上边界。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_12"
      - "alter_table_subpartition_fact_body_12_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "alter_table_subpartition_su_body_14_14"
    section: "正文"
    source_anchor: "L14-L15"
    line_start: 14
    line_end: 15
    statement: "●   若添加LIST分区，添加分区键值不能与现有分区键值重复。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_14"
      - "alter_table_subpartition_fact_body_14_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "alter_table_subpartition_su_body_16_16"
    section: "正文"
    source_anchor: "L16-L17"
    line_start: 16
    line_end: 17
    statement: "●   不支持添加HASH分区。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_16"
      - "alter_table_subpartition_fact_body_16_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "alter_table_subpartition_su_body_18_18"
    section: "正文"
    source_anchor: "L18-L18"
    line_start: 18
    line_end: 18
    statement: "●   如果目标分区表中已有分区数达到了最大值1048575，则不能继续添加分区。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_18"
    atomicity: "atomic"
  -
    id: "alter_table_subpartition_su_body_19_19"
    section: "正文"
    source_anchor: "L19-L19"
    line_start: 19
    line_end: 19
    statement: "●   当分区表只有一个一级分区或二级分区时，不能删除该分区。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_19"
    atomicity: "atomic"
  -
    id: "alter_table_subpartition_su_body_20_20"
    section: "正文"
    source_anchor: "L20-L20"
    line_start: 20
    line_end: 20
    statement: "●   不支持删除HASH分区。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_20"
    atomicity: "atomic"
  -
    id: "alter_table_subpartition_su_body_21_21"
    section: "正文"
    source_anchor: "L21-L22"
    line_start: 21
    line_end: 22
    statement: "●   选择分区使用PARTITION FOR()或SUBPARTITION FOR()，括号里指定值个数应 该与定义分区时使用的列个数相同，并且一一对应。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_21"
    atomicity: "atomic"
  -
    id: "alter_table_subpartition_su_body_23_23"
    section: "正文"
    source_anchor: "L23-L24"
    line_start: 23
    line_end: 24
    statement: "●   切割分区只能对二级分区（叶子节点）进行切割，被切割分区只能是RANGE、 LIST分区策略，不支持切割 HASH分区策略。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_23"
    atomicity: "atomic"
  -
    id: "alter_table_subpartition_su_body_25_25"
    section: "正文"
    source_anchor: "L25-L26"
    line_start: 25
    line_end: 26
    statement: "●   合并分区只能对二级分区（叶子节点）进行合并，且源分区必须属于同一个一级 分区。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_25"
    atomicity: "atomic"
  -
    id: "alter_table_subpartition_su_body_27_27"
    section: "正文"
    source_anchor: "L27-L28"
    line_start: 27
    line_end: 28
    statement: "●   只有分区表的所有者或者被授予了分区表ALTER权限的用户有权限执行ALTER TABLE PARTITION命令，系统管理员默认拥有此权限。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_27"
    atomicity: "atomic"
  -
    id: "alter_table_subpartition_su_body_30_30"
    section: "正文"
    source_anchor: "L30-L31"
    line_start: 30
    line_end: 31
    statement: "●   删除、切割、清空、交换分区的操作会使Global索引失效，可以申明UPDATE GLOBAL INDEX子句同步更新索引。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_30"
      - "alter_table_subpartition_fact_global_index_oracle"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "alter_table_subpartition_su_body_32_32"
    section: "正文"
    source_anchor: "L32-L33"
    line_start: 32
    line_end: 33
    statement: "●   如果删除、切割、清空、交换分区操作不申明UPDATE GLOBAL INDEX子句，并 发的DML业务有可能因为索引不可用而报错。"
    status: "mapped"
    fact_refs:
      - "alter_table_subpartition_fact_body_32"
      - "alter_table_subpartition_fact_atomic_32_0"
      - "alter_table_subpartition_fact_atomic_32_1"
