facts:
- id: m_create_database_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.7 L2-2
- id: m_create_database_fact_syntax
  type: syntax
  statement: CREATE {DATABASE|SCHEMA} [IF NOT EXISTS] database_name [[DEFAULT] {CHARACTER SET|CHAR SET|CHARSET}
    [=] charset_name | COLLATE [=] collation_name] [,...];
  status: confirmed
  source_anchor: 2.4.2.8.7 L15-21
- id: m_create_database_fact_namespace
  type: environment
  statement: M DATABASE 与 SCHEMA 同义；不是物理建库流程。
  status: confirmed
  source_anchor: 2.4.2.8.7 L5-5
- id: m_create_database_fact_use_created
  type: behavior_oracle
  statement: 创建后可 USE 新模式并在其中创建对象。
  status: confirmed
  source_anchor: 2.4.2.8.7 L53-53
- id: m_create_database_fact_charset_description
  type: open_question
  statement: 字符集/字符序参数说明需与库级章节交叉复核；本批不猜测取值。
  status: needs_verification
  source_anchor: 2.4.2.8.7 L38-39
- id: m_create_database_fact_purpose
  type: example
  statement: M-Compatibility中DATABASE与SCHEMA是同义词。该语法表示创建模式。访问命名对象时可使用模式名作为前缀。
  status: confirmed
  source_anchor: M-Compatibility L4-4
- id: m_create_database_fact_constraint
  type: example
  statement: 当用户对当前数据库拥有CREATE权限时即具备创建新模式权限。模式名不能和当前数据库里其他模式重名，不能和初始用户重名，不能以pg_或gs_role_开头。
  status: confirmed
  source_anchor: M-Compatibility L9-12
- id: m_create_database_fact_params
  type: example
  statement: database_name是模式名称，须符合标识符说明。CHARSET指定字符集影响字符串排序。COLLATE指定排序规则。
  status: confirmed
  source_anchor: M-Compatibility L25-29
- id: m_create_database_fact_example
  type: example
  statement: m_create_database的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L50-52
