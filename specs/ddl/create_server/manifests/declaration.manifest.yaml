schema_version: 1
kind: "manifest"
id: "manifest_create_server_declaration"
name: "CREATE SERVER declaration"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "create_server"
syntax_ref: "syntax_create_server"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_create_server_transaction"
identifier_policy:
  server_name:
    generator: "deterministic"
    prefix: "srv_b7_new"
    unique_per_case: true
bindings:
  fdw:
    - "create_server_fdw_dist"
    - "create_server_fdw_log"
    - "create_server_fdw_file"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "documented_fdw_available"
    allowed_values:
      - "true"
    fact_refs:
      - "create_server_fact_fdw_environment"
