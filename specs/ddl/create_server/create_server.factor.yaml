facts:
  -
    id: "create_server_fact_purpose"
    type: "lifecycle"
    statement: "创建外部服务器，承载其他同构数据库信息。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_server_fact_sensitive"
    type: "behavior_oracle"
    statement: "敏感OPTIONS字段使用多层引号时语义不同，不会被识别脱敏。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "create_server_fact_name"
    type: "constraint"
    statement: "服务器名符合标识符规范且不超过63个字符。"
    status: "confirmed"
    source_anchor: "L20-L22"
  -
    id: "create_server_fact_fdw"
    type: "syntax"
    statement: "FOREIGN DATA WRAPPER指定封装器。"
    status: "confirmed"
    source_anchor: "L23-L24"
  -
    id: "create_server_fact_fdw_environment"
    type: "environment"
    statement: "本章FDW取值为dist_fdw、log_fdw、file_fdw。"
    status: "confirmed"
    source_anchor: "L26-L27"
  -
    id: "create_server_fact_options"
    type: "syntax"
    statement: "OPTIONS指定连接细节；名称和值取决于封装器，包含libpq支持的连接参数。"
    status: "confirmed"
    source_anchor: "L28-L31"
  -
    id: "create_server_fact_startup"
    type: "constraint"
    statement: "fdw_startup_cost表示扫描启动耗时估计，默认100且必须大于0。"
    status: "confirmed"
    source_anchor: "L32-L35"
  -
    id: "create_server_fact_tuple_spelling"
    type: "constraint"
    statement: "本章写fdw_typle_cost，表示每元组传输额外消耗，默认0.01且必须大于0。"
    status: "confirmed"
    source_anchor: "L36-L39"
  -
    id: "create_server_fact_syntax"
    type: "syntax"
    statement: "CREATE SERVER指定名称及FDW后可选重复OPTIONS。"
    status: "confirmed"
    source_anchor: "L12-L14"
  -
    id: "create_server_fact_ex_file"
    type: "example"
    statement: "示例在file_fdw已存在时创建服务器。"
    status: "confirmed"
    source_anchor: "L42-L44"
  -
    id: "create_server_fact_ex_drop"
    type: "example"
    statement: "删除示例服务器。"
    status: "confirmed"
    source_anchor: "L46-L47"
  -
    id: "create_server_fact_ex_log"
    type: "example"
    statement: "示例以log_fdw设置地址、数据库、用户名和脱敏密码。"
    status: "confirmed"
    source_anchor: "L49-L57"
  -
    id: "create_server_fact_ex_drop_remote"
    type: "example"
    statement: "删除示例远端服务器。"
    status: "confirmed"
    source_anchor: "L59-L60"
  -
    id: "create_server_fact_tuple_keyword_review"
    type: "constraint"
    statement: "静态域不生成tuple cost参数；CREATE SERVER的fdw_typle_cost与ALTER SERVER的fdw_tuple_cost拼写差异保留为来源限制。"
    status: "confirmed"
    source_anchor: "L36-L39"
  -
    id: "create_server_fact_connection_profiles"
    type: "environment"
    statement: "静态CREATE SERVER代表仅声明三种文档FDW；真实连接选项、密钥注入、成本参数和FDW兼容Profile需专用环境，普通manifest不建立连接。"
    status: "confirmed"
    source_anchor: "L28-L31"
  -
    id: "create_server_fact_compatibility_only"
    type: "behavior_oracle"
    statement: "log_fdw和file_fdw仅语法兼容，可以创建外表但无实际使用意义。"
    status: "confirmed"
    source_anchor: "L26-L27"
