steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "建立用户到外部服务器的映射，映射与服务器连接信息共同供FDW访问数据源。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "获得服务器USAGE的用户可为自己的用户名创建映射。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "PASSWORD选项要求每节点存在可读usermapping.key.cipher/rand；缺失时需独立工具生成分发。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "多层引号的敏感选项可能不被识别脱敏。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "USER和CURRENT_USER匹配当前用户；没有特定用户映射时采用PUBLIC映射。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "用户映射引用已有服务器。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
