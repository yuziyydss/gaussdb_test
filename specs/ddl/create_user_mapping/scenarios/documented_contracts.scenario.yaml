    id: "contract_8"
    action: "verify_documented_contract"
    note: "gs_guc -S default随机生成密钥密码，也可指定保护密码；用户无需记忆。"
  -
    id: "server_owner"
    action: "verify_documented_contract"
    note: "外部服务器所有者可为任意用户创建该服务器的映射。"
oracles:
