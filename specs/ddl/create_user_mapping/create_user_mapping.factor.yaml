    status: "confirmed"
    source_anchor: "L33-L35"
  -
    id: "create_user_mapping_fact_storage"
    type: "metadata_oracle"
    statement: "用户密码加密保存在PG_USER_MAPPING，依赖各节点可读的密钥文件。"
    status: "confirmed"
    source_anchor: "L38-L42"
