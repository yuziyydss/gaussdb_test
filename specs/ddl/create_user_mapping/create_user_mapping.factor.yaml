facts:
  -
    id: "create_user_mapping_fact_purpose"
    type: "lifecycle"
    statement: "映射与服务器连接信息共同供FDW访问数据源。"
    status: "confirmed"
    source_anchor: "L5-L7"
  -
    id: "create_user_mapping_fact_privilege"
    type: "environment"
    statement: "获得服务器USAGE的用户可为自己的用户名创建映射。"
    status: "confirmed"
    source_anchor: "L8-L8"
