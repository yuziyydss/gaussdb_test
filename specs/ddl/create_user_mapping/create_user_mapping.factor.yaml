    id: "create_user_mapping_fact_keys"
    type: "environment"
    statement: "PASSWORD选项要求每节点存在可读usermapping.key.cipher/rand；缺失时需独立工具生成分发。"
    status: "confirmed"
    source_anchor: "L11-L15"
  -
    id: "create_user_mapping_fact_sensitive"
    type: "behavior_oracle"
    statement: "多层引号的敏感选项可能不被识别脱敏。"
    status: "confirmed"
    source_anchor: "L17-L18"
  -
    id: "create_user_mapping_fact_user"
    type: "syntax"
    statement: "目标为已有用户名或USER/CURRENT_USER/PUBLIC。"
    status: "confirmed"
    source_anchor: "L27-L28"
  -
    id: "create_user_mapping_fact_public"
    type: "behavior_oracle"
    statement: "USER和CURRENT_USER匹配当前用户；没有特定用户映射时采用PUBLIC映射。"
    status: "confirmed"
    source_anchor: "L29-L30"
  -
    id: "create_user_mapping_fact_server"
