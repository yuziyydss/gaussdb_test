schema_version: 1
kind: "syntax"
id: "syntax_create_user_mapping"
name: "CREATE USER MAPPING 语法"
factor_ref: "create_user_mapping"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  mapped_user:
    type: "token"
    optional: true
    dimension_ref: "create_user_mapping.mapped_user"
  options:
    type: "token"
    optional: true
    dimension_ref: "create_user_mapping.options"
source_fact_refs:
  - "create_user_mapping_fact_syntax"
  - "create_user_mapping_fact_user"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "CREATE USER MAPPING FOR "
    -
      kind: "slot"
      slot: "mapped_user"
    -
      kind: "literal"
      text: " SERVER srv_map_b7"
    -
      kind: "optional"
      selector: "options"
      enabled_values:
        - "create_user_mapping_options_user"
      item:
        kind: "sequence"
        items:
          -
            kind: "literal"
            text: " OPTIONS ("
          -
            kind: "repeat"
            slot: "options"
            separator: ", "
            items_property: "items"
          -
            kind: "literal"
            text: ")"
