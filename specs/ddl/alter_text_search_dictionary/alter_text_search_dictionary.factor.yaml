facts:
  -
    id: "alter_text_search_dictionary_fact_internal"
    type: "environment"
    statement: "内部功能，不建议用户使用。"
    status: "confirmed"
    source_anchor: "L7-L7"
  -
    id: "alter_text_search_dictionary_fact_purpose"
    type: "lifecycle"
    statement: "修改词典参数/名称/所有者/模式。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "alter_text_search_dictionary_fact_predefined"
    type: "constraint"
    statement: "预定义词典不支持 ALTER。"
    status: "confirmed"
    source_anchor: "L15-L15"
  -
    id: "alter_text_search_dictionary_fact_owner"
    type: "environment"
    statement: "仅词典所有者，三权分立关闭时管理员默认有权。"
    status: "confirmed"
    source_anchor: "L16-L17"
  -
    id: "alter_text_search_dictionary_fact_file_refresh"
    type: "lifecycle"
    statement: "修改外部文件不会自动影响数据库词典，须 ALTER 更新。"
    status: "confirmed"
    source_anchor: "L18-L20"
  -
    id: "alter_text_search_dictionary_fact_cached_plan"
    type: "behavior_oracle"
    statement: "词典变更不会立即刷新缓存查询计划，可能需清缓存。"
    status: "confirmed"
    source_anchor: "L21-L25"
  -
    id: "alter_text_search_dictionary_fact_options"
    type: "syntax"
    statement: "名称后括号中重复 option，可省等号和值。"
    status: "confirmed"
    source_anchor: "L28-L31"
  -
    id: "alter_text_search_dictionary_fact_rename"
    type: "syntax"
    statement: "RENAME TO 新名。"
    status: "confirmed"
    source_anchor: "L33-L34"
  -
    id: "alter_text_search_dictionary_fact_schema"
    type: "syntax"
    statement: "SET SCHEMA 新模式。"
    status: "confirmed"
    source_anchor: "L39-L40"
  -
    id: "alter_text_search_dictionary_fact_change_owner"
    type: "syntax"
    statement: "OWNER TO 新所有者。"
    status: "confirmed"
    source_anchor: "L45-L46"
  -
    id: "alter_text_search_dictionary_fact_name"
    type: "constraint"
    statement: "已有词典，可模式限定，默认当前模式。"
    status: "confirmed"
    source_anchor: "L52-L54"
  -
    id: "alter_text_search_dictionary_fact_option"
    type: "syntax"
    statement: "参数由模板决定，与指定顺序无关，引用 CREATE 章节。"
    status: "confirmed"
    source_anchor: "L55-L58"
  -
    id: "alter_text_search_dictionary_fact_no_template_change"
    type: "constraint"
    statement: "不能修改 TEMPLATE。"
    status: "confirmed"
    source_anchor: "L61-L61"
  -
    id: "alter_text_search_dictionary_fact_path_pair"
    type: "constraint"
    statement: "不能只修改 FILEPATH 而不修改定义文件参数。"
    status: "confirmed"
    source_anchor: "L62-L62"
  -
    id: "alter_text_search_dictionary_fact_filename"
    type: "constraint"
    statement: "文件名仅小写字母/数字/下划线。"
    status: "confirmed"
    source_anchor: "L63-L63"
  -
    id: "alter_text_search_dictionary_fact_reset"
    type: "behavior_oracle"
    statement: "省略等号和值表示删除设置并使用默认值。"
    status: "confirmed"
    source_anchor: "L64-L67"
  -
    id: "alter_text_search_dictionary_fact_new_name"
    type: "syntax"
    statement: "新名遵循标识符规则，最长63字符。"
    status: "confirmed"
    source_anchor: "L68-L70"
  -
    id: "alter_text_search_dictionary_fact_new_owner"
    type: "constraint"
    statement: "新所有者为已存在用户。"
    status: "confirmed"
    source_anchor: "L71-L73"
  -
    id: "alter_text_search_dictionary_fact_new_schema"
    type: "constraint"
    statement: "新模式必须存在。"
    status: "confirmed"
    source_anchor: "L74-L76"
  -
    id: "alter_text_search_dictionary_fact_create_examples"
    type: "example"
    statement: "Simple词典两个实例。"
    status: "confirmed"
    source_anchor: "L79-L83"
  -
    id: "alter_text_search_dictionary_fact_changes_examples"
    type: "example"
    statement: "重命名及 ACCEPT 修改/重置。"
    status: "confirmed"
    source_anchor: "L85-L92"
  -
    id: "alter_text_search_dictionary_fact_dummy_example"
    type: "example"
    statement: "示例用 dummy 更新但不改内容，然后清理。"
    status: "confirmed"
    source_anchor: "L94-L99"
  -
    id: "alter_text_search_dictionary_fact_template_profiles"
    type: "constraint"
    statement: "静态域仅生成Simple ACCEPT代表；其他模板参数、重复参数和模板专有能力保留为来源限制。"
    status: "confirmed"
    source_anchor: "L55-L58"
  -
    id: "alter_text_search_dictionary_fact_owner_profile"
    type: "environment"
    statement: "静态候选不创建或删除角色；OWNER变更需预配置专用角色环境。"
    status: "confirmed"
    source_anchor: "L71-L73"
  -
    id: "alter_text_search_dictionary_fact_dummy_profile"
    type: "constraint"
    statement: "dummy仅来自示例且通用有效范围未说明；静态域不生成dummy分支，保留为来源限制。"
    status: "confirmed"
    source_anchor: "L64-L67"
