schema_version: 1
kind: "scenario"
id: "scenario_alter_text_search_dictionary_accept_reset"
name: "ALTER TEXT SEARCH DICTIONARY accept_reset"
status: "planned"
description: "重置 ACCEPT 后恢复默认 true 的识别行为。"
factor_ref: "alter_text_search_dictionary"
fixture_refs:
  - "fixture_alter_text_search_dictionary_simple"
fact_refs:
  - "alter_text_search_dictionary_fact_reset"
preconditions:
  - "SYSADMIN与内部功能测试已授权"
steps:
  -
    id: "false"
    action: "execute_sql"
    sql: "ALTER TEXT SEARCH DICTIONARY fp_tsd_simple (ACCEPT=false);"
  -
    id: "reset"
    action: "execute_sql"
    sql: "ALTER TEXT SEARCH DICTIONARY fp_tsd_simple (ACCEPT);"
  -
    id: "probe"
    action: "execute_sql"
    sql: "SELECT ts_lexize('fp_tsd_simple', 'HELLO');"
oracles:
  -
    after_step: "probe"
    kind: "result_rows"
    expected:
      -
        -
          - "hello"
execution_requirements:
  - "database"
  - "same_session"
