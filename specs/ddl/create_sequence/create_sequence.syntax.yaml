schema_version: 1
kind: syntax
id: syntax_create_sequence_v1
name: CREATE SEQUENCE 线性产生式
category: DDL
status: ready
factor_ref: create_sequence
description: >-
  按 PDF 保留 LARGE/TEMPORARY/TEMP 互斥前缀以及所有可选子句的固定顺序；
  数值代表域由 factor 维护。
production: >-
  CREATE {sequence_kind}SEQUENCE {if_not_exists}{sequence_name}{increment_clause}{min_clause}{max_clause}{start_clause}{cache_clause}{cycle_clause}{owned_by_clause}
rendering: {whitespace: collapse, statement_terminator: ";"}
slots:
  sequence_kind: {type: token, optional: true, dimension_ref: create_sequence.sequence_kind}
  if_not_exists: {type: token, optional: true, dimension_ref: create_sequence.if_not_exists}
  sequence_name: {type: identifier, optional: false, symbol_action: creates_sequence, identifier_role: sequence}
  increment_clause: {type: sql_fragment, optional: true, dimension_ref: create_sequence.increment_clause}
  min_clause: {type: sql_fragment, optional: true, dimension_ref: create_sequence.min_clause}
  max_clause: {type: sql_fragment, optional: true, dimension_ref: create_sequence.max_clause}
  start_clause: {type: sql_fragment, optional: true, dimension_ref: create_sequence.start_clause}
  cache_clause: {type: sql_fragment, optional: true, dimension_ref: create_sequence.cache_clause}
  cycle_clause: {type: sql_fragment, optional: true, dimension_ref: create_sequence.cycle_clause}
  owned_by_clause: {type: sql_fragment, optional: true, dimension_ref: create_sequence.owned_by_clause}
source_fact_refs:
  - cs_fact_purpose
  - cs_fact_grammar
  - cs_fact_large_width
  - cs_fact_temporary_keywords
  - cs_fact_if_not_exists
  - cs_fact_increment
  - cs_fact_min_syntax
  - cs_fact_max_syntax
  - cs_fact_start
  - cs_fact_cache
  - cs_fact_cycle_syntax
  - cs_fact_owned_by_syntax
