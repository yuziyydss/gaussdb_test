schema_version: 1
kind: manifest
id: manifest_create_sequence_temporary_positive
name: CREATE TEMPORARY SEQUENCE PG 模式
status: ready
description: 在显式 PG 兼容环境门禁下覆盖 TEMPORARY 与 TEMP 两种拼写。
factor_ref: create_sequence
syntax_ref: syntax_create_sequence_v1
suite_type: positive
strategy: pairwise
fixture_refs: []
environment_requirements:
  - {key: compatibility_mode, allowed_values: [PG], fact_refs: [cs_fact_temp_pg_mode]}
identifier_policy: {sequence_name: {generator: deterministic, prefix: seq_cs_tmp, unique_per_case: true}}
bindings:
  sequence_kind: [cs_kind_temporary, cs_kind_temp]
  if_not_exists: [cs_if_absent, cs_if_present]
  increment_clause: [cs_increment_default, cs_increment_positive, cs_increment_negative]
  min_clause: [cs_min_absent, cs_min_no]
  max_clause: [cs_max_absent, cs_max_no]
  start_clause: [cs_start_absent, cs_start_one]
  cache_clause: [cs_cache_absent, cs_cache_one]
  cycle_clause: [cs_cycle_absent, cs_cycle, cs_no_cycle]
  owned_by_clause: [cs_owned_absent, cs_owned_none]
local_rules:
  - expression: "increment_clause != 'cs_increment_negative' or start_clause == 'cs_start_absent'"
    rationale: 本临时序列清单没有正的显式 MAXVALUE 值；递减序列省略 MAXVALUE 时默认最大值为 -1，因此不与正 START 组合为成功用例。
    fact_refs: [cs_fact_max_defaults, cs_fact_start]
expected: {default: success, scope: syntax_and_semantics}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
