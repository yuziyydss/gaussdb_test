schema_version: 1
kind: manifest
id: manifest_create_sequence_float_b_fresh
name: B模式浮点序列1.5有限候选
status: needs_review
description: 普通序列、正浮点1.5、明确边界与OWNED BY清理；不预判舍入结果。
factor_ref: create_sequence
syntax_ref: syntax_create_sequence_v1
suite_type: positive
strategy: pairwise
fixture_refs: []
identifier_policy: {sequence_name: {generator: deterministic, prefix: seq_cs_float, unique_per_case: true}}
bindings:
  sequence_kind: [cs_kind_regular]
  if_not_exists: [cs_if_absent]
  increment_clause: [cs_increment_float_b_fresh]
  min_clause: [cs_min_one]
  max_clause: [cs_max_hundred]
  start_clause: [cs_start_one]
  cache_clause: [cs_cache_absent]
  cycle_clause: [cs_no_cycle]
  owned_by_clause: [cs_owned_float_fixture]
local_rules:
- expression: "sequence_kind == 'cs_kind_regular' and if_not_exists == 'cs_if_absent' and owned_by_clause == 'cs_owned_float_fixture' and min_clause == 'cs_min_one' and max_clause == 'cs_max_hundred' and start_clause == 'cs_start_one' and cache_clause == 'cs_cache_absent' and cycle_clause == 'cs_no_cycle'"
  rationale: 本清单的有限作用域，尤其从属列不得移除，否则单表teardown不能清理目标序列；不是产品全域禁止其他选项。
  fact_refs: [cs_fact_owned_by_lifecycle, cs_fact_min_defaults, cs_fact_max_defaults, cs_fact_start]
environment_requirements:
- {key: compatibility_mode, allowed_values: [B], fact_refs: [cs_fact_float_increment_mode]}
- {key: executor_authority, allowed_values: [create_any_table_and_sequence], fact_refs: [cs_fact_permissions, "create_table::ct_fact_create_permissions"]}
- {key: case_namespace, allowed_values: [fresh_user_schema], fact_refs: [cs_fact_permissions]}
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
