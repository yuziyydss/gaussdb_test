schema_version: 1
kind: factor
id: create_sequence
name: CREATE SEQUENCE
category: DDL
status: needs_review
description: >-
  基于 GaussDB V2.0-10.0.0 集中式版 1.13.9.45 的 PDF-first 因子包；
  静态生成覆盖有限数值代表域，模式、生命周期与序列取值行为保留为计划场景。
source:
  product: GaussDB
  document: GaussDB V2.0-10.0.0 集中式版参考 / 1.13.9.45 CREATE SEQUENCE
  version: V2.0-10.0.0
  artifact_sha256: 7602ebc802355cb0dc09b808a72d12f4a94d5d6117d9b9071e08d8a6a48db008
  parent_pdf_sha256: 716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe
  extraction_rule_version: gaussdb-pdf-outline-v1
  extraction_date: "2026-09-04"
  catalog_chapter_ref:
    document_id: gaussdb_v2_0_10_0_0_centralized_reference_01
    source_relpath: general/ddl/create_sequence.txt
    chapter_sha256: 7602ebc802355cb0dc09b808a72d12f4a94d5d6117d9b9071e08d8a6a48db008
source_ledger_ref: source_ledger_create_sequence
syntax_ref: syntax_create_sequence_v1
dimensions:
  sequence_kind:
    description: 普通、LARGE 或 PG 模式临时序列关键字。
    default_value_id: cs_kind_regular
    classes:
      - id: cs_kind_regular_class
        meaning: 普通 int64 序列。
        values:
          - {id: cs_kind_regular, render: "", representative: true, validity: valid}
      - id: cs_kind_large_class
        meaning: LARGE int128 序列。
        values:
          - {id: cs_kind_large, render: "LARGE ", representative: true, validity: valid, fact_refs: [cs_fact_large_width]}
      - id: cs_kind_temporary_class
        meaning: 仅在 PG 兼容模式生成的临时序列同义词。
        values:
          - {id: cs_kind_temporary, render: "TEMPORARY ", representative: true, validity: valid, fact_refs: [cs_fact_temporary_keywords, cs_fact_temp_pg_mode]}
          - {id: cs_kind_temp, render: "TEMP ", representative: false, validity: valid, fact_refs: [cs_fact_temporary_keywords, cs_fact_temp_pg_mode]}
  if_not_exists:
    description: 当前 Schema 同名 relation 的 NOTICE 保护。
    default_value_id: cs_if_absent
    classes:
      - id: cs_if_class
        meaning: 省略或声明 IF NOT EXISTS。
        values:
          - {id: cs_if_absent, render: "", representative: true, validity: valid}
          - {id: cs_if_present, render: "IF NOT EXISTS ", representative: true, validity: valid, fact_refs: [cs_fact_if_not_exists]}
  increment_clause:
    description: 有限覆盖省略、BY 可选、正负整数和 B 模式浮点代表值。
    default_value_id: cs_increment_default
    classes:
      - id: cs_increment_omitted_class
        meaning: 使用默认步长 1。
        values:
          - {id: cs_increment_default, render: "", representative: true, validity: valid}
      - id: cs_increment_integer_class
        meaning: 明确整数步长代表值。
        values:
          - {id: cs_increment_positive, render: " INCREMENT 10", representative: true, validity: valid, fact_refs: [cs_fact_increment]}
          - {id: cs_increment_positive_by, render: " INCREMENT BY 2", representative: true, validity: valid, fact_refs: [cs_fact_increment]}
          - {id: cs_increment_negative, render: " INCREMENT -2", representative: true, validity: valid, fact_refs: [cs_fact_increment]}
      - id: cs_increment_float_class
        meaning: 仅 B 模式可转换的浮点步长代表值。
        values:
          - {id: cs_increment_float_b, render: " INCREMENT 1.5", representative: true, validity: conditional, fact_refs: [cs_fact_float_increment_mode]}
      - id: cs_increment_float_finite_class
        meaning: 同一1.5输入在明确B与PG环境中的独立有限facet，不提升泛化conditional。
        values:
          - {id: cs_increment_float_b_fresh, render: " INCREMENT 1.5", representative: true, validity: valid, properties: {required_compatibility_modes: [B]}, fact_refs: [cs_fact_float_increment_mode]}
          - {id: cs_increment_float_pg_invalid, render: " INCREMENT 1.5", representative: true, validity: invalid, properties: {required_compatibility_modes: [PG]}, fact_refs: [cs_fact_float_non_b_restriction]}
  min_clause:
    description: 最小值子句与两个等价的无下界拼写。
    default_value_id: cs_min_absent
    classes:
      - id: cs_min_omitted_class
        meaning: 省略并使用方向/位宽默认值。
        values:
          - {id: cs_min_absent, render: "", representative: true, validity: valid}
      - id: cs_min_explicit_class
        meaning: 显式最小值。
        values:
          - {id: cs_min_one, render: " MINVALUE 1", representative: true, validity: valid, fact_refs: [cs_fact_min_syntax]}
      - id: cs_min_none_class
        meaning: 等价的 NO MINVALUE 拼写。
        values:
          - {id: cs_min_no, render: " NO MINVALUE", representative: true, validity: valid, fact_refs: [cs_fact_min_syntax]}
          - {id: cs_min_nomin, render: " NOMINVALUE", representative: false, validity: valid, fact_refs: [cs_fact_min_syntax]}
  max_clause:
    description: 最大值子句与两个等价的无上界拼写。
    default_value_id: cs_max_absent
    classes:
      - id: cs_max_omitted_class
        meaning: 省略并使用方向/位宽默认值。
        values:
          - {id: cs_max_absent, render: "", representative: true, validity: valid}
      - id: cs_max_explicit_class
        meaning: 显式最大值。
        values:
          - {id: cs_max_hundred, render: " MAXVALUE 100", representative: true, validity: valid, fact_refs: [cs_fact_max_syntax]}
      - id: cs_max_none_class
        meaning: 等价的 NO MAXVALUE 拼写。
        values:
          - {id: cs_max_no, render: " NO MAXVALUE", representative: true, validity: valid, fact_refs: [cs_fact_max_syntax]}
          - {id: cs_max_nomax, render: " NOMAXVALUE", representative: false, validity: valid, fact_refs: [cs_fact_max_syntax]}
  start_clause:
    description: 起始值以及可选 WITH 关键字。
    default_value_id: cs_start_absent
    classes:
      - id: cs_start_omitted_class
        meaning: 使用方向对应的默认边界。
        values:
          - {id: cs_start_absent, render: "", representative: true, validity: valid}
      - id: cs_start_explicit_class
        meaning: 显式起始值拼写。
        values:
          - {id: cs_start_one, render: " START 1", representative: true, validity: valid, fact_refs: [cs_fact_start]}
          - {id: cs_start_with_ten, render: " START WITH 10", representative: true, validity: valid, fact_refs: [cs_fact_start]}
  cache_clause:
    description: 省略或显式缓存数量代表值。
    default_value_id: cs_cache_absent
    classes:
      - id: cs_cache_omitted_class
        meaning: 默认缓存 1。
        values:
          - {id: cs_cache_absent, render: "", representative: true, validity: valid}
      - id: cs_cache_explicit_class
        meaning: 显式缓存代表值。
        values:
          - {id: cs_cache_one, render: " CACHE 1", representative: true, validity: valid, fact_refs: [cs_fact_cache]}
          - {id: cs_cache_five, render: " CACHE 5", representative: true, validity: valid, fact_refs: [cs_fact_cache]}
  cycle_clause:
    description: 循环、非循环和非循环同义拼写。
    default_value_id: cs_cycle_absent
    classes:
      - id: cs_cycle_omitted_class
        meaning: 省略并采用 NO CYCLE 默认。
        values:
          - {id: cs_cycle_absent, render: "", representative: true, validity: valid}
      - id: cs_cycle_enabled_class
        meaning: 达到边界后循环。
        values:
          - {id: cs_cycle, render: " CYCLE", representative: true, validity: valid, fact_refs: [cs_fact_cycle_syntax]}
      - id: cs_cycle_disabled_class
        meaning: 两种等价非循环拼写。
        values:
          - {id: cs_no_cycle, render: " NO CYCLE", representative: true, validity: valid, fact_refs: [cs_fact_cycle_syntax]}
          - {id: cs_nocycle, render: " NOCYCLE", representative: false, validity: valid, fact_refs: [cs_fact_cycle_syntax]}
  owned_by_clause:
    description: 省略、显式 NONE 或关联同模式同所有者表列。
    default_value_id: cs_owned_absent
    classes:
      - id: cs_owned_none_class
        meaning: 不建立列依赖。
        values:
          - {id: cs_owned_absent, render: "", representative: true, validity: valid}
          - {id: cs_owned_none, render: " OWNED BY NONE", representative: false, validity: valid, properties: {system_column: false}, fact_refs: [cs_fact_owned_by_syntax]}
      - id: cs_owned_column_class
        meaning: 关联 fixture 中同模式表列。
        values:
          - id: cs_owned_column
            render: " OWNED BY t_cs_owner.id"
            representative: true
            validity: valid
            fixture_refs: [fixture_create_sequence_owner_table]
            properties: {source_tables: [t_cs_owner], source_columns: [id], system_column: false}
            fact_refs: [cs_fact_owned_by_syntax, cs_fact_owned_by_lifecycle]
      - id: cs_owned_system_column_class
        meaning: PDF 明确禁止的系统列关联。
        values:
          - id: cs_owned_rowid_invalid
            render: " OWNED BY t_cs_owner.rowid"
            representative: true
            validity: invalid
            properties: {system_column: true, requires_profile: true}
            fact_refs: [cs_fact_system_column_restriction]
      - id: cs_owned_float_fixture_class
        meaning: 专属fresh表的用户列；删除本表按文档自动删除其从属序列。
        values:
          - id: cs_owned_float_fixture
            render: " OWNED BY t_cs_float_owner.id"
            representative: true
            validity: valid
            fixture_refs: [fixture_create_sequence_float_owner]
            properties: {source_tables: [t_cs_float_owner], source_columns: [id], system_column: false}
            fact_refs: [cs_fact_owned_by_syntax, cs_fact_owned_by_lifecycle]
rules:
  - id: cs_rule_float_non_b
    kind: requires
    expression: increment_clause != 'cs_increment_float_pg_invalid'
    severity: error
    fact_refs: [cs_fact_float_non_b_restriction]
  - id: cs_rule_owned_by_non_system_column
    kind: requires
    expression: owned_by_clause != 'cs_owned_rowid_invalid'
    severity: error
    fact_refs: [cs_fact_system_column_restriction]
structural_checks: []
facts:
  - {id: cs_fact_purpose, type: syntax, statement: "CREATE SEQUENCE 向当前数据库增加一个新序列。", status: confirmed, source_anchor: "L5-L6"}
  - {id: cs_fact_sequence_nature, type: behavior_oracle, statement: "序列是存放等差数列的特殊表，通常用于生成唯一标识符。", status: confirmed, source_anchor: "L8-L9"}
  - {id: cs_fact_owner, type: metadata_oracle, statement: "序列所有者为创建用户。", status: confirmed, source_anchor: "L10"}
  - {id: cs_fact_schema_placement, type: metadata_oracle, statement: "指定模式时在指定模式创建，否则在当前模式创建。", status: confirmed, source_anchor: "L11-L13"}
  - {id: cs_fact_namespace_unique, type: constraint, statement: "序列名须区别于同模式的序列、表、索引、视图和外表。", status: confirmed, source_anchor: "L11-L13"}
  - {id: cs_fact_generate_series_calls, type: behavior_oracle, statement: "nextval 与 generate_series(1,N) 联用会调用 N+1 次，可调用次数不足时报错。", status: confirmed, source_anchor: "L14-L16"}
  - {id: cs_fact_permissions, type: environment, statement: "CREATE ANY SEQUENCE 用户可在 PUBLIC 模式和用户模式创建序列。", status: confirmed, source_anchor: "L17-L18"}
  - {id: cs_fact_system_column_restriction, type: constraint, statement: "不支持将序列与 rowid 或 rowno 系统列关联。", status: confirmed, source_anchor: "L19"}
  - {id: cs_fact_grammar, type: syntax, statement: "CREATE SEQUENCE 产生式包含序列类型、IF NOT EXISTS、增量、边界、起点、缓存、循环与 OWNED BY。", status: confirmed, source_anchor: "L22-L27"}
  - {id: cs_fact_large_width, type: syntax, statement: "LARGE 创建 int128 序列，省略时为 int64。", status: confirmed, source_anchor: "L33-L35"}
  - {id: cs_fact_large_maximum, type: behavior_oracle, statement: "普通序列默认最大值 2^63-1，LARGE 支持到 2^127-1。", status: confirmed, source_anchor: "L36-L37"}
  - {id: cs_fact_temporary_keywords, type: syntax, statement: "TEMPORARY 与 TEMP 是临时序列关键字。", status: confirmed, source_anchor: "L38-L39"}
  - {id: cs_fact_temp_pg_mode, type: environment, statement: "创建临时序列需要 PG 兼容模式。", status: confirmed, source_anchor: "L42"}
  - {id: cs_fact_temp_lifecycle, type: lifecycle, statement: "临时序列会话隔离且会话退出后自动删除。", status: confirmed, source_anchor: "L43-L44"}
  - {id: cs_fact_temp_schema, type: lifecycle, statement: "每个会话仅有一个临时模式，模式名能否显式给出取决于临时模式是否已创建。", status: confirmed, source_anchor: "L45-L47"}
  - {id: cs_fact_temp_access, type: behavior_oracle, statement: "只能访问本会话临时模式对象，访问其他会话临时模式会报错。", status: confirmed, source_anchor: "L47-L48"}
  - {id: cs_fact_temp_shadowing, type: behavior_oracle, statement: "同名临时序列遮蔽永久序列，模式限定名称仍可引用永久序列。", status: confirmed, source_anchor: "L49-L50"}
  - {id: cs_fact_if_not_exists, type: lifecycle, statement: "当前 Schema 存在同名 relation 时 IF NOT EXISTS 返回 NOTICE 且不新建，省略时返回 ERROR。", status: confirmed, source_anchor: "L51-L55"}
  - {id: cs_fact_name_domain, type: constraint, statement: "序列名须符合标识符规范且不超过 63 字符。", status: confirmed, source_anchor: "L56-L58"}
  - {id: cs_fact_increment, type: syntax, statement: "increment 可正可负，分别递增和递减，默认 1，BY 可省略。", status: confirmed, source_anchor: "L59-L64"}
  - {id: cs_fact_float_increment_mode, type: environment, statement: "B 模式浮点步长自动转为整数，其他模式不支持浮点步长。", status: confirmed, source_anchor: "L68-L69"}
  - {id: cs_fact_float_non_b_restriction, type: constraint, statement: "非B模式不接受浮点数increment，本批负向代表只选PG。", status: confirmed, source_anchor: "L68-L69"}
  - {id: cs_fact_min_syntax, type: syntax, statement: "MINVALUE、NO MINVALUE 与 NOMINVALUE 是可选最小值形态，后两者等价。", status: confirmed, source_anchor: "L70-L72"}
  - {id: cs_fact_min_defaults, type: behavior_oracle, statement: "省略最小值时按递增/递减和 int64/int128 决定默认最小值。", status: confirmed, source_anchor: "L72-L76"}
  - {id: cs_fact_max_syntax, type: syntax, statement: "MAXVALUE、NO MAXVALUE 与 NOMAXVALUE 是可选最大值形态，后两者等价。", status: confirmed, source_anchor: "L77-L79"}
  - {id: cs_fact_max_defaults, type: behavior_oracle, statement: "省略最大值时按递增/递减和 int64/int128 决定默认最大值。", status: confirmed, source_anchor: "L79-L83"}
  - {id: cs_fact_start, type: syntax, statement: "START 可选，WITH 可省略；默认值随方向取 minvalue 或 maxvalue。", status: confirmed, source_anchor: "L84-L86"}
  - {id: cs_fact_cache, type: syntax, statement: "CACHE 指定内存预存序列号数量，默认 1。", status: confirmed, source_anchor: "L87-L89"}
  - {id: cs_fact_cache_guidance, type: behavior_oracle, statement: "cache 与显式边界不建议同时使用，缓存可能造成空洞和号段浪费。", status: confirmed, source_anchor: "L93-L94"}
  - {id: cs_fact_cycle_syntax, type: syntax, statement: "CYCLE 启用循环，NO CYCLE 与 NOCYCLE 等价且为默认。", status: confirmed, source_anchor: "L95-L100"}
  - {id: cs_fact_no_cycle_exhaustion, type: behavior_oracle, statement: "NO CYCLE 序列达到最大值后 nextval 返回错误。", status: confirmed, source_anchor: "L97-L99"}
  - {id: cs_fact_cycle_uniqueness, type: behavior_oracle, statement: "CYCLE 序列不保证唯一性。", status: confirmed, source_anchor: "L100"}
  - {id: cs_fact_owned_by_syntax, type: syntax, statement: "OWNED BY 可关联 table.column 或 NONE，缺省为 NONE。", status: confirmed, source_anchor: "L101-L106"}
  - {id: cs_fact_owned_by_lifecycle, type: lifecycle, statement: "删除关联列或表会自动删除序列，且表与序列必须同所有者、同模式。", status: confirmed, source_anchor: "L102-L105"}
  - {id: cs_fact_owned_by_no_autoincrement, type: behavior_oracle, statement: "OWNED BY 只建立依赖，不会自动为插入生成自增值。", status: confirmed, source_anchor: "L104-L105"}
  - {id: cs_fact_owned_by_guidance, type: environment, statement: "从属特定表的序列不建议供其他表共享。", status: confirmed, source_anchor: "L110-L111"}
  - {id: cs_fact_example_increment, type: example, statement: "示例创建 START 101、INCREMENT 10 的序列并得到 101、111。", status: confirmed, source_anchor: "L115-L132"}
  - {id: cs_fact_example_owned_by, type: example, statement: "示例通过 OWNED BY 和显式列默认 nextval 实现 1、2、3 自增。", status: confirmed, source_anchor: "L134-L161"}
  - {id: cs_fact_example_cycle, type: example, statement: "示例的 MAXVALUE 3 CYCLE 序列产生 1、2、3、1、2。", status: confirmed, source_anchor: "L163-L195"}
  - {id: cs_open_float_increment_generation, type: open_question, statement: "已有B/PG的1.5独立有限facet；泛化浮点域、具体取整结果及非B目标错误身份仍需校准，不宣称全域或实机完成。", status: needs_verification, source_anchor: "L68-L69"}
  - {id: cs_open_system_column_error_identity, type: open_question, statement: "本章确认 rowid/rowno 关联不支持，但未给 SQLSTATE 或稳定错误文本。", status: needs_verification, source_anchor: "L19"}
