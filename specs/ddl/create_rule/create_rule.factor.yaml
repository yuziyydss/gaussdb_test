facts:
  -
    id: "create_rule_fact_purpose"
    type: "lifecycle"
    statement: "定义重写规则。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_rule_fact_owner"
    type: "environment"
    statement: "仅表拥有者可创建或修改规则。"
    status: "confirmed"
    source_anchor: "L9-L9"
  -
    id: "create_rule_fact_order"
    type: "behavior_oracle"
    statement: "相同事件规则按名称字母顺序触发。"
    status: "confirmed"
    source_anchor: "L10-L11"
  -
    id: "create_rule_fact_returning"
    type: "behavior_oracle"
    statement: "视图IUD规则RETURNING由外层RETURNING计算输出；外层不带RETURNING则忽略。"
    status: "confirmed"
    source_anchor: "L12-L15"
  -
    id: "create_rule_fact_returning_limit"
    type: "constraint"
    statement: "RETURNING仅可用于无条件INSTEAD，单事件最多一个；无有效RETURNING时视图RETURNING查询拒绝。"
    status: "confirmed"
    source_anchor: "L16-L19"
  -
    id: "create_rule_fact_select_rule"
    type: "constraint"
    statement: "ON SELECT必须无条件INSTEAD单条SELECT，将表视为查询定义的视图。"
    status: "confirmed"
    source_anchor: "L20-L23"
  -
    id: "create_rule_fact_select_name"
    type: "constraint"
    statement: "ON SELECT规则名必须为_RETURN。"
    status: "confirmed"
    source_anchor: "L25-L25"
  -
    id: "create_rule_fact_empty_table"
    type: "constraint"
    statement: "ON SELECT目标必须是无触发器索引子表的初始空表，推荐直接CREATE VIEW。"
    status: "confirmed"
    source_anchor: "L26-L28"
  -
    id: "create_rule_fact_syntax"
    type: "syntax"
    statement: "CREATE RULE可OR REPLACE，ON事件TO目标，可WHERE，再DO行为与NOTHING/单命令/多命令。"
    status: "confirmed"
    source_anchor: "L31-L33"
  -
    id: "create_rule_fact_event"
    type: "syntax"
    statement: "事件为SELECT/INSERT/DELETE/UPDATE。"
    status: "confirmed"
    source_anchor: "L35-L39"
  -
    id: "create_rule_fact_name"
    type: "constraint"
    statement: "同表规则名唯一，符合标识符且最长63字符。"
    status: "confirmed"
    source_anchor: "L43-L45"
  -
    id: "create_rule_fact_event_values"
    type: "syntax"
    statement: "event为四种SQL事件之一。"
    status: "confirmed"
    source_anchor: "L46-L47"
  -
    id: "create_rule_fact_target"
    type: "syntax"
    statement: "目标可为表或视图且可模式修饰。"
    status: "confirmed"
    source_anchor: "L48-L49"
  -
    id: "create_rule_fact_condition"
    type: "syntax"
    statement: "condition为决定实际执行的布尔条件表达式。"
    status: "confirmed"
    source_anchor: "L50-L51"
  -
    id: "create_rule_fact_condition_limit"
    type: "constraint"
    statement: "条件仅可引用NEW/OLD而非其他表，不能聚集；不推荐数值隐式布尔转换。"
    status: "confirmed"
    source_anchor: "L52-L54"
  -
    id: "create_rule_fact_instead"
    type: "behavior_oracle"
    statement: "INSTEAD替换初始事件。"
    status: "confirmed"
    source_anchor: "L55-L56"
  -
    id: "create_rule_fact_also"
    type: "behavior_oracle"
    statement: "ALSO在初始事件后执行，未指定时为ALSO。"
    status: "confirmed"
    source_anchor: "L57-L59"
  -
    id: "create_rule_fact_command"
    type: "syntax"
    statement: "动作支持SELECT/INSERT/UPDATE/DELETE。"
    status: "confirmed"
    source_anchor: "L60-L62"
  -
    id: "create_rule_fact_example"
    type: "example"
    statement: "ALSO规则向另一张表插入NEW值并检查两表的例子。"
    status: "confirmed"
    source_anchor: "L65-L74"
  -
    id: "create_rule_fact_select_profile"
    type: "environment"
    statement: "静态域不生成SELECT规则；_RETURN命名和空表转视图需独立fixture。"
    status: "confirmed"
    source_anchor: "L20-L23"
  -
    id: "create_rule_fact_replace_profile"
    type: "constraint"
    statement: "静态域不生成OR REPLACE已有规则分支，保留为来源限制。"
    status: "confirmed"
    source_anchor: "L31-L33"
  -
    id: "create_rule_fact_returning_profile"
    type: "environment"
    statement: "静态域不生成RETURNING分支；视图RETURNING和跨事件单规则行为需专用场景。"
    status: "confirmed"
    source_anchor: "L16-L19"
  -
    id: "create_rule_fact_condition_profile"
    type: "environment"
    statement: "静态域不生成WHERE条件；NEW/OLD可见性与非法聚集/表引用负向需表达式profile。"
    status: "confirmed"
    source_anchor: "L52-L54"
