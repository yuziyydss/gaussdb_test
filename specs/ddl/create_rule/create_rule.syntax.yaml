schema_version: 1
kind: "syntax"
id: "syntax_create_rule"
name: "CREATE RULE 语法"
factor_ref: "create_rule"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  event:
    type: "token"
    optional: true
    dimension_ref: "create_rule.event"
  condition:
    type: "token"
    optional: true
    dimension_ref: "create_rule.condition"
  behavior:
    type: "token"
    optional: true
    dimension_ref: "create_rule.behavior"
  action_form:
    type: "token"
    optional: true
    dimension_ref: "create_rule.action_form"
  actions:
    type: "token"
    optional: true
    dimension_ref: "create_rule.actions"
source_fact_refs:
  - "create_rule_fact_syntax"
  - "create_rule_fact_event"
  - "create_rule_fact_event_values"
  - "create_rule_fact_target"
  - "create_rule_fact_condition"
  - "create_rule_fact_command"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "CREATE RULE fp_rule AS ON "
    -
      kind: "slot"
      slot: "event"
    -
      kind: "literal"
      text: " TO t_rule_source "
    -
      kind: "slot"
      slot: "condition"
    -
      kind: "literal"
      text: " DO "
    -
      kind: "slot"
      slot: "behavior"
    -
      kind: "literal"
      text: " "
    -
      kind: "choice"
      selector: "action_form"
      branches:
        create_rule_action_form_nothing:
          kind: "literal"
          text: "NOTHING"
        create_rule_action_form_single:
          kind: "repeat"
          slot: "actions"
          separator: "; "
          items_property: "items"
        create_rule_action_form_multiple:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "("
            -
              kind: "repeat"
              slot: "actions"
              separator: "; "
              items_property: "items"
            -
              kind: "literal"
              text: ")"
