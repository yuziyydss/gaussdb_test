schema_version: 1
kind: fixture
id: fixture_alter_directory_owner_role
name: ALTER DIRECTORY owner_role
status: needs_review
description: 创建专用NOLOGIN目录属主角色并授予当前会话用户成员关系；不验证目录所有权行为。
factor_ref: alter_directory
requires_fixture_refs:
  - fixture_alter_directory_directory
provides: {}
seed:
  required: false
  rows: []
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - "CREATE ROLE b7_directory_owner NOLOGIN PASSWORD DISABLE;"
    - "GRANT b7_directory_owner TO CURRENT_USER;"
  teardown_sqls:
    - "ROLLBACK;"
  note: 仅用于静态语法代表；依赖上游目录fixture的事务边界，执行前必须使用独占非生产会话并确认初始用户权限。不验证目录属主变化、权限矩阵、目录对象行为或角色生命周期。
