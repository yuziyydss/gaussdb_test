schema_version: 1
kind: "manifest"
id: "manifest_alter_directory_owner"
name: "ALTER DIRECTORY owner"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "alter_directory"
syntax_ref: "syntax_alter_directory"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_alter_directory_directory"
identifier_policy: {}
bindings:
  new_owner:
    - "alter_directory_new_owner_isolated"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "directory_owner_member_ready"
    allowed_values:
      - "b7_directory_owner"
    fact_refs:
      - "alter_directory_fact_privilege"
  -
    key: "pdb_context"
    allowed_values:
      - "false"
    fact_refs:
      - "alter_directory_fact_no_pdb"
  -
    key: "directory_creator_authorized"
    allowed_values:
      - "true"
    fact_refs:
      - "create_directory::create_directory_fact_privilege"
  -
    key: "approved_isolated_directory_path"
    allowed_values:
      - "/tmp/gaussdb_b7_directory"
    fact_refs:
      - "create_directory::create_directory_fact_security"
