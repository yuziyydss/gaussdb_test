schema_version: 1
kind: "manifest"
id: "manifest_create_directory_new"
name: "CREATE DIRECTORY new"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "create_directory"
syntax_ref: "syntax_create_directory"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_create_directory_transaction"
identifier_policy: {}
bindings:
  replace:
    - "create_directory_replace_new"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "directory_creator_authorized"
    allowed_values:
      - "true"
    fact_refs:
      - "create_directory_fact_privilege"
  -
    key: "pdb_context"
    allowed_values:
      - "false"
    fact_refs:
      - "create_directory_fact_no_pdb"
  -
    key: "approved_isolated_directory_path"
    allowed_values:
      - "/tmp/gaussdb_b7_directory"
    fact_refs:
      - "create_directory_fact_security"
