schema_version: 1
kind: "scenario"
id: "scenario_create_directory_documented_contracts"
name: "CREATE DIRECTORY documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "create_directory"
fixture_refs: []
fact_refs:
  - "create_directory_fact_purpose"
  - "create_directory_fact_risk"
  - "create_directory_fact_security"
  - "create_directory_fact_privilege"
  - "create_directory_fact_acl"
  - "create_directory_fact_owner"
  - "create_directory_fact_special_path"
  - "create_directory_fact_absolute"
  - "create_directory_fact_missing_path"
  - "create_directory_fact_os_permissions"
  - "create_directory_fact_nodes"
  - "create_directory_fact_catalog"
  - "create_directory_fact_no_pdb"
  - "create_directory_fact_security_baseline"
  - "create_directory_fact_security_audit"
  - "create_directory_fact_security_classification"
  - "create_directory_fact_security_least_privilege"
  - "create_directory_fact_security_approval"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "创建服务器文件系统路径的别名，供dbe_file文件读写使用。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "目录READ/WRITE控制dbe_file权限；不得将操作系统关键目录授权导致配置安全风险。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "自部署目录授权需安全基线、访问审计、敏感数据分级、最小权限和审批追溯。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "访问目录开关off时仅初始用户可创建；on时SYSADMIN或继承gs_role_directory_create权限用户可创建。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "创建用户默认有READ和WRITE权限。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "默认OWNER为创建者。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "禁止路径包含特殊字符。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "禁止相对路径。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "创建时检查实际路径，不存在时提示使用风险。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "初始化OS用户对路径R/W/X权限不足时提示使用风险。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "各节点路径必须由用户保证一致。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "pg_directory可查询已有目录对象。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "PDB内不支持目录对象。"
  -
    id: "security_baseline"
    action: "verify_documented_contract"
    note: "授权目标路径须通过安全基线核查。"
  -
    id: "security_audit"
    action: "verify_documented_contract"
    note: "授权路径须具备访问控制审计机制。"
  -
    id: "security_classification"
    action: "verify_documented_contract"
    note: "授权路径须完成敏感数据分类分级。"
  -
    id: "security_least_privilege"
    action: "verify_documented_contract"
    note: "目录授权须遵循最小权限原则。"
  -
    id: "security_approval"
    action: "verify_documented_contract"
    note: "目录授权须有审批追溯机制。"
oracles:
  -
    kind: "documented_behavior"
    expected: "创建时检查实际路径，不存在时提示使用风险。"
  -
    kind: "documented_behavior"
    expected: "初始化OS用户对路径R/W/X权限不足时提示使用风险。"
  -
    kind: "documented_behavior"
    expected: "pg_directory可查询已有目录对象。"
execution_requirements:
  - "database"
  - "same_session"
