facts:
- id: m_drop_index_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.9.10 L2-2
- id: m_drop_index_fact_syntax
  type: syntax
  statement: DROP INDEX 有普通/在线形式，以及带 ON table 的独立 M 形式。
  status: confirmed
  source_anchor: 2.4.2.9.10 L16-19
- id: m_drop_index_fact_authority
  type: environment
  statement: 索引所有者、所在模式所有者、持有所在表INDEX权限或DROP ANY INDEX权限的用户可删除；三权分立关闭时系统管理员默认有权。
  status: confirmed
  source_anchor: 2.4.2.9.10 L8-10
- id: m_drop_index_fact_online_single
  type: constraint
  statement: CONCURRENTLY 只能删除一个索引，且不能 CASCADE。
  status: confirmed
  source_anchor: 2.4.2.9.10 L28-29
- id: m_drop_index_fact_online_transaction
  type: environment
  statement: 在线删除不能处于事务内。
  status: confirmed
  source_anchor: 2.4.2.9.10 L30-31
- id: m_drop_index_fact_notice
  type: behavior_oracle
  statement: IF EXISTS 对缺失索引返回 notice 而非 ERROR。
  status: confirmed
  source_anchor: 2.4.2.9.10 L48-48
- id: m_drop_index_fact_dependency
  type: constraint
  statement: RESTRICT 在依赖存在时拒绝删除，且为缺省；CASCADE 允许级联。
  status: confirmed
  source_anchor: 2.4.2.9.10 L54-56
- id: m_drop_index_fact_tail
  type: syntax
  statement: ON table 分支的算法/锁选项引用 M CREATE INDEX。
  status: confirmed
  source_anchor: 2.4.2.9.10 L19-19
- id: m_drop_index_fact_temp
  type: environment
  statement: 其他会话不能删除已初始化全局临时表的索引。
  status: confirmed
  source_anchor: 2.4.2.9.10 L11-13
- id: m_drop_index_fact_failure
  type: lifecycle
  statement: 在线删除故障可能留下非法状态索引，需定向清理。
  status: confirmed
  source_anchor: 2.4.2.9.10 L40-43
rules:
- id: m_drop_index_rule_online_single
  kind: requires
  expression: online == 'm_drop_index_online_on' => targets == 'm_drop_index_targets_one'
  fact_refs:
  - m_drop_index_fact_online_single
  severity: error
- id: m_drop_index_rule_online_cascade
  kind: requires
  expression: online == 'm_drop_index_online_on' => dependency != 'm_drop_index_dependency_cascade'
  fact_refs:
  - m_drop_index_fact_online_single
  severity: error
