  - {id: comment_fact_object_domain_syntax, type: syntax, statement: 'COMMENT对象分支列出DOMAIN object_name；具体类型能力与前置仍需独立验证。', status: confirmed, source_anchor: L34-L34}
  - {id: comment_fact_object_extension_syntax, type: syntax, statement: 'COMMENT对象分支允许EXTENSION object_name；不假定扩展已安装。', status: confirmed, source_anchor: L35-L35}
  - {id: comment_fact_object_foreign_data_wrapper_syntax, type: syntax, statement: 'COMMENT对象分支允许FOREIGN DATA WRAPPER object_name；不假定外部封装资产存在。', status: confirmed, source_anchor: L36-L36}
  - {id: comment_fact_object_foreign_table_syntax, type: syntax, statement: 'COMMENT对象分支允许FOREIGN TABLE object_name；不等于已提供外部表或数据源。', status: confirmed, source_anchor: L37-L37}
  - {id: comment_fact_object_function_syntax, type: syntax, statement: 'COMMENT对象分支允许FUNCTION名称和可选参数列表，参数包含可选名称/模式及类型。', status: confirmed, source_anchor: L38-L38}
