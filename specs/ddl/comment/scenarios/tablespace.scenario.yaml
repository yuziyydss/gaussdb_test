schema_version: 1
kind: scenario
id: scenario_comment_tablespace
name: COMMENT TABLESPACE目录身份待校准
factor_ref: comment
status: planned
description: 只观察实际空RELATIVE表空间注释的设置、替换与清除；不验证磁盘容量、IO调度或表空间内对象行为。
fixture_refs: [fixture_comment_tablespace]
fact_refs:
  - comment_fact_authority
  - create_tablespace::create_tablespace_fact_body_8
  - create_tablespace::create_tablespace_fact_body_9
  - create_tablespace::create_tablespace_fact_body_22
  - drop_tablespace::drop_tablespace_fact_body_8
  - drop_tablespace::drop_tablespace_fact_body_10
  - drop_tablespace::drop_tablespace_fact_body_11
preconditions:
  - 独占测试环境与隔离连接
  - 当前连接不在事务块中
  - 初始表空间名与RELATIVE目录不存在
  - 删除前表空间保持为空
  - 记录表空间的实际创建归属
steps:
  - id: comment_tablespace
    candidate:
      manifest_ref: manifest_comment_tablespace
      params: {target: comment_target_tablespace_fresh, text: comment_text_plain}
oracles:
  - kind: manual_assertion
    step_id: comment_tablespace
    expected: 校准目录中该表空间注释的设置、替换与清除；不得用目标SQL成功或清理成功替代目录Oracle。
execution_requirements: [database_authorization, target_oracle_calibration, isolated_connection, ownership_scoped_cleanup, preserve_stage_failures]
