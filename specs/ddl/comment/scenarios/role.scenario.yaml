schema_version: 1
kind: scenario
id: scenario_comment_role
name: COMMENT ROLE目录身份待校准
factor_ref: comment
status: planned
description: 只观察实际NOLOG角色注释的设置、替换与清除；不验证角色权限或全局状态变更。
fixture_refs: [fixture_comment_role]
fact_refs:
  - comment_fact_authority
  - create_role::create_role_fact_privilege
  - create_role::create_role_fact_disable_admin
  - create_role::create_role_fact_sysadmin_duty_off
preconditions:
  - 独占测试数据库与隔离连接
  - 初始角色名不存在
  - 记录角色的实际创建归属
steps:
  - id: comment_role
    candidate:
      manifest_ref: manifest_comment_role
      params: {target: comment_target_role_fresh, text: comment_text_plain}
oracles:
  - kind: manual_assertion
    step_id: comment_role
    expected: 校准目录中该角色注释的设置、替换与清除；不得用目标SQL成功或清理成功替代目录Oracle。
execution_requirements: [database_authorization, target_oracle_calibration, isolated_connection, ownership_scoped_cleanup, preserve_stage_failures]
