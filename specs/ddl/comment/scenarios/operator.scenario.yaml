schema_version: 1
kind: scenario
id: scenario_comment_operator
name: COMMENT操作符目录身份待校准
factor_ref: comment
status: planned
description: 只观察实际双目操作符注释的设置、替换与清除；不调用操作符，不验证运行时行为。
fixture_refs: [fixture_comment_operator]
fact_refs:
  - comment_fact_authority
  - comment_fact_operator
  - create_operator::create_operator_fact_arity
  - create_operator::create_operator_fact_privilege
preconditions:
  - 独占测试数据库与隔离连接
  - 初始schema、函数和操作符不存在
  - 记录schema、函数和操作符的实际创建归属
steps:
  - id: comment_operator
    candidate:
      manifest_ref: manifest_comment_operator
      params: {target: comment_target_operator_fresh, text: comment_text_plain}
oracles:
  - kind: manual_assertion
    step_id: comment_operator
    expected: 校准目录中该操作符注释的设置、替换与清除；不得用目标SQL成功或清理成功替代目录Oracle。
execution_requirements: [database_authorization, target_oracle_calibration, isolated_connection, ownership_scoped_cleanup, preserve_stage_failures]
