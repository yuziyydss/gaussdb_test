schema_version: 1
kind: scenario
id: scenario_comment_tsc
name: COMMENT TEXT SEARCH CONFIGURATION目录身份待校准
factor_ref: comment
status: planned
description: 只观察实际文本搜索配置注释的设置、替换与清除；不调用配置分词，不验证运行时行为。
fixture_refs: [fixture_comment_tsc]
fact_refs:
  - comment_fact_authority
  - create_text_search_configuration::create_text_search_configuration_fact_internal
  - create_text_search_configuration::create_text_search_configuration_fact_parser_empty
preconditions:
  - 独占测试数据库与隔离连接
  - 初始schema和配置不存在
  - 记录schema和配置的实际创建归属
steps:
  - id: comment_configuration
    candidate:
      manifest_ref: manifest_comment_tsc
      params: {target: comment_target_configuration_fresh, text: comment_text_plain}
oracles:
  - kind: manual_assertion
    step_id: comment_configuration
    expected: 校准目录中该配置注释的设置、替换与清除；不得用目标SQL成功或清理成功替代目录Oracle。
execution_requirements: [database_authorization, target_oracle_calibration, isolated_connection, ownership_scoped_cleanup, preserve_stage_failures]
