schema_version: 1
kind: scenario
id: scenario_comment_cast
name: COMMENT CAST目录身份待校准
factor_ref: comment
status: planned
description: 只观察实际CAST注释的设置、替换与清除；不执行转换，不验证类型转换行为。
fixture_refs: [fixture_comment_cast]
fact_refs:
  - comment_fact_authority
  - comment_fact_atom_cast
  - comment_fact_cast
preconditions:
  - 独占测试数据库与隔离连接
  - 初始schema、function和cast不存在
  - 记录schema、function和cast的实际创建归属
steps:
  - id: comment_cast
    candidate:
      manifest_ref: manifest_comment_cast
      params: {target: comment_target_cast_fresh, text: comment_text_plain}
oracles:
  - kind: manual_assertion
    step_id: comment_cast
    expected: 校准目录中该CAST注释的设置、替换与清除；不得用目标SQL成功或清理成功替代目录Oracle。
execution_requirements: [database_authorization, target_oracle_calibration, isolated_connection, ownership_scoped_cleanup, preserve_stage_failures]
