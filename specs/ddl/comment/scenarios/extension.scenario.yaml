schema_version: 1
kind: scenario
id: scenario_comment_extension
name: COMMENT EXTENSION目录身份待校准
factor_ref: comment
status: planned
description: 只观察事务内专用测试扩展注释的设置、替换与清除；不验证扩展脚本、成员对象或依赖行为。
fixture_refs: [fixture_comment_extension]
fact_refs:
  - comment_fact_authority
  - create_extension::create_extension_fact_internal
  - create_extension::create_extension_fact_enabled
  - create_extension::create_extension_fact_support_files
preconditions:
  - 独占测试会话与隔离连接
  - enable_extension已开启
  - ext_b7支持文件已按契约准备
  - 初始模式名不存在
  - 记录扩展的实际创建归属
steps:
  - id: comment_extension
    candidate:
      manifest_ref: manifest_comment_extension
      params: {target: comment_target_extension_fresh, text: comment_text_plain}
oracles:
  - kind: manual_assertion
    step_id: comment_extension
    expected: 校准目录中该扩展注释的设置、替换与清除；不得用目标SQL成功或清理成功替代目录Oracle。
execution_requirements: [database_authorization, target_oracle_calibration, isolated_connection, ownership_scoped_cleanup, preserve_stage_failures]
