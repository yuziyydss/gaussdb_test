schema_version: 1
kind: scenario
id: scenario_comment_trigger
name: COMMENT TRIGGER目录身份待校准
factor_ref: comment
status: planned
description: 只观察实际触发器注释的设置、替换与清除；不执行触发器，不验证触发行为。
fixture_refs: [fixture_comment_trigger]
fact_refs:
  - comment_fact_authority
  - comment_fact_object_trigger_syntax
  - comment_fact_trigger
  - create_trigger::create_trigger_fact_function
preconditions:
  - 独占测试数据库与隔离连接
  - 初始schema、表、函数和触发器不存在
  - 记录schema、表、函数和触发器的实际创建归属
steps:
  - id: comment_trigger
    candidate:
      manifest_ref: manifest_comment_trigger
      params: {target: comment_target_trigger_fresh, text: comment_text_plain}
oracles:
  - kind: manual_assertion
    step_id: comment_trigger
    expected: 校准目录中该触发器注释的设置、替换与清除；不得用目标SQL成功或清理成功替代目录Oracle。
execution_requirements: [database_authorization, target_oracle_calibration, isolated_connection, ownership_scoped_cleanup, preserve_stage_failures]
