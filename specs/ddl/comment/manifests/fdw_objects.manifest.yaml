schema_version: 1
kind: manifest
id: manifest_comment_fdw_objects
name: COMMENT外部服务器与外表有限代表
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: 实际log_fdw服务器与单TEXT列表外两个对象及四类注释文本；不验证FDW数据访问或目录行为。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_fdw_objects]
identifier_policy: {}
bindings:
  target: [comment_target_foreign_table_fresh, comment_target_server_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: documented_fdw_available
    allowed_values: [log_fdw_catalog]
    fact_refs: [create_server::create_server_fact_fdw_environment]
  - key: database_scope
    allowed_values: [non_pdb]
    fact_refs: [create_foreign_table::create_foreign_table_fact_pdb_admin]
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
  - key: cleanup_namespace
    allowed_values: [owned_fresh_non_current_schema]
    fact_refs: [drop_schema::drop_schema_fact_permission, drop_schema::drop_schema_fact_current]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
