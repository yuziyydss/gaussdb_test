schema_version: 1
kind: manifest
id: manifest_comment_rule
name: COMMENT所属表限定规则与四类文本
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: 实际普通表上的单个INSERT规则有限代表；规则删除权限和目录Oracle待执行前核验，不证明重写行为。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_rule]
identifier_policy: {}
bindings:
  target: [comment_target_rule_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
  - key: namespace_create_authority
    allowed_values: [database_create]
    fact_refs: [create_schema::create_schema_fact_permission]
  - key: table_create_authority
    allowed_values: [create_any_table]
    fact_refs: [create_table::ct_fact_create_permissions]
  - key: rule_create_authority
    allowed_values: [actual_case_table_owner]
    fact_refs: [create_rule::create_rule_fact_owner]
  - key: cleanup_table
    allowed_values: [fixture_table_owner]
    fact_refs: [drop_table::dt_fact_permissions]
  - key: cleanup_namespace
    allowed_values: [owned_fresh_non_current_schema]
    fact_refs: [drop_schema::drop_schema_fact_permission, drop_schema::drop_schema_fact_current]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
