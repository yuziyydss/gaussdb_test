schema_version: 1
kind: manifest
id: manifest_comment_database
name: COMMENT DATABASE有限代表
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: 独占新建数据库及四类注释文本；不覆盖模板、编码、连接限制、PDB或目录行为。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_database]
identifier_policy: {}
bindings:
  target: [comment_target_database_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: database_scope
    allowed_values: [non_pdb]
    fact_refs: [comment_fact_pdb]
  - key: database_create_privilege
    allowed_values: ["true"]
    fact_refs: [create_database::create_database_fact_privilege]
  - key: create_database_autocommit
    allowed_values: ["true"]
    fact_refs: [create_database::create_database_fact_no_transaction]
  - key: drop_database_autocommit
    allowed_values: ["true"]
    fact_refs: [drop_database::drop_database_fact_no_transaction]
  - key: database_has_connections
    allowed_values: ["false"]
    fact_refs: [drop_database::drop_database_fact_no_connections]
  - key: enable_db_recyclebin
    allowed_values: ["off"]
    fact_refs: [drop_database::drop_database_fact_recyclebin_environment]
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
  - key: cleanup_database
    allowed_values: [actual_case_database_owner]
    fact_refs: [drop_database::drop_database_fact_privilege]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
