schema_version: 1
kind: manifest
id: manifest_comment_types
name: COMMENT两种真实类型与四类文本
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: 普通枚举及两INTEGER属性复合类型有限代表；一般章节来源，不包含M语义或基本/shell/集合类型。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_types]
identifier_policy: {}
bindings:
  target: [comment_target_enum_fresh, comment_target_composite_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
  - key: namespace_create_authority
    allowed_values: [database_create]
    fact_refs: [create_schema::create_schema_fact_permission]
  - key: type_create_authority
    allowed_values: [create_any_type_in_fresh_user_schema]
    fact_refs: [create_type::create_type_fact_any_type]
  - key: attribute_type_usage
    allowed_values: [usage_on_builtin_integer_attributes]
    fact_refs: [create_type::create_type_fact_composite_usage]
  - key: cleanup_types
    allowed_values: [actual_case_type_owner]
    fact_refs: [drop_type::drop_type_fact_privilege]
  - key: cleanup_namespace
    allowed_values: [owned_fresh_non_current_schema]
    fact_refs: [drop_schema::drop_schema_fact_permission, drop_schema::drop_schema_fact_current]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
