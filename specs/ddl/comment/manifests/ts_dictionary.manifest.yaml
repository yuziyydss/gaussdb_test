schema_version: 1
kind: manifest
id: manifest_comment_ts_dictionary
name: COMMENT TEXT SEARCH DICTIONARY有限代表
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: 实际schema中Simple文本搜索词典及四类注释文本；不覆盖其他模板、分词行为或目录身份。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_ts_dictionary]
identifier_policy: {}
bindings:
  target: [comment_target_dictionary_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: internal_text_search_testing
    allowed_values: [approved]
    fact_refs: [create_text_search_dictionary::create_text_search_dictionary_fact_internal]
  - key: sysadmin
    allowed_values: ["true"]
    fact_refs: [create_text_search_dictionary::create_text_search_dictionary_fact_sysadmin]
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
  - key: cleanup_dictionary
    allowed_values: [actual_case_dictionary_owner]
    fact_refs: [drop_text_search_dictionary::drop_text_search_dictionary_fact_owner]
  - key: cleanup_namespace
    allowed_values: [owned_fresh_non_current_schema]
    fact_refs: [drop_schema::drop_schema_fact_permission, drop_schema::drop_schema_fact_current]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
