schema_version: 1
kind: manifest
id: manifest_comment_owned_relations
name: COMMENT普通索引与视图有限代表
status: needs_review
description: 三类新建普通对象与四个注释文本值的完整二元组合；不涵盖所有对象、权限或运行时目录行为。
factor_ref: comment
syntax_ref: syntax_comment
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_owned_relations]
identifier_policy: {}
bindings:
  target: [comment_target_index_fresh, comment_target_view_fresh, comment_target_view_column_fresh, comment_target_view_column_2_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
  - key: index_create_authority
    allowed_values: [fixture_table_owner_with_create_index_authority]
    fact_refs: [create_index::ci_fact_permissions]
  - key: view_create_authority
    allowed_values: [create_any_table_in_owned_user_schema]
    fact_refs: [create_view::cv_fact_create_any_table_permission]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
