schema_version: 1
kind: manifest
id: manifest_comment_extension
name: COMMENT EXTENSION有限代表
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: 事务内专用测试扩展及四类注释文本；不覆盖其他扩展、版本、成员对象或目录行为。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_extension]
identifier_policy: {}
bindings:
  target: [comment_target_extension_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: isolated_internal_test
    allowed_values: ["true"]
    fact_refs: [create_extension::create_extension_fact_internal]
  - key: enable_extension
    allowed_values: ["true"]
    fact_refs: [create_extension::create_extension_fact_enabled]
  - key: extension_support_contract
    allowed_values: ["ext_b7:default,1.0,b7_version"]
    fact_refs: [create_extension::create_extension_fact_support_files]
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
