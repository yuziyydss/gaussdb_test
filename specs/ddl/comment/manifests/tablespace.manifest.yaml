schema_version: 1
kind: manifest
id: manifest_comment_tablespace
name: COMMENT TABLESPACE有限代表
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: 独占空RELATIVE表空间及四类注释文本；不覆盖绝对路径、MAXSIZE、IO参数或表空间内对象行为。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_tablespace]
identifier_policy: {}
bindings:
  target: [comment_target_tablespace_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: tablespace_create_privilege
    allowed_values: ["true"]
    fact_refs: [create_tablespace::create_tablespace_fact_body_8]
  - key: tablespace_drop_privilege
    allowed_values: [actual_case_tablespace_owner]
    fact_refs: [drop_tablespace::drop_tablespace_fact_body_8]
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
