schema_version: 1
kind: manifest
id: manifest_comment_tsc
name: COMMENT TEXT SEARCH CONFIGURATION有限代表
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: 实际schema中default解析器文本搜索配置及四类注释文本；不覆盖ngram/copy、映射或目录行为。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_tsc]
identifier_policy: {}
bindings:
  target: [comment_target_configuration_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: internal_text_search_testing
    allowed_values: [approved]
    fact_refs: [create_text_search_configuration::create_text_search_configuration_fact_internal]
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
  - key: cleanup_configuration
    allowed_values: [actual_case_configuration_owner]
    fact_refs: [comment_fact_authority]
  - key: cleanup_namespace
    allowed_values: [owned_fresh_non_current_schema]
    fact_refs: [drop_schema::drop_schema_fact_permission, drop_schema::drop_schema_fact_current]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
