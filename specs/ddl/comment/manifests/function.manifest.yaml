schema_version: 1
kind: manifest
id: manifest_comment_function
name: COMMENT显式函数签名与四类文本
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: 单个PG风格SQL函数及四类注释文本；不包括重载、OUT、Oracle或M风格，也未校准对象目录Oracle。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_function]
identifier_policy: {}
bindings:
  target: [comment_target_function_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: compatibility_mode
    allowed_values: [PG]
    fact_refs: [create_function::create_function_fact_styles]
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
  - key: namespace_create_authority
    allowed_values: [database_create]
    fact_refs: [create_schema::create_schema_fact_permission]
  - key: function_create_authority
    allowed_values: [create_any_function_in_user_schema]
    fact_refs: [create_function::create_function_fact_create_any]
  - key: execution_isolation
    allowed_values: [exclusive_test_database_and_connection_no_other_users]
    fact_refs: [create_function::create_function_fact_public_execute]
  - key: cleanup_function
    allowed_values: [actual_case_function_owner]
    fact_refs: [drop_function::drop_function_fact_authority]
  - key: cleanup_namespace
    allowed_values: [owned_fresh_non_current_schema]
    fact_refs: [drop_schema::drop_schema_fact_permission, drop_schema::drop_schema_fact_current]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
