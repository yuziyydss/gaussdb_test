schema_version: 1
kind: manifest
id: manifest_comment_fdw
name: COMMENT FOREIGN DATA WRAPPER有限代表
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: 实际NO HANDLER、NO VALIDATOR外部封装器及四类注释文本；不覆盖handler/validator变体或目录行为。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_fdw]
identifier_policy: {}
bindings:
  target: [comment_target_fdw_fresh]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: fdw_create_privilege
    allowed_values: ["true"]
    fact_refs: [create_foreign_data_wrapper::create_foreign_data_wrapper_fact_privilege]
  - key: comment_authority
    allowed_values: [fixture_object_owner]
    fact_refs: [comment_fact_authority]
  - key: cleanup_fdw
    allowed_values: [actual_case_wrapper_owner]
    fact_refs: [comment_fact_authority]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
