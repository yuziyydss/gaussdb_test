schema_version: 1
kind: manifest
id: manifest_comment_ts_parser
name: COMMENT TEXT SEARCH PARSER有限代表
factor_ref: comment
syntax_ref: syntax_comment
status: needs_review
description: pg_catalog.default内置解析器及四类注释文本；不覆盖其他解析器、分词行为或目录行为。
suite_type: positive
strategy: pairwise
fixture_refs: [fixture_comment_ts_parser]
identifier_policy: {}
bindings:
  target: [comment_target_text_search_parser_builtin]
  text: [comment_text_plain, comment_text_unicode, comment_text_quote, comment_text_null]
environment_requirements:
  - key: internal_text_search_test
    allowed_values: ["true"]
    fact_refs: [create_text_search_configuration::create_text_search_configuration_fact_internal]
  - key: comment_authority
    allowed_values: [sysadmin]
    fact_refs: [comment_fact_authority]
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
