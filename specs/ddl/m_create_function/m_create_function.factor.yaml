facts:
- id: m_create_function_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.9 L2-2
- id: m_create_function_fact_internal
  type: environment
  statement: 内部使用功能，不支持用户使用；本批仅保留受限离线候选。
  status: confirmed
  source_anchor: 2.4.2.8.9 L9-9
- id: m_create_function_fact_syntax
  type: syntax
  statement: CREATE OR REPLACE FUNCTION 定义参数、返回类型、语言、属性和字符串函数体。
  status: confirmed
  source_anchor: 2.4.2.8.9 L92-110
- id: m_create_function_fact_cost
  type: constraint
  statement: COST 为 >=0 的数值。
  status: confirmed
  source_anchor: 2.4.2.8.9 L204-205
- id: m_create_function_fact_strict
  type: behavior_oracle
  statement: STRICT 对 NULL 参数不执行函数而直接返回 NULL。
  status: confirmed
  source_anchor: 2.4.2.8.9 L195-197
- id: m_create_function_fact_public
  type: environment
  statement: 新函数默认授予 PUBLIC 执行权限，调用还需要 Schema USAGE；独立隔离库，不生成共享模式函数。
  status: confirmed
  source_anchor: 2.4.2.8.9 L29-34
- id: m_create_function_fact_return_type
  type: behavior_oracle
  statement: 创建时不检查函数体返回值类型，不能用创建成功证明返回契约。
  status: confirmed
  source_anchor: 2.4.2.8.9 L68-68
- id: m_create_function_fact_overload
  type: constraint
  statement: 仅参数名或默认值或返回类型不同不足以形成新重载。
  status: confirmed
  source_anchor: 2.4.2.8.9 L20-23
- id: m_create_function_fact_defaults
  type: syntax
  statement: 参数默认表达式支持 DEFAULT、:= 和 =。
  status: confirmed
  source_anchor: 2.4.2.8.9 L93-93
- id: m_create_function_fact_current_user
  type: syntax
  statement: AUTHID CURRENT_USER 使用调用者权限。
  status: confirmed
  source_anchor: 2.4.2.8.9 L199-199
- id: m_cf_purpose
  type: syntax
  statement: 创建一个函数。内部使用功能，不支持用户使用。
  status: confirmed
  source_anchor: 2.4.2.8.9 L4-7
- id: m_cf_precision_no_check
  type: constraint
  statement: 创建函数时参数或返回值带有精度，不进行精度检测。
  status: confirmed
  source_anchor: 2.4.2.8.9 L12-13
- id: m_cf_outparam_guc
  type: environment
  statement: 函数参数带出参时需打开behavior_compat_options=proc_outparam_override，SELECT/CALL须在出参位置提供实参。
  status: confirmed
  source_anchor: 2.4.2.8.9 L14-17
- id: m_cf_overload_rules
  type: constraint
  statement: 兼容PostgreSQL风格函数支持重载；不能仅形参名不同、仅ref cursor类型不同、仅返回类型不同或仅默认值不同的重载。
  status: confirmed
  source_anchor: 2.4.2.8.9 L18-28
- id: m_cf_public_execute
  type: behavior_oracle
  statement: 新函数默认给PUBLIC授予执行权限；用户默认继承PUBLIC角色权限。建议在事务中创建函数并设置权限。
  status: confirmed
  source_anchor: 2.4.2.8.9 L27-33
- id: m_cf_no_param_parens
  type: syntax
  statement: 函数内部调用无参数函数可省略括号直接用函数名。
  status: confirmed
  source_anchor: 2.4.2.8.9 L35-36
- id: m_cf_outparam_expression_limits
  type: constraint
  statement: 打开proc_outparam_override后：已有out/inout同名函数不能再创建；部分场景不支持表达式；不支持无RETURN和PERFORM调用；SETOF返回时out不生效。
  status: confirmed
  source_anchor: 2.4.2.8.9 L47-56
- id: m_cf_no_self_default
  type: constraint
  statement: 不支持函数自身作为入参默认值。
  status: confirmed
  source_anchor: 2.4.2.8.9 L58-63
- id: m_cf_out_param_sql_restriction
  type: constraint
  statement: 带OUT参数函数不能在SQL语句中被调用、不能被SELECT INTO调用、不支持嵌套调用。
  status: confirmed
  source_anchor: 2.4.2.8.9 L58-63
- id: m_cf_definer_risk
  type: environment
  statement: 定义者权限函数创建到其他用户Schema会以其他用户权限执行，有越权风险。
  status: confirmed
  source_anchor: 2.4.2.8.9 L69-73
- id: m_cf_guc_session_change
  type: behavior_oracle
  statement: 函数中GUC参数控制的特性，会话内更改后调用可能维持修改前行为。
  status: confirmed
  source_anchor: 2.4.2.8.9 L87-89
- id: m_cf_argmode
  type: syntax
  statement: 参数模式：IN、OUT、INOUT或VARIADIC，缺省IN。OUT参数不计入参数个数。VARIADIC声明数组类型。
  status: confirmed
  source_anchor: 2.4.2.8.9 L128-138
- id: m_cf_param_name_limit
  type: constraint
  statement: 函数参数名称超63个字符时截断保留前63个字符。
  status: confirmed
  source_anchor: 2.4.2.8.9 L124-126
- id: m_cf_no_system_name_conflict
  type: constraint
  statement: 建议不要创建和系统函数重名的函数，否则调用时需指定Schema。
  status: confirmed
  source_anchor: 2.4.2.8.9 L117-122
rules:
- id: m_create_function_rule_nonnegative_cost
  kind: requires
  expression: cost != 'm_create_function_cost_negative'
  fact_refs:
  - m_create_function_fact_cost
  severity: error
