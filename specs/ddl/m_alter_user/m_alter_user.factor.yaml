facts:
- id: m_alter_user_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.15 L2-2
- id: m_alter_user_fact_syntax
  type: syntax
  statement: ALTER USER user_name [[WITH] option [...]] {PASSWORD|IDENTIFIED BY} {'password' [EXPIRED] | DISABLE};
  status: confirmed
  source_anchor: 2.4.2.6.15 L15-19
- id: m_alter_user_fact_settings
  type: syntax
  statement: SET 参数允许 TO/= DEFAULT 与 FROM CURRENT。
  status: confirmed
  source_anchor: 2.4.2.6.15 L42-42
- id: m_alter_user_fact_account
  type: syntax
  statement: 账户支持 ACCOUNT LOCK/UNLOCK。
  status: confirmed
  source_anchor: 2.4.2.6.15 L38-38
- id: m_alter_user_fact_next_session
  type: lifecycle
  statement: 用户会话参数只针对指定用户，在下次会话中生效。
  status: confirmed
  source_anchor: 2.4.2.6.15 L9-9
- id: m_alter_user_fact_pguser
  type: constraint
  statement: 当前版本不允许修改 PGUSER 属性。
  status: confirmed
  source_anchor: 2.4.2.6.15 L69-69
- id: m_alter_user_fact_pdb
  type: environment
  statement: 不支持在 PDB 修改初始用户密码。
  status: confirmed
  source_anchor: 2.4.2.6.15 L10-10
- id: m_alter_user_fact_password_production
  type: open_question
  statement: 参数说明出现新旧密码，但本章产生式未列出修改密码分支；不直接拼接 ALTER ROLE 的密码语法。
  status: needs_verification
  source_anchor: 2.4.2.6.15 L53-55
- id: m_alter_user_fact_purpose
  type: example
  statement: 修改用户属性，包括密码、权限、连接限制、有效期等。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_alter_user_fact_constraint
  type: example
  statement: 修改用户属性需要相应权限。
  status: confirmed
  source_anchor: M-Compatibility L8-8
- id: m_alter_user_fact_params
  type: example
  statement: 与CREATE USER的option相同。
  status: confirmed
  source_anchor: M-Compatibility L40-41
- id: m_alter_user_fact_example
  type: example
  statement: m_alter_user的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L72-73
