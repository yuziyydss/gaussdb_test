facts:
  -
    id: "create_package_fact_purpose"
    type: "lifecycle"
    statement: "创建PACKAGE。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_package_fact_header_body"
    type: "constraint"
    statement: "包头声明的函数/过程必须在包体明确定义。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "create_package_fact_locks"
    type: "behavior_oracle"
    statement: "CREATE对象加写锁，执行期编译和运行对函数及依赖包加读锁。"
    status: "confirmed"
    source_anchor: "L10-L11"
  -
    id: "create_package_fact_no_instantiation_transaction"
    type: "constraint"
    statement: "实例化不能调用包含COMMIT/ROLLBACK的过程。"
    status: "confirmed"
    source_anchor: "L12-L12"
  -
    id: "create_package_fact_no_trigger"
    type: "constraint"
    statement: "不能在触发器中调用PACKAGE函数。"
    status: "confirmed"
    source_anchor: "L14-L14"
  -
    id: "create_package_fact_no_sql_variable"
    type: "constraint"
    statement: "外部SQL不能直接使用包变量。"
    status: "confirmed"
    source_anchor: "L15-L15"
  -
    id: "create_package_fact_private"
    type: "constraint"
    statement: "包外不能调用私有变量和过程。"
    status: "confirmed"
    source_anchor: "L16-L16"
  -
    id: "create_package_fact_schema_collision"
    type: "constraint"
    statement: "Schema不能与包同名。"
    status: "confirmed"
    source_anchor: "L17-L17"
  -
    id: "create_package_fact_oracle_definitions"
    type: "constraint"
    statement: "只支持Oracle兼容的函数/过程定义方式。"
    status: "confirmed"
    source_anchor: "L18-L18"
  -
    id: "create_package_fact_duplicate_variables"
    type: "constraint"
    statement: "包内变量以及参数不允许同名。"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "create_package_fact_session_state"
    type: "behavior_oracle"
    statement: "包全局变量为session级，各session不共享。"
    status: "confirmed"
    source_anchor: "L20-L20"
  -
    id: "create_package_fact_autonomous_cursor"
    type: "constraint"
    statement: "调用自治事务函数不能使用包游标变量，也不能递归调用使用包游标变量的函数。"
    status: "confirmed"
    source_anchor: "L21-L22"
  -
    id: "create_package_fact_no_ref_cursor"
    type: "constraint"
    statement: "包内不能声明REF CURSOR变量。"
    status: "confirmed"
    source_anchor: "L23-L23"
  -
    id: "create_package_fact_default_invoker"
    type: "environment"
    statement: "默认SECURITY INVOKER；plsql_security_definer配置可改变默认为DEFINER。"
    status: "confirmed"
    source_anchor: "L24-L26"
  -
    id: "create_package_fact_create_any"
    type: "environment"
    statement: "CREATE ANY PACKAGE可在PUBLIC和用户模式下创建。"
    status: "confirmed"
    source_anchor: "L27-L28"
  -
    id: "create_package_fact_special_names"
    type: "environment"
    statement: "特殊字符名不能含空格且须skip_insert_gs_source配置，否则可能报错。"
    status: "confirmed"
    source_anchor: "L29-L31"
  -
    id: "create_package_fact_force_create"
    type: "environment"
    statement: "依赖未定义对象时enable_force_create_obj开启则可创建并WARNING，未开启则不能创建。"
    status: "confirmed"
    source_anchor: "L32-L33"
  -
    id: "create_package_fact_defaults"
    type: "constraint"
    statement: "函数参数默认值可含本包变量，不支持跨包变量。"
    status: "confirmed"
    source_anchor: "L34-L35"
  -
    id: "create_package_fact_composite_call"
    type: "constraint"
    statement: "返回复合类型的func(x).a支持跨Schema，不支持database.schema.package形式。"
    status: "confirmed"
    source_anchor: "L36-L37"
  -
    id: "create_package_fact_procedure_prefix"
    type: "environment"
    statement: "包内过程名schema.func/package.func默认只取func，forbid_package_function_with_prefix可禁止。"
    status: "confirmed"
    source_anchor: "L38-L41"
  -
    id: "create_package_fact_pseudo_type"
    type: "constraint"
    statement: "包内过程伪类型入参不支持调用时传变长类型。"
    status: "confirmed"
    source_anchor: "L42-L43"
  -
    id: "create_package_fact_cursor_cross"
    type: "constraint"
    statement: "参数游标支持跨包%RowType和打开，不支持database.schema.package.cursor。"
    status: "confirmed"
    source_anchor: "L44-L46"
  -
    id: "create_package_fact_cursor_parameter"
    type: "environment"
    statement: "游标作为函数参数需allow_procedure_compile_check解析具体类型。"
    status: "confirmed"
    source_anchor: "L47-L49"
  -
    id: "create_package_fact_cursor_rowtype"
    type: "behavior_oracle"
    statement: "未开编译检查时cursor%RowType为record，开启后解析具体类型。"
    status: "confirmed"
    source_anchor: "L50-L52"
  -
    id: "create_package_fact_autonomous_pragma"
    type: "behavior_oracle"
    statement: "包声明自治事务PRAGMA可创建，但自治事务不生效。"
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "create_package_fact_initial_replace"
    type: "environment"
    statement: "只有初始用户可REPLACE初始用户的PACKAGE。"
    status: "confirmed"
    source_anchor: "L56-L56"
  -
    id: "create_package_fact_first_call_init"
    type: "lifecycle"
    statement: "创建仅检查变量默认值依赖有效性不执行，变量初始化/包体实例化只在首次调用执行一次。"
    status: "confirmed"
    source_anchor: "L57-L61"
  -
    id: "create_package_fact_compile_no_init"
    type: "behavior_oracle"
    statement: "创建、重编译及嵌套编译均不执行包实例化。"
    status: "confirmed"
    source_anchor: "L62-L63"
  -
    id: "create_package_fact_authid"
    type: "behavior_oracle"
    statement: "AUTHID DEFINER/CURRENT_USER控制变量函数过程执行身份；包头游标始终调用者权限。"
    status: "confirmed"
    source_anchor: "L73-L78"
  -
    id: "create_package_fact_declarations"
    type: "syntax"
    statement: "包头item_list为变量或函数/过程声明。"
    status: "confirmed"
    source_anchor: "L79-L79"
  -
    id: "create_package_fact_header_terminator"
    type: "syntax"
    statement: "END可省略包名；省略时必须用客户端/结束符，dump会补名称。"
    status: "confirmed"
    source_anchor: "L80-L83"
  -
    id: "create_package_fact_header_declare_only"
    type: "constraint"
    statement: "包头公开变量/函数/异常可被外部函数过程调用，函数过程只能声明不能定义。"
    status: "confirmed"
    source_anchor: "L86-L88"
  -
    id: "create_package_fact_body_terminator"
    type: "syntax"
    statement: "包体END省略名称时结尾必须/，dump补名称。"
    status: "confirmed"
    source_anchor: "L96-L98"
  -
    id: "create_package_fact_private_body"
    type: "behavior_oracle"
    statement: "包体声明但包头未声明的变量函数为私有。"
    status: "confirmed"
    source_anchor: "L101-L102"
  -
    id: "create_package_fact_initialization"
    type: "syntax"
    statement: "包体可含实例化部分。"
    status: "confirmed"
    source_anchor: "L103-L103"
  -
    id: "create_package_fact_header_syntax"
    type: "syntax"
    statement: "原文选项/产生式：●   CREATE PACKAGE SPECIFICATION（创建包头）语法格式。 CREATE [ OR REPLACE ] PACKAGE [ schema ] package_name [ invoker_rights_clause ] { IS | AS } item_list_1 END [ package_name ];"
    status: "confirmed"
    source_anchor: "L66-L68"
  -
    id: "create_package_fact_body_syntax"
    type: "syntax"
    statement: "原文选项/产生式：●   CREATE PACKAGE BODY（创建包体）语法格式。 CREATE [ OR REPLACE ] PACKAGE BODY [ schema ] package_name { IS | AS } declare_section [ initialize_section ] END [ package_name ];"
    status: "confirmed"
    source_anchor: "L89-L91"
  -
    id: "create_package_fact_cleanup_example"
    type: "example"
    statement: "清理表和包。"
    status: "confirmed"
    source_anchor: "L170-L172"
  -
    id: "create_package_fact_declaration_contract"
    type: "constraint"
    statement: "静态域只生成一个整数变量和无参过程且END带包名；递归声明、异常、函数/游标、自定义类型和初始化协议不进入静态域。"
    status: "confirmed"
    source_anchor: "L66-L68"
  -
    id: "create_package_fact_state_oracle"
    type: "environment"
    statement: "静态CREATE PACKAGE代表不执行包体；多会话状态、首次调用、重编译初始化和依赖失效需专用环境，普通manifest不验证状态行为。"
    status: "confirmed"
    source_anchor: "L20-L20"
  -
    id: "create_package_fact_example_lines_107"
    type: "example"
    statement: "示例片段（仅作来源证据）：●   CREATE PACKAGE示例 --创建测试表tbl_test。 gaussdb=# CREATE TABLE tbl_test(uid varchar(6) PRIMARY KEY, area_id varchar(5), level int);"
    status: "confirmed"
    source_anchor: "L107-L109"
  -
    id: "create_package_fact_example_lines_111"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建包头。 gaussdb=# CREATE OR REPLACE PACKAGE pkg_test AS --公有存储过程可以被外部调用。 PROCEDURE proc_ist_tbl_test(v_uid in varchar, v_area_id varchar, v_level int); PROCEDURE proc_del_tbl_test(v_uid in varchar); PROCEDURE proc_upd_tbl_test(v_uid in varchar, v_area_id varchar, v_level int); END pkg_test; /"
    status: "confirmed"
    source_anchor: "L111-L119"
  -
    id: "create_package_fact_example_lines_121"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建包体。 gaussdb=# CREATE OR REPLACE PACKAGE BODY pkg_test AS PROCEDURE proc_ist_tbl_test(v_uid in varchar, v_area_id varchar, v_level int) AS BEGIN INSERT INTO tbl_test VALUES (v_uid, v_area_id, v_level); END;"
    status: "confirmed"
    source_anchor: "L121-L126"
  -
    id: "create_package_fact_example_lines_127"
    type: "example"
    statement: "示例片段（仅作来源证据）：PROCEDURE proc_del_tbl_test(v_uid in varchar) AS BEGIN DELETE FROM tbl_test WHERE uid = v_uid; END;"
    status: "confirmed"
    source_anchor: "L127-L130"
  -
    id: "create_package_fact_example_lines_131"
    type: "example"
    statement: "示例片段（仅作来源证据）：PROCEDURE proc_upd_tbl_test(v_uid in varchar, v_area_id varchar, v_level int) AS BEGIN UPDATE tbl_test SET area_id = v_area_id, level = v_level WHERE uid = v_uid; END; var4 int := 10;"
    status: "confirmed"
    source_anchor: "L131-L135"
  -
    id: "create_package_fact_example_lines_136"
    type: "example"
    statement: "示例片段（仅作来源证据）：--实例化开始。 BEGIN var4 := 10; dbe_output.print_line(var4); END pkg_test; /"
    status: "confirmed"
    source_anchor: "L136-L141"
  -
    id: "create_package_fact_example_lines_143"
    type: "example"
    statement: "示例片段（仅作来源证据）：●   调用PACKAGE示例 --使用CALL调用PACKAGE的存储过程。 gaussdb=# CALL pkg_test.proc_ist_tbl_test('0A00B1','01001',24); gaussdb=# SELECT * FROM tbl_test; uid | area_id | level --------+---------+--------- 0A00B1 | 01001 |         24 (1 row)"
    status: "confirmed"
    source_anchor: "L143-L150"
  -
    id: "create_package_fact_example_lines_152"
    type: "example"
    statement: "示例片段（仅作来源证据）：--使用SELECT调用PACKAGE的存储过程。 gaussdb=# SELECT pkg_test.proc_upd_tbl_test('0A00B1','01001','26'); gaussdb=# SELECT * FROM tbl_test; uid | area_id | level --------+---------+------- 0A00B1 | 01001 | 26 (1 row)"
    status: "confirmed"
    source_anchor: "L152-L158"
  -
    id: "create_package_fact_example_lines_160"
    type: "example"
    statement: "示例片段（仅作来源证据）：--使用匿名块调用PACKAGE的存储过程。 gaussdb=# BEGIN pkg_test.proc_del_tbl_test('0A00B1'); END; / gaussdb=# SELECT * FROM tbl_test; uid | area_id | level -----+---------+------- (0 rows)"
    status: "confirmed"
    source_anchor: "L160-L168"
