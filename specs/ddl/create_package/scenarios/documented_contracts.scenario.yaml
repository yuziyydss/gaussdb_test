schema_version: 1
kind: "scenario"
id: "scenario_create_package_documented_contracts"
name: "CREATE PACKAGE documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "create_package"
fixture_refs: []
fact_refs:
  - "create_package_fact_purpose"
  - "create_package_fact_header_body"
  - "create_package_fact_locks"
  - "create_package_fact_no_instantiation_transaction"
  - "create_package_fact_no_trigger"
  - "create_package_fact_no_sql_variable"
  - "create_package_fact_private"
  - "create_package_fact_schema_collision"
  - "create_package_fact_oracle_definitions"
  - "create_package_fact_duplicate_variables"
  - "create_package_fact_session_state"
  - "create_package_fact_autonomous_cursor"
  - "create_package_fact_no_ref_cursor"
  - "create_package_fact_default_invoker"
  - "create_package_fact_create_any"
  - "create_package_fact_special_names"
  - "create_package_fact_force_create"
  - "create_package_fact_defaults"
  - "create_package_fact_composite_call"
  - "create_package_fact_procedure_prefix"
  - "create_package_fact_pseudo_type"
  - "create_package_fact_cursor_cross"
  - "create_package_fact_cursor_parameter"
  - "create_package_fact_cursor_rowtype"
  - "create_package_fact_autonomous_pragma"
  - "create_package_fact_initial_replace"
  - "create_package_fact_first_call_init"
  - "create_package_fact_compile_no_init"
  - "create_package_fact_authid"
  - "create_package_fact_header_declare_only"
  - "create_package_fact_private_body"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "创建PACKAGE。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "包头声明的函数/过程必须在包体明确定义。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "CREATE对象加写锁，执行期编译和运行对函数及依赖包加读锁。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "实例化不能调用包含COMMIT/ROLLBACK的过程。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "不能在触发器中调用PACKAGE函数。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "外部SQL不能直接使用包变量。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "包外不能调用私有变量和过程。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "Schema不能与包同名。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "只支持Oracle兼容的函数/过程定义方式。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "包内变量以及参数不允许同名。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "包全局变量为session级，各session不共享。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "调用自治事务函数不能使用包游标变量，也不能递归调用使用包游标变量的函数。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "包内不能声明REF CURSOR变量。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "默认SECURITY INVOKER；plsql_security_definer配置可改变默认为DEFINER。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "CREATE ANY PACKAGE可在PUBLIC和用户模式下创建。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "特殊字符名不能含空格且须skip_insert_gs_source配置，否则可能报错。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "依赖未定义对象时enable_force_create_obj开启则可创建并WARNING，未开启则不能创建。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "函数参数默认值可含本包变量，不支持跨包变量。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "返回复合类型的func(x).a支持跨Schema，不支持database.schema.package形式。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "包内过程名schema.func/package.func默认只取func，forbid_package_function_with_prefix可禁止。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "包内过程伪类型入参不支持调用时传变长类型。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "参数游标支持跨包%RowType和打开，不支持database.schema.package.cursor。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "游标作为函数参数需allow_procedure_compile_check解析具体类型。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "未开编译检查时cursor%RowType为record，开启后解析具体类型。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "包声明自治事务PRAGMA可创建，但自治事务不生效。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "只有初始用户可REPLACE初始用户的PACKAGE。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "创建仅检查变量默认值依赖有效性不执行，变量初始化/包体实例化只在首次调用执行一次。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "创建、重编译及嵌套编译均不执行包实例化。"
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "AUTHID DEFINER/CURRENT_USER控制变量函数过程执行身份；包头游标始终调用者权限。"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "包头公开变量/函数/异常可被外部函数过程调用，函数过程只能声明不能定义。"
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "包体声明但包头未声明的变量函数为私有。"
oracles:
  -
    kind: "documented_behavior"
    expected: "CREATE对象加写锁，执行期编译和运行对函数及依赖包加读锁。"
  -
    kind: "documented_behavior"
    expected: "包全局变量为session级，各session不共享。"
  -
    kind: "documented_behavior"
    expected: "未开编译检查时cursor%RowType为record，开启后解析具体类型。"
  -
    kind: "documented_behavior"
    expected: "包声明自治事务PRAGMA可创建，但自治事务不生效。"
  -
    kind: "documented_behavior"
    expected: "创建、重编译及嵌套编译均不执行包实例化。"
  -
    kind: "documented_behavior"
    expected: "AUTHID DEFINER/CURRENT_USER控制变量函数过程执行身份；包头游标始终调用者权限。"
  -
    kind: "documented_behavior"
    expected: "包体声明但包头未声明的变量函数为私有。"
execution_requirements:
  - "database"
  - "same_session"
