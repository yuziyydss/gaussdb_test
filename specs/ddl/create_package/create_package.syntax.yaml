schema_version: 1
kind: "syntax"
id: "syntax_create_package"
name: "CREATE PACKAGE 语法"
factor_ref: "create_package"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "create_package.form"
  replace:
    type: "token"
    optional: true
    dimension_ref: "create_package.replace"
  as_is:
    type: "token"
    optional: true
    dimension_ref: "create_package.as_is"
  authid:
    type: "token"
    optional: true
    dimension_ref: "create_package.authid"
source_fact_refs:
  - "create_package_fact_header_syntax"
  - "create_package_fact_body_syntax"
  - "create_package_fact_declarations"
  - "create_package_fact_header_terminator"
  - "create_package_fact_body_terminator"
  - "create_package_fact_initialization"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "CREATE "
    -
      kind: "slot"
      slot: "replace"
    -
      kind: "literal"
      text: " PACKAGE "
    -
      kind: "choice"
      selector: "form"
      branches:
        create_package_form_header:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "fp_cs_one.b10_package_new "
            -
              kind: "slot"
              slot: "authid"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "as_is"
            -
              kind: "literal"
              text: " g_counter INTEGER := 0; PROCEDURE p_inc; END b10_package_new"
        create_package_form_body:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "BODY fp_cs_one.b10_package_new "
            -
              kind: "slot"
              slot: "as_is"
            -
              kind: "literal"
              text: " PROCEDURE p_inc AS BEGIN g_counter := g_counter + 1; END; END b10_package_new"
