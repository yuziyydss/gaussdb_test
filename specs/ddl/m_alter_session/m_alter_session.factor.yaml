facts:
- id: m_alter_session_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.11 L2-2
- id: m_alter_session_fact_syntax
  type: syntax
  statement: ALTER SESSION 支持 SET TRANSACTION 与其他运行时参数分支。
  status: confirmed
  source_anchor: 2.4.2.6.11 L18-31
- id: m_alter_session_fact_session
  type: environment
  statement: 参数修改影响当前会话，直到连接断开。
  status: confirmed
  source_anchor: 2.4.2.6.11 L5-6
- id: m_alter_session_fact_transaction
  type: environment
  statement: 事务参数前须 START TRANSACTION，否则隐式事务立即结束，看不到效果。
  status: confirmed
  source_anchor: 2.4.2.6.11 L10-11
- id: m_alter_session_fact_timezone
  type: syntax
  statement: 时区取有效本地时区，文档给出 PRC 缺省。
  status: confirmed
  source_anchor: 2.4.2.6.11 L51-53
- id: m_alter_session_fact_from_current
  type: syntax
  statement: FROM CURRENT 取当前会话参数值。
  status: confirmed
  source_anchor: 2.4.2.6.11 L49-49
- id: m_alter_session_fact_alias
  type: behavior_oracle
  statement: READ UNCOMMITTED 行为同 READ COMMITTED。
  status: confirmed
  source_anchor: 2.4.2.6.11 L77-78
- id: m_alter_session_fact_schema_conflict
  type: open_question
  statement: 语法写 CURRENT_SCHEMA schema，示例含 TO；此分支不推断关键字可省略。
  status: needs_verification
  source_anchor: 2.4.2.6.11 L100-100
- id: m_alter_session_fact_transaction_braces
  type: open_question
  statement: 事务语法右花括号不配平；本批仅生成明确独立特性，不复制额外括号。
  status: needs_verification
  source_anchor: 2.4.2.6.11 L20-20
- id: m_alter_session_fact_purpose
  type: example
  statement: ALTER SESSION命令用于定义或修改那些对当前会话有影响的条件或参数。修改后的 会话参数会一直保持，直到断开当前会话。
  status: confirmed
  source_anchor: M-Compatibility L4-4
- id: m_alter_session_fact_constraint
  type: example
  statement: 如果执行SET TRANSACTION之前没有执行START TRANSACTION，则事务立即结 可以用START TRANSACTION里面声明所需要的transaction_mode(s)的方法来避
  status: confirmed
  source_anchor: M-Compatibility L9-9
- id: m_alter_session_fact_params
  type: example
  statement: ●   config_parameter 可设置的运行时参数的名称。可用的运行时参数可以使用SHOW ALL命令查看。 –   value
  status: confirmed
  source_anchor: M-Compatibility L34-39
- id: m_alter_session_fact_example
  type: example
  statement: m_alter_session的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L80-82
