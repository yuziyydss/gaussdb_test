    id: "drop_llm_fact_runtime_contract"
    type: "environment"
    statement: "静态LLM名代表只证明有限语法；真实存在且归本用例所有的模型服务需专用注册fixture，DROP LLM无IF EXISTS，普通manifest不验证模型删除行为。"
    status: "confirmed"
    source_anchor: "L5-L5"

