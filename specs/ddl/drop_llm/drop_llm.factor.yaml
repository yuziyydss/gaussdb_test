    type: "behavior_oracle"
    statement: "该名称作为标识符，在以后的语义函数中 作为参数输入，不超过63字节。"
    status: "confirmed"
    source_anchor: "L16-L20"
  -
    id: "drop_llm_fact_body_16_2"
    type: "behavior_oracle"
    statement: "输入大小写不敏感，在系统中自动转写至小写字 母存储，只支持数字、字母和下划线“_”符号，且不能以数字开头，如果超过长 度则会被自动截断。"
    status: "confirmed"
    source_anchor: "L16-L20"
