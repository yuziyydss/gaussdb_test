schema_version: 1
kind: factor
id: alter_table
name: ALTER TABLE
category: DDL
status: needs_review
description: 以 GaussDB V2.0-10.0.0 PDF 的 ALTER TABLE 章节为唯一产品事实源，建模顶层语句、重复 action、列与约束操作、在线 DDL 及环境能力。

source:
  product: GaussDB V2.0-10.0.0
  document: GaussDB Kernel 参考（文档版本 01）
  version: V2.0-10.0.0
  artifact_sha256: ff15f5547fd4f2b5aa4888b0d8c67b74f0586098cf3c87d3b2628506562e786e
  parent_pdf_sha256: 716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe
  extraction_rule_version: gaussdb-pdf-outline-v1
  extraction_date: "2026-09-04"
  catalog_chapter_ref:
    document_id: gaussdb_v2_0_10_0_0_centralized_reference_01
    source_relpath: general/ddl/alter_table.txt
    chapter_sha256: ff15f5547fd4f2b5aa4888b0d8c67b74f0586098cf3c87d3b2628506562e786e

source_ledger_ref: source_ledger_alter_table
syntax_ref: syntax_alter_table_v1

dimensions:
  statement_form:
    description: ALTER TABLE 的独立顶层产生式。
    default_value_id: at_statement_action
    classes:
      - id: at_statement_class
        meaning: 通用 action 与不能并入 action 列表的顶层语句。
        values:
          - {id: at_statement_action, render: "", representative: true, validity: valid}
          - {id: at_statement_rename_table, render: "", representative: true, validity: valid, fact_refs: [at_fact_rename]}
          - {id: at_statement_rename_column, render: "", representative: true, validity: valid, fact_refs: [at_fact_rename]}
          - {id: at_statement_rename_constraint, render: "", representative: true, validity: valid, fact_refs: [at_fact_rename]}
          - {id: at_statement_set_schema, render: "", representative: true, validity: valid, fact_refs: [at_fact_set_schema]}
          - {id: at_statement_add_multi, render: "", representative: true, validity: valid, fact_refs: [at_fact_multi_action]}
          - {id: at_statement_modify_multi, render: "", representative: true, validity: conditional, fact_refs: [at_fact_multi_action, at_open_modify_multi_contract]}
          - id: at_statement_modify_multi_fresh
            render: ""
            representative: true
            validity: valid
            fixture_refs: [fixture_alter_table_modify_multi_fresh]
            properties: {admitted_table_profile: at_table_modify_multi_fresh, original_value_ref: at_statement_modify_multi}
            fact_refs: [at_fact_modify_multi_syntax]
          - {id: at_statement_gsiwaitall, render: "", representative: true, validity: invalid, fact_refs: [at_fact_gsiwaitall]}

  ddl_mode:
    description: 默认、离线、在线及在线参数边界。
    default_value_id: at_mode_default
    classes:
      - id: at_mode_valid_class
        meaning: 文档明确的模式与合法在线参数。
        values:
          - {id: at_mode_default, render: "", representative: true, validity: valid, properties: {online: false, parameter_valid: true}}
          - {id: at_mode_offline, render: "OFFLINE ", representative: true, validity: valid, properties: {online: false, parameter_valid: true}, fact_refs: [at_fact_online_mode]}
          - {id: at_mode_online, render: "ONLINE ", representative: true, validity: valid, properties: {online: true, parameter_valid: true}, fact_refs: [at_fact_online_mode]}
          - {id: at_mode_online_parallel4, render: "ONLINE WITH (parallel_threads = 4) ", representative: true, validity: valid, properties: {online: true, parameter_valid: true}, fact_refs: [at_fact_online_parameters]}
          - {id: at_mode_online_catchup10, render: "ONLINE WITH (max_catchup_times = 10) ", representative: true, validity: valid, properties: {online: true, parameter_valid: true}, fact_refs: [at_fact_online_parameters]}
      - id: at_mode_invalid_class
        meaning: 文档明确越界的在线参数。
        values:
          - {id: at_mode_online_parallel0, render: "ONLINE WITH (parallel_threads = 0) ", representative: true, validity: invalid, properties: {online: true, parameter_valid: false}, fact_refs: [at_fact_online_parameters]}
          - {id: at_mode_online_parallel33, render: "ONLINE WITH (parallel_threads = 33) ", representative: true, validity: invalid, properties: {online: true, parameter_valid: false}, fact_refs: [at_fact_online_parameters]}
          - {id: at_mode_online_catchup51, render: "ONLINE WITH (max_catchup_times = 51) ", representative: true, validity: invalid, properties: {online: true, parameter_valid: false}, fact_refs: [at_fact_online_parameters]}

  if_exists:
    description: 目标表不存在时 ERROR 或 NOTICE。
    default_value_id: at_if_exists_none
    classes:
      - id: at_if_exists_class
        meaning: 默认行为或 IF EXISTS。
        values:
          - {id: at_if_exists_none, render: "", representative: true, validity: valid}
          - {id: at_if_exists, render: "IF EXISTS ", representative: true, validity: valid, fact_refs: [at_fact_if_exists]}

  target_form:
    description: 表目标的四种语法形式；对后代表的实际作用范围由 planned scenario 验证。
    default_value_id: at_target_plain
    classes:
      - id: at_target_form_class
        meaning: table_name、table_name *、ONLY table_name 和 ONLY (table_name) 的语法代表。
        values:
          - {id: at_target_plain, render: "", representative: true, validity: valid, fact_refs: [at_fact_target_forms]}
          - {id: at_target_star, render: "", representative: true, validity: valid, fact_refs: [at_fact_target_forms]}
          - {id: at_target_only, render: "", representative: true, validity: valid, fact_refs: [at_fact_target_forms]}
          - {id: at_target_only_parenthesized, render: "", representative: true, validity: valid, fact_refs: [at_fact_target_forms]}

  table_profile:
    description: 普通、分区、临时和条件环境目标表。
    profile_source:
      matrix_ref: matrix_alter_table_table_profiles
      profile_id_path: profiles.id

  action_profile:
    description: 通用 action 产生式及其目标列、兼容性和环境契约。
    profile_source:
      matrix_ref: matrix_alter_table_action_profiles
      profile_id_path: profiles.id

  rename_operator:
    description: 重命名表支持的三个同义连接符。
    default_value_id: at_rename_to
    classes:
      - id: at_rename_operator_class
        meaning: TO、AS 和等号。
        values:
          - {id: at_rename_to, render: "TO", representative: true, validity: valid, fact_refs: [at_fact_rename]}
          - {id: at_rename_as, render: "AS", representative: true, validity: valid, fact_refs: [at_fact_rename]}
          - {id: at_rename_equals, render: "=", representative: true, validity: valid, fact_refs: [at_fact_rename]}

  column_keyword:
    description: RENAME COLUMN 中 COLUMN 的可选性。
    default_value_id: at_column_keyword
    classes:
      - id: at_column_keyword_class
        meaning: 省略或显式 COLUMN。
        values:
          - {id: at_column_keyword_none, render: "", representative: true, validity: valid, fact_refs: [at_fact_rename]}
          - {id: at_column_keyword, render: "COLUMN ", representative: true, validity: valid, fact_refs: [at_fact_rename]}

  add_column_items:
    description: ADD (...) 顶层产生式中的有限列定义列表，由 AST repeat 渲染。
    default_value_id: at_add_columns_two
    classes:
      - id: at_add_column_items_class
        meaning: 两个可独立解析的列定义。
        values:
          - id: at_add_columns_two
            render: ""
            representative: true
            validity: valid
            properties: {items: ["extra_a INTEGER", "extra_b VARCHAR(20)"]}
            fact_refs: [at_fact_multi_action, at_fact_add_column]

  modify_column_items:
    description: MODIFY (...) 顶层产生式中的有限列定义列表，由 AST repeat 渲染。
    default_value_id: at_modify_columns_two
    classes:
      - id: at_modify_column_items_class
        meaning: 类型变更与 NULL 属性变更的两个列项。
        values:
          - id: at_modify_columns_two
            render: ""
            representative: true
            validity: valid
            properties: {items: ["note VARCHAR(96)", "amount NOT NULL"]}
            fact_refs: [at_fact_multi_action, at_fact_modify_multi_syntax]

rules:
  - id: at_rule_online_parameter_range
    kind: requires
    expression: ddl_mode.properties.parameter_valid == True
    severity: error
    fact_refs: [at_fact_online_parameters]

  - id: at_rule_partition_action_supported
    kind: requires
    expression: table_profile.properties.partitioned == True => action_profile.properties.partition_forbidden == False
    severity: error
    fact_refs: [at_fact_partition_restrictions]

  - id: at_rule_rls_target_supported
    kind: requires
    expression: action_profile.properties.enables_rls == True => table_profile.properties.rls_supported == True
    severity: error
    fact_refs: [at_fact_rls]

  - id: at_rule_orientation_immutable
    kind: requires
    expression: action_profile.properties.changes_orientation == False
    severity: error
    fact_refs: [at_fact_orientation_restriction]

  - id: at_rule_nextval_default_unsupported
    kind: requires
    expression: action_profile.properties.default_uses_nextval == False
    severity: error
    fact_refs: [at_fact_add_column_default]

  - id: at_rule_statistics_target_range
    kind: requires
    expression: action_profile.properties.statistics_target_valid == True
    severity: error
    fact_refs: [at_fact_column_statistics]

  - id: at_rule_identity_type_supported
    kind: requires
    expression: action_profile.properties.identity_type_supported == True
    severity: error
    fact_refs: [at_fact_identity]

  - id: at_rule_gsiwaitall_unsupported
    kind: requires
    expression: action_profile.properties.current_version_supported == True
    severity: error
    fact_refs: [at_fact_gsiwaitall]

facts:
  - id: at_fact_change_foreign_forbidden
    type: environment
    statement: CHANGE语法不支持外表。
    status: confirmed
    source_anchor: L400-L400
  - id: at_fact_change_encrypted_condition
    type: environment
    statement: CHANGE仅在密态内存加解密模式且传输密钥到服务端内存时支持修改加密字段。
    status: confirmed
    source_anchor: L400-L401
  - id: at_fact_change_partition_type_collation
    type: constraint
    statement: CHANGE不支持修改分区键字段的数据类型和排序规则。
    status: confirmed
    source_anchor: L401-L403
  - id: at_fact_change_rule_type_collation
    type: constraint
    statement: CHANGE不支持修改规则引用字段的数据类型和排序规则。
    status: confirmed
    source_anchor: L403-L403
  - id: at_fact_change_matview_type_collation
    type: constraint
    statement: CHANGE不支持修改物化视图引用字段的数据类型和排序规则。
    status: confirmed
    source_anchor: L404-L404
  - {id: at_fact_modify_single_syntax, type: syntax, statement: "扩展单列MODIFY可携COLUMN、数据类型、字符集、约束与位置；本批只取COLUMN和VARCHAR类型。", status: confirmed, source_anchor: "L364-L366"}
  - {id: at_fact_modify_single_definition, type: behavior_oracle, statement: "扩展MODIFY用新列定义替换原定义，原索引与独立约束不会直接删除；依赖重建不是本批静态证明。", status: confirmed, source_anchor: "L367-L369"}
  - {id: at_fact_modify_single_b_mode, type: environment, statement: "扩展单列MODIFY只能在sql_compatibility=B时使用。", status: confirmed, source_anchor: "L370-L374"}
  - {id: at_fact_modify_single_switch, type: environment, statement: "同形MODIFY类型变更语法在b_format_behavior_compat_options含enable_modify_column时按扩展定义替换语义处理。", status: confirmed, source_anchor: "L387-L389"}
  - {id: at_fact_change_syntax, type: syntax, statement: "CHANGE可省略COLUMN，指定旧名、新名与数据类型；本批只接入同定义改名，不覆盖字符集、约束或位置变更。", status: confirmed, source_anchor: "L393-L395 column_clause/CHANGE"}
  - {id: at_fact_change_name_unique, type: constraint, statement: "CHANGE修改已存在列的名称和定义，新列名不能是表中已有列名。", status: confirmed, source_anchor: "L396 column_clause/CHANGE"}
  - {id: at_fact_change_b_mode, type: environment, statement: "CHANGE语法只能在sql_compatibility为B时使用。", status: confirmed, source_anchor: "L400 column_clause/CHANGE"}
  - {id: at_fact_modify_multi_syntax, type: syntax, statement: "MODIFY括号多列形式支持各列数据类型、NOT NULL或NULL项及逗号重复。", status: confirmed, source_anchor: "L359-L361 column_clause/MODIFY 多列"}
  - {id: at_fact_modify_multi_statistics, type: lifecycle, statement: "MODIFY多列说明指出字段统计信息清空，建议修改后重新收集。", status: confirmed, source_anchor: "L362-L363 column_clause/MODIFY 多列"}
  - {id: at_fact_purpose, type: syntax, statement: "ALTER TABLE 修改表定义、名称、模式、列、约束和安全属性。", status: confirmed, source_anchor: "功能描述"}
  - {id: at_fact_permissions, type: environment, statement: "ALTER 权限、Owner、系统管理员和三权分立共同决定执行及属主/模式变更权限。", status: confirmed, source_anchor: "注意事项/权限"}
  - {id: at_fact_partition_restrictions, type: constraint, statement: "分区表不能修改表级 TABLESPACE、分区键字段或转换分区键字符集。", status: confirmed, source_anchor: "注意事项/分区表"}
  - {id: at_fact_orientation_restriction, type: constraint, statement: "不支持修改 ORIENTATION 存储参数。", status: confirmed, source_anchor: "注意事项/ORIENTATION"}
  - {id: at_fact_set_schema, type: environment, statement: "SET SCHEMA 只支持用户模式且需要新模式 CREATE 权限；关联索引约束随表移动，序列不随表移动。", status: confirmed, source_anchor: "注意事项与 SET SCHEMA"}
  - {id: at_fact_add_column_default, type: constraint, statement: "新增列不支持 nextval() 默认值；已有行按 DEFAULT 或 NULL 初始化，非空默认可能重写表。", status: confirmed, source_anchor: "注意事项/ADD COLUMN"}
  - {id: at_fact_prepared_default, type: environment, statement: "JDBC PreparedStatement 支持对 DEFAULT 值进行参数化设置。", status: confirmed, source_anchor: "注意事项/JDBC PreparedStatement"}
  - {id: at_fact_serial_compat, type: environment, statement: "PG 兼容模式下 SERIAL 系列新增列仅支持普通表且受表持久性和存储引擎限制。", status: confirmed, source_anchor: "注意事项/SERIAL"}
  - {id: at_fact_column_position, type: environment, statement: "FIRST/AFTER 仅 B 模式且受加密列、规则、外表和 SET 类型限制，并会触发表重写。", status: confirmed, source_anchor: "注意事项与参数/FIRST AFTER"}
  - {id: at_fact_constraint_limit, type: constraint, statement: "单表约束数不能超过 32767。", status: confirmed, source_anchor: "注意事项/约束数"}
  - {id: at_fact_system_columns, type: constraint, statement: "系统列及 rowid/rowno 不支持若干列变更，按约束名删除主键不会删除 NOT NULL。", status: confirmed, source_anchor: "注意事项/系统列"}
  - {id: at_fact_online_mode, type: lifecycle, statement: "ONLINE/OFFLINE 控制在线 DDL；不支持的 ONLINE 形态通过 NOTICE 降级为离线而非语法错误。", status: confirmed, source_anchor: "注意事项与参数/ONLINE"}
  - {id: at_fact_online_environment, type: environment, statement: "在线 DDL 必须以单语句在事务外且非存储过程环境执行；M 兼容模式不支持，受限表形态或升级观察期会降级为离线，并且需要足够磁盘且避免长事务。", status: confirmed, source_anchor: "L50-L59, L75-L94 在线 DDL 环境"}
  - {id: at_fact_online_lifecycle, type: lifecycle, statement: "在线 DDL 会创建 online$$ 临时 Schema、追增 DML，取消或故障可能残留对象和 append_mode 状态。", status: confirmed, source_anchor: "注意事项与参数/在线 DDL 生命周期"}
  - {id: at_fact_online_parameters, type: constraint, statement: "parallel_threads 合法范围 1~32，max_catchup_times 合法范围 1~50。", status: confirmed, source_anchor: "参数说明/online_parameter"}
  - {id: at_fact_main_grammar, type: syntax, statement: "ALTER TABLE 包含通用 action、多列、MODIFY、重命名、SET SCHEMA 与 GSIWAITALL 等顶层产生式。", status: confirmed, source_anchor: "语法格式"}
  - {id: at_fact_constraint_actions, type: syntax, statement: "通用 action 包含增加、验证、删除约束和 USING INDEX。", status: confirmed, source_anchor: "action/约束"}
  - {id: at_fact_cluster, type: syntax, statement: "CLUSTER ON 选择未来聚簇默认索引，SET WITHOUT CLUSTER 清除选择。", status: confirmed, source_anchor: "action/CLUSTER"}
  - {id: at_fact_rowid, type: environment, statement: "SET WITH ROWID 仅 A 模式且不支持系统、临时、unlogged、外表及冲突系统列。", status: confirmed, source_anchor: "action/ROWID"}
  - {id: at_fact_table_storage, type: constraint, statement: "SET/RESET 修改表存储参数；部分参数为内部参数或仅适用于特定表形态。", status: confirmed, source_anchor: "action 与参数/storage_parameter"}
  - {id: at_fact_owner, type: environment, statement: "OWNER TO 受角色成员关系、模式权限和三权分立限制。", status: confirmed, source_anchor: "action/OWNER"}
  - {id: at_fact_tablespace, type: lifecycle, statement: "SET TABLESPACE 移动表数据文件但不移动索引。", status: confirmed, source_anchor: "action/SET TABLESPACE"}
  - {id: at_fact_internal_distribution, type: environment, statement: "GROUP/NODE/SLICE 等扩缩容语法仅供扩展模式或内部工具。", status: confirmed, source_anchor: "action/内部扩缩容"}
  - {id: at_fact_triggers, type: behavior_oracle, statement: "触发器可按单个、ALL、USER、REPLICA、ALWAYS 启停，并受复制角色影响。", status: confirmed, source_anchor: "action/TRIGGER"}
  - {id: at_fact_trigger_disable_scope, type: behavior_oracle, statement: "DISABLE TRIGGER 可作用于单个触发器、ALL 或 USER；USER 不包括内部生成的约束触发器。", status: confirmed, source_anchor: "L242-L244 action/TRIGGER"}
  - {id: at_fact_trigger_disable_integrity_risk, type: behavior_oracle, statement: "禁用触发器后，原本由触发器保障的约束完整性可能无法保证。", status: confirmed, source_anchor: "L245 action/TRIGGER"}
  - {id: at_fact_trigger_enable_scope, type: behavior_oracle, statement: "ENABLE TRIGGER 可作用于单个触发器、ALL 或 USER。", status: confirmed, source_anchor: "L246-L247 action/TRIGGER"}
  - {id: at_fact_trigger_replica_role, type: behavior_oracle, statement: "replica 会话只触发 ENABLE REPLICA 触发器；默认 origin 或 local 会话只触发未配置 ENABLE REPLICA 的触发器。", status: confirmed, source_anchor: "L248-L252 action/TRIGGER"}
  - {id: at_fact_trigger_always, type: behavior_oracle, statement: "ENABLE ALWAYS 触发器无论当前复制模式如何都会触发。", status: confirmed, source_anchor: "L253-L254 action/TRIGGER"}
  - {id: at_fact_rls, type: behavior_oracle, statement: "行访问控制支持 ENABLE/DISABLE/FORCE/NO FORCE，但不能对外表或临时表开启。", status: confirmed, source_anchor: "action/RLS"}
  - {id: at_fact_tde_rotation, type: lifecycle, statement: "ENCRYPTION KEY ROTATION 仅用于已开启 TDE 的加密表。", status: confirmed, source_anchor: "action/ENCRYPTION KEY ROTATION"}
  - {id: at_fact_replica_identity, type: behavior_oracle, statement: "REPLICA IDENTITY 支持 DEFAULT、USING INDEX、FULL、NOTHING、UNIQUE，并受主键和 ustore 语义影响。", status: confirmed, source_anchor: "action/REPLICA IDENTITY"}
  - {id: at_fact_auto_increment, type: constraint, statement: "AUTO_INCREMENT 仅 B 模式，值必须非负且不超过 2^127-1，且仅大于当前计数器时生效。", status: confirmed, source_anchor: "L290-L293 action/AUTO_INCREMENT"}
  - {id: at_fact_charset, type: environment, statement: "表和列字符集/字符序变更仅 B 模式并受编码、类型映射和继承规则限制。", status: confirmed, source_anchor: "action 与参数/CHARSET"}
  - {id: at_fact_ilm, type: environment, statement: "ILM 支持增加、启停、删除表/分区/子分区策略，行表达式依赖函数白名单。", status: confirmed, source_anchor: "action/ILM"}
  - {id: at_fact_colview, type: environment, statement: "COLVIEW/NOCOLVIEW 与优先级属于 HTAP/IMCV 环境能力。", status: confirmed, source_anchor: "action/COLVIEW"}
  - {id: at_fact_add_column, type: syntax, statement: "ADD COLUMN 支持 IF NOT EXISTS、类型、字符集、排序、约束和 FIRST/AFTER。", status: confirmed, source_anchor: "column_clause/ADD"}
  - {id: at_fact_modify_column, type: environment, statement: "MODIFY/CHANGE 的扩展语法主要受 B 模式、加密列、分区键和依赖对象限制。", status: confirmed, source_anchor: "column_clause/MODIFY CHANGE"}
  - {id: at_fact_drop_column, type: lifecycle, statement: "DROP COLUMN 支持 IF EXISTS、RESTRICT/CASCADE；删除是逻辑隐藏，空间由后续 VACUUM 回收。", status: confirmed, source_anchor: "column_clause/DROP"}
  - {id: at_fact_drop_column_local_dependents, type: lifecycle, statement: "DROP COLUMN 删除字段时自动删除与该字段相关的索引和表约束。", status: confirmed, source_anchor: "L415-L416 column_clause/DROP"}
  - {id: at_fact_drop_column_external_dependency, type: constraint, statement: "表外对象依赖被删字段时，DROP COLUMN 必须声明 CASCADE。", status: confirmed, source_anchor: "L417 column_clause/DROP"}
  - {id: at_fact_drop_column_logical_visibility, type: lifecycle, statement: "DROP COLUMN 只把字段标记为 SQL 不可见，后续 INSERT 和 UPDATE 在该字段存储 NULL。", status: confirmed, source_anchor: "L418-L419 column_clause/DROP"}
  - {id: at_fact_drop_column_space_reclamation, type: lifecycle, statement: "DROP COLUMN 不立即释放字段占用的磁盘空间，该空间在后续 VACUUM 时回收。", status: confirmed, source_anchor: "L420-L421 column_clause/DROP"}
  - {id: at_fact_alter_type, type: lifecycle, statement: "ALTER TYPE 支持 COLLATE/USING；二进制不兼容时重写表并需处理默认值、索引和依赖。", status: confirmed, source_anchor: "column_clause/ALTER TYPE"}
  - {id: at_fact_column_default, type: behavior_oracle, statement: "SET/DROP DEFAULT 只影响后续 INSERT，不修改已有行。", status: confirmed, source_anchor: "column_clause/DEFAULT"}
  - {id: at_fact_not_null, type: behavior_oracle, statement: "SET NOT NULL 要求现有数据满足约束，DROP NOT NULL 取消限制。", status: confirmed, source_anchor: "column_clause/NOT NULL"}
  - {id: at_fact_column_statistics, type: constraint, statement: "列统计目标为 -1 或 0~10000；PERCENT 为 0~100；多列统计列数受 GUC 控制。", status: confirmed, source_anchor: "column_clause/STATISTICS"}
  - {id: at_fact_attribute_storage, type: constraint, statement: "列属性只允许 n_distinct；SET STORAGE 支持 PLAIN/EXTERNAL/EXTENDED/MAIN。", status: confirmed, source_anchor: "column_clause/属性与 STORAGE"}
  - {id: at_fact_identity, type: constraint, statement: "IDENTITY 仅支持数值类型、每表一个、默认 NOT NULL，且与 DEFAULT 等属性互斥。", status: confirmed, source_anchor: "column_clause/IDENTITY"}
  - {id: at_fact_identity_drop_lifecycle, type: lifecycle, statement: "MODIFY column DROP IDENTITY 只删除 identity 属性及相关隐式序列。", status: confirmed, source_anchor: "L469-L470 column_clause/IDENTITY"}
  - {id: at_fact_identity_modify_form, type: constraint, statement: "MODIFY column GENERATED 可修改 IDENTITY 生成模式并接受 identity_options。", status: confirmed, source_anchor: "L471-L472 column_clause/IDENTITY"}
  - {id: at_fact_identity_modify_preserves_mode, type: behavior_oracle, statement: "MODIFY IDENTITY 未指定生成模式时保留原有生成模式。", status: confirmed, source_anchor: "L473 column_clause/IDENTITY"}
  - {id: at_fact_identity_options_override, type: behavior_oracle, statement: "identity_options 可覆盖 IDENTITY 隐式序列选项。", status: confirmed, source_anchor: "L474, L1000 column_clause/IDENTITY"}
  - {id: at_fact_identity_add_form, type: constraint, statement: "ALTER COLUMN ADD GENERATED 支持 ALWAYS、BY DEFAULT、BY DEFAULT ON NULL，并可指定 SEQUENCE NAME 或 identity_options。", status: confirmed, source_anchor: "L475-L477 column_clause/IDENTITY"}
  - {id: at_fact_identity_supported_types, type: constraint, statement: "ADD IDENTITY 的列必须为本章列出的 smallint、integer、bigint、decimal、numeric、float、double precision 或 real 数值类型。", status: confirmed, source_anchor: "L478-L480 column_clause/IDENTITY"}
  - {id: at_fact_identity_a_mode_types, type: environment, statement: "A 兼容模式下 ADD IDENTITY 的允许类型缩小为 decimal、numeric、float、double precision 和 real。", status: confirmed, source_anchor: "L479-L480 column_clause/IDENTITY"}
  - {id: at_fact_identity_requires_no_default, type: constraint, statement: "已有列增加 IDENTITY 前不得已设置 DEFAULT 属性。", status: confirmed, source_anchor: "L480-L481 column_clause/IDENTITY"}
  - {id: at_fact_identity_sequence_name, type: constraint, statement: "SEQUENCE NAME 可指定 ADD IDENTITY 创建的隐式序列名称。", status: confirmed, source_anchor: "L481 column_clause/IDENTITY"}
  - {id: at_fact_identity_default_not_null, type: constraint, statement: "已有列增加 IDENTITY 时默认增加 NOT NULL 约束。", status: confirmed, source_anchor: "L481-L482 column_clause/IDENTITY"}
  - {id: at_fact_identity_existing_null_failure, type: behavior_oracle, statement: "已有列包含 NULL 值时，增加 IDENTITY 失败。", status: confirmed, source_anchor: "L482 column_clause/IDENTITY"}
  - {id: at_fact_identity_implicit_sequence, type: lifecycle, statement: "IDENTITY 根据 identity_options 创建附加到列的隐式序列，并在插入时分配序列值。", status: confirmed, source_anchor: "L989-L992 参数说明/IDENTITY"}
  - {id: at_fact_identity_always_input, type: behavior_oracle, statement: "GENERATED ALWAYS 只接受序列生成的 IDENTITY 值，不接受用户指定值。", status: confirmed, source_anchor: "L993-L994 参数说明/IDENTITY"}
  - {id: at_fact_identity_by_default_input, type: behavior_oracle, statement: "GENERATED BY DEFAULT 优先使用用户值，用户未指定值时使用序列值。", status: confirmed, source_anchor: "L995-L996 参数说明/IDENTITY"}
  - {id: at_fact_identity_on_null_input, type: behavior_oracle, statement: "GENERATED BY DEFAULT ON NULL 在用户指定 NULL 或未指定值时使用序列值，否则使用用户值。", status: confirmed, source_anchor: "L997-L999 参数说明/IDENTITY"}
  - {id: at_fact_identity_increment, type: constraint, statement: "IDENTITY increment 的正负值分别产生递增或递减序列，默认值为 1。", status: confirmed, source_anchor: "L1001-L1002 参数说明/IDENTITY"}
  - {id: at_fact_identity_minvalue, type: constraint, statement: "IDENTITY MINVALUE 指定最小值；NO MINVALUE 的递增默认值为 1、递减默认值为 -10^27+1，NOMINVALUE 等价。", status: confirmed, source_anchor: "L1003-L1006 参数说明/IDENTITY"}
  - {id: at_fact_identity_maxvalue, type: constraint, statement: "IDENTITY MAXVALUE 指定最大值；NO MAXVALUE 的递增默认值为 10^28-1、递减默认值为 -1，NOMAXVALUE 等价。", status: confirmed, source_anchor: "L1007-L1010 参数说明/IDENTITY"}
  - {id: at_fact_identity_start, type: behavior_oracle, statement: "IDENTITY START 默认按方向取 minvalue 或 maxvalue；WITH LIMIT VALUE 从表中当前方向极值确定起点。", status: confirmed, source_anchor: "L1011-L1014 参数说明/IDENTITY"}
  - {id: at_fact_identity_cache, type: constraint, statement: "IDENTITY cache 指定内存预存序列号数量，默认值 1 表示不缓存多个值。", status: confirmed, source_anchor: "L1015-L1016 参数说明/IDENTITY"}
  - {id: at_fact_identity_nocache, type: constraint, statement: "IDENTITY NOCACHE 表示不预先存储序列值。", status: confirmed, source_anchor: "L1017 参数说明/IDENTITY"}
  - {id: at_fact_identity_cycle, type: behavior_oracle, statement: "IDENTITY CYCLE 到达边界后循环；NO CYCLE 到达边界后的 nextval 报错，NOCYCLE 等价且是默认值。", status: confirmed, source_anchor: "L1018-L1020 参数说明/IDENTITY"}
  - {id: at_fact_column_constraints, type: syntax, statement: "列约束包含 NULL、CHECK、DEFAULT、ON UPDATE、生成列、IDENTITY、AUTO_INCREMENT、注释、唯一、主键、加密和引用。", status: confirmed, source_anchor: "column_constraint"}
  - {id: at_fact_table_constraints, type: syntax, statement: "表约束包含 CHECK、UNIQUE、PRIMARY KEY、FOREIGN KEY、延迟属性与索引参数。", status: confirmed, source_anchor: "table_constraint"}
  - {id: at_fact_rename, type: syntax, statement: "支持重命名表、列和约束；表名连接符支持 TO、AS、等号。", status: confirmed, source_anchor: "重命名产生式"}
  - {id: at_fact_multi_action, type: syntax, statement: "除 RENAME 和 SET SCHEMA 外可在同一命令组合多个 action，并提供 ADD/MODIFY 多列形式。", status: confirmed, source_anchor: "多 action 与多列"}
  - {id: at_fact_gsiwaitall, type: constraint, statement: "当前版本不支持 GSIWAITALL。", status: confirmed, source_anchor: "GSIWAITALL"}
  - {id: at_fact_if_exists, type: lifecycle, statement: "IF EXISTS 在表不存在时发出 NOTICE 而不是 ERROR。", status: confirmed, source_anchor: "参数说明/IF EXISTS"}
  - {id: at_fact_target_forms, type: syntax, statement: "表目标语法支持 table_name、table_name *、ONLY table_name 和 ONLY (table_name)。", status: confirmed, source_anchor: "L117-L119, L670-L674 table_name"}
  - {id: at_fact_target_scope, type: behavior_oracle, statement: "默认和星号应修改当前表及后代，ONLY 应仅修改当前表；当前清单仅覆盖语法形态，未验证该继承行为。", status: confirmed, source_anchor: "L670-L674 table_name"}
  - {id: at_fact_index_constraint_compat, type: environment, statement: "约束名、索引名、USING method、排序和表达式约束受 A/B/M 兼容模式及 ASTORE/USTORE 影响。", status: confirmed, source_anchor: "参数说明/约束索引"}
  - {id: at_fact_storage_parameters, type: environment, statement: "TDE、parallel_workers、hasuids、统计粒度、ROWID、在线 DDL 和 VACUUM 参数各有值域与适用环境。", status: confirmed, source_anchor: "参数说明/storage_parameter"}
  - {id: at_fact_check_generated, type: constraint, statement: "CHECK 不支持子查询；生成列表达式必须不可变且不能引用其他生成列、系统列、聚合或窗口。", status: confirmed, source_anchor: "参数说明/CHECK 与生成列"}
  - {id: at_fact_on_update, type: environment, statement: "ON UPDATE 时间戳属性受兼容版本、数据类型、精度、生成列和分区键限制。", status: confirmed, source_anchor: "参数说明/ON UPDATE"}
  - {id: at_fact_foreign_key, type: behavior_oracle, statement: "外键支持 MATCH、ON DELETE/UPDATE 动作；MATCH PARTIAL 暂不支持且临时表与永久表不能交叉引用。", status: confirmed, source_anchor: "参数说明/FOREIGN KEY"}
  - {id: at_fact_foreign_key_action_scope, type: behavior_oracle, statement: "ON DELETE 和 ON UPDATE 分别声明被参考行删除或被参考字段更新时对引用字段执行的动作。", status: confirmed, source_anchor: "L1092-L1095 参数说明/FOREIGN KEY"}
  - {id: at_fact_foreign_key_no_action, type: behavior_oracle, statement: "NO ACTION 是默认外键动作；违反外键时产生错误，可延迟约束在检查时产生错误。", status: confirmed, source_anchor: "L1096-L1098 参数说明/FOREIGN KEY"}
  - {id: at_fact_foreign_key_restrict, type: behavior_oracle, statement: "RESTRICT 与 NO ACTION 都在违反外键时产生错误，但 RESTRICT 不可推迟。", status: confirmed, source_anchor: "L1099-L1100 参数说明/FOREIGN KEY"}
  - {id: at_fact_foreign_key_cascade, type: behavior_oracle, statement: "CASCADE 在删除被参考行时删除引用行，在更新被参考字段时同步更新引用字段。", status: confirmed, source_anchor: "L1101-L1102 参数说明/FOREIGN KEY"}
  - {id: at_fact_foreign_key_set_null, type: behavior_oracle, statement: "SET NULL 将外键引用字段设置为 NULL。", status: confirmed, source_anchor: "L1103 参数说明/FOREIGN KEY"}
  - {id: at_fact_foreign_key_set_default, type: behavior_oracle, statement: "SET DEFAULT 将外键引用字段设置为其缺省值。", status: confirmed, source_anchor: "L1104 参数说明/FOREIGN KEY"}
  - {id: at_fact_deferrable, type: behavior_oracle, statement: "UNIQUE、主键和外键可延迟，并由 INITIALLY IMMEDIATE/DEFERRED 决定检查时机。", status: confirmed, source_anchor: "参数说明/DEFERRABLE"}
  - {id: at_fact_comments, type: syntax, statement: "COMMENT 可用于表、列及主键/唯一索引。", status: confirmed, source_anchor: "参数说明/COMMENT"}
  - {id: at_fact_examples, type: example, statement: "示例覆盖重命名、模式、Owner、表空间、列、约束和在线变更。", status: confirmed, source_anchor: "示例"}
  - {id: at_open_online_environment_fixture, type: open_question, statement: "缺少能够为 ONLINE 清单提供事务上下文、存储过程上下文、非 M 兼容能力、升级状态、磁盘和长事务的可机器判定探针；清单现只声明门禁，不声称 ONLINE 已生效。", status: needs_verification, source_anchor: "L50-L59, L75-L107 在线 DDL"}
  - {id: at_open_online_using_expression, type: open_question, statement: "PDF 将 USING expression 列在通用 ALTER TYPE 语法中，但在线支持范围和在线示例没有单独确认带 USING 的类型转换是否保持在线，不能把该 profile 宣称为 online-effective。", status: needs_verification, source_anchor: "L75-L77, L422-L435, L1338-L1361"}
  - {id: at_open_b_compat_fixture, type: open_question, statement: "已有独占普通表同定义CHANGE、无DEFAULT可空ADD FIRST/AFTER的B有限候选；数据库模式与行为参数实测、类型/约束/依赖和位置行为仍未完成，父conditional保留。通用MODIFY/FIRST/AFTER/AUTO_INCREMENT域未闭合；不据此给独立 MODIFY (...) 多列形式推定仅 B 模式。", status: needs_verification, source_anchor: "B 兼容语法"}
  - {id: at_open_modify_multi_contract, type: open_question, statement: "MODIFY (...) 已提供一个无依赖新普通表的VARCHAR扩展与NOT NULL有限代表；其他原定义、类型/约束、依赖对象影响及统计信息变化仍缺独立契约和实测。L359-L363未声明该形式仅B模式，不能套用后续B扩展MODIFY条件；父值继续conditional。", status: needs_verification, source_anchor: "L359-L363 column_clause/MODIFY 多列"}
  - {id: at_open_a_compat_fixture, type: open_question, statement: "已有A模式普通空表hasrowid off到on有限候选；实际连接模式、ROWID系统列/隐式依赖身份、受限对象及压缩数据解压仍待验证，未完成通用能力矩阵。", status: needs_verification, source_anchor: "L208-L216; L787-L801 SET WITH ROWID"}
  - {id: at_open_tde_fixture, type: open_question, statement: "缺少 KMS、TDE GUC 和加密表 Fixture。", status: needs_verification, source_anchor: "TDE 参数与密钥轮转"}
  - {id: at_open_ilm_whitelist, type: open_question, statement: "ILM 行表达式函数白名单只由失效 CHM 链接给出。", status: needs_verification, source_anchor: "ILM"}
  - {id: at_open_ilm_policy_lifecycle, type: open_question, statement: "不带ON(EXPR)的ILM策略不需要表达式函数白名单，但仍缺受控目标表能力、实际策略身份、策略元数据和删除/恢复的生命周期契约；添加策略不证明压缩动作已触发。", status: needs_verification, source_anchor: "L300-L315 action/ILM"}
  - {id: at_open_colview_fixture, type: open_question, statement: "缺少 HTAP/IMCV 环境和 COLVIEW 元数据 Oracle。", status: needs_verification, source_anchor: "COLVIEW"}
  - {id: at_open_index_method_source, type: open_question, statement: "ADD CONSTRAINT 的 USING method 取值范围位于外链章节，本页未完整列出。", status: needs_verification, source_anchor: "参数说明/USING method"}
  - {id: at_open_encrypted_column_fixture, type: open_question, statement: "缺少密态内存、列密钥与加密列 Fixture。", status: needs_verification, source_anchor: "加密列"}
  - {id: at_open_external_table_fixture, type: open_question, statement: "已有log_fdw目录资产及ENABLE RLS有限目标负例；通用外表ALTER动作、列变化与运行时错误仍未证明，不能借此放行MODIFY/CHANGE等。", status: needs_verification, source_anchor: "外表限制"}
  - {id: at_open_subpartition_fixture, type: open_question, statement: "缺少二级分区与分区级 ILM Fixture。", status: needs_verification, source_anchor: "ILM 子分区"}
  - {id: at_open_m_compat_variant, type: open_question, statement: "本章只指向 M-Compatibility 的 ALTER TABLE 章节，未在当前 catalog 中展开其专用行为；必须作为独立 variant 抽取。", status: needs_verification, source_anchor: "参数说明/ASC DESC 与注意事项/M-Compatibility"}
  - {id: at_open_owner_fixture, type: open_question, statement: "缺少可安全创建角色、切换成员关系并在三权分立开关下复核 OWNER TO 的权限 Fixture。", status: needs_verification, source_anchor: "action/OWNER TO"}
  - {id: at_open_tablespace_fixture, type: open_question, statement: "缺少隔离且可回收的第二表空间 Fixture；普通/ONLINE 移动及分区表禁止 SET TABLESPACE 均不进入可执行清单，不能用 pg_default 移到 pg_default 冒充目标行为或目标错误。", status: needs_verification, source_anchor: "注意事项/分区表与 action/SET TABLESPACE"}
  - {id: at_open_inheritance_scope_fixture, type: open_question, statement: "当前缺少父表与子表的继承 Fixture，因此 table_name、table_name * 和 ONLY 仅能声明语法代表覆盖，不能声称后代表变更范围已验证。", status: needs_verification, source_anchor: "L670-L674 table_name"}
  - {id: at_open_internal_distribution_environment, type: open_question, statement: "GROUP/NODE/SLICE action 需要 support_extended_features 与内部扩缩容拓扑，当前无安全测试环境。", status: needs_verification, source_anchor: "action/内部扩缩容"}
  - {id: at_open_trigger_fixture, type: open_question, statement: "缺少同时提供用户触发器、约束触发器和复制角色会话切换的 Fixture。", status: needs_verification, source_anchor: "action/TRIGGER"}
  - {id: at_open_constraint_reference_fixture, type: open_question, statement: "外键动作与可延迟约束需要引用表、事务和唯一索引的复合 Fixture。", status: needs_verification, source_anchor: "table_constraint/FOREIGN KEY 与 DEFERRABLE"}
  - {id: at_open_generated_column_fixture, type: open_question, statement: "生成列的依赖、写入和表达式限制需要带生成列与依赖对象的专用 Fixture。", status: needs_verification, source_anchor: "column_constraint/生成列"}

