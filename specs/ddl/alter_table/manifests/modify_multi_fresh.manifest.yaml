schema_version: 1
kind: manifest
id: manifest_alter_table_modify_multi_fresh
name: ALTER TABLE 无依赖新表双列MODIFY
status: needs_review
description: >-
  原文L359-L361括号多列形式的一个有限代表，VARCHAR(64)扩为96及原可空amount设NOT NULL。
  仅使用两行兼容种子的新普通表；不把父conditional整体提升valid，不复用B模式扩展MODIFY条件。
  不承诺依赖重建、统计信息、在线DDL、类型转换或数据库行为完成。
factor_ref: alter_table
syntax_ref: syntax_alter_table_v1
suite_type: positive
strategy: full_cartesian
fixture_refs: []
identifier_policy: {}
environment_requirements:
  - key: table_authority
    allowed_values: [fixture_table_creator]
    fact_refs: [at_fact_permissions]
bindings:
  statement_form: [at_statement_modify_multi_fresh]
  ddl_mode: [at_mode_default]
  if_exists: [at_if_exists_none]
  target_form: [at_target_plain]
  table_profile: [at_table_modify_multi_fresh]
  action_profile: [at_action_default]
  modify_column_items: [at_modify_columns_two]
local_rules:
  - expression: "table_profile == 'at_table_modify_multi_fresh' and ddl_mode == 'at_mode_default' and if_exists == 'at_if_exists_none' and modify_column_items == 'at_modify_columns_two'"
    rationale: 本次准入仅限原列定义和种子已复核的新表；这是候选范围约束，不是产品对其他合法形状的禁止规则。
    fact_refs: [at_fact_modify_multi_syntax]
expected:
  default: success
  scope: syntax_only
  fact_refs: [at_fact_modify_multi_syntax, at_fact_permissions]
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
