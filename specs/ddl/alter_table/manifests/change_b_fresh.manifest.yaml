schema_version: 1
kind: manifest
id: manifest_alter_table_change_b_fresh
name: B CHANGE同定义改名有限代表
status: needs_review
description: 专属普通表中VARCHAR32可空无默认code改为code_new，类型及定义不变；不代表类型转换、依赖重建或泛化B语法完成。
factor_ref: alter_table
syntax_ref: syntax_alter_table_v1
suite_type: positive
strategy: full_cartesian
fixture_refs: []
identifier_policy: {}
environment_requirements:
  - {key: compatibility_mode, allowed_values: [B], fact_refs: [at_fact_change_b_mode]}
  - {key: table_authority, allowed_values: [fixture_table_creator], fact_refs: [at_fact_permissions]}
  - {key: table_creation_authority, allowed_values: [create_any_table], fact_refs: [create_table::ct_fact_create_permissions]}
  - {key: namespace, allowed_values: [isolated_user_schema], fact_refs: [create_table::ct_fact_create_permissions]}
bindings:
  statement_form: [at_statement_action]
  ddl_mode: [at_mode_default]
  if_exists: [at_if_exists_none]
  target_form: [at_target_plain]
  table_profile: [at_table_rename_fresh]
  action_profile: [at_action_change_b_fresh]
local_rules:
  - expression: "statement_form == 'at_statement_action' and action_profile == 'at_action_change_b_fresh' and table_profile == 'at_table_rename_fresh' and ddl_mode == 'at_mode_default' and if_exists == 'at_if_exists_none' and target_form == 'at_target_plain'"
    rationale: 只检验新表同定义改名，DEFAULT/NOT NULL/索引等形态尚未准入；不是数据库不支持它们。
    fact_refs: [at_fact_change_syntax, at_fact_change_name_unique]
expected: {default: success, scope: syntax_only, fact_refs: [at_fact_change_syntax]}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
