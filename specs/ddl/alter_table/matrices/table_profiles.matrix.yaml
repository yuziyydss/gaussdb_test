schema_version: 1
kind: matrix
id: matrix_alter_table_table_profiles
name: ALTER TABLE 目标表能力剖面
status: needs_review
description: 普通表、分区表、临时表以及需要专用环境的目标对象。
factor_ref: alter_table
profile_property_defaults:
  partitioned: false
  temporary: false
  external: false
  rls_supported: true
  online_supported: true
  compatibility: default
  source_tables: []
profiles:
- id: at_table_autoincrement_fresh
  render: g_b_at_autoinc
  validity: valid
  fixture_refs:
  - fixture_alter_table_autoincrement_fresh
  properties:
    source_tables:
    - g_b_at_autoinc
    source_columns:
    - id
    - note
    online_supported: false
    required_compatibility_modes:
    - B
    auto_increment_contract: fresh_initial_one
  fact_refs:
  - at_fact_auto_increment
  - create_table::ct_fact_auto_increment_types
- id: at_table_rowid_off_fresh
  render: g_a3_at_rowid
  validity: valid
  fixture_refs:
  - fixture_alter_table_rowid_off_fresh
  properties:
    source_tables:
    - g_a3_at_rowid
    source_columns:
    - id
    online_supported: false
    required_compatibility_modes:
    - A
    rowid_transition_contract: ordinary_empty_off_to_on
  fact_refs:
  - at_fact_rowid
- id: at_table_log_foreign_fresh
  render: g_a3_at_log_ns.foreign_table
  validity: unknown
  fixture_refs:
  - fixture_alter_table_log_foreign_rls
  properties:
    external: true
    rls_supported: false
    online_supported: false
    source_tables:
    - g_a3_at_log_ns.foreign_table
    foreign_table_contract: log_fdw_enable_rls_negative
  fact_refs:
  - at_fact_rls
  - create_foreign_table::create_foreign_table_fact_log_fdw_example
- id: at_table_modify_single_b_fresh
  render: g_at_modify_single
  validity: valid
  fixture_refs:
  - fixture_alter_table_modify_single_b_fresh
  properties:
    source_tables:
    - g_at_modify_single
    source_columns:
    - note
    online_supported: false
    required_compatibility_modes:
    - B
    column_modify_single_contract:
      kind: ordinary_b_single_widen
      widen_column: note
  fact_refs:
  - at_fact_modify_single_syntax
  - at_fact_modify_single_definition
  - at_fact_modify_single_b_mode
  - at_fact_modify_single_switch
- id: at_table_add_position_fresh
  render: t_at_add_position
  validity: valid
  fixture_refs:
  - fixture_alter_table_add_position_fresh
  properties:
    source_tables:
    - t_at_add_position
    source_columns:
    - code
    online_supported: false
    required_compatibility_modes:
    - B
    column_add_contract:
      kind: ordinary_nullable_integer
      added_column: extra
  fact_refs:
  - at_fact_add_column
  - at_fact_column_position
- id: at_table_rename_fresh
  render: t_at_rename_fresh
  validity: valid
  fixture_refs:
  - fixture_alter_table_rename_fresh
  properties:
    source_tables:
    - t_at_rename_fresh
    source_columns:
    - code
    online_supported: false
    required_compatibility_modes:
    - B
    - PG
    column_rename_contract:
      kind: ordinary_same_definition
      source_column: code
      target_column: code_new
  fact_refs:
  - at_fact_rename
  - at_fact_change_name_unique
- id: at_table_modify_multi_fresh
  render: t_at_modify_multi
  validity: valid
  fixture_refs:
  - fixture_alter_table_modify_multi_fresh
  properties:
    source_tables:
    - t_at_modify_multi
    source_columns:
    - note
    - amount
    online_supported: false
    column_modify_contract:
      kind: ordinary_widen_and_not_null
      widen_column: note
      not_null_column: amount
  fact_refs:
  - at_fact_modify_multi_syntax
- id: at_table_regular
  render: t_at_regular
  validity: valid
  fixture_refs:
  - fixture_alter_table_regular
  properties:
    source_tables:
    - t_at_regular
  fact_refs:
  - at_fact_main_grammar
- id: at_table_partitioned
  render: t_at_partitioned
  validity: valid
  fixture_refs:
  - fixture_alter_table_partitioned
  properties:
    partitioned: true
    source_tables:
    - t_at_partitioned
  fact_refs:
  - at_fact_partition_restrictions
- id: at_table_temporary
  render: t_at_temp
  validity: valid
  fixture_refs:
  - fixture_alter_table_temporary
  properties:
    temporary: true
    rls_supported: false
    online_supported: false
    source_tables:
    - t_at_temp
  fact_refs:
  - at_fact_rls
  - at_fact_online_environment
- id: at_table_b_compat
  render: t_at_regular
  validity: unknown
  fixture_refs:
  - fixture_alter_table_regular
  properties:
    compatibility: B
    source_tables:
    - t_at_regular
  fact_refs:
  - at_open_b_compat_fixture
- id: at_table_external
  render: t_at_external
  validity: unknown
  properties:
    external: true
    rls_supported: false
    online_supported: false
    source_tables:
    - t_at_external
  fact_refs:
  - at_open_external_table_fixture
- id: at_table_tde
  render: t_at_tde
  validity: unknown
  properties:
    source_tables:
    - t_at_tde
  fact_refs:
  - at_open_tde_fixture
documented_features:
- id: at_feature_regular_table
  profile_refs:
  - at_table_regular
  status: covered
  fact_refs:
  - at_fact_main_grammar
- id: at_feature_partition_table
  profile_refs:
  - at_table_partitioned
  status: covered
  fact_refs:
  - at_fact_partition_restrictions
- id: at_feature_temporary_table
  profile_refs:
  - at_table_temporary
  status: covered
  fact_refs:
  - at_fact_rls
fact_refs:
- at_fact_main_grammar
- at_fact_partition_restrictions
- at_fact_rls
