factor_ref: alter_table
requires_fixture_refs: [fixture_shared_log_fdw_catalog_server]
provides:
  tables:
  - name: g_a3_at_log_ns.foreign_table
    persistence: permanent
    table_kind: foreign
    columns: [{name: col1, type: TEXT, nullable: true}]
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
  - "CREATE SCHEMA g_a3_at_log_ns;"
  - "CREATE FOREIGN TABLE g_a3_at_log_ns.foreign_table (col1 TEXT) SERVER g_a3_log_server OPTIONS (logtype 'gs_log');"
  teardown_sqls:
