schema_version: 1
kind: fixture
id: fixture_alter_table_add_position_fresh
name: 普通新增可空列的独占新表
status: needs_review
description: 三个可空普通列、两行固定seed，无DEFAULT/约束/索引/规则/加密依赖；实际DDL由共享列合同核对。
factor_ref: alter_table
provides:
  tables:
    - name: t_at_add_position
      persistence: permanent
      table_kind: regular
      columns:
        - {name: id, type: INTEGER, nullable: true}
        - {name: code, type: VARCHAR(32), nullable: true}
        - {name: note, type: VARCHAR(64), nullable: true}
seed:
  required: true
  rows:
    - {id: 1, code: alpha, note: one}
    - {id: 2, code: beta, note: two}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - CREATE TABLE t_at_add_position (id INTEGER,code VARCHAR(32),note VARCHAR(64));
    - "INSERT INTO t_at_add_position VALUES (1,'alpha','one'),(2,'beta','two');"
  teardown_sqls:
    - DROP TABLE t_at_add_position;
  note: 仅离线候选。未来独立授权后使用独占用户Schema及预先不存在的名字，不接触业务表，无并发依赖；setup未全部成功不得清理未确权对象，不预DROP、不依赖DDL回滚。
