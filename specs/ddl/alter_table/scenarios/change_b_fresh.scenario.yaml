schema_version: 1
kind: scenario
id: scenario_alter_table_change_b_fresh
name: B CHANGE同定义改名后的列名与数据
status: planned
description: 只验证无依赖普通表同定义改名，类型转换/约束与位置变化不在本场景范围。
factor_ref: alter_table
fixture_refs: [fixture_alter_table_rename_fresh]
fact_refs: [at_fact_change_syntax, at_fact_change_name_unique, at_fact_change_b_mode, at_fact_permissions]
preconditions:
  - 已获独立执行授权；实际sql_compatibility=B，独占用户Schema和全新对象名，无并发依赖。
  - CREATE ANY TABLE并由本case建表者执行；code为VARCHAR32、可空无默认，code_new不存在。
steps:
  - {id: setup, action: execute_fixture_setup}
  - {id: target, action: execute_generated_case, manifest_ref: manifest_alter_table_change_b_fresh}
  - {id: rows, sql: "SELECT id,code_new,note FROM t_at_rename_fresh ORDER BY id;"}
  - {id: metadata, action: inspect_column_definitions, detail: "使用有依据的只读目录接口核对code消失、code_new为VARCHAR32可空无默认，列序id/code_new/note；不猜系统目录字段。"}
  - {id: cleanup, action: execute_fixture_teardown}
oracles:
  - {kind: result_set, step_id: rows, expected: [[1, alpha, one], [2, beta, two]]}
  - {kind: column_definition_transition, step_id: metadata, expected: "只改名称且列定义保持；实机尚未验证，不推断泛化CHANGE行为。"}
execution_requirements: [independent_authorization, isolated_fresh_target, actual_column_metadata_contract, actual_cleanup_evidence]
