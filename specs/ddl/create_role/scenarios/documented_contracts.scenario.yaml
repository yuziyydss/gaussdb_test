preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "角色是拥有对象和权限的实体，可表示用户或组。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "新角色默认NOLOGIN，只有LOGIN角色可以登录。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "创建者须有CREATE ROLE权限或为系统管理员。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "名称为合法标识符，最大63字符。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "超过63字符截断。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "未引用大写转小写，双引号保留。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "名称由字母、下划线、数字、美元组成，以字母或下划线开始。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "不能创建内部保留名称redisuser。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "登录密码为非空字符串。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "密码默认至少8字符。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "不能等于用户名或其倒序。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "至少满足大小写字母、数字、所列非字母数字符号四类中的三类。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "导入可用符合格式密文；不校验密文复杂度，使用者须保证对应明文复杂度，不推荐直接用。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "EXPIRED创建密码失效角色，改自身密码前不能执行简单或扩展查询。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "有效天数0..999，默认0永久；超过有效期禁止登录直至改密码。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "DISABLE删除自身密码、不能自改密码或密码认证，仅能外部认证。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "仅管理员启停密码；普通用户不能禁用初始用户密码，启用用ALTER USER指定密码。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "按安全要求必须加密保存密码，UNENCRYPTED禁止使用。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "已是SHA256密文字符串时，无论ENCRYPTED/UNENCRYPTED声明均按其格式保存以支持dump/restore。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "SYSADMIN最高权限，默认NOSYSADMIN。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "三权分立关闭时SYSADMIN可创建SYSADMIN/REPLICATION/CREATEROLE/AUDITADMIN/MONADMIN/POLADMIN/CREATEDB及普通用户。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "三权分立开启时SYSADMIN无权创建用户。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "监控管理员属性默认NOMONADMIN。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "运维管理员默认NOOPRADMIN。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "安全策略管理员默认NOPOLADMIN。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "审计管理员默认NOAUDITADMIN。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "CREATEDB决定可否建库，默认NOCREATEDB。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "USEFT为尚未启用的保留参数。"
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "CREATEROLE可建角色/用户及修改删除其他角色，默认NOCREATEROLE。"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "三权分立关时可创建CREATEROLE/AUDITADMIN/MONADMIN/POLADMIN/CREATEDB及普通用户。"
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "三权分立开时可创建CREATEROLE/MONADMIN/POLADMIN/CREATEDB及普通用户。"
  -
    id: "contract_31"
    action: "verify_documented_contract"
    note: "INHERIT决定继承所在组权限，文档不推荐。"
  -
    id: "contract_32"
    action: "verify_documented_contract"
    note: "LOGIN角色可登录并可视为用户，默认NOLOGIN。"
  -
    id: "contract_33"
    action: "verify_documented_contract"
    note: "REPLICATION仅复制专用，可流复制或设备份模式，默认NOREPLICATION。"
  -
    id: "contract_34"
    action: "verify_documented_contract"
    note: "永久用户只能由初始用户创建/修改/删除。"
  -
    id: "contract_35"
    action: "verify_documented_contract"
    note: "连接限额整数-1..2147483647，默认-1。"
  -
    id: "contract_36"
    action: "verify_documented_contract"
    note: "系统管理员不受连接限额限制。"
  -
    id: "contract_37"
    action: "verify_documented_contract"
    note: "主节点单独统计，整体限额为connlimit乘正常主节点数。"
  -
    id: "contract_38"
    action: "verify_documented_contract"
    note: "角色资源池名称来自PG_RESOURCE_POOL。"
  -
    id: "contract_39"
    action: "verify_documented_contract"
    note: "USER GROUP子用户当前不支持。"
  -
    id: "contract_40"
    action: "verify_documented_contract"
    note: "新角色获得列出的已有角色权限，不推荐。"
  -
    id: "contract_41"
    action: "verify_documented_contract"
    note: "ROLE列出的已有角色成为新角色成员，拥有新角色权限。"
  -
    id: "contract_42"
    action: "verify_documented_contract"
    note: "ADMIN类似ROLE且成员可把新角色权限授予他人。"
  -
    id: "contract_43"
    action: "verify_documented_contract"
    note: "SYSID被忽略。"
  -
    id: "contract_44"
    action: "verify_documented_contract"
    note: "DEFAULT TABLESPACE被忽略。"
  -
    id: "contract_45"
    action: "verify_documented_contract"
    note: "PROFILE被忽略。"
  -
    id: "contract_46"
    action: "verify_documented_contract"
    note: "PGUSER仅前向兼容保留，无实际意义。"
  -
    id: "check_create_role_fact_identifier_start"
    action: "verify_documented_contract"
    note: "名称首字符必须为字母或下划线。"
  -
    id: "check_create_role_fact_password_symbol_domain"
    action: "verify_documented_contract"
    note: "原文限定的符号与字符类别全文：–   至少包含大写字母（A~Z）、小写字母（a~z）、数字（0~9）和非字母数字 字符（限定为~、!、@、#、$、%、^、&、*、(、)、-、_、=、+、\\、|、[、 {、}、]、;、:、,、<、.、>、/或?）四类字符中的三类字符。"
