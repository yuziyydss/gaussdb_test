  -
    id: "drop_database_link_fact_example_lines_26"
    type: "example"
    statement: "示例片段（仅作来源证据）：-- 前置条件。 gaussdb=# CREATE USER local_user WITH SYSADMIN PASSWORD '********'; CREATE ROLE gaussdb=# SET ROLE local_user PASSWORD '********'; SET"
    status: "confirmed"
    source_anchor: "L26-L30"
  -
    id: "drop_database_link_fact_example_lines_32"
    type: "example"
    statement: "示例片段（仅作来源证据）：-- 创建私有DBLink，host也可以是IPv6地址。 gaussdb=# CREATE DATABASE LINK private_dblink CONNECT TO 'remote_user' IDENTIFIED BY '********' USING (host '***.***.***.***',port '*****',dbname 'remote_db'); CREATE DATABASE LINK"
    status: "confirmed"
    source_anchor: "L32-L35"
