schema_version: 1
kind: scenario
id: scenario_alter_sequence_quality_gaps
name: ALTER SEQUENCE 空修改与跨模式拒绝校准
status: planned
description: >-
  两项缺口不因存在槽位或普通 OWNED BY 成功样例就闭合。空修改的语法可选性已知，
  实际结果未定；跨模式拒绝条件已知，目标错误身份未定。本文件不能当作可执行清单。
factor_ref: alter_sequence
fixture_refs: []
fact_refs: [alter_sequence_fact_settings_syntax, alter_sequence_fact_noop_gap, alter_sequence_fact_owned_match, alter_sequence_fact_ownership_gap]
preconditions:
  - 专用连接、无外层事务、确认该版本支持涉及对象的事务回滚。
  - fp_q2_as_a 与 fp_q2_as_b 均须由本次创建；遇重名停止，不 DROP 旧对象。
steps:
  - id: setup
    action: provision_owned_transaction
    detail: "BEGIN；同一用户创建 fp_q2_as_a/fp_q2_as_b 两个 Schema，各建 t(id INT)，在 a 创建 seq_empty、seq_control、seq_cross。任一步失败须 ROLLBACK。"
  - {id: empty, action: calibrate_target_sql, sql: "ALTER SEQUENCE fp_q2_as_a.seq_empty;", detail: "保存响应和前后元数据；不得预填 success。独立事务/savepoint 防止预期不明的错误污染后续控制用例。"}
  - {id: control, action: execute_sql, sql: "ALTER SEQUENCE fp_q2_as_a.seq_control OWNED BY fp_q2_as_a.t.id;"}
  - {id: cross_schema, action: calibrate_target_error, sql: "ALTER SEQUENCE fp_q2_as_a.seq_cross OWNED BY fp_q2_as_b.t.id;"}
  - {id: cleanup, action: rollback_owned_transaction, sql: "ROLLBACK;"}
oracles:
  - {after_step: empty, kind: result_calibration, expected: "以实机响应和前后定义决定空修改预期；确认之前保持 open_question。"}
  - {after_step: control, kind: positive_control, expected: "同用户同模式关联必须成功，失败则停止本轮负向判定。"}
  - {after_step: cross_schema, kind: target_error_identity, expected: "拒绝来自模式不一致；列缺失、权限错误、事务中止不是目标错误。校准 SQLSTATE/窄消息后再建立负向 manifest。"}
  - {after_step: cleanup, kind: no_residue, expected: "核对本次新建两个 Schema/对象无残留；保留原有对象不变。"}
execution_requirements: [database, dedicated_connection, concrete_fixture_implementation, calibrated_error_oracle]
