facts:
- id: alter_sequence_fact_purpose
  type: lifecycle
  statement: 修改既有序列参数。
  status: confirmed
  source_anchor: L5-L5
- id: alter_sequence_fact_permission
  type: environment
  statement: 所有者、有 ALTER 或 ALTER ANY SEQUENCE 权限的用户可修改；三权分立关闭时管理员默认可修改。
  status: confirmed
  source_anchor: L9-L12
- id: alter_sequence_fact_owner_permission
  type: environment
  statement: 改属主要求所有者/管理员且为新角色成员。
  status: confirmed
  source_anchor: L9-L12
- id: alter_sequence_fact_supported
  type: constraint
  statement: 本版仅支持拥有者、归属列、最大值及 cache 的修改。
  status: confirmed
  source_anchor: L13-L14
- id: alter_sequence_fact_recreate
  type: lifecycle
  statement: 其他属性需删除重建并用 setval 恢复当前值。
  status: confirmed
  source_anchor: L13-L14
- id: alter_sequence_fact_max_context
  type: environment
  statement: ALTER SEQUENCE MAXVALUE 不支持事务块、函数或存储过程上下文。
  status: confirmed
  source_anchor: L15-L15
- id: alter_sequence_fact_cache_clear
  type: lifecycle
  statement: 修改最大值清空所有会话中的该序列缓存。
  status: confirmed
  source_anchor: L16-L16
- id: alter_sequence_fact_large
  type: constraint
  statement: 创建时为 LARGE 的序列在 ALTER 时必须指定 LARGE。
  status: confirmed
  source_anchor: L17-L18
- id: alter_sequence_fact_blocking
  type: lifecycle
  statement: ALTER 会阻塞 nextval/setval/currval/lastval 调用。
  status: confirmed
  source_anchor: L19-L19
- id: alter_sequence_fact_settings_syntax
  type: syntax
  statement: 最大值/取消最大值/CACHE 互为选择，后可附 OWNED BY；两个部分均可省略。
  status: confirmed
  source_anchor: L23-L26
- id: alter_sequence_fact_noop_gap
  type: environment
  statement: 当前生成清单只覆盖至少一项修改；两个可选段都省略的空 ALTER 意义及执行结果待确认。
  status: confirmed
  source_anchor: L23-L26
- id: alter_sequence_fact_owner_syntax
  type: syntax
  statement: OWNER TO 与数值/归属列产生式分开。
  status: confirmed
  source_anchor: L28-L29
- id: alter_sequence_fact_name
  type: syntax
  statement: name 标识要修改的序列。
  status: confirmed
  source_anchor: L38-L39
- id: alter_sequence_fact_notice
  type: behavior_oracle
  statement: 缺失序列带 IF EXISTS 返回 NOTICE 而非 ERROR。
  status: confirmed
  source_anchor: L40-L41
- id: alter_sequence_fact_max_gt_last
  type: constraint
  statement: 新 MAXVALUE 必须严格大于 last_value。
  status: confirmed
  source_anchor: L42-L44
- id: alter_sequence_fact_max_unchanged
  type: behavior_oracle
  statement: 未指定最大值时维持旧的最大值。
  status: confirmed
  source_anchor: L42-L44
- id: alter_sequence_fact_max_upper
  type: constraint
  statement: 普通序列最大值上界 2^63-1，LARGE 上界 2^127-1；下界均为已申请最大 last_value 的开区间。
  status: confirmed
  source_anchor: L45-L47
- id: alter_sequence_fact_cache_meaning
  type: behavior_oracle
  statement: CACHE 为预先缓存的序列号数量。
  status: confirmed
  source_anchor: L48-L50
- id: alter_sequence_fact_cache_unchanged
  type: behavior_oracle
  statement: 未指定 CACHE 保留旧缓存值。
  status: confirmed
  source_anchor: L48-L50
- id: alter_sequence_fact_cache_range
  type: constraint
  statement: CACHE 下界为 1；普通上界 2^63-1，LARGE 上界 2^127-1。
  status: confirmed
  source_anchor: L51-L52
- id: alter_sequence_fact_owned_delete
  type: lifecycle
  statement: 关联字段或其表被删除时，会自动删除 OWNED BY 关联的序列。
  status: confirmed
  source_anchor: L53-L55
- id: alter_sequence_fact_owned_replace
  type: lifecycle
  statement: 新的 OWNED BY 关系覆盖旧关系。
  status: confirmed
  source_anchor: L56-L57
- id: alter_sequence_fact_owned_match
  type: constraint
  statement: 关联表与序列必须同一所有者且在同一模式。
  status: confirmed
  source_anchor: L58-L58
- id: alter_sequence_fact_ownership_gap
  type: environment
  statement: 本轮只构造同一用户/模式的有效关联；不同所有者、跨模式拒绝及权限组合等待隔离场景实现。
  status: confirmed
  source_anchor: L58-L58
- id: alter_sequence_fact_owned_none
  type: lifecycle
  statement: OWNED BY NONE 删除既有关联。
  status: confirmed
  source_anchor: L59-L59
- id: alter_sequence_fact_new_owner
  type: environment
  statement: 新所有者必须存在；执行者为其直接/间接成员且新角色在序列模式有 CREATE 权限。
  status: confirmed
  source_anchor: L60-L62
- id: alter_sequence_fact_example_start
  type: example
  statement: 示例创建 START 101 序列。
  status: confirmed
  source_anchor: L65-L66
- id: alter_sequence_fact_example_default
  type: example
  statement: 示例表用 nextval 作为默认值。
