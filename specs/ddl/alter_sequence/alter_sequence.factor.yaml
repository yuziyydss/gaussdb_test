- id: alter_sequence_fact_example_create
  type: example
  statement: 示例创建 seq_test。
  status: confirmed
  source_anchor: L78-L79
- id: alter_sequence_fact_example_metadata
  type: example
  statement: 客户端显示原序列所有者。
  status: confirmed
