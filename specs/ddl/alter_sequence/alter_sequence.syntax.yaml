schema_version: 1
kind: "syntax"
id: "syntax_alter_sequence"
name: "ALTER SEQUENCE 语法"
factor_ref: "alter_sequence"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "alter_sequence.form"
  large_modifier:
    type: "token"
    optional: true
    dimension_ref: "alter_sequence.large_modifier"
  if_exists:
    type: "token"
    optional: true
    dimension_ref: "alter_sequence.if_exists"
  sequence_name:
    type: "token"
    optional: true
    dimension_ref: "alter_sequence.sequence_name"
  setting:
    type: "token"
    optional: true
    dimension_ref: "alter_sequence.setting"
  owned_by:
    type: "token"
    optional: true
    dimension_ref: "alter_sequence.owned_by"
  new_owner:
    type: "token"
    optional: true
    dimension_ref: "alter_sequence.new_owner"
source_fact_refs:
  - "alter_sequence_fact_settings_syntax"
  - "alter_sequence_fact_owner_syntax"
  - "alter_sequence_fact_name"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "ALTER "
    -
      kind: "slot"
      slot: "large_modifier"
    -
      kind: "literal"
      text: " SEQUENCE "
    -
      kind: "slot"
      slot: "if_exists"
    -
      kind: "literal"
      text: " "
    -
      kind: "slot"
      slot: "sequence_name"
    -
      kind: "literal"
      text: " "
    -
      kind: "choice"
      selector: "form"
      branches:
        alter_sequence_form_settings:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "setting"
            -
              kind: "literal"
              text: " "
            -
              kind: "slot"
              slot: "owned_by"
        alter_sequence_form_owner:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "OWNER TO "
            -
              kind: "slot"
              slot: "new_owner"
