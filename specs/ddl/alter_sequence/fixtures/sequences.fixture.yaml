schema_version: 1
kind: "fixture"
id: "fixture_alter_sequence_sequences"
name: "ALTER SEQUENCE sequences"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "alter_sequence"
requires_fixture_refs:
  - "fixture_create_sequence_owner_table"
provides: {}
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "CREATE SEQUENCE seq_as_regular START 101 CACHE 1;"
    - "CREATE LARGE SEQUENCE seq_as_large START 101 CACHE 1;"
    - "SELECT nextval('seq_as_regular');"
    - "SELECT nextval('seq_as_large');"
    - "DROP SEQUENCE IF EXISTS seq_as_missing;"
  teardown_sqls:
    - "DROP LARGE SEQUENCE IF EXISTS seq_as_large;"
    - "DROP SEQUENCE IF EXISTS seq_as_regular;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
