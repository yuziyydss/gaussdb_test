schema_version: 1
kind: "manifest"
id: "manifest_alter_sequence_owner"
name: "ALTER SEQUENCE owner"
status: "needs_review"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "alter_sequence"
syntax_ref: "syntax_alter_sequence"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_alter_sequence_sequences"
identifier_policy: {}
bindings:
  form:
    - "alter_sequence_form_owner"
  sequence_name:
    - "alter_sequence_sequence_name_regular"
    - "alter_sequence_sequence_name_large"
  large_modifier:
    - "alter_sequence_large_modifier_absent"
    - "alter_sequence_large_modifier_present"
  if_exists:
    - "alter_sequence_if_exists_absent"
    - "alter_sequence_if_exists_present"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
local_rules:
  -
    expression: "sequence_name.properties.large == True or large_modifier == 'alter_sequence_large_modifier_absent'"
    rationale: "当前只选与创建匹配的标记；普通序列带 LARGE 的额外写法不作推断。"
    fact_refs:
      - "alter_sequence_fact_owner_syntax"
environment_requirements:
  -
    key: "prepared_owner_role"
    allowed_values:
      - "fp_as_owner"
    fact_refs:
      - "alter_sequence_fact_new_owner"
  -
    key: "owner_membership_and_schema_create"
    allowed_values:
      - "true"
    fact_refs:
      - "alter_sequence_fact_new_owner"
