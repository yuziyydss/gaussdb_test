schema_version: 1
kind: "manifest"
id: "manifest_alter_sequence_large"
name: "ALTER SEQUENCE large"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "alter_sequence"
syntax_ref: "syntax_alter_sequence"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_alter_sequence_sequences"
identifier_policy: {}
bindings:
  large_modifier:
    - "alter_sequence_large_modifier_present"
  sequence_name:
    - "alter_sequence_sequence_name_large"
  if_exists:
    - "alter_sequence_if_exists_absent"
    - "alter_sequence_if_exists_present"
  setting:
    - "alter_sequence_setting_absent"
    - "alter_sequence_setting_max_next"
    - "alter_sequence_setting_max_regular"
    - "alter_sequence_setting_max_large"
    - "alter_sequence_setting_no_max"
    - "alter_sequence_setting_nomax"
    - "alter_sequence_setting_cache_one"
    - "alter_sequence_setting_cache_two"
    - "alter_sequence_setting_cache_regular"
    - "alter_sequence_setting_cache_large"
  owned_by:
    - "alter_sequence_owned_by_absent"
    - "alter_sequence_owned_by_column"
    - "alter_sequence_owned_by_none"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
local_rules:
  -
    expression: "setting != 'alter_sequence_setting_absent' or owned_by != 'alter_sequence_owned_by_absent'"
    rationale: "该清单只测实际修改，空 ALTER 单列 open question，不改变产品语法。"
    fact_refs:
      - "alter_sequence_fact_settings_syntax"
environment_requirements:
  -
    key: "execution_context"
    allowed_values:
      - "top_level_autocommit"
    fact_refs:
      - "alter_sequence_fact_max_context"
