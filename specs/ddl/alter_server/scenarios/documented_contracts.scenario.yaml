schema_version: 1
kind: "scenario"
id: "scenario_alter_server_documented_contracts"
name: "ALTER SERVER documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "alter_server"
fixture_refs: []
fact_refs:
  - "alter_server_fact_purpose"
  - "alter_server_fact_privilege"
  - "alter_server_fact_sensitive"
  - "alter_server_fact_options"
  - "alter_server_fact_startup"
  - "alter_server_fact_tuple"
  - "alter_server_fact_catalog"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "可增加、修改、删除服务器参数，并从pg_foreign_server查询已有服务器。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "属主或ALTER授权用户可ALTER，管理员默认有权限；改属主还要求当前为属主/管理员且为新属主成员。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "password/secret_access_key多层引号可能不被识别脱敏。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "选项名唯一，动作默认ADD，名称和值由封装器库验证。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "fdw_startup_cost默认100且大于0。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "fdw_tuple_cost默认0.01且大于0。"
  -
    id: "catalog"
    action: "verify_documented_contract"
    note: "可从pg_foreign_server查询已有服务器。"
oracles:
  -
    kind: "documented_behavior"
    expected: "可增加、修改、删除服务器参数，并从pg_foreign_server查询已有服务器。"
  -
    kind: "documented_behavior"
    expected: "password/secret_access_key多层引号可能不被识别脱敏。"
  -
    kind: "documented_behavior"
    expected: "可从pg_foreign_server查询已有服务器。"
execution_requirements:
  - "database"
  - "same_session"
