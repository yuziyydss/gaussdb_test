schema_version: 1
kind: "syntax"
id: "syntax_alter_server"
name: "ALTER SERVER 语法"
factor_ref: "alter_server"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "alter_server.form"
  version:
    type: "token"
    optional: true
    dimension_ref: "alter_server.version"
source_fact_refs:
  - "alter_server_fact_syntax_options"
  - "alter_server_fact_syntax_rename"
  - "alter_server_fact_default_add"
  - "alter_server_fact_name"
  - "alter_server_fact_version"
  - "alter_server_fact_libpq"
  - "alter_server_fact_owner"
  - "alter_server_fact_rename"
  - "alter_server_fact_syntax_owner"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "ALTER SERVER srv_b7 "
    -
      kind: "choice"
      selector: "form"
      branches:
        alter_server_form_version:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "VERSION "
            -
              kind: "slot"
              slot: "version"
        alter_server_form_rename:
          kind: "literal"
          text: "RENAME TO srv_b7_renamed"
