facts:
- id: m_alter_audit_policy_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.1 L2-2
- id: m_alter_audit_policy_fact_authority
  type: environment
  statement: 仅 POLADMIN、SYSADMIN 或初始用户；本批限定 SYSADMIN 和专用测试资源。
  status: confirmed
  source_anchor: 2.4.2.6.1 L8-9
- id: m_alter_audit_policy_fact_security_on
  type: environment
  statement: 本批要求已由环境管理者确认 enable_security_policy=on，不在 fixture 中切换配置。
  status: confirmed
  source_anchor: 2.4.2.6.1 L10-10
- id: m_alter_audit_policy_fact_syntax
  type: syntax
  statement: ADD/REMOVE 的 PRIVILEGES/ACCESS 子句使用括号，与 CREATE 不同。
  status: confirmed
  source_anchor: 2.4.2.6.1 L14-15
- id: m_alter_audit_policy_fact_modify
  type: syntax
  statement: MODIFY 以括号包围 FILTER ON 子句。
  status: confirmed
  source_anchor: 2.4.2.6.1 L41-41
- id: m_alter_audit_policy_fact_drop_filter
  type: syntax
  statement: DROP FILTER 删除已有过滤条件。
  status: confirmed
  source_anchor: 2.4.2.6.1 L50-50
- id: m_alter_audit_policy_fact_comments
  type: syntax
  statement: COMMENTS 后接策略描述文本。
  status: confirmed
  source_anchor: 2.4.2.6.1 L56-56
- id: m_alter_audit_policy_fact_enabled
  type: syntax
  statement: ENABLE/DISABLE 切换策略状态。
  status: confirmed
  source_anchor: 2.4.2.6.1 L62-62
- id: m_alter_audit_policy_fact_membership
  type: lifecycle
  statement: 示例先创建 CREATE 审计，再 ADD DROP，最后 REMOVE DROP；移除前操作必须已存在。
  status: confirmed
  source_anchor: 2.4.2.6.1 L100-105
- id: m_alter_audit_policy_fact_filter_ambiguity
  type: open_question
  statement: ROLES 示例比 FILTER ON 主语法多一层括号；当前生成主语法的 IP/APP，不采用该示例括号。
  status: needs_verification
  source_anchor: 2.4.2.6.1 L115-115
- id: m_alter_audit_policy_fact_purpose
  type: example
  statement: 修改统一审计策略，包括添加/删除审计对象和操作类型。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_alter_audit_policy_fact_constraint
  type: example
  statement: 审计策略的维护存在权限限制，仅POLADMIN，SYSADMIN或初始用户可以执行 仅在打开enable_security_policy开关后，统一审计策略才可生效。
  status: confirmed
  source_anchor: M-Compatibility L7-7
- id: m_alter_audit_policy_fact_params
  type: example
  statement: ●   policy_name 指定审计策略的名称，必须确保其唯一性，不可重复。 取值范围：字符串，要符合标识符说明。
  status: confirmed
  source_anchor: M-Compatibility L67-78
- id: m_alter_audit_policy_fact_example
  type: example
  statement: m_alter_audit_policy的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L95-98
