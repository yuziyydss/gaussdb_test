  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "各个字段详细信息请参见语法格式。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "●   IF NOT EXISTS 判断是否存在相同名称的relation。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "如果指定IF NOT EXISTS关键字，创建表前会在当前Schema中查找是否已有名字 相同的relation，若存在同名的relation，则不会新建并返回NOTICE提示。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
