facts:
- id: m_drop_user_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.9.18 L2-2
- id: m_drop_user_fact_syntax
  type: syntax
  statement: "DROP USER 支持 IF EXISTS、多个名称和 CASCADE/RESTRICT；本批只选缺省/RESTRICT。"
  status: confirmed
  source_anchor: 2.4.2.9.18 L27-27
- id: m_drop_user_fact_schema
  type: lifecycle
  statement: 删除用户同时删除同名 Schema；本批先定向清空 Schema，自动删除行为留给独立场景。
  status: confirmed
  source_anchor: 2.4.2.9.18 L5-5
- id: m_drop_user_fact_restrict
  type: constraint
  statement: RESTRICT 为缺省，有依赖对象或被授予权限时拒绝删除。
  status: confirmed
  source_anchor: 2.4.2.9.18 L38-39
- id: m_drop_user_fact_dependency_free
  type: environment
  statement: 删除前应先删除所有自有对象和收回被授予权限；本批使用无显式授权、空 Schema 的测试用户。
  status: confirmed
  source_anchor: 2.4.2.9.18 L23-24
- id: m_drop_user_fact_cross_database
  type: environment
  statement: DROP USER 不支持跨数据库级联；跨库同名 Schema 需先删除。
  status: confirmed
  source_anchor: 2.4.2.9.18 L19-22
- id: m_drop_user_fact_kill_query
  type: behavior_oracle
  statement: enable_kill_query 控制 CASCADE 碰到锁定对象时杀线程或等待；本批不生成 CASCADE。
  status: confirmed
  source_anchor: 2.4.2.9.18 L13-16
- id: m_drop_user_fact_missing
  type: behavior_oracle
  statement: IF EXISTS 对不存在用户发 NOTICE 而不抛错误。
  status: confirmed
  source_anchor: 2.4.2.9.18 L32-32
- id: m_drop_user_fact_purpose
  type: example
  statement: 删除用户。删除用户时需要确保该用户不拥有任何数据库对象。
  status: confirmed
  source_anchor: M-Compatibility L4-4
- id: m_drop_user_fact_constraint
  type: example
  statement: 不能删除当前正在连接的用户。系统内置用户不能删除。
  status: confirmed
  source_anchor: M-Compatibility L7-12
- id: m_drop_user_fact_params
  type: example
  statement: IF EXISTS表示如果用户不存在不报错。user_name是要删除的用户名。
  status: confirmed
  source_anchor: M-Compatibility L30-31
- id: m_drop_user_fact_example
  type: example
  statement: m_drop_user的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L41-42
