facts:
- id: m_alter_database_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.2 L2-2
- id: m_alter_database_fact_syntax
  type: syntax
  statement: M ALTER DATABASE/SCHEMA 修改命名空间字符集、字符序；不是物理数据库参数。
  status: confirmed
  source_anchor: 2.4.2.6.2 L27-34
- id: m_alter_database_fact_namespace
  type: environment
  statement: DATABASE 与 SCHEMA 在 M 中为同义词。
  status: confirmed
  source_anchor: 2.4.2.6.2 L5-6
- id: m_alter_database_fact_authority
  type: environment
  statement: 修改属性需要命名空间所有者或 ALTER 权限；本批限定 case 所有者并有当前库 CREATE 权限。
  status: confirmed
  source_anchor: 2.4.2.6.2 L9-12
- id: m_alter_database_fact_owner
  type: environment
  statement: 转移所有者另需当前用户为新所有者角色成员。
  status: confirmed
  source_anchor: 2.4.2.6.2 L11-12
- id: m_alter_database_fact_description_conflict
  type: open_question
  statement: 本章 COLLATE/CHARSET 的字符集/字符分类描述混用；以本 PDF 2.3、2.3.2 关联表解释，保留本章术语差异。
  status: needs_verification
  source_anchor: 2.4.2.6.2 L46-48
- id: m_alter_database_fact_charset_domain
  type: syntax
  statement: 补充来源 2.3 表2-2/2-3：utf8 与 utf8mb4 同一字符集；utf8_bin/utf8mb4_bin 对应该字符集，gbk_chinese_ci 对应 gbk。
  status: confirmed
  source_anchor: 2.4.2.6.2 L50-50
- id: m_alter_database_fact_charset_pair
  type: constraint
  statement: 补充来源 2.3.2：同时指定 charset 和 collation 必须对应，否则报错。
  status: confirmed
  source_anchor: 2.4.2.6.2 L50-50
- id: m_alter_database_fact_encoding
  type: environment
  statement: 补充来源 2.3.2：SQL_ASCII 物理库不支持多字符集混用；本批限定 UTF8 物理库。
  status: confirmed
  source_anchor: 2.4.2.6.2 L50-50
- id: m_alter_database_fact_purpose
  type: example
  statement: M-Compatibility中DATABASE和SCHEMA是同义词。该语法表示允许修改数据库或模 式的字符集、字符序、和所有者。
  status: confirmed
  source_anchor: M-Compatibility L4-4
- id: m_alter_database_fact_constraint
  type: example
  statement: 只有模式的所有者或者被授予了模式ALTER权限的用户可以执行ALTER DATABASE 对于除public以外的系统模式，如pg_catalog、sys等，只允许初始用户修改模式
  status: confirmed
  source_anchor: M-Compatibility L8-8
- id: m_alter_database_fact_params
  type: example
  statement: ●   database_name 需要修改属性的数据库（模式）名称。 取值范围：字符串，要符合标识符说明。
  status: confirmed
  source_anchor: M-Compatibility L37-45
- id: m_alter_database_fact_example
  type: example
  statement: m_alter_database的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L58-65
rules:
- id: m_alter_database_rule_charset_pair
  kind: requires
  expression: form != 'm_alter_database_form_combined' or ((charset in ['m_alter_database_charset_utf8', 'm_alter_database_charset_utf8mb4']
    and collation in ['m_alter_database_collation_utf8', 'm_alter_database_collation_utf8mb4']) or (charset == 'm_alter_database_charset_gbk'
    and collation == 'm_alter_database_collation_gbk'))
  fact_refs:
  - m_alter_database_fact_charset_pair
  severity: error
