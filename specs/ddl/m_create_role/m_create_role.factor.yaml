facts:
- id: m_create_role_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.13 L2-2
- id: m_create_role_fact_syntax
  type: syntax
  statement: CREATE ROLE role_name [[WITH] option [...]] {PASSWORD|IDENTIFIED BY} {'password' [EXPIRED] | DISABLE};
  status: confirmed
  source_anchor: 2.4.2.8.13 L15-16
- id: m_create_role_fact_disable_authority
  type: environment
  statement: 只有管理员能禁用密码；本批仅构造无登录、禁用密码的专用角色。
  status: confirmed
  source_anchor: 2.4.2.8.13 L79-80
- id: m_create_role_fact_creation_authority
  type: environment
  statement: 三权分立关闭时 SYSADMIN 可创建普通角色；开启时 SYSADMIN 无权创建用户。
  status: confirmed
  source_anchor: 2.4.2.8.13 L86-89
- id: m_create_role_fact_connection_range
  type: constraint
  statement: CONNECTION LIMIT 范围为 -1 至 2^31-1，-1 为无限制。
  status: confirmed
  source_anchor: 2.4.2.8.13 L141-141
- id: m_create_role_fact_membership
  type: syntax
  statement: IN ROLE 关联一个或多个已存在角色；IN GROUP 是旧拼法。
  status: confirmed
  source_anchor: 2.4.2.8.13 L151-154
- id: m_create_role_fact_no_login
  type: behavior_oracle
  statement: 新角色缺省 NOLOGIN；只有 LOGIN 属性才可登录。
  status: confirmed
  source_anchor: 2.4.2.8.13 L121-123
- id: m_create_role_fact_name_limit
  type: syntax
  statement: 未引用角色名折为小写，最多63字符；本批固定安全短标识符。
  status: confirmed
  source_anchor: 2.4.2.8.13 L56-58
- id: m_create_role_fact_reserved
  type: behavior_oracle
  statement: DEFAULT TABLESPACE 与 PROFILE 被忽略，不据此宣称有配置效果。
  status: confirmed
  source_anchor: 2.4.2.8.13 L165-168
- id: m_create_role_fact_purpose
  type: example
  statement: 创建角色。角色是拥有数据库对象和权限的实体，可以是用户、组或兼顾两者。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_create_role_fact_constraint
  type: example
  statement: 新角色无登录权限。角色名超63字符时截断保留前63个。角色名支持反引号/双引号（ANSI_QUOTES时）括起，不用引号括起时转小写。
  status: confirmed
  source_anchor: M-Compatibility L10-12
- id: m_create_role_fact_permission
  type: environment
  statement: 创建角色的用户必须具备CREATE ROLE权限或者是系统管理员。
  status: confirmed
  source_anchor: M-Compatibility L7-8
- id: m_create_role_fact_params
  type: example
  statement: role_name最多63字符。option与CREATE USER相同的权限和属性选项。
  status: confirmed
  source_anchor: M-Compatibility L47-50
- id: m_create_role_fact_example
  type: example
  statement: m_create_role的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L171-173
