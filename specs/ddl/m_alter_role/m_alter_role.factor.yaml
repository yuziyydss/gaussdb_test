facts:
- id: m_alter_role_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.8 L2-2
- id: m_alter_role_fact_syntax
  type: syntax
  statement: ALTER ROLE role_name [[WITH] option [...]] {PASSWORD|IDENTIFIED BY} {'password' [EXPIRED] | DISABLE};
  status: confirmed
  source_anchor: 2.4.2.6.8 L14-14
- id: m_alter_role_fact_rename
  type: syntax
  statement: 支持 RENAME TO 新角色名。
  status: confirmed
  source_anchor: 2.4.2.6.8 L42-42
- id: m_alter_role_fact_settings
  type: syntax
  statement: SET 参数允许 TO/= DEFAULT 或 FROM CURRENT；RESET 只列 ALL。
  status: confirmed
  source_anchor: 2.4.2.6.8 L56-61
- id: m_alter_role_fact_account
  type: syntax
  statement: ACCOUNT LOCK/UNLOCK 是账户状态选项。
  status: confirmed
  source_anchor: 2.4.2.6.8 L38-38
- id: m_alter_role_fact_next_session
  type: lifecycle
  statement: ALTER ROLE 配置只在该角色下一次新会话生效。
  status: confirmed
  source_anchor: 2.4.2.6.8 L72-73
- id: m_alter_role_fact_locked
  type: behavior_oracle
  statement: ACCOUNT LOCK 禁止登录，UNLOCK 解除账户锁定；不等于赋予 LOGIN 属性。
  status: confirmed
  source_anchor: 2.4.2.6.8 L84-85
- id: m_alter_role_fact_pguser
  type: constraint
  statement: 当前版本不允许修改 PGUSER 属性。
  status: confirmed
  source_anchor: 2.4.2.6.8 L87-87
- id: m_alter_role_fact_pdb
  type: environment
  statement: PDB 内不支持修改初始用户密码；本批不碰初始用户或明文密码。
  status: confirmed
  source_anchor: 2.4.2.6.8 L9-9
- id: m_alter_role_fact_database_scope
  type: open_question
  statement: IN DATABASE 在 M 角色设置中的物理库/Schema 绑定需独立核验，本批省略。
  status: needs_verification
  source_anchor: 2.4.2.6.8 L69-69
- id: m_alter_role_fact_purpose
  type: example
  statement: 修改角色属性，包括密码、权限、连接限制等。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_alter_role_fact_constraint
  type: example
  statement: 修改角色属性需要相应权限。
  status: confirmed
  source_anchor: M-Compatibility L8-8
- id: m_alter_role_fact_permission
  type: environment
  statement: 需要系统管理员或具有ALTER ROLE权限。
  status: confirmed
  source_anchor: M-Compatibility L19-30
- id: m_alter_role_fact_params
  type: example
  statement: 与CREATE ROLE的option相同。
  status: confirmed
  source_anchor: M-Compatibility L54-55
- id: m_alter_role_fact_example
  type: example
  statement: m_alter_role的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L104-105
