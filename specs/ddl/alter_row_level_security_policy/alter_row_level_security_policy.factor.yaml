    id: "alter_row_level_security_policy_fact_example_lines_45"
    type: "example"
    statement: "示例片段（仅作来源证据）：gaussdb=# \\d+ all_data Table \"public.all_data\" Column |          Type         | Modifiers | Storage | Stats target | Description --------+------------------------+-----------+----------+--------------+------------- id   | integer           |       | plain |            | role | character varying(100) |         | extended |    | data | character varying(100) |          | extended |     |"
    status: "confirmed"
    source_anchor: "L45-L52"
