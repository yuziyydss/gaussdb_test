    type: "example"
    statement: "示例片段（仅作来源证据）：Row Level Security Policies: POLICY \"all_data_rls\" FOR ALL TO public USING (((role)::name = \"current_user\"())) Has OIDs: no Options: orientation=row, compression=no, storage_type=USTORE, segment=off"
    status: "confirmed"
    source_anchor: "L53-L58"
  -
    id: "alter_row_level_security_policy_fact_example_lines_60"
