    statement: "示例片段（仅作来源证据）：--创建行访问控制策略，当前用户只能查看用户自身的数据。 gaussdb=# CREATE ROW LEVEL SECURITY POLICY all_data_rls ON all_data USING(role = CURRENT_USER);"
    status: "confirmed"
    source_anchor: "L43-L44"
