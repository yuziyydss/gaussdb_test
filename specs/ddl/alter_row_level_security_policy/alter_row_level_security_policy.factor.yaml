  -
    id: "alter_row_level_security_policy_fact_example_lines_64"
    type: "example"
    statement: "示例片段（仅作来源证据）：--修改行访问控制all_data_rls的名称。 gaussdb=# ALTER ROW LEVEL SECURITY POLICY all_data_rls ON all_data RENAME TO all_data_new_rls;"
