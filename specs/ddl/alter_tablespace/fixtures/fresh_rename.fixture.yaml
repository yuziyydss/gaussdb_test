schema_version: 1
kind: fixture
id: fixture_alter_tablespace_fresh_rename
name: ALTER TABLESPACE专用重命名表空间
factor_ref: alter_tablespace
status: needs_review
description: 创建一个专用空RELATIVE表空间并重命名；不验证磁盘容量、IO行为、属主或文件生命周期。
requires_fixture_refs: []
provides: {}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - "CREATE TABLESPACE g_alter_tbspc RELATIVE LOCATION 'g_alter_tbspc';"
  teardown_sqls:
    - "DROP TABLESPACE IF EXISTS g_alter_tbspc;"
    - "DROP TABLESPACE IF EXISTS g_alter_tbspc_renamed;"
  note: 仅在预先授权、非事务块且专用目录已准备好的独占测试环境中运行；原表空间名与新表空间名均初始不存在。本case实际创建并拥有该表空间的清理权；setup失败阻止目标并保留实际对象与目录清单。目标仅证明重命名语法与静态候选，不验证磁盘容量、IO调度、表空间内对象、目录身份或文件生命周期；清理仅限本case确认创建成功的空表空间，禁止CASCADE、DROP OWNED或吞异常。
