facts:
  -
    id: "alter_tablespace_fact_body_5"
    type: "constraint"
    statement: "修改表空间的属性。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "alter_tablespace_fact_body_8"
    type: "environment"
    statement: "●   只有表空间的所有者或者被赋予了表空间ALTER权限的用户有权限执行ALTER TABLESPACE命令，系统管理员默认拥有此权限。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "alter_tablespace_fact_body_8_1"
    type: "environment"
    statement: "但要修改表空间的所有者，当前"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "alter_tablespace_fact_body_11"
    type: "environment"
    statement: "用户必须是该表空间的所有者或系统管理员，且该用户是new_owner角色的成 员。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "alter_tablespace_fact_body_13"
    type: "constraint"
    statement: "●   对行存表的ALTER TABLESPACE操作不支持在事务块中执行。"
    status: "confirmed"
    source_anchor: "L13-L13"
  -
    id: "alter_tablespace_fact_body_14"
    type: "environment"
    statement: "●   修改系统表空间的所有者时，仅允许初始用户将所有者修改为自己，其他情况均 不允许修改。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "alter_tablespace_fact_body_16"
    type: "constraint"
    statement: "●   要修改表空间的所有者A为B，则A必须是B的直接或者间接成员。"
    status: "confirmed"
    source_anchor: "L16-L16"
  -
    id: "alter_tablespace_fact_body_19"
    type: "constraint"
    statement: "如果new_owner与old_owner一致，此处不再校验当前执行操作的用户是否具有修改权 限，而直接显示ALTER成功。"
    status: "confirmed"
    source_anchor: "L19-L20"
  -
    id: "alter_tablespace_fact_body_24"
    type: "constraint"
    statement: "●   重命名表空间的语法。"
    status: "confirmed"
    source_anchor: "L24-L26"
  -
    id: "alter_tablespace_fact_body_24_1"
    type: "constraint"
    statement: "ALTER TABLESPACE tablespace_name RENAME TO new_tablespace_name;"
    status: "confirmed"
    source_anchor: "L24-L26"
  -
    id: "alter_tablespace_fact_body_31"
    type: "constraint"
    statement: "●   设置表空间所有者的语法。"
    status: "confirmed"
    source_anchor: "L31-L33"
  -
    id: "alter_tablespace_fact_body_31_1"
    type: "constraint"
    statement: "ALTER TABLESPACE tablespace_name OWNER TO new_owner;"
    status: "confirmed"
    source_anchor: "L31-L33"
  -
    id: "alter_tablespace_fact_body_38"
    type: "constraint"
    statement: "●   设置表空间属性的语法。"
    status: "confirmed"
    source_anchor: "L38-L40"
  -
    id: "alter_tablespace_fact_body_38_1"
    type: "constraint"
    statement: "ALTER TABLESPACE tablespace_name SET ( { tablespace_option = value } [, ... ] );"
    status: "confirmed"
    source_anchor: "L38-L40"
  -
    id: "alter_tablespace_fact_body_45"
    type: "constraint"
    statement: "●   重置表空间属性的语法。"
    status: "confirmed"
    source_anchor: "L45-L47"
  -
    id: "alter_tablespace_fact_body_45_1"
    type: "constraint"
    statement: "ALTER TABLESPACE tablespace_name RESET ( { tablespace_option } [, ... ] );"
    status: "confirmed"
    source_anchor: "L45-L47"
  -
    id: "alter_tablespace_fact_body_52"
    type: "constraint"
    statement: "●   设置表空间限额的语法。"
    status: "confirmed"
    source_anchor: "L52-L54"
  -
    id: "alter_tablespace_fact_body_52_1"
    type: "constraint"
    statement: "ALTER TABLESPACE tablespace_name RESIZE MAXSIZE { UNLIMITED | 'space_size'};"
    status: "confirmed"
    source_anchor: "L52-L54"
  -
    id: "alter_tablespace_fact_body_60"
    type: "constraint"
    statement: "●   tablespace_name 要修改的表空间。"
    status: "confirmed"
    source_anchor: "L60-L62"
  -
    id: "alter_tablespace_fact_body_60_1"
    type: "constraint"
    statement: "取值范围：已存在的表空间名。"
    status: "confirmed"
    source_anchor: "L60-L62"
  -
    id: "alter_tablespace_fact_body_63"
    type: "constraint"
    statement: "●   new_tablespace_name 表空间的新名称，新名称不能以\"PG_\"开头。"
    status: "confirmed"
    source_anchor: "L63-L65"
  -
    id: "alter_tablespace_fact_body_63_1"
    type: "constraint"
    statement: "取值范围：字符串，要符合标识符命名规范。"
    status: "confirmed"
    source_anchor: "L63-L65"
  -
    id: "alter_tablespace_fact_body_66"
    type: "constraint"
    statement: "●   new_owner 表空间的新所有者。"
    status: "confirmed"
    source_anchor: "L66-L67"
  -
    id: "alter_tablespace_fact_body_69"
    type: "constraint"
    statement: "取值范围：已存在的用户名。"
    status: "confirmed"
    source_anchor: "L69-L69"
  -
    id: "alter_tablespace_fact_body_70"
    type: "constraint"
    statement: "●   tablespace_option 设置或者重置表空间的参数。"
    status: "confirmed"
    source_anchor: "L70-L72"
  -
    id: "alter_tablespace_fact_body_70_1"
    type: "constraint"
    statement: "取值范围："
    status: "confirmed"
    source_anchor: "L70-L72"
  -
    id: "alter_tablespace_fact_body_73"
    type: "behavior_oracle"
    statement: "–    seq_page_cost：设置优化器计算一次顺序获取磁盘页面的开销。"
    status: "confirmed"
    source_anchor: "L73-L74"
  -
    id: "alter_tablespace_fact_body_73_1"
    type: "behavior_oracle"
    statement: "缺省为 1.0。"
    status: "confirmed"
    source_anchor: "L73-L74"
  -
    id: "alter_tablespace_fact_body_75"
    type: "behavior_oracle"
    statement: "–    random_page_cost：设置优化器计算一次非顺序获取磁盘页面的开销。"
    status: "confirmed"
    source_anchor: "L75-L76"
  -
    id: "alter_tablespace_fact_body_75_1"
    type: "behavior_oracle"
    statement: "缺省 为4.0。"
    status: "confirmed"
    source_anchor: "L75-L76"
  -
    id: "alter_tablespace_fact_body_79"
    type: "constraint"
    statement: "● random_page_cost是相对于seq_page_cost的取值，等于或者小于seq_page_cost 时毫无意义。"
    status: "confirmed"
    source_anchor: "L79-L80"
  -
    id: "alter_tablespace_fact_body_81"
    type: "behavior_oracle"
    statement: "● 默认值为4.0的前提条件是，优化器采用索引来扫描表数据，并且表数据在cache 中命中率可以90%左右。"
    status: "confirmed"
    source_anchor: "L81-L82"
  -
    id: "alter_tablespace_fact_body_83"
    type: "constraint"
    statement: "● 如果表数据空间要比物理内存小，那么减小该值到一个适当水平；"
    status: "confirmed"
    source_anchor: "L83-L84"
  -
    id: "alter_tablespace_fact_body_83_1"
    type: "constraint"
    statement: "相反地，如果 表数据在cache中命中率要低于90%，那么适当增大该值。"
    status: "confirmed"
    source_anchor: "L83-L84"
  -
    id: "alter_tablespace_fact_body_85"
    type: "constraint"
    statement: "● 如果采用了类似于SSD的随机访问代价较小的存储器，可以适当减小该值，以反 映真正的随机扫描代价。"
    status: "confirmed"
    source_anchor: "L85-L87"
  -
    id: "alter_tablespace_fact_body_85_1"
    type: "constraint"
    statement: "value的取值范围：浮点类型的正数。"
    status: "confirmed"
    source_anchor: "L85-L87"
  -
    id: "alter_tablespace_fact_body_88"
    type: "constraint"
    statement: "●   RESIZE MAXSIZE 重新设置表空间限额的数值。"
    status: "confirmed"
    source_anchor: "L88-L90"
  -
    id: "alter_tablespace_fact_body_88_1"
    type: "constraint"
    statement: "取值范围："
    status: "confirmed"
    source_anchor: "L88-L90"
  -
    id: "alter_tablespace_fact_body_91"
    type: "constraint"
    statement: "–    UNLIMITED，该表空间不设置限额。"
    status: "confirmed"
    source_anchor: "L91-L91"
  -
    id: "alter_tablespace_fact_body_92"
    type: "constraint"
    statement: "–    由space_size进行确定，其格式请参见CREATE TABLESPACE。"
    status: "confirmed"
    source_anchor: "L92-L92"
  -
    id: "alter_tablespace_fact_body_95"
    type: "constraint"
    statement: "若调整后的限额值比当前表空间实际使用的值要小，调整操作可以执行成功，后续用 户需要将该表空间的使用值降低到新限额值之下，才能继续往该表空间中写入数据。"
    status: "confirmed"
    source_anchor: "L95-L96"
  -
    id: "alter_tablespace_fact_example_100"
    type: "example"
    statement: "示例原文片段：●   重命名表空间。 --创建表空间。 gaussdb=# CREATE TABLESPACE tbs_data1 RELATIVE LOCATION 'tablespace1/tbs_data1';"
    status: "confirmed"
    source_anchor: "L100-L102"
  -
    id: "alter_tablespace_fact_example_104"
    type: "example"
    statement: "示例原文片段：--重命名表空间。 gaussdb=# ALTER TABLESPACE tbs_data1 RENAME TO tbs_data2;"
    status: "confirmed"
    source_anchor: "L104-L105"
  -
    id: "alter_tablespace_fact_example_107"
    type: "example"
    statement: "示例原文片段：--查询。 gaussdb=# \\db tbs_data2 List of tablespaces Name | Owner |            Location -----------+-------+----------------------- tbs_data2 | omm | tablespace1/tbs_data1"
    status: "confirmed"
    source_anchor: "L107-L112"
  -
    id: "alter_tablespace_fact_example_114"
    type: "example"
    statement: "示例原文片段：●   设置表空间所有者。 --创建用户。 gaussdb=# CREATE USER test PASSWORD '********';"
    status: "confirmed"
    source_anchor: "L114-L116"
  -
    id: "alter_tablespace_fact_example_118"
    type: "example"
    statement: "示例原文片段：--修改表空间所有者。 gaussdb=# ALTER TABLESPACE tbs_data2 OWNER TO test;"
    status: "confirmed"
    source_anchor: "L118-L119"
  -
    id: "alter_tablespace_fact_example_121"
    type: "example"
    statement: "示例原文片段：--查看。 gaussdb=# \\db tbs_data2 List of tablespaces"
    status: "confirmed"
    source_anchor: "L121-L123"
  -
    id: "alter_tablespace_fact_example_125"
    type: "example"
    statement: "示例原文片段：Name | Owner |            Location -----------+-------+----------------------- tbs_data2 | test | tablespace1/tbs_data1 (1 row)"
    status: "confirmed"
    source_anchor: "L125-L128"
  -
    id: "alter_tablespace_fact_example_130"
    type: "example"
    statement: "示例原文片段：●   设置表空间属性。 --修改seq_page_cost的值。 gaussdb=# ALTER TABLESPACE tbs_data2 SET (seq_page_cost = 10);"
    status: "confirmed"
    source_anchor: "L130-L132"
  -
    id: "alter_tablespace_fact_example_134"
    type: "example"
    statement: "示例原文片段：--查看。 gaussdb=# SELECT * FROM pg_tablespace WHERE spcname = 'tbs_data2'; spcname | spcowner | spcacl |        spcoptions      | spcmaxsize | relative -----------+----------+--------+--------------------+------------+---------- tbs_data2 | 16778 |           | {seq_page_cost=10} |            |t (1 row)"
    status: "confirmed"
    source_anchor: "L134-L139"
  -
    id: "alter_tablespace_fact_example_141"
    type: "example"
    statement: "示例原文片段：●   重置表空间属性。 --将seq_page_cost参数的值重置为缺省值。 gaussdb=# ALTER TABLESPACE tbs_data2 RESET (seq_page_cost);"
    status: "confirmed"
    source_anchor: "L141-L143"
  -
    id: "alter_tablespace_fact_example_145"
    type: "example"
    statement: "示例原文片段：--查看。 gaussdb=# SELECT * FROM pg_tablespace WHERE spcname = 'tbs_data2'; spcname | spcowner | spcacl | spcoptions | spcmaxsize | relative -----------+----------+--------+------------+------------+---------- tbs_data2 | 16778 |           |        |         |t (1 row)"
    status: "confirmed"
    source_anchor: "L145-L150"
  -
    id: "alter_tablespace_fact_example_152"
    type: "example"
    statement: "示例原文片段：●   设置表空间限额。 --设置表空间最大使用的空间。 gaussdb=# ALTER TABLESPACE tbs_data2 RESIZE MAXSIZE '10G';"
    status: "confirmed"
    source_anchor: "L152-L154"
  -
    id: "alter_tablespace_fact_example_156"
    type: "example"
    statement: "示例原文片段：--查看。 gaussdb=# SELECT * FROM pg_tablespace WHERE spcname = 'tbs_data2'; spcname | spcowner | spcacl | spcoptions | spcmaxsize | relative -----------+----------+--------+------------+------------+---------- tbs_data2 | 16778 |           |        | 10485760 K | t (1 row)"
    status: "confirmed"
    source_anchor: "L156-L161"
  -
    id: "alter_tablespace_fact_example_163"
    type: "example"
    statement: "示例原文片段：--删除表空间。 gaussdb=# DROP TABLESPACE tbs_data2;"
    status: "confirmed"
    source_anchor: "L163-L164"
  -
    id: "alter_tablespace_fact_example_166"
    type: "example"
    statement: "示例原文片段：--删除用户。 gaussdb=# DROP USER test;"
    status: "confirmed"
    source_anchor: "L166-L167"
  -
    id: "alter_tablespace_fact_runtime_contract"
    type: "environment"
    statement: "静态表空间重命名代表只证明有限语法；真实表空间、新属主权限、限额及文件生命周期需专用环境，普通manifest不验证表空间行为。"
    status: "confirmed"
    source_anchor: "L5-L5"

  -
    id: "alter_tablespace_fact_zero_cost_conflict"
    type: "constraint"
    statement: "静态域不生成seq_page_cost=0；ALTER TABLESPACE正文与CREATE TABLESPACE的0边界差异保留为来源限制，不合并二者值域。"
    status: "confirmed"
    source_anchor: "L85-L87"

