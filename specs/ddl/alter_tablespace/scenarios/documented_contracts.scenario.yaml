preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "修改表空间的属性。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "●   只有表空间的所有者或者被赋予了表空间ALTER权限的用户有权限执行ALTER TABLESPACE命令，系统管理员默认拥有此权限。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "但要修改表空间的所有者，当前"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "用户必须是该表空间的所有者或系统管理员，且该用户是new_owner角色的成 员。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "●   对行存表的ALTER TABLESPACE操作不支持在事务块中执行。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "●   修改系统表空间的所有者时，仅允许初始用户将所有者修改为自己，其他情况均 不允许修改。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "●   要修改表空间的所有者A为B，则A必须是B的直接或者间接成员。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "如果new_owner与old_owner一致，此处不再校验当前执行操作的用户是否具有修改权 限，而直接显示ALTER成功。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "●   重命名表空间的语法。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "ALTER TABLESPACE tablespace_name RENAME TO new_tablespace_name;"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "●   设置表空间所有者的语法。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "ALTER TABLESPACE tablespace_name OWNER TO new_owner;"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "●   设置表空间属性的语法。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "ALTER TABLESPACE tablespace_name SET ( { tablespace_option = value } [, ... ] );"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "●   重置表空间属性的语法。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "ALTER TABLESPACE tablespace_name RESET ( { tablespace_option } [, ... ] );"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "●   设置表空间限额的语法。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "ALTER TABLESPACE tablespace_name RESIZE MAXSIZE { UNLIMITED | 'space_size'};"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "●   tablespace_name 要修改的表空间。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "取值范围：已存在的表空间名。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "●   new_tablespace_name 表空间的新名称，新名称不能以\"PG_\"开头。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "取值范围：字符串，要符合标识符命名规范。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "●   new_owner 表空间的新所有者。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "取值范围：已存在的用户名。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "●   tablespace_option 设置或者重置表空间的参数。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "取值范围："
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "–    seq_page_cost：设置优化器计算一次顺序获取磁盘页面的开销。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "缺省为 1.0。"
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "–    random_page_cost：设置优化器计算一次非顺序获取磁盘页面的开销。"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "缺省 为4.0。"
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "● random_page_cost是相对于seq_page_cost的取值，等于或者小于seq_page_cost 时毫无意义。"
  -
    id: "contract_31"
    action: "verify_documented_contract"
    note: "● 默认值为4.0的前提条件是，优化器采用索引来扫描表数据，并且表数据在cache 中命中率可以90%左右。"
  -
    id: "contract_32"
    action: "verify_documented_contract"
    note: "● 如果表数据空间要比物理内存小，那么减小该值到一个适当水平；"
  -
    id: "contract_33"
    action: "verify_documented_contract"
    note: "相反地，如果 表数据在cache中命中率要低于90%，那么适当增大该值。"
  -
    id: "contract_34"
    action: "verify_documented_contract"
    note: "● 如果采用了类似于SSD的随机访问代价较小的存储器，可以适当减小该值，以反 映真正的随机扫描代价。"
  -
    id: "contract_35"
    action: "verify_documented_contract"
    note: "value的取值范围：浮点类型的正数。"
  -
    id: "contract_36"
    action: "verify_documented_contract"
    note: "●   RESIZE MAXSIZE 重新设置表空间限额的数值。"
  -
    id: "contract_37"
    action: "verify_documented_contract"
    note: "取值范围："
  -
    id: "contract_38"
    action: "verify_documented_contract"
    note: "–    UNLIMITED，该表空间不设置限额。"
  -
    id: "contract_39"
    action: "verify_documented_contract"
    note: "–    由space_size进行确定，其格式请参见CREATE TABLESPACE。"
  -
    id: "contract_40"
    action: "verify_documented_contract"
    note: "若调整后的限额值比当前表空间实际使用的值要小，调整操作可以执行成功，后续用 户需要将该表空间的使用值降低到新限额值之下，才能继续往该表空间中写入数据。"
  -
    id: "upstream_contract_0"
    action: "verify_documented_contract"
    note: "使用已导出的跨章事实 create_tablespace::create_tablespace_fact_body_9；来源变化须使本包验证快照过期，尚未执行数据库验证。"
oracles:
  -
    kind: "documented_behavior"
    expected: "–    seq_page_cost：设置优化器计算一次顺序获取磁盘页面的开销。"
  -
    kind: "documented_behavior"
    expected: "缺省为 1.0。"
  -
    kind: "documented_behavior"
    expected: "–    random_page_cost：设置优化器计算一次非顺序获取磁盘页面的开销。"
  -
    kind: "documented_behavior"
    expected: "缺省 为4.0。"
  -
    kind: "documented_behavior"
    expected: "● 默认值为4.0的前提条件是，优化器采用索引来扫描表数据，并且表数据在cache 中命中率可以90%左右。"
execution_requirements:
  - "database"
  - "same_session"
