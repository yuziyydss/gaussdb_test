facts:
  -
    id: "create_function_fact_purpose"
    type: "lifecycle"
    statement: "创建函数对象。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_function_fact_precision"
    type: "behavior_oracle"
    statement: "参数或返回值附带精度在创建时不检测。"
    status: "confirmed"
    source_anchor: "L8-L8"
  -
    id: "create_function_fact_qualified_tables"
    type: "constraint"
    statement: "函数内表对象建议显式指定模式以避免执行异常。"
    status: "confirmed"
    source_anchor: "L9-L10"
  -
    id: "create_function_fact_locks"
    type: "lifecycle"
    statement: "创建存储过程/PACKAGE与运行编译使用不同锁级别，需单独核对函数适用范围。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "create_function_fact_search_path"
    type: "behavior_oracle"
    statement: "函数内 SET current_schema/search_path 无效且调用后保持调用前值。"
    status: "confirmed"
    source_anchor: "L13-L15"
  -
    id: "create_function_fact_out_gate"
    type: "environment"
    statement: "出参生效依赖 proc_outparam_override；调用需提供出参实参。"
    status: "confirmed"
    source_anchor: "L16-L19"
  -
    id: "create_function_fact_replace_overload"
    type: "lifecycle"
    statement: "PG 风格或 PACKAGE 支持重载；本段称参数个数/类型/返回值改变会创建新函数而非替换。"
    status: "confirmed"
    source_anchor: "L20-L22"
  -
    id: "create_function_fact_same_types"
    type: "constraint"
    statement: "只有参数名不同不能构成重载。"
    status: "confirmed"
    source_anchor: "L23-L23"
  -
    id: "create_function_fact_procedure_collision"
    type: "constraint"
    statement: "不能与存储过程有相同名称和参数列表。"
    status: "confirmed"
    source_anchor: "L24-L24"
  -
    id: "create_function_fact_cursor_overload"
    type: "constraint"
    statement: "自定义 ref cursor 与 sys_refcursor 的差别不能构成重载。"
    status: "confirmed"
    source_anchor: "L25-L25"
  -
    id: "create_function_fact_return_overload"
    type: "constraint"
    statement: "仅返回类型不同不能构成重载。"
    status: "confirmed"
    source_anchor: "L26-L26"
  -
    id: "create_function_fact_default_overload"
    type: "constraint"
    statement: "仅默认值不同不能构成重载。"
    status: "confirmed"
    source_anchor: "L27-L27"
  -
    id: "create_function_fact_call_types"
    type: "constraint"
    statement: "重载调用的变量要有明确类型。"
    status: "confirmed"
    source_anchor: "L28-L28"
  -
    id: "create_function_fact_styles"
    type: "environment"
    statement: "A 模式推荐 Oracle 风格，PG 模式推荐 PostgreSQL 风格，不建议混用。"
    status: "confirmed"
    source_anchor: "L29-L30"
  -
    id: "create_function_fact_package_overload"
    type: "constraint"
    statement: "本段声明支持重载须加 PACKAGE；需与 PG 风格固有重载说明区分。"
    status: "confirmed"
    source_anchor: "L31-L31"
  -
    id: "create_function_fact_undeclared"
