    status: "confirmed"
    source_anchor: "L32-L32"
  -
    id: "create_function_fact_call_overload"
    type: "constraint"
    statement: "SELECT 可按参数选择同名函数；CALL 不支持未带 PACKAGE 的同名函数。"
    status: "confirmed"
    source_anchor: "L33-L34"
  -
    id: "create_function_fact_avg_nesting"
