schema_version: 1
kind: "scenario"
id: "scenario_drop_owned_documented_contracts"
name: "DROP OWNED documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "drop_owned"
fixture_refs: []
fact_refs:
  - "drop_owned_fact_purpose"
  - "drop_owned_fact_acl"
  - "drop_owned_fact_current_database"
  - "drop_owned_fact_cascade_danger"
  - "drop_owned_fact_shared_not_dropped"
  - "drop_owned_fact_private_link"
  - "drop_owned_fact_cascade"
  - "drop_owned_fact_restrict"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "删除数据库角色拥有的数据库对象。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "移除该角色当前库对象权限及共享数据库/表空间上的权限。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "只影响当前库对象，可能需要在各持有对象的数据库分别执行。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "CASCADE可能递归删除其他用户对象。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "不删除角色拥有的数据库和表空间。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "删除角色的私有DATABASE LINK需要CASCADE。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "CASCADE删除依赖被删角色对象的对象。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "有依赖对象时RESTRICT拒绝删除。"
oracles:
  -
    kind: "documented_behavior"
    expected: "有依赖对象时RESTRICT拒绝删除。"
execution_requirements:
  - "database"
  - "same_session"
