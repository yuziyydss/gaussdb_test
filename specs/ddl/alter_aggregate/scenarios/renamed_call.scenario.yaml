schema_version: 1
kind: "scenario"
id: "scenario_alter_aggregate_renamed_call"
name: "ALTER AGGREGATE renamed_call"
status: "planned"
description: "重命名后同签名聚集仍可求和。"
factor_ref: "alter_aggregate"
fixture_refs:
  - "fixture_alter_aggregate_rename_cleanup"
fact_refs:
  - "alter_aggregate_fact_purpose"
preconditions: []
steps:
  -
    id: "rename"
    action: "execute_sql"
    sql: "ALTER AGGREGATE fp_ca_ready(INTEGER) RENAME TO fp_aa_renamed;"
  -
    id: "query"
    action: "execute_sql"
    sql: "SELECT fp_aa_renamed(v) FROM (SELECT 1 AS v UNION ALL SELECT 2) q;"
oracles:
  -
    after_step: "query"
    kind: "result_rows"
    expected:
      -
        - 3
execution_requirements:
  - "database"
  - "same_session"
