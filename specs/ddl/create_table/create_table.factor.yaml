dimensions:
  persistence_modifier:
    description: 有界覆盖普通、UNLOGGED 及未指定 GLOBAL/LOCAL 的 TEMP 同义词。
    default_value_id: ct_persistence_permanent
    classes:
      - id: ct_persistence_regular_class
        meaning: 普通或 UNLOGGED 表。
        values:
          - {id: ct_persistence_permanent, render: "", representative: true, validity: valid, fact_refs: [ct_fact_main_grammar]}
          - {id: ct_persistence_unlogged, render: "UNLOGGED ", representative: true, validity: valid, fact_refs: [ct_fact_main_grammar, ct_fact_unlogged_wal]}
      - id: ct_persistence_temp_class
        meaning: 未显式 GLOBAL/LOCAL 的本地临时表同义词。
        values:
          - {id: ct_persistence_temp, render: "TEMP ", representative: true, validity: valid, fact_refs: [ct_fact_temp_scope, ct_fact_temp_kinds]}
          - {id: ct_persistence_temporary, render: "TEMPORARY ", representative: false, validity: valid, fact_refs: [ct_fact_temp_scope, ct_fact_temp_kinds]}
  if_not_exists:
    description: 省略或声明 IF NOT EXISTS；自动生成只针对尚不存在的目标名。
    default_value_id: ct_if_absent
    classes:
      - id: ct_if_not_exists_class
        meaning: 目标不存在时两种写法均应成功。
        values:
          - {id: ct_if_absent, render: "", representative: true, validity: valid}
          - {id: ct_if_present, render: "IF NOT EXISTS ", representative: true, validity: valid, fact_refs: [ct_fact_if_not_exists]}
  column_profile:
    description: 仅使用本章示例明确出现的一列或两列普通定义。
    default_value_id: ct_columns_integer
    profile_source: {matrix_ref: matrix_create_table_column_profiles, profile_id_path: profiles.id}
