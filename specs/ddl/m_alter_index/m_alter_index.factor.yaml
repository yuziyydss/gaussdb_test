facts:
- id: m_alter_index_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.6 L2-2
- id: m_alter_index_fact_syntax
  type: syntax
  statement: 重命名为独立 ALTER INDEX 分支。
  status: confirmed
  source_anchor: 2.4.2.6.6 L18-19
- id: m_alter_index_fact_unusable
  type: syntax
  statement: ALTER INDEX UNUSABLE 设置索引不可用。
  status: confirmed
  source_anchor: 2.4.2.6.6 L24-25
- id: m_alter_index_fact_set
  type: syntax
  statement: SET 接受存储参数赋值列表。
  status: confirmed
  source_anchor: 2.4.2.6.6 L34-36
- id: m_alter_index_fact_reset
  type: syntax
  statement: RESET 接受存储参数名称列表。
  status: confirmed
  source_anchor: 2.4.2.6.6 L38-40
- id: m_alter_index_fact_fillfactor
  type: constraint
  statement: ALTER INDEX 当前列明的 FILLFACTOR 合法范围是 10 至 100。
  status: confirmed
  source_anchor: 2.4.2.6.6 L65-65
- id: m_alter_index_fact_rename
  type: behavior_oracle
  statement: RENAME 只改索引名，不影响存储数据。
  status: confirmed
  source_anchor: 2.4.2.6.6 L51-51
- id: m_alter_index_fact_notice
  type: behavior_oracle
  statement: IF EXISTS 对缺失索引给 notice 而不是 error。
  status: confirmed
  source_anchor: 2.4.2.6.6 L49-49
- id: m_alter_index_fact_rebuild
  type: lifecycle
  statement: SET 不立即更新索引内容，可能需要 REINDEX。
  status: confirmed
  source_anchor: 2.4.2.6.6 L69-70
- id: m_alter_index_fact_partition
  type: syntax
  statement: 索引分区重命名需要真实分区索引。
  status: confirmed
  source_anchor: 2.4.2.6.6 L27-29
- id: m_alter_index_fact_purpose
  type: example
  statement: 修改索引属性，包括重命名、设置/重置存储参数等。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_alter_index_fact_constraint
  type: example
  statement: 索引的所有者、拥有索引所在表的INDEX权限的用户或者被授予了ALTER ANY 请勿在同一基表上保持大量的不可见索引，否则可能会对INSERT、UPDATE、
  status: confirmed
  source_anchor: M-Compatibility L8-13
- id: m_alter_index_fact_params
  type: example
  statement: ●   index_name 要修改的索引名称。 ●   IF EXISTS
  status: confirmed
  source_anchor: M-Compatibility L45-48
- id: m_alter_index_fact_example
  type: example
  statement: m_alter_index的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L80-84
