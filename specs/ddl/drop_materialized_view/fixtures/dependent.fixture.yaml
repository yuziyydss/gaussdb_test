schema_version: 1
kind: "fixture"
id: "fixture_drop_materialized_view_dependent"
name: "DROP MATERIALIZED VIEW dependent"
status: "ready"
description: "独占测试对象或会话状态；依赖先 setup、后 teardown。"
factor_ref: "drop_materialized_view"
requires_fixture_refs:
  - "fixture_drop_materialized_view_sources"
provides: {}
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "CREATE MATERIALIZED VIEW mv_drop_dep AS SELECT col_1, col_2 FROM t_mv_source;"
    - "CREATE VIEW v_mv_dep AS SELECT col_1, col_2 FROM mv_drop_dep;"
  teardown_sqls:
    - "DROP VIEW IF EXISTS v_mv_dep CASCADE;"
    - "DROP MATERIALIZED VIEW IF EXISTS mv_drop_dep CASCADE;"
  note: "本阶段仅静态编译，禁止在共享业务会话执行。"
