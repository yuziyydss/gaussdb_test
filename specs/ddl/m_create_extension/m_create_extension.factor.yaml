facts:
- id: m_create_extension_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.8 L2-2
- id: m_create_extension_fact_internal
  type: environment
  statement: 本章明确不支持普通用户使用，仅内部高级包/扩展接口；候选需要内部工具审阅。
  status: confirmed
  source_anchor: 2.4.2.8.8 L5-6
- id: m_create_extension_fact_syntax
  type: syntax
  statement: "CREATE EXTENSION 可选IF NOT EXISTS、WITH、已存在Schema、版本和旧式升级。"
  status: confirmed
  source_anchor: 2.4.2.8.8 L29-32
- id: m_create_extension_fact_files
  type: environment
  statement: 必须预装并审阅真实扩展支持文件；当前仅使用本章示例security_plugin，不假定本机已安装。
  status: confirmed
  source_anchor: 2.4.2.8.8 L9-10
- id: m_create_extension_fact_enabled
  type: environment
  statement: 数据库禁止直接创建扩展，必须预先允许enable_extension；不在fixture切换配置。
  status: confirmed
  source_anchor: 2.4.2.8.8 L21-23
- id: m_create_extension_fact_authority
  type: environment
  statement: 创建者需有创建扩展脚本组件的权限，且成为扩展所有者。
  status: confirmed
  source_anchor: 2.4.2.8.8 L15-17
- id: m_create_extension_fact_schema
  type: environment
  statement: 指定Schema须存在；支持文件的Schema配置与指定安装位置必须先审阅一致。
  status: confirmed
  source_anchor: 2.4.2.8.8 L43-45
- id: m_create_extension_fact_collision
  type: constraint
  statement: 同名扩展组件已存在会导致创建失败。
  status: confirmed
  source_anchor: 2.4.2.8.8 L18-20
- id: m_create_extension_fact_notice
  type: behavior_oracle
  statement: IF NOT EXISTS不保证已安装扩展与当前脚本内容相同。
  status: confirmed
  source_anchor: 2.4.2.8.8 L38-38
- id: m_create_extension_fact_example
  type: example
  statement: 文档给出security_plugin安装/删除示例，名称仅为有限样本，不是安装状态证明。
  status: confirmed
  source_anchor: 2.4.2.8.8 L61-63
- id: m_create_extension_fact_purpose
  type: example
  statement: 在数据库中安装扩展。
  status: confirmed
  source_anchor: M-Compatibility L4-4
- id: m_create_extension_fact_constraint
  type: example
  statement: 扩展名称必须在当前数据库中可用。
  status: confirmed
  source_anchor: M-Compatibility L8-8
- id: m_create_extension_fact_params
  type: example
  statement: extension_name是要安装的扩展名。SCHEMA指定安装到的模式。VERSION指定版本。
  status: confirmed
  source_anchor: M-Compatibility L24-26
