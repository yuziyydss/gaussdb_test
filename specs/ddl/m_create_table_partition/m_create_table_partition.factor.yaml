facts:
- id: m_create_table_partition_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.17 L2-2
- id: m_create_table_partition_fact_syntax
  type: syntax
  statement: M行存分区表支持RANGE、LIST、HASH/KEY主产生式；表定义先于分区子句。
  status: confirmed
  source_anchor: 2.4.2.8.17 L83-100
- id: m_create_table_partition_fact_hash_key
  type: constraint
  statement: HASH仅支持一个分区键；KEY语义同HASH但不支持表达式。
  status: confirmed
  source_anchor: 2.4.2.8.17 L54-54
- id: m_create_table_partition_fact_bounds
  type: constraint
  statement: LESS THAN上边界必须同键类型、升序且不可用表达式；裸MAXVALUE仅单列。
  status: confirmed
  source_anchor: 2.4.2.8.17 L355-360
- id: m_create_table_partition_fact_start_end
  type: constraint
  statement: START小于END，相邻END/START相等；不得与LESS THAN混用。
  status: confirmed
  source_anchor: 2.4.2.8.17 L382-394
- id: m_create_table_partition_fact_implicit
  type: metadata_oracle
  statement: 首个START会额外创建MINVALUE到START的分区，名称为前缀加_0。
  status: confirmed
  source_anchor: 2.4.2.8.17 L368-373
- id: m_create_table_partition_fact_list
  type: constraint
  statement: LIST普通列最多16列，表达式或二级分区时限单列；单分区最多64个键值。
  status: confirmed
  source_anchor: 2.4.2.8.17 L401-406
- id: m_create_table_partition_fact_partitions
  type: constraint
  statement: 显式PARTITIONS数需匹配定义数；HASH/KEY可自动命名，无定义无数量则单分区。
  status: confirmed
  source_anchor: 2.4.2.8.17 L427-435
- id: m_create_table_partition_fact_count_wording
  type: open_question
  statement: PARTITIONS说明先称只能RANGE/LIST随后又明示HASH/KEY，示例证实HASH PARTITIONS 3。按分支与示例建模，保留文案矛盾。
  status: needs_verification
  source_anchor: 2.4.2.8.17 L429-429
- id: m_create_table_partition_fact_row
  type: environment
  statement: M仅行存；Ustore还要求track_counts/track_activities；本批显式ASTORE避免隐含存储假设。
  status: confirmed
  source_anchor: 2.4.2.8.17 L263-266
- id: m_create_table_partition_fact_storage
  type: syntax
  statement: STORAGE_TYPE允许USTORE/ASTORE且设置后不支持修改。
  status: confirmed
  source_anchor: 2.4.2.8.17 L275-284
- id: m_create_table_partition_fact_fillfactor
  type: constraint
  statement: FILLFACTOR范围10至100，本批取两个端点。
  status: confirmed
  source_anchor: 2.4.2.8.17 L261-261
- id: m_create_table_partition_fact_columns_alias
  type: syntax
  statement: RANGE COLUMNS与RANGE、LIST COLUMNS与LIST语义相同。
  status: confirmed
  source_anchor: 2.4.2.8.17 L319-319
- id: m_create_table_partition_fact_routing
  type: behavior_oracle
  statement: RANGE记录不能映射到已创建分区时返回错误。
  status: confirmed
  source_anchor: 2.4.2.8.17 L18-20
- id: m_create_table_partition_fact_key_types
  type: constraint
  statement: BLOB/TEXT/BIT等不能作为一级/二级分区键，本批仅INTEGER。
  status: confirmed
  source_anchor: 2.4.2.8.17 L64-66
- id: m_ctp_partition_types
  type: syntax
  statement: 分区方案：范围（Range）、哈希（Hash/Key）、列表（List）。行存表支持三种。
  status: confirmed
  source_anchor: 2.4.2.8.17 L4-10
- id: m_ctp_range_semantics
  type: behavior_oracle
  statement: 范围分区根据一列或多列将记录分为若干不重叠范围。可映射到分区则插入，否则报错。
  status: confirmed
  source_anchor: 2.4.2.8.17 L12-17
- id: m_ctp_hash_semantics
  type: behavior_oracle
  statement: 哈希分区根据一列指定模数和余数划分。分区键值除以模数产生指定余数。仅支持单列。
  status: confirmed
  source_anchor: 2.4.2.8.17 L22-29
- id: m_ctp_list_semantics
  type: behavior_oracle
  statement: 列表分区根据一列通过每分区键值划分，键值不重叠。
  status: confirmed
  source_anchor: 2.4.2.8.17 L31-38
- id: m_ctp_unique_local_global
  type: behavior_oracle
  statement: 唯一/主键约束含所有分区键时创建LOCAL索引，否则GLOBAL索引。
  status: confirmed
  source_anchor: 2.4.2.8.17 L51-53
- id: m_ctp_partition_for_constants
  type: constraint
  statement: PARTITION FOR(values)语法values只能是常量。建议用强制类型转换防隐式转换不符预期。
  status: confirmed
  source_anchor: 2.4.2.8.17 L55-61
- id: m_ctp_max_partitions
  type: constraint
  statement: 单个表最大分区数1048575。默认配置建议不超过400个。分区过多导致内存不足时性能急剧下降。
  status: confirmed
  source_anchor: 2.4.2.8.17 L55-61
- id: m_ctp_no_global_index_scan
  type: constraint
  statement: 指定分区语句目前不能走全局索引扫描。
  status: confirmed
  source_anchor: 2.4.2.8.17 L63-63
- id: m_ctp_partition_key_types_excluded
  type: constraint
  statement: 不支持BLOB/TINYBLOB/MEDIUMBLOB/LONGBLOB/TEXT/TINYTEXT/MEDIUMTEXT/LONGTEXT/BIT作为分区键。
  status: confirmed
  source_anchor: 2.4.2.8.17 L67-78
- id: m_ctp_concurrent_update_delete
  type: behavior_oracle
  statement: 分区表并发UPDATE/DELETE可能引发错误：UPDATE跨分区标记旧数据并在新分区新增，后续操作无法正确关联。建议串行执行。
  status: confirmed
  source_anchor: 2.4.2.8.17 L67-78
- id: m_ctp_range_key_limit
  type: constraint
  statement: VALUES LESS THAN语法分区键最多16列。START END语法仅支持1列。
  status: confirmed
  source_anchor: 2.4.2.8.17 L325-339
- id: m_ctp_range_key_types
  type: syntax
  statement: 范围分区键支持：TINYINT/SMALLINT/INTEGER/BIGINT/DECIMAL/NUMERIC/DATE/TIMESTAMP等。
  status: confirmed
  source_anchor: 2.4.2.8.17 L328-349
- id: m_ctp_list_key_types
  type: syntax
  statement: 列表分区键支持：整数/日期/BINARY/VARBINARY/DATETIME等类型。
  status: confirmed
  source_anchor: 2.4.2.8.17 L419-423
- id: m_ctp_btree_only
  type: constraint
  statement: 目前只支持索引方法为btree。
  status: confirmed
  source_anchor: 2.4.2.8.17 L206-206
- id: m_ctp_orientation_immutable
  type: constraint
  statement: orientation不支持修改。
  status: confirmed
  source_anchor: 2.4.2.8.17 L272-272
- id: m_ctp_tde_storage
  type: environment
  statement: 支持透明加密存储参数：enable_tde、encrypt_algo、dek_cipher、key_type等。
  status: confirmed
  source_anchor: 2.4.2.8.17 L250-260
- id: m_ctp_generated_no_virtual_index
  type: constraint
  statement: 不支持在虚拟生成列上创建索引。STORED/VIRTUAL缺省STORED。
  status: confirmed
  source_anchor: 2.4.2.8.17 L497-520
- id: m_ctp_hash_partitions_count
  type: syntax
  statement: PARTITIONS integer指定哈希分区数量。
  status: confirmed
  source_anchor: 2.4.2.8.17 L425-426
