facts:
- id: m_create_user_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.20 L2-2
- id: m_create_user_fact_syntax
  type: syntax
  statement: "CREATE USER 可选 WITH 与属性，PASSWORD/IDENTIFIED BY 分支必需并支持 DISABLE。"
  status: confirmed
  source_anchor: 2.4.2.8.20 L15-16
- id: m_create_user_fact_schema
  type: lifecycle
  statement: 创建用户时自动在当前数据库创建同名 Schema。
  status: confirmed
  source_anchor: 2.4.2.8.20 L9-10
- id: m_create_user_fact_login
  type: behavior_oracle
  statement: CREATE USER 缺省 LOGIN；本批显式 NOLOGIN 避免开放可登录账户。
  status: confirmed
  source_anchor: 2.4.2.8.20 L8-8
- id: m_create_user_fact_ownership
  type: behavior_oracle
  statement: 系统管理员在普通用户同名 Schema 创建对象，其所有者是该普通用户。
  status: confirmed
  source_anchor: 2.4.2.8.20 L11-12
- id: m_create_user_fact_name
  type: syntax
  statement: 用户名称最多63字符；本批使用不含大写的短标识符，避免同名 Schema 大小写分歧。
  status: confirmed
  source_anchor: 2.4.2.8.20 L53-59
- id: m_create_user_fact_parameters
  type: syntax
  statement: 其他角色参数由 CREATE ROLE 定义，包括禁用密码权限与连接范围。
  status: confirmed
  source_anchor: 2.4.2.8.20 L75-75
- id: m_create_user_fact_purpose
  type: example
  statement: 创建一个用户。通过CREATE USER创建的用户默认具有LOGIN权限，同时系统会在执行命令的数据库中为该用户创建同名SCHEMA。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_create_user_fact_constraint
  type: example
  statement: 系统管理员在普通用户同名schema下创建的对象，所有者为schema的同名用户（非系统管理员）。用户名超63字符时截断保留前63个。不建议创建含大写字母的用户名（lower_case_table_names=1时Schema名自动转小写）。
  status: confirmed
  source_anchor: M-Compatibility L7-7
- id: m_create_user_fact_permission
  type: environment
  statement: 创建用户需要CREATEROLE权限或系统管理员。
  status: confirmed
  source_anchor: M-Compatibility L18-29
- id: m_create_user_fact_params
  type: example
  statement: user_name最多63字符，须以字母或下划线开头。option包括SYSADMIN/MONADMIN/OPRADMIN/POLADMIN/AUDITADMIN/CREATEDB/USEFT/CREATEROLE/INHERIT/LOGIN/REPLICATION/PERSISTENCE、CONNECTION
    LIMIT、VALID BEGIN/UNTIL、USER GROUP、NODE GROUP、IN ROLE/GROUP、ROLE/ADMIN/USER、DEFAULT TABLESPACE、PROFILE、PGUSER等。
  status: confirmed
  source_anchor: M-Compatibility L47-51
- id: m_create_user_fact_example
  type: example
  statement: m_create_user的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L77-79
