facts:
- id: m_alter_table_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.6.12 L2-2
- id: m_alter_table_fact_syntax
  type: "syntax"
  statement: ALTER TABLE表定义可跟动作列表，列子句包括ADD/MODIFY/CHANGE/DROP/ALTER DEFAULT。
  status: confirmed
  source_anchor: 2.4.2.6.12 L50-53
- id: m_alter_table_fact_authority
  type: environment
  statement: 普通修改需表所有者/ALTER权限；本批所有对象均由当前fixture创建者持有。
  status: confirmed
  source_anchor: 2.4.2.6.12 L9-12
- id: m_alter_table_fact_add
  type: "syntax"
  statement: ADD COLUMN支持FIRST/AFTER位置，ADD括号可增加多列。
  status: confirmed
  source_anchor: 2.4.2.6.12 L127-129
- id: m_alter_table_fact_modify
  type: "syntax"
  statement: MODIFY与CHANGE支持完整列定义和位置；CHANGE同时改名。
  status: confirmed
  source_anchor: 2.4.2.6.12 L130-138
- id: m_alter_table_fact_change_syntax
  type: "syntax"
  statement: M CHANGE可选COLUMN，显式提供原列名、新列名和新定义，可带字段约束及位置子句。
  status: confirmed
  source_anchor: 2.4.2.6.12 L176-178
- id: m_alter_table_fact_change_name
  type: "constraint"
  statement: CHANGE修改已存在字段的名称和定义，新名称不能是已有字段名。
  status: confirmed
  source_anchor: 2.4.2.6.12 L179-179
- id: m_alter_table_fact_add_null
  type: "behavior_oracle"
  statement: ADD列时原有行初始化为DEFAULT，未声明DEFAULT时为NULL。
  status: confirmed
  source_anchor: 2.4.2.6.12 L147-148
- id: m_alter_table_fact_position
  type: "syntax"
  statement: FIRST新增或修改列到第一位，AFTER在指定列之后。
  status: confirmed
  source_anchor: 2.4.2.6.12 L596-600
- id: m_alter_table_fact_position_rules
  type: "constraint"
  statement: 有规则依赖的表不支持新增或修改导致的列位置变化。
  status: confirmed
  source_anchor: 2.4.2.6.12 L603-603
- id: m_alter_table_fact_default
  type: "syntax"
  statement: ALTER COLUMN可SET DEFAULT或DROP DEFAULT；本批INTEGER只用兼容常量。
  status: confirmed
  source_anchor: 2.4.2.6.12 L138-138
- id: m_alter_table_fact_default_future
  type: "behavior_oracle"
  statement: 修改DEFAULT只影响随后INSERT，不回填现有行。
  status: confirmed
  source_anchor: 2.4.2.6.12 L207-209
- id: m_alter_table_fact_null_check
  type: "constraint"
  statement: 新增CHECK/NOT NULL需验证所有已有行。
  status: confirmed
  source_anchor: 2.4.2.6.12 L284-284
- id: m_alter_table_fact_nextval
  type: "constraint"
  statement: 不支持ADD带nextval() DEFAULT的列；本批不生成此依赖分支。
  status: confirmed
  source_anchor: 2.4.2.6.12 L17-17
- id: m_alter_table_fact_rename
  type: "syntax"
  statement: RENAME表可选TO/AS/等号；重命名不改变数据。
  status: confirmed
  source_anchor: 2.4.2.6.12 L260-261
- id: m_alter_table_fact_schema
  type: "syntax"
  statement: SET SCHEMA使用独立产生式，可带IF EXISTS。
  status: confirmed
  source_anchor: 2.4.2.6.12 L268-269
- id: m_alter_table_fact_schema_authority
  type: environment
  statement: 迁移必须有目标Schema CREATE权限，只在用户Schema之间；本批新建两个专用Schema。
  status: confirmed
  source_anchor: 2.4.2.6.12 L276-280
- id: m_alter_table_fact_schema_sequence
  type: "constraint"
  statement: 拥有序列时须删除/重建/取消拥有关系才能迁移；本批无序列/自增列。
  status: confirmed
  source_anchor: 2.4.2.6.12 L273-275
- id: m_alter_table_fact_bundle
  type: "constraint"
  statement: RENAME/SET SCHEMA不能混入多动作列表；本批两类独立manifest。
  status: confirmed
  source_anchor: 2.4.2.6.12 L281-283
- id: m_alter_table_fact_check_null
  type: open_question
  statement: 本章CHECK说明仅真通过，CREATE TABLE说明真或未知；本批CHECK仅非NULL整数，不用此差异生成Oracle。
  status: needs_verification
  source_anchor: 2.4.2.6.12 L391-393
- id: m_alter_table_fact_rewrite
  type: open_question
  statement: 前文ADD DEFAULT满足条件可避免全表更新，后文称非空DEFAULT会重写；不自动判性能和物理重写。
  status: needs_verification
  source_anchor: 2.4.2.6.12 L285-286
- id: m_alter_table_fact_only
  type: "behavior_oracle"
  statement: ONLY和星号保留语法但不支持对应功能，本批不用它们表示继承隔离。
  status: confirmed
  source_anchor: 2.4.2.6.12 L300-301
- id: m_alter_table_fact_internal
  type: environment
  statement: TO GROUP/NODE及增删节点属于内部扩缩容接口，不进入普通修改域。
  status: confirmed
  source_anchor: 2.4.2.6.12 L87-94
- id: m_alter_table_fact_fillfactor
  type: "constraint"
  statement: FILLFACTOR范围10至100，本批固定ASTORE并测试两个端点。
  status: confirmed
  source_anchor: 2.4.2.6.12 L344-344
- id: m_alter_table_fact_drop
  type: "lifecycle"
  statement: DROP列是逻辑不可见而非立即物理删除，CASCADE自s1仅语法支持。
  status: confirmed
  source_anchor: 2.4.2.6.12 L200-204
- id: m_at_partition_tablespace
  type: example
  statement: 不能修改分区表的TABLESPACE，但可以修改分区的TABLESPACE。
  status: confirmed
  source_anchor: 2.4.2.6.12 L13-15
- id: m_at_pk_drop_not_null
  type: example
  statement: 通过约束名删除PRIMARY KEY约束时不删除NOT NULL约束，需手动删除。
  status: confirmed
  source_anchor: 2.4.2.6.12 L18-23
- id: m_at_default_add_column
  type: example
  statement: ADD COLUMN增加字段时现有行初始化为缺省值。新增列DEFAULT需满足：特定类型列表、长度≤128字节、不含volatile函数、值不为NULL，否则触发全表更新。
  status: confirmed
  source_anchor: 2.4.2.6.12 L25-46
- id: m_at_first_after_full_update
  type: example
  statement: 使用FIRST|AFTER新增/修改列或修改字段字符集会带来全表更新。
  status: confirmed
  source_anchor: 2.4.2.6.12 L46-49
- id: m_at_no_nextval_default
  type: example
  statement: 不支持增加DEFAULT值中包含nextval()表达式的列。
  status: confirmed
  source_anchor: 2.4.2.6.12 L8-23
- id: m_at_set_schema_restriction
  type: example
  statement: SET SCHEMA不支持修改为系统内部模式，仅支持用户模式间修改。
  status: confirmed
  source_anchor: 2.4.2.6.12 L13-15
- id: m_at_modify_column
  type: example
  statement: MODIFY用新名称和定义替换字段原名称和定义。原字段上的索引、独立对象约束不被删除。
  status: confirmed
  source_anchor: 2.4.2.6.12 L180-199
- id: m_at_change_charset
  type: example
  statement: 修改字段字符集或字符序会将字段中数据转换为新字符集编码。仅字符类型支持。BINARY转为二进制。
  status: confirmed
  source_anchor: 2.4.2.6.12 L173-175, L378-389
- id: m_at_owner_permission
  type: environment
  statement: 表所有者、ALTER权限或ALTER ANY TABLE权限用户可执行。修改所有者/模式需当前用户是所有者或系统管理员且是新所有者角色成员。
  status: confirmed
  source_anchor: 2.4.2.6.12 L8-10
- id: m_at_unique_index_naming
  type: example
  statement: 唯一键constraint_name和index_name同时指定时索引名为constraint_name。
  status: confirmed
  source_anchor: 2.4.2.6.12 L540-541
- id: m_at_foreign_key_checks
  type: environment
  statement: 外键完整性检查由GUC参数foreign_key_checks控制。REFERENCES需s1以上版本。
  status: confirmed
  source_anchor: 2.4.2.6.12 L574-585
- id: m_at_generated_column
  type: example
  statement: STORED/VIRTUAL缺省STORED。不支持虚拟生成列上创建索引。s2下存储生成列基列不能与ON UPDATE/AUTO_INCREMENT共存。
  status: confirmed
  source_anchor: 2.4.2.6.12 L445-468
- id: m_at_fillfactor
  type: example
  statement: 不更新的表填充因子100最佳；频繁更新的表选择较小值。
  status: confirmed
  source_anchor: 2.4.2.6.12 L342-343
- id: m_at_auto_increment
  type: example
  statement: 可添加AUTO_INCREMENT自增列。可设置下一个自增值。NULL触发自增。
  status: confirmed
  source_anchor: 2.4.2.6.12 L517-528
