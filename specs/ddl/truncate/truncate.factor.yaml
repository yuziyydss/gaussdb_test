schema_version: 1
kind: factor
id: truncate
name: TRUNCATE
category: DDL
status: needs_review
description: >-
  基于 GaussDB V2.0-10.0.0 集中式版 1.13.20.2 的 PDF-first 因子包；
  双顶层 AST 覆盖整表和分区语法，所有无界重复与行为 Oracle 均诚实登记。
source:
  product: GaussDB
  document: GaussDB V2.0-10.0.0 集中式版参考 / 1.13.20.2 TRUNCATE
  version: V2.0-10.0.0
  artifact_sha256: 7b830f836b05a0c46715fb6e0ce1e2b3a2301d58c71960a321d767c6c2c3dab4
  parent_pdf_sha256: 716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe
  extraction_rule_version: gaussdb-pdf-outline-v1
  extraction_date: "2026-09-04"
  catalog_chapter_ref:
    document_id: gaussdb_v2_0_10_0_0_centralized_reference_01
    source_relpath: general/ddl/truncate.txt
    chapter_sha256: 7b830f836b05a0c46715fb6e0ce1e2b3a2301d58c71960a321d767c6c2c3dab4
source_ledger_ref: source_ledger_truncate
syntax_ref: syntax_truncate_v1
dimensions:
  statement_form:
    description: 整表 TRUNCATE 或 ALTER TABLE TRUNCATE PARTITION。
    default_value_id: tr_form_full
    classes:
      - id: tr_form_class
        meaning: 选择两个顶层产生式之一。
        values:
          - {id: tr_form_full, render: "", representative: true, validity: valid, fact_refs: [tr_fact_full_grammar]}
          - {id: tr_form_partition, render: "", representative: true, validity: valid, fact_refs: [tr_fact_partition_grammar]}
  table_keyword:
    description: 整表形式的可选 TABLE 关键字。
    default_value_id: tr_table_keyword_absent
    classes:
      - id: tr_table_keyword_class
        meaning: 省略或显式 TABLE。
        values:
          - {id: tr_table_keyword_absent, render: "", representative: true, validity: valid}
          - {id: tr_table_keyword_present, render: "TABLE ", representative: true, validity: valid, fact_refs: [tr_fact_full_grammar]}
  full_scope:
    description: 整表形式是否声明 ONLY。
    default_value_id: tr_scope_all
    classes:
      - id: tr_scope_class
        meaning: 省略时包含子表，ONLY 只清空指定表。
        values:
          - {id: tr_scope_all, render: "", representative: true, validity: valid, fact_refs: [tr_fact_only_scope]}
          - {id: tr_scope_only, render: "ONLY ", representative: true, validity: valid, fact_refs: [tr_fact_only_scope]}
  full_table_profile:
    description: 整表产生式的有限 repeat 目标能力。
    default_value_id: tr_table_regular
    profile_source: {matrix_ref: matrix_truncate_full_targets, profile_id_path: profiles.id}
  identity_clause:
    description: 省略或显式 CONTINUE IDENTITY；两者均不改变序列。
    default_value_id: tr_identity_default
    classes:
      - id: tr_identity_class
        meaning: CONTINUE IDENTITY 是默认行为。
        values:
          - {id: tr_identity_default, render: "", representative: true, validity: valid, fact_refs: [tr_fact_continue_identity]}
          - {id: tr_identity_continue, render: " CONTINUE IDENTITY", representative: true, validity: valid, fact_refs: [tr_fact_continue_identity]}
  dependency_clause:
    description: 省略、CASCADE 或 RESTRICT。
    default_value_id: tr_dependency_default
    classes:
      - id: tr_dependency_restrict_class
        meaning: 省略或显式 RESTRICT，外键引用时拒绝。
        values:
          - {id: tr_dependency_default, render: "", representative: true, validity: valid, fact_refs: [tr_fact_dependency_modes]}
          - {id: tr_dependency_restrict, render: " RESTRICT", representative: false, validity: valid, fact_refs: [tr_fact_dependency_modes]}
      - id: tr_dependency_cascade_class
        meaning: 级联清空加入组中的表。
        values:
          - {id: tr_dependency_cascade, render: " CASCADE", representative: true, validity: valid, fact_refs: [tr_fact_dependency_modes]}
  purge_clause:
    description: 回收站默认或 PURGE 直接清理。
    default_value_id: tr_purge_absent
    classes:
      - id: tr_purge_class
        meaning: 整表清理的回收站选项。
        values:
          - {id: tr_purge_absent, render: "", representative: true, validity: valid}
          - {id: tr_purge_present, render: " PURGE", representative: true, validity: valid, fact_refs: [tr_fact_purge]}
  partition_if_exists:
    description: 分区形式语法中的可选 IF EXISTS；不存在表行为未由本章解释。
    default_value_id: tr_partition_if_absent
    classes:
      - id: tr_partition_if_class
        meaning: 只在已存在 fixture 上做语法覆盖。
        values:
          - {id: tr_partition_if_absent, render: "", representative: true, validity: valid}
          - {id: tr_partition_if_present, render: "IF EXISTS ", representative: true, validity: valid, fact_refs: [tr_fact_partition_grammar, tr_open_partition_if_exists_behavior]}
  partition_table_profile:
    description: ALTER TABLE 产生式明列的四种目标形式。
    default_value_id: tr_partition_table_plain
    profile_source: {matrix_ref: matrix_truncate_partition_targets, profile_id_path: profiles.id}
  partition_selector:
    description: 通过分区名或 FOR 值定位。
    default_value_id: tr_partition_by_name
    classes:
      - id: tr_partition_selector_class
        meaning: 两种互斥分区定位形式。
        values:
          - {id: tr_partition_by_name, render: "", representative: true, validity: valid, fact_refs: [tr_fact_partition_name]}
          - {id: tr_partition_by_values, render: "", representative: true, validity: valid, fact_refs: [tr_fact_partition_value]}
  partition_name:
    description: fixture 中已存在的分区名代表值。
    default_value_id: tr_partition_name_low
    classes:
      - id: tr_partition_name_class
        meaning: 现有分区名。
        values:
          - {id: tr_partition_name_low, render: "p_low", representative: true, validity: valid, fact_refs: [tr_fact_partition_name]}
  partition_value_profile:
    description: PARTITION FOR 的一值可执行代表；两值候选等待真实双列分区 fixture。
    default_value_id: tr_partition_values_one
    profile_source: {matrix_ref: matrix_truncate_partition_values, profile_id_path: profiles.id}
  update_global_index:
    description: 省略导致全局索引失效，声明时更新全部全局索引。
    default_value_id: tr_update_index_absent
    classes:
      - id: tr_update_index_class
        meaning: 分区清理后的全局索引处理。
        values:
          - {id: tr_update_index_absent, render: "", representative: true, validity: valid, fact_refs: [tr_fact_update_global_index]}
          - {id: tr_update_index_present, render: " UPDATE GLOBAL INDEX", representative: true, validity: valid, fact_refs: [tr_fact_update_global_index]}
rules:
  - id: tr_rule_restrict_requires_no_foreign_key
    kind: requires
    expression: statement_form != 'tr_form_full' or dependency_clause == 'tr_dependency_cascade' or full_table_profile.properties.has_fk_reference == False
    severity: error
    fact_refs: [tr_fact_dependency_modes]
structural_checks: []
facts:
  - {id: tr_fact_purpose, type: syntax, statement: "TRUNCATE 快速删除表中所有行。", status: confirmed, source_anchor: "L5"}
  - {id: tr_fact_delete_equivalence, type: behavior_oracle, statement: "TRUNCATE TABLE 与无 WHERE DELETE 均删除全部行。", status: confirmed, source_anchor: "L6-L7,L13-L14"}
  - {id: tr_fact_no_scan_performance, type: behavior_oracle, statement: "TRUNCATE 不扫描表，在大表上比无条件 DELETE 快。", status: confirmed, source_anchor: "L6-L8"}
  - {id: tr_fact_permissions, type: environment, statement: "表 Owner、表 TRUNCATE 权限、TRUNCATE ANY TABLE 权限或三权分立关闭时的系统管理员可执行。", status: confirmed, source_anchor: "L10-L12"}
  - {id: tr_fact_logging_behavior, type: behavior_oracle, statement: "DELETE 逐行删除并记录，TRUNCATE 释放数据页且日志只记录页释放。", status: confirmed, source_anchor: "L15-L18"}
  - {id: tr_fact_statement_differences, type: behavior_oracle, statement: "TRUNCATE 删除内容并释放空间但保留定义；DELETE 保留定义和空间；DROP 删除内容、定义并释放空间。", status: confirmed, source_anchor: "L19-L22"}
  - {id: tr_fact_full_grammar, type: syntax, statement: "整表 TRUNCATE 支持 TABLE、ONLY、带可选星号的表列表、CONTINUE IDENTITY、CASCADE/RESTRICT 和 PURGE。", status: confirmed, source_anchor: "L25-L27"}
  - {id: tr_open_table_list_unbounded, type: open_question, statement: "整表 [, ...] 为无界列表，V1 repeat 本轮只提供一表与两表代表 profile。", status: needs_verification, source_anchor: "L26-L27"}
  - {id: tr_open_star_semantics, type: open_question, statement: "产生式允许每个 table_name 后跟 *，但参数说明未独立解释 * 或其与 ONLY 同时出现时的行为。", status: needs_verification, source_anchor: "L26,L43-L45"}
  - {id: tr_fact_partition_grammar, type: syntax, statement: "ALTER TABLE TRUNCATE PARTITION 支持 IF EXISTS、四种表目标、分区名/FOR 值和 UPDATE GLOBAL INDEX。", status: confirmed, source_anchor: "L32-L37"}
  - {id: tr_open_partition_if_exists_behavior, type: open_question, statement: "分区产生式列出 IF EXISTS，但本章未说明表不存在时的 NOTICE/ERROR 与分区定位行为。", status: needs_verification, source_anchor: "L33-L37"}
  - {id: tr_open_partition_values_unbounded, type: open_question, statement: "PARTITION FOR 值列表为 [, ...] 无界域，本包只生成一值可执行代表；两值及更长列表等待真实多列分区 fixture，不推断本章未给出的建表语义。", status: needs_verification, source_anchor: "L36-L37,L60-L63"}
  - {id: tr_fact_only_scope, type: behavior_oracle, statement: "ONLY 只清空指定表；省略时同时清空全部子表。", status: confirmed, source_anchor: "L43-L45"}
  - {id: tr_fact_table_name, type: syntax, statement: "目标表名可模式限定且必须已存在。", status: confirmed, source_anchor: "L46-L48"}
  - {id: tr_fact_continue_identity, type: behavior_oracle, statement: "CONTINUE IDENTITY 不改变序列值且为默认。", status: confirmed, source_anchor: "L49-L50"}
  - {id: tr_fact_dependency_modes, type: constraint, statement: "CASCADE 级联清空加入组中的表，RESTRICT 在外键引用存在时拒绝且为默认。", status: confirmed, source_anchor: "L52-L54"}
  - {id: tr_open_restrict_error_identity, type: open_question, statement: "本章确认 RESTRICT 应拒绝，但未提供 SQLSTATE 或稳定错误文本。", status: needs_verification, source_anchor: "L52-L54"}
  - {id: tr_fact_purge, type: lifecycle, statement: "默认把表数据放入回收站，PURGE 直接清理。", status: confirmed, source_anchor: "L55-L56"}
  - {id: tr_fact_partition_name, type: syntax, statement: "partition_name 必须是已存在分区名。", status: confirmed, source_anchor: "L57-L59"}
  - {id: tr_fact_partition_value, type: constraint, statement: "PARTITION FOR 的分区键值组须唯一确定一个目标分区。", status: confirmed, source_anchor: "L60-L63"}
  - {id: tr_fact_partition_for_behavior, type: behavior_oracle, statement: "PARTITION FOR 清空指定值所在的整个分区。", status: confirmed, source_anchor: "L68-L69"}
  - {id: tr_fact_update_global_index, type: behavior_oracle, statement: "UPDATE GLOBAL INDEX 更新全部全局索引并保持查询正确；省略时全部全局索引失效。", status: confirmed, source_anchor: "L70-L72"}
  - {id: tr_fact_example_full_table, type: example, statement: "示例显示 DELETE 后 reason 仍为 8192 bytes，而 TRUNCATE 后为 0 bytes。", status: confirmed, source_anchor: "L75-L125"}
  - {id: tr_fact_example_partition, type: example, statement: "示例清空命名分区并更新全局索引，随后清空整个分区表。", status: confirmed, source_anchor: "L127-L156"}
