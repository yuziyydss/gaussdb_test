schema_version: 1
kind: fixture
id: fixture_truncate_multi
name: TRUNCATE 两表目标
status: ready
description: 为逗号列表提供两个独立且有数据的已存在表。
factor_ref: truncate
provides:
  tables:
    - {name: t_tr_one, persistence: permanent, table_kind: regular, columns: [{name: id, type: INTEGER, nullable: false}]}
    - {name: t_tr_two, persistence: permanent, table_kind: regular, columns: [{name: id, type: INTEGER, nullable: false}]}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls: [DROP TABLE IF EXISTS t_tr_one CASCADE;, DROP TABLE IF EXISTS t_tr_two CASCADE;, CREATE TABLE t_tr_one (id INTEGER NOT NULL);, CREATE TABLE t_tr_two (id INTEGER NOT NULL);, INSERT INTO t_tr_one VALUES (1);, INSERT INTO t_tr_two VALUES (2);]
  teardown_sqls: [DROP TABLE IF EXISTS t_tr_two CASCADE;, DROP TABLE IF EXISTS t_tr_one CASCADE;]
  note: 显式生命周期允许分别种子两张表。
