schema_version: 1
kind: fixture
id: fixture_truncate_foreign_key
name: TRUNCATE 外键引用目标
status: ready
description: 为 CASCADE 正向和 RESTRICT 目标负向准备有效外键关系。
factor_ref: truncate
provides:
  tables:
    - {name: t_tr_fk_parent, persistence: permanent, table_kind: regular, columns: [{name: id, type: INTEGER, nullable: false}]}
    - {name: t_tr_fk_child, persistence: permanent, table_kind: regular, columns: [{name: id, type: INTEGER, nullable: false}, {name: parent_id, type: INTEGER, nullable: true}]}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP TABLE IF EXISTS t_tr_fk_child CASCADE;
    - DROP TABLE IF EXISTS t_tr_fk_parent CASCADE;
    - CREATE TABLE t_tr_fk_parent (id INTEGER PRIMARY KEY);
    - CREATE TABLE t_tr_fk_child (id INTEGER, parent_id INTEGER REFERENCES t_tr_fk_parent(id));
    - INSERT INTO t_tr_fk_parent VALUES (1);
    - INSERT INTO t_tr_fk_child VALUES (1, 1);
  teardown_sqls:
    - DROP TABLE IF EXISTS t_tr_fk_child CASCADE;
    - DROP TABLE IF EXISTS t_tr_fk_parent CASCADE;
  note: setup 成功后目标错误只能来自 TRUNCATE 的外键 RESTRICT 检查。
