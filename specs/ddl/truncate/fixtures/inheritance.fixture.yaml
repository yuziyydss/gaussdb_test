schema_version: 1
kind: fixture
id: fixture_truncate_inheritance
name: TRUNCATE 继承父子表
status: ready
description: 为 ONLY、省略 ONLY 与星号语法准备父表和直接子表。
factor_ref: truncate
provides:
  tables:
    - {name: t_tr_parent, persistence: permanent, table_kind: regular, columns: [{name: id, type: INTEGER, nullable: false}]}
    - {name: t_tr_child, persistence: permanent, table_kind: regular, columns: [{name: id, type: INTEGER, nullable: false}]}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls: [DROP TABLE IF EXISTS t_tr_child CASCADE;, DROP TABLE IF EXISTS t_tr_parent CASCADE;, CREATE TABLE t_tr_parent (id INTEGER NOT NULL);, CREATE TABLE t_tr_child () INHERITS (t_tr_parent);, INSERT INTO t_tr_parent VALUES (1);, INSERT INTO t_tr_child VALUES (2);]
  teardown_sqls: [DROP TABLE IF EXISTS t_tr_child CASCADE;, DROP TABLE IF EXISTS t_tr_parent CASCADE;]
  note: 星号与 ONLY 行为只在 planned scenario 中断言。
