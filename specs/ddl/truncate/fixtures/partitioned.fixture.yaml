schema_version: 1
kind: fixture
id: fixture_truncate_partitioned
name: TRUNCATE 单列范围分区表
status: ready
description: 为命名分区、单值 PARTITION FOR 和四种表目标形式提供 p_low。
factor_ref: truncate
provides:
  tables:
    - name: t_tr_partitioned
      persistence: permanent
      table_kind: partitioned
      columns:
        - {name: id, type: INTEGER, nullable: true}
        - {name: note, type: VARCHAR(32), nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP TABLE IF EXISTS t_tr_partitioned CASCADE;
    - CREATE TABLE t_tr_partitioned (id INTEGER, note VARCHAR(32)) PARTITION BY RANGE (id) (PARTITION p_low VALUES LESS THAN (10), PARTITION p_max VALUES LESS THAN (MAXVALUE));
    - INSERT INTO t_tr_partitioned VALUES (1, 'low'), (11, 'high');
  teardown_sqls: [DROP TABLE IF EXISTS t_tr_partitioned CASCADE;]
  note: p_low 与 FOR (1) 均唯一定位首分区。
