schema_version: 1
kind: matrix
id: matrix_truncate_partition_targets
name: TRUNCATE PARTITION 表目标形式
status: ready
description: 完整列出产生式中的普通、ONLY 前缀、星号和 ONLY 括号形式。
factor_ref: truncate
profiles:
  - id: tr_partition_table_two_owned
    render: g_tr_two_ns.target_table
    validity: valid
    fixture_refs: [fixture_truncate_two_keys]
    properties:
      source_tables: [g_tr_two_ns.target_table]
      target_form: plain
      partition_selector_contract: integer_range_key_shape
      partition_keys: [id, qty]
    fact_refs: [tr_fact_partition_grammar, create_table_partition::create_table_partition_fact_body_496, create_table_partition::create_table_partition_fact_body_500, create_table_partition::create_table_partition_fact_body_526, create_table_partition::create_table_partition_fact_body_536]
  - id: tr_partition_table_plain
    render: t_tr_partitioned
    validity: valid
    fixture_refs: [fixture_truncate_partitioned]
    properties: {source_tables: [t_tr_partitioned], target_form: plain}
    fact_refs: [tr_fact_partition_grammar]
  - id: tr_partition_table_only_prefix
    render: ONLY t_tr_partitioned
    validity: valid
    fixture_refs: [fixture_truncate_partitioned]
    properties: {source_tables: [t_tr_partitioned], target_form: only_prefix}
    fact_refs: [tr_fact_partition_grammar]
  - id: tr_partition_table_star
    render: t_tr_partitioned *
    validity: valid
    fixture_refs: [fixture_truncate_partitioned]
    properties: {source_tables: [t_tr_partitioned], target_form: star}
    fact_refs: [tr_fact_partition_grammar, tr_open_star_semantics]
  - id: tr_partition_table_only_paren
    render: ONLY (t_tr_partitioned)
    validity: valid
    fixture_refs: [fixture_truncate_partitioned]
    properties: {source_tables: [t_tr_partitioned], target_form: only_parenthesized}
    fact_refs: [tr_fact_partition_grammar]
documented_features:
  - {id: tr_feature_partition_target_forms, profile_refs: [tr_partition_table_plain, tr_partition_table_only_prefix, tr_partition_table_star, tr_partition_table_only_paren], status: covered, coverage_mode: all, fact_refs: [tr_fact_partition_grammar]}
fact_refs: [tr_fact_partition_grammar, tr_fact_partition_value, tr_open_star_semantics]
