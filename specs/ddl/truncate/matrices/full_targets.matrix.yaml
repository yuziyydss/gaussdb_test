schema_version: 1
kind: matrix
id: matrix_truncate_full_targets
name: TRUNCATE 整表有限目标列表
status: needs_review
description: 保存单表、模式限定、两表、继承星号和外键组的有限 repeat items。
factor_ref: truncate
profile_property_defaults: {has_fk_reference: false, inheritance_target: false, uses_star: false}
profiles:
  - id: tr_table_regular
    render: ""
    validity: valid
    fixture_refs: [fixture_truncate_regular]
    properties: {items: [t_tr_regular], source_tables: [t_tr_regular], has_fk_reference: false}
    fact_refs: [tr_fact_full_grammar, tr_fact_table_name]
  - id: tr_table_schema_qualified
    render: ""
    validity: valid
    fixture_refs: [fixture_truncate_schema_qualified]
    properties: {items: [tr_fixture_schema.t_tr_regular], source_tables: [tr_fixture_schema.t_tr_regular], has_fk_reference: false}
    fact_refs: [tr_fact_table_name]
  - id: tr_table_two
    render: ""
    validity: valid
    fixture_refs: [fixture_truncate_multi]
    properties: {items: [t_tr_one, t_tr_two], source_tables: [t_tr_one, t_tr_two], has_fk_reference: false}
    fact_refs: [tr_fact_full_grammar]
  - id: tr_table_inheritance_parent
    render: ""
    validity: valid
    fixture_refs: [fixture_truncate_inheritance]
    properties: {items: [t_tr_parent], source_tables: [t_tr_parent], has_fk_reference: false, inheritance_target: true, uses_star: false}
    fact_refs: [tr_fact_only_scope]
  - id: tr_table_inheritance_star
    render: ""
    validity: valid
    fixture_refs: [fixture_truncate_inheritance]
    properties: {items: ["t_tr_parent *"], source_tables: [t_tr_parent], has_fk_reference: false, inheritance_target: true, uses_star: true}
    fact_refs: [tr_fact_full_grammar, tr_open_star_semantics]
  - id: tr_table_fk_parent
    render: ""
    validity: valid
    fixture_refs: [fixture_truncate_foreign_key]
    properties: {items: [t_tr_fk_parent], source_tables: [t_tr_fk_parent], has_fk_reference: true}
    fact_refs: [tr_fact_dependency_modes]
documented_features:
  - {id: tr_feature_single_table, profile_refs: [tr_table_regular], status: covered, fact_refs: [tr_fact_full_grammar]}
  - {id: tr_feature_schema_qualified, profile_refs: [tr_table_schema_qualified], status: covered, fact_refs: [tr_fact_table_name]}
  - {id: tr_feature_two_table_representative, profile_refs: [tr_table_two], status: covered, coverage_mode: representative, fact_refs: [tr_fact_full_grammar]}
  - {id: tr_feature_unbounded_table_list, status: needs_profile, fact_refs: [tr_open_table_list_unbounded]}
  - {id: tr_feature_inheritance_and_star, profile_refs: [tr_table_inheritance_parent, tr_table_inheritance_star], status: covered, coverage_mode: representative, fact_refs: [tr_fact_only_scope, tr_open_star_semantics]}
  - {id: tr_feature_fk_group, profile_refs: [tr_table_fk_parent], status: covered, fact_refs: [tr_fact_dependency_modes]}
fact_refs: [tr_fact_full_grammar, tr_fact_table_name, tr_fact_only_scope, tr_fact_dependency_modes, tr_open_table_list_unbounded, tr_open_star_semantics]
