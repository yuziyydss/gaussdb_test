facts:
  -
    id: "create_table_subpartition_fact_body_5"
    type: "constraint"
    statement: "创建二级分区表。"
    status: "confirmed"
    source_anchor: "L5-L10"
  -
    id: "create_table_subpartition_fact_body_5_1"
    type: "constraint"
    statement: "分区表是把逻辑上的一张表根据某种方案分成几张物理块进行存 储，这张逻辑上的表称之为分区表，物理块称之为分区。"
    status: "confirmed"
    source_anchor: "L5-L10"
  -
    id: "create_table_subpartition_fact_body_5_2"
    type: "constraint"
    statement: "分区表是一张逻辑表，不存 储数据，数据实际是存储在分区上的。"
    status: "confirmed"
    source_anchor: "L5-L10"
  -
    id: "create_table_subpartition_fact_body_5_3"
    type: "constraint"
    statement: "对于二级分区表，顶层节点表和一级分区都是 逻辑表，不存储数据，只有二级分区（叶子节点）存储数据。"
    status: "confirmed"
    source_anchor: "L5-L10"
  -
    id: "create_table_subpartition_fact_body_5_4"
    type: "constraint"
    statement: "二级分区表的分区方案是由两个一级分区的分区方案组合而来的，一级分区的分区方 案请参见CREATE TABLE PARTITION章节。"
    status: "confirmed"
    source_anchor: "L5-L10"
  -
    id: "create_table_subpartition_fact_body_12"
    type: "constraint"
    statement: "常见的二级分区表组合方案有Range-Range分区、Range-List分区、Range-Hash分 区、List-Range分区、List-List分区、List-Hash分区、Hash-Range分区、Hash-List分 区、Hash-Hash分区等。"
    status: "confirmed"
    source_anchor: "L12-L14"
  -
    id: "create_table_subpartition_fact_body_12_1"
    type: "constraint"
    statement: "目前二级分区仅支持行存表。"
    status: "confirmed"
    source_anchor: "L12-L14"
  -
    id: "create_table_subpartition_fact_body_17"
    type: "constraint"
    statement: "●    二级分区表有两个分区键，对于Range/List分区键只能支持16列，对于Hash分区 键只能支持1列。"
    status: "confirmed"
    source_anchor: "L17-L18"
  -
    id: "create_table_subpartition_fact_body_19"
    type: "constraint"
    statement: "●    唯一约束和主键约束的约束键包含所有分区键将为约束创建LOCAL索引，否则创 建GLOBAL索引。"
    status: "confirmed"
    source_anchor: "L19-L20"
  -
    id: "create_table_subpartition_fact_body_19_1"
    type: "constraint"
    statement: "如果指定创建LOCAL唯一索引，必须包含所有分区键。"
    status: "confirmed"
    source_anchor: "L19-L20"
  -
    id: "create_table_subpartition_fact_body_21"
    type: "behavior_oracle"
    statement: "●    创建二级分区表时，如果在其一级分区下不显示指定二级分区，会自动创建一个 同范围的二级分区。"
    status: "confirmed"
    source_anchor: "L21-L22"
  -
    id: "create_table_subpartition_fact_body_23"
    type: "behavior_oracle"
    statement: "●    单个表的最大分区数为1048575（包括一级分区和二级分区）。"
    status: "confirmed"
    source_anchor: "L23-L25"
  -
    id: "create_table_subpartition_fact_body_23_1"
    type: "behavior_oracle"
    statement: "在默认配置下， 建议单个表的分区数不超过400个。"
    status: "confirmed"
    source_anchor: "L23-L25"
  -
    id: "create_table_subpartition_fact_body_23_2"
    type: "behavior_oracle"
    statement: "具体可参考《开发指南》中“特性使用指导 > 分区表 > 分区表介绍 > 分区基本使用 > 创建分区表”章节。"
    status: "confirmed"
    source_anchor: "L23-L25"
  -
    id: "create_table_subpartition_fact_body_26"
    type: "constraint"
    statement: "●    二级分区表只支持行存，不支持hashbucket。"
    status: "confirmed"
    source_anchor: "L26-L26"
  -
    id: "create_table_subpartition_fact_body_27"
    type: "constraint"
    statement: "●    不支持在rowid/rowno系统列上创建外键约束。"
    status: "confirmed"
    source_anchor: "L27-L27"
  -
    id: "create_table_subpartition_fact_body_28"
    type: "constraint"
    statement: "●    不支持cluster。"
    status: "confirmed"
    source_anchor: "L28-L28"
  -
    id: "create_table_subpartition_fact_body_29"
    type: "behavior_oracle"
    statement: "●    在进行指定分区的查询时，如SELECT * FROM tablename PARTITION/ SUBPARTITION (partitionname)。"
    status: "confirmed"
    source_anchor: "L29-L32"
  -
    id: "create_table_subpartition_fact_body_29_1"
    type: "behavior_oracle"
    statement: "请注意，关键字PARTITION和SUBPARTITION 必须准确无误，如果拼写错误，查询不会报错，但这时查询会变为使用别名进行 查询，而非指定分区的查询。"
    status: "confirmed"
    source_anchor: "L29-L32"
  -
    id: "create_table_subpartition_fact_body_33"
    type: "constraint"
    statement: "●    不支持密态数据库、账本数据库和行级访问控制。"
    status: "confirmed"
    source_anchor: "L33-L33"
  -
    id: "create_table_subpartition_fact_body_34"
    type: "constraint"
    statement: "●    对于二级分区表PARTITION/SUBPARTITION FOR (VALUES)语法，VALUES只能是 常量。"
    status: "confirmed"
    source_anchor: "L34-L35"
  -
    id: "create_table_subpartition_fact_body_36"
    type: "constraint"
    statement: "●    对于二级分区表PARTITION/SUBPARTITION FOR (VALUES)语法，VALUES在需要 数据类型转换时，建议使用强制类型转换，以防隐式类型转换结果与预期不符。"
    status: "confirmed"
    source_anchor: "L36-L37"
  -
    id: "create_table_subpartition_fact_body_38"
    type: "constraint"
    statement: "●    创建二级分区表时，RANGE策略的分区定义是VALUES LESS THAN (val1_1)， LIST策略的分区定义是VALUES (val1[, …])，HASH策略的分区无VALUES定义。"
    status: "confirmed"
    source_anchor: "L38-L39"
  -
    id: "create_table_subpartition_fact_body_40"
    type: "constraint"
    statement: "●    在为数据对象增加或者变更ILM策略的时候，如果追加了行级表达式，需要注意行 表达式目前只支持白名单中列出的函数。"
    status: "confirmed"
    source_anchor: "L40-L42"
  -
    id: "create_table_subpartition_fact_body_40_1"
    type: "constraint"
    statement: "具体白名单函数列表请参见行表达式函 数白名单。"
    status: "confirmed"
    source_anchor: "L40-L42"
  -
    id: "create_table_subpartition_fact_body_45"
    type: "environment"
    statement: "在ILM策略的ON(EXPR)行级表达式支持的函数中，有部分函数的输出可能会受兼容性参数 影响。"
    status: "confirmed"
    source_anchor: "L45-L47"
  -
    id: "create_table_subpartition_fact_body_45_1"
    type: "environment"
    statement: "例如，upper函数在B兼容模式下设置b_format_version='5.7'和 b_format_dev_version='s2'后，将无法转大写。"
    status: "confirmed"
    source_anchor: "L45-L47"
