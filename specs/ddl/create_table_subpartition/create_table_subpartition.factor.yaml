    source_anchor: "L551-L554"
  -
    id: "create_table_subpartition_fact_body_555"
    type: "behavior_oracle"
    statement: "–   GENERATED ALWAYS AS IDENTITY：该列仅接受插入由序列生成器提供的 IDENTITY值，不能接受用户指定值。"
    status: "confirmed"
    source_anchor: "L555-L556"
  -
    id: "create_table_subpartition_fact_body_557"
    type: "behavior_oracle"
    statement: "–   GENERATED BY DEFAULT AS IDENTITY：该列优先插入用户提供值，若用户 不指定值，将插入由序列生成器提供的IDENTITY值。"
    status: "confirmed"
    source_anchor: "L557-L558"
  -
    id: "create_table_subpartition_fact_body_559"
    type: "behavior_oracle"
    statement: "–   GENERATED BY DEFAULT ON NULL AS IDENTITY：该列优先插入用户提供 值，若用户指定NULL值或用户不指定值，将插入由序列生成器提供的 IDENTITY值。"
    status: "confirmed"
    source_anchor: "L559-L561"
  -
    id: "create_table_subpartition_fact_body_563"
    type: "constraint"
    statement: "可选的identity_options子句可用于覆盖序列选项。"
    status: "confirmed"
    source_anchor: "L563-L563"
  -
    id: "create_table_subpartition_fact_body_564"
    type: "behavior_oracle"
    statement: "–   increment：指定隐式序列步长。"
    status: "confirmed"
    source_anchor: "L564-L565"
  -
    id: "create_table_subpartition_fact_body_564_1"
    type: "behavior_oracle"
    statement: "为正数时将生成一个递增的序列，为负数时 将生成一个递减的序列，缺省值为1。"
    status: "confirmed"
    source_anchor: "L564-L565"
  -
    id: "create_table_subpartition_fact_body_566"
    type: "behavior_oracle"
    statement: "–   MINVALUE minvalue | NO MINVALUE | NOMINVALUE：执行序列的最小 值，如果没有声明minvalue或者声明了NO MINVALUE，则递增序序列缺省 值为1，递减序列的缺省值为-10^27+1。"
    status: "confirmed"
    source_anchor: "L566-L569"
  -
    id: "create_table_subpartition_fact_body_566_1"
    type: "behavior_oracle"
    statement: "NOMINVALUE等价于NO MINVALUE。"
    status: "confirmed"
    source_anchor: "L566-L569"
  -
    id: "create_table_subpartition_fact_body_570"
    type: "behavior_oracle"
    statement: "–   MAXVALUE maxvalue | NO MAXVALUE | NOMAXVALUE：执行序列的最大 值，如果没有声明maxvalue或者声明了NO MAXVALUE，则递增序序列缺省 值为10^28-1，递减序列的缺省值为-1。"
    status: "confirmed"
    source_anchor: "L570-L573"
  -
    id: "create_table_subpartition_fact_body_570_1"
    type: "behavior_oracle"
    statement: "NOMAXVALUE等价于NO MAXVALUE。"
    status: "confirmed"
    source_anchor: "L570-L573"
  -
    id: "create_table_subpartition_fact_body_574"
    type: "behavior_oracle"
    statement: "–   start：指定隐式序列的起始值。"
    status: "confirmed"
    source_anchor: "L574-L575"
  -
    id: "create_table_subpartition_fact_body_574_1"
    type: "behavior_oracle"
    statement: "缺省值：对于递增序列为minvalue，递减序 列为maxvalue。"
    status: "confirmed"
    source_anchor: "L574-L575"
  -
    id: "create_table_subpartition_fact_body_576"
    type: "behavior_oracle"
    statement: "–   cache：为了快速访问，而在内存中预先存储序列号的个数。"
    status: "confirmed"
    source_anchor: "L576-L577"
  -
    id: "create_table_subpartition_fact_body_576_1"
    type: "behavior_oracle"
    statement: "缺省值为1，表 示一次只能生成一个值，即没有缓存。"
    status: "confirmed"
    source_anchor: "L576-L577"
  -
    id: "create_table_subpartition_fact_body_578"
    type: "constraint"
    statement: "–   NOCACHE：未预先存储序列的值。"
    status: "confirmed"
    source_anchor: "L578-L578"
  -
    id: "create_table_subpartition_fact_body_579"
    type: "behavior_oracle"
    statement: "–   CYCLE：用于使序列达到maxvalue或者minvalue后可循环并继续下去。"
    status: "confirmed"
    source_anchor: "L579-L581"
  -
    id: "create_table_subpartition_fact_body_579_1"
    type: "behavior_oracle"
    statement: "如果 声明了NO CYCLE，则在序列达到其最大或最小值之后任何对nextval的调用 都会返回一个错误。"
    status: "confirmed"
    source_anchor: "L579-L581"
  -
    id: "create_table_subpartition_fact_body_579_2"
    type: "behavior_oracle"
    statement: "NOCYCLE等价于NO CYCLE，缺省值为NO CYCLE。"
    status: "confirmed"
    source_anchor: "L579-L581"
  -
    id: "create_table_subpartition_fact_body_582"
    type: "behavior_oracle"
    statement: "–   SCALE：用于启用序列的可伸缩性。"
    status: "confirmed"
    source_anchor: "L582-L584"
  -
    id: "create_table_subpartition_fact_body_582_1"
    type: "behavior_oracle"
    statement: "如果指定，则会在序列的开头附加一个 数字偏移量，防止生成值中有重复项。"
    status: "confirmed"
    source_anchor: "L582-L584"
  -
    id: "create_table_subpartition_fact_body_582_2"
    type: "behavior_oracle"
    statement: "如果声明了NOSCALE，则禁止序列的 可伸缩性。"
    status: "confirmed"
    source_anchor: "L582-L584"
  -
    id: "create_table_subpartition_fact_body_582_3"
    type: "behavior_oracle"
    statement: "缺省值为NOSCALE。"
    status: "confirmed"
    source_anchor: "L582-L584"
  -
    id: "create_table_subpartition_fact_body_585"
    type: "behavior_oracle"
    statement: "–   EXTEND：扩展数字偏移量长度（默认值为6），将序列生成值对齐到x（默 认为6）+y（最大位数）位，指定EXTEND时必须指定SCALE。"
    status: "confirmed"
    source_anchor: "L585-L587"
  -
    id: "create_table_subpartition_fact_body_585_1"
    type: "behavior_oracle"
    statement: "如果声明了 NOEXTEND，则不扩展数字偏移量长度。"
    status: "confirmed"
    source_anchor: "L585-L587"
  -
    id: "create_table_subpartition_fact_body_585_2"
    type: "behavior_oracle"
    statement: "缺省值为NOEXTEND。"
    status: "confirmed"
    source_anchor: "L585-L587"
  -
    id: "create_table_subpartition_fact_body_590"
    type: "constraint"
    statement: "● IDENTITY列只能为smallint、integer、bigint、decimal、numeric、float、double precision或real数字类型。"
    status: "confirmed"
    source_anchor: "L590-L591"
  -
    id: "create_table_subpartition_fact_body_592"
    type: "environment"
    statement: "● 在A兼容模式下，当创建IDENTITY列为整数数字类型时，将默认创建为numeric数字类 型。"
    status: "confirmed"
    source_anchor: "L592-L593"
  -
    id: "create_table_subpartition_fact_body_594"
    type: "constraint"
    statement: "● 修改IDENTITY列的字段类型和普通列相同，但仅限于修改为smallint、integer、 bigint、decimal、numeric、float、double precision和real数字类型。"
    status: "confirmed"
    source_anchor: "L594-L595"
  -
    id: "create_table_subpartition_fact_body_596"
    type: "behavior_oracle"
    statement: "● IDENTITY列默认有NOT NULL约束。"
    status: "confirmed"
    source_anchor: "L596-L596"
  -
    id: "create_table_subpartition_fact_body_597"
    type: "constraint"
    statement: "● 一张表里只允许有一个IDENTITY列。"
    status: "confirmed"
    source_anchor: "L597-L597"
  -
    id: "create_table_subpartition_fact_body_598"
    type: "behavior_oracle"
    statement: "● 删除IDENTITY列的方法和删除普通列相同，删除列时，IDENTITY的隐式序列将会被自 动删除。"
    status: "confirmed"
    source_anchor: "L598-L599"
  -
    id: "create_table_subpartition_fact_body_600"
    type: "constraint"
    statement: "● IDENTITY列不能和SET DEFAULT动作同时指定。"
    status: "confirmed"
    source_anchor: "L600-L600"
  -
    id: "create_table_subpartition_fact_body_601"
    type: "behavior_oracle"
    statement: "● 自动创建的隐式序列的类型为LARGE SEQUENCE。"
    status: "confirmed"
    source_anchor: "L601-L601"
  -
    id: "create_table_subpartition_fact_body_602"
    type: "constraint"
    statement: "● 用户不能执行DROP LARGE SEQUENCE或ALTER LARGE SEQUENCE对IDENTITY的隐 式序列进行修改。"
    status: "confirmed"
    source_anchor: "L602-L603"
  -
    id: "create_table_subpartition_fact_body_604"
    type: "environment"
    statement: "● [ SCALE [ EXTEND | NOEXTEND ] | NOSCALE ]子句仅用于A兼容模式的集中式下创建 IDENTITY列时可用。"
    status: "confirmed"
    source_anchor: "L604-L605"
  -
    id: "create_table_subpartition_fact_body_606"
    type: "constraint"
    statement: "● 在全密态数据库下，不支持创建表时指定加密IDENTITY列。"
    status: "confirmed"
    source_anchor: "L606-L606"
  -
    id: "create_table_subpartition_fact_body_607"
    type: "behavior_oracle"
    statement: "●   AUTO_INCREMENT 指定列为自动增长列。"
    status: "confirmed"
    source_anchor: "L607-L609"
  -
    id: "create_table_subpartition_fact_body_607_1"
    type: "behavior_oracle"
    statement: "具体请参见CREATE TABLE章节中的AUTO_INCREMENT。"
    status: "confirmed"
    source_anchor: "L607-L609"
  -
    id: "create_table_subpartition_fact_body_611"
    type: "constraint"
    statement: "●   UNIQUE [KEY] index_parameters UNIQUE ( column_name [, ... ] ) index_parameters UNIQUE约束表示表里的一个字段或多个字段的组合必须在全表范围内唯一。"
    status: "confirmed"
    source_anchor: "L611-L615"
  -
    id: "create_table_subpartition_fact_body_611_1"
    type: "constraint"
    statement: "对于唯一约束，NULL被认为是互不相等的。"
    status: "confirmed"
    source_anchor: "L611-L615"
  -
    id: "create_table_subpartition_fact_body_611_2"
    type: "constraint"
    statement: "UNIQUE KEY只能在sql_compatibility='B'时使用，与UNIQUE语义相同。"
    status: "confirmed"
    source_anchor: "L611-L615"
  -
    id: "create_table_subpartition_fact_body_616"
    type: "constraint"
    statement: "●   PRIMARY KEY index_parameters PRIMARY KEY ( column_name [, ... ] ) index_parameters 主键约束声明表中的一个或者多个字段只能包含唯一的非NULL值。"
    status: "confirmed"
    source_anchor: "L616-L619"
  -
    id: "create_table_subpartition_fact_body_616_1"
    type: "constraint"
    statement: "一个表只能声明一个主键。"
    status: "confirmed"
    source_anchor: "L616-L619"
  -
    id: "create_table_subpartition_fact_body_620"
    type: "behavior_oracle"
    statement: "●   DEFERRABLE | NOT DEFERRABLE 这两个关键字用于设置约束是否可推迟。"
    status: "confirmed"
    source_anchor: "L620-L624"
  -
    id: "create_table_subpartition_fact_body_620_1"
    type: "behavior_oracle"
    statement: "不可推迟的约束将在每条命令执行后立 即检查。"
    status: "confirmed"
    source_anchor: "L620-L624"
  -
    id: "create_table_subpartition_fact_body_620_2"
    type: "behavior_oracle"
    statement: "可推迟约束可以延迟到事务结尾通过SET CONSTRAINTS命令检查，缺省 值为NOT DEFERRABLE。"
    status: "confirmed"
    source_anchor: "L620-L624"
  -
    id: "create_table_subpartition_fact_body_620_3"
    type: "behavior_oracle"
    statement: "目前UNIQUE约束、主键约束、外键约束可以接受该子 句，其他约束类型均不可推迟。"
    status: "confirmed"
    source_anchor: "L620-L624"
  -
    id: "create_table_subpartition_fact_body_625"
    type: "behavior_oracle"
    statement: "●   INITIALLY IMMEDIATE | INITIALLY DEFERRED 若约束可推迟，该子句声明检查约束的缺省时间。"
    status: "confirmed"
    source_anchor: "L625-L627"
  -
    id: "create_table_subpartition_fact_body_625_1"
    type: "behavior_oracle"
    statement: "不可推迟的约束始终为 INITIALLY IMMEDIATE且不可声明为INITIALLY DEFERRED。"
    status: "confirmed"
    source_anchor: "L625-L627"
  -
    id: "create_table_subpartition_fact_body_628"
    type: "behavior_oracle"
    statement: "–    如果约束是INITIALLY IMMEDIATE（缺省），则在每条语句执行后立即检 查。"
    status: "confirmed"
    source_anchor: "L628-L629"
  -
    id: "create_table_subpartition_fact_body_630"
    type: "constraint"
    statement: "–    如果约束是INITIALLY DEFERRED ，则仅在事务结束时进行检查。"
    status: "confirmed"
    source_anchor: "L630-L631"
  -
    id: "create_table_subpartition_fact_body_630_1"
    type: "constraint"
    statement: "约束检查的时间可以用SET CONSTRAINTS命令修改。"
    status: "confirmed"
    source_anchor: "L630-L631"
  -
    id: "create_table_subpartition_fact_body_632"
    type: "behavior_oracle"
    statement: "●   USING INDEX TABLESPACE tablespace_name 为UNIQUE或PRIMARY KEY约束相关的索引声明一个表空间。"
    status: "confirmed"
    source_anchor: "L632-L635"
  -
    id: "create_table_subpartition_fact_body_632_1"
    type: "behavior_oracle"
    statement: "如果没有提供这个 子句，这个索引将在default_tablespace中创建，如果default_tablespace为空， 将使用数据库的缺省表空间。"
    status: "confirmed"
    source_anchor: "L632-L635"
  -
    id: "create_table_subpartition_fact_body_636"
    type: "constraint"
    statement: "●   COLVIEW | NOCOLVIEW 声明表或分区加载IMCV或不加载IMCV，详情请参见《开发指南》中“特性使用 指导 > HTAP混合负载”章节。"
    status: "confirmed"
    source_anchor: "L636-L638"
