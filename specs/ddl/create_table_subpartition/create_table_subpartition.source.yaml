    id: "create_table_subpartition_su_body_12_12"
    section: "正文"
    source_anchor: "L12-L14"
    line_start: 12
    line_end: 14
    statement: "常见的二级分区表组合方案有Range-Range分区、Range-List分区、Range-Hash分 区、List-Range分区、List-List分区、List-Hash分区、Hash-Range分区、Hash-List分 区、Hash-Hash分区等。"
    status: "mapped"
    fact_refs:
      - "create_table_subpartition_fact_body_12"
      - "create_table_subpartition_fact_body_12_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "create_table_subpartition_su_body_17_17"
    section: "正文"
    source_anchor: "L17-L18"
    line_start: 17
    line_end: 18
    statement: "●    二级分区表有两个分区键，对于Range/List分区键只能支持16列，对于Hash分区 键只能支持1列。"
    status: "mapped"
    fact_refs:
      - "create_table_subpartition_fact_body_17"
    atomicity: "atomic"
  -
    id: "create_table_subpartition_su_body_19_19"
    section: "正文"
    source_anchor: "L19-L20"
    line_start: 19
    line_end: 20
    statement: "●    唯一约束和主键约束的约束键包含所有分区键将为约束创建LOCAL索引，否则创 建GLOBAL索引。"
    status: "mapped"
    fact_refs:
      - "create_table_subpartition_fact_body_19"
      - "create_table_subpartition_fact_body_19_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "create_table_subpartition_su_body_21_21"
    section: "正文"
    source_anchor: "L21-L22"
    line_start: 21
    line_end: 22
    statement: "●    创建二级分区表时，如果在其一级分区下不显示指定二级分区，会自动创建一个 同范围的二级分区。"
    status: "mapped"
    fact_refs:
      - "create_table_subpartition_fact_body_21"
    atomicity: "atomic"
  -
    id: "create_table_subpartition_su_body_23_23"
    section: "正文"
    source_anchor: "L23-L25"
    line_start: 23
    line_end: 25
    statement: "●    单个表的最大分区数为1048575（包括一级分区和二级分区）。"
    status: "mapped"
    fact_refs:
      - "create_table_subpartition_fact_body_23"
      - "create_table_subpartition_fact_body_23_1"
      - "create_table_subpartition_fact_body_23_2"
    atomicity: "grouped"
    independent_claim_count: 3
  -
    id: "create_table_subpartition_su_body_26_26"
    section: "正文"
    source_anchor: "L26-L26"
    line_start: 26
    line_end: 26
    statement: "●    二级分区表只支持行存，不支持hashbucket。"
    status: "mapped"
    fact_refs:
      - "create_table_subpartition_fact_body_26"
    atomicity: "atomic"
  -
    id: "create_table_subpartition_su_body_27_27"
    section: "正文"
    source_anchor: "L27-L27"
    line_start: 27
    line_end: 27
    statement: "●    不支持在rowid/rowno系统列上创建外键约束。"
    status: "mapped"
    fact_refs:
      - "create_table_subpartition_fact_body_27"
    atomicity: "atomic"
  -
