    section: "正文"
    source_anchor: "L28-L28"
    line_start: 28
    line_end: 28
    statement: "●    不支持cluster。"
    status: "mapped"
    fact_refs:
      - "create_table_subpartition_fact_body_28"
    atomicity: "atomic"
  -
    id: "create_table_subpartition_su_body_29_29"
    section: "正文"
    source_anchor: "L29-L32"
    line_start: 29
    line_end: 32
    statement: "●    在进行指定分区的查询时，如SELECT * FROM tablename PARTITION/ SUBPARTITION (partitionname)。"
    status: "mapped"
    fact_refs:
      - "create_table_subpartition_fact_body_29"
