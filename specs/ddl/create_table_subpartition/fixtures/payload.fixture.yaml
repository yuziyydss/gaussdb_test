schema_version: 1
kind: fixture
id: fixture_create_table_subpartition_payload
name: create_table_subpartition 独立业务列
status: ready
description: 两列键与payload业务列分离；复用上游事务命名空间，不修改旧两列提供者。
factor_ref: create_table_subpartition
requires_fixture_refs: [fixture_create_schema_q2_transaction]
provides:
  tables:
    - name: fp_q2.q2_sub_source
      persistence: permanent
      table_kind: partitioned
      columns:
        - {name: col_1, type: INTEGER, nullable: true}
        - {name: col_2, type: INTEGER, nullable: true}
        - {name: payload, type: INTEGER, nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - "CREATE TABLE fp_q2.q2_sub_source (col_1 INT, col_2 INT, payload INT) WITH (storage_type=astore) PARTITION BY RANGE (col_1) SUBPARTITION BY RANGE (col_2) (PARTITION p1 VALUES LESS THAN (10) (SUBPARTITION p1s1 VALUES LESS THAN (10), SUBPARTITION p1s2 VALUES LESS THAN (20)), PARTITION p2 VALUES LESS THAN (20) (SUBPARTITION p2s1 VALUES LESS THAN (10), SUBPARTITION p2s2 VALUES LESS THAN (20)));"
    - "INSERT INTO fp_q2.q2_sub_source VALUES (1,1,100),(1,11,200),(11,1,300),(11,11,400);"
  teardown_sqls: ["DROP TABLE IF EXISTS fp_q2.q2_sub_source;"]
  note: 依赖事务中的对象；teardown失败也必须继续执行上游ROLLBACK。候选未实机验证。
