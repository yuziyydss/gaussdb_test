- id: alter_database_link_fact_syntax
  type: syntax
  statement: ALTER可选PUBLIC、CONNECT TO...IDENTIFIED BY...以及USING列表。
  status: confirmed
  source_anchor: L14-L15
- id: alter_database_link_fact_runtime_fixture
  type: environment
  statement: 静态语法候选不连接远端；需已有Oracle DBLink、非初始主体和授权隔离环境，不注入密码。
  status: confirmed
  source_anchor: L22-L23
- id: alter_database_link_fact_example_lines_44
  type: example
  statement: 示例片段（仅作来源证据）：-- 前置条件。 gaussdb=# CREATE USER local_user WITH SYSADMIN PASSWORD '********'; CREATE ROLE gaussdb=#
    SET ROLE local_user PASSWORD '********'; SET
  status: confirmed
  source_anchor: L44-L48
- id: alter_database_link_fact_example_lines_50
  type: example
  statement: 示例片段（仅作来源证据）：-- 创建公共DBLink。 gaussdb=# CREATE PUBLIC DATABASE LINK public_dblink CONNECT TO 'local_user' IDENTIFIED
    BY '********' USING (host '***.***.***.***',port '*****',dbname 'remote_db'); CREATE DATABASE LINK
  status: confirmed
  source_anchor: L50-L53
- id: alter_database_link_fact_example_lines_55
  type: example
  statement: 示例片段（仅作来源证据）：-- 创建普通用户。 gaussdb=# CREATE USER remote_user PASSWORD '********'; CREATE ROLE
  status: confirmed
  source_anchor: L55-L57
- id: alter_database_link_fact_example_lines_59
  type: example
  statement: 示例片段（仅作来源证据）：-- 修改DBLink对象信息。 gaussdb=# ALTER PUBLIC DATABASE LINK public_dblink CONNECT TO 'remote_user' IDENTIFIED
    BY '********'; ALTER DATABASE LINK
  status: confirmed
  source_anchor: L59-L61
- id: alter_database_link_fact_example_lines_63
  type: example
  statement: 示例片段（仅作来源证据）：-- 删除公共DBLink。 gaussdb=# DROP PUBLIC DATABASE LINK public_dblink; DROP DATABASE LINK
  status: confirmed
  source_anchor: L63-L65
- id: alter_database_link_fact_example_lines_67
  type: example
  statement: 示例片段（仅作来源证据）：-- 创建连接到Oracle数据库的公共DBLink。 gaussdb=# CREATE PUBLIC DATABASE LINK dblink CONNECT TO 'oracle_user'
    IDENTIFIED BY '********' OCI USING (dbserver '***.***.***.***:****/orcl', case_insensitive 'on'); CREATE DATABASE LINK
  status: confirmed
  source_anchor: L67-L71
- id: alter_database_link_fact_example_lines_73
  type: example
  statement: 示例片段（仅作来源证据）：-- 修改DBLink参数选项。 gaussdb=# ALTER PUBLIC DATABASE LINK dblink CONNECT TO 'oracle_user' IDENTIFIED
    BY '********'USING (time_out '0'); ALTER DATABASE LINK
  status: confirmed
  source_anchor: L73-L76
- id: alter_database_link_fact_example_lines_78
  type: example
  statement: 示例片段（仅作来源证据）：-- 删除连接到Oracle数据库的公共DBLink。 gaussdb=# DROP PUBLIC DATABASE LINK dblink; DROP DATABASE LINK
  status: confirmed
  source_anchor: L78-L80
- id: alter_database_link_fact_example_lines_82
  type: example
  statement: 示例片段（仅作来源证据）：-- 清理环境。 gaussdb=# RESET ROLE; RESET gaussdb=# DROP USER local_user; DROP ROLE gaussdb=# DROP USER
    remote_user; DROP ROLE
  status: confirmed
  source_anchor: L82-L88
