schema_version: 1
kind: "syntax"
id: "syntax_alter_type"
name: "ALTER TYPE 语法"
factor_ref: "alter_type"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "alter_type.form"
  actions:
    type: "token"
    optional: true
    dimension_ref: "alter_type.actions"
  behavior:
    type: "token"
    optional: true
    dimension_ref: "alter_type.behavior"
  owner:
    type: "token"
    optional: true
    dimension_ref: "alter_type.owner"
  if_not_exists:
    type: "token"
    optional: true
    dimension_ref: "alter_type.if_not_exists"
  position:
    type: "token"
    optional: true
    dimension_ref: "alter_type.position"
source_fact_refs:
  - "alter_type_fact_syntax_actions"
  - "alter_type_fact_name"
  - "alter_type_fact_new_name"
  - "alter_type_fact_owner"
  - "alter_type_fact_schema"
  - "alter_type_fact_attribute"
  - "alter_type_fact_attribute_rename"
  - "alter_type_fact_data_type"
  - "alter_type_fact_neighbor"
  - "alter_type_fact_multiple_actions"
  - "alter_type_fact_current_user"
  - "alter_type_fact_session_user"
  - "alter_type_fact_collation"
  - "alter_type_fact_syntax_add"
  - "alter_type_fact_syntax_drop"
  - "alter_type_fact_syntax_alter"
  - "alter_type_fact_syntax_owner"
  - "alter_type_fact_syntax_rename"
  - "alter_type_fact_syntax_attr_rename"
  - "alter_type_fact_syntax_schema"
  - "alter_type_fact_syntax_enum_add"
  - "alter_type_fact_syntax_enum_rename"
ast:
  kind: "choice"
  selector: "form"
  branches:
    alter_type_form_actions:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER TYPE type_comp_b7 "
        -
          kind: "repeat"
          slot: "actions"
          separator: ", "
          items_property: "items"
    alter_type_form_rename:
      kind: "literal"
      text: "ALTER TYPE type_comp_b7 RENAME TO type_comp_b7_renamed"
    alter_type_form_attribute:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER TYPE type_comp_b7 RENAME ATTRIBUTE col_1 TO col_1_new "
        -
          kind: "slot"
          slot: "behavior"
    alter_type_form_owner:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER TYPE type_comp_b7 OWNER TO "
        -
          kind: "slot"
          slot: "owner"
    alter_type_form_schema:
      kind: "literal"
      text: "ALTER TYPE type_comp_b7 SET SCHEMA type_b7_target"
    alter_type_form_enum_add:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER TYPE type_enum_alter_b7 ADD VALUE "
        -
          kind: "slot"
          slot: "if_not_exists"
        -
          kind: "literal"
          text: " 'changed' "
        -
          kind: "slot"
          slot: "position"
    alter_type_form_enum_rename:
      kind: "literal"
      text: "ALTER TYPE type_enum_alter_b7 RENAME VALUE 'closed' TO 'complete'"
