  -
    id: "create_table_partition_fact_body_781"
    type: "constraint"
    statement: "● 修改IDENTITY列的字段类型和普通列相同，但仅限于修改为smallint、integer、 bigint、decimal、numeric、float、double precision和real数字类型。"
    status: "confirmed"
    source_anchor: "L781-L782"
