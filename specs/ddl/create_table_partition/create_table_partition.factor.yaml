facts:
  -
    id: "create_table_partition_fact_body_5"
    type: "constraint"
    statement: "创建分区表。"
    status: "confirmed"
    source_anchor: "L5-L7"
  -
    id: "create_table_partition_fact_body_5_1"
    type: "constraint"
    statement: "分区表是把逻辑上的一张表根据某种方案分成几张物理块进行存储，这 张逻辑上的表称之为分区表，物理块称之为分区。"
    status: "confirmed"
    source_anchor: "L5-L7"
  -
    id: "create_table_partition_fact_body_5_2"
    type: "constraint"
    statement: "分区表是一张逻辑表，不存储数 据，数据实际是存储在分区上的。"
    status: "confirmed"
    source_anchor: "L5-L7"
  -
    id: "create_table_partition_fact_body_9"
    type: "constraint"
    statement: "常见的分区方案有范围分区（Range Partitioning）、间隔分区（Interval Partitioning）、哈希分区（Hash Partitioning）、列表分区（List Partitioning）、数 值分区（Value Partitioning）等。"
    status: "confirmed"
    source_anchor: "L9-L12"
  -
    id: "create_table_partition_fact_body_9_1"
    type: "constraint"
    statement: "目前行存表支持范围分区、间隔分区、哈希分区、 列表分区。"
    status: "confirmed"
    source_anchor: "L9-L12"
  -
    id: "create_table_partition_fact_body_14"
    type: "behavior_oracle"
    statement: "范围分区是根据表的一列或者多列，将要插入表的记录分为若干个范围，这些范围在 不同的分区里没有重叠。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "create_table_partition_fact_body_14_1"
    type: "behavior_oracle"
    statement: "为每个范围创建一个分区，用来存储相应的数据。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "create_table_partition_fact_body_17"
    type: "behavior_oracle"
    statement: "范围分区的分区策略是指记录插入分区的方式。"
    status: "confirmed"
    source_anchor: "L17-L17"
  -
    id: "create_table_partition_fact_body_17_1"
    type: "behavior_oracle"
    statement: "目前范围分区仅支持范围分区策略。"
    status: "confirmed"
    source_anchor: "L17-L17"
  -
    id: "create_table_partition_fact_body_19"
    type: "behavior_oracle"
    statement: "范围分区策略：根据分区键值将记录映射到已创建的某个分区上，如果可以映射到已 创建的某一分区上，则把记录插入到对应的分区上，否则给出报错和提示信息。"
    status: "confirmed"
    source_anchor: "L19-L21"
  -
    id: "create_table_partition_fact_body_19_1"
    type: "behavior_oracle"
    statement: "这是 最常用的分区策略。"
    status: "confirmed"
    source_anchor: "L19-L21"
  -
    id: "create_table_partition_fact_body_23"
    type: "behavior_oracle"
    statement: "间隔分区是一种特殊的范围分区，相比范围分区，新增间隔值定义，当插入记录找不 到匹配的分区时，可以根据间隔值自动创建分区。"
    status: "confirmed"
    source_anchor: "L23-L24"
  -
    id: "create_table_partition_fact_body_26"
    type: "constraint"
    statement: "间隔分区只支持基于表的一列分区，并且该列只支持TIMESTAMP[(p)] [WITHOUT TIME ZONE]、TIMESTAMP[(p)] [WITH TIME ZONE]、DATE、DATEA（仅在A模式 下支持）数据类型。"
    status: "confirmed"
    source_anchor: "L26-L28"
  -
    id: "create_table_partition_fact_body_30"
    type: "behavior_oracle"
    statement: "间隔分区策略：根据分区键值将记录映射到已创建的某个分区上，如果可以映射到已 创建的某一分区上，则把记录插入到对应的分区上，否则根据分区键值和表定义信息 自动创建一个分区，然后将记录插入新分区中，新创建的分区数据范围等于间隔值。"
    status: "confirmed"
    source_anchor: "L30-L32"
  -
    id: "create_table_partition_fact_body_34"
    type: "behavior_oracle"
    statement: "哈希分区是根据表的一列，为每个分区指定模数和余数，将要插入表的记录划分到对 应的分区中，每个分区所持有的行都需要满足条件：分区键的值除以为其指定的模数 将产生为其指定的余数。"
    status: "confirmed"
    source_anchor: "L34-L36"
  -
    id: "create_table_partition_fact_body_38"
    type: "behavior_oracle"
    statement: "哈希分区策略：根据分区键值将记录映射到已创建的某个分区上，如果可以映射到已 创建的某一分区上，则把记录插入到对应的分区上，否则返回报错和提示信息。"
    status: "confirmed"
    source_anchor: "L38-L39"
  -
    id: "create_table_partition_fact_body_41"
    type: "behavior_oracle"
    statement: "列表分区是根据表的一列，将要插入表的记录通过每一个分区中出现的键值划分到对 应的分区中，这些键值在不同的分区里没有重叠。"
    status: "confirmed"
    source_anchor: "L41-L46"
  -
    id: "create_table_partition_fact_body_41_1"
    type: "behavior_oracle"
    statement: "为每组键值创建一个分区，用来存 储相应的数据。"
    status: "confirmed"
    source_anchor: "L41-L46"
  -
    id: "create_table_partition_fact_body_41_2"
    type: "behavior_oracle"
    statement: "列表分区策略：根据分区键值将记录映射到已创建的某个分区上，如果可以映射到已 创建的某一分区上，则把记录插入到对应的分区上，否则给出报错和提示信息。"
    status: "confirmed"
    source_anchor: "L41-L46"
  -
    id: "create_table_partition_fact_body_41_3"
    type: "behavior_oracle"
    statement: "分区可以提供若干好处："
    status: "confirmed"
    source_anchor: "L41-L46"
  -
    id: "create_table_partition_fact_body_48"
    type: "behavior_oracle"
    statement: "●    某些类型的查询性能可以得到极大提升。"
    status: "confirmed"
    source_anchor: "L48-L50"
  -
    id: "create_table_partition_fact_body_48_1"
    type: "behavior_oracle"
    statement: "特别是表中访问率较高的行位于一个单 独分区或少数几个分区上的情况下。"
    status: "confirmed"
    source_anchor: "L48-L50"
  -
    id: "create_table_partition_fact_body_48_2"
    type: "behavior_oracle"
    statement: "分区可以减少数据的搜索空间，提高数据访 问效率。"
    status: "confirmed"
    source_anchor: "L48-L50"
  -
    id: "create_table_partition_fact_body_51"
    type: "behavior_oracle"
    statement: "●    当查询或更新一个分区的大部分记录时，连续扫描该分区而不是访问整个表可以 获得巨大的性能提升。"
    status: "confirmed"
    source_anchor: "L51-L52"
  -
    id: "create_table_partition_fact_body_53"
    type: "behavior_oracle"
    statement: "●    如果需要大量加载或者删除的记录位于单独的分区上，则可以通过直接读取或删 除该分区以获得巨大的性能提升，同时还可以避免由于大量DELETE导致的 VACUUM超载（哈希分区不支持删除分区）。"
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "create_table_partition_fact_body_58"
    type: "constraint"
    statement: "●    唯一约束和主键约束的约束键包含所有分区键将为约束创建LOCAL索引，否则创 建GLOBAL索引。"
    status: "confirmed"
    source_anchor: "L58-L59"
  -
    id: "create_table_partition_fact_body_60"
    type: "constraint"
    statement: "●    目前哈希分区仅支持单列构建分区键，暂不支持多列构建分区键。"
    status: "confirmed"
    source_anchor: "L60-L60"
  -
    id: "create_table_partition_fact_body_61"
    type: "environment"
    statement: "●    只需要有间隔分区表的INSERT权限，往该表INSERT数据时就可以自动创建分区。"
    status: "confirmed"
    source_anchor: "L61-L61"
  -
    id: "create_table_partition_fact_body_62"
    type: "constraint"
    statement: "●    对于分区表PARTITION FOR (values)语法，values只能是常量。"
    status: "confirmed"
    source_anchor: "L62-L62"
  -
    id: "create_table_partition_fact_body_63"
    type: "constraint"
    statement: "●    对于分区表PARTITION FOR (values)语法，values在需要数据类型转换时，建议 使用强制类型转换，以防隐式类型转换结果与预期不符。"
    status: "confirmed"
    source_anchor: "L63-L64"
  -
    id: "create_table_partition_fact_body_65"
    type: "behavior_oracle"
    statement: "●    单个表的最大分区数为1048575（包括一级分区和二级分区）。"
    status: "confirmed"
    source_anchor: "L65-L67"
  -
    id: "create_table_partition_fact_body_65_1"
    type: "behavior_oracle"
    statement: "在默认配置下， 建议单个表的分区数不超过400个。"
    status: "confirmed"
    source_anchor: "L65-L67"
  -
    id: "create_table_partition_fact_body_65_2"
    type: "behavior_oracle"
    statement: "具体可参考《开发指南》中“特性使用指导 > 分区表 > 分区表介绍 > 分区基本使用 > 创建分区表”章节。"
    status: "confirmed"
    source_anchor: "L65-L67"
  -
    id: "create_table_partition_fact_body_68"
    type: "constraint"
    statement: "●    当分区数太多导致内存不足时，会间接导致性能急剧下降。"
    status: "confirmed"
    source_anchor: "L68-L68"
  -
    id: "create_table_partition_fact_body_69"
    type: "constraint"
    statement: "●    不支持XML类型数据作为分区键、二级分区键。"
    status: "confirmed"
    source_anchor: "L69-L69"
  -
    id: "create_table_partition_fact_body_70"
    type: "constraint"
    statement: "●    不支持在rowid/rowno系统列上创建外键约束。"
    status: "confirmed"
    source_anchor: "L70-L70"
  -
    id: "create_table_partition_fact_body_71"
    type: "constraint"
    statement: "●    在为数据对象增加或者变更ILM策略的时候，如果追加了行级表达式，需要注意行 表达式目前只支持白名单中列出的函数。"
