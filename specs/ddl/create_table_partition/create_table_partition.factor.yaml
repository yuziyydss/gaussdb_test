    source_anchor: "L735-L736"
  -
    id: "create_table_partition_fact_body_735_1"
    type: "constraint"
    statement: "在INSERT或UPDATE命令中, 不能为生成列指定值, 但是可以 指定关键字DEFAULT。"
    status: "confirmed"
    source_anchor: "L735-L736"
  -
    id: "create_table_partition_fact_body_737"
    type: "environment"
    statement: "● 生成列的权限控制和普通列一样。"
    status: "confirmed"
    source_anchor: "L737-L737"
  -
    id: "create_table_partition_fact_body_738"
    type: "behavior_oracle"
    statement: "●   GENERATED [ ALWAYS | BY DEFAULT [ ON NULL ] ] AS IDENTITY [ ( identity_options ) ] 该子句将列创建为IDENTITY列。"
    status: "confirmed"
    source_anchor: "L738-L741"
  -
    id: "create_table_partition_fact_body_738_1"
    type: "behavior_oracle"
    statement: "会根据identity_options自动创建一个隐式序列附 加到指定列，在插入数据时将序列中获取的值自动分配给该列。"
    status: "confirmed"
    source_anchor: "L738-L741"
  -
    id: "create_table_partition_fact_body_742"
    type: "behavior_oracle"
    statement: "–   GENERATED ALWAYS AS IDENTITY：该列仅接受插入由序列生成器提供的 IDENTITY值，不能接受用户指定值。"
    status: "confirmed"
    source_anchor: "L742-L743"
  -
    id: "create_table_partition_fact_body_744"
    type: "behavior_oracle"
    statement: "–   GENERATED BY DEFAULT AS IDENTITY：该列优先插入用户提供值，若用户 不指定值，将插入由序列生成器提供的IDENTITY值。"
    status: "confirmed"
    source_anchor: "L744-L745"
  -
    id: "create_table_partition_fact_body_746"
    type: "behavior_oracle"
    statement: "–   GENERATED BY DEFAULT ON NULL AS IDENTITY：该列优先插入用户提供 值，若用户指定NULL值或用户不指定值，将插入由序列生成器提供的 IDENTITY值。"
    status: "confirmed"
    source_anchor: "L746-L748"
  -
    id: "create_table_partition_fact_body_750"
    type: "constraint"
    statement: "可选的identity_options子句可用于覆盖序列选项。"
    status: "confirmed"
    source_anchor: "L750-L750"
  -
    id: "create_table_partition_fact_body_751"
    type: "behavior_oracle"
    statement: "–   increment：指定隐式序列步长。"
    status: "confirmed"
    source_anchor: "L751-L752"
  -
    id: "create_table_partition_fact_body_751_1"
    type: "behavior_oracle"
    statement: "为正数时将生成一个递增的序列，为负数时 将生成一个递减的序列，缺省值为1。"
    status: "confirmed"
    source_anchor: "L751-L752"
  -
    id: "create_table_partition_fact_body_753"
    type: "behavior_oracle"
    statement: "–   MINVALUE minvalue | NO MINVALUE | NOMINVALUE：执行序列的最小 值，如果没有声明minvalue或者声明了NO MINVALUE，则递增序序列缺省 值为1，递减序列的缺省值为-10^27+1。"
    status: "confirmed"
    source_anchor: "L753-L756"
  -
    id: "create_table_partition_fact_body_753_1"
    type: "behavior_oracle"
    statement: "NOMINVALUE等价于NO MINVALUE。"
    status: "confirmed"
    source_anchor: "L753-L756"
  -
    id: "create_table_partition_fact_body_757"
    type: "behavior_oracle"
    statement: "–   MAXVALUE maxvalue | NO MAXVALUE | NOMAXVALUE：执行序列的最大 值，如果没有声明maxvalue或者声明了NO MAXVALUE，则递增序序列缺省 值为10^28-1，递减序列的缺省值为-1。"
    status: "confirmed"
    source_anchor: "L757-L760"
  -
    id: "create_table_partition_fact_body_757_1"
    type: "behavior_oracle"
    statement: "NOMAXVALUE等价于NO MAXVALUE。"
    status: "confirmed"
    source_anchor: "L757-L760"
  -
    id: "create_table_partition_fact_body_761"
    type: "behavior_oracle"
    statement: "–   start：指定隐式序列的起始值。"
    status: "confirmed"
    source_anchor: "L761-L762"
  -
    id: "create_table_partition_fact_body_761_1"
    type: "behavior_oracle"
    statement: "缺省值：对于递增序列为minvalue，递减序 列为maxvalue。"
    status: "confirmed"
    source_anchor: "L761-L762"
  -
    id: "create_table_partition_fact_body_763"
    type: "behavior_oracle"
    statement: "–   cache：为了快速访问，而在内存中预先存储序列号的个数。"
    status: "confirmed"
    source_anchor: "L763-L764"
  -
    id: "create_table_partition_fact_body_763_1"
    type: "behavior_oracle"
    statement: "缺省值为1，表 示一次只能生成一个值，即没有缓存。"
    status: "confirmed"
    source_anchor: "L763-L764"
  -
    id: "create_table_partition_fact_body_765"
    type: "constraint"
    statement: "–   NOCACHE：未预先存储序列的值。"
    status: "confirmed"
    source_anchor: "L765-L765"
  -
    id: "create_table_partition_fact_body_766"
    type: "behavior_oracle"
    statement: "–   CYCLE：用于使序列达到maxvalue或者minvalue后可循环并继续下去。"
    status: "confirmed"
    source_anchor: "L766-L768"
  -
    id: "create_table_partition_fact_body_766_1"
    type: "behavior_oracle"
    statement: "如果 声明了NO CYCLE，则在序列达到其最大或最小值之后任何对nextval的调用 都会返回一个错误。"
    status: "confirmed"
    source_anchor: "L766-L768"
  -
    id: "create_table_partition_fact_body_766_2"
    type: "behavior_oracle"
    statement: "NOCYCLE等价于NO CYCLE，缺省值为NO CYCLE。"
    status: "confirmed"
    source_anchor: "L766-L768"
  -
    id: "create_table_partition_fact_body_769"
    type: "behavior_oracle"
    statement: "–   SCALE：用于启用序列的可伸缩性。"
    status: "confirmed"
    source_anchor: "L769-L771"
  -
    id: "create_table_partition_fact_body_769_1"
    type: "behavior_oracle"
    statement: "如果指定，则会在序列的开头附加一个 数字偏移量，防止生成值中有重复项。"
    status: "confirmed"
    source_anchor: "L769-L771"
  -
    id: "create_table_partition_fact_body_769_2"
    type: "behavior_oracle"
    statement: "如果声明了NOSCALE，则禁止序列的 可伸缩性。"
    status: "confirmed"
    source_anchor: "L769-L771"
  -
    id: "create_table_partition_fact_body_769_3"
    type: "behavior_oracle"
    statement: "缺省值为NOSCALE。"
    status: "confirmed"
    source_anchor: "L769-L771"
  -
    id: "create_table_partition_fact_body_772"
    type: "behavior_oracle"
    statement: "–   EXTEND：扩展数字偏移量长度（默认值为6），将序列生成值对齐到x（默 认为6）+y（最大位数）位，指定EXTEND时必须指定SCALE。"
    status: "confirmed"
    source_anchor: "L772-L774"
  -
    id: "create_table_partition_fact_body_772_1"
    type: "behavior_oracle"
    statement: "如果声明了 NOEXTEND，则不扩展数字偏移量长度。"
    status: "confirmed"
    source_anchor: "L772-L774"
  -
    id: "create_table_partition_fact_body_772_2"
    type: "behavior_oracle"
    statement: "缺省值为NOEXTEND。"
    status: "confirmed"
    source_anchor: "L772-L774"
  -
    id: "create_table_partition_fact_body_777"
    type: "constraint"
    statement: "● IDENTITY列只能为smallint、integer、bigint、decimal、numeric、float、double precision或real数字类型。"
