  -
    id: "create_table_partition_fact_body_798"
    type: "constraint"
    statement: "●   UNIQUE [KEY] index_parameters UNIQUE ( column_name [, ... ] ) index_parameters UNIQUE约束表示表里的一个字段或多个字段的组合必须在全表范围内唯一。"
