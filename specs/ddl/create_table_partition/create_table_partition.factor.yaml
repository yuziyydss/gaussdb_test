    status: "confirmed"
    source_anchor: "L71-L73"
  -
    id: "create_table_partition_fact_body_76"
    type: "environment"
    statement: "在ILM策略的ON ( EXPR )行级表达式支持的函数中，有部分函数的输出可能会受兼容性参 数影响。"
    status: "confirmed"
    source_anchor: "L76-L78"
  -
    id: "create_table_partition_fact_body_76_1"
