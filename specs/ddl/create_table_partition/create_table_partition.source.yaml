    id: "create_table_partition_su_body_5_5"
    section: "正文"
    source_anchor: "L5-L7"
    line_start: 5
    line_end: 7
    statement: "创建分区表。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_5"
      - "create_table_partition_fact_body_5_1"
      - "create_table_partition_fact_body_5_2"
