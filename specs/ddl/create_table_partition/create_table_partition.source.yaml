  -
    id: "create_table_partition_su_body_9_9"
    section: "正文"
    source_anchor: "L9-L12"
    line_start: 9
    line_end: 12
    statement: "常见的分区方案有范围分区（Range Partitioning）、间隔分区（Interval Partitioning）、哈希分区（Hash Partitioning）、列表分区（List Partitioning）、数 值分区（Value Partitioning）等。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_9"
      - "create_table_partition_fact_body_9_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "create_table_partition_su_body_14_14"
    section: "正文"
    source_anchor: "L14-L15"
    line_start: 14
    line_end: 15
    statement: "范围分区是根据表的一列或者多列，将要插入表的记录分为若干个范围，这些范围在 不同的分区里没有重叠。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_14"
      - "create_table_partition_fact_body_14_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "create_table_partition_su_body_17_17"
    section: "正文"
    source_anchor: "L17-L17"
    line_start: 17
    line_end: 17
    statement: "范围分区的分区策略是指记录插入分区的方式。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_17"
      - "create_table_partition_fact_body_17_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "create_table_partition_su_body_19_19"
    section: "正文"
    source_anchor: "L19-L21"
    line_start: 19
    line_end: 21
    statement: "范围分区策略：根据分区键值将记录映射到已创建的某个分区上，如果可以映射到已 创建的某一分区上，则把记录插入到对应的分区上，否则给出报错和提示信息。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_19"
      - "create_table_partition_fact_body_19_1"
    atomicity: "grouped"
    independent_claim_count: 2
  -
    id: "create_table_partition_su_body_23_23"
    section: "正文"
    source_anchor: "L23-L24"
    line_start: 23
    line_end: 24
    statement: "间隔分区是一种特殊的范围分区，相比范围分区，新增间隔值定义，当插入记录找不 到匹配的分区时，可以根据间隔值自动创建分区。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_23"
    atomicity: "atomic"
  -
    id: "create_table_partition_su_body_26_26"
    section: "正文"
    source_anchor: "L26-L28"
    line_start: 26
    line_end: 28
    statement: "间隔分区只支持基于表的一列分区，并且该列只支持TIMESTAMP[(p)] [WITHOUT TIME ZONE]、TIMESTAMP[(p)] [WITH TIME ZONE]、DATE、DATEA（仅在A模式 下支持）数据类型。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_26"
    atomicity: "atomic"
    atomicity_rationale: "INTERVAL单一键类型的封闭允许集合；其中DATEA的A模式条件明确保留在本句。"
  -
    id: "create_table_partition_su_body_30_30"
    section: "正文"
    source_anchor: "L30-L32"
    line_start: 30
    line_end: 32
    statement: "间隔分区策略：根据分区键值将记录映射到已创建的某个分区上，如果可以映射到已 创建的某一分区上，则把记录插入到对应的分区上，否则根据分区键值和表定义信息 自动创建一个分区，然后将记录插入新分区中，新创建的分区数据范围等于间隔值。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_30"
    atomicity: "atomic"
  -
    id: "create_table_partition_su_body_34_34"
    section: "正文"
    source_anchor: "L34-L36"
    line_start: 34
    line_end: 36
    statement: "哈希分区是根据表的一列，为每个分区指定模数和余数，将要插入表的记录划分到对 应的分区中，每个分区所持有的行都需要满足条件：分区键的值除以为其指定的模数 将产生为其指定的余数。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_34"
    atomicity: "atomic"
  -
    id: "create_table_partition_su_body_38_38"
    section: "正文"
    source_anchor: "L38-L39"
    line_start: 38
    line_end: 39
    statement: "哈希分区策略：根据分区键值将记录映射到已创建的某个分区上，如果可以映射到已 创建的某一分区上，则把记录插入到对应的分区上，否则返回报错和提示信息。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_38"
    atomicity: "atomic"
  -
    id: "create_table_partition_su_body_41_41"
    section: "正文"
    source_anchor: "L41-L46"
    line_start: 41
    line_end: 46
    statement: "列表分区是根据表的一列，将要插入表的记录通过每一个分区中出现的键值划分到对 应的分区中，这些键值在不同的分区里没有重叠。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_41"
      - "create_table_partition_fact_body_41_1"
      - "create_table_partition_fact_body_41_2"
      - "create_table_partition_fact_body_41_3"
    atomicity: "grouped"
    independent_claim_count: 4
  -
    id: "create_table_partition_su_body_48_48"
    section: "正文"
    source_anchor: "L48-L50"
    line_start: 48
    line_end: 50
    statement: "●    某些类型的查询性能可以得到极大提升。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_48"
      - "create_table_partition_fact_body_48_1"
      - "create_table_partition_fact_body_48_2"
    atomicity: "grouped"
    independent_claim_count: 3
  -
    id: "create_table_partition_su_body_51_51"
    section: "正文"
    source_anchor: "L51-L52"
    line_start: 51
    line_end: 52
    statement: "●    当查询或更新一个分区的大部分记录时，连续扫描该分区而不是访问整个表可以 获得巨大的性能提升。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_51"
    atomicity: "atomic"
  -
    id: "create_table_partition_su_body_53_53"
    section: "正文"
    source_anchor: "L53-L55"
    line_start: 53
    line_end: 55
    statement: "●    如果需要大量加载或者删除的记录位于单独的分区上，则可以通过直接读取或删 除该分区以获得巨大的性能提升，同时还可以避免由于大量DELETE导致的 VACUUM超载（哈希分区不支持删除分区）。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_53"
    atomicity: "atomic"
  -
    id: "create_table_partition_su_body_58_58"
    section: "正文"
    source_anchor: "L58-L59"
    line_start: 58
    line_end: 59
    statement: "●    唯一约束和主键约束的约束键包含所有分区键将为约束创建LOCAL索引，否则创 建GLOBAL索引。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_58"
    atomicity: "atomic"
  -
    id: "create_table_partition_su_body_60_60"
    section: "正文"
    source_anchor: "L60-L60"
    line_start: 60
    line_end: 60
    statement: "●    目前哈希分区仅支持单列构建分区键，暂不支持多列构建分区键。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_60"
    atomicity: "atomic"
  -
    id: "create_table_partition_su_body_61_61"
    section: "正文"
    source_anchor: "L61-L61"
    line_start: 61
    line_end: 61
    statement: "●    只需要有间隔分区表的INSERT权限，往该表INSERT数据时就可以自动创建分区。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_61"
    atomicity: "atomic"
  -
    id: "create_table_partition_su_body_62_62"
    section: "正文"
    source_anchor: "L62-L62"
    line_start: 62
    line_end: 62
    statement: "●    对于分区表PARTITION FOR (values)语法，values只能是常量。"
    status: "mapped"
    fact_refs:
      - "create_table_partition_fact_body_62"
    atomicity: "atomic"
  -
    id: "create_table_partition_su_body_63_63"
    section: "正文"
    source_anchor: "L63-L64"
    line_start: 63
    line_end: 64
    statement: "●    对于分区表PARTITION FOR (values)语法，values在需要数据类型转换时，建议 使用强制类型转换，以防隐式类型转换结果与预期不符。"
