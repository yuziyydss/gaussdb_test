schema_version: 1
kind: "scenario"
id: "scenario_alter_resource_pool_documented_contracts"
name: "ALTER RESOURCE POOL documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "alter_resource_pool"
fixture_refs: []
fact_refs:
  - "alter_resource_pool_fact_purpose"
  - "alter_resource_pool_fact_privilege"
  - "alter_resource_pool_fact_no_multitenant"
  - "alter_resource_pool_fact_no_upgrade"
  - "alter_resource_pool_fact_name"
  - "alter_resource_pool_fact_group"
  - "alter_resource_pool_fact_case"
  - "alter_resource_pool_fact_timeshare"
  - "alter_resource_pool_fact_stmt"
  - "alter_resource_pool_fact_dop"
  - "alter_resource_pool_fact_memory"
  - "alter_resource_pool_fact_tenant_mem"
  - "alter_resource_pool_fact_ordinary_mem"
  - "alter_resource_pool_fact_precedence"
  - "alter_resource_pool_fact_io_limits"
  - "alter_resource_pool_fact_io_priority"
  - "alter_resource_pool_fact_complex_jobs"
  - "alter_resource_pool_fact_worker"
  - "alter_resource_pool_fact_connections"
  - "alter_resource_pool_fact_capacity"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "修改资源池并指定其他控制组。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "仅sysadmin或初始用户可用。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "多租不支持，使用RESOURCE_MANAGER。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "升级期间不支持。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "目标资源池必须已创建且名合法。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "控制组必须已存在。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "控制组名称大小写敏感。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "Rush/High/Medium/Low映射DefaultClass Timeshare组。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "ACTIVE_STATEMENTS范围-1..2147483647，-1不限。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "MAX_DOP范围1..2147483647。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "MEMORY_LIMIT字符串1KB..2047GB，单位大小写敏感。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "参数说明称多租组用户/业务用户1..100默认20。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "普通用户MEM_PERCENT 0..100默认0。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "同时指定MEM_PERCENT和MEMORY_LIMIT仅前者生效。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "IO_LIMITS单位万次/秒，0..2147483647，0不限。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "ALTER正文称I/O利用率90%时生效；None/Low/Medium/High，默认None。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "IO设置只针对批量导入、大于500MB/DN复杂查询及VACUUM FULL等复杂作业。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "MAX_WORKER仅扩容重分布使用。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "MAX_CONNECTIONS限制池连接。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "所有资源池连接上限和不得超过进程max_connections。"
oracles:
  -
    kind: "documented_behavior"
    expected: "同时指定MEM_PERCENT和MEMORY_LIMIT仅前者生效。"
  -
    kind: "documented_behavior"
    expected: "ALTER正文称I/O利用率90%时生效；None/Low/Medium/High，默认None。"
execution_requirements:
  - "database"
  - "same_session"
