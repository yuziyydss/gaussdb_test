facts:
  -
    id: "create_event_fact_purpose"
    type: "lifecycle"
    statement: "创建满足时间条件后自动执行SQL的数据库定时任务。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "create_event_fact_compat_b"
    type: "environment"
    statement: "仅sql_compatibility=B支持。"
    status: "confirmed"
    source_anchor: "L9-L9"
  -
    id: "create_event_fact_privilege"
    type: "environment"
    statement: "非SYSADMIN须由SYSADMIN赋予与DBE_SCHEDULER一致的任务操作权限。"
    status: "confirmed"
    source_anchor: "L10-L12"
  -
    id: "create_event_fact_float_rounding"
    type: "behavior_oracle"
    statement: "interval浮点语法可接受但计算取整，不推荐。"
    status: "confirmed"
    source_anchor: "L14-L15"
  -
    id: "create_event_fact_unique"
    type: "constraint"
    statement: "同数据库任务名不得重复。"
    status: "confirmed"
    source_anchor: "L16-L16"
  -
    id: "create_event_fact_body_limits"
    type: "constraint"
    statement: "任务正文为非安全类SQL，受语句约束；例如不能经复合语句创建数据库。"
    status: "confirmed"
    source_anchor: "L17-L18"
  -
    id: "create_event_fact_security_body"
    type: "constraint"
    statement: "任务不支持加密函数、创建设置用户/GROUP、数据库连接、函数加密等安全操作。"
    status: "confirmed"
    source_anchor: "L19-L23"
  -
    id: "create_event_fact_definer_admin"
    type: "environment"
    statement: "指定DEFINER须SYSADMIN。"
    status: "confirmed"
    source_anchor: "L24-L25"
  -
    id: "create_event_fact_definer_initial"
    type: "environment"
    statement: "当前用户与DEFINER不同且DEFINER为初始用户时禁止。"
    status: "confirmed"
    source_anchor: "L26-L28"
  -
    id: "create_event_fact_definer_admin_roles"
    type: "environment"
    statement: "不同DEFINER不得为运维/监控管理员。"
    status: "confirmed"
    source_anchor: "L30-L30"
  -
    id: "create_event_fact_definer_separation"
    type: "environment"
    statement: "当前用户与DEFINER不同且开启三权分立时禁止。"
    status: "confirmed"
    source_anchor: "L32-L32"
  -
    id: "create_event_fact_plaintext_password"
    type: "environment"
    statement: "任务正文涉及密码时目录记录明文，禁止将真实密码放入任务SQL。"
    status: "confirmed"
    source_anchor: "L33-L35"
  -
    id: "create_event_fact_failure_metadata"
    type: "metadata_oracle"
    statement: "创建后运行失败原因通过SHOW EVENTS或PG_JOB查看。"
    status: "confirmed"
    source_anchor: "L36-L37"
  -
    id: "create_event_fact_definer_execution"
    type: "behavior_oracle"
    statement: "默认创建者权限执行，指定DEFINER时使用指定者权限。"
    status: "confirmed"
    source_anchor: "L53-L55"
  -
    id: "create_event_fact_definer_admin_repeat"
    type: "environment"
    statement: "仅SYSADMIN可指定DEFINER。"
    status: "confirmed"
    source_anchor: "L56-L56"
  -
    id: "create_event_fact_schedule"
    type: "syntax"
    statement: "支持一次或重复执行的schedule。"
    status: "confirmed"
    source_anchor: "L57-L59"
  -
    id: "create_event_fact_interval_units"
    type: "syntax"
    statement: "interval为quantity及YEAR/MONTH/DAY/HOUR/MINUTE/SECOND或复合TO单位。"
    status: "confirmed"
    source_anchor: "L67-L73"
  -
    id: "create_event_fact_underscore_units"
    type: "environment"
    statement: "下划线复合单位仅B模式且b_format_version=5.7、b_format_dev_version=s1。"
    status: "confirmed"
    source_anchor: "L77-L78"
  -
    id: "create_event_fact_once"
    type: "behavior_oracle"
    statement: "AT timestamp加interval仅执行一次。"
    status: "confirmed"
    source_anchor: "L79-L80"
  -
    id: "create_event_fact_repeat"
    type: "behavior_oracle"
    statement: "EVERY按interval重复。"
    status: "confirmed"
    source_anchor: "L81-L81"
  -
    id: "create_event_fact_starts"
    type: "behavior_oracle"
    statement: "STARTS指定起点，省略当前时刻。"
    status: "confirmed"
    source_anchor: "L83-L85"
  -
    id: "create_event_fact_ends"
    type: "behavior_oracle"
    statement: "ENDS指定终点，省略3999-12-31 16:00:00。"
    status: "confirmed"
    source_anchor: "L87-L89"
  -
    id: "create_event_fact_completion"
    type: "behavior_oracle"
    statement: "完成后默认立即删除任务，PRESERVE保留。"
    status: "confirmed"
    source_anchor: "L90-L92"
  -
    id: "create_event_fact_enabled"
    type: "behavior_oracle"
    statement: "默认ENABLE；DISABLE ON SLAVE与DISABLE一致。"
    status: "confirmed"
    source_anchor: "L93-L96"
  -
    id: "create_event_fact_comments"
    type: "metadata_oracle"
    statement: "COMMENT写入GS_JOB_ATTRIBUTE。"
    status: "confirmed"
    source_anchor: "L97-L98"
  -
    id: "create_event_fact_body"
    type: "syntax"
    statement: "DO后必须完整任务SQL。"
    status: "confirmed"
    source_anchor: "L99-L100"
  -
    id: "create_event_fact_syntax"
    type: "syntax"
    statement: "原文选项/产生式：CREATE [DEFINER = user] EVENT [IF NOT EXISTS] event_name ON SCHEDULE schedule [ON COMPLETION [NOT] PRESERVE] [ENABLE | DISABLE | DISABLE ON SLAVE] [COMMENT 'string'] DO event_body;"
    status: "confirmed"
    source_anchor: "L40-L49"
  -
    id: "create_event_fact_schedule_syntax"
    type: "syntax"
    statement: "原文选项/产生式：{ AT timestamp [+ INTERVAL interval] ... | EVERY interval [STARTS timestamp [+ INTERVAL interval] ...] [ENDS timestamp [+ INTERVAL interval] ...] }"
    status: "confirmed"
    source_anchor: "L60-L65"
  -
    id: "create_event_fact_cleanup_example"
    type: "example"
    statement: "删除任务、表并切库删除测试库。"
    status: "confirmed"
    source_anchor: "L135-L143"
  -
    id: "create_event_fact_schedule_profiles"
    type: "open_question"
    statement: "STARTS/ENDS、重复interval、浮点/复合单位和边界尚未结构化生成；目前仅AT与EVERY完整代表式。"
    status: "needs_verification"
    source_anchor: "L60-L65"
  -
    id: "create_event_fact_async_oracle"
    type: "open_question"
    statement: "普通manifest只输出禁用任务；默认/ENABLE、实际触发时刻、完成删除和后台失败不能用CREATE成功代替。"
    status: "needs_verification"
    source_anchor: "L93-L96"
  -
    id: "create_event_fact_definer_profiles"
    type: "open_question"
    statement: "跨身份DEFINER与三权分立禁止域未建立隔离身份fixture。"
    status: "needs_verification"
    source_anchor: "L24-L25"
  -
    id: "create_event_fact_example_lines_103"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建并切换至测试数据库。 gaussdb=# CREATE DATABASE test_event WITH DBCOMPATIBILITY = 'B'; gaussdb=# \\c test_event"
    status: "confirmed"
    source_anchor: "L103-L105"
  -
    id: "create_event_fact_example_lines_107"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建表。 test_event=# CREATE TABLE t_ev(num int);"
    status: "confirmed"
    source_anchor: "L107-L108"
  -
    id: "create_event_fact_example_lines_110"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建一个执行一次的定时任务，五秒后执行一次，执行完后定时任务自动删除。 test_event=# CREATE EVENT IF NOT EXISTS event_e1 ON SCHEDULE AT sysdate + interval 5 second DO INSERT INTO t_ev VALUES(0);"
    status: "confirmed"
    source_anchor: "L110-L112"
  -
    id: "create_event_fact_example_lines_114"
    type: "example"
    statement: "示例片段（仅作来源证据）：--五秒后查询表。 test_event=# SELECT * FROM t_ev; num ----- 0 (1 row)"
    status: "confirmed"
    source_anchor: "L114-L119"
  -
    id: "create_event_fact_example_lines_121"
    type: "example"
    statement: "示例片段（仅作来源证据）：--创建一个每隔一分钟执行一次的定时任务。 test_event=# CREATE EVENT IF NOT EXISTS event_e2 ON SCHEDULE EVERY 1 minute DO INSERT INTO t_ev VALUES(1);"
    status: "confirmed"
    source_anchor: "L121-L124"
  -
    id: "create_event_fact_example_lines_126"
    type: "example"
    statement: "示例片段（仅作来源证据）：--每隔一分钟查询表，会看到新增一条数据。 test_event=# SELECT * FROM t_ev; num ----- 0 1 1 (3 rows)"
    status: "confirmed"
    source_anchor: "L126-L133"
  -
    id: "create_event_fact_no_crypto_functions"
    type: "constraint"
    statement: "任务正文不支持使用加密函数。"
    status: "confirmed"
    source_anchor: "L19-L23"
  -
    id: "create_event_fact_no_identity_ddl"
    type: "constraint"
    statement: "任务正文不支持创建/设置用户或GROUP。"
    status: "confirmed"
    source_anchor: "L19-L23"
  -
    id: "create_event_fact_no_connect"
    type: "constraint"
    statement: "任务正文不支持连接数据库。"
    status: "confirmed"
    source_anchor: "L19-L23"
  -
    id: "create_event_fact_no_function_encryption"
    type: "constraint"
    statement: "任务正文不支持函数加密等安全相关操作。"
    status: "confirmed"
    source_anchor: "L19-L23"
