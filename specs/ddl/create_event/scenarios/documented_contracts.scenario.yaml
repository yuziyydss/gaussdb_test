schema_version: 1
kind: "scenario"
id: "scenario_create_event_documented_contracts"
name: "CREATE EVENT documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "create_event"
fixture_refs: []
fact_refs:
  - "create_event_fact_purpose"
  - "create_event_fact_compat_b"
  - "create_event_fact_privilege"
  - "create_event_fact_float_rounding"
  - "create_event_fact_unique"
  - "create_event_fact_body_limits"
  - "create_event_fact_security_body"
  - "create_event_fact_definer_admin"
  - "create_event_fact_definer_initial"
  - "create_event_fact_definer_admin_roles"
  - "create_event_fact_definer_separation"
  - "create_event_fact_plaintext_password"
  - "create_event_fact_failure_metadata"
  - "create_event_fact_definer_execution"
  - "create_event_fact_definer_admin_repeat"
  - "create_event_fact_underscore_units"
  - "create_event_fact_once"
  - "create_event_fact_repeat"
  - "create_event_fact_starts"
  - "create_event_fact_ends"
  - "create_event_fact_completion"
  - "create_event_fact_enabled"
  - "create_event_fact_comments"
  - "create_event_fact_no_crypto_functions"
  - "create_event_fact_no_identity_ddl"
  - "create_event_fact_no_connect"
  - "create_event_fact_no_function_encryption"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "创建满足时间条件后自动执行SQL的数据库定时任务。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "仅sql_compatibility=B支持。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "非SYSADMIN须由SYSADMIN赋予与DBE_SCHEDULER一致的任务操作权限。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "interval浮点语法可接受但计算取整，不推荐。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "同数据库任务名不得重复。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "任务正文为非安全类SQL，受语句约束；例如不能经复合语句创建数据库。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "任务不支持加密函数、创建设置用户/GROUP、数据库连接、函数加密等安全操作。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "指定DEFINER须SYSADMIN。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "当前用户与DEFINER不同且DEFINER为初始用户时禁止。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "不同DEFINER不得为运维/监控管理员。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "当前用户与DEFINER不同且开启三权分立时禁止。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "任务正文涉及密码时目录记录明文，禁止将真实密码放入任务SQL。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "创建后运行失败原因通过SHOW EVENTS或PG_JOB查看。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "默认创建者权限执行，指定DEFINER时使用指定者权限。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "仅SYSADMIN可指定DEFINER。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "下划线复合单位仅B模式且b_format_version=5.7、b_format_dev_version=s1。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "AT timestamp加interval仅执行一次。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "EVERY按interval重复。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "STARTS指定起点，省略当前时刻。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "ENDS指定终点，省略3999-12-31 16:00:00。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "完成后默认立即删除任务，PRESERVE保留。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "默认ENABLE；DISABLE ON SLAVE与DISABLE一致。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "COMMENT写入GS_JOB_ATTRIBUTE。"
  -
    id: "verify_create_event_fact_no_crypto_functions"
    action: "verify_documented_contract"
    note: "任务正文不支持使用加密函数。"
  -
    id: "verify_create_event_fact_no_identity_ddl"
    action: "verify_documented_contract"
    note: "任务正文不支持创建/设置用户或GROUP。"
  -
    id: "verify_create_event_fact_no_connect"
    action: "verify_documented_contract"
    note: "任务正文不支持连接数据库。"
  -
    id: "verify_create_event_fact_no_function_encryption"
    action: "verify_documented_contract"
    note: "任务正文不支持函数加密等安全相关操作。"
oracles:
  -
    kind: "documented_behavior"
    expected: "interval浮点语法可接受但计算取整，不推荐。"
  -
    kind: "documented_behavior"
    expected: "创建后运行失败原因通过SHOW EVENTS或PG_JOB查看。"
  -
    kind: "documented_behavior"
    expected: "默认创建者权限执行，指定DEFINER时使用指定者权限。"
  -
    kind: "documented_behavior"
    expected: "AT timestamp加interval仅执行一次。"
  -
    kind: "documented_behavior"
    expected: "EVERY按interval重复。"
  -
    kind: "documented_behavior"
    expected: "STARTS指定起点，省略当前时刻。"
  -
    kind: "documented_behavior"
    expected: "ENDS指定终点，省略3999-12-31 16:00:00。"
  -
    kind: "documented_behavior"
    expected: "完成后默认立即删除任务，PRESERVE保留。"
  -
    kind: "documented_behavior"
    expected: "默认ENABLE；DISABLE ON SLAVE与DISABLE一致。"
  -
    kind: "documented_behavior"
    expected: "COMMENT写入GS_JOB_ATTRIBUTE。"
execution_requirements:
  - "database"
  - "same_session"
