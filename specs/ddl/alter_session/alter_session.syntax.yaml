schema_version: 1
kind: "syntax"
id: "syntax_alter_session"
name: "ALTER SESSION 语法"
factor_ref: "alter_session"
category: "DDL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  form:
    type: "token"
    optional: true
    dimension_ref: "alter_session.form"
  characteristics:
    type: "token"
    optional: true
    dimension_ref: "alter_session.characteristics"
  transaction_modes:
    type: "token"
    optional: true
    dimension_ref: "alter_session.transaction_modes"
  assignment:
    type: "token"
    optional: true
    dimension_ref: "alter_session.assignment"
  generic_value:
    type: "token"
    optional: true
    dimension_ref: "alter_session.generic_value"
  schema_name:
    type: "token"
    optional: true
    dimension_ref: "alter_session.schema_name"
  timezone:
    type: "token"
    optional: true
    dimension_ref: "alter_session.timezone"
  xml_mode:
    type: "token"
    optional: true
    dimension_ref: "alter_session.xml_mode"
source_fact_refs:
  - "alter_session_fact_transaction_syntax"
  - "alter_session_fact_generic_syntax"
  - "alter_session_fact_start_modes"
  - "alter_session_fact_config_name"
  - "alter_session_fact_config_value"
  - "alter_session_fact_default_token"
  - "alter_session_fact_off_token"
  - "alter_session_fact_reset_token"
  - "alter_session_fact_timezone"
  - "alter_session_fact_schema"
  - "alter_session_fact_names"
  - "alter_session_fact_role_name"
  - "alter_session_fact_authorization"
  - "alter_session_fact_xml"
  - "alter_session_fact_current_schema_syntax"
  - "alter_session_fact_timezone_syntax"
  - "alter_session_fact_schema_syntax"
  - "alter_session_fact_names_syntax"
  - "alter_session_fact_role_syntax"
  - "alter_session_fact_authorization_syntax"
  - "alter_session_fact_xml_syntax"
ast:
  kind: "choice"
  selector: "form"
  branches:
    alter_session_form_transaction:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER SESSION SET "
        -
          kind: "slot"
          slot: "characteristics"
        -
          kind: "literal"
          text: " TRANSACTION "
        -
          kind: "repeat"
          slot: "transaction_modes"
          separator: ", "
          items_property: "items"
    alter_session_form_generic:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER SESSION SET DATESTYLE "
        -
          kind: "slot"
          slot: "assignment"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "generic_value"
    alter_session_form_from_current:
      kind: "literal"
      text: "ALTER SESSION SET DATESTYLE FROM CURRENT"
    alter_session_form_current_schema:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER SESSION SET CURRENT_SCHEMA "
        -
          kind: "slot"
          slot: "assignment"
        -
          kind: "literal"
          text: " "
        -
          kind: "slot"
          slot: "schema_name"
    alter_session_form_schema:
      kind: "literal"
      text: "ALTER SESSION SET SCHEMA 'fp_cs_one'"
    alter_session_form_timezone:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER SESSION SET TIME ZONE "
        -
          kind: "slot"
          slot: "timezone"
    alter_session_form_names:
      kind: "literal"
      text: "ALTER SESSION SET NAMES 'UTF8'"
    alter_session_form_xml:
      kind: "sequence"
      items:
        -
          kind: "literal"
          text: "ALTER SESSION SET XML OPTION "
        -
          kind: "slot"
          slot: "xml_mode"
    alter_session_form_authorization_default:
      kind: "literal"
      text: "ALTER SESSION SET SESSION AUTHORIZATION DEFAULT"
