schema_version: 1
kind: "scenario"
id: "scenario_alter_session_documented_contracts"
name: "ALTER SESSION documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "alter_session"
fixture_refs: []
fact_refs:
  - "alter_session_fact_session_scope"
  - "alter_session_fact_active_transaction"
  - "alter_session_fact_value_restriction"
  - "alter_session_fact_from_current"
  - "alter_session_fact_current_schema"
  - "alter_session_fact_password"
  - "alter_session_fact_read_committed"
  - "alter_session_fact_read_uncommitted"
  - "alter_session_fact_config_default"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "修改当前会话参数，保持到连接断开。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "设置当前事务参数前必须启动事务，否则立即结束而无法显示效果。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "用户值须满足对应参数的范围限制。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "FROM CURRENT将当前会话值设为参数值。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "CURRENT_SCHEMA要求已有模式；不存在的模式导致值为空。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "角色切换所用密码。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "READ COMMITTED是默认隔离级别，只能读取已提交数据。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "READ UNCOMMITTED的实际行为与READ COMMITTED一致。"
  -
    id: "check_alter_session_fact_config_default"
    action: "verify_documented_contract"
    note: "通用赋值中的DEFAULT恢复对应参数默认值。"
oracles:
  -
    kind: "documented_behavior"
    expected: "FROM CURRENT将当前会话值设为参数值。"
  -
    kind: "documented_behavior"
    expected: "CURRENT_SCHEMA要求已有模式；不存在的模式导致值为空。"
  -
    kind: "documented_behavior"
    expected: "READ COMMITTED是默认隔离级别，只能读取已提交数据。"
  -
    kind: "documented_behavior"
    expected: "READ UNCOMMITTED的实际行为与READ COMMITTED一致。"
execution_requirements:
  - "database"
  - "same_session"
