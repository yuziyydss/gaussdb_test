    type: "lifecycle"
    statement: "删除模式。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "drop_schema_fact_permission"
    type: "environment"
    statement: "模式所有者或 DROP 授权者可删除。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "drop_schema_fact_sysadmin"
    type: "environment"
    statement: "三权分立关闭时系统管理员默认有删除权限。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "drop_schema_fact_developer"
    type: "environment"
    statement: "allow_system_table_mods 关闭时禁止删除 DBE_PLDEVELOPER。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "drop_schema_fact_system"
    type: "environment"
    statement: "系统模式仅初始用户有删除权限。"
    status: "confirmed"
    source_anchor: "L11-L11"
  -
    id: "drop_schema_fact_public"
    type: "constraint"
    statement: "Public Schema 不支持删除。"
    status: "confirmed"
    source_anchor: "L11-L11"
  -
    id: "drop_schema_fact_syntax"
    type: "syntax"
    statement: "DROP SCHEMA 可选 IF EXISTS、重复名称列表及 CASCADE/RESTRICT。"
    status: "confirmed"
    source_anchor: "L14-L14"
  -
    id: "drop_schema_fact_notice"
    type: "behavior_oracle"
    statement: "IF EXISTS 对缺失模式只发 NOTICE，不抛错误。"
    status: "confirmed"
    source_anchor: "L20-L21"
  -
    id: "drop_schema_fact_existing"
    type: "constraint"
    statement: "名称指向已有模式，IF EXISTS 缺失例外单列。"
    status: "confirmed"
    source_anchor: "L22-L24"
  -
    id: "drop_schema_fact_cascade"
    type: "lifecycle"
    statement: "CASCADE 自动删除模式中的对象。"
    status: "confirmed"
    source_anchor: "L25-L26"
  -
    id: "drop_schema_fact_restrict"
    type: "constraint"
    statement: "非空模式在 RESTRICT 下删除失败。"
    status: "confirmed"
    source_anchor: "L27-L27"
  -
    id: "drop_schema_fact_default"
    type: "behavior_oracle"
    statement: "RESTRICT 是默认行为。"
    status: "confirmed"
    source_anchor: "L27-L27"
  -
    id: "drop_schema_fact_error_identity"
    type: "open_question"
    statement: "非空模式或缺失模式的准确错误身份需在目标版本校准。"
    status: "needs_verification"
    source_anchor: "L27-L27"
  -
    id: "drop_schema_fact_temporary_safety"
    type: "environment"
    statement: "不要随意删除 pg_temp/pg_toast_temp 模式，可能有不可预知后果。"
    status: "confirmed"
    source_anchor: "L32-L33"
  -
    id: "drop_schema_fact_current"
    type: "environment"
    statement: "不能直接删除当前模式，需要先切换到其他模式。"
    status: "confirmed"
    source_anchor: "L34-L34"
  -
    id: "drop_schema_fact_example_role"
    type: "example"
    statement: "示例准备角色。"
    status: "confirmed"
    source_anchor: "L38-L39"
  -
    id: "drop_schema_fact_example_create"
    type: "example"
    statement: "创建授权给角色的模式。"
    status: "confirmed"
    source_anchor: "L41-L43"
  -
    id: "drop_schema_fact_example_drop"
    type: "example"
    statement: "示例 CASCADE 删除模式。"
    status: "confirmed"
    source_anchor: "L45-L46"
