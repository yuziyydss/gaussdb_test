schema_version: 1
kind: "manifest"
id: "manifest_drop_schema_positive"
name: "DROP SCHEMA positive"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "drop_schema"
syntax_ref: "syntax_drop_schema"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_drop_schema_schema_contents"
identifier_policy: {}
bindings:
  if_exists:
    - "drop_schema_if_exists_absent"
    - "drop_schema_if_exists_present"
  targets:
    - "drop_schema_targets_empty"
    - "drop_schema_targets_occupied"
    - "drop_schema_targets_two"
    - "drop_schema_targets_missing"
  behavior:
    - "drop_schema_behavior_default"
    - "drop_schema_behavior_restrict"
    - "drop_schema_behavior_cascade"
local_rules:
  - expression: "targets not in ['drop_schema_targets_occupied','drop_schema_targets_two'] or behavior == 'drop_schema_behavior_cascade'"
    rationale: 非空Schema需要CASCADE；RESTRICT负向候选退回审阅。
    fact_refs: [drop_schema_fact_restrict]
  - expression: "targets != 'drop_schema_targets_missing' or if_exists == 'drop_schema_if_exists_present'"
    rationale: 缺失Schema必须带IF EXISTS；无IF EXISTS缺失目标负向退回审阅。
    fact_refs: [drop_schema_fact_existing]

expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
environment_requirements:
  -
    key: "search_path_excludes_test_schemas"
    allowed_values:
      - "true"
    fact_refs:
      - "drop_schema_fact_current"
