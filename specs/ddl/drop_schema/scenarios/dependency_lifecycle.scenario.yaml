schema_version: 1
kind: "scenario"
id: "scenario_drop_schema_dependency_lifecycle"
name: "DROP SCHEMA dependency_lifecycle"
status: "planned"
description: "空模式删除、非空 RESTRICT 拒绝及 CASCADE 清理分开运行。"
factor_ref: "drop_schema"
fixture_refs:
  - "fixture_drop_schema_schema_contents"
fact_refs:
  - "drop_schema_fact_error_identity"
  - "drop_schema_fact_purpose"
  - "drop_schema_fact_cascade"
  - "drop_schema_fact_default"
  - "drop_schema_fact_restrict"
  - "drop_schema_fact_existing"
  - "drop_schema_fact_notice"
  - "drop_schema_fact_example_create"
  - "drop_schema_fact_example_drop"
  - "create_schema::create_schema_fact_purpose"
preconditions:
  - "自动提交独占连接，当前模式不是测试目标"
steps:
  -
    id: "restrict"
    action: "execute_sql"
    sql: "DROP SCHEMA fp_cs_two RESTRICT;"
  -
    id: "cascade"
    action: "execute_sql"
    sql: "DROP SCHEMA fp_cs_two CASCADE;"
  -
    id: "notice"
    action: "execute_sql"
    sql: "DROP SCHEMA IF EXISTS fp_cs_two;"
oracles:
  -
    after_step: "restrict"
    kind: "target_error"
    oracle_status: "needs_verification"
  -
    after_step: "cascade"
    kind: "schema_absent"
    expected: "fp_cs_two"
  -
    after_step: "notice"
    kind: "notice"
    expected: "模式不存在且语句成功"
execution_requirements:
  - "database"
  - "same_session"
