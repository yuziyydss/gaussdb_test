facts:
  -
    id: "create_database_link_fact_purpose"
    type: "lifecycle"
    statement: "创建DATABASE LINK对象。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_database_link_fact_external_guide"
    type: "environment"
    statement: "完整连接合同依赖未提供的开发指南DATABASE LINK章节。"
    status: "confirmed"
    source_anchor: "L8-L9"
  -
    id: "create_database_link_fact_compat_a"
    type: "environment"
    statement: "仅A兼容模式支持。"
    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "create_database_link_fact_no_initial"
    type: "environment"
    statement: "禁止连接初始用户，也禁止初始用户创建/修改/删除DBLink。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "create_database_link_fact_deferred_connect"
    type: "behavior_oracle"
    statement: "创建时不验证连接成功，缺参数可能使用时报错。"
    status: "confirmed"
    source_anchor: "L13-L14"
  -
    id: "create_database_link_fact_upgrade"
    type: "environment"
    statement: "升级未提交时不能创建使用DBLink。"
    status: "confirmed"
    source_anchor: "L16-L16"
  -
    id: "create_database_link_fact_missing_credentials"
    type: "behavior_oracle"
    statement: "省略CURRENT_USER和CONNECT TO时以初始用户名空密码连接，会失败。"
    status: "confirmed"
    source_anchor: "L17-L18"
  -
    id: "create_database_link_fact_loopback"
    type: "environment"
    statement: "localhost、127.0.0.1或本机IP配端口可连接当前实例。"
    status: "confirmed"
    source_anchor: "L19-L20"
  -
    id: "create_database_link_fact_public"
    type: "behavior_oracle"
    statement: "PUBLIC对所有用户可见，省略为仅当前用户私有。"
    status: "confirmed"
    source_anchor: "L35-L37"
  -
    id: "create_database_link_fact_name"
    type: "syntax"
    statement: "dblink指定连接对象名。"
    status: "confirmed"
    source_anchor: "L38-L39"
  -
    id: "create_database_link_fact_remote_user"
    type: "syntax"
    statement: "CONNECT TO用户为远端用户名。"
    status: "confirmed"
    source_anchor: "L40-L41"
  -
    id: "create_database_link_fact_password"
    type: "environment"
    statement: "IDENTIFIED BY需要远端用户密码，不可存入普通SQL快照。"
    status: "confirmed"
    source_anchor: "L42-L43"
  -
    id: "create_database_link_fact_current_user"
    type: "behavior_oracle"
    statement: "CURRENT_USER使用初始用户名与空密码，并非安全的当前身份透传。"
    status: "confirmed"
    source_anchor: "L44-L45"
  -
    id: "create_database_link_fact_oci"
    type: "syntax"
    statement: "name仅OCI或省略，分别连接Oracle/GaussDB。"
    status: "confirmed"
    source_anchor: "L46-L48"
  -
    id: "create_database_link_fact_using"
    type: "syntax"
    statement: "USING指定IP、端口和数据库等选项。"
    status: "confirmed"
    source_anchor: "L49-L51"
  -
    id: "create_database_link_fact_host"
    type: "environment"
    statement: "host可逗号分隔多个IP，默认空；不支持密态数据库。"
    status: "confirmed"
    source_anchor: "L52-L54"
  -
    id: "create_database_link_fact_port"
    type: "syntax"
    statement: "默认端口5432。"
    status: "confirmed"
    source_anchor: "L55-L55"
  -
    id: "create_database_link_fact_dbname"
    type: "syntax"
    statement: "默认dbname为远程连接用户名。"
    status: "confirmed"
    source_anchor: "L56-L56"
  -
    id: "create_database_link_fact_fetch_size"
    type: "constraint"
    statement: "fetch_size范围0..2147483647，默认100。"
    status: "confirmed"
    source_anchor: "L57-L58"
  -
    id: "create_database_link_fact_dbserver"
    type: "environment"
    statement: "Oracle实例[ip]:端口/实例名；IPv6必须[]，SSL指定TNS名称。"
    status: "confirmed"
    source_anchor: "L59-L63"
  -
    id: "create_database_link_fact_isolation"
    type: "constraint"
    statement: "Oracle事务隔离serializable/read_committed/read_only，默认serializable。"
    status: "confirmed"
    source_anchor: "L65-L66"
  -
    id: "create_database_link_fact_max_long"
    type: "constraint"
    statement: "max_long范围1..1073741823，预置暂不生效。"
    status: "confirmed"
    source_anchor: "L67-L68"
  -
    id: "create_database_link_fact_strip_zeros"
    type: "behavior_oracle"
    statement: "yes/on/true删除ASCII 0字符。"
    status: "confirmed"
    source_anchor: "L69-L70"
  -
    id: "create_database_link_fact_prefetch"
    type: "constraint"
    statement: "prefetch范围1..1000，默认50行。"
    status: "confirmed"
    source_anchor: "L71-L72"
  -
    id: "create_database_link_fact_lob_prefetch"
    type: "constraint"
    statement: "lob_prefetch范围0..536870912，默认1048576，预置暂不生效。"
    status: "confirmed"
    source_anchor: "L73-L75"
  -
    id: "create_database_link_fact_timeout"
    type: "constraint"
    statement: "time_out范围0..2147483647，默认0不超时。"
    status: "confirmed"
    source_anchor: "L76-L77"
  -
    id: "create_database_link_fact_case_switch"
    type: "behavior_oracle"
    statement: "case_insensitive默认off。"
    status: "confirmed"
    source_anchor: "L78-L79"
  -
    id: "create_database_link_fact_case_on_tables"
    type: "behavior_oracle"
    statement: "on时表名/Schema默认转大写访问。"
    status: "confirmed"
    source_anchor: "L81-L84"
  -
    id: "create_database_link_fact_case_on_columns"
    type: "behavior_oracle"
    statement: "on时列名本地存小写，不能双引号大写查询。"
    status: "confirmed"
    source_anchor: "L85-L86"
  -
    id: "create_database_link_fact_case_on_mixed"
    type: "constraint"
    statement: "on时无法查询远端小写/大小写混用表名、Schema及列名。"
    status: "confirmed"
    source_anchor: "L87-L88"
  -
    id: "create_database_link_fact_case_off_upper"
    type: "behavior_oracle"
    statement: "off时大写标识符要双引号保留。"
    status: "confirmed"
    source_anchor: "L90-L92"
  -
    id: "create_database_link_fact_case_off_mixed"
    type: "behavior_oracle"
    statement: "off时混合大小写标识符需双引号。"
    status: "confirmed"
    source_anchor: "L93-L94"
  -
    id: "create_database_link_fact_case_off_lower"
    type: "behavior_oracle"
    statement: "off时小写可不引用或双引号。"
    status: "confirmed"
    source_anchor: "L95-L96"
  -
    id: "create_database_link_fact_ssl_wallet"
    type: "environment"
    statement: "Oracle SSL需OCI客户端sqlnet.ora配置wallet证书路径及SSL属性。"
    status: "confirmed"
    source_anchor: "L100-L102"
  -
    id: "create_database_link_fact_ssl_tns"
    type: "environment"
    statement: "tnsnames.ora TNS必须与服务端TCPS配置一致。"
    status: "confirmed"
    source_anchor: "L114-L115"
  -
    id: "create_database_link_fact_ssl_name"
    type: "environment"
    statement: "DBSERVER须使用已配置TNS名。"
    status: "confirmed"
    source_anchor: "L124-L125"
  -
    id: "create_database_link_fact_ssl_first_connect"
    type: "environment"
    statement: "首次连接前tnsnames.ora须存在，否则配置后需重启GaussDB。"
    status: "confirmed"
    source_anchor: "L126-L129"
  -
    id: "create_database_link_fact_syntax"
    type: "syntax"
    statement: "原文选项/产生式：CREATE [ PUBLIC ] DATABASE LINK dblink [ CONNECT TO { CURRENT_USER | 'user' IDENTIFIED BY 'password' } ] [name] [ USING ( option 'value' [...]) ];"
    status: "confirmed"
    source_anchor: "L23-L24"
  -
    id: "create_database_link_fact_gauss_options"
    type: "syntax"
    statement: "原文选项/产生式：当name为空时，连接GaussDB数据库option如下： { HOST | PORT | DBNAME | FETCH_SIZE }"
    status: "confirmed"
    source_anchor: "L26-L27"
  -
    id: "create_database_link_fact_oracle_options"
    type: "syntax"
    statement: "原文选项/产生式：当name为OCI时，连接Oracle数据库option如下： { DBSERVER | ISOLATION_LEVEL | MAX_LONG | STRIP_ZEROS | PREFETCH | LOB_PREFETCH | TIME_OUT | CASE_INSENSITIVE }"
    status: "confirmed"
    source_anchor: "L29-L31"
  -
    id: "create_database_link_fact_wallet_example"
    type: "example"
    statement: "sqlnet.ora示例配置，不复制证书路径及套件为测试环境事实。"
    status: "confirmed"
    source_anchor: "L103-L113"
  -
    id: "create_database_link_fact_tns_example"
    type: "example"
    statement: "TNS格式示例含HOST/PORT占位符。"
    status: "confirmed"
    source_anchor: "L116-L123"
  -
    id: "create_database_link_fact_secret_runtime"
    type: "open_question"
    statement: "缺少非初始用户、A兼容库、远端授权和秘密注入接口；不生成假密码/远端IP，创建成功不能代替连通性。"
    status: "needs_verification"
    source_anchor: "L42-L43"
  -
    id: "create_database_link_fact_using_separator"
    type: "open_question"
    statement: "主模板option重复未画逗号，参数说明/示例有逗号，需绑定后端语法探针。"
    status: "needs_verification"
    source_anchor: "L23-L24"
  -
    id: "create_database_link_fact_private_cleanup"
    type: "open_question"
    statement: "示例私有连接用DROP PUBLIC，不能照抄为通用cleanup；必须按对象实际可见性清理。"
    status: "needs_verification"
    source_anchor: "L35-L37"
  -
    id: "create_database_link_fact_example_lines_133"
    type: "example"
    statement: "示例片段（仅作来源证据）：-- 前置条件。 gaussdb=# CREATE USER local_user WITH SYSADMIN PASSWORD '********'; CREATE ROLE gaussdb=# SET ROLE local_user PASSWORD '********'; SET"
    status: "confirmed"
    source_anchor: "L133-L137"
  -
    id: "create_database_link_fact_example_lines_139"
    type: "example"
    statement: "示例片段（仅作来源证据）：-- 创建私有DBLink，host也可以是IPv6地址。 gaussdb=# CREATE DATABASE LINK private_dblink CONNECT TO 'remote_user' IDENTIFIED BY '********' USING (host '***.***.***.***',port '*****',dbname 'remote_db'); CREATE DATABASE LINK"
    status: "confirmed"
    source_anchor: "L139-L142"
  -
    id: "create_database_link_fact_example_lines_144"
    type: "example"
    statement: "示例片段（仅作来源证据）：-- 创建公共DBLink，host也可以是IPv6地址。 gaussdb=# CREATE PUBLIC DATABASE LINK public_dblink CONNECT TO 'remote_user' IDENTIFIED BY '********' USING (host '***.***.***.***',port '*****',dbname 'remote_db'); CREATE DATABASE LINK"
    status: "confirmed"
    source_anchor: "L144-L147"
  -
    id: "create_database_link_fact_example_lines_149"
    type: "example"
    statement: "示例片段（仅作来源证据）：-- 创建公共连接Oracle库的DBLink。 gaussdb=# CREATE PUBLIC DATABASE LINK public_dblink_to_o CONNECT TO 'oracle_user' IDENTIFIED BY '********' OCI USING (dbserver '***.***.***.***/orcl', prefetch '100'); CREATE DATABASE LINK"
    status: "confirmed"
    source_anchor: "L149-L152"
  -
    id: "create_database_link_fact_example_lines_154"
    type: "example"
    statement: "示例片段（仅作来源证据）：-- 创建使用SSL连接Oracle库的DBLink。 gaussdb=# CREATE PUBLIC DATABASE LINK public_dblink_SSL CONNECT TO 'oracle_user' IDENTIFIED BY '********' OCI USING (dbserver 'ORA_SSL'); CREATE DATABASE LINK"
    status: "confirmed"
    source_anchor: "L154-L157"
  -
    id: "create_database_link_fact_example_lines_159"
    type: "example"
    statement: "示例片段（仅作来源证据）：-- 清理环境。 gaussdb=# DROP PUBLIC DATABASE LINK private_dblink; DROP DATABASE LINK"
    status: "confirmed"
    source_anchor: "L159-L162"
  -
    id: "create_database_link_fact_example_lines_163"
    type: "example"
    statement: "示例片段（仅作来源证据）：gaussdb=# DROP PUBLIC DATABASE LINK public_dblink; DROP DATABASE LINK"
    status: "confirmed"
    source_anchor: "L163-L164"
  -
    id: "create_database_link_fact_example_lines_165"
    type: "example"
    statement: "示例片段（仅作来源证据）：gaussdb=# DROP PUBLIC DATABASE LINK public_dblink_to_o; DROP DATABASE LINK"
    status: "confirmed"
    source_anchor: "L165-L166"
  -
    id: "create_database_link_fact_example_lines_167"
    type: "example"
    statement: "示例片段（仅作来源证据）：gaussdb=# DROP PUBLIC DATABASE LINK public_dblink_SSL; DROP DATABASE LINK"
    status: "confirmed"
    source_anchor: "L167-L168"
  -
    id: "create_database_link_fact_example_lines_169"
    type: "example"
    statement: "示例片段（仅作来源证据）：gaussdb=# RESET ROLE; RESET"
    status: "confirmed"
    source_anchor: "L169-L170"
  -
    id: "create_database_link_fact_example_lines_171"
    type: "example"
    statement: "示例片段（仅作来源证据）：gaussdb=# DROP USER local_user; DROP ROLE"
    status: "confirmed"
    source_anchor: "L171-L172"
