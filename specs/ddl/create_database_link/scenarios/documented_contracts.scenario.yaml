schema_version: 1
kind: "scenario"
id: "scenario_create_database_link_documented_contracts"
name: "CREATE DATABASE LINK documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "create_database_link"
fixture_refs: []
fact_refs:
  - "create_database_link_fact_private_cleanup"
  - "create_database_link_fact_secret_runtime"
  - "create_database_link_fact_using_separator"
  - "create_database_link_fact_purpose"
  - "create_database_link_fact_external_guide"
  - "create_database_link_fact_compat_a"
  - "create_database_link_fact_no_initial"
  - "create_database_link_fact_deferred_connect"
  - "create_database_link_fact_upgrade"
  - "create_database_link_fact_missing_credentials"
  - "create_database_link_fact_loopback"
  - "create_database_link_fact_public"
  - "create_database_link_fact_password"
  - "create_database_link_fact_current_user"
  - "create_database_link_fact_host"
  - "create_database_link_fact_fetch_size"
  - "create_database_link_fact_dbserver"
  - "create_database_link_fact_isolation"
  - "create_database_link_fact_max_long"
  - "create_database_link_fact_strip_zeros"
  - "create_database_link_fact_prefetch"
  - "create_database_link_fact_lob_prefetch"
  - "create_database_link_fact_timeout"
  - "create_database_link_fact_case_switch"
  - "create_database_link_fact_case_on_tables"
  - "create_database_link_fact_case_on_columns"
  - "create_database_link_fact_case_on_mixed"
  - "create_database_link_fact_case_off_upper"
  - "create_database_link_fact_case_off_mixed"
  - "create_database_link_fact_case_off_lower"
  - "create_database_link_fact_ssl_wallet"
  - "create_database_link_fact_ssl_tns"
  - "create_database_link_fact_ssl_name"
  - "create_database_link_fact_ssl_first_connect"
preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "创建DATABASE LINK对象。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "完整连接合同依赖未提供的开发指南DATABASE LINK章节。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "仅A兼容模式支持。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "禁止连接初始用户，也禁止初始用户创建/修改/删除DBLink。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "创建时不验证连接成功，缺参数可能使用时报错。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "升级未提交时不能创建使用DBLink。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "省略CURRENT_USER和CONNECT TO时以初始用户名空密码连接，会失败。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "localhost、127.0.0.1或本机IP配端口可连接当前实例。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "PUBLIC对所有用户可见，省略为仅当前用户私有。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "IDENTIFIED BY需要远端用户密码，不可存入普通SQL快照。"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "CURRENT_USER使用初始用户名与空密码，并非安全的当前身份透传。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "host可逗号分隔多个IP，默认空；不支持密态数据库。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "fetch_size范围0..2147483647，默认100。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "Oracle实例[ip]:端口/实例名；IPv6必须[]，SSL指定TNS名称。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "Oracle事务隔离serializable/read_committed/read_only，默认serializable。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "max_long范围1..1073741823，预置暂不生效。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "yes/on/true删除ASCII 0字符。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "prefetch范围1..1000，默认50行。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "lob_prefetch范围0..536870912，默认1048576，预置暂不生效。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "time_out范围0..2147483647，默认0不超时。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "case_insensitive默认off。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "on时表名/Schema默认转大写访问。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "on时列名本地存小写，不能双引号大写查询。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "on时无法查询远端小写/大小写混用表名、Schema及列名。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "off时大写标识符要双引号保留。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "off时混合大小写标识符需双引号。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "off时小写可不引用或双引号。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "Oracle SSL需OCI客户端sqlnet.ora配置wallet证书路径及SSL属性。"
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "tnsnames.ora TNS必须与服务端TCPS配置一致。"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "DBSERVER须使用已配置TNS名。"
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "首次连接前tnsnames.ora须存在，否则配置后需重启GaussDB。"
oracles:
  -
    kind: "documented_behavior"
    expected: "创建时不验证连接成功，缺参数可能使用时报错。"
  -
    kind: "documented_behavior"
    expected: "省略CURRENT_USER和CONNECT TO时以初始用户名空密码连接，会失败。"
  -
    kind: "documented_behavior"
    expected: "PUBLIC对所有用户可见，省略为仅当前用户私有。"
  -
    kind: "documented_behavior"
    expected: "CURRENT_USER使用初始用户名与空密码，并非安全的当前身份透传。"
  -
    kind: "documented_behavior"
    expected: "yes/on/true删除ASCII 0字符。"
  -
    kind: "documented_behavior"
    expected: "case_insensitive默认off。"
  -
    kind: "documented_behavior"
    expected: "on时表名/Schema默认转大写访问。"
  -
    kind: "documented_behavior"
    expected: "on时列名本地存小写，不能双引号大写查询。"
  -
    kind: "documented_behavior"
    expected: "off时大写标识符要双引号保留。"
  -
    kind: "documented_behavior"
    expected: "off时混合大小写标识符需双引号。"
  -
    kind: "documented_behavior"
    expected: "off时小写可不引用或双引号。"
execution_requirements:
  - "database"
  - "same_session"
