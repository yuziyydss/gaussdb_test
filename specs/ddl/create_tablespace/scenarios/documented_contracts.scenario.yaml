preconditions:
  - "不能用新Schema隔离文件系统表空间；须另行授权独占测试环境，核实目录/符号链接和对象归属，不能碰预存同名对象。"
  - "CREATE与DROP不得放在事务块；ALTER按目标行存形态核实非事务限制。部分创建失败仍可能留下文件，SQL回滚不能证明恢复完成。"
  - "先实现本次创建回执、空表空间确认及部分失败恢复审查；文档的手工清理说明不是本项目自动删除文件或重复DROP的授权。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "在数据库中创建一个新的表空间。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "●   系统管理员或者继承了内置角色gs_role_tablespace权限的用户可以创建表空间。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "●   不允许在一个事务块内部执行CREATE TABLESPACE操作。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "●   当表空间创建过程中内部目录/文件操作成功但后续步骤失败时，系统会产生残留 的目录/文件，重新创建表空间时，需要用户手动清理表空间指定的目录下残留的 内容。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "如果在创建过程中涉及到数据目录下的表空间软连接残留，需要先将软连 接的残留文件删除，再重新执行OM相关操作。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "●   CREATE TABLESPACE不支持两阶段事务，如果部分节点执行失败，不支持回滚。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "●     在HCS等场景下一般不建议用户使用自定义的表空间。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "原因：用户自定义表空间通常配合主存（即默认表空间所在的存储设备，如磁 盘）以外的其它存储介质使用，以隔离不同业务可以使用的I/O资源，而在HCS等 场景下，存储设备都是采用标准化的配置，无其它可用的存储介质，自定义表空 间使用不当不利于系统长稳运行以及影响整体性能，因此建议使用默认表空间即 可。"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "●     每个PDB拥有自己的表空间对象，在PDB中创建表空间时，仅支持使用相对路 径。"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "其中普通表空间的with_option_clause为： WITH ({filesystem= { ' general ' | \" general \" | general } | address = { ' ip:port [, ... ] ' | \" ip:port [, ... ] \" } | cfgpath = { ' path ' | \" path \" } | storepath = { ' rootpath ' | \" rootpath \" } | random_page_cost = { ' value ' | \" value \" | value } | seq_page_cost = { ' value ' | \" value \" | value }}[, ... ])"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "●     tablespace_name 要创建的表空间名称。"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "取值范围：字符串，要符合标识符命名规范。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "表空间名称不能和数据库中的其他表空间重名，且名称不能以\"pg\"作为表空间名称的前 缀。"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "●   OWNER user_name 表空间的所有者。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "默认情况下，新表空间的所有者为当前用户。"
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "取值范围：字符串，已存在的用户。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "只有系统管理员可以创建表空间，但是可以通过OWNER子句把表空间的所有权赋给其他 非系统管理员。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "●   RELATIVE"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "–   若指定该参数，表示使用相对路径，表空间的目录LOCATION是相对于各个 数据库节点数据目录下的。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "目录层次：数据目录/pg_location/相对路径。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "相对路径最多指定两层。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "–   若没有指定该参数，表示使用绝对表空间路径，表空间的目录LOCATION需 要使用绝对路径。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "●   LOCATION directory 用于表空间的目录。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "当创建绝对表空间路径时（即没有指定RELATIVE参数），对 于目录存在如下要求："
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "–   系统用户必须对该目录拥有读写权限，并且目录为空。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "如果该目录不存在， 将由系统自动创建。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "–   目录必须是绝对路径，目录中不得含有特殊字符（如$、>等）。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "–   目录不允许指定在数据库数据目录下。"
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "–   目录需为本地路径。"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "–   建议首选使用Ext4格式文件的目录。"
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "取值范围：字符串，有效的目录。"
  -
    id: "contract_31"
    action: "verify_documented_contract"
    note: "●   MAXSIZE 'space_size' 指定表空间在单个数据库节点上的最大值。"
  -
    id: "contract_32"
    action: "verify_documented_contract"
    note: "取值范围：当前支持的单位包括KB、MB、GB、TB以及PB，解析后的数值以KB为 单位且范围不能够超过64比特表示的有符号整数，即 1KB~9007199254740991KB。"
  -
    id: "contract_33"
    action: "verify_documented_contract"
    note: "●   address IP地址以及端口号。"
  -
    id: "contract_34"
    action: "verify_documented_contract"
    note: "●   cfgpath 配置文件地址。"
  -
    id: "contract_35"
    action: "verify_documented_contract"
    note: "●   storepath 根路径地址。"
  -
    id: "contract_36"
    action: "verify_documented_contract"
    note: "●   filesystem 表空间使用的文件系统。"
  -
    id: "contract_37"
    action: "verify_documented_contract"
    note: "取值范围："
  -
    id: "contract_38"
    action: "verify_documented_contract"
    note: "–   general：普通文件系统。"
  -
    id: "contract_39"
    action: "verify_documented_contract"
    note: "–   hdfs：当前版本不支持。"
  -
    id: "contract_40"
    action: "verify_documented_contract"
    note: "默认值：general。"
  -
    id: "contract_41"
    action: "verify_documented_contract"
    note: "●    random_page_cost 随机读取page所需要的时间和资源。"
  -
    id: "contract_42"
    action: "verify_documented_contract"
    note: "取值范围：0~1.79769e+308。"
  -
    id: "contract_43"
    action: "verify_documented_contract"
    note: "默认值：使用GUC参数random_page_cost的值。"
  -
    id: "contract_44"
    action: "verify_documented_contract"
    note: "●    seq_page_cost 指定顺序读取page所需要的时间和资源。"
  -
    id: "contract_45"
    action: "verify_documented_contract"
    note: "取值范围：0~1.79769e+308。"
  -
    id: "contract_46"
    action: "verify_documented_contract"
    note: "默认值：使用GUC参数seq_page_cost的值。"
