facts:
  -
    id: "create_tablespace_fact_body_5"
    type: "constraint"
    statement: "在数据库中创建一个新的表空间。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_tablespace_fact_body_8"
    type: "environment"
    statement: "●   系统管理员或者继承了内置角色gs_role_tablespace权限的用户可以创建表空间。"
    status: "confirmed"
    source_anchor: "L8-L8"
  -
    id: "create_tablespace_fact_body_9"
    type: "constraint"
    statement: "●   不允许在一个事务块内部执行CREATE TABLESPACE操作。"
    status: "confirmed"
    source_anchor: "L9-L9"
  -
    id: "create_tablespace_fact_body_10"
    type: "behavior_oracle"
    statement: "●   当表空间创建过程中内部目录/文件操作成功但后续步骤失败时，系统会产生残留 的目录/文件，重新创建表空间时，需要用户手动清理表空间指定的目录下残留的 内容。"
    status: "confirmed"
    source_anchor: "L10-L13"
  -
    id: "create_tablespace_fact_body_10_1"
    type: "behavior_oracle"
    statement: "如果在创建过程中涉及到数据目录下的表空间软连接残留，需要先将软连 接的残留文件删除，再重新执行OM相关操作。"
    status: "confirmed"
    source_anchor: "L10-L13"
  -
    id: "create_tablespace_fact_body_14"
    type: "constraint"
    statement: "●   CREATE TABLESPACE不支持两阶段事务，如果部分节点执行失败，不支持回滚。"
    status: "confirmed"
    source_anchor: "L14-L14"
  -
    id: "create_tablespace_fact_body_16"
    type: "behavior_oracle"
    statement: "●     在HCS等场景下一般不建议用户使用自定义的表空间。"
    status: "confirmed"
    source_anchor: "L16-L21"
  -
    id: "create_tablespace_fact_body_16_1"
    type: "behavior_oracle"
    statement: "原因：用户自定义表空间通常配合主存（即默认表空间所在的存储设备，如磁 盘）以外的其它存储介质使用，以隔离不同业务可以使用的I/O资源，而在HCS等 场景下，存储设备都是采用标准化的配置，无其它可用的存储介质，自定义表空 间使用不当不利于系统长稳运行以及影响整体性能，因此建议使用默认表空间即 可。"
    status: "confirmed"
    source_anchor: "L16-L21"
  -
    id: "create_tablespace_fact_body_22"
    type: "constraint"
    statement: "●     每个PDB拥有自己的表空间对象，在PDB中创建表空间时，仅支持使用相对路 径。"
    status: "confirmed"
    source_anchor: "L22-L23"
  -
    id: "create_tablespace_fact_grammar_line_27"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：CREATE TABLESPACE tablespace_name"
    status: "confirmed"
    source_anchor: "L27-L27"
  -
    id: "create_tablespace_fact_grammar_line_28"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：[ OWNER user_name ] [ RELATIVE ] LOCATION 'directory' [ MAXSIZE 'space_size' ]"
    status: "confirmed"
    source_anchor: "L28-L28"
  -
    id: "create_tablespace_fact_grammar_line_29"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：[with_option_clause];"
    status: "confirmed"
    source_anchor: "L29-L29"
  -
    id: "create_tablespace_fact_body_34"
    type: "constraint"
    statement: "其中普通表空间的with_option_clause为： WITH ({filesystem= { ' general ' | \" general \" | general } | address = { ' ip:port [, ... ] ' | \" ip:port [, ... ] \" } | cfgpath = { ' path ' | \" path \" } | storepath = { ' rootpath ' | \" rootpath \" } | random_page_cost = { ' value ' | \" value \" | value } | seq_page_cost = { ' value ' | \" value \" | value }}[, ... ])"
    status: "confirmed"
    source_anchor: "L34-L37"
  -
    id: "create_tablespace_fact_body_43"
    type: "constraint"
    statement: "●     tablespace_name 要创建的表空间名称。"
    status: "confirmed"
    source_anchor: "L43-L45"
  -
    id: "create_tablespace_fact_body_43_1"
    type: "constraint"
    statement: "取值范围：字符串，要符合标识符命名规范。"
    status: "confirmed"
    source_anchor: "L43-L45"
  -
    id: "create_tablespace_fact_body_49"
    type: "constraint"
    statement: "表空间名称不能和数据库中的其他表空间重名，且名称不能以\"pg\"作为表空间名称的前 缀。"
    status: "confirmed"
    source_anchor: "L49-L50"
  -
    id: "create_tablespace_fact_body_51"
    type: "behavior_oracle"
    statement: "●   OWNER user_name 表空间的所有者。"
    status: "confirmed"
    source_anchor: "L51-L53"
  -
    id: "create_tablespace_fact_body_51_1"
    type: "behavior_oracle"
    statement: "默认情况下，新表空间的所有者为当前用户。"
    status: "confirmed"
    source_anchor: "L51-L53"
  -
    id: "create_tablespace_fact_body_51_2"
    type: "behavior_oracle"
    statement: "取值范围：字符串，已存在的用户。"
    status: "confirmed"
    source_anchor: "L51-L53"
  -
    id: "create_tablespace_fact_body_56"
    type: "environment"
    statement: "只有系统管理员可以创建表空间，但是可以通过OWNER子句把表空间的所有权赋给其他 非系统管理员。"
    status: "confirmed"
    source_anchor: "L56-L57"
  -
    id: "create_tablespace_fact_body_58"
    type: "constraint"
    statement: "●   RELATIVE"
    status: "confirmed"
    source_anchor: "L58-L58"
  -
    id: "create_tablespace_fact_body_59"
    type: "constraint"
    statement: "–   若指定该参数，表示使用相对路径，表空间的目录LOCATION是相对于各个 数据库节点数据目录下的。"
    status: "confirmed"
    source_anchor: "L59-L61"
  -
    id: "create_tablespace_fact_body_59_1"
    type: "constraint"
    statement: "目录层次：数据目录/pg_location/相对路径。"
    status: "confirmed"
    source_anchor: "L59-L61"
  -
    id: "create_tablespace_fact_body_59_2"
    type: "constraint"
    statement: "相对路径最多指定两层。"
    status: "confirmed"
    source_anchor: "L59-L61"
  -
    id: "create_tablespace_fact_body_62"
    type: "constraint"
    statement: "–   若没有指定该参数，表示使用绝对表空间路径，表空间的目录LOCATION需 要使用绝对路径。"
    status: "confirmed"
    source_anchor: "L62-L63"
  -
    id: "create_tablespace_fact_body_64"
    type: "constraint"
    statement: "●   LOCATION directory 用于表空间的目录。"
    status: "confirmed"
    source_anchor: "L64-L66"
  -
    id: "create_tablespace_fact_body_64_1"
    type: "constraint"
    statement: "当创建绝对表空间路径时（即没有指定RELATIVE参数），对 于目录存在如下要求："
    status: "confirmed"
    source_anchor: "L64-L66"
  -
    id: "create_tablespace_fact_body_67"
    type: "environment"
    statement: "–   系统用户必须对该目录拥有读写权限，并且目录为空。"
    status: "confirmed"
    source_anchor: "L67-L68"
  -
    id: "create_tablespace_fact_body_67_1"
    type: "environment"
    statement: "如果该目录不存在， 将由系统自动创建。"
    status: "confirmed"
    source_anchor: "L67-L68"
  -
    id: "create_tablespace_fact_body_69"
    type: "constraint"
    statement: "–   目录必须是绝对路径，目录中不得含有特殊字符（如$、>等）。"
    status: "confirmed"
    source_anchor: "L69-L69"
  -
    id: "create_tablespace_fact_body_70"
    type: "constraint"
    statement: "–   目录不允许指定在数据库数据目录下。"
    status: "confirmed"
    source_anchor: "L70-L70"
  -
    id: "create_tablespace_fact_body_71"
    type: "constraint"
    statement: "–   目录需为本地路径。"
    status: "confirmed"
    source_anchor: "L71-L71"
  -
    id: "create_tablespace_fact_body_72"
    type: "constraint"
    statement: "–   建议首选使用Ext4格式文件的目录。"
    status: "confirmed"
    source_anchor: "L72-L73"
  -
    id: "create_tablespace_fact_body_72_1"
    type: "constraint"
    statement: "取值范围：字符串，有效的目录。"
    status: "confirmed"
    source_anchor: "L72-L73"
  -
    id: "create_tablespace_fact_body_74"
    type: "constraint"
    statement: "●   MAXSIZE 'space_size' 指定表空间在单个数据库节点上的最大值。"
    status: "confirmed"
    source_anchor: "L74-L78"
  -
    id: "create_tablespace_fact_body_74_1"
    type: "constraint"
    statement: "取值范围：当前支持的单位包括KB、MB、GB、TB以及PB，解析后的数值以KB为 单位且范围不能够超过64比特表示的有符号整数，即 1KB~9007199254740991KB。"
    status: "confirmed"
    source_anchor: "L74-L78"
  -
    id: "create_tablespace_fact_body_79"
    type: "constraint"
    statement: "●   address IP地址以及端口号。"
    status: "confirmed"
    source_anchor: "L79-L80"
  -
    id: "create_tablespace_fact_body_81"
    type: "constraint"
    statement: "●   cfgpath 配置文件地址。"
    status: "confirmed"
    source_anchor: "L81-L82"
  -
    id: "create_tablespace_fact_body_83"
    type: "constraint"
    statement: "●   storepath 根路径地址。"
    status: "confirmed"
    source_anchor: "L83-L84"
  -
    id: "create_tablespace_fact_body_85"
    type: "constraint"
    statement: "●   filesystem 表空间使用的文件系统。"
    status: "confirmed"
    source_anchor: "L85-L87"
  -
    id: "create_tablespace_fact_body_85_1"
    type: "constraint"
    statement: "取值范围："
    status: "confirmed"
    source_anchor: "L85-L87"
  -
    id: "create_tablespace_fact_body_88"
    type: "constraint"
    statement: "–   general：普通文件系统。"
    status: "confirmed"
    source_anchor: "L88-L88"
  -
    id: "create_tablespace_fact_body_89"
    type: "behavior_oracle"
    statement: "–   hdfs：当前版本不支持。"
    status: "confirmed"
    source_anchor: "L89-L90"
  -
    id: "create_tablespace_fact_body_89_1"
    type: "behavior_oracle"
    statement: "默认值：general。"
    status: "confirmed"
    source_anchor: "L89-L90"
  -
    id: "create_tablespace_fact_body_92"
    type: "environment"
    statement: "●    random_page_cost 随机读取page所需要的时间和资源。"
    status: "confirmed"
    source_anchor: "L92-L95"
  -
    id: "create_tablespace_fact_body_92_1"
    type: "environment"
    statement: "取值范围：0~1.79769e+308。"
    status: "confirmed"
    source_anchor: "L92-L95"
  -
    id: "create_tablespace_fact_body_92_2"
    type: "environment"
    statement: "默认值：使用GUC参数random_page_cost的值。"
    status: "confirmed"
    source_anchor: "L92-L95"
  -
    id: "create_tablespace_fact_body_96"
    type: "environment"
    statement: "●    seq_page_cost 指定顺序读取page所需要的时间和资源。"
    status: "confirmed"
    source_anchor: "L96-L99"
  -
    id: "create_tablespace_fact_body_96_1"
    type: "environment"
    statement: "取值范围：0~1.79769e+308。"
    status: "confirmed"
    source_anchor: "L96-L99"
  -
    id: "create_tablespace_fact_body_96_2"
    type: "environment"
    statement: "默认值：使用GUC参数seq_page_cost的值。"
    status: "confirmed"
    source_anchor: "L96-L99"
  -
    id: "create_tablespace_fact_example_102"
    type: "example"
    statement: "示例原文片段：--创建表空间。 gaussdb=# CREATE TABLESPACE tbs_location1 RELATIVE LOCATION 'test_tablespace/test_tablespace_1';"
    status: "confirmed"
    source_anchor: "L102-L103"
  -
    id: "create_tablespace_fact_example_105"
    type: "example"
    statement: "示例原文片段：--创建表空间指定最大值。 gaussdb=# CREATE TABLESPACE tbs_location2 RELATIVE LOCATION 'test_tablespace/test_tablespace_2' MAXSIZE '10G';"
    status: "confirmed"
    source_anchor: "L105-L107"
  -
    id: "create_tablespace_fact_example_109"
    type: "example"
    statement: "示例原文片段：--查询表空间信息。 gaussdb=# SELECT * FROM pg_tablespace WHERE spcname = 'tbs_location2'; spcname | spcowner | spcacl | spcoptions | spcmaxsize | relative ---------------+----------+--------+------------+------------+---------- tbs_location2 |       10 |      |        | 10485760 K | t (1 row)"
    status: "confirmed"
    source_anchor: "L109-L114"
  -
    id: "create_tablespace_fact_example_116"
    type: "example"
    statement: "示例原文片段：--创建用户joe。 gaussdb=# CREATE ROLE joe IDENTIFIED BY '********';"
    status: "confirmed"
    source_anchor: "L116-L117"
  -
    id: "create_tablespace_fact_example_119"
    type: "example"
    statement: "示例原文片段：--创建表空间，且所有者指定为用户joe。 gaussdb=# CREATE TABLESPACE tbs_location3 OWNER joe RELATIVE LOCATION 'test_tablespace/ test_tablespace_3';"
    status: "confirmed"
    source_anchor: "L119-L121"
  -
    id: "create_tablespace_fact_example_123"
    type: "example"
    statement: "示例原文片段：--创建表空间指定绝对路径（请根据实际情况修改路径）。 gaussdb=# CREATE TABLESPACE tbs_location4 LOCATION '/tmp/tbs_location4';"
    status: "confirmed"
    source_anchor: "L123-L124"
  -
    id: "create_tablespace_fact_example_126"
    type: "example"
    statement: "示例原文片段：--删除表空间及用户。 gaussdb=# DROP TABLESPACE tbs_location1; gaussdb=# DROP TABLESPACE tbs_location2; gaussdb=# DROP TABLESPACE tbs_location3; gaussdb=# DROP TABLESPACE tbs_location4; gaussdb=# DROP ROLE joe;"
    status: "confirmed"
    source_anchor: "L126-L131"
  -
    id: "create_tablespace_fact_runtime_contract"
    type: "environment"
    statement: "静态RELATIVE表空间代表不创建真实目录；服务端独占空目录、权限、磁盘及失败残留清理契约需专用环境，普通manifest不验证文件系统行为。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "create_tablespace_fact_privilege_conflict"
    type: "constraint"
    statement: "静态域使用当前系统管理员创建；L8继承gs_role_tablespace与L56–57仅管理员的说法差异保留为来源限制，不生成角色继承分支。"
    status: "confirmed"
    source_anchor: "L56-L57"
  -
    id: "create_tablespace_fact_maxsize_conflict"
    type: "constraint"
    statement: "静态域不生成MAXSIZE值；原文上限9007199254740991KB与64位有符号整数措辞不一致保留为来源限制，不擅自改为2^63−1。"
    status: "confirmed"
    source_anchor: "L74-L78"
