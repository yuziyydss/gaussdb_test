schema_version: 1
kind: "scenario"
id: "scenario_rollback_to_savepoint_failed_cursor"
name: "ROLLBACK TO SAVEPOINT failed_cursor"
status: "planned"
description: "必须先校准能在游标操作阶段产生错误的受控 fixture，不能用提前失败的 DECLARE 代替游标错误。"
factor_ref: "rollback_to_savepoint"
fixture_refs: []
fact_refs:
  - "rollback_to_savepoint_fact_failed_cursor_unusable"
  - "rollback_to_savepoint_fact_error_identity"
preconditions:
  - "专用游标错误 fixture 待实现"
steps:
  -
    id: "fixture"
    action: "calibrate_cursor_operation_failure"
  -
    id: "restore"
    action: "execute_sql"
    sql: "ROLLBACK TO sp_test"
  -
    id: "reuse"
    action: "fetch_failed_cursor"
oracles:
  -
    after_step: "reuse"
    kind: "target_error"
    expected: "cursor_unusable_after_transaction_restore"
    oracle_status: "needs_verification"
execution_requirements:
  - "database"
  - "same_session"
