schema_version: 1
kind: "scenario"
id: "scenario_rollback_to_savepoint_close_not_undone"
name: "ROLLBACK TO SAVEPOINT close_not_undone"
status: "planned"
description: "在保存点内关闭的旧游标，回滚后不应复活。"
factor_ref: "rollback_to_savepoint"
fixture_refs: []
fact_refs:
  - "rollback_to_savepoint_fact_close_persists"
  - "rollback_to_savepoint_fact_error_identity"
preconditions: []
steps:
  -
    id: "begin"
    action: "execute_sql"
    sql: "START TRANSACTION"
  -
    id: "cursor"
    action: "execute_sql"
    sql: "DECLARE old_cursor CURSOR FOR SELECT 1"
  -
    id: "point"
    action: "execute_sql"
    sql: "SAVEPOINT sp_test"
  -
    id: "close"
    action: "execute_sql"
    sql: "CLOSE old_cursor"
  -
    id: "rollback"
    action: "execute_sql"
    sql: "ROLLBACK TO sp_test"
  -
    id: "probe"
    action: "execute_sql"
    sql: "FETCH 1 FROM old_cursor"
  -
    id: "end"
    action: "execute_sql"
    sql: "ROLLBACK"
oracles:
  -
    after_step: "probe"
    kind: "target_error"
    expected: "cursor_remains_closed"
    oracle_status: "needs_verification"
execution_requirements:
  - "database"
  - "same_session"
