schema_version: 1
kind: "scenario"
id: "scenario_rollback_to_savepoint_cursor_position"
name: "ROLLBACK TO SAVEPOINT cursor_position"
status: "planned"
description: "按文档思路验证 FETCH 位置，额外 ORDER BY 保证测试结果顺序确定，不将 UNION 的示例顺序当排序保证。"
factor_ref: "rollback_to_savepoint"
fixture_refs: []
fact_refs:
  - "rollback_to_savepoint_fact_fetch_position"
  - "rollback_to_savepoint_fact_example_begin"
  - "rollback_to_savepoint_fact_example_savepoint"
  - "rollback_to_savepoint_fact_example_rollback"
  - "rollback_to_savepoint_fact_example_cursor"
  - "rollback_to_savepoint_fact_example_cursor_point"
  - "rollback_to_savepoint_fact_example_first_fetch"
  - "rollback_to_savepoint_fact_example_restore"
  - "rollback_to_savepoint_fact_example_next_fetch"
  - "rollback_to_savepoint_fact_example_release"
  - "rollback_to_savepoint_fact_example_commit"
preconditions: []
steps:
  -
    id: "begin"
    action: "execute_sql"
    sql: "START TRANSACTION"
  -
    id: "cursor"
    action: "execute_sql"
    sql: "DECLARE rb_cursor CURSOR FOR SELECT 1 AS n UNION SELECT 2 ORDER BY n"
  -
    id: "point"
    action: "execute_sql"
    sql: "SAVEPOINT sp_test"
  -
    id: "first"
    action: "query"
    sql: "FETCH 1 FROM rb_cursor"
  -
    id: "rollback"
    action: "execute_sql"
    sql: "ROLLBACK TO sp_test"
  -
    id: "second"
    action: "query"
    sql: "FETCH 1 FROM rb_cursor"
  -
    id: "end"
    action: "execute_sql"
    sql: "ROLLBACK"
oracles:
  -
    after_step: "first"
    kind: "result_rows"
    expected:
      -
        - 1
  -
    after_step: "second"
    kind: "result_rows"
    expected:
      -
        - 2
execution_requirements:
  - "database"
  - "same_session"
