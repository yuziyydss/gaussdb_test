    status: "confirmed"
    source_anchor: "L10-L10"
  -
    id: "rollback_to_savepoint_fact_missing_error"
    type: "behavior_oracle"
    statement: "回滚到未定义保存点会报错。"
    status: "confirmed"
    source_anchor: "L10"
  -
    id: "rollback_to_savepoint_fact_error_identity"
    type: "environment"
    statement: "本章未提供保存点或游标错误的稳定 SQLSTATE；目标错误 Oracle 需校准。"
    status: "confirmed"
    source_anchor: "L10"
  -
    id: "rollback_to_savepoint_fact_new_cursor_closes"
    type: "lifecycle"
    statement: "保存点之后打开的游标会随回滚到该保存点而关闭。"
    status: "confirmed"
    source_anchor: "L11-L17"
  -
    id: "rollback_to_savepoint_fact_fetch_position"
    type: "lifecycle"
    statement: "在保存点之前已打开的游标，其 FETCH 位置不会因保存点回滚而恢复。"
    status: "confirmed"
    source_anchor: "L11-L17"
  -
    id: "rollback_to_savepoint_fact_close_persists"
    type: "lifecycle"
    statement: "关闭游标的操作不会被保存点回滚撤销。"
    status: "confirmed"
    source_anchor: "L11-L17"
  -
    id: "rollback_to_savepoint_fact_failed_cursor_unusable"
    type: "lifecycle"
    statement: "游标操作导致事务回滚后，即使用保存点恢复事务，该游标仍不可执行。"
    status: "confirmed"
    source_anchor: "L11-L17"
  -
    id: "rollback_to_savepoint_fact_release_contrast"
    type: "lifecycle"
    statement: "RELEASE 删除保存点但保留之后命令结果，与 ROLLBACK TO 不同。"
    status: "confirmed"
    source_anchor: "L18-L19"
  -
    id: "rollback_to_savepoint_fact_syntax"
