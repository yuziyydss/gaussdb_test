  - {id: begin_src_003, section: 语法格式, source_anchor: "L9-L19 匿名块产生式", line_start: 9, line_end: 19, statement: "匿名块数据库语句由可选 DECLARE、BEGIN、执行语句和 END 分号构成；其后的斜杠独占一行，是客户端提交分隔符而不是数据库驱动 SQL 正文。", status: mapped, fact_refs: [begin_fact_anonymous_syntax, begin_fact_client_delimiter_scope], atomicity: grouped, independent_claim_count: 2, atomicity_rationale: "同一排版产生式同时给出数据库语句边界和紧随其后的独立客户端分隔行；二者必须一起记录但不能折叠为一条 SQL。"}
  - {id: begin_src_004, section: 语法格式, source_anchor: "L20-L28 事务产生式", line_start: 20, line_end: 28, statement: "事务 BEGIN 可带 WORK 或 TRANSACTION，并可重复列出隔离级别或访问模式。", status: mapped, fact_refs: [begin_fact_transaction_syntax], atomicity: atomic, atomicity_rationale: "九行共同构成事务 BEGIN 的一个正式产生式；枚举值在 factor 中逐项建模。", overlap_group: begin_overlap_txn_grammar, overlap_rationale: "同一产生式既确认列表语法，也暴露有限展开无法覆盖的重复域。"}
