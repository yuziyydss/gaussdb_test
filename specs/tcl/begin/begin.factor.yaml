schema_version: 1
kind: factor
id: begin
name: BEGIN
category: TCL
status: needs_review
description: 有限建模 BEGIN 匿名块的数据库 SQL 与事务起始语法；客户端分隔符和完整事务生命周期分别留在传输及行为场景中。
