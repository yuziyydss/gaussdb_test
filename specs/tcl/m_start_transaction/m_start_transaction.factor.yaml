facts:
- id: m_start_transaction_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.16.9 L2-2
- id: m_start_transaction_fact_syntax
  type: syntax
  statement: "原文语法片段（仅此来源区间，不等同完整生成能力）：START TRANSACTION [ { ISOLATION LEVEL { READ COMMITTED | READ UNCOMMITTED | SERIALIZABLE | REPEATABLE READ } | { READ WRITE | READ ONLY } | WITH CONSISTENT SNAPSHOT } [ ...] ];  格式二：BEGIN格式 BEGIN [ WORK | TRANSACTION ] [ { ISOLATION LEVEL { READ COMMITTED | READ UNCOMMITTED | SERIALIZABLE | REPEATABLE READ } | { READ WRITE | READ ONLY } } [ ...] ];"
  status: confirmed
  source_anchor: 2.4.2.16.9 L10-25
- id: m_start_transaction_fact_snapshot_warning
  type: behavior_oracle
  statement: 非可重复读级别的快照子句被忽略并告警，不是语法错误。
  status: confirmed
  source_anchor: 2.4.2.16.9 L53-53
- id: m_start_transaction_fact_isolation_alias
  type: behavior_oracle
  statement: SERIALIZABLE 映射 REPEATABLE READ，而非真正可串行化隔离。
  status: confirmed
  source_anchor: 2.4.2.16.9 L47-48
- id: m_start_transaction_fact_uncommitted_alias
  type: behavior_oracle
  statement: READ UNCOMMITTED 的行为等同 READ COMMITTED。
  status: confirmed
  source_anchor: 2.4.2.16.9 L42-43
- id: m_start_transaction_fact_purpose
  type: example
  statement: START TRANSACTION启动一个新的事务，功能与BEGIN相同。
  status: confirmed
  source_anchor: M-Compatibility L4-6
- id: m_start_transaction_fact_params
  type: example
  statement: 与BEGIN的参数相同。
  status: confirmed
  source_anchor: M-Compatibility L28-33
- id: m_start_transaction_fact_example
  type: example
  statement: m_start_transaction的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L60-62
