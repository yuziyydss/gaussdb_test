schema_version: 1
kind: "scenario"
id: "scenario_release_savepoint_latest_only"
name: "RELEASE SAVEPOINT latest_only"
status: "planned"
description: "复用 SAVEPOINT 同名点堆栈事实验证只释放最新点。"
factor_ref: "release_savepoint"
fixture_refs:
  - "fixture_release_savepoint_dependency_savepoint_defined"
fact_refs:
  - "release_savepoint_fact_latest"
  - "savepoint::savepoint_fact_retain_old"
  - "savepoint::savepoint_fact_older_reappears"
preconditions: []
steps:
  -
    id: "new"
    action: "execute_sql"
    sql: "SAVEPOINT sp_test"
  -
    id: "release"
    action: "execute_sql"
    sql: "RELEASE sp_test"
  -
    id: "old"
    action: "execute_sql"
    sql: "ROLLBACK TO SAVEPOINT sp_test"
oracles:
  -
    after_step: "old"
    kind: "execution_error"
    expected: false
execution_requirements:
  - "database"
  - "same_session"
