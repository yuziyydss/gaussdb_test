schema_version: 1
kind: "scenario"
id: "scenario_release_savepoint_descendants"
name: "RELEASE SAVEPOINT descendants"
status: "planned"
description: "目标释放后，后建保存点不能再被使用；目标错误身份待校准。"
factor_ref: "release_savepoint"
fixture_refs:
  - "fixture_release_savepoint_dependency_savepoint_defined"
fact_refs:
  - "release_savepoint_fact_remove_descendants"
  - "release_savepoint_fact_error_identity"
preconditions: []
steps:
  -
    id: "later"
    action: "execute_sql"
    sql: "SAVEPOINT sp_later"
  -
    id: "release"
    action: "execute_sql"
    sql: "RELEASE SAVEPOINT sp_test"
  -
    id: "probe"
    action: "execute_sql"
    sql: "ROLLBACK TO SAVEPOINT sp_later"
oracles:
  -
    after_step: "probe"
    kind: "target_error"
    expected: "savepoint_missing"
    oracle_status: "needs_verification"
execution_requirements:
  - "database"
  - "same_session"
