schema_version: 1
kind: "scenario"
id: "scenario_savepoint_documented_restore"
name: "SAVEPOINT documented_restore"
status: "planned"
description: "用已有两列表验证保存点前后插入、回滚和提交；第二列仅作 fixture 兼容。"
factor_ref: "savepoint"
fixture_refs:
  - "fixture_savepoint_dependency_begin_transaction_table"
fact_refs:
  - "savepoint_fact_create"
  - "savepoint_fact_restore"
  - "savepoint_fact_rollback_to"
  - "savepoint_fact_release_preserves_changes"
  - "savepoint_fact_multiple"
  - "start_transaction::start_transaction_fact_lifecycle"
  - "savepoint_fact_example_table"
  - "savepoint_fact_example_begin"
  - "savepoint_fact_example_first"
  - "savepoint_fact_example_savepoint"
  - "savepoint_fact_example_second"
  - "savepoint_fact_example_rollback"
  - "savepoint_fact_example_third"
  - "savepoint_fact_example_commit"
  - "savepoint_fact_example_result"
preconditions:
  - "独占连接"
steps:
  -
    id: "begin"
    action: "execute_sql"
    sql: "START TRANSACTION"
  -
    id: "one"
    action: "execute_sql"
    sql: "INSERT INTO t_begin_txn VALUES (11, 1)"
  -
    id: "savepoint"
    action: "execute_sql"
    sql: "SAVEPOINT sp_test"
  -
    id: "two"
    action: "execute_sql"
    sql: "INSERT INTO t_begin_txn VALUES (12, 2)"
  -
    id: "rollback"
    action: "execute_sql"
    sql: "ROLLBACK TO SAVEPOINT sp_test"
  -
    id: "three"
    action: "execute_sql"
    sql: "INSERT INTO t_begin_txn VALUES (13, 3)"
  -
    id: "commit"
    action: "execute_sql"
    sql: "COMMIT"
  -
    id: "check"
    action: "query"
    sql: "SELECT col1 FROM t_begin_txn WHERE col1 >= 11 ORDER BY col1"
oracles:
  -
    after_step: "check"
    kind: "result_rows"
    expected:
      -
        - 11
      -
        - 13
execution_requirements:
  - "database"
  - "same_session"
