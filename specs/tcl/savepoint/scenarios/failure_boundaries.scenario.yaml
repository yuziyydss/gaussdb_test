schema_version: 1
kind: "scenario"
id: "scenario_savepoint_failure_boundaries"
name: "SAVEPOINT failure_boundaries"
status: "planned"
description: "节点/通信/COPY FROM 的失败路径分别保留，未准备故障环境不执行。"
factor_ref: "savepoint"
fixture_refs: []
fact_refs:
  - "savepoint_fact_node_failure"
  - "savepoint_fact_communication_failure"
  - "savepoint_fact_copy_shape_failure"
  - "savepoint_fact_failure_setup_gap"
preconditions:
  - "专用故障环境"
  - "补充 COPY FROM 原文与受控数据"
steps:
  -
    id: "failures"
    action: "planned_failure_matrix"
    variants:
      - "节点退出"
      - "通信退出"
      - "COPY FROM 源/表结构不一致"
oracles:
  -
    after_step: "failures"
    kind: "transaction_fully_rolled_back"
    expected: true
execution_requirements:
  - "database"
  - "same_session"
