schema_version: 1
kind: "scenario"
id: "scenario_savepoint_same_name_stack"
name: "SAVEPOINT same_name_stack"
status: "planned"
description: "分别回滚最新同名点，再释放最新点并回滚旧点。"
factor_ref: "savepoint"
fixture_refs:
  - "fixture_savepoint_dependency_begin_transaction_table"
fact_refs:
  - "savepoint_fact_retain_old"
  - "savepoint_fact_latest_visible"
  - "savepoint_fact_older_reappears"
preconditions: []
steps:
  -
    id: "begin"
    action: "execute_sql"
    sql: "START TRANSACTION"
  -
    id: "old"
    action: "execute_sql"
    sql: "SAVEPOINT sp_test"
  -
    id: "insert"
    action: "execute_sql"
    sql: "INSERT INTO t_begin_txn VALUES (11, 1)"
  -
    id: "new"
    action: "execute_sql"
    sql: "SAVEPOINT sp_test"
  -
    id: "insert2"
    action: "execute_sql"
    sql: "INSERT INTO t_begin_txn VALUES (12, 2)"
  -
    id: "rollback_new"
    action: "execute_sql"
    sql: "ROLLBACK TO SAVEPOINT sp_test"
  -
    id: "check_new"
    action: "query"
    sql: "SELECT col1 FROM t_begin_txn WHERE col1 >= 11 ORDER BY col1"
  -
    id: "release_new"
    action: "execute_sql"
    sql: "RELEASE SAVEPOINT sp_test"
  -
    id: "rollback_old"
    action: "execute_sql"
    sql: "ROLLBACK TO SAVEPOINT sp_test"
  -
    id: "check_old"
    action: "query"
    sql: "SELECT count(*) FROM t_begin_txn WHERE col1 >= 11"
  -
    id: "end"
    action: "execute_sql"
    sql: "ROLLBACK"
oracles:
  -
    after_step: "check_new"
    kind: "result_rows"
    expected:
      -
        - 11
  -
    after_step: "check_old"
    kind: "scalar_equals"
    expected: 0
execution_requirements:
  - "database"
  - "same_session"
