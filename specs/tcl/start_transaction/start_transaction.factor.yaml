facts:
  -
    id: "start_transaction_fact_lifecycle"
    type: "lifecycle"
    statement: "START TRANSACTION 启动使用指定隔离级别和访问模式的新事务。"
    status: "confirmed"
    source_anchor: "L5-L6"
  -
    id: "start_transaction_fact_autocommit"
    type: "lifecycle"
    statement: "事务持续期间禁用自动提交，COMMIT 或 ROLLBACK 结束后恢复原始自动提交模式。"
    status: "confirmed"
    source_anchor: "L9-L10"
  -
    id: "start_transaction_fact_start_form"
    type: "syntax"
    statement: "START TRANSACTION 可以省略特征，也可指定隔离级别或读写访问模式。"
    status: "confirmed"
    source_anchor: "L14-L19"
  -
    id: "start_transaction_fact_repeat"
    type: "syntax"
    statement: "事务特征列表按语法块可用逗号重复。"
    status: "confirmed"
    source_anchor: "L20-L21"
  -
    id: "start_transaction_fact_repeat_domain"
    type: "open_question"
    statement: "本轮枚举每种隔离级别/访问模式最多各一次、至多两项的列表；三项以上、重复和冲突属性的优先级尚未建模。"
    status: "needs_verification"
    source_anchor: "L20-L21"
  -
    id: "start_transaction_fact_begin_form"
    type: "syntax"
    statement: "本章也给出 BEGIN 的事务产生式，支持可选 WORK 或 TRANSACTION 与特征列表。"
    status: "confirmed"
    source_anchor: "L26-L33"
  -
    id: "start_transaction_fact_compatibility"
    type: "syntax"
    statement: "WORK 与 TRANSACTION 是 BEGIN 格式中的可选无作用关键字。"
    status: "confirmed"
    source_anchor: "L39-L40"
  -
    id: "start_transaction_fact_isolation_purpose"
    type: "behavior_oracle"
    statement: "隔离级别决定事务能够看到哪些并发数据。"
    status: "confirmed"
    source_anchor: "L43-L44"
  -
    id: "start_transaction_fact_isolation_timing"
    type: "lifecycle"
    statement: "本章列出的首个 SELECT、INSERT、DELETE、UPDATE、FETCH、COPY 执行后不能再次设置事务隔离级别。"
    status: "confirmed"
    source_anchor: "L48-L49"
  -
    id: "start_transaction_fact_timing_difference"
    type: "open_question"
    statement: "BEGIN 章的首条语句限制未列 SELECT，而本章列 SELECT；尚未确认是省略还是行为差异。"
    status: "needs_verification"
    source_anchor: "L48-L49"
  -
    id: "start_transaction_fact_read_committed"
    type: "behavior_oracle"
    statement: "READ COMMITTED 仅读取已提交数据。"
    status: "confirmed"
    source_anchor: "L51-L52"
  -
    id: "start_transaction_fact_default_isolation"
    type: "behavior_oracle"
    statement: "未指定隔离级别时缺省为 READ COMMITTED。"
    status: "confirmed"
    source_anchor: "L51-L52"
  -
    id: "start_transaction_fact_read_uncommitted"
    type: "behavior_oracle"
    statement: "READ UNCOMMITTED 的行为与 READ COMMITTED 相同。"
    status: "confirmed"
    source_anchor: "L53-L54"
  -
    id: "start_transaction_fact_repeatable_read"
    type: "behavior_oracle"
    statement: "REPEATABLE READ 只看到事务开始前提交的数据，看不到其他事务随后提交的修改。"
    status: "confirmed"
    source_anchor: "L55-L57"
  -
    id: "start_transaction_fact_serializable"
    type: "behavior_oracle"
    statement: "SERIALIZABLE 并未提供名义串行化能力，当前等价于 REPEATABLE READ。"
    status: "confirmed"
    source_anchor: "L58-L59"
  -
    id: "start_transaction_fact_access_mode"
    type: "behavior_oracle"
    statement: "READ WRITE 或 READ ONLY 指定事务访问模式。"
    status: "confirmed"
    source_anchor: "L60-L61"
  -
    id: "start_transaction_fact_example_setup"
    type: "example"
    statement: "示例创建 tpcds 模式与两列 reason 表。"
    status: "confirmed"
    source_anchor: "L65-L69"
  -
    id: "start_transaction_fact_example_table"
    type: "example"
    statement: "示例创建 reason 两列整数表。"
    status: "confirmed"
    source_anchor: "L68-L69"
  -
    id: "start_transaction_fact_example_default_start"
    type: "example"
    statement: "示例用默认 START TRANSACTION 查询后 END。"
    status: "confirmed"
    source_anchor: "L71-L74"
  -
    id: "start_transaction_fact_example_default_begin"
    type: "example"
    statement: "示例用默认 BEGIN 查询后 END。"
    status: "confirmed"
    source_anchor: "L76-L79"
  -
    id: "start_transaction_fact_example_no_comma"
    type: "example"
    statement: "示例将 READ COMMITTED 与 READ WRITE 不带逗号串接。"
    status: "confirmed"
    source_anchor: "L81-L84"
  -
    id: "start_transaction_fact_separator_difference"
    type: "open_question"
    statement: "语法块使用逗号分隔属性，示例不带逗号；本轮只按语法块生成，省略逗号写法等待独立校准。"
    status: "needs_verification"
    source_anchor: "L81-L84"
