schema_version: 1
kind: "syntax"
id: "syntax_start_transaction"
name: "START TRANSACTION 语法"
factor_ref: "start_transaction"
category: "TCL"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  command_form:
    type: "token"
    optional: true
    dimension_ref: "start_transaction.command_form"
  characteristics:
    type: "token"
    optional: true
    dimension_ref: "start_transaction.characteristics"
source_fact_refs:
  - "start_transaction_fact_start_form"
  - "start_transaction_fact_begin_form"
  - "start_transaction_fact_repeat"
  - "start_transaction_fact_compatibility"
ast:
  kind: "sequence"
  items:
    -
      kind: "slot"
      slot: "command_form"
    -
      kind: "literal"
      text: " "
    -
      kind: "choice"
      selector: "characteristics"
      branches:
        start_transaction_characteristics_absent:
          kind: "literal"
          text: ""
        "*":
          kind: "ref"
          ref: "characteristic_list"
subgrammars:
  characteristic_list:
    kind: "repeat"
    slot: "characteristics"
    items_property: "items"
    separator: ", "
