schema_version: 1
kind: "scenario"
id: "scenario_abort_rollback_equivalence"
name: "ABORT rollback_equivalence"
status: "planned"
description: "复用 ROLLBACK 的事务撤销事实，验证 ABORT 各关键字形态。"
factor_ref: "abort"
fixture_refs:
  - "fixture_abort_active_update"
fact_refs:
  - "abort_fact_effect"
  - "abort_fact_alias"
  - "rollback::rollback_fact_effect"
preconditions:
  - "fixture 已在独占连接中建立含更新的活动事务"
steps:
  -
    id: "abort"
    action: "execute_sql"
    variants:
      - "ABORT"
      - "ABORT WORK"
      - "ABORT TRANSACTION"
  -
    id: "check"
    action: "query"
    sql: "SELECT name FROM t_rollback_test WHERE id = 1"
oracles:
  -
    after_step: "check"
    kind: "result_rows"
    expected:
      -
        - "original"
execution_requirements:
  - "database"
  - "same_session"
