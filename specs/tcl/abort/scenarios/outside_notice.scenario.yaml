schema_version: 1
kind: "scenario"
id: "scenario_abort_outside_notice"
name: "ABORT outside_notice"
status: "planned"
description: "新连接上捕获 NOTICE，不把 NOTICE 当目标错误。"
factor_ref: "abort"
fixture_refs: []
fact_refs:
  - "abort_fact_notice"
  - "rollback::rollback_fact_outside_notice"
preconditions:
  - "无活动事务"
  - "客户端不自动 BEGIN"
  - "能够捕获服务端 NOTICE"
steps:
  -
    id: "abort"
    action: "execute_sql"
    variants:
      - "ABORT"
      - "ABORT WORK"
      - "ABORT TRANSACTION"
oracles:
  -
    after_step: "abort"
    kind: "execution_error"
    expected: false
  -
    after_step: "abort"
    kind: "diagnostic_level"
    expected: "NOTICE"
execution_requirements:
  - "database"
  - "same_session"
