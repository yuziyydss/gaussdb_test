facts:
- id: m_begin_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.7.1 L2-2
- id: m_begin_fact_syntax
  type: syntax
  statement: "原文语法片段（仅此来源区间，不等同完整生成能力）：BEGIN [ WORK | TRANSACTION ] [ { ISOLATION LEVEL { READ COMMITTED | READ UNCOMMITTED | SERIALIZABLE | REPEATABLE READ } | { READ WRITE | READ ONLY } } [, ...] ];"
  status: confirmed
  source_anchor: 2.4.2.7.1 L13-19
- id: m_begin_fact_isolation_alias
  type: behavior_oracle
  statement: SERIALIZABLE 映射 REPEATABLE READ，而非真正可串行化隔离。
  status: confirmed
  source_anchor: 2.4.2.7.1 L40-41
- id: m_begin_fact_uncommitted_alias
  type: behavior_oracle
  statement: READ UNCOMMITTED 的行为等同 READ COMMITTED。
  status: confirmed
  source_anchor: 2.4.2.7.1 L35-36
- id: m_begin_fact_purpose
  type: example
  statement: 通过BEGIN启动事务。如果声明了隔离级别、读写模式，新事务就使用这些特性，类似执行了SET TRANSACTION。
  status: confirmed
  source_anchor: M-Compatibility L4-6
- id: m_begin_fact_constraint
  type: example
  statement: 在事务中第一个数据修改语句执行之后，事务隔离级别就不能再次设置。M-Compatibility目前不支持SERIALIZABLE隔离级别。
  status: confirmed
  source_anchor: M-Compatibility L8-9
- id: m_begin_fact_params
  type: example
  statement: WORK|TRANSACTION是可选关键字无实际作用。ISOLATION LEVEL指定隔离级别：READ COMMITTED(缺省)/READ UNCOMMITTED(同READ COMMITTED)/REPEATABLE
    READ/SERIALIZABLE(不支持)。READ WRITE|READ ONLY指定读写模式。
  status: confirmed
  source_anchor: M-Compatibility L22-28
- id: m_begin_fact_example
  type: example
  statement: m_begin的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L45-47
