facts:
- id: m_insert_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.12.1 L2-2
- id: m_insert_fact_syntax
  type: syntax
  statement: M INSERT 分 VALUES/VALUE、SET、query，INTO 可省略；表和视图分别列出。
  status: confirmed
  source_anchor: 2.4.2.12.1 L19-49
- id: m_insert_fact_default
  type: syntax
  statement: DEFAULT 表示目标列默认值，没有默认值为 NULL。
  status: confirmed
  source_anchor: 2.4.2.12.1 L98-99
- id: m_insert_fact_generated_write
  type: constraint
  statement: 生成列不能赋具体值，但可指定 DEFAULT。
  status: confirmed
  source_anchor: 2.4.2.12.1 L15-16
- id: m_insert_fact_view_duplicate
  type: constraint
  statement: 视图不支持 ON DUPLICATE KEY UPDATE。
  status: confirmed
  source_anchor: 2.4.2.12.1 L147-147
- id: m_insert_fact_duplicate_effect
  type: behavior_oracle
  statement: 带唯一键的表遇冲突更新已有行；VALUES(qty)引用输入行，不是旧值。
  status: confirmed
  source_anchor: 2.4.2.12.1 L105-107
- id: m_insert_fact_duplicate_authority
  type: environment
  statement: ON DUPLICATE KEY UPDATE需要INSERT、UPDATE及被更新列SELECT权限。
  status: confirmed
  source_anchor: 2.4.2.12.1 L11-12
- id: m_insert_fact_column_input
  type: constraint
  statement: 省略列列表的输入按前 N 列关联。
  status: confirmed
  source_anchor: 2.4.2.12.1 L80-81
- id: m_insert_fact_view_column
  type: constraint
  statement: 插入视图的列须为直接基表用户列。
  status: confirmed
  source_anchor: 2.4.2.12.1 L141-141
- id: m_ins_purpose
  type: example
  statement: 向表中插入一行或多行数据。
  status: confirmed
  source_anchor: 2.4.2.12.1 L4-5
- id: m_ins_permissions
  type: environment
  statement: INSERT需表INSERT权限。INSERT ANY TABLE相当于对非系统模式有USAGE和INSERT权限。ON DUPLICATE KEY UPDATE还需UPDATE和SELECT权限。query需SELECT权限。
  status: confirmed
  source_anchor: 2.4.2.12.1 L7-14
- id: m_ins_ignore_downgrade
  type: example
  statement: IGNORE将ERROR降级为WARNING并调整无效值为最接近值。支持场景：NOT NULL破坏、唯一键冲突、分区不匹配、子查询多行、宽松模式。
  status: confirmed
  source_anchor: 2.4.2.12.1 L51-62
- id: m_ins_on_duplicate_subquery
  type: example
  statement: ON DUPLICATE KEY UPDATE引用子查询列的限制：UNION/EXCEPT子查询不支持引用列；聚集函数/GROUP BY不支持；仅支持第一个FROM字段；有别名时只能引用别名。
  status: confirmed
  source_anchor: 2.4.2.12.1 L108-138
- id: m_ins_view_constraints
  type: example
  statement: 视图INSERT约束：只有直接引用基表用户列可插入；视图必须至少一个可更新列；支持普通/临时/全局临时/分区/二级分区/ustore/astore表。
  status: confirmed
  source_anchor: 2.4.2.12.1 L140-153
- id: m_ins_values_function
  type: example
  statement: VALUES(column_name)特性仅支持在ON DUPLICATE KEY UPDATE子句中使用。
  status: confirmed
  source_anchor: 2.4.2.12.1 L94-97
- id: m_ins_multi_unique
  type: example
  statement: 表中多个唯一约束且插入违反多个时，对于检测到的第一个唯一冲突执行ON DUPLICATE KEY UPDATE。
  status: confirmed
  source_anchor: 2.4.2.12.1 L108-118
- id: m_ins_generated_columns
  type: example
  statement: 生成列不能直接写入。INSERT不能为生成列指定值，但可指定DEFAULT。
  status: confirmed
  source_anchor: 2.4.2.12.1 L13-14
- id: m_insert_fact_string_storage
  type: constraint
  statement: M VARCHAR(n)按字符计长且受65532字节存储限制；本批只用VARCHAR(2)与同列类型匹配的完整字面量/常量DEFAULT。
  status: confirmed
  source_anchor: 2.6.4 L188-217；本章DEFAULT行为为消费者，非字符串类型规则的来源
- id: m_insert_fact_string_encoding
  type: environment
  statement: M字符集区分server/client/connection/schema/results；未指定字符集的表和列逐级继承。本批限定UTF8/utf8mb4同编码、当前独占schema、无表列覆盖，条件仍须实机确认。
  status: confirmed
  source_anchor: 2.3 L7-35、L129-164、L258-266、L313-325
- id: m_insert_fact_string_remaining
  type: environment
  statement: 尚未承诺CHAR补空格、VARCHAR(0)、TEXT(n)、跨schema、编码转换、动态DEFAULT。严格/宽松超长的目标SQLSTATE及实际结果、空串与NULL区分、驱动Unicode返回值待校准；不能以任意错误通过。
  status: confirmed
  source_anchor: 2.6.4 L194-219；2.3 L129-164；DEFAULT消费者与输入结果待独立数据库验证
