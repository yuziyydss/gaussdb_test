facts:
  -
    id: "insert_all_fact_body_5"
    type: "constraint"
    statement: "向多个表添加一条或多条数据。"
    status: "confirmed"
    source_anchor: "L5-L5"
  -
    id: "insert_all_fact_body_8"
    type: "environment"
    statement: "●     只有拥有表INSERT权限的用户，才可以向表中插入数据。"
    status: "confirmed"
    source_anchor: "L8-L10"
  -
    id: "insert_all_fact_body_8_1"
    type: "environment"
    statement: "用户被授予INSERT ANY TABLE权限，即用户对除系统模式之外的任何模式具有USAGE权限，并且拥 有这些模式下表的INSERT权限。"
    status: "confirmed"
    source_anchor: "L8-L10"
  -
    id: "insert_all_fact_body_11"
    type: "environment"
    statement: "●     如果使用QUERY子句插入来自查询里的数据行，用户还需要拥有在查询里使用的 表的SELECT权限。"
    status: "confirmed"
    source_anchor: "L11-L12"
  -
    id: "insert_all_fact_body_13"
    type: "constraint"
    statement: "●     生成列不能被直接写入。"
    status: "confirmed"
    source_anchor: "L13-L14"
  -
    id: "insert_all_fact_body_13_1"
    type: "constraint"
    statement: "在INSERT命令中不能为生成列指定值，但可以指定关键 字DEFAULT。"
    status: "confirmed"
    source_anchor: "L13-L14"
  -
    id: "insert_all_fact_body_15"
    type: "environment"
    statement: "●     仅支持在A兼容模式下执行该语法。"
    status: "confirmed"
    source_anchor: "L15-L15"
  -
    id: "insert_all_fact_grammar_line_18"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：INSERT [/*+ plan_hint */] [ ALL | FIRST ]"
    status: "confirmed"
    source_anchor: "L18-L18"
  -
    id: "insert_all_fact_grammar_line_19"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：{ [ WHEN condition THEN ]"
    status: "confirmed"
    source_anchor: "L19-L19"
  -
    id: "insert_all_fact_grammar_line_20"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：{ INTO table_name"
    status: "confirmed"
    source_anchor: "L20-L20"
  -
    id: "insert_all_fact_grammar_line_21"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：[ { [alias_name] [ ( column_name [, ...] ) ] } | { [partition_clause] [ AS alias ]"
    status: "confirmed"
    source_anchor: "L21-L21"
  -
    id: "insert_all_fact_grammar_line_22"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：[ ( column_name [, ...] ) ] } ]"
    status: "confirmed"
    source_anchor: "L22-L22"
  -
    id: "insert_all_fact_grammar_line_23"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：[ VALUES {( { expression | DEFAULT } [, ...] ) } ] }[, ...] }[, ...]"
    status: "confirmed"
    source_anchor: "L23-L23"
  -
    id: "insert_all_fact_grammar_line_24"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：{ subquery };"
    status: "confirmed"
    source_anchor: "L24-L24"
  -
    id: "insert_all_fact_body_26"
    type: "constraint"
    statement: "subquery的具体信息为： [ WITH [ RECURSIVE ] with_query [, ...] ] SELECT [/*+ plan_hint */] [ ALL ] { * | {expression [ [ AS ] output_name ]} [, ...] } [ into_option ] [ FROM from_item [, ...] ] [ WHERE condition ] [ [ START WITH condition ] CONNECT BY [NOCYCLE] condition [ ORDER SIBLINGS BY expression ] ] [ ORDER BY {expression [ [ ASC | DESC | USING operator ] | nlssort_expression_clause ] [ NULLS { FIRST | LAST } ]} [, ...] ] [ FETCH { FIRST | NEXT } [ count ] { ROW | ROWS } ONLY ] [ into_option ];"
    status: "confirmed"
    source_anchor: "L26-L37"
  -
    id: "insert_all_fact_body_39"
    type: "constraint"
    statement: "●     其中with_query的具体信息为： with_query_name [ ( column_name [, ...] ) ] AS [ [ NOT ] MATERIALIZED ] ( {select | values | insert | update | delete} )"
    status: "confirmed"
    source_anchor: "L39-L41"
  -
    id: "insert_all_fact_body_43"
    type: "behavior_oracle"
    statement: "●     其中指定子查询源from_item为： {[ ONLY ] {table_name | view_name} [ * ] [ partition_clause ] [ [ AS ] alias [ ( column_alias [, ...] ) ] ] |( select ) [ AS ] alias [ ( column_alias [, ...] ) ] |with_query_name [ [ AS ] alias [ ( column_alias [, ...] ) ] ] |from_item [ NATURAL ] join_type from_item [ ON join_condition | USING ( join_column [, ...] ) ]}"
    status: "confirmed"
    source_anchor: "L43-L47"
  -
    id: "insert_all_fact_body_49"
    type: "constraint"
    statement: "其中partition_clause的具体信息为： PARTITION { ( partition_name ) | FOR ( partition_value [, ...] ) } | SUBPARTITION { ( subpartition_name ) | FOR ( subpartition_value [, ...] ) }"
    status: "confirmed"
    source_anchor: "L49-L51"
  -
    id: "insert_all_fact_body_55"
    type: "constraint"
    statement: "●     plan_hint子句 以/*+ */的形式在INSERT关键字后，目前仅适配了语法格式，并未实现具体功能。"
    status: "confirmed"
    source_anchor: "L55-L56"
  -
    id: "insert_all_fact_body_57"
    type: "constraint"
    statement: "●     ALL | FIRST"
    status: "confirmed"
    source_anchor: "L57-L57"
  -
    id: "insert_all_fact_body_59"
    type: "behavior_oracle"
    statement: "如果不带条件子句（WHEN condition THEN），此关键字不可省略，且只能为 ALL。"
    status: "confirmed"
    source_anchor: "L59-L61"
  -
    id: "insert_all_fact_body_59_1"
    type: "behavior_oracle"
    statement: "如果含有条件子句，此关键字可以省略，默认为ALL，此时ALL和FIRST的含 义分别为："
    status: "confirmed"
    source_anchor: "L59-L61"
  -
    id: "insert_all_fact_body_62"
    type: "behavior_oracle"
    statement: "–    ALL：遍历所有匹配条件的分支，只要满足条件就会将数据插入对应的表。"
    status: "confirmed"
    source_anchor: "L62-L62"
  -
    id: "insert_all_fact_body_63"
    type: "behavior_oracle"
    statement: "–    FIRST：找到第一个满足条件的分支后，将数据插入该分支对应的表，不会再 继续检查剩余分支的。"
    status: "confirmed"
    source_anchor: "L63-L64"
  -
    id: "insert_all_fact_body_65"
    type: "behavior_oracle"
    statement: "●   WHEN condition THEN 插入表时的条件判断，只有满足条件才会进行插入操作，condition中可以引用子 查询（SUBQUERY）中的列。"
    status: "confirmed"
    source_anchor: "L65-L67"
  -
    id: "insert_all_fact_body_68"
    type: "behavior_oracle"
    statement: "●   table_name 要插入数据的目标表名。"
    status: "confirmed"
    source_anchor: "L68-L70"
  -
    id: "insert_all_fact_body_68_1"
    type: "behavior_oracle"
    statement: "取值范围：已存在的表名。"
    status: "confirmed"
    source_anchor: "L68-L70"
  -
    id: "insert_all_fact_body_71"
    type: "constraint"
    statement: "●   alias_name INSERT语句不包含AS alias语法时的表别名。"
    status: "confirmed"
    source_anchor: "L71-L72"
  -
    id: "insert_all_fact_body_75"
    type: "constraint"
    statement: "1. INTO子句不包含AS alias语法时的表别名不能为关键字（如SELECT、VALUE）或者表 达式，表别名要求符合标识符命名规范。"
    status: "confirmed"
    source_anchor: "L75-L76"
  -
    id: "insert_all_fact_body_77"
    type: "constraint"
    statement: "2. INTO子句不包含AS alias语法时的表别名不支持INTO table_name alias_name(alias_name.col1,...,alias_name.coln) VALUES(xxx);的语法格式。"
    status: "confirmed"
    source_anchor: "L77-L78"
  -
    id: "insert_all_fact_body_79"
    type: "behavior_oracle"
    statement: "3. INTO子句的分区表不包含AS alias语法时的表别名不支持指定分区插入操作。"
    status: "confirmed"
    source_anchor: "L79-L79"
  -
    id: "insert_all_fact_body_80"
    type: "behavior_oracle"
    statement: "●   partition_clause 指定分区插入操作。"
    status: "confirmed"
    source_anchor: "L80-L86"
  -
    id: "insert_all_fact_body_80_1"
    type: "behavior_oracle"
    statement: "PARTITION { ( partition_name ) | FOR ( partition_value [, ...] ) } | SUBPARTITION { ( subpartition_name ) | FOR ( subpartition_value [, ...] ) } 关键字具体信息请参见SELECT。"
    status: "confirmed"
    source_anchor: "L80-L86"
  -
    id: "insert_all_fact_body_80_2"
    type: "behavior_oracle"
    statement: "如果VALUE子句的值和指定分区不一致，结果会提示异常。"
    status: "confirmed"
    source_anchor: "L80-L86"
  -
    id: "insert_all_fact_body_80_3"
    type: "behavior_oracle"
    statement: "示例请参见CREATE TABLE SUBPARTITION。"
    status: "confirmed"
    source_anchor: "L80-L86"
  -
    id: "insert_all_fact_body_87"
    type: "constraint"
    statement: "●   column_name 目标表中的字段名称。"
    status: "confirmed"
    source_anchor: "L87-L88"
  -
    id: "insert_all_fact_body_89"
    type: "constraint"
    statement: "–    字段名可以有子字段名或者数组下标修饰。"
    status: "confirmed"
    source_anchor: "L89-L89"
  -
    id: "insert_all_fact_body_90"
    type: "behavior_oracle"
    statement: "–    没有在字段列表中出现的每个字段，将由系统默认值或者声明时的默认值填 充，若无默认值或未声明时则使用NULL填充。"
    status: "confirmed"
    source_anchor: "L90-L92"
  -
    id: "insert_all_fact_body_90_1"
    type: "behavior_oracle"
    statement: "例如，向一个复合类型中的某 些字段插入数据的话，其他字段使用NULL填充。"
    status: "confirmed"
    source_anchor: "L90-L92"
  -
    id: "insert_all_fact_body_93"
    type: "behavior_oracle"
    statement: "–    目标字段（column_name）按顺序排列。"
    status: "confirmed"
    source_anchor: "L93-L94"
  -
    id: "insert_all_fact_body_93_1"
    type: "behavior_oracle"
    statement: "如果没有列出任何字段，则默认全 部字段，且顺序为表声明时的顺序。"
    status: "confirmed"
    source_anchor: "L93-L94"
  -
    id: "insert_all_fact_body_95"
    type: "constraint"
    statement: "–    如果VALUE子句和QUERY中只提供了N个字段，则目标字段为前N个字段。"
    status: "confirmed"
    source_anchor: "L95-L95"
  -
    id: "insert_all_fact_body_96"
    type: "constraint"
    statement: "–    VALUE子句和QUERY提供的值在表中从左到右关联到对应列。"
    status: "confirmed"
    source_anchor: "L96-L97"
  -
    id: "insert_all_fact_body_96_1"
    type: "constraint"
    statement: "取值范围：已存在的字段名。"
    status: "confirmed"
    source_anchor: "L96-L97"
  -
    id: "insert_all_fact_body_98"
    type: "constraint"
    statement: "●   VALUES 不可跟多行。"
    status: "confirmed"
    source_anchor: "L98-L99"
  -
    id: "insert_all_fact_body_100"
    type: "constraint"
    statement: "●   expression 赋予对应column的一个有效表达式或值。"
    status: "confirmed"
    source_anchor: "L100-L101"
  -
    id: "insert_all_fact_body_102"
    type: "behavior_oracle"
    statement: "–    向表中字段插入单引号（'）时需要使用单引号对自身进行转义。"
    status: "confirmed"
    source_anchor: "L102-L102"
  -
    id: "insert_all_fact_body_104"
    type: "behavior_oracle"
    statement: "–     如果插入行的表达式不是正确的数据类型，系统将自动进行类型转换，若转 换失败，则插入数据失败，系统返回错误信息。"
    status: "confirmed"
    source_anchor: "L104-L105"
  -
    id: "insert_all_fact_body_106"
    type: "constraint"
    statement: "–     不支持聚集函数。"
    status: "confirmed"
    source_anchor: "L106-L106"
  -
    id: "insert_all_fact_body_107"
    type: "behavior_oracle"
    statement: "–     不支持子查询。"
    status: "confirmed"
    source_anchor: "L107-L107"
  -
    id: "insert_all_fact_body_108"
    type: "behavior_oracle"
    statement: "●   DEFAULT 对应字段名的缺省值。"
    status: "confirmed"
    source_anchor: "L108-L109"
  -
    id: "insert_all_fact_body_108_1"
    type: "behavior_oracle"
    statement: "如果没有缺省值，则为NULL。"
    status: "confirmed"
    source_anchor: "L108-L109"
  -
    id: "insert_all_fact_body_110"
    type: "behavior_oracle"
    statement: "●   subquery 一个查询语句（SELECT语句），将查询结果作为插入的数据，不可省略，如果没 有子查询可以使用SELECT * FROM DUAL。"
    status: "confirmed"
    source_anchor: "L110-L114"
  -
    id: "insert_all_fact_body_110_1"
    type: "behavior_oracle"
    statement: "如果子查询带表别名，不可在CONDITION子句和INTO子句中引用该别名。"
    status: "confirmed"
    source_anchor: "L110-L114"
  -
    id: "insert_all_fact_body_110_2"
    type: "behavior_oracle"
    statement: "具体示例请参见SELECT。"
    status: "confirmed"
    source_anchor: "L110-L114"
  -
    id: "insert_all_fact_example_117"
    type: "example"
    statement: "示例原文片段：●   不带条件的多表插入 示例： --建表。 gaussdb=# CREATE TABLE insert_all_test0(c1 INT, c2 VARCHAR2(20)); gaussdb=# CREATE TABLE insert_all_test1(c1 INT, c2 VARCHAR2(20)); gaussdb=# CREATE TABLE insert_all_test2(c1 INT, c2 VARCHAR2(20)); gaussdb=# CREATE TABLE insert_all_test3(c1 INT, c2 VARCHAR2(20));"
    status: "confirmed"
    source_anchor: "L117-L123"
  -
    id: "insert_all_fact_example_125"
    type: "example"
    statement: "示例原文片段：--构造数据。 gaussdb=# INSERT INTO insert_all_test0 VALUES(1,'a'),(2,'b'),(3,'c'),(4,'d'),(5,'e');"
    status: "confirmed"
    source_anchor: "L125-L126"
  -
    id: "insert_all_fact_example_128"
    type: "example"
    statement: "示例原文片段：--向表中插入数据。 gaussdb=# INSERT ALL INTO insert_all_test1 INTO insert_all_test1 VALUES(1,'a') INTO insert_all_test1(c1,c2) INTO insert_all_test1(c1) VALUES(1) INTO insert_all_test1(c2) VALUES('aaa') INTO insert_all_test2(c2) VALUES(c2) INTO insert_all_test2(c2) VALUES(c2||'*') INTO insert_all_test3(c1,c2) VALUES(1,'a')"
    status: "confirmed"
    source_anchor: "L128-L137"
  -
    id: "insert_all_fact_example_138"
    type: "example"
    statement: "示例原文片段：INTO insert_all_test3(c1,c2) VALUES(1,c2) INTO insert_all_test3(c1,c2) VALUES(c1,c2) INTO insert_all_test3(c2,c1) VALUES('***',666) SELECT * FROM insert_all_test0;"
    status: "confirmed"
    source_anchor: "L138-L141"
  -
    id: "insert_all_fact_example_143"
    type: "example"
    statement: "示例原文片段：--查询数据。 gaussdb=# SELECT * FROM insert_all_test1 ORDER BY c1,c2; c1 | c2 ----+----- 1|a 1|a 1|a 1|a 1|a 1|a"
    status: "confirmed"
    source_anchor: "L143-L152"
  -
    id: "insert_all_fact_example_153"
    type: "example"
    statement: "示例原文片段：1|a 1| 1| 1| 1| 1| 2|b 2|b 3|c 3|c"
    status: "confirmed"
    source_anchor: "L153-L162"
  -
    id: "insert_all_fact_example_163"
    type: "example"
    statement: "示例原文片段：4|d"
    status: "confirmed"
    source_anchor: "L163-L163"
  -
    id: "insert_all_fact_example_165"
    type: "example"
    statement: "示例原文片段：4|d 5|e 5|e | aaa | aaa | aaa | aaa | aaa (25 rows)"
    status: "confirmed"
    source_anchor: "L165-L173"
  -
    id: "insert_all_fact_example_175"
    type: "example"
    statement: "示例原文片段：gaussdb=# SELECT * FROM insert_all_test2 ORDER BY c1,c2; c1 | c2 ----+---- |a | a* |b | b* |c | c* |d"
    status: "confirmed"
    source_anchor: "L175-L184"
  -
    id: "insert_all_fact_example_185"
    type: "example"
    statement: "示例原文片段：| d* |e | e* (10 rows)"
    status: "confirmed"
    source_anchor: "L185-L188"
  -
    id: "insert_all_fact_example_190"
    type: "example"
    statement: "示例原文片段：gaussdb=# SELECT * FROM insert_all_test3 ORDER BY c1,c2; c1 | c2 -----+----- 1|a 1|a 1|a 1|a 1|a 1|a 1|a"
    status: "confirmed"
    source_anchor: "L190-L199"
  -
    id: "insert_all_fact_example_200"
    type: "example"
