      name: "fp_cs_one.b11_ia_view"
      persistence: "permanent"
      table_kind: "view"
      columns:
        -
          name: "col_1"
          type: "INTEGER"
          nullable: true
        -
          name: "col_2"
          type: "INTEGER"
          nullable: true
seed:
  required: false
  rows: []
execution:
  status: "ready"
  mode: "explicit"
  setup_sqls:
    - "CREATE VIEW fp_cs_one.b11_ia_view AS SELECT col_1,col_2 FROM fp_cs_one.b11_ia_a;"
  teardown_sqls:
    - "DROP VIEW IF EXISTS fp_cs_one.b11_ia_view;"
  note: "依赖三表fixture的事务；仅静态编译，不执行INSERT ALL。"
