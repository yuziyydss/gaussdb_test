schema_version: 1
kind: "syntax"
id: "syntax_insert_all"
name: "INSERT ALL 语法"
factor_ref: "insert_all"
category: "DML"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  branch_mode:
    type: "token"
    optional: true
    dimension_ref: "insert_all.branch_mode"
  match_mode:
    type: "token"
    optional: true
    dimension_ref: "insert_all.match_mode"
  condition:
    type: "token"
    optional: true
    dimension_ref: "insert_all.condition"
  subquery_alias:
    type: "token"
    optional: true
    dimension_ref: "insert_all.subquery_alias"
  subquery_presence:
    type: "token"
    optional: true
    dimension_ref: "insert_all.subquery_presence"
  targets:
    type: "token"
    optional: true
    dimension_ref: "insert_all.targets"
source_fact_refs:
  - "insert_all_fact_grammar_line_18"
  - "insert_all_fact_grammar_line_19"
  - "insert_all_fact_grammar_line_20"
  - "insert_all_fact_grammar_line_21"
  - "insert_all_fact_grammar_line_22"
  - "insert_all_fact_grammar_line_23"
  - "insert_all_fact_grammar_line_24"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "INSERT "
    -
      kind: "choice"
      selector: "branch_mode"
      branches:
        insert_all_branch_mode_unconditional:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: "ALL "
            -
              kind: "repeat"
              slot: "targets"
              separator: " "
              items_property: "items"
        insert_all_branch_mode_conditional:
          kind: "sequence"
          items:
            -
              kind: "slot"
              slot: "match_mode"
            -
              kind: "literal"
              text: " WHEN "
            -
              kind: "slot"
              slot: "condition"
            -
              kind: "literal"
              text: " THEN "
            -
              kind: "repeat"
              slot: "targets"
              separator: " "
              items_property: "items"
            -
              kind: "literal"
              text: " WHEN col_1 > 1 THEN INTO fp_cs_one.b11_ia_b (col_1,col_2) VALUES (col_1,col_2)"
    -
      kind: "optional"
      selector: "subquery_presence"
      enabled_values:
        - "insert_all_subquery_presence_present"
      item:
        kind: "sequence"
        items:
          -
            kind: "literal"
            text: " SELECT col_1,col_2 FROM fp_cs_one.b11_ia_source"
          -
            kind: "slot"
            slot: "subquery_alias"
