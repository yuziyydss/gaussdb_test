schema_version: 1
kind: "scenario"
id: "scenario_insert_all_documented_contracts"
name: "INSERT ALL documented_contracts"
status: "planned"
description: "逐条保留本章环境、约束与对象行为；尚未实现执行Oracle，不能计入行为覆盖。"
factor_ref: "insert_all"
