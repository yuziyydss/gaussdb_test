preconditions:
  - "独占测试数据库；先逐条实现前置条件及可机器执行的Oracle。"
steps:
  -
    id: "contract_0"
    action: "verify_documented_contract"
    note: "向多个表添加一条或多条数据。"
  -
    id: "contract_1"
    action: "verify_documented_contract"
    note: "●     只有拥有表INSERT权限的用户，才可以向表中插入数据。"
  -
    id: "contract_2"
    action: "verify_documented_contract"
    note: "用户被授予INSERT ANY TABLE权限，即用户对除系统模式之外的任何模式具有USAGE权限，并且拥 有这些模式下表的INSERT权限。"
  -
    id: "contract_3"
    action: "verify_documented_contract"
    note: "●     如果使用QUERY子句插入来自查询里的数据行，用户还需要拥有在查询里使用的 表的SELECT权限。"
  -
    id: "contract_4"
    action: "verify_documented_contract"
    note: "●     生成列不能被直接写入。"
  -
    id: "contract_5"
    action: "verify_documented_contract"
    note: "在INSERT命令中不能为生成列指定值，但可以指定关键 字DEFAULT。"
  -
    id: "contract_6"
    action: "verify_documented_contract"
    note: "●     仅支持在A兼容模式下执行该语法。"
  -
    id: "contract_7"
    action: "verify_documented_contract"
    note: "subquery的具体信息为： [ WITH [ RECURSIVE ] with_query [, ...] ] SELECT [/*+ plan_hint */] [ ALL ] { * | {expression [ [ AS ] output_name ]} [, ...] } [ into_option ] [ FROM from_item [, ...] ] [ WHERE condition ] [ [ START WITH condition ] CONNECT BY [NOCYCLE] condition [ ORDER SIBLINGS BY expression ] ] [ ORDER BY {expression [ [ ASC | DESC | USING operator ] | nlssort_expression_clause ] [ NULLS { FIRST | LAST } ]} [, ...] ] [ FETCH { FIRST | NEXT } [ count ] { ROW | ROWS } ONLY ] [ into_option ];"
  -
    id: "contract_8"
    action: "verify_documented_contract"
    note: "●     其中with_query的具体信息为： with_query_name [ ( column_name [, ...] ) ] AS [ [ NOT ] MATERIALIZED ] ( {select | values | insert | update | delete} )"
  -
    id: "contract_9"
    action: "verify_documented_contract"
    note: "●     其中指定子查询源from_item为： {[ ONLY ] {table_name | view_name} [ * ] [ partition_clause ] [ [ AS ] alias [ ( column_alias [, ...] ) ] ] |( select ) [ AS ] alias [ ( column_alias [, ...] ) ] |with_query_name [ [ AS ] alias [ ( column_alias [, ...] ) ] ] |from_item [ NATURAL ] join_type from_item [ ON join_condition | USING ( join_column [, ...] ) ]}"
  -
    id: "contract_10"
    action: "verify_documented_contract"
    note: "其中partition_clause的具体信息为： PARTITION { ( partition_name ) | FOR ( partition_value [, ...] ) } | SUBPARTITION { ( subpartition_name ) | FOR ( subpartition_value [, ...] ) }"
  -
    id: "contract_11"
    action: "verify_documented_contract"
    note: "●     plan_hint子句 以/*+ */的形式在INSERT关键字后，目前仅适配了语法格式，并未实现具体功能。"
  -
    id: "contract_12"
    action: "verify_documented_contract"
    note: "●     ALL | FIRST"
  -
    id: "contract_13"
    action: "verify_documented_contract"
    note: "如果不带条件子句（WHEN condition THEN），此关键字不可省略，且只能为 ALL。"
  -
    id: "contract_14"
    action: "verify_documented_contract"
    note: "如果含有条件子句，此关键字可以省略，默认为ALL，此时ALL和FIRST的含 义分别为："
  -
    id: "contract_15"
    action: "verify_documented_contract"
    note: "–    ALL：遍历所有匹配条件的分支，只要满足条件就会将数据插入对应的表。"
  -
    id: "contract_16"
    action: "verify_documented_contract"
    note: "–    FIRST：找到第一个满足条件的分支后，将数据插入该分支对应的表，不会再 继续检查剩余分支的。"
  -
    id: "contract_17"
    action: "verify_documented_contract"
    note: "●   WHEN condition THEN 插入表时的条件判断，只有满足条件才会进行插入操作，condition中可以引用子 查询（SUBQUERY）中的列。"
  -
    id: "contract_18"
    action: "verify_documented_contract"
    note: "●   table_name 要插入数据的目标表名。"
  -
    id: "contract_19"
    action: "verify_documented_contract"
    note: "取值范围：已存在的表名。"
  -
    id: "contract_20"
    action: "verify_documented_contract"
    note: "●   alias_name INSERT语句不包含AS alias语法时的表别名。"
  -
    id: "contract_21"
    action: "verify_documented_contract"
    note: "1. INTO子句不包含AS alias语法时的表别名不能为关键字（如SELECT、VALUE）或者表 达式，表别名要求符合标识符命名规范。"
  -
    id: "contract_22"
    action: "verify_documented_contract"
    note: "2. INTO子句不包含AS alias语法时的表别名不支持INTO table_name alias_name(alias_name.col1,...,alias_name.coln) VALUES(xxx);的语法格式。"
  -
    id: "contract_23"
    action: "verify_documented_contract"
    note: "3. INTO子句的分区表不包含AS alias语法时的表别名不支持指定分区插入操作。"
  -
    id: "contract_24"
    action: "verify_documented_contract"
    note: "●   partition_clause 指定分区插入操作。"
  -
    id: "contract_25"
    action: "verify_documented_contract"
    note: "PARTITION { ( partition_name ) | FOR ( partition_value [, ...] ) } | SUBPARTITION { ( subpartition_name ) | FOR ( subpartition_value [, ...] ) } 关键字具体信息请参见SELECT。"
  -
    id: "contract_26"
    action: "verify_documented_contract"
    note: "如果VALUE子句的值和指定分区不一致，结果会提示异常。"
  -
    id: "contract_27"
    action: "verify_documented_contract"
    note: "示例请参见CREATE TABLE SUBPARTITION。"
  -
    id: "contract_28"
    action: "verify_documented_contract"
    note: "●   column_name 目标表中的字段名称。"
  -
    id: "contract_29"
    action: "verify_documented_contract"
    note: "–    字段名可以有子字段名或者数组下标修饰。"
  -
    id: "contract_30"
    action: "verify_documented_contract"
    note: "–    没有在字段列表中出现的每个字段，将由系统默认值或者声明时的默认值填 充，若无默认值或未声明时则使用NULL填充。"
  -
    id: "contract_31"
    action: "verify_documented_contract"
    note: "例如，向一个复合类型中的某 些字段插入数据的话，其他字段使用NULL填充。"
  -
    id: "contract_32"
    action: "verify_documented_contract"
    note: "–    目标字段（column_name）按顺序排列。"
  -
    id: "contract_33"
    action: "verify_documented_contract"
    note: "如果没有列出任何字段，则默认全 部字段，且顺序为表声明时的顺序。"
  -
    id: "contract_34"
    action: "verify_documented_contract"
    note: "–    如果VALUE子句和QUERY中只提供了N个字段，则目标字段为前N个字段。"
  -
    id: "contract_35"
    action: "verify_documented_contract"
    note: "–    VALUE子句和QUERY提供的值在表中从左到右关联到对应列。"
  -
    id: "contract_36"
    action: "verify_documented_contract"
    note: "取值范围：已存在的字段名。"
  -
    id: "contract_37"
    action: "verify_documented_contract"
    note: "●   VALUES 不可跟多行。"
  -
    id: "contract_38"
    action: "verify_documented_contract"
    note: "●   expression 赋予对应column的一个有效表达式或值。"
  -
    id: "contract_39"
    action: "verify_documented_contract"
    note: "–    向表中字段插入单引号（'）时需要使用单引号对自身进行转义。"
  -
    id: "contract_40"
    action: "verify_documented_contract"
    note: "–     如果插入行的表达式不是正确的数据类型，系统将自动进行类型转换，若转 换失败，则插入数据失败，系统返回错误信息。"
  -
    id: "contract_41"
    action: "verify_documented_contract"
    note: "–     不支持聚集函数。"
  -
    id: "contract_42"
    action: "verify_documented_contract"
    note: "–     不支持子查询。"
  -
    id: "contract_43"
    action: "verify_documented_contract"
    note: "●   DEFAULT 对应字段名的缺省值。"
  -
    id: "contract_44"
    action: "verify_documented_contract"
    note: "如果没有缺省值，则为NULL。"
  -
    id: "contract_45"
    action: "verify_documented_contract"
    note: "●   subquery 一个查询语句（SELECT语句），将查询结果作为插入的数据，不可省略，如果没 有子查询可以使用SELECT * FROM DUAL。"
  -
    id: "contract_46"
    action: "verify_documented_contract"
    note: "如果子查询带表别名，不可在CONDITION子句和INTO子句中引用该别名。"
  -
    id: "contract_47"
    action: "verify_documented_contract"
    note: "具体示例请参见SELECT。"
