schema_version: 1
kind: "scenario"
id: "scenario_call_same_result"
name: "CALL same_result"
status: "planned"
description: "位置与命名参数得到同一整数相加结果。"
factor_ref: "call"
fixture_refs:
  - "fixture_call_function"
fact_refs:
  - "call_fact_purpose"
  - "call_fact_named"
  - "call_fact_positional"
preconditions: []
steps:
  -
    id: "position"
    action: "execute_sql"
    sql: "CALL fp_cf_callable(1, 3);"
  -
    id: "named"
    action: "execute_sql"
    sql: "CALL fp_cf_callable(num2 := 3, num1 := 1);"
oracles:
  -
    after_step: "position"
    kind: "result_rows"
    expected:
      -
        - 4
  -
    after_step: "named"
    kind: "result_rows"
    expected:
      -
        - 4
execution_requirements:
  - "database"
  - "same_session"
