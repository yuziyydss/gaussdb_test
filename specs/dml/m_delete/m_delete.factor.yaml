facts:
- id: m_delete_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.9.2 L2-2
- id: m_delete_fact_syntax
  type: example
  statement: 单表 DELETE 支持 WITH、FROM、WHERE、ORDER、LIMIT。
  status: confirmed
  source_anchor: 2.4.2.9.2 L19-23
- id: m_delete_fact_where
  type: example
  statement: 没有 WHERE 时删除所有行，保留表结构。
  status: confirmed
  source_anchor: 2.4.2.9.2 L5-6
- id: m_delete_fact_multi_view
  type: example
  statement: 视图不支持多表删除。
  status: confirmed
  source_anchor: 2.4.2.9.2 L12-12
- id: m_delete_fact_view_column
  type: example
  statement: 视图必须至少有一个可更新列。
  status: confirmed
  source_anchor: 2.4.2.9.2 L90-90
- id: m_delete_fact_s2_match
  type: environment
  statement: s2 要求多表目标和 using_list 唯一匹配。
  status: confirmed
  source_anchor: 2.4.2.9.2 L131-133
- id: m_delete_fact_permissions
  type: environment
  statement: 表所有者、被授予DELETE权限用户或DELETE ANY TABLE权限用户可删除；同时需USING引用表和condition读取表的SELECT权限。
  status: confirmed
  source_anchor: 2.4.2.9.2 L8-11
- id: m_delete_fact_stream_update
  type: example
  statement: 子查询为STREAM计划的DELETE不支持删除行同时UPDATE。
  status: confirmed
  source_anchor: 2.4.2.9.2 L13-14
- id: m_delete_fact_multi_syntax_using
  type: example
  statement: 多表删除USING形式：DELETE FROM table1[,table2] USING using_list WHERE condition。
  status: confirmed
  source_anchor: 2.4.2.9.2 L25-30
- id: m_delete_fact_multi_syntax_from
  type: example
  statement: 多表删除FROM形式：DELETE table1[,table2] FROM using_list WHERE condition。
  status: confirmed
  source_anchor: 2.4.2.9.2 L32-37
- id: m_delete_fact_cte_scan
  type: example
  statement: 应用CTE结构时执行计划中存在CTE SCAN。
  status: confirmed
  source_anchor: 2.4.2.9.2 L46-57
- id: m_delete_fact_recursive_cast
  type: example
  statement: RECURSIVE CTE两侧子查询结果数据类型必须cast一致且精度和字符序相同。
  status: confirmed
  source_anchor: 2.4.2.9.2 L58-69
- id: m_delete_fact_ignore_downgrade
  type: example
  statement: IGNORE将部分ERROR降级为WARNING并调整无效值为最接近值；仅宽松模式支持。
  status: confirmed
  source_anchor: 2.4.2.9.2 L70-71
- id: m_delete_fact_ignore_upgrade
  type: environment
  statement: 升级观察期不支持IGNORE。
  status: confirmed
  source_anchor: 2.4.2.9.2 L75-86
- id: m_delete_fact_view_distinct
  type: example
  statement: 不支持顶层包含DISTINCT、GROUP BY、HAVING、LIMIT、OFFSET子句的视图DELETE。
  status: confirmed
  source_anchor: 2.4.2.9.2 L91-102
- id: m_delete_fact_view_setop
  type: example
  statement: 不支持顶层包含集合运算（UNION、EXCEPT）的视图DELETE。
  status: confirmed
  source_anchor: 2.4.2.9.2 L91-102
- id: m_delete_fact_view_aggregate
  type: example
  statement: 不支持目标列表含聚集函数、窗口函数或返回集合函数的视图DELETE。
  status: confirmed
  source_anchor: 2.4.2.9.2 L91-102
- id: m_delete_fact_view_table_types
  type: environment
  statement: 视图支持的表类型包括普通表、临时表、全局临时表、分区表、二级分区表、ustore表、astore表。
  status: confirmed
  source_anchor: 2.4.2.9.2 L91-102
- id: m_delete_fact_view_join
  type: example
  statement: 连接视图仅对保留键表做删除；单张保留键表删该表，多张仅删FROM后第一张。
  status: confirmed
  source_anchor: 2.4.2.9.2 L91-102
- id: m_delete_fact_view_system
  type: example
  statement: 不支持对系统视图进行DELETE操作。
  status: confirmed
  source_anchor: 2.4.2.9.2 L91-102
- id: m_delete_fact_nulls_sort
  type: example
  statement: NULLS FIRST指定空值排序在前（DESC时默认）；NULLS LAST指定空值在后（非DESC时默认）。
  status: confirmed
  source_anchor: 2.4.2.9.2 L103-108
- id: m_delete_fact_index_hint
  type: example
  statement: index_hint_list在表名后指定，含USE/IGNORE/FORCE INDEX形式；与plan_hint可同时使用按出现顺序生效。
  status: confirmed
  source_anchor: 2.4.2.9.2 L110-123
- id: m_delete_fact_index_hint_partition
  type: example
  statement: index_hint_list不支持在PARTITION后使用。
  status: confirmed
  source_anchor: 2.4.2.9.2 L121-123
- id: m_delete_fact_using_target_repeat
  type: example
  statement: 删除多张目标表时using_list可同时出现目标表并定义别名；其他情况目标表不可重复出现在using_list。
  status: confirmed
  source_anchor: 2.4.2.9.2 L128-130
- id: m_delete_fact_s2_match_rules
  type: environment
  statement: m_format_dev_version=s2时多表目标与using_list需库名、表名、别名均相等才匹配；无唯一匹配则失败。
  status: confirmed
  source_anchor: 2.4.2.9.2 L134-137
- id: m_delete_fact_condition_bool
  type: example
  statement: condition应返回Boolean；不建议用int等数值类型因其可隐式转bool导致非预期结果。
  status: confirmed
  source_anchor: 2.4.2.9.2 L139-146
- id: m_delete_fact_truncate_advice
  type: example
  statement: 删除表中所有记录时建议使用TRUNCATE语法。
  status: confirmed
  source_anchor: 2.4.2.9.2 L271-273
