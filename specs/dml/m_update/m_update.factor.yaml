facts:
- id: m_update_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.18.1 L2-2
- id: m_update_fact_syntax
  type: syntax
  statement: 单表 UPDATE 支持 WITH、目标、SET、WHERE、ORDER、LIMIT。
  status: confirmed
  source_anchor: 2.4.2.18.1 L26-41
- id: m_update_fact_default
  type: syntax
  statement: UPDATE DEFAULT 填对应列默认值；没有默认值则 NULL。
  status: confirmed
  source_anchor: 2.4.2.18.1 L202-204
- id: m_update_fact_generated_write
  type: constraint
  statement: 生成列不能赋具体值，但可指定 DEFAULT。
  status: confirmed
  source_anchor: 2.4.2.18.1 L14-15
- id: m_update_fact_multi_view
  type: constraint
  statement: M多表UPDATE不支持以视图作为目标；不能由单表可更新性推导多表可更新。
  status: confirmed
  source_anchor: 2.4.2.18.1 L16-16
- id: m_update_fact_only
  type: syntax
  statement: ONLY 与星号保留语法，功能不支持。
  status: confirmed
  source_anchor: 2.4.2.18.1 L94-94
- id: m_update_fact_s2_order
  type: environment
  statement: s2 单表多赋值按从左到右使用更新后值。
  status: confirmed
  source_anchor: 2.4.2.18.1 L194-199
- id: m_update_fact_view_column
  type: constraint
  statement: 视图/子查询只更新直接基表用户列。
  status: confirmed
  source_anchor: 2.4.2.18.1 L157-157
- id: m_update_fact_permissions
  type: environment
  statement: 表所有者、UPDATE权限或UPDATE ANY TABLE权限用户可更新；三权分立关闭时系统管理员默认有权限。
  status: confirmed
  source_anchor: 2.4.2.18.1 L9-13
- id: m_update_fact_select_permission
  type: environment
  statement: expression或condition涉及的表需有SELECT权限。
  status: confirmed
  source_anchor: 2.4.2.18.1 L9-13
- id: m_update_fact_system_table_encoding
  type: example
  statement: 不支持通过UPDATE系统表修改数据库字符编码；应遵循切库流程。
  status: confirmed
  source_anchor: 2.4.2.18.1 L13-17
- id: m_update_fact_tuple_count_dedup
  type: environment
  statement: 默认UPDATE数量统计不去重；需去重时m_format_behavior_compat_options须含enable_update_tuple_count。
  status: confirmed
  source_anchor: 2.4.2.18.1 L17-23
- id: m_update_fact_stream_concurrent
  type: example
  statement: 子查询为STREAM计划的UPDATE不支持并发更新同一行。
  status: confirmed
  source_anchor: 2.4.2.18.1 L17-23
- id: m_update_fact_multi_syntax
  type: example
  statement: 多表更新：UPDATE table_list SET assignments WHERE condition；table_list可同时声明目标表和关联表。
  status: confirmed
  source_anchor: 2.4.2.18.1 L42-47
- id: m_update_fact_cte_scan
  type: example
  statement: 应用CTE结构时执行计划中存在CTE SCAN。
  status: confirmed
  source_anchor: 2.4.2.18.1 L57-68
- id: m_update_fact_recursive_cast
  type: example
  statement: RECURSIVE CTE两侧子查询结果须cast成相同类型且精度字符序一致。
  status: confirmed
  source_anchor: 2.4.2.18.1 L69-80
- id: m_update_fact_ignore_downgrade
  type: example
  statement: IGNORE将部分ERROR降级为WARNING（含NOT NULL破坏、唯一键冲突、分区不匹配、子查询多行、宽松模式）。
  status: confirmed
  source_anchor: 2.4.2.18.1 L81-88
- id: m_update_fact_ignore_upgrade
  type: environment
  statement: 升级观察期不支持IGNORE。
  status: confirmed
  source_anchor: 2.4.2.18.1 L90-93
- id: m_update_fact_partition_union
  type: example
  statement: PARTITION指定多个分区名时一级二级可同时存在且可重名，最终分区范围取并集。
  status: confirmed
  source_anchor: 2.4.2.18.1 L106-117
- id: m_update_fact_index_hint
  type: example
  statement: index_hint_list在表名后指定含USE/IGNORE/FORCE INDEX形式；与plan_hint可同时用按顺序生效；不支持在PARTITION后使用。
  status: confirmed
  source_anchor: 2.4.2.18.1 L131-152
- id: m_update_fact_subquery_update
  type: example
  statement: 子查询更新时将子查询当临时视图；单表直接更新，多表按保留键表判断可更新性。
  status: confirmed
  source_anchor: 2.4.2.18.1 L119-130
- id: m_update_fact_view_constraints
  type: example
  statement: 视图和子查询不支持顶层DISTINCT/GROUP BY/HAVING/LIMIT/OFFSET、集合运算、聚集/窗口/集合返回函数；不支持更新系统视图。
  status: confirmed
  source_anchor: 2.4.2.18.1 L156-169
- id: m_update_fact_view_join
  type: example
  statement: 多表连接视图或子查询一次只能更新一张基表；连接视图或子查询只能更新保留键表。
  status: confirmed
  source_anchor: 2.4.2.18.1 L158-169
- id: m_update_fact_alias_reference
  type: example
  statement: SET可用别名.字段名引用；s2时指定别名后只能通过别名引用。
  status: confirmed
  source_anchor: 2.4.2.18.1 L170-193
- id: m_update_fact_from_list
  type: example
  statement: from_list允许WHERE使用其他表字段，类似SELECT的FROM。
  status: confirmed
  source_anchor: 2.4.2.18.1 L205-207
- id: m_update_fact_self_join
  type: example
  statement: 目标表不能出现在from_list除非自连接（此时必须以from_list别名出现）。
  status: confirmed
  source_anchor: 2.4.2.18.1 L212-213
- id: m_update_fact_condition_bool
  type: example
  statement: condition应返回Boolean；不建议用int等数值因其隐式转bool可能导致非预期结果。
  status: confirmed
  source_anchor: 2.4.2.18.1 L215-222
- id: m_update_fact_string_storage
  type: constraint
  statement: M VARCHAR(n)按字符计长且受65532字节存储限制；本批只用VARCHAR(2)与同列类型匹配的完整字面量/常量DEFAULT。
  status: confirmed
  source_anchor: 2.6.4 L188-217；本章DEFAULT行为为消费者，非字符串类型规则的来源
- id: m_update_fact_string_encoding
  type: environment
  statement: M字符集区分server/client/connection/schema/results；未指定字符集的表和列逐级继承。本批限定UTF8/utf8mb4同编码、当前独占schema、无表列覆盖，条件仍须实机确认。
  status: confirmed
  source_anchor: 2.3 L7-35、L129-164、L258-266、L313-325
- id: m_update_fact_string_remaining
  type: open_question
  statement: 尚未承诺CHAR补空格、VARCHAR(0)、TEXT(n)、跨schema、编码转换、动态DEFAULT。严格/宽松超长的目标SQLSTATE及实际结果、空串与NULL区分、驱动Unicode返回值待校准；不能以任意错误通过。
  status: needs_verification
  source_anchor: 2.6.4 L194-219；2.3 L129-164；DEFAULT消费者与输入结果待独立数据库验证
rules:
- id: m_update_rule_generated_write
  kind: requires
  expression: target == 'm_update_target_generated' => assignments not in ['m_update_assignments_generated_literal', 'm_update_assignments_generated_null']
  fact_refs:
  - m_update_fact_generated_write
  severity: error
