facts:
- id: m_update_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.18.1 L2-2
- id: m_update_fact_syntax
  type: syntax
  statement: 单表 UPDATE 支持 WITH、目标、SET、WHERE、ORDER、LIMIT。
  status: confirmed
  source_anchor: 2.4.2.18.1 L26-41
- id: m_update_fact_default
  type: syntax
  statement: UPDATE DEFAULT 填对应列默认值；没有默认值则 NULL。
  status: confirmed
  source_anchor: 2.4.2.18.1 L202-204
- id: m_update_fact_generated_write
  type: constraint
  statement: 生成列不能赋具体值，但可指定 DEFAULT。
  status: confirmed
  source_anchor: 2.4.2.18.1 L14-15
- id: m_update_fact_multi_view
  type: constraint
  statement: M多表UPDATE不支持以视图作为目标；不能由单表可更新性推导多表可更新。
  status: confirmed
  source_anchor: 2.4.2.18.1 L16-16
- id: m_update_fact_only
  type: syntax
  statement: ONLY 与星号保留语法，功能不支持。
  status: confirmed
  source_anchor: 2.4.2.18.1 L94-94
- id: m_update_fact_s2_order
  type: environment
  statement: s2 单表多赋值按从左到右使用更新后值。
  status: confirmed
  source_anchor: 2.4.2.18.1 L194-199
- id: m_update_fact_view_column
  type: constraint
  statement: 视图/子查询只更新直接基表用户列。
  status: confirmed
  source_anchor: 2.4.2.18.1 L157-157
rules:
- id: m_update_rule_generated_write
  kind: requires
  expression: target == 'm_update_target_generated' => assignments not in ['m_update_assignments_generated_literal',
