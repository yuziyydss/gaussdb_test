schema_version: 1
kind: "syntax"
id: "syntax_values"
name: "VALUES 语法"
factor_ref: "values"
category: "DML"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  context:
    type: "token"
    optional: true
    dimension_ref: "values.context"
  first_row:
    type: "token"
    optional: true
    dimension_ref: "values.first_row"
  more_rows:
    type: "token"
    optional: true
    dimension_ref: "values.more_rows"
  second_row:
    type: "token"
    optional: true
    dimension_ref: "values.second_row"
  order_by:
    type: "token"
    optional: true
    dimension_ref: "values.order_by"
  limit:
    type: "token"
    optional: true
    dimension_ref: "values.limit"
  offset:
    type: "token"
    optional: true
    dimension_ref: "values.offset"
  fetch:
    type: "token"
    optional: true
    dimension_ref: "values.fetch"
source_fact_refs:
  - "values_fact_rows_syntax"
  - "values_fact_sort_syntax"
  - "values_fact_limit_syntax"
  - "values_fact_offset_syntax"
  - "values_fact_fetch_syntax"
  - "values_fact_expression"
  - "values_fact_sort_expression"
  - "values_fact_operator"
ast:
  kind: "sequence"
  items:
    -
      kind: "slot"
      slot: "context"
    -
      kind: "literal"
      text: "VALUES "
    -
      kind: "ref"
      ref: "row_list"
    -
      kind: "optional"
      selector: "order_by"
      enabled_values:
        - "values_order_by_implicit"
        - "values_order_by_asc"
        - "values_order_by_desc"
        - "values_order_by_using"
        - "values_order_by_two"
      item:
        kind: "sequence"
        items:
          -
            kind: "literal"
            text: " ORDER BY "
          -
            kind: "repeat"
            slot: "order_by"
            separator: ", "
            items_property: "items"
    -
      kind: "literal"
      text: " "
    -
      kind: "slot"
      slot: "limit"
    -
      kind: "literal"
      text: " "
    -
      kind: "slot"
      slot: "offset"
    -
      kind: "literal"
      text: " "
    -
      kind: "slot"
      slot: "fetch"
subgrammars:
  row_list:
    kind: "sequence"
    items:
      -
        kind: "literal"
        text: "("
      -
        kind: "repeat"
        slot: "first_row"
        separator: ", "
        items_property: "items"
      -
        kind: "literal"
        text: ")"
      -
        kind: "optional"
        selector: "more_rows"
        enabled_values:
          - "values_more_rows_present"
        item:
          kind: "sequence"
          items:
            -
              kind: "literal"
              text: ", ("
            -
              kind: "repeat"
              slot: "second_row"
              separator: ", "
              items_property: "items"
            -
              kind: "literal"
              text: ")"
