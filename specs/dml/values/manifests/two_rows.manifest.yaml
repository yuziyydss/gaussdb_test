schema_version: 1
kind: "manifest"
id: "manifest_values_two_rows"
name: "VALUES two_rows"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "values"
syntax_ref: "syntax_values"
suite_type: "positive"
strategy: "pairwise"
fixture_refs: []
identifier_policy: {}
bindings:
  first_row:
    - "values_first_row_integer"
    - "values_first_row_expression"
    - "values_first_row_null"
    - "values_first_row_two_columns"
  more_rows:
    - "values_more_rows_present"
  second_row:
    - "values_second_row_integer"
    - "values_second_row_two_columns"
  order_by:
    - "values_order_by_absent"
    - "values_order_by_implicit"
    - "values_order_by_asc"
    - "values_order_by_desc"
    - "values_order_by_using"
  limit:
    - "values_limit_absent"
    - "values_limit_one"
    - "values_limit_all"
  offset:
    - "values_offset_absent"
    - "values_offset_zero"
    - "values_offset_row"
    - "values_offset_rows"
local_rules:
  - expression: "(first_row == 'values_first_row_integer' and second_row == 'values_second_row_integer') or (first_row == 'values_first_row_two_columns' and second_row == 'values_second_row_two_columns')"
    rationale: 多行VALUES每行宽度与类型必须对齐；宽度不一致是负向审阅。
    fact_refs: [values_fact_equal_width]

expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
