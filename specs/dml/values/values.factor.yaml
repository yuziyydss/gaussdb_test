facts:
- id: values_fact_purpose
  type: behavior_oracle
  statement: 值表达式计算一行或多行，常作为常数表。
  status: confirmed
  source_anchor: L5-L6
- id: values_fact_volume
  type: environment
  statement: 巨大独立 VALUES 结果有内存或性能风险。
  status: confirmed
  source_anchor: L9-L12
- id: values_fact_equal_width
  type: constraint
  statement: 多行 VALUES 每行元素个数必须相同。
  status: confirmed
  source_anchor: L13-L13
- id: values_fact_in_difference
  type: behavior_oracle
  statement: IN LIST 与 IN VALUES LIST 的内部处理机制不同。
  status: confirmed
  source_anchor: L14-L16
- id: values_fact_in_or
  type: behavior_oracle
  statement: 多列 IN LIST 转为 OR 条件链，长列表可能降低优化性能。
  status: confirmed
  source_anchor: L17-L20
- id: values_fact_in_join
  type: behavior_oracle
  statement: IN VALUES LIST 视为派生表/ANY 子查询，可改写为 JOIN。
  status: confirmed
  source_anchor: L21-L23
- id: values_fact_common_type
  type: constraint
  statement: IN VALUES 对每一列统一推导公共类型，再检查转换。
  status: confirmed
  source_anchor: L24-L27
- id: values_fact_rows_syntax
  type: syntax
  statement: VALUES 的行列表与每行表达式列表均可重复。
  status: confirmed
  source_anchor: L30-L30
- id: values_fact_sort_syntax
  type: syntax
  statement: ORDER BY 可重复，支持 ASC/DESC/USING operator。
  status: confirmed
  source_anchor: L31-L31
- id: values_fact_limit_syntax
  type: syntax
  statement: LIMIT count 或 ALL。
  status: confirmed
  source_anchor: L32-L32
- id: values_fact_offset_syntax
  type: syntax
  statement: OFFSET start 可带 ROW/ROWS。
  status: confirmed
  source_anchor: L33-L33
- id: values_fact_fetch_syntax
  type: syntax
  statement: FETCH FIRST/NEXT 可省略 count，ROW/ROWS 后跟 ONLY。
  status: confirmed
  source_anchor: L34-L34
- id: values_fact_expression
  type: syntax
  statement: 单元为常量或可计算表达式。
  status: confirmed
  source_anchor: L38-L39
- id: values_fact_default_context
  type: constraint
  statement: DEFAULT 仅允许在 INSERT 顶层 VALUES，其他位置禁止。
  status: confirmed
  source_anchor: L40-L42
- id: values_fact_sort_expression
  type: syntax
  statement: 排序项可为表达式或整数常量。
  status: confirmed
  source_anchor: L43-L44
- id: values_fact_ascending
  type: behavior_oracle
  statement: ASC 升序。
  status: confirmed
  source_anchor: L45-L46
- id: values_fact_descending
  type: behavior_oracle
  statement: DESC 降序。
  status: confirmed
  source_anchor: L47-L48
- id: values_fact_operator
  type: syntax
  statement: USING 后为排序操作符。
  status: confirmed
  source_anchor: L50-L51
- id: values_fact_count
  type: behavior_oracle
  statement: count 表示返回的最大行数。
  status: confirmed
  source_anchor: L52-L53
- id: values_fact_offset
  type: behavior_oracle
  statement: start 指开始返回之前忽略的行数。
  status: confirmed
  source_anchor: L54-L55
- id: values_fact_fetch_default
  type: behavior_oracle
  statement: FETCH 限制返回总行数，省略 count 默认为 1。
  status: confirmed
  source_anchor: L56-L57
- id: values_fact_insert_types
  type: behavior_oracle
  statement: INSERT 目标列类型已知，无需扫描 VALUES 推导类型，可处理较大结果。
  status: confirmed
  source_anchor: L9-L12
- id: values_fact_type_gap
  type: environment
  statement: 只生成显式同类型有限表达式；完整公共类型推导、IN 对比及任意子查询深度未实现。
  status: confirmed
  source_anchor: L24-L27
- id: values_fact_pagination_gap
  type: environment
  statement: 语法同时列 LIMIT/FETCH，但组合优先级未解释；本轮分开生成，两者同时出现及任意计数表达式待核实。
  status: confirmed
  source_anchor: L34-L34
- id: values_fact_example_tables
  type: example
  statement: 示例创建两张整数/字符串表。
  status: confirmed
  source_anchor: L61-L63
- id: values_fact_example_insert
  type: example
  statement: 一次插入三行。
  status: confirmed
  source_anchor: L65-L66
- id: values_fact_example_limit
  type: example
  statement: SELECT ORDER BY + LIMIT 1 OFFSET 0 返回 (10,AA)。
  status: confirmed
  source_anchor: L68-L73
- id: values_fact_example_copy
  type: example
  statement: INSERT SELECT 复制到另一表。
  status: confirmed
  source_anchor: L75-L76
- id: values_fact_example_fetch
  type: example
  statement: SELECT OFFSET/FETCH 返回 (10,AA)。
  status: confirmed
  source_anchor: L78-L83
- id: values_fact_error_identity
  type: environment
  statement: 行数契约和 DEFAULT 越界的准确错误身份未给出。
  status: confirmed
  source_anchor: L13-L13
