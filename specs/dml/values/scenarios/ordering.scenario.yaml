schema_version: 1
kind: "scenario"
id: "scenario_values_ordering"
name: "VALUES ordering"
status: "planned"
description: "两个固定数值的排序与分页默认值。"
factor_ref: "values"
fixture_refs: []
fact_refs:
  - "values_fact_purpose"
  - "values_fact_ascending"
  - "values_fact_descending"
  - "values_fact_count"
  - "values_fact_offset"
  - "values_fact_fetch_default"
preconditions: []
steps:
  -
    id: "asc"
    action: "execute_sql"
    sql: "VALUES (2), (1) ORDER BY 1 ASC;"
  -
    id: "desc"
    action: "execute_sql"
    sql: "VALUES (2), (1) ORDER BY 1 DESC;"
  -
    id: "first"
    action: "execute_sql"
    sql: "VALUES (2), (1) ORDER BY 1 FETCH FIRST ROW ONLY;"
oracles:
  -
    after_step: "asc"
    kind: "result_rows"
    expected:
      -
        - 1
      -
        - 2
  -
    after_step: "desc"
    kind: "result_rows"
    expected:
      -
        - 2
      -
        - 1
  -
    after_step: "first"
    kind: "result_rows"
    expected:
      -
        - 1
execution_requirements:
  - "database"
  - "same_session"
