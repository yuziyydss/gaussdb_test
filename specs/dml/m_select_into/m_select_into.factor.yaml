facts:
- id: m_select_into_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.16.3 L2-2
- id: m_select_into_fact_syntax
  type: syntax
  statement: 生成 SELECT 投影 INTO [TABLE] 新表 FROM 源表的前置 INTO 分支。
  status: confirmed
  source_anchor: 2.4.2.16.3 L11-15
- id: m_select_into_fact_output
  type: metadata_oracle
  statement: 新表字段名称和类型与 SELECT 输出字段相同；数据不返回客户端。
  status: confirmed
  source_anchor: 2.4.2.16.3 L6-7
- id: m_select_into_fact_duplicate_into
  type: environment
  statement: 跨页语法块两次列出INTO且未标选择关系；当前模型采用与本章示例一致的前置INTO，不复制两次。
  status: confirmed
  source_anchor: 2.4.2.16.3 L11-L25
- id: m_select_into_fact_temporary
  type: lifecycle
  statement: GLOBAL 临时表元数据跨会话保留、数据隔离；LOCAL 会话结束删除，当前只生成永久目标。
  status: confirmed
  source_anchor: 2.4.2.16.3 L41-53
- id: m_select_into_fact_other_parameters
  type: syntax
  statement: SELECT INTO 其他参数引用 SELECT；本批仅直接整数列/WHERE，复杂查询保留后续。
  status: confirmed
  source_anchor: 2.4.2.16.3 L68-68
- id: m_select_into_fact_purpose
  type: example
  statement: SELECT INTO用于根据查询结果创建一个新表，并且将查询到的数据插入到新表中。 数据并不返回给客户端，这一点和普通的SELECT不同。新表的字段具有和SELECT的输 出字段相同的名称和数据类型。
  status: confirmed
  source_anchor: M-Compatibility L4-5
- id: m_select_into_fact_params
  type: example
  statement: ●      new_table new_table指定新建表的名称。 ●      GLOBAL | LOCAL
  status: confirmed
  source_anchor: M-Compatibility L30-40
- id: m_select_into_fact_example
  type: example
  statement: m_select_into的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L70-72
