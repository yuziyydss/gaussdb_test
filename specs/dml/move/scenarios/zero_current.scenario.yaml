schema_version: 1
kind: "scenario"
id: "scenario_move_zero_current"
name: "MOVE zero_current"
status: "planned"
description: "零移动必须返回计数标签且保留当前位置。"
factor_ref: "move"
fixture_refs:
  - "fixture_move_cursor"
fact_refs:
  - "move_fact_count_tag"
  - "fetch::fetch_fact_zero"
preconditions: []
steps:
  -
    id: "position"
    action: "execute_sql"
    sql: "FETCH FORWARD 3 FROM c_cursor_auto;"
  -
    id: "zero"
    action: "execute_sql"
    sql: "MOVE RELATIVE 0 FROM c_cursor_auto;"
  -
    id: "same"
    action: "execute_sql"
    sql: "FETCH RELATIVE 0 FROM c_cursor_auto;"
oracles:
  -
    after_step: "zero"
    kind: "command_tag"
    expected: "MOVE 1"
  -
    after_step: "same"
    kind: "result_rows"
    expected:
      -
        - 3
        - 3
execution_requirements:
  - "database"
  - "same_session"
