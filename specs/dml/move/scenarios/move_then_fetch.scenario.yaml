schema_version: 1
kind: "scenario"
id: "scenario_move_move_then_fetch"
name: "MOVE move_then_fetch"
status: "planned"
description: "命令标签与随后的返回行同时验证，MOVE 不返回行不能解释为没有移动。"
factor_ref: "move"
fixture_refs:
  - "fixture_move_cursor"
fact_refs:
  - "move_fact_purpose"
  - "move_fact_count_tag"
  - "move_fact_example_table"
  - "move_fact_example_open"
  - "move_fact_example_move"
  - "move_fact_example_fetch"
  - "move_fact_example_close"
  - "move_fact_example_drop"
preconditions: []
steps:
  -
    id: "move"
    action: "execute_sql"
    sql: "MOVE FORWARD 5 FROM c_cursor_auto;"
  -
    id: "fetch"
    action: "execute_sql"
    sql: "FETCH FORWARD 2 FROM c_cursor_auto;"
oracles:
  -
    after_step: "move"
    kind: "command_tag"
    expected: "MOVE 5"
  -
    after_step: "fetch"
    kind: "result_rows"
    expected:
      -
        - 6
        - 6
      -
        - 7
        - 7
execution_requirements:
  - "database"
  - "same_session"
