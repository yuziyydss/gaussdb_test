schema_version: 1
kind: matrix
id: matrix_insert_source_profiles
name: INSERT 输入行与查询输出剖面
status: ready
description: 为 DEFAULT VALUES、VALUES/VALUE 和 SELECT 输入声明行列表、列数与类型。
factor_ref: insert

profile_property_defaults: {}

profiles:
  - id: insert_source_default_values
    render: ""
    validity: valid
    properties: {source_kind: default_values, items: []}
    fact_refs: [insert_fact_default]
  - id: insert_source_values_one
    render: ""
    validity: valid
    properties: {source_kind: values, items: ["(101, 'alpha')"], output_column_count: 2, output_types: [INTEGER, VARCHAR]}
    fact_refs: [insert_fact_expression, insert_fact_column_mapping]
  - id: insert_source_values_two
    render: ""
    validity: valid
    properties: {source_kind: values, items: ["(102, 'beta')", "(103, 'gamma')"], output_column_count: 2, output_types: [INTEGER, VARCHAR]}
    fact_refs: [insert_fact_purpose, insert_fact_expression]
  - id: insert_source_value_two
    render: ""
    validity: valid
    properties: {source_kind: value, items: ["(104, 'delta')", "(105, DEFAULT)"], output_column_count: 2, output_types: [INTEGER, VARCHAR]}
    fact_refs: [insert_fact_main_grammar, insert_fact_default]
  - id: insert_source_values_id
    render: ""
    validity: valid
    properties: {source_kind: values, items: ["(106)"], output_column_count: 1, output_types: [INTEGER]}
    fact_refs: [insert_fact_column_mapping]
  - id: insert_source_values_note
    render: ""
    validity: valid
    properties: {source_kind: values, items: ["('note only')"], output_column_count: 1, output_types: [VARCHAR]}
    fact_refs: [insert_fact_column_mapping]
  - id: insert_source_query
    render: SELECT col_1, name FROM t_insert_source
    validity: valid
    fixture_refs: [fixture_insert_source]
    properties: {source_kind: query, items: [], output_column_count: 2, output_types: [INTEGER, VARCHAR], source_tables: [t_insert_source], source_columns: [col_1, name], requires_cte: false}
    fact_refs: [insert_fact_query_source, insert_fact_permissions]
  - id: insert_source_cte_query
    render: SELECT col_1, name FROM src_insert
    validity: valid
    fixture_refs: [fixture_insert_source]
    properties: {source_kind: query, items: [], output_column_count: 2, output_types: [INTEGER, VARCHAR], source_tables: [t_insert_source], source_columns: [col_1, name], requires_cte: true}
    fact_refs: [insert_fact_cte_syntax, insert_fact_query_source]

documented_features:
  - {id: insert_feature_default_values, profile_refs: [insert_source_default_values], status: covered, fact_refs: [insert_fact_default]}
  - {id: insert_feature_values_one, profile_refs: [insert_source_values_one], status: covered, fact_refs: [insert_fact_expression]}
  - {id: insert_feature_values_many, profile_refs: [insert_source_values_two], status: covered, fact_refs: [insert_fact_purpose]}
  - {id: insert_feature_value_synonym, profile_refs: [insert_source_value_two], status: covered, fact_refs: [insert_fact_main_grammar]}
  - {id: insert_feature_query, profile_refs: [insert_source_query], status: covered, fact_refs: [insert_fact_query_source]}
  - {id: insert_feature_cte_query, profile_refs: [insert_source_cte_query], status: covered, fact_refs: [insert_fact_cte_syntax]}
  - {id: insert_feature_plan_hint, status: needs_profile, fact_refs: [insert_open_plan_hint_profile]}

fact_refs: [insert_fact_main_grammar, insert_fact_query_source, insert_fact_cte_syntax]
