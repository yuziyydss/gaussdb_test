schema_version: 1
kind: scenario
id: scenario_insert_pg_conflict_update
name: INSERT PG EXCLUDED 非键更新与普通插入
status: planned
description: 本场景独立重建一条101种子，冲突只更新非键note，再插入102/103；不测试主键或元组更新。
factor_ref: insert
fixture_refs: [fixture_insert_pg_conflict_fresh]
fact_refs: [insert_fact_conflict_semantics, insert_fact_conflict_environment, insert_example_conflict]
preconditions: [PG兼容, 独占新用户schema, Fixture创建者拥有INSERT/SELECT/UPDATE权限, setup和目标阶段分开判定]
steps:
  - id: conflict
    sql: "INSERT INTO g_insert_pg_conflict (id, note) VALUES (101, 'alpha') ON CONFLICT (id) DO UPDATE SET note = EXCLUDED.note;"
  - id: no_conflict
    sql: "INSERT INTO g_insert_pg_conflict (id, note) VALUES (102, 'beta'), (103, 'gamma') ON CONFLICT (id) DO UPDATE SET note = EXCLUDED.note;"
oracles:
  - {kind: result_set, step_id: conflict, sql: "SELECT id, note FROM g_insert_pg_conflict ORDER BY id;", expected: [[101, alpha]]}
  - {kind: result_set, step_id: no_conflict, sql: "SELECT id, note FROM g_insert_pg_conflict ORDER BY id;", expected: [[101, alpha], [102, beta], [103, gamma]]}
execution_requirements: [database_authorization, per_step_oracle, isolated_user_schema, actual_cleanup_evidence]
