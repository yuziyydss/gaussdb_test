schema_version: 1
kind: factor
id: insert
name: INSERT
category: DML
status: needs_review
description: 以 GaussDB V2.0-10.0.0 集中式 SQL 参考中 1.13.14.7 INSERT 章节为唯一主证据的插入语句验证包。

source:
  product: GaussDB
  document: GaussDB V2.0-10.0.0 集中式 SQL参考 1.13.14.7 INSERT
  version: V2.0-10.0.0
  artifact_sha256: 5383f2eca79ecbe64ce3e880c8e3a2a39178a6bd93ca328401740bf36c16fae5
  parent_pdf_sha256: 716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe
  extraction_rule_version: gaussdb-pdf-outline-v1
  extraction_date: "2026-09-04"
  catalog_chapter_ref:
    document_id: gaussdb_v2_0_10_0_0_centralized_reference_01
    source_relpath: general/dml/insert.txt
    chapter_sha256: 5383f2eca79ecbe64ce3e880c8e3a2a39178a6bd93ca328401740bf36c16fae5

source_ledger_ref: source_ledger_insert
syntax_ref: syntax_insert_v1

dimensions:
  with_clause:
    description: 文档列出的无 WITH、普通/递归 WITH、多 CTE、物化修饰和不同 CTE 主体；这些语法形态与尚未回放的执行行为分层记录。
    default_value_id: insert_with_none
    classes:
      - id: insert_with_absent
        meaning: 不使用 WITH。
        values:
          - id: insert_with_none
            render: ""
            representative: true
            validity: valid
            properties: {provides_cte: false, body_kind: none}
      - id: insert_with_query_forms
        meaning: 由外层查询输入引用的 SELECT CTE。
        values:
          - id: insert_with_select
            render: "WITH src_insert AS (SELECT col_1, name FROM t_insert_source) "
            representative: true
            validity: valid
            fixture_refs: [fixture_insert_source]
            properties: {provides_cte: true, recursive: false, materialization: default, body_kind: select}
            fact_refs: [insert_fact_with_declaration]
          - id: insert_with_recursive_select
            render: "WITH RECURSIVE src_insert(col_1, name) AS (VALUES (201, 'recursive') UNION ALL SELECT col_1 + 1, name FROM src_insert WHERE col_1 < 202) "
            representative: true
            validity: valid
            properties: {provides_cte: true, recursive: true, materialization: default, body_kind: select}
            fact_refs: [insert_fact_with_recursive]
          - id: insert_with_multiple_selects
            render: "WITH src_insert AS (SELECT col_1, name FROM t_insert_source), src_insert_2 AS (SELECT col_1, name FROM src_insert) "
            representative: false
            validity: valid
            fixture_refs: [fixture_insert_source]
            properties: {provides_cte: true, recursive: false, materialization: default, body_kind: select, cte_count: 2}
            fact_refs: [insert_fact_with_declaration]
          - id: insert_with_materialized_select
            render: "WITH src_insert AS MATERIALIZED (SELECT col_1, name FROM t_insert_source) "
            representative: false
            validity: valid
            fixture_refs: [fixture_insert_source]
            properties: {provides_cte: true, recursive: false, materialization: materialized, body_kind: select}
            fact_refs: [insert_fact_with_body_forms]
          - id: insert_with_not_materialized_select
            render: "WITH src_insert AS NOT MATERIALIZED (SELECT col_1, name FROM t_insert_source) "
            representative: false
            validity: valid
            fixture_refs: [fixture_insert_source]
            properties: {provides_cte: true, recursive: false, materialization: not_materialized, body_kind: select}
            fact_refs: [insert_fact_with_body_forms]
      - id: insert_with_other_bodies
        meaning: 文档正式产生式列出的 VALUES/DML CTE 主体；语法形态可生成，执行副作用由 planned scenario 验证。
        values:
          - id: insert_with_values_body
            render: "WITH src_insert(col_1, name) AS (VALUES (201, 'from values')) "
            representative: false
            validity: valid
            properties: {provides_cte: true, recursive: false, materialization: default, body_kind: values}
            fact_refs: [insert_fact_with_body_forms]
          - id: insert_with_dml_returning_body
            render: "WITH src_insert AS (INSERT INTO t_insert_target (id, note) VALUES (201, 'from dml') RETURNING id AS col_1, note AS name) "
            representative: false
            validity: valid
            fixture_refs: [fixture_insert_target]
            properties: {provides_cte: true, recursive: false, materialization: default, body_kind: dml_returning}
            fact_refs: [insert_fact_with_body_forms]

  plan_hint:
    description: 文档只定义 plan_hint 占位符和位置，没有给出可独立执行的具体 hint。
    default_value_id: insert_hint_none
    classes:
      - id: insert_hint_values
        meaning: 无 hint 或仅保存未展开占位符。
        values:
          - {id: insert_hint_none, render: "", representative: true, validity: valid}
          - id: insert_hint_unresolved
            render: "/*+ plan_hint */ "
            representative: false
            validity: unknown
            fact_refs: [insert_open_plan_hint_profile]

  ignore_modifier:
    description: INSERT IGNORE 仅在文档限定的 B 兼容环境中为条件能力。
    default_value_id: insert_ignore_none
    classes:
      - id: insert_ignore_values
        meaning: 默认错误处理或环境受限的 IGNORE。
        values:
          - {id: insert_ignore_none, render: "", representative: true, validity: valid, properties: {enabled: false}}
          - id: insert_ignore_keyword
            render: "IGNORE "
            representative: true
            validity: conditional
            properties: {enabled: true, compatibility_mode: B, b_format_version: "5.7", b_format_dev_version: s1}
            fact_refs: [insert_fact_ignore_environment, insert_fact_ignore_semantics]

  target_profile:
    description: 表、别名、分区、视图和子查询目标及其输入列契约。
    profile_source:
      matrix_ref: matrix_insert_target_profiles
      profile_id_path: profiles.id

  source_profile:
    description: DEFAULT VALUES、VALUES/VALUE 行列表和查询输入的完整渲染及列契约。
    profile_source:
      matrix_ref: matrix_insert_source_profiles
      profile_id_path: profiles.id

  conflict_clause:
    description: 无冲突处理、ON DUPLICATE KEY UPDATE 和 PG 条件下的 ON CONFLICT 语法族。
    default_value_id: insert_conflict_none
    classes:
      - id: insert_conflict_absent
        meaning: 普通 INSERT。
        values:
          - id: insert_conflict_none
            render: ""
            representative: true
            validity: valid
            properties: {family: none, updates_unique_key: false, values_predicate_supported: true}
      - id: insert_conflict_duplicate
        meaning: 唯一冲突时 NOTHING 或更新表达式。
        values:
          - id: insert_duplicate_nothing
            render: " ON DUPLICATE KEY UPDATE NOTHING"
            representative: true
            validity: valid
            properties: {family: duplicate, updates_unique_key: false, values_predicate_supported: true}
            fact_refs: [insert_fact_duplicate_semantics]
          - id: insert_duplicate_update_values
            render: " ON DUPLICATE KEY UPDATE note = VALUES(note)"
            representative: true
            validity: valid
            properties: {family: duplicate, updates_unique_key: false, values_predicate_supported: true}
            fact_refs: [insert_fact_duplicate_semantics, insert_fact_duplicate_source_references]
          - id: insert_duplicate_update_excluded
            render: " ON DUPLICATE KEY UPDATE note = EXCLUDED.note"
            representative: true
            validity: valid
            properties: {family: duplicate, updates_unique_key: false, values_predicate_supported: true}
            fact_refs: [insert_fact_duplicate_source_references]
          - id: insert_duplicate_update_multiple_where
            render: " ON DUPLICATE KEY UPDATE note = VALUES(note), aux = DEFAULT WHERE id > 0"
            representative: true
            validity: valid
            properties: {family: duplicate, updates_unique_key: false, values_predicate_supported: true, assignment_count: 2, has_where: true}
            fact_refs: [insert_fact_main_grammar, insert_fact_duplicate_source_references, insert_fact_default]
          - id: insert_duplicate_update_key_invalid
            render: " ON DUPLICATE KEY UPDATE id = VALUES(id)"
            representative: true
            validity: invalid
            properties: {family: duplicate, updates_unique_key: true, values_predicate_supported: true}
            fact_refs: [insert_fact_duplicate_restrictions]
          - id: insert_duplicate_values_in_invalid
            render: " ON DUPLICATE KEY UPDATE note = CASE WHEN VALUES(note) IN ('x') THEN 'x' ELSE note END"
            representative: true
            validity: invalid
            properties: {family: duplicate, updates_unique_key: false, values_predicate_supported: false}
            fact_refs: [insert_fact_duplicate_values_restrictions]
      - id: insert_conflict_pg
        meaning: 仅 PG 兼容环境支持的 ON CONFLICT 分支。
        values:
          - id: insert_on_conflict_nothing
            render: " ON CONFLICT (id) DO NOTHING"
            representative: true
            validity: conditional
            properties: {family: conflict, action: nothing, compatibility_mode: PG, updates_unique_key: false, values_predicate_supported: true}
            fact_refs: [insert_fact_conflict_semantics, insert_fact_conflict_environment]
          - id: insert_on_conflict_nothing_no_target
            render: " ON CONFLICT DO NOTHING"
            representative: false
            validity: conditional
            properties: {family: conflict, action: nothing, compatibility_mode: PG, updates_unique_key: false, values_predicate_supported: true, has_conflict_target: false}
            fact_refs: [insert_fact_main_grammar, insert_fact_conflict_semantics, insert_fact_conflict_environment]
          - id: insert_on_conflict_update
            render: " ON CONFLICT (id) DO UPDATE SET note = EXCLUDED.note"
            representative: true
            validity: conditional
            properties: {family: conflict, action: update, compatibility_mode: PG, updates_unique_key: false, values_predicate_supported: true}
            fact_refs: [insert_fact_conflict_semantics, insert_fact_conflict_environment]
          - id: insert_on_conflict_expression_predicate
            render: " ON CONFLICT ((lower(note))) WHERE note IS NOT NULL DO NOTHING"
            representative: false
            validity: conditional
            properties: {family: conflict, action: nothing, compatibility_mode: PG, updates_unique_key: false, values_predicate_supported: true}
            fact_refs: [insert_fact_conflict_target_grammar]
          - id: insert_on_conflict_tuple_update
            render: " ON CONFLICT (id) DO UPDATE SET (id, note) = (EXCLUDED.id, EXCLUDED.note) WHERE t_insert_unique.id > 0"
            representative: false
            validity: conditional
            properties: {family: conflict, action: update, compatibility_mode: PG, updates_unique_key: true, values_predicate_supported: true}
            fact_refs: [insert_fact_conflict_action_grammar]

      - id: insert_conflict_pg_fresh
        meaning: 仅在本批PG新主键表、权限及输入范围合同内成立的有限facet；不替代泛化conditional值。
        values:
          - id: insert_on_conflict_nothing_pg_fresh
            render: " ON CONFLICT DO NOTHING"
            representative: true
            validity: valid
            properties: {family: conflict, action: nothing, compatibility_mode: PG, updates_unique_key: false, values_predicate_supported: true, has_conflict_target: false, original_value_ref: insert_on_conflict_nothing_no_target}
            fact_refs: [insert_fact_main_grammar, insert_fact_conflict_environment, insert_example_conflict]
          - id: insert_on_conflict_update_pg_fresh
            render: " ON CONFLICT (id) DO UPDATE SET note = EXCLUDED.note"
            representative: true
            validity: valid
            properties: {family: conflict, action: update, compatibility_mode: PG, updates_unique_key: false, values_predicate_supported: true, original_value_ref: insert_on_conflict_update}
            fact_refs: [insert_fact_conflict_environment, insert_example_conflict]
          - id: insert_on_conflict_tuple_pg_fresh
            render: " ON CONFLICT (id) DO UPDATE SET (note, aux) = (EXCLUDED.note, EXCLUDED.aux)"
            representative: false
            validity: valid
            properties: {family: conflict, action: update, compatibility_mode: PG, updates_unique_key: false, values_predicate_supported: true}
            fact_refs: [insert_fact_conflict_action_grammar, insert_fact_conflict_environment]

      - id: insert_same_key_tuple_finite
        meaning: PG单一INTEGER主键、单行VALUES、同列EXCLUDED赋回和目标id大于0；不证明任意改键。
        values:
          - id: insert_on_conflict_same_key_tuple
            representative: false
            render: " ON CONFLICT (id) DO UPDATE SET (id, note) = (EXCLUDED.id, EXCLUDED.note) WHERE g_insert_pg_key.id > 0"
            validity: valid
            properties: {family: conflict, action: update, compatibility_mode: PG, updates_unique_key: true, values_predicate_supported: true, conflict_key_update_contract: same_inline_integer_key_tuple_v1, original_value_ref: insert_on_conflict_tuple_update}
            fact_refs: [insert_fact_conflict_action_grammar, insert_fact_conflict_environment, insert_fact_conflict_restrictions]

      - id: insert_partial_index_finite
        meaning: 仅真实双整数ASTORE表、同形部分唯一索引、PG与内建操作符门禁内的有限代表。
        values:
          - id: insert_on_conflict_partial_fresh
            render: " ON CONFLICT ((id + 1)) WHERE flag > 0 DO NOTHING"
            representative: false
            validity: valid
            properties: {family: conflict, action: nothing, compatibility_mode: PG, updates_unique_key: false, values_predicate_supported: true, partial_index_contract_required: true, original_value_ref: insert_on_conflict_expression_predicate}
            fact_refs: [insert_fact_conflict_target_grammar, insert_fact_conflict_semantics, insert_fact_conflict_environment]

  returning_clause:
    description: 无 RETURNING、返回全部列或返回带别名的输出表达式。
    default_value_id: insert_returning_none
    classes:
      - id: insert_returning_values
        meaning: 文档列出的 RETURNING 投影形态。
        values:
          - {id: insert_returning_none, render: "", representative: true, validity: valid}
          - id: insert_returning_all
            render: " RETURNING *"
            representative: true
            validity: valid
            fact_refs: [insert_fact_returning]
          - {id: insert_returning_generated_total, render: " RETURNING total AS computed", representative: false, validity: valid, fact_refs: [insert_fact_returning_output]}
          - id: insert_returning_expression
            render: " RETURNING id, note AS inserted_note"
            representative: true
            validity: valid
            fact_refs: [insert_fact_returning, insert_fact_returning_output]

rules:
  - id: insert_rule_finite_generated_write
    kind: requires
    expression: "target_profile in ['insert_target_finite_generated_values', 'insert_target_finite_generated_query'] => source_profile.properties.generated_write_allowed == True"
    severity: error
    fact_refs: [insert_fact_generated_column]
  - id: insert_rule_duplicate_rejects_with
    kind: requires
    expression: "conflict_clause.properties.family == 'duplicate' => with_clause == 'insert_with_none'"
    severity: error
    fact_refs: [insert_fact_duplicate_rejects_with]
  - id: insert_rule_duplicate_cannot_update_unique_key
    kind: requires
    expression: "conflict_clause.properties.family == 'duplicate' => conflict_clause.properties.updates_unique_key == False"
    severity: error
    fact_refs: [insert_fact_duplicate_restrictions]
  - id: insert_rule_duplicate_target_supported
    kind: requires
    expression: "conflict_clause.properties.family == 'duplicate' => target_profile.properties.duplicate_supported == True"
    severity: error
    fact_refs: [insert_fact_view_target_restrictions]
  - id: insert_rule_conflict_target_supported
    kind: requires
    expression: "conflict_clause.properties.family == 'conflict' => target_profile.properties.conflict_supported == True"
    severity: error
    fact_refs: [insert_fact_view_subquery_grammar]
  - id: insert_rule_ignore_target_supported
    kind: requires
    expression: "ignore_modifier.properties.enabled == True => target_profile.properties.ignore_supported == True"
    severity: error
    fact_refs: [insert_fact_view_subquery_grammar]
  - id: insert_rule_partition_alias_form_supported
    kind: requires
    expression: target_profile.properties.partition_alias_supported != False
    severity: error
    fact_refs: [insert_fact_alias_restrictions]
  - id: insert_rule_duplicate_values_predicate_supported
    kind: requires
    expression: "conflict_clause.properties.family == 'duplicate' => conflict_clause.properties.values_predicate_supported != False"
    severity: error
    fact_refs: [insert_fact_duplicate_values_restrictions]

structural_checks:
  - id: insert_struct_target_input_contract
    kind: insert_input_contract
    fact_refs: [insert_fact_column_mapping, insert_fact_type_conversion, insert_inferred_target_input_contract]

facts:
  - id: insert_fact_storage_exact
    type: constraint
    statement: 精确匹配目标字段类型优先。
    status: confirmed
    source_anchor: 1.9.4 L5-L5
  - {id: insert_fact_purpose, type: syntax, statement: "INSERT 向表中插入一行或多行数据。", status: confirmed, source_anchor: "L4-L5 功能描述"}
  - {id: insert_fact_permissions, type: environment, statement: "普通 INSERT、RETURNING、query 源和 ON DUPLICATE UPDATE 分别要求文档列出的 INSERT、SELECT、UPDATE 权限组合；INSERT ANY TABLE 还隐含非系统模式 USAGE。", status: confirmed, source_anchor: "L7-L15 注意事项"}
  - {id: insert_fact_generated_column, type: constraint, statement: "生成列不能直接写值，只能在 INSERT 中为其指定 DEFAULT。", status: confirmed, source_anchor: "L16-L17 注意事项"}
  - {id: insert_fact_truncation, type: environment, statement: "C 兼容数据库在 td_compatible_truncation=on 且非外表时会截断超长 CHAR/VARCHAR；字节编码跨多字节截断点可能产生非预期尾部。", status: confirmed, source_anchor: "L18-L27 注意事项"}
  - {id: insert_fact_main_grammar, type: syntax, statement: "表目标顶层产生式由可选 WITH、hint、IGNORE、目标、DEFAULT VALUES/VALUES/VALUE/query、冲突分支和 RETURNING 构成。", status: confirmed, source_anchor: "L30-L40 语法格式"}
  - {id: insert_fact_view_subquery_grammar, type: syntax, statement: "视图或子查询目标顶层产生式包含 WITH、hint、别名/列、三类输入和 RETURNING，但不包含 IGNORE 或冲突子句。", status: confirmed, source_anchor: "L42-L48 语法格式"}
  - {id: insert_fact_subquery_select_grammar, type: syntax, statement: "目标 subquery 的 SELECT 文法列出投影、INTO、FROM、WHERE、层次查询、ORDER BY、FETCH 和尾部 INTO。", status: confirmed, source_anchor: "L50-L61 subquery"}
  - {id: insert_fact_from_item_grammar, type: syntax, statement: "subquery 的 from_item 可为表/视图、派生表、CTE 或连接。", status: confirmed, source_anchor: "L63-L67 from_item"}
  - {id: insert_fact_with_body_forms, type: syntax, statement: "with_query 可声明结果列、MATERIALIZED/NOT MATERIALIZED 修饰，主体可为 SELECT、VALUES、INSERT、UPDATE 或 DELETE。", status: confirmed, source_anchor: "L69-L71 with_query"}
  - {id: insert_fact_partition_grammar, type: syntax, statement: "partition_clause 支持 PARTITION/SUBPARTITION，且均可按名称或 FOR 值列表指定。", status: confirmed, source_anchor: "L73-L75 partition_clause"}
  - {id: insert_fact_conflict_target_grammar, type: syntax, statement: "ON CONFLICT 目标支持索引列或索引表达式列表及可选索引谓词。", status: confirmed, source_anchor: "L77-L78 conflict_target"}
  - {id: insert_fact_conflict_action_grammar, type: syntax, statement: "ON CONFLICT 动作支持 DO NOTHING 或 DO UPDATE SET 的单列/元组赋值及可选 WHERE。", status: confirmed, source_anchor: "L80-L83 conflict_action"}
  - {id: insert_fact_with_declaration, type: syntax, statement: "WITH 声明一个或多个可按名称引用的临时结果集，并可声明结果列名。", status: confirmed, source_anchor: "L87-L94 WITH"}
  - {id: insert_fact_with_recursive, type: syntax, statement: "WITH RECURSIVE 允许 SELECT 子查询按名称递归引用。", status: confirmed, source_anchor: "L87-L94 WITH"}
  - {id: insert_fact_with_dml_command_tag, type: behavior_oracle, statement: "WITH 中带 RETURNING 的 DML 会决定外层 INSERT 的命令回显记录数。", status: confirmed, source_anchor: "L96-L103 WITH 须知"}
  - {id: insert_fact_with_materialization, type: behavior_oracle, statement: "MATERIALIZED、NOT MATERIALIZED 和默认规则影响 CTE 是否物化及能否与主干联合优化。", status: confirmed, source_anchor: "L106-L114 WITH 物化"}
  - {id: insert_fact_duplicate_rejects_with, type: constraint, statement: "INSERT ON DUPLICATE KEY UPDATE 不支持 WITH 或 WITH RECURSIVE。", status: confirmed, source_anchor: "L115-L117 WITH 说明"}
  - {id: insert_open_plan_hint_profile, type: open_question, statement: "本章只给出 plan_hint 占位符与位置，未展开任何可独立执行的具体 hint。", status: needs_verification, source_anchor: "L118-L120 plan_hint"}
  - {id: insert_fact_ignore_semantics, type: behavior_oracle, statement: "IGNORE 可把九类 ERROR 降为 WARNING，并按错误类型调整为最近值或跳过无效行。", status: confirmed, source_anchor: "L121-L133 IGNORE"}
  - {id: insert_fact_ignore_environment, type: environment, statement: "INSERT IGNORE 仅支持 B 模式、b_format_version=5.7、b_format_dev_version=s1。", status: confirmed, source_anchor: "L135-L140 IGNORE 说明"}
  - {id: insert_fact_ignore_restrictions, type: constraint, statement: "INSERT IGNORE 不支持密态表、外表、MOT 表及延迟生效的主键或唯一约束。", status: confirmed, source_anchor: "L139-L140 IGNORE 限制"}
  - {id: insert_fact_ignore_zero_values, type: behavior_oracle, statement: "IGNORE 对文档列出的 OID 使用对应零值替代 NOT NULL 的 NULL，并警告零值参与计算需谨慎。", status: confirmed, source_anchor: "L141-L219 IGNORE 零值表"}
  - {id: insert_open_ignore_fixture_matrix, type: open_question, statement: "IGNORE 的九类错误、受限对象和完整 OID 零值表仍需要 B/5.7/s1 数据库 Fixture 与逐项实测，静态包不宣称执行成功。", status: needs_verification, source_anchor: "L121-L219 IGNORE 环境与类型矩阵"}
  - {id: insert_fact_target_table, type: syntax, statement: "table_name 必须是已存在的目标表。", status: confirmed, source_anchor: "L222-L224 table_name"}
  - {id: insert_open_dblink_profile, type: open_question, statement: "本章仅声明支持 DATABASE LINK，未展开远端目标拼写、连接对象与生命周期。", status: needs_verification, source_anchor: "L225-L228 DATABASE LINK 引用"}
  - {id: insert_fact_subquery_target, type: behavior_oracle, statement: "subquery 目标按临时视图处理并支持 CHECK OPTION；单表直接写入，多表或嵌套结构依赖保留键判断。", status: confirmed, source_anchor: "L229-L234 subquery"}
  - {id: insert_open_preserved_key_definition, type: open_question, statement: "保留键表和可更新列的完整判定规则位于 CREATE VIEW，本章只引用未展开。", status: needs_verification, source_anchor: "L232-L256 CREATE VIEW 引用"}
  - {id: insert_fact_view_target_restrictions, type: constraint, statement: "视图/子查询只允许直接基表用户列且至少一个可更新列；禁止顶层聚合/集合/分页等结构、特定函数目标、无 INSTEAD 触发器、ON DUPLICATE 和系统视图。", status: confirmed, source_anchor: "L240-L257 视图和子查询约束"}
  - {id: insert_fact_view_supported_tables, type: constraint, statement: "视图/子查询目标支持普通、临时、全局临时、分区、二级分区、ustore 和 astore 表。", status: confirmed, source_anchor: "L251-L252 支持表类型"}
  - {id: insert_fact_join_target_restrictions, type: constraint, statement: "多表连接目标一次只写一张基表，插入列不能来自非保留键表；WITH CHECK OPTION 下连接列不能写。", status: confirmed, source_anchor: "L253-L256 连接目标"}
  - {id: insert_fact_alias_restrictions, type: constraint, statement: "无 AS 别名必须是合法非关键字标识符；分区表无 AS 别名不能与指定分区插入组合。", status: confirmed, source_anchor: "L258-L264 alias_name"}
  - {id: insert_fact_partition_behavior, type: behavior_oracle, statement: "指定分区插入时，输入值与目标分区不匹配会报错。", status: confirmed, source_anchor: "L265-L269 partition_clause"}
  - {id: insert_open_partition_reference, type: open_question, statement: "SELECT 关键字说明和 CREATE TABLE SUBPARTITION 示例未在本章展开，二级分区 Fixture 仍待补。", status: needs_verification, source_anchor: "L265-L269 章节引用"}
  - {id: insert_fact_column_mapping, type: syntax, statement: "显式目标列按顺序接收输入；省略列表按表声明顺序；N 个输入映射前 N 列；缺列取默认值或 NULL。", status: confirmed, source_anchor: "L270-L281 column_name"}
  - {id: insert_fact_column_designators, type: syntax, statement: "目标字段支持子字段、数组下标和表别名限定。", status: confirmed, source_anchor: "L270-L281 column_name"}
  - {id: insert_open_complex_column_fixture, type: open_question, statement: "本章没有给出复合类型或数组目标字段的完整建表例，子字段和数组下标写入仍需专用 Fixture 与数据库验证。", status: needs_verification, source_anchor: "L270-L281 column_name"}
  - {id: insert_fact_duplicate_source_references, type: syntax, statement: "ON DUPLICATE 更新表达式可用 VALUES(column) 或 EXCLUDED.column 引用冲突源行，VALUES(column) 可嵌入复合表达式。", status: confirmed, source_anchor: "L282-L289 expression"}
  - {id: insert_fact_duplicate_values_restrictions, type: constraint, statement: "VALUES(column) 仅能用于 ON DUPLICATE，且不能位于 IN 或 NOT IN 表达式。", status: confirmed, source_anchor: "L290-L294 VALUES(column) 说明"}
  - {id: insert_fact_expression, type: syntax, statement: "输入可以是有效表达式、值或 DEFAULT，单引号以单引号自身转义。", status: confirmed, source_anchor: "L282-L299 expression/DEFAULT"}
  - {id: insert_fact_type_conversion, type: behavior_oracle, statement: "输入类型不匹配时系统尝试转换，失败则 INSERT 报错。", status: confirmed, source_anchor: "L295-L297 类型转换"}
  - {id: insert_fact_default, type: syntax, statement: "DEFAULT 使用列缺省值，没有缺省值时为 NULL。", status: confirmed, source_anchor: "L298-L299 DEFAULT"}
  - {id: insert_fact_query_source, type: syntax, statement: "query 是 SELECT 语句，其结果成为 INSERT 输入。", status: confirmed, source_anchor: "L300-L301 query"}
  - {id: insert_fact_returning, type: syntax, statement: "RETURNING 返回实际插入行，其列表与 SELECT 输出列表一致。", status: confirmed, source_anchor: "L302-L303 RETURNING"}
  - {id: insert_fact_returning_output, type: behavior_oracle, statement: "RETURNING 输出表达式在每行插入后计算，可引用目标表任意字段，* 返回整行，并可指定输出名。", status: confirmed, source_anchor: "L304-L310 output_expression/output_name"}
  - {id: insert_fact_duplicate_semantics, type: behavior_oracle, statement: "唯一冲突时 ON DUPLICATE 执行 NOTHING 或 UPDATE；无唯一约束时仅执行普通插入。", status: confirmed, source_anchor: "L311-L315 ON DUPLICATE"}
  - {id: insert_fact_duplicate_triggers, type: behavior_oracle, statement: "ON DUPLICATE 的 INSERT、UPDATE、NOTHING 路径具有文档分别列出的行级和语句级触发器序列。", status: confirmed, source_anchor: "L316-L324 触发器"}
  - {id: insert_fact_duplicate_order, type: behavior_oracle, statement: "多唯一约束只更新首先检测的冲突行；多输入行命中同一目标行时按顺序先插入或更新、随后依次更新。", status: confirmed, source_anchor: "L326-L331 冲突顺序"}
  - {id: insert_fact_duplicate_restrictions, type: constraint, statement: "ON DUPLICATE 不支持延迟唯一/主键、外表和 UPDATE 子链接，且主键或唯一索引列不可更新。", status: confirmed, source_anchor: "L325-L334 ON DUPLICATE 限制"}
  - {id: insert_fact_conflict_semantics, type: behavior_oracle, statement: "ON CONFLICT 在无冲突时普通插入，冲突时执行 DO NOTHING 或 DO UPDATE SET。", status: confirmed, source_anchor: "L335-L354 ON CONFLICT"}
  - {id: insert_fact_conflict_environment, type: environment, statement: "ON CONFLICT 仅支持 PG 兼容，DO UPDATE 需要 UPDATE 权限。", status: confirmed, source_anchor: "L355-L361 ON CONFLICT 说明"}
  - {id: insert_fact_conflict_restrictions, type: constraint, statement: "ON CONFLICT 禁止 COLLATE/opclass、ON CONSTRAINT、冲突目标及UPDATE SET中的子链接、UPDATE SET中的子查询、列存/外表/STREAM/CONTVIEW、同语句重复源键和DBLINK。末条‘插入子查询’的指代另行待审。", status: confirmed, source_anchor: "L357-L366 ON CONFLICT 明确限制"}
  - {id: insert_open_conflict_query_interpretation, type: open_question, statement: "L367‘不支持插入子查询’未明确指作为目标的subquery还是提供数据的query；L229-L234与L300-L301分别定义这两个概念，L30-L48也分别给出表目标和视图/子查询目标产生式。不能据此确定禁止SELECT输入，也不能推导该组合成功；原负例及错误类别仅作为待审假设保全。", status: needs_verification, source_anchor: "L367；对照L30-L48、L229-L234、L300-L301"}
  - {id: insert_open_conflict_pg_fixture, type: open_question, statement: "ON CONFLICT 的静态分支和文档 Oracle 已记录，但表达式/部分索引、元组更新及全部限制仍需 PG 兼容数据库 Fixture 逐项回放。", status: needs_verification, source_anchor: "L335-L367 与 L453-L486 ON CONFLICT"}
  - {id: insert_fact_performance_values, type: environment, statement: "批量 VALUES 建议把多条记录合并进一条 INSERT 以提高加载性能。", status: confirmed, source_anchor: "L881-L887 优化建议/VALUES"}
  - {id: insert_fact_performance_index, type: environment, statement: "batch_insert_index_types=rcr_ubtree 的批量索引优化适用于 JDBC executeBatch、INSERT SELECT 或 COPY，并要求 UBTree RCR、非递增数据和非 SMP。", status: confirmed, source_anchor: "L889-L905 批量索引"}
  - {id: insert_fact_performance_risks, type: environment, statement: "递增、持续增长、分散数据/低内存可能使批量索引优化退化；文档建议关闭开关并可启用 BIINDEX 日志诊断。", status: confirmed, source_anchor: "L906-L918 性能风险"}
  - {id: insert_example_core, type: example, statement: "文档展示单行、部分列、隐式全列、多行 VALUES 及 INSERT SELECT 的命令与结果。", status: confirmed, source_anchor: "L370-L430 示例"}
  - {id: insert_example_duplicate, type: example, statement: "文档展示主键冲突下 VALUES(info) 更新及最终行值。", status: confirmed, source_anchor: "L431-L451 示例"}
  - {id: insert_example_conflict, type: example, statement: "文档展示 PG 数据库 ON CONFLICT DO UPDATE 与 DO NOTHING 及最终行值。", status: confirmed, source_anchor: "L453-L486 示例"}
  - {id: insert_example_ignore, type: example, statement: "文档展示 IGNORE 对 NOT NULL、唯一冲突、分区、标量子查询、超长数据、时间溢出、除零和非法值的 WARNING 与结果。", status: confirmed, source_anchor: "L488-L706 示例"}
  - {id: insert_example_alias, type: example, statement: "文档展示 AS 和无 AS 表别名限定列插入。", status: confirmed, source_anchor: "L707-L731 示例"}
  - {id: insert_example_with, type: example, statement: "文档展示带 RETURNING 的 INSERT CTE 为外层 INSERT 提供输入。", status: confirmed, source_anchor: "L733-L775 示例"}
  - {id: insert_example_subquery, type: example, statement: "文档展示子查询目标成功、CHECK OPTION/READ ONLY 失败及连接子查询写入。", status: confirmed, source_anchor: "L777-L820 示例"}
  - {id: insert_example_view, type: example, statement: "文档展示视图目标成功、CHECK OPTION/READ ONLY 失败及连接视图写入。", status: confirmed, source_anchor: "L821-L878 示例"}
  - {id: insert_inferred_target_input_contract, type: constraint, statement: "生成器在组合前校验目标列数/类型与 VALUES/query 输出；DEFAULT VALUES 不做列数匹配。", status: inferred, source_anchor: "由 L270-L301 的列映射、类型和输入分支推导"}

