schema_version: 1
kind: syntax
id: syntax_insert_v1
name: INSERT 递归 Subgrammar AST
category: DML
status: ready
factor_ref: insert
description: 使用 AST choice/repeat/ref 表达 INSERT 目标、三类输入、冲突处理与 RETURNING。

ast: {kind: ref, ref: insert_statement}

subgrammars:
  insert_statement:
    kind: sequence
    items:
      - {kind: slot, slot: with_clause}
      - {kind: literal, text: "INSERT "}
      - {kind: slot, slot: plan_hint}
      - {kind: slot, slot: ignore_modifier}
      - {kind: literal, text: "INTO "}
      - {kind: slot, slot: target_profile}
      - {kind: literal, text: " "}
      - {kind: ref, ref: input_source}
      - {kind: slot, slot: conflict_clause}
      - {kind: slot, slot: returning_clause}

  input_source:
    kind: choice
    selector: source_profile
    branches:
      insert_source_default_values: {kind: literal, text: "DEFAULT VALUES"}
      insert_source_values_one:
        kind: sequence
        items:
          - {kind: literal, text: "VALUES "}
          - {kind: repeat, slot: source_profile, separator: ", ", items_property: items}
      insert_source_values_two:
        kind: sequence
        items:
          - {kind: literal, text: "VALUES "}
          - {kind: repeat, slot: source_profile, separator: ", ", items_property: items}
      insert_source_value_two:
        kind: sequence
        items:
          - {kind: literal, text: "VALUE "}
          - {kind: repeat, slot: source_profile, separator: ", ", items_property: items}
      insert_source_values_id:
        kind: sequence
        items:
          - {kind: literal, text: "VALUES "}
          - {kind: repeat, slot: source_profile, separator: ", ", items_property: items}
      insert_source_values_note:
        kind: sequence
        items:
          - {kind: literal, text: "VALUES "}
          - {kind: repeat, slot: source_profile, separator: ", ", items_property: items}
      insert_source_query: {kind: slot, slot: source_profile}
      insert_source_cte_query: {kind: slot, slot: source_profile}

rendering: {whitespace: collapse, statement_terminator: ";"}

slots:
  with_clause: {type: ast_fragment, optional: true, dimension_ref: insert.with_clause}
  plan_hint: {type: sql_fragment, optional: true, dimension_ref: insert.plan_hint}
  ignore_modifier: {type: token, optional: true, dimension_ref: insert.ignore_modifier}
  target_profile: {type: target_profile, optional: false, dimension_ref: insert.target_profile, symbol_action: writes_relation}
  source_profile: {type: ast_selector, optional: false, dimension_ref: insert.source_profile, symbol_action: reads_relations}
  conflict_clause: {type: sql_fragment, optional: true, dimension_ref: insert.conflict_clause}
  returning_clause: {type: sql_fragment, optional: true, dimension_ref: insert.returning_clause}

source_fact_refs:
  - insert_fact_main_grammar
  - insert_fact_view_subquery_grammar
  - insert_fact_cte_syntax
  - insert_fact_column_mapping
  - insert_fact_default
  - insert_fact_query_source
  - insert_fact_returning
  - insert_fact_duplicate_semantics
  - insert_fact_conflict_semantics

