schema_version: 1
kind: fixture
id: fixture_insert_view_target
name: INSERT 可更新视图与子查询基表
status: ready
description: 提供单表可更新视图和子查询目标的基表。
factor_ref: insert
provides:
  tables:
    - name: t_insert_view_base
      persistence: permanent
      table_kind: regular
      columns:
        - {name: id, type: INTEGER, nullable: true}
        - {name: note, type: VARCHAR(64), nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP VIEW IF EXISTS v_insert_target CASCADE;
    - DROP TABLE IF EXISTS t_insert_view_base CASCADE;
    - CREATE TABLE t_insert_view_base (id INTEGER, note VARCHAR(64));
    - CREATE VIEW v_insert_target AS SELECT id, note FROM t_insert_view_base;
  teardown_sqls:
    - DROP VIEW IF EXISTS v_insert_target CASCADE;
    - DROP TABLE IF EXISTS t_insert_view_base CASCADE;
  note: 显式创建单表可更新视图；子查询直接引用同一基表。

