schema_version: 1
kind: fixture
id: fixture_insert_view_target
name: INSERT 可更新视图与子查询基表
status: ready
description: 为本章已展示成功的单表视图和单表子查询目标提供最小基表；不表达跨章保留键、多表连接、CHECK OPTION 或 READ ONLY 全矩阵。
factor_ref: insert
requires_fixture_refs: [fixture_create_table_insert_view_base]
provides:
  tables:
    - name: v_insert_target
      persistence: permanent
      table_kind: view
      columns:
        - {name: id, type: INTEGER, nullable: true}
        - {name: note, type: VARCHAR(64), nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP VIEW IF EXISTS v_insert_target CASCADE;
    - CREATE VIEW v_insert_target AS SELECT id, note FROM t_insert_view_base;
  teardown_sqls:
    - DROP VIEW IF EXISTS v_insert_target CASCADE;
  note: 基表由 requires_fixture_refs 先建立；本 fixture 只负责视图。子查询使用依赖 fixture 提供的基表列契约。
