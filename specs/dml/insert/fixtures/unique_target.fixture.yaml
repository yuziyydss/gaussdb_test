schema_version: 1
kind: fixture
id: fixture_insert_unique_target
name: INSERT 唯一键冲突目标表
status: ready
description: 为本章 ON DUPLICATE KEY UPDATE 示例族提供主键和既有冲突行；PG ON CONFLICT 的环境行为仍由计划场景验证。
factor_ref: insert
provides:
  tables:
    - name: t_insert_unique
      persistence: permanent
      table_kind: regular
      columns:
        - {name: id, type: INTEGER, nullable: false}
        - {name: note, type: VARCHAR(64), nullable: true}
        - {name: aux, type: VARCHAR(64), nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP TABLE IF EXISTS t_insert_unique CASCADE;
    - CREATE TABLE t_insert_unique (id INTEGER PRIMARY KEY, note VARCHAR(64), aux VARCHAR(64));
    - INSERT INTO t_insert_unique (id, note) VALUES (101, 'existing');
  teardown_sqls:
    - DROP TABLE IF EXISTS t_insert_unique CASCADE;
  note: 显式创建主键并预置 id=101 的冲突行。
