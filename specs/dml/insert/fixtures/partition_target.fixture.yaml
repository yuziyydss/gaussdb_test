schema_version: 1
kind: fixture
id: fixture_insert_partition_target
name: INSERT 分区目标表
status: ready
description: 提供命名分区 p_low，用于指定分区插入。
factor_ref: insert
provides:
  tables:
    - name: t_insert_partitioned
      persistence: permanent
      table_kind: partitioned
      columns:
        - {name: id, type: INTEGER, nullable: false}
        - {name: note, type: VARCHAR(64), nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP TABLE IF EXISTS t_insert_partitioned CASCADE;
    - CREATE TABLE t_insert_partitioned (id INTEGER, note VARCHAR(64)) PARTITION BY RANGE (id) (PARTITION p_low VALUES LESS THAN (1000), PARTITION p_high VALUES LESS THAN (MAXVALUE));
  teardown_sqls:
    - DROP TABLE IF EXISTS t_insert_partitioned CASCADE;
  note: 分区表必须使用显式生命周期 SQL。

