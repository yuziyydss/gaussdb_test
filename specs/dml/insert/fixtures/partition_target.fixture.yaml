schema_version: 1
kind: fixture
id: fixture_insert_partition_target
name: INSERT 分区目标表
status: ready
description: 由本章 IGNORE 示例中的 RANGE 分区建表形态缩减得到，为 PARTITION 名称/FOR/AS alias 的静态语法用例提供 p_low；不表达未展开的 SUBPARTITION。
factor_ref: insert
provides:
  tables:
    - name: t_insert_partitioned
      persistence: permanent
      table_kind: partitioned
      columns:
        - {name: id, type: INTEGER, nullable: false}
        - {name: note, type: VARCHAR(64), nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP TABLE IF EXISTS t_insert_partitioned CASCADE;
    - CREATE TABLE t_insert_partitioned (id INTEGER NOT NULL, note VARCHAR(64)) PARTITION BY RANGE(id) (PARTITION p_low VALUES LESS THAN(5), PARTITION p_high VALUES LESS THAN(MAXVALUE));
  teardown_sqls:
    - DROP TABLE IF EXISTS t_insert_partitioned CASCADE;
  note: 一级 RANGE 形态来自本章 L565-L570；二级分区仍须跨章补齐。
