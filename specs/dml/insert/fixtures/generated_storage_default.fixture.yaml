schema_version: 1
kind: fixture
id: fixture_insert_generated_storage_default
name: 一般insert省略STORED的有限生成列表
status: needs_review
description: 一般CREATE TABLE L751规定的存储缺省，不借用M的m_format_dev_version条件；不涉及IDENTITY、虚拟列或任意表达式。
factor_ref: insert
provides:
  tables:
    - name: g_generated_implicit_dst
      persistence: permanent
      table_kind: regular
      columns:
        - {name: id, type: INTEGER, nullable: true}
        - {name: qty, type: INTEGER, nullable: true}
        - {name: total, type: INTEGER, nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - "CREATE TABLE g_generated_implicit_dst (id INT, qty INT, total INT GENERATED ALWAYS AS (id + qty));"
  teardown_sqls:
    - DROP TABLE g_generated_implicit_dst RESTRICT PURGE;
  note: 必须先获得数据库授权；独立一般模式连接、独占非系统测试空间、初始名称不存在且固定search_path。逐条记录ownership及CREATE成功后才清理本case对象，setup失败不得盲目teardown；不预先DROP同名对象、不CASCADE。UPDATE种子只由显式setup INSERT建立；仅静态生成，不承诺执行、事务恢复或零残留。
