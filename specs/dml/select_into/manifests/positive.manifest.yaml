schema_version: 1
kind: "manifest"
id: "manifest_select_into_positive"
name: "SELECT INTO positive"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "select_into"
syntax_ref: "syntax_select_into"
suite_type: "positive"
strategy: "pairwise"
fixture_refs: []
identifier_policy: {}
bindings:
  name:
    - "select_into_name_candidate"
  modifier:
    - "select_into_modifier_ordinary"
    - "select_into_modifier_unlogged"
    - "select_into_modifier_temp0"
    - "select_into_modifier_temp1"
    - "select_into_modifier_temp2"
    - "select_into_modifier_temp3"
    - "select_into_modifier_temp4"
    - "select_into_modifier_temp5"
  table_keyword:
    - "select_into_table_keyword_none"
    - "select_into_table_keyword_yes"
  distinct:
    - "select_into_distinct_default"
    - "select_into_distinct_all"
    - "select_into_distinct_distinct"
  projection:
    - "select_into_projection_names"
    - "select_into_projection_aliases"
    - select_into_projection_arithmetic
  where:
    - "select_into_where_none"
    - "select_into_where_one"
  order:
    - "select_into_order_none"
    - "select_into_order_asc"
    - "select_into_order_desc"
  limit:
    - "select_into_limit_none"
    - "select_into_limit_one"
    - "select_into_limit_offset"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
local_rules:
  -
    expression: "limit == 'select_into_limit_none' or order != 'select_into_order_none'"
    rationale: "本批采样要求截断行有确定顺序，不声称 SQL 产品禁止无序 LIMIT。"
    fact_refs:
      - "select_into_fact_limit"
