schema_version: 1
kind: "scenario"
id: "scenario_select_into_copy_rows"
name: "SELECT INTO copy_rows"
status: "planned"
description: "检查 INTO 写入结果而非把命令返回值当结果集"
factor_ref: "select_into"
fixture_refs:
  - "fixture_select_into_target"
fact_refs:
  - "select_into_fact_create_copy"
  - "select_into_fact_no_return"
  - "select_into_fact_inherit"
  - "create_table_as::create_table_as_fact_only_names_types"
preconditions: []
steps:
  -
    id: "create"
    action: "execute_sql"
    sql: "SELECT col_1, col_2 INTO t_into_candidate FROM t_ctas_source WHERE col_1 > 1"
  -
    id: "read"
    action: "execute_sql"
    sql: "SELECT col_1, col_2 FROM t_into_candidate ORDER BY col_1"
oracles:
  -
    after_step: "read"
    kind: "result_set_equals"
    expected:
      -
        - 3
        - 4
execution_requirements:
  - "database"
  - "same_session"
