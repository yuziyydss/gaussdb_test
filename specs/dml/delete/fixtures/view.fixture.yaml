schema_version: 1
kind: fixture
id: fixture_delete_view
name: DELETE 可更新单表视图
status: ready
description: 从本章单表视图成功示例缩减得到，只支撑可更新视图正向与多表视图目标负向语法。
factor_ref: delete
provides:
  tables:
    - name: t_delete_view_base
      persistence: permanent
      table_kind: regular
      columns:
        - {name: id, type: INTEGER, nullable: false}
        - {name: note, type: VARCHAR(64), nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP VIEW IF EXISTS v_delete_target CASCADE;
    - DROP TABLE IF EXISTS t_delete_view_base CASCADE;
    - CREATE TABLE t_delete_view_base (id INTEGER NOT NULL, note VARCHAR(64));
    - INSERT INTO t_delete_view_base VALUES (1, 'keep'), (2, 'delete_me');
    - CREATE VIEW v_delete_target AS SELECT id, note FROM t_delete_view_base;
  teardown_sqls:
    - DROP VIEW IF EXISTS v_delete_target CASCADE;
    - DROP TABLE IF EXISTS t_delete_view_base CASCADE;
  note: 显式创建本章已展示可删除的单表视图。
