  - id: delete_target_subquery
    render: (SELECT id, note FROM t_delete_subquery_base)
    validity: valid
    fixture_refs: [fixture_delete_subquery]
    properties:
      target_kind: subquery
      updatable: true
      source_tables: [t_delete_subquery_base]
      source_columns: [id, note]
    fact_refs: [delete_fact_subquery_grammar, delete_fact_subquery_target, delete_example_subquery]

