schema_version: 1
kind: manifest
id: manifest_delete_multi_using_positive
name: DELETE 多表 USING 分支
status: needs_review
description: 覆盖 DELETE 后可选 FROM、多目标列表、可选 USING 及多表时重复目标表的文档语法。
factor_ref: delete
syntax_ref: syntax_delete_v1
suite_type: positive
strategy: pairwise
fixture_refs: []
identifier_policy: {}
bindings:
  delete_form: [delete_form_multi_using]
  multi_from_keyword: [delete_multi_from, delete_multi_without_from]
  multi_target_profile: [delete_multi_targets_basic, delete_multi_targets_modified]
  multi_using_clause: [delete_multi_using_none, delete_multi_using_lookup, delete_multi_using_target]
  multi_predicate: [delete_multi_predicate_none, delete_multi_predicate_where]
local_rules:
  - expression: "multi_using_clause == 'delete_multi_using_none' => multi_from_keyword == 'delete_multi_from'"
    rationale: 两个顶层多表产生式的可选词全省略时会渲染成同一 SQL；本清单保留带 FROM 的第一分支，不改变产品合法性。
    fact_refs: [delete_fact_multi_grammar]
expected: {default: success, scope: syntax_and_semantics}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
