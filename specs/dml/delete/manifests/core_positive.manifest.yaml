  single_predicate: [delete_predicate_none, delete_predicate_where]
  order_clause: [delete_order_none, delete_order_expression, delete_order_asc, delete_order_desc, delete_order_using]
  limit_clause: [delete_limit_none, delete_limit_one]
  returning_clause: [delete_returning_none, delete_returning_all, delete_returning_expression]
