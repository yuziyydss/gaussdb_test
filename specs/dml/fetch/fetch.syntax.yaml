schema_version: 1
kind: "syntax"
id: "syntax_fetch"
name: "FETCH 语法"
factor_ref: "fetch"
category: "DML"
status: "ready"
description: "语法结构来自 PDF，选值仅由 factor/manifest 提供。"
rendering:
  whitespace: "collapse"
  statement_terminator: ";"
slots:
  direction:
    type: "token"
    optional: true
    dimension_ref: "fetch.direction"
  count:
    type: "token"
    optional: true
    dimension_ref: "fetch.count"
  connector:
    type: "token"
    optional: true
    dimension_ref: "fetch.connector"
  cursor:
    type: "token"
    optional: true
    dimension_ref: "fetch.cursor"
source_fact_refs:
  - "fetch_fact_syntax"
  - "fetch_fact_optional"
  - "fetch_fact_syntax_next"
  - "fetch_fact_syntax_prior"
  - "fetch_fact_syntax_first"
  - "fetch_fact_syntax_last"
  - "fetch_fact_syntax_absolute"
  - "fetch_fact_syntax_relative"
  - "fetch_fact_syntax_count"
  - "fetch_fact_syntax_all"
  - "fetch_fact_syntax_forward"
  - "fetch_fact_syntax_forward_count"
  - "fetch_fact_syntax_forward_all"
  - "fetch_fact_syntax_backward"
  - "fetch_fact_syntax_backward_count"
  - "fetch_fact_syntax_backward_all"
  - "fetch_fact_direction"
  - "fetch_fact_absolute_signed"
  - "fetch_fact_relative_signed"
  - "fetch_fact_name"
ast:
  kind: "sequence"
  items:
    -
      kind: "literal"
      text: "FETCH "
    -
      kind: "ref"
      ref: "direction"
    -
      kind: "slot"
      slot: "cursor"
subgrammars:
  direction:
    kind: "choice"
    selector: "direction"
    branches:
      fetch_direction_implicit:
        kind: "literal"
        text: ""
      "*":
        kind: "sequence"
        items:
          -
            kind: "slot"
            slot: "direction"
          -
            kind: "literal"
            text: " "
          -
            kind: "optional"
            selector: "direction"
            enabled_values:
              - "fetch_direction_absolute"
              - "fetch_direction_relative"
              - "fetch_direction_count"
              - "fetch_direction_forward_count"
              - "fetch_direction_backward_count"
            item:
              kind: "sequence"
              items:
                -
                  kind: "slot"
                  slot: "count"
                -
                  kind: "literal"
                  text: " "
          -
            kind: "slot"
            slot: "connector"
          -
            kind: "literal"
            text: " "
