rules:
  -
    id: "fetch_rule_no_scroll"
    kind: "requires"
    expression: "cursor.properties.no_scroll == False or not (direction.properties.kind in ['prior', 'backward', 'backward_all'] or (direction.properties.kind == 'backward_count' and count.properties.positive == True) or (direction.properties.kind in ['relative', 'forward_count', 'count'] and count.properties.negative == True))"
    fact_refs:
      - "fetch_fact_no_scroll"
    severity: "error"
