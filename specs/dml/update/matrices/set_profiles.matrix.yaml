schema_version: 1
kind: matrix
id: matrix_update_set_profiles
name: UPDATE SET 赋值形态
status: needs_review
description: 有限枚举单列、DEFAULT、元组、多项、别名限定及赋值子查询；任意元组列数/类型相容性超出 V1 结构契约，保留 open question。
factor_ref: update

profile_property_defaults: {subquery_order_limit_allowed: true, generated_write_allowed: true}

profiles:
  - {id: update_set_finite_generated_default, render: 'total = DEFAULT', validity: valid, properties: {kind: single_default}, fact_refs: [update_fact_generated_column]}
  - {id: update_set_finite_generated_literal, render: 'total = 99', validity: invalid, properties: {kind: single_expression, generated_write_allowed: false}, fact_refs: [update_fact_generated_column]}
  - {id: update_set_finite_generated_null, render: 'total = NULL', validity: invalid, properties: {kind: single_expression, generated_write_allowed: false}, fact_refs: [update_fact_generated_column]}
  - id: update_set_payload_literal
    render: "payload = 42"
    validity: valid
    properties: {kind: single_expression, target_columns: [payload], target_types: [INTEGER]}
    fact_refs: [update_fact_set_grammar, update_fact_expression]
  - id: update_set_payload_increment
    render: "payload = payload + 1"
    validity: valid
    properties: {kind: single_expression, target_columns: [payload], target_types: [INTEGER]}
    fact_refs: [update_fact_set_grammar, update_fact_expression]
  - id: update_set_payload_tuple
    render: "(payload, col_1) = (42, col_1)"
    validity: valid
    properties: {kind: tuple_expressions, target_columns: [payload, col_1], target_types: [INTEGER, INTEGER], column_count: 2, value_count: 2}
    fact_refs: [update_fact_set_grammar, update_fact_expression, update_open_assignment_arity_type_model]
  - id: update_set_partition_int
    # Two-level provider partitions on both columns: preserve key values here.
    # Row movement belongs to a separate behavior scenario, not this syntax case.
    render: "col_2 = col_2"
    validity: valid
    properties: {kind: single_expression, target_columns: [col_2], target_types: [INTEGER]}
    fact_refs: [update_fact_set_grammar, update_fact_column_name, update_fact_expression]
  - {id: update_set_literal, render: "note = 'changed'", validity: valid, properties: {kind: single_expression}, fact_refs: [update_fact_set_grammar, update_fact_expression]}
  - {id: update_set_default, render: "note = DEFAULT", validity: valid, properties: {kind: single_default}, fact_refs: [update_fact_set_grammar, update_fact_default]}
  - {id: update_set_tuple_literals, render: "(note, qty) = ('tuple', 12)", validity: valid, properties: {kind: tuple_expressions, column_count: 2, value_count: 2}, fact_refs: [update_fact_set_grammar, update_open_assignment_arity_type_model]}
  - {id: update_set_multiple, render: "note = 'multi', qty = qty + 1", validity: valid, properties: {kind: multiple_assignments, assignment_count: 2}, fact_refs: [update_fact_set_grammar, update_fact_expression]}
  - {id: update_set_alias_qualified, render: "u.note = 'qualified'", validity: valid, properties: {kind: alias_qualified, target_alias: u}, fact_refs: [update_fact_column_name, update_fact_set_grammar]}
  - id: update_set_scalar_subquery_order_limit
    render: "note = (SELECT label FROM t_update_source ORDER BY src_id LIMIT 1)"
    validity: valid
    fixture_refs: [fixture_update_source]
    properties: {kind: single_column_subquery, column_count: 1, query_output_count: 1, has_order_by: true, has_limit: true}
    fact_refs: [update_fact_assignment_subquery_grammar, update_fact_sub_query, update_fact_single_subquery_order_limit]
  - id: update_set_tuple_subquery
    render: "(note, qty) = (SELECT label, amount FROM t_update_source WHERE src_id = 1)"
    validity: valid
    fixture_refs: [fixture_update_source]
    properties: {kind: multi_column_subquery, column_count: 2, query_output_count: 2, has_order_by: false, has_limit: false}
    fact_refs: [update_fact_set_grammar, update_fact_sub_query, update_open_assignment_arity_type_model]
  - id: update_set_tuple_subquery_order_limit_invalid
    render: "(note, qty) = (SELECT label, amount FROM t_update_source ORDER BY src_id LIMIT 1)"
    validity: invalid
    fixture_refs: [fixture_update_source]
    properties: {kind: multi_column_subquery, column_count: 2, query_output_count: 2, has_order_by: true, has_limit: true, subquery_order_limit_allowed: false}
    fact_refs: [update_fact_multi_subquery_order_limit_restriction, update_open_assignment_arity_type_model]

documented_features:
  - {id: update_feature_set_single_expression, profile_refs: [update_set_literal], status: covered, fact_refs: [update_fact_set_grammar, update_fact_expression]}
  - {id: update_feature_set_default, profile_refs: [update_set_default], status: covered, fact_refs: [update_fact_set_grammar, update_fact_default]}
  - {id: update_feature_set_tuple_expressions, profile_refs: [update_set_tuple_literals, update_set_payload_tuple], status: covered, coverage_mode: representative, fact_refs: [update_fact_set_grammar, update_open_assignment_arity_type_model]}
  - {id: update_feature_set_multiple, profile_refs: [update_set_multiple], status: covered, coverage_mode: representative, fact_refs: [update_fact_set_grammar]}
  - {id: update_feature_set_alias_qualified, profile_refs: [update_set_alias_qualified], status: covered, fact_refs: [update_fact_column_name]}
  - {id: update_feature_set_scalar_subquery, profile_refs: [update_set_scalar_subquery_order_limit], status: covered, coverage_mode: representative, fact_refs: [update_fact_assignment_subquery_grammar, update_fact_single_subquery_order_limit]}
  - {id: update_feature_set_tuple_subquery, profile_refs: [update_set_tuple_subquery], status: covered, coverage_mode: representative, fact_refs: [update_fact_sub_query, update_open_assignment_arity_type_model]}
  - {id: update_feature_set_tuple_subquery_order_limit_restriction, profile_refs: [update_set_tuple_subquery_order_limit_invalid], status: covered, fact_refs: [update_fact_multi_subquery_order_limit_restriction]}
  - {id: update_feature_shared_subplan_guc, status: needs_profile, fact_refs: [update_fact_shared_set_update, update_open_shared_subplan_execution]}
  - {id: update_feature_subquery_star_advice, status: needs_profile, fact_refs: [update_fact_subquery_star_advice, update_open_star_advice_oracle]}
  - {id: update_feature_ora_join_compat, status: needs_profile, fact_refs: [update_fact_ora_join_compat, update_open_ora_join_environment]}

fact_refs:
  - update_fact_set_grammar
  - update_fact_expression
  - update_fact_default
  - update_fact_column_name
  - update_fact_assignment_subquery_grammar
  - update_fact_sub_query
  - update_fact_single_subquery_order_limit
  - update_fact_multi_subquery_order_limit_restriction
  - update_fact_shared_set_update
  - update_fact_subquery_star_advice
  - update_fact_ora_join_compat
  - update_open_shared_subplan_execution
  - update_open_star_advice_oracle
  - update_open_ora_join_environment
