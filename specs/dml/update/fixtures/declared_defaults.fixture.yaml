schema_version: 1
kind: fixture
id: fixture_update_declared_defaults
name: UPDATE 显式默认值目标表
status: ready
description: 为 update_fact_default 的已声明默认值分支提供真实 DDL 和非默认值种子行；不替换无声明默认值基础表。declared 与 7 是有限测试数据。
factor_ref: update
provides:
  tables:
    - name: t_update_declared_defaults
      persistence: permanent
      table_kind: regular
      columns:
        - {name: id, type: INTEGER, nullable: false}
        - {name: note, type: VARCHAR(64), nullable: true}
        - {name: qty, type: INTEGER, nullable: true}
seed:
  required: true
  rows:
    - {id: 2, note: before, qty: 99}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - "BEGIN;"
    - "CREATE TABLE t_update_declared_defaults (id INTEGER NOT NULL, note VARCHAR(64) DEFAULT 'declared', qty INTEGER DEFAULT 7);"
    - "INSERT INTO t_update_declared_defaults (id, note, qty) VALUES (2, 'before', 99);"
  teardown_sqls:
    - "ROLLBACK;"
  note: 仅供独立连接中的单 case 生命周期；无外层事务，setup 失败也须 rollback。对象重名直接失败，不预先删除现有对象。种子行命中 WHERE id = 2；DEFAULT 后的实际行值仍待行为验证。
