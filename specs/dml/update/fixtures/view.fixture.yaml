schema_version: 1
kind: fixture
id: fixture_update_view
name: UPDATE 可更新单表视图
status: ready
description: 从本章单表视图成功示例缩减得到，只支撑可更新视图正向与多表视图目标负向语法。
factor_ref: update
provides:
  tables:
    - name: t_update_view_base
      persistence: permanent
      table_kind: regular
      columns:
        - {name: id, type: INTEGER, nullable: false}
        - {name: note, type: VARCHAR(64), nullable: true}
        - {name: qty, type: INTEGER, nullable: true}
    - name: v_update_target
      persistence: permanent
      table_kind: view
      columns:
        - {name: id, type: INTEGER, nullable: false}
        - {name: note, type: VARCHAR(64), nullable: true}
        - {name: qty, type: INTEGER, nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP VIEW IF EXISTS v_update_target CASCADE;
    - DROP TABLE IF EXISTS t_update_view_base CASCADE;
    - CREATE TABLE t_update_view_base (id INTEGER NOT NULL, note VARCHAR(64), qty INTEGER);
    - INSERT INTO t_update_view_base VALUES (1, 'keep', 10), (2, 'update_me', 20);
    - CREATE VIEW v_update_target AS SELECT id, note, qty FROM t_update_view_base;
  teardown_sqls:
    - DROP VIEW IF EXISTS v_update_target CASCADE;
    - DROP TABLE IF EXISTS t_update_view_base CASCADE;
  note: 显式创建本章已展示可更新的单表视图。
