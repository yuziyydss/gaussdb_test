schema_version: 1
kind: factor
id: update
name: UPDATE
category: DML
status: needs_review
description: 以 GaussDB V2.0-10.0.0 集中式 SQL 参考 1.13.21.1 UPDATE 章节为唯一产品事实；文档引用但未进入 catalog 的能力均保留为显式缺口。

source:
  product: GaussDB
  document: GaussDB V2.0-10.0.0 集中式 SQL参考 1.13.21.1 UPDATE
  version: V2.0-10.0.0
  artifact_sha256: 91336a8f0ba512576379ccc807be7ca0acf94a015ae07e14537f832d7ff61d25
  parent_pdf_sha256: 716ab36bb4410cb823c76cd331d06f06a43ae81ce6b3a267ffe17085b3d3acbe
  extraction_rule_version: gaussdb-pdf-outline-v1
  extraction_date: "2026-09-04"
  catalog_chapter_ref:
    document_id: gaussdb_v2_0_10_0_0_centralized_reference_01
    source_relpath: general/dml/update.txt
    chapter_sha256: 91336a8f0ba512576379ccc807be7ca0acf94a015ae07e14537f832d7ff61d25

source_ledger_ref: source_ledger_update
syntax_ref: syntax_update_v1

dimensions:
  with_clause:
    description: UPDATE 之前的 WITH 前缀；递归只作 max_depth=2 的有限代表展开。
    default_value_id: update_with_none
    classes:
      - id: update_with_absent
        meaning: 不使用 WITH。
        values:
          - {id: update_with_none, render: "", representative: true, validity: valid, properties: {body_kind: none, recursive: false}}
      - id: update_with_query_forms
        meaning: SELECT CTE 与物化修饰的有限形态。
        values:
          - id: update_with_select
            render: "WITH upd_cte AS (SELECT id FROM t_update_target WHERE id = 3) "
            representative: true
            validity: valid
            fixture_refs: [fixture_update_target]
            properties: {body_kind: select, recursive: false, materialization: default}
            fact_refs: [update_fact_with_declaration]
          - id: update_with_recursive_select
            render: "WITH RECURSIVE upd_cte(id) AS (VALUES (1) UNION ALL SELECT id + 1 FROM upd_cte WHERE id < 2) "
            representative: true
            validity: valid
            properties: {body_kind: select, recursive: true, materialization: default, max_depth: 2}
            fact_refs: [update_fact_with_recursive, update_open_recursive_cte_depth]
          - id: update_with_materialized_select
            render: "WITH upd_cte AS MATERIALIZED (SELECT id FROM t_update_target) "
            representative: false
            validity: valid
            fixture_refs: [fixture_update_target]
            properties: {body_kind: select, recursive: false, materialization: materialized}
            fact_refs: [update_fact_with_body_grammar]
          - id: update_with_not_materialized_select
            render: "WITH upd_cte AS NOT MATERIALIZED (SELECT id FROM t_update_target) "
            representative: false
            validity: valid
            fixture_refs: [fixture_update_target]
            properties: {body_kind: select, recursive: false, materialization: not_materialized}
            fact_refs: [update_fact_with_body_grammar]
      - id: update_with_other_bodies
        meaning: 正式产生式枚举的 VALUES 和数据修改 CTE 主体，仅作 syntax_only 生成。
        values:
          - {id: update_with_values, render: "WITH upd_cte(id) AS (VALUES (1), (2)) ", representative: false, validity: valid, properties: {body_kind: values, recursive: false}, fact_refs: [update_fact_with_body_grammar]}
          - id: update_with_insert
            render: "WITH upd_cte AS (INSERT INTO t_update_aux (id, note) VALUES (90, 'cte') RETURNING id) "
            representative: false
            validity: valid
            fixture_refs: [fixture_update_aux]
            properties: {body_kind: insert, recursive: false}
            fact_refs: [update_fact_with_body_grammar]
          - id: update_with_update
            render: "WITH upd_cte AS (UPDATE t_update_aux SET note = 'cte' WHERE id = 9 RETURNING id) "
            representative: false
            validity: valid
            fixture_refs: [fixture_update_aux]
            properties: {body_kind: update, recursive: false}
            fact_refs: [update_fact_with_body_grammar]
          - id: update_with_delete
            render: "WITH upd_cte AS (DELETE FROM t_update_aux WHERE id = 9 RETURNING id) "
            representative: false
            validity: valid
            fixture_refs: [fixture_update_aux]
            properties: {body_kind: delete, recursive: false}
            fact_refs: [update_fact_with_body_grammar]

  plan_hint:
    description: UPDATE 后的 hint 位置已确认，具体 Hint 子语法未在本 catalog 展开。
    default_value_id: update_hint_none
    classes:
      - id: update_hint_values
        meaning: 无 hint 或不可保真执行的占位形态。
        values:
          - {id: update_hint_none, render: "", representative: true, validity: valid}
          - {id: update_hint_unresolved, render: "/*+ plan_hint */ ", representative: false, validity: unknown, fact_refs: [update_fact_plan_hint_position, update_open_plan_hint_profile]}

  update_form:
    description: 单表与多表两个互斥顶层分支。
    default_value_id: update_form_single
    classes:
      - id: update_form_values
        meaning: PDF 的两个 UPDATE 顶层产生式。
        values:
          - {id: update_form_single, render: "", representative: true, validity: valid, fact_refs: [update_fact_single_grammar]}
          - {id: update_form_multi, render: "", representative: true, validity: valid, fact_refs: [update_fact_multi_grammar]}

  single_target_profile:
    description: 单表 UPDATE 的普通表、ONLY/*、别名、视图和子查询目标。
    default_value_id: update_target_table
    profile_source: {matrix_ref: matrix_update_single_targets, profile_id_path: profiles.id}

  set_profile:
    description: SET 的单列、元组、多赋值及赋值子查询有限 profile；V1 不表达任意元组的静态列数与类型契约。
    default_value_id: update_set_literal
    profile_source: {matrix_ref: matrix_update_set_profiles, profile_id_path: profiles.id}

  from_clause:
    description: 可选 FROM、外部来源、自连接别名和专用无别名负向值。
    default_value_id: update_from_none
    classes:
      - id: update_from_values
        meaning: PDF from_list 及目标自连接规则的有限代表。
        values:
          - {id: update_from_none, render: "", representative: true, validity: valid, properties: {target_repeated: false, alias_valid: true}}
          - id: update_from_source
            render: " FROM t_update_source AS s"
            representative: true
            validity: valid
            fixture_refs: [fixture_update_source]
            properties: {target_repeated: false, alias_valid: true, source_tables: [t_update_source], source_columns: [src_id, label, amount]}
            fact_refs: [update_fact_from_list]
          - id: update_from_self_alias
            render: " FROM t_update_target AS src"
            representative: true
            validity: valid
            fixture_refs: [fixture_update_target]
            properties: {target_repeated: true, alias_valid: true, source_tables: [t_update_target], source_columns: [id, note, qty]}
            fact_refs: [update_fact_from_self_alias]
          - id: update_from_self_unaliased_invalid
            render: " FROM t_update_target"
            representative: true
            validity: invalid
            fixture_refs: [fixture_update_target]
            properties: {target_repeated: true, alias_valid: false, source_tables: [t_update_target]}
            fact_refs: [update_fact_from_self_alias]

  predicate:
    description: 省略 WHERE、普通条件、FROM 关联条件、自连接条件或存储过程游标当前行。
    default_value_id: update_predicate_none
    classes:
      - id: update_predicate_values
        meaning: PDF 的行选择形态及有限关联代表。
        values:
          - {id: update_predicate_none, render: "", representative: true, validity: valid, properties: {kind: none}}
          - {id: update_predicate_where, render: " WHERE id = 2", representative: true, validity: valid, properties: {kind: condition}, fact_refs: [update_fact_condition_behavior]}
          - {id: update_predicate_alias, render: " WHERE u.id = 2", representative: false, validity: valid, properties: {kind: condition, target_alias: u}, fact_refs: [update_fact_condition_behavior, update_fact_alias]}
          - {id: update_predicate_source_join, render: " WHERE id = s.src_id", representative: true, validity: valid, properties: {kind: condition, source_alias: s}, fact_refs: [update_fact_from_list, update_fact_condition_behavior]}
          - {id: update_predicate_self_join, render: " WHERE t_update_target.id = src.id", representative: true, validity: valid, properties: {kind: condition, source_alias: src}, fact_refs: [update_fact_from_self_alias, update_fact_condition_behavior]}
          - id: update_predicate_current_of
            render: " WHERE CURRENT OF cur_update"
            representative: true
            validity: conditional
            properties: {kind: current_of, execution_context: stored_procedure, target_kind: regular_table}
            fact_refs: [update_fact_current_of_grammar, update_fact_current_of_constraints]

  order_clause:
    description: 单表 UPDATE 的 ORDER BY 有限代表形式。
    default_value_id: update_order_none
    classes:
      - id: update_order_values
        meaning: 无排序、默认、ASC、DESC 或 USING operator。
        values:
          - {id: update_order_none, render: "", representative: true, validity: valid}
          - {id: update_order_expression, render: " ORDER BY id", representative: true, validity: valid, fact_refs: [update_fact_order_limit]}
          - {id: update_order_asc, render: " ORDER BY id ASC", representative: false, validity: valid, fact_refs: [update_fact_order_limit]}
          - {id: update_order_desc, render: " ORDER BY id DESC", representative: false, validity: valid, fact_refs: [update_fact_order_limit]}
          - {id: update_order_using, render: " ORDER BY id USING <", representative: false, validity: valid, fact_refs: [update_fact_order_limit]}

  limit_clause:
    description: 单表 UPDATE 的可选 LIMIT count。
    default_value_id: update_limit_none
    classes:
      - id: update_limit_values
        meaning: 省略 LIMIT 或限制一行。
        values:
          - {id: update_limit_none, render: "", representative: true, validity: valid}
          - {id: update_limit_one, render: " LIMIT 1", representative: true, validity: valid, fact_refs: [update_fact_order_limit]}

  returning_clause:
    description: 单表 UPDATE 的 RETURNING 投影，包括 FROM 来源字段的专用形态。
    default_value_id: update_returning_none
    classes:
      - id: update_returning_values
        meaning: 无返回、整行、目标表达式或 FROM 字段。
        values:
          - {id: update_returning_none, render: "", representative: true, validity: valid}
          - {id: update_returning_all, render: " RETURNING *", representative: true, validity: valid, fact_refs: [update_fact_returning]}
          - {id: update_returning_expression, render: " RETURNING id, note AS updated_note", representative: true, validity: valid, fact_refs: [update_fact_returning]}
          - {id: update_returning_from_field, render: " RETURNING id, s.label AS source_label", representative: true, validity: valid, properties: {requires_source_alias: s}, fact_refs: [update_fact_returning]}

  multi_target_profile:
    description: 多表 UPDATE 的普通、修饰/子查询与专用视图负向目标列表。
    default_value_id: update_multi_targets_basic
    profile_source: {matrix_ref: matrix_update_multi_targets, profile_id_path: profiles.id}

rules:
  - id: update_rule_multi_target_supported
    kind: requires
    expression: multi_target_profile.properties.multi_supported == True
    severity: error
    fact_refs: [update_fact_multi_target_restrictions]
  - id: update_rule_from_target_alias
    kind: requires
    expression: from_clause.properties.alias_valid == True
    severity: error
    fact_refs: [update_fact_from_self_alias]
  - id: update_rule_multi_subquery_no_order_limit
    kind: requires
    expression: set_profile.properties.subquery_order_limit_allowed == True
    severity: error
    fact_refs: [update_fact_multi_subquery_order_limit_restriction]

structural_checks: []

facts:
  - {id: update_fact_purpose, type: syntax, statement: "UPDATE 修改满足 WHERE 条件的行中 SET 指定字段，未在 SET 出现的字段保持原值。", status: confirmed, source_anchor: "L5-L7 功能描述"}
  - {id: update_fact_permissions, type: environment, statement: "表所有者、拥有 UPDATE 权限或 UPDATE ANY TABLE 权限者可更新；三权分立关闭时系统管理员默认有权。", status: confirmed, source_anchor: "L10-L12 权限"}
  - {id: update_fact_read_permissions, type: environment, statement: "expression 或 condition 涉及的任何表都需要 SELECT 权限。", status: confirmed, source_anchor: "L13 SELECT 权限"}
  - {id: update_fact_generated_column, type: constraint, statement: "生成列不能直接指定值，但 UPDATE 可为生成列指定 DEFAULT。", status: confirmed, source_anchor: "L14-L15 生成列"}
  - {id: update_fact_multi_target_restrictions, type: constraint, statement: "多表 UPDATE 暂不支持视图或含 RULE 的表。", status: confirmed, source_anchor: "L16 多表限制"}
  - {id: update_fact_stream_concurrency, type: constraint, statement: "子查询为 STREAM 计划的 UPDATE 不支持并发更新同一行。", status: confirmed, source_anchor: "L17 STREAM 注意事项"}
  - {id: update_fact_system_encoding, type: constraint, statement: "禁止用户通过 UPDATE 系统表修改数据库字符编码；应按切换数据库和数据迁移流程处理。", status: confirmed, source_anchor: "L18-L20 系统编码"}
  - {id: update_fact_single_grammar, type: syntax, statement: "单表 UPDATE 的 WITH 在语句之前，hint 在 UPDATE 后，随后是目标、SET、FROM、行选择、ORDER BY、LIMIT、RETURNING。", status: confirmed, source_anchor: "L23-L33 单表语法"}
  - {id: update_fact_multi_grammar, type: syntax, statement: "多表 UPDATE 为 WITH、UPDATE、table_list、SET、可选 FROM 与 WHERE，正式产生式未列 ORDER BY、LIMIT、RETURNING。", status: confirmed, source_anchor: "L35-L40 多表语法"}
  - {id: update_fact_set_grammar, type: syntax, statement: "SET 支持单列 expression/DEFAULT、列元组对应表达式元组或 sub_query，并可重复多个赋值项。", status: confirmed, source_anchor: "L27-L28 与 L38-L39 SET 产生式"}
  - {id: update_fact_assignment_subquery_grammar, type: syntax, statement: "赋值 sub_query 产生式包含 SELECT 投影、FROM、WHERE、GROUP BY、HAVING、ORDER BY 与 LIMIT。", status: confirmed, source_anchor: "L42-L53 sub_query 产生式"}
  - {id: update_fact_with_body_grammar, type: syntax, statement: "with_query 可声明列名和 MATERIALIZED/NOT MATERIALIZED，主体可为 SELECT、VALUES、INSERT、UPDATE 或 DELETE。", status: confirmed, source_anchor: "L54-L56 与 L88-L92"}
  - {id: update_fact_target_subquery_grammar, type: syntax, statement: "目标 subquery 列出 WITH、SELECT、hint、投影、INTO、FROM、WHERE、层次查询、ORDER BY、FETCH 等有序子句。", status: confirmed, source_anchor: "L58-L69 subquery 产生式"}
  - {id: update_fact_from_item_grammar, type: syntax, statement: "subquery 的 from_item 可为表/视图、派生 SELECT、CTE 或递归连接项。", status: confirmed, source_anchor: "L71-L75 from_item"}
  - {id: update_fact_partition_grammar, type: syntax, statement: "partition_clause 支持 PARTITION 或 SUBPARTITION，并可按名称或 FOR 值列表定位。", status: confirmed, source_anchor: "L77-L79 与 L145-L150"}
  - {id: update_fact_with_declaration, type: syntax, statement: "WITH 可声明一个或多个可按名称引用的临时结果集并显式命名结果列。", status: confirmed, source_anchor: "L83-L92 WITH"}
  - {id: update_fact_with_recursive, type: syntax, statement: "WITH RECURSIVE 允许 SELECT 子查询按名称引用自身。", status: confirmed, source_anchor: "L83-L91 WITH RECURSIVE"}
  - {id: update_fact_with_materialization, type: behavior_oracle, statement: "MATERIALIZED、NOT MATERIALIZED 与默认规则决定 CTE 复制、内联优化或 CTE Scan 物化。", status: confirmed, source_anchor: "L92-L102 CTE 物化"}
  - {id: update_fact_plan_hint_position, type: syntax, statement: "plan_hint 注释块位于 UPDATE 关键字之后。", status: confirmed, source_anchor: "L103-L106 plan_hint"}
  - {id: update_fact_plan_hint_first_block, type: behavior_oracle, statement: "每条 UPDATE 语句仅首个 plan_hint 注释块作为 Hint 生效，一个块内可写多条 Hint。", status: confirmed, source_anchor: "L105-L107 plan_hint"}
  - {id: update_fact_table_target, type: syntax, statement: "table_name 是可带模式修饰的已存在目标表，并声明支持 DATABASE LINK 远端表。", status: confirmed, source_anchor: "L108-L116 table_name"}
  - {id: update_fact_only_semantics, type: behavior_oracle, statement: "ONLY 仅更新指定表，省略 ONLY 时还更新所有继承表中的匹配行。", status: confirmed, source_anchor: "L108-L111 ONLY"}
  - {id: update_fact_subquery_target, type: behavior_oracle, statement: "子查询目标按临时视图处理并可带 CHECK OPTION；单表直接更新，多表/嵌套按保留键判定。", status: confirmed, source_anchor: "L117-L122 subquery"}
  - {id: update_fact_view_target, type: syntax, statement: "view_name 指定 UPDATE 的目标视图。", status: confirmed, source_anchor: "L123-L124 view_name"}
  - {id: update_fact_view_subquery_restrictions, type: constraint, statement: "视图/子查询只能更新直接基表用户列并至少含一个可更新列，且不支持文档列出的顶层 DISTINCT/分组/分页、集合运算、目标函数及触发器组合。", status: confirmed, source_anchor: "L128-L138 视图/子查询限制"}
  - {id: update_fact_supported_table_types, type: constraint, statement: "视图/子查询支持普通、临时、全局临时、分区、二级分区、Ustore 和 Astore 基表。", status: confirmed, source_anchor: "L139-L140 支持表类型"}
  - {id: update_fact_multi_one_base, type: constraint, statement: "多表连接视图或连接子查询一次只能更新一张基表。", status: confirmed, source_anchor: "L141 多表连接目标"}
  - {id: update_fact_preserved_key_restriction, type: constraint, statement: "连接视图/子查询只能更新保留键表；CHECK OPTION 下不能更新连接列。", status: confirmed, source_anchor: "L142-L143 保留键与连接列"}
  - {id: update_fact_system_view_restriction, type: constraint, statement: "系统视图不支持 UPDATE。", status: confirmed, source_anchor: "L144 系统视图"}
  - {id: update_fact_partition_union, type: behavior_oracle, statement: "PARTITION 指定多个一级或二级分区名时可混合和同名，最终分区范围取并集。", status: confirmed, source_anchor: "L145-L156 partition_clause"}
  - {id: update_fact_alias, type: syntax, statement: "alias 是符合标识符命名规范的目标表别名。", status: confirmed, source_anchor: "L157-L159 alias"}
  - {id: update_fact_table_list, type: syntax, statement: "table_list 类似 from_list，可同时声明目标和关联表，仅用于多表 UPDATE，item 可为 subquery。", status: confirmed, source_anchor: "L160-L162 table_list"}
  - {id: update_fact_column_name, type: syntax, statement: "column_name 是已存在的待修改字段，可使用目标表别名限定。", status: confirmed, source_anchor: "L163-L167 column_name"}
  - {id: update_fact_expression, type: syntax, statement: "expression 是赋给字段的值或表达式。", status: confirmed, source_anchor: "L168-L169 expression"}
  - {id: update_fact_default, type: behavior_oracle, statement: "DEFAULT 使用字段缺省值；无缺省值时赋 NULL。", status: confirmed, source_anchor: "L170-L172 DEFAULT"}
  - {id: update_fact_sub_query, type: syntax, statement: "SET 子查询可使用同一数据库其他表的信息更新目标。", status: confirmed, source_anchor: "L173-L176 sub_query"}
  - {id: update_fact_single_subquery_order_limit, type: syntax, statement: "单列 SET 子查询支持 ORDER BY 与 LIMIT。", status: confirmed, source_anchor: "L177-L178 sub_query"}
  - {id: update_fact_multi_subquery_order_limit_restriction, type: constraint, statement: "多列 SET 子查询不支持 ORDER BY 或 LIMIT。", status: confirmed, source_anchor: "L177-L178 sub_query"}
  - {id: update_fact_shared_set_update, type: environment, statement: "enable_shared_set_update 关闭时多列子查询逐列生成 subplan，开启时多列可共享 subplan。", status: confirmed, source_anchor: "L181-L184 GUC"}
  - {id: update_fact_subquery_star_advice, type: environment, statement: "多列 SET 子查询不建议用 * 代替明确列名，以免更新列不明确。", status: confirmed, source_anchor: "L185-L186 建议"}
  - {id: update_fact_ora_join_compat, type: environment, statement: "SET 子查询 WHERE 使用 + 操作符时需在 behavior_compat_options 启用 enable_ora_joinop_in_updatestmt。", status: confirmed, source_anchor: "L187-L188 兼容项"}
  - {id: update_fact_from_list, type: syntax, statement: "from_list 是类似 SELECT FROM 的表表达式列表，使 WHERE 可使用其他表字段。", status: confirmed, source_anchor: "L189-L191 from_list"}
  - {id: update_fact_from_self_alias, type: constraint, statement: "目标表不能出现在 from_list，除非作为自连接且必须以别名出现。", status: confirmed, source_anchor: "L194-L197 自连接须知"}
  - {id: update_fact_condition_behavior, type: behavior_oracle, statement: "condition 返回 true 的行被更新；数值隐式转 Boolean 可能导致非预期更新。", status: confirmed, source_anchor: "L199-L202 condition"}
  - {id: update_fact_current_of_grammar, type: syntax, statement: "WHERE CURRENT OF cursor_name 更新游标当前指向的行。", status: confirmed, source_anchor: "L203-L205 WHERE CURRENT OF"}
  - {id: update_fact_current_of_constraints, type: constraint, statement: "WHERE CURRENT OF 不支持 B 模式、分区表、多表，只能在存储过程中使用，不能与其他 WHERE、WITH、USING、ORDER BY、FROM 组合；对应 SELECT 游标须为单表 FOR UPDATE 且不带 LIMIT/OFFSET、子查询或子链接。", status: confirmed, source_anchor: "L210-L218 CURRENT OF 限制"}
  - {id: update_fact_current_of_lifecycle, type: lifecycle, statement: "存储过程中 FOR UPDATE 游标在 COMMIT/ROLLBACK 后无法再次使用。", status: confirmed, source_anchor: "L219-L220 游标生命周期"}
  - {id: update_fact_current_of_missing_row, type: behavior_oracle, statement: "游标指向行已不存在时，A 模式下 UPDATE 报指定行不存在，其他兼容模式不报错。", status: confirmed, source_anchor: "L221-L222 缺失行"}
  - {id: update_fact_order_limit, type: syntax, statement: "单表 UPDATE 可在行选择后使用 ORDER BY expression 及可选 ASC/DESC/USING operator，并使用 LIMIT count。", status: confirmed, source_anchor: "L30-L31 与 L224-L227"}
  - {id: update_fact_returning, type: behavior_oracle, statement: "所有目标行更新后计算 RETURNING，可引用目标表及 FROM 表字段，* 返回所有字段并可指定输出名。", status: confirmed, source_anchor: "L32-L33 与 L228-L232"}
  - {id: update_fact_read_only_error, type: behavior_oracle, statement: "本章子查询和视图示例中，WITH READ ONLY 目标以 'DML operation cannot be performed on a read-only view.' 错误拒绝 UPDATE。", status: confirmed, source_anchor: "L353-L355 与 L400-L407"}
  - {id: update_fact_virtual_column_error, type: behavior_oracle, statement: "CHECK OPTION 的连接子查询/视图更新连接列时以 'This operation is not allowed on virtual column.' 错误拒绝。", status: confirmed, source_anchor: "L361-L367 与 L412-L419"}
  - {id: update_example_core, type: example, statement: "文档展示省略 WHERE 更新全部行、按 WHERE 更新部分行以及 RETURNING 更新后值。", status: confirmed, source_anchor: "L234-L283 基础示例"}
  - {id: update_example_with, type: example, statement: "文档展示 UPDATE RETURNING CTE 为外层 INSERT 提供字段。", status: confirmed, source_anchor: "L285-L327 数据修改 CTE 示例"}
  - {id: update_example_subquery, type: example, statement: "文档展示单表、READ ONLY、连接及 CHECK OPTION 子查询更新。", status: confirmed, source_anchor: "L328-L376 子查询示例"}
  - {id: update_example_view, type: example, statement: "文档展示单表、READ ONLY、连接及 CHECK OPTION 视图更新。", status: confirmed, source_anchor: "L378-L432 视图示例"}
  - {id: update_open_assignment_arity_type_model, type: open_question, statement: "Factor Package V1 没有声明 SET 列元组与表达式/子查询投影任意列数和类型相容性的结构契约；当前仅生成有限匹配样例，不能声称覆盖全域。", status: needs_verification, source_anchor: "L27-L28 与 L38-L39 SET 元组产生式"}
  - {id: update_open_generated_fixture, type: open_question, statement: "本章未给生成列表达式的可独立建表示例，当前不伪造生成列 Fixture，直接赋值与 DEFAULT 行为留作场景。", status: needs_verification, source_anchor: "L14-L15 生成列"}
  - {id: update_open_plan_hint_profile, type: open_question, statement: "本 catalog 只给 plan_hint 占位、位置与首块规则，没有可保真生成的具体 Hint 子语法。", status: needs_verification, source_anchor: "L103-L107 plan_hint"}
  - {id: update_open_dblink_profile, type: open_question, statement: "本章仅声明支持 DATABASE LINK，未展开远端目标拼写、连接对象和生命周期。", status: needs_verification, source_anchor: "L113-L116 DATABASE LINK 引用"}
  - {id: update_open_preserved_key_definition, type: open_question, statement: "CREATE VIEW 保留键定义已通过限定引用接入；可更新列、CHECK OPTION 与连接形态的完整组合和行为仍待验证。", status: needs_verification, source_anchor: "L117-L143 CREATE VIEW 引用"}
  - {id: update_open_partition_fixture, type: open_question, statement: "本章列出 partition_clause 但未给可独立回放的一级/二级分区建表契约；SELECT 和 CREATE TABLE SUBPARTITION 未进入本 catalog。", status: needs_verification, source_anchor: "L145-L156 分区引用"}
  - {id: update_open_recursive_cte_depth, type: open_question, statement: "WITH RECURSIVE 的全部递归深度无法用 V1 有限 AST 穷尽；当前只保留 max_depth=2 的代表形态。", status: needs_verification, source_anchor: "L83-L91 WITH RECURSIVE"}
  - {id: update_open_subquery_depth, type: open_question, statement: "subquery/from_item 的嵌套 SELECT 与连接递归无法由 V1 有限 profile 穷尽，当前仅表示单表和一层示例。", status: needs_verification, source_anchor: "L58-L75 subquery/from_item"}
  - {id: update_open_table_type_fixtures, type: open_question, statement: "临时、全局临时、分区、二级分区、Ustore 与 Astore 基表尚无本章内可回放 Fixture，不能由普通表代表全域。", status: needs_verification, source_anchor: "L139-L140 支持表类型"}
  - {id: update_open_rule_table_fixture, type: open_question, statement: "本章确认多表 UPDATE 不支持含 RULE 的表，但未给可移植 RULE 定义和错误身份，当前不能构造目标负向 Fixture。", status: needs_verification, source_anchor: "L16 多表限制"}
  - {id: update_open_shared_subplan_execution, type: open_question, statement: "共享/逐列 subplan 是依赖 GUC 和真实优化器的计划行为，静态 SQL 生成无法闭环。", status: needs_verification, source_anchor: "L181-L184 enable_shared_set_update"}
  - {id: update_open_star_advice_oracle, type: open_question, statement: "文档对多列子查询 targetlist 使用 * 给出不推荐而非必然错误，需数据形状和结果 Oracle 才能验证。", status: needs_verification, source_anchor: "L185-L186 targetlist 建议"}
  - {id: update_open_ora_join_environment, type: open_question, statement: "Oracle 外连接 + 操作符的可执行 profile 依赖 behavior_compat_options 和对应兼容语法环境，不能进入默认正向清单。", status: needs_verification, source_anchor: "L187-L188 兼容项"}

