schema_version: 1
kind: manifest
id: manifest_update_core_positive
name: UPDATE 单表核心组合
status: needs_review
description: 约束感知 Pairwise 覆盖普通表的 ONLY/*、常用 SET、WHERE、ORDER BY、LIMIT 和 RETURNING；未连接数据库。
factor_ref: update
syntax_ref: syntax_update_v1
suite_type: positive
strategy: pairwise
fixture_refs: []
identifier_policy: {}
bindings:
  update_form: [update_form_single]
  single_target_profile: [update_target_table, update_target_only, update_target_star, update_target_only_star]
  set_profile: [update_set_literal, update_set_default, update_set_tuple_literals, update_set_multiple]
  from_clause: [update_from_none]
  predicate: [update_predicate_none, update_predicate_where]
  order_clause: [update_order_none, update_order_expression, update_order_asc, update_order_desc, update_order_using]
  limit_clause: [update_limit_none, update_limit_one]
  returning_clause: [update_returning_none, update_returning_all, update_returning_expression]
expected: {default: success, scope: syntax_and_semantics}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
