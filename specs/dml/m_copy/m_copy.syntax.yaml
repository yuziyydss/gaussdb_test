schema_version: 1
kind: syntax
id: syntax_m_copy
name: syntax_m_copy
status: needs_review
description: M 有限模型；不承诺全章覆盖或实机成功。
factor_ref: m_copy
category: DML
ast:
  kind: sequence
  items:
  - kind: literal
    text: 'COPY '
  - kind: choice
    selector: target
    branches:
      m_copy_target_table:
        kind: sequence
        items:
        - kind: literal
          text: 'm_b01_source '
        - kind: slot
          slot: columns
      m_copy_target_query:
        kind: sequence
        items:
        - kind: literal
          text: '(SELECT '
        - kind: repeat
          slot: projection
          separator: ', '
          items_property: items
        - kind: literal
          text: ' FROM m_b01_source ORDER BY id)'
  - kind: literal
    text: ' TO STDOUT '
  - kind: choice
    selector: style
    branches:
      m_copy_style_legacy:
        kind: slot
        slot: legacy
      m_copy_style_options:
        kind: sequence
        items:
        - kind: slot
          slot: with_keyword
        - kind: literal
          text: ' ('
        - kind: slot
          slot: options
        - kind: literal
          text: )
subgrammars: {}
rendering:
  whitespace: collapse
  statement_terminator: ;
slots:
  target:
    type: sql_fragment
    optional: true
    dimension_ref: m_copy.target
  style:
    type: sql_fragment
    optional: true
    dimension_ref: m_copy.style
  columns:
    type: sql_fragment
    optional: true
    dimension_ref: m_copy.columns
  projection:
    type: sql_fragment
    optional: true
    dimension_ref: m_copy.projection
  legacy:
    type: sql_fragment
    optional: true
    dimension_ref: m_copy.legacy
  with_keyword:
    type: sql_fragment
    optional: true
    dimension_ref: m_copy.with_keyword
  options:
    type: sql_fragment
    optional: true
    dimension_ref: m_copy.options
source_fact_refs:
- m_copy_fact_syntax
- m_copy_fact_query
- m_copy_fact_formats
