facts:
- id: m_copy_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.8.5 L2-2
- id: m_copy_fact_syntax
  type: syntax
  statement: COPY表/列或括号查询结果到STDOUT；本批只导出真实INTEGER源表。
  status: confirmed
  source_anchor: 2.4.2.8.5 L72-80
- id: m_copy_fact_query
  type: syntax
  statement: COPY query必须用圆括号包围SELECT或VALUES。
  status: confirmed
  source_anchor: 2.4.2.8.5 L124-124
- id: m_copy_fact_styles
  type: constraint
  statement: 括号option与原生copy_option语法不兼容，不能拼到同一目标中。
  status: confirmed
  source_anchor: 2.4.2.8.5 L71-71
- id: m_copy_fact_formats
  type: syntax
  statement: FORMAT支持CSV、TEXT、BINARY，缺省TEXT；当前不生成二进制流。
  status: confirmed
  source_anchor: 2.4.2.8.5 L211-211
- id: m_copy_fact_header
  type: constraint
  statement: HEADER只能用于CSV；导出开启时需要fileheader，当前仅明确关闭的候选。
  status: confirmed
  source_anchor: 2.4.2.8.5 L254-258
- id: m_copy_fact_authority
  type: environment
  statement: COPY TO需要源表SELECT权限；本批为源表创建者。
  status: confirmed
  source_anchor: 2.4.2.8.5 L22-23
- id: m_copy_fact_stream
  type: environment
  statement: STDOUT打印标准输出，不需要服务端导出文件；未来运行器需COPY流协议支持。
  status: confirmed
  source_anchor: 2.4.2.8.5 L141-141
- id: m_copy_fact_files
  type: environment
  statement: 文件路径需服务端可访问且受safe_data_path与enable_copy_server_files限制；当前不生成文件路径。
  status: confirmed
  source_anchor: 2.4.2.8.5 L17-20
- id: m_copy_fact_generated
  type: constraint
  statement: COPY列列表不能含生成列，未指定列表导出时也跳过生成列。
  status: confirmed
  source_anchor: 2.4.2.8.5 L43-45
- id: m_copy_fact_null_conflict
  type: open_question
  statement: 注意事项将\N称为空字符串、option默认TEXT空值写\n，而原生参数写\N；当前无NULL输入，保留原文冲突。
  status: needs_verification
  source_anchor: 2.4.2.8.5 L34-34
