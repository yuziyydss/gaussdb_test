schema_version: 1
kind: syntax
id: syntax_merge_into_v1
name: MERGE INTO 有限结构语法
category: DML
status: needs_review
factor_ref: merge_into
description: 目标、源和 action 使用内部一致 profile；当前不声称展开 SELECT 子查询或任意深度表达式语法。
production: "MERGE {plan_hint}INTO {target_profile} USING {source_profile} ON ({on_condition}) {action_profile}"
rendering: {whitespace: collapse, statement_terminator: ";"}
slots:
  plan_hint: {type: sql_fragment, optional: true, dimension_ref: merge_into.plan_hint}
  target_profile: {type: target_profile, optional: false, dimension_ref: merge_into.target_profile, symbol_action: writes_relation}
  source_profile: {type: source_profile, optional: false, dimension_ref: merge_into.source_profile, symbol_action: reads_relations}
  on_condition: {type: expression, optional: false, dimension_ref: merge_into.on_condition}
  action_profile: {type: sql_fragment, optional: false, dimension_ref: merge_into.action_profile}
source_fact_refs:
  - select::select_fact_subquery
  - merge_fact_main_grammar
  - merge_fact_hint_syntax
  - merge_fact_target_form
  - merge_fact_source_forms
  - merge_fact_on_condition
  - merge_fact_matched_grammar
  - merge_fact_not_matched_grammar
  - merge_fact_where_grammar
