schema_version: 1
kind: manifest
id: manifest_merge_constant_defaults
name: MERGE真实列默认及省略列有限代表
status: needs_review
description: 三种独立代表复用同一双表DDL与seed；不是任意表达式/分区/WHERE全覆盖，行结果由独立planned场景待实机验证。
factor_ref: merge_into
syntax_ref: syntax_merge_into_v1
suite_type: positive
strategy: equivalence
fixture_refs: []
identifier_policy: {}
bindings:
  plan_hint: [merge_hint_none]
  target_profile: [merge_target_constant_defaults]
  source_profile: [merge_source_constant_defaults]
  on_condition: [merge_on_id_equal]
  action_profile: [merge_action_scalar_defaults, merge_action_tuple_omitted_defaults, merge_action_default_values]
environment_requirements:
  - {key: table_create_authority, allowed_values: [create_any_table], fact_refs: ['create_table::ct_fact_create_permissions']}
  - {key: merge_authority, allowed_values: [target_update_insert_and_source_select], fact_refs: [merge_fact_permissions]}
  - {key: fixture_cleanup_authority, allowed_values: [case_table_owner], fact_refs: ['drop_table::dt_fact_permissions']}
expected: {default: success, scope: syntax_only}
coverage_requirements: {strength: 2, require_all_feasible_pairs: true}
