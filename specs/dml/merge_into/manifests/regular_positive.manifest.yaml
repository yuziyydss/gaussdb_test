  target_profile: [merge_target_regular_as, merge_target_regular_bare_alias]
  source_profile: [merge_source_table_as, merge_source_table_bare_alias, merge_source_view, merge_source_subquery]
  on_condition: [merge_on_id_equal, merge_on_id_equal_positive]
  action_profile:
    - merge_action_both_update_then_insert
    - merge_action_both_insert_then_update
    - merge_action_matched_only
    - merge_action_not_matched_only
    - merge_action_tuple_update
    - merge_action_with_where
    - merge_action_default_values
