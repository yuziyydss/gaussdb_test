schema_version: 1
kind: fixture
id: fixture_merge_partition_target
name: MERGE 一级分区目标表
status: ready
description: 为 PARTITION 名称和 FOR 值两种本章明确形式提供 p_low 分区。
factor_ref: merge_into
provides:
  tables:
    - name: t_merge_partitioned
      persistence: permanent
      table_kind: partitioned
      columns:
        - {name: id, type: INTEGER, nullable: false}
        - {name: name, type: "VARCHAR(64)", nullable: true}
        - {name: category, type: "VARCHAR(64)", nullable: true}
seed: {required: false, rows: []}
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP TABLE IF EXISTS t_merge_partitioned CASCADE;
    - CREATE TABLE t_merge_partitioned (id INTEGER NOT NULL, name VARCHAR(64), category VARCHAR(64)) PARTITION BY RANGE (id) (PARTITION p_low VALUES LESS THAN (100), PARTITION p_max VALUES LESS THAN (MAXVALUE));
    - INSERT INTO t_merge_partitioned (id, name, category) VALUES (1, 'old-one', 'old');
  teardown_sqls:
    - DROP TABLE IF EXISTS t_merge_partitioned CASCADE;
  note: 仅建立一级 RANGE 分区；二级分区保持 needs_profile。
