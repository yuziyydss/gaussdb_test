schema_version: 1
kind: matrix
id: matrix_merge_target_profiles
name: MERGE 目标表能力
status: needs_review
description: 为普通表和一级分区建立带稳定 dst 别名的目标 profile；无别名与二级分区保持显式缺口。
factor_ref: merge_into
profile_property_defaults: {target_kind: regular, partition_form: none}
profiles:
  - id: merge_target_on_filter
    render: g_merge_on_target AS dst
    validity: valid
    fixture_refs: [fixture_merge_on_filter]
    properties: {target_kind: regular, partition_form: none, alias_form: as, source_tables: [g_merge_on_target], source_columns: [id, name, category]}
    fact_refs: [merge_fact_target_form, merge_fact_alias_syntax]
  - id: merge_target_constant_defaults
    render: g_merge_default_target AS dst
    validity: valid
    fixture_refs: [fixture_merge_constant_defaults]
    properties: {target_kind: regular, partition_form: none, alias_form: as, source_tables: [g_merge_default_target], source_columns: [id, name, category]}
    fact_refs: [merge_fact_target_form, merge_fact_alias_syntax]
  - id: merge_target_regular_as
    render: t_merge_target AS dst
    validity: valid
    fixture_refs: [fixture_merge_target]
    properties: {target_kind: regular, partition_form: none, alias_form: as, source_tables: [t_merge_target], source_columns: [id, name, category]}
    fact_refs: [merge_fact_target_form, merge_fact_alias_syntax]
  - id: merge_target_regular_bare_alias
    render: t_merge_target dst
    validity: valid
    fixture_refs: [fixture_merge_target]
    properties: {target_kind: regular, partition_form: none, alias_form: bare, source_tables: [t_merge_target], source_columns: [id, name, category]}
    fact_refs: [merge_fact_target_form, merge_fact_alias_syntax]
  - id: merge_target_partition_name
    render: t_merge_partitioned PARTITION (p_low) AS dst
    validity: valid
    fixture_refs: [fixture_merge_partition_target]
    properties: {target_kind: partitioned, partition_form: name, alias_form: as, source_tables: [t_merge_partitioned], source_columns: [id, name, category]}
    fact_refs: [merge_fact_partition_grammar, merge_fact_partition_key_resolution]
  - id: merge_target_partition_for
    render: t_merge_partitioned PARTITION FOR (1) AS dst
    validity: valid
    fixture_refs: [fixture_merge_partition_target]
    properties: {target_kind: partitioned, partition_form: for_value, alias_form: as, source_tables: [t_merge_partitioned], source_columns: [id, name, category]}
    fact_refs: [merge_fact_partition_grammar, merge_fact_partition_key_resolution]
documented_features:
  - {id: merge_feature_regular_target, profile_refs: [merge_target_regular_as, merge_target_regular_bare_alias], status: covered, fact_refs: [merge_fact_target_form]}
  - {id: merge_feature_target_as_alias, profile_refs: [merge_target_regular_as], status: covered, fact_refs: [merge_fact_alias_syntax]}
  - {id: merge_feature_target_bare_alias, profile_refs: [merge_target_regular_bare_alias], status: covered, fact_refs: [merge_fact_alias_syntax]}
  - {id: merge_feature_target_without_alias, status: needs_profile, fact_refs: [merge_fact_alias_syntax, merge_open_target_without_alias_profile]}
  - {id: merge_feature_partition_name, profile_refs: [merge_target_partition_name], status: covered, fact_refs: [merge_fact_partition_grammar]}
  - {id: merge_feature_partition_for, profile_refs: [merge_target_partition_for], status: covered, fact_refs: [merge_fact_partition_grammar, merge_fact_partition_key_resolution]}
  - {id: merge_feature_subpartition_name, status: needs_profile, fact_refs: [merge_fact_partition_grammar, merge_open_subpartition_fixture]}
  - {id: merge_feature_subpartition_for, status: needs_profile, fact_refs: [merge_fact_partition_grammar, merge_open_subpartition_fixture]}
fact_refs: [merge_fact_target_form, merge_fact_alias_syntax, merge_fact_partition_grammar, merge_fact_partition_key_resolution, merge_open_subpartition_fixture, merge_open_target_without_alias_profile]
