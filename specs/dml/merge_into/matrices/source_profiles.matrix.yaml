schema_version: 1
kind: matrix
id: matrix_merge_source_profiles
name: MERGE USING 源能力
status: needs_review
description: 使用一致的 src 别名表达本章明确的表、视图和有限子查询来源。
factor_ref: merge_into
profile_property_defaults: {source_kind: table}
profiles:
  - id: merge_source_on_filter
    render: g_merge_on_source AS src
    validity: valid
    fixture_refs: [fixture_merge_on_filter]
    properties: {source_kind: table, alias_form: as, source_tables: [g_merge_on_source], source_columns: [id, name, category]}
    fact_refs: [merge_fact_source_forms, merge_fact_alias_syntax]
  - id: merge_source_constant_defaults
    render: g_merge_default_source AS src
    validity: valid
    fixture_refs: [fixture_merge_constant_defaults]
    properties: {source_kind: table, alias_form: as, source_tables: [g_merge_default_source], source_columns: [id, name, category]}
    fact_refs: [merge_fact_source_forms, merge_fact_alias_syntax]
  - id: merge_source_table_as
    render: t_merge_source AS src
    validity: valid
    fixture_refs: [fixture_merge_source]
    properties: {source_kind: table, alias_form: as, source_tables: [t_merge_source], source_columns: [id, name, category]}
    fact_refs: [merge_fact_source_forms, merge_fact_alias_syntax]
  - id: merge_source_table_bare_alias
    render: t_merge_source src
    validity: valid
    fixture_refs: [fixture_merge_source]
    properties: {source_kind: table, alias_form: bare, source_tables: [t_merge_source], source_columns: [id, name, category]}
    fact_refs: [merge_fact_source_forms, merge_fact_alias_syntax]
  - id: merge_source_view
    render: v_merge_source AS src
    validity: valid
    fixture_refs: [fixture_merge_view_source]
    properties: {source_kind: view, alias_form: as, source_tables: [v_merge_source], source_columns: [id, name, category]}
    fact_refs: [merge_fact_source_forms]
  - id: merge_source_subquery
    render: (SELECT id, name, category FROM t_merge_source) AS src
    validity: valid
    fixture_refs: [fixture_merge_source]
    properties: {source_kind: subquery, alias_form: as, source_tables: [t_merge_source], source_columns: [id, name, category]}
    fact_refs: [merge_fact_source_forms]
documented_features:
  - {id: merge_feature_source_table, profile_refs: [merge_source_table_as, merge_source_table_bare_alias], status: covered, fact_refs: [merge_fact_source_forms]}
  - {id: merge_feature_source_view, profile_refs: [merge_source_view], status: covered, coverage_mode: representative, fact_refs: [merge_fact_source_forms]}
  - {id: merge_feature_source_subquery, profile_refs: [merge_source_subquery], status: covered, coverage_mode: representative, fact_refs: [merge_fact_source_forms]}
  - {id: merge_feature_source_as_alias, profile_refs: [merge_source_table_as], status: covered, fact_refs: [merge_fact_alias_syntax]}
  - {id: merge_feature_source_bare_alias, profile_refs: [merge_source_table_bare_alias], status: covered, fact_refs: [merge_fact_alias_syntax]}
  - {id: merge_feature_source_without_alias, status: needs_profile, fact_refs: [merge_fact_alias_syntax, merge_open_source_without_alias_profile]}
  - {id: merge_feature_recursive_subquery_domain, status: needs_profile, fact_refs: [merge_fact_source_forms, merge_open_recursive_subquery_profile]}
fact_refs: [merge_fact_source_forms, merge_fact_alias_syntax, merge_open_source_without_alias_profile, merge_open_recursive_subquery_profile]
