schema_version: 1
kind: scenario
id: scenario_merge_triggers
name: MERGE 触发器支持范围
status: planned
description: 分离行级触发器成功与语句级触发器不支持两种行为，并校准目标错误身份。
factor_ref: merge_into
fixture_refs: [fixture_merge_target, fixture_merge_source]
fact_refs: [merge_fact_row_trigger_only]
preconditions: [创建审计表以及等价的 ROW/STATEMENT 触发器函数]
variants:
  - {id: row_trigger, operations: [创建行级触发器, 执行 MERGE, 查询审计表], expected: 行级触发器按受影响行触发。}
  - {id: statement_trigger, operations: [创建语句级触发器或执行 MERGE], expected: 在文档所述不支持边界命中目标错误。}
oracles:
  - {kind: query_result, expected: 行级审计记录与受影响行一致。}
  - {kind: target_error, expected: 语句级触发器路径只接受校准后的目标错误。}
execution_requirements: [database, trigger_ddl, target_error_calibration]
