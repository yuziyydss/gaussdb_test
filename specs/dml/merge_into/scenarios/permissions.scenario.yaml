schema_version: 1
kind: scenario
id: scenario_merge_permissions
name: MERGE 权限矩阵
status: planned
description: 分别撤销目标 UPDATE、目标 INSERT 和源 SELECT，验证每项权限均为必要前置条件。
factor_ref: merge_into
fixture_refs: [fixture_merge_target, fixture_merge_source]
fact_refs: [merge_fact_permissions]
preconditions: [创建隔离测试角色并按变体授予权限]
variants:
  - {id: all_permissions, operations: [授予三项权限, 执行 MERGE], expected: MERGE 成功。}
  - {id: missing_target_update, operations: [撤销目标 UPDATE, 执行 MERGE], expected: 命中目标权限错误。}
  - {id: missing_target_insert, operations: [撤销目标 INSERT, 执行 MERGE], expected: 命中目标权限错误。}
  - {id: missing_source_select, operations: [撤销源 SELECT, 执行 MERGE], expected: 命中目标权限错误。}
oracles:
  - {kind: permission_result, expected: 只有同时具备三项文档权限的角色可以完成 MERGE。}
execution_requirements: [database, role_management, target_error_calibration]
