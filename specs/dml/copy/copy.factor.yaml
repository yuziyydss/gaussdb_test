rules: []
structural_checks: []
facts:
  -
    id: "copy_fact_body_5"
    type: "constraint"
    statement: "通过COPY命令实现在表和文件之间复制数据。"
    status: "confirmed"
    source_anchor: "L5-L7"
  -
    id: "copy_fact_body_5_1"
    type: "constraint"
    statement: "COPY FROM从一个文件复制数据到一个表，COPY TO把一个表的数据复制到一个文 件。"
    status: "confirmed"
    source_anchor: "L5-L7"
  -
    id: "copy_fact_body_10"
    type: "environment"
    statement: "●   当参数enable_copy_server_files关闭时，只允许初始用户执行COPY FROM FILENAME或COPY TO FILENAME命令，当参数enable_copy_server_files打开 时，允许具有SYSADMIN权限的用户或继承了内置角色gs_role_copy_files权限的 用户执行，但默认禁止对数据库配置文件、密钥文件、证书文件、环境变量分离 文件和审计日志执行COPY FROM FILENAME或COPY TO FILENAME，以防止用 户越权查看或修改敏感文件。"
    status: "confirmed"
    source_anchor: "L10-L15"
  -
    id: "copy_fact_body_16"
    type: "environment"
    statement: "●   数据库管理员可以通过GUC参数safe_data_path设置所有用户可以进行导入导出 的路径的白名单，白名单默认生效；"
    status: "confirmed"
    source_anchor: "L16-L20"
  -
    id: "copy_fact_body_16_1"
    type: "environment"
    statement: "将此参数设置为空时，不对使用的路径进行 拦截，即白名单失效，请谨慎进行设置。"
    status: "confirmed"
    source_anchor: "L16-L20"
  -
    id: "copy_fact_body_16_2"
    type: "environment"
    statement: "该参数会对COPY使用路径中的相对路径 进行报错处理。"
    status: "confirmed"
    source_anchor: "L16-L20"
  -
    id: "copy_fact_body_16_3"
    type: "environment"
    statement: "在多租场景下，仅有初始用户可在PDB内部执行COPY FROM FILENAME或COPY TO FILENAME命令。"
    status: "confirmed"
    source_anchor: "L16-L20"
  -
    id: "copy_fact_body_21"
    type: "constraint"
    statement: "●   COPY只能用于表，不能用于视图。"
    status: "confirmed"
    source_anchor: "L21-L21"
  -
    id: "copy_fact_body_22"
    type: "environment"
    statement: "●   COPY TO需要读取的表的SELECT权限，COPY FROM需要插入的表的INSERT权 限。"
    status: "confirmed"
    source_anchor: "L22-L23"
  -
    id: "copy_fact_body_24"
    type: "behavior_oracle"
    statement: "●   如果声明了一个字段列表，COPY将只在文件和表之间复制已声明字段的数据。"
    status: "confirmed"
    source_anchor: "L24-L25"
  -
    id: "copy_fact_body_24_1"
    type: "behavior_oracle"
    statement: "如 果表中有任何不在字段列表里的字段，COPY FROM将为那些字段插入缺省值。"
    status: "confirmed"
    source_anchor: "L24-L25"
  -
    id: "copy_fact_body_26"
    type: "constraint"
    statement: "●   如果声明了数据源文件，服务器必须可以访问该文件；"
    status: "confirmed"
    source_anchor: "L26-L28"
  -
    id: "copy_fact_body_26_1"
    type: "constraint"
    statement: "如果指定了STDIN，数据 将在客户前端和服务器之间流动，输入时，表的列与列之间使用TAB键分隔，在新 的一行中以反斜杠和句点（\\.）表示输入结束。"
    status: "confirmed"
    source_anchor: "L26-L28"
  -
    id: "copy_fact_body_29"
    type: "constraint"
    statement: "●   如果数据文件的任意行包含比预期多或者少的字段，COPY FROM将抛出一个错 误。"
    status: "confirmed"
    source_anchor: "L29-L30"
  -
    id: "copy_fact_body_31"
    type: "constraint"
    statement: "●   数据的结束可以用一个只包含反斜杠和句点（\\.）的行表示。"
    status: "confirmed"
    source_anchor: "L31-L33"
  -
    id: "copy_fact_body_31_1"
    type: "constraint"
    statement: "如果从文件中读取数 据，数据结束的标记是不必要的；"
    status: "confirmed"
    source_anchor: "L31-L33"
  -
    id: "copy_fact_body_31_2"
    type: "constraint"
    statement: "如果在客户端应用之间复制数据，必须要有结 束标记。"
    status: "confirmed"
    source_anchor: "L31-L33"
  -
    id: "copy_fact_body_35"
    type: "constraint"
    statement: "●   COPY FROM中\\N为空字符串，如果要输入实际数据值\\N，使用\\\\N。"
    status: "confirmed"
    source_anchor: "L35-L35"
  -
    id: "copy_fact_body_37"
    type: "behavior_oracle"
    statement: "●   COPY FROM支持通过列表达式对数据做预处理，但是列表达式中不支持子查询这 类能力。"
    status: "confirmed"
    source_anchor: "L37-L38"
  -
    id: "copy_fact_body_39"
    type: "constraint"
    statement: "●   COPY FROM在遇到数据格式错误时会回滚事务，但没有足够的错误信息，不方便 用户从大量的原始数据中定位错误数据。"
    status: "confirmed"
    source_anchor: "L39-L40"
  -
    id: "copy_fact_body_41"
    type: "constraint"
    statement: "●   COPY FROM/TO适合低并发，本地小数据量导入导出。"
    status: "confirmed"
    source_anchor: "L41-L41"
  -
    id: "copy_fact_body_42"
    type: "constraint"
    statement: "●   目标表存在trigger，支持COPY操作。"
    status: "confirmed"
    source_anchor: "L42-L42"
  -
    id: "copy_fact_body_43"
    type: "behavior_oracle"
    statement: "●   COPY命令中，生成列不能出现在指定列的列表中。"
    status: "confirmed"
    source_anchor: "L43-L45"
  -
    id: "copy_fact_body_43_1"
    type: "behavior_oracle"
    statement: "使用COPY… TO导出数据时， 如果没有指定列的列表，则该表的所有列除了生成列都会被导出。"
    status: "confirmed"
    source_anchor: "L43-L45"
  -
    id: "copy_fact_body_43_2"
    type: "behavior_oracle"
    statement: "COPY… FROM 导入数据时，生成列会自动更新，并像普通列一样保存。"
    status: "confirmed"
    source_anchor: "L43-L45"
  -
    id: "copy_fact_body_46"
    type: "constraint"
    statement: "●   COPY是服务端命令，执行环境和数据库服务端进程保持一致；"
    status: "confirmed"
    source_anchor: "L46-L50"
  -
    id: "copy_fact_body_46_1"
    type: "constraint"
    statement: "\\COPY是客户端元 命令，执行环境和客户端gsql保持一致。"
    status: "confirmed"
    source_anchor: "L46-L50"
  -
    id: "copy_fact_body_46_2"
    type: "constraint"
    statement: "需要注意的是，当在云上环境中使用数 据库和gsql时，COPY命令和\\COPY命令都使用云上环境的路径；"
    status: "confirmed"
    source_anchor: "L46-L50"
  -
    id: "copy_fact_body_46_3"
    type: "constraint"
    statement: "当在云上环境中 使用数据库，在非云上环境使用gsql时，COPY命令使用云上环境内的路径， \\COPY命令则使用其他环境的路径。"
    status: "confirmed"
    source_anchor: "L46-L50"
  -
    id: "copy_fact_body_51"
    type: "environment"
    statement: "●   在COPY TO导出的过程中，如果不打开GUC参数support_zero_character，表内字 段数据存在'\\0'字符，则字段数据在导出时会发生截断，字段中只有'\\0'之前的数 据会被导出。"
    status: "confirmed"
    source_anchor: "L51-L53"
  -
    id: "copy_fact_body_51_1"
    type: "environment"
    statement: "打开参数后'\\0'字符也会被导出，性能损耗与'\\0'字符数量正相关。"
    status: "confirmed"
    source_anchor: "L51-L53"
  -
    id: "copy_fact_body_54"
    type: "behavior_oracle"
    statement: "●   gs_copy_summary和pgxc_copy_error_log两张表的模式从public变更为 pg_catalog，原public模式下的两张表功能失效。"
    status: "confirmed"
    source_anchor: "L54-L61"
  -
    id: "copy_fact_body_54_1"
    type: "behavior_oracle"
    statement: "由于public下的表可能与用户表 同名，因此需要用户进行识别，确认不是用户表后，将数据迁移到pg_catalog模 式下相应的表里之后，删除原public模式下对应的表。"
    status: "confirmed"
    source_anchor: "L54-L61"
  -
    id: "copy_fact_body_54_2"
    type: "behavior_oracle"
    statement: "不删除原public模式下的表 时，由于pg_catalog模式下存在同名表，gsql元命令\\d(+)优先找到pg_catalog模 式下的表，而因为是系统表的缘故不显示，因此列表中找不到gs_copy_summary 和pgxc_copy_error_log，但是实际上public模式下这两张表是存在的。"
    status: "confirmed"
    source_anchor: "L54-L61"
  -
    id: "copy_fact_body_54_3"
    type: "behavior_oracle"
    statement: "可以直接 通过public.gs_copy_summary和public.pgxc_copy_error_log引用。"
    status: "confirmed"
    source_anchor: "L54-L61"
  -
    id: "copy_fact_body_62"
    type: "constraint"
    statement: "●   在导出float4/float8类型的数据时，推荐将extra_float_digits设为3，避免有效位 数丢失造成导入导出前后数据不一致。"
    status: "confirmed"
    source_anchor: "L62-L64"
  -
    id: "copy_fact_body_62_1"
    type: "constraint"
    statement: "extra_float_digits参数说明请参见 extra_float_digits。"
    status: "confirmed"
    source_anchor: "L62-L64"
  -
    id: "copy_fact_body_65"
    type: "environment"
    statement: "●   部分场景可以通过设置GUC参数batch_insert_index_types=\"rcr_ubtree\"提升批量 插入索引性能，具体介绍请参见INSERT章节中的批量插入索引性能优化。"
    status: "confirmed"
    source_anchor: "L65-L66"
  -
    id: "copy_fact_body_67"
    type: "constraint"
    statement: "●   出于安全考虑，禁止向pg_authid、pg_auth_history、gs_global_config和 gs_workload_rule系统表中通过COPY FROM导入数据。"
    status: "confirmed"
    source_anchor: "L67-L68"
  -
    id: "copy_fact_body_69"
    type: "constraint"
    statement: "●   当参数enable_security_policy被打开时，若已设置了脱敏策略，那么系统将会对 数据执行脱敏操作。"
    status: "confirmed"
    source_anchor: "L69-L70"
  -
    id: "copy_fact_body_71"
    type: "constraint"
    statement: "●   在进行数据导入和导出时，需要注意数据中是否存在转义符的情况。"
    status: "confirmed"
    source_anchor: "L71-L74"
  -
    id: "copy_fact_body_71_1"
    type: "constraint"
    statement: "如果数据文 件由用户自行准备，用户需要评估导入的方式（希望进行转义导入还是原样导 入）。"
    status: "confirmed"
    source_anchor: "L71-L74"
  -
    id: "copy_fact_body_71_2"
    type: "constraint"
    statement: "如果数据文件是通过COPY命令导出的，导入时的转义选项应与导出时保持 一致。"
    status: "confirmed"
    source_anchor: "L71-L74"
  -
    id: "copy_fact_body_75"
    type: "constraint"
    statement: "●   使用COPY命令导入或导出数据时，非转码场景下单行数据元组大小不得超过 1GB-1B，转码场景下不得超过256MB-1B。"
    status: "confirmed"
    source_anchor: "L75-L76"
  -
    id: "copy_fact_body_77"
    type: "constraint"
    statement: "●   COPY命令在导入数据过程中涉及错误表和日志表的使用，相关注意事项和使用方 法详见对应章节。"
    status: "confirmed"
    source_anchor: "L77-L80"
  -
    id: "copy_fact_body_77_1"
    type: "constraint"
    statement: "系统视图包括pg_catalog.pgxc_copy_error_log和 pg_catalog.gs_copy_summary；"
    status: "confirmed"
    source_anchor: "L77-L80"
  -
    id: "copy_fact_body_77_2"
    type: "constraint"
    statement: "系统表包括pg_catalog.gs_copy_error_log和 pg_catalog.gs_copy_summary_log。"
    status: "confirmed"
    source_anchor: "L77-L80"
  -
    id: "copy_fact_body_81"
    type: "behavior_oracle"
    statement: "●   使用\\copy命令时，通过detail_info信息作为查询条件查询审计信息时要忽略大小 写，SQL语句会被转换，审计中展示的是COPY关键字。"
    status: "confirmed"
    source_anchor: "L81-L82"
  -
    id: "copy_fact_body_84"
    type: "behavior_oracle"
    statement: "●   不支持在COPY命令的列表达式中使用返回集合的函数（Set-Returning Functions）。"
    status: "confirmed"
    source_anchor: "L84-L85"
  -
    id: "copy_fact_body_88"
    type: "constraint"
    statement: "●   从一个文件复制数据到一个表。"
    status: "confirmed"
    source_anchor: "L88-L101"
  -
    id: "copy_fact_body_88_1"
    type: "constraint"
    statement: "COPY [BINARY] table_name [ ( column_name [, ...] ) ] [ WITH OIDS ] FROM { 'filename' | STDIN } [ LOAD ] [ LOAD_DISCARD 'discard_file_name' ] [ LOAD_BAD 'bad_file_name' ] [ USEEOF ] [ [ USING ] DELIMITERS 'delimiters' ] [ WITHOUT ESCAPING ] [ LOG ERRORS | LOG ERRORS DATA ] [ REJECT LIMIT 'limit' ] [ WITH ] [ copy_option [ ...] | ( option [, ...] ) ];"
    status: "confirmed"
    source_anchor: "L88-L101"
  -
    id: "copy_fact_body_103"
    type: "constraint"
    statement: "●   把一个表的数据复制到一个文件。"
    status: "confirmed"
    source_anchor: "L103-L110"
  -
    id: "copy_fact_body_103_1"
    type: "constraint"
    statement: "COPY table_name [ ( column_name [, ...] ) ] [ WITH OIDS ] TO { 'filename' | STDOUT } [ [ USING ] DELIMITERS 'delimiters' ] [ WITHOUT ESCAPING ] [ WITH ] [ copy_option [ ...] | ( option [, ...] ) ];"
    status: "confirmed"
    source_anchor: "L103-L110"
  -
    id: "copy_fact_grammar_line_112"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：COPY query {(SELECT) | (VALUES)}"
    status: "confirmed"
    source_anchor: "L112-L112"
  -
    id: "copy_fact_grammar_line_113"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：TO { 'filename' | STDOUT }"
    status: "confirmed"
    source_anchor: "L113-L113"
  -
    id: "copy_fact_grammar_line_114"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：[ WITHOUT ESCAPING ]"
    status: "confirmed"
    source_anchor: "L114-L114"
  -
    id: "copy_fact_grammar_line_115"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：[ WITH ]"
    status: "confirmed"
    source_anchor: "L115-L115"
  -
    id: "copy_fact_grammar_line_116"
    type: "syntax"
    statement: "语法产生式片段（与本段其他行共同组成结构）：[ copy_option [ ...] | ( option [, ...] ) ];"
    status: "confirmed"
    source_anchor: "L116-L116"
  -
    id: "copy_fact_body_120"
    type: "behavior_oracle"
    statement: "● COPY TO语法形式约束如下： (query)与[USING] DELIMITERS不兼容，即若COPY TO的数据来自于一个query的查询 结果，那么COPY TO语法不能再指定[USING] DELIMITERS语法子句。"
    status: "confirmed"
    source_anchor: "L120-L122"
  -
    id: "copy_fact_body_123"
    type: "constraint"
    statement: "● copy_option是指COPY原生的参数形式，而option是兼容外表导入的参数形式。"
    status: "confirmed"
    source_anchor: "L123-L123"
  -
    id: "copy_fact_body_124"
    type: "constraint"
    statement: "● FILLER/SEQUENCE/CONSTANT参数仅在copy_option子句中支持。"
    status: "confirmed"
    source_anchor: "L124-L147"
  -
    id: "copy_fact_body_124_1"
    type: "constraint"
    statement: "如果在option子句 中传入，会被忽略。"
    status: "confirmed"
    source_anchor: "L124-L147"
