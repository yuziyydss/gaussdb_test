schema_version: 1
kind: "manifest"
id: "manifest_copy_csv_stdout"
name: "COPY csv_stdout"
status: "ready"
description: "仅覆盖所选有限值域；静态候选不等于实机验证。"
factor_ref: "copy"
syntax_ref: "syntax_copy"
suite_type: "positive"
strategy: "pairwise"
fixture_refs:
  - "fixture_copy_source"
identifier_policy: {}
bindings:
  format:
    - "copy_format_csv"
  columns:
    - "copy_columns_inherit"
    - "copy_columns_explicit"
    - copy_columns_first
    - copy_columns_second
    - copy_columns_reversed
  delimiter:
    - "copy_delimiter_comma"
    - "copy_delimiter_pipe"
  header:
    - "copy_header_off"
    - "copy_header_on"
  quote_all:
    - "copy_quote_all_off"
    - "copy_quote_all_on"
expected:
  default: "success"
  scope: "syntax_only"
coverage_requirements:
  strength: 2
  require_all_feasible_pairs: true
