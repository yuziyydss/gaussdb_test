schema_version: 1
kind: matrix
id: matrix_select_query_profiles
name: SELECT 完整查询能力剖面
status: needs_review
description: 保存内部一致的完整 SELECT 代表语句、对象依赖、环境条件和目标违规属性。
factor_ref: select
profile_property_defaults:
  hierarchy_lock_compatible: true
  set_lock_compatible: true
  window_frame_bound_valid: true
  prior_placement_valid: true
  pivot_function_supported: true
  distinct_order_compatible: true
profiles:
- id: select_common_a_union_small_int
  render: SELECT lo FROM a_common_source UNION SELECT mid FROM a_common_source
  validity: valid
  fixture_refs:
  - fixture_select_common_type_a_integer
  fact_refs:
  - select_fact_a_integer_common
  properties:
    common_type_contract: a_integer_union_case_v1
    output_types:
    - INTEGER
    output_column_count: 1
    source_tables:
    - a_common_source
    features:
    - finite_a_integer_common_type
