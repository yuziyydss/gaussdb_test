schema_version: 1
kind: fixture
id: fixture_select_hint_source
name: SELECT Hint 官方示例对象
status: ready
description: 为 SELECT 章末 indexscan(t1 it1) 和 rows(t1 t2 #5) 两个 Hint 示例提供同构对象。
factor_ref: select
provides:
  tables:
    - name: t_select_hint1
      persistence: permanent
      table_kind: regular
      columns:
        - {name: c1, type: INTEGER, nullable: true}
        - {name: c2, type: INTEGER, nullable: true}
        - {name: c3, type: INTEGER, nullable: true}
    - name: t_select_hint2
      persistence: permanent
      table_kind: regular
      columns:
        - {name: c1, type: INTEGER, nullable: true}
        - {name: c2, type: INTEGER, nullable: true}
        - {name: c3, type: INTEGER, nullable: true}
seed:
  required: true
  rows: []
execution:
  status: ready
  mode: explicit
  setup_sqls:
    - DROP TABLE IF EXISTS t_select_hint1 CASCADE;
    - DROP TABLE IF EXISTS t_select_hint2 CASCADE;
    - CREATE TABLE t_select_hint1(c1 INTEGER, c2 INTEGER, c3 INTEGER);
    - CREATE TABLE t_select_hint2(c1 INTEGER, c2 INTEGER, c3 INTEGER);
    - CREATE INDEX it_select_hint1 ON t_select_hint1(c1, c2);
    - INSERT INTO t_select_hint1 VALUES (1, 2, 3);
    - INSERT INTO t_select_hint2 VALUES (4, 1, 6);
  teardown_sqls:
    - DROP TABLE IF EXISTS t_select_hint2 CASCADE;
    - DROP TABLE IF EXISTS t_select_hint1 CASCADE;
  note: 对象名与官方 t1/t2/it1 一一对应，但加 select 前缀以避免与其他因子冲突。
