schema_version: 1
kind: fixture
id: fixture_select_hierarchy_source
name: SELECT 层次查询源表
status: ready
description: 为 START WITH/CONNECT BY、PRIOR、NOCYCLE 和同层排序提供树形数据。
factor_ref: select
provides:
  tables:
    - name: t_select_hierarchy
      persistence: permanent
      table_kind: regular
      columns:
        - {name: name, type: VARCHAR(64), nullable: false}
        - {name: id, type: INTEGER, nullable: false}
        - {name: parent_id, type: INTEGER, nullable: true}
seed:
  required: true
  rows:
    - {name: root, id: 1, parent_id: 0}
    - {name: child_a, id: 2, parent_id: 1}
    - {name: child_b, id: 3, parent_id: 1}
execution:
  status: ready
  mode: auto
  note: 自动创建基础树；循环数据变体和 max_recursive_times 由行为 scenario 管理。
