facts:
- id: m_select_fact_mode
  type: environment
  statement: 本包只适用于 PDF 第二章 M-Compatibility 语法。
  status: confirmed
  source_anchor: 2.4.2.16.2 L2-2
- id: m_select_fact_syntax
  type: syntax
  statement: M SELECT 的重复投影、FROM、WHERE、ORDER、LIMIT 主产生式。
  status: confirmed
  source_anchor: 2.4.2.16.2 L19-40
- id: m_select_fact_from_optional
  type: syntax
  statement: M SELECT的FROM子句可省略；本消费者只取单个常量投影，不推导任意子查询基数。
  status: confirmed
  source_anchor: 2.4.2.16.2 L28-28
- id: m_select_fact_distinct
  type: syntax
  statement: DISTINCT 与 DISTINCTROW 去除重复结果行。
  status: confirmed
  source_anchor: 2.4.2.16.2 L186-187
- id: m_select_fact_cache
  type: syntax
  statement: SQL_CACHE/SQL_NO_CACHE 仅语法兼容，无缓存功能。
  status: confirmed
  source_anchor: 2.4.2.16.2 L200-201
- id: m_select_fact_limit
  type: syntax
  statement: LIMIT 支持 count、offset,count 与 count OFFSET offset。
  status: confirmed
  source_anchor: 2.4.2.16.2 L35-35
- id: m_select_fact_from
  type: syntax
  statement: FROM 可使用有限嵌套 SELECT。
  status: confirmed
  source_anchor: 2.4.2.16.2 L116-123
- id: m_select_fact_set
  type: constraint
  statement: 集合查询列数和类型必须兼容。
  status: confirmed
  source_anchor: 2.4.2.16.2 L1080-1081
- id: m_select_fact_lock
  type: constraint
  statement: FOR UPDATE/SHARE 不能和集合、DISTINCT、GROUP/HAVING 一起用。
  status: confirmed
  source_anchor: 2.4.2.16.2 L570-571
- id: m_select_fact_group_mode
  type: environment
  statement: ONLY_FULL_GROUP_BY 改变分组合法条件。
  status: confirmed
  source_anchor: 2.4.2.16.2 L393-407
- id: m_select_fact_subquery_ambiguity
  type: constraint
  statement: 静态域不生成多列子查询；说明与FROM示例范围保留为来源限制，不推广为全局禁止。
  status: confirmed
  source_anchor: 2.4.2.16.2 L954-958
- id: m_select_fact_projection_expression
  type: syntax
  statement: SELECT投影可使用expression并指定AS输出别名。
  status: confirmed
  source_anchor: 2.4.2.16.2 L43-43
- id: m_select_fact_sum_signature
  type: constraint
  statement: 条件M内建SUM：INT/DECIMAL输入返回DECIMAL，FLOAT/DOUBLE返回DOUBLE；不套用一般或用户函数。
  status: confirmed
  source_anchor: 2.5.11 L952-965；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_sum_identity
  type: environment
  statement: 2.5.11所述返回类型合同的作用域是该M章节定义的SUM函数；此文档范围事实不证明运行期解析身份。
  status: confirmed
  source_anchor: 2.5.11 L952-965；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_sum_result
  type: behavior_oracle
  statement: M内建SUM返回非NULL输入值的和；该用例使用明确的整数种子行。
  status: confirmed
  source_anchor: 2.5.11 L952-965；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_max_signature
  type: constraint
  statement: 条件M内建MAX表字段：FLOAT返回DOUBLE，其他字段返回输入类型；当前合同只支持裸INT及FLOAT/DOUBLE字段，不能套到非字段表达式。
  status: confirmed
  source_anchor: 2.5.11 L574-591；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_max_identity
  type: environment
  statement: 返回类型合同仅来自M2.5.11内建MAX；实际函数解析身份须在执行环境独立核实。
  status: confirmed
  source_anchor: 2.5.11 L574-591；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_max_result
  type: behavior_oracle
  statement: M内建MAX取非NULL输入的最大值，全NULL返回NULL；本代表仅使用已有三个明确整数seed行。
  status: confirmed
  source_anchor: 2.5.11 L574-591；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_max_gap
  type: environment
  statement: 静态域仅MAX两个整数字段及FLOAT/DOUBLE代表；其他类型、表达式、窗口、全NULL及空表行为需独立fixture和Oracle。
  status: confirmed
  source_anchor: 2.5.11 L574-591；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_min_signature
  type: constraint
  statement: 条件M内建MIN表字段：FLOAT返回DOUBLE，其他字段返回输入类型；当前合同只支持裸INT及FLOAT/DOUBLE字段，不能套到非字段表达式。
  status: confirmed
  source_anchor: 2.5.11 L635-652；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_min_identity
  type: environment
  statement: 返回类型合同仅来自M2.5.11内建MIN；实际函数解析身份须在执行环境独立核实。
  status: confirmed
  source_anchor: 2.5.11 L635-652；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_min_result
  type: behavior_oracle
  statement: M内建MIN取非NULL输入的最小值，全NULL返回NULL；本代表仅使用已有三个明确整数seed行。
  status: confirmed
  source_anchor: 2.5.11 L635-652；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_min_gap
  type: environment
  statement: 静态域仅MIN两个整数字段及FLOAT/DOUBLE代表；其他类型、表达式、窗口、全NULL及空表行为需独立fixture和Oracle。
  status: confirmed
  source_anchor: 2.5.11 L635-652；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_approximate_source_types
  type: syntax
  statement: M2.6.7.4支持FLOAT/DOUBLE列声明；本fixture只用无typmod的两个拼写，不从REAL或精度形式推导默认行为。
  status: confirmed
  source_anchor: 2.6.7.4 L1160-1229；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_approximate_source_gap
  type: environment
  statement: 近似数值仅作M聚合读源声明；DEFAULT、NOT NULL、精度、别名和一般读写语义需专用类型环境，驱动结果类型待校准。
  status: confirmed
  source_anchor: 2.6.7.4 L1188-1229；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_avg_signature
  type: constraint
  statement: M内建AVG：INT/DECIMAL输入返回DECIMAL，FLOAT/DOUBLE返回DOUBLE；这里只绑定已审裸字段与基础声明类型。
  status: confirmed
  source_anchor: 2.5.11 L72-87；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_avg_identity
  type: environment
  statement: AVG返回类型规则只用于M2.5.11对应内建函数身份；执行前需核对实际解析身份，不能借用一般模式或同名用户函数。
  status: confirmed
  source_anchor: 2.5.11 L72-87；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_avg_result
  type: behavior_oracle
  statement: M内建AVG取非NULL输入平均值；ALL或省略修饰词保留重复非NULL值，DISTINCT取不同值，全NULL返回NULL。
  status: confirmed
  source_anchor: 2.5.11 L72-87；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_avg_gap
  type: environment
  statement: 静态域仅两个INTEGER字段及FLOAT/DOUBLE代表；全NULL、空表、DISTINCT、窗口、精度和驱动元数据需独立运行时验证。
  status: confirmed
  source_anchor: 2.5.11 L72-87；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_count_signature
  type: constraint
  statement: M内建普通COUNT/ALL和DISTINCT返回BIGINT；本有限合同只接普通表的单个INTEGER字段及独立COUNT(*)计行分支，不把任意表达式纳入已检查。
  status: confirmed
  source_anchor: 2.5.11 L338-388；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_count_identity
  type: environment
  statement: COUNT类型与计数规则仅绑定M2.5.11内建函数；实际解析身份执行前另核，不继承其他模式或用户函数。
  status: confirmed
  source_anchor: 2.5.11 L338-388；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_count_result
  type: behavior_oracle
  statement: 普通COUNT和COUNT(ALL expr)计非NULL值，DISTINCT计不同非NULL值；全NULL字段返回0；COUNT(*)另计所有行。
  status: confirmed
  source_anchor: 2.5.11 L338-388；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_count_gap
  type: environment
  statement: 静态域仅六个单字段、COUNT(*)及全NULL对照代表；多参DISTINCT、窗口、空表、非INTEGER输入、溢出和运行期元数据需独立验证。
  status: confirmed
  source_anchor: 2.5.11 L338-388；SELECT expression消费者见2.4.2.16.2 L43
- id: m_select_fact_purpose
  type: example
  statement: SELECT用于从表或视图中取出数据。 SELECT语句就像叠加在数据库表上的过滤器，利用SQL关键字从数据表中过滤出用户 需要的数据。
  status: confirmed
  source_anchor: M-Compatibility L4-7
- id: m_select_fact_constraint
  type: example
  statement: 表的所有者、拥有表SELECT权限的用户或拥有SELECT ANY TABLE权限的用户， 必须对每个在SELECT命令中使用的字段有SELECT权限。
  status: confirmed
  source_anchor: M-Compatibility L9-13
- id: m_select_fact_permission
  type: environment
  statement: 执行m_select所需的权限要求。
  status: confirmed
  source_anchor: M-Compatibility L15-15
- id: m_select_fact_params
  type: example
  statement: ●   plan_hint 以/*+ */的形式在SELECT关键字后，用于对SELECT对应的语句块生成的计划进行 hint调优。每条语句中只有第一个/*+ plan_hint */注释块会作为hint生效，里面可
  status: confirmed
  source_anchor: M-Compatibility L158-167
- id: m_select_fact_example
  type: example
  statement: m_select的文档示例。
  status: confirmed
  source_anchor: M-Compatibility L625-632
