schema_version: 1
kind: syntax
id: syntax_m_select
name: syntax_m_select
status: needs_review
description: M 有限模型；不承诺全章覆盖或实机成功。
factor_ref: m_select
category: DML
ast:
  kind: sequence
  items:
  - kind: slot
    slot: statement_form
  - kind: sequence
    items:
    - kind: ref
      ref: query
    - kind: optional
      selector: set_operator
      enabled_values:
      - m_select_set_operator_union
      - m_select_set_operator_all
      - m_select_set_operator_except
      item:
        kind: sequence
        items:
        - kind: literal
          text: ' '
        - kind: slot
          slot: set_operator
        - kind: literal
          text: ' SELECT '
        - kind: repeat
          slot: right_target_list
          separator: ', '
          items_property: items
        - kind: literal
          text: ' FROM m_b01_source'
    - kind: literal
      text: ' '
    - kind: slot
      slot: order_by_list
    - kind: literal
      text: ' '
    - kind: slot
      slot: limit
    - kind: literal
      text: ' '
    - kind: slot
      slot: lock_clause
  - kind: slot
    slot: group_by_list
subgrammars:
  query:
    kind: sequence
    items:
    - kind: literal
      text: 'SELECT '
    - kind: slot
      slot: select_modifier
    - kind: literal
      text: ' '
    - kind: slot
      slot: cache
    - kind: literal
      text: ' '
    - kind: repeat
      slot: target_list
      separator: ', '
      items_property: items
    - kind: literal
      text: ' FROM '
    - kind: choice
      selector: source_form
      branches:
        m_select_source_form_table:
          kind: literal
          text: m_b01_source
        m_select_source_form_nested:
          kind: sequence
          items:
          - kind: literal
            text: (
          - kind: ref
            ref: inner
          - kind: literal
            text: ) AS m_nested
    - kind: literal
      text: ' '
    - kind: slot
      slot: where_clause
  inner:
    kind: sequence
    items:
    - kind: literal
      text: SELECT id,qty FROM m_b01_source
rendering:
  whitespace: collapse
  statement_terminator: ;
slots:
  statement_form:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.statement_form
  select_modifier:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.select_modifier
  cache:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.cache
  target_list:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.target_list
  source_form:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.source_form
  where_clause:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.where_clause
  group_by_list:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.group_by_list
  order_by_list:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.order_by_list
  limit:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.limit
  set_operator:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.set_operator
  right_target_list:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.right_target_list
  lock_clause:
    type: sql_fragment
    optional: true
    dimension_ref: m_select.lock_clause
source_fact_refs:
- m_select_fact_syntax
- m_select_fact_distinct
- m_select_fact_cache
- m_select_fact_limit
- m_select_fact_from
- m_select_fact_projection_expression
