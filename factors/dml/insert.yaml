# GaussDB 测试因子定义: INSERT
id: insert_values
name: INSERT
category: DML
description: 插入语句, 覆盖数据类型/值格式/NULL处理

template: "INSERT INTO {table_name} (col_1) VALUES ( {value} )"

params:
  column_datatype:
    description: 目标列数据类型
    classes:
      - name: 整数
        values: ["INTEGER", "BIGINT"]
      - name: 小数
        values: ["NUMERIC(10,2)", "REAL"]
      - name: 字符
        values: ["VARCHAR(100)", "TEXT"]
      - name: 时间
        values: ["DATE", "TIMESTAMP"]
    representative: ["INTEGER", "NUMERIC(10,2)", "VARCHAR(100)", "DATE"]

  value_format:
    description: 值格式
    classes:
      - name: 正常值
        values: ["1", "'hello'", "'2024-01-01'"]
      - name: "NULL"
        values: ["NULL"]
      - name: 空字符串
        values: ["''"]
      - name: 超长字符串
        values: ["'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'"]
    representative: ["1", "NULL", "''", "'超长字符串'"]

composites:
  value:
    template: "{value_format}"

constants:
  table_name: "t_factor_test"

default_strategy: pairwise
