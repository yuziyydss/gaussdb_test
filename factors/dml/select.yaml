# GaussDB 测试因子定义: SELECT
# 文档溯源: SQL参考 / DML / SELECT

id: select_basic
name: SELECT
category: DML
doc_ref: "SQL参考/DML/SELECT"
description: 查询语句, 覆盖列选择/条件/排序/分页

template: "SELECT {select_clause} FROM {table_name} {where_clause} {order_clause} {limit_clause}"

params:
  select_clause:
    description: 查询列
    classes:
      - name: 全部列
        values: ["*"]
        expected: success
      - name: 指定列
        values: ["col_1", "col_1, col_2"]
        expected: success
      - name: 聚合
        values: ["COUNT(*)", "SUM(col_1)"]
        expected: success
    representative: ["*", "col_1", "COUNT(*)"]

  where_clause:
    description: WHERE 条件
    classes:
      - name: 无条件
        values: [""]
        expected: success
      - name: 等值
        values: ["WHERE col_1 = 1"]
        expected: success
      - name: 范围
        values: ["WHERE col_1 BETWEEN 1 AND 100"]
        expected: success
      - name: IN
        values: ["WHERE col_1 IN (1, 2, 3)"]
        expected: success
    representative: ["", "WHERE col_1 = 1", "WHERE col_1 BETWEEN 1 AND 100", "WHERE col_1 IN (1, 2, 3)"]

  order_clause:
    description: ORDER BY
    classes:
      - name: 无排序
        values: [""]
        expected: success
      - name: 升序
        values: ["ORDER BY col_1 ASC"]
        expected: success
      - name: 降序
        values: ["ORDER BY col_1 DESC"]
        expected: success
    representative: ["", "ORDER BY col_1 ASC", "ORDER BY col_1 DESC"]

  limit_clause:
    description: LIMIT
    classes:
      - name: 无限制
        values: [""]
        expected: success
      - name: 限量
        values: ["LIMIT 10"]
        expected: success
      - name: 分页
        values: ["LIMIT 10 OFFSET 5"]
        expected: success
    representative: ["", "LIMIT 10", "LIMIT 10 OFFSET 5"]

constants:
  table_name: "t_factor_test"

default_strategy: pairwise
