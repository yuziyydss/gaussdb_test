# GaussDB 测试因子定义: CREATE TABLE
# 角色: 被测因子 (独立) / 前置因子 (被其他因子引用时)
# 文档溯源: SQL参考 / DDL / CREATE TABLE

id: create_table
name: CREATE TABLE
category: DDL
doc_ref: "SQL参考/DDL/CREATE-TABLE"
description: 创建表语句, 覆盖表类型/列数据类型/列约束/表选项

template: "CREATE {table_modifier} TABLE {table_name} ( {column_def} ) {table_option}"

params:
  table_modifier:
    description: 表类型修饰符
    classes:
      - name: 普通表
        values: [""]
        expected: success
      - name: 临时表
        values: ["TEMPORARY", "TEMP"]
        expected: success
      - name: 非日志表
        values: ["UNLOGGED"]
        expected: success
    representative: ["", "TEMPORARY", "UNLOGGED"]

  column_datatype:
    description: 列数据类型
    classes:
      - name: 整数
        values: ["INTEGER", "BIGINT", "SMALLINT"]
        expected: success
      - name: 小数
        values: ["NUMERIC(10,2)", "REAL", "DOUBLE PRECISION"]
        expected: success
      - name: 字符
        values: ["VARCHAR(100)", "TEXT", "CHAR(10)"]
        expected: success
      - name: 时间
        values: ["DATE", "TIMESTAMP"]
        expected: success
      - name: 二进制
        values: ["BYTEA", "BLOB"]
        expected: success
      - name: JSON
        values: ["JSON", "JSONB"]
        expected: success
      - name: 非法类型
        values: ["FAKETYPE"]
        expected: error
        expected_sqlstates: ["42704", "42601"]
    representative: ["INTEGER", "NUMERIC(10,2)", "VARCHAR(100)", "DATE", "BYTEA", "JSON"]

  column_constraint:
    description: 列约束
    classes:
      - name: 无约束
        values: [""]
        expected: success
      - name: 非空
        values: ["NOT NULL"]
        expected: success
      - name: 主键
        values: ["PRIMARY KEY"]
        expected: success
      - name: 唯一
        values: ["UNIQUE"]
        expected: success
      - name: 默认值
        values: ["DEFAULT 0"]
        expected: success
    representative: ["", "NOT NULL", "PRIMARY KEY", "UNIQUE", "DEFAULT 0"]

  table_option:
    description: 表级选项
    classes:
      - name: 无选项
        values: [""]
        expected: success
      - name: 存储参数
        values: ["WITH (autovacuum_enabled=true)"]
        expected: success
      - name: 表空间
        values: ["TABLESPACE pg_default"]
        expected: success
    representative: ["", "WITH (autovacuum_enabled=true)", "TABLESPACE pg_default"]

composites:
  column_def:
    template: "col_1 {column_datatype} {column_constraint}"

constants:
  table_name: "t_factor_test"

# 互斥规则: 跳过无意义的参数组合, 不生成用例
exclusions:
  # 临时表不能指定表空间 (GaussDB/PostgreSQL 限制)
  - when: {table_modifier: "TEMPORARY", table_option: "TABLESPACE pg_default"}
    reason: "临时表不能指定表空间"
  # 临时表不支持 autovacuum 存储参数
  - when: {table_modifier: "TEMPORARY", table_option: "WITH (autovacuum_enabled=true)"}
    reason: "临时表不支持 autovacuum 参数"

default_strategy: pairwise
