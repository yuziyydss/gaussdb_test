# GaussDB 测试因子定义: ALTER TABLE
# 你可以照这个格式自己加新的 SQL 语句因子定义
# 放到 factors/ddl/ 或 factors/dml/ 目录下，保存后点侧边栏刷新按钮

id: alter_table
name: ALTER TABLE
category: DDL
description: 修改表结构, 覆盖添加列/删除列/修改列类型/重命名

template: "ALTER TABLE {table_name} {action}"

params:
  action:
    description: 修改操作
    classes:
      - name: 添加列
        values: ["ADD COLUMN col_new INTEGER", "ADD COLUMN col_new VARCHAR(50) NOT NULL"]
      - name: 删除列
        values: ["DROP COLUMN col_1"]
      - name: 修改类型
        values: ["ALTER COLUMN col_1 TYPE BIGINT", "ALTER COLUMN col_1 TYPE VARCHAR(200)"]
      - name: 重命名列
        values: ["RENAME COLUMN col_1 TO col_renamed"]
      - name: 重命名表
        values: ["RENAME TO t_factor_renamed"]
    representative: ["ADD COLUMN col_new INTEGER", "DROP COLUMN col_1", "ALTER COLUMN col_1 TYPE BIGINT", "RENAME COLUMN col_1 TO col_renamed", "RENAME TO t_factor_renamed"]

constants:
  table_name: "t_factor_test"

default_strategy: equivalence
