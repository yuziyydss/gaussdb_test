# GaussDB 测试因子定义: 创建范围分区表
# 角色: 前置因子 (专做 fixture)
# 文档溯源: SQL参考 / DDL / CREATE TABLE PARTITION

id: create_partitioned_table
name: 创建分区表
category: DDL
doc_ref: "SQL参考/DDL/CREATE-TABLE-PARTITION"
description: 创建范围分区表, 3个分区含默认分区

template: "CREATE TABLE {table_name} ( id INTEGER NOT NULL ) PARTITION BY RANGE (id) ( PARTITION p1 VALUES LESS THAN (100), PARTITION p2 VALUES LESS THAN (200), PARTITION pmax VALUES LESS THAN (MAXVALUE) )"

constants:
  table_name: "t_factor_part"

default_strategy: equivalence
