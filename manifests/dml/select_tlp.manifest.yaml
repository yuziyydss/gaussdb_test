# 组合测试清单: SELECT 查询与 TLP 蜕变测试清单
id: manifest_select_tlp
name: "SELECT 核心查询与三值逻辑蜕变测试清单"
description: "覆盖单列/全列/COUNT 查询与多种 WHERE 谓词条件"

target_syntax: "syntax_select"

bindings:
  select_clause: ["*", "col_1", "count(*)"]
  where_clause: ["", "WHERE col_1 > 0", "WHERE col_1 IS NOT NULL", "WHERE col_1 BETWEEN 1 AND 100"]
  order_clause: ["", "ORDER BY col_1 ASC"]
  limit_clause: ["", "LIMIT 10"]

strategy: "pairwise"
