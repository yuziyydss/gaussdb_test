# CREATE VIEW 基础正向语法清单。
# FORCE、OR REPLACE 的对象生命周期以及 CHECK/READ ONLY 的 DML 行为，
# 均属于后续 scenario/oracle，不在本静态清单中宣称覆盖。
id: manifest_create_view_basic
name: "CREATE VIEW 基础静态组合测试"
description: "基于两整数列源表，覆盖临时修饰符、列别名与尾部可更新性选项。"
doc_ref: "SQL参考/DDL/CREATE-VIEW"
target_syntax: syntax_create_view
fixtures:
  - fixture_view_source_two_ints

bindings:
  temp_modifier: ["", "TEMP", "TEMPORARY"]
  column_list: ["", "(c1, c2)"]
  query:
    - "SELECT col_1, col_2 FROM t_view_source"
    - "SELECT col_1, col_2 FROM t_view_source WHERE col_1 > 0"
  post_query_option:
    - ""
    - "WITH CHECK OPTION"
    - "WITH CASCADED CHECK OPTION"
    - "WITH LOCAL CHECK OPTION"
    - "WITH READ ONLY"

strategy: pairwise
default_expected: success

high_priority_dimensions:
  - [temp_modifier, post_query_option]
  - [column_list, query]
