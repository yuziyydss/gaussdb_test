# GaussDB 语法规范定义：CREATE VIEW 基础语法
id: syntax_create_view
name: "CREATE VIEW 基础主语法"
category: DDL
doc_ref: "SQL参考/DDL/CREATE-VIEW"
description: "覆盖临时视图、列别名、可更新视图检查选项和只读选项的基础语法。"

production: >
  CREATE {temp_modifier} VIEW {view_name} {column_list}
  AS {query} {post_query_option}

slots:
  temp_modifier:
    type: token
    optional: true

  view_name:
    type: identifier
    values: ["v_view_basic"]
    symbol_action: creates_view

  column_list:
    type: identifier_list
    optional: true

  query:
    type: query

  post_query_option:
    type: token
    optional: true
