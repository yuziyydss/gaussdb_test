# GaussDB 语法规范定义: SELECT
id: syntax_select
name: "SELECT 查询主语法"
category: DML
doc_ref: "SQL参考/DML/SELECT"
description: "支持列选择、WHERE 过滤、ORDER BY 与 LIMIT 分页查询"

production: "SELECT {select_clause} FROM {source_table} {where_clause} {order_clause} {limit_clause}"

slots:
  select_clause:
    type: token
    values: ["*", "col_1", "count(*)"]

  source_table:
    type: token
    values: ["t_spec_test"]
    symbol_action: "consumes_table"

  where_clause:
    type: token
    optional: true
    values: ["", "WHERE col_1 > 0", "WHERE col_1 IS NOT NULL", "WHERE col_1 BETWEEN 1 AND 100"]

  order_clause:
    type: token
    optional: true
    values: ["", "ORDER BY col_1 ASC", "ORDER BY col_1 DESC"]

  limit_clause:
    type: token
    optional: true
    values: ["", "LIMIT 10", "LIMIT 10 OFFSET 5"]
